"topology/uniform/basis.html","AffineConstructive.topology.uniform.final":"topology/uniform/final.html","AffineConstructive.topology.uniform.product":"topology/uniform/product.html","AffineConstructive.topology.uniform.cylinder":"topology/uniform/cylinder.html","AffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** * ATop does not have binary products.\n\n    The existence of cartesian products of arbitrary affine topological\n    spaces is refutable in the antithesis model, and the factor can be\n    taken to be a strong set:\n\n      [products_imply_False] : \"every pair of affine topological spaces\n      has a cartesian product satisfying the universal property of\n      [CartesianProductTopology]\" is contradictory.\n\n    This justifies the design of [CartesianProductTopology] as a\n    certificate that *a particular* product exists (e.g. for\n    uniformizable topologies), rather than as a construction.\n\n    ** The space [X]\n\n    Three points [x], [x'], [y].  The equality has [(x = x') = (0,0)],\n    the pair proved by nothing and refuted by nothing, and the other two\n    off-diagonal equalities [𝐅]: [x] and [x'] are neither equal nor\n    apart, and [y] is apart from both.  Such pairs are unavoidable in\n    the antithesis model: \"not both\" is the only compatibility condition\n    closed under the Chu-construction connectives (cf. Shulman §3).  The\n    inequality is cotransitive, so [X] is a strong set ([X_strong]); its\n    equality is not refutative.\n\n    The topology,\n\n      [z ⪽ U  :=  z ∊ U ∧ (z = x ∨ y ∊ U)],\n\n    makes [x] and [y] isolated while every neighborhood of [x'] contains\n    [y].  Built from additive connectives only, it is a set morphism for\n    free, and the topology axioms close by [tautological].  The pair\n    [(0,0)] is what makes it work: at [x'] the disjunction is affirmed\n    only through [y ∊ U], but refuting it would require refuting\n    [x' = x], which is impossible.  So [x' ⪽ U] is refuted only by\n    [x' ∊̸ U], never through [y].  (Defining the neighborhoods by cases,\n    [x' ∊ U ∧ y ∊ U] at [x'] and [x ∊ U] at [x], would not be a morphism:\n    [{x}] would be a neighborhood of [x] and refutably not one of [x'].)\n\n    ** The argument\n\n    Let [τ] be a topology on [X × X] with the universal property of\n    [CartesianProductTopology], and let [M := {(x,x)}].\n\n    1. [τ] affirms [M] at [(x,x)]: the projections are continuous, [x]\n       is isolated, and binary additivity's positive component is a\n       plain conjunction.\n    2. [τ] refutes [M] at [(x',x')]: the comparison map [X ⊗ X ⇾ X × X]\n       is continuous by the universal property, and the tensor topology\n       refutes [M] at [(x',x')] uniformly in the basic box, since\n       [(y,y)] lies in every box around [(x',x')] and is apart from\n       [(x,x)].\n    3. [p ↦ p ⪽ M] is a *morphism* [X × X ⇾ Ω], so strong\n       extensionality turns the affirmation at [(x,x)] and the\n       refutation at [(x',x')] into the additive inequality\n       [(x,x) ≠ (x',x')], which is [⊥ ∨ ⊥].\n\n    ** Scope\n\n    Fixing the carrier of a product to the cartesian product of sets\n    loses no generality, since the forgetful functor ATop → ASet has a\n    left adjoint and so preserves limits.  As [X] is a strong set,\n    products already fail on the subcategory of strong sets; the\n    remaining question is refutative (tight) equalities, where this\n    argument does not apply: tightness would affirm [x = x'], and step 2\n    needs its positive part to be [⊥].  Uniformizable spaces do have\n    products, so the topology on [X] is not uniformizable.\n\n    Nothing below inspects the second component of [(0,0)]: with any\n    pair [(0,Q)] in the slot [(x = x')] the same proofs go through and\n    the final inequality becomes [Q ∨ Q], so the existence of that one\n    product already implies [Q].  For [Q] an instance of WLEM this is\n    the Brouwerian reading (not formalized). *)\n\nRequire Import interfaces.set interfaces.sprop logic.aprop set_lambda.\nRequire Import interfaces.subset interfaces.topology.\nRequire Import theory.set orders.subset topology.product.\nRequire Import rewrite easy simplify.\n\nLocal Open Scope topology_scope.\n\n(** * The three-point set [X] *)\n\nInductive pt : Set := x | x' | y.\n\n(** The pair [(0,0)]: proved by nothing, refuted by nothing. *)\n\nDefinition zero_zero : Ω := Build_AProp (full_tautology : NotBoth False False) I.\n\n(** [x = x'] is the pair [(0,0)]; everything else off the diagonal is\n    refuted outright. *)\n\nDefinition pt_equiv : Equiv pt := λ '(z, w),\n  match z, w with\n  | x, x | x', x' | y, y => 𝐓\n  | x, x' | x', x => zero_zero\n  | _, _ => 𝐅\n  end.\n\nLemma pt_is_set : IsSet pt (e:=pt_equiv).\nProof. split.\n+ now intros [].\n+ now intros [][].\n+ intros [][][]; cbn; tautological.\nQed.\n\nCanonical Structure X : set := @set_make pt pt_equiv pt_is_set.\n\n(** [X] is even a strong set: its inequality is cotransitive. *)\n\nLemma X_strong : StrongSet X.\nProof. intros [][][]; cbn; tautological. Qed.\n\n(** * The topology *)\n\nLocal Instance X_nb : Neighborhood X :=\n  set:(λ '(z, U) : X ⊗ 𝒫 X, z ∊ U ∧ (z = x ∨ y ∊ U)).\n\nLocal Ltac unfold_nb := change (?z ⪽ ?U) with (z ∊ U ∧ (z = x ∨ y ∊ U)).\n\nLocal Instance X_topology : Topology X.\nProof. split.\n+ intros z U; unfold_nb; tautological.\n+ intros z U V; unfold_nb.\n  apply aand_intro; change (U ⊆ V) with (∏ w, w ∊ U ⊸ w ∊ V).\n  - rew (all_lb _ z). tautological.\n  - rew (all_lb _ y). tautological.\n+ intros z. change (𝐓 ∧ (z = x ∨ 𝐓)). tautological.\n+ intros z U V; unfold_nb. change (?z ∊ U ⊓ V) with (z ∊ U ∧ z ∊ V). tautological.\n+ intros z U. change (z ∊ U ∧ (z = x ∨ y ∊ U)\n    ⊸ (z ∊ U ∧ (z = x ∨ y ∊ U)) ∧ (z = x ∨ (y ∊ U ∧ (y = x ∨ y ∊ U)))).\n  tautological.\nQed.\n\n(** Strong extensionality, harvested: an Ω-valued map that affirms at [w]\n    and refutes at [z] forces the inequality [w ≠ z].  Applied to the\n    neighborhood map [p ↦ p ⪽ M], a bona fide morphism, it converts an\n    affirmation/refutation pair into an *additive* disjunction of\n    inequalities. *)\n\nLemma apos_aneg_apart {A:set} (P : A ⇾ Ω) (z w : A) :\n  P w ⊠ (P z)ᗮ ⊸ w ≠ z.\nProof. rew (is_fun P w z). change (P w = P z) with (P w ⧟ P z). tautological. Qed.\n\n(** * The product refutation *)\n\nLocal Open Scope fun_inv_scope.\nImport image_notation.\n\n(** The witness subset: the singleton of [(x,x)].  Pointwise it is the\n    box [p₁*{x} ⊓ p₂*{x}], which is how the continuity of the projections\n    sees it. *)\n\nDefinition M : 𝒫 (X × X) := singleton ((x, x) : X × X).\n\n(** The tensor topology refutes [c* M] at [(x',x')], uniformly in the\n    basic box [(U, V)]: [(y,y)] lies in every box around [(x',x')] and is\n    apart from [(x,x)]; and the mixed pairs [(y,x')], [(x',y)], also\n    apart from [(x,x)], transfer refutations back through the box. *)\n\nLocal Abbreviation β := (tensor_product_neighborhood_basis X_nb X_nb). \n\nLemma req1 : ((x', x') ⪽ (tensor_to_prod X X)* M)ᗮ.\nProof.\n  change (∏ W, (x', x') ∊ β W ⊸ ∐ p, p ∊ β W ⊠ (x, x) ≠ p :> X × X).\n  intros [U V].\n  rew <-(aor_elim (aex_ub _ (y, y)) (aor_elim (aex_ub _ (y, x')) (aex_ub _ (x', y)))).\n  change ((?a, ?b) ∊ β (U, V)) with (a ⪽ U ⊠ b ⪽ V).\n  unfold_nb; cbn; tautological.\nQed.\n\n(** Any product topology on [X × X] affirms [M] at [(x,x)] and refutes\n    it at [(x',x')]; strong extensionality of the neighborhood map then\n    yields [(x,x) ≠ (x',x')], which is [⊥ ∨ ⊥]. *)\n\nTheorem product_UP_False {NXX : Neighborhood (X × X)}\n  (H : CartesianProductTopology (X:=X) (Y:=X) NXX) : False.\nProof.\n  assert (pA : ((x, x) : X × X) ⪽ M).\n  { change M with ((prod_proj1 X X)* (singleton x) ⊓ (prod_proj2 X X)* (singleton x)).\n    rew <-(top_binary_additivity _ _ _).\n    rew [<-(continuity (prod_proj1 X X) _ _)|<-(continuity (prod_proj2 X X) _ _)].\n    change (x ⪽ singleton x ⊠ x ⪽ singleton x).\n    unfold_nb. change (?a ∊ singleton ?b) with (b = a :> X). cbn. tautological. }\n  assert (nB : (tensor_to_prod X X (x', x') ⪽ M)ᗮ).\n  { rew (continuity (tensor_to_prod X X) _ _). exact req1. }\n  destruct (aimpl_impl_pos (apos_aneg_apart (set:(λ p : X × X, p ⪽ M)) ((x', x') : X × X) ((x, x) : X × X)) (conj pA nB)) as [[]|[]].\nQed.\n\nTheorem products_imply_False :\n  (∀ `{@Topology A NA, @Topology B NB}, ∃ NAB, @CartesianProductTopology A B NA NB NAB) → False.\nProof. intros P.\n  destruct (P _ X_nb X_topology _ X_nb X_topology) as [NXX H].\n  exact (product_UP_False H).\nQed.\n","sentences":[{"i":0,"s":0,"e":3645,"kind":"vernac","status":"ok","ms":28,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":3646,"e":3699,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":2,"s":3700,"e":3757,"kind":"vernac","status":"ok","ms":26,"messages":[],"goals":null},{"i":3,"s":3758,"e":3795,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":3797,"e":3829,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":5,"s":3831,"e":3898,"kind":"vernac","status":"ok","ms":11,"messages":["453d3e9838c7e24b","279873cb97f2630f","e670b6b2a6db5d33","fd460db200272c71","69795517f878d2da"],"goals":null},{"i":6,"s":3900,"e":4046,"kind":"vernac","status":"ok","ms":11,"messages":["9baf4818bd2b116f"],"goals":null},{"i":7,"s":4048,"e":4290,"kind":"vernac","status":"ok","ms":11,"messages":["9d59eaf6dd4207bb"],"goals":null},{"i":8,"s":4292,"e":4333,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":{"fg":[{"id":"18","name":null,"hyps":[],"ccl":"778d2320237b5b8f"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":9,"s":4334,"e":4340,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":{"fg":[{"id":"18","name":null,"hyps":[],"ccl":"778d2320237b5b8f"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":10,"s":4341,"e":4347,"kind":"tactic","status":"ok","ms":11,"messages":[],"goals":{"fg":[{"id":"20","name":null,"hyps":[],"ccl":"c8a596bb2d458453"},{"id":"21","name":null,"hyps":[],"ccl":"53788b0425364c0c"},{"id":"22","name":null,"hyps":[],"ccl":"a0de 5749,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":5803,"e":5815,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"},{"s":6635,"e":6638,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6775,"e":6784,"lib":"AffineConstructive.counterexamples.cartesian_product","name":"unfold_nb","kind":"ltac","local":true},{"s":6791,"e":6803,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"},{"s":7256,"e":7259,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":7297,"e":7300,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":7428,"e":7437,"lib":"AffineConstructive.counterexamples.cartesian_product","name":"unfold_nb","kind":"ltac","local":true},{"s":7490,"e":7502,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"},{"s":7562,"e":7565,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file shows that the existence of cartesian products of arbitrary topological spaces is contradictory. The counterexample is a three-point strong set X with points x, x′ and y. The equality x = x′ is the affine proposition [[AffineConstructive.counterexamples.cartesian_product.zero_zero]], which has no proof and no refutation. The topology on X, [[AffineConstructive.counterexamples.cartesian_product.X_topology]], makes x and y isolated and puts y in every neighbourhood of x′. If a topology on X × X had the universal property [[AffineConstructive.topology.interfaces.topology.CartesianProductTopology]], it would affirm that the singleton M of (x, x) is a neighbourhood of (x, x). Through the comparison map from the tensor product, it would also refute that M is a neighbourhood of (x′, x′). Strong extensionality of the neighbourhood map ([[AffineConstructive.counterexamples.cartesian_product.apos_aneg_apart]]) then gives (x, x) ≠ (x′, x′), and that inequality is false. The main results are [[AffineConstructive.counterexamples.cartesian_product.product_UP_False]] and [[AffineConstructive.counterexamples.cartesian_product.products_imply_False]]. Together they explain why the product topology is stated as a certificate that a particular product exists, and not as a construction.","short":"Counterexample: topological spaces do not all have cartesian products","items":[{"name":"AffineConstructive.counterexamples.cartesian_product.pt","base":"pt","kind":"ind","start":5,"body":null,"status":"ok","short":{"text":"The underlying type of the counterexample: three points x, x′, y","status":"ok"},"long":{"text":"The bare carrier of the space X: a type with three constructors x, x′ and y. The equality [[AffineConstructive.counterexamples.cartesian_product.pt_equiv]] and the neighbourhood relation [[AffineConstructive.counterexamples.cartesian_product.X_nb]] give these points their roles. The points x and y end up isolated. The point x′ is neither equal to nor apart from x, and every neighbourhood of x′ contains y.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.counterexamples.cartesian_product.pt_rect","base":"pt_rect","kind":"scheme","short":{"text":"Dependent recursion over the three points into a family of types","status":"ok"}},{"name":"AffineConstructive.counterexamples.cartesian_product.pt_ind","base":"pt_ind","kind":"scheme","short":{"text":"Induction over the three points for a family of propositions","status":"ok"}},{"name":"AffineConstructive.counterexamples.cartesian_product.pt_rec","base":"pt_rec","kind":"scheme","short":{"text":"Recursion over the three points into a family of sets","status":"ok"}},{"name":"AffineConstructive.counterexamples.cartesian_product.pt_sind","base":"pt_sind","kind":"scheme","short":{"text":"Induction over the three points for a family of strict propositions","status":"ok"}},{"name":"AffineConstructive.counterexamples.cartesian_product.x","base":"x","kind":"constr","short":{"text":"The point x, isolated, and neither equal to nor apart from x′","status":"ok"}},{"name":"AffineConstructive.counterexamples.cartesian_product.x'","base":"x'","kind":"constr","short":{"text":"The point x′, every neighbourhood of which contains y","status":"ok"}},{"name":"AffineConstructive.counterexamples.cartesian_product.y","base":"y","kind":"constr","short":{"text":"The point y, isolated and apart from both x and x′","status":"ok"}}]},{"name":"AffineConstructive.counterexamples.cartesian_product.zero_zero","base":"zero_zero","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"The affine proposition with neither a proof nor a refutation","status":"ok"},"long":{"text":"An affine proposition is a pair of a way of proving and a way of refuting that cannot both hold. Here both components are 𝐅, so nothing proves the proposition and nothing refutes it, and the pair is trivially consistent. It is distinct from both 𝐓 and 𝐅.\n\nThis proposition is the value of the equality x = x′ in the set [[AffineConstructive.counterexamples.cartesian_product.X]]. The whole counterexample depends on it. At x′, the disjunction in the neighbourhood relation can be refuted only by refuting x′ = x, and that is impossible. The final step of [[AffineConstructive.counterexamples.cartesian_product.product_UP_False]] also depends on it: there the inequality (x, x) ≠ (x′, x′) reduces to a disjunction of two refutations of x = x′, and neither can hold.","status":"ok"},"proof":[]},{"name":"AffineConstructive.counterexamples.cartesian_product.pt_equiv","base":"pt_equiv","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The equality on the three points: x = x′ is zero_zero, other distinct pairs are 𝐅","status":"ok"},"long":{"text":"The affine equality on [[AffineConstructive.counterexamples.cartesian_product.pt]]. Each point is equal to itself (𝐓). The equalities x = x′ and x′ = x are [[AffineConstructive.counterexamples.cartesian_product.zero_zero]], so the two points are neither equal nor apart. Every equality involving y and another point is 𝐅, so y is apart from x and from x′.\n\nThe resulting set is strong ([[AffineConstructive.counterexamples.cartesian_product.X_strong]]): its inequality is an apartness. Its equality is not refutative, since x = x′ is not refuted although it does not hold.","status":"ok"},"proof":[]},{"name":"AffineConstructive.counterexamples.cartesian_product.pt_is_set","base":"pt_is_set","kind":"prf","start":8,"body":[9,17],"status":"ok","short":{"text":"The equality on the three points is reflexive, symmetric and transitive","status":"ok"},"proof":[{"text":"An equality is a set structure when it is reflexive, symmetric and transitive; the three properties are proved in turn for the equality [[AffineConstructive.counterexamples.cartesian_product.pt_equiv]] on the three points.","status":"ok","from":0,"to":1},{"text":"Reflexivity: case on the point; each of x = x, x′ = x′ and y = y is truth.","status":"ok","from":2,"to":3},{"text":"Symmetry: case on both points. The equality of each pair is the same affine proposition read in either order, so each case is an implication of a proposition by itself.","status":"ok","from":4,"to":5},{"text":"Transitivity: case on all three points, twenty-seven cases. In each the equalities are truth, falsity or [[AffineConstructive.counterexamples.cartesian_product.zero_zero]], and the implication from the two given equalities to the third is a propositional tautology, decided case by case.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.counterexamples.cartesian_product.X","base":"X","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"The three-point set with x = x′ neither proved nor refuted","status":"ok"},"long":{"text":"The set formed by bundling [[AffineConstructive.counterexamples.cartesian_product.pt]] with the equality [[AffineConstructive.counterexamples.cartesian_product.pt_equiv]]. It carries the topology [[AffineConstructive.counterexamples.cartesian_product.X_topology]] and serves as both factors of the product that [[AffineConstructive.counterexamples.cartesian_product.product_UP_False]] shows cannot exist. It is declared canonical, so the points of [[AffineConstructive.counterexamples.cartesian_product.pt]] are recognised as elements of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.counterexamples.cartesian_product.X_strong","base":"X_strong","kind":"prf","start":19,"body":[20,22],"status":"ok","short":{"text":"X is a strong set: its inequality is cotransitive","status":"ok"},"proof":[{"text":"Cotransitivity of the inequality is checked on every triple of points: twenty-seven cases, each an implication among truth, falsity and [[AffineConstructive.counterexamples.cartesian_product.zero_zero]] and their negations that holds as a propositional tautology.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.counterexamples.cartesian_product.X_nb","base":"X_nb","kind":"inst","start":23,"body":null,"status":"ok","short":{"text":"The neighbourhood relation on X: z ⪽ U when z ∊ U ∧ (z = x ∨ y ∊ U)","status":"ok"},"long":{"text":"U is a neighbourhood of z when z ∊ U and, in addition, either z = x or y ∊ U. Both connectives are additive. A relation built from equalities and memberships with additive connectives only respects equality without further proof, so it is a function from X ⊗ 𝒫 X to Ω.\n\nUnder this relation x and y are isolated: {x} is a neighbourhood of x, and {y} is a neighbourhood of y. A set is a neighbourhood of x′ only if it contains y. The disjunction can be affirmed at x′ only through y ∊ U, and refuting it would require refuting x′ = x, which is [[AffineConstructive.counterexamples.cartesian_product.zero_zero]] and cannot be refuted. So the claim that U is a neighbourhood of x′ is refuted only by refuting x′ ∊ U, never through y.\n\nA relation defined by cases, with x′ ∊ U ∧ y ∊ U at x′ and x ∊ U at x, would not respect equality. Under it {x} would be a neighbourhood of x, and refutably not a neighbourhood of x′, although x and x′ are not apart.","status":"ok"},"proof":[]},{"name":"AffineConstructive.counterexamples.cartesian_product.unfold_nb","base":"unfold_nb","kind":"ltac","start":24,"body":null,"status":"ok","short":{"text":"Unfolds every z ⪽ U in the goal to z ∊ U ∧ (z = x ∨ y ∊ U)","status":"ok"},"long":{"text":"Every occurrence of the neighbourhood relation of [[AffineConstructive.counterexamples.cartesian_product.X_nb]] in the goal is replaced by its definition: U is a neighbourhood of z becomes z ∊ U ∧ (z = x ∨ y ∊ U). The replacement is a conversion, so the goal is unchanged up to definitions.\n\nProofs in this file use it before calling the tautology checker. The checker cannot see through the neighbourhood relation, but it can decide the unfolded goal once the memberships and equalities are atoms. It is used throughout [[AffineConstructive.counterexamples.cartesian_product.X_topology]], [[AffineConstructive.counterexamples.cartesian_product.req1]] and [[AffineConstructive.counterexamples.cartesian_product.product_UP_False]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.counterexamples.cartesian_product.X_topology","base":"X_topology","kind":"inst","start":25,"body":[26,51],"status":"ok","short":{"text":"The neighbourhood relation on X satisfies the topology axioms","status":"ok"},"proof":[{"text":"The topology axioms are five: a neighbourhood contains its point, neighbourhoods are upward closed, the whole set is a neighbourhood, neighbourhoods are closed under binary meets, and a neighbourhood of z is a neighbourhood of every point of a neighbourhood of z, in the form that the set of points of which U is a neighbourhood is itself a neighbourhood of z.","status":"ok","from":0,"to":1},{"text":"A point is in each of its neighbourhoods: z ⪽ U is z ∊ U together with a further condition, and the first conjunct can be chosen.","status":"ok","from":2,"to":3},{"text":"Upward closure. Fix z, U and V and unfold the neighbourhood relation. The conclusion is an additive conjunction, so each conjunct is proved separately from the whole hypothesis; the inclusion U ⊆ V is read as a family of implications w ∊ U ⊸ w ∊ V.","status":"ok","from":4,"to":6},{"text":"For z ∊ V, specialise the inclusion at z and apply it to z ∊ U, chosen from the first conjunct of z ⪽ U.","status":"ok","from":7,"to":9},{"text":"For z = x ∨ y ∊ V, specialise the inclusion at y instead: from the second conjunct of z ⪽ U, the case z = x is kept, and in the case y ∊ U the inclusion gives y ∊ V.","status":"ok","from":10,"to":12},{"text":"The whole set is a neighbourhood of every point: membership in it is truth, so the condition reduces to 𝐓 ∧ (z = x ∨ 𝐓), which holds.","status":"ok","from":13,"to":16},{"text":"Binary meets. Fix z, U and V; membership in U ⊓ V is the additive conjunction of the two memberships. From z ⪽ U and z ⪽ V, each available once, the conclusion follows by a propositional argument: each of its conjuncts takes the corresponding component from each factor.","status":"ok","from":17,"to":20},{"text":"The last axiom. Fix z and U. Membership of z in the set of points of which U is a neighbourhood is z ⪽ U again, and membership of y is y ⪽ U, that is y ∊ U ∧ (y = x ∨ y ∊ U). Unfolded this way, the goal follows from z ⪽ U by a propositional argument: in the case y ∊ U the same membership supplies both conjuncts for y.","status":"ok","from":21,"to":25}]},{"name":"AffineConstructive.counterexamples.cartesian_product.apos_aneg_apart","base":"apos_aneg_apart","kind":"prf","start":52,"body":[53,57],"status":"ok","short":{"text":"If a map to Ω holds at w and is refuted at z, then w ≠ z","status":"ok"},"proof":[{"text":"P is a function, so w = z implies P w = P z, and by contraposition P w ≠ P z implies w ≠ z ([[AffineConstructive.interfaces.set.is_fun]]). It remains to show P w ≠ P z.","status":"ok","from":0,"to":1},{"text":"Equality in Ω is the affine biconditional, so P w ≠ P z is the negation of P w ⧟ P z. A proof of P w together with a refutation of P z refutes the biconditional, and this is a propositional tautology.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.counterexamples.cartesian_product.M","base":"M","kind":"def","start":60,"body":null,"status":"ok","short":{"text":"The singleton of (x, x) in X × X","status":"ok"},"long":{"text":"The subset {(x, x)} of the cartesian product X × X. The argument of [[AffineConstructive.counterexamples.cartesian_product.product_UP_False]] examines this subset. Pointwise, M is the meet of the preimages of {x} under the two projections. Under any product topology, continuity of the projections and binary additivity therefore make M a neighbourhood of (x, x). Through the tensor topology, its preimage under the comparison map is refutably a neighbourhood of (x′, x′) ([[AffineConstructive.counterexamples.cartesian_product.req1]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.counterexamples.cartesian_product.β","base":"β","kind":"abbrev","start":61,"body":null,"status":"ok","short":{"text":"The basic boxes of the tensor product topology on X ⊗ X","status":"ok"},"long":{"text":"A local abbreviation for the neighbourhood basis of the tensor product topology on X ⊗ X, where both factors carry [[AffineConstructive.counterexamples.cartesian_product.X_nb]]. A pair (U, V) indexes a box. A point (a, b) belongs to the box (U, V) exactly when a ⪽ U ⊠ b ⪽ V, and the proof of [[AffineConstructive.counterexamples.cartesian_product.req1]] uses this description.","status":"ok"},"proof":[]},{"name":"AffineConstructive.counterexamples.cartesian_product.req1","base":"req1","kind":"prf","start":62,"body":[63,69],"status":"ok","short":{"text":"Under the tensor topology, M's preimage is refutably a neighbourhood of (x′, x′)","status":"ok"},"proof":[{"text":"In the tensor product topology, refuting that the preimage of M is a neighbourhood of (x′, x′) means showing that every basic set β W containing (x′, x′) contains a point p apart from (x, x). Fix the basic set as the product of two subsets U and V.","status":"ok","from":0,"to":2},{"text":"Three candidate witnesses suffice: (y, y), (y, x′) and (x′, y). The goal is weakened to the additive disjunction of the three corresponding instances, any one of which gives the existential ([[AffineConstructive.logic.aprop.aex_ub]], [[AffineConstructive.logic.aprop.aor_elim]]).","status":"ok","from":3,"to":3},{"text":"Membership of a pair in β (U, V) is the tensor of the two neighbourhood statements. Unfolded, x′ ⪽ U gives x′ ∊ U and either x′ = x or y ∊ U, and likewise for V. Since x = x′ has no proof, the case y ∊ U and y ∊ V yields the witness (y, y), and the mixed cases yield (y, x′) or (x′, y); in each the pair is apart from (x, x) because x ≠ y is truth. The case analysis is a propositional tautology.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.counterexamples.cartesian_product.product_UP_False","base":"product_UP_False","kind":"prf","start":70,"body":[71,89],"status":"ok","short":{"text":"No topology on X × X has the universal property of the cartesian product","status":"ok"},"proof":[{"text":"The contradiction comes from two facts about the subset M, the singleton of (x, x). The first is that the product topology affirms that M is a neighbourhood of (x, x).","status":"ok","from":0,"to":1},{"text":"Write M as the meet of the preimages of {x} under the two projections. A neighbourhood of a meet is the same as a neighbourhood of each part, so the goal becomes a tensor of two neighbourhood statements. The projections are continuous, so each statement comes down to the projected point x having {x} as a neighbourhood in X.","status":"ok","from":2,"to":5},{"text":"Expand the neighbourhood relation of X. The statement x ⪽ {x} asks for x ∊ {x} together with x = x ∨ y ∊ {x}. Membership in a singleton is an equality, and in X these equalities compute: x = x is truth and x = y is falsity. Both factors then hold outright, which settles the first fact.","status":"ok","from":6,"to":11},{"text":"The second fact is that M is refuted as a neighbourhood of the image of (x′, x′) under the comparison map from X ⊗ X. The comparison map is continuous ([[AffineConstructive.topology.topology.product.tensor_to_prod_cont]]), so refuting the neighbourhood statement for the image follows from refuting it for the preimage of M at (x′, x′) in the tensor product topology. That refutation is [[AffineConstructive.counterexamples.cartesian_product.req1]].","status":"ok","from":12,"to":16},{"text":"The map p ↦ p ⪽ M holds at (x, x) and is refuted at (x′, x′), so [[AffineConstructive.counterexamples.cartesian_product.apos_aneg_apart]] gives (x, x) ≠ (x′, x′). Equality in X × X is additive, so this inequality is a disjunction of two inequalities x ≠ x′. Each disjunct is the refutation of x = x′, and that refutation has no proofs, so both cases are empty and the proof is complete.","status":"ok","from":17,"to":18}]},{"name":"AffineConstructive.counterexamples.cartesian_product.products_imply_False","base":"products_imply_False","kind":"prf","start":90,"body":[91,95],"status":"ok","short":{"text":"That every two topological spaces have a cartesian product is contradictory","status":"ok"},"proof":[{"text":"Assume that every two topological spaces have a cartesian product topology.","status":"ok","from":0,"to":1},{"text":"Apply the assumption to X with its topology [[AffineConstructive.counterexamples.cartesian_product.X_topology]], twice, obtaining a neighbourhood relation on X × X with the universal property of the cartesian product.","status":"ok","from":2,"to":2},{"text":"That is contradictory by [[AffineConstructive.counterexamples.cartesian_product.product_UP_False]].","status":"ok","from":3,"to":4}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.subset":{"page":"../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.topology":{"page":"../topology/interfaces/topology.html","short":"Neighbourhood topologies: axioms, interior and closure, separation, continuous, reflecting and dense maps, products","summary":"The interface for topological spaces, given by a neighbourhood relation. A [[Neighborhood]] on a set X is a function x ⪽ U from X ⊗ 𝒫 X to affine propositions, and [[Topology]] states the neighbourhood axioms for it: a neighbourhood contains its point, the relation is upward closed, the full subset is a neighbourhood, binary meets of neighbourhoods are neighbourhoods, and a neighbourhood U is a neighbourhood of the set of points of which U is a neighbourhood. From the relation the file defines [[interior]], [[closure]], open, closed and dense subsets, neighbourhood bases, and the separation axioms [[Separation_T₀]] and [[Hausdorff]]. It sets out the classes of maps used throughout the topology files: [[Continuous]], the reflecting class [[ContinuouslyReflecting]], the two together as [[ContinuouslyInitial]], [[ContinuouslyEmbedding]] and [[Dense]]. It also gives the discrete and indiscrete structures and the two product topologies, the tensor product by a neighbourhood basis and the cartesian product by its universal property. The topological lemmas live in the files under topology/topology, and the uniform and bornological interfaces build on these classes."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.subset":{"page":"../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.topology.topology.product":{"page":"../topology/topology/product.html","short":"The tensor product topology, its structure maps, and the cartesian comparison","summary":"This file builds the tensor product topology on X ⊗ Y. Its basic sets are the pairings of interiors, and its neighbourhood relation is generated by them ([[tensor_product_neighborhood]]). It proves that this relation satisfies the topology axioms ([[tensor_product_topology]]), and that tensoring neighbourhood bases of the factors gives a basis of the product ([[tensor_product_neighborhood_basis_alt_correct]]). The structure maps of the tensor are then shown well behaved. The unitors, the symmetry and the associators are embeddings, the projections are continuous, and the tensor of two maps keeps continuity, reflection, initiality, embedding and density. Where a cartesian product topology is given by its universal property, the comparison X ⊗ Y ⇾ X × Y is continuous and dense; pairing, the diagonal and the product of maps are continuous; and a cartesian product of Hausdorff spaces is Hausdorff. The file ends with laws for relations: interior and closure commute with the converse, a closure inequality for composites thickened by a neighbourhood of the diagonal ([[closure_compose_thicken]]), and its interior counterpart ([[int_compose_both]])."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

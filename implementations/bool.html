ition andb : bool ∗ bool → bool := λ '(p, q), if p then q else false.\nDefinition orb : bool ∗ bool → bool := λ '(p, q), if p then true else q.\nDefinition notb (p : bool) := if p then false else true.\nDefinition xorb : bool ∗ bool → bool := λ '(p, q), if p then notb q else q.\n\nCanonical Structure andb_fun : 𝟐 ⊗ 𝟐 ⇾ 𝟐 := default_eq_func (X:=𝟐 ⊗ 𝟐) andb.\nCanonical Structure orb_fun  : 𝟐 ⊗ 𝟐 ⇾ 𝟐 := default_eq_func (X:=𝟐 ⊗ 𝟐) orb.\nCanonical Structure notb_fun : 𝟐 ⇾ 𝟐 := default_eq_func notb.\nCanonical Structure xorb_fun  : 𝟐 ⊗ 𝟐 ⇾ 𝟐 := default_eq_func (X:=𝟐 ⊗ 𝟐) xorb.\n\nNotation \"x && y\" := (andb (pair x y)) : bool_scope.\nNotation \"x || y\" := (orb  (pair x y)) : bool_scope.\n\nDefinition bool_eq_dec : Dec (A:=bool∗bool) (=) := λ '(p, q), if p then q else (if q then false else true).\nGlobal Hint Extern 2 (Dec (A:=bool∗_) (=)) => refine bool_eq_dec : typeclass_instances.\nGlobal Hint Extern 2 (Dec (A:=set_T bool_set ∗ _) (=)) => refine bool_eq_dec : typeclass_instances.\n\nDefinition bool_eq_code (p q : bool) : Ω := if dec (=) (p, q) then 𝐓 else 𝐅.\nLemma bool_eq_encode (p q : bool) : p = q → bool_eq_code p q.\nProof. intros []. clear q. destruct p as [|]; now change 𝐓. Defined.\n\nDefinition true_ne_false : true ≠ false := bool_eq_encode _ _.\nDefinition false_ne_true : false ≠ true := bool_eq_encode _ _.\n\nLemma bool_eq_is_dec : IsDecEq 𝟐.\nProof. hnf; unfold dec; intros [[|] [|]]; cbn [ bool_eq_dec ]; [ refl | refine (bool_eq_encode _ _).. | refl ]. Qed.\nGlobal Hint Extern 2 (IsDecEq bool_set) => refine bool_eq_is_dec : typeclass_instances.\n\nGlobal Hint Extern 2 (DecidableEquality bool_set) => refine bool_eq_is_dec : typeclass_instances.\nGlobal Hint Extern 2 (RefutativeEquality bool_set) => refine bool_eq_is_dec : typeclass_instances.\nGlobal Hint Extern 2 (StrongSet bool_set) => refine bool_eq_is_dec : typeclass_instances.\n\nLemma bool_ind (P:𝟐 ⇾ Ω) : P false ∧ P true ⊸ all P.\nProof. apply all_adj; intros [|]; now simplify. Qed.\n\nLemma bool_ind_alt (P:𝟐 → Ω) : P false → P true → all P.\nProof. intros. apply (bool_ind (default_eq_func P)); now split. Qed.\n\nDefinition bool_to_aprop : bool → AProp := λ p, if p then 𝐓 else 𝐅.\nCanonical Structure bool_to_Ω : 𝟐 ⇾ Ω := default_eq_func bool_to_aprop.\n\nLemma bool_to_aprop_decidable : ∀ b, Decidable (bool_to_aprop b).\nProof. intros [|]; [ left | right ]; exact sprop.I. Qed.\nGlobal Hint Extern 2 (Decidable (bool_to_aprop _)) => simple notypeclasses refine (bool_to_aprop_decidable _) : typeclass_instances.\nGlobal Hint Extern 2 (Affirmative (bool_to_aprop _)) => simple notypeclasses refine (bool_to_aprop_decidable _) : typeclass_instances.\nGlobal Hint Extern 2 (Refutative (bool_to_aprop _)) => simple notypeclasses refine (bool_to_aprop_decidable _) : typeclass_instances.\n\nLemma bool_to_aprop_injective : Injective bool_to_Ω.\nProof. intros [|] [|]; full_tautological. Qed.\nGlobal Hint Extern 2 (Injective bool_to_Ω) => simple notypeclasses refine bool_to_aprop_injective : typeclass_instances.\n\nGlobal Hint Extern 2 (SimplifiesTo (bool_to_aprop false) ?out) => change (SimplifiesTo afalse out) : typeclass_instances.\nGlobal Hint Extern 2 (SimplifiesTo (bool_to_aprop true ) ?out) => change (SimplifiesTo atrue  out) : typeclass_instances.\n\n\nDefinition bool_le : Le bool := λ '(p, q), bool_to_aprop (notb p || q).\nGlobal Hint Extern 2 (Le bool) => refine bool_le : typeclass_instances.\nGlobal Hint Extern 2 (Le (set_T bool_set)) => refine bool_le : typeclass_instances.\n\nDefinition bool_le_dec : Dec (A:=bool∗bool) (≤) := λ '(p, q), (notb p || q)%bool.\nGlobal Hint Extern 2 (Dec (A:=bool∗_) le) => refine bool_le_dec : typeclass_instances.\nGlobal Hint Extern 2 (Dec (A:=set_T bool_set ∗ _) le) => refine bool_le_dec : typeclass_instances.\nLemma bool_le_is_dec : IsDecLe bool.  Proof. intros [[|][|]]; exact sprop.I. Qed.\nGlobal Hint Extern 2 (IsDecLe bool) => refine bool_le_is_dec : typeclass_instances.\nGlobal Hint Extern 2 (DecidableLe bool) => refine bool_le_is_ gical","kind":"ltac","local":false,"page":"../interfaces/aprop.html"},{"s":5820,"e":5823,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":7010,"e":7013,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":7527,"e":7539,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"},{"s":8564,"e":8567,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":8838,"e":8841,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":9135,"e":9152,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../interfaces/aprop.html"},{"s":9209,"e":9226,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../interfaces/aprop.html"}],"gloss":{"summary":"This file defines the set 𝟐 of booleans, whose equality is strict equality affirmed, and the boolean operations and, or, not and exclusive or, each as a map and as a function of sets. A decision function for equality, shown correct, makes the equality of 𝟐 decidable, refutative and an apartness, and [[AffineConstructive.implementations.bool.true_ne_false]] separates the two booleans. Two induction principles reduce a statement about every boolean to its two cases. The order p ≤ q, the truth of notb p || q, is a decidable total order with a computable trichotomy. With false as bottom, true as top, and as meet and or as join, it is a bounded distributive lattice. The inclusion [[AffineConstructive.implementations.bool.bool_to_Ω]], sending true to 𝐓 and false to 𝐅, is injective, a lattice morphism and an order embedding, so 𝟐 is the two-element sublattice of Ω, made of decidable propositions.","short":"The booleans as a decidable totally ordered distributive lattice, embedded in Ω","items":[{"name":"AffineConstructive.implementations.bool.bool_set","base":"bool_set","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"The set 𝟐 of booleans, with strict equality affirmed as its equality","status":"ok"},"long":{"text":"The booleans as an affine set, written 𝟐. Its equality is the default one: p = q is the affirmation of the strict equality p ≡ q (see [[AffineConstructive.theory.default_equality.default_set_make]]), so it is an affirmative proposition and, as the file goes on to show, a decidable one.\n\nBecause the equality is the default one, every map out of 𝟐, or out of a product of copies of 𝟐 with default equality, is a function of sets with nothing to check. The file uses this throughout to turn the boolean operations and the inclusion into Ω into morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.andb","base":"andb","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"Boolean conjunction on pairs: true only when both components are true","status":"ok"},"long":{"text":"The boolean and, as a map on pairs of booleans: (p, q) goes to q when p is true and to false otherwise. It is written p && q. The morphism of sets it underlies is [[AffineConstructive.implementations.bool.andb_fun]], which is the meet of the lattice order on 𝟐.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.orb","base":"orb","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"Boolean disjunction on pairs: false only when both components are false","status":"ok"},"long":{"text":"The boolean or, as a map on pairs of booleans: (p, q) goes to true when p is true and to q otherwise. It is written p || q. The morphism of sets it underlies is [[AffineConstructive.implementations.bool.orb_fun]], which is the join of the lattice order on 𝟐. It also defines the order: p ≤ q is the truth of notb p || q (see [[AffineConstructive.implementations.bool.bool_le]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.notb","base":"notb","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"Boolean negation, exchanging true and false","status":"ok"},"long":{"text":"Boolean negation: true goes to false and false to true. It is used in the definition of the order on 𝟐, where p ≤ q means that notb p || q is true, and in [[AffineConstructive.implementations.bool.xorb]]. As a function of sets it is [[AffineConstructive.implementations.bool.notb_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.xorb","base":"xorb","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"Boolean exclusive or on pairs: true exactly when the components differ","status":"ok"},"long":{"text":"The boolean exclusive or, as a map on pairs of booleans: (p, q) goes to notb q when p is true and to q otherwise, so the value is true exactly when p and q differ. As a function of sets it is [[AffineConstructive.implementations.bool.xorb_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.andb_fun","base":"andb_fun","kind":"def","start":16,"body":null,"status":"ok","short":{"text":"Boolean conjunction as a function 𝟐 ⊗ 𝟐 ⇾ 𝟐","status":"ok"},"long":{"text":"The map [[AffineConstructive.implementations.bool.andb]] as a function of sets out of the tensor product 𝟐 ⊗ 𝟐. Since the equality of 𝟐 is strict equality affirmed, the map preserves equality with nothing to prove, and [[AffineConstructive.theory.default_equality.default_eq_func]] packages it. The domain is the tensor product because that is the shape a meet takes in the development; this function is the meet of 𝟐, and [[AffineConstructive.implementations.bool.bool_lattice]] shows it is the greatest lower bound for the order [[AffineConstructive.implementations.bool.bool_le]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.orb_fun","base":"orb_fun","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"Boolean disjunction as a function 𝟐 ⊗ 𝟐 ⇾ 𝟐","status":"ok"},"long":{"text":"The map [[AffineConstructive.implementations.bool.orb]] as a function of sets out of the tensor product 𝟐 ⊗ 𝟐, packaged by [[AffineConstructive.theory.default_equality.default_eq_func]] since the equality of 𝟐 is strict equality affirmed. It is the join of 𝟐, and [[AffineConstructive.implementations.bool.bool_lattice]] shows it is the least upper bound for the order [[AffineConstructive.implementations.bool.bool_le]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.notb_fun","base":"notb_fun","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"Boolean negation as a function 𝟐 ⇾ 𝟐","status":"ok"},"long":{"text":"The map [[AffineConstructive.implementations.bool.notb]] as a function of sets 𝟐 ⇾ 𝟐, packaged by [[AffineConstructive.theory.default_equality.default_eq_func]]: any map out of a set whose equality is strict equality preserves equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.xorb_fun","base":"xorb_fun","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"Boolean exclusive or as a function 𝟐 ⊗ 𝟐 ⇾ 𝟐","status":"ok"},"long":{"text":"The map [[AffineConstructive.implementations.bool.xorb]] as a function of sets out of the tensor product 𝟐 ⊗ 𝟐, packaged by [[AffineConstructive.theory.default_equality.default_eq_func]] in the same way as [[AffineConstructive.implementations.bool.andb_fun]] and [[AffineConstructive.implementations.bool.orb_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_eq_dec","base":"bool_eq_dec","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"The boolean decision function for equality of booleans: true exactly on equal pairs","status":"ok"},"long":{"text":"The decision function for the equality of 𝟐: a pair (p, q) goes to q when p is true and to the negation of q when p is false, that is, to true exactly when p and q are equal. [[AffineConstructive.implementations.bool.bool_eq_is_dec]] proves it correct, which is what makes the equality of 𝟐 decidable, refutative and an apartness.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_eq_code","base":"bool_eq_code","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The affine proposition 𝐓 or 𝐅 according as the decision function finds p and q equal","status":"ok"},"long":{"text":"For booleans p and q, the affine proposition 𝐓 when [[AffineConstructive.implementations.bool.bool_eq_dec]] says that p and q are equal and 𝐅 otherwise. It is a code for equality in the encode–decode sense: [[AffineConstructive.implementations.bool.bool_eq_encode]] shows that strict equality of p and q yields the code, and since the code of two distinct booleans is 𝐅, this is how the file refutes true = false.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_eq_encode","base":"bool_eq_encode","kind":"prf","start":26,"body":[27,31],"status":"ok","short":{"text":"Strict equality of two booleans yields their equality code","status":"ok"},"proof":[{"text":"Rewriting along the strict equality p = q, it remains to show that the code of p against itself holds, for an arbitrary boolean p.","status":"ok","from":0,"to":2},{"text":"By cases on p: the code of true against true and that of false against false both compute to truth 𝐓, which holds.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.implementations.bool.true_ne_false","base":"true_ne_false","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"The booleans true and false are unequal: true ≠ false","status":"ok"},"long":{"text":"The inequality true ≠ false in 𝟐. The equality true = false is the affirmation of the strict equality true ≡ false, so to refute it is to show that the strict equality fails. [[AffineConstructive.implementations.bool.bool_eq_encode]] sends such a strict equality to the code of (true, false), which is 𝐅, and that is the refutation. [[AffineConstructive.implementations.bool.bool_poset]] uses it, together with [[AffineConstructive.implementations.bool.false_ne_true]], to settle the comparisons of distinct booleans.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.false_ne_true","base":"false_ne_true","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"The booleans false and true are unequal: false ≠ true","status":"ok"},"long":{"text":"The inequality false ≠ true in 𝟐, obtained exactly as [[AffineConstructive.implementations.bool.true_ne_false]]: strict equality false ≡ true would give, by [[AffineConstructive.implementations.bool.bool_eq_encode]], the code of (false, true), which is 𝐅.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_eq_is_dec","base":"bool_eq_is_dec","kind":"prf","start":34,"body":[35,37],"status":"ok","short":{"text":"The decision function for equality of booleans is correct, so 𝟐 has decidable equality","status":"ok"},"proof":[{"text":"Correctness of the decision function is checked on each of the four pairs of booleans, where [[AffineConstructive.implementations.bool.bool_eq_dec]] computes. On the two equal pairs it answers true and equality holds by reflexivity. On the two unequal pairs it answers false, and the claim is that strict equality of the two booleans is impossible. [[AffineConstructive.implementations.bool.bool_eq_encode]] gives this, since the equality code of distinct booleans is falsity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_ind","base":"bool_ind","kind":"prf","start":42,"body":[43,45],"status":"ok","short":{"text":"For a predicate on 𝟐, P false ∧ P true implies P y for all y","status":"ok"},"proof":[{"text":"To prove the universal statement, fix y and prove P y from the hypothesis. By cases on y: for y = false the left conjunct of P false ∧ P true is chosen, and for y = true the right one. Since the conjunction is additive, the proof is free to use one or the other.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_ind_alt","base":"bool_ind_alt","kind":"prf","start":46,"body":[47,50],"status":"ok","short":{"text":"For any map P from 𝟐 to Ω, proofs of P false and P true give P y for all y","status":"ok"},"proof":[{"text":"Assume proofs of P false and of P true.","status":"ok","from":0,"to":1},{"text":"A map from the type 𝟐 into Ω preserves equality, because the equality of 𝟐 is strict equality. So P is a predicate on the set 𝟐, and [[AffineConstructive.implementations.bool.bool_ind]] applies. Its hypothesis P false ∧ P true is proved conjunct by conjunct from the two assumptions.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.implementations.bool.bool_to_aprop","base":"bool_to_aprop","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"The affine proposition named by a boolean: 𝐓 for true, 𝐅 for false","status":"ok"},"long":{"text":"The map sending true to truth 𝐓 and false to falsity 𝐅. The propositions in its image are decidable ([[AffineConstructive.implementations.bool.bool_to_aprop_decidable]]), and it is the way a boolean computation is read as an affine statement: the order [[AffineConstructive.implementations.bool.bool_le]] is defined through it.\n\nAs a function of sets it is [[AffineConstructive.implementations.bool.bool_to_Ω]], which the file shows to be injective, a lattice morphism and an order embedding, so 𝟐 sits inside Ω as the sublattice {𝐅, 𝐓}.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_to_Ω","base":"bool_to_Ω","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"The inclusion 𝟐 ⇾ Ω sending true to 𝐓 and false to 𝐅","status":"ok"},"long":{"text":"The map [[AffineConstructive.implementations.bool.bool_to_aprop]] as a function of sets from 𝟐 into the set of affine propositions Ω, packaged by [[AffineConstructive.theory.default_equality.default_eq_func]] since the equality of 𝟐 is strict equality. The file proves it injective ([[AffineConstructive.implementations.bool.bool_to_aprop_injective]]), a lattice morphism carrying and and or to the meet and join of Ω ([[AffineConstructive.implementations.bool.bool_to_aprop_lattice_mor]]), and an order embedding ([[AffineConstructive.implementations.bool.bool_to_aprop_order_embedding]]): 𝟐 is the two-element sublattice of Ω.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_to_aprop_decidable","base":"bool_to_aprop_decidable","kind":"prf","start":53,"body":[54,56],"status":"ok","short":{"text":"The affine proposition named by a boolean is decidable","status":"ok"},"proof":[{"text":"By cases on b. True names 𝐓, which is decided by being proved, and false names 𝐅, which is decided by being refuted. Both proofs are trivial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_to_aprop_injective","base":"bool_to_aprop_injective","kind":"prf","start":60,"body":[61,63],"status":"ok","short":{"text":"The inclusion of 𝟐 into Ω is injective","status":"ok"},"proof":[{"text":"By cases on the two booleans. Each of the four resulting statements relates equality in 𝟐 to equality of 𝐓 and 𝐅 in Ω, and a decision procedure for the propositional connectives settles each of them.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_le","base":"bool_le","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"The order on 𝟐: p ≤ q is the truth of notb p || q, so false ≤ true","status":"ok"},"long":{"text":"The order on the booleans: p ≤ q is the affine proposition named by the boolean notb p || q, that is, boolean implication read through [[AffineConstructive.implementations.bool.bool_to_aprop]]. It holds except when p is true and q is false, so false is below true. Being 𝐓 or 𝐅 at every pair, the order is decidable; [[AffineConstructive.implementations.bool.bool_le_dec]] is the matching decision function and [[AffineConstructive.implementations.bool.bool_le_is_dec]] proves it correct.\n\nThe rest of the file shows this order is a decidable total order with false as bottom, true as top, and and and or as meet and join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_le_dec","base":"bool_le_dec","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"The boolean decision function for the order on 𝟐: notb p || q","status":"ok"},"long":{"text":"The decision function for the order [[AffineConstructive.implementations.bool.bool_le]]: the pair (p, q) goes to the boolean notb p || q, the same boolean whose truth the order is. [[AffineConstructive.implementations.bool.bool_le_is_dec]] proves it correct, which makes the order decidable, affirmative and refutative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_le_is_dec","base":"bool_le_is_dec","kind":"prf","start":73,"body":[74,76],"status":"ok","short":{"text":"The decision function for the order on 𝟐 is correct","status":"ok"},"proof":[{"text":"By cases on both booleans. In each of the four cases the decision function notb p || q computes, and its answer agrees with the order [[AffineConstructive.implementations.bool.bool_le]] by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_poset","base":"bool_poset","kind":"prf","start":85,"body":[86,90],"status":"ok","short":{"text":"The order on 𝟐 is a partial order","status":"ok"},"proof":[{"text":"Record the two inequalities [[AffineConstructive.implementations.bool.true_ne_false]] and [[AffineConstructive.implementations.bool.false_ne_true]]. Antisymmetry needs them in its mixed cases.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.orders.orders.alt_Build_Poset]], it suffices that the order is reflexive and transitive, contains equality, and is antisymmetric. Each axiom is checked by cases on the booleans involved, and every case is a propositional tautology given the two inequalities.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.implementations.bool.bool_dec_order","base":"bool_dec_order","kind":"prf","start":94,"body":[95,97],"status":"ok","short":{"text":"𝟐 is a poset with decidable order","status":"ok"},"proof":[{"text":"Both parts are already known: 𝟐 is a poset by [[AffineConstructive.implementations.bool.bool_poset]], and its order is decidable because its decision function is correct, by [[AffineConstructive.implementations.bool.bool_le_is_dec]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_total_order","base":"bool_total_order","kind":"prf","start":104,"body":[105,107],"status":"ok","short":{"text":"The order on 𝟐 is total: p ≤ q or q ≤ p for all booleans p, q","status":"ok"},"proof":[{"text":"The poset structure is [[AffineConstructive.implementations.bool.bool_poset]]. For totality, take cases on p and q. When q is true, or when both are false, p ≤ q holds. In the remaining case, true and false, q ≤ p holds. Each comparison holds by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_trich","base":"bool_trich","kind":"def","start":110,"body":null,"status":"ok","short":{"text":"The three-way comparison on 𝟐, with false below true","status":"ok"},"long":{"text":"The comparison function of the booleans: two equal booleans compare as equal, false against true as less, true against false as greater. [[AffineConstructive.implementations.bool.bool_is_trich]] proves the outcomes correct for the order [[AffineConstructive.implementations.bool.bool_le]], so 𝟐 is a linear order with a computable trichotomy.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.bool.bool_is_trich","base":"bool_is_trich","kind":"prf","start":112,"body":[113,115],"status":"ok","short":{"text":"The three-way comparison on 𝟐 is correct for its order","status":"ok"},"proof":[{"text":"Correctness of the comparison has two parts. That the order is linear comes from its totality, [[AffineConstructive.implementations.bool.bool_total_order]]. That [[AffineConstructive.implementations.bool.bool_trich]] reports the order correctly is checked on each of the four pairs of booleans, where it reduces to a closed statement that holds by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_lattice","base":"bool_lattice","kind":"prf","start":121,"body":[122,124],"status":"ok","short":{"text":"𝟐 is a lattice order with and as meet and or as join","status":"ok"},"proof":[{"text":"A lattice order is a meet semilattice order together with a join semilattice order. The underlying partial order is [[AffineConstructive.implementations.bool.bool_poset]]. The remaining laws say that and is a greatest lower bound and or a least upper bound. Each law is checked by cases on its boolean variables, and every case reduces to a closed affine proposition that the tautology checker decides.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_distr_lattice","base":"bool_distr_lattice","kind":"prf","start":131,"body":[132,134],"status":"ok","short":{"text":"𝟐 is a distributive lattice under and and or","status":"ok"},"proof":[{"text":"The order on 𝟐 is total by [[AffineConstructive.implementations.bool.bool_total_order]] and decidable, hence refutative. A linear refutative lattice order is distributive by [[AffineConstructive.orders.lattices.lattice_order_distr]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_bounded_meet_sl","base":"bool_bounded_meet_sl","kind":"prf","start":136,"body":[137,139],"status":"ok","short":{"text":"𝟐 is a bounded meet semilattice under and, with true as identity","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.lattices.alt_Build_BoundedMeetSemiLattice]] it suffices to have the semilattice laws of and, which hold because [[AffineConstructive.implementations.bool.bool_lattice]] makes and the meet of a lattice order, and that true is a left identity. The last condition is checked for each of the two booleans by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_bounded_join_sl","base":"bool_bounded_join_sl","kind":"prf","start":141,"body":[142,144],"status":"ok","short":{"text":"𝟐 is a bounded join semilattice under or, with false as identity","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice]] it suffices to have the semilattice laws of or, which hold because [[AffineConstructive.implementations.bool.bool_lattice]] makes or the join of a lattice order, and that false is a left identity. The last condition is checked for each of the two booleans by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.bool.bool_to_aprop_lattice_mor","base":"bool_to_aprop_lattice_mor","kind":"prf","start":146,"body":[147,155],"status":"ok","short":{"text":"The inclusion of 𝟐 into Ω carries and and or to the meet and join of Ω","status":"ok"},"proof":[{"text":"The lattice structures on both sides are already available: on 𝟐 from [[AffineConstructive.implementations.bool.bool_lattice]] and on Ω from [[AffineConstructive.theory.lattices.AProp_lattice]]. What remains is to show that the inclusion preserves meets and preserves joins.","status":"ok","from":0,"to":1},{"text":"For meets, it suffices that the inclusion carries p and q to the meet of the images of p and q. Taking cases on p and q gives four equalities between closed affine propositions, each a tautology.","status":"ok","from":2,"to":4},{"text":"For joins the argument is the same: the inclusion carries p or q to the join of the images. The four cases on p and q are again tautologies.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.implementations.bool.bool_to_aprop_order_embedding","base":"bool_to_aprop_order_embedding","kind":"def","start":159,"body":null,"status":"ok","short":{"text":"The inclusion of 𝟐 into Ω preserves and reflects the order","status":"ok"},"long":{"text":"The inclusion [[AffineConstructive.implementations.bool.bool_to_Ω]] is an order embedding: p ≤ q in 𝟐 exactly when the proposition named by p implies the one named by q in Ω. It comes from [[AffineConstructive.orders.lattices.join_sl_mor_embedding]], which makes any injective join-semilattice morphism between join semilattice orders an order embedding; injectivity is [[AffineConstructive.implementations.bool.bool_to_aprop_injective]] and the morphism property is [[AffineConstructive.implementations.bool.bool_to_aprop_lattice_mor]]. Together with those two results it presents 𝟐 as the two-element sublattice {𝐅, 𝐓} of Ω, ordered as a sublattice.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.default_equality":{"page":"../theory/default_equality.html","short":"Discrete sets: equality as affirmed strict equality, and maps out of them","summary":"The file introduces the discrete sets of the development: [[default_set_make]] equips any type with the affirmed strict equality [[leq]] as its set equality, and the class [[DefaultEquality]] records that a set's equality is of this form. Such a set has affirmative equality ([[default_equality_affirmative]]), and every map out of it preserves equality ([[default_equality_is_fun]]), so that [[default_eq_func]] turns any bare map into a function of sets. The tensor product X ⊗ Y of two such sets again has default equality ([[DefaultEquality_tensor]]). It is the bridge by which inductive types such as the booleans and the naturals enter the theory of affine sets."},"AffineConstructive.theory.lattices":{"page":"../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.orders":{"page":"../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.lattices":{"page":"../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.logic.srelations":{"page":"../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

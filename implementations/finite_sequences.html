"name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11525,"e":11528,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11554,"e":11557,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11583,"e":11586,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11864,"e":11868,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":12023,"e":12026,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12027,"e":12030,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12102,"e":12106,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":13961,"e":13964,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":13992,"e":13995,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file defines the finite sequences X* over a set X with a zero. Each one is a list, and two lists are identified when their zero-padded sequences ℕ ⇾ X agree, so trailing zeros do not matter. It provides indexing, cons, tail and the singleton map, together with induction and case analysis carried over from lists. When the equality of X is decidable, so is the equality of X*, and a correct boolean decision procedure on X gives one on X*. Zero-preserving maps X ⇾ Y and X ⊗ Y ⇾ Z extend pointwise to finite sequences. From these, X* inherits a pointwise additive monoid structure from an additive monoid X and an additive group structure from an additive group X, and indexing and tail are additive monoid morphisms.","short":"Finite sequences over a pointed set: zero-padded lists, decidable equality, pointwise addition","items":[{"name":"AffineConstructive.implementations.finite_sequences.ℕ","base":"ℕ","kind":"abbrev","start":6,"body":null,"status":"ok","short":{"text":"Local name ℕ for the set of natural numbers","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.implementations.nat.nno.Nat]], the set of natural numbers. Finite sequences are indexed by it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.e","base":"e","kind":"abbrev","start":7,"body":null,"status":"ok","short":{"text":"Local name e for the monoid unit","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.algebra_notation.mon_unit]], the unit of a monoid. In this file it is the empty list, the value [[AffineConstructive.implementations.finite_sequences.tail_op]] gives on the empty list.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.ProdList_index_or_zero","base":"ProdList_index_or_zero","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"Sends a list to its sequence ℕ ⇾ X, which is 0 past the end of the list","status":"ok"},"long":{"text":"The function from lists over X to sequences ℕ ⇾ X that reads a list as an infinite sequence. Entry n of the sequence is entry n of the list when the list has one, and the zero of X otherwise. It is a right fold over the list: the empty list gives the constant sequence 0, and consing x₀ onto a list with sequence g gives the sequence that is x₀ at 0 and g n at n + 1.\n\nThis map defines what a finite sequence is. [[AffineConstructive.implementations.finite_sequences.FinSeq]] identifies two lists exactly when their sequences agree, so lists that differ only by trailing zeros are equal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq","base":"FinSeq","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"The set of finite sequences over X: lists, equal when they agree after padding with zeros","status":"ok"},"long":{"text":"The set of finite sequences over a set X with a zero, written X* in this file. Its elements are lists over X. Its equality is pulled back along [[AffineConstructive.implementations.finite_sequences.ProdList_index_or_zero]]: two lists are equal when their sequences ℕ ⇾ X are equal, which means equal at every index under the affine universal quantifier. Two lists of different lengths are therefore compared as if the shorter one ended in zeros. Their inequality, the dual, says that there is an index at which the padded sequences differ.\n\nThe empty list is the zero of X*. Because the set is a projected set, it inherits strength and refutative equality from X ([[AffineConstructive.implementations.finite_sequences.FinSeq_strong]], [[AffineConstructive.implementations.finite_sequences.FinSeq_ref_eq]]). The rest of the file builds the operations on finite sequences and their algebraic structure.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_is_projected","base":"FinSeq_is_projected","kind":"prf","start":12,"body":[13,15],"status":"ok","short":{"text":"The equality of finite sequences is pulled back along their sequences ℕ ⇾ X","status":"ok"},"proof":[{"text":"By definition, X* is the set of lists with the equality pulled back along the padded index function ℕ ⇾ X. That pulled-back equality makes it a projected set, by [[AffineConstructive.theory.projected_set.projected_set_IsProjectedSet]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_sequence","base":"FinSeq_sequence","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"The sequence ℕ ⇾ X of a finite sequence, as a function on X*","status":"ok"},"long":{"text":"The projection of X* into sequences ℕ ⇾ X: [[AffineConstructive.implementations.finite_sequences.ProdList_index_or_zero]] made into a function on finite sequences, which is possible because equality on X* is defined by it. Statements about the equality of finite sequences come down to statements about these sequences, one index at a time.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_sequence_inj","base":"FinSeq_sequence_inj","kind":"prf","start":22,"body":[23,25],"status":"ok","short":{"text":"A finite sequence is determined by its sequence ℕ ⇾ X","status":"ok"},"proof":[{"text":"The sequence map is the projection of the projected set X* ([[AffineConstructive.implementations.finite_sequences.FinSeq_is_projected]]). The projection of a projected set is injective ([[AffineConstructive.theory.projected_set.projected_set_project_injective]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_index","base":"FinSeq_index","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"Entry n of a finite sequence, as a function X* ⇾ X for each n","status":"ok"},"long":{"text":"Indexing: for each natural number n, the function X* ⇾ X that takes entry n of the padded sequence, and so gives 0 past the end of the underlying list. It is written [s]_n. Since two finite sequences are equal exactly when all their entries are equal, most statements about X* are proved entry by entry through this map. For an additive monoid M, each indexing map M* ⇾ M is a monoid morphism ([[AffineConstructive.implementations.finite_sequences.FinSeq_index_addmon_mor]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_strong","base":"FinSeq_strong","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"Finite sequences over a strong set form a strong set","status":"ok"},"long":{"text":"If X is strong, so that its inequality is an apartness, then X* is strong too. It is a special case of [[AffineConstructive.theory.projected_set.projected_set_strong]]: equality on X* is equality of sequences into X, and equality of such sequences is equality at every index. Two finite sequences are then apart when they are apart at some index.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_ref_eq","base":"FinSeq_ref_eq","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"Finite sequences over a set with refutative equality have refutative equality","status":"ok"},"long":{"text":"If equality of X is refutative, so is equality of X*. It is a special case of [[AffineConstructive.theory.projected_set.projected_set_ref_eq]], which carries refutative equality along the projection into sequences.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.ProdList_to_FinSeq","base":"ProdList_to_FinSeq","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"The quotient map from lists over X onto finite sequences","status":"ok"},"long":{"text":"The function from lists over X, with entrywise equality, to X*. It is the identity on elements. Equal lists have the same padded sequence, so the map preserves equality. Its effect is to coarsen equality, so that trailing zeros no longer count.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_unit","base":"FinSeq_unit","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"Sends x to the one-entry finite sequence x, 0, 0, …","status":"ok"},"long":{"text":"The singleton map X ⇾ X*. It is [[AffineConstructive.implementations.list.prod.ProdList_unit]] followed by [[AffineConstructive.implementations.finite_sequences.ProdList_to_FinSeq]]. The finite sequence it gives has x at index 0 and zero everywhere else.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_cons_is_fun","base":"FinSeq_cons_is_fun","kind":"prf","start":32,"body":[33,45],"status":"ok","short":{"text":"Cons respects equality: x = y and s = t give x :: s = y :: t","status":"ok"},"proof":[{"text":"Take pairs (x, s) and (y, t). Equality in the cartesian product is the additive conjunction x = y ∧ s = t, and equality of finite sequences is agreement at every index. So fix an index n; it remains to show that the n-th entries of x :: s and y :: t agree.","status":"ok","from":0,"to":3},{"text":"At index 0 the entries are x and y. The additive conjunction allows the proof to choose its left conjunct, x = y, which is exactly what is needed.","status":"ok","from":4,"to":6},{"text":"At index m + 1 the proof chooses the other conjunct, s = t, discarding x = y. The entries at m + 1 are the m-th entries of s and t, so the goal is [s]_m = [t]_m.","status":"ok","from":7,"to":9},{"text":"Equality of s and t means agreement at every index, so specialising it at m gives the goal.","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_cons","base":"FinSeq_cons","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"Cons on finite sequences, X × X* ⇾ X*, written x :: s","status":"ok"},"long":{"text":"Prepends an entry to a finite sequence: x :: s has x at index 0 and entry n of s at index n + 1. The domain is the cartesian product X × X*, whose equality is the additive conjunction of the two equalities. Equality of x :: s and y :: t is checked one index at a time. Each index needs only one of the two equalities, x = y at index 0 and s = t at every later index, so the additive conjunction is enough ([[AffineConstructive.implementations.finite_sequences.FinSeq_cons_is_fun]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_induction","base":"FinSeq_induction","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"Induction on finite sequences for an affine predicate","status":"ok"},"long":{"text":"Induction for an affine predicate P on X*. Suppose P x ⊸ P (x₀ :: x) holds for all x₀ and x. Then P 0 implies that P holds for every finite sequence. It is [[AffineConstructive.implementations.list.base.list_induction]] on the underlying lists. The step takes the form of an implication, so it has to be a closed proof. The conclusion is an affine implication, so P 0 is used once and carried through every step.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_sinduction","base":"FinSeq_sinduction","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"Induction on finite sequences in the base logic: from P 0 and the cons step to every sequence","status":"ok"},"long":{"text":"Induction for a predicate on X* in the base logic: P 0, together with P x implying P (x₀ :: x) for every x₀ and x, gives P of every finite sequence. It is [[AffineConstructive.implementations.list.base.list_sinduction]] on the underlying lists, transported to X*, whose elements are lists identified when their zero-padded sequences agree. Four proofs in this file use it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_destruct","base":"FinSeq_destruct","kind":"def","start":50,"body":null,"status":"ok","short":{"text":"Case analysis on finite sequences for an affine predicate","status":"ok"},"long":{"text":"Case analysis for an affine predicate P on X*: P 0 ∧ (∏ x₀ x, P (x₀ :: x)) implies P of every finite sequence. It is [[AffineConstructive.implementations.list.base.list_destruct]] on the underlying lists. The hypothesis is an additive conjunction because each finite sequence falls into exactly one of the two cases, so only one of the two conjuncts is ever used.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_sdestruct","base":"FinSeq_sdestruct","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"Case analysis on finite sequences for a strict predicate","status":"ok"},"long":{"text":"Case analysis for a predicate on X* in the base logic: P 0, together with P (x₀ :: x) for all x₀ and x, gives P of every finite sequence. It is [[AffineConstructive.implementations.list.base.list_sdestruct]] on the underlying lists.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_dec_is_zero","base":"FinSeq_dec_is_zero","kind":"prf","start":63,"body":[64,84],"status":"ok","short":{"text":"Over a set with decidable equality, whether a finite sequence equals 0 is decidable","status":"ok"},"proof":[{"text":"The proof goes by induction on s ([[AffineConstructive.implementations.finite_sequences.FinSeq_sinduction]]), with one case for the zero sequence and one for a cons.","status":"ok","from":0,"to":1},{"text":"The statement 0 = 0 is proved, so it is equivalent to truth ([[AffineConstructive.logic.aprop.aiff_is_true]]), and truth is decidable.","status":"ok","from":2,"to":3},{"text":"For x :: s, decidability of s = 0 is the induction hypothesis. Equality with 0 says that every entry is 0. By [[AffineConstructive.logic.aprop.decidable_by_dual]], it suffices to establish either this or its dual, that some entry is nonzero.","status":"ok","from":4,"to":7},{"text":"Since X has decidable equality, either x = 0 or x ≠ 0. Suppose x = 0. The induction hypothesis, in its dual form ([[AffineConstructive.logic.aprop.decidable_dual]]), says that either every entry of s is 0 or some entry is not. In the first case every entry of x :: s is 0: entry 0 is x, and entry m + 1 is the m-th entry of s.","status":"ok","from":8,"to":13},{"text":"If the m-th entry of s is nonzero, then index m + 1 witnesses that x :: s has a nonzero entry.","status":"ok","from":14,"to":16},{"text":"If x ≠ 0, then index 0 is the witness.","status":"ok","from":17,"to":20}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_dec_eq","base":"FinSeq_dec_eq","kind":"prf","start":85,"body":[86,114],"status":"ok","short":{"text":"Finite sequences over a set with decidable equality have decidable equality","status":"ok"},"proof":[{"text":"Equality is decided pair by pair. The proof goes by induction on the first sequence ([[AffineConstructive.implementations.finite_sequences.FinSeq_sinduction]]), keeping the second sequence universally quantified.","status":"ok","from":0,"to":1},{"text":"When the first sequence is 0, symmetry turns 0 = t into t = 0, which is decidable by [[AffineConstructive.implementations.finite_sequences.FinSeq_dec_is_zero]].","status":"ok","from":2,"to":5},{"text":"For x :: s, the induction hypothesis decides s = t' for every t'. The proof proceeds by case analysis on the second sequence ([[AffineConstructive.implementations.finite_sequences.FinSeq_sdestruct]]).","status":"ok","from":6,"to":8},{"text":"If the second sequence is 0, then [[AffineConstructive.implementations.finite_sequences.FinSeq_dec_is_zero]] decides x :: s = 0.","status":"ok","from":9,"to":10},{"text":"If the second sequence is y :: t, equality means agreement at every index. By [[AffineConstructive.logic.aprop.decidable_by_dual]] it suffices to show either this or its dual, that the sequences differ at some index.","status":"ok","from":11,"to":14},{"text":"Decide x = y. Suppose x = y, and specialise the induction hypothesis at t; in its dual form ([[AffineConstructive.logic.aprop.decidable_dual]]) it says that either s and t agree everywhere or they differ somewhere. If they agree everywhere, then x :: s and y :: t agree at 0 by x = y and at m + 1 by the agreement at m.","status":"ok","from":15,"to":21},{"text":"If s and t differ at m, then the two conses differ at m + 1.","status":"ok","from":22,"to":24},{"text":"If x ≠ y, then the two conses differ at index 0.","status":"ok","from":25,"to":28}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_zero_dec","base":"FinSeq_zero_dec","kind":"def","start":115,"body":null,"status":"ok","short":{"text":"Boolean test that every entry of a finite sequence is 0, given a test for X","status":"ok"},"long":{"text":"A boolean procedure for whether a finite sequence is zero. It recurses on the underlying list and uses a boolean decision procedure for equality of X: the empty list gives true, and a cons gives the result for the tail if its head equals 0, and false otherwise. [[AffineConstructive.implementations.finite_sequences.FinSeq_zero_is_dec]] proves it correct, and [[AffineConstructive.implementations.finite_sequences.FinSeq_eq_dec_raw]] calls it once one of the two lists runs out.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_zero_is_dec","base":"FinSeq_zero_is_dec","kind":"prf","start":116,"body":[117,137],"status":"ok","short":{"text":"The boolean zero test is correct: true gives s = 0, false gives s ≠ 0","status":"ok"},"proof":[{"text":"Fix s. Read s ≠ 0 as the existence of an index at which s is nonzero; this is the dual of agreement with 0 at every index. Then proceed by induction on s ([[AffineConstructive.implementations.finite_sequences.FinSeq_sinduction]]).","status":"ok","from":0,"to":4},{"text":"On the zero sequence the test returns true, and 0 = 0 holds by reflexivity.","status":"ok","from":5,"to":6},{"text":"On x :: s the test first checks x = 0 with the boolean test of X. If that fails it returns false; otherwise it returns the test on s.","status":"ok","from":7,"to":9},{"text":"Proceed by cases on the test of x = 0. Its correctness ([[AffineConstructive.interfaces.aprop.dec_spec]]) gives x = 0 when it returns true and x ≠ 0 when it returns false.","status":"ok","from":10,"to":10},{"text":"Suppose x = 0, and proceed by cases on the test of s, using the induction hypothesis. If the test returns true, then s = 0, so every entry of x :: s is 0: entry 0 is x, and entry m + 1 is the m-th entry of s.","status":"ok","from":11,"to":15},{"text":"If it returns false, then s is nonzero at some m, so x :: s is nonzero at m + 1.","status":"ok","from":16,"to":17},{"text":"If x ≠ 0, then index 0 witnesses that x :: s is nonzero.","status":"ok","from":18,"to":20}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_eq_dec_raw","base":"FinSeq_eq_dec_raw","kind":"def","start":138,"body":null,"status":"ok","short":{"text":"Boolean equality test for two finite sequences, given a boolean test for X","status":"ok"},"long":{"text":"A boolean procedure for equality of finite sequences. It walks both lists together and compares the heads with the test for X. When one list runs out, it checks that the rest of the other list is zero with [[AffineConstructive.implementations.finite_sequences.FinSeq_zero_dec]]. This is how padding with zeros appears in the computation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_eq_dec","base":"FinSeq_eq_dec","kind":"inst","start":139,"body":null,"status":"ok","short":{"text":"The boolean decision function for equality of X*, on pairs","status":"ok"},"long":{"text":"[[AffineConstructive.implementations.finite_sequences.FinSeq_eq_dec_raw]] uncurried, so that it acts on pairs. In this form it is the decision function that resolution finds for equality of finite sequences. [[AffineConstructive.implementations.finite_sequences.FinSeq_eq_is_dec]] proves it correct.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_eq_is_dec","base":"FinSeq_eq_is_dec","kind":"prf","start":140,"body":[141,165],"status":"ok","short":{"text":"The boolean equality test on finite sequences is correct when the test on X is","status":"ok"},"proof":[{"text":"The correctness of the test is shown pair by pair. The proof goes by induction on the first sequence ([[AffineConstructive.implementations.finite_sequences.FinSeq_sinduction]]), keeping the second universally quantified.","status":"ok","from":0,"to":1},{"text":"When the first sequence is 0, the test on (0, t) is the zero test on t.","status":"ok","from":2,"to":4},{"text":"By [[AffineConstructive.implementations.finite_sequences.FinSeq_zero_is_dec]], the zero test gives t = 0 when it returns true and t ≠ 0 when it returns false. Symmetry gives 0 = t in the first case. In the second, since inequality is the dual of equality, the contrapositive of symmetry ([[AffineConstructive.logic.aprop.by_contrapositive]]) gives 0 ≠ t.","status":"ok","from":5,"to":6},{"text":"For x :: s, with the induction hypothesis for s against every sequence, proceed by case analysis on the second sequence ([[AffineConstructive.implementations.finite_sequences.FinSeq_sdestruct]]). When the second sequence is 0, the test is the zero test, which is correct by [[AffineConstructive.implementations.finite_sequences.FinSeq_zero_is_dec]].","status":"ok","from":7,"to":9},{"text":"When the second sequence is y :: t, the test checks x = y and, if that succeeds, returns the test on (s, t).","status":"ok","from":10,"to":11},{"text":"Proceed by cases on the test of x = y; its correctness ([[AffineConstructive.interfaces.aprop.dec_spec]]) gives x = y or x ≠ y.","status":"ok","from":12,"to":12},{"text":"Suppose x = y. Specialise the induction hypothesis at t and proceed by cases on the test of (s, t), reading inequality as a difference at some index.","status":"ok","from":13,"to":17},{"text":"If s = t, then the two conses agree at every index: at 0 by x = y, and at m + 1 by s = t at m.","status":"ok","from":18,"to":19},{"text":"If s and t differ at m, then the two conses differ at m + 1.","status":"ok","from":20,"to":21},{"text":"If x ≠ y, then the two conses differ at index 0.","status":"ok","from":22,"to":24}]},{"name":"AffineConstructive.implementations.finite_sequences.tail_op","base":"tail_op","kind":"def","start":172,"body":null,"status":"ok","short":{"text":"The tail of a list, with the empty list as its own tail","status":"ok"},"long":{"text":"The map on lists that drops the first entry. It sends the empty list to the empty list (the monoid unit) and x :: l to l. [[AffineConstructive.implementations.finite_sequences.tail_is_fun]] shows that it respects equality of finite sequences, and [[AffineConstructive.implementations.finite_sequences.FinSeq_tail]] is the resulting function on X*.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.tail_is_fun","base":"tail_is_fun","kind":"prf","start":173,"body":[174,197],"status":"ok","short":{"text":"Equal finite sequences have equal tails","status":"ok"},"proof":[{"text":"Proceed by case analysis on the first list ([[AffineConstructive.implementations.list.prod.ProdList_sdestruct]]): it is either empty or [x] ∙ s.","status":"ok","from":0,"to":1},{"text":"If the first list is empty, analyse the second list in the same way. When both are empty, so are their tails, and there is nothing to prove.","status":"ok","from":2,"to":3},{"text":"Now compare the empty list with [x] ∙ s. Their equality says that every entry of [x] ∙ s is 0. The tail of the empty list is empty, so the goal asks for every entry of s to be 0. Fix i, and specialise the hypothesis at i + 1.","status":"ok","from":4,"to":8},{"text":"If the first list is [x] ∙ s, analyse the second list.","status":"ok","from":9,"to":11},{"text":"Against the empty list, the argument is the mirror image: every entry of [x] ∙ s is 0, and the entry of s at i is its entry at i + 1.","status":"ok","from":12,"to":16},{"text":"Against [y] ∙ t, the i-th entries of the tails are the (i + 1)-th entries of the lists. Fix i, and specialise the equality of the lists at i + 1.","status":"ok","from":17,"to":23}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_tail","base":"FinSeq_tail","kind":"def","start":198,"body":null,"status":"ok","short":{"text":"The tail of a finite sequence, the function X* ⇾ X*","status":"ok"},"long":{"text":"The tail of a finite sequence: entry n of FinSeq_tail s is entry n + 1 of s, and the tail of 0 is 0. Together with indexing at 0, it inverts cons ([[AffineConstructive.implementations.finite_sequences.FinSeq_tail_spec]]). For an additive monoid M, it is a monoid morphism M* ⇾ M* ([[AffineConstructive.implementations.finite_sequences.FinSeq_tail_addmon_mor]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_tail_spec","base":"FinSeq_tail_spec","kind":"def","start":199,"body":[200,202],"status":"ok","short":{"text":"Every finite sequence is its entry at 0 consed onto its tail","status":"ok"},"proof":[{"text":"Proceed by case analysis on the list ([[AffineConstructive.implementations.list.prod.ProdList_sdestruct]]): it is either empty or [x₀] ∙ x. In both cases the two sides agree at index 0 and at every index m + 1 by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_map_spec'","base":"FinSeq_map_spec'","kind":"prf","start":209,"body":[210,214],"status":"ok","short":{"text":"Mapping a zero-preserving f over a list composes its padded sequence with f","status":"ok"},"proof":[{"text":"Proceed by induction on the list, with the step written [x₀] ∙ x ([[AffineConstructive.implementations.list.prod.ProdList_sinduction_alt]]). For the empty list, both sides are 0 at every index because f preserves zero. For the step, the induction hypothesis says that mapping f over x composes its sequence with f.","status":"ok","from":0,"to":1},{"text":"Mapping f over lists preserves concatenation, so the map of [x₀] ∙ x splits as the map of [x₀] concatenated with the map of x.","status":"ok","from":2,"to":2},{"text":"Compare the two sides entry by entry. At index 0 both sides are f x₀. At index i + 1 the comparison is the induction hypothesis at i.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.implementations.finite_sequences.IsFun_instance_0","base":"IsFun_instance_0","kind":"inst","start":215,"body":[216,221],"status":"ok","short":{"text":"Mapping a zero-preserving function over lists respects equality of finite sequences","status":"ok"},"proof":[{"text":"Take lists s and t. Two finite sequences are equal when their padded index functions agree, so the goal asks that s = t implies equality of the index functions of the two mapped lists.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.implementations.finite_sequences.FinSeq_map_spec']], the index function of a mapped list is f composed with the index function of the list. So the goal asks that s = t implies f ∘ ϕ s = f ∘ ϕ t, which holds because composing with f is itself a function and so preserves equality.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_map","base":"FinSeq_map","kind":"def","start":222,"body":null,"status":"ok","short":{"text":"Applies a zero-preserving f : X ⇾ Y to each entry, the function X* ⇾ Y*","status":"ok"},"long":{"text":"The entrywise action of a function f : X ⇾ Y with f 0 = 0 on finite sequences, built from [[AffineConstructive.implementations.list.prod.ProdList_map]]. The function must preserve zero. Otherwise the padding entries of s would map to f 0 instead of to the padding of Y, and lists equal up to trailing zeros would have unequal images. With that condition the padded sequence of the image is f composed with the padded sequence of s ([[AffineConstructive.implementations.finite_sequences.FinSeq_map_spec']]), and that is why the map respects equality. Negation on G* ([[AffineConstructive.implementations.finite_sequences.FinSeq_negate]]) is an instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_map_spec","base":"FinSeq_map_spec","kind":"def","start":224,"body":null,"status":"ok","short":{"text":"Entry n of FinSeq_map f s is f applied to entry n of s","status":"ok"},"long":{"text":"The specification of [[AffineConstructive.implementations.finite_sequences.FinSeq_map]] by indexing: [FinSeq_map f s]_n = f [s]_n. It is [[AffineConstructive.implementations.finite_sequences.FinSeq_map_spec']] restated for finite sequences.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.ϕ","base":"ϕ","kind":"abbrev","start":228,"body":null,"status":"ok","short":{"text":"Local name ϕ for the map sending a list or finite sequence to its sequence","status":"ok"},"long":{"text":"A local abbreviation, valid only inside some sections, for the map that reads a finite sequence as a sequence ℕ ⇾ X. In the decidability section it stands for [[AffineConstructive.implementations.finite_sequences.FinSeq_sequence]]. In the sections on maps it stands for [[AffineConstructive.implementations.finite_sequences.ProdList_index_or_zero]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.Zero_Pointed_Morphism_instance_0","base":"Zero_Pointed_Morphism_instance_0","kind":"inst","start":234,"body":null,"status":"ok","short":{"text":"Fixing the first argument of a zero-preserving f : X ⊗ Y ⇾ Z at 0 gives a zero-preserving map","status":"ok"},"long":{"text":"For f : X ⊗ Y ⇾ Z with f (0, 0) = 0, the partial application y ↦ f (0, y) of f at 0 in its first argument is a function Y ⇾ Z that preserves zero; the proof is the zero preservation of f itself. It is a section-local instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.Zero_Pointed_Morphism_instance_1","base":"Zero_Pointed_Morphism_instance_1","kind":"inst","start":235,"body":null,"status":"ok","short":{"text":"Fixing the second argument of a zero-preserving f : X ⊗ Y ⇾ Z at 0 gives a zero-preserving map","status":"ok"},"long":{"text":"For f : X ⊗ Y ⇾ Z with f (0, 0) = 0, the partial application x ↦ f (x, 0) of f at 0 in its second argument is a function X ⇾ Z that preserves zero; the proof is the zero preservation of f itself. It is a section-local instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.map2_zero_l","base":"map2_zero_l","kind":"def","start":236,"body":null,"status":"ok","short":{"text":"Maps y ↦ f (0, y) over a list over Y","status":"ok"},"long":{"text":"The list map that applies y ↦ f (0, y) to each entry of a list over Y. In the definition of [[AffineConstructive.implementations.finite_sequences.map2]], it handles the case where the list over X runs out before the list over Y does, by padding the first argument with 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.map2_zero_r","base":"map2_zero_r","kind":"def","start":237,"body":null,"status":"ok","short":{"text":"Maps x ↦ f (x, 0) over a list over X","status":"ok"},"long":{"text":"The list map that applies x ↦ f (x, 0) to each entry of a list over X. In the definition of [[AffineConstructive.implementations.finite_sequences.map2]], it handles the case where the list over Y runs out first, by padding the second argument with 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.map2_zero_l_spec","base":"map2_zero_l_spec","kind":"def","start":238,"body":null,"status":"ok","short":{"text":"The padded sequence of map2_zero_l applied to s is n ↦ f (0, s n)","status":"ok"},"long":{"text":"The zero-padded sequence of [[AffineConstructive.implementations.finite_sequences.map2_zero_l]] applied to a list s is n ↦ f (0, ϕ s n), where ϕ s is the zero-padded sequence of s. It is [[AffineConstructive.implementations.finite_sequences.FinSeq_map_spec']] for the zero-preserving function y ↦ f (0, y). One proof in this file uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.map2_zero_r_spec","base":"map2_zero_r_spec","kind":"def","start":239,"body":null,"status":"ok","short":{"text":"The padded sequence of map2_zero_r applied to s is n ↦ f (s n, 0)","status":"ok"},"long":{"text":"The zero-padded sequence of [[AffineConstructive.implementations.finite_sequences.map2_zero_r]] applied to a list s is n ↦ f (ϕ s n, 0), where ϕ s is the zero-padded sequence of s. It is [[AffineConstructive.implementations.finite_sequences.FinSeq_map_spec']] for the zero-preserving function x ↦ f (x, 0). One proof in this file uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.map2_aux","base":"map2_aux","kind":"def","start":240,"body":null,"status":"ok","short":{"text":"The recursion step of map2: combine a head x with a second list, padding it with 0 when exhausted","status":"ok"},"long":{"text":"The step function of the recursion that defines [[AffineConstructive.implementations.finite_sequences.map2]] on the first list. Given an entry x of the first list, the rest l of that list, and the function g already obtained for l, it returns a function on lists over Y by case analysis on its argument: on the empty list it gives f (x, 0) followed by [[AffineConstructive.implementations.finite_sequences.map2_zero_r]] applied to l, which treats the missing entries of the second list as 0; on a list y :: l' it gives f (x, y) followed by g l'.\n\nIt is an auxiliary of the list-level construction; the finite-sequence operation built from it is [[AffineConstructive.implementations.finite_sequences.FinSeq_map2]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.map2","base":"map2","kind":"def","start":241,"body":null,"status":"ok","short":{"text":"Pointwise combination of two lists by f : X ⊗ Y ⇾ Z, the shorter padded with zeros","status":"ok"},"long":{"text":"The list-level form of the pointwise operation: map2 f l l' is defined by primitive recursion on l, with [[AffineConstructive.implementations.finite_sequences.map2_aux]] as the step. When l is empty the result is [[AffineConstructive.implementations.finite_sequences.map2_zero_l]] applied to l', that is f (0, y) at each entry y of l'; when l' runs out first the rest of l is mapped by f (x, 0) through [[AffineConstructive.implementations.finite_sequences.map2_zero_r]]. The result has the length of the longer list.\n\nAs a map on lists it does not respect the equality of finite sequences by itself; [[AffineConstructive.implementations.finite_sequences.map2_spec']] computes its index function, f applied entrywise to the index functions of l and l', and from this [[AffineConstructive.implementations.finite_sequences.FinSeq_map2]] obtains a function on finite sequences. The padding agrees with the zeros implicit beyond the end of a list because f preserves zero.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.map2_spec'","base":"map2_spec'","kind":"prf","start":242,"body":[243,257],"status":"ok","short":{"text":"The n-th entry of map2 f l l' is f applied to the n-th entries of l and l'","status":"ok"},"proof":[{"text":"The proof is by induction on the first list l, with the claim quantified over every second list l' and every index n. When l is empty, map2 reduces to mapping f with zero on the left, and [[AffineConstructive.implementations.finite_sequences.map2_zero_l_spec]] is that case.","status":"ok","from":0,"to":3},{"text":"For the step, l is x consed onto a list l, and the induction hypothesis holds for l against every second list. The proof proceeds by case analysis on the second list.","status":"ok","from":4,"to":6},{"text":"If the second list is empty, both sides at index 0 compute to f (x, 0). At a successor index m + 1, map2 reduces to mapping f with zero on the right over l, and [[AffineConstructive.implementations.finite_sequences.map2_zero_r_spec]] gives the claim for every m.","status":"ok","from":7,"to":10},{"text":"If the second list is y consed onto l', both sides at index 0 compute to f (x, y). At index m + 1 both sides are the entries at m of the tails, so the induction hypothesis at l' and m completes the proof.","status":"ok","from":11,"to":14}]},{"name":"AffineConstructive.implementations.finite_sequences.IsFun_instance_1","base":"IsFun_instance_1","kind":"inst","start":258,"body":[259,267],"status":"ok","short":{"text":"The uncurried map2 f preserves equality of finite sequences, from X* ⊗ Y* to Z*","status":"ok"},"proof":[{"text":"Take two pairs (s₁, t₁) and (s₂, t₂) in X* ⊗ Y*. In the tensor product, equality of the pairs is s₁ = s₂ ⊠ t₁ = t₂. Equality of the results asks that the two index functions agree at every n.","status":"ok","from":0,"to":2},{"text":"Fix an index n. By [[AffineConstructive.implementations.finite_sequences.map2_spec']], each side is f applied to the n-th entries of the two lists, so the goal reduces to f (ϕ s₁ n, ϕ t₁ n) = f (ϕ s₂ n, ϕ t₂ n).","status":"ok","from":3,"to":5},{"text":"Since f preserves equality, it is enough that the arguments are equal in X ⊗ Y, which means ϕ s₁ n = ϕ s₂ n ⊠ ϕ t₁ n = ϕ t₂ n. The two factors line up with the two hypotheses: the equality s₁ = s₂ specialised at n gives the first, and t₁ = t₂ specialised at n gives the second. Each hypothesis is used exactly once.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_map2","base":"FinSeq_map2","kind":"def","start":268,"body":null,"status":"ok","short":{"text":"The pointwise function X* ⊗ Y* ⇾ Z* induced by a zero-preserving f : X ⊗ Y ⇾ Z","status":"ok"},"long":{"text":"The finite sequences s over X and t over Y are combined entry by entry: the n-th entry of FinSeq_map2 f (s, t) is f applied to the n-th entries of s and t, as [[AffineConstructive.implementations.finite_sequences.FinSeq_map2_spec]] states. The function f must send (0, 0) to 0, so that the zeros beyond the end of either sequence produce zeros in the result.\n\nThe domain carries the tensor product of X* and Y*, with multiplicative equality, because f does: an equality of pairs is s₁ = s₂ ⊠ t₁ = t₂, and at each index f turns the two entrywise equalities into one. Addition on finite sequences, [[AffineConstructive.implementations.finite_sequences.FinSeq_plus]], is this construction applied to the addition of a monoid.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_map2_spec","base":"FinSeq_map2_spec","kind":"def","start":269,"body":null,"status":"ok","short":{"text":"The n-th entry of FinSeq_map2 f (s, t) is f applied to the n-th entries of s and t","status":"ok"},"long":{"text":"The defining property of [[AffineConstructive.implementations.finite_sequences.FinSeq_map2]], stated through [[AffineConstructive.implementations.finite_sequences.FinSeq_index]]: the n-th entry of the pointwise combination of s and t is f of the n-th entries of s and t, so indexing commutes with the pointwise operation. It is [[AffineConstructive.implementations.finite_sequences.map2_spec']] read on finite sequences.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_plus","base":"FinSeq_plus","kind":"inst","start":275,"body":null,"status":"ok","short":{"text":"Pointwise addition on finite sequences over an additive monoid","status":"ok"},"long":{"text":"The addition of finite sequences over an additive monoid M, entry by entry: it is [[AffineConstructive.implementations.finite_sequences.FinSeq_map2]] applied to the addition of M, which preserves zero since 0 + 0 = 0. Its entries are computed by [[AffineConstructive.implementations.finite_sequences.FinSeq_plus_spec]], and with the empty sequence as zero it makes M* an additive monoid, [[AffineConstructive.implementations.finite_sequences.FinSeq_add_mon]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_plus_spec","base":"FinSeq_plus_spec","kind":"prf","start":276,"body":[277,279],"status":"ok","short":{"text":"Indexing distributes over addition: the i-th entry of x + y is the sum of the i-th entries","status":"ok"},"proof":[{"text":"Addition of finite sequences is [[AffineConstructive.implementations.finite_sequences.FinSeq_map2]] applied to the addition of M, which preserves zero because 0 + 0 = 0. The claim is therefore the case of [[AffineConstructive.implementations.finite_sequences.FinSeq_map2_spec]] for addition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_add_mon","base":"FinSeq_add_mon","kind":"inst","start":280,"body":[281,289],"status":"ok","short":{"text":"Finite sequences over an additive monoid form an additive monoid under pointwise addition","status":"ok"},"proof":[{"text":"A commutative additive monoid is determined by associativity, commutativity and the left identity law. Each law is an equality of finite sequences, so it is enough to check it entrywise. Fix an index i; by [[AffineConstructive.implementations.finite_sequences.FinSeq_plus_spec]], every entry of a sum is the sum of the entries.","status":"ok","from":0,"to":1},{"text":"Associativity at entry i is associativity in M.","status":"ok","from":2,"to":3},{"text":"Commutativity at entry i is commutativity in M.","status":"ok","from":4,"to":5},{"text":"The left identity law at entry i is the law 0 + x = x in M, [[AffineConstructive.theory.additive_groups.plus_0_l]], since every entry of the zero sequence is 0.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.implementations.finite_sequences.AdditiveNonComMonoid_instance_0","base":"AdditiveNonComMonoid_instance_0","kind":"inst","start":290,"body":null,"status":"ok","short":{"text":"The monoid structure on M*, with commutativity forgotten, as a section-local instance","status":"ok"},"long":{"text":"The additive monoid structure [[AffineConstructive.implementations.finite_sequences.FinSeq_add_mon]] on finite sequences over an additive monoid M, viewed as a monoid not necessarily commutative. It is a section-local instance, so resolution finds the weaker structure directly within the section.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_index_addmon_mor","base":"FinSeq_index_addmon_mor","kind":"prf","start":291,"body":[292,299],"status":"ok","short":{"text":"Taking the n-th entry is an additive monoid morphism M* ⇾ M","status":"ok"},"proof":[{"text":"A map of additive monoids is a morphism when it preserves addition and sends 0 to 0. These are the two things to show.","status":"ok","from":0,"to":1},{"text":"Preservation of addition by taking the n-th entry is [[AffineConstructive.implementations.finite_sequences.FinSeq_plus_spec]].","status":"ok","from":2,"to":4},{"text":"Every entry of the zero sequence is 0 by computation.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_tail_addmon_mor","base":"FinSeq_tail_addmon_mor","kind":"prf","start":300,"body":[301,308],"status":"ok","short":{"text":"The tail of finite sequences is an additive monoid morphism M* ⇾ M*","status":"ok"},"proof":[{"text":"It is enough to show that the tail preserves addition and sends 0 to 0.","status":"ok","from":0,"to":1},{"text":"For sequences s and t, [[AffineConstructive.implementations.finite_sequences.FinSeq_tail_spec]] rewrites each one as its entry at 0 consed onto its tail. Addition then acts head by head and tail by tail, so the tail of s + t computes to the sum of the tails.","status":"ok","from":2,"to":4},{"text":"The tail of the zero sequence is the zero sequence by computation.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_negate","base":"FinSeq_negate","kind":"inst","start":324,"body":null,"status":"ok","short":{"text":"Pointwise negation on finite sequences over an additive group","status":"ok"},"long":{"text":"The negation of a finite sequence over an additive group G, entry by entry: it is [[AffineConstructive.implementations.finite_sequences.FinSeq_map]] applied to the negation of G, which preserves zero since −0 = 0. Its entries are computed by [[AffineConstructive.implementations.finite_sequences.FinSeq_negate_spec]], and with pointwise addition it makes G* an additive group, [[AffineConstructive.implementations.finite_sequences.FinSeq_add_grp]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_negate_spec","base":"FinSeq_negate_spec","kind":"prf","start":325,"body":[326,328],"status":"ok","short":{"text":"The i-th entry of −x is the negation of the i-th entry of x","status":"ok"},"proof":[{"text":"Negation of finite sequences is [[AffineConstructive.implementations.finite_sequences.FinSeq_map]] applied to the negation of G, which preserves zero because −0 = 0. The claim is therefore the case of [[AffineConstructive.implementations.finite_sequences.FinSeq_map_spec]] for negation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.finite_sequences.FinSeq_add_grp","base":"FinSeq_add_grp","kind":"prf","start":329,"body":[330,338],"status":"ok","short":{"text":"Finite sequences over an additive group form an additive group under pointwise operations","status":"ok"},"proof":[{"text":"An abelian additive group needs associativity, commutativity, a left identity and a left inverse law. The first three are already known from the additive monoid [[AffineConstructive.implementations.finite_sequences.FinSeq_add_mon]], so only the left inverse law remains.","status":"ok","from":0,"to":1},{"text":"Take a sequence s. The law −s + s = 0 is an equality of finite sequences, so it is enough to fix an index i and compare the i-th entries.","status":"ok","from":2,"to":4},{"text":"By [[AffineConstructive.implementations.finite_sequences.FinSeq_plus_spec]] and [[AffineConstructive.implementations.finite_sequences.FinSeq_negate_spec]], the i-th entry of −s + s is −[s]_i + [s]_i. That sum is 0 by the left inverse law of G, [[AffineConstructive.theory.additive_groups.plus_negate_l]].","status":"ok","from":5,"to":8}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.free_monoid":{"page":"../interfaces/free_monoid.html","short":"Universal property of free monoids and free strong monoids, data separated from laws","summary":"The file states the universal property of a free monoid, separating data from laws. [[FromFreeMonoid]] gives the data: for a map i from a set X into a monoid Xs, an operation extending each map from X into a monoid M to a monoid morphism from Xs to M. [[FreeMonoid]] gives the laws: the extension restricts to the original map along i, and it is the only morphism that does. A parallel pair, [[FromFreeStrongMonoid]] and [[FreeStrongMonoid]], states the same property among monoids with a strong operation; there the extension is a function of sets, so it preserves equality and, being affine, apartness as well. Concrete models, such as lists, use these interfaces to show that they are free monoids."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.projected_set":{"page":"../theory/projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.theory.default_equality":{"page":"../theory/default_equality.html","short":"Discrete sets: equality as affirmed strict equality, and maps out of them","summary":"The file introduces the discrete sets of the development: [[default_set_make]] equips any type with the affirmed strict equality [[leq]] as its set equality, and the class [[DefaultEquality]] records that a set's equality is of this form. Such a set has affirmative equality ([[default_equality_affirmative]]), and every map out of it preserves equality ([[default_equality_is_fun]]), so that [[default_eq_func]] turns any bare map into a function of sets. The tensor product X ⊗ Y of two such sets again has default equality ([[DefaultEquality_tensor]]). It is the bridge by which inductive types such as the booleans and the naturals enter the theory of affine sets."},"AffineConstructive.theory.groups":{"page":"../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.bundled_groups":{"page":"../theory/bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."},"AffineConstructive.theory.additive_groups":{"page":"../theory/additive_groups.html","short":"Groups, monoids and their morphisms in additive notation","summary":"This file restates the generic group theory of theory/groups.v in the additive notation that rings use. To do so it views a set with +, 0 and − as a group through [[AdditiveGroupOps]]. It gives constructors for the additive semigroup, monoid and group structures, commutative or not, and the coercions among them. It also restates the basic laws under additive names: associativity, commutativity, the identity and inverse laws, the involution and distributivity of negation, [[negate_0]], [[equal_by_zero_sum]] and [[flip_negate]]. For additive semigroup and monoid morphisms it gives preservation of addition, negation and subtraction, together with identities, composites and inverses. [[Build_AdditiveGroup_Morphism]] shows that a map between groups that preserves addition is a monoid morphism. The file closes with simplification rules that cancel zeros and inverses, transport of structure along injections, and the quotation rules for + and −."},"AffineConstructive.theory.nno":{"page":"../theory/nno.html","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[nno_to_nno_bijective]]). By transport along the comparison with [[Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[nno_ind]], with a base-logic variant [[nno_ind_alt]] and the tactic [[nno_induction]]. It also defines primitive recursion [[nno_rec]] with its base and step equations, and bundles it as a function of its step function [[nno_rec_fun]] when X is a strong set."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.implementations.list":{"page":"list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.implementations.nat":{"page":"nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."}},"constants":null}</script>

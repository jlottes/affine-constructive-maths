b":"AffineConstructive.implementations.finite_sequences","name":"FinSeq","kind":"def","local":false,"page":"../finite_sequences.html"},{"s":999,"e":1036,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"make_additive_non_com_monoid_morphism","kind":"def","local":false,"page":"../../interfaces/bundled_algebra.html"},{"s":1054,"e":1063,"lib":"AffineConstructive.implementations.free.com_monoids","name":"eval","kind":"def","local":false,"m":"eval","page":"com_monoids.html"},{"s":1065,"e":1075,"lib":"AffineConstructive.implementations.free.ab_groups","name":"int_action","kind":"def","local":true},{"s":1099,"e":1122,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"AdditiveMonoid_Morphism","kind":"class","local":false,"page":"../../interfaces/abstract_algebra.html"},{"s":1124,"e":1133,"lib":"AffineConstructive.implementations.free.com_monoids","name":"eval","kind":"def","local":false,"m":"eval","page":"com_monoids.html"},{"s":1135,"e":1145,"lib":"AffineConstructive.implementations.free.ab_groups","name":"int_action","kind":"def","local":true},{"s":1170,"e":1190,"lib":"AffineConstructive.implementations.free.com_monoids","name":"eval_addmon_mor","kind":"thm","local":false,"m":"eval","page":"com_monoids.html"},{"s":1209,"e":1222,"lib":"AffineConstructive.implementations.free.com_monoids","name":"eval_var","kind":"thm","local":false,"m":"eval","page":"com_monoids.html"},{"s":1247,"e":1261,"lib":"AffineConstructive.implementations.free.ab_groups","name":"int_action_1_r","kind":"thm","local":true},{"s":1231,"e":1241,"lib":"AffineConstructive.implementations.free.ab_groups","name":"int_action","kind":"def","local":true},{"s":831,"e":834,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":916,"e":919,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"This file builds the free abelian group on countably many generators, over a model ℤ of the integers whose equality is decidable. It follows the free commutative monoid of `implementations/free/com_monoids.v`. The carrier is the finite sequences of integers [[AffineConstructive.implementations.finite_sequences.FinSeq]] with decidable equality, and the generators are the unit sequences [[AffineConstructive.implementations.free.com_monoids.eval.v]]. For an additive group G and a list of elements Γ, evaluation [[eval.eval]] sends a sequence s to Σᵢ sᵢ · Γᵢ. Here the scalar multiplication is the integer action [[AffineConstructive.implementations.free.ab_groups.int_action]], where the monoid construction used the action of the naturals. The result [[AffineConstructive.implementations.free.ab_groups.free_add_group]] shows that evaluation is a morphism of additive monoids that sends the n-th generator to the n-th element of Γ, using 1 · x = x ([[AffineConstructive.implementations.free.ab_groups.int_action_1_r]]). It provides the free abelian group interface of `interfaces/free/groups.v`.","short":"Free abelian groups as finite sequences of integers, with evaluation at generators","items":[{"name":"AffineConstructive.implementations.free.ab_groups.int_action","base":"int_action","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The map n ↦ n · x from the integers to an additive group G, as a group morphism","status":"ok"},"long":{"text":"For an element x of an additive group G, `int_action ℤ G x` is the map n ↦ n · x from the integers to G, packaged as a morphism of additive groups. It is the action [[AffineConstructive.theory.int_action.add_int_act]] of ℤ on G with its second argument fixed at x, by partial application [[AffineConstructive.theory.set.ap2]]. The action is taken on !G, the set G with its equality affirmed ([[AffineConstructive.theory.set.of_course_set]]), and the result is passed back to G through the counit [[AffineConstructive.theory.set.of_course_counit]]. Fixing x means using it once for every n, and only !G allows that.\n\nThe lemma [[AffineConstructive.implementations.free.ab_groups.int_action_1_r]] states that the action of 1 on x is x, 1 · x = x. Apart from that lemma, one proof in this file uses the map. It is local to the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.ab_groups.int_action_1_r","base":"int_action_1_r","kind":"prf","start":8,"body":[9,11],"status":"ok","short":{"text":"The integer action of 1 on x is x: 1 · x = x","status":"ok"},"proof":[{"text":"Regard G as the set !G, whose equality is affirmative and which is still an additive group. The integer action of G is the action on !G, so the general law [[AffineConstructive.theory.int_action.add_int_act_1_l]], 1 · x = x, applies to x as it stands.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.free.ab_groups.free_add_group","base":"free_add_group","kind":"def","start":12,"body":[13,39],"status":"ok","short":{"text":"The free abelian group: finite sequences of integers, with evaluation at a list of generators","status":"ok"},"proof":[{"text":"A model of [[AffineConstructive.interfaces.free.groups.free_additive_group]] has two parts: a carrier with its generators and a decision procedure for equality, and for each additive group G and list Γ of its elements a morphism into G that sends the generators to Γ. Begin with the carrier.","status":"ok","from":0,"to":2},{"text":"The carrier is the finite sequences over ℤ, an additive group under pointwise addition and negation.","status":"ok","from":3,"to":5},{"text":"Equality of finite sequences is decided by the boolean test that compares them term by term, using the test on ℤ.","status":"ok","from":6,"to":8},{"text":"The generators are those of the commutative monoid construction, [[AffineConstructive.implementations.free.com_monoids.eval.v]] over ℤ: the n-th generator is the sequence with 1 in place n and 0 elsewhere.","status":"ok","from":9,"to":11},{"text":"The boolean test on finite sequences is correct because the test on ℤ is, by [[AffineConstructive.implementations.finite_sequences.FinSeq_eq_is_dec]].","status":"ok","from":12,"to":13},{"text":"For the universal part, fix an additive group G and a list Γ of its elements. The morphism required is a map that preserves addition and zero and sends each generator to the matching element of Γ.","status":"ok","from":14,"to":17},{"text":"The map is evaluation at Γ, [[eval.eval]], with the integer action [[AffineConstructive.implementations.free.ab_groups.int_action]] as scalar multiplication. A sequence of coefficients is sent to the sum of each element of Γ multiplied by its coefficient.","status":"ok","from":18,"to":20},{"text":"Evaluation preserves addition and zero by [[AffineConstructive.implementations.free.com_monoids.eval.eval_addmon_mor]], the same fact used in the commutative monoid construction.","status":"ok","from":21,"to":23},{"text":"Evaluation sends the n-th generator to the n-th element of Γ by [[AffineConstructive.implementations.free.com_monoids.eval.eval_var]]. That lemma needs the scalar 1 to act as the identity, which is [[AffineConstructive.implementations.free.ab_groups.int_action_1_r]].","status":"ok","from":24,"to":26}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.integers":{"page":"../../interfaces/integers.html","short":"Interface for the integers as the free group on one generator, and ordered integers","summary":"The file gives the interface for the integers, characterised by a universal property. [[IntegersToGroup]] supplies a canonical map from Z into every additive group with a distinguished element, and [[Integers]] states that Z is a ring for which this map is the unique additive morphism preserving 1, so that Z is the free group on one generator. The bundled record [[integers]] packages a ring with this structure, and [[OrderedIntegers]] adds a strong linear refutative ring order, giving the integers as an ordered ring. The theory of the integers and their concrete models build on these classes."},"AffineConstructive.interfaces.free.generators":{"page":"../../interfaces/free/generators.html","short":"Sets with generators named by naturals, and evaluation morphisms at an environment","summary":"This file sets up the interface for sets with named generators, which the quoting and normalization tactics use. A [[Var]] structure on a set names its generators var 0, var 1, … by the naturals. [[Var_Morphism]] says that a function sends each var n to the n-th entry of an environment list Γ, which makes it the evaluation at Γ of terms over the generators. The two are bundled: [[var_set]] is a set with named generators, and [[var_morphism]] is the set of functions that respect a given environment, with its equality projected from that of functions. The file states definitions only, no theorems; the free structures built on it supply the instances."},"AffineConstructive.interfaces.free.groups":{"page":"../../interfaces/free/groups.html","short":"Free commutative monoids and abelian groups on countably many generators, for the decision tactics","summary":"The file states the interfaces of three free algebraic structures on countably many generators: commutative additive monoids, commutative monoids written multiplicatively, and abelian groups. Each interface has the same three layers. The first is the algebra with named generators and a correct decision procedure for its equality ([[free_additive_monoid.t]] and its siblings). The second is the type of evaluation morphisms into a target algebra, which send the n-th generator to the n-th entry of an environment Γ. The third is the free structure itself, an algebra with generators together with an evaluation into every target for every environment. Only the existence half of the universal property is required. That half is what the quoting and normalisation tactics need: they decide an equation in the free structure and carry the verdict to the target along the evaluation. The file builds on the generic notions of [[has_var]] and [[var_morphism_t]] from interfaces/free/generators.v. Concrete free algebras in implementations/ meet these interfaces."},"AffineConstructive.theory.bundled_rings":{"page":"../../theory/bundled_rings.html","short":"Categories of near-rigs, rigs, near-rings and rings, and their forgetful coercions","summary":"The file makes categories of the bundled ring-like structures of `interfaces/bundled_algebra.v`, continuing what `theory/bundled_groups.v` does for monoids and groups. One identity, [[near_rig_id]], and one composition, [[near_rig_morphism_compose]], serve for all six categories, [[𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], [[𝐑𝐢𝐠]], [[𝐂𝐑𝐢𝐠]], [[𝐍𝐞𝐚𝐫𝐑𝐢𝐧𝐠]], [[𝐑𝐢𝐧𝐠]] and [[𝐂𝐑𝐢𝐧𝐠]], because each of these structures has the near-rig morphisms as its morphisms. In every case the category laws hold because the laws hold for the underlying functions, and morphisms are equal when their functions are. The file also gives the forgetful passages from a ring-like structure to its additive monoid or group and to its multiplicative monoid, and from a near-rig morphism to the matching additive and multiplicative monoid morphisms, so that results about groups and monoids apply directly to rings."},"AffineConstructive.theory.int_action":{"page":"../../theory/int_action.html","short":"The action of the integers on additive groups, through the endomorphism near-ring","summary":"The file builds the action of the integers on an additive group X, the counterpart of [[add_nat_act]] from theory/nat_action.v. The endomorphisms [[EndFun]] X form a near-ring under pointwise addition and composition ([[EndFun_NearRing]]), and the additive monoid endomorphisms E₊ X form a sub-near-ring that is a ring when X is abelian ([[Additive_Monoid_EndFun_Ring]]). The action [[add_int_act]] is the canonical map from the integers into EndFun X, uncurried, and its laws in the integer argument (0 · x = 0, 1 · x = x, additivity, negation, subtraction, (m · n) · x = m · (n · x)) are the properties of that map; it is also strong, and n · 0 = 0 holds without commutativity. For abelian X each n · – is additive ([[add_int_act_plus_r]]). Finally, [[int_act_nat_act]] shows that along a rig morphism from the naturals to the integers, the integer action restricts to the natural-number action."},"AffineConstructive.implementations.finite_sequences":{"page":"../finite_sequences.html","short":"Finite sequences over a pointed set: zero-padded lists, decidable equality, pointwise addition","summary":"The file defines the finite sequences X* over a set X with a zero. Each one is a list, and two lists are identified when their zero-padded sequences ℕ ⇾ X agree, so trailing zeros do not matter. It provides indexing, cons, tail and the singleton map, together with induction and case analysis carried over from lists. When the equality of X is decidable, so is the equality of X*, and a correct boolean decision procedure on X gives one on X*. Zero-preserving maps X ⇾ Y and X ⊗ Y ⇾ Z extend pointwise to finite sequences. From these, X* inherits a pointwise additive monoid structure from an additive monoid X and an additive group structure from an additive group X, and indexing and tail are additive monoid morphisms."},"AffineConstructive.implementations.free.com_monoids":{"page":"com_monoids.html","short":"Free commutative monoids as finite sequences of natural-number coefficients","summary":"The file builds the free commutative additive monoid over a naturals type ℕ with decidable equality: its elements are finite sequences of naturals ([[FinSeq]]), the coefficients of the generators, and the n-th generator is the sequence with a single 1 at index n ([[eval.v]]). Given an environment Γ, a list of elements of a monoid X, and an action of the coefficients on X, [[eval.eval]] sends a coefficient sequence s to the sum Γ₀ · s₀ + Γ₁ · s₁ + ⋯. It is shown to be a morphism of additive monoids ([[eval.eval_addmon_mor]]) that sends each generator to the corresponding entry of Γ ([[eval.eval_var]]). With the action of the naturals by repeated addition ([[nat_action]]) this gives [[free_add_mon]], which [[free_com_mon]] repackages as a free commutative monoid through [[free_additive_monoid_as_free_com_mon]]."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."}},"constants":null}</script>

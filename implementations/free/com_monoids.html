' s) : M ⊗ TensorList M → X* )\n      )\n  end.\n\n  Lemma act_map_nil : ∀ (Γ : list X), act_map_op Γ nil = ProdList_map (const 0) Γ.\n  Proof. now intros [| x Γ]. Qed.\n\n  Local Abbreviation tl := FinSeq_tail.\n\n  Lemma act_map_spec : ∀ x (Γ : list X) (s:M*), act_map_op (cons x Γ) s = x · [s]_0 :: act_map_op Γ (tl s).\n  Proof. intros x Γ. refine (ProdList_sdestruct _ _ _).\n  + change (act_map_op (cons x Γ) e) with (0 :: ProdList_map (const (Y:=X) 0) Γ).\n    change (tl _) with (@nil M). rew (act_map_nil _).\n    change (_ :: ?b = _) with (0 = x · 0 ⊠ b = b :> X*).\n    rew (preserves_0 _); now split.\n  + intros α s. change (x · α = x · α ⊠ act_map_op Γ s = act_map_op Γ s). now split.\n  Qed.\n\n  Lemma act_map_is_fun : ∀ (Γ : list X), @IsFun M* X* (act_map_op Γ).\n  Proof. refine (list_sinduction _ _ _) .\n  + exact (is_fun (const e)).\n  + intros x Γ' IH s t. apply affirmative_aimpl. intros E.\n    rew [ (act_map_spec x Γ' s) | (act_map_spec x Γ' t) ].\n    change (x · [s]_0 = x · [t]_0 ⊠ act_map_op Γ' (tl s) = act_map_op Γ' (tl t)).\n    rew <-(IH _ _). rew <-E; now split.\n  Qed.\n\n  Definition act_map (Γ:list X) : M* ⇾ X* := @func_make _ _ _ (act_map_is_fun Γ).\n\n  Local Definition sum : X* ⇾ X := TensorList_to_monoid (id_fun (additive_monoid_as_com_monoid X)).\n  Definition eval (Γ:list X) := sum ∘ act_map Γ.\n\n  Lemma eval_spec : ∀ x (Γ : list X) (s:M*), eval (cons x Γ) s = x · [s]_0 + eval Γ (tl s).\n  Proof. intros x Γ s. now rew (FinSeq_tail_spec s : _ = _) at 1. Qed.\n\n  Lemma eval_pres_0 : ∀ Γ, eval Γ 0 = 0.\n  Proof. refine (list_sinduction _ _ _); [ refl | intros x Γ IH ]. rew (eval_spec _ _ _).\n    change (x · 0 + eval Γ 0 = 0). rew [IH | (preserves_0 _)]. exact (plus_0_l _).\n  Qed.\n\n  Lemma eval_addmon_mor (Γ:list X) : AdditiveMonoid_Morphism (eval Γ).\n  Proof. apply alt_Build_AdditiveMonoid_Morphism; [| exact (eval_pres_0 _) ]; revert Γ.\n    refine (list_sinduction _ _ _).\n  + intros s t. sym. exact (plus_0_l _).\n  + intros x Γ IH s t.\n    rew ?(eval_spec _ _ _).\n    rewrite_preserves (tl (X:=M)).\n    rewrite_preserves (FinSeq_index (X:=M) 0).\n    rewrite_preserves (act x).\n    rew (IH _ _).\n    rew (associativity (+) _ _ _). apply (is_fun (+ eval Γ (tl t))).\n    rew <-(associativity (+) _ _ _). apply (is_fun (x · [s]_0 +)).\n    exact (commutativity (+) _ _).\n  Qed.\n\n  Context {Mone:One M}.\n  Local Hint Extern 1 (One (additive_non_com_monoid_car (additive_monoid_as_add_nc_monoid M))) => exact Mone : typeclass_instances.\n  Definition v : Nat ⇾ M* := set:(λ n, nno_rec Nat set:(λ y:M*, 0,, y) (FinSeq_unit 1, n)).\n  Local Hint Extern 1 (Var M*) => refine v : typeclass_instances.\n  Context (act_1_r : ∀ x, x · 1 = x).\n\n  Lemma eval_var : ∀ (Γ:list@{u} X), Var_Morphism Γ (eval Γ).\n  Proof. unfold Var_Morphism.\n    refine (list_sinduction@{u} _ _ _); [ easy | intros x Γ IH [| n ] ].\n    + intros []. change ((x · 1) + eval Γ 0 = x).\n      rew [ (act_1_r x) | (eval_pres_0 _) ]. exact (plus_0_r _).\n    + intro b. change (ListInBounds Γ n) in b. specialize (IH n b).\n      change ((x · 0) + eval Γ (var n) = list_nth Γ n).\n      now rew (preserves_0 (act x)), (plus_0_l _).\n  Qed.\nEnd contents.\nEnd eval.\n\nDefinition nat_action (ℕ:naturals) (M:additive_monoid) (x:M) : additive_monoid_morphism ℕ M\n  := make_additive_non_com_monoid_morphism (of_course_counit _ ∘ ap2 (add_nat_act ℕ (X:=of_course_set M)) x).\n\nLemma nat_action_1_r {ℕ M} x : @nat_action ℕ M x 1 = x.\nProof. exact (add_nat_act_1_l ℕ (X:=of_course_set M) x). Qed.\n\nDefinition free_add_mon@{u} (ℕ:naturals@{u}) `{!IsDecEq ℕ (d:=d)} : free_additive_monoid@{u}.\nProof. unshelve esplit.\n+ unshelve esplit.\n  - exact (make_additive_monoid (FinSeq ℕ)).\n  - split. now change (Dec (A:=FinSeq ℕ ∗ FinSeq ℕ) (=)).\n  - split. exact (eval.v (M:=ℕ)).\n  - now change (IsDecEq (FinSeq ℕ)).\n+ intros M Γ. unshelve esplit.\n  - simple refine (make_additive_non_com_monoid_morphism _).\n    * exact (eval.eval (nat_action ℕ M) Γ).\n    * change (AdditiveMonoid_Morphism (eval.eval (nat_action ℕ M) Γ)).\n      refine (eval.eval_addmon_mor _ _).\n  - exact ( eval.eval_var (X:=M) (nat_action ℕ M) nat_action_1_r Γ ).\nDefined.\n\nDefinition free_additive_monoid_as_free_com_mon (F:free_additive_monoid) : free_commutative_monoid.\nProof. unshelve esplit.\n+ unshelve esplit; [ exact (additive_monoid_as_com_monoid F) | exact F .. ].\n+ intros M Γ. change (list (com_monoid_as_additive_monoid M)) in Γ. unshelve esplit.\n  - exact (additive_non_com_monoid_morphism_as_mon_mor (free_additive_monoid.eval F Γ)).\n  - exact (free_additive_monoid.eval F Γ).\nDefined.\n\nDefinition free_com_mon@{u} (ℕ:naturals@{u}) `{!IsDecEq ℕ (d:=d)} : free_commutative_monoid@{u}\n  := free_additive_monoid_as_free_com_mon (free_add_mon ℕ).\n\n","sentences":[{"i":0,"s":0,"e":91,"kind":"vernac","status":"ok","ms":42,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":92,"e":134,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":135,"e":162,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":3,"s":163,"e":187,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":4,"s":188,"e":253,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":5,"s":254,"e":350,"kind":"vernac","status":"ok","ms":32,"messages":[],"goals":null},{"i":6,"s":351,"e":411,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":7,"s":412,"e":469,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":470,"e":496,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":9,"s":498,"e":530,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":10,"s":532,"e":544,"kind":"vernac","status":"ok","ms":10,"messages":["75f393723fcac502"],"goals":null},{"i":11,"s":546,"e":637,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":12,"s":638,"e "tacn","local":false,"page":"../../tactics/quote/rewrite_preserves.html"},{"s":3663,"e":3680,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../../tactics/quote/rewrite_preserves.html"},{"s":3694,"e":3697,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3712,"e":3715,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3781,"e":3784,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4374,"e":4378,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":4461,"e":4464,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4650,"e":4653,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4654,"e":4657,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5242,"e":5245,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5327,"e":5330,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file builds the free commutative additive monoid over a naturals type ℕ with decidable equality: its elements are finite sequences of naturals ([[AffineConstructive.implementations.finite_sequences.FinSeq]]), the coefficients of the generators, and the n-th generator is the sequence with a single 1 at index n ([[AffineConstructive.implementations.free.com_monoids.eval.v]]). Given an environment Γ, a list of elements of a monoid X, and an action of the coefficients on X, [[AffineConstructive.implementations.free.com_monoids.eval.eval]] sends a coefficient sequence s to the sum Γ₀ · s₀ + Γ₁ · s₁ + ⋯. It is shown to be a morphism of additive monoids ([[AffineConstructive.implementations.free.com_monoids.eval.eval_addmon_mor]]) that sends each generator to the corresponding entry of Γ ([[AffineConstructive.implementations.free.com_monoids.eval.eval_var]]). With the action of the naturals by repeated addition ([[AffineConstructive.implementations.free.com_monoids.nat_action]]) this gives [[AffineConstructive.implementations.free.com_monoids.free_add_mon]], which [[AffineConstructive.implementations.free.com_monoids.free_com_mon]] repackages as a free commutative monoid through [[AffineConstructive.implementations.free.com_monoids.free_additive_monoid_as_free_com_mon]].","short":"Free commutative monoids as finite sequences of natural-number coefficients","items":[{"name":"AffineConstructive.implementations.free.com_monoids.eval.e","base":"e","kind":"abbrev","start":14,"body":null,"status":"ok","short":{"text":"Local shorthand for the unit of a monoid, here the empty list","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.algebra_notation.mon_unit]], the unit element. In this file it denotes the unit of the list monoid X*, the empty list, which is what the evaluation produces from an empty list of generators.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.act_map_op","base":"act_map_op","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"The underlying map sending a coefficient list s to the list of products Γᵢ · sᵢ","status":"ok"},"long":{"text":"Given a list Γ = x₀, …, xₖ₋₁ of elements of the target monoid X and an action · of the coefficient monoid M on X (each x giving a morphism M ⇾ X), this sends a list s of coefficients to the list x₀ · s₀, …, xₖ₋₁ · sₖ₋₁ in X*. The output always has the length of Γ: coefficients beyond it are ignored, and missing coefficients are read as 0, so that the empty coefficient list gives a list of zeros.\n\nIt is defined by recursion on Γ and, for each Γ, by case analysis on the coefficient list ([[AffineConstructive.implementations.list.tensor.TensorList_match]]). This is the raw map; that it respects the equality of finite sequences, which identifies lists that differ by trailing zeros, is [[AffineConstructive.implementations.free.com_monoids.eval.act_map_is_fun]], and the resulting function is [[AffineConstructive.implementations.free.com_monoids.eval.act_map]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.act_map_nil","base":"act_map_nil","kind":"prf","start":28,"body":[29,31],"status":"ok","short":{"text":"On the empty coefficient list the map gives a list of zeros, one for each element of Γ","status":"ok"},"proof":[{"text":"Case on Γ. Whether Γ is empty or not, the map on the empty coefficient list computes to a list of zeros of the same length as Γ, so both sides agree by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.tl","base":"tl","kind":"abbrev","start":32,"body":null,"status":"ok","short":{"text":"Local shorthand for the tail of a finite sequence","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.implementations.finite_sequences.FinSeq_tail]], the tail of a finite sequence, used in stating the recursive description of the evaluation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.act_map_spec","base":"act_map_spec","kind":"prf","start":33,"body":[34,47],"status":"ok","short":{"text":"For Γ = x :: Γ', the map gives x · s₀ followed by its value at Γ' on the tail of s","status":"ok"},"proof":[{"text":"Fix x and Γ, and do a case analysis on the coefficient sequence: either it is empty, or it is [α] ∙ s for a first coefficient α and a rest s.","status":"ok","from":0,"to":2},{"text":"In the empty case the left side computes to 0 followed by zeros for Γ, the head of the empty sequence is 0 and its tail is empty. By [[AffineConstructive.implementations.free.com_monoids.eval.act_map_nil]] the right side is x · 0 followed by the same zeros, and equality of two such lists is the head equality 0 = x · 0 ⊠ the equality of the tails. The tails agree by reflexivity, and x · 0 = 0 because the action of x is an additive monoid morphism and so preserves zero ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]).","status":"ok","from":3,"to":8},{"text":"In the case [α] ∙ s, fix α and s. Both sides compute to x · α followed by the map at Γ on s, so the equality splits into two factors, each holding by reflexivity.","status":"ok","from":9,"to":13}]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.act_map_is_fun","base":"act_map_is_fun","kind":"prf","start":48,"body":[49,61],"status":"ok","short":{"text":"For each Γ, the map from coefficient sequences to lists of products preserves equality","status":"ok"},"proof":[{"text":"Induction on Γ. On the empty list the map is constant, and a constant function preserves equality.","status":"ok","from":0,"to":3},{"text":"For Γ = x :: Γ', with the induction hypothesis that the map at Γ' preserves equality, fix coefficient sequences s and t. Finite sequences over M have decidable equality, and decidable equality is affirmative, so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] it suffices to derive the conclusion from s = t in the base logic. Assume s = t. As an ordinary hypothesis it may be used as often as needed.","status":"ok","from":4,"to":7},{"text":"Unfold both sides by [[AffineConstructive.implementations.free.com_monoids.eval.act_map_spec]]. Equality of the two resulting lists is the equality x · s₀ = x · t₀ of the heads ⊠ the equality of the maps at Γ' on the tails.","status":"ok","from":8,"to":9},{"text":"The induction hypothesis reduces the second factor to tl s = tl t. Rewriting by s = t turns both factors into reflexive equalities. The assumption s = t is used once in each factor, which is allowed because it is a base-logic hypothesis.","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.act_map","base":"act_map","kind":"def","start":62,"body":null,"status":"ok","short":{"text":"The function from finite sequences of coefficients in M to lists in X, s ↦ (Γᵢ · sᵢ)ᵢ","status":"ok"},"long":{"text":"The map [[AffineConstructive.implementations.free.com_monoids.eval.act_map_op]] made into a function of sets on the finite sequences over M, using [[AffineConstructive.implementations.free.com_monoids.eval.act_map_is_fun]]. Its domain is the set of finite sequences, where two lists are equal when they agree after padding with zeros; its value is the list of the products Γᵢ · sᵢ, one for each element of Γ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.sum","base":"sum","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"The sum of a list in an additive monoid, X* ⇾ X","status":"ok"},"long":{"text":"The function adding up the entries of a list: x₁ … xₙ is sent to x₁ + ⋯ + xₙ + 0. It is the extension to lists ([[AffineConstructive.implementations.list.tensor.TensorList_to_monoid]]) of the identity of X, with X read as a commutative monoid under addition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.eval","base":"eval","kind":"def","start":64,"body":null,"status":"ok","short":{"text":"Evaluation of coefficients at Γ: the function s ↦ Σᵢ Γᵢ · sᵢ from finite sequences over M to X","status":"ok"},"long":{"text":"Given a list Γ of elements of an additive monoid X and an action of the coefficient monoid M on X, this is the function sending a finite sequence s of coefficients to the linear combination Γ₀ · s₀ + ⋯ + Γₖ₋₁ · sₖ₋₁. It is the composite of [[AffineConstructive.implementations.free.com_monoids.eval.act_map]], which forms the products, with [[AffineConstructive.implementations.free.com_monoids.eval.sum]], which adds them.\n\nWith M the naturals acting by repeated addition, this is the unique monoid morphism from the free commutative monoid on generators to X sending the n-th generator to Γₙ; the file shows it preserves addition and zero ([[AffineConstructive.implementations.free.com_monoids.eval.eval_addmon_mor]]) and sends generators to the elements of Γ ([[AffineConstructive.implementations.free.com_monoids.eval.eval_var]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.eval_spec","base":"eval_spec","kind":"prf","start":65,"body":[66,69],"status":"ok","short":{"text":"Evaluation at x :: Γ of s is x · s₀ plus the evaluation at Γ of the tail of s","status":"ok"},"proof":[{"text":"Fix x, Γ and s. Rewrite the first occurrence of s as its entry at 0 consed onto its tail ([[AffineConstructive.implementations.finite_sequences.FinSeq_tail_spec]]). The evaluation at x :: Γ of that sequence then computes to x · s₀ plus the evaluation at Γ of the tail, so the equation holds.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.eval_pres_0","base":"eval_pres_0","kind":"prf","start":70,"body":[71,77],"status":"ok","short":{"text":"Evaluation at any Γ sends the zero sequence to 0","status":"ok"},"proof":[{"text":"Induction on Γ. At the empty list the evaluation is 0 by definition. For x :: Γ, the induction hypothesis says that the evaluation at Γ of the zero sequence is 0.","status":"ok","from":0,"to":1},{"text":"Unfold by [[AffineConstructive.implementations.free.com_monoids.eval.eval_spec]]. The head of the zero sequence is 0 and its tail is again the zero sequence, so the goal is x · 0 plus the evaluation at Γ of zero equals 0.","status":"ok","from":2,"to":3},{"text":"The induction hypothesis turns the second summand into 0. The action of x preserves zero ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]), so the first summand is 0 as well, and 0 + 0 = 0 by [[AffineConstructive.theory.additive_groups.plus_0_l]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.eval_addmon_mor","base":"eval_addmon_mor","kind":"prf","start":78,"body":[79,98],"status":"ok","short":{"text":"Evaluation at Γ is a morphism of additive monoids: it preserves addition and zero","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.additive_groups.alt_Build_AdditiveMonoid_Morphism]] it suffices to show that evaluation preserves addition and sends 0 to 0. The second is [[AffineConstructive.implementations.free.com_monoids.eval.eval_pres_0]]. The first is proved for all Γ at once, so Γ is generalised again.","status":"ok","from":0,"to":1},{"text":"Induction on Γ. At the empty list every evaluation is 0, so for fixed s and t the claim reads 0 + 0 = 0, which is [[AffineConstructive.theory.additive_groups.plus_0_l]].","status":"ok","from":2,"to":6},{"text":"For x :: Γ, take the induction hypothesis that evaluation at Γ preserves addition, and fix s and t. Unfold all three evaluations by [[AffineConstructive.implementations.free.com_monoids.eval.eval_spec]], each into x times the head plus the evaluation at Γ of the tail.","status":"ok","from":7,"to":9},{"text":"The tail, the entry at 0 and the action of x are additive monoid morphisms. Pushing addition through each of them turns the left side into x · s₀ + x · t₀ plus the evaluation at Γ of tl s + tl t.","status":"ok","from":10,"to":12},{"text":"The induction hypothesis splits the evaluation at Γ of tl s + tl t into the sum of the two evaluations.","status":"ok","from":13,"to":13},{"text":"What remains is a rearrangement of four summands. Reassociate both sides to the left and cancel the common last summand, the evaluation at Γ of tl t. Then reassociate to the right and cancel the common first summand x · s₀. The two middle summands are swapped by commutativity of addition.","status":"ok","from":14,"to":19}]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.v","base":"v","kind":"def","start":101,"body":null,"status":"ok","short":{"text":"The generators of the finite sequences over M: the n-th is the unit vector with 1 at index n","status":"ok"},"long":{"text":"Names the generators of the finite sequences over a monoid M with a unit 1: the n-th generator is the sequence 0, …, 0, 1, 0, … with the 1 at index n. It is defined by primitive recursion ([[AffineConstructive.theory.nno.nno_rec]]), consing n zeros onto the one-entry sequence 1.\n\nWith M the naturals these are the free generators of the free commutative monoid, and [[AffineConstructive.implementations.free.com_monoids.eval.eval_var]] shows that evaluation at Γ sends the n-th of them to the n-th element of Γ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.com_monoids.eval.eval_var","base":"eval_var","kind":"prf","start":104,"body":[105,119],"status":"ok","short":{"text":"If x · 1 = x for all x, evaluation at Γ sends the n-th generator to the n-th element of Γ","status":"ok"},"proof":[{"text":"The claim says that for each index n within the bounds of Γ, the evaluation at Γ of the n-th generator var n is the n-th element of Γ. Induction on Γ: the empty list has no index in bounds. For x :: Γ, with the induction hypothesis for Γ, split n into 0 and a successor.","status":"ok","from":0,"to":2},{"text":"For n = 0, var 0 has head 1 and tail the zero sequence, so the goal is x · 1 plus the evaluation at Γ of zero equals x. The assumption that 1 acts trivially and [[AffineConstructive.implementations.free.com_monoids.eval.eval_pres_0]] reduce this to x + 0 = x, which is [[AffineConstructive.theory.additive_groups.plus_0_r]].","status":"ok","from":3,"to":7},{"text":"For a successor index, an index n + 1 within the bounds of x :: Γ is an index n within the bounds of Γ. Specialise the induction hypothesis at n with that bound.","status":"ok","from":8,"to":11},{"text":"The generator var (n + 1) has head 0 and tail var n, so the goal is x · 0 plus the evaluation at Γ of var n equals the n-th element of Γ. The action of x preserves zero ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]), 0 + y = y by [[AffineConstructive.theory.additive_groups.plus_0_l]], and the specialised induction hypothesis closes the goal.","status":"ok","from":12,"to":14}]},{"name":"AffineConstructive.implementations.free.com_monoids.nat_action","base":"nat_action","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"For x in an additive monoid M, the monoid morphism ℕ ⇾ M sending n to n · x","status":"ok"},"long":{"text":"For an element x of a commutative additive monoid M, the morphism of additive monoids from the naturals to M sending n to n · x = x + ⋯ + x. It is the action of the naturals on an additive monoid ([[AffineConstructive.theory.nat_action.add_nat_act]]) with x fixed as the second argument, so preservation of + and 0 in n comes from the action laws.\n\nSince n · x uses x n times, the action is taken on !M ([[AffineConstructive.theory.set.of_course_set]]), M with its equality affirmed, where an element may be used freely; the counit ([[AffineConstructive.theory.set.of_course_counit]]) brings the result back to M.\n\n[[AffineConstructive.implementations.free.com_monoids.nat_action_1_r]] states that 1 · x = x, the law the evaluation of coefficient sequences needs to send each generator to its entry of the environment. One proof in this file uses the action.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.free.com_monoids.nat_action_1_r","base":"nat_action_1_r","kind":"prf","start":123,"body":[124,126],"status":"ok","short":{"text":"The action of the naturals satisfies 1 · x = x","status":"ok"},"proof":[{"text":"This is the law 1 · x = x for the action of the naturals by multiples ([[AffineConstructive.theory.nat_action.add_nat_act_1_l]]), applied in the of-course set !M. The equality of !M is affirmative, and the action on M is defined through !M.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.free.com_monoids.free_add_mon","base":"free_add_mon","kind":"def","start":127,"body":[128,154],"status":"ok","short":{"text":"The free commutative additive monoid: finite sequences of naturals with pointwise addition","status":"ok"},"proof":[{"text":"A free additive monoid consists of a carrier with its structure and, for every additive monoid and list in it, an evaluation morphism. The carrier is the additive monoid of finite sequences of naturals under pointwise addition.","status":"ok","from":0,"to":5},{"text":"Its decidable equality is the boolean equality test on finite sequences, which is correct because the test on ℕ is. Its generators are the unit sequences, the n-th having 1 in place n and 0 elsewhere.","status":"ok","from":6,"to":13},{"text":"Given an additive monoid M and a list Γ in M, the evaluation morphism sends a sequence s to Σᵢ Γᵢ · sᵢ, with the naturals acting on M by multiples ([[AffineConstructive.implementations.free.com_monoids.nat_action]]).","status":"ok","from":14,"to":20},{"text":"It is an additive monoid morphism by [[AffineConstructive.implementations.free.com_monoids.eval.eval_addmon_mor]].","status":"ok","from":21,"to":23},{"text":"It sends the n-th generator to the n-th element of Γ by [[AffineConstructive.implementations.free.com_monoids.eval.eval_var]]. The hypothesis of that lemma, that 1 acts trivially, is [[AffineConstructive.implementations.free.com_monoids.nat_action_1_r]].","status":"ok","from":24,"to":26}]},{"name":"AffineConstructive.implementations.free.com_monoids.free_additive_monoid_as_free_com_mon","base":"free_additive_monoid_as_free_com_mon","kind":"def","start":155,"body":[156,168],"status":"ok","short":{"text":"A free commutative additive monoid regarded as a free commutative monoid, written multiplicatively","status":"ok"},"proof":[{"text":"The carrier is the additive monoid of F written multiplicatively. The generators and the decidable equality are those of F.","status":"ok","from":0,"to":3},{"text":"Given a commutative monoid M and a list Γ in it, regard M as an additive monoid, so that Γ is a list in an additive monoid.","status":"ok","from":4,"to":6},{"text":"The required monoid morphism is F's evaluation at Γ, relabelled as a morphism of multiplicatively written monoids. It sends the generators to the elements of Γ because F's evaluation does.","status":"ok","from":7,"to":12}]},{"name":"AffineConstructive.implementations.free.com_monoids.free_com_mon","base":"free_com_mon","kind":"def","start":169,"body":null,"status":"ok","short":{"text":"The free commutative monoid on finite sequences of naturals, in multiplicative form","status":"ok"},"long":{"text":"The free commutative monoid obtained from [[AffineConstructive.implementations.free.com_monoids.free_add_mon]] by [[AffineConstructive.implementations.free.com_monoids.free_additive_monoid_as_free_com_mon]]: finite sequences over a model ℕ of the naturals with decidable equality, the operation pointwise addition, the universal map the evaluation of exponents at a list of elements.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.free_monoid":{"page":"../../interfaces/free_monoid.html","short":"Universal property of free monoids and free strong monoids, data separated from laws","summary":"The file states the universal property of a free monoid, separating data from laws. [[FromFreeMonoid]] gives the data: for a map i from a set X into a monoid Xs, an operation extending each map from X into a monoid M to a monoid morphism from Xs to M. [[FreeMonoid]] gives the laws: the extension restricts to the original map along i, and it is the only morphism that does. A parallel pair, [[FromFreeStrongMonoid]] and [[FreeStrongMonoid]], states the same property among monoids with a strong operation; there the extension is a function of sets, so it preserves equality and, being affine, apartness as well. Concrete models, such as lists, use these interfaces to show that they are free monoids."},"AffineConstructive.interfaces.naturals":{"page":"../../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.implementations.list":{"page":"../list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.implementations.nat":{"page":"../nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.interfaces.free.generators":{"page":"../../interfaces/free/generators.html","short":"Sets with generators named by naturals, and evaluation morphisms at an environment","summary":"This file sets up the interface for sets with named generators, which the quoting and normalization tactics use. A [[Var]] structure on a set names its generators var 0, var 1, … by the naturals. [[Var_Morphism]] says that a function sends each var n to the n-th entry of an environment list Γ, which makes it the evaluation at Γ of terms over the generators. The two are bundled: [[var_set]] is a set with named generators, and [[var_morphism]] is the set of functions that respect a given environment, with its equality projected from that of functions. The file states definitions only, no theorems; the free structures built on it supply the instances."},"AffineConstructive.interfaces.free.groups":{"page":"../../interfaces/free/groups.html","short":"Free commutative monoids and abelian groups on countably many generators, for the decision tactics","summary":"The file states the interfaces of three free algebraic structures on countably many generators: commutative additive monoids, commutative monoids written multiplicatively, and abelian groups. Each interface has the same three layers. The first is the algebra with named generators and a correct decision procedure for its equality ([[free_additive_monoid.t]] and its siblings). The second is the type of evaluation morphisms into a target algebra, which send the n-th generator to the n-th entry of an environment Γ. The third is the free structure itself, an algebra with generators together with an evaluation into every target for every environment. Only the existence half of the universal property is required. That half is what the quoting and normalisation tactics need: they decide an equation in the free structure and carry the verdict to the target along the evaluation. The file builds on the generic notions of [[has_var]] and [[var_morphism_t]] from interfaces/free/generators.v. Concrete free algebras in implementations/ meet these interfaces."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.groups":{"page":"../../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.bundled_groups":{"page":"../../theory/bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."},"AffineConstructive.theory.rings":{"page":"../../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.bundled_rings":{"page":"../../theory/bundled_rings.html","short":"Categories of near-rigs, rigs, near-rings and rings, and their forgetful coercions","summary":"The file makes categories of the bundled ring-like structures of `interfaces/bundled_algebra.v`, continuing what `theory/bundled_groups.v` does for monoids and groups. One identity, [[near_rig_id]], and one composition, [[near_rig_morphism_compose]], serve for all six categories, [[𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], [[𝐑𝐢𝐠]], [[𝐂𝐑𝐢𝐠]], [[𝐍𝐞𝐚𝐫𝐑𝐢𝐧𝐠]], [[𝐑𝐢𝐧𝐠]] and [[𝐂𝐑𝐢𝐧𝐠]], because each of these structures has the near-rig morphisms as its morphisms. In every case the category laws hold because the laws hold for the underlying functions, and morphisms are equal when their functions are. The file also gives the forgetful passages from a ring-like structure to its additive monoid or group and to its multiplicative monoid, and from a near-rig morphism to the matching additive and multiplicative monoid morphisms, so that results about groups and monoids apply directly to rings."},"AffineConstructive.theory.nno":{"page":"../../theory/nno.html","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[nno_to_nno_bijective]]). By transport along the comparison with [[Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[nno_ind]], with a base-logic variant [[nno_ind_alt]] and the tactic [[nno_induction]]. It also defines primitive recursion [[nno_rec]] with its base and step equations, and bundles it as a function of its step function [[nno_rec_fun]] when X is a strong set."},"AffineConstructive.theory.naturals":{"page":"../../theory/naturals.html","short":"General theory of the naturals: uniqueness, NNO, commutative rig, cancellation, induction","summary":"This file develops the general theory of the [[Naturals]] interface, which characterises the natural numbers as a near-rig initial among additive monoids with a chosen 1. It shows that any two models are isomorphic through their canonical maps ([[naturals_to_naturals_bijective]]), that a retract of a model is again a model ([[retract_is_nat]]), and that every model is a natural numbers object ([[naturals_nno]]) via the concrete naturals [[Nat]]. On the algebraic side, every model is a commutative rig ([[naturals_is_com_rig]]), its canonical map into any near-rig is a rig morphism ([[naturals_to_mon_rig_mor]]), 1 ≠ 0 holds, addition cancels, there are no zero divisors in the strong sense, and x + y = 0 if and only if x = 0 ⊠ y = 0 ([[zero_sum]]). The file also gives induction principles phrased with 1 + n in place of the successor ([[naturals_ind]], [[naturals_ind_alt]], the tactic [[naturals_induction]]), the distance lemma [[naturals_distance]], and facts about negating the images of naturals in near-rings and rings."},"AffineConstructive.theory.nat_action":{"page":"../../theory/nat_action.html","short":"The action of the naturals on an additive monoid, through its endomorphism near-rig","summary":"This file builds the action of the naturals on an additive monoid X, n · x = x + ⋯ + x. The action comes from the canonical map of ℕ into the endomorphisms of X rather than from a recursion. The endomorphisms X ⇾ X form a right near-rig under pointwise addition and composition. The canonical map [[naturals_to_mon]] into it, uncurried, is the action [[add_nat_act]]. Because that map preserves 0, 1, + and ·, the action satisfies 0 · x = 0, 1 · x = x, (m + n) · x = m · x + n · x and (m · n) · x = m · (n · x). The laws in the second argument come from uniqueness of maps out of the naturals ([[naturals_initial]]). The canonical map factors through a sub-near-rig, so every n acts by an endomorphism of that sub-near-rig. The zero-symmetric part gives n · 0 = 0. When X is commutative, the additive monoid endomorphisms E₊ X form a rig ([[Additive_Monoid_EndFun_Rig]]), which gives n · (x + y) = n · x + n · y."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.implementations.finite_sequences":{"page":"../finite_sequences.html","short":"Finite sequences over a pointed set: zero-padded lists, decidable equality, pointwise addition","summary":"The file defines the finite sequences X* over a set X with a zero. Each one is a list, and two lists are identified when their zero-padded sequences ℕ ⇾ X agree, so trailing zeros do not matter. It provides indexing, cons, tail and the singleton map, together with induction and case analysis carried over from lists. When the equality of X is decidable, so is the equality of X*, and a correct boolean decision procedure on X gives one on X*. Zero-preserving maps X ⇾ Y and X ⊗ Y ⇾ Z extend pointwise to finite sequences. From these, X* inherits a pointwise additive monoid structure from an additive monoid X and an additive group structure from an additive group X, and indexing and tail are additive monoid morphisms."}},"constants":null}</script>

ml"},{"s":1562,"e":1564,"lib":"AffineConstructive.interfaces.prelude","name":"id","kind":"def","local":false,"page":"../interfaces/prelude.html"},{"s":1612,"e":1628,"lib":"AffineConstructive.logic.aprop","name":"aand_aprod_dec_l","kind":"def","local":false,"page":"../logic/aprop.html"},{"s":1678,"e":1695,"lib":"AffineConstructive.interfaces.set","name":"DecidableEquality","kind":"class","local":false,"page":"../interfaces/set.html"},{"s":1704,"e":1713,"lib":"AffineConstructive.interfaces.set","name":"func_make","kind":"constr","local":false,"page":"../interfaces/set.html"},{"s":1722,"e":1752,"lib":"AffineConstructive.implementations.list","name":"dec_prod_to_tensor_list_is_fun","kind":"thm","local":true},{"s":439,"e":443,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":505,"e":509,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":590,"e":593,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1436,"e":1440,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":1500,"e":1504,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":1587,"e":1590,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1602,"e":1605,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[AffineConstructive.implementations.list.tensor.TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[AffineConstructive.implementations.list.prod.ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[AffineConstructive.implementations.list.tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[AffineConstructive.implementations.list.dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic.","short":"Lists over a set: the comparison maps between tensor equality and product equality","items":[{"name":"AffineConstructive.implementations.list.tensor_to_prod_list_is_fun","base":"tensor_to_prod_list_is_fun","kind":"prf","start":5,"body":[6,12],"status":"ok","short":{"text":"The identity on lists preserves equality from tensor lists to product lists","status":"ok"},"proof":[{"text":"Induct on the first list x₁, in the form that writes a nonempty list as a ⊠-free cons [a] ∙ x. The empty list is equal only to itself, so that case is immediate. In the step, the induction hypothesis says that the identity preserves equality out of x, for every list compared with x.","status":"ok","from":0,"to":1},{"text":"Next, case on the second list. A nonempty list is never equal to the empty one, so that case is immediate too. What is left is the case of two conses, [a] ∙ x and [b] ∙ y.","status":"ok","from":2,"to":2},{"text":"Unfolding the two list equalities leaves the following to show: as tensor lists, the equality amounts to a = b ⊠ x = y, and it must imply a = b ∧ x = y as product lists.","status":"ok","from":3,"to":3},{"text":"Specialise the induction hypothesis at y and use it to turn the tensor-list equality x = y into a product-list equality. This leaves a = b ⊠ x = y ⊸ a = b ∧ x = y, which is the fact that the tensor implies the additive conjunction, [[AffineConstructive.logic.aprop.aprod_aand]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.implementations.list.tensor_to_prod_list","base":"tensor_to_prod_list","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The identity on lists as a function from the tensor list set to the product list set","status":"ok"},"long":{"text":"Lists over a set X carry two equalities. In [[AffineConstructive.implementations.list.tensor.TensorList]] X, two lists are equal when their heads are equal and their tails are equal, joined by the tensor ⊠, so each comparison is a separate resource. In [[AffineConstructive.implementations.list.prod.ProdList]] X the same comparisons are joined by the additive ∧. Since P ⊠ Q implies P ∧ Q ([[AffineConstructive.logic.aprop.aprod_aand]]), the tensor equality of two lists implies their product equality, and the identity on underlying lists is a function TensorList X ⇾ ProdList X. Because it is an affine implication, it also carries the contrapositive: lists that are apart as product lists are apart as tensor lists.\n\nThis map is the canonical comparison between the two list constructions. Hints register it as the designated [[AffineConstructive.interfaces.set.Cast]] from tensor lists to product lists, including when either side appears as the carrier of its monoid structure. As a result, a tensor list is converted automatically wherever a product list is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.dec_prod_to_tensor_list_is_fun","base":"dec_prod_to_tensor_list_is_fun","kind":"prf","start":18,"body":[19,25],"status":"ok","short":{"text":"When X has decidable equality, the identity on lists preserves equality from product lists to tensor lists","status":"ok"},"proof":[{"text":"Induct on the first list, with a nonempty list written as a cons [a] ∙ x. The empty case is immediate. In the step, the induction hypothesis says that the identity carries every product-list equality out of x to a tensor-list equality.","status":"ok","from":0,"to":1},{"text":"Case on the second list. A cons is never equal to the empty list, so that case is immediate. What is left is the case of two conses, [a] ∙ x and [b] ∙ y.","status":"ok","from":2,"to":2},{"text":"Unfolded, the goal asks that a = b ∧ x = y, with x = y the product-list equality, imply a = b ⊠ x = y, with x = y the tensor-list equality.","status":"ok","from":3,"to":3},{"text":"Specialise the induction hypothesis at y and use it inside the second factor of the tensor. This leaves a = b ∧ x = y ⊸ a = b ⊠ x = y. That holds because a = b is decidable, and for a decidable first factor the additive conjunction and the tensor agree, [[AffineConstructive.logic.aprop.aand_aprod_dec_l]]. This is the step where decidable equality of X is used.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.implementations.list.dec_prod_to_tensor_list","base":"dec_prod_to_tensor_list","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"The identity on lists as a function from product lists to tensor lists over a set with decidable equality","status":"ok"},"long":{"text":"This is the converse of [[AffineConstructive.implementations.list.tensor_to_prod_list]], available when the equality of X is decidable. In general P ∧ Q does not imply P ⊠ Q. When P is decidable the two connectives agree ([[AffineConstructive.logic.aprop.aand_aprod_dec_l]]). The equality of heads is decidable, so at each position the additive conjunction of the head equality with the tail equality can be strengthened to the tensor. By induction along the lists, product equality implies tensor equality.\n\nTogether with [[AffineConstructive.implementations.list.tensor_to_prod_list]], this shows that for a set with decidable equality the two list equalities coincide, and the identity on lists is an isomorphism between [[AffineConstructive.implementations.list.prod.ProdList]] X and [[AffineConstructive.implementations.list.tensor.TensorList]] X. Unlike the forward map, it is not registered as a cast, because it needs the decidability hypothesis.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.implementations.list.base":{"page":"list/base.html","short":"Lists over a set: recursion, induction, elementwise equality, indexing and map","summary":"This file defines the inductive type of lists over a set, with the empty list, cons, and bracket notation. It provides the basic ways of consuming a list: a recursor [[list_elim]], [[fold_right]], induction for an affine predicate ([[list_induction]]) and for a base-logic predicate ([[list_sinduction]]), and case analysis in both forms ([[list_destruct]], [[list_sdestruct]]). It defines [[list_equiv]], the equality of lists, elementwise and parametrised by the connective that joins the equality of the heads to the equality of the tails. This lets the same type carry the cartesian equality (with ∧) and the tensor equality (with ⊠); the sibling files of product and tensor lists use it that way. Finally it defines bounded indexing [[list_nth]] under the bound condition [[ListInBounds]], and [[list_map]], which preserves that bound."},"AffineConstructive.implementations.list.tensor":{"page":"list/tensor.html","short":"Lists with tensor equality: the free monoid on a set","summary":"This file builds TensorList X: lists on a set X, where two lists are equal when they have the same length and their entries are equal position by position, with those equalities joined by the tensor ⊠. It proves that this equality makes a set, and that the equality of X* is decidable, affirmative or refutative when that of X is. Cons, the singleton map η, a case-analysis map and right fold are given as functions of sets. Concatenation, defined by the fold, makes X* a monoid with the empty list as unit. TensorList_to_monoid extends a map X ⇾ M to a monoid morphism, and [[TensorList_FreeMonoid]] shows that η makes X* the free monoid on X. It is the counterpart of the list construction whose entrywise equalities are joined by the additive ∧."},"AffineConstructive.implementations.list.prod":{"page":"list/prod.html","short":"Lists with additive entrywise equality, as the free strong-operation monoid on a set","summary":"This file makes lists over a set X into the set X*, whose equality compares lists entry by entry with the additive conjunction ∧. It shows that X* is a set, that it is strong when X is, and that it has decidable or refutative equality when X does. It provides cons ([[ProdCons]]), the singleton map η ([[ProdList_unit]]), case analysis ([[ProdList_match]]), recursion ([[ProdList_elim]], [[ProdList_fold_right]]) and induction principles, all as functions of sets. Concatenation makes X* a strong-operation monoid. Folding a map f : X ⇾ M into a strong-operation monoid M gives the extension [[ProdList_to_monoid_mon_mor]]. Together with its uniqueness, this proves [[ProdList_FreeStrongMonoid]]: η exhibits X* as the free strong-operation monoid on X. The file ends with the induced map of lists, [[ProdList_map]]."},"AffineConstructive.interfaces.set":{"page":"../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.free_monoid":{"page":"../interfaces/free_monoid.html","short":"Universal property of free monoids and free strong monoids, data separated from laws","summary":"The file states the universal property of a free monoid, separating data from laws. [[FromFreeMonoid]] gives the data: for a map i from a set X into a monoid Xs, an operation extending each map from X into a monoid M to a monoid morphism from Xs to M. [[FreeMonoid]] gives the laws: the extension restricts to the original map along i, and it is the only morphism that does. A parallel pair, [[FromFreeStrongMonoid]] and [[FreeStrongMonoid]], states the same property among monoids with a strong operation; there the extension is a function of sets, so it preserves equality and, being affine, apartness as well. Concrete models, such as lists, use these interfaces to show that they are free monoids."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.groups":{"page":"../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.bundled_groups":{"page":"../theory/bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

s.list.base","name":"list_map","kind":"def","local":true},{"s":3589,"e":3604,"lib":"AffineConstructive.implementations.list.base","name":"list_sinduction","kind":"def","local":true},{"s":3672,"e":3673,"lib":"AffineConstructive.interfaces.sprop","name":"I","kind":"constr","local":false,"page":"../../interfaces/sprop.html"},{"s":3747,"e":3759,"lib":"AffineConstructive.implementations.list.base","name":"ListInBounds","kind":"class","local":true},{"s":3761,"e":3769,"lib":"AffineConstructive.implementations.list.base","name":"list_map","kind":"def","local":true},{"s":3813,"e":3831,"lib":"AffineConstructive.implementations.list.base","name":"list_map_in_bounds","kind":"thm","local":true},{"s":740,"e":743,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":846,"e":850,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":874,"e":877,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":878,"e":881,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1188,"e":1191,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1238,"e":1241,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1460,"e":1463,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"This file defines the inductive type of lists over a set, with the empty list, cons, and bracket notation. It provides the basic ways of consuming a list: a recursor [[AffineConstructive.implementations.list.base.list_elim]], [[AffineConstructive.implementations.list.base.fold_right]], induction for an affine predicate ([[AffineConstructive.implementations.list.base.list_induction]]) and for a base-logic predicate ([[AffineConstructive.implementations.list.base.list_sinduction]]), and case analysis in both forms ([[AffineConstructive.implementations.list.base.list_destruct]], [[AffineConstructive.implementations.list.base.list_sdestruct]]). It defines [[AffineConstructive.implementations.list.base.list_equiv]], the equality of lists, elementwise and parametrised by the connective that joins the equality of the heads to the equality of the tails. This lets the same type carry the cartesian equality (with ∧) and the tensor equality (with ⊠); the sibling files of product and tensor lists use it that way. Finally it defines bounded indexing [[AffineConstructive.implementations.list.base.list_nth]] under the bound condition [[AffineConstructive.implementations.list.base.ListInBounds]], and [[AffineConstructive.implementations.list.base.list_map]], which preserves that bound.","short":"Lists over a set: recursion, induction, elementwise equality, indexing and map","items":[{"name":"AffineConstructive.implementations.list.base.list","base":"list","kind":"ind","start":8,"body":null,"status":"ok","short":{"text":"Finite lists of elements of a set X, built from the empty list and cons","status":"ok"},"long":{"text":"The inductive type of finite lists over the carrier of an affine set X: a list is either empty, [[AffineConstructive.implementations.list.base.nil]], or an element followed by a list, [[AffineConstructive.implementations.list.base.cons]]. Lists are written with brackets: `[ ]`, `[x]` and `[x; y; …; z]`.\n\nThe type is only a type. The file gives it no equality of its own. An equality on lists is chosen afterwards with [[AffineConstructive.implementations.list.base.list_equiv]], which compares lists entry by entry using the equality of X and combines the comparisons with a connective supplied as a parameter. The same type can therefore carry either an additive or a multiplicative equality.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.implementations.list.base.list_rect","base":"list_rect","kind":"scheme","short":{"text":"The generated recursion principle of lists into types","status":"ok"}},{"name":"AffineConstructive.implementations.list.base.list_ind","base":"list_ind","kind":"scheme","short":{"text":"The generated induction principle of lists into Prop","status":"ok"}},{"name":"AffineConstructive.implementations.list.base.list_rec","base":"list_rec","kind":"scheme","short":{"text":"The generated recursion principle of lists into Set","status":"ok"}},{"name":"AffineConstructive.implementations.list.base.list_sind","base":"list_sind","kind":"scheme","short":{"text":"The generated induction principle of lists into SProp","status":"ok"}},{"name":"AffineConstructive.implementations.list.base.nil","base":"nil","kind":"constr","short":{"text":"The empty list","status":"ok"}},{"name":"AffineConstructive.implementations.list.base.cons","base":"cons","kind":"constr","short":{"text":"Builds a list from a first element and the rest of the list","status":"ok"}}]},{"name":"AffineConstructive.implementations.list.base.list_elim","base":"list_elim","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"Primitive recursion on lists into a set Y: a value for nil and a step for cons","status":"ok"},"long":{"text":"The recursor of lists, taking values in the carrier of a set Y. It takes a value for the empty list and a step function. The step receives the head, the tail and the value already computed for the tail, and returns the value for the whole list. This is the traditional primitive recursion on lists.\n\nThe recursor is an ordinary function of types. It makes no claim about the equality of Y. Facts about how it respects equality are stated separately, where they are needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.base.fold_right","base":"fold_right","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"The right fold of a list, combining entries from the right with f, starting from y₀","status":"ok"},"long":{"text":"The right fold: given f taking a pair of an element of X and an element of Y to an element of Y, a list [x₁; …; xₙ] and a starting value y₀, it computes f(x₁, f(x₂, … f(xₙ, y₀) …)). The empty list returns y₀.\n\nThe combining function takes its two arguments as one element of the cartesian product X ∗ Y. That is the shape of a binary operation in this development, so an operation on a set can be folded over a list directly.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.base.list_induction","base":"list_induction","kind":"prf","start":11,"body":[12,21],"status":"ok","short":{"text":"Induction on lists for an affine predicate: if each step P l ⊸ P (cons x₀ l) holds, P nil implies P l for every l","status":"ok"},"proof":[{"text":"Assume the step P l ⊸ P (cons x₀ l) for every x₀ and l. This is a hypothesis of the base logic, not an affine one, so the proof may use it as often as it needs. Fix a list; it remains to show that P nil implies P of it.","status":"ok","from":0,"to":2},{"text":"Proceed by structural recursion on the list. The recursive call gives the claim for every shorter list, and two cases remain: the empty list and a cons.","status":"ok","from":3,"to":3},{"text":"For the empty list the claim is that P nil implies P nil, which holds by reflexivity.","status":"ok","from":4,"to":5},{"text":"For cons x₀ x, the recursive call at the tail gives P nil ⊸ P x. Composing it with the step at x₀ and x gives P nil ⊸ P (cons x₀ x). The single proof of P nil passes through the chain of implications, so it is used only once.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.implementations.list.base.list_sinduction","base":"list_sinduction","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"Induction on lists for a base-logic predicate: from the empty list and cons to every list","status":"ok"},"long":{"text":"This is the induction principle for lists when the predicate is valued in the base logic `SProp`. If P holds of the empty list, and P of a list gives P of the list with one more element in front, then P holds of every list. The definition is the recursive proof itself, written as a term. It is the base-logic counterpart of [[AffineConstructive.implementations.list.base.list_induction]], which proves an affine statement for all lists.\n\nThe induction principles of the list-based constructions build on it. [[AffineConstructive.implementations.list.tensor.TensorList_sinduction]] and [[AffineConstructive.implementations.list.prod.ProdList_sinduction]] restate it on the sets of lists with tensor and cartesian equality, in terms of their empty list and cons. [[AffineConstructive.implementations.finite_sequences.FinSeq_sinduction]] does the same for finite sequences.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.base.list_destruct","base":"list_destruct","kind":"prf","start":23,"body":[24,29],"status":"ok","short":{"text":"Case analysis on lists for an affine predicate: P nil and P of every cons together imply P of every list","status":"ok"},"proof":[{"text":"Fix a list. It remains to show that the conjunction implies P of that list.","status":"ok","from":0,"to":1},{"text":"Split on whether the list is empty. For the empty list the left conjunct, P nil, is exactly what is needed. The conjunction is additive, so the proof is free to choose that conjunct and discard the other.","status":"ok","from":2,"to":2},{"text":"For cons x₀ x, choose the right conjunct and specialise it first at x₀ and then at x. This gives P (cons x₀ x).","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.implementations.list.base.list_sdestruct","base":"list_sdestruct","kind":"prf","start":30,"body":[31,35],"status":"ok","short":{"text":"Case analysis on lists for a strict predicate: P nil and P of every cons give P of every list","status":"ok"},"proof":[{"text":"Assume P nil and P (cons x₀ x) for every x₀ and x, and fix a list x.","status":"ok","from":0,"to":1},{"text":"Read the goal as the affine proposition that affirms P x. Then [[AffineConstructive.implementations.list.base.list_destruct]], applied to this affirmed predicate, reduces the goal to the additive conjunction of its value at nil and its value at every cons. Each conjunct is one of the two assumptions.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.implementations.list.base.list_equiv_raw","base":"list_equiv_raw","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"Entrywise comparison of two lists, combining the entry equalities with a given connective a","status":"ok"},"long":{"text":"Given a binary connective a on affine propositions, this defines when two lists over X are equal. Two empty lists are equal outright (𝐓). An empty list and a non-empty one are unequal outright (𝐅). Two non-empty lists are compared by applying a to the equality of their heads in X and the comparison of their tails.\n\nThe connective is a parameter so that one definition serves two equalities. With the additive conjunction ∧, the result is the equality of an iterated cartesian product. With the tensor ⊠, it is the equality of an iterated tensor product, in which each entry equality is a separate resource. Because every affine proposition carries its refutation, the comparison is also an apartness: lists of different lengths are apart, and lists of the same length are apart according to the dual of a applied to the entries.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.base.list_equiv","base":"list_equiv","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"The equality on lists given by entrywise comparison with connective a","status":"ok"},"long":{"text":"[[AffineConstructive.implementations.list.base.list_equiv_raw]] packaged as an equality relation on lists, with its two list arguments taken as one pair. It is a definition rather than an instance. A user of lists chooses the connective a, and so chooses which equality the lists carry. Whether the result is an equivalence relation depends on a and is established where the choice is made.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.base.ListInBounds","base":"ListInBounds","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"The strict proposition that n is a valid index into l, that is, n is less than the length of l","status":"ok"},"long":{"text":"The bound condition for indexing: n is an index of l, counting from zero, exactly when l has more than n entries. It is defined by recursion on the list. For the empty list it is false. For a non-empty list, index zero is in bounds, and index n+1 is in bounds when n is in bounds for the tail.\n\nThe condition is a strict proposition and is declared a class, so that [[AffineConstructive.implementations.list.base.list_nth]] can leave its proof to resolution. When the list and the index are concrete, the condition reduces to `True` and a hint supplies its proof. For a mapped list, a further hint reduces the condition to the condition on the original list by [[AffineConstructive.implementations.list.base.list_map_in_bounds]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.base.list_nth","base":"list_nth","kind":"def","start":53,"body":null,"status":"ok","short":{"text":"The entry of l at index n, counting from zero, given that n is in bounds","status":"ok"},"long":{"text":"Indexing into a list: given a list l, an index n and a proof that n is in bounds for l ([[AffineConstructive.implementations.list.base.ListInBounds]]), it returns the n-th entry of l, counting from zero. The proof rules out the empty list, so the function needs no default value. Since the bound is a strict proposition, the result does not depend on which proof is supplied.\n\nThe proof of the bound is an implicit argument found by resolution. For concrete lists and indices, the index can be written without mentioning the bound.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.base.list_map","base":"list_map","kind":"def","start":57,"body":null,"status":"ok","short":{"text":"Applies a function f to every entry of a list","status":"ok"},"long":{"text":"The map of lists: given a function f from X to Y, it sends [x₁; …; xₙ] to [f x₁; …; f xₙ]. f is a plain function of carriers, not a morphism of sets. Respect for equality is a separate matter, treated where the lists carry an equality. Mapping keeps the length of a list, so it keeps indices in bounds ([[AffineConstructive.implementations.list.base.list_map_in_bounds]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.base.list_map_in_bounds","base":"list_map_in_bounds","kind":"prf","start":58,"body":[59,72],"status":"ok","short":{"text":"An index in bounds for l is in bounds for the mapped list list_map f l","status":"ok"},"proof":[{"text":"Proceed by induction on the list l, using [[AffineConstructive.implementations.list.base.list_sinduction]], for the statement that every index in bounds for l is in bounds for its image under the map.","status":"ok","from":0,"to":1},{"text":"No index is in bounds for the empty list, so the base case holds vacuously.","status":"ok","from":2,"to":3},{"text":"For a cons x Γ', split on the index. Index zero is in bounds for every nonempty list, and the image of a cons is again nonempty.","status":"ok","from":4,"to":8},{"text":"For an index m + 1, being in bounds for cons x Γ' means that m is in bounds for Γ'. The induction hypothesis then puts m in bounds for the image of Γ', and this is exactly the condition for m + 1 to be in bounds for the image of the cons.","status":"ok","from":9,"to":13}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.implementations.nat":{"page":"../nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

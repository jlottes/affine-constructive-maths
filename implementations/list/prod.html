 [ easy | tautological ]).\n  change list with prod_list in *.\n  change ((x₀ = y₀ ∧ x = y) ∧ (y₀ = z₀ ∧ y = z) ⊸ (x₀ = z₀ ∧ x = z)).\n  rew (aand_assoc _ _ _). rew <-(aand_assoc (x=y) _ _). rew (aand_com (x=y) _).\n  rew (aand_assoc _ _ _). rew <-(aand_assoc (x₀=y₀) _ _).\n  refine (aand_proper_aimpl _ (IHx y z)).\n  now apply strong_transitivity.\nQed.\nGlobal Hint Extern 2 (StrongSet _*) => simple notypeclasses refine ProdList_is_strong : typeclass_instances.\n\nGlobal Hint Extern 1 (MonUnit _*) => refine nil : typeclass_instances.\nLocal Abbreviation ε := (mon_unit (M:=_*)).\n\nLemma ProdList_cons_is_fun X : @IsFun (X × X*) X* (λ '(x, xs), cons x xs).\nProof. now intros [x₀ x][y₀ y]. Qed.\nDefinition ProdCons {X} : X × X* ⇾ X* := @func_make _ _ _ (ProdList_cons_is_fun X).\nLocal Notation \"x :: y\" := (func_op ProdCons (x, y)) (at level 60, right associativity).\n\nDefinition ProdList_unit {X} : X ⇾ X* := ap2 (ProdCons ∘ tensor_to_prod _ _) ε.\nLocal Abbreviation η := ProdList_unit.\nLocal Notation \"[ x ]\" := (func_op η x).\nGlobal Hint Extern 1 (Cast ?X (?X *)) => refine ProdList_unit : typeclass_instances.\n\nDefinition ProdList_induction {X} (P : X* → Ω) : (∏ x₀ x, P x ⊸ P (x₀ :: x)) → (P ε ⊸ all P) := list_induction P.\nDefinition ProdList_sinduction {X} (P:X* → SProp) : P ε → (∀ x₀ x, P x → P (x₀ :: x)) → ∀ x, P x := list_sinduction P.\n\nLocal Ltac doit P := let x₀ := fresh \"x₀\" in let x := fresh \"x\" in let IHx := fresh \"IHx\" in\n  let y₀ := fresh \"y₀\" in let y := fresh \"y\" in\n  hnf; intros [x y]; revert x y; refine (ProdList_sinduction _ _ _);\n  [| intros x₀ x IHx]; intros [|y₀ y];\n  [ now change (P 𝐓) | now change (P 𝐅) .. |\n    specialize (IHx y); now change (P (x₀ = y₀ ∧ x = y)) ].\nLemma ProdList_DecidableEquality   `{!DecidableEquality   X} : DecidableEquality   X*.  Proof. doit Decidable.   Qed.\nLemma ProdList_RefutativeEquality  `{!RefutativeEquality  X} : RefutativeEquality  X*.  Proof. doit Refutative.  Qed.\nGlobal Hint Extern 2 (DecidableEquality   _*) => simple notypeclasses refine ProdList_DecidableEquality   : typeclass_instances.\nGlobal Hint Extern 2 (RefutativeEquality  _*) => simple notypeclasses refine ProdList_RefutativeEquality  : typeclass_instances.\n\nImport projection_notation.\n\nLocal Instance ProdList_match_is_fun@{u} {X Y:set@{u}} : @IsFun (Y × ((X × X* ) ⇾ Y) ⊗ X* ) Y\n   (λ p, match π₂ p with\n         | nil => π₁ (π₁ p)\n         | cons x l => π₂ (π₁ p) (x, l)\n         end).\nProof. intros [p [|x l]][q [|y l']].\n+ change (p = q ⊠ atrue ⊸ π₁ p = π₁ q). simplify.\n  exact (is_fun (prod_proj1 _ _) _ _).\n+ change (?P ⊸ ?Q) with (p = q ⊠ afalse ⊸ Q). now simplify.\n+ change (?P ⊸ ?Q) with (p = q ⊠ afalse ⊸ Q). now simplify.\n+ let f := constr:( set:( (λ '((y, f), q) : (Y × (X × X* ⇾ Y)) ⊗ (X × X* ), f q)) ) in\n  exact ( is_fun f (p, (x, l)) (q, (y, l')) ).\nQed.\nDefinition ProdList_match@{u} {X Y:set@{u}} := curry (@func_make _ _ _ (@ProdList_match_is_fun X Y)).\n\n\n\nDefinition ProdList_elim_op@{u} {X Y:set@{u}} (f: (X × X*) × Y ⇾ Y) (y:Y) : X* → Y := fix F l :=\nmatch l with\n| nil => y\n| cons x l => f (x, l, F l)\nend.\n\nLocal Instance ProdList_elim_is_fun@{u} {X Y:set@{u}} (f: (X × X*) × Y ⇾ Y) : @IsFun (Y × X*) Y\n  (tuncurry (ProdList_elim_op f)).\nProof. intros [y l][y' l']. unfold_pair_eq.\n  unfold tuncurry, proj1, proj2. revert l l'.\n  refine (list_sinduction _ _ _); [| intros x l IH ];\n  (refine (list_sdestruct _ _ _); [| intros x' l' ]).\n+ now change (y = y' ∧ ε = ε :> X* ⊸ y = y').\n+ change (nil = _) with afalse. now simplify.\n+ change (_ = nil) with afalse. now simplify.\n+ change (ProdList_elim_op f ?y (cons ?x ?l)) with (f (x, l, ProdList_elim_op f y l)).\n  rew <-(is_fun f _ _). apply aand_intro; [ exact (aandr _ _) |].\n  rew <-(IH l'). change (y = y' ∧ (x = x' ∧ l = l' :> X*) ⊸ y = y' ∧ l = l' :> X*).\n  now rew (aandr (x = x') _).\nQed.\n\nDefinition ProdList_elim@{u} {X Y:set@{u}} (f: (X × X*) × Y ⇾ Y) : Y × X* ⇾ Y := @func_make _ _ _ (@ProdList_elim_is_fun X Y f).\n\nDefinition ProdList_fold_right@{u} {X Y:set@{u}} (f: X × Y ⇾ Y) : X* × Y ⇾ Y\n  := ProdList_elim set:(λ '((a, b), c) : (X × X*) × Y, f (a, c)) ∘ prod_swap _ _.\n\n(*\nSection fold_right.\n  Local Instance fold_right_is_fun {X Y} (f: X × Y ⇾ Y) : @IsFun (X* × Y) Y (λ p, fold_right f (π₁ p) (π₂ p)).\n  Proof. intros [x y₀][x' y₀']. unfold proj1, proj2. unfold_pair_eq.\n    revert x x'. refine (ProdList_sinduction _ _ _).\n  + intros [|x₀ x'].\n    * now change (ε = ε :> X* ∧ y₀ = y₀' ⊸ y₀ = y₀').\n    * change (ε = cons x₀ x') with afalse. now rew (aand_false_l _).\n  + intros x₀ x IH [|x₀' x'].\n    * change (x₀ :: x = nil) with afalse. now rew (aand_false_l _).\n    * change ( (x₀ = x₀' ∧ x = x') ∧ y₀ = y₀' ⊸ f (x₀, fold_right f x y₀) = f (x₀', fold_right f x' y₀') ).\n      rew [(aand_assoc _ _ _) | <- (is_fun f _ _)].\n      refine (aand_proper_aimpl _ _); [ refl | exact (IH _) ].\n  Qed.\n\n  Definition ProdList_fold_right {X Y} (f: X × Y ⇾ Y) : X* × Y ⇾ Y := @make_fun _ _ _ (fold_right_is_fun f).\nEnd fold_right.\n*)\n\nDefinition ProdList_concat {X} : X* × X* ⇾ X* := ProdList_fold_right ProdCons.\nGlobal Hint Extern 1 (SgOp _*) => refine (ProdList_concat ∘ tensor_to_prod _ _) : typeclass_instances.\n\nDefinition ProdList_induction_alt `(P:X* → Ω) : (∏ x₀ x, P x ⊸ P ([x₀] ∙ x)) → (P ε ⊸ all P)\n:= ProdList_induction P.\nDefinition ProdList_sinduction_alt `(P:X* → SProp) : P ε → (∀ x₀ x, P x → P ([x₀] ∙ x)) → ∀ x, P x\n:= ProdList_sinduction P.\n\nLemma ProdList_sdestruct `(P:X* → SProp) : P ε → (∀ x₀ x, P ([x₀] ∙ x)) → ∀ x, P x.\nProof. intros P0 Ps [|??]; trivial. exact (Ps _ _). Qed.\n\n\nLocal Instance ProdList_concat_assoc X: Associative (X:=X*) (∙).\nProof. refine (ProdList_sinduction_alt _ _ _); [ easy | intros x₀ x IHx ].\n  intros y z. change ( [x₀] ∙ (x ∙ (y ∙ z)) = [x₀] ∙ (x ∙ y ∙ z) ).\n  now rew (IHx y z).\nQed.\n\nLocal Instance ProdList_concat_left_id X: LeftIdentity (X:=X*) (∙) ε.\nProof. now hnf. Qed.\n\nLocal Instance ProdList_concat_right_id X: RightIdentity (X:=X*) (∙) ε.\nProof. refine (ProdList_sinduction_alt _ _ _); [ easy | intros x₀ x IHx ].\n  change ([x₀] ∙ (x ∙ ε) = [x₀] ∙ x). now rew IHx.\nQed.\n\nLocal Instance ProdList_is_str_monoid {X} : StrongOpMonoid X*.\nProof. split; [ now apply alt_Build_Monoid | exact _ ]. Qed.\nGlobal Hint Extern 2 (StrongOpMonoid _*) => simple notypeclasses refine ProdList_is_str_monoid : typeclass_instances.\nGlobal Hint Extern 2 (Monoid _*) => simple notypeclasses refine ProdList_is_str_monoid : typeclass_instances.\nGlobal Hint Extern 2 (SemiGroup _*) => simple notypeclasses refine ProdList_is_str_monoid : typeclass_instances.\n\nCanonical Structure ProdList_mon (X:set) := make_monoid X*.\nCanonical Structure ProdList_str_mon (X:set) := make_strong_op_monoid X*.\n\nGlobal Hint Extern 1 (Cast ?X (strong_op_monoid_car (ProdList_str_mon ?X))) => refine ProdList_unit : typeclass_instances.\n\nSection to_monoid.\n  Universes u.\n  Context {X:set@{u}} {M:strong_op_monoid@{u}}.\n  Abbreviation e := (mon_unit (M:=strong_op_monoid_car M)).\n\n  Definition ProdList_to_monoid_op (f:X ⇾ M) : X* ⇾ M :=\n    set:(λ x, ProdList_fold_right (set:(λ '(a, b) : X × M, f a ∙ b)) (x, e)).\n  Local Abbreviation ϕ := ProdList_to_monoid_op.\n\n  Local Instance ProdList_to_monoid_is_fun : IsFun ϕ.\n  Proof. intros f g. change (f = g ⊸ ∏ x, ϕ f x = ϕ g x). rew <-all_adj.\n    refine (ProdList_sinduction_alt _ _ _); [| intros a x IH ].\n  + change (f = g ⊸ e = e). now rew (aiff_is_true (_ : e = e)).\n  + change (f = g ⊸ f a ∙ ϕ f x = g a ∙ ϕ g x).\n    rew <-( (_ : StrongOp (∙)) (f a, ϕ f x) (g a, ϕ g x) ); apply aand_intro; trivial.\n    exact (all_lb _ a).\n  Qed.\n\n  Definition ProdList_to_monoid : _ ⇾ _ := func_make ϕ.\n\n  Local Notation \"X ⟶ Y\" := (strong_op_monoid_morphism X Y).\n\n  Section with_f.\n    Context (f: X ⇾ M).\n    Local Abbreviation g := (ProdList_to_monoid_op f).\n\n    Lemma ProdList_to_monoid_is_mon_mor : Monoid_Morphism g.\n    Proof. apply alt_Build_Monoid_Morphism; [| refl].\n      refine (ProdList_sinduction_alt _ _ _); [| intros a x IH ]; intros y.\n    + change (g y = e ∙ g y). now group_simplify.\n    + change (f a ∙ g (x ∙ y) = (f a ∙ g x) ∙ g y).\n      rew (IH y). now group_simplify.\n    Qed.\n\n    Lemma ProdList_to_monoid_spec : f = g ∘ η.\n    Proof. intros a. change (f a = f a ∙ e). now group_simplify. Qed.\n\n    Lemma ProdList_to_monoid_unique (h:X* ⟶ M) : f = h ∘ η → h = g :> (X* ⇾ M).\n    Proof. pose proof ProdList_to_monoid_is_mon_mor.\n      intros E. refine (ProdList_sinduction_alt _ _ _).\n    + now rew (preserves_unit _).\n    + intros x₀ x IH. rew (preserves_sg_op _ _ _).\n      now rew [ IH | <-(E x₀ : f x₀ = h (η x₀)) | <-(ProdList_to_monoid_spec x₀ : f x₀ = g (η x₀)) ].\n    Qed.\n  End with_f.\n\n  Definition ProdList_to_monoid_mon_mor@{} : (X ⇾ M) ⇾ (X* ⟶ M).\n  Proof. simple refine (func_make (λ f, make_monoid_morphism (ProdList_to_monoid_op f))).\n  + exact (ProdList_to_monoid_is_mon_mor f).\n  + exact ProdList_to_monoid_is_fun.\n  Defined.\nEnd to_monoid.\nCanonical ProdList_to_monoid.\nGlobal Hint Extern 1 (FromFreeStrongMonoid (cast ?X (ProdList ?X))) => refine (@ProdList_to_monoid_mon_mor _) : typeclass_instances.\nGlobal Hint Extern 1 (FromFreeStrongMonoid (cast ?X (strong_op_monoid_car (ProdList_str_mon ?X)))) => refine (@ProdList_to_monoid_mon_mor _) : typeclass_instances.\nGlobal Hint Extern 1 (FromFreeStrongMonoid ProdList_unit) => refine (@ProdList_to_monoid_mon_mor _) : typeclass_instances.\n\nLemma ProdList_FreeStrongMonoid {X} : FreeStrongMonoid (X:=X) η.\nProof. split; intros M f.\n+ apply ProdList_to_monoid_spec.\n+ apply ProdList_to_monoid_unique.\nQed.\n\nGlobal Hint Extern 2 (FreeStrongMonoid (cast ?X (ProdList ?X))) => notypeclasses refine ProdList_FreeStrongMonoid : typeclass_instances.\nGlobal Hint Extern 2 (FreeStrongMonoid (cast ?X (strong_op_monoid_car (ProdList_str_mon ?X)))) => notypeclasses refine ProdList_FreeStrongMonoid : typeclass_in e":"../../tactics/easy.html"},{"s":3014,"e":3017,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3145,"e":3149,"lib":"AffineConstructive.implementations.list.prod","name":"doit","kind":"ltac","local":true},{"s":3263,"e":3267,"lib":"AffineConstructive.implementations.list.prod","name":"doit","kind":"ltac","local":true},{"s":3853,"e":3861,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":3948,"e":3951,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3952,"e":3960,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":4008,"e":4011,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4012,"e":4020,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":4580,"e":4594,"lib":"AffineConstructive.theory.set","name":"unfold_pair_eq","kind":"ltac","local":false,"page":"../../theory/set.html"},{"s":4752,"e":4755,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4828,"e":4831,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4832,"e":4840,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":4874,"e":4877,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4878,"e":4886,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":4977,"e":4980,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5043,"e":5046,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5127,"e":5130,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5131,"e":5134,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6993,"e":6997,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":7089,"e":7092,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7093,"e":7096,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":7191,"e":7194,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7327,"e":7331,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":7391,"e":7394,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7395,"e":7398,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":7489,"e":7492,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8575,"e":8578,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8682,"e":8685,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8686,"e":8689,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8770,"e":8773,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9210,"e":9214,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":9323,"e":9326,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9327,"e":9341,"lib":"AffineConstructive.theory.groups","name":"group_simplify","kind":"ltac","local":false,"page":"../../theory/groups.html"},{"s":9401,"e":9404,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9413,"e":9416,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9417,"e":9431,"lib":"AffineConstructive.theory.groups","name":"group_simplify","kind":"ltac","local":false,"page":"../../theory/groups.html"},{"s":9535,"e":9538,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9539,"e":9553,"lib":"AffineConstructive.theory.groups","name":"group_simplify","kind":"ltac","local":false,"page":"../../theory/groups.html"},{"s":9756,"e":9759,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9760,"e":9763,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9806,"e":9809,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9841,"e":9844,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9845,"e":9848,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file makes lists over a set X into the set X*, whose equality compares lists entry by entry with the additive conjunction ∧. It shows that X* is a set, that it is strong when X is, and that it has decidable or refutative equality when X does. It provides cons ([[AffineConstructive.implementations.list.prod.ProdCons]]), the singleton map η ([[AffineConstructive.implementations.list.prod.ProdList_unit]]), case analysis ([[AffineConstructive.implementations.list.prod.ProdList_match]]), recursion ([[AffineConstructive.implementations.list.prod.ProdList_elim]], [[AffineConstructive.implementations.list.prod.ProdList_fold_right]]) and induction principles, all as functions of sets. Concatenation makes X* a strong-operation monoid. Folding a map f : X ⇾ M into a strong-operation monoid M gives the extension [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_mon_mor]]. Together with its uniqueness, this proves [[AffineConstructive.implementations.list.prod.ProdList_FreeStrongMonoid]]: η exhibits X* as the free strong-operation monoid on X. The file ends with the induced map of lists, [[AffineConstructive.implementations.list.prod.ProdList_map]].","short":"Lists with additive entrywise equality, as the free strong-operation monoid on a set","items":[{"name":"AffineConstructive.implementations.list.prod.prod_list","base":"prod_list","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The type of lists over a set X, kept apart so it can be given the additive list equality","status":"ok"},"long":{"text":"The underlying type of finite lists of elements of X, under its own name. The equality resolution finds for this name is [[AffineConstructive.implementations.list.base.list_equiv]] with the additive conjunction [[AffineConstructive.interfaces.aprop.aand]]. The empty list equals only itself, an empty list and a cons are unequal, and cons x₀ x = cons y₀ y means x₀ = y₀ ∧ x = y. The separate name lets the same lists carry other equalities elsewhere, for example one with the multiplicative conjunction, without the two being confused.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.prod_list_is_set","base":"prod_list_is_set","kind":"inst","start":9,"body":[10,27],"status":"ok","short":{"text":"Entrywise additive equality of lists is reflexive, symmetric and transitive","status":"ok"},"proof":[{"text":"Being a set means the equality is reflexive, symmetric and transitive. The proof unfolds each of the three properties to a statement about [[AffineConstructive.implementations.list.base.list_equiv]], the entrywise comparison with the additive conjunction.","status":"ok","from":0,"to":1},{"text":"Reflexivity follows by induction on the list. The empty list is equal to itself trivially. For a cons, the head is equal to itself by reflexivity in X, and the tail by the induction hypothesis.","status":"ok","from":2,"to":3},{"text":"Symmetry follows by induction on x, with case analysis on y. When one list is empty and the other is not, their equality is falsity, and these cases are immediate. For two cons lists the goal becomes x₀ = y₀ ∧ x = y ⊸ y₀ = x₀ ∧ y = x.","status":"ok","from":4,"to":7},{"text":"Both sides are additive conjunctions, so each conjunct is handled separately. The tails are dealt with by the induction hypothesis at y, and the heads by symmetry of equality in X.","status":"ok","from":8,"to":9},{"text":"Transitivity follows by induction on x, with case analysis on y and z. Every case that mixes empty and non-empty lists involves a falsity and is immediate. When all three lists are cons lists, the goal is to obtain x₀ = z₀ ∧ x = z from (x₀ = y₀ ∧ x = y) ⊠ (y₀ = z₀ ∧ y = z).","status":"ok","from":10,"to":13},{"text":"The two hypotheses are joined by a tensor, and each one is an additive conjunction. By [[AffineConstructive.logic.aprop.aand_aprod_swap]], the hypothesis implies (x₀ = y₀ ⊠ y₀ = z₀) ∧ (x = y ⊠ y = z). This pairs the head equalities with each other and the tail equalities with each other, so each pair can go into its own transitivity step.","status":"ok","from":14,"to":14},{"text":"Conjunct by conjunct: the tails follow from the induction hypothesis at y and z, and the heads by transitivity in X.","status":"ok","from":15,"to":17}]},{"name":"AffineConstructive.implementations.list.prod.ProdList","base":"ProdList","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"The set X* of lists over X with entrywise additive equality","status":"ok"},"long":{"text":"The set of finite lists of elements of X, written X*. Two lists are equal when they have the same length and their entries are pairwise equal, the comparisons joined by the additive ∧. Because the connective is additive, a cons is determined by a pair in the cartesian product X × X*. This is why concatenation turns out to be a strong operation and X* the free strong-operation monoid on X ([[AffineConstructive.implementations.list.prod.ProdList_FreeStrongMonoid]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_is_strong","base":"ProdList_is_strong","kind":"prf","start":30,"body":[31,43],"status":"ok","short":{"text":"If X is a strong set, so is X*","status":"ok"},"proof":[{"text":"Strength asks for transitivity in which the two equalities are joined by the additive conjunction: x = y ∧ y = z ⊸ x = z.","status":"ok","from":0,"to":1},{"text":"The proof goes by induction on x, with case analysis on y and z. The cases that mix empty and non-empty lists are closed by computation and propositional reasoning. For three cons lists, the hypothesis is (x₀ = y₀ ∧ x = y) ∧ (y₀ = z₀ ∧ y = z), and the goal is x₀ = z₀ ∧ x = z.","status":"ok","from":2,"to":4},{"text":"Every connective in the hypothesis is additive, so it can be reassociated and commuted freely. The result is (x₀ = y₀ ∧ y₀ = z₀) ∧ (x = y ∧ y = z), with the head equalities grouped together and the tail equalities grouped together.","status":"ok","from":5,"to":9},{"text":"Conjunct by conjunct: the tails follow from the induction hypothesis at y and z, and the heads by [[AffineConstructive.interfaces.aprop.strong_transitivity]] in X.","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.implementations.list.prod.ε","base":"ε","kind":"abbrev","start":46,"body":null,"status":"ok","short":{"text":"The empty list, as the unit of X*","status":"ok"},"long":{"text":"Local name for the monoid unit of X*, which resolution finds to be the empty list [[AffineConstructive.implementations.list.base.nil]]. It serves as the base case of the induction principles and as the unit of the monoid of lists.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_cons_is_fun","base":"ProdList_cons_is_fun","kind":"prf","start":47,"body":[48,50],"status":"ok","short":{"text":"Cons preserves equality as a map from the cartesian product X × X* to X*","status":"ok"},"proof":[{"text":"Take two pairs (x₀, x) and (y₀, y). By definition, two cons lists are equal when x₀ = y₀ ∧ x = y. This is exactly the cartesian equality of the two pairs, so the implication holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.prod.ProdCons","base":"ProdCons","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"Cons as a function X × X* ⇾ X*, written x :: l","status":"ok"},"long":{"text":"Prepending an element to a list, as a function between sets. Its domain is the cartesian product: the equality of x :: l and y :: l' is by definition x = y ∧ l = l', which is exactly the cartesian equality of the pairs. So ProdCons is a function out of X × X*, and not only out of the tensor product.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_unit","base":"ProdList_unit","kind":"def","start":53,"body":null,"status":"ok","short":{"text":"The singleton map η : X ⇾ X*, sending x to the one-element list [x]","status":"ok"},"long":{"text":"The unit η of the free construction: it sends x to x :: ε. It is built from [[AffineConstructive.implementations.list.prod.ProdCons]] by fixing the tail at the empty list. The free property [[AffineConstructive.implementations.list.prod.ProdList_FreeStrongMonoid]] is stated relative to this map, and it is the designated cast from X into X*.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.η","base":"η","kind":"abbrev","start":54,"body":null,"status":"ok","short":{"text":"The singleton map X ⇾ X*, [[AffineConstructive.implementations.list.prod.ProdList_unit]]","status":"ok"},"long":{"text":"Local name for [[AffineConstructive.implementations.list.prod.ProdList_unit]], the unit of the free strong-operation monoid. Its value at x is written [x].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_induction","base":"ProdList_induction","kind":"def","start":57,"body":null,"status":"ok","short":{"text":"Induction on X* for an affine predicate, with steps P x ⊸ P (x₀ :: x)","status":"ok"},"long":{"text":"Affine induction on lists, a restatement of [[AffineConstructive.implementations.list.base.list_induction]] for X*. If for all x₀ and x the implication P x ⊸ P (x₀ :: x) holds, then P ε implies P x for every list x. The conclusion is a single affine implication into a universal quantifier. So it also carries the dual reading: a refutation of P at some list yields a refutation of P ε.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_sinduction","base":"ProdList_sinduction","kind":"def","start":58,"body":null,"status":"ok","short":{"text":"Induction on X* for a base-logic predicate: from P ε and P x → P (x₀ :: x), P holds everywhere","status":"ok"},"long":{"text":"Induction on lists for a predicate valued in SProp, where the predicate is a base-logic statement rather than an affine one. It is [[AffineConstructive.implementations.list.base.list_sinduction]] restated for X*, with the empty list written as the monoid unit ε and the step written with [[AffineConstructive.implementations.list.prod.ProdCons]]. From P ε and the steps P x → P (x₀ :: x), P holds of every list.\n\nThe variant [[AffineConstructive.implementations.list.prod.ProdList_sinduction_alt]], whose step is written with the monoid operation, is built on it. So is the tactic [[AffineConstructive.implementations.list.prod.doit]], which uses it to prove that a property of the equality of X passes to the equality of X*.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.doit","base":"doit","kind":"ltac","start":59,"body":null,"status":"ok","short":{"text":"Proves that equality of X* has a property P (decidable, refutative) given it for X","status":"ok"},"long":{"text":"Proves that every equality x = y between lists has the property P, which is passed as an argument. The tactic takes the pair of lists and goes by induction on the first and case analysis on the second, giving four cases. When both lists are empty, the equality is truth, and P 𝐓 is closed by resolution. When exactly one is empty, the equality is falsity, and P 𝐅 is closed likewise. When both are cons cells, the equality is x₀ = y₀ ∧ x = y. Here P holds of x₀ = y₀ by the assumption on X and of the tails by the induction hypothesis, and resolution combines the two through the conjunction. The file uses it with P being Decidable and Refutative. Both proofs have exactly this shape and rely on P being closed under 𝐓, 𝐅 and ∧.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_DecidableEquality","base":"ProdList_DecidableEquality","kind":"prf","start":60,"body":[61,63],"status":"ok","short":{"text":"If equality on X is decidable, so is equality on X*","status":"ok"},"proof":[{"text":"The proof goes by induction on both lists ([[AffineConstructive.implementations.list.prod.ProdList_sinduction]]). Each case of the equality is truth, falsity, or the additive conjunction of an equality in X with an equality of shorter lists. Each of these is decidable, the conjunction by [[AffineConstructive.logic.aprop.aand_decidable]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_RefutativeEquality","base":"ProdList_RefutativeEquality","kind":"prf","start":64,"body":[65,67],"status":"ok","short":{"text":"If equality on X is refutative, so is equality on X*","status":"ok"},"proof":[{"text":"The proof goes by induction on both lists ([[AffineConstructive.implementations.list.prod.ProdList_sinduction]]). Each case of the equality is truth, falsity, or the additive conjunction of an equality in X with an equality of shorter lists. Truth and falsity are decidable and therefore refutative, and the conjunction is refutative by [[AffineConstructive.logic.aprop.aand_refutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_match_is_fun","base":"ProdList_match_is_fun","kind":"inst","start":71,"body":[72,86],"status":"ok","short":{"text":"Case analysis on a list preserves equality, the case data paired multiplicatively with the list","status":"ok"},"proof":[{"text":"Take two arguments, each a pair of case data and a list, and split on whether each list is empty or a cons.","status":"ok","from":0,"to":1},{"text":"Both lists are empty. The equality of the arguments is p = q ⊠ 𝐓, which simplifies to p = q. Both results are the first components of the case data, and the first projection preserves equality.","status":"ok","from":2,"to":5},{"text":"One list is empty and the other is not. Their equality is falsity, so the hypothesis is p = q ⊠ 𝐅. This is false, and the implication holds.","status":"ok","from":6,"to":8},{"text":"The symmetric mismatched case is handled the same way.","status":"ok","from":9,"to":11},{"text":"Both lists are cons lists. Each result applies the function in the case data to the head-and-tail pair. Evaluation ((y, f), q) ↦ f q is a function on the tensor product (Y × (X × X* ⇾ Y)) ⊗ (X × X*), and it preserves equality ([[AffineConstructive.interfaces.set.is_fun]]). Its domain equality is the equality of the case data ⊠ the equality of the pairs, which is the hypothesis. The tensor is what this needs: the function and its argument each use their own equality once.","status":"ok","from":12,"to":14}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_match","base":"ProdList_match","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"Case analysis as a function Y × (X × X* ⇾ Y) ⇾ X* ⇾ Y","status":"ok"},"long":{"text":"Case analysis on lists, packaged as a function between sets: the curried form of [[AffineConstructive.implementations.list.prod.ProdList_match_is_fun]]. Given a value for the empty list and a function for a cons, it returns the function on X* that analyses its argument by cases. Being a function in the case data as well, it can be used inside constructions that must themselves preserve equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_elim_op","base":"ProdList_elim_op","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"Primitive recursion on lists: ε gives y, x :: l gives f (x, l, F l)","status":"ok"},"long":{"text":"The recursor on lists, as a plain map. Given a step function f from (X × X*) × Y to Y and a starting value y, it sends ε to y, and x :: l to f applied to x, l and the value already computed for l. This is the operation underlying [[AffineConstructive.implementations.list.prod.ProdList_elim]], which proves that it preserves equality in y and the list together.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_elim_is_fun","base":"ProdList_elim_is_fun","kind":"inst","start":89,"body":[90,111],"status":"ok","short":{"text":"The recursor preserves the cartesian equality of its starting value and its list","status":"ok"},"proof":[{"text":"Take two pairs (y, l) and (y', l'). Their equality is y = y' ∧ l = l'. The goal is that the recursion from y along l equals the recursion from y' along l'.","status":"ok","from":0,"to":3},{"text":"The proof goes by induction on l, with an induction hypothesis that holds for every l', followed by case analysis on l'.","status":"ok","from":4,"to":5},{"text":"Both lists are empty. Both results are the starting values, so the left conjunct y = y' is enough.","status":"ok","from":6,"to":7},{"text":"In the two mismatched cases, the equality of the lists is falsity. The hypothesis y = y' ∧ 𝐅 is then false, and the implication holds.","status":"ok","from":8,"to":13},{"text":"Both lists are cons lists. Each result is f applied to the head, the tail and the recursive value. Because f preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), it suffices to show the two triples are equal.","status":"ok","from":14,"to":16},{"text":"The equality of the triples is an additive conjunction, so the hypothesis may be used for each conjunct. The equality of (x, l) and (x', l') is the equality of the cons lists, the right conjunct of the hypothesis. What remains is the equality of the recursive values.","status":"ok","from":17,"to":17},{"text":"The induction hypothesis at l' reduces this to y = y' ∧ l = l'. The hypothesis is y = y' ∧ (x = x' ∧ l = l'), and it gives this once the head equality x = x' is dropped.","status":"ok","from":18,"to":21}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_elim","base":"ProdList_elim","kind":"def","start":112,"body":null,"status":"ok","short":{"text":"Primitive recursion on X* as a function Y × X* ⇾ Y","status":"ok"},"long":{"text":"The recursor [[AffineConstructive.implementations.list.prod.ProdList_elim_op]] packaged as a function between sets. For a step function f, it sends the starting value y and a list to the result of the recursion. The domain is the cartesian product Y × X*, as [[AffineConstructive.implementations.list.prod.ProdList_elim_is_fun]] shows, so starting value and list may share a hypothesis additively. Right folds, and with them concatenation, are defined from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_fold_right","base":"ProdList_fold_right","kind":"def","start":113,"body":null,"status":"ok","short":{"text":"Right fold: a function X × Y ⇾ Y gives X* × Y ⇾ Y","status":"ok"},"long":{"text":"The right fold of a list with a function f from X × Y to Y. It sends ([x₁, …, xₙ], y) to f (x₁, f (x₂, … f (xₙ, y))). It is [[AffineConstructive.implementations.list.prod.ProdList_elim]] with a step function that ignores the tail, composed with the swap of the two factors. Both domains are cartesian products, so f only needs to preserve the additive equality of its pairs. Concatenation ([[AffineConstructive.implementations.list.prod.ProdList_concat]]) and the extension of a function into a monoid ([[AffineConstructive.implementations.list.prod.ProdList_to_monoid_op]]) are right folds.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_concat","base":"ProdList_concat","kind":"def","start":114,"body":null,"status":"ok","short":{"text":"Concatenation of lists, X* × X* ⇾ X*","status":"ok"},"long":{"text":"Concatenation, the right fold of [[AffineConstructive.implementations.list.prod.ProdCons]]: it prepends the entries of the first list, in order, to the second. Its domain is the cartesian product, which makes it a strong operation: it preserves the additive equality of pairs, not only the tensor equality. Composed with the passage from X* ⊗ X* to X* × X*, it is the monoid operation ∙ of X*.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_induction_alt","base":"ProdList_induction_alt","kind":"def","start":116,"body":null,"status":"ok","short":{"text":"Induction on X* for an affine predicate, with the step stated as P x ⊸ P ([x₀] ∙ x)","status":"ok"},"long":{"text":"[[AffineConstructive.implementations.list.prod.ProdList_induction]] with the inductive step stated as P x ⊸ P ([x₀] ∙ x). Here the list x₀ :: x is written as the product of the singleton [x₀] with x in the monoid X*. The product reduces to x₀ :: x by computation, so this is the same principle with its step phrased in terms of the monoid operation: if every step holds, P ε implies P x for every list x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_sinduction_alt","base":"ProdList_sinduction_alt","kind":"def","start":117,"body":null,"status":"ok","short":{"text":"Induction on X* in the base logic, with the step written [x₀] ∙ x","status":"ok"},"long":{"text":"[[AffineConstructive.implementations.list.prod.ProdList_sinduction]] with the inductive step stated for [x₀] ∙ x, the product of the singleton [x₀] with x, instead of x₀ :: x. The two agree by computation, so this is the same principle with its step phrased in terms of the monoid operation of X*. It is used in eight proofs, in this file and in `implementations.finite_sequences`.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_sdestruct","base":"ProdList_sdestruct","kind":"prf","start":118,"body":[119,122],"status":"ok","short":{"text":"Case analysis on X*: P ε and P ([x₀] ∙ x) for all x₀, x give P of every list","status":"ok"},"proof":[{"text":"Take a list and split on its form. The empty list is ε, and the case for it is P ε. A cons list with head s and tail l is [s] ∙ l, and the second hypothesis covers it.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_concat_assoc","base":"ProdList_concat_assoc","kind":"inst","start":123,"body":[124,129],"status":"ok","short":{"text":"Concatenation of lists is associative","status":"ok"},"proof":[{"text":"The proof goes by induction on the first list in the form [x₀] ∙ x ([[AffineConstructive.implementations.list.prod.ProdList_sinduction_alt]]). For the empty list, both sides reduce to y ∙ z.","status":"ok","from":0,"to":1},{"text":"Fix y and z. Concatenation with [x₀] ∙ x on the left computes to [x₀] ∙ (x ∙ …), so the goal is [x₀] ∙ (x ∙ (y ∙ z)) = [x₀] ∙ (x ∙ y ∙ z). The induction hypothesis rewrites the inner part, and the two sides then coincide.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_concat_left_id","base":"ProdList_concat_left_id","kind":"inst","start":130,"body":[131,133],"status":"ok","short":{"text":"The empty list is a left identity for concatenation","status":"ok"},"proof":[{"text":"Concatenation with ε on the left computes to the list itself, so the equation holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_concat_right_id","base":"ProdList_concat_right_id","kind":"inst","start":134,"body":[135,139],"status":"ok","short":{"text":"The empty list is a right identity for concatenation","status":"ok"},"proof":[{"text":"Induction on the list, with the inductive step written as a singleton [x₀] concatenated with a shorter list x ([[AffineConstructive.implementations.list.prod.ProdList_sinduction_alt]]). For the empty list, ε ∙ ε reduces to ε. What remains is the step: [x₀] ∙ x ∙ ε = [x₀] ∙ x, given x ∙ ε = x.","status":"ok","from":0,"to":1},{"text":"Concatenation computes on its first argument, so the left side is [x₀] ∙ (x ∙ ε). Rewriting x ∙ ε to x by the induction hypothesis closes the goal.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_is_str_monoid","base":"ProdList_is_str_monoid","kind":"inst","start":140,"body":[141,143],"status":"ok","short":{"text":"X* with concatenation and the empty list is a strong-operation monoid","status":"ok"},"proof":[{"text":"The monoid structure comes from associativity of concatenation and the two identity laws for ε, through [[AffineConstructive.theory.groups.alt_Build_Monoid]]. That the operation is strong is already known for X*.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_mon","base":"ProdList_mon","kind":"def","start":147,"body":null,"status":"ok","short":{"text":"X* as a bundled monoid","status":"ok"},"long":{"text":"The monoid of lists over X under concatenation, as an object packing carrier, unit, operation and laws. It is the form in which X* appears where a monoid is expected as an object.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_str_mon","base":"ProdList_str_mon","kind":"def","start":148,"body":null,"status":"ok","short":{"text":"X* as a bundled strong-operation monoid","status":"ok"},"long":{"text":"The monoid of lists over X under concatenation, as an object of strong-operation monoids. The universal property is stated in terms of this object: morphisms out of it are the extensions given by [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_mon_mor]], and [[AffineConstructive.implementations.list.prod.ProdList_map]] is a morphism between two such objects.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.e","base":"e","kind":"abbrev","start":153,"body":null,"status":"ok","short":{"text":"The unit of the target monoid M","status":"ok"},"long":{"text":"Local name, inside the section building the extension, for the unit element of the strong-operation monoid M. It is the value of the extension at the empty list.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_to_monoid_op","base":"ProdList_to_monoid_op","kind":"def","start":154,"body":null,"status":"ok","short":{"text":"Extends f : X ⇾ M to X* ⇾ M, sending [x₁, …, xₙ] to f x₁ ∙ … ∙ f xₙ ∙ e","status":"ok"},"long":{"text":"The extension of a function f from X into a strong-operation monoid M to a function on lists. It is the right fold of (a, b) ↦ f a ∙ b starting from the unit e, so it sends [x₁, …, xₙ] to f x₁ ∙ (… ∙ (f xₙ ∙ e)). The fold requires its step to be a function out of the cartesian product X × M. That holds because the operation of M is strong, and this is where the hypothesis on M enters. It is the map whose existence and uniqueness make X* free.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ϕ","base":"ϕ","kind":"abbrev","start":155,"body":null,"status":"ok","short":{"text":"The extension f ↦ [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_op]] f","status":"ok"},"long":{"text":"Local name, inside the section, for [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_op]], which sends a function X ⇾ M to its extension X* ⇾ M.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_to_monoid_is_fun","base":"ProdList_to_monoid_is_fun","kind":"inst","start":156,"body":[157,169],"status":"ok","short":{"text":"Equal functions X ⇾ M have equal extensions to X*","status":"ok"},"proof":[{"text":"Take functions f and g from X to M. Equality of the extensions means they agree at each list, so fix a list x and prove that f = g implies ϕ f x = ϕ g x.","status":"ok","from":0,"to":3},{"text":"Proceed by induction on x, with the step written [a] ∙ x ([[AffineConstructive.implementations.list.prod.ProdList_sinduction_alt]]).","status":"ok","from":4,"to":4},{"text":"At the empty list both extensions are the unit e. Because e = e is provable it is equivalent to truth, and truth is implied by any proposition.","status":"ok","from":5,"to":7},{"text":"At [a] ∙ x the extensions compute to f a ∙ ϕ f x and g a ∙ ϕ g x. The operation of M is strong, so the products are equal once f a = g a ∧ ϕ f x = ϕ g x holds. Since this conjunction is additive, the single hypothesis f = g may be used for each conjunct. The second conjunct is the induction hypothesis, and what remains is that f = g implies f a = g a.","status":"ok","from":8,"to":10},{"text":"Equality of functions is pointwise, so specialising it at a gives f a = g a.","status":"ok","from":11,"to":12}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_to_monoid","base":"ProdList_to_monoid","kind":"def","start":170,"body":null,"status":"ok","short":{"text":"The extension as a function (X ⇾ M) ⇾ (X* ⇾ M)","status":"ok"},"long":{"text":"The extension [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_op]] packaged as a function between the set of functions X ⇾ M and the set of functions X* ⇾ M. That it is a function at all is [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_is_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.g","base":"g","kind":"abbrev","start":174,"body":null,"status":"ok","short":{"text":"The extension of the fixed function f to X*","status":"ok"},"long":{"text":"Local name, inside the section that fixes f : X ⇾ M, for its extension [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_op]] f, the map whose morphism property and uniqueness are proved there.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_to_monoid_is_mon_mor","base":"ProdList_to_monoid_is_mon_mor","kind":"prf","start":175,"body":[176,186],"status":"ok","short":{"text":"The extension of f : X ⇾ M to X* is a monoid morphism","status":"ok"},"proof":[{"text":"A monoid morphism is a map that preserves the operation and the unit ([[AffineConstructive.theory.groups.alt_Build_Monoid_Morphism]]). The extension g sends ε to e by definition, which leaves g (x ∙ y) = g x ∙ g y for all lists x and y.","status":"ok","from":0,"to":1},{"text":"Proceed by induction on x, with the step written [a] ∙ x, and fix y in each case.","status":"ok","from":2,"to":2},{"text":"For x = ε the left side is g y and g ε is e, so the claim is g y = e ∙ g y, which is the left identity law of M.","status":"ok","from":3,"to":5},{"text":"For [a] ∙ x both sides compute: the claim becomes f a ∙ g (x ∙ y) = (f a ∙ g x) ∙ g y. The induction hypothesis at y rewrites g (x ∙ y) to g x ∙ g y, and associativity in M closes the goal.","status":"ok","from":6,"to":10}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_to_monoid_spec","base":"ProdList_to_monoid_spec","kind":"prf","start":187,"body":[188,192],"status":"ok","short":{"text":"The extension of f agrees with f on singletons: f equals its extension composed with η","status":"ok"},"proof":[{"text":"Fix a in X. The extension at the singleton η a computes to f a ∙ e, and the right identity law of M gives f a = f a ∙ e.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_to_monoid_unique","base":"ProdList_to_monoid_unique","kind":"prf","start":193,"body":[194,204],"status":"ok","short":{"text":"A morphism X* ⇾ M agreeing with f on singletons equals the extension of f","status":"ok"},"proof":[{"text":"Record that the extension g is a monoid morphism ([[AffineConstructive.implementations.list.prod.ProdList_to_monoid_is_mon_mor]]), and assume that h agrees with f on singletons, f = h ∘ η.","status":"ok","from":0,"to":2},{"text":"Prove h x = g x by induction on the list x, with the step written [x₀] ∙ x.","status":"ok","from":3,"to":3},{"text":"At the empty list both h and g are monoid morphisms, so both send ε to the unit ([[AffineConstructive.interfaces.abstract_algebra.preserves_unit]]).","status":"ok","from":4,"to":5},{"text":"At [x₀] ∙ x, assume h x = g x. Both maps preserve concatenation, so the goal becomes h [x₀] ∙ h x = g [x₀] ∙ g x.","status":"ok","from":6,"to":8},{"text":"The second factors agree by the induction hypothesis. The first factors both equal f x₀: one by the assumption f = h ∘ η at x₀, the other by [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_spec]] at x₀.","status":"ok","from":9,"to":10}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_to_monoid_mon_mor","base":"ProdList_to_monoid_mon_mor","kind":"def","start":206,"body":[207,213],"status":"ok","short":{"text":"The extension as a function from X ⇾ M to the set of monoid morphisms X* ⇾ M","status":"ok"},"proof":[{"text":"The map sends f to its extension ϕ f, packaged as a monoid morphism. Two obligations remain: each ϕ f is a monoid morphism, and the assignment preserves equality.","status":"ok","from":0,"to":1},{"text":"Each extension is a monoid morphism by [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_is_mon_mor]].","status":"ok","from":2,"to":3},{"text":"Equal functions have equal extensions by [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_is_fun]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.implementations.list.prod.canonical:ProdList_to_monoid","base":"canonical:ProdList_to_monoid","kind":"canonical","start":215,"body":null,"status":"ok","short":{"text":"Unification recovers the extension to product lists as a bundled function (X ⇾ M) ⇾ (X* ⇾ M)","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_FreeStrongMonoid","base":"ProdList_FreeStrongMonoid","kind":"prf","start":219,"body":[220,226],"status":"ok","short":{"text":"The unit η exhibits X* as the free strong-operation monoid on X","status":"ok"},"proof":[{"text":"The universal property has two parts, existence and uniqueness. In each, fix a strong-operation monoid M and a function f : X ⇾ M.","status":"ok","from":0,"to":1},{"text":"Existence: the extension of f composed with η equals f, by [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_spec]].","status":"ok","from":2,"to":3},{"text":"Uniqueness: a morphism that agrees with f on singletons equals the extension, by [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_unique]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.implementations.list.prod.ProdList_map","base":"ProdList_map","kind":"def","start":230,"body":null,"status":"ok","short":{"text":"The monoid morphism X* ⇾ Y* applying a function f : X ⇾ Y to each entry","status":"ok"},"long":{"text":"The functorial action of lists on a function f : X ⇾ Y. It is obtained from the universal property instead of by recursion: the composite of f with the unit [[AffineConstructive.implementations.list.prod.ProdList_unit]] of Y* is a function X ⇾ Y* into a strong-operation monoid, and [[AffineConstructive.implementations.list.prod.ProdList_to_monoid_mon_mor]] extends it to the unique monoid morphism X* ⇾ Y* that agrees with it on singletons. The result therefore preserves concatenation and the empty list by construction, and sends the list of x₁, …, xₙ to the list of f x₁, …, f xₙ.\n\nUnderneath, the map computes as the entrywise map on lists, so the facts about the underlying list map, such as [[AffineConstructive.implementations.list.prod.ProdList_map_in_bounds]], carry over to it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.prod.ProdList_map_in_bounds","base":"ProdList_map_in_bounds","kind":"def","start":231,"body":null,"status":"ok","short":{"text":"An index in bounds for l is in bounds for the image of l under ProdList_map f","status":"ok"},"long":{"text":"Mapping a function f over a list keeps its length. So an index n that is valid for l, in the sense of [[AffineConstructive.implementations.list.base.ListInBounds]], is also valid for the image of l under the morphism [[AffineConstructive.implementations.list.prod.ProdList_map]] f. The statement is a base-logic one. The proof is [[AffineConstructive.implementations.list.base.list_map_in_bounds]]: the morphism that the universal property builds computes as the entrywise map of lists.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.free_monoid":{"page":"../../interfaces/free_monoid.html","short":"Universal property of free monoids and free strong monoids, data separated from laws","summary":"The file states the universal property of a free monoid, separating data from laws. [[FromFreeMonoid]] gives the data: for a map i from a set X into a monoid Xs, an operation extending each map from X into a monoid M to a monoid morphism from Xs to M. [[FreeMonoid]] gives the laws: the extension restricts to the original map along i, and it is the only morphism that does. A parallel pair, [[FromFreeStrongMonoid]] and [[FreeStrongMonoid]], states the same property among monoids with a strong operation; there the extension is a function of sets, so it preserves equality and, being affine, apartness as well. Concrete models, such as lists, use these interfaces to show that they are free monoids."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.groups":{"page":"../../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.bundled_groups":{"page":"../../theory/bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.implementations.list.base":{"page":"base.html","short":"Lists over a set: recursion, induction, elementwise equality, indexing and map","summary":"This file defines the inductive type of lists over a set, with the empty list, cons, and bracket notation. It provides the basic ways of consuming a list: a recursor [[list_elim]], [[fold_right]], induction for an affine predicate ([[list_induction]]) and for a base-logic predicate ([[list_sinduction]]), and case analysis in both forms ([[list_destruct]], [[list_sdestruct]]). It defines [[list_equiv]], the equality of lists, elementwise and parametrised by the connective that joins the equality of the heads to the equality of the tails. This lets the same type carry the cartesian equality (with ∧) and the tensor equality (with ⊠); the sibling files of product and tensor lists use it that way. Finally it defines bounded indexing [[list_nth]] under the bound condition [[ListInBounds]], and [[list_map]], which preserves that bound."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

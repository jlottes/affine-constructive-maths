x = y) ⊠ (y₀ = z₀ ⊠ y = z) ⊸ (x₀ = z₀ ⊠ x = z)).\n  rew (aprod_assoc _ _ _). rew <-(aprod_assoc (x=y) _ _). rew (aprod_com (x=y) _).\n  rew (aprod_assoc _ _ _). rew <-(aprod_assoc (x₀=y₀) _ _).\n  refine (aprod_proper_aimpl _ (IHx y z)).\n  now apply transitivity.\nQed.\n\nCanonical Structure TensorList X := set_make (tensor_list X).\nLocal Notation \"X *\" := (TensorList X) (at level 1, left associativity, format \"X *\").\n\nGlobal Hint Extern 1 (MonUnit _*) => refine nil : typeclass_instances.\nLocal Abbreviation ε := (mon_unit (M:=_*)).\n\nLemma TensorList_cons_is_fun X : @IsFun (X ⊗ X*) X* (λ p, cons (proj1 p) (proj2 p)).\nProof. now intros [x₀ x][y₀ y]. Qed.\nDefinition TensorCons {X} : X ⊗ X* ⇾ X* := @func_make _ _ _ (TensorList_cons_is_fun X).\nLocal Notation \"x :: y\" := (func_op TensorCons (x, y)) (at level 60, right associativity).\n\nDefinition TensorList_unit {X} : X ⇾ X* := ap2 TensorCons ε.\nLocal Abbreviation η := TensorList_unit.\nLocal Notation \"[ x ]\" := (func_op η x).\nGlobal Hint Extern 1 (Cast ?X (?X *)) => refine TensorList_unit : typeclass_instances.\n\nDefinition TensorList_induction {X} (P : X* → Ω) : (∏ x₀ x, P x ⊸ P (x₀ :: x)) → (P ε ⊸ all P) := list_induction P.\nDefinition TensorList_sinduction {X} (P:X* → SProp) : P ε → (∀ x₀ x, P x → P (x₀ :: x)) → ∀ x, P x := list_sinduction P.\n\nLocal Ltac doit P := let x₀ := fresh \"x₀\" in let x := fresh \"x\" in let IHx := fresh \"IHx\" in\n  let y₀ := fresh \"y₀\" in let y := fresh \"y\" in\n  hnf; intros [x y]; revert x y; refine (TensorList_sinduction _ _ _);\n  [| intros x₀ x IHx]; intros [|y₀ y];\n  [ now change (P 𝐓) | now change (P 𝐅) .. |\n    specialize (IHx y); now change (P (x₀ = y₀ ⊠ x = y)) ].\nLemma TensorList_DecidableEquality   `{!DecidableEquality   X} : DecidableEquality   X*.  Proof. doit Decidable.   Qed.\nLemma TensorList_AffirmativeEquality `{!AffirmativeEquality X} : AffirmativeEquality X*.  Proof. doit Affirmative. Qed.\nLemma TensorList_RefutativeEquality  `{!RefutativeEquality  X} : RefutativeEquality  X*.  Proof. doit Refutative.  Qed.\nGlobal Hint Extern 2 (DecidableEquality   _*) => simple notypeclasses refine TensorList_DecidableEquality   : typeclass_instances.\nGlobal Hint Extern 2 (AffirmativeEquality _*) => simple notypeclasses refine TensorList_AffirmativeEquality : typeclass_instances.\nGlobal Hint Extern 2 (RefutativeEquality  _*) => simple notypeclasses refine TensorList_RefutativeEquality  : typeclass_instances.\n\nImport projection_notation.\n\nLocal Instance TensorList_match_is_fun@{u} {X Y:set@{u}} : @IsFun (Y × ((X ⊗ X* ) ⇾ Y) ⊗ X* ) Y\n   (λ p, match π₂ p with\n         | nil => π₁ (π₁ p)\n         | cons x l => π₂ (π₁ p) (x, l)\n         end).\nProof. intros [p [|x l]][q [|y l']].\n+ change (p = q ⊠ atrue ⊸ π₁ p = π₁ q).\n  rew (aprod_unit_r _). exact (is_fun (prod_proj1 _ _) _ _).\n+ change (?P ⊸ ?Q) with (p = q ⊠ afalse ⊸ Q). now rew (aprod_false_r _).\n+ change (?P ⊸ ?Q) with (p = q ⊠ afalse ⊸ Q). now rew (aprod_false_r _).\n+ let f := constr:( set:( (λ '((y, f), q) : (Y × (X ⊗ X* ⇾ Y)) ⊗ (X ⊗ X*), f q) ) ) in\n  exact ( is_fun f (p, (x, l)) (q, (y, l')) ).\nQed.\nDefinition TensorList_match {X Y} := curry (@func_make _ _ _ (@TensorList_match_is_fun X Y)).\n\n\nSection fold_right.\n  Local Instance fold_right_is_fun@{u} {X Y:set@{u}} (f: X ⊗ Y ⇾ Y) : @IsFun (X* ⊗ Y) Y (λ '(xs, y), fold_right f xs y).\n  Proof. intros [x y₀][x' y₀']. unfold proj1, proj2. unfold_pair_eq.\n    revert x x'. refine (TensorList_sinduction _ _ _).\n  + intros [|x₀ x'].\n    * now change (ε = ε :> X* ⊠ y₀ = y₀' ⊸ y₀ = y₀').\n    * change (ε = cons x₀ x') with afalse. now simplify.\n  + intros x₀ x IH [|x₀' x'].\n    * change (x₀ :: x = nil) with afalse. now simplify.\n    * change ( (x₀ = x₀' ⊠ x = x') ⊠ y₀ = y₀' ⊸ f (x₀, fold_right f x y₀) = f (x₀', fold_right f x' y₀') ).\n      rew [(aprod_assoc _ _ _) | <- (is_fun f _ _)].\n      refine (aprod_proper_aimpl _ _); [ refl | exact (IH _) ].\n  Qed.\n\n  Definition TensorList_fold_right {X Y} (f: X ⊗ Y ⇾ Y) : X* ⊗ Y ⇾ Y := @func_make _ _ _ (fold_right_is_fun f).\nEnd fold_right.\n\nDefinition TensorList_concat {X} : X* ⊗ X* ⇾ X* := TensorList_fold_right TensorCons.\nGlobal Hint Extern 1 (SgOp _*) => refine (TensorList_concat) : typeclass_instances.\n\nDefinition TensorList_induction_alt `(P:X* → Ω) : (∏ x₀ x, P x ⊸ P ([x₀] ∙ x)) → (P ε ⊸ all P)\n:= TensorList_induction P.\nDefinition TensorList_sinduction_alt `(P:X* → SProp) : P ε → (∀ x₀ x, P x → P ([x₀] ∙ x)) → ∀ x, P x\n:= TensorList_sinduction P.\n\nLemma TensorList_sdestruct `(P:X* → SProp) : P ε → (∀ x₀ x, P ([x₀] ∙ x)) → ∀ x, P x.\nProof. intros P0 Ps [|??]; trivial. exact (Ps _ _). Qed.\n\nLocal Instance TensorList_concat_assoc X: Associative (X:=X*) (∙).\nProof. refine (TensorList_sinduction_alt _ _ _); [ easy | intros x₀ x IHx ].\n  intros y z. change ( [x₀] ∙ (x ∙ (y ∙ z)) = [x₀] ∙ (x ∙ y ∙ z) ).\n  now rew (IHx y z).\nQed.\n\nLocal Instance TensorList_concat_left_id X: LeftIdentity (X:=X*) (∙) ε.\nProof. now hnf. Qed.\n\nLocal Instance TensorList_concat_right_id X: RightIdentity (X:=X*) (∙) ε.\nProof. refine (TensorList_sinduction_alt _ _ _); [ easy | intros x₀ x IHx ].\n  change ([x₀] ∙ (x ∙ ε) = [x₀] ∙ x). now rew IHx.\nQed.\n\nLocal Instance TensorList_is_monoid {X} : Monoid X*.\nProof. now apply alt_Build_Monoid. Qed.\nGlobal Hint Extern 2 (Monoid _*) => simple notypeclasses refine TensorList_is_monoid : typeclass_instances.\nGlobal Hint Extern 2 (SemiGroup _*) => simple notypeclasses refine TensorList_is_monoid : typeclass_instances.\n\nCanonical Structure TensorList_mon X := make_monoid X*.\n\nGlobal Hint Extern 1 (Cast ?X (monoid_car (TensorList_mon ?X))) => refine TensorList_unit : typeclass_instances.\n\n(*\nRequire Import free_groups.\n\nDefinition from_tensor_list {X} : FromFreeMonoid (X:=X) η\n  := λ Y oY uY f, set:(λ x, TensorList_fold_right (uncurry set:(λ x y, f x ∙ y)) (x, mon_unit)).\nGlobal Hint Extern 1 (FromFreeMonoid η) => refine from_tensor_list : typeclass_instances.\n\nSection free_monoid.\n  Context {X} `{Monoid Y} (f:X ⇾ Y).\n  Notation e := (@mon_unit Y _).\n  Notation f' := (from_free_monoid η f).\n\n  Lemma from_tensor_list_mor : Monoid_Morphism f'.\n  Proof. apply alt_Build_Monoid_Morphism; [| refl].\n    refine (TensorList_sinduction_alt _ _ _); [| intros a x IH ]; intros y.\n  + change (f' ε) with e; now simplify.\n  + change (f a ∙ f' (x ∙ y) = (f a ∙ f' x) ∙ f' y).\n    rew (IH y). now apply associativity.\n  Qed.\n  Let inst : Monoid_Morphism f'.  Proof from_tensor_list_mor.\n\n  Lemma from_tensor_list_ext : f' ∘ η = f.\n  Proof. intros x. change (f x ∙ e = f x). now simplify. Qed.\n\n  Context (h : X* ⇾ Y) `{!Monoid_Morphism h}.\n\n  Lemma from_tensor_list_unique : h ∘ η = f → h = f'.\n  Proof. intros E. refine (TensorList_sinduction_alt _ _ _).\n  + now rew [ (preserves_unit h) | (preserves_unit f') ].\n  + intros x xs IH. rew [ (preserves_sg_op h _ _) | (preserves_sg_op f' _ _) ].\n    rew IH. rew <-exact:(simplify_thm (is_fun (∙ f' xs) (h [x]) (f' [x]))).\n    change ( (h ∘ η) x = f x ∙ e ). rew E. now simplify.\n  Qed.\nEnd free_monoid.\n\nLemma tensor_list_free_mon {X} : FreeMonoid (X:=X) η.\nProof. split; try exact _; intros ???? f.\n+ apply from_tensor_list_mor.\n+ apply from_tensor_list_ext.\n+ apply from_tensor_list_unique.\nQed.\n*)\n\n\nSection to_monoid.\n  Universes u.\n  Context {X:set@{u}} {M:monoid@{u}} (f:X ⇾ M).\n  Abbreviation e := (mon_unit (M:=monoid_car M)).\n\n  Definition TensorList_to_monoid : X* ⇾ M := set:(λ x, TensorList_fold_right (set:(λ '(x, y), f x ∙ y)) (x, e)).\n  Local Abbreviation g := TensorList_to_monoid.\n\n  Lemma TensorList_to_monoid_is_mon_mor : Monoid_Morphism g.\n  Proof. apply alt_Build_Monoid_Morphism; [| refl].\n    refine (TensorList_sinduction_alt _ _ _); [| intros a x IH ]; intros y.\n  + change (g y = e ∙ g y). now simplify.\n  + change (f a ∙ g (x ∙ y) = (f a ∙ g x) ∙ g y).\n    rew (IH y). now group_simplify.\n  Qed.\n  Definition TensorList_to_monoid_mon_mor := @make_monoid_morphism _ _ g TensorList_to_monoid_is_mon_mor.\n\n  Lemma TensorList_to_monoid_spec : f = g ∘ η.\n  Proof. intros a. change (f a = f a ∙ e). now simplify. Qed.\n\n  Local Notation \"X ⟶ Y\" := (monoid_morphism X Y).\n  Lemma TensorList_to_monoid_unique (h:X* ⟶ M) : f = h ∘ η → h = g :> (X* ⇾ M).\n  Proof. pose proof TensorList_to_monoid_is_mon_mor.\n    intros E. refine (TensorList_sinduction_alt _ _ _).\n  + now rew (preserves_unit _).\n  + intros x₀ x IH. rew (preserves_sg_op _ _ _).\n    now rew [ IH | <-(E x₀ : f x₀ = h (η x₀)) | <-(TensorList_to_monoid_spec x₀ : f x₀ = g (η x₀)) ].\n  Qed.\nEnd to_monoid.\nCanonical TensorList_to_monoid_mon_mor.\n\nGlobal Hint Extern 1 (FromFreeMonoid (cast ?X (monoid_car (TensorList_mon ?X)))) => refine (@TensorList_to_monoid _) : typeclass_instances.\nGlobal Hint Extern 1 (FromFreeMonoid (cast ?X (TensorList ?X))) => refine (@TensorList_to_monoid _) : typeclass_instances.\nGlobal Hint Extern 1 (FromFreeMonoid TensorList_unit) => refine (@TensorList_to_monoid _) : typeclass_instances.\n\nLemma TensorList_FreeMonoid {X} : FreeMonoid (X:=X) η.\nProof. split; intros M f.\n+ apply TensorList_to_monoid_spec.\n+ apply TensorList_to_monoid_unique.\nQed.\nGlobal Hint Extern 2 (FreeMonoid (cast ?X (monoid_car (TensorList ?X)))) => refine TensorList_FreeMonoid : typeclass_instances.\nGlobal Hint Extern 2 (FreeMonoid (cast ?X (TensorList ?X))) => refine TensorList_FreeMonoid : typeclass_instances.\nGlobal Hint Extern 2 (FreeMonoid TensorList_unit) => refine TensorList_FreeMonoid : typeclass_instances.\n\nDefinition TensorList_map@{u} {X Y:set@{u}} (f:X ⇾ Y) := TensorList_to_monoid_mon_mor (TensorList_unit ∘ f).\n\n","sentences":[{"i":0,"s":0,"e":86,"kind":"vernac","status":"ok","ms":41,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":87,"e":144,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":2,"s":145,"e":172, ctive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8462,"e":8466,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":8573,"e":8576,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8577,"e":8585,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":8641,"e":8644,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8653,"e":8656,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8657,"e":8671,"lib":"AffineConstructive.theory.groups","name":"group_simplify","kind":"ltac","local":false,"page":"../../theory/groups.html"},{"s":8877,"e":8880,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8881,"e":8889,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":9141,"e":9144,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9145,"e":9148,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9189,"e":9192,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9222,"e":9225,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9226,"e":9229,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file builds TensorList X: lists on a set X, where two lists are equal when they have the same length and their entries are equal position by position, with those equalities joined by the tensor ⊠. It proves that this equality makes a set, and that the equality of X* is decidable, affirmative or refutative when that of X is. Cons, the singleton map η, a case-analysis map and right fold are given as functions of sets. Concatenation, defined by the fold, makes X* a monoid with the empty list as unit. TensorList_to_monoid extends a map X ⇾ M to a monoid morphism, and [[AffineConstructive.implementations.list.tensor.TensorList_FreeMonoid]] shows that η makes X* the free monoid on X. It is the counterpart of the list construction whose entrywise equalities are joined by the additive ∧.","short":"Lists with tensor equality: the free monoid on a set","items":[{"name":"AffineConstructive.implementations.list.tensor.tensor_list","base":"tensor_list","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The type of lists over a set X, given the entrywise tensor equality","status":"ok"},"long":{"text":"The underlying type of [[AffineConstructive.implementations.list.tensor.TensorList]]. It is the type of finite lists of elements of X, under a new name, so that it can carry its own equality: [[AffineConstructive.implementations.list.base.list_equiv]] with the connective [[AffineConstructive.interfaces.aprop.aprod]]. Under this equality the empty list equals only itself (𝐓 against itself, 𝐅 against a nonempty list), and two nonempty lists are equal when their heads are equal ⊠ their tails are equal.\n\nTwo lists of the same length are therefore equal when each pair of corresponding entries is equal, and these equalities are joined by the tensor rather than by the additive and. A proof of the equality provides every entrywise equality, each usable once, and a refutation may refute any one of them, given proofs of the others.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.tensor_list_is_set","base":"tensor_list_is_set","kind":"inst","start":9,"body":[10,31],"status":"ok","short":{"text":"Lists under the entrywise tensor equality form a set: the equality is an equivalence","status":"ok"},"proof":[{"text":"Three things must be shown: the entrywise tensor equality on lists is reflexive, symmetric and transitive.","status":"ok","from":0,"to":1},{"text":"Reflexivity, by induction on the list. The empty list equals itself by definition. For x₀ :: x the equality is x₀ = x₀ ⊠ x = x, whose first factor holds by reflexivity in X and whose second is the induction hypothesis.","status":"ok","from":2,"to":3},{"text":"Symmetry, by induction on x and case analysis on y. When both lists are empty the equality is truth. When one list is empty and the other is not, it is falsity. Either way these cases close at once, and the case of two nonempty lists remains.","status":"ok","from":4,"to":5},{"text":"For two nonempty lists, the equality unfolds to its definition: it remains to show that x₀ = y₀ ⊠ x = y implies y₀ = x₀ ⊠ y = x.","status":"ok","from":6,"to":7},{"text":"The tensor is monotone, so each factor can be handled on its own. The tails are handled by the induction hypothesis at y, and the heads by symmetry of equality in X.","status":"ok","from":8,"to":9},{"text":"Transitivity, by induction on x and case analysis on y and z. In every case where some list is empty, either all three lists are empty and the goal is trivial, or one of the hypotheses is falsity. This leaves the case of three nonempty lists.","status":"ok","from":10,"to":11},{"text":"Unfolded, the goal asks for x₀ = z₀ ⊠ x = z from the four factors x₀ = y₀, x = y, y₀ = z₀ and y = z.","status":"ok","from":12,"to":13},{"text":"Each of the four factors may be used only once, so they are rearranged until each one meets its own transitivity step. After reassociating and swapping x = y past y₀ = z₀, the hypothesis reads (x₀ = y₀ ⊠ y₀ = z₀) ⊠ (x = y ⊠ y = z).","status":"ok","from":14,"to":18},{"text":"By monotonicity of the tensor, the tail factors give x = z by the induction hypothesis at y and z. The head factors give x₀ = z₀ by transitivity in X.","status":"ok","from":19,"to":21}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList","base":"TensorList","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"The set X* of lists over X, with entrywise equalities joined by the tensor","status":"ok"},"long":{"text":"The set of finite lists over X, built from [[AffineConstructive.implementations.list.tensor.tensor_list]] and its equality with [[AffineConstructive.interfaces.set.set_make]]. The file writes it X*. The equality makes [[AffineConstructive.implementations.list.tensor.TensorCons]] a function on the tensor product X ⊗ X*. With concatenation and the empty list X* becomes a monoid, [[AffineConstructive.implementations.list.tensor.TensorList_mon]], and [[AffineConstructive.implementations.list.tensor.TensorList_FreeMonoid]] shows that this monoid is the free monoid on X.\n\nThe tensor is the right choice for the free monoid in this development, whose monoids have their operation on M ⊗ M: the list x₀ :: x is the product of [x₀] and x, and its equality to another product is what the tensor equality of the factors gives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.ε","base":"ε","kind":"abbrev","start":35,"body":null,"status":"ok","short":{"text":"The empty list, as the unit of the list monoid X*","status":"ok"},"long":{"text":"A local name for the monoid unit of X*. Resolution supplies the empty list [[AffineConstructive.implementations.list.base.nil]] as the unit. Within the file, ε is the base case of the induction principles and the identity of concatenation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_cons_is_fun","base":"TensorList_cons_is_fun","kind":"prf","start":36,"body":[37,39],"status":"ok","short":{"text":"Cons preserves equality on X ⊗ X*: x₀ = y₀ ⊠ x = y implies x₀ :: x = y₀ :: y","status":"ok"},"proof":[{"text":"Write the two arguments as pairs (x₀, x) and (y₀, y). Their equality in X ⊗ X* is x₀ = y₀ ⊠ x = y, which is by definition the equality of x₀ :: x and y₀ :: y in X*. So the required implication is the identity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.tensor.TensorCons","base":"TensorCons","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"Cons as a function X ⊗ X* ⇾ X*, written x₀ :: x","status":"ok"},"long":{"text":"The function that puts an element in front of a list. Its domain is the tensor product X ⊗ X*, not the cartesian product: by the definition of the equality on [[AffineConstructive.implementations.list.tensor.TensorList]], x₀ :: x = y₀ :: y is exactly x₀ = y₀ ⊠ x = y, which is the equality of the pairs in X ⊗ X*. The map is therefore a function with no proof needed, and it reflects equality as well as preserving it.\n\nIt is the step of the induction principles, the singleton map [[AffineConstructive.implementations.list.tensor.TensorList_unit]], and, through [[AffineConstructive.implementations.list.tensor.TensorList_fold_right]], concatenation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_unit","base":"TensorList_unit","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"The singleton map η : X ⇾ X*, sending x to the one-entry list [x]","status":"ok"},"long":{"text":"The insertion of generators of the free monoid: x is sent to x :: ε, the list with x as its only entry, written [x]. It is [[AffineConstructive.implementations.list.tensor.TensorCons]] with its second argument fixed at the empty list.\n\n[[AffineConstructive.implementations.list.tensor.TensorList_FreeMonoid]] states that η exhibits X* as the free monoid on X. Resolution also uses it as the designated map from X to X*. Since [x₀] ∙ x is definitionally x₀ :: x, statements about cons can be written in terms of η and concatenation, as in [[AffineConstructive.implementations.list.tensor.TensorList_induction_alt]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.η","base":"η","kind":"abbrev","start":43,"body":null,"status":"ok","short":{"text":"The name η for the singleton map X ⇾ X*","status":"ok"},"long":{"text":"A local name for [[AffineConstructive.implementations.list.tensor.TensorList_unit]], the unit of the free monoid. It fixes the notation of the universal property in this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_induction","base":"TensorList_induction","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"Affine list induction: if each step P x ⊸ P (x₀ :: x) holds, P ε implies P x for every x","status":"ok"},"long":{"text":"Induction on X* for an affine predicate P, stated with [[AffineConstructive.implementations.list.tensor.TensorCons]] and the empty list ε of the set X*. It is [[AffineConstructive.implementations.list.base.list_induction]] restated. The step is a proof of the universal statement that P x implies P (x₀ :: x) for all x₀ and x. The conclusion is an affine implication from P ε to ∏ x, P x, so it carries its contrapositive: a refutation of P at some list gives a refutation of P ε.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_sinduction","base":"TensorList_sinduction","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"Induction on X* for a base-logic predicate: from the empty list and each cons to every list","status":"ok"},"long":{"text":"Induction on X* for a predicate with values in SProp: P ε, together with P x → P (x₀ :: x) for all x₀ and x, gives P x for every list. It is [[AffineConstructive.implementations.list.base.list_sinduction]] restated in terms of [[AffineConstructive.implementations.list.tensor.TensorList]], its empty list ε and the cons [[AffineConstructive.implementations.list.tensor.TensorCons]].\n\n[[AffineConstructive.implementations.list.tensor.TensorList_sinduction_alt]] is built on it, with the step written as [x₀] ∙ x. The tactic [[AffineConstructive.implementations.list.tensor.doit]] uses it to prove that the equality of X* is decidable, affirmative or refutative when that of X is.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.doit","base":"doit","kind":"ltac","start":48,"body":null,"status":"ok","short":{"text":"Proves that every equality of X* lies in a class (decidable, affirmative or refutative) when every equality of X does","status":"ok"},"long":{"text":"The tactic takes a class P of affine propositions, Decidable, Affirmative or Refutative, and proves that every equality x = y of lists in X* lies in P. It does induction on x and case analysis on y. If both lists are empty, the equality is 𝐓, and P 𝐓 is found by resolution. If one list is empty and the other not, the equality is 𝐅, and P 𝐅 is found the same way. If both lists are nonempty, the equality is x₀ = y₀ ⊠ x = y. The class is closed under the tensor, the head equality lies in P by the assumption on X, and the tail equality lies in P by the induction hypothesis.\n\nIt is local, and it is used for the three lemmas [[AffineConstructive.implementations.list.tensor.TensorList_DecidableEquality]], [[AffineConstructive.implementations.list.tensor.TensorList_AffirmativeEquality]] and [[AffineConstructive.implementations.list.tensor.TensorList_RefutativeEquality]], which differ only in the class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_DecidableEquality","base":"TensorList_DecidableEquality","kind":"prf","start":49,"body":[50,52],"status":"ok","short":{"text":"If X has decidable equality, so does X*","status":"ok"},"proof":[{"text":"The proof is by induction on lists ([[AffineConstructive.implementations.list.tensor.TensorList_sinduction]]). The equality of two lists is truth when both are empty and falsity when exactly one is. Otherwise it is the tensor of an equality in X with an equality of shorter lists. Truth and falsity are decidable, the equality of X is decidable by hypothesis, and a tensor of decidable propositions is decidable ([[AffineConstructive.logic.aprop.aprod_decidable]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_AffirmativeEquality","base":"TensorList_AffirmativeEquality","kind":"prf","start":53,"body":[54,56],"status":"ok","short":{"text":"If X has affirmative equality, so does X*","status":"ok"},"proof":[{"text":"The proof is by induction on lists ([[AffineConstructive.implementations.list.tensor.TensorList_sinduction]]), following the shape of the equality. When the lists are empty or of different shapes, the equality is truth or falsity, which are decidable and hence affirmative ([[AffineConstructive.logic.aprop.decidable_affirmative]]). For two nonempty lists, it is the tensor of an affirmative equality in X with an equality of shorter lists, which is affirmative by induction, and the tensor preserves this.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_RefutativeEquality","base":"TensorList_RefutativeEquality","kind":"prf","start":57,"body":[58,60],"status":"ok","short":{"text":"If X has refutative equality, so does X*","status":"ok"},"proof":[{"text":"The proof is by induction on lists ([[AffineConstructive.implementations.list.tensor.TensorList_sinduction]]). Truth and falsity, the equalities between empty lists or lists of different shapes, are decidable and so refutative ([[AffineConstructive.logic.aprop.decidable_refutative]]). For two nonempty lists, the equality is a tensor of two refutative propositions, the equality in X and the equality of the tails by induction, and such a tensor is refutative ([[AffineConstructive.logic.aprop.aprod_refutative]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_match_is_fun","base":"TensorList_match_is_fun","kind":"inst","start":65,"body":[66,80],"status":"ok","short":{"text":"Case analysis on a list, given a value for ε and a function on X ⊗ X* for cons, preserves equality","status":"ok"},"proof":[{"text":"Write each argument as a pair: the data (a value for ε and a function for cons) and a list. Splitting on whether each of the two lists is empty gives four cases.","status":"ok","from":0,"to":1},{"text":"When both lists are empty, the equality of the arguments is p = q ⊠ 𝐓, which reduces to p = q. Both values are first components, and the first projection preserves equality.","status":"ok","from":2,"to":5},{"text":"When the first list is empty and the second is not, their equality is falsity. The hypothesis p = q ⊠ 𝐅 is then falsity ([[AffineConstructive.logic.aprop.aprod_false_r]]) and implies anything.","status":"ok","from":6,"to":8},{"text":"The case of a nonempty first list and an empty second list is symmetric: the hypothesis is again falsity.","status":"ok","from":9,"to":11},{"text":"When both lists are nonempty, the hypothesis is the equality of (p, (x, l)) and (q, (y, l')) in (Y × (X ⊗ X* ⇾ Y)) ⊗ (X ⊗ X*). Each value is the second component of the data applied to the head and tail. That evaluation is a function on this tensor product, so it preserves the equality ([[AffineConstructive.interfaces.set.is_fun]]).","status":"ok","from":12,"to":14}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_match","base":"TensorList_match","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"Case analysis on X* as a function: (y, f) ⇾ list ⇾ y for ε, f (x₀, x) for x₀ :: x","status":"ok"},"long":{"text":"Pattern matching on a list, made into a function between sets. It takes a pair (y, f), where y is a value for the empty list and f : X ⊗ X* ⇾ Y handles a list of the form x₀ :: x. It returns the function X* ⇾ Y that sends ε to y and x₀ :: x to f (x₀, x). The function is the curried form of a function on (Y × (X ⊗ X* ⇾ Y)) ⊗ X*.\n\nThe pair of cases is taken in the cartesian product: each list is handled by one case and never both, so an equality of the pairs is needed only through the component that is used. For two equal empty lists, the result's equality uses only y; for two equal nonempty lists, it uses f, applied to the head and tail equalities.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.fold_right_is_fun","base":"fold_right_is_fun","kind":"inst","start":83,"body":[84,106],"status":"ok","short":{"text":"The right fold by a function f : X ⊗ Y ⇾ Y preserves equality on X* ⊗ Y","status":"ok"},"proof":[{"text":"Take two arguments (x, y₀) and (x', y₀'). Their equality in X* ⊗ Y is x = x' ⊠ y₀ = y₀', and it must imply that the two folds are equal.","status":"ok","from":0,"to":3},{"text":"With the starting values y₀, y₀' fixed, generalise over both lists and argue by induction on x ([[AffineConstructive.implementations.list.tensor.TensorList_sinduction]]), for every x'.","status":"ok","from":4,"to":5},{"text":"In the base case with x' also empty, both folds return their starting values. The factor y₀ = y₀' is the conclusion, and the trivial list equality is discarded.","status":"ok","from":6,"to":9},{"text":"When x' is nonempty, the equality of ε with a nonempty list is falsity, and so is the whole hypothesis.","status":"ok","from":10,"to":12},{"text":"In the inductive step for x₀ :: x, an empty x' again makes the list equality falsity, and the case closes.","status":"ok","from":13,"to":17},{"text":"When x' = x₀' :: x', both folds compute one step: the goal is f (x₀, fold of x) = f (x₀', fold of x'), from (x₀ = x₀' ⊠ x = x') ⊠ y₀ = y₀'.","status":"ok","from":18,"to":19},{"text":"Since f preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), it suffices to show that its two arguments are equal in X ⊗ Y. Reassociating groups the hypothesis as x₀ = x₀' ⊠ (x = x' ⊠ y₀ = y₀').","status":"ok","from":20,"to":20},{"text":"By monotonicity of the tensor, the head equality is kept as it is. The remaining factor x = x' ⊠ y₀ = y₀' gives the equality of the two folds by the induction hypothesis at x'. Each factor is used exactly once.","status":"ok","from":21,"to":22}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_fold_right","base":"TensorList_fold_right","kind":"def","start":107,"body":null,"status":"ok","short":{"text":"The right fold by f : X ⊗ Y ⇾ Y, as a function X* ⊗ Y ⇾ Y","status":"ok"},"long":{"text":"The function that sends a list x₁ :: … :: xₙ and a starting value y to f (x₁, f (x₂, … f (xₙ, y))), the [[AffineConstructive.implementations.list.base.fold_right]] of lists made a function between sets. Both the combining function and the fold are defined on tensor products. Combining an entry of a list with the fold of the rest uses the equality of that entry once and the equality of the rest once, which is what the tensor equality of X* supplies.\n\nConcatenation ([[AffineConstructive.implementations.list.tensor.TensorList_concat]]) and the extension of a function into a monoid ([[AffineConstructive.implementations.list.tensor.TensorList_to_monoid]]) are both right folds.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_concat","base":"TensorList_concat","kind":"def","start":109,"body":null,"status":"ok","short":{"text":"Concatenation of lists, x ∙ y, as a function X* ⊗ X* ⇾ X*","status":"ok"},"long":{"text":"The operation of the list monoid: the right fold of the first list by [[AffineConstructive.implementations.list.tensor.TensorCons]], starting from the second list, so that ε ∙ y is y and (x₀ :: x) ∙ y is x₀ :: (x ∙ y). Both equations hold by definition. Resolution uses it as the binary operation of X*. With ε it makes X* a monoid ([[AffineConstructive.implementations.list.tensor.TensorList_is_monoid]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_induction_alt","base":"TensorList_induction_alt","kind":"def","start":111,"body":null,"status":"ok","short":{"text":"List induction for an affine predicate, with the step stated for [x₀] ∙ x","status":"ok"},"long":{"text":"[[AffineConstructive.implementations.list.tensor.TensorList_induction]] with the cons in the step written as the product [x₀] ∙ x of the singleton [x₀] and the list x, which is x₀ :: x by definition. If P x implies P ([x₀] ∙ x) for all x₀ and x, then P ε implies P x for every list x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_sinduction_alt","base":"TensorList_sinduction_alt","kind":"def","start":112,"body":null,"status":"ok","short":{"text":"List induction for a base-logic predicate, with the step stated for [x₀] ∙ x","status":"ok"},"long":{"text":"[[AffineConstructive.implementations.list.tensor.TensorList_sinduction]] with the step written for [x₀] ∙ x, the product of the singleton [x₀] and x, in place of x₀ :: x; the two are the same list by definition. From P ε and P x → P ([x₀] ∙ x) for all x₀ and x it gives P x for every list. The proofs in this file that use it do induction on the first factor of a product.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_sdestruct","base":"TensorList_sdestruct","kind":"prf","start":113,"body":[114,117],"status":"ok","short":{"text":"Case analysis on X*: a base-logic predicate holding at ε and at every [x₀] ∙ x holds everywhere","status":"ok"},"proof":[{"text":"Let x be a list and analyse its cases. If x is empty, the hypothesis P ε applies. Otherwise x is a cons s :: l.","status":"ok","from":0,"to":1},{"text":"The list s :: l is [s] ∙ l by computation, so the second hypothesis applies with s and l.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_concat_assoc","base":"TensorList_concat_assoc","kind":"inst","start":118,"body":[119,124],"status":"ok","short":{"text":"Concatenation of lists is associative","status":"ok"},"proof":[{"text":"The proof is by induction on the first list ([[AffineConstructive.implementations.list.tensor.TensorList_sinduction_alt]]). For ε, both sides compute to y ∙ z. It remains to treat [x₀] ∙ x, assuming associativity for x and all y, z.","status":"ok","from":0,"to":1},{"text":"Fix y and z. Concatenation with [x₀] ∙ x computes by prefixing x₀, so the goal becomes [x₀] ∙ (x ∙ (y ∙ z)) = [x₀] ∙ ((x ∙ y) ∙ z).","status":"ok","from":2,"to":3},{"text":"Rewriting the inner concatenation by the induction hypothesis at y and z makes the two sides equal, because concatenation preserves equality.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_concat_left_id","base":"TensorList_concat_left_id","kind":"inst","start":125,"body":[126,128],"status":"ok","short":{"text":"The empty list is a left identity for concatenation","status":"ok"},"proof":[{"text":"The concatenation ε ∙ x computes to x, so the identity holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_concat_right_id","base":"TensorList_concat_right_id","kind":"inst","start":129,"body":[130,134],"status":"ok","short":{"text":"The empty list is a right identity for concatenation","status":"ok"},"proof":[{"text":"By induction on the list, in the form [[AffineConstructive.implementations.list.tensor.TensorList_sinduction_alt]] that builds a list as [x₀] ∙ x. For the empty list, ε ∙ ε is ε. For the inductive step, assume x ∙ ε = x and show [x₀] ∙ x ∙ ε = [x₀] ∙ x.","status":"ok","from":0,"to":1},{"text":"Concatenation associates by definition, so the left side is [x₀] ∙ (x ∙ ε). Rewriting x ∙ ε to x by the induction hypothesis closes the step.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_is_monoid","base":"TensorList_is_monoid","kind":"inst","start":135,"body":[136,138],"status":"ok","short":{"text":"Concatenation and the empty list make X* a monoid","status":"ok"},"proof":[{"text":"A monoid is given by an associative operation with a two-sided identity, as in [[AffineConstructive.theory.groups.alt_Build_Monoid]]. Associativity of concatenation, together with the left and right identity laws for the empty list proved above, supplies each of these.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_mon","base":"TensorList_mon","kind":"def","start":141,"body":null,"status":"ok","short":{"text":"The monoid of lists over X under concatenation, as a bundled monoid","status":"ok"},"long":{"text":"X* bundled with concatenation, the empty list and the monoid axioms, built with [[AffineConstructive.interfaces.bundled_algebra.make_monoid]]. Statements that need a monoid as an object use it: the source of the morphisms in [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_unique]] and of [[AffineConstructive.implementations.list.tensor.TensorList_map]], and the free monoid of [[AffineConstructive.implementations.list.tensor.TensorList_FreeMonoid]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.e","base":"e","kind":"abbrev","start":146,"body":null,"status":"ok","short":{"text":"The name e for the unit of the target monoid M","status":"ok"},"long":{"text":"A local name, in the section on the universal property, for the unit of the monoid M into which lists are mapped. It is the value of [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid]] at the empty list.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_to_monoid","base":"TensorList_to_monoid","kind":"def","start":147,"body":null,"status":"ok","short":{"text":"The extension of f : X ⇾ M to lists: x₁ … xₙ is sent to f x₁ ∙ … ∙ f xₙ ∙ e","status":"ok"},"long":{"text":"Given a function f from X into a monoid M, the function X* ⇾ M that multiplies the images of the entries of a list in order. It is the right fold of the list by (x, m) ↦ f x ∙ m, starting from the unit e, so the empty list goes to e and x₀ :: x to f x₀ ∙ g x.\n\nThis is the extension in the universal property of the free monoid. It is a monoid morphism ([[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_is_mon_mor]]) and satisfies f = g ∘ η ([[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_spec]]). By [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_unique]], it is the only monoid morphism with this property.\n\n```tikzcd\nX \\arrow[r, \"\\eta\"] \\arrow[dr, \"f\"'] & X^{*} \\arrow[d, \"g\"] \\\\\n& M\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.g","base":"g","kind":"abbrev","start":148,"body":null,"status":"ok","short":{"text":"The name g for the extension of f to lists","status":"ok"},"long":{"text":"A local name, in the section on the universal property, for [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid]] applied to the fixed function f : X ⇾ M.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_to_monoid_is_mon_mor","base":"TensorList_to_monoid_is_mon_mor","kind":"prf","start":149,"body":[150,160],"status":"ok","short":{"text":"The extension of f : X ⇾ M to lists is a monoid morphism","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.groups.alt_Build_Monoid_Morphism]] it is enough that g preserves the operation and the unit. g sends the empty list to e by definition, so what remains is g (x ∙ y) = g x ∙ g y for all lists x and y.","status":"ok","from":0,"to":1},{"text":"Use induction on x, building lists as [a] ∙ x, and keep y general so that the induction hypothesis holds for every y. Then fix y.","status":"ok","from":2,"to":2},{"text":"When x is empty, the goal is g y = e ∙ g y, and the unit law of M proves it.","status":"ok","from":3,"to":5},{"text":"In the inductive step, g sends [a] ∙ x to f a ∙ g x by definition. The goal therefore asks for f a ∙ g (x ∙ y) = (f a ∙ g x) ∙ g y.","status":"ok","from":6,"to":7},{"text":"The induction hypothesis at y rewrites g (x ∙ y) as g x ∙ g y. Associativity in M then finishes the proof.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_to_monoid_mon_mor","base":"TensorList_to_monoid_mon_mor","kind":"def","start":161,"body":null,"status":"ok","short":{"text":"The extension of f : X ⇾ M to lists, as a bundled monoid morphism X* → M","status":"ok"},"long":{"text":"[[AffineConstructive.implementations.list.tensor.TensorList_to_monoid]] together with the proof [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_is_mon_mor]], packed as an element of the set of monoid morphisms from [[AffineConstructive.implementations.list.tensor.TensorList_mon]] to M. It is used where a morphism is needed as an object, as in [[AffineConstructive.implementations.list.tensor.TensorList_map]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_to_monoid_spec","base":"TensorList_to_monoid_spec","kind":"prf","start":162,"body":[163,167],"status":"ok","short":{"text":"The extension of f to lists agrees with f on singletons: f = g ∘ η","status":"ok"},"proof":[{"text":"Functions are equal when they agree pointwise, so fix a in X. The singleton η a is a followed by the empty list, so g sends it to f a ∙ e, and the right unit law of M reduces this to f a.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_to_monoid_unique","base":"TensorList_to_monoid_unique","kind":"prf","start":169,"body":[170,180],"status":"ok","short":{"text":"A monoid morphism h : X* → M with f = h ∘ η equals the extension of f","status":"ok"},"proof":[{"text":"Record that g is a monoid morphism ([[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_is_mon_mor]]), and assume f = h ∘ η. The proof that h and g agree on every list goes by induction, building lists as [x₀] ∙ x.","status":"ok","from":0,"to":3},{"text":"On the empty list, both h and g preserve the unit ([[AffineConstructive.interfaces.abstract_algebra.preserves_unit]]), so both sides equal e.","status":"ok","from":4,"to":5},{"text":"For the inductive step, assume h x = g x. Since h and g both preserve the operation, the goal becomes h [x₀] ∙ h x = g [x₀] ∙ g x.","status":"ok","from":6,"to":8},{"text":"The induction hypothesis matches the second factors. The first factors are both f x₀: on the left by the assumption f = h ∘ η at x₀, on the right by [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_spec]].","status":"ok","from":9,"to":10}]},{"name":"AffineConstructive.implementations.list.tensor.canonical:TensorList_to_monoid_mon_mor","base":"canonical:TensorList_to_monoid_mon_mor","kind":"canonical","start":182,"body":null,"status":"ok","short":{"text":"Unification recovers the extension of f : X ⇾ M to tensor lists as a bundled monoid morphism X* → M","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_FreeMonoid","base":"TensorList_FreeMonoid","kind":"prf","start":186,"body":[187,193],"status":"ok","short":{"text":"The singleton map η : X ⇾ X* makes X* the free monoid on X","status":"ok"},"proof":[{"text":"Freeness has two parts, existence and uniqueness. Fix a monoid M and a function f : X ⇾ M. One must show that the extension of f factors f through η, and that any monoid morphism with this property equals the extension.","status":"ok","from":0,"to":1},{"text":"The factorisation is [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_spec]].","status":"ok","from":2,"to":3},{"text":"Uniqueness is [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_unique]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.implementations.list.tensor.TensorList_map","base":"TensorList_map","kind":"def","start":197,"body":null,"status":"ok","short":{"text":"The monoid morphism X* → Y* that applies a function f : X ⇾ Y to each entry","status":"ok"},"long":{"text":"The functorial action of the free monoid. It is the extension ([[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_mon_mor]]) of η ∘ f : X ⇾ Y*, so a list x₁ … xₙ goes to [f x₁] ∙ … ∙ [f xₙ], the list f x₁ … f xₙ. It is a monoid morphism by construction, and by [[AffineConstructive.implementations.list.tensor.TensorList_to_monoid_unique]] it is the only monoid morphism that sends [x] to [f x] for every x.","status":"ok"},"proof":[]}],"diagrams":{"svg":{"\nX \\arrow[r, \"\\eta\"] \\arrow[dr, \"f\"'] & X^{*} \\arrow[d, \"g\"] \\\\\n& M":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='67.694pt' height='50.994pt' viewBox='0 0 67.694 50.994'>\n<defs>\n<path id='g2-1' d='M3.89623-1.89584C3.94502-2.091 3.95199-2.11888 3.95199-2.27919C3.95199-2.39071 3.95199-2.68345 3.6941-2.88558C3.57561-2.97619 3.37348-3.07377 3.04589-3.07377C2.75315-3.07377 2.32101-2.9971 1.86796-2.44647C1.81917-2.96922 1.34521-3.07377 1.12914-3.07377C.85731-3.07377 .69003-2.89255 .57851-2.70436C.43911-2.46738 .32759-2.04918 .32759-2.00736C.32759-1.91675 .42517-1.91675 .44608-1.91675C.54366-1.91675 .55063-1.93766 .59942-2.12585C.70397-2.53011 .8364-2.87861 1.10823-2.87861C1.28945-2.87861 1.33824-2.72527 1.33824-2.53708C1.33824-2.40465 1.27551-2.14676 1.22672-1.95857S1.10823-1.48461 1.07338-1.33127L.85034-.43911C.82246-.3485 .78064-.17425 .78064-.15334C.78064 0 .9061 .0697 1.01762 .0697C1.14308 .0697 1.2546-.02091 1.28945-.08364S1.38006-.36941 1.41491-.51578C1.44976-.64821 1.52643-.96883 1.56825-1.14308C1.61007-1.29642 1.65189-1.44976 1.68674-1.61 2 17.17412L44.42055 35.42188' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M44.007231 31.913669C43.4747 33.448011 43.897544 34.665489 44.58138 35.53945C43.54114 35.153004 42.252759 35.11947 40.952308 36.092415' stroke='currentColor' fill='none' stroke-width='.398466' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 50.994005)'>\n<use x='25.077328' y='-17.382523' xlink:href='#g2-2'/>\n<\/g>\n<path d='M54.60567 17.17412V34.30575' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M57.19393 31.901563C55.64095 32.377203 54.90763 33.437113 54.60567 34.504983C54.30371 33.437113 53.57039 32.377203 52.01741 31.901563' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 -.000004 50.994005)'>\n<use x='56.917969' y='-24.218796' xlink:href='#g2-3'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.free_monoid":{"page":"../../interfaces/free_monoid.html","short":"Universal property of free monoids and free strong monoids, data separated from laws","summary":"The file states the universal property of a free monoid, separating data from laws. [[FromFreeMonoid]] gives the data: for a map i from a set X into a monoid Xs, an operation extending each map from X into a monoid M to a monoid morphism from Xs to M. [[FreeMonoid]] gives the laws: the extension restricts to the original map along i, and it is the only morphism that does. A parallel pair, [[FromFreeStrongMonoid]] and [[FreeStrongMonoid]], states the same property among monoids with a strong operation; there the extension is a function of sets, so it preserves equality and, being affine, apartness as well. Concrete models, such as lists, use these interfaces to show that they are free monoids."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.groups":{"page":"../../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.implementations.list.base":{"page":"base.html","short":"Lists over a set: recursion, induction, elementwise equality, indexing and map","summary":"This file defines the inductive type of lists over a set, with the empty list, cons, and bracket notation. It provides the basic ways of consuming a list: a recursor [[list_elim]], [[fold_right]], induction for an affine predicate ([[list_induction]]) and for a base-logic predicate ([[list_sinduction]]), and case analysis in both forms ([[list_destruct]], [[list_sdestruct]]). It defines [[list_equiv]], the equality of lists, elementwise and parametrised by the connective that joins the equality of the heads to the equality of the tails. This lets the same type carry the cartesian equality (with ∧) and the tensor equality (with ⊠); the sibling files of product and tensor lists use it that way. Finally it defines bounded indexing [[list_nth]] under the bound condition [[ListInBounds]], and [[list_map]], which preserves that bound."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

"AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export\n  nat.nno\n  nat.rig\n  nat.subtract.\n","sentences":[{"i":0,"s":0,"e":50,"kind":"vernac","status":"ok","ms":40,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null}],"pp":{"239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","7ee0ddd10f8b2374":"[Loading ML file rocq-runtime.plugins.tauto ... done]","af331431bd614838":"[Loading ML file rocq-runtime.plugins.firstorder_core (implicit dependency) ... done]"},"defs":[],"refs":[{"s":17,"e":24,"lib":"AffineConstructive.implementations.nat.nno","name":"","kind":"lib","local":false,"page":"nat/nno.html"},{"s":27,"e":34,"lib":"AffineConstructive.implementations.nat.rig","name":"","kind":"lib","local":false,"page":"nat/rig.html"},{"s":37,"e":49,"lib":"AffineConstructive.implementations.nat.subtract","name":"","kind":"lib","local":false,"page":"nat/subtract.html"}],"gloss":{"summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one.","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","items":[],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.implementations.nat.nno":{"page":"nat/nno.html","short":"The natural numbers as an inductive type: natural numbers object, induction, decidable equality","summary":"The file builds the natural numbers as an inductive type with a zero and a successor, makes it the set [[Nat]] with strict equality affirmed, and proves that it is a natural numbers object ([[Nat_NNO]]), with the maps out of it ([[Nat_rec]]) given by primitive recursion. It derives induction for affine predicates ([[Nat_ind]]) and a variant for predicates proved outright ([[Nat_sind]]), and defines case analysis on a natural as a function of sets ([[Nat_destruct]]). An encode–decode argument through [[eq_code]] shows that the successor is injective ([[Nat_S_inj]]) and never zero ([[Nat_S_nonzero]]). A boolean test then decides equality ([[Nat_eq_is_dec]]), which makes Nat a set with decidable equality and therefore affirmative, refutative and strong equality."},"AffineConstructive.implementations.nat.rig":{"page":"nat/rig.html","short":"The natural numbers Nat as a commutative rig and a model of the naturals interface","summary":"This file takes the rig structure that [[nno_rig]] defines on any natural numbers object and applies it to the concrete set [[Nat]]. The unit, addition and multiplication of Nat are the ones the natural numbers object provides, and [[Nat_com_rig]] makes Nat a commutative rig. Hints let resolution find every weaker algebraic structure on Nat through that rig. The file also bundles Nat as the near-rig [[Nat_near_rig]], gives the canonical map out of Nat into any monoid with 1 as [[Nat_to_mon]], and proves [[Nat_is_naturals]], that Nat satisfies the naturals interface. All of this is packed into the bundled model [[Nat_naturals]]."},"AffineConstructive.implementations.nat.subtract":{"page":"nat/subtract.html","short":"Three-way comparison with difference on the concrete naturals, and its correctness","summary":"This file gives the concrete naturals [[Nat]] a three-way comparison with difference. [[Nat_subtract_raw]] compares two naturals by recursion on both at once. It returns equal, less by z or greater by z, where z is the difference. [[Nat_subtract]] makes this a function of sets out of the default equality of [[Nat]]. [[Nat_subtract_spec]] proves it correct by induction. For less by z the equation is x + z = y, for greater by z it is x = y + z, and in both cases z is nonzero. The zero cases follow from [[plus_0_l]] and [[nno_suc_nonzero]], and the successor case applies the successor to the induction hypothesis. Hints register both the operation and its correctness for the concrete model of the naturals."}},"constants":null}</script>

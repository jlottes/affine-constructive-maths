uc (nno_to_set Nat X x')).\n      rew <-(IH x' : f x' = nno_to_set Nat X x').\n      exact (preserves_suc _ _).\n  Qed.\nEnd NNO.\nGlobal Hint Extern 0 (FromNNO Nat) => refine Nat_rec : typeclass_instances.\nGlobal Hint Extern 0 (NaturalNumbersObject Nat) => refine Nat_NNO : typeclass_instances.\n\nImport modality_notation.\nImport projection_notation.\n\nLemma Nat_ind (P:nat → Ω) : (∏ n, P n ⊸ P (suc n)) → (P 0 ⊸ all P).\nProof. intro Ps. apply all_adj. refine (fix IH n := match n with\n | nat_0 => _\n | nat_S m => _\n end).\n+ refl.\n+ rew (IH m). exact (Ps m).\nQed.\n\nLemma Nat_sind (P:nat → Ω) : P 0 → (∀ n, P n → P (suc n)) → all P.\nProof. intros P0 Ps. apply ( Nat_ind (λ n, ! (P n)) ); trivial.\n  intros n. apply affirmative_aimpl. exact (Ps n).\nQed.\n\nDefinition Nat_destruct {X:set} : X × (Nat ⇾ X) → (Nat ⇾ X) :=\n  λ '(x, f), default_eq_func (λ n, match n with\n  | nat_0 => x\n  | nat_S m => f m\n  end).\n\nLemma Nat_destruct_is_fun {X:set} : IsFun (@Nat_destruct X).\nProof. intros [x f][y g]. change (x = y ∧ f = g ⊸ ∏ n, Nat_destruct (x, f) n = Nat_destruct (y, g) n).\n  rew <-all_adj. intros [| m].\n  + apply aandl.\n  + rew (aandr _ _). exact (all_lb _ _).\nQed.\n\nCanonical Structure Nat_destruct_fun {X:set} : _ ⇾ _ := @func_make _ _ _ (@Nat_destruct_is_fun X).\n\nSection dec.\n  Local Open Scope set_scope.\n  Local Definition eq_code : Nat → Nat → Ω := fix F (a b : Nat) := match (a, b) with\n  | (nat_0, nat_0) => 𝐓\n  | (nat_S _, nat_0) => 𝐅\n  | (nat_0, nat_S _) => 𝐅\n  | (nat_S m, nat_S n) => F m n\n  end.\n  Local Definition eq_encode : ∀ m n, m = n → eq_code m n.\n  Proof. intros n _ []. revert n. refine (fix F a := match a with\n    | nat_0 => I\n    | nat_S m => F m\n    end).\n  Defined.\n  Local Definition eq_decode : ∀ m n, eq_code m n → m = n.\n  Proof. notypeclasses refine (fix F (a b : Nat) {struct a} := match (a, b) as p return (eq_code (π₁ p) (π₂ p) → π₁ p = π₂ p) with\n    | (nat_0, nat_0) => λ c, _\n    | (nat_S _, nat_0) => λ c, match c with end\n    | (nat_0, nat_S _) => λ c, match c with end\n    | (nat_S m, nat_S n) => λ c : eq_code m n, _\n    end).\n    + now change (nat_0 = nat_0).\n    + change (Nat_S m = Nat_S n). now apply (is_fun Nat_S), F.\n  Qed.\n\n  Instance Nat_S_inj : Injective (X:=Nat) suc.\n  Proof. intros m n. apply affirmative_aimpl. intro E.\n    apply eq_decode. exact (eq_encode _ _ E).\n  Qed.\n\n  Definition Nat_S_nonzero (n:Nat) : suc n ≠ 0 := eq_encode _ _.\n\n  Definition nat_eq_dec := fix F (a b : nat) :=\n    match a with\n    | nat_0 => match b with\n      | nat_0 => true\n      | nat_S _ => false\n      end\n    | nat_S m => match b with\n      | nat_0 => false\n      | nat_S n => F m n\n      end\n    end.\n\n  Instance Nat_eq_dec : Dec (A:=Nat∗Nat) (=) := tuncurry nat_eq_dec.\n\n  Instance Nat_eq_is_dec : IsDecEq Nat.\n  Proof. intros [x y]. change (if nat_eq_dec x y then x = y else x ≠ y).\n    refine ((fix IH (a b : nat) := _) x y); clear x y.\n    destruct a as [| m], b as [| n]; cbn [ nat_eq_dec ].\n  + refl.\n  + intro E; pose proof eq_encode _ _ E as [].\n  + intro E; pose proof eq_encode _ _ E as [].\n  + specialize (IH m n). revert IH.\n    destruct (nat_eq_dec m n) as [|].\n    * apply (is_fun Nat_S m n).\n    * apply (contrapositive (injective suc m n)).\n  Qed.\n\n  Definition Nat_decidable : DecidableEquality Nat := Nat_eq_is_dec.\nEnd dec.\nGlobal Hint Extern 2 (Injective (X:=Nat) suc) => refine Nat_S_inj : typeclass_instances.\nGlobal Hint Extern 2 (DecidableEquality Nat) => refine Nat_decidable : typeclass_instances.\nGlobal Hint Extern 2 (AffirmativeEquality Nat) => refine Nat_decidable : typeclass_instances.\nGlobal Hint Extern 2 (RefutativeEquality Nat) => refine Nat_decidable : typeclass_instances.\nGlobal Hint Extern 2 (StrongSet Nat) => refine Nat_decidable : typeclass_instances.\n\nGlobal Hint Extern 2 (Dec (A:=nat) (=)) => refine Nat_eq_dec : typeclass_instances.\nGlobal Hint Extern 2 (Dec (A:=set_T Nat) (=)) => refine Nat_eq_dec : typecla fineConstructive.implementations.nat.nno","name":"Nat_S_inj","kind":"inst","local":true},{"s":4780,"e":4797,"lib":"AffineConstructive.interfaces.set","name":"DecidableEquality","kind":"class","local":false,"page":"../../interfaces/set.html"},{"s":4798,"e":4801,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat","kind":"canonstruc","local":true},{"s":4813,"e":4826,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_decidable","kind":"def","local":true},{"s":4872,"e":4891,"lib":"AffineConstructive.interfaces.set","name":"AffirmativeEquality","kind":"class","local":false,"page":"../../interfaces/set.html"},{"s":4892,"e":4895,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat","kind":"canonstruc","local":true},{"s":4907,"e":4920,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_decidable","kind":"def","local":true},{"s":4966,"e":4984,"lib":"AffineConstructive.interfaces.set","name":"RefutativeEquality","kind":"class","local":false,"page":"../../interfaces/set.html"},{"s":4985,"e":4988,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat","kind":"canonstruc","local":true},{"s":5000,"e":5013,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_decidable","kind":"def","local":true},{"s":5059,"e":5068,"lib":"AffineConstructive.interfaces.set","name":"StrongSet","kind":"class","local":false,"page":"../../interfaces/set.html"},{"s":5069,"e":5072,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat","kind":"canonstruc","local":true},{"s":5084,"e":5097,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_decidable","kind":"def","local":true},{"s":5144,"e":5147,"lib":"AffineConstructive.interfaces.aprop","name":"Dec","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":5152,"e":5155,"lib":"AffineConstructive.implementations.nat.nno","name":"nat","kind":"ind","local":true},{"s":5172,"e":5182,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_eq_dec","kind":"inst","local":true},{"s":5228,"e":5231,"lib":"AffineConstructive.interfaces.aprop","name":"Dec","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":5236,"e":5241,"lib":"AffineConstructive.interfaces.set","name":"set_T","kind":"proj","local":false,"page":"../../interfaces/set.html"},{"s":5242,"e":5245,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat","kind":"canonstruc","local":true},{"s":5262,"e":5272,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_eq_dec","kind":"inst","local":true},{"s":5319,"e":5326,"lib":"AffineConstructive.interfaces.set","name":"IsDecEq","kind":"class","local":false,"page":"../../interfaces/set.html"},{"s":5329,"e":5339,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_eq_dec","kind":"inst","local":true},{"s":5372,"e":5385,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_eq_is_dec","kind":"inst","local":true},{"s":1230,"e":1234,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":1420,"e":1423,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1906,"e":1910,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":1914,"e":1917,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2454,"e":2457,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2504,"e":2507,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3459,"e":3462,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3521,"e":3524,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4327,"e":4331,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file builds the natural numbers as an inductive type with a zero and a successor, makes it the set [[AffineConstructive.implementations.nat.nno.Nat]] with strict equality affirmed, and proves that it is a natural numbers object ([[AffineConstructive.implementations.nat.nno.Nat_NNO]]), with the maps out of it ([[AffineConstructive.implementations.nat.nno.Nat_rec]]) given by primitive recursion. It derives induction for affine predicates ([[AffineConstructive.implementations.nat.nno.Nat_ind]]) and a variant for predicates proved outright ([[AffineConstructive.implementations.nat.nno.Nat_sind]]), and defines case analysis on a natural as a function of sets ([[AffineConstructive.implementations.nat.nno.Nat_destruct]]). An encode–decode argument through [[AffineConstructive.implementations.nat.nno.eq_code]] shows that the successor is injective ([[AffineConstructive.implementations.nat.nno.Nat_S_inj]]) and never zero ([[AffineConstructive.implementations.nat.nno.Nat_S_nonzero]]). A boolean test then decides equality ([[AffineConstructive.implementations.nat.nno.Nat_eq_is_dec]]), which makes Nat a set with decidable equality and therefore affirmative, refutative and strong equality.","short":"The natural numbers as an inductive type: natural numbers object, induction, decidable equality","items":[{"name":"AffineConstructive.implementations.nat.nno.nat","base":"nat","kind":"ind","start":3,"body":null,"status":"ok","short":{"text":"The inductive type of natural numbers, generated by zero and successor","status":"ok"},"long":{"text":"The natural numbers as an inductive type with two constructors, a zero [[AffineConstructive.implementations.nat.nno.nat_0]] and a successor [[AffineConstructive.implementations.nat.nno.nat_S]]. The development compiles without the standard library, so this file supplies the type itself; everything else about the naturals is built on it.\n\nThe type is the carrier of the set [[AffineConstructive.implementations.nat.nno.Nat]], whose equality is strict equality, affirmed. Recursion on the type defines the map of [[AffineConstructive.implementations.nat.nno.Nat_rec]] out of the naturals, and the encoding of equality used to prove that the successor is injective and that equality is decidable.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.implementations.nat.nno.nat_rect","base":"nat_rect","kind":"scheme","short":{"text":"Recursion on nat into a family of types","status":"ok"}},{"name":"AffineConstructive.implementations.nat.nno.nat_ind","base":"nat_ind","kind":"scheme","short":{"text":"Induction on nat for Prop-valued predicates","status":"ok"}},{"name":"AffineConstructive.implementations.nat.nno.nat_rec","base":"nat_rec","kind":"scheme","short":{"text":"Recursion on nat into a family of sets in Set","status":"ok"}},{"name":"AffineConstructive.implementations.nat.nno.nat_sind","base":"nat_sind","kind":"scheme","short":{"text":"Induction on nat for SProp-valued predicates","status":"ok"}},{"name":"AffineConstructive.implementations.nat.nno.nat_0","base":"nat_0","kind":"constr","short":{"text":"The zero of nat","status":"ok"}},{"name":"AffineConstructive.implementations.nat.nno.nat_S","base":"nat_S","kind":"constr","short":{"text":"The successor constructor of nat","status":"ok"}}]},{"name":"AffineConstructive.implementations.nat.nno.Nat","base":"Nat","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"The set of natural numbers, with strict equality affirmed as its equality","status":"ok"},"long":{"text":"The affine set whose elements are the natural numbers of [[AffineConstructive.implementations.nat.nno.nat]] and whose equality is strict equality, affirmed. It is built by [[AffineConstructive.theory.default_equality.default_set_make]]. So m = n is the affirmation of m ≡ n, and the equality of Nat is affirmative by construction. A proof of m = n is a definitional identity and can be eliminated by case analysis, which is what the encoding of equality later in the file relies on.\n\nThe zero of Nat is [[AffineConstructive.implementations.nat.nno.nat_0]] and its successor is [[AffineConstructive.implementations.nat.nno.Nat_S]]. With these, Nat is the natural numbers object of the development ([[AffineConstructive.implementations.nat.nno.Nat_NNO]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.Nat_S","base":"Nat_S","kind":"def","start":11,"body":null,"status":"ok","short":{"text":"The successor of the naturals as a function Nat ⇾ Nat","status":"ok"},"long":{"text":"The constructor [[AffineConstructive.implementations.nat.nno.nat_S]] made into a function of sets. Nat has default equality, so any map out of it preserves equality, and [[AffineConstructive.theory.default_equality.default_eq_func]] supplies the proof. This is the successor of Nat in the sense of the interface for natural numbers, the map that [[AffineConstructive.interfaces.naturals.suc]] denotes on Nat.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.Nat_rec","base":"Nat_rec","kind":"inst","start":16,"body":null,"status":"ok","short":{"text":"Primitive recursion: the map Nat ⇾ X determined by a zero z and successor s on X","status":"ok"},"long":{"text":"For a set X with a point z and a function s : X ⇾ X, this is the function F : Nat ⇾ X defined by primitive recursion: F 0 = z and F (n + 1) = s (F n). Every map out of Nat preserves equality, because Nat has default equality, so F is a function of sets with no further proof.\n\nThis is the existence half of the universal property of the natural numbers. [[AffineConstructive.implementations.nat.nno.Nat_NNO]] shows that F preserves zero and successor and is the only map that does.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.Nat_NNO","base":"Nat_NNO","kind":"prf","start":17,"body":[18,31],"status":"ok","short":{"text":"Nat with zero and successor is a natural numbers object","status":"ok"},"proof":[{"text":"Fix a set X with a zero and a successor. Two things are left to show: the map defined by recursion out of Nat is a morphism, and every morphism from Nat to X equals it.","status":"ok","from":0,"to":1},{"text":"The recursively defined map sends 0 to the zero of X and n+1 to the successor of its value at n, by its definition. So it preserves zero and successor.","status":"ok","from":2,"to":3},{"text":"For uniqueness, let f be a morphism from Nat to X. Equality of maps is pointwise, so prove f x equal to the recursively defined map at x by structural recursion on x.","status":"ok","from":4,"to":6},{"text":"At 0, both maps give the zero of X; for f this is [[AffineConstructive.interfaces.abstract_algebra.preserves_0]].","status":"ok","from":7,"to":8},{"text":"At a successor x'+1, the recursively defined map gives the successor of its value at x'. The recursion hypothesis replaces that value by f x'. What is left, that f(x'+1) is the successor of f x', holds because f preserves the successor.","status":"ok","from":9,"to":13}]},{"name":"AffineConstructive.implementations.nat.nno.Nat_ind","base":"Nat_ind","kind":"prf","start":37,"body":[38,47],"status":"ok","short":{"text":"Induction: if each P n implies P (n+1), then P 0 implies P n for all n","status":"ok"},"proof":[{"text":"Assume that each P n implies P (n+1). Proving the universal statement means proving that P 0 implies P n for each n separately.","status":"ok","from":0,"to":2},{"text":"Proceed by structural recursion on n. When n is 0, P 0 implies P 0.","status":"ok","from":3,"to":5},{"text":"When n is m+1, the recursion gives that P 0 implies P m, which reduces the goal to P m implying P (m+1). That is the hypothesis at m.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.implementations.nat.nno.Nat_sind","base":"Nat_sind","kind":"prf","start":48,"body":[49,55],"status":"ok","short":{"text":"Induction with base-logic premises: P 0 and P n → P (n+1) for all n give ∏ n, P n","status":"ok"},"proof":[{"text":"Assume P 0, and that P n gives P (n+1) for each n in the base logic.","status":"ok","from":0,"to":1},{"text":"Apply affine induction ([[AffineConstructive.implementations.nat.nno.Nat_ind]]) to the predicate !P n. Its base case follows from the proof of P 0. Its conclusion, for all n, !P n, gives for all n, P n. What remains is the inductive step for !P.","status":"ok","from":2,"to":2},{"text":"Fix n. Because !P n is affirmative, an implication in the base logic is enough to give the affine implication ([[AffineConstructive.logic.aprop.affirmative_aimpl]]), and that base-logic implication is the assumed step at n.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.implementations.nat.nno.Nat_destruct","base":"Nat_destruct","kind":"def","start":56,"body":null,"status":"ok","short":{"text":"Case analysis on Nat: the map sending 0 to x and n+1 to f n","status":"ok"},"long":{"text":"Given a pair of a point x of X and a function f : Nat ⇾ X, this is the function on Nat that sends 0 to x and n + 1 to f n. It is definition by cases on the naturals, with no recursion. The pair lives in the cartesian product, whose equality is the additive conjunction of the equalities of its components.\n\n[[AffineConstructive.implementations.nat.nno.Nat_destruct_is_fun]] shows that the construction is itself a function of sets, and [[AffineConstructive.implementations.nat.nno.Nat_destruct_fun]] bundles it as one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.Nat_destruct_is_fun","base":"Nat_destruct_is_fun","kind":"prf","start":57,"body":[58,68],"status":"ok","short":{"text":"Equal pairs (x, f) give equal maps by case analysis on Nat","status":"ok"},"proof":[{"text":"Take pairs (x, f) and (y, g). Equality in the cartesian product is the additive conjunction x = y ∧ f = g, and equality of the two resulting maps is pointwise. So that conjunction must imply equality at every n.","status":"ok","from":0,"to":2},{"text":"Fix n and split into the cases n = 0 and n = m+1.","status":"ok","from":3,"to":4},{"text":"At 0 the two maps give x and y. The additive conjunction lets the proof choose its left conjunct, x = y.","status":"ok","from":5,"to":6},{"text":"At m+1 the two maps give f m and g m. Here the proof chooses the right conjunct, f = g, and specialises that pointwise equality at m.","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.implementations.nat.nno.Nat_destruct_fun","base":"Nat_destruct_fun","kind":"def","start":69,"body":null,"status":"ok","short":{"text":"Case analysis on Nat as a function of sets X × (Nat ⇾ X) ⇾ (Nat ⇾ X)","status":"ok"},"long":{"text":"The construction [[AffineConstructive.implementations.nat.nno.Nat_destruct]], bundled with the proof [[AffineConstructive.implementations.nat.nno.Nat_destruct_is_fun]] that it preserves equality, as a function from the product X × (Nat ⇾ X) to the set of functions Nat ⇾ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.eq_code","base":"eq_code","kind":"def","start":72,"body":null,"status":"ok","short":{"text":"The code for equality of naturals: 𝐓 on two zeros, 𝐅 on a mismatch, recursive on successors","status":"ok"},"long":{"text":"An affine proposition for each pair of naturals, defined by recursion on both arguments. It is 𝐓 when both are zero and 𝐅 when exactly one is zero; for two successors it is the code of their predecessors.\n\nThis is the encode–decode description of equality on an inductive type. Equality on [[AffineConstructive.implementations.nat.nno.Nat]] is strict equality, affirmed, and says nothing directly about how two naturals compare; the code instead computes, by its recursion, to a definite answer on each pair. [[AffineConstructive.implementations.nat.nno.eq_encode]] shows that equal naturals satisfy the code and [[AffineConstructive.implementations.nat.nno.eq_decode]] that naturals satisfying the code are equal, so the code and m = n are equivalent and the code serves as a computable description of equality in the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.eq_encode","base":"eq_encode","kind":"def","start":73,"body":[74,78],"status":"ok","short":{"text":"Equal naturals satisfy the code for equality","status":"ok"},"proof":[{"text":"An equality m = n on Nat is strict equality, so it reduces the goal to the code of n with itself.","status":"ok","from":0,"to":1},{"text":"Prove that eq_code n n holds for every n by structural recursion. At 0 the code is trivially true. At m+1 the code is the code of m with itself, which the recursion provides.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.implementations.nat.nno.eq_decode","base":"eq_decode","kind":"def","start":79,"body":[80,87],"status":"ok","short":{"text":"Naturals satisfying the code for equality are equal","status":"ok"},"proof":[{"text":"Proceed by recursion on the first argument, with case analysis on both. When one argument is 0 and the other a successor, the code is empty and there is nothing to prove.","status":"ok","from":0,"to":1},{"text":"When both are 0, the conclusion is 0 = 0, which holds by reflexivity.","status":"ok","from":2,"to":3},{"text":"When both are successors m+1 and n+1, the code is the code of m and n. By recursion this gives m = n, and the successor carries that equality to m+1 = n+1 ([[AffineConstructive.interfaces.set.is_fun]]).","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.implementations.nat.nno.Nat_S_inj","base":"Nat_S_inj","kind":"inst","start":88,"body":[89,95],"status":"ok","short":{"text":"The successor on Nat is injective","status":"ok"},"proof":[{"text":"Fix m and n. Equality on Nat is affirmative, so a base-logic implication from m+1 = n+1 to m = n gives the affine one ([[AffineConstructive.logic.aprop.affirmative_aimpl]]).","status":"ok","from":0,"to":2},{"text":"Given m+1 = n+1, encoding it ([[AffineConstructive.implementations.nat.nno.eq_encode]]) gives the code of m+1 and n+1, which is by definition the code of m and n. Decoding that code ([[AffineConstructive.implementations.nat.nno.eq_decode]]) gives m = n.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.implementations.nat.nno.Nat_S_nonzero","base":"Nat_S_nonzero","kind":"def","start":96,"body":null,"status":"ok","short":{"text":"The successor of a natural is not zero: suc n ≠ 0","status":"ok"},"long":{"text":"No successor equals zero. The term is [[AffineConstructive.implementations.nat.nno.eq_encode]] at the pair (suc n, 0): an equality suc n = 0 would give the code for equality there, and that code is 𝐅. Equality on Nat is affirmed strict equality, so this map to falsity is a proof of the inequality.\n\nTogether with [[AffineConstructive.implementations.nat.nno.Nat_S_inj]], this is the second of the two Peano properties of the successor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.nat_eq_dec","base":"nat_eq_dec","kind":"def","start":97,"body":null,"status":"ok","short":{"text":"The boolean test for equality of two naturals, by recursion on both","status":"ok"},"long":{"text":"A boolean function on pairs of naturals, defined by recursion. It returns true when both are zero, false when exactly one is zero, and on two successors it recurses on their predecessors. It is the decision procedure for the equality of [[AffineConstructive.implementations.nat.nno.Nat]]; [[AffineConstructive.implementations.nat.nno.Nat_eq_is_dec]] proves it correct.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.Nat_eq_dec","base":"Nat_eq_dec","kind":"inst","start":98,"body":null,"status":"ok","short":{"text":"The decision function for equality on Nat, the boolean test on pairs","status":"ok"},"long":{"text":"The test [[AffineConstructive.implementations.nat.nno.nat_eq_dec]], uncurried into a function on the product Nat ∗ Nat. It is registered as the boolean decision function for equality on Nat, the form in which [[AffineConstructive.implementations.nat.nno.Nat_eq_is_dec]] states its correctness.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.nno.Nat_eq_is_dec","base":"Nat_eq_is_dec","kind":"inst","start":99,"body":[100,119],"status":"ok","short":{"text":"The boolean test decides equality on Nat: true gives m = n, false gives m ≠ n","status":"ok"},"proof":[{"text":"Take x and y. The decision is the boolean test nat_eq_dec, so what must be shown is that the result true gives x = y and the result false gives x ≠ y.","status":"ok","from":0,"to":2},{"text":"Proceed by recursion on both arguments and split into four cases, computing the test in each one.","status":"ok","from":3,"to":4},{"text":"When both are 0, the test gives true and 0 = 0 holds by reflexivity.","status":"ok","from":5,"to":6},{"text":"When one argument is 0 and the other a successor, the test gives false. An equality between them would encode ([[AffineConstructive.implementations.nat.nno.eq_encode]]) to an empty code, so they are unequal.","status":"ok","from":7,"to":10},{"text":"When both are successors, the test reduces to the test on m and n. Specialise the recursion hypothesis to m and n, and split on the outcome of the test.","status":"ok","from":11,"to":14},{"text":"If the test gives true, the hypothesis gives m = n, and the successor carries this to m+1 = n+1 ([[AffineConstructive.interfaces.set.is_fun]]).","status":"ok","from":15,"to":16},{"text":"If the test gives false, the hypothesis gives m ≠ n. The successor is injective ([[AffineConstructive.implementations.nat.nno.Nat_S_inj]]), so the contrapositive of that injectivity ([[AffineConstructive.logic.aprop.contrapositive]]) gives m+1 ≠ n+1.","status":"ok","from":17,"to":19}]},{"name":"AffineConstructive.implementations.nat.nno.Nat_decidable","base":"Nat_decidable","kind":"def","start":120,"body":null,"status":"ok","short":{"text":"Nat has decidable equality","status":"ok"},"long":{"text":"The equality of Nat is decidable: every m = n is decided by the boolean test [[AffineConstructive.implementations.nat.nno.nat_eq_dec]]. This is the correctness proof [[AffineConstructive.implementations.nat.nno.Nat_eq_is_dec]], restated as the class [[AffineConstructive.interfaces.set.DecidableEquality]].\n\nThrough it, resolution also finds that the equality of Nat is affirmative and refutative, and that Nat is a strong set, so its inequality is an apartness.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.naturals":{"page":"../../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.default_equality":{"page":"../../theory/default_equality.html","short":"Discrete sets: equality as affirmed strict equality, and maps out of them","summary":"The file introduces the discrete sets of the development: [[default_set_make]] equips any type with the affirmed strict equality [[leq]] as its set equality, and the class [[DefaultEquality]] records that a set's equality is of this form. Such a set has affirmative equality ([[default_equality_affirmative]]), and every map out of it preserves equality ([[default_equality_is_fun]]), so that [[default_eq_func]] turns any bare map into a function of sets. The tensor product X ⊗ Y of two such sets again has default equality ([[DefaultEquality_tensor]]). It is the bridge by which inductive types such as the booleans and the naturals enter the theory of affine sets."},"AffineConstructive.theory.rings":{"page":"../../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.dec":{"page":"../../logic/dec.html","short":"Boolean decision functions for affine relations, and proving their instances by computation","summary":"The file collects lemmas for using a relation R together with a boolean decision function that is correct for it, in the sense of [[IsDec]]: the boolean [[AffineConstructive.interfaces.aprop.dec]] R x is true when R x holds and false when its negation does. [[dec_spec_by_iff]] transports this correctness along an equivalence R x ⧟ P, [[dec_spec_dual]] states the false branch by a De Morgan dual of R x instead of its negation, and [[dec_spec_andb]] combines two decisions by boolean conjunction, giving R₁ x₁ ∧ R₂ x₂ on true and R₁ x₁ᗮ ∨ R₂ x₂ᗮ on false. The main result, [[dec_spec_true]], is the equivalence R x ⧟ (dec R x = true), and the tactic [[decide_relation]] uses it to prove closed instances of a decidable relation by computing the boolean."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

":197,"e":202,"lib":"AffineConstructive.implementations.nat.nno","name":"nat_S","kind":"constr","local":false,"page":"nno.html"},{"s":208,"e":219,"lib":"Corelib.Init.Datatypes","name":"S","kind":"constr","local":false},{"s":221,"e":234,"lib":"AffineConstructive.implementations.nat.notation","name":"to_stdlib_nat:2","kind":"def","local":true},{"s":272,"e":285,"lib":"Corelib.Init.Datatypes","name":"nat","kind":"ind","local":false},{"s":289,"e":292,"lib":"AffineConstructive.implementations.nat.nno","name":"nat","kind":"ind","local":false,"page":"nno.html"},{"s":315,"e":326,"lib":"Corelib.Init.Datatypes","name":"O","kind":"constr","local":false},{"s":330,"e":335,"lib":"AffineConstructive.implementations.nat.nno","name":"nat_0","kind":"constr","local":false,"page":"nno.html"},{"s":340,"e":351,"lib":"Corelib.Init.Datatypes","name":"S","kind":"constr","local":false},{"s":357,"e":362,"lib":"AffineConstructive.implementations.nat.nno","name":"nat_S","kind":"constr","local":false,"page":"nno.html"},{"s":364,"e":377,"lib":"AffineConstructive.implementations.nat.notation","name":"of_stdlib_nat:5","kind":"def","local":true},{"s":430,"e":433,"lib":"AffineConstructive.implementations.nat.nno","name":"nat","kind":"ind","local":false,"page":"nno.html"},{"s":437,"e":450,"lib":"AffineConstructive.implementations.nat.notation","name":"of_stdlib_nat","kind":"def","local":true},{"s":452,"e":467,"lib":"Corelib.Init.Nat","name":"of_num_uint","kind":"def","local":false},{"s":498,"e":501,"lib":"AffineConstructive.implementations.nat.nno","name":"nat","kind":"ind","local":false,"page":"nno.html"},{"s":520,"e":535,"lib":"Corelib.Init.Nat","name":"to_num_uint","kind":"def","local":false},{"s":537,"e":550,"lib":"AffineConstructive.implementations.nat.notation","name":"to_stdlib_nat","kind":"def","local":true},{"s":572,"e":575,"lib":"AffineConstructive.implementations.nat.nno","name":"nat","kind":"ind","local":false,"page":"nno.html"},{"s":576,"e":587,"lib":"AffineConstructive.implementations.nat.notation","name":"of_num_uint","kind":"def","local":true},{"s":588,"e":599,"lib":"AffineConstructive.implementations.nat.notation","name":"to_num_uint","kind":"def","local":true}],"gloss":{"summary":"The file gives the development's natural numbers [[AffineConstructive.implementations.nat.nno.nat]] decimal literal notation. It defines recursive conversions in both directions between this type and Rocq's built-in naturals, [[AffineConstructive.implementations.nat.notation.to_stdlib_nat]] and [[AffineConstructive.implementations.nat.notation.of_stdlib_nat]], and composes them with Rocq's numeral conversions to get [[AffineConstructive.implementations.nat.notation.of_num_uint]] and [[AffineConstructive.implementations.nat.notation.to_num_uint]]. These two functions are registered as the numeral notation for nat in the scope of naturals, so literals can be both read and printed as elements of the development's own type. The file has no theorems.","short":"Decimal literal notation for the development's natural numbers","items":[{"name":"AffineConstructive.implementations.nat.notation.to_stdlib_nat","base":"to_stdlib_nat","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"The translation of the development's naturals into Rocq's built-in natural numbers","status":"ok"},"long":{"text":"The structural recursion sending [[AffineConstructive.implementations.nat.nno.nat_0]] to the built-in zero and [[AffineConstructive.implementations.nat.nno.nat_S]] y to the built-in successor of the translation of y. It identifies the development's inductive naturals [[AffineConstructive.implementations.nat.nno.nat]] with Rocq's built-in type of natural numbers, which is distinct from it because the library is compiled without the standard library and defines its own.\n\nIts only use is to reach Rocq's conversion from built-in naturals to decimal numerals, which [[AffineConstructive.implementations.nat.notation.to_num_uint]] needs to print a natural as a numeral.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.notation.of_stdlib_nat","base":"of_stdlib_nat","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"The translation of Rocq's built-in natural numbers into the development's naturals","status":"ok"},"long":{"text":"The structural recursion sending the built-in zero to [[AffineConstructive.implementations.nat.nno.nat_0]] and the built-in successor of y to [[AffineConstructive.implementations.nat.nno.nat_S]] applied to the translation of y; it is inverse to [[AffineConstructive.implementations.nat.notation.to_stdlib_nat]]. It lets the development use Rocq's conversion from decimal numerals to built-in naturals, through [[AffineConstructive.implementations.nat.notation.of_num_uint]], to read numerals as elements of [[AffineConstructive.implementations.nat.nno.nat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.notation.of_num_uint","base":"of_num_uint","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"Converts an unsigned decimal numeral to a natural number","status":"ok"},"long":{"text":"This is the composite of Rocq's conversion from unsigned decimal numerals to its built-in naturals and [[AffineConstructive.implementations.nat.notation.of_stdlib_nat]]. It sends a numeral to the element of [[AffineConstructive.implementations.nat.nno.nat]] that has the same value, built from [[AffineConstructive.implementations.nat.nno.nat_0]] by repeated [[AffineConstructive.implementations.nat.nno.nat_S]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.notation.to_num_uint","base":"to_num_uint","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"Converts a natural number to its unsigned decimal numeral","status":"ok"},"long":{"text":"This is the composite of [[AffineConstructive.implementations.nat.notation.to_stdlib_nat]] and Rocq's conversion from its built-in naturals to unsigned decimal numerals. It sends an element of [[AffineConstructive.implementations.nat.nno.nat]] to the decimal numeral for the number of times [[AffineConstructive.implementations.nat.nno.nat_S]] is applied to [[AffineConstructive.implementations.nat.nno.nat_0]]. It is inverse to [[AffineConstructive.implementations.nat.notation.of_num_uint]].","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.implementations.nat.nno":{"page":"nno.html","short":"The natural numbers as an inductive type: natural numbers object, induction, decidable equality","summary":"The file builds the natural numbers as an inductive type with a zero and a successor, makes it the set [[Nat]] with strict equality affirmed, and proves that it is a natural numbers object ([[Nat_NNO]]), with the maps out of it ([[Nat_rec]]) given by primitive recursion. It derives induction for affine predicates ([[Nat_ind]]) and a variant for predicates proved outright ([[Nat_sind]]), and defines case analysis on a natural as a function of sets ([[Nat_destruct]]). An encode–decode argument through [[eq_code]] shows that the successor is injective ([[Nat_S_inj]]) and never zero ([[Nat_S_nonzero]]). A boolean test then decides equality ([[Nat_eq_is_dec]]), which makes Nat a set with decidable equality and therefore affirmative, refutative and strong equality."},"Corelib.Init.Nat":{"page":null,"short":null,"summary":null},"Corelib.Init.Datatypes":{"page":null,"short":null,"summary":null},"Corelib.Init.Number":{"page":null,"short":null,"summary":null}},"constants":null}</script>

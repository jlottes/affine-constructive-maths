"lib":"AffineConstructive.interfaces.aprop","name":"Dec","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":3016,"e":3021,"lib":"AffineConstructive.interfaces.set","name":"set_T","kind":"proj","local":false,"page":"../../interfaces/set.html"},{"s":3023,"e":3035,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"near_rig_car","kind":"proj","local":false,"page":"../../interfaces/bundled_algebra.html"},{"s":3036,"e":3048,"lib":"AffineConstructive.implementations.nat.rig","name":"Nat_near_rig","kind":"canonstruc","local":true},{"s":3070,"e":3080,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_eq_dec","kind":"inst","local":false,"page":"nno.html"},{"s":3126,"e":3129,"lib":"AffineConstructive.interfaces.aprop","name":"Dec","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":3134,"e":3139,"lib":"AffineConstructive.interfaces.set","name":"set_T","kind":"proj","local":false,"page":"../../interfaces/set.html"},{"s":3141,"e":3153,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"near_rig_car","kind":"proj","local":false,"page":"../../interfaces/bundled_algebra.html"},{"s":3155,"e":3168,"lib":"AffineConstructive.interfaces.naturals","name":"nats_near_rig","kind":"proj","local":false,"page":"../../interfaces/naturals.html"},{"s":3169,"e":3181,"lib":"AffineConstructive.implementations.nat.rig","name":"Nat_naturals","kind":"canonstruc","local":true},{"s":3204,"e":3214,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat_eq_dec","kind":"inst","local":false,"page":"nno.html"},{"s":2459,"e":2462,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"This file takes the rig structure that [[AffineConstructive.implementations.nno_rig]] defines on any natural numbers object and applies it to the concrete set [[AffineConstructive.implementations.nat.nno.Nat]]. The unit, addition and multiplication of Nat are the ones the natural numbers object provides, and [[AffineConstructive.implementations.nat.rig.Nat_com_rig]] makes Nat a commutative rig. Hints let resolution find every weaker algebraic structure on Nat through that rig. The file also bundles Nat as the near-rig [[AffineConstructive.implementations.nat.rig.Nat_near_rig]], gives the canonical map out of Nat into any monoid with 1 as [[AffineConstructive.implementations.nat.rig.Nat_to_mon]], and proves [[AffineConstructive.implementations.nat.rig.Nat_is_naturals]], that Nat satisfies the naturals interface. All of this is packed into the bundled model [[AffineConstructive.implementations.nat.rig.Nat_naturals]].","short":"The natural numbers Nat as a commutative rig and a model of the naturals interface","items":[{"name":"AffineConstructive.implementations.nat.rig.nat_one","base":"nat_one","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"The unit 1 of Nat, the successor of 0","status":"ok"},"long":{"text":"The element 1 of the natural numbers [[AffineConstructive.implementations.nat.nno.Nat]], taken from the unit [[AffineConstructive.implementations.nno_rig.nno_one]] that any natural numbers object has: the successor of 0. A resolution hint registers it, so 1 written at Nat means this element.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.rig.nat_plus","base":"nat_plus","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"Addition on Nat, the addition of a natural numbers object","status":"ok"},"long":{"text":"Addition on the natural numbers [[AffineConstructive.implementations.nat.nno.Nat]]. It is the operation [[AffineConstructive.implementations.nno_rig.nno_plus]] defines on any natural numbers object: x + y applies the successor x times to y. Like every addition in the development it is a map out of the tensor product Nat ⊗ Nat. A resolution hint registers it, so + at Nat means this operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.rig.nat_mult","base":"nat_mult","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"Multiplication on Nat, the multiplication of a natural numbers object","status":"ok"},"long":{"text":"Multiplication on the natural numbers [[AffineConstructive.implementations.nat.nno.Nat]]. It is the operation [[AffineConstructive.implementations.nno_rig.nno_mult]] defines on any natural numbers object: x · y adds y to 0, x times. A resolution hint registers it, so · at Nat means this operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.rig.Nat_com_rig","base":"Nat_com_rig","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"Nat is a commutative rig under its addition and multiplication","status":"ok"},"long":{"text":"The natural numbers [[AffineConstructive.implementations.nat.nno.Nat]], with 0, 1, + and · as defined in this file, form a commutative rig. This is the general theorem [[AffineConstructive.implementations.nno_rig.nno_com_rig]], that any natural numbers object is a commutative rig, applied to Nat.\n\nResolution hints make this one instance supply every weaker structure on Nat that it implies: rig, rg, near-rig and near-rg on both sides, the additive and multiplicative monoids and semigroups, and the commutative multiplicative monoid. A proof that needs any of these at Nat finds it here.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.rig.Nat_near_rig","base":"Nat_near_rig","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The natural numbers Nat as a bundled near-rig, with their addition, 0, multiplication and 1","status":"ok"},"long":{"text":"The natural numbers [[AffineConstructive.implementations.nat.nno.Nat]] bundled with their addition, zero, multiplication and unit into a near-rig by [[AffineConstructive.interfaces.bundled_algebra.make_near_rig]]. It is declared a canonical structure, so unification finds this bundle whenever a near-rig with carrier Nat is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.rig.Nat_to_mon","base":"Nat_to_mon","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"The canonical map from Nat into each set with 0, + and 1","status":"ok"},"long":{"text":"For each set M with an addition, a zero and a one, the map from [[AffineConstructive.implementations.nat.nno.Nat]] into M that the naturals interface asks for. It sends n to the sum of n copies of 1. It is [[AffineConstructive.implementations.nno_naturals.nno_to_mon]], the map out of a natural numbers object, at Nat. Hints register it both for Nat and for the carrier of the bundled near-rig [[AffineConstructive.implementations.nat.rig.Nat_near_rig]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.rig.Nat_is_naturals","base":"Nat_is_naturals","kind":"prf","start":29,"body":[30,32],"status":"ok","short":{"text":"Nat satisfies the naturals interface: initial among additive monoids with a chosen 1","status":"ok"},"proof":[{"text":"Nat with zero and successor is a natural numbers object, and with its addition and multiplication it is a commutative rig, hence a near-rig, in which the successor of n is 1 + n. These are the hypotheses of [[AffineConstructive.implementations.nno_naturals.nno_naturals]], which concludes that Nat is initial among additive monoids with a chosen 1.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.nat.rig.Nat_naturals","base":"Nat_naturals","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"Nat as a bundled model of the naturals","status":"ok"},"long":{"text":"The bundled model of the naturals carried by [[AffineConstructive.implementations.nat.nno.Nat]], built by [[AffineConstructive.interfaces.naturals.Build_naturals]] from the near-rig [[AffineConstructive.implementations.nat.rig.Nat_near_rig]], the canonical maps [[AffineConstructive.implementations.nat.rig.Nat_to_mon]] and the laws [[AffineConstructive.implementations.nat.rig.Nat_is_naturals]]. It is a canonical structure, so a statement about any model of the naturals applies to Nat. Hints make the decision procedure for equality on Nat available through this bundle and through [[AffineConstructive.implementations.nat.rig.Nat_near_rig]].","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.naturals":{"page":"../../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.rings":{"page":"../../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.implementations.nat.nno":{"page":"nno.html","short":"The natural numbers as an inductive type: natural numbers object, induction, decidable equality","summary":"The file builds the natural numbers as an inductive type with a zero and a successor, makes it the set [[Nat]] with strict equality affirmed, and proves that it is a natural numbers object ([[Nat_NNO]]), with the maps out of it ([[Nat_rec]]) given by primitive recursion. It derives induction for affine predicates ([[Nat_ind]]) and a variant for predicates proved outright ([[Nat_sind]]), and defines case analysis on a natural as a function of sets ([[Nat_destruct]]). An encode–decode argument through [[eq_code]] shows that the successor is injective ([[Nat_S_inj]]) and never zero ([[Nat_S_nonzero]]). A boolean test then decides equality ([[Nat_eq_is_dec]]), which makes Nat a set with decidable equality and therefore affirmative, refutative and strong equality."},"AffineConstructive.theory.nno":{"page":"../../theory/nno.html","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[nno_to_nno_bijective]]). By transport along the comparison with [[Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[nno_ind]], with a base-logic variant [[nno_ind_alt]] and the tactic [[nno_induction]]. It also defines primitive recursion [[nno_rec]] with its base and step equations, and bundles it as a function of its step function [[nno_rec_fun]] when X is a strong set."},"AffineConstructive.implementations.nno_rig":{"page":"../nno_rig.html","short":"Addition and multiplication on a natural numbers object: its commutative rig structure","summary":"This file builds the arithmetic of any natural numbers object. One is defined as the successor of zero. Addition [[nno_plus]] is primitive recursion with the successor, and multiplication [[nno_mult]] is primitive recursion with addition, both through [[nno_rec]]. Each law is proved by induction on the natural numbers object, starting from the recursion equations of addition and multiplication. The addition laws give the commutative additive monoid [[nno_add_mon]]. The multiplication laws (identity, absorption by zero, distributivity, commutativity and associativity) give the commutative rig [[nno_com_rig]]."},"AffineConstructive.implementations.nno_naturals":{"page":"../nno_naturals.html","short":"A natural numbers object with a compatible near-rig structure satisfies the naturals interface","summary":"This file shows that a natural numbers object ℕ which is also a near-rig, with successor agreeing with n ↦ 1 + n, satisfies the interface [[Naturals]]: it is initial among additive monoids, not necessarily commutative, with a chosen element 1. The map into such a monoid M is the canonical map out of the natural numbers object, [[nno_to_set]], with M given zero 0 and successor x ↦ 1 + x. The file proves that this map sends 1 to 1 ([[nno_to_mon_one]]) and preserves addition ([[nno_to_mon_plus]], by induction on the first summand). Taking the successor to add 1 on the left is what makes the induction work without commutativity. For uniqueness ([[nno_to_mon_unique]]), any additive monoid morphism that preserves 1 also preserves zero and successor, so the initiality of the natural numbers object, [[nno_initial]], identifies it with the canonical map. [[nno_naturals]] puts these results together."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."}},"constants":null}</script>

kind":"class","local":false,"page":"../../interfaces/naturals.html"},{"s":1571,"e":1574,"lib":"AffineConstructive.implementations.nat.nno","name":"Nat","kind":"canonstruc","local":false,"page":"nno.html"},{"s":1586,"e":1603,"lib":"AffineConstructive.implementations.nat.subtract","name":"Nat_subtract_spec","kind":"thm","local":true},{"s":1649,"e":1664,"lib":"AffineConstructive.interfaces.naturals","name":"NatSubtractSpec","kind":"class","local":false,"page":"../../interfaces/naturals.html"},{"s":1666,"e":1678,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"near_rig_car","kind":"proj","local":false,"page":"../../interfaces/bundled_algebra.html"},{"s":1680,"e":1693,"lib":"AffineConstructive.interfaces.naturals","name":"nats_near_rig","kind":"proj","local":false,"page":"../../interfaces/naturals.html"},{"s":1694,"e":1706,"lib":"AffineConstructive.implementations.nat.rig","name":"Nat_naturals","kind":"canonstruc","local":false,"page":"rig.html"},{"s":1720,"e":1737,"lib":"AffineConstructive.implementations.nat.subtract","name":"Nat_subtract_spec","kind":"thm","local":true},{"s":1096,"e":1100,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"This file gives the concrete naturals [[AffineConstructive.implementations.nat.nno.Nat]] a three-way comparison with difference. [[AffineConstructive.implementations.nat.subtract.Nat_subtract_raw]] compares two naturals by recursion on both at once. It returns equal, less by z or greater by z, where z is the difference. [[AffineConstructive.implementations.nat.subtract.Nat_subtract]] makes this a function of sets out of the default equality of [[AffineConstructive.implementations.nat.nno.Nat]]. [[AffineConstructive.implementations.nat.subtract.Nat_subtract_spec]] proves it correct by induction. For less by z the equation is x + z = y, for greater by z it is x = y + z, and in both cases z is nonzero. The zero cases follow from [[AffineConstructive.theory.additive_groups.plus_0_l]] and [[AffineConstructive.theory.nno.nno_suc_nonzero]], and the successor case applies the successor to the induction hypothesis. Hints register both the operation and its correctness for the concrete model of the naturals.","short":"Three-way comparison with difference on the concrete naturals, and its correctness","items":[{"name":"AffineConstructive.implementations.nat.subtract.Nat_subtract_raw","base":"Nat_subtract_raw","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"Compares two naturals by recursion, returning equal, less by the difference, or greater by the difference","status":"ok"},"long":{"text":"The comparison with difference on the concrete naturals, as a plain function of two arguments. It recurses on both arguments together. When both are zero the outcome is [[natsubtract.is_eq]]. When only the first is zero the outcome is [[AffineConstructive.interfaces.naturals.natsubtract.is_lt_by]] with the second argument as the difference, and when only the second is zero it is [[AffineConstructive.interfaces.naturals.natsubtract.is_gt_by]] with the first. When both are successors, the comparison moves on to their predecessors. In the outcomes \"less by\" and \"greater by\", the difference is always a successor, so it is nonzero.\n\nThe function is defined on the carrier and does not mention the equality of [[AffineConstructive.implementations.nat.nno.Nat]]. [[AffineConstructive.implementations.nat.subtract.Nat_subtract]] makes it a function of sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.subtract.Nat_subtract","base":"Nat_subtract","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"The comparison with difference on Nat, as a function from pairs of naturals to outcomes","status":"ok"},"long":{"text":"Equips [[AffineConstructive.implementations.nat.nno.Nat]] with the operation [[AffineConstructive.interfaces.naturals.NatSubtract]] requires: a function of sets that takes a pair of naturals to one of the outcomes in [[natsubtract.t]]. It takes [[AffineConstructive.implementations.nat.subtract.Nat_subtract_raw]] as a function on pairs and makes it a function of sets with [[AffineConstructive.theory.default_equality.default_eq_func]]. This works because the equality of [[AffineConstructive.implementations.nat.nno.Nat]] is the default one, so any map out of it preserves equality.\n\nHints register the operation for [[AffineConstructive.implementations.nat.nno.Nat]] and for the carrier of the near-rig underlying the concrete model of the naturals. As a result, theorems about the abstract naturals that use subtraction apply to [[AffineConstructive.implementations.nat.nno.Nat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nat.subtract.Nat_subtract_spec","base":"Nat_subtract_spec","kind":"prf","start":9,"body":[10,33],"status":"ok","short":{"text":"The comparison on Nat is correct: each outcome's equation holds, with a nonzero difference","status":"ok"},"proof":[{"text":"Unfold the specification and the comparison function. For all naturals x and y, the outcome of [[AffineConstructive.implementations.nat.subtract.Nat_subtract_raw]] on x and y must satisfy its equation: x + z = y with z ≠ 0 when x is less by z, x = y when they are equal, and x = y + z with z ≠ 0 when x is greater by z.","status":"ok","from":0,"to":2},{"text":"Proceed by recursion on x, the induction hypothesis being the whole statement for smaller first arguments, and split each of x and y into zero or a successor. Computing the comparison in each case leaves four goals.","status":"ok","from":3,"to":3},{"text":"When both are zero the outcome is equal, and 0 = 0 holds by reflexivity.","status":"ok","from":4,"to":5},{"text":"When x is zero and y is the successor of y', the outcome is less by suc y'. The equation 0 + suc y' = suc y' is [[AffineConstructive.theory.additive_groups.plus_0_l]], and suc y' ≠ 0 is [[AffineConstructive.theory.nno.nno_suc_nonzero]].","status":"ok","from":6,"to":7},{"text":"When x is the successor of x' and y is zero, the outcome is greater by suc x'. The equation suc x' = 0 + suc x' is [[AffineConstructive.theory.additive_groups.plus_0_l]] read backwards by symmetry, and again suc x' ≠ 0 is [[AffineConstructive.theory.nno.nno_suc_nonzero]].","status":"ok","from":8,"to":9},{"text":"When both are successors, the comparison of suc x' and suc y' is by definition the comparison of x' and y'. Specialise the induction hypothesis at x' and y', and split on the outcome. In each case it remains to pass from the equation for x' and y' to the equation for their successors.","status":"ok","from":10,"to":13},{"text":"If x' is less than y' by z, the hypothesis gives x' + z = y' and z ≠ 0. The second carries over unchanged. Applying the successor to the first gives suc (x' + z) = suc y', and by the definition of addition the left side is suc x' + z.","status":"ok","from":14,"to":16},{"text":"If x' = y', applying the successor gives suc x' = suc y'.","status":"ok","from":17,"to":19},{"text":"If x' is greater than y' by z, the hypothesis gives x' = y' + z and z ≠ 0. The second carries over unchanged. Applying the successor to the first gives suc x' = suc (y' + z), which by the definition of addition is suc x' = suc y' + z.","status":"ok","from":20,"to":23}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.default_equality":{"page":"../../theory/default_equality.html","short":"Discrete sets: equality as affirmed strict equality, and maps out of them","summary":"The file introduces the discrete sets of the development: [[default_set_make]] equips any type with the affirmed strict equality [[leq]] as its set equality, and the class [[DefaultEquality]] records that a set's equality is of this form. Such a set has affirmative equality ([[default_equality_affirmative]]), and every map out of it preserves equality ([[default_equality_is_fun]]), so that [[default_eq_func]] turns any bare map into a function of sets. The tensor product X ⊗ Y of two such sets again has default equality ([[DefaultEquality_tensor]]). It is the bridge by which inductive types such as the booleans and the naturals enter the theory of affine sets."},"AffineConstructive.interfaces.naturals":{"page":"../../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.implementations.nat.nno":{"page":"nno.html","short":"The natural numbers as an inductive type: natural numbers object, induction, decidable equality","summary":"The file builds the natural numbers as an inductive type with a zero and a successor, makes it the set [[Nat]] with strict equality affirmed, and proves that it is a natural numbers object ([[Nat_NNO]]), with the maps out of it ([[Nat_rec]]) given by primitive recursion. It derives induction for affine predicates ([[Nat_ind]]) and a variant for predicates proved outright ([[Nat_sind]]), and defines case analysis on a natural as a function of sets ([[Nat_destruct]]). An encode–decode argument through [[eq_code]] shows that the successor is injective ([[Nat_S_inj]]) and never zero ([[Nat_S_nonzero]]). A boolean test then decides equality ([[Nat_eq_is_dec]]), which makes Nat a set with decidable equality and therefore affirmative, refutative and strong equality."},"AffineConstructive.implementations.nat.rig":{"page":"rig.html","short":"The natural numbers Nat as a commutative rig and a model of the naturals interface","summary":"This file takes the rig structure that [[nno_rig]] defines on any natural numbers object and applies it to the concrete set [[Nat]]. The unit, addition and multiplication of Nat are the ones the natural numbers object provides, and [[Nat_com_rig]] makes Nat a commutative rig. Hints let resolution find every weaker algebraic structure on Nat through that rig. The file also bundles Nat as the near-rig [[Nat_near_rig]], gives the canonical map out of Nat into any monoid with 1 as [[Nat_to_mon]], and proves [[Nat_is_naturals]], that Nat satisfies the naturals interface. All of this is packed into the bundled model [[Nat_naturals]]."},"AffineConstructive.theory.additive_groups":{"page":"../../theory/additive_groups.html","short":"Groups, monoids and their morphisms in additive notation","summary":"This file restates the generic group theory of theory/groups.v in the additive notation that rings use. To do so it views a set with +, 0 and − as a group through [[AdditiveGroupOps]]. It gives constructors for the additive semigroup, monoid and group structures, commutative or not, and the coercions among them. It also restates the basic laws under additive names: associativity, commutativity, the identity and inverse laws, the involution and distributivity of negation, [[negate_0]], [[equal_by_zero_sum]] and [[flip_negate]]. For additive semigroup and monoid morphisms it gives preservation of addition, negation and subtraction, together with identities, composites and inverses. [[Build_AdditiveGroup_Morphism]] shows that a map between groups that preserves addition is a monoid morphism. The file closes with simplification rules that cancel zeros and inverses, transport of structure along injections, and the quotation rules for + and −."},"AffineConstructive.theory.nno":{"page":"../../theory/nno.html","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[nno_to_nno_bijective]]). By transport along the comparison with [[Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[nno_ind]], with a base-logic variant [[nno_ind_alt]] and the tactic [[nno_induction]]. It also defines primitive recursion [[nno_rec]] with its base and step equations, and bundles it as a function of its step function [[nno_rec_fun]] when X is a strong set."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."}},"constants":null}</script>

o_naturals","name":"initial_mon.another_monoid.f","kind":"var","local":true},{"s":1301,"e":1312,"lib":"AffineConstructive.implementations.nno_naturals","name":"initial_mon.suc_correct","kind":"var","local":true},{"s":1339,"e":1340,"lib":"AffineConstructive.implementations.nno_naturals","name":"initial_mon.another_monoid.f","kind":"var","local":true},{"s":1382,"e":1383,"lib":"AffineConstructive.implementations.nno_naturals","name":"initial_mon.another_monoid.f","kind":"var","local":true},{"s":1386,"e":1387,"lib":"AffineConstructive.implementations.nno_naturals","name":"ϕ","kind":"abbrev","local":true},{"s":1407,"e":1418,"lib":"AffineConstructive.interfaces.naturals","name":"nno_initial","kind":"meth","local":false,"page":"../interfaces/naturals.html"},{"s":1419,"e":1420,"lib":"AffineConstructive.implementations.nno_naturals","name":"initial_mon.another_monoid.f","kind":"var","local":true},{"s":1474,"e":1482,"lib":"AffineConstructive.interfaces.naturals","name":"Naturals","kind":"class","local":false,"page":"../interfaces/naturals.html"},{"s":1483,"e":1484,"lib":"AffineConstructive.implementations.nno_naturals","name":"initial_mon.ℕ","kind":"var","local":true},{"s":1539,"e":1572,"lib":"AffineConstructive.theory.additive_groups","name":"alt_Build_AdditiveMonoid_Morphism","kind":"def","local":false,"page":"../theory/additive_groups.html"},{"s":1586,"e":1601,"lib":"AffineConstructive.implementations.nno_naturals","name":"nno_to_mon_plus","kind":"thm","local":true},{"s":1616,"e":1627,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"preserves_0","kind":"def","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":1629,"e":1639,"lib":"AffineConstructive.interfaces.naturals","name":"nno_to_set","kind":"def","local":false,"page":"../interfaces/naturals.html"},{"s":1640,"e":1641,"lib":"AffineConstructive.implementations.nno_naturals","name":"initial_mon.ℕ","kind":"var","local":true},{"s":1657,"e":1671,"lib":"AffineConstructive.implementations.nno_naturals","name":"nno_to_mon_one","kind":"thm","local":true},{"s":1687,"e":1704,"lib":"AffineConstructive.implementations.nno_naturals","name":"nno_to_mon_unique","kind":"thm","local":true},{"s":668,"e":671,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":720,"e":737,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":846,"e":859,"lib":"AffineConstructive.theory.nno","name":"nno_induction","kind":"ltac","local":false,"page":"../theory/nno.html"},{"s":877,"e":880,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":881,"e":884,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":958,"e":961,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":984,"e":987,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1042,"e":1059,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":1063,"e":1066,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1296,"e":1299,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1317,"e":1320,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1321,"e":1338,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":1677,"e":1680,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file shows that a natural numbers object ℕ which is also a near-rig, with successor agreeing with n ↦ 1 + n, satisfies the interface [[AffineConstructive.interfaces.naturals.Naturals]]: it is initial among additive monoids, not necessarily commutative, with a chosen element 1. The map into such a monoid M is the canonical map out of the natural numbers object, [[AffineConstructive.interfaces.naturals.nno_to_set]], with M given zero 0 and successor x ↦ 1 + x. The file proves that this map sends 1 to 1 ([[AffineConstructive.implementations.nno_naturals.nno_to_mon_one]]) and preserves addition ([[AffineConstructive.implementations.nno_naturals.nno_to_mon_plus]], by induction on the first summand). Taking the successor to add 1 on the left is what makes the induction work without commutativity. For uniqueness ([[AffineConstructive.implementations.nno_naturals.nno_to_mon_unique]]), any additive monoid morphism that preserves 1 also preserves zero and successor, so the initiality of the natural numbers object, [[AffineConstructive.interfaces.naturals.nno_initial]], identifies it with the canonical map. [[AffineConstructive.implementations.nno_naturals.nno_naturals]] puts these results together.","short":"A natural numbers object with a compatible near-rig structure satisfies the naturals interface","items":[{"name":"AffineConstructive.implementations.nno_naturals.nno_to_mon","base":"nno_to_mon","kind":"inst","start":7,"body":null,"status":"ok","short":{"text":"The map from a natural numbers object into each monoid with 1, the canonical map out of the NNO","status":"ok"},"long":{"text":"For a natural numbers object ℕ, the map into an additive monoid M with a chosen element 1 is the canonical map [[AffineConstructive.interfaces.naturals.nno_to_set]] out of ℕ, with M regarded as a set with zero and successor: its zero is the zero of the monoid and its successor adds 1 on the left, x ↦ 1 + x. So the map sends 0 to 0 and suc n to 1 + (image of n).\n\nThis supplies the operation [[AffineConstructive.interfaces.naturals.NaturalsToMon]] that the interface [[AffineConstructive.interfaces.naturals.Naturals]] asks for. It is defined as soon as ℕ is a natural numbers object; the near-rig structure on ℕ and the agreement of its successor with 1 + − are needed only for the lemmas that follow, which show this map is a morphism of monoids with 1 and the only one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_naturals.ϕ","base":"ϕ","kind":"abbrev","start":13,"body":null,"status":"ok","short":{"text":"Local name for the canonical map from ℕ into the monoid M","status":"ok"},"long":{"text":"Within the section on a fixed additive monoid M with 1, ϕ abbreviates the canonical map [[AffineConstructive.interfaces.naturals.nno_to_set]] from the natural numbers object ℕ into M, where M carries zero 0 and successor x ↦ 1 + x. It is notation only, used to state and prove that this map preserves 1 and addition and is the unique such morphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_naturals.nno_to_mon_one","base":"nno_to_mon_one","kind":"prf","start":14,"body":[15,19],"status":"ok","short":{"text":"The canonical map from ℕ into a monoid with 1 sends 1 to 1","status":"ok"},"proof":[{"text":"Write 1 in ℕ as 1 + 0 by [[AffineConstructive.theory.additive_groups.plus_0_r]], and then as the successor of 0 by the agreement of successor with n ↦ 1 + n. It remains to show that ϕ sends suc 0 to 1.","status":"ok","from":0,"to":1},{"text":"The canonical map preserves zero and successor, so ϕ (suc 0) is the successor of 0 in M. Since M is given the successor x ↦ 1 + x, what remains is 1 + 0 = 1 in M.","status":"ok","from":2,"to":2},{"text":"This is the right unit law of the monoid M, [[AffineConstructive.theory.additive_groups.plus_0_r]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.implementations.nno_naturals.nno_to_mon_plus","base":"nno_to_mon_plus","kind":"prf","start":20,"body":[21,33],"status":"ok","short":{"text":"The canonical map from ℕ into an additive monoid preserves addition: ϕ (x + y) = ϕ x + ϕ y","status":"ok"},"proof":[{"text":"The proof is by induction on x in the natural numbers object. The statement being proved for each x is the equation for all y, so the induction hypothesis will hold for every second summand.","status":"ok","from":0,"to":1},{"text":"Base case: fix y. Both sides reduce to ϕ y, on the left because 0 + y = y in ℕ, and on the right because ϕ preserves zero ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]) and 0 + ϕ y = ϕ y in M.","status":"ok","from":2,"to":4},{"text":"Inductive step: fix n, assume the equation for n and every y, and fix y. It remains to show the equation for suc n and y.","status":"ok","from":5,"to":6},{"text":"On the left, write suc n as 1 + n, reassociate 1 + n + y to 1 + (n + y) by [[AffineConstructive.interfaces.common_props.associativity]], and read the result back as suc (n + y). Because the successor adds 1 on the left, this rearrangement needs associativity only, not commutativity.","status":"ok","from":7,"to":8},{"text":"The map ϕ commutes with successor ([[AffineConstructive.theory.nno.quote_suc]]), so both ϕ (suc (n + y)) and ϕ (suc n) become successors in M. The induction hypothesis at y then turns ϕ (n + y) into ϕ n + ϕ y.","status":"ok","from":9,"to":10},{"text":"In M the successor is x ↦ 1 + x, so the goal is 1 + (ϕ n + ϕ y) = (1 + ϕ n) + ϕ y, which is associativity of addition in M.","status":"ok","from":11,"to":12}]},{"name":"AffineConstructive.implementations.nno_naturals.MaybeAlgebra_Morphism_instance_0","base":"MaybeAlgebra_Morphism_instance_0","kind":"inst","start":35,"body":[36,41],"status":"ok","short":{"text":"An additive monoid morphism from ℕ preserving 1 preserves zero and successor","status":"ok"},"proof":[{"text":"A morphism of zero-and-successor structures must preserve zero and successor. Preservation of zero holds for any additive monoid morphism ([[AffineConstructive.theory.additive_groups.AdditiveMonoid_Morphism_pointed]]), which leaves successor.","status":"ok","from":0,"to":1},{"text":"Fix x and write suc x as 1 + x. Since f preserves addition and 1, f (1 + x) = 1 + f x, and in M this is the successor of f x.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.implementations.nno_naturals.nno_to_mon_unique","base":"nno_to_mon_unique","kind":"prf","start":42,"body":[43,45],"status":"ok","short":{"text":"An additive monoid morphism from ℕ into M preserving 1 equals the canonical map","status":"ok"},"proof":[{"text":"By [[AffineConstructive.implementations.nno_naturals.MaybeAlgebra_Morphism_instance_0]], f preserves zero and successor. The canonical map ϕ is the unique such map out of the natural numbers object, so f = ϕ by initiality.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.nno_naturals.nno_naturals","base":"nno_naturals","kind":"prf","start":47,"body":[48,60],"status":"ok","short":{"text":"A natural numbers object that is a near-rig with suc n = 1 + n satisfies the naturals interface","status":"ok"},"proof":[{"text":"Unfold the interface [[AffineConstructive.interfaces.naturals.Naturals]]. The structural parts hold already, which leaves three goals for every additive monoid M with a chosen 1: the canonical map is an additive monoid morphism, it preserves 1, and it is the only such map.","status":"ok","from":0,"to":1},{"text":"To be an additive monoid morphism, the map must preserve addition and send 0 to 0 ([[AffineConstructive.theory.additive_groups.alt_Build_AdditiveMonoid_Morphism]]). Addition is [[AffineConstructive.implementations.nno_naturals.nno_to_mon_plus]]. Zero holds because the canonical map out of the natural numbers object preserves zero ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]).","status":"ok","from":2,"to":7},{"text":"Preservation of 1 is [[AffineConstructive.implementations.nno_naturals.nno_to_mon_one]].","status":"ok","from":8,"to":9},{"text":"Uniqueness: an additive monoid morphism h preserving 1 equals the canonical map by [[AffineConstructive.implementations.nno_naturals.nno_to_mon_unique]].","status":"ok","from":10,"to":12}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.naturals":{"page":"../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.theory.nno":{"page":"../theory/nno.html","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[nno_to_nno_bijective]]). By transport along the comparison with [[Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[nno_ind]], with a base-logic variant [[nno_ind_alt]] and the tactic [[nno_induction]]. It also defines primitive recursion [[nno_rec]] with its base and step equations, and bundles it as a function of its step function [[nno_rec_fun]] when X is a strong set."},"AffineConstructive.theory.rings":{"page":"../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."}},"constants":null}</script>

tructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2941,"e":2954,"lib":"AffineConstructive.theory.nno","name":"nno_induction","kind":"ltac","local":false,"page":"../theory/nno.html"},{"s":2970,"e":2973,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2989,"e":2992,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2993,"e":2996,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3031,"e":3034,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3052,"e":3055,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3069,"e":3072,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3104,"e":3107,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":3108,"e":3111,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3215,"e":3228,"lib":"AffineConstructive.theory.nno","name":"nno_induction","kind":"ltac","local":false,"page":"../theory/nno.html"},{"s":3244,"e":3247,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3263,"e":3266,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":3314,"e":3317,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3357,"e":3360,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":3361,"e":3364,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3497,"e":3510,"lib":"AffineConstructive.theory.nno","name":"nno_induction","kind":"ltac","local":false,"page":"../theory/nno.html"},{"s":3528,"e":3531,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":3532,"e":3535,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3574,"e":3577,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3595,"e":3598,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3614,"e":3617,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":3619,"e":3622,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":3702,"e":3705,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file builds the arithmetic of any natural numbers object. One is defined as the successor of zero. Addition [[AffineConstructive.implementations.nno_rig.nno_plus]] is primitive recursion with the successor, and multiplication [[AffineConstructive.implementations.nno_rig.nno_mult]] is primitive recursion with addition, both through [[AffineConstructive.theory.nno.nno_rec]]. Each law is proved by induction on the natural numbers object, starting from the recursion equations of addition and multiplication. The addition laws give the commutative additive monoid [[AffineConstructive.implementations.nno_rig.nno_add_mon]]. The multiplication laws (identity, absorption by zero, distributivity, commutativity and associativity) give the commutative rig [[AffineConstructive.implementations.nno_rig.nno_com_rig]].","short":"Addition and multiplication on a natural numbers object: its commutative rig structure","items":[{"name":"AffineConstructive.implementations.nno_rig.nno_one","base":"nno_one","kind":"inst","start":10,"body":null,"status":"ok","short":{"text":"The unit 1 of a natural numbers object: the successor of 0","status":"ok"},"long":{"text":"The element 1 of a set with zero and successor, defined as suc 0. It is the multiplicative unit of the rig [[AffineConstructive.implementations.nno_rig.nno_com_rig]]. The left identity law 1 · x = x is proved by unfolding it to suc 0 and using one step of the multiplication's recursion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.nno_plus","base":"nno_plus","kind":"inst","start":11,"body":null,"status":"ok","short":{"text":"Addition on a natural numbers object: x + y applies the successor x times to y","status":"ok"},"long":{"text":"Addition on a natural numbers object ℕ is defined by primitive recursion [[AffineConstructive.theory.nno.nno_rec]] on the first argument: x + y is the successor applied x times to y. So 0 + y = y ([[AffineConstructive.implementations.nno_rig.plus_base]]) and suc x + y = suc (x + y) ([[AffineConstructive.implementations.nno_rig.plus_step]]). The curried function is uncurried with [[AffineConstructive.theory.set.uncurry]], which makes addition a function ℕ ⊗ ℕ ⇾ ℕ on the tensor product, as the structure [[AffineConstructive.interfaces.algebra_notation.Plus]] requires.\n\nAll the other laws of addition (the right identity, associativity, commutativity) are proved from these two equations by induction, and they give the commutative monoid [[AffineConstructive.implementations.nno_rig.nno_add_mon]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.nno_mult","base":"nno_mult","kind":"inst","start":12,"body":null,"status":"ok","short":{"text":"Multiplication on a natural numbers object: x · y adds y to 0, x times","status":"ok"},"long":{"text":"Multiplication on a natural numbers object ℕ is defined by primitive recursion [[AffineConstructive.theory.nno.nno_rec]] on the first argument, iterating the function y + _ starting from 0: x · y is y added to 0, x times. So 0 · y = 0 ([[AffineConstructive.implementations.nno_rig.mult_base]]) and suc x · y = y + x · y ([[AffineConstructive.implementations.nno_rig.mult_step]]). As with addition, the curried form is uncurried into a function ℕ ⊗ ℕ ⇾ ℕ.\n\nThe rig laws for multiplication are proved from these two equations together with the monoid laws of addition, and they give [[AffineConstructive.implementations.nno_rig.nno_com_rig]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.unfold_plus","base":"unfold_plus","kind":"ltac","start":14,"body":null,"status":"ok","short":{"text":"Rewrites every sum a + b in the goal into its defining recursion nno_rec suc (b, a)","status":"ok"},"long":{"text":"The tactic repeatedly replaces each sum a + b in the goal with the recursion that defines it, the successor iterated from b, a times. The two forms are definitionally equal, so the change only restates the goal. It is a local convenience for reaching the recursion equations of [[AffineConstructive.theory.nno.nno_rec]] directly. The proofs in this file do not use it: they work with the packaged equations [[AffineConstructive.implementations.nno_rig.plus_base]] and [[AffineConstructive.implementations.nno_rig.plus_step]] instead.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.unfold_mult","base":"unfold_mult","kind":"ltac","start":15,"body":null,"status":"ok","short":{"text":"Rewrites every product a · b in the goal into its defining recursion from 0 by b +","status":"ok"},"long":{"text":"The tactic repeatedly replaces each product a · b in the goal with the recursion that defines it, the function b + _ iterated from 0, a times. The two forms are definitionally equal, so the change only restates the goal. Like [[AffineConstructive.implementations.nno_rig.unfold_plus]] it is a local convenience that the proofs here do not use: they rely on [[AffineConstructive.implementations.nno_rig.mult_base]] and [[AffineConstructive.implementations.nno_rig.mult_step]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.plus.instance:nno_plus","base":"instance:nno_plus","kind":"existing_instance","start":19,"body":null,"status":"ok","short":{"text":"Resolution finds the addition on a natural numbers object, iterated successor","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.plus_base","base":"plus_base","kind":"inst","start":20,"body":null,"status":"ok","short":{"text":"Zero is a left identity for the addition of a natural numbers object: 0 + y = y","status":"ok"},"long":{"text":"This is the base equation of the recursion that defines addition, 0 + y = y. Addition [[AffineConstructive.implementations.nno_rig.nno_plus]] computes x + y by applying the successor x times to y, so when x is 0 the base equation [[AffineConstructive.theory.nno.nno_rec_base]] gives this law directly. It is stated as the class [[AffineConstructive.interfaces.common_props.LeftIdentity]] so that rewriting with [[AffineConstructive.interfaces.common_props.left_identity]] finds it. The right identity law for addition uses it as the base case of its induction. It is local to the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.plus_step","base":"plus_step","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"The step equation of addition on a natural numbers object: suc x + y = suc (x + y)","status":"ok"},"long":{"text":"This is the step equation of the recursion that defines addition, suc x + y = suc (x + y). It is [[AffineConstructive.theory.nno.nno_rec_step]] read through the definition of [[AffineConstructive.implementations.nno_rig.nno_plus]]. Four proofs in this file rewrite with it: the right identity law, associativity, [[AffineConstructive.implementations.nno_rig.nno_plus_suc_swap]] and commutativity of addition. Each uses it to move a successor outward so that the induction hypothesis applies. It is local to the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.RightIdentity_instance_0","base":"RightIdentity_instance_0","kind":"inst","start":22,"body":[23,30],"status":"ok","short":{"text":"0 is a right identity for addition on a natural numbers object: x + 0 = x","status":"ok"},"proof":[{"text":"By induction on x: the base case asks for 0 + 0 = 0, and the step for suc n + 0 = suc n given n + 0 = n.","status":"ok","from":0,"to":1},{"text":"The base case is the base equation of addition, [[AffineConstructive.implementations.nno_rig.plus_base]], at 0.","status":"ok","from":2,"to":3},{"text":"For the step, fix n with n + 0 = n. The step equation [[AffineConstructive.implementations.nno_rig.plus_step]] turns suc n + 0 into suc (n + 0), and the induction hypothesis turns that into suc n.","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.implementations.nno_rig.Associative_instance_0","base":"Associative_instance_0","kind":"inst","start":31,"body":[32,41],"status":"ok","short":{"text":"Addition on a natural numbers object is associative","status":"ok"},"proof":[{"text":"By induction on the first summand x, proving x + (y + z) = (x + y) + z for all y and z at once, so that the induction hypothesis can be used at any y and z.","status":"ok","from":0,"to":1},{"text":"In the base case fix y and z; 0 is a left identity ([[AffineConstructive.implementations.nno_rig.plus_base]]), so both sides reduce to y + z.","status":"ok","from":2,"to":4},{"text":"For the step, fix x with the hypothesis for all y and z, then fix y and z. The step equation [[AffineConstructive.implementations.nno_rig.plus_step]], applied to each occurrence of a successor summand on the left, pulls the successor out of both sides, leaving suc (x + (y + z)) = suc ((x + y) + z).","status":"ok","from":5,"to":7},{"text":"The induction hypothesis specialised at y and z makes the two sides equal.","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.implementations.nno_rig.nno_plus_suc_swap","base":"nno_plus_suc_swap","kind":"prf","start":42,"body":[43,53],"status":"ok","short":{"text":"A successor moves between the summands: suc x + y = x + suc y","status":"ok"},"proof":[{"text":"By induction on x, proving suc x + y = x + suc y for all y.","status":"ok","from":0,"to":1},{"text":"In the base case fix y. The step equation [[AffineConstructive.implementations.nno_rig.plus_step]] gives suc 0 + y = suc (0 + y), and 0 is a left identity, so both sides are suc y.","status":"ok","from":2,"to":4},{"text":"For the step, fix x with the hypothesis for all y, and fix y. Applying the step equation [[AffineConstructive.implementations.nno_rig.plus_step]] wherever it applies leaves suc (suc (x + y)) = suc (x + suc y).","status":"ok","from":5,"to":7},{"text":"The induction hypothesis at y, read backwards, replaces x + suc y by suc x + y, and one more step equation makes the sides equal.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.implementations.nno_rig.Commutative_instance_0","base":"Commutative_instance_0","kind":"inst","start":54,"body":[55,64],"status":"ok","short":{"text":"Addition on a natural numbers object is commutative","status":"ok"},"proof":[{"text":"By induction on x, proving x + y = y + x for all y.","status":"ok","from":0,"to":1},{"text":"In the base case fix y: 0 + y = y because 0 is a left identity, and y + 0 = y because it is a right identity ([[AffineConstructive.implementations.nno_rig.RightIdentity_instance_0]]).","status":"ok","from":2,"to":4},{"text":"For the step, fix x with the hypothesis for all y, and fix y. On the right, [[AffineConstructive.implementations.nno_rig.nno_plus_suc_swap]] rewrites y + suc x as suc y + x; the step equation then pulls the successor out of both sides, leaving suc (x + y) = suc (y + x).","status":"ok","from":5,"to":7},{"text":"The induction hypothesis at y makes the two sides equal.","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.implementations.nno_rig.nno_add_mon","base":"nno_add_mon","kind":"inst","start":65,"body":[66,68],"status":"ok","short":{"text":"A natural numbers object is a commutative monoid under addition, with identity 0","status":"ok"},"proof":[{"text":"Associativity, commutativity and the left identity law for 0, all proved above, are what [[AffineConstructive.theory.additive_groups.alt_Build_AdditiveMonoid]] needs to build a commutative monoid.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.nno_rig.mult.instance:nno_one","base":"instance:nno_one","kind":"existing_instance","start":73,"body":null,"status":"ok","short":{"text":"Resolution finds the unit 1 of a natural numbers object, the successor of 0","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.mult.instance:nno_plus","base":"instance:nno_plus","kind":"existing_instance","start":74,"body":null,"status":"ok","short":{"text":"Resolution finds the addition on a natural numbers object, needed to define multiplication","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.mult.instance:nno_mult","base":"instance:nno_mult","kind":"existing_instance","start":75,"body":null,"status":"ok","short":{"text":"Resolution finds the multiplication on a natural numbers object, iterated addition","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.mult.let:inst","base":"let:inst","kind":"let","start":76,"body":[77,79],"status":"ok","short":{"text":"ℕ is a commutative monoid under +, from [[AffineConstructive.implementations.nno_rig.nno_add_mon]], as a hypothesis for the section's proofs about multiplication","status":"ok"},"proof":[{"text":"The additive monoid structure is the one already built for a natural numbers object, [[AffineConstructive.implementations.nno_rig.nno_add_mon]]. It is restated here so that the section's proofs about multiplication can rely on it as a hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.nno_rig.mult_base","base":"mult_base","kind":"inst","start":80,"body":null,"status":"ok","short":{"text":"0 is left absorbing for multiplication: 0 · y = 0","status":"ok"},"long":{"text":"The base equation of the recursion defining multiplication: 0 · y = 0. It is [[AffineConstructive.theory.nno.nno_rec_base]] read through the definition of [[AffineConstructive.implementations.nno_rig.nno_mult]]. It is stated as the class [[AffineConstructive.interfaces.common_props.LeftAbsorb]] and supplies the base case of the inductive proofs about multiplication. It is local to the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.mult_step","base":"mult_step","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"The step equation of multiplication: suc x · y = y + x · y","status":"ok"},"long":{"text":"The step equation of the recursion defining multiplication: suc x · y = y + x · y. It is [[AffineConstructive.theory.nno.nno_rec_step]] read through the definition of [[AffineConstructive.implementations.nno_rig.nno_mult]]. The inductive steps about multiplication begin by rewriting with it, so that the induction hypothesis applies to the remaining product x · y. It is local to the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.LeftIdentity_instance_0","base":"LeftIdentity_instance_0","kind":"inst","start":82,"body":[83,87],"status":"ok","short":{"text":"1 is a left identity for multiplication on a natural numbers object: 1 · x = x","status":"ok"},"proof":[{"text":"Fix x and write 1 as the successor of 0.","status":"ok","from":0,"to":2},{"text":"The step equation [[AffineConstructive.implementations.nno_rig.mult_step]] gives suc 0 · x = x + 0 · x. Since 0 · x = 0 by [[AffineConstructive.implementations.nno_rig.mult_base]], this is x + 0, which equals x by [[AffineConstructive.theory.additive_groups.plus_0_r]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.implementations.nno_rig.LeftDistribute_instance_0","base":"LeftDistribute_instance_0","kind":"inst","start":88,"body":[89,101],"status":"ok","short":{"text":"Multiplication distributes over addition on the left: x · (y + z) = x · y + x · z","status":"ok"},"proof":[{"text":"By induction on the multiplier x, proving x · (y + z) = x · y + x · z for all y and z.","status":"ok","from":0,"to":1},{"text":"In the base case fix y and z. By [[AffineConstructive.implementations.nno_rig.mult_base]] every product with left factor 0 is 0, so the goal is 0 = 0 + 0, which holds because 0 is an identity.","status":"ok","from":2,"to":5},{"text":"For the step, fix n with the hypothesis for all y and z, then fix y and z. The step equation [[AffineConstructive.implementations.nno_rig.mult_step]] expands all three products, and the induction hypothesis at y and z rewrites n · (y + z) as n · y + n · z. What is left is (y + z) + (n · y + n · z) = (y + n · y) + (z + n · z).","status":"ok","from":6,"to":9},{"text":"This is a rearrangement of four summands. After reassociating both sides to the left, z and n · y are grouped together and swapped by commutativity, and reassociating again makes the sides equal.","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.implementations.nno_rig.RightAbsorb_instance_0","base":"RightAbsorb_instance_0","kind":"inst","start":102,"body":[103,110],"status":"ok","short":{"text":"0 is right absorbing for multiplication: x · 0 = 0","status":"ok"},"proof":[{"text":"By induction on x: the base case asks for 0 · 0 = 0, and the step for suc n · 0 = 0 given n · 0 = 0.","status":"ok","from":0,"to":1},{"text":"The base case is the base equation of multiplication, [[AffineConstructive.implementations.nno_rig.mult_base]].","status":"ok","from":2,"to":3},{"text":"For the step, fix n with n · 0 = 0. By [[AffineConstructive.implementations.nno_rig.mult_step]], suc n · 0 = 0 + n · 0, the induction hypothesis makes this 0 + 0, and 0 + 0 = 0 by [[AffineConstructive.theory.additive_groups.plus_0_l]].","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.implementations.nno_rig.mult_step_r","base":"mult_step_r","kind":"prf","start":111,"body":[112,124],"status":"ok","short":{"text":"Step equation in the second factor: x · suc y = x + x · y","status":"ok"},"proof":[{"text":"By induction on x, proving x · suc y = x + x · y for all y.","status":"ok","from":0,"to":1},{"text":"In the base case fix y. Both products have left factor 0 and so vanish by [[AffineConstructive.implementations.nno_rig.mult_base]], leaving 0 = 0 + 0, which holds because 0 is an identity.","status":"ok","from":2,"to":5},{"text":"For the step, fix n with the hypothesis for all y, and fix y. The step equation [[AffineConstructive.implementations.nno_rig.mult_step]] expands both products, and the induction hypothesis at y rewrites n · suc y as n + n · y, leaving suc y + (n + n · y) = suc n + (y + n · y).","status":"ok","from":6,"to":9},{"text":"After reassociating, the common summand n · y stands last on both sides. On the left, [[AffineConstructive.implementations.nno_rig.nno_plus_suc_swap]] turns suc y + n into y + suc n, and commutativity turns that into suc n + y, which matches the right side.","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.implementations.nno_rig.Commutative_instance_1","base":"Commutative_instance_1","kind":"inst","start":125,"body":[126,137],"status":"ok","short":{"text":"Multiplication on a natural numbers object is commutative","status":"ok"},"proof":[{"text":"By induction on x, proving x · y = y · x for all y.","status":"ok","from":0,"to":1},{"text":"In the base case fix y. By [[AffineConstructive.implementations.nno_rig.mult_base]], 0 · y = 0, and the goal, turned around, is y · 0 = 0, which holds because 0 absorbs on the right ([[AffineConstructive.implementations.nno_rig.RightAbsorb_instance_0]]).","status":"ok","from":2,"to":6},{"text":"For the step, fix n with the hypothesis for all y, and fix y. The step equation [[AffineConstructive.implementations.nno_rig.mult_step]] in the first factor on the left and [[AffineConstructive.implementations.nno_rig.mult_step_r]] in the second factor on the right leave y + n · y = y + y · n.","status":"ok","from":7,"to":9},{"text":"The induction hypothesis at y makes the two sides equal.","status":"ok","from":10,"to":11}]},{"name":"AffineConstructive.implementations.nno_rig.RightDistribute_instance_0","base":"RightDistribute_instance_0","kind":"inst","start":138,"body":null,"status":"ok","short":{"text":"Multiplication on a natural numbers object distributes over addition on the right","status":"ok"},"long":{"text":"This is the right distributive law (x + y) · z = x · z + y · z for the multiplication of a natural numbers object. It is not proved by its own induction. [[AffineConstructive.theory.common_props.right_distr_from_left]] obtains it from the left distributive law and the commutativity of multiplication.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.nno_rig.Associative_instance_1","base":"Associative_instance_1","kind":"inst","start":139,"body":[140,151],"status":"ok","short":{"text":"Multiplication on a natural numbers object is associative","status":"ok"},"proof":[{"text":"By induction on the first factor x, the statement x · (y · z) = (x · y) · z for all y and z is proved for x = 0 and carried from n to suc n.","status":"ok","from":0,"to":1},{"text":"Base case: fix y and z. By [[AffineConstructive.implementations.nno_rig.mult_base]], 0 · (y · z) and (0 · y) · z both reduce to 0.","status":"ok","from":2,"to":4},{"text":"Step: fix n, assume the statement for n, and fix y and z. The step equation [[AffineConstructive.implementations.nno_rig.mult_step]] unfolds suc n on both sides. On the left this gives y · z + n · (y · z), and the induction hypothesis at y and z rewrites the second summand to (n · y) · z.","status":"ok","from":5,"to":8},{"text":"Read from right to left, the goal (y + n · y) · z = y · z + (n · y) · z is right distributivity of multiplication over addition, [[AffineConstructive.implementations.nno_rig.RightDistribute_instance_0]].","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.implementations.nno_rig.nno_com_rig","base":"nno_com_rig","kind":"inst","start":152,"body":[153,155],"status":"ok","short":{"text":"A natural numbers object is a commutative rig under its addition and multiplication","status":"ok"},"proof":[{"text":"[[AffineConstructive.theory.rings.alt_Build_CommutativeRig2]] assembles the commutative rig from laws already proved: associativity and commutativity of multiplication, 1 as left identity, 0 · y = 0, and distributivity, together with the additive monoid.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.naturals":{"page":"../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.theory.nno":{"page":"../theory/nno.html","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[nno_to_nno_bijective]]). By transport along the comparison with [[Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[nno_ind]], with a base-logic variant [[nno_ind_alt]] and the tactic [[nno_induction]]. It also defines primitive recursion [[nno_rec]] with its base and step equations, and bundles it as a function of its step function [[nno_rec_fun]] when X is a strong set."},"AffineConstructive.theory.rings":{"page":"../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

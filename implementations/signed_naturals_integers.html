y.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import abstract_algebra interfaces.naturals interfaces.integers\n  interfaces.bundled_algebra interfaces.group_completion\n  logic.aprop logic.relations logic.dec theory.set theory.projected_set theory.rings\n  theory.group_completion\n  theory.naturals.\nRequire Import grothendieck_group theory.integers.\nRequire Import implementations.bool.\nRequire Import easy replc.\n\nLocal Open Scope mult_scope.\n\nModule signed_naturals.\n\n  Section with_naturals.\n    Universes u.\n    Context (ℕ:naturals@{u}).\n\n    Abbreviation ℤ := (GrothendieckPairs (near_rig_car (nats_near_rig ℕ))).\n    Abbreviation i := (to_grothendieck_group (near_rig_car (nats_near_rig ℕ))).\n\n    Let inst : Integers ℤ := _.\n    Let inst2 : Rig_Morphism i := _.\n    Let inst3 : Injective i.\n    Proof. exact (naturals_to_integers_inj_alt (N:=ℕ) (Z:=ℤ) i). Qed.\n\n    (** Note: zero has (at least) two representations *)\n    Inductive t := pos : ℕ → t | neg : ℕ → t.\n\n    Definition to_ℤ_op (x:t) : ℤ :=\n    match x with\n    | pos x' => i x'\n    | neg x' => -(i x')\n    end.\n\n    Definition Z := projected_set@{u} to_ℤ_op.\n    Local Hint Extern 5 => progress unfold Z : typeclass_instances.\n    Definition to_ℤ : Z ⇾ ℤ := projected_set_project _.\n    Instance to_ℤ_inj : Injective to_ℤ := projected_set_project_injective Z.\n\n    Definition of_ℕ : _ ⇾ _ := @func_make ℕ Z pos (is_fun i).\n\n    Local Open Scope bool_scope.\n    Instance eq_dec {d:Dec (A:=ℕ∗ℕ) (=)} : Dec (A:=Z∗Z) (=) := λ '(x, y),\n    match x with\n    | pos x' =>\n      match y with\n      | pos y' => dec (=) (x', y')\n      | neg y' => dec (=) (x', 0) && dec (=) (y', 0)\n      end\n    | neg x' =>\n      match y with\n      | pos y' => dec (=) (x', 0) && dec (=) (y', 0)\n      | neg y' => dec (=) (x', y')\n      end\n    end.\n\n    Lemma pos_eq (x y : ℕ) : x = y ⧟ pos x = pos y :> Z.\n    Proof. exact (injective_iff i _ _). Qed.\n\n    Lemma neg_eq (x y : ℕ) : x = y ⧟ neg x = neg y :> Z.\n    Proof. exact (injective_iff ((-) ∘ i) _ _). Qed.\n\n    Lemma neg_pos_eq (x y : ℕ) : x = 0 ∧ y = 0 ⧟ neg x = pos y :> Z.\n    Proof. change (neg x = pos y) with (-i x = i y).\n      sym. exact (naturals.to_ring_zero_sum_alt (N:=ℕ) i _ _).\n    Qed.\n    Lemma pos_neg_eq (x y : ℕ) : x = 0 ∧ y = 0 ⧟ pos x = neg y :> Z.\n    Proof. rew [ (aand_com _ _) | (symmetry_iff (A:=Z) (=) (pos x) _) ].\n      exact (neg_pos_eq _ _).\n    Qed.\n\n    Lemma eq_is_dec `{!IsDecEq ℕ (d:=d)} : IsDecEq Z (d:=eq_dec).\n    Proof. intros [[p₁|n₁] [p₂|n₂]]; unfold dec, eq_dec.\n    + apply dec_spec_by_iff. exact (pos_eq _ _).\n    + generalize (dec_spec_andb (p₁, 0) (n₂, 0)); destruct (andb (dec (=) (p₁, 0), dec (=) (n₂, 0)));\n      now rew <-(pos_neg_eq _ _).\n    + generalize (dec_spec_andb (n₁, 0) (p₂, 0)); destruct (andb (dec (=) (n₁, 0), dec (=) (p₂, 0)));\n      now rew <-(neg_pos_eq _ _).\n    + apply dec_spec_by_iff. exact (neg_eq _ _).\n    Qed.\n\n    Lemma from_Z_is_fun `{X:set@{u}} (f:Z → X) :\n      (∀ n m : ℕ, n = m → f (pos n) = f (pos m)) →\n      (∀ n m : ℕ, n = m → f (neg n) = f (neg m)) →\n      (∀ n m : ℕ, n = 0 ∧ m = 0 → f (pos n) = f (neg m)) →\n      IsFun f.\n    Proof. intros Pp Pn P0. intros [n|n] [m|m].\n    + rew <-(pos_eq _ _). apply affirmative_aimpl, Pp.\n    + rew <-(pos_neg_eq _ _). apply decidable_aimpl, P0.\n    + rew <-(neg_pos_eq _ _), (aand_com _ _), (symmetry_iff (=) (f (neg n)) _).\n      apply decidable_aimpl, P0.\n    + rew <-(neg_eq _ _). apply affirmative_aimpl, Pn.\n    Qed.\n\n    Instance z : Zero Z := pos 0.\n    Instance o : One Z := pos 1.\n\n    Definition negate_op (x:Z) : Z := match x with\n    | pos x' => neg x'\n    | neg x' => pos x'\n    end.\n\n    Definition mult_op (x:Z) (y:Z) : Z :=\n    match x with\n    | pos x' =>\n      match y with\n      | pos y' => pos (x' · y')\n      | neg y' => neg (x' · y')\n      end\n    | neg x' =>\n      match y with\n      | pos y' => neg (x' · y')\n      | neg y' => pos (x' · y')\n      end\n    end.\n\n    Context {sub:NatSubtract ℕ} `{!NatSubtractSpec ℕ}.\n\n    Definition plus_op (x:Z) (y:Z) : Z :=\n    match x with\n    | pos x' =>\n      match y with\n      | pos y' => pos (x' + y')\n      | neg y' => match nat_subtract_alt (x', y') with\n        | inl z => neg z\n        | inr z => pos z\n        end\n      end\n    | neg x' =>\n      match y with\n      | pos y' => match nat_subtract_alt (x', y') with\n        | inl z => pos z\n        | inr z => neg z\n        end\n      | neg y' => neg (x' + y')\n      end\n    end.\n\n    Import projection_notation.\n    Local Ltac smpl := unfold tuncurry; change (func_op to_ℤ ?x) with (to_ℤ_op x);\n      cbn [π₁ π₂ negate_op mult_op plus_op to_ℤ_op].\n\n    Lemma negate_op_correct : ∀ x:Z, to_ℤ (negate_op x) = - to_ℤ x.\n    Proof. intros [p|n]; smpl.\n    + refl.\n    + sym. exact (involutive_alt (-) _).\n    Qed.\n\n    Instance ngt : Negate Z\n      := @func_make _ _ _ (projected_is_fun negate_op (-) negate_op_correct).\n    Definition negate_correct : ∀ x:Z, to_ℤ (-x) = -(to_ℤ x) := negate_op_correct.\n\n    Lemma mult_op_correct : ∀ p : Z ⊗ Z,\n        to_ℤ (tuncurry mult_op p) = to_ℤ (π₁ p) · to_ℤ (π₂ p).\n    Proof. intros [[p₁|n₁] [p₂|n₂]]; smpl; rew (preserves_mult i _ _).\n    + refl.\n    + apply negate_mult_distr_r.\n    + apply negate_mult_distr_l.\n    + sym. apply negate_mult_negate.\n    Qed.\n\n    Instance mlt : Mult Z\n      := @func_make _ _ _ (projected_is_fun (X:=Z ⊗ Z) (tuncurry mult_op) (·) mult_op_correct).\n    Definition mult_correct x y : to_ℤ (x · y) = to_ℤ x · to_ℤ y := mult_op_correct (x,y).\n\n    Lemma plus_op_correct : ∀ p : Z ⊗ Z,\n        to_ℤ (tuncurry plus_op p) = to_ℤ (π₁ p) + to_ℤ (π₂ p).\n    Proof. intros [[p₁|n₁] [p₂|n₂]]; smpl.\n    + exact (preserves_plus i _ _).\n    + generalize (nat_subtract_alt_spec p₁ n₂); destruct (nat_subtract_alt (p₁, n₂)) as [z | z]; smpl; intro E.\n      * rew <-E, (preserves_plus i _ _), (negate_plus_distr _ _), (associativity (+) _ _ _).\n        now rew (plus_negate_r _), (plus_0_l _).\n      * rew E, (commutativity (+) n₂ z), (preserves_plus i _ _), <-(associativity (+) _ _ _).\n        now rew (plus_negate_r _), (plus_0_r _).\n    + generalize (nat_subtract_alt_spec n₁ p₂); destruct (nat_subtract_alt (n₁, p₂)) as [z | z]; smpl; intro E.\n      * rew <-E, (preserves_plus i _ _), (associativity (+) _ _ _).\n        now rew (plus_negate_l _), (plus_0_l _).\n      * rew E, (commutativity (+) p₂ z), (preserves_plus i _ _), (negate_plus_distr _ _).\n        now rew <-(associativity (+) _ _ _), (plus_negate_l _), (plus_0_r _).\n    + now rew (preserves_plus i _ _), (negate_plus_distr _ _).\n    Qed.\n\n    Instance pls : Plus Z\n      := @func_make _ _ _ (projected_is_fun (X:=Z ⊗ Z) (tuncurry plus_op) (+) plus_op_correct).\n    Definition plus_correct x y : to_ℤ (x + y) = to_ℤ x + to_ℤ y := plus_op_correct (x,y).\n\n    Lemma zero_correct : to_ℤ 0 = 0.  Proof. refl. Qed.\n    Lemma one_correct  : to_ℤ 1 = 1.  Proof. refl. Qed.\n\n    Instance is_com_ring : CommutativeRing Z\n      := projected_commutative_ring to_ℤ\n           plus_correct mult_correct zero_correct one_correct negate_correct.\n    Let inst4 := is_com_ring.\n\n    Instance to_ℤ_mor : Rig_Morphism to_ℤ.\n    Proof. apply alt_Build_Rig_Morphism.\n    + exact plus_correct.\n    + exact mult_correct.\n    + exact zero_correct.\n    + exact one_correct.\n    Qed.\n\n    Instance of_ℕ_mor : Rig_Morphism of_ℕ.\n    Proof. now apply alt_Build_Rig_Morphism. Qed.\n    Let inst5 := of_ℕ_mor.\n\n    Definition of_ℤ : ℤ ⇾ Z := from_group_completion2 i of_ℕ.\n    Instance of_ℤ_mor : Rig_Morphism of_ℤ.  Proof. now unfold of_ℤ. Qed.\n\n    Lemma of_ℤ_spec : of_ℤ ∘ i = of_ℕ.\n    Proof. exact from_group_completion2_spec. Qed.\n  End with_naturals.\n\n  #[global] Hint Extern 1 (Dec (A:=t ?ℕ) (=)) => refine (eq_dec ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Dec (A:=set_T (Z ?ℕ)) (=)) => refine (eq_dec ℕ) : typeclass_instances.\n  #[global] Hint Extern 2 (IsDecEq _ (d:=eq_dec ?ℕ)) => simple notypeclasses refine (eq_is_dec ℕ) : typeclass_instances.\n\n  #[global] Hint Extern 1 (Zero   (Z ?ℕ)) => refine (z ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (One    (Z ?ℕ)) => refine (o ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Negate (Z ?ℕ)) => refine (ngt ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Plus   (Z ?ℕ)) => refine (pls ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Mult   (Z ?ℕ)) => refine (mlt ℕ) : typeclass_instances.\n\n  #[global] Hint Extern 1 (CommutativeRing         (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveCancellation    (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveGroup           (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveMonoid          (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveNonComGroup     (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveNonComMonoid    (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveNonComSemiGroup (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveSemiGroup       (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (CommutativeRig          (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (LeftNearRg              (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (LeftNearRig             (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (LeftNearRing            (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (LeftNearRng             (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (MultiplicativeComMonoid (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (MultiplicativeMonoid    (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (MultiplicativeSemiGroup (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (NearRg                  (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (NearRig                 (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (NearRing                (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (NearRng                 (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Rg                      (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Rig                     (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Ring                    (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Rng                     (Z ?ℕ)) => refine (is_com_ring ℕ) : typeclass_instances.\n\n  #[global] Hint Extern 1 (Rig_Morphism                     (to_ℤ ?ℕ)) => refine (to_ℤ_mor ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (Rg_Morphism                      (to_ℤ ?ℕ)) => refine (to_ℤ_mor ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveMonoid_Morphism          (to_ℤ ?ℕ)) => refine (to_ℤ_mor ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (AdditiveSemiGroup_Morphism       (to_ℤ ?ℕ)) => refine (to_ℤ_mor ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (MultiplicativeSemiGroup_Morphism (to_ℤ ?ℕ)) => refine (to_ℤ_mor ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (MultiplicativeMonoid_Morphism    (to_ℤ ?ℕ)) => refine (to_ℤ_mor ℕ) : typeclass_instances.\n  #[global] Hint Extern 1 (One_Pointed_Morphism             (to_ℤ ?ℕ)) => refine (to_ℤ_mor ℕ) : typeclas "AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6406,"e":6409,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6728,"e":6732,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":6784,"e":6788,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":7242,"e":7245,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":7422,"e":7425,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":15461,"e":15464,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file builds a concrete model of the integers over any model ℕ of the naturals that has a comparison with difference: the signed naturals, written pos n or neg n, where 0 has two representations, pos 0 and neg 0. Their equality is pulled back from the Grothendieck group of ℕ along the map that sends pos n to n and neg n to −n. So pos x = neg y holds exactly when x = 0 ∧ y = 0, and equality is decided by comparisons in ℕ ([[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.eq_is_dec]]). Negation, multiplication and addition are defined by cases on the signs, and addition with mixed signs uses the comparison with difference. Each operation is shown to commute with the interpretation map, so the commutative ring laws carry over by [[AffineConstructive.theory.rings.projected_commutative_ring]]. The extension [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ]] of ℕ ⇾ signed naturals along the group completion is surjective, and the retract construction then makes the signed naturals the integers ([[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_integers]]). Bundled as [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.ints]], this gives [[AffineConstructive.implementations.signed_naturals_integers.SignedNat]] over Nat, with its decidable equality.","short":"The integers as signed naturals pos n | neg n, a model of the integers","items":[{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.with_naturals.let:inst","base":"let:inst","kind":"let","start":11,"body":null,"status":"ok","short":{"text":"Makes the Grothendieck group of the naturals, as a model of the integers, a hypothesis for the section's proofs","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.with_naturals.let:inst2","base":"let:inst2","kind":"let","start":12,"body":null,"status":"ok","short":{"text":"Makes the rig morphism property of the canonical map from the naturals into their Grothendieck group a hypothesis for the section","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.with_naturals.let:inst3","base":"let:inst3","kind":"let","start":13,"body":[14,16],"status":"ok","short":{"text":"The canonical map from the naturals into their Grothendieck group is injective, by [[AffineConstructive.theory.integers.naturals_to_integers_inj_alt]]","status":"ok"},"proof":[{"text":"The map i into the Grothendieck group is a rig morphism, so it is additive and preserves 1. The Grothendieck group is a model of the integers. Any additive map from the naturals into the integers that preserves 1 is injective, by [[AffineConstructive.theory.integers.naturals_to_integers_inj_alt]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.t","base":"t","kind":"ind","start":17,"body":null,"status":"ok","short":{"text":"The type of signed naturals: pos n or neg n for a natural n","status":"ok"},"long":{"text":"The underlying type of the model: a natural number with a sign. Zero has two representations here, pos 0 and neg 0. The type carries no equality of its own. Equality comes from [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.Z]], which identifies pos 0 with neg 0 and leaves every other pair of distinct representations unequal.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.t_rect","base":"t_rect","kind":"scheme","short":{"text":"Dependent case analysis on signed naturals, into Type","status":"ok"}},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.t_ind","base":"t_ind","kind":"scheme","short":{"text":"Case analysis on signed naturals, into Prop","status":"ok"}},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.t_rec","base":"t_rec","kind":"scheme","short":{"text":"Case analysis on signed naturals, into Set","status":"ok"}},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.t_sind","base":"t_sind","kind":"scheme","short":{"text":"Case analysis on signed naturals, into SProp","status":"ok"}},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.pos","base":"pos","kind":"constr","short":{"text":"The signed natural +n","status":"ok"}},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.neg","base":"neg","kind":"constr","short":{"text":"The signed natural −n","status":"ok"}}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ_op","base":"to_ℤ_op","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"The interpretation of a signed natural in the Grothendieck group: pos n to i n, neg n to −i n","status":"ok"},"long":{"text":"The underlying map on representations that gives a signed natural its meaning: pos n is the natural n, and neg n is its negative, both taken in the Grothendieck group of the naturals. Equality, the operations, and the ring laws on the signed naturals are all defined or checked through this map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.Z","base":"Z","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The set of signed naturals, with equality pulled back from the Grothendieck group","status":"ok"},"long":{"text":"The signed naturals as an affine set: the type of signed naturals with the equality x = y defined as to_ℤ_op x = to_ℤ_op y in the Grothendieck group, by [[AffineConstructive.theory.projected_set.projected_set]]. So pos 0 = neg 0, and two representations of the same sign are equal exactly when their naturals are equal. Its ring structure is defined later in the file, and so is the proof that it is a model of the integers.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ","base":"to_ℤ","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"The map from signed naturals into the Grothendieck group, as a function of sets","status":"ok"},"long":{"text":"The interpretation map, packaged as a function of sets. It preserves equality by definition of the equality on the signed naturals, and it is injective for the same reason. It is shown to be a rig morphism, and it serves as the inverse of [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ_inj","base":"to_ℤ_inj","kind":"inst","start":22,"body":null,"status":"ok","short":{"text":"The map from the signed naturals into the Grothendieck group of ℕ is injective","status":"ok"},"long":{"text":"States that [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ]], the map sending a signed natural to the element of the Grothendieck group of ℕ it denotes, is injective. The signed naturals are a projected set: their equality is pulled back along this map, so injectivity holds by construction. It is an instance of [[AffineConstructive.theory.projected_set.projected_set_project_injective]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℕ","base":"of_ℕ","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"The inclusion of the naturals into the signed naturals, n to pos n","status":"ok"},"long":{"text":"The map n ↦ pos n as a function of sets. It preserves equality because i does, since pos n is interpreted as i n. It is shown to be a rig morphism. The signed naturals use it as the canonical map from the naturals, and it is what [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ]] extends along the Grothendieck group.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.eq_dec","base":"eq_dec","kind":"inst","start":25,"body":null,"status":"ok","short":{"text":"A boolean decision procedure for equality of signed naturals, from one for the naturals","status":"ok"},"long":{"text":"Decides equality of signed naturals by cases on the signs. Two representations with the same sign are compared as naturals. Two with opposite signs are equal only when both naturals are 0, and the procedure tests each against 0 and takes the boolean conjunction. It assumes a decision procedure for equality on the naturals. Its correctness is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.eq_is_dec]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.pos_eq","base":"pos_eq","kind":"prf","start":26,"body":[27,29],"status":"ok","short":{"text":"x = y if and only if pos x = pos y","status":"ok"},"proof":[{"text":"The equality of signed naturals is pulled back along the interpretation, and pos x is interpreted as i x. Since i is injective, the equivalence is [[AffineConstructive.theory.set.injective_iff]] for i.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.neg_eq","base":"neg_eq","kind":"prf","start":30,"body":[31,33],"status":"ok","short":{"text":"x = y if and only if neg x = neg y","status":"ok"},"proof":[{"text":"neg x is interpreted as −i x, so the map in question is i followed by negation. Negation is an involution and so a bijection, and the composite of two injective maps is injective. The equivalence is then [[AffineConstructive.theory.set.injective_iff]] for that composite.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.neg_pos_eq","base":"neg_pos_eq","kind":"prf","start":34,"body":[35,39],"status":"ok","short":{"text":"neg x = pos y if and only if x = 0 and y = 0 (additive and)","status":"ok"},"proof":[{"text":"Restate the equality neg x = pos y as the equality −i x = i y of the interpretations in the Grothendieck group.","status":"ok","from":0,"to":1},{"text":"Read the equivalence from right to left. Since i is an injective rig morphism into a ring, −i x = i y holds exactly when x = 0 and y = 0, which is [[AffineConstructive.theory.naturals.to_ring_zero_sum_alt]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.pos_neg_eq","base":"pos_neg_eq","kind":"prf","start":40,"body":[41,44],"status":"ok","short":{"text":"pos x = neg y if and only if x = 0 and y = 0 (additive and)","status":"ok"},"proof":[{"text":"Swap the two conjuncts and the two sides of the equality. This turns the statement into the one about neg y = pos x.","status":"ok","from":0,"to":1},{"text":"That is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.neg_pos_eq]] with the roles of x and y exchanged.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.eq_is_dec","base":"eq_is_dec","kind":"prf","start":45,"body":[46,58],"status":"ok","short":{"text":"The decision procedure for equality of signed naturals is correct when that of ℕ is","status":"ok"},"proof":[{"text":"Split on the signs of the two signed naturals and unfold the decision procedure. This leaves four cases. When the signs agree, the procedure compares the magnitudes. When they differ, it tests both magnitudes against 0.","status":"ok","from":0,"to":1},{"text":"Both positive: a decision for p₁ = p₂ decides any proposition equivalent to it ([[AffineConstructive.logic.dec.dec_spec_by_iff]]). [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.pos_eq]] provides that equivalence.","status":"ok","from":2,"to":4},{"text":"Positive against negative: by [[AffineConstructive.logic.dec.dec_spec_andb]], the boolean conjunction of the two zero tests decides the additive conjunction p₁ = 0 ∧ n₂ = 0. In either outcome, [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.pos_neg_eq]] turns this into the equality, or the apartness, of pos p₁ and neg n₂.","status":"ok","from":5,"to":6},{"text":"Negative against positive: the same argument, with [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.neg_pos_eq]].","status":"ok","from":7,"to":8},{"text":"Both negative: as in the first case, the decision for n₁ = n₂ decides neg n₁ = neg n₂ by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.neg_eq]].","status":"ok","from":9,"to":12}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.from_Z_is_fun","base":"from_Z_is_fun","kind":"prf","start":59,"body":[60,75],"status":"ok","short":{"text":"A map out of signed naturals preserves equality if it respects each sign and sends pos 0, neg 0 together","status":"ok"},"proof":[{"text":"Assume the three conditions: f respects equality among positives and among negatives, and f identifies pos n with neg m when n and m are both 0. Splitting on the signs of the two arguments leaves four affine implications to prove.","status":"ok","from":0,"to":2},{"text":"Both positive: by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.pos_eq]] the premise becomes n = m. Equality of the naturals is decidable and hence affirmative. So the base-logic implication from n = m to f (pos n) = f (pos m), given by the first condition, yields the affine implication ([[AffineConstructive.logic.aprop.affirmative_aimpl]]).","status":"ok","from":3,"to":5},{"text":"Positive against negative: by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.pos_neg_eq]] the premise becomes n = 0 ∧ m = 0. This premise is decidable, so the third condition, a base-logic implication, gives the affine one ([[AffineConstructive.logic.aprop.decidable_aimpl]]).","status":"ok","from":6,"to":8},{"text":"Negative against positive: by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.neg_pos_eq]] the premise becomes n = 0 ∧ m = 0. Swapping the conjuncts and the sides of the conclusion gives the previous shape, and the third condition applies as before.","status":"ok","from":9,"to":11},{"text":"Both negative: by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.neg_eq]] the premise becomes n = m, and the second condition gives the affine implication because the premise is affirmative.","status":"ok","from":12,"to":15}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.z","base":"z","kind":"inst","start":76,"body":null,"status":"ok","short":{"text":"The zero of the signed naturals, pos 0","status":"ok"},"long":{"text":"Equips the signed naturals with a zero, the representation pos 0. Its interpretation is i 0, so it is zero in the Grothendieck group without further proof.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.o","base":"o","kind":"inst","start":77,"body":null,"status":"ok","short":{"text":"The unit of the signed naturals, pos 1","status":"ok"},"long":{"text":"Equips the signed naturals with a unit, the representation pos 1. Its interpretation is i 1, so it is the unit of the Grothendieck group without further proof.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.negate_op","base":"negate_op","kind":"def","start":78,"body":null,"status":"ok","short":{"text":"Negation on representations: swaps the sign","status":"ok"},"long":{"text":"Negation of signed naturals on representations: pos n becomes neg n and neg n becomes pos n. It is defined on the type alone. That it preserves equality and agrees with negation in the Grothendieck group is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.negate_op_correct]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.mult_op","base":"mult_op","kind":"def","start":79,"body":null,"status":"ok","short":{"text":"Multiplication on representations: multiply the naturals, with the sign rule","status":"ok"},"long":{"text":"Multiplication of signed naturals on representations: the naturals are multiplied, and the result is positive when the signs agree and negative when they differ. A zero product may come out with either sign, which is harmless because pos 0 = neg 0. Its correctness against the Grothendieck group is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.mult_op_correct]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.plus_op","base":"plus_op","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"Addition on representations, by comparison with difference when the signs differ","status":"ok"},"long":{"text":"Addition of signed naturals on representations. When the signs agree, the naturals are added and the sign is kept. When they differ, the two naturals are compared by [[AffineConstructive.theory.naturals.nat_subtract_alt]], which returns their difference together with which one is larger, and the result takes the sign of the larger. This is the only operation that needs subtraction structure on the naturals, so it is defined under the assumption of a correct comparison with difference. Its correctness is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.plus_op_correct]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.smpl","base":"smpl","kind":"ltac","start":83,"body":null,"status":"ok","short":{"text":"Computes the operations and the interpretation map on explicit signed naturals","status":"ok"},"long":{"text":"A local simplification step for the correctness proofs. It turns the uncurried form of an operation on a pair back into the operation on its two components. It replaces an application of the interpretation function by the underlying map on representations. It then evaluates the projections, the sign-wise operations, and the interpretation by computation. After a case split on the signs, each goal becomes an equation between explicit expressions in i in the Grothendieck group, ready for the ring laws there. Generic simplification would unfold too much or not reach under the function packaging, which is why the proofs use this step.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.negate_op_correct","base":"negate_op_correct","kind":"prf","start":84,"body":[85,92],"status":"ok","short":{"text":"Swapping the sign of x is interpreted as the negative of the interpretation of x","status":"ok"},"proof":[{"text":"Split on the sign of x and compute both sides.","status":"ok","from":0,"to":1},{"text":"For pos p, both sides are −i p.","status":"ok","from":2,"to":3},{"text":"For neg n, negation turns it into pos n, interpreted as i n. The other side is −−i n, which equals i n because negation is an involution ([[AffineConstructive.theory.common_props.involutive_alt]]).","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.ngt","base":"ngt","kind":"inst","start":93,"body":null,"status":"ok","short":{"text":"Negation on the signed naturals, as a function of sets","status":"ok"},"long":{"text":"Equips the signed naturals with a negation. The underlying map swaps the sign. It preserves equality because it agrees with negation in the Grothendieck group, and a map between projected sets that commutes with a function on the targets preserves equality ([[AffineConstructive.theory.projected_set.projected_is_fun]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.negate_correct","base":"negate_correct","kind":"def","start":94,"body":null,"status":"ok","short":{"text":"The interpretation of −x is the negative of the interpretation of x","status":"ok"},"long":{"text":"The correctness of negation, stated for the negation operation of the set rather than its underlying map. Proving the signed naturals a commutative ring takes it as an input.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.mult_op_correct","base":"mult_op_correct","kind":"prf","start":95,"body":[96,107],"status":"ok","short":{"text":"The product of signed naturals is interpreted as the product of their interpretations","status":"ok"},"proof":[{"text":"Split on the signs of the two factors and compute. The product of the magnitudes is interpreted through i, which preserves products ([[AffineConstructive.theory.multiplicative_groups.preserves_mult]]). This leaves the four sign rules.","status":"ok","from":0,"to":1},{"text":"Both positive: the two sides agree.","status":"ok","from":2,"to":3},{"text":"Positive times negative: −(i p₁ · i n₂) = i p₁ · (−i n₂), which is [[AffineConstructive.theory.rings.negate_mult_distr_r]].","status":"ok","from":4,"to":5},{"text":"Negative times positive: −(i n₁ · i p₂) = (−i n₁) · i p₂, which is [[AffineConstructive.theory.rings.negate_mult_distr_l]].","status":"ok","from":6,"to":7},{"text":"Both negative: the product of two negatives is the product of the magnitudes, by [[AffineConstructive.theory.rings.negate_mult_negate]].","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.mlt","base":"mlt","kind":"inst","start":108,"body":null,"status":"ok","short":{"text":"Multiplication on the signed naturals, a function on the tensor product","status":"ok"},"long":{"text":"Equips the signed naturals with a multiplication. It is a function on the tensor square: the sign-wise product applied to the pair. It preserves equality because it agrees with multiplication in the Grothendieck group, by [[AffineConstructive.theory.projected_set.projected_is_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.mult_correct","base":"mult_correct","kind":"def","start":109,"body":null,"status":"ok","short":{"text":"The interpretation in the Grothendieck group preserves multiplication: to_ℤ (x · y) = to_ℤ x · to_ℤ y","status":"ok"},"long":{"text":"The correctness of multiplication on the signed naturals, stated for two arguments rather than for a pair: [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ]] sends a product to the product of the images. It is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.mult_op_correct]] restated in curried form. [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_com_ring]] takes it as one of its inputs when the commutative ring laws are transported from the Grothendieck group of ℕ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.plus_op_correct","base":"plus_op_correct","kind":"prf","start":110,"body":[111,133],"status":"ok","short":{"text":"The sum of signed naturals is interpreted as the sum of their interpretations","status":"ok"},"proof":[{"text":"Split on the signs of the two summands and compute the interpretation of each side.","status":"ok","from":0,"to":1},{"text":"Both positive: i is additive ([[AffineConstructive.theory.additive_groups.preserves_plus]]).","status":"ok","from":2,"to":3},{"text":"Positive p₁ plus negative n₂: the sum compares p₁ with n₂. By [[AffineConstructive.theory.naturals.nat_subtract_alt_spec]], the comparison either gives z with p₁ + z = n₂, and the sum is neg z, or it gives z with p₁ = n₂ + z, and the sum is pos z.","status":"ok","from":4,"to":5},{"text":"In the first case, substitute n₂ = p₁ + z. Since i is additive and negation distributes over the sum ([[AffineConstructive.theory.additive_groups.negate_plus_distr]]), regrouping gives i p₁ − i p₁ − i z. The first two terms cancel.","status":"ok","from":6,"to":8},{"text":"In the second case, substitute p₁ = z + n₂. Regrouping gives i z + (i n₂ − i n₂), and the bracket cancels.","status":"ok","from":9,"to":11},{"text":"Negative n₁ plus positive p₂: compare n₁ with p₂ in the same way. Either n₁ + z = p₂ and the sum is pos z, or n₁ = p₂ + z and the sum is neg z.","status":"ok","from":12,"to":13},{"text":"In the first case, substituting p₂ = n₁ + z and regrouping gives −i n₁ + i n₁ + i z. The first two terms cancel.","status":"ok","from":14,"to":16},{"text":"In the second case, substitute n₁ = z + p₂ and distribute the negation. This gives −i z − i p₂ + i p₂, and the last two terms cancel.","status":"ok","from":17,"to":19},{"text":"Both negative: −i (n₁ + n₂) = −i n₁ − i n₂, because i is additive and negation distributes over a sum ([[AffineConstructive.theory.additive_groups.negate_plus_distr]]).","status":"ok","from":20,"to":22}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.pls","base":"pls","kind":"inst","start":134,"body":null,"status":"ok","short":{"text":"Addition on the signed naturals, a function on the tensor product","status":"ok"},"long":{"text":"Equips the signed naturals with an addition. It is a function on the tensor square: the sign-wise sum applied to the pair. It preserves equality because it agrees with addition in the Grothendieck group, by [[AffineConstructive.theory.projected_set.projected_is_fun]]. It needs a correct comparison with difference on the naturals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.plus_correct","base":"plus_correct","kind":"def","start":135,"body":null,"status":"ok","short":{"text":"The interpretation in the Grothendieck group preserves addition: to_ℤ (x + y) = to_ℤ x + to_ℤ y","status":"ok"},"long":{"text":"The correctness of addition on the signed naturals, stated for two arguments rather than for a pair: [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ]] sends a sum to the sum of the images. It is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.plus_op_correct]] restated in curried form. [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_com_ring]] takes it as one of its inputs when the commutative ring laws are transported from the Grothendieck group of ℕ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.zero_correct","base":"zero_correct","kind":"prf","start":136,"body":[137,139],"status":"ok","short":{"text":"The interpretation of 0 is 0","status":"ok"},"proof":[{"text":"The zero of the signed naturals is pos 0, which is interpreted as i 0. By definition, that is the zero of the Grothendieck group.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.one_correct","base":"one_correct","kind":"prf","start":140,"body":[141,143],"status":"ok","short":{"text":"The interpretation of 1 is 1","status":"ok"},"proof":[{"text":"The unit pos 1 is sent to the image of 1 in the Grothendieck group, which is the unit there, so both sides agree by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_com_ring","base":"is_com_ring","kind":"inst","start":144,"body":null,"status":"ok","short":{"text":"The signed naturals are a commutative ring","status":"ok"},"long":{"text":"Makes the signed naturals a commutative ring. All the laws are transported from the Grothendieck group along the injective interpretation map, by [[AffineConstructive.theory.rings.projected_commutative_ring]], since the map preserves addition, multiplication, zero, one and negation. No ring law is proved directly on representations.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.with_naturals.let:inst4","base":"let:inst4","kind":"let","start":145,"body":null,"status":"ok","short":{"text":"Names the commutative ring of signed naturals, [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_com_ring]], for the section's proofs","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ_mor","base":"to_ℤ_mor","kind":"inst","start":146,"body":[147,157],"status":"ok","short":{"text":"The interpretation of signed naturals in the Grothendieck group is a rig morphism","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.rings.alt_Build_Rig_Morphism]], a map between rigs is a rig morphism once it preserves addition, multiplication, zero and one; these are the four things to show.","status":"ok","from":0,"to":1},{"text":"Addition is preserved by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.plus_correct]].","status":"ok","from":2,"to":3},{"text":"Multiplication is preserved by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.mult_correct]].","status":"ok","from":4,"to":5},{"text":"Zero is preserved by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.zero_correct]].","status":"ok","from":6,"to":7},{"text":"One is preserved by [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.one_correct]].","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℕ_mor","base":"of_ℕ_mor","kind":"inst","start":158,"body":[159,161],"status":"ok","short":{"text":"The inclusion n ↦ pos n of the naturals into the signed naturals is a rig morphism","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.rings.alt_Build_Rig_Morphism]] it suffices that n ↦ pos n preserves addition, multiplication, zero and one; on positive arguments the operations of the signed naturals are those of ℕ, so each condition holds by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.with_naturals.let:inst5","base":"let:inst5","kind":"let","start":162,"body":null,"status":"ok","short":{"text":"Names the rig morphism n ↦ pos n from the naturals into the signed naturals, [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℕ_mor]], for the section's proofs","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ","base":"of_ℤ","kind":"def","start":163,"body":null,"status":"ok","short":{"text":"The map from the Grothendieck group to the signed naturals extending n ↦ pos n","status":"ok"},"long":{"text":"The map from the Grothendieck group of the naturals to the signed naturals, obtained from the universal property of the group completion ([[AffineConstructive.theory.group_completion.from_group_completion2]]). It is the unique extension along i of the monoid morphism n ↦ pos n into the additive group of the signed naturals. It is a rig morphism, and it is surjective, with the interpretation map as its inverse. That makes the signed naturals a retract of a known model of the integers.\n\n```tikzcd\n\\mathbb{N} \\arrow[r, \"i\"] \\arrow[dr, \"\\mathrm{pos}\"'] & \\mathbb{Z} \\arrow[d, \"\\mathrm{of}_{\\mathbb{Z}}\"] \\\\\n & Z\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ_mor","base":"of_ℤ_mor","kind":"inst","start":164,"body":[165,167],"status":"ok","short":{"text":"The extension from the Grothendieck group to the signed naturals is a rig morphism","status":"ok"},"proof":[{"text":"The map is by definition the extension along the Grothendieck group of the rig morphism n ↦ pos n into the ring of signed naturals, and such an extension is a rig morphism by [[AffineConstructive.theory.group_completion.from_group_completion_rig_mor]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ_spec","base":"of_ℤ_spec","kind":"prf","start":168,"body":[169,171],"status":"ok","short":{"text":"The extension composed with i is the inclusion n ↦ pos n","status":"ok"},"proof":[{"text":"This is the defining property of the extension along the group completion, [[AffineConstructive.theory.group_completion.from_group_completion2_spec]]: composed with the canonical map i it gives back the map it extends.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.ℤ","base":"ℤ","kind":"abbrev","start":242,"body":null,"status":"ok","short":{"text":"The Grothendieck group of the naturals, the reference model of the integers in this file","status":"ok"},"long":{"text":"A local name for the Grothendieck group of the naturals, [[AffineConstructive.implementations.grothendieck_group.GrothendieckPairs]] applied to the additive monoid of ℕ. It is already known to be a model of the integers. The file uses it as the target for checking the signed naturals: equality on the signed naturals is pulled back from it, and every operation is checked against the corresponding operation there.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.i","base":"i","kind":"abbrev","start":243,"body":null,"status":"ok","short":{"text":"The canonical map from the naturals into their Grothendieck group, n to the class of (n, 0)","status":"ok"},"long":{"text":"A local name for [[AffineConstructive.implementations.grothendieck_group.to_grothendieck_group]] on the naturals. It is a rig morphism and is injective, by [[AffineConstructive.theory.integers.naturals_to_integers_inj_alt]]. The map from signed naturals to the Grothendieck group sends pos n to i n and neg n to −i n, so most facts about signed naturals come down to facts about i.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_integers.let:inst","base":"let:inst","kind":"let","start":244,"body":null,"status":"ok","short":{"text":"Makes the Grothendieck group of the naturals, as a model of the integers, a hypothesis for comparing it with the signed naturals","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_integers.let:inst2","base":"let:inst2","kind":"let","start":245,"body":null,"status":"ok","short":{"text":"Makes the rig morphism property of the canonical map from the naturals into their Grothendieck group a hypothesis for the section","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_integers.let:inst3","base":"let:inst3","kind":"let","start":246,"body":[247,249],"status":"ok","short":{"text":"The canonical map from the naturals into their Grothendieck group is injective, by [[AffineConstructive.theory.integers.naturals_to_integers_inj_alt]]","status":"ok"},"proof":[{"text":"The map i into the Grothendieck group is a rig morphism, so it is additive and preserves 1. The Grothendieck group is a model of the integers. Any additive map from the naturals into the integers that preserves 1 is injective, by [[AffineConstructive.theory.integers.naturals_to_integers_inj_alt]]. The subtraction on the naturals assumed in this section plays no part in the argument.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.Z'","base":"Z'","kind":"abbrev","start":250,"body":null,"status":"ok","short":{"text":"Local name for the signed naturals over the given naturals","status":"ok"},"long":{"text":"A local abbreviation for the set of signed naturals over the naturals fixed in the section. The section proves that this set is the integers, and the abbreviation shortens the statements there.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ_surj","base":"of_ℤ_surj","kind":"inst","start":251,"body":[252,261],"status":"ok","short":{"text":"The extension from the Grothendieck group onto the signed naturals is surjective, with inverse the interpretation","status":"ok"},"proof":[{"text":"The interpretation is a right inverse of the extension: it has to be shown that applying the extension after the interpretation fixes every signed natural. Split according to the sign, pos p or neg n.","status":"ok","from":0,"to":1},{"text":"For pos p the interpretation is i p, so the claim is that the extension sends i p to pos p, which is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ_spec]].","status":"ok","from":2,"to":4},{"text":"For neg n the interpretation is −i n, and the claim is that the extension sends it to −pos n. The extension is a rig morphism between rings, so it commutes with negation by [[AffineConstructive.theory.additive_groups.preserves_negate]], and since negation is a function it remains to show that the extension sends i n to pos n.","status":"ok","from":5,"to":7},{"text":"That is again [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ_spec]].","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_group","base":"to_group","kind":"inst","start":262,"body":null,"status":"ok","short":{"text":"The canonical maps from the signed naturals into every additive group with a distinguished element","status":"ok"},"long":{"text":"Equips the signed naturals over ℕ with their canonical maps into additive groups: for each additive group with a distinguished element, the map that sends 1 to that element. These maps are not defined afresh by recursion on signed naturals. They are the canonical maps out of the Grothendieck group of ℕ, which is already known to be the integers, composed with the inverse of [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ]]. That inverse is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ]], and the composite is given by [[AffineConstructive.theory.integers.retract_is_int_to_group]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_integers","base":"is_integers","kind":"inst","start":263,"body":null,"status":"ok","short":{"text":"The signed naturals over ℕ are the integers","status":"ok"},"long":{"text":"Proves that the commutative ring of signed naturals over ℕ, with the canonical maps of [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_group]], is the integers in the sense of [[AffineConstructive.interfaces.integers.Integers]]: its canonical map into each pointed additive group is the unique morphism. The proof is the retract construction [[AffineConstructive.theory.integers.retract_is_int]]. The Grothendieck group of ℕ is the integers, and [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ]] maps it onto the signed naturals ([[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.of_ℤ_surj]]) by a rig morphism whose inverse [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_ℤ]] is also a rig morphism. A ring onto which the integers map in this way is itself the integers.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.signed_naturals.ints","base":"ints","kind":"def","start":274,"body":[275,283],"status":"ok","short":{"text":"The signed naturals over ℕ as a bundled model of the integers","status":"ok"},"proof":[{"text":"A bundled model of the integers consists of a ring, the canonical maps into additive groups, and the proof that these make it the integers; each is supplied in turn.","status":"ok","from":0,"to":1},{"text":"The ring is the signed naturals with their commutative ring structure.","status":"ok","from":2,"to":3},{"text":"The maps into groups are [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.to_group]], which factor through the Grothendieck group.","status":"ok","from":4,"to":5},{"text":"That these make the signed naturals the integers is [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.is_integers]].","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.implementations.signed_naturals_integers.SignedNat","base":"SignedNat","kind":"def","start":296,"body":null,"status":"ok","short":{"text":"The integers as signed naturals over the development's concrete naturals","status":"ok"},"long":{"text":"The bundled model of the integers [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.ints]], instantiated at the concrete model of the naturals [[AffineConstructive.implementations.nat.rig.Nat_naturals]]. Its elements are pos n and neg n for natural numbers n, and zero has the two representations pos 0 and neg 0. Addition compares magnitudes with the subtraction of the naturals, and multiplication multiplies magnitudes and combines signs. It is a concrete integers whose arithmetic computes by case analysis on signs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.SignedNat_eq_dec","base":"SignedNat_eq_dec","kind":"def","start":297,"body":null,"status":"ok","short":{"text":"The boolean decision procedure for equality of the signed-natural integers","status":"ok"},"long":{"text":"The decision procedure [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.eq_dec]] at the concrete naturals, registered for the carrier of [[AffineConstructive.implementations.signed_naturals_integers.SignedNat]]. Two elements of the same sign are compared by comparing their magnitudes. Two elements of opposite sign are equal exactly when both magnitudes are 0, which is how the two representations of zero are identified.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.signed_naturals_integers.SignedNat_eq_is_dec","base":"SignedNat_eq_is_dec","kind":"def","start":299,"body":null,"status":"ok","short":{"text":"The decision procedure SignedNat_eq_dec is correct for the equality of SignedNat","status":"ok"},"long":{"text":"The correctness theorem [[AffineConstructive.implementations.signed_naturals_integers.signed_naturals.eq_is_dec]] at the concrete naturals: the boolean returned by [[AffineConstructive.implementations.signed_naturals_integers.SignedNat_eq_dec]] decides the equality of [[AffineConstructive.implementations.signed_naturals_integers.SignedNat]]. When it is true the two elements are equal, and when it is false they are apart. It is registered so that resolution finds it whenever that decision procedure is in use.","status":"ok"},"proof":[]}],"diagrams":{"svg":{"\n\\mathbb{N} \\arrow[r, \"i\"] \\arrow[dr, \"\\mathrm{pos}\"'] & \\mathbb{Z} \\arrow[d, \"\\mathrm{of}_{\\mathbb{Z}}\"] \\\\\n & Z":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='67.011pt' height='51.25pt' viewBox='0 0 67.011 51.25'>\n<defs>\n<path id='g3-1' d='M1.43582-2.75315H2.30707V-3.00407H1.40794V-3.78471C1.40794-4.41898 1.78432-4.71172 2.08403-4.71172C2.14676-4.71172 2.21646-4.69778 2.28616-4.67687C2.18858-4.62111 2.13282-4.50959 2.13282-4.39807C2.13282-4.20988 2.26525-4.07745 2.45344-4.07745S2.77406-4.20988 2.77406-4.39807C2.77406-4.69778 2.47435-4.90688 2.091-4.90688C1.54037-4.90688 .91307-4.51656 .91307-3.78471V-3.00407H.31365V-2.75315H.91307V-.55063C.91307-.25092 .84337-.25092 .39032-.25092V0C.42517 0 .89913-.02788 1.1849-.02788C1.48461-.02788 1.79129-.01394 2.091 0V-.25092H1.9516C1.43582-.25092 1.43582-.32759 1.43582-.56457V-2.75315Z'/>\n<path id='g3-2' d='M3.68713-1.48461C3.68713-2.35586 2.94134-3.10862 1.97948-3.10862S.27183-2.35586 .27183-1.48461C.27183-.62033 1.03853 .0697 1.97948 .0697S3.68713-.62033 3.68713-1.48461ZM1.97948-.15334C1.72159-.15334 1.34521-.23698 1.1152-.57851C.92701-.86428 .9061-1.22672 .9061-1.54734C.9061-1.84705 .91307-2.25828 1.15702-2.55799C1.33127-2.76012 1.62401-2.91346 1.97948-2.91346C2.39071-2.91346 2.68345-2.7183 2.83679-2.50223C3.03195-2.2304 3.05286-1.8819 3.05286-1.54734S3.03195-.84337 2.82982-.5576C2.64163-.29274 2.32101-.15334 1.97948-.15334Z'/>\n<path id='g3-3' d='M1.93766 1.10126C1.48461 1.10126 1.41491 1.10126 1.41491 .80155V-.33456C1.44976-.29971 1.77735 .0697 2.36283 .0697C3.28287 .0697 4.07048-.62033 4.07048-1.50552C4.07048-2.36283 3.35954-3.073 648 33.69262 49.71452 34.76049C49.41256 33.69262 48.67924 32.63271 47.12626 32.15707' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 51.25)'>\n<use x='52.029634' y='-23.135387' xlink:href='#g3-2'/>\n<use x='56.002535' y='-23.135387' xlink:href='#g3-1'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 0 51.25)'>\n<use x='59.040588' y='-22.113229' xlink:href='#g4-1'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.naturals":{"page":"../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.interfaces.integers":{"page":"../interfaces/integers.html","short":"Interface for the integers as the free group on one generator, and ordered integers","summary":"The file gives the interface for the integers, characterised by a universal property. [[IntegersToGroup]] supplies a canonical map from Z into every additive group with a distinguished element, and [[Integers]] states that Z is a ring for which this map is the unique additive morphism preserving 1, so that Z is the free group on one generator. The bundled record [[integers]] packages a ring with this structure, and [[OrderedIntegers]] adds a strong linear refutative ring order, giving the integers as an ordered ring. The theory of the integers and their concrete models build on these classes."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.group_completion":{"page":"../interfaces/group_completion.html","short":"Universal property of the group completion of an additive monoid","summary":"This file states the universal property of the group completion (Grothendieck group) of an additive monoid. A map i : M ⇾ K from an additive monoid to an additive group comes with an extension operation, [[FromGroupCompletion]], that turns each monoid morphism f : M ⇾ A into a map K ⇾ A, where A is any additive group, abelian or not. [[FromGroupCompletionProp]] says that a map g is the unique monoid morphism with g ∘ i = f. [[GroupCompletion]] requires this of the extension for every such f, which makes K the free group on M. The file is an interface only: it proves nothing, and concrete models such as the integers over the naturals provide instances."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.logic.dec":{"page":"../logic/dec.html","short":"Boolean decision functions for affine relations, and proving their instances by computation","summary":"The file collects lemmas for using a relation R together with a boolean decision function that is correct for it, in the sense of [[IsDec]]: the boolean [[AffineConstructive.interfaces.aprop.dec]] R x is true when R x holds and false when its negation does. [[dec_spec_by_iff]] transports this correctness along an equivalence R x ⧟ P, [[dec_spec_dual]] states the false branch by a De Morgan dual of R x instead of its negation, and [[dec_spec_andb]] combines two decisions by boolean conjunction, giving R₁ x₁ ∧ R₂ x₂ on true and R₁ x₁ᗮ ∨ R₂ x₂ᗮ on false. The main result, [[dec_spec_true]], is the equivalence R x ⧟ (dec R x = true), and the tactic [[decide_relation]] uses it to prove closed instances of a decidable relation by computing the boolean."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.projected_set":{"page":"../theory/projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.theory.rings":{"page":"../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.group_completion":{"page":"../theory/group_completion.html","short":"Group completions: uniqueness, decomposition as differences, transfer of equality, order and ring structure","summary":"This file develops the general theory of a group completion i : M ⇾ K of a commutative monoid, given by the universal property of [[GroupCompletion]] rather than by a construction. It extends monoid morphisms into any additive group ([[from_group_completion2]]), shows that any two completions are isomorphic ([[group_completion_iso]]), and writes every element of K as a difference i p − i n ([[group_completion_decompose]]) by comparison with the Grothendieck group. When M is cancellative, i is injective, and strength and decidable, refutative and affirmative equality pass from M to K. On the order side, an order on K that compares differences as a + d ≤ c + b makes K an ordered group with i an order embedding ([[group_completion_add_grp_order]]), and strong, linear, total, refutative, affirmative and decidable orders transfer. For a rig M completed into a ring, extensions of rig morphisms are rig morphisms, and commutativity, nontriviality, the ordered-ring structure ([[group_completion_ring_order]]) and being an integral domain ([[group_completion_int_domain]]) transfer; each result is also registered for the Grothendieck pairs of [[GrothendieckPairs]]."},"AffineConstructive.theory.naturals":{"page":"../theory/naturals.html","short":"General theory of the naturals: uniqueness, NNO, commutative rig, cancellation, induction","summary":"This file develops the general theory of the [[Naturals]] interface, which characterises the natural numbers as a near-rig initial among additive monoids with a chosen 1. It shows that any two models are isomorphic through their canonical maps ([[naturals_to_naturals_bijective]]), that a retract of a model is again a model ([[retract_is_nat]]), and that every model is a natural numbers object ([[naturals_nno]]) via the concrete naturals [[Nat]]. On the algebraic side, every model is a commutative rig ([[naturals_is_com_rig]]), its canonical map into any near-rig is a rig morphism ([[naturals_to_mon_rig_mor]]), 1 ≠ 0 holds, addition cancels, there are no zero divisors in the strong sense, and x + y = 0 if and only if x = 0 ⊠ y = 0 ([[zero_sum]]). The file also gives induction principles phrased with 1 + n in place of the successor ([[naturals_ind]], [[naturals_ind_alt]], the tactic [[naturals_induction]]), the distance lemma [[naturals_distance]], and facts about negating the images of naturals in near-rings and rings."},"AffineConstructive.implementations.grothendieck_group":{"page":"grothendieck_group.html","short":"The Grothendieck group of a commutative monoid, its universal property, order and ring structure","summary":"This file constructs the Grothendieck group of a commutative additive monoid M as the quotient of M ⊗ M by the relation (a, b) ~ (c, d) when there is k with a + d + k = c + b + k. The relation is an equivalence and a congruence for addition, and negation swaps the two components, so the quotient is an abelian group. The map [[to_grothendieck_group]], a ↦ (a, 0), is a monoid morphism. With [[from_grothendieck_group]] as the extension operation, it is the group completion of M ([[grothendieck_group_is_completion]]), with the universal property taken against all additive groups, abelian or not. When addition on M cancels, equality of pairs reduces to a + d = c + b. Under that hypothesis the embedding is injective, and affirmative, refutative or decidable equality, and the strong-set structure, pass from M to its Grothendieck group; affirmative equality passes without cancellation. The file also defines the order induced by an ordered monoid and shows that a strong rig's Grothendieck group is a ring, commutative when the rig is, with the embedding a rig morphism."},"AffineConstructive.theory.integers":{"page":"../theory/integers.html","short":"The integers: initiality, group completion of the naturals, decidability and integral domain","summary":"The file develops the integers from their defining property, initiality among additive groups with a distinguished element 1. Two morphisms out of Z that preserve addition, zero and 1 are equal ([[integers_initial_alt]]), so the canonical map between any two models of the integers is a bijection ([[integers_to_integers_bijective]]). In both directions the integers are the group completion of the naturals: a ring that is the group completion of N along a rig morphism is a model of the integers ([[naturals_completion_integers]]), which makes the Grothendieck group of the naturals one, and conversely the canonical map from N exhibits any model as the group completion of N ([[integers_group_completion]]). From that it follows that the map from N is injective, that every integer is a difference of naturals ([[integers_split_spec]]) and is n or −n for some natural n ([[integers_decompose]]), and that Z has decidable equality, is an integral domain and has strongly no zero divisors. The canonical map into any near-ring preserves multiplication as well ([[integers_to_near_ring_mor]]), and a ring onto which Z retracts by additive morphisms preserving 1 is itself a model of the integers ([[retract_is_int]])."},"AffineConstructive.implementations.bool":{"page":"bool.html","short":"The booleans as a decidable totally ordered distributive lattice, embedded in Ω","summary":"This file defines the set 𝟐 of booleans, whose equality is strict equality affirmed, and the boolean operations and, or, not and exclusive or, each as a map and as a function of sets. A decision function for equality, shown correct, makes the equality of 𝟐 decidable, refutative and an apartness, and [[true_ne_false]] separates the two booleans. Two induction principles reduce a statement about every boolean to its two cases. The order p ≤ q, the truth of notb p || q, is a decidable total order with a computable trichotomy. With false as bottom, true as top, and as meet and or as join, it is a bounded distributive lattice. The inclusion [[bool_to_Ω]], sending true to 𝐓 and false to 𝐅, is injective, a lattice morphism and an order embedding, so 𝟐 is the two-element sublattice of Ω, made of decidable propositions."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.replc":{"page":"../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.implementations.nat":{"page":"nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."}},"constants":null}</script>

fineConstructive.implementations.z2","name":"ℤ₂","kind":"def","local":true},{"s":4271,"e":4274,"lib":"AffineConstructive.interfaces.aprop","name":"all","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":4280,"e":4292,"lib":"AffineConstructive.implementations.bool","name":"bool_ind_alt","kind":"thm","local":false,"page":"bool.html"},{"s":4352,"e":4362,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂_ind_alt","kind":"def","local":true},{"s":4430,"e":4450,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StrongNoZeroDivisors","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":4451,"e":4453,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂","kind":"def","local":true},{"s":4517,"e":4537,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StrongNoZeroDivisors","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":4538,"e":4540,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂","kind":"def","local":true},{"s":4573,"e":4599,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂_strong_no_zero_divisors","kind":"thm","local":true},{"s":4645,"e":4659,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"NoZeroDivisors","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":4660,"e":4662,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂","kind":"def","local":true},{"s":4695,"e":4721,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂_strong_no_zero_divisors","kind":"thm","local":true},{"s":4768,"e":4782,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"IntegralDomain","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":4783,"e":4785,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂","kind":"def","local":true},{"s":4833,"e":4847,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"IntegralDomain","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":4848,"e":4850,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂","kind":"def","local":true},{"s":4883,"e":4896,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂_int_domain","kind":"thm","local":true},{"s":4942,"e":4975,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"NonZeroMultiplicativeCancellation","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":4976,"e":4978,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂","kind":"def","local":true},{"s":5011,"e":5024,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂_int_domain","kind":"thm","local":true},{"s":1379,"e":1382,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":4326,"e":4344,"lib":"AffineConstructive.tactics.change_quantifiers","name":"change_quantifiers","kind":"ltac","local":false,"page":"../tactics/change_quantifiers.html"},{"s":4462,"e":4474,"lib":"AffineConstructive.implementations.z2","name":"ℤ₂_induction","kind":"ltac","local":true},{"s":4476,"e":4479,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":4480,"e":4488,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":4795,"e":4798,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file makes the set 𝟐 of booleans into ℤ₂, the integers modulo 2. Zero is false and one is true, addition is exclusive or, negation is the identity and multiplication is boolean and. The equality of ℤ₂ is the decidable equality of the booleans, so it is affirmative, refutative and strong. The ring axioms hold by checking every combination of values ([[AffineConstructive.implementations.z2.ℤ₂_is_comring]]), and the whole hierarchy from additive semigroups up to commutative rings is registered for ℤ₂. The file also proves 1 ≠ 0 and the strong form of having no zero divisors, which together make ℤ₂ an integral domain ([[AffineConstructive.implementations.z2.ℤ₂_int_domain]]). For case analysis on elements of ℤ₂ it provides an affine principle, a base-logic principle and a tactic that applies the base-logic one.","short":"The two-element ring ℤ₂ on the booleans: a commutative ring and an integral domain","items":[{"name":"AffineConstructive.implementations.z2.ℤ₂","base":"ℤ₂","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"The two-element ring ℤ₂ of integers modulo 2, carried by the set 𝟐 of booleans","status":"ok"},"long":{"text":"ℤ₂ is the set of booleans [[AffineConstructive.implementations.bool.bool_set]] itself, with its equality the strict equality of booleans, affirmed. It is not a new set. It is a name under which the file attaches the ring structure. Zero is false and one is true. Addition is exclusive or ([[AffineConstructive.implementations.bool.xorb_fun]]), negation is the identity, since every element is its own additive inverse, and multiplication is boolean and ([[AffineConstructive.implementations.bool.andb_fun]]).\n\nThe equality comes from the booleans. It is decidable by [[AffineConstructive.implementations.bool.bool_eq_is_dec]], so it is affirmative, refutative and strong, and inequality on ℤ₂ is an apartness. These facts, the operations and the whole ring hierarchy up to [[AffineConstructive.implementations.z2.ℤ₂_int_domain]] are registered so that resolution finds them for ℤ₂ directly, without unfolding it to the booleans.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.z2.ℤ₂_is_comring","base":"ℤ₂_is_comring","kind":"prf","start":18,"body":[19,21],"status":"ok","short":{"text":"ℤ₂, with exclusive or as addition and boolean and as multiplication, is a commutative ring","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.rings.alt_Build_CommutativeRing2]] it suffices to check the abelian group laws of exclusive or, the monoid laws and commutativity of boolean and, and left distributivity. Each law is a statement about finitely many booleans: splitting every variable into its two values reduces it to finitely many closed instances, and each instance holds by computation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.z2.ℤ₂_nontrivial","base":"ℤ₂_nontrivial","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"In ℤ₂ the unit is apart from zero: 1 ≠ 0","status":"ok"},"long":{"text":"The ring ℤ₂ is nontrivial: 1 ≠ 0. Since 1 is true and 0 is false, this is the fact [[AffineConstructive.implementations.bool.true_ne_false]] about the booleans, read as a statement about the ring. Because the equality of ℤ₂ is strong, the inequality is an apartness. This is one of the conditions in [[AffineConstructive.implementations.z2.ℤ₂_int_domain]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.z2.ℤ₂_ind","base":"ℤ₂_ind","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"For a predicate P on ℤ₂, P 0 ∧ P 1 implies P y for all y","status":"ok"},"long":{"text":"Case analysis on ℤ₂ as an affine implication. The predicate is a morphism ℤ₂ ⇾ Ω, so it respects equality. The hypothesis is the additive conjunction P 0 ∧ P 1, not the tensor, because each instance of the conclusion P y needs only one of the two cases, and the additive conjunction lets the proof choose that one. Since the implication is affine, it also carries its contrapositive: a refutation of P at some y gives a refutation of P 0 or of P 1.\n\nIt is the boolean principle [[AffineConstructive.implementations.bool.bool_ind]] restated with 0 and 1 in place of false and true.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.z2.ℤ₂_ind_alt","base":"ℤ₂_ind_alt","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"For any map P from ℤ₂ to Ω, proofs of P 0 and of P 1 give P y for all y","status":"ok"},"long":{"text":"Case analysis on ℤ₂ in the base logic. The two cases are separate base-logic hypotheses, not an affine conjunction. The predicate is any map from the carrier to Ω, with no requirement that it respect equality, so the principle applies to any goal stated over ℤ₂. The conclusion is still the affine universal statement. This is the form [[AffineConstructive.implementations.z2.ℤ₂_induction]] applies. It is [[AffineConstructive.implementations.bool.bool_ind_alt]] restated with 0 and 1 in place of false and true.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.z2.ℤ₂_induction","base":"ℤ₂_induction","kind":"ltac","start":50,"body":null,"status":"ok","short":{"text":"Splits a goal quantified over ℤ₂ into the two cases 0 and 1","status":"ok"},"long":{"text":"The tactic acts on a goal that says something holds for every element of ℤ₂. It first unfolds the head of the goal, so that a class statement such as a ring axiom shows its quantifier. Then it tries to restate the goal's quantifiers as the affine universal quantifier. Last, it applies [[AffineConstructive.implementations.z2.ℤ₂_ind_alt]], which leaves two goals: the statement at 0 and the statement at 1.\n\nIt is used when a property of ℤ₂ follows by checking both elements. When the goal quantifies over several variables, each remaining goal can be split again. In this file, [[AffineConstructive.implementations.z2.ℤ₂_strong_no_zero_divisors]] is proved this way, and each resulting case closes by computation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.implementations.z2.ℤ₂_strong_no_zero_divisors","base":"ℤ₂_strong_no_zero_divisors","kind":"prf","start":52,"body":[53,55],"status":"ok","short":{"text":"In ℤ₂, x · y = 0 implies x = 0 or y = 0 (additive or)","status":"ok"},"proof":[{"text":"Case analysis on the factors leaves two cases. If the first factor is 1, the product is the second factor and x · y = 0 implies y = 0 by the right injection into the or; if it is 0, the disjunct x = 0 is true and the or reduces to truth. Simplification closes both cases.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.implementations.z2.ℤ₂_int_domain","base":"ℤ₂_int_domain","kind":"prf","start":58,"body":[59,61],"status":"ok","short":{"text":"ℤ₂ is an integral domain","status":"ok"},"proof":[{"text":"An integral domain is a commutative ring in which 1 ≠ 0 and which has no zero divisors. The ring structure is [[AffineConstructive.implementations.z2.ℤ₂_is_comring]], the apartness is [[AffineConstructive.implementations.z2.ℤ₂_nontrivial]], and the absence of zero divisors (with par) follows from [[AffineConstructive.implementations.z2.ℤ₂_strong_no_zero_divisors]] by [[AffineConstructive.theory.rings.strong_no_zero_divisors_no_zero_divisors]], since an additive or implies the corresponding par.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.default_equality":{"page":"../theory/default_equality.html","short":"Discrete sets: equality as affirmed strict equality, and maps out of them","summary":"The file introduces the discrete sets of the development: [[default_set_make]] equips any type with the affirmed strict equality [[leq]] as its set equality, and the class [[DefaultEquality]] records that a set's equality is of this form. Such a set has affirmative equality ([[default_equality_affirmative]]), and every map out of it preserves equality ([[default_equality_is_fun]]), so that [[default_eq_func]] turns any bare map into a function of sets. The tensor product X ⊗ Y of two such sets again has default equality ([[DefaultEquality_tensor]]). It is the bridge by which inductive types such as the booleans and the naturals enter the theory of affine sets."},"AffineConstructive.logic.srelations":{"page":"../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.rings":{"page":"../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.implementations.bool":{"page":"bool.html","short":"The booleans as a decidable totally ordered distributive lattice, embedded in Ω","summary":"This file defines the set 𝟐 of booleans, whose equality is strict equality affirmed, and the boolean operations and, or, not and exclusive or, each as a map and as a function of sets. A decision function for equality, shown correct, makes the equality of 𝟐 decidable, refutative and an apartness, and [[true_ne_false]] separates the two booleans. Two induction principles reduce a statement about every boolean to its two cases. The order p ≤ q, the truth of notb p || q, is a decidable total order with a computable trichotomy. With false as bottom, true as top, and as meet and or as join, it is a bounded distributive lattice. The inclusion [[bool_to_Ω]], sending true to 𝐓 and false to 𝐅, is injective, a lattice morphism and an order embedding, so 𝟐 is the two-element sublattice of Ω, made of decidable propositions."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.change_quantifiers":{"page":"../tactics/change_quantifiers.html","short":"A tactic converting base ∀/∃ goals into affine ∏/∐ propositions","summary":"This file provides a tactic that turns a goal written with the base quantifiers ∀ and ∃ over the proof component of an affine proposition into the proof of one affine proposition, made with the affine quantifiers ∏ and ∐. [[rewrite_quantifiers]] works through the nested quantifiers and builds the affine proposition, keeping the bound variables in place. [[change_quantifiers]] uses it to restate the goal. The conversion relies only on the fact that the proof components of [[all]] and [[aex]] are, by definition, the base quantifiers of the proof components. So the new goal is definitionally equal to the old one, and after the change the affine laws of the connectives can rewrite it."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

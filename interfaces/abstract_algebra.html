ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Bottom_Pointed_Morphism_fun","base":"Bottom_Pointed_Morphism_fun","kind":"def","start":182,"body":null,"status":"ok","short":{"text":"The class of bottom-preserving functions, registered for rewriting through Pointed_Morphism_fun","status":"ok"},"long":{"text":"Registers [[AffineConstructive.interfaces.abstract_algebra.Bottom_Pointed_Morphism]] as an instance of the packaged predicate [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism_fun]], so that statements that f preserves bottom can be rewritten in f like any pointed-morphism statement.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Zero_Pointed_Morphism_fun","base":"Zero_Pointed_Morphism_fun","kind":"def","start":183,"body":null,"status":"ok","short":{"text":"The class of zero-preserving functions, registered for rewriting through Pointed_Morphism_fun","status":"ok"},"long":{"text":"Registers [[AffineConstructive.interfaces.abstract_algebra.Zero_Pointed_Morphism]] as an instance of the packaged predicate [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism_fun]], so that statements that f preserves zero can be rewritten in f like any pointed-morphism statement.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism_fun","base":"One_Pointed_Morphism_fun","kind":"def","start":184,"body":null,"status":"ok","short":{"text":"The class of one-preserving functions, registered for rewriting through Pointed_Morphism_fun","status":"ok"},"long":{"text":"Registers [[AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism]] as an instance of the packaged predicate [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism_fun]], so that statements that f preserves one can be rewritten in f like any pointed-morphism statement.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.e","base":"e","kind":"abbrev","start":188,"body":null,"status":"ok","short":{"text":"Local abbreviation for the monoid unit inside the group-like sections","status":"ok"},"long":{"text":"A section-local shorthand for [[AffineConstructive.interfaces.algebra_notation.mon_unit]], used so the identity and inverse laws of [[AffineConstructive.interfaces.abstract_algebra.Monoid]] and [[AffineConstructive.interfaces.abstract_algebra.Group]] read with the unit written as e. It defines no new object and does not survive the section.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism","base":"SemiGroup_Morphism","kind":"rec","start":189,"body":null,"status":"ok","short":{"text":"The class of semigroup morphisms: f between semigroups with f (x ∙ y) = f x ∙ f y","status":"ok"},"long":{"text":"A semigroup morphism is a function f : X ⇾ Y between semigroups that preserves the operation: f (x ∙ y) = f x ∙ f y for all x and y. The record carries the semigroup structures of the source and the target as well, so that from the hypothesis that f is a morphism both are available; the source is found through a coercion, the target by a resolution hint. Since f is a morphism of affine sets, it is automatically strongly extensional, and the equation is an affine equality.\n\nVia the generic operation sets this one record also gives additive and multiplicative semigroup morphisms and meet- and join-semilattice morphisms ([[AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup_Morphism]], [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup_Morphism]], [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism]], [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Morphism]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.sgmor_a","base":"sgmor_a","kind":"proj","short":{"text":"The semigroup structure of the source of a semigroup morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.sgmor_b","base":"sgmor_b","kind":"proj","short":{"text":"The semigroup structure of the target of a semigroup morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.preserves_sg_op","base":"preserves_sg_op","kind":"proj","short":{"text":"A semigroup morphism f satisfies f (x ∙ y) = f x ∙ f y","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_SemiGroup_Morphism","base":"Build_SemiGroup_Morphism","kind":"constr","short":{"text":"Builds a semigroup morphism from the two semigroup structures and preservation of the operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism","base":"Monoid_Morphism","kind":"rec","start":191,"body":null,"status":"ok","short":{"text":"The class of monoid morphisms: semigroup morphisms between monoids preserving the unit","status":"ok"},"long":{"text":"A monoid morphism is a function f : X ⇾ Y between monoids that is a [[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]] and preserves the unit, [[AffineConstructive.interfaces.abstract_algebra.MonUnit_Pointed_Morphism]]. As for semigroup morphisms, the monoid structures of source and target are part of the record. Instantiated at the additive and multiplicative operation sets it gives [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] and [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid_Morphism]], and at meets with top and joins with bottom the bounded semilattice morphisms.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.monmor_a","base":"monmor_a","kind":"proj","short":{"text":"The monoid structure of the source of a monoid morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.monmor_b","base":"monmor_b","kind":"proj","short":{"text":"The monoid structure of the target of a monoid morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.monmor_sgmor","base":"monmor_sgmor","kind":"proj","short":{"text":"A monoid morphism is a semigroup morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.monmor_pointed","base":"monmor_pointed","kind":"proj","short":{"text":"A monoid morphism preserves the unit","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Monoid_Morphism","base":"Build_Monoid_Morphism","kind":"constr","short":{"text":"Builds a monoid morphism from the two monoids, preservation of the operation and of the unit","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.StarSemiGroup_Morphism","base":"StarSemiGroup_Morphism","kind":"rec","start":194,"body":null,"status":"ok","short":{"text":"The class of star-semigroup morphisms: semigroup morphisms commuting with the involution","status":"ok"},"long":{"text":"A morphism of star semigroups, that is, of semigroups with an involution that reverses products, is a [[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]] f that also commutes with the involution: f (x*) = (f x)*. The star-semigroup structures of source and target are part of the record. Since in a group the inverse is such an involution, this covers the compatibility of group morphisms with inverses.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.ssgmor_a","base":"ssgmor_a","kind":"proj","short":{"text":"The star-semigroup structure of the source of a star-semigroup morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.ssgmor_b","base":"ssgmor_b","kind":"proj","short":{"text":"The star-semigroup structure of the target of a star-semigroup morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.ssgmor_sgmor","base":"ssgmor_sgmor","kind":"proj","short":{"text":"A star-semigroup morphism is a semigroup morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.preserves_inv","base":"preserves_inv","kind":"proj","short":{"text":"A star-semigroup morphism f satisfies f (x*) = (f x)*","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_StarSemiGroup_Morphism","base":"Build_StarSemiGroup_Morphism","kind":"constr","short":{"text":"Builds a star-semigroup morphism from the two structures, a semigroup morphism and preservation of the involution","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.StarMonoid_Morphism","base":"StarMonoid_Morphism","kind":"rec","start":197,"body":null,"status":"ok","short":{"text":"The class of star-monoid morphisms: monoid morphisms that commute with the involution","status":"ok"},"long":{"text":"A morphism of star monoids is a function that is both a [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]] and a [[AffineConstructive.interfaces.abstract_algebra.StarSemiGroup_Morphism]]: it preserves the operation, the unit and the involution. The star-monoid structures of source and target are part of the record, as with the other morphism classes of the file.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.smonmor_a","base":"smonmor_a","kind":"proj","short":{"text":"The star-monoid structure of the source of a star-monoid morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.smonmor_b","base":"smonmor_b","kind":"proj","short":{"text":"The star-monoid structure of the target of a star-monoid morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.smonmor_monmor","base":"smonmor_monmor","kind":"proj","short":{"text":"A star-monoid morphism is a monoid morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.smonmor_ssgmor","base":"smonmor_ssgmor","kind":"proj","short":{"text":"A star-monoid morphism is a star-semigroup morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_StarMonoid_Morphism","base":"Build_StarMonoid_Morphism","kind":"constr","short":{"text":"Builds a star-monoid morphism from the two structures, a monoid morphism and a star-semigroup morphism","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism","base":"MeetSemiLattice_Morphism","kind":"def","start":203,"body":null,"status":"ok","short":{"text":"The class of meet-semilattice morphisms: f (x ⊓ y) = f x ⊓ f y","status":"ok"},"long":{"text":"A meet-semilattice morphism is a [[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]] for the meets, read through [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]], which presents a set with a meet as a semigroup with ⊓ as its operation. It asks that source and target be semigroups under meet and that f (x ⊓ y) = f x ⊓ f y. Defining it by instantiation means every fact about semigroup morphisms applies without restatement.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Morphism","base":"JoinSemiLattice_Morphism","kind":"def","start":204,"body":null,"status":"ok","short":{"text":"The class of join-semilattice morphisms: f (x ⊔ y) = f x ⊔ f y","status":"ok"},"long":{"text":"A join-semilattice morphism is a [[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]] for the joins, read through [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]]: f (x ⊔ y) = f x ⊔ f y, with source and target semigroups under join. It is the dual of [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism]], obtained by the same instantiation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Morphism","base":"BoundedMeetSemiLattice_Morphism","kind":"def","start":205,"body":null,"status":"ok","short":{"text":"The class of bounded meet-semilattice morphisms: preserving meets and top","status":"ok"},"long":{"text":"A bounded meet-semilattice morphism is a [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]] for meet with top as unit, read through [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]]: it preserves binary meets and sends ⊤ to ⊤, so it preserves all finite meets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Morphism","base":"BoundedJoinSemiLattice_Morphism","kind":"def","start":206,"body":null,"status":"ok","short":{"text":"The class of bounded join-semilattice morphisms: preserving joins and bottom","status":"ok"},"long":{"text":"A bounded join-semilattice morphism is a [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]] for join with bottom as unit, read through [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]]: it preserves binary joins and sends ⊥ to ⊥, so it preserves all finite joins.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Flip_Morphism","base":"MeetSemiLattice_Flip_Morphism","kind":"def","start":211,"body":null,"status":"ok","short":{"text":"A map turning meets into joins: f (x ⊓ y) = f x ⊔ f y","status":"ok"},"long":{"text":"A meet-semilattice flip morphism is a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism]] into the target with its order reversed ([[AffineConstructive.interfaces.relation_notation.order_op]]). In the reversed order the meet is the join of the target, so the class says that f turns meets into joins, f (x ⊓ y) = f x ⊔ f y. Defining it through the opposite order makes the dual notion an instantiation, not a new set of axioms.\n\nThe maps of this kind arise from richer flip morphisms. An order-reversing lattice morphism is one ([[AffineConstructive.theory.lattices.latmor_meet_sl_mor_flip]]), and so is a map that takes meets to joins and ⊤ to ⊥ ([[AffineConstructive.theory.lattices.bounded_msl_flip_mor_msl_flip_mor]]). theory.lattices states the law as [[AffineConstructive.theory.lattices.preserves_meet_flip]]. A meet-to-join map followed by a join-to-meet map preserves meets ([[AffineConstructive.theory.lattices.compose_meetsl_mor_flip]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Flip_Morphism","base":"JoinSemiLattice_Flip_Morphism","kind":"def","start":212,"body":null,"status":"ok","short":{"text":"A map turning joins into meets: f (x ⊔ y) = f x ⊓ f y","status":"ok"},"long":{"text":"A join-semilattice flip morphism is a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Morphism]] into the target with its order reversed ([[AffineConstructive.interfaces.relation_notation.order_op]]): f turns joins into meets, f (x ⊔ y) = f x ⊓ f y. It is the dual of [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Flip_Morphism]].\n\nAs with the meet version, the maps of this kind come from richer flip morphisms. An order-reversing lattice morphism is one ([[AffineConstructive.theory.lattices.latmor_join_sl_mor_flip]]), and so is a map that takes joins to meets and ⊥ to ⊤ ([[AffineConstructive.theory.lattices.bounded_jsl_flip_mor_jsl_flip_mor]]). theory.lattices states the law as [[AffineConstructive.theory.lattices.preserves_join_flip]] and composes these maps with each other ([[AffineConstructive.theory.lattices.compose_joinsl_mor_flip]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Flip_Morphism","base":"BoundedMeetSemiLattice_Flip_Morphism","kind":"def","start":213,"body":null,"status":"ok","short":{"text":"A map taking meets to joins and ⊤ to ⊥: f (x ⊓ y) = f x ⊔ f y, f ⊤ = ⊥","status":"ok"},"long":{"text":"A bounded meet-semilattice flip morphism is a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Morphism]] into the target with its order reversed ([[AffineConstructive.interfaces.relation_notation.order_op]]), whose meet is the target's join and whose top is its bottom. It satisfies f (x ⊓ y) = f x ⊔ f y and f ⊤ = ⊥: f carries finite meets of the source, the empty meet included, to finite joins of the target.\n\nA bounded order-reversing lattice morphism is such a map ([[AffineConstructive.theory.lattices.bounded_latmor_meet_flip]]). Two reversals compose to a morphism: this map followed by a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Flip_Morphism]] is a bounded meet-semilattice morphism ([[AffineConstructive.theory.lattices.compose_bounded_meetsl_mor_flip]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Flip_Morphism","base":"BoundedJoinSemiLattice_Flip_Morphism","kind":"def","start":214,"body":null,"status":"ok","short":{"text":"A map taking joins to meets and ⊥ to ⊤: f (x ⊔ y) = f x ⊓ f y, f ⊥ = ⊤","status":"ok"},"long":{"text":"A bounded join-semilattice flip morphism is a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Morphism]] into the target with its order reversed ([[AffineConstructive.interfaces.relation_notation.order_op]]), whose join is the target's meet and whose bottom is its top. It satisfies f (x ⊔ y) = f x ⊓ f y and f ⊥ = ⊤: f carries finite joins of the source, the empty join included, to finite meets of the target. It is the dual of [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Flip_Morphism]].\n\nA bounded order-reversing lattice morphism is such a map ([[AffineConstructive.theory.lattices.bounded_latmor_join_flip]]). Two reversals compose to a morphism: this map followed by a meet-and-top reversal is a bounded join-semilattice morphism ([[AffineConstructive.theory.lattices.compose_bounded_joinsl_mor_flip]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Lattice_Morphism","base":"Lattice_Morphism","kind":"rec","start":219,"body":null,"status":"ok","short":{"text":"The class of lattice morphisms: maps between lattices preserving both meet and join","status":"ok"},"long":{"text":"A lattice morphism f : X ⇾ Y between lattices preserves binary meets and binary joins. The record contains the lattice structures of the domain and the codomain, together with the two semilattice morphism properties [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism]] and [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Morphism]]. Each of those is a [[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]] on the corresponding view of X and Y ([[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]], [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]]), so the equations are f(x ⊓ y) = f x ⊓ f y and f(x ⊔ y) = f x ⊔ f y. These are equalities of Y, and as affine propositions they also carry the corresponding apartness statements.\n\nThe domain lattice is a coercion, so it is available wherever a lattice morphism is. The codomain lattice is reached by a hint, which recovers it from any lattice morphism hypothesis into Y. Bounded lattice morphisms are [[AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Morphism]], and the order-reversing version is [[AffineConstructive.interfaces.abstract_algebra.Lattice_Flip_Morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.latmor_a","base":"latmor_a","kind":"proj","short":{"text":"The lattice structure of the domain of a lattice morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.latmor_b","base":"latmor_b","kind":"proj","short":{"text":"The lattice structure of the codomain of a lattice morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.latmor_meet_sl_mor","base":"latmor_meet_sl_mor","kind":"proj","short":{"text":"A lattice morphism preserves meets","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.latmor_join_sl_mor","base":"latmor_join_sl_mor","kind":"proj","short":{"text":"A lattice morphism preserves joins","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Lattice_Morphism","base":"Build_Lattice_Morphism","kind":"constr","short":{"text":"Builds a lattice morphism from the two lattices and preservation of meets and of joins","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Lattice_Flip_Morphism","base":"Lattice_Flip_Morphism","kind":"def","start":221,"body":null,"status":"ok","short":{"text":"An order-reversing lattice morphism: it exchanges meets and joins","status":"ok"},"long":{"text":"A lattice flip morphism f : X ⇾ Y satisfies f (x ⊓ y) = f x ⊔ f y and f (x ⊔ y) = f x ⊓ f y. It is defined as a [[AffineConstructive.interfaces.abstract_algebra.Lattice_Morphism]] into Y with its order reversed ([[AffineConstructive.interfaces.relation_notation.order_op]]), which exchanges meet and join. The bounded version, which also exchanges top and bottom, is [[AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Flip_Morphism]].\n\nThe lemma concluding the class is that a bounded flip morphism is one ([[AffineConstructive.theory.lattices.bounded_latmor_flip_latmor_flip]]). [[AffineConstructive.theory.lattices.Build_Lattice_Flip_Morphism]] builds one from the two exchange laws, and [[AffineConstructive.theory.lattices.latmor_meet_sl_mor_flip]] and [[AffineConstructive.theory.lattices.latmor_join_sl_mor_flip]] take it apart into its two halves. The composite of two flip morphisms is a lattice morphism ([[AffineConstructive.theory.lattices.compose_lattice_mor_flip]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Morphism","base":"BoundedLattice_Morphism","kind":"rec","start":223,"body":null,"status":"ok","short":{"text":"The class of bounded lattice morphisms: preserving meet, join, top and bottom","status":"ok"},"long":{"text":"A bounded lattice morphism f : X ⇾ Y between bounded lattices preserves the finite meets and the finite joins, the empty ones included: f(x ⊓ y) = f x ⊓ f y, f ⊤ = ⊤, f(x ⊔ y) = f x ⊔ f y and f ⊥ = ⊥. The record contains the bounded lattice structures of both sides, a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Morphism]] and a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Morphism]]. Each of the last two is a [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]] on the meet or join view of the lattices.\n\nThe arrangement is the same as for [[AffineConstructive.interfaces.abstract_algebra.Lattice_Morphism]]: the domain structure is a coercion, and the codomain structure is recovered by a hint from a morphism hypothesis. The order-reversing version is [[AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Flip_Morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_latmor_a","base":"bounded_latmor_a","kind":"proj","short":{"text":"The bounded lattice structure of the domain of a bounded lattice morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_latmor_b","base":"bounded_latmor_b","kind":"proj","short":{"text":"The bounded lattice structure of the codomain of a bounded lattice morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_latmor_meet","base":"bounded_latmor_meet","kind":"proj","short":{"text":"A bounded lattice morphism preserves meets and top","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_latmor_join","base":"bounded_latmor_join","kind":"proj","short":{"text":"A bounded lattice morphism preserves joins and bottom","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_BoundedLattice_Morphism","base":"Build_BoundedLattice_Morphism","kind":"constr","short":{"text":"Builds a bounded lattice morphism from the two bounded lattices and its bounded meet and join morphism properties","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Flip_Morphism","base":"BoundedLattice_Flip_Morphism","kind":"def","start":225,"body":null,"status":"ok","short":{"text":"A map exchanging meets with joins and top with bottom: a bounded lattice morphism into the opposite order","status":"ok"},"long":{"text":"A bounded lattice flip morphism f : X ⇾ Y satisfies f(x ⊓ y) = f x ⊔ f y, f ⊤ = ⊥, f(x ⊔ y) = f x ⊓ f y and f ⊥ = ⊤. It is defined as a [[AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Morphism]] into Y with its order reversed ([[AffineConstructive.interfaces.relation_notation.order_op]]), and so it inherits the whole theory of bounded lattice morphisms.\n\nThe main example is a complement operation, which satisfies De Morgan's laws in both directions. Taking the complement of a subset is such a map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup_Morphism","base":"AdditiveSemiGroup_Morphism","kind":"def","start":229,"body":null,"status":"ok","short":{"text":"A map between additive semigroups preserving addition: f (x + y) = f x + f y","status":"ok"},"long":{"text":"A function f : X ⇾ Y is an additive semigroup morphism when X and Y are semigroups under + and f (x + y) = f x + f y. It is the [[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]] class read through the additive views [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]] of X and Y, so the generic semigroup theory applies to it unchanged.\n\nThe comparison X ⊗ Y ⇾ X × Y of the tensor and cartesian products is an example ([[AffineConstructive.theory.product_algebras.tensor_to_prod_add_sg_mor]]). [[AffineConstructive.theory.additive_groups.preserves_plus]] states the law in additive notation, and between additive groups such a map is already an additive monoid morphism ([[AffineConstructive.theory.additive_groups.add_group_mor]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism","base":"AdditiveMonoid_Morphism","kind":"def","start":230,"body":null,"status":"ok","short":{"text":"A map preserving addition and zero: a monoid morphism for + and 0","status":"ok"},"long":{"text":"A function f : X ⇾ Y is an additive monoid morphism when X and Y are monoids under + and 0, f(x + y) = f x + f y and f 0 = 0. It is the [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]] class at the additive view [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]]. A hint lets a goal stated as a monoid morphism on the additive views be solved by this class. It is the additive half of [[AffineConstructive.interfaces.abstract_algebra.Rg_Morphism]] and [[AffineConstructive.interfaces.abstract_algebra.Rig_Morphism]]. For additive groups, preservation of negation follows from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup_Morphism","base":"MultiplicativeSemiGroup_Morphism","kind":"def","start":231,"body":null,"status":"ok","short":{"text":"A map preserving multiplication: a semigroup morphism for ·","status":"ok"},"long":{"text":"A function f : X ⇾ Y is a multiplicative semigroup morphism when X and Y are semigroups under multiplication and f(x · y) = f x · f y. It is the [[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]] class at the multiplicative view [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]]. It is the multiplicative half of [[AffineConstructive.interfaces.abstract_algebra.Rg_Morphism]], the morphisms of structures without a unit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid_Morphism","base":"MultiplicativeMonoid_Morphism","kind":"def","start":232,"body":null,"status":"ok","short":{"text":"A map preserving multiplication and one: a monoid morphism for · and 1","status":"ok"},"long":{"text":"A function f : X ⇾ Y is a multiplicative monoid morphism when X and Y are monoids under · and 1, f(x · y) = f x · f y and f 1 = 1. It is the [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]] class at the multiplicative view [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]]. It is the multiplicative half of [[AffineConstructive.interfaces.abstract_algebra.Rig_Morphism]], the unital ring morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Rg_Morphism","base":"Rg_Morphism","kind":"rec","start":237,"body":null,"status":"ok","short":{"text":"The class of rg morphisms: maps preserving addition, zero and multiplication","status":"ok"},"long":{"text":"An rg morphism f : X ⇾ Y preserves the additive monoid structure and the multiplication: f(x + y) = f x + f y, f 0 = 0 and f(x · y) = f x · f y. The record has two parts, an [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] and a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup_Morphism]]. Through these it also contains the semigroup and monoid structures of the two sides.\n\nThese are the morphisms of the non-unital structures ([[AffineConstructive.interfaces.abstract_algebra.Rg]], [[AffineConstructive.interfaces.abstract_algebra.Rng]] and their near versions), where preserving 1 is not required. Zero is required to be preserved because a monoid morphism preserves its unit. With a unit on both sides, [[AffineConstructive.interfaces.abstract_algebra.Rig_Morphism]] also requires f 1 = 1.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.rgmor_plus_mor","base":"rgmor_plus_mor","kind":"proj","short":{"text":"An rg morphism preserves addition and zero","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.rgmor_mult_mor","base":"rgmor_mult_mor","kind":"proj","short":{"text":"An rg morphism preserves multiplication","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Rg_Morphism","base":"Build_Rg_Morphism","kind":"constr","short":{"text":"Builds an rg morphism from an additive monoid morphism that is also a multiplicative semigroup morphism","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Rig_Morphism","base":"Rig_Morphism","kind":"rec","start":239,"body":null,"status":"ok","short":{"text":"A rig morphism: a map preserving +, 0, · and 1","status":"ok"},"long":{"text":"A rig morphism f : X ⇾ Y preserves both monoid structures: f (x + y) = f x + f y, f 0 = 0, f (x · y) = f x · f y and f 1 = 1. The record is an [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] together with a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid_Morphism]]. No separate class is defined for ring morphisms: between near-rings, preservation of addition, multiplication and one already makes a rig morphism ([[AffineConstructive.theory.rings.Build_Ring_Morphism]]).\n\nThe canonical maps out of the naturals into any near-rig ([[AffineConstructive.theory.naturals.naturals_to_mon_rig_mor]]) and out of the integers into any near-ring ([[AffineConstructive.theory.integers.integers_to_near_ring_mor]]) are rig morphisms. The bundled [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism_t]] builds on the class.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.rigmor_plus_mor","base":"rigmor_plus_mor","kind":"proj","short":{"text":"The additive monoid morphism underlying a rig morphism: f preserves + and 0","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.rigmor_mult_mor","base":"rigmor_mult_mor","kind":"proj","short":{"text":"The multiplicative monoid morphism underlying a rig morphism: f preserves · and 1","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Rig_Morphism","base":"Build_Rig_Morphism","kind":"constr","short":{"text":"Builds a rig morphism from an additive and a multiplicative monoid morphism","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.common_props":{"page":"common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.interfaces.algebra_notation":{"page":"algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.set_lambda":{"page":"set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

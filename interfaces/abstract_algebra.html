ive.interfaces.abstract_algebra","name":"StarSemiGroup_Morphism","kind":"class","local":true},{"s":22789,"e":22808,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StarMonoid_Morphism","kind":"class","local":true},{"s":22836,"e":22843,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"sgmor_b","kind":"proj","local":true},{"s":22768,"e":22775,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"sgmor_b","kind":"proj","local":true},{"s":22700,"e":22707,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"sgmor_b","kind":"proj","local":true},{"s":22632,"e":22639,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"sgmor_b","kind":"proj","local":true},{"s":22902,"e":22908,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Monoid","kind":"class","local":true},{"s":22942,"e":22957,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Monoid_Morphism","kind":"class","local":true},{"s":23008,"e":23027,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StarMonoid_Morphism","kind":"class","local":true},{"s":23052,"e":23060,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"monmor_b","kind":"proj","local":true},{"s":22986,"e":22994,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"monmor_b","kind":"proj","local":true},{"s":23119,"e":23132,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StarSemiGroup","kind":"class","local":true},{"s":23166,"e":23188,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StarSemiGroup_Morphism","kind":"class","local":true},{"s":23235,"e":23254,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StarMonoid_Morphism","kind":"class","local":true},{"s":23282,"e":23290,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"ssgmor_b","kind":"proj","local":true},{"s":23213,"e":23221,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"ssgmor_b","kind":"proj","local":true},{"s":23349,"e":23359,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StarMonoid","kind":"class","local":true},{"s":23393,"e":23412,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"StarMonoid_Morphism","kind":"class","local":true},{"s":23437,"e":23446,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"smonmor_b","kind":"proj","local":true},{"s":23505,"e":23512,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Lattice","kind":"class","local":true},{"s":23546,"e":23562,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Lattice_Morphism","kind":"class","local":true},{"s":23587,"e":23595,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"latmor_b","kind":"proj","local":true},{"s":23654,"e":23668,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"BoundedLattice","kind":"class","local":true},{"s":23702,"e":23725,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"BoundedLattice_Morphism","kind":"class","local":true},{"s":23750,"e":23766,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"bounded_latmor_b","kind":"proj","local":true}],"gloss":{"summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings.","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","items":[{"name":"AffineConstructive.interfaces.abstract_algebra.SemiGroup","base":"SemiGroup","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"A semigroup: the binary operation ∙ of X is associative","status":"ok"},"long":{"text":"A set X with an operation ∙ is a semigroup when ∙ is associative; the class is nothing more than [[AffineConstructive.interfaces.common_props.Associative]] for [[AffineConstructive.interfaces.algebra_notation.sg_op]], declared as a class of its own so that the hierarchy can name it. As with every operation in the development, ∙ is a function out of the tensor X ⊗ X, so it preserves equality and, dually, reflects apartness in the multiplicative sense: if x ∙ y is apart from x' ∙ y', then x is apart from x' or y from y' in the par sense.\n\nEvery other group-like and ring-like structure of the file starts from this one: monoids, groups and semilattices directly, the additive and multiplicative parts of rings through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]] and [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]], and meet and join semilattices through [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]] and [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.CommutativeSemiGroup","base":"CommutativeSemiGroup","kind":"rec","start":8,"body":null,"status":"ok","short":{"text":"A commutative semigroup: an associative and commutative operation","status":"ok"},"long":{"text":"A semigroup whose operation is also [[AffineConstructive.interfaces.common_props.Commutative]]. It is the shape taken by addition in an [[AffineConstructive.interfaces.abstract_algebra.Rg]] and the base of [[AffineConstructive.interfaces.abstract_algebra.SemiLattice]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.comsg_sg","base":"comsg_sg","kind":"proj","short":{"text":"The semigroup underlying a commutative semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.comsg_com","base":"comsg_com","kind":"proj","short":{"text":"The commutativity of the operation of a commutative semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_CommutativeSemiGroup","base":"Build_CommutativeSemiGroup","kind":"constr","short":{"text":"Builds a commutative semigroup from a semigroup and commutativity of its operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.SemiLattice","base":"SemiLattice","kind":"rec","start":10,"body":null,"status":"ok","short":{"text":"A semilattice: a commutative semigroup whose operation is idempotent, x ∙ x = x","status":"ok"},"long":{"text":"A semilattice is a [[AffineConstructive.interfaces.abstract_algebra.CommutativeSemiGroup]] whose operation also satisfies x ∙ x = x ([[AffineConstructive.interfaces.common_props.BinaryIdempotent]]). This is the algebraic form of a semilattice, stated for the generic operation ∙ so that one class serves every reading of it.\n\nThe order-theoretic semilattices are this class under a renaming of the operation: [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]] reads ∙ as ⊓ and [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice]] reads it as ⊔. [[AffineConstructive.interfaces.abstract_algebra.BoundedSemiLattice]] adds a unit that is an identity, the top or bottom element in those readings.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.semilattice_sg","base":"semilattice_sg","kind":"proj","short":{"text":"The commutative semigroup underlying a semilattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.semilattice_idempotent","base":"semilattice_idempotent","kind":"proj","short":{"text":"The idempotence x ∙ x = x of a semilattice's operation","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_SemiLattice","base":"Build_SemiLattice","kind":"constr","short":{"text":"Builds a semilattice from a commutative semigroup and idempotence of its operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Monoid","base":"Monoid","kind":"rec","start":12,"body":null,"status":"ok","short":{"text":"A monoid: a semigroup whose unit is a two-sided identity","status":"ok"},"long":{"text":"A semigroup together with a distinguished element, the unit [[AffineConstructive.interfaces.algebra_notation.mon_unit]], that is a left and a right identity for ∙. Both identity laws are asked for, since the operation need not be commutative.\n\nThrough the operation records of the notation file the same class describes additive monoids (unit 0), multiplicative monoids (unit 1) and bounded semilattices (unit ⊤ or ⊥).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.monoid_semigroup","base":"monoid_semigroup","kind":"proj","short":{"text":"The semigroup underlying a monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.monoid_left_id","base":"monoid_left_id","kind":"proj","short":{"text":"The left identity law e ∙ x = x of a monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.monoid_right_id","base":"monoid_right_id","kind":"proj","short":{"text":"The right identity law x ∙ e = x of a monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Monoid","base":"Build_Monoid","kind":"constr","short":{"text":"Builds a monoid from a semigroup and the two identity laws for its unit","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.CommutativeMonoid","base":"CommutativeMonoid","kind":"rec","start":14,"body":null,"status":"ok","short":{"text":"A commutative monoid: a monoid whose operation is commutative","status":"ok"},"long":{"text":"A monoid whose operation is [[AffineConstructive.interfaces.common_props.Commutative]]. It is the additive structure of an [[AffineConstructive.interfaces.abstract_algebra.Rg]] (as [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]]) and the multiplicative structure of a [[AffineConstructive.interfaces.abstract_algebra.CommutativeRig]] (as [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeComMonoid]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.commonoid_monoid","base":"commonoid_monoid","kind":"proj","short":{"text":"The monoid underlying a commutative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.commonoid_com","base":"commonoid_com","kind":"proj","short":{"text":"The commutativity of the operation of a commutative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_CommutativeMonoid","base":"Build_CommutativeMonoid","kind":"constr","short":{"text":"Builds a commutative monoid from a monoid and commutativity of its operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedSemiLattice","base":"BoundedSemiLattice","kind":"rec","start":16,"body":null,"status":"ok","short":{"text":"A bounded semilattice: a semilattice whose unit is an identity for the operation","status":"ok"},"long":{"text":"A semilattice that is also a commutative monoid for the same operation, so that the unit is the identity for ∙. Read as meets the unit is the top element, read as joins the bottom; [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]] and [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice]] are these two readings.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_semilattice_sl","base":"bounded_semilattice_sl","kind":"proj","short":{"text":"The semilattice underlying a bounded semilattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_semilattice_common","base":"bounded_semilattice_common","kind":"proj","short":{"text":"The commutative monoid underlying a bounded semilattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_BoundedSemiLattice","base":"Build_BoundedSemiLattice","kind":"constr","short":{"text":"Builds a bounded semilattice from a semilattice and a commutative monoid on the same operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.StarSemiGroup","base":"StarSemiGroup","kind":"rec","start":18,"body":null,"status":"ok","short":{"text":"A star semigroup: a semigroup with an involution x ↦ x⁻¹ that reverses products","status":"ok"},"long":{"text":"A star semigroup is a semigroup with an operation x ↦ x⁻¹ (written x* in the star notation) that satisfies two laws. The operation is an involution, (x⁻¹)⁻¹ = x ([[AffineConstructive.interfaces.common_props.Involutive]]), and it reverses products, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ ([[AffineConstructive.interfaces.common_props.AntiDistribute]]). This is the usual semigroup with involution. The involution is not required to give inverses for the operation.\n\nThe only lemma concluding the class directly concerns subobjects: a sub-star-semigroup with the restricted structure is a star semigroup ([[AffineConstructive.theory.subgroups.sub_star_semigroup_star_semigroup]]). The concrete examples reach the class through [[AffineConstructive.interfaces.abstract_algebra.StarMonoid]]. Every group is one, with its inversion ([[AffineConstructive.theory.groups.group_star_mon]]), and so are the relations on a set, with composition and the converse ([[AffineConstructive.orders.subset_relations.compose_rel_star_monoid]]). theory.groups proves the laws that follow, such as x⁻¹ = y if and only if x = y⁻¹ ([[AffineConstructive.theory.groups.flip_inv]]). [[AffineConstructive.interfaces.abstract_algebra.StarMonoid]], [[AffineConstructive.interfaces.abstract_algebra.StarSemiGroup_Morphism]] and [[AffineConstructive.interfaces.subalgebra.SubStarSemiGroup]] build on the class.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.star_sg_sg","base":"star_sg_sg","kind":"proj","short":{"text":"The semigroup underlying a star semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.inv_involutive","base":"inv_involutive","kind":"proj","short":{"text":"The involution law (x⁻¹)⁻¹ = x of a star semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.inv_anti_distr","base":"inv_anti_distr","kind":"proj","short":{"text":"The product-reversal law (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ of a star semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_StarSemiGroup","base":"Build_StarSemiGroup","kind":"constr","short":{"text":"Builds a star semigroup from a semigroup, involutivity and product reversal","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.StarMonoid","base":"StarMonoid","kind":"rec","start":20,"body":null,"status":"ok","short":{"text":"A star monoid: a monoid that is a star semigroup for the same operation","status":"ok"},"long":{"text":"A star monoid is a [[AffineConstructive.interfaces.abstract_algebra.Monoid]] that is also a [[AffineConstructive.interfaces.abstract_algebra.StarSemiGroup]] for the same operation, so it carries an involution that reverses products. The record joins the two structures and adds no axiom of its own.\n\nThe examples are groups and relations. Every group is a star monoid, with its inversion as the involution ([[AffineConstructive.theory.groups.group_star_mon]]). The relations on a set X form a star monoid under composition, with the identity relation as unit and the converse as involution ([[AffineConstructive.orders.subset_relations.compose_rel_star_monoid]]). A sub-star-monoid with the restricted structure is again one ([[AffineConstructive.theory.subgroups.sub_star_monoid_star_monoid]]). In a star monoid the involution fixes the unit, e⁻¹ = e ([[AffineConstructive.theory.groups.inv_unit]]), and it is a monoid morphism into the opposite monoid ([[AffineConstructive.theory.groups.inv_mon_mor]]). [[AffineConstructive.interfaces.abstract_algebra.StarMonoid_Morphism]] and [[AffineConstructive.interfaces.subalgebra.SubStarMonoid]] build on the class.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.star_mon_star_sg","base":"star_mon_star_sg","kind":"proj","short":{"text":"The star semigroup underlying a star monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.star_mon_mon","base":"star_mon_mon","kind":"proj","short":{"text":"The monoid underlying a star monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_StarMonoid","base":"Build_StarMonoid","kind":"constr","short":{"text":"Builds a star monoid from a star semigroup and a monoid on the same operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Group","base":"Group","kind":"rec","start":23,"body":null,"status":"ok","short":{"text":"A group: a monoid in which x⁻¹ is a two-sided inverse of x","status":"ok"},"long":{"text":"A monoid with an inversion x ↦ x⁻¹ satisfying x⁻¹ ∙ x = e and x ∙ x⁻¹ = e. Because the inversion is a morphism of sets it preserves equality and, by the contrapositive carried by every affine implication, reflects apartness: x⁻¹ apart from y⁻¹ gives x apart from y.\n\nRead additively through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]] it is the additive group of a ring ([[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]], [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.group_monoid","base":"group_monoid","kind":"proj","short":{"text":"The monoid underlying a group","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.inverse_l","base":"inverse_l","kind":"proj","short":{"text":"The left inverse law x⁻¹ ∙ x = e of a group","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.inverse_r","base":"inverse_r","kind":"proj","short":{"text":"The right inverse law x ∙ x⁻¹ = e of a group","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Group","base":"Build_Group","kind":"constr","short":{"text":"Builds a group from a monoid and the two inverse laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.AbGroup","base":"AbGroup","kind":"rec","start":25,"body":null,"status":"ok","short":{"text":"An abelian group: a group whose operation is commutative","status":"ok"},"long":{"text":"A group whose operation is [[AffineConstructive.interfaces.common_props.Commutative]]. Its additive reading, [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]], is the additive structure of an [[AffineConstructive.interfaces.abstract_algebra.Rng]] and of a ring.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.abgroup_group","base":"abgroup_group","kind":"proj","short":{"text":"The group underlying an abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.abgroup_com","base":"abgroup_com","kind":"proj","short":{"text":"The commutativity of the operation of an abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_AbGroup","base":"Build_AbGroup","kind":"constr","short":{"text":"Builds an abelian group from a group and commutativity of its operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.StrongOpSemiGroup","base":"StrongOpSemiGroup","kind":"rec","start":42,"body":null,"status":"ok","short":{"text":"A semigroup whose operation is strong: it also preserves the cartesian equality of X × X","status":"ok"},"long":{"text":"The operation of a semigroup is a function out of the tensor X ⊗ X, so it preserves the multiplicative equality: x = x' ⊠ y = y' implies x ∙ y = x' ∙ y'. A strong-operation semigroup asks more, [[AffineConstructive.interfaces.set.StrongOp]]: the operation preserves the additive equality of X × X as well. Read contrapositively, if x ∙ y is apart from x' ∙ y', then x is apart from x' or y is apart from y', with the additive or, so the apartness of the products determines which factor differs.\n\nIts one source in the development is [[AffineConstructive.theory.groups.strong_op_mon_strong_op_sg]]: a monoid with strong operation ([[AffineConstructive.interfaces.abstract_algebra.StrongOpMonoid]]) is a semigroup with strong operation.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.strong_op_sg_sg","base":"strong_op_sg_sg","kind":"proj","short":{"text":"The semigroup underlying a strong-operation semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.strong_sg_op","base":"strong_sg_op","kind":"proj","short":{"text":"The strength of the operation of a strong-operation semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_StrongOpSemiGroup","base":"Build_StrongOpSemiGroup","kind":"constr","short":{"text":"Builds a strong-operation semigroup from a semigroup and the strength of its operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.StrongOpMonoid","base":"StrongOpMonoid","kind":"rec","start":44,"body":null,"status":"ok","short":{"text":"A monoid whose operation is strong: it also respects the cartesian equality of X × X","status":"ok"},"long":{"text":"The monoid counterpart of [[AffineConstructive.interfaces.abstract_algebra.StrongOpSemiGroup]]: a monoid whose operation is [[AffineConstructive.interfaces.set.StrongOp]], so that apartness of products splits, with the additive or, into apartness of one of the factors.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.strong_op_mon_mon","base":"strong_op_mon_mon","kind":"proj","short":{"text":"The monoid underlying a strong-operation monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.strong_op_mon_str","base":"strong_op_mon_str","kind":"proj","short":{"text":"The strength of the operation of a strong-operation monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_StrongOpMonoid","base":"Build_StrongOpMonoid","kind":"constr","short":{"text":"Builds a strong-operation monoid from a monoid and strength of its operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice","base":"MeetSemiLattice","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"A meet semilattice: ⊓ is associative, commutative and idempotent","status":"ok"},"long":{"text":"A meet semilattice is a [[AffineConstructive.interfaces.abstract_algebra.SemiLattice]] read through [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]], with ⊓ as the operation. Its laws say that meet is associative, commutative and idempotent. theory.lattices restates the three laws for meets as [[AffineConstructive.theory.lattices.meet_ass]], [[AffineConstructive.theory.lattices.meet_com]] and [[AffineConstructive.theory.lattices.meet_idm]].\n\nThe examples are of three kinds. A bounded meet semilattice is one ([[AffineConstructive.theory.lattices.bounded_meet_sl_is_sl]]). A meet semilattice order, an order with binary meets, gives an algebraic meet semilattice ([[AffineConstructive.orders.lattices.meet_sl_order_meet_sl]]). A join semilattice on L is a meet semilattice on the opposite order L ᵒᵖ ([[AffineConstructive.theory.lattices.MeetSemiLattice_op]]). Products, !X and the pointwise meet on D ⇾ X preserve the class. [[AffineConstructive.interfaces.abstract_algebra.Lattice]] pairs it with a join semilattice and the two absorption laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice","base":"BoundedMeetSemiLattice","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"A bounded meet semilattice: L is a semilattice under ⊓ with ⊤ as identity","status":"ok"},"long":{"text":"The structure [[AffineConstructive.interfaces.abstract_algebra.BoundedSemiLattice]] read through [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]]: meet is associative, commutative and idempotent, and ⊤ ⊓ x = x. The top element is the unit of the meet monoid.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice","base":"JoinSemiLattice","kind":"def","start":53,"body":null,"status":"ok","short":{"text":"A join semilattice: L is a semilattice under ⊔","status":"ok"},"long":{"text":"The semilattice structure of [[AffineConstructive.interfaces.abstract_algebra.SemiLattice]] read through [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]], with ⊔ as the operation: join is associative, commutative and idempotent. It is the dual of [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]], obtained by the same instantiation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice","base":"BoundedJoinSemiLattice","kind":"def","start":54,"body":null,"status":"ok","short":{"text":"A bounded join semilattice: L is a semilattice under ⊔ with ⊥ as identity","status":"ok"},"long":{"text":"The structure [[AffineConstructive.interfaces.abstract_algebra.BoundedSemiLattice]] read through [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]]: join is associative, commutative and idempotent, and ⊥ ⊔ x = x. The bottom element is the unit of the join monoid.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Lattice","base":"Lattice","kind":"rec","start":59,"body":null,"status":"ok","short":{"text":"A lattice: meet and join semilattices on L linked by the two absorption laws","status":"ok"},"long":{"text":"A set with a meet and a join, each a semilattice operation, satisfying the absorption laws x ⊔ (x ⊓ y) = x and x ⊓ (x ⊔ y) = x. This is the algebraic definition of a lattice; the absorption laws are what make the order determined by ⊓ agree with the one determined by ⊔.\n\nThe absorption laws are kept as ordinary fields, not coercions, and made available to instance resolution by hints, so that rewriting with them is found automatically.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.lattice_join","base":"lattice_join","kind":"proj","short":{"text":"The join semilattice underlying a lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.lattice_meet","base":"lattice_meet","kind":"proj","short":{"text":"The meet semilattice underlying a lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.join_meet_absorption","base":"join_meet_absorption","kind":"proj","short":{"text":"The absorption law x ⊔ (x ⊓ y) = x of a lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.meet_join_absorption","base":"meet_join_absorption","kind":"proj","short":{"text":"The absorption law x ⊓ (x ⊔ y) = x of a lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Lattice","base":"Build_Lattice","kind":"constr","short":{"text":"Builds a lattice from join and meet semilattices and the two absorption laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.DistributiveLattice","base":"DistributiveLattice","kind":"rec","start":61,"body":null,"status":"ok","short":{"text":"A distributive lattice: each of ⊔ and ⊓ distributes over the other on the left","status":"ok"},"long":{"text":"A lattice in which x ⊔ (y ⊓ z) = (x ⊔ y) ⊓ (x ⊔ z) and x ⊓ (y ⊔ z) = (x ⊓ y) ⊔ (x ⊓ z). Classically either law implies the other; both are asked for here, which avoids proving the equivalence at the interface and keeps the definition self-dual. Right distributivity follows from commutativity.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.distr_lattice_lattice","base":"distr_lattice_lattice","kind":"proj","short":{"text":"The lattice underlying a distributive lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.join_meet_distr_l","base":"join_meet_distr_l","kind":"proj","short":{"text":"The law x ⊔ (y ⊓ z) = (x ⊔ y) ⊓ (x ⊔ z) of a distributive lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.meet_join_distr_l","base":"meet_join_distr_l","kind":"proj","short":{"text":"The law x ⊓ (y ⊔ z) = (x ⊓ y) ⊔ (x ⊓ z) of a distributive lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_DistributiveLattice","base":"Build_DistributiveLattice","kind":"constr","short":{"text":"Builds a distributive lattice from a lattice and the two left distributive laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedLattice","base":"BoundedLattice","kind":"rec","start":63,"body":null,"status":"ok","short":{"text":"A bounded lattice: a lattice with top and bottom as identities for meet and join","status":"ok"},"long":{"text":"A lattice whose meet semilattice is bounded by ⊤ and whose join semilattice is bounded by ⊥, that is, a [[AffineConstructive.interfaces.abstract_algebra.Lattice]] that is at once a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]] and a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice]] on the same operations.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_lattice_lattice","base":"bounded_lattice_lattice","kind":"proj","short":{"text":"The lattice underlying a bounded lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_lattice_meet","base":"bounded_lattice_meet","kind":"proj","short":{"text":"The bounded meet semilattice of a bounded lattice, with ⊤ as identity","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_lattice_join","base":"bounded_lattice_join","kind":"proj","short":{"text":"The bounded join semilattice of a bounded lattice, with ⊥ as identity","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_BoundedLattice","base":"Build_BoundedLattice","kind":"constr","short":{"text":"Builds a bounded lattice from a lattice and its bounded meet and join semilattices","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.BoundedDistributiveLattice","base":"BoundedDistributiveLattice","kind":"rec","start":65,"body":null,"status":"ok","short":{"text":"A bounded distributive lattice: a distributive lattice with ⊤ and ⊥ as identities of ⊓ and ⊔","status":"ok"},"long":{"text":"A bounded distributive lattice is a lattice that is both a [[AffineConstructive.interfaces.abstract_algebra.DistributiveLattice]] and a [[AffineConstructive.interfaces.abstract_algebra.BoundedLattice]]: join and meet distribute over each other, ⊤ is an identity for meet and ⊥ an identity for join.\n\nThe instance in the development is Ω itself ([[AffineConstructive.theory.lattices.AProp_lattice]]): the affine propositions under the additive connectives ∧ and ∨, with 𝐓 as top and 𝐅 as bottom. [[AffineConstructive.theory.lattices.alt_Build_BoundedDistributiveLattice]] builds the structure from a bounded lattice in which join distributes over meet, the other distributive law following.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_distr_lattice_distr","base":"bounded_distr_lattice_distr","kind":"proj","short":{"text":"The distributive lattice underlying a bounded distributive lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.bounded_distr_lattice_bounded","base":"bounded_distr_lattice_bounded","kind":"proj","short":{"text":"The bounded lattice underlying a bounded distributive lattice","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_BoundedDistributiveLattice","base":"Build_BoundedDistributiveLattice","kind":"constr","short":{"text":"Builds a bounded distributive lattice from a distributive lattice and a bounded lattice","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveNonComSemiGroup","base":"AdditiveNonComSemiGroup","kind":"def","start":79,"body":null,"status":"ok","short":{"text":"An additive semigroup: + is associative, not necessarily commutative","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.SemiGroup]] read through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]], with + as the operation. Addition is associative, and commutativity is not assumed. theory.additive_groups states the law as [[AffineConstructive.theory.additive_groups.plus_ass]].\n\nThe lemmas concluding it pass down from richer additive structure. A commutative additive semigroup is one ([[AffineConstructive.theory.additive_groups.additive_sg_nc_sg]]), and so is an additive monoid, commutative or not ([[AffineConstructive.theory.additive_groups.additive_nc_mon_sg]]). Subobjects give two more: the ambient set of an additive subsemigroup is one ([[AffineConstructive.interfaces.subalgebra.AdditiveSubSemiGroup_sg]]), and so is the subsemigroup itself with the restricted addition ([[AffineConstructive.theory.subrings.sub_add_semigroup_semigroup]]). The maps that preserve addition, such as the product projections ([[AffineConstructive.theory.product_algebras.prod_proj1_add_sg_mor]]), assume the class of their source and target.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid","base":"AdditiveNonComMonoid","kind":"def","start":80,"body":null,"status":"ok","short":{"text":"R is a monoid under + with identity 0, not necessarily commutative","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.Monoid]] read through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]]: addition is associative and 0 is a two-sided identity. It is the additive structure of a [[AffineConstructive.interfaces.abstract_algebra.NearRg]], where addition need not commute.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup","base":"AdditiveNonComGroup","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"R is a group under + with identity 0 and negation −, not necessarily commutative","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.Group]] read through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]]: addition is associative, 0 is its identity and −x is a two-sided additive inverse of x. It is the additive structure of a [[AffineConstructive.interfaces.abstract_algebra.NearRng]]; in a near-ring the additive group need not be abelian.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup","base":"AdditiveSemiGroup","kind":"def","start":82,"body":null,"status":"ok","short":{"text":"R is a commutative semigroup under +","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.CommutativeSemiGroup]] read through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]]: addition is associative and commutative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid","base":"AdditiveMonoid","kind":"def","start":83,"body":null,"status":"ok","short":{"text":"R is a commutative monoid under + with identity 0","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.CommutativeMonoid]] read through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]]: addition is associative and commutative with 0 as identity. It is the additive structure of an [[AffineConstructive.interfaces.abstract_algebra.Rg]] and of every rig and ring.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveGroup","base":"AdditiveGroup","kind":"def","start":84,"body":null,"status":"ok","short":{"text":"R is an abelian group under + with identity 0 and negation −","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.AbGroup]] read through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]]: addition is associative and commutative, 0 is its identity and −x the additive inverse of x. It is the additive structure of an [[AffineConstructive.interfaces.abstract_algebra.Rng]] and of a ring.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup","base":"MultiplicativeSemiGroup","kind":"def","start":85,"body":null,"status":"ok","short":{"text":"R is a semigroup under ·","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.SemiGroup]] read through [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]]: multiplication is associative. It is the multiplicative structure of an [[AffineConstructive.interfaces.abstract_algebra.Rg]], where there need be no 1.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid","base":"MultiplicativeMonoid","kind":"def","start":86,"body":null,"status":"ok","short":{"text":"R is a monoid under · with identity 1","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.Monoid]] read through [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]]: multiplication is associative and 1 is a two-sided identity. Adding it to an rg or near-rg gives a rig or near-rig.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.MultiplicativeComMonoid","base":"MultiplicativeComMonoid","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"R is a commutative monoid under · with identity 1","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.CommutativeMonoid]] read through [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]]: multiplication is associative and commutative with identity 1. It is what a [[AffineConstructive.interfaces.abstract_algebra.CommutativeRig]] adds to a [[AffineConstructive.interfaces.abstract_algebra.Rig]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.AdditiveCancellation","base":"AdditiveCancellation","kind":"rec","start":97,"body":null,"status":"ok","short":{"text":"Additive cancellation: the translations x ↦ z + x and x ↦ x + z are injective","status":"ok"},"long":{"text":"The class stating that, for every z, the translations x ↦ z + x and x ↦ x + z are [[AffineConstructive.interfaces.set.Injective]]: z + x = z + y implies x = y, and likewise on the right. Injectivity is an affine implication and carries its contrapositive, so cancellation also says that translation preserves apartness: x ≠ y implies z + x ≠ z + y.\n\nIn an additive group it follows from the inverse laws ([[AffineConstructive.theory.additive_groups.add_group_cancel]]); the naturals have it without inverses ([[AffineConstructive.theory.naturals.naturals_add_cancel]]). [[AffineConstructive.theory.group_completion.group_completion_nontrivial]] assumes it, to carry 1 ≠ 0 from a cancellative monoid to its group completion.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.add_cancel_l","base":"add_cancel_l","kind":"proj","short":{"text":"Left cancellation: each translation x ↦ z + x is injective","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.add_cancel_r","base":"add_cancel_r","kind":"proj","short":{"text":"Right cancellation: each translation x ↦ x + z is injective","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_AdditiveCancellation","base":"Build_AdditiveCancellation","kind":"constr","short":{"text":"Builds additive cancellation from injectivity of the left and right translations","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.NonZeroMultiplicativeCancellation","base":"NonZeroMultiplicativeCancellation","kind":"rec","start":98,"body":null,"status":"ok","short":{"text":"Multiplication by an element apart from 0 cancels on both sides","status":"ok"},"long":{"text":"The class stating that for every z with z ≠ 0, multiplication by z on the left and on the right is [[AffineConstructive.interfaces.set.Injective]]. The hypothesis z ≠ 0 is affirmed, so in a strong set it is apartness from zero, the constructive notion of a nonzero element. Injectivity carries its contrapositive: multiplication by such a z also preserves apartness.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.mult_cancel_l","base":"mult_cancel_l","kind":"proj","short":{"text":"Left multiplication by z ≠ 0 is injective","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.mult_cancel_r","base":"mult_cancel_r","kind":"proj","short":{"text":"Right multiplication by z ≠ 0 is injective","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_NonZeroMultiplicativeCancellation","base":"Build_NonZeroMultiplicativeCancellation","kind":"constr","short":{"text":"Builds multiplicative cancellation from injectivity of multiplication by each z ≠ 0 on both sides","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.NearRg","base":"NearRg","kind":"rec","start":99,"body":null,"status":"ok","short":{"text":"A right near-rg: additive monoid, multiplicative semigroup, right distributivity and 0 · x = 0","status":"ok"},"long":{"text":"The weakest ring-like structure of the hierarchy: addition is a monoid with identity 0 (not necessarily commutative), multiplication is a semigroup, multiplication distributes over addition on the right, (x + y) · z = x · z + y · z, and 0 is left absorbing, 0 · x = 0. With only one distributive law the absorption of 0 does not follow and is asked for explicitly.\n\nThe name follows the usual hierarchy: an rg is a ring without unit and without negatives, and a near-structure has one distributive law. [[AffineConstructive.interfaces.abstract_algebra.LeftNearRg]] is the mirror image, and an [[AffineConstructive.interfaces.abstract_algebra.Rg]] is both.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.near_rg_plus_monoid","base":"near_rg_plus_monoid","kind":"proj","short":{"text":"The additive monoid of a near-rg","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.near_rg_mult_semigroup","base":"near_rg_mult_semigroup","kind":"proj","short":{"text":"The multiplicative semigroup of a near-rg","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.plus_mult_distr_r","base":"plus_mult_distr_r","kind":"proj","short":{"text":"The right distributive law (x + y) · z = x · z + y · z","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.mult_0_l","base":"mult_0_l","kind":"proj","short":{"text":"Zero is left absorbing: 0 · x = 0","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_NearRg","base":"Build_NearRg","kind":"constr","short":{"text":"Builds a near-rg from its additive monoid, multiplicative semigroup, right distributivity and 0 · x = 0","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.LeftNearRg","base":"LeftNearRg","kind":"rec","start":101,"body":null,"status":"ok","short":{"text":"A left near-rg: additive monoid, multiplicative semigroup, left distributivity and x · 0 = 0","status":"ok"},"long":{"text":"The mirror image of [[AffineConstructive.interfaces.abstract_algebra.NearRg]]: addition is a monoid with identity 0, multiplication a semigroup, multiplication distributes over addition on the left, z · (x + y) = z · x + z · y, and 0 is right absorbing, x · 0 = 0.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.lnear_rg_plus_monoid","base":"lnear_rg_plus_monoid","kind":"proj","short":{"text":"The additive monoid of a left near-rg","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.lnear_rg_mult_semigroup","base":"lnear_rg_mult_semigroup","kind":"proj","short":{"text":"The multiplicative semigroup of a left near-rg","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.plus_mult_distr_l","base":"plus_mult_distr_l","kind":"proj","short":{"text":"The left distributive law z · (x + y) = z · x + z · y","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.mult_0_r","base":"mult_0_r","kind":"proj","short":{"text":"Zero is right absorbing: x · 0 = 0","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_LeftNearRg","base":"Build_LeftNearRg","kind":"constr","short":{"text":"Builds a left near-rg from its additive monoid, multiplicative semigroup, left distributivity and x · 0 = 0","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Rg","base":"Rg","kind":"rec","start":103,"body":null,"status":"ok","short":{"text":"An rg: a semiring without 1, with commutative addition and both distributive laws","status":"ok"},"long":{"text":"A ring without unit and without negatives: addition is a commutative monoid with identity 0, multiplication an associative operation, multiplication distributes over addition on both sides and 0 absorbs on both sides. It is assembled as a [[AffineConstructive.interfaces.abstract_algebra.NearRg]] and a [[AffineConstructive.interfaces.abstract_algebra.LeftNearRg]] on the same operations together with commutativity of addition.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.rg_near_rg","base":"rg_near_rg","kind":"proj","short":{"text":"The right near-rg underlying an rg","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.rg_lnear_rg","base":"rg_lnear_rg","kind":"proj","short":{"text":"The left near-rg underlying an rg","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.rg_plus_monoid","base":"rg_plus_monoid","kind":"proj","short":{"text":"The commutative additive monoid of an rg","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Rg","base":"Build_Rg","kind":"constr","short":{"text":"Builds an rg from right and left near-rg structures and a commutative additive monoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.NearRig","base":"NearRig","kind":"rec","start":105,"body":null,"status":"ok","short":{"text":"A right near-rig: a right near-rg whose multiplication has an identity 1","status":"ok"},"long":{"text":"A [[AffineConstructive.interfaces.abstract_algebra.NearRg]] whose multiplication is a monoid with identity 1: one-sided distributivity and absorption, with a multiplicative unit.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.near_rig_near_rg","base":"near_rig_near_rg","kind":"proj","short":{"text":"The right near-rg underlying a near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.near_rig_multmon","base":"near_rig_multmon","kind":"proj","short":{"text":"The multiplicative monoid of a near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_NearRig","base":"Build_NearRig","kind":"constr","short":{"text":"Builds a near-rig from a near-rg and a multiplicative monoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.LeftNearRig","base":"LeftNearRig","kind":"rec","start":107,"body":null,"status":"ok","short":{"text":"A left near-rig: a left near-rg whose multiplication has an identity 1","status":"ok"},"long":{"text":"The mirror image of [[AffineConstructive.interfaces.abstract_algebra.NearRig]]: a [[AffineConstructive.interfaces.abstract_algebra.LeftNearRg]] whose multiplication is a monoid with identity 1.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.lnear_rig_lnear_rg","base":"lnear_rig_lnear_rg","kind":"proj","short":{"text":"The left near-rg underlying a left near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.lnear_rig_multmon","base":"lnear_rig_multmon","kind":"proj","short":{"text":"The multiplicative monoid of a left near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_LeftNearRig","base":"Build_LeftNearRig","kind":"constr","short":{"text":"Builds a left near-rig from a left near-rg and a multiplicative monoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Rig","base":"Rig","kind":"rec","start":109,"body":null,"status":"ok","short":{"text":"A rig: a ring without negatives, with a multiplicative unit 1","status":"ok"},"long":{"text":"A rig is a ring without negatives: an [[AffineConstructive.interfaces.abstract_algebra.Rg]] whose multiplication is a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid]] with identity 1. Addition is a commutative monoid, multiplication distributes over it on both sides, and 0 absorbs on both sides. Every rig is a right and a left near-rig ([[AffineConstructive.theory.rings.Rig_NearRig]], [[AffineConstructive.theory.rings.Rig_LeftNearRig]]).\n\nThe example concluding the class is the additive endomorphisms of a commutative additive monoid: they form a rig under pointwise addition and composition ([[AffineConstructive.theory.nat_action.Additive_Monoid_EndFun_Rig]]). The opposite, !X, subobjects and injective images preserve the class, and theory.rings builds rigs from their laws ([[AffineConstructive.theory.rings.alt_Build_Rig]]). [[AffineConstructive.interfaces.abstract_algebra.CommutativeRig]] and [[AffineConstructive.interfaces.abstract_algebra.Ring]] build on it, and [[AffineConstructive.interfaces.bundled_algebra.rig]] is the bundled form.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.rig_rg","base":"rig_rg","kind":"proj","short":{"text":"The rg underlying a rig","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.rig_multmon","base":"rig_multmon","kind":"proj","short":{"text":"The multiplicative monoid of a rig","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Rig","base":"Build_Rig","kind":"constr","short":{"text":"Builds a rig from an rg and a multiplicative monoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.CommutativeRig","base":"CommutativeRig","kind":"rec","start":111,"body":null,"status":"ok","short":{"text":"A commutative rig: a rig whose multiplication is commutative","status":"ok"},"long":{"text":"A [[AffineConstructive.interfaces.abstract_algebra.Rig]] whose multiplicative monoid is commutative ([[AffineConstructive.interfaces.abstract_algebra.MultiplicativeComMonoid]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.comrig_rig","base":"comrig_rig","kind":"proj","short":{"text":"The rig underlying a commutative rig","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.comrig_multcommon","base":"comrig_multcommon","kind":"proj","short":{"text":"The commutative multiplicative monoid of a commutative rig","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_CommutativeRig","base":"Build_CommutativeRig","kind":"constr","short":{"text":"Builds a commutative rig from a rig and a commutative multiplicative monoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.NearRng","base":"NearRng","kind":"rec","start":113,"body":null,"status":"ok","short":{"text":"A right near-rng: a right near-rg whose addition is a group, not necessarily abelian","status":"ok"},"long":{"text":"A [[AffineConstructive.interfaces.abstract_algebra.NearRg]] whose additive monoid is a group with negation − ([[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]]). This is the classical notion of a near-ring without unit: one distributive law and an additive group that need not be commutative.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.near_rng_near_rg","base":"near_rng_near_rg","kind":"proj","short":{"text":"The right near-rg underlying a near-rng","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.near_rngplus_group","base":"near_rngplus_group","kind":"proj","short":{"text":"The additive group of a near-rng","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_NearRng","base":"Build_NearRng","kind":"constr","short":{"text":"Builds a near-rng from a near-rg and an additive group","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.LeftNearRng","base":"LeftNearRng","kind":"rec","start":115,"body":null,"status":"ok","short":{"text":"A left near-rng: a left near-rg whose addition is a (not necessarily commutative) group","status":"ok"},"long":{"text":"A left near-rng on a set R with addition, multiplication, zero and negation is a [[AffineConstructive.interfaces.abstract_algebra.LeftNearRg]] (an additive monoid, a multiplicative semigroup, multiplication distributing over addition on the left, and zero absorbing on the right) whose addition is moreover a group, [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]]. Addition is not required to be commutative, which is the usual setting of near-rings, and there is no multiplicative unit.\n\nIt is the mirror image of [[AffineConstructive.interfaces.abstract_algebra.NearRng]], with the one-sided distributive and absorption laws on the other side, and it serves as the additive half of [[AffineConstructive.interfaces.abstract_algebra.LeftNearRing]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.lnear_rng_lnear_rg","base":"lnear_rng_lnear_rg","kind":"proj","short":{"text":"The left near-rg underlying a left near-rng","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.lnear_rngplus_group","base":"lnear_rngplus_group","kind":"proj","short":{"text":"The additive group of a left near-rng","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_LeftNearRng","base":"Build_LeftNearRng","kind":"constr","short":{"text":"Builds a left near-rng from a left near-rg and an additive group structure","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Rng","base":"Rng","kind":"rec","start":117,"body":null,"status":"ok","short":{"text":"A rng: a ring without unit, an rg whose addition is an abelian group","status":"ok"},"long":{"text":"A rng on a set R is an [[AffineConstructive.interfaces.abstract_algebra.Rg]] (an additive commutative monoid and a multiplicative semigroup, with multiplication distributing over addition on both sides and zero absorbing on both sides) whose addition is an abelian group, [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]]. No multiplicative unit is asked for.\n\nWith [[AffineConstructive.interfaces.abstract_algebra.Rig]] it is one of the two halves of [[AffineConstructive.interfaces.abstract_algebra.Ring]]: a ring is exactly a rng that is also a rig.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.rng_rg","base":"rng_rg","kind":"proj","short":{"text":"The rg underlying a rng","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.rngplus_abgroup","base":"rngplus_abgroup","kind":"proj","short":{"text":"The additive abelian group of a rng","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Rng","base":"Build_Rng","kind":"constr","short":{"text":"Builds a rng from an rg and an additive abelian group structure","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.NearRing","base":"NearRing","kind":"rec","start":119,"body":null,"status":"ok","short":{"text":"A right near-ring with identity: both a near-rng and a near-rig","status":"ok"},"long":{"text":"A near-ring is at once a [[AffineConstructive.interfaces.abstract_algebra.NearRng]] and a [[AffineConstructive.interfaces.abstract_algebra.NearRig]]. Its addition is a group that need not be commutative, and its multiplication is a monoid with unit 1. Multiplication distributes over addition on the right, and 0 absorbs on the left. This is the notion of a right near-ring with identity, and [[AffineConstructive.interfaces.abstract_algebra.LeftNearRing]] is its mirror image.\n\nThe example that motivates the class is the endomorphisms X ⇾ X of an additive group, not necessarily commutative. They form a near-ring under pointwise addition and composition ([[AffineConstructive.theory.int_action.EndFun_NearRing]]). Every ring is a near-ring ([[AffineConstructive.theory.rings.Ring_NearRing]]). The opposite of a left near-ring is a near-ring ([[AffineConstructive.theory.rings.LeftNearRing_op]]), and a sub-near-ring with the restricted operations is one ([[AffineConstructive.theory.subrings.sub_near_ring_near_ring]]). In a near-ring, −x = (−1) · x ([[AffineConstructive.theory.rings.negate_mult]]). [[AffineConstructive.interfaces.subalgebra.SubNearRing]] and the bundled [[AffineConstructive.interfaces.bundled_algebra.near_ring]] build on the class.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.near_ring_near_rng","base":"near_ring_near_rng","kind":"proj","short":{"text":"The near-rng underlying a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.near_ring_near_rig","base":"near_ring_near_rig","kind":"proj","short":{"text":"The near-rig underlying a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_NearRing","base":"Build_NearRing","kind":"constr","short":{"text":"Builds a near-ring from a near-rng and a near-rig","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.LeftNearRing","base":"LeftNearRing","kind":"rec","start":121,"body":null,"status":"ok","short":{"text":"A left near-ring: a left near-rng that is also a left near-rig","status":"ok"},"long":{"text":"A left near-ring is the mirror image of [[AffineConstructive.interfaces.abstract_algebra.NearRing]]: a [[AffineConstructive.interfaces.abstract_algebra.LeftNearRng]] (additive group, multiplication distributing over addition on the left, zero absorbing on the right) that is also a [[AffineConstructive.interfaces.abstract_algebra.LeftNearRig]] (multiplication a monoid with unit 1). Addition need not be commutative.\n\nAs with the other ring-like records, it is assembled from its two halves so that either is available on its own.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.lnear_ring_lnear_rng","base":"lnear_ring_lnear_rng","kind":"proj","short":{"text":"The left near-rng underlying a left near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.lnear_ring_lnear_rig","base":"lnear_ring_lnear_rig","kind":"proj","short":{"text":"The left near-rig underlying a left near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_LeftNearRing","base":"Build_LeftNearRing","kind":"constr","short":{"text":"Builds a left near-ring from a left near-rng and a left near-rig","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.Ring","base":"Ring","kind":"rec","start":123,"body":null,"status":"ok","short":{"text":"A ring (with unit): a rng that is also a rig","status":"ok"},"long":{"text":"A ring on a set R with addition, multiplication, zero, one and negation is a [[AffineConstructive.interfaces.abstract_algebra.Rng]], so an abelian additive group with an associative multiplication distributing on both sides, that is also a [[AffineConstructive.interfaces.abstract_algebra.Rig]], so its multiplication has a unit. Commutativity of multiplication is not assumed.\n\nThe record is the meet of its two halves in the hierarchy: everything proved for rngs (which use negation) and for rigs (which use the unit) applies to a ring through its two projections.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.ring_rng","base":"ring_rng","kind":"proj","short":{"text":"The rng underlying a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.ring_rig","base":"ring_rig","kind":"proj","short":{"text":"The rig underlying a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_Ring","base":"Build_Ring","kind":"constr","short":{"text":"Builds a ring from a rng and a rig","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.CommutativeRing","base":"CommutativeRing","kind":"rec","start":125,"body":null,"status":"ok","short":{"text":"A commutative ring: a ring whose multiplication is commutative","status":"ok"},"long":{"text":"A commutative ring is a [[AffineConstructive.interfaces.abstract_algebra.Ring]] that is also a [[AffineConstructive.interfaces.abstract_algebra.CommutativeRig]]: a ring whose multiplicative monoid is commutative. Commutativity then makes either distributive law, and either absorption law of 0, follow from the other.\n\nA concrete example is ℤ₂, with exclusive or as addition and boolean and as multiplication ([[AffineConstructive.implementations.z2.ℤ₂_is_comring]]); completing a commutative strong rig gives another ([[AffineConstructive.theory.group_completion.group_completion_is_com_ring]]). [[AffineConstructive.interfaces.abstract_algebra.IntegralDomain]] builds on the class, and [[AffineConstructive.interfaces.bundled_algebra.commutative_ring]] bundles a set with it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.comring_ring","base":"comring_ring","kind":"proj","short":{"text":"The ring underlying a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.comring_comrig","base":"comring_comrig","kind":"proj","short":{"text":"The commutative rig underlying a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_CommutativeRing","base":"Build_CommutativeRing","kind":"constr","short":{"text":"Builds a commutative ring from a ring and a commutative rig on the same operations","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.OneNonZero","base":"OneNonZero","kind":"ind","start":127,"body":null,"status":"ok","short":{"text":"The class stating that 1 ≠ 0 in R","status":"ok"},"long":{"text":"The class of sets with a zero and a one in which 1 ≠ 0, stated as the negation of the affine proposition 1 = 0. When the equality of R is strong, so that inequality is apartness, this says that 1 is apart from 0, a positive statement and stronger constructively than the mere impossibility of 1 = 0. It is the nontriviality axiom of [[AffineConstructive.interfaces.abstract_algebra.IntegralDomain]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.OneNonZero","base":"OneNonZero","kind":"rec","short":{"text":"The class stating that 1 ≠ 0 in R","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.one_nonzero","base":"one_nonzero","kind":"proj","short":{"text":"In a nontrivial ring, 1 ≠ 0","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.NoZeroDivisors","base":"NoZeroDivisors","kind":"ind","start":128,"body":null,"status":"ok","short":{"text":"No zero divisors: x · y = 0 implies x = 0 ⊞ y = 0","status":"ok"},"long":{"text":"The class of multiplications on R without zero divisors, in affine form: for all x and y, x · y = 0 implies x = 0 ⊞ y = 0. The disjunction is the par, not the additive or. The implication carries its contrapositive, and the dual of a par is the tensor of the duals. So the same statement says that x ≠ 0 ⊠ y ≠ 0 implies x · y ≠ 0: a product of two elements apart from zero is apart from zero.\n\nThree lemmas conclude it. The strong form [[AffineConstructive.interfaces.abstract_algebra.StrongNoZeroDivisors]], with the additive or, implies it ([[AffineConstructive.theory.rings.strong_no_zero_divisors_no_zero_divisors]]). In an rg, cancellation by elements apart from 0 implies it ([[AffineConstructive.theory.rings.mult_cancel_no_zero_divisors]]). A rig with a strong linear refutative order has no zero divisors ([[AffineConstructive.orders.rings.StrongLinearRefutativeRigOrder_NoZeroDivisors]]). Conversely, without zero divisors, multiplication by an element apart from 0 is injective ([[AffineConstructive.theory.rings.no_zero_divisors_mult_cancel]]). With decidable equality the class gives the strong form ([[AffineConstructive.theory.rings.dec_strong_no_zero_divisors]]). It is an axiom of [[AffineConstructive.interfaces.abstract_algebra.IntegralDomain]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.NoZeroDivisors","base":"NoZeroDivisors","kind":"rec","short":{"text":"The class of multiplications without zero divisors, in the par form","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.no_zero_divisors","base":"no_zero_divisors","kind":"proj","short":{"text":"The law x · y = 0 implies x = 0 ⊞ y = 0 of a ring without zero divisors","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.StrongNoZeroDivisors","base":"StrongNoZeroDivisors","kind":"ind","start":129,"body":null,"status":"ok","short":{"text":"No zero divisors in the strong form: x · y = 0 implies x = 0 ∨ y = 0","status":"ok"},"long":{"text":"The strong form of [[AffineConstructive.interfaces.abstract_algebra.NoZeroDivisors]], with the additive or in place of the par: x · y = 0 implies x = 0 ∨ y = 0, so a vanishing product determines a factor that vanishes. The difference shows in the contrapositives. The par form says x ≠ 0 ⊠ y ≠ 0 implies x · y ≠ 0; the strong form says x ≠ 0 ∧ y ≠ 0 implies x · y ≠ 0, with the additive and, a hypothesis of which only one conjunct may be used, so the conclusion is reached from less.\n\nThe strong form implies the par form ([[AffineConstructive.theory.rings.strong_no_zero_divisors_no_zero_divisors]]), and with decidable equality the converse holds ([[AffineConstructive.theory.rings.dec_strong_no_zero_divisors]]). The integers have it ([[AffineConstructive.theory.integers.integers_strong_no_zero_divisors]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.StrongNoZeroDivisors","base":"StrongNoZeroDivisors","kind":"rec","short":{"text":"The class of multiplications without zero divisors in the strong, additive-or form","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.strong_no_zero_divisors","base":"strong_no_zero_divisors","kind":"proj","short":{"text":"The law x · y = 0 implies x = 0 ∨ y = 0","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.IntegralDomain","base":"IntegralDomain","kind":"rec","start":130,"body":null,"status":"ok","short":{"text":"An integral domain: a commutative ring with 1 ≠ 0 and no zero divisors","status":"ok"},"long":{"text":"An integral domain is a [[AffineConstructive.interfaces.abstract_algebra.CommutativeRing]] that also satisfies [[AffineConstructive.interfaces.abstract_algebra.OneNonZero]] and [[AffineConstructive.interfaces.abstract_algebra.NoZeroDivisors]]. The first condition is the affine negation of 1 = 0, that is, 1 ≠ 0. The second says that x · y = 0 implies x = 0 ⊞ y = 0. The connective is par, not the additive or. Since an affine implication carries its contrapositive, and the dual of a par is a tensor, the same condition also says that x ≠ 0 and y ≠ 0 together imply x · y ≠ 0. A product of elements unequal to zero is unequal to zero.\n\nThe stronger condition with the additive or, x · y = 0 ⊸ x = 0 ∨ y = 0, is kept separate as [[AffineConstructive.interfaces.abstract_algebra.StrongNoZeroDivisors]]. It is not part of the structure, so an integral domain commits only to the multiplicative form of the condition.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.abstract_algebra.intdom_comring","base":"intdom_comring","kind":"proj","short":{"text":"The commutative ring underlying an integral domain","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.intdom_nontrivial","base":"intdom_nontrivial","kind":"proj","short":{"text":"The condition 1 ≠ 0 of an integral domain","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.intdom_no_zero_divisors","base":"intdom_no_zero_divisors","kind":"proj","short":{"text":"The no-zero-divisors condition of an integral domain: x · y = 0 implies x = 0 ⊞ y = 0","status":"ok"}},{"name":"AffineConstructive.interfaces.abstract_algebra.Build_IntegralDomain","base":"Build_IntegralDomain","kind":"constr","short":{"text":"Builds an integral domain from a commutative ring, 1 ≠ 0 and the absence of zero divisors","status":"ok"}}]},{"name":"AffineConstructive.interfaces.abstract_algebra.aPointed_Morphism","base":"aPointed_Morphism","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"The affine proposition f x = y, as a function of x, y and f","status":"ok"},"long":{"text":"The affine predicate that a function f : X ⇾ Y sends the point x to the point y, that is, f x = y, defined as a function of sets in all three arguments, into Ω. Because it is a morphism of sets, it respects equality in x, y and f, which lets the rewriting system rewrite inside it.\n\nIts affirmation is the class [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]], and the specialisations to units, tops, bottoms, zeros and ones are built on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism","base":"Pointed_Morphism","kind":"def","start":161,"body":null,"status":"ok","short":{"text":"The class of functions f with f x = y: maps of pointed sets from (X, x) to (Y, y)","status":"ok"},"long":{"text":"The class stating that f : X ⇾ Y sends the distinguished point x to y, that is, f x = y holds; it is the affirmation of [[AffineConstructive.interfaces.abstract_algebra.aPointed_Morphism]], unfolded. It is the common root of the classes saying that a map preserves a constant: [[AffineConstructive.interfaces.abstract_algebra.MonUnit_Pointed_Morphism]], [[AffineConstructive.interfaces.abstract_algebra.Zero_Pointed_Morphism]], [[AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism]], [[AffineConstructive.interfaces.abstract_algebra.Top_Pointed_Morphism]], [[AffineConstructive.interfaces.abstract_algebra.Bottom_Pointed_Morphism]]. Treating all of these as one class lets the facts about preservation of a point be proved once.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.preserves_point","base":"preserves_point","kind":"def","start":163,"body":null,"status":"ok","short":{"text":"A pointed morphism f from (X, x) to (Y, y) satisfies f x = y","status":"ok"},"long":{"text":"The accessor of [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]]: from the class, found by resolution, it yields the equation f x = y. The specialised accessors [[AffineConstructive.interfaces.abstract_algebra.preserves_unit]], [[AffineConstructive.interfaces.abstract_algebra.preserves_0]], [[AffineConstructive.interfaces.abstract_algebra.preserves_1]], [[AffineConstructive.interfaces.abstract_algebra.preserves_top]] and [[AffineConstructive.interfaces.abstract_algebra.preserves_bottom]] are all this one at particular points.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism_fun","base":"Pointed_Morphism_fun","kind":"def","start":164,"body":null,"status":"ok","short":{"text":"The class of pointed morphisms packaged as a function of x, y and f for rewriting","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] presented as a function of sets from !X ⊗ !Y ⊗ !(X ⇾ Y) to the set of base-logic propositions, its respect for equality obtained from [[AffineConstructive.interfaces.abstract_algebra.aPointed_Morphism]] through [[AffineConstructive.interfaces.common_props.weaken_apred3]], and its uncurried form through [[AffineConstructive.interfaces.prelude.eval_tuncurry3]]. This is the form the rewriting system needs in order to rewrite the point, the target point or the function inside a hypothesis or goal of the shape Pointed_Morphism x y f.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.MonUnit_Pointed_Morphism","base":"MonUnit_Pointed_Morphism","kind":"def","start":165,"body":null,"status":"ok","short":{"text":"The class of functions preserving the monoid unit: f e = e","status":"ok"},"long":{"text":"The class of functions f : X ⇾ Y between sets with monoid units that send the unit of X to the unit of Y, defined as [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at the two units. It is the unit half of [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]]; through the generic operation sets it also covers additive zeros and multiplicative ones, and meets with top, joins with bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Top_Pointed_Morphism","base":"Top_Pointed_Morphism","kind":"def","start":166,"body":null,"status":"ok","short":{"text":"The class of functions preserving top: f ⊤ = ⊤","status":"ok"},"long":{"text":"The class of functions between sets with a top element that send top to top, defined as [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at ⊤ and ⊤. It names the top-preservation condition of bounded meet-semilattice and lattice morphisms in order-theoretic terms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Bottom_Pointed_Morphism","base":"Bottom_Pointed_Morphism","kind":"def","start":167,"body":null,"status":"ok","short":{"text":"The class of functions preserving bottom: f ⊥ = ⊥","status":"ok"},"long":{"text":"The class of functions between sets with a bottom element that send bottom to bottom, defined as [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at ⊥ and ⊥; the bottom-preservation condition of bounded join-semilattice morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Zero_Pointed_Morphism","base":"Zero_Pointed_Morphism","kind":"def","start":168,"body":null,"status":"ok","short":{"text":"The class of functions preserving zero: f 0 = 0","status":"ok"},"long":{"text":"The class of functions between sets with a zero that send 0 to 0, defined as [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at the two zeros. It is the unit condition of an additive monoid morphism, read in additive notation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism","base":"One_Pointed_Morphism","kind":"def","start":169,"body":null,"status":"ok","short":{"text":"The class of functions preserving one: f 1 = 1","status":"ok"},"long":{"text":"The class of functions between sets with a one that send 1 to 1, defined as [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at the two ones. It is the unit condition of a multiplicative monoid morphism, and hence of a rig or ring morphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.preserves_unit","base":"preserves_unit","kind":"def","start":175,"body":null,"status":"ok","short":{"text":"A unit-preserving function f satisfies f e = e","status":"ok"},"long":{"text":"The accessor of [[AffineConstructive.interfaces.abstract_algebra.MonUnit_Pointed_Morphism]]: the equation f e = e for the monoid units of the source and target. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_point]] at the units.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.preserves_top","base":"preserves_top","kind":"def","start":176,"body":null,"status":"ok","short":{"text":"A top-preserving function f satisfies f ⊤ = ⊤","status":"ok"},"long":{"text":"The accessor of [[AffineConstructive.interfaces.abstract_algebra.Top_Pointed_Morphism]]: the equation f ⊤ = ⊤. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_point]] at the tops.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.preserves_bottom","base":"preserves_bottom","kind":"def","start":177,"body":null,"status":"ok","short":{"text":"A bottom-preserving function f satisfies f ⊥ = ⊥","status":"ok"},"long":{"text":"The accessor of [[AffineConstructive.interfaces.abstract_algebra.Bottom_Pointed_Morphism]]: the equation f ⊥ = ⊥. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_point]] at the bottoms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.preserves_0","base":"preserves_0","kind":"def","start":178,"body":null,"status":"ok","short":{"text":"A zero-preserving function f satisfies f 0 = 0","status":"ok"},"long":{"text":"The accessor of [[AffineConstructive.interfaces.abstract_algebra.Zero_Pointed_Morphism]]: the equation f 0 = 0. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_point]] at the zeros.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.preserves_1","base":"preserves_1","kind":"def","start":179,"body":null,"status":"ok","short":{"text":"A one-preserving function f satisfies f 1 = 1","status":"ok"},"long":{"text":"The accessor of [[AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism]]: the equation f 1 = 1. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_point]] at the ones.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.MonUnit_Pointed_Morphism_fun","base":"MonUnit_Pointed_Morphism_fun","kind":"def","start":180,"body":null,"status":"ok","short":{"text":"The class of unit-preserving functions, registered for rewriting through Pointed_Morphism_fun","status":"ok"},"long":{"text":"Registers [[AffineConstructive.interfaces.abstract_algebra.MonUnit_Pointed_Morphism]] as an instance of the packaged predicate [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism_fun]], so that the rewriting system recognises a goal or hypothesis stating that f preserves the unit as a pointed-morphism statement and can rewrite f inside it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.abstract_algebra.Top_Pointed_Morphism_fun","base":"Top_Pointed_Morphism_fun","kind":"def","start":181,"body":null,"status":"ok","short":{"text":"The class of top-preserving functions, registered for rewriting through Pointed_Morphism_fun","status":"ok"},"long":{"text":"Registers [[AffineConstructive.interfaces.abstract_algebra.Top_Pointed_Morphism]] as an instance of the packaged predicate [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism_fun]], so that statements that f preserves top can be rewritten in f like any pointed-morphism statement.","status":"

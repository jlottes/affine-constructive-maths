e.interfaces.algebra_notation","name":"Top","kind":"class","local":true}],"gloss":{"summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[AffineConstructive.interfaces.algebra_notation.semigroup_op]]), the opposite ring ([[AffineConstructive.interfaces.algebra_notation.ring_op]]) and the opposite order ([[AffineConstructive.interfaces.algebra_notation.Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one.","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","items":[{"name":"AffineConstructive.interfaces.algebra_notation.MonUnit","base":"MonUnit","kind":"ind","start":5,"body":null,"status":"ok","short":{"text":"The class of a distinguished unit element of a set, for a generic monoid","status":"ok"},"long":{"text":"A choice of element of a set M, intended as the unit of a monoid whose operation is a [[AffineConstructive.interfaces.algebra_notation.SgOp]]. It is the generic unit that the semigroup and monoid theory is stated with. The concrete units ([[AffineConstructive.interfaces.algebra_notation.Zero]], [[AffineConstructive.interfaces.algebra_notation.One]], [[AffineConstructive.interfaces.algebra_notation.Top]], [[AffineConstructive.interfaces.algebra_notation.Bottom]]) are separate classes, and the reinterpretations [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]], [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]], [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]] and [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]] let any of them serve as this unit. A set carries at most one such structure at a time, so the unit of a set is determined by the set and its declared structure.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.MonUnit","base":"MonUnit","kind":"rec","short":{"text":"The structure of a monoid unit on a set M","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.mon_unit","base":"mon_unit","kind":"proj","short":{"text":"The unit element of a set with a monoid unit","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Zero","base":"Zero","kind":"ind","start":7,"body":null,"status":"ok","short":{"text":"The class of a zero element 0 of a set","status":"ok"},"long":{"text":"A distinguished element 0 of a set X, the unit of an addition [[AffineConstructive.interfaces.algebra_notation.Plus]]. It is only a constant: the laws it satisfies are imposed by the algebraic structures (additive monoids, groups, rings) that require it. Through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]] it is the generic monoid unit [[AffineConstructive.interfaces.algebra_notation.mon_unit]] of the additive structure.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Zero","base":"Zero","kind":"rec","short":{"text":"The structure of a zero element on a set","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.zero","base":"zero","kind":"proj","short":{"text":"The zero 0 of a set with a zero","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.One","base":"One","kind":"ind","start":10,"body":null,"status":"ok","short":{"text":"The class of a unit element 1 of a set","status":"ok"},"long":{"text":"A distinguished element 1 of a set X, the unit of a multiplication [[AffineConstructive.interfaces.algebra_notation.Mult]]. The numerals 2, 3 and 4 are notations for the sums 1 + 1, 1 + (1 + 1) and so on, and −1 through −4 for their negations, so every numeral is a term in the ring operations rather than a separate constant. Through [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]] it is the generic monoid unit of the multiplicative structure.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.One","base":"One","kind":"rec","short":{"text":"The structure of a unit element 1 on a set","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.one","base":"one","kind":"proj","short":{"text":"The unit 1 of a set with a unit","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Top","base":"Top","kind":"ind","start":13,"body":null,"status":"ok","short":{"text":"The class of a top element ⊤ of a set","status":"ok"},"long":{"text":"A distinguished element ⊤ of a set L, intended as the greatest element of an order and the unit of the meet [[AffineConstructive.interfaces.algebra_notation.Meet]]. Through [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]] it is the monoid unit of the meet semilattice, and on the opposite order [[AffineConstructive.interfaces.algebra_notation.Order_op]] it serves as the bottom.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Top","base":"Top","kind":"rec","short":{"text":"The structure of a top element on a set","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.top","base":"top","kind":"proj","short":{"text":"The top element ⊤ of a set with a top","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Bottom","base":"Bottom","kind":"ind","start":16,"body":null,"status":"ok","short":{"text":"The class of a bottom element ⊥ of a set","status":"ok"},"long":{"text":"A distinguished element ⊥ of a set L, intended as the least element of an order and the unit of the join [[AffineConstructive.interfaces.algebra_notation.Join]]. Through [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]] it is the monoid unit of the join semilattice, and on the opposite order [[AffineConstructive.interfaces.algebra_notation.Order_op]] it serves as the top.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Bottom","base":"Bottom","kind":"rec","short":{"text":"The structure of a bottom element on a set","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.bottom","base":"bottom","kind":"proj","short":{"text":"The bottom element ⊥ of a set with a bottom","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.SgOp","base":"SgOp","kind":"ind","start":19,"body":null,"status":"ok","short":{"text":"The class of a generic binary operation x ∙ y on a set, a function G ⊗ G ⇾ G","status":"ok"},"long":{"text":"A binary operation on a set G, written x ∙ y, in terms of which semigroups, monoids and groups are developed once and for all. Like every binary operation of the file it is a function out of the tensor product G ⊗ G, whose equality is multiplicative: the operation preserves equality in the form that x = x′ tensor y = y′ implies x ∙ y = x′ ∙ y′, and dually, x ∙ y ≠ x′ ∙ y′ implies x ≠ x′ par y ≠ y′. This is the weaker of the two requirements; an operation that preserves the additive equality of G × G as well is a strong operation ([[AffineConstructive.interfaces.set.StrongOp]]), and an operation built as a function on G × G composed with the passage from G ⊗ G to G × G is recognised as strong automatically.\n\nThe concrete operations [[AffineConstructive.interfaces.algebra_notation.Plus]], [[AffineConstructive.interfaces.algebra_notation.Mult]], [[AffineConstructive.interfaces.algebra_notation.Meet]] and [[AffineConstructive.interfaces.algebra_notation.Join]] are separate classes; the reinterpretations of this file ([[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]], [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]], [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]], [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]], [[AffineConstructive.interfaces.algebra_notation.semigroup_op]]) present each of them as this generic operation so that the general theory applies.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.SgOp","base":"SgOp","kind":"rec","short":{"text":"The structure of a binary operation G ⊗ G ⇾ G on a set G","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.sg_op","base":"sg_op","kind":"proj","short":{"text":"The binary operation ∙ of a set with a semigroup operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Inv","base":"Inv","kind":"ind","start":27,"body":null,"status":"ok","short":{"text":"The class of an inversion x ↦ x⁻¹ on a set, a function G ⇾ G","status":"ok"},"long":{"text":"A unary operation on a set G, written x⁻¹, intended as the inverse of a group in the generic multiplicative notation of [[AffineConstructive.interfaces.algebra_notation.SgOp]]. Being a function of sets, it preserves equality and, dually, reflects apartness. The same operation is also available with the postfix notation x*, for uses where it is an involution rather than a group inverse. Through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]] the negation [[AffineConstructive.interfaces.algebra_notation.Negate]] serves as this inverse.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Inv","base":"Inv","kind":"rec","short":{"text":"The structure of an inversion G ⇾ G on a set G","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.inv","base":"inv","kind":"proj","short":{"text":"The inversion x ↦ x⁻¹ of a set with an inverse","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Plus","base":"Plus","kind":"ind","start":34,"body":null,"status":"ok","short":{"text":"The class of an addition x + y on a set, a function X ⊗ X ⇾ X","status":"ok"},"long":{"text":"The addition of a set X, a function out of the tensor product X ⊗ X, so that x = x′ tensor y = y′ implies x + y = x′ + y′, and an apartness x + y ≠ x′ + y′ yields x ≠ x′ par y ≠ y′. This multiplicative form of extensionality is what the affine reading of rings and groups asks of addition; the stronger form, preservation of the cartesian equality, is the separate property [[AffineConstructive.interfaces.set.StrongOp]], inferred automatically when the addition factors through X × X. Sections x + · and · + x, and subtraction x − y as x + −y, are notations on top of it. Through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]] the addition is the generic operation [[AffineConstructive.interfaces.algebra_notation.sg_op]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Plus","base":"Plus","kind":"rec","short":{"text":"The structure of an addition X ⊗ X ⇾ X on a set X","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.plus","base":"plus","kind":"proj","short":{"text":"The addition + of a set with an addition","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Mult","base":"Mult","kind":"ind","start":41,"body":null,"status":"ok","short":{"text":"The class of a multiplication x · y on a set, a function X ⊗ X ⇾ X","status":"ok"},"long":{"text":"The multiplication of a set X, a function out of the tensor product X ⊗ X, with the same multiplicative extensionality as [[AffineConstructive.interfaces.algebra_notation.Plus]]: equal factors give equal products, and apart products have apart first factors or (par) apart second factors. When it factors through the cartesian product it is recognised as strong ([[AffineConstructive.interfaces.set.StrongOp]]). Through [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]] the multiplication is the generic operation [[AffineConstructive.interfaces.algebra_notation.sg_op]], and [[AffineConstructive.interfaces.algebra_notation.ring_op]] presents it with its arguments exchanged.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Mult","base":"Mult","kind":"rec","short":{"text":"The structure of a multiplication X ⊗ X ⇾ X on a set X","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.mult","base":"mult","kind":"proj","short":{"text":"The multiplication · of a set with a multiplication","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Negate","base":"Negate","kind":"ind","start":49,"body":null,"status":"ok","short":{"text":"The class of a negation x ↦ −x on a set, a function G ⇾ G","status":"ok"},"long":{"text":"The additive inverse of a set G, written −x, a function of sets and so extensional and strongly extensional. Subtraction x − y is notation for x + −y, and the negative numerals −1 to −4 are negations of the sums of 1. Through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]] the negation is the generic inverse [[AffineConstructive.interfaces.algebra_notation.inv]] of the additive group.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Negate","base":"Negate","kind":"rec","short":{"text":"The structure of a negation G ⇾ G on a set G","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.negate","base":"negate","kind":"proj","short":{"text":"The negation x ↦ −x of a set with a negation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Meet","base":"Meet","kind":"ind","start":54,"body":null,"status":"ok","short":{"text":"The class of a meet x ⊓ y on a set, a function L ⊗ L ⇾ L","status":"ok"},"long":{"text":"The meet operation of a lattice or meet semilattice L, a function out of the tensor product L ⊗ L, extensional in the multiplicative sense like the other binary operations of the file, and recognised as strong ([[AffineConstructive.interfaces.set.StrongOp]]) when it factors through L × L. Through [[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]] it is the generic operation [[AffineConstructive.interfaces.algebra_notation.sg_op]] with [[AffineConstructive.interfaces.algebra_notation.top]] as unit, and on the opposite order [[AffineConstructive.interfaces.algebra_notation.Order_op]] it is read as the join.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Meet","base":"Meet","kind":"rec","short":{"text":"The structure of a meet L ⊗ L ⇾ L on a set L","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.meet","base":"meet","kind":"proj","short":{"text":"The meet ⊓ of a set with a meet","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.Join","base":"Join","kind":"ind","start":61,"body":null,"status":"ok","short":{"text":"The class of a join x ⊔ y on a set, a function L ⊗ L ⇾ L","status":"ok"},"long":{"text":"The join operation of a lattice or join semilattice L, a function out of the tensor product L ⊗ L, extensional in the multiplicative sense and recognised as strong ([[AffineConstructive.interfaces.set.StrongOp]]) when it factors through L × L. Through [[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]] it is the generic operation [[AffineConstructive.interfaces.algebra_notation.sg_op]] with [[AffineConstructive.interfaces.algebra_notation.bottom]] as unit, and on the opposite order [[AffineConstructive.interfaces.algebra_notation.Order_op]] it is read as the meet.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.algebra_notation.Join","base":"Join","kind":"rec","short":{"text":"The structure of a join L ⊗ L ⇾ L on a set L","status":"ok"}},{"name":"AffineConstructive.interfaces.algebra_notation.join","base":"join","kind":"proj","short":{"text":"The join ⊔ of a set with a join","status":"ok"}}]},{"name":"AffineConstructive.interfaces.algebra_notation.semigroup_op","base":"semigroup_op","kind":"def","start":76,"body":null,"status":"ok","short":{"text":"The opposite semigroup of G: the same set, its operation with the arguments exchanged","status":"ok"},"long":{"text":"The set G itself under a name that instance resolution treats as opaque, so that a different operation can be attached to it. Its [[AffineConstructive.interfaces.algebra_notation.sg_op]] is the operation of G composed with [[AffineConstructive.theory.set.tensor_swap]], so that x ∙ y here is y ∙ x in G; its unit and its inverse are those of G. The traditional notion is the opposite semigroup, monoid or group, written G ᵒᵖ.\n\nIt is used to state that each algebraic structure passes to the opposite: [[AffineConstructive.theory.groups.SemiGroup_op]], [[AffineConstructive.theory.groups.Monoid_op]], [[AffineConstructive.theory.groups.CommutativeSemiGroup_op]], [[AffineConstructive.theory.groups.SemiLattice_op]] and their companions in the groups theory, and to state that inversion in a star semigroup or star monoid reverses products, as a morphism from G to its opposite ([[AffineConstructive.theory.groups.inv_sg_mor]], [[AffineConstructive.theory.groups.inv_mon_mor]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps","base":"AdditiveGroupOps","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"X viewed as a group in the generic notation, with + as ∙, 0 as unit and − as inverse","status":"ok"},"long":{"text":"The set X itself, under a name that instance resolution does not see through, whose generic operations are the additive ones: [[AffineConstructive.interfaces.algebra_notation.sg_op]] is [[AffineConstructive.interfaces.algebra_notation.plus]], [[AffineConstructive.interfaces.algebra_notation.mon_unit]] is [[AffineConstructive.interfaces.algebra_notation.zero]] and [[AffineConstructive.interfaces.algebra_notation.inv]] is [[AffineConstructive.interfaces.algebra_notation.negate]]. Stating the additive structure of a ring or group at this name lets every theorem about generic semigroups, monoids and groups apply to addition without being restated in additive notation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps","base":"MultiplicativeGroupOps","kind":"def","start":86,"body":null,"status":"ok","short":{"text":"X viewed as a monoid in the generic notation, with · as ∙ and 1 as unit","status":"ok"},"long":{"text":"The set X itself, under an opaque name, whose generic operation [[AffineConstructive.interfaces.algebra_notation.sg_op]] is the multiplication [[AffineConstructive.interfaces.algebra_notation.mult]] and whose unit [[AffineConstructive.interfaces.algebra_notation.mon_unit]] is [[AffineConstructive.interfaces.algebra_notation.one]]. It lets the generic theory of semigroups and monoids apply to the multiplicative structure of a ring. No inverse is supplied: multiplication in a ring has none in general, and invertibility is treated where it is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.algebra_notation.ring_op","base":"ring_op","kind":"def","start":90,"body":null,"status":"ok","short":{"text":"The opposite ring of R: the same set and addition, multiplication with its arguments exchanged","status":"ok"},"long":{"text":"The set R itself under a name that instance resolution treats as opaque, so that a different multiplication can be attached to it: its [[AffineConstructive.interfaces.algebra_notation.mult]] is that of R composed with [[AffineConstructive.theory.set.tensor_swap]], while addition, zero, one and negation are those of R. The traditional notion is the opposite ring Rᵒᵖ.\n\nIt is used to state that each ring-like structure passes to the opposite, sometimes of the mirrored kind: [[AffineConstructive.theory.rings.Rg_op]] for an rg, [[AffineConstructive.theory.rings.NearRg_op]] and [[AffineConstructive.theory.rings.LeftNearRg_op]] exchanging right and left near-rgs, [[AffineConstructive.theory.rings.NoZeroDivisors_op]] for the absence of zero divisors, and the multiplicative monoid structures in [[AffineConstructive.theory.multiplicative_groups.MultiplicativeMonoid_op]]; the ordered rings build on it in the same way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps","base":"MeetSemigroupOps","kind":"def","start":97,"body":null,"status":"ok","short":{"text":"L viewed as a monoid in the generic notation, with ⊓ as ∙ and ⊤ as unit","status":"ok"},"long":{"text":"The set L itself, under an opaque name, whose generic operation [[AffineConstructive.interfaces.algebra_notation.sg_op]] is the meet [[AffineConstructive.interfaces.algebra_notation.meet]] and whose unit [[AffineConstructive.interfaces.algebra_notation.mon_unit]] is [[AffineConstructive.interfaces.algebra_notation.top]]. It lets the theory of semigroups and monoids (associativity, commutativity, units) apply to a meet semilattice.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps","base":"JoinSemigroupOps","kind":"def","start":98,"body":null,"status":"ok","short":{"text":"L viewed as a monoid in the generic notation, with ⊔ as ∙ and ⊥ as unit","status":"ok"},"long":{"text":"The set L itself, under an opaque name, whose generic operation [[AffineConstructive.interfaces.algebra_notation.sg_op]] is the join [[AffineConstructive.interfaces.algebra_notation.join]] and whose unit [[AffineConstructive.interfaces.algebra_notation.mon_unit]] is [[AffineConstructive.interfaces.algebra_notation.bottom]]. It lets the theory of semigroups and monoids apply to a join semilattice.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.algebra_notation.Order_op","base":"Order_op","kind":"def","start":105,"body":null,"status":"ok","short":{"text":"The opposite of an ordered set: same elements and equality, order reversed, meet and join exchanged","status":"ok"},"long":{"text":"The set whose carrier is the opposite type [[AffineConstructive.interfaces.relation_notation.order_op]] of the carrier of X and whose equality is that of X. On it the order is the converse of the order of X, the meet is the join of X and the join the meet, and the top is the bottom of X and the bottom the top. It is declared as the canonical set structure on the opposite type, so the opposite order X ᵒᵖ is again a set without further work.\n\nThis is the device by which duality is handled throughout the order theory: a dual notion (an ideal as a filter on the opposite order, a join semilattice as a meet semilattice on the opposite order) is defined by instantiating the direct notion at this set, and each theorem about meets or tops gives its dual about joins or bottoms.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."}},"constants":null}</script>

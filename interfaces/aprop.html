logy.unif_born.local_completion":"topology/unif_born/local_completion.html","AffineConstructive.topology.uniform.base":"topology/uniform/base.html","AffineConstructive.topology.uniform.completion":"topology/uniform/completion.html","AffineConstructive.topology.uniform.uniformly_below":"topology/uniform/uniformly_below.html","AffineConstructive.topology.uniform.basis":"topology/uniform/basis.html","AffineConstructive.topology.uniform.final":"topology/uniform/final.html","AffineConstructive.topology.uniform.product":"topology/uniform/product.html","AffineConstructive.topology.uniform.cylinder":"topology/uniform/cylinder.html","AffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.notation sprop tauto tactics.misc.\nRequire Export interfaces.aprop_kernel.\nExport sprop.notation.\n\nLocal Open Scope sprop_scope.\n\n(** The affine propositions.  At its core this is the antithesis/Chu\n    construction Chu(SProp, 𝐅) of the paper (§3, Def 3.3): a pair of an\n    affirmation [apos] and a refutation [aneg] that cannot both hold.\n\n    The [classicality] field refines the plain Chu construction: its type is\n    supplied by the kernel (interfaces/aprop_kernel.v) and constrains which\n    pairs are constructible.\n\n    - Default (constructive) kernel: [Classicality P N := 𝐓], and [AProp] is\n      exactly the Chu construction.  This model is anticlassical: undecided\n      pairs such as (𝐅,𝐅) witness refutations of internal LEM\n      (see counterexamples/).\n    - Classical kernel (classical/aprop_kernel.v, installed only by\n      scripts/classical-build.sh): [Classicality P N := P ∨ N], with an\n      SProp-level excluded-middle axiom.  Every constructible pair is then\n      decidable, and the model collapses to classical two-valued logic.\n\n    Both proof fields are SProp, hence proof-irrelevant: the kernels differ\n    only in what [Build_AProp] demands, never in how a constructed [Ω]\n    behaves.  Shared code therefore constructs [Ω] only through the\n    connective API below (which fills the field via the kernel's [_cl]\n    combinators) and thereby stays valid in both models — in particular,\n    compatible with classical mathematics.  Raw [Build_AProp] is reserved\n    for counterexamples/: anticlassical, model-specific results, excluded\n    from the classical build. *)\nRecord AProp : Type :=\n{ apos :> SProp\n; #[canonical=no] aneg : SProp\n; #[canonical=no] not_both : NotBoth apos aneg\n; #[canonical=no] classicality : Classicality apos aneg\n}.\nArguments Build_AProp {_ _} not_both classicality.\nNotation \"'Ω'\" := AProp : type_scope.\nExisting Class apos.\n\nDeclare Scope aprop_scope.\nDelimit Scope aprop_scope with Ω.\nBind Scope aprop_scope with AProp.\n\nModule props_full_notation.\n  Notation \"P ⁺\" := (apos P) (at level 1, no associativity, format \"P ⁺\") : type_scope.\n  Notation \"P ⁻\" := (aneg P) (at level 1, no associativity, format \"P ⁻\") : type_scope.\nEnd props_full_notation.\nModule props_notation.\n  Notation \"P ⁺\" := (apos P) (at level 1, no associativity, only parsing) : type_scope.\n  Notation \"P ⁻\" := (aneg P) (at level 1, no associativity, format \"P ⁻\") : type_scope.\nEnd props_notation.\nImport props_notation.\n\nDefinition apos_not_aneg {P : Ω} : P → P⁻ → False := λ p n, not_both P (conj p n).\nDefinition aneg_not_apos {P : Ω} : P⁻ → P → False := λ n p, not_both P (conj p n).\n\nLtac tautological_hook := idtac.\nLtac full_tautological :=\n  timeout 5 (repeat (tautological_hook; hnf; intuition; repeat match goal with\n  | H : ex _ |- _ => destruct H\n  | H : ∀ _ : ?A, _, x : ?A |- _ => learn constr:(H x)\n  | H : @ex ?A ?P → _, H2 : ?P ?x |- _ => specialize (H (exists P x H2))\n  | H : @ex ?A ?P → _, x : ?A |- _ =>\n    let H' := fresh \"H\" in\n    assert (P x) as H' by (try clearbody H; clear H; full_tautological);\n    specialize (H (exists P x H'))\n  | x : ?A |- @ex ?A ?P =>\n    exists x; full_tautological; fail\n  | H : apos ?P |- _ => learn constr:(apos_not_aneg H)\n  | H : aneg ?P |- _ => learn constr:(aneg_not_apos H)\n  end)).\nAbbreviation full_tautology := ltac:(normalize_proof full_tautological) (only parsing).\nLocal Abbreviation nb p n := (full_tautology : NotBoth p n) (only parsing).\n\nLocal Abbreviation tautology := full_tautology (only parsing).\n\nDefinition atrue_nb  := nb 𝐓 𝐅.\nDefinition afalse_nb := nb 𝐅 𝐓.\nDefinition anot_nb  (P : Ω) := nb P⁻ P⁺.\nDefinition aand_nb  (P Q : Ω) := nb ( P⁺ ∧ Q⁺ ) ( P⁻ ∨ Q⁻ ).\nDefinition aor_nb   (P Q : Ω) := nb ( P⁺ ∨ Q⁺ ) ( P⁻ ∧ Q⁻ ).\nDefinition aprod_nb (P Q : Ω) := nb ( P⁺ ∧ Q⁺ ) ( (P⁺ → Q⁻) ∧ (Q⁺ → P⁻) ).\nDefinition apar_nb  (P Q : Ω) := nb ( (P⁻ → Q⁺) ∧ (Q⁻ → P⁺) ) ( P⁻ ∧ Q⁻ ).\nDefinition aimpl_nb (P Q : Ω) := nb ( (P⁺ → Q⁺) ∧ (Q⁻ → P⁻) ) ( P⁺ ∧ Q⁻ ).\nDefinition of_course_nb     (P : SProp) := nb P (¬ P).\nDefinition not_of_course_nb (P : SProp) := nb (¬ P) P.\nDefinition why_not_nb       (P : Ω) := not_of_course_nb P⁻.\nDefinition all_nb `(P:A → Ω) := nb ( ∀ x, (P x)⁺ ) ( ∃ x, (P x)⁻ ).\nDefinition aex_nb `(P:A → Ω) := nb ( ∃ x, (P x)⁺ ) ( ∀ x, (P x)⁻ ).\n\nCanonical Structure atrue := Build_AProp atrue_nb atrue_cl.\nCanonical Structure afalse := Build_AProp afalse_nb afalse_cl.\nDefinition aand := λ '(P, Q) : Ω ∗ Ω, Build_AProp (aand_nb P Q) (aand_cl (classicality P) (classicality Q)).\nDefinition aor  := λ '(P, Q) : Ω ∗ Ω, Build_AProp (aor_nb P Q) (aor_cl (classicality P) (classicality Q)).\nDefinition anot (P : Ω) := Build_AProp (anot_nb P) (anot_cl (classicality P)).\nDefinition aprod := λ '(P, Q) : Ω ∗ Ω, Build_AProp (aprod_nb P Q) (aprod_cl (not_both P) (not_both Q) (classicality P) (classicality Q)).\nDefinition apar  := λ '(P, Q) : Ω ∗ Ω, Build_AProp (apar_nb  P Q) (apar_cl (not_both P) (not_both Q) (classicality P) (classicality Q)).\nDefinition aimpl := λ '(P, Q) : Ω ∗ Ω, Build_AProp (aimpl_nb P Q) (aimpl_cl (not_both P) (not_both Q) (classicality P) (classicality Q)).\nDefinition of_course (P : SProp) := Build_AProp (of_course_nb P) (of_course_cl P).\nDefinition not_of_course (P : SProp) := Build_AProp (not_of_course_nb P) (not_of_course_cl P).\nDefinition why_not (P : Ω) := Build_AProp (why_not_nb P) (not_of_course_cl P⁻).\nDefinition all `(P:A → Ω) := Build_AProp (all_nb P) (all_cl (λ x, classicality (P x))).\nDefinition aex `(P:A → Ω) := Build_AProp (aex_nb P) (aex_cl (λ x, classicality (P x))).\n\n(** Switch from [sprop_scope] to [aprop_scope] now that the connectives\n    are defined.  The [_nb] bodies above needed [sprop_scope] on top of\n    the stack for the SProp-level [∧]/[∨]/[𝐓]/[𝐅] to parse; from here on\n    we want the Ω-level versions. *)\nLocal Open Scope aprop_scope.\nGlobal Open Scope aprop_scope.\n\n(** [∧]/[∨]/[𝐓]/[𝐅] in [aprop_scope]: parse and print as the Ω-level connectives.\n    Parsing forms use [@pair Ω Ω _ _] explicitly to pin the sort instance of\n    sort-polymorphic [tprod]; printing forms use the compact [(P, Q)] notation. *)\nNotation \"'𝐓'\" := atrue : aprop_scope.\nNotation \"'𝐅'\" := afalse : aprop_scope.\nNotation \"P ∧ Q\" := (aand (P, Q)) : aprop_scope.\nNotation \"P ∨ Q\" := (aor  (P, Q)) : aprop_scope.\n\n(** Unambiguous notation specific to [Ω] *)\nNotation \"P 'ᗮ'\" := (anot P) (at level 1, left associativity) : aprop_scope.\nNotation \"P ⊠ Q\" := (aprod (P, Q)) : aprop_scope.\nNotation \"P ⊞ Q\" := (apar  (P, Q)) : aprop_scope.\nNotation \"P ⊸ Q\" := (aimpl (P, Q)) : aprop_scope.\n\nDefinition aiff := λ '(P, Q) : Ω ∗ Ω, (P ⊸ Q) ∧ (Q ⊸ P).\nNotation \"P ⧟ Q\" := (aiff (P, Q)) : aprop_scope.\n\nNotation \"∏ x .. y , P\" := (all (fun x => .. (all (fun y => P)) ..))\n  (at level 10, x binder, y binder, P at level 200) : aprop_scope.\n\nNotation \"∐ x .. y , P\" := (aex (fun x => .. (aex (fun y => P)) ..))\n  (at level 10, x binder, y binder, P at level 200) : aprop_scope.\n\nModule modality_notation.\n  Notation \"! P\" := (of_course P) (at level 75, right associativity, format \"! P\") : aprop_scope.\n  Notation \"? P\" := (why_not P) (at level 75, right associativity) : aprop_scope.\nEnd modality_notation.\nImport modality_notation.\n\n\nClass Decidable (P:Ω) : SProp := decidability : P ∨ P ᗮ.\nClass Affirmative (P:Ω) : SProp := affirmativity : P ⧟ !P.\nClass Refutative (P:Ω) : SProp := refutativity : P ⧟ ? P.\nArguments decidability P {_}.\nArguments affirmativity P {_}.\nArguments refutativity P {_}.\n\nClass DeMorganDual (P Q : Ω) : SProp := demorgan_dual : P ᗮ ⧟ Q.\nArguments demorgan_dual P {Q _}.\nGlobal Hint Mode DeMorganDual + - : typeclass_instances.\n\nSection predicates.\n  Universes u.\n  Context {A:Type@{u}}.\n\n  Definition of_course_rel (R:A → SProp) := λ p, ! (R p).\n\n  Context (R:A → Ω).\n\n  Definition complement x := (R x)ᗮ.\n  \n  Definition DecidableRelation   := ∀ p, Decidable   (R p).\n  Definition AffirmativeRelation := ∀ p, Affirmative (R p).\n  Definition RefutativeRelation  := ∀ p, Refutative  (R p).\n  Existing Class DecidableRelation.\n  Existing Class AffirmativeRelation.\n  Existing Class RefutativeRelation.\n\n  Class Subrelation (R': A → Ω) : SProp := subrelation : ∀ p, R p ⊸ R' p.\nEnd predicates.\nGlobal Hint Extern 2 (Decidable   (?R ?x)) => simple notypeclasses refine ((_ : DecidableRelation   R) x) : typeclass_instances.\nGlobal Hint Extern 2 (Affirmative (?R ?x)) => simple notypeclasses refine ((_ : AffirmativeRelation R) x) : typeclass_instances.\nGlobal Hint Extern 2 (Refutative  (?R ?x)) => simple notypeclasses refine ((_ : RefutativeRelation  R) x) : typeclass_instances.\n\nClass Dec `(R: A → Ω) := dec : A → bool.\nArguments dec {A} R {_} _.\nClass IsDec `(R: A → Ω) {d:Dec R} : SProp :=\n  dec_spec p : if dec R p then R p else (R p)ᗮ.\nArguments dec_spec {A} R {d _} _.\n\nDefinition flip@{u} {A B : Type@{u}} (R:A ∗ B → Ω) := λ '(x,y), R (y, x).\n\nSection relations.\n  Universes u.\n  Context {A:Type@{u}}.\n\n  Definition leq := of_course_rel (@seq A).\n\n  Context (R:A ∗ A → Ω).\n\n  Class Reflexive  : SProp := reflexivity x : R (x, x).\n  Class Symmetric  : SProp := symmetry x y : R (x, y) ⊸ R (y, x).\n  Class Transitive : SProp := transitivity x y z : R (x, y) ⊠ R (y, z) ⊸ R (x, z).\n  Class StronglyTr ","kind":"ltac","local":false,"page":"../tactics/misc.html"},{"s":3067,"e":3084,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":true},{"s":3163,"e":3180,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":true},{"s":3211,"e":3216,"lib":"AffineConstructive.tactics.misc","name":"learn","kind":"ltac","local":false,"page":"../tactics/misc.html"},{"s":3266,"e":3271,"lib":"AffineConstructive.tactics.misc","name":"learn","kind":"ltac","local":false,"page":"../tactics/misc.html"}],"gloss":{"summary":"The file defines Ω, the type of affine propositions: a pair of an affirmation and a refutation in SProp that cannot both hold, together with a classicality field supplied by the kernel. The field is trivial in the constructive kernel and forces decidability in the classical one. It builds the connectives from these pairs: truth and falsity, the additive ∧ and ∨, the tensor ⊠ and the par ⊞, the implication ⊸ carrying its contrapositive, the negation, ⧟, the modalities ! and ?, and the quantifiers ∏ and ∐. On top of these it defines Shulman's classes Decidable, Affirmative and Refutative, De Morgan duals, boolean decision procedures (Dec, IsDec), and the affine properties of relations. Symmetry, transitivity (with ⊠ for the multiplicative form and ∧ for the strong one), antisymmetry, totality and equivalence are each stated as an implication between affine propositions. The laws of these connectives are proved in logic/aprop.v, and the rest of the development is written in this language.","short":"Affine propositions Ω, their connectives and quantifiers, and the affine properties of relations","items":[{"name":"AffineConstructive.interfaces.aprop.AProp","base":"AProp","kind":"rec","start":4,"body":null,"status":"ok","short":{"text":"The type Ω of affine propositions: a proof and a refutation that cannot both hold","status":"ok"},"long":{"text":"An affine proposition is a pair of strict propositions: a way of proving it, [[AffineConstructive.interfaces.aprop.apos]], and a way of refuting it, [[AffineConstructive.interfaces.aprop.aneg]]. The two are subject to [[AffineConstructive.interfaces.aprop.not_both]], which says a proposition cannot be both proved and refuted. This is the antithesis (Chu) construction over the strict propositions, the interpretation of affine logic in Shulman's *Affine logic for constructive mathematics*. Each connective of affine logic acts on the pair, and the way it treats the refutation decides its character. That is why every affine statement in the development comes with a dual statement.\n\nThe fourth field, [[AffineConstructive.interfaces.aprop.classicality]], is a side condition whose type the kernel supplies ([[AffineConstructive.interfaces.aprop_kernel.Classicality]]). In the constructive kernel it is trivially true, and Ω is exactly the antithesis construction. That model is anticlassical: an undecided pair such as (𝐅, 𝐅) refutes excluded middle internally. In the classical kernel the condition requires one of the two sides to hold, and Ω collapses to two-valued logic. The proof fields are proof-irrelevant, so the two kernels differ only in which pairs can be built, never in how a built pair behaves. Shared code therefore builds affine propositions only through the connectives of this file, which fill the side condition through the kernel's combinators, and so it stays valid in both models. The raw constructor [[AffineConstructive.interfaces.aprop.Build_AProp]] is reserved for the anticlassical counterexamples.\n\nThe proof component is a coercion. An affine proposition P can therefore stand wherever a strict proposition is expected, and there it means \"P is proved\".","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.apos","base":"apos","kind":"proj","short":{"text":"The proof component of an affine proposition: what it takes to prove it","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.aneg","base":"aneg","kind":"proj","short":{"text":"The refutation component of an affine proposition: what it takes to refute it","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.not_both","base":"not_both","kind":"proj","short":{"text":"The consistency of an affine proposition: it is not both proved and refuted","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.classicality","base":"classicality","kind":"proj","short":{"text":"The kernel's side condition on an affine proposition; trivial in the constructive kernel","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.Build_AProp","base":"Build_AProp","kind":"constr","short":{"text":"Builds an affine proposition from a proof–refutation pair, its consistency and side condition","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.apos_not_aneg","base":"apos_not_aneg","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"A proof and a refutation of the same affine proposition give falsity","status":"ok"},"long":{"text":"This is the consistency field [[AffineConstructive.interfaces.aprop.not_both]] in curried form: a proof of P, followed by a refutation of P, yields 𝐅 in the base logic. Proof automation uses it to close contradictory branches, and the tactic behind [[AffineConstructive.interfaces.aprop.full_tautology]] adds it to the context for every proof component it finds.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aneg_not_apos","base":"aneg_not_apos","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"A refutation and a proof of the same affine proposition give falsity","status":"ok"},"long":{"text":"This is [[AffineConstructive.interfaces.aprop.apos_not_aneg]] with its arguments in the other order: a refutation of P, followed by a proof of P, yields 𝐅. Automation uses it the same way, keyed on a refutation in the context.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.tautological_hook","base":"tautological_hook","kind":"ltac","start":22,"body":null,"status":"ok","short":{"text":"An empty extension point that later files redefine to add steps to the base-logic tautology prover","status":"ok"},"long":{"text":"This tactic does nothing here. It is called at the start of every round of [[AffineConstructive.interfaces.aprop.full_tautological]], so a later file that has new base-logic facts to offer the prover (an unfolding, or a hypothesis worth adding) redefines this hook rather than the prover. Until it is redefined, the prover works with the logical rules alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.full_tautological","base":"full_tautological","kind":"ltac","start":23,"body":null,"status":"ok","short":{"text":"Proves a tautology of the base logic, including consistency of proof–refutation pairs, by bounded search","status":"ok"},"long":{"text":"The tactic proves goals of the base logic, propositions in SProp built from the intuitionistic connectives and quantifiers, by repeated saturation under a five-second time limit. Each round runs [[AffineConstructive.interfaces.aprop.tautological_hook]], puts the goal in head normal form, and applies the propositional decision procedure for intuitionistic logic. It then works on the quantifiers: an existential hypothesis is opened into its witness and property; a universal hypothesis is instantiated once at each variable of the right type in the context; a hypothesis whose antecedent is an existential is applied to a witness that is at hand, or to a variable for which the property can be proved by a recursive call; an existential goal is attempted with each variable in the context as the witness. Finally, from the proof of an affine proposition P the tactic records that its refutation leads to falsity, and from a refutation that the proof does, which is the consistency condition every affine proposition carries.\n\nThe search is complete for propositional tautologies and heuristic for quantified ones: witnesses come only from the context. A proof reaches for it, through the abbreviation [[AffineConstructive.interfaces.aprop.full_tautology]] that also normalises the proof term, when a goal is a plain fact of the base logic about proofs and refutations. In this file it discharges the consistency condition of every connective, that the proposed proof and refutation cannot both hold, each of which follows from the consistency of the components by propositional reasoning and, for the quantifiers, one instantiation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.full_tautology","base":"full_tautology","kind":"abbrev","start":24,"body":null,"status":"ok","short":{"text":"A proof term found by a decision procedure for intuitionistic tautologies over strict propositions","status":"ok"},"long":{"text":"The term is produced by running a bounded search for propositional tautologies in the base logic. The search unfolds, splits and instantiates hypotheses, unpacks existentials, and tries witnesses from the context. It also records that a proof and a refutation of one affine proposition are contradictory, through [[AffineConstructive.interfaces.aprop.apos_not_aneg]] and [[AffineConstructive.interfaces.aprop.aneg_not_apos]]. The result is normalised. This file uses it to discharge the consistency side condition of every connective.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.nb","base":"nb","kind":"abbrev","start":25,"body":null,"status":"ok","short":{"text":"The consistency of a proof–refutation pair p, n, proved by the tautology procedure","status":"ok"},"long":{"text":"This shorthand states the consistency condition [[AffineConstructive.interfaces.aprop_kernel.NotBoth]] for a proposed proof p and refutation n, and proves it with [[AffineConstructive.interfaces.aprop.full_tautology]]. Each connective's consistency lemma below is a single use of it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.tautology","base":"tautology","kind":"abbrev","start":26,"body":null,"status":"ok","short":{"text":"A local alias for the tautology procedure full_tautology","status":"ok"},"long":{"text":"This is a local alias for [[AffineConstructive.interfaces.aprop.full_tautology]] inside this file. It is a plain renaming and does not change the procedure.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.atrue_nb","base":"atrue_nb","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"Truth, proved by 𝐓 and refuted by 𝐅, is consistent","status":"ok"},"long":{"text":"This is the consistency condition for the pair whose proof is the true proposition and whose refutation is the false one. [[AffineConstructive.interfaces.aprop.atrue]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.afalse_nb","base":"afalse_nb","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"Falsity, proved by 𝐅 and refuted by 𝐓, is consistent","status":"ok"},"long":{"text":"This is the consistency condition for the pair whose proof is the false proposition and whose refutation is the true one. [[AffineConstructive.interfaces.aprop.afalse]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.anot_nb","base":"anot_nb","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"Swapping the proof and the refutation of an affine proposition keeps it consistent","status":"ok"},"long":{"text":"The negation of P is proved by a refutation of P and refuted by a proof of P. This lemma checks that the swapped pair is still consistent, which follows from the consistency of P. [[AffineConstructive.interfaces.aprop.anot]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aand_nb","base":"aand_nb","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"The additive conjunction is consistent: proved by both proofs, refuted by either refutation","status":"ok"},"long":{"text":"P ∧ Q is proved by a proof of P together with a proof of Q, and refuted by a refutation of one of the two. The pair is consistent because a refutation of either conjunct contradicts the corresponding proof. [[AffineConstructive.interfaces.aprop.aand]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aor_nb","base":"aor_nb","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"The additive disjunction is consistent: proved by either proof, refuted by both refutations","status":"ok"},"long":{"text":"P ∨ Q is proved by a proof of one disjunct and refuted by refutations of both. It is the dual of [[AffineConstructive.interfaces.aprop.aand_nb]]. [[AffineConstructive.interfaces.aprop.aor]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aprod_nb","base":"aprod_nb","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"The tensor is consistent: proved by both proofs, refuted by each proof turning into the other's refutation","status":"ok"},"long":{"text":"P ⊠ Q is proved as P ∧ Q is, by both proofs. It is refuted more strongly: by a function from proofs of P to refutations of Q, together with a function from proofs of Q to refutations of P. The pair is consistent because the two proofs, fed to the refutation, yield a refutation of Q alongside its proof. [[AffineConstructive.interfaces.aprop.aprod]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.apar_nb","base":"apar_nb","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"The par is consistent: proved by each refutation turning into the other's proof, refuted by both refutations","status":"ok"},"long":{"text":"P ⊞ Q is proved by a function from refutations of P to proofs of Q, together with one from refutations of Q to proofs of P. It is refuted by refutations of both. It is the dual of [[AffineConstructive.interfaces.aprop.aprod_nb]]. [[AffineConstructive.interfaces.aprop.apar]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aimpl_nb","base":"aimpl_nb","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"Affine implication is consistent: proved by a map and its contrapositive, refuted by a counterexample","status":"ok"},"long":{"text":"P ⊸ Q is proved by a function from proofs of P to proofs of Q, together with a function from refutations of Q to refutations of P (the contrapositive). It is refuted by a proof of P together with a refutation of Q. The pair is consistent because applying the forward map to the counterexample's proof of P yields a proof of Q that contradicts its refutation. [[AffineConstructive.interfaces.aprop.aimpl]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.of_course_nb","base":"of_course_nb","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"A strict proposition P, refuted by ¬P, gives a consistent pair","status":"ok"},"long":{"text":"This is the consistency of the pair proved by P and refuted by its base-logic negation. It underlies the modality of course, [[AffineConstructive.interfaces.aprop.of_course]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.not_of_course_nb","base":"not_of_course_nb","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"A strict proposition ¬P, refuted by P, gives a consistent pair","status":"ok"},"long":{"text":"This is the consistency of the pair proved by ¬P and refuted by P, the swap of [[AffineConstructive.interfaces.aprop.of_course_nb]]. It underlies [[AffineConstructive.interfaces.aprop.not_of_course]] and [[AffineConstructive.interfaces.aprop.why_not]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.why_not_nb","base":"why_not_nb","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"Why not P, proved by the impossibility of refuting P and refuted by a refutation, is consistent","status":"ok"},"long":{"text":"This is the consistency of ?P, whose proof is that P cannot be refuted and whose refutation is a refutation of P. It is the instance of [[AffineConstructive.interfaces.aprop.not_of_course_nb]] at the refutation of P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.all_nb","base":"all_nb","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"The affine universal quantifier is consistent: proved by all instances, refuted by one refuted instance","status":"ok"},"long":{"text":"∏ x, P x is proved by a proof of P x for every x, and refuted by an x together with a refutation of P x. The counterexample contradicts the proof at that x. [[AffineConstructive.interfaces.aprop.all]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aex_nb","base":"aex_nb","kind":"def","start":39,"body":null,"status":"ok","short":{"text":"The affine existential quantifier is consistent: proved by a witness, refuted by refuting every instance","status":"ok"},"long":{"text":"∐ x, P x is proved by an x together with a proof of P x, and refuted by a refutation of P x for every x. It is the dual of [[AffineConstructive.interfaces.aprop.all_nb]]. [[AffineConstructive.interfaces.aprop.aex]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.atrue","base":"atrue","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"Truth 𝐓, the affine proposition always proved and never refuted","status":"ok"},"long":{"text":"Truth is the affine proposition whose proof is the true strict proposition and whose refutation is the false one. It is the unit of the additive conjunction and of the tensor. It is declared canonical, so the proposition 𝐓 of the base logic is recognised as the proof component of this pair.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.afalse","base":"afalse","kind":"def","start":41,"body":null,"status":"ok","short":{"text":"Falsity 𝐅, the affine proposition never proved and always refuted","status":"ok"},"long":{"text":"Falsity is the dual of [[AffineConstructive.interfaces.aprop.atrue]]: its proof is the false strict proposition and its refutation the true one. It is the unit of the additive disjunction and of the par, and the negation of truth.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aand","base":"aand","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"The additive conjunction P ∧ Q: proved by both, refuted by a refutation of either","status":"ok"},"long":{"text":"P ∧ Q is proved by proofs of both conjuncts and refuted by a refutation of either one; its consistency is [[AffineConstructive.interfaces.aprop.aand_nb]]. This is the additive conjunction, read \"and\". As a hypothesis it offers a choice: either conjunct may be used, but not both. That sets it apart from the tensor [[AffineConstructive.interfaces.aprop.aprod]], which has the same proofs but more refutations.\n\nIt takes the pair (P, Q) as a single argument, so that it is a function on the product Ω ∗ Ω, the same shape as the other binary connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aor","base":"aor","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"The additive disjunction P ∨ Q: proved by either, refuted by refutations of both","status":"ok"},"long":{"text":"P ∨ Q is proved by a proof of either disjunct and refuted by refutations of both; its consistency is [[AffineConstructive.interfaces.aprop.aor_nb]]. It is the additive disjunction and the dual of [[AffineConstructive.interfaces.aprop.aand]]: by definition the negation of P ∨ Q is Pᗮ ∧ Qᗮ. Decidability, [[AffineConstructive.interfaces.aprop.Decidable]], and totality of a relation, [[AffineConstructive.interfaces.aprop.TotalRelation]], are stated with it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.anot","base":"anot","kind":"def","start":44,"body":null,"status":"ok","short":{"text":"The negation Pᗮ of an affine proposition, which swaps its proof and refutation","status":"ok"},"long":{"text":"The negation of P is proved by a refutation of P and refuted by a proof of P; consistency is [[AffineConstructive.interfaces.aprop.anot_nb]]. Negation is involutive on the nose, since swapping twice returns the original pair. It exchanges each connective with its dual: ∧ with ∨, ⊠ with ⊞, ∏ with ∐, and ! with ?. Here negation is a genuine operation on affine propositions, not implication into falsity, so an affine statement refuted is as informative as one proved.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aprod","base":"aprod","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"The tensor P ⊠ Q: proved by both; refuted when a proof of either refutes the other","status":"ok"},"long":{"text":"Like P ∧ Q, P ⊠ Q is proved by proofs of both factors. It is refuted by a pair of functions, one turning a proof of P into a refutation of Q and the other turning a proof of Q into a refutation of P; its consistency is [[AffineConstructive.interfaces.aprop.aprod_nb]]. A refutation of P ∧ Q yields one of P ⊠ Q, so P ⊠ Q implies P ∧ Q. The tensor is the stronger of the two: as a hypothesis it offers both factors, each usable once, where P ∧ Q offers a choice of one.\n\nThe tensor is the multiplicative conjunction. It appears wherever two hypotheses are consumed together, most visibly in transitivity, [[AffineConstructive.interfaces.aprop.Transitive]]: R(x, y) ⊠ R(y, z) implies R(x, z). Read contrapositively, this says that once R(x, z) is refuted, a proof of either R(x, y) or R(y, z) refutes the other. For the dual relation, read as apartness, that is cotransitivity in its affine form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.apar","base":"apar","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"The par P ⊞ Q, the multiplicative disjunction","status":"ok"},"long":{"text":"P ⊞ Q is proved by functions turning a refutation of either factor into a proof of the other, and refuted by refutations of both; consistency is [[AffineConstructive.interfaces.aprop.apar_nb]]. It is the dual of the tensor [[AffineConstructive.interfaces.aprop.aprod]], and P ⊸ Q has the same content as Pᗮ ⊞ Q. Par expresses a weak, constructively meaningful totality: [[AffineConstructive.interfaces.aprop.PseudoTotalRelation]] asks for R(x, y) ⊞ R(y, x), in contrast to the decided disjunction of [[AffineConstructive.interfaces.aprop.TotalRelation]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aimpl","base":"aimpl","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"Affine implication P ⊸ Q: maps proofs forward and refutations backward","status":"ok"},"long":{"text":"A proof of P ⊸ Q is a pair of functions: one from proofs of P to proofs of Q, and one from refutations of Q to refutations of P. A refutation is a proof of P together with a refutation of Q. Its consistency is [[AffineConstructive.interfaces.aprop.aimpl_nb]]. This is the linear implication of affine logic, read \"implies\".\n\nBecause a proof carries both directions, every affine implication amounts to two theorems: the statement and its contrapositive. A function that preserves equality, stated with ⊸, therefore also reflects apartness, which makes it strongly extensional. An implication can also be refuted, by a counterexample in the strict sense: a proof of the antecedent with a refutation of the consequent. The biconditional [[AffineConstructive.interfaces.aprop.aiff]] is built from two implications, and the relation classes of the file state their laws with it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.of_course","base":"of_course","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"Of course P: the affine proposition proved by a strict P and refuted by ¬P","status":"ok"},"long":{"text":"!P turns a strict proposition into an affine one. It is proved by P and refuted by the base-logic negation ¬P; its consistency is [[AffineConstructive.interfaces.aprop.of_course_nb]]. The refutation carries no information beyond the impossibility of a proof. This is the exponential modality, which embeds intuitionistic logic into affine logic. As a hypothesis, !P may be used any number of times. An affine proposition equivalent to its own of-course is affirmative, [[AffineConstructive.interfaces.aprop.Affirmative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.not_of_course","base":"not_of_course","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"The affine proposition proved by ¬P and refuted by P, for a base-logic proposition P","status":"ok"},"long":{"text":"For a proposition P of the base logic, the affine proposition whose proofs are refutations ¬P and whose refutations are proofs of P; consistency of the pair is [[AffineConstructive.interfaces.aprop.not_of_course_nb]]. It is the negation of [[AffineConstructive.interfaces.aprop.of_course]] at P, written out as a pair of its own rather than as the dual of !P.\n\nThe development uses it in [[AffineConstructive.logic.aprop.not_of_course_refutative]], which shows that this proposition is [[AffineConstructive.interfaces.aprop.Refutative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.why_not","base":"why_not","kind":"def","start":50,"body":null,"status":"ok","short":{"text":"Why not P: proved by the impossibility of refuting P, refuted by a refutation of P","status":"ok"},"long":{"text":"?P is proved by ¬(P's refutation) and refuted by a refutation of P; consistency is [[AffineConstructive.interfaces.aprop.why_not_nb]]. It is the dual modality to [[AffineConstructive.interfaces.aprop.of_course]]: the negation of ?P is !(Pᗮ) in content. ?P keeps the refutation of P exactly and replaces its proof by the weakest proof consistent with it. Propositions equivalent to one of this form are the refutative ones, [[AffineConstructive.interfaces.aprop.Refutative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.all","base":"all","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"The affine universal quantifier ∏ x, P x over a type","status":"ok"},"long":{"text":"∏ x, P x is proved by a proof of P x for every x and refuted by a single x with a refutation of P x; consistency is [[AffineConstructive.interfaces.aprop.all_nb]]. A universal statement can thus be refuted by a counterexample, not merely shown unprovable. It is the infinitary form of the additive conjunction [[AffineConstructive.interfaces.aprop.aand]], and its negation is ∐ x, (P x)ᗮ by definition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aex","base":"aex","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"The affine existential quantifier ∐ x, P x over a type","status":"ok"},"long":{"text":"∐ x, P x is proved by a witness x with a proof of P x and refuted by a refutation of P x for every x; consistency is [[AffineConstructive.interfaces.aprop.aex_nb]]. It is the infinitary form of the additive disjunction [[AffineConstructive.interfaces.aprop.aor]] and the dual of [[AffineConstructive.interfaces.aprop.all]]. It is read \"there is\".","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.aiff","base":"aiff","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"The affine biconditional P ⧟ Q: P implies Q and Q implies P","status":"ok"},"long":{"text":"P ⧟ Q is the additive conjunction of the two affine implications [[AffineConstructive.interfaces.aprop.aimpl]], so a proof gives all four maps: forward, backward, and their contrapositives. The conjunction is additive because the two directions are alternatives to be used, not resources consumed together. A refutation of P ⧟ Q is a counterexample to one of the two directions. The rewriting system works modulo this relation, and the classes [[AffineConstructive.interfaces.aprop.Affirmative]], [[AffineConstructive.interfaces.aprop.Refutative]] and [[AffineConstructive.interfaces.aprop.DeMorganDual]] are stated with it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.Decidable","base":"Decidable","kind":"ind","start":72,"body":null,"status":"ok","short":{"text":"P is decidable: P or its negation holds","status":"ok"},"long":{"text":"An affine proposition is decidable when P ∨ Pᗮ is proved, that is, when P is either proved or refuted. This is Shulman's notion of decidability. In the constructive kernel it is a real restriction, since an affine proposition may be neither proved nor refuted. In the classical kernel every proposition is decidable. It is a class, so decidability of a compound statement can be assembled by instance resolution from that of its parts.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Decidable","base":"Decidable","kind":"rec","short":{"text":"The class of decidable affine propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.decidability","base":"decidability","kind":"proj","short":{"text":"A decidable P is proved or refuted: P ∨ Pᗮ","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.Affirmative","base":"Affirmative","kind":"ind","start":73,"body":null,"status":"ok","short":{"text":"P is affirmative: P is equivalent to of course P","status":"ok"},"long":{"text":"An affine proposition is affirmative when P ⧟ !P, where [[AffineConstructive.interfaces.aprop.of_course]] is applied to the proof of P. Its refutation then says no more than the impossibility of a proof, and P behaves like a strict proposition. This is Shulman's class of affirmative propositions, and equality on a set whose apartness is merely the negation of equality is of this kind. Affirmative propositions are those that can be duplicated and used freely, so the multiplicative and additive connectives agree on them.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Affirmative","base":"Affirmative","kind":"rec","short":{"text":"The class of affirmative affine propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.affirmativity","base":"affirmativity","kind":"proj","short":{"text":"An affirmative P is equivalent to of course P","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.Refutative","base":"Refutative","kind":"ind","start":74,"body":null,"status":"ok","short":{"text":"An affine proposition P is refutative: P is equivalent to why not P","status":"ok"},"long":{"text":"An affine proposition P is refutative when P ⧟ ?P holds, with ?P the why-not modality [[AffineConstructive.interfaces.aprop.why_not]]. The proposition ?P has the same refutation as P, and its proof is the plain negation of that refutation. So P ⧟ ?P says that proving P amounts to no more than showing that P cannot be refuted, and all the content of P lies in its refutation. This is Shulman's class of refutative propositions, the dual of [[AffineConstructive.interfaces.aprop.Affirmative]], where P ⧟ !P puts the content in the proof instead.\n\nThe condition is stated with the affine biconditional, so it carries its contrapositive along with it. It is a class so that resolution can find refutativity, and [[AffineConstructive.interfaces.aprop.RefutativeRelation]] states the same condition pointwise for a predicate.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Refutative","base":"Refutative","kind":"rec","short":{"text":"The class of refutative affine propositions, those equivalent to their why not","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.refutativity","base":"refutativity","kind":"proj","short":{"text":"For a refutative P, the equivalence P ⧟ ?P","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.DeMorganDual","base":"DeMorganDual","kind":"ind","start":78,"body":null,"status":"ok","short":{"text":"Q is a De Morgan dual of P: the negation of P is equivalent to Q","status":"ok"},"long":{"text":"DeMorganDual P Q records that Pᗮ ⧟ Q, where Q is a chosen normal form for the negation of P. Instance resolution treats P as input and Q as output, so the class acts as a function computing negations. Each connective has an instance pushing the negation inward: ∧ to ∨, ⊠ to ⊞, ∏ to ∐, ⊸ to a tensor with a negation, and so on. The rewriting tactics use it to put negated statements into a readable form.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.DeMorganDual","base":"DeMorganDual","kind":"rec","short":{"text":"The class relating an affine proposition to a normal form of its negation","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.demorgan_dual","base":"demorgan_dual","kind":"proj","short":{"text":"The negation of P is equivalent to its De Morgan dual Q","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.of_course_rel","base":"of_course_rel","kind":"def","start":84,"body":null,"status":"ok","short":{"text":"The affine predicate obtained from a strict predicate by applying of course pointwise","status":"ok"},"long":{"text":"For a predicate R valued in strict propositions, of_course_rel R sends p to !(R p), with [[AffineConstructive.interfaces.aprop.of_course]]. It is the standard way to regard a base-logic relation as an affine one whose refutation is mere impossibility. [[AffineConstructive.interfaces.aprop.leq]], the affine form of strict equality, is defined with it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.complement","base":"complement","kind":"def","start":86,"body":null,"status":"ok","short":{"text":"The complement of a predicate: x ↦ (R x)ᗮ","status":"ok"},"long":{"text":"The complement of a predicate R sends x to the negation (R x)ᗮ, with [[AffineConstructive.interfaces.aprop.anot]]. Negation exchanges proof and refutation, so the complement of the complement is R itself. A predicate is read as a subset in the sense of the powerset, a complemented subset with a part that holds and a part that is refuted. The complement then exchanges the two parts.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.DecidableRelation","base":"DecidableRelation","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"An affine predicate is decidable when each of its instances is decidable","status":"ok"},"long":{"text":"DecidableRelation R asks that R p be [[AffineConstructive.interfaces.aprop.Decidable]] for every p. It is declared a class, and a hint lets resolution find decidability of an instance R x from it. A decidable equality or order on a set is stated this way. Its computational counterpart, a boolean decision function, is [[AffineConstructive.interfaces.aprop.Dec]] together with [[AffineConstructive.interfaces.aprop.IsDec]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.AffirmativeRelation","base":"AffirmativeRelation","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"A predicate every instance of which is affirmative","status":"ok"},"long":{"text":"A predicate R on A is affirmative when each R p is affirmative in Shulman's sense: R p is equivalent to its own affirmation !(R p), so it is determined by its way of proving, and its refutation is the plain negation of its proof. Examples are the predicates built with [[AffineConstructive.interfaces.aprop.of_course_rel]], such as [[AffineConstructive.interfaces.aprop.leq]].\n\nThe pointwise condition is kept as a class of its own so that resolution, given an affirmative predicate in context, finds the instance [[AffineConstructive.interfaces.aprop.Affirmative]] (R x) at each point; a hint at the end of the section does this unfolding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.RefutativeRelation","base":"RefutativeRelation","kind":"def","start":89,"body":null,"status":"ok","short":{"text":"A predicate whose every instance is refutative","status":"ok"},"long":{"text":"A predicate R on A is refutative when R p is [[AffineConstructive.interfaces.aprop.Refutative]] for every p. That is, each R p is equivalent to ?(R p): its proof is the negation of its refutation, and its refutation carries its content.\n\nThis is the pointwise form of Shulman's notion, alongside [[AffineConstructive.interfaces.aprop.DecidableRelation]] and [[AffineConstructive.interfaces.aprop.AffirmativeRelation]]. It is declared a class, and a hint lets resolution derive [[AffineConstructive.interfaces.aprop.Refutative]] (R x) at any point x from this single assumption on R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.Subrelation","base":"Subrelation","kind":"ind","start":93,"body":null,"status":"ok","short":{"text":"R is contained in R': R p implies R' p for every p","status":"ok"},"long":{"text":"R is a subrelation of R' when R p ⊸ R' p for every p. The containment is an affine implication, so it carries its contrapositive: a refutation of R' p is a refutation of R p. Inclusion of predicates is therefore at once inclusion of what they affirm and reverse inclusion of what they refute, as with inclusion of complemented subsets.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Subrelation","base":"Subrelation","kind":"rec","short":{"text":"The class stating that R is contained in R'","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.subrelation","base":"subrelation","kind":"proj","short":{"text":"The containment: R p implies R' p, for each p","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.Dec","base":"Dec","kind":"ind","start":98,"body":null,"status":"ok","short":{"text":"A boolean decision function for a predicate R on A, with no claim of correctness","status":"ok"},"long":{"text":"A decision procedure for a predicate R on A: a function from A to the booleans. On its own it says nothing about R. Correctness is the separate class [[AffineConstructive.interfaces.aprop.IsDec]], which requires that the answer true gives R p and the answer false gives its negation (R p)ᗮ. The function is data, not a proof-irrelevant proposition, so it computes, and two decision functions for the same predicate are distinct objects.\n\nThe examples are decision functions for the equality or the order of particular sets, such as [[AffineConstructive.implementations.bool.bool_eq_dec]] for equality of booleans, or [[AffineConstructive.orders.orders.trich_le_dec]], which reads the order off a three-way comparison. Built on it is [[AffineConstructive.interfaces.aprop.IsDec]], and through it [[AffineConstructive.interfaces.set.IsDecEq]], the correctness of a decision procedure for the equality of a set.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Dec","base":"Dec","kind":"rec","short":{"text":"The class of boolean decision functions for a predicate R on A","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.dec","base":"dec","kind":"proj","short":{"text":"The boolean answer the decision function of R gives at a point","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.IsDec","base":"IsDec","kind":"ind","start":100,"body":null,"status":"ok","short":{"text":"The decision function of R is correct: true gives R p, false gives its negation","status":"ok"},"long":{"text":"The specification of a decision function for R: when it returns true at p, R p holds, and when it returns false, the negation (R p)ᗮ holds, which is to say R p is refuted. Since the negation of an affine proposition exchanges proof and refutation, a correct decision function settles each R p in the strong sense of [[AffineConstructive.interfaces.aprop.Decidable]], and supplies in addition a computable witness of which side holds.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.IsDec","base":"IsDec","kind":"rec","short":{"text":"The decision function of R is correct: true gives R p, false gives its negation","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.dec_spec","base":"dec_spec","kind":"proj","short":{"text":"The correctness of the decision function at a point p","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.flip","base":"flip","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"The converse of a relation on pairs: flip R holds at (y, x) when R holds at (x, y)","status":"ok"},"long":{"text":"The converse of a binary relation, presented as a predicate on pairs: flip R at (y, x) is R at (x, y). Relations in the development are predicates on the cartesian product A ∗ B, and flip swaps the two coordinates.\n\nThe strict order [[AffineConstructive.interfaces.relation_notation.lt]] is defined with it, x < y being the negation of y ≤ x. The lemmas of `logic/relations.v` show that each property of relations passes to the converse: [[AffineConstructive.logic.relations.flip_Reflexive]], [[AffineConstructive.logic.relations.flip_Symmetric]], [[AffineConstructive.logic.relations.flip_Transitive]] and their companions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.leq","base":"leq","kind":"def","start":106,"body":null,"status":"ok","short":{"text":"Strict equality of A as an affirmative affine relation, the affirmation of x ≡ y","status":"ok"},"long":{"text":"The relation on A whose proof is the strict equality x ≡ y of the base logic and whose refutation is its negation, obtained by applying of course to strict equality through [[AffineConstructive.interfaces.aprop.of_course_rel]]. It is the finest affine equality a type carries, affirmative by construction, and serves as the equality of types that carry no other set structure.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop.Reflexive","base":"Reflexive","kind":"ind","start":108,"body":null,"status":"ok","short":{"text":"R is reflexive: R (x, x) for every x","status":"ok"},"long":{"text":"A relation R on A is reflexive when R (x, x) holds for every x. For an apartness read through the negative side, reflexivity of the equality says that nothing is apart from itself; the single affine statement carries both readings.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Reflexive","base":"Reflexive","kind":"rec","short":{"text":"R is reflexive: R (x, x) for every x","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.reflexivity","base":"reflexivity","kind":"proj","short":{"text":"The proof of R (x, x) given by reflexivity","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.Symmetric","base":"Symmetric","kind":"ind","start":109,"body":null,"status":"ok","short":{"text":"R is symmetric: R (x, y) implies R (y, x)","status":"ok"},"long":{"text":"A relation R is symmetric when R (x, y) ⊸ R (y, x) for all x and y. The affine implication carries its contrapositive, so the dual relation (an apartness, when R is an equality) is symmetric as well; one statement gives both.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Symmetric","base":"Symmetric","kind":"rec","short":{"text":"R is symmetric: R (x, y) implies R (y, x)","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.symmetry","base":"symmetry","kind":"proj","short":{"text":"The implication R (x, y) ⊸ R (y, x) of a symmetric relation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.Transitive","base":"Transitive","kind":"ind","start":110,"body":null,"status":"ok","short":{"text":"R is transitive: R (x, y) tensor R (y, z) implies R (x, z)","status":"ok"},"long":{"text":"A relation R is transitive when R (x, y) ⊠ R (y, z) ⊸ R (x, z). The hypothesis is the tensor, not the additive conjunction: following Shulman, this is the form whose contrapositive is the cotransitivity of the dual relation, namely that if x is apart from z then, for any y, x is apart from y or y is apart from z (in the sense of par). It is the transitivity asked of the equality of a set, and the weaker of the two forms in the file; [[AffineConstructive.interfaces.aprop.StronglyTransitive]] is the additive one.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Transitive","base":"Transitive","kind":"rec","short":{"text":"R is transitive: R (x, y) tensor R (y, z) implies R (x, z)","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.transitivity","base":"transitivity","kind":"proj","short":{"text":"The implication R (x, y) ⊠ R (y, z) ⊸ R (x, z) of a transitive relation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.StronglyTransitive","base":"StronglyTransitive","kind":"ind","start":111,"body":null,"status":"ok","short":{"text":"R is strongly transitive: R (x, y) and R (y, z) implies R (x, z)","status":"ok"},"long":{"text":"Transitivity with the additive conjunction in the hypothesis: R (x, y) ∧ R (y, z) ⊸ R (x, z). Since the tensor implies the additive conjunction, this is stronger than [[AffineConstructive.interfaces.aprop.Transitive]]; its contrapositive gives the additive disjunction R (x, y)ᗮ ∨ R (y, z)ᗮ from a refutation of R (x, z), so a refutation picks out which link fails. Affirmative relations, whose refutations are mere negations, satisfy the two forms alike.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.StronglyTransitive","base":"StronglyTransitive","kind":"rec","short":{"text":"R is strongly transitive: R (x, y) and R (y, z) implies R (x, z)","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.strong_transitivity","base":"strong_transitivity","kind":"proj","short":{"text":"The implication R (x, y) ∧ R (y, z) ⊸ R (x, z) of a strongly transitive relation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.PseudoAntisymmetric","base":"PseudoAntisymmetric","kind":"ind","start":112,"body":null,"status":"ok","short":{"text":"R (x, y) tensor R (y, x) implies x and y equal under eq","status":"ok"},"long":{"text":"Antisymmetry of R with respect to an equality eq, in the multiplicative form: R (x, y) ⊠ R (y, x) ⊸ eq (x, y). Its contrapositive says that if x and y are apart then R (x, y) or R (y, x) fails, in the sense of par. This is the form natural for orders on sets with apartness, where the strict order is the dual of the order; [[AffineConstructive.interfaces.aprop.Antisymmetric]] is the additive form, stronger.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.PseudoAntisymmetric","base":"PseudoAntisymmetric","kind":"rec","short":{"text":"R (x, y) tensor R (y, x) implies x and y equal under eq","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.pseudo_antisymmetry","base":"pseudo_antisymmetry","kind":"proj","short":{"text":"The implication R (x, y) ⊠ R (y, x) ⊸ eq (x, y) of a pseudo-antisymmetric relation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.Antisymmetric","base":"Antisymmetric","kind":"ind","start":113,"body":null,"status":"ok","short":{"text":"R (x, y) and R (y, x) implies x and y equal under eq","status":"ok"},"long":{"text":"Antisymmetry of R with respect to an equality eq, with the additive conjunction: R (x, y) ∧ R (y, x) ⊸ eq (x, y). By contraposition, from x apart from y one obtains a refutation of R (x, y) or of R (y, x), the additive disjunction, which names the failing comparison. It implies [[AffineConstructive.interfaces.aprop.PseudoAntisymmetric]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.Antisymmetric","base":"Antisymmetric","kind":"rec","short":{"text":"R (x, y) and R (y, x) implies x and y equal under eq","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.antisymmetry","base":"antisymmetry","kind":"proj","short":{"text":"The implication R (x, y) ∧ R (y, x) ⊸ eq (x, y) of an antisymmetric relation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.PseudoTotalRelation","base":"PseudoTotalRelation","kind":"ind","start":114,"body":null,"status":"ok","short":{"text":"R is pseudo-total: R (x, y) par R (y, x) for all x and y","status":"ok"},"long":{"text":"Totality in the multiplicative form: R (x, y) ⊞ R (y, x) for all x and y. The par says that a refutation of either comparison yields a proof of the other, and that the two are not both refuted; it does not decide which holds. For an order whose dual is a strict order this is the statement that x < y and y < x cannot both hold, the asymmetry of the strict order, so pseudo-totality is available constructively where [[AffineConstructive.interfaces.aprop.TotalRelation]] is not.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.PseudoTotalRelation","base":"PseudoTotalRelation","kind":"rec","short":{"text":"R is pseudo-total: R (x, y) par R (y, x) for all x and y","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.pseudo_total","base":"pseudo_total","kind":"proj","short":{"text":"The par R (x, y) ⊞ R (y, x) of a pseudo-total relation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.TotalRelation","base":"TotalRelation","kind":"ind","start":115,"body":null,"status":"ok","short":{"text":"A total relation: for all x and y, R (x, y) or R (y, x), with the additive or","status":"ok"},"long":{"text":"Totality with the additive disjunction: for all x and y, R (x, y) ∨ R (y, x), so one of the two comparisons is proved outright. It is stronger than [[AffineConstructive.interfaces.aprop.PseudoTotalRelation]], which uses par: a total relation is pseudo-total by [[AffineConstructive.logic.relations.Total_PseudoTotal]], and conversely a decidable pseudo-total relation is total by [[AffineConstructive.logic.relations.dec_pseudo_total]].\n\n[[AffineConstructive.interfaces.orders.TotalOrder]] is a partial order whose order is total in this sense.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.TotalRelation","base":"TotalRelation","kind":"rec","short":{"text":"A total relation: for all x and y, R (x, y) or R (y, x), with the additive or","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.total","base":"total","kind":"proj","short":{"text":"The totality of a relation: R (x, y) ∨ R (y, x) for all x and y","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.Equivalence","base":"Equivalence","kind":"rec","start":116,"body":null,"status":"ok","short":{"text":"R is an equivalence: reflexive, symmetric and transitive","status":"ok"},"long":{"text":"An affine equivalence relation: [[AffineConstructive.interfaces.aprop.Reflexive]], [[AffineConstructive.interfaces.aprop.Symmetric]] and [[AffineConstructive.interfaces.aprop.Transitive]], the last in the multiplicative form. Read through the dual, an equivalence is an apartness relation: irreflexive, symmetric and cotransitive. This is the structure the equality of an affine set carries. Each field is a coercion, so an equivalence in context supplies the three properties to resolution.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.equiv_refl","base":"equiv_refl","kind":"proj","short":{"text":"The reflexivity of an equivalence","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.equiv_sym","base":"equiv_sym","kind":"proj","short":{"text":"The symmetry of an equivalence","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.equiv_trans","base":"equiv_trans","kind":"proj","short":{"text":"The transitivity of an equivalence","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.Build_Equivalence","base":"Build_Equivalence","kind":"constr","short":{"text":"Builds an equivalence from reflexivity, symmetry and transitivity","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.PartialEquivalence","base":"PartialEquivalence","kind":"rec","start":118,"body":null,"status":"ok","short":{"text":"An affine partial equivalence relation: symmetric and transitive","status":"ok"},"long":{"text":"An affine partial equivalence relation: a relation that is [[AffineConstructive.interfaces.aprop.Symmetric]] and [[AffineConstructive.interfaces.aprop.Transitive]], without reflexivity. Symmetry is an affine implication and transitivity takes R (x, y) ⊠ R (y, z), each comparison used once. Both fields are coercions, so a partial equivalence serves where symmetry or transitivity is asked for.\n\nEvery [[AffineConstructive.interfaces.aprop.Equivalence]] is one, through [[AffineConstructive.interfaces.aprop.Equivalence_to_PartialEquivalence]]. The converse of a partial equivalence is one again, [[AffineConstructive.logic.relations.flip_PartialEquivalence]], and a partial equivalence respects itself: R-related arguments give equivalent instances of R, [[AffineConstructive.logic.relations.PER_rel_proper_aiff]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.aprop.partial_equiv_sym","base":"partial_equiv_sym","kind":"proj","short":{"text":"The symmetry of a partial equivalence","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.partial_equiv_trans","base":"partial_equiv_trans","kind":"proj","short":{"text":"The transitivity of a partial equivalence","status":"ok"}},{"name":"AffineConstructive.interfaces.aprop.Build_PartialEquivalence","base":"Build_PartialEquivalence","kind":"constr","short":{"text":"Builds a partial equivalence from symmetry and transitivity","status":"ok"}}]},{"name":"AffineConstructive.interfaces.aprop.Equivalence_to_PartialEquivalence","base":"Equivalence_to_PartialEquivalence","kind":"def","start":120,"body":[121,124],"status":"ok","short":{"text":"Every equivalence is a partial equivalence","status":"ok"},"proof":[{"text":"Assume R is an equivalence: reflexive, symmetric and transitive.","status":"ok","from":0,"to":1},{"text":"A partial equivalence asks only for symmetry and transitivity. The equivalence already has both, so each field comes from it as it stands.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.interfaces.aprop.relations.coercion:Equivalence_to_PartialEquivalence","base":"coercion:Equivalence_to_PartialEquivalence","kind":"coercion","start":125,"body":null,"status":"ok","short":{"text":"Lets an affine equivalence relation serve wherever a partial equivalence is asked for, through [[AffineConstructive.interfaces.aprop.Equivalence_to_PartialEquivalence]]","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.tactics.tauto":{"page":"../tactics/tauto.html","short":"tauto and intuition: intuitionistic propositional decision procedures for the base logic SProp","summary":"The file supplies `tauto` and `intuition` for the base logic `SProp`. Both are adapted from the Rocq core library's tactics of the same names, which do not work on strict propositions as shipped. `tauto` is a complete decision procedure for intuitionistic propositional logic. It handles and, or, implication, [[not]], [[iff]], truth and [[False]], and recognises any connective defined as a record or inductive type of the right shape. `intuition` runs the same search but hands every goal the search leaves open to a solver, `trivial` by default. The changes from the core library are these: negation and equivalence are this development's own; negation is unfolded by restating it as an implication into [[False]]; the classical branch is removed, so only intuitionistic reasoning is used; and two hypothesis-flattening steps are rewritten so that the binders they create get the right relevance for strict propositions. These tactics act only on the base logic. Affine statements are handled by the rewriting system of the neighbouring tactic files."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.interfaces.aprop_kernel":{"page":"aprop_kernel.html","short":"The swappable constructive kernel for affine propositions, enabling the classical conservativity build","summary":"The kernel of the affine propositions: the types of the two side-condition fields of an affine proposition, a pair of a proof component and a refutation component, and one filler per connective building the second field. [[NotBoth]] says the proof and refutation cannot both hold; [[Classicality]] is trivially true in this constructive kernel, and every filler, for truth, falsity, negation, and, or, tensor, par, implication, of course and the two quantifiers, returns the trivial proof. The file exists to be swapped: the classical conservativity build replaces it with a kernel where the condition is P ∨ N and the fillers come from excluded middle on SProp. Because the rest of the library builds affine propositions only through these fillers (in interfaces/aprop.v), it compiles against both kernels, and every theorem in it is also a theorem of classical mathematics."}},"constants":null}</script>

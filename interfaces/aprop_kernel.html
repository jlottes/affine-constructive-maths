","kind":"def","local":true},{"s":1943,"e":1950,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"NotBoth","kind":"def","local":true},{"s":1960,"e":1972,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":1979,"e":1991,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":1998,"e":2010,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":2051,"e":2052,"lib":"AffineConstructive.interfaces.sprop","name":"I","kind":"constr","local":false,"page":"sprop.html"},{"s":2097,"e":2109,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":2121,"e":2122,"lib":"AffineConstructive.interfaces.sprop","name":"I","kind":"constr","local":false,"page":"sprop.html"},{"s":2166,"e":2178,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":2190,"e":2191,"lib":"AffineConstructive.interfaces.sprop","name":"I","kind":"constr","local":false,"page":"sprop.html"},{"s":2251,"e":2263,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":2279,"e":2291,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":2324,"e":2325,"lib":"AffineConstructive.interfaces.sprop","name":"I","kind":"constr","local":false,"page":"sprop.html"},{"s":2384,"e":2396,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":2412,"e":2424,"lib":"AffineConstructive.interfaces.aprop_kernel","name":"Classicality","kind":"def","local":true},{"s":2457,"e":2458,"lib":"AffineConstructive.interfaces.sprop","name":"I","kind":"constr","local":false,"page":"sprop.html"}],"gloss":{"summary":"The kernel of the affine propositions: the types of the two side-condition fields of an affine proposition, a pair of a proof component and a refutation component, and one filler per connective building the second field. [[AffineConstructive.interfaces.aprop_kernel.NotBoth]] says the proof and refutation cannot both hold; [[AffineConstructive.interfaces.aprop_kernel.Classicality]] is trivially true in this constructive kernel, and every filler, for truth, falsity, negation, and, or, tensor, par, implication, of course and the two quantifiers, returns the trivial proof. The file exists to be swapped: the classical conservativity build replaces it with a kernel where the condition is P ∨ N and the fillers come from excluded middle on SProp. Because the rest of the library builds affine propositions only through these fillers (in interfaces/aprop.v), it compiles against both kernels, and every theorem in it is also a theorem of classical mathematics.","short":"The swappable constructive kernel for affine propositions, enabling the classical conservativity build","items":[{"name":"AffineConstructive.interfaces.aprop_kernel.NotBoth","base":"NotBoth","kind":"def","start":2,"body":null,"status":"ok","short":{"text":"P and Q do not both hold: the consistency condition between a proof and a refutation","status":"ok"},"long":{"text":"The base-logic proposition ¬(P ∧ Q) on two SProps. An affine proposition is a pair of a way of proving P and a way of refuting N, and this is the field of that pair which says the two cannot both hold. It is the one condition Shulman's translation places on every affine proposition, and it is the same in the constructive and the classical kernel.\n\nThe fillers for tensor, par and implication take [[AffineConstructive.interfaces.aprop_kernel.NotBoth]] hypotheses on their arguments, so that the classical kernel can use them in deriving its field; in this kernel they go unused.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.Classicality","base":"Classicality","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"The second side condition on a proof–refutation pair; trivially true in the constructive kernel","status":"ok"},"long":{"text":"The type of the second side-condition field of an affine proposition with proof component P and refutation component N. In this, the default constructive kernel, it is truth 𝐓 whatever P and N are, so the field carries no information and every affine proposition is a pair (P, N) with [[AffineConstructive.interfaces.aprop_kernel.NotBoth]] P N alone.\n\nThe definition exists so that the classical conservativity build can replace it: there the kernel file is swapped for one in which the condition reads P ∨ N, making every affine proposition decided, as an affine proposition is in classical mathematics. Code outside the kernel never inspects the field and builds it only through the fillers of this file, one per connective, which is what lets the whole library compile against both kernels and makes each of its theorems a classical theorem as well.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.atrue_cl","base":"atrue_cl","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"The classicality field of truth, whose proof is 𝐓 and refutation 𝐅","status":"ok"},"long":{"text":"The filler for the affine proposition 𝐓, the pair proved by truth and refuted by falsity. Here it is the trivial proof [[AffineConstructive.interfaces.sprop.I]]; in the classical kernel it witnesses 𝐓 ∨ 𝐅.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.afalse_cl","base":"afalse_cl","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"The classicality field of falsity, whose proof is 𝐅 and refutation 𝐓","status":"ok"},"long":{"text":"The filler for the affine proposition 𝐅, the pair proved by falsity and refuted by truth. Here it is the trivial proof [[AffineConstructive.interfaces.sprop.I]]; in the classical kernel it witnesses 𝐅 ∨ 𝐓.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.anot_cl","base":"anot_cl","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"The classicality field of a negation, from that of the proposition negated","status":"ok"},"long":{"text":"The filler for the negation Pᗮ, which swaps the proof and refutation components: from the condition on (P, N) it produces the condition on (N, P). The condition is symmetric in both kernels, so this is a matter of commuting the disjunction classically and is trivial here.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.aand_cl","base":"aand_cl","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The classicality field of an additive conjunction, from those of its two conjuncts","status":"ok"},"long":{"text":"The filler for the additive and: P ∧ Q with components (P, N) and (Q, M) is proved by proving both and refuted by refuting either, so its pair is (P ∧ Q, N ∨ M). The filler takes the conditions on the two conjuncts to the condition on this pair; trivial here, a case analysis in the classical kernel.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.aor_cl","base":"aor_cl","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"The classicality field of an additive disjunction, from those of its two disjuncts","status":"ok"},"long":{"text":"The filler for the additive or, dual to [[AffineConstructive.interfaces.aprop_kernel.aand_cl]]: P ∨ Q is proved by proving either and refuted by refuting both, so its pair is (P ∨ Q, N ∧ M). Trivial here, a case analysis in the classical kernel.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.aprod_cl","base":"aprod_cl","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The classicality field of a tensor, from those of its two factors and their consistency","status":"ok"},"long":{"text":"The filler for the tensor P ⊠ Q. Following Shulman, the tensor is proved by proving both factors, but refuted in the multiplicative way: by a refutation of each factor conditional on a proof of the other, so its pair is (P ∧ Q, (P → M) ∧ (Q → N)). The filler also receives the [[AffineConstructive.interfaces.aprop_kernel.NotBoth]] conditions of the two factors, so that the classical kernel may use them in its derivation; the signature must be the same in both kernels. Here it returns the trivial proof.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.apar_cl","base":"apar_cl","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"The classicality field of a par, from those of its two factors and their consistency","status":"ok"},"long":{"text":"The filler for the par, the dual of the tensor: it is refuted by refuting both factors and proved multiplicatively, by a proof of each factor conditional on a refutation of the other, so its pair is ((N → Q) ∧ (M → P), N ∧ M). As with [[AffineConstructive.interfaces.aprop_kernel.aprod_cl]], the [[AffineConstructive.interfaces.aprop_kernel.NotBoth]] conditions of the factors are passed for the benefit of the classical kernel; here the filler is trivial.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.aimpl_cl","base":"aimpl_cl","kind":"def","start":11,"body":null,"status":"ok","short":{"text":"The classicality field of an affine implication, from those of its antecedent and consequent","status":"ok"},"long":{"text":"The filler for affine implication P ⊸ Q, read as the par of the negation of P with Q. It is proved by a map from proofs of P to proofs of Q together with its contrapositive, a map from refutations of Q to refutations of P, and refuted by a proof of P with a refutation of Q; its pair is ((P → Q) ∧ (M → N), P ∧ M). This is the definition that makes every affine implication carry its contrapositive. The [[AffineConstructive.interfaces.aprop_kernel.NotBoth]] conditions are passed for the classical kernel; here the filler is trivial.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.of_course_cl","base":"of_course_cl","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"The classicality field of of course P, the pair proved by P and refuted by ¬P","status":"ok"},"long":{"text":"The filler for the exponential !P, which turns a base-logic proposition P into the affine proposition affirmed by a proof of P and refuted by the base-logic negation ¬P. Its pair (P, ¬P) is consistent outright; in the classical kernel the condition P ∨ ¬P is excluded middle at the level of SProp, here it is trivial.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.not_of_course_cl","base":"not_of_course_cl","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The classicality field of the dual of of course P, the pair proved by ¬P and refuted by P","status":"ok"},"long":{"text":"The filler for the dual of [[AffineConstructive.interfaces.aprop_kernel.of_course_cl]], the pair (¬P, P): proved by the base-logic negation of P and refuted by a proof of P. It is used where the negation of an affirmed proposition is formed directly. Trivial here, excluded middle in the classical kernel.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.all_cl","base":"all_cl","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"The classicality field of an affine universal quantifier, from those of its instances","status":"ok"},"long":{"text":"The filler for the affine quantifier ∏ x, P x over a type A: proved by proving every instance and refuted by refuting some instance, so its pair is (∀ x, P x, ∃ x, N x). From the condition on each instance it produces the condition on the quantified pair. In the classical kernel this needs excluded middle on the quantified statement and is where classical reasoning about infinite families enters; here it is trivial.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.aprop_kernel.aex_cl","base":"aex_cl","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"The classicality field of an affine existential quantifier, from those of its instances","status":"ok"},"long":{"text":"The filler for the affine quantifier ∐ x, P x, dual to [[AffineConstructive.interfaces.aprop_kernel.all_cl]]: proved by proving some instance and refuted by refuting every instance, so its pair is (∃ x, P x, ∀ x, N x). Trivial here; in the classical kernel it is derived from excluded middle.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."}},"constants":null}</script>

algebra.additive_group_morphism]]; declared canonical for the category framework.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig","base":"near_rig","kind":"rec","start":216,"body":null,"status":"ok","short":{"text":"A bundled right near-rig: a set with +, 0, ·, 1 satisfying the near-rig laws","status":"ok"},"long":{"text":"An object of the category of right near-rigs: a set with addition, zero, multiplication and one, and the proof [[AffineConstructive.interfaces.abstract_algebra.NearRig]] that + and 0 form an additive monoid, · is associative with identity 1, multiplication distributes on the right and 0 · x = 0. It is the weakest structure with both operations, and the root of the rig and ring hierarchy of the file: [[AffineConstructive.interfaces.bundled_algebra.rig]] and [[AffineConstructive.interfaces.bundled_algebra.near_ring]] coerce to it, and every category of rigs or rings uses its hom-set [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_car","base":"near_rig_car","kind":"proj","short":{"text":"The underlying set of a bundled near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_p","base":"near_rig_p","kind":"proj","short":{"text":"The addition of a bundled near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_z","base":"near_rig_z","kind":"proj","short":{"text":"The zero of a bundled near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_m","base":"near_rig_m","kind":"proj","short":{"text":"The multiplication of a bundled near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_o","base":"near_rig_o","kind":"proj","short":{"text":"The one of a bundled near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_prop","base":"near_rig_prop","kind":"proj","short":{"text":"The near-rig laws of a bundled near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_near_rig","base":"Build_near_rig","kind":"constr","short":{"text":"Builds a bundled near-rig from a set, +, 0, ·, 1 and the near-rig laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_near_rig","base":"make_near_rig","kind":"def","start":218,"body":null,"status":"ok","short":{"text":"Bundles a set with +, 0, ·, 1 into a near-rig, the structure found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.near_rig]]: for a set R on which addition, zero, multiplication, one and the class [[AffineConstructive.interfaces.abstract_algebra.NearRig]] are declared, it packs them into the bundled object. The coercions [[AffineConstructive.interfaces.bundled_algebra.rig_as_near_rig]] and [[AffineConstructive.interfaces.bundled_algebra.near_ring_as_near_rig]] are defined through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_morphism_t","base":"near_rig_morphism_t","kind":"rec","start":220,"body":null,"status":"ok","short":{"text":"A morphism of near-rigs: a function preserving +, 0, · and 1","status":"ok"},"long":{"text":"The type of arrows between bundled near-rigs: a function of the underlying sets with the proof [[AffineConstructive.interfaces.abstract_algebra.Rig_Morphism]] that it preserves addition, zero, multiplication and one. Being a function of sets it preserves equality and, read affinely, reflects apartness.\n\nThe set of these morphisms, with equality of the underlying functions, is [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]], which serves as the hom-set for every category of rigs and rings in the file.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_morphism_fun","base":"near_rig_morphism_fun","kind":"proj","short":{"text":"The underlying function of a near-rig morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_morphism_prop","base":"near_rig_morphism_prop","kind":"proj","short":{"text":"The proof that a near-rig morphism preserves +, 0, · and 1","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_near_rig_morphism_t","base":"Build_near_rig_morphism_t","kind":"constr","short":{"text":"Builds a near-rig morphism from a function preserving +, 0, · and 1","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_morphism","base":"near_rig_morphism","kind":"def","start":222,"body":null,"status":"ok","short":{"text":"The set of near-rig morphisms, equal when their functions are equal","status":"ok"},"long":{"text":"The hom-set of the category of near-rigs: the morphisms of [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism_t]], made into a set whose equality is that of the underlying functions. The same set is the hom-set of rigs, strong rigs, commutative rigs, near-rings, rings and commutative rings ([[AffineConstructive.interfaces.bundled_algebra.rig_morphism]], [[AffineConstructive.interfaces.bundled_algebra.strong_rig_morphism]], [[AffineConstructive.interfaces.bundled_algebra.commutative_rig_morphism]], [[AffineConstructive.interfaces.bundled_algebra.near_ring_morphism]], [[AffineConstructive.interfaces.bundled_algebra.ring_morphism]], [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_morphism]]): each of these is a full subcategory of near-rigs, the extra axioms constraining only the objects and negation being preserved automatically.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_near_rig_morphism","base":"make_near_rig_morphism","kind":"def","start":223,"body":null,"status":"ok","short":{"text":"Builds a near-rig morphism from a function, its preservation of +, 0, ·, 1 found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]]: given a function f between the carriers of two near-rigs, it finds the proof of [[AffineConstructive.interfaces.abstract_algebra.Rig_Morphism]] for f by resolution and returns the bundled morphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.near_rig_cat_t","base":"near_rig_cat_t","kind":"def","start":225,"body":null,"status":"ok","short":{"text":"The category data of near-rigs: bundled near-rigs with rig morphisms between them","status":"ok"},"long":{"text":"The data of the category of near-rigs: its objects are bundled near-rigs [[AffineConstructive.interfaces.bundled_algebra.near_rig]] and its hom-sets are [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]], the functions preserving addition, zero, multiplication and one. It is declared canonical, so that a hom-set between near-rigs is recognised as a hom-set of this category, and the identities, composition and category laws are then found from the generic constructions of the category interface.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.rig","base":"rig","kind":"rec","start":226,"body":null,"status":"ok","short":{"text":"A bundled rig: a set with addition, zero, multiplication and one satisfying the rig laws","status":"ok"},"long":{"text":"A rig, or semiring, packaged as a single object: a carrier set with its addition, zero, multiplication and one, and a proof of [[AffineConstructive.interfaces.abstract_algebra.Rig]], so an rg whose multiplication has an identity, with commutative addition and both distributive laws. The carrier is a coercion, so a rig is used wherever a set is expected, and the operations and the laws are recovered from the bundle by resolution.\n\nThe bundled form makes rigs the objects of a category, [[AffineConstructive.interfaces.bundled_algebra.rig_cat_t]], and lets a rig be passed as one argument. A rig is a near-rig through [[AffineConstructive.interfaces.bundled_algebra.rig_as_near_rig]], and its morphisms are those of near-rigs.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.rig_car","base":"rig_car","kind":"proj","short":{"text":"The carrier set of a rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.rig_p","base":"rig_p","kind":"proj","short":{"text":"The addition of a rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.rig_z","base":"rig_z","kind":"proj","short":{"text":"The zero of a rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.rig_m","base":"rig_m","kind":"proj","short":{"text":"The multiplication of a rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.rig_o","base":"rig_o","kind":"proj","short":{"text":"The one of a rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.rig_prop","base":"rig_prop","kind":"proj","short":{"text":"The rig laws of a rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_rig","base":"Build_rig","kind":"constr","short":{"text":"Builds a rig from a set, its four operations and the rig laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_rig","base":"make_rig","kind":"def","start":228,"body":null,"status":"ok","short":{"text":"Builds a rig from a set whose operations and rig laws are found by resolution","status":"ok"},"long":{"text":"Bundles a set R into a [[AffineConstructive.interfaces.bundled_algebra.rig]], taking its addition, zero, multiplication, one and the proof of [[AffineConstructive.interfaces.abstract_algebra.Rig]] from the instances already available on R. It is [[AffineConstructive.interfaces.bundled_algebra.Build_rig]] with only the carrier given explicitly, and is the usual way to view an unbundled rig as an object of the category of rigs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.rig_as_near_rig","base":"rig_as_near_rig","kind":"def","start":230,"body":null,"status":"ok","short":{"text":"A rig regarded as a near-rig","status":"ok"},"long":{"text":"Every rig is a near-rig: the same carrier and operations, with the rig laws weakened to those of [[AffineConstructive.interfaces.abstract_algebra.NearRig]]. This map is declared both as a coercion and as a canonical structure, so a rig is accepted wherever a [[AffineConstructive.interfaces.bundled_algebra.near_rig]] is expected and the near-rig structure of a rig's carrier is found by unification.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:rig_as_near_rig","base":"coercion:rig_as_near_rig","kind":"coercion","start":231,"body":null,"status":"ok","short":{"text":"A bundled rig can stand where a near-rig is expected, via [[AffineConstructive.interfaces.bundled_algebra.rig_as_near_rig]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.rig_morphism","base":"rig_morphism","kind":"def","start":233,"body":null,"status":"ok","short":{"text":"The set of rig morphisms between two rigs: those of the underlying near-rigs","status":"ok"},"long":{"text":"The hom-set of the category of rigs. A morphism of rigs preserves addition, zero, multiplication and one, which is the same condition as for near-rigs, so the hom-set is [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]] between the rigs regarded as near-rigs. Defining it by reuse means that a rig morphism is literally a near-rig morphism, with no conversion between the two.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.rig_cat_t","base":"rig_cat_t","kind":"def","start":234,"body":null,"status":"ok","short":{"text":"The category data of rigs: bundled rigs with rig morphisms between them","status":"ok"},"long":{"text":"The data of the category of rigs, with objects [[AffineConstructive.interfaces.bundled_algebra.rig]] and hom-sets [[AffineConstructive.interfaces.bundled_algebra.rig_morphism]]. As a canonical structure it lets a hom-set between rigs be recognised as a hom-set of this category, so the generic category notation and laws apply to rigs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_rig","base":"strong_rig","kind":"rec","start":235,"body":null,"status":"ok","short":{"text":"A bundled strong rig: a rig whose carrier is a strong set","status":"ok"},"long":{"text":"A rig whose equality is strongly transitive, so that its inequality is an apartness ([[AffineConstructive.interfaces.set.StrongSet]]). It is bundled as a [[AffineConstructive.interfaces.bundled_algebra.rig]] together with this one property, rather than repeating the rig's fields; the rig is a coercion, so a strong rig is used wherever a rig is expected.\n\nStrong rigs are the setting in which apartness, rather than mere inequality, is meaningful for elements of a rig; their morphisms are those of the underlying near-rigs, [[AffineConstructive.interfaces.bundled_algebra.strong_rig_morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.strong_rig_rig","base":"strong_rig_rig","kind":"proj","short":{"text":"The underlying rig of a strong rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_rig_prop","base":"strong_rig_prop","kind":"proj","short":{"text":"The strong transitivity of the equality of a strong rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_strong_rig","base":"Build_strong_rig","kind":"constr","short":{"text":"Builds a strong rig from a rig whose carrier is a strong set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_strong_rig","base":"make_strong_rig","kind":"def","start":237,"body":[238,242],"status":"ok","short":{"text":"Builds a strong rig from a set whose rig structure and strength are found by resolution","status":"ok"},"proof":[{"text":"A strong rig is made of a rig and a proof that its carrier is a strong set, so the construction supplies these two parts one at a time.","status":"ok","from":0,"to":1},{"text":"The rig is the one [[AffineConstructive.interfaces.bundled_algebra.make_rig]] builds on R from the operations and the rig laws found by resolution. Its carrier is R itself, so the given strength of R is what the second part asks for.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_rig_morphism","base":"strong_rig_morphism","kind":"def","start":244,"body":null,"status":"ok","short":{"text":"The set of morphisms between two strong rigs: the near-rig morphisms between them","status":"ok"},"long":{"text":"The hom-set of the category of strong rigs. Strength is a property of the carrier, not structure to be preserved, so a morphism of strong rigs is a near-rig morphism ([[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]]) between the underlying near-rigs. Every function between sets preserves equality and so, by the affine reading of preservation, reflects apartness; no additional condition is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_rig_cat_t","base":"strong_rig_cat_t","kind":"def","start":245,"body":null,"status":"ok","short":{"text":"The category data of strong rigs: bundled strong rigs with near-rig morphisms","status":"ok"},"long":{"text":"The data of the category of strong rigs, with objects [[AffineConstructive.interfaces.bundled_algebra.strong_rig]] and hom-sets [[AffineConstructive.interfaces.bundled_algebra.strong_rig_morphism]], declared canonical so that the category notation and laws apply to strong rigs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig","base":"commutative_rig","kind":"rec","start":246,"body":null,"status":"ok","short":{"text":"A commutative rig: a set bundled with +, 0, ·, 1 forming a commutative rig","status":"ok"},"long":{"text":"A commutative rig packaged as one object: a carrier set with addition, zero, multiplication and one, and a proof of [[AffineConstructive.interfaces.abstract_algebra.CommutativeRig]], a rig whose multiplication is commutative. It is bundled on its own, with the same fields as [[AffineConstructive.interfaces.bundled_algebra.rig]], rather than as a rig with an extra property, and is related to rigs by the coercion [[AffineConstructive.interfaces.bundled_algebra.commutative_rig_as_rig]].\n\nObjects are built with [[AffineConstructive.interfaces.bundled_algebra.make_commutative_rig]]; they are the objects of [[AffineConstructive.interfaces.bundled_algebra.commutative_rig_cat_t]], whose morphisms [[AffineConstructive.interfaces.bundled_algebra.commutative_rig_morphism]] are the near-rig morphisms, the maps preserving +, 0, · and 1.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_car","base":"commutative_rig_car","kind":"proj","short":{"text":"The carrier set of a commutative rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_p","base":"commutative_rig_p","kind":"proj","short":{"text":"The addition of a commutative rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_z","base":"commutative_rig_z","kind":"proj","short":{"text":"The zero of a commutative rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_m","base":"commutative_rig_m","kind":"proj","short":{"text":"The multiplication of a commutative rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_o","base":"commutative_rig_o","kind":"proj","short":{"text":"The one of a commutative rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_prop","base":"commutative_rig_prop","kind":"proj","short":{"text":"The commutative rig laws of a commutative rig","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_commutative_rig","base":"Build_commutative_rig","kind":"constr","short":{"text":"Builds a commutative rig from a set, its four operations and the commutative rig laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_commutative_rig","base":"make_commutative_rig","kind":"def","start":248,"body":null,"status":"ok","short":{"text":"Builds a commutative rig from a set whose operations and laws are found by resolution","status":"ok"},"long":{"text":"Bundles a set R into a [[AffineConstructive.interfaces.bundled_algebra.commutative_rig]], taking its addition, zero, multiplication, one and the proof of [[AffineConstructive.interfaces.abstract_algebra.CommutativeRig]] from the instances on R. It is [[AffineConstructive.interfaces.bundled_algebra.Build_commutative_rig]] with only the carrier explicit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_as_rig","base":"commutative_rig_as_rig","kind":"def","start":250,"body":null,"status":"ok","short":{"text":"A commutative rig regarded as a rig","status":"ok"},"long":{"text":"Forgets commutativity: the same carrier and operations, bundled as a [[AffineConstructive.interfaces.bundled_algebra.rig]] by [[AffineConstructive.interfaces.bundled_algebra.make_rig]]. Declared as a coercion and a canonical structure, so a commutative rig is accepted wherever a rig is expected, and through [[AffineConstructive.interfaces.bundled_algebra.rig_as_near_rig]] wherever a near-rig is.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:commutative_rig_as_rig","base":"coercion:commutative_rig_as_rig","kind":"coercion","start":251,"body":null,"status":"ok","short":{"text":"A bundled commutative rig can stand where a rig is expected, via [[AffineConstructive.interfaces.bundled_algebra.commutative_rig_as_rig]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_morphism","base":"commutative_rig_morphism","kind":"def","start":253,"body":null,"status":"ok","short":{"text":"The set of morphisms between two commutative rigs: the near-rig morphisms between them","status":"ok"},"long":{"text":"The hom-set of the category of commutative rigs. Commutativity is a property, so morphisms are those of the underlying near-rigs, [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]]: functions preserving addition, zero, multiplication and one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_rig_cat_t","base":"commutative_rig_cat_t","kind":"def","start":254,"body":null,"status":"ok","short":{"text":"The category data of commutative rigs: bundled commutative rigs with near-rig morphisms","status":"ok"},"long":{"text":"The data of the category of commutative rigs, with objects [[AffineConstructive.interfaces.bundled_algebra.commutative_rig]] and hom-sets [[AffineConstructive.interfaces.bundled_algebra.commutative_rig_morphism]], declared canonical so that the category notation and laws apply to commutative rigs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring","base":"near_ring","kind":"rec","start":255,"body":null,"status":"ok","short":{"text":"A bundled near-ring: a set with addition, zero, multiplication, one and negation satisfying the near-ring laws","status":"ok"},"long":{"text":"A near-ring packaged as one object: a carrier set with addition, zero, multiplication, one and negation, and a proof of [[AffineConstructive.interfaces.abstract_algebra.NearRing]], so a near-rig whose addition is a group, not necessarily abelian, with right distributivity only. The carrier is a coercion and the operations are recovered by resolution.\n\nA near-ring is a near-rig through [[AffineConstructive.interfaces.bundled_algebra.near_ring_as_near_rig]], and its morphisms are the near-rig morphisms: preservation of negation follows from preservation of addition and zero in a group, so it is not asked for.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_car","base":"near_ring_car","kind":"proj","short":{"text":"The carrier set of a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_p","base":"near_ring_p","kind":"proj","short":{"text":"The addition of a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_z","base":"near_ring_z","kind":"proj","short":{"text":"The zero of a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_m","base":"near_ring_m","kind":"proj","short":{"text":"The multiplication of a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_o","base":"near_ring_o","kind":"proj","short":{"text":"The one of a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_n","base":"near_ring_n","kind":"proj","short":{"text":"The negation of a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_prop","base":"near_ring_prop","kind":"proj","short":{"text":"The near-ring laws of a near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_near_ring","base":"Build_near_ring","kind":"constr","short":{"text":"Builds a near-ring from a set, its five operations and the near-ring laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_near_ring","base":"make_near_ring","kind":"def","start":257,"body":null,"status":"ok","short":{"text":"Builds a near-ring from a set whose operations and laws are found by resolution","status":"ok"},"long":{"text":"Bundles a set R into a [[AffineConstructive.interfaces.bundled_algebra.near_ring]], taking its addition, zero, multiplication, one, negation and the proof of [[AffineConstructive.interfaces.abstract_algebra.NearRing]] from the instances on R. It is [[AffineConstructive.interfaces.bundled_algebra.Build_near_ring]] with only the carrier explicit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_as_near_rig","base":"near_ring_as_near_rig","kind":"def","start":259,"body":null,"status":"ok","short":{"text":"A near-ring regarded as a near-rig, forgetting its negation","status":"ok"},"long":{"text":"Forgets the negation of a near-ring and bundles the rest as a [[AffineConstructive.interfaces.bundled_algebra.near_rig]] by [[AffineConstructive.interfaces.bundled_algebra.make_near_rig]]. Declared as a coercion and a canonical structure, so a near-ring is accepted wherever a near-rig is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:near_ring_as_near_rig","base":"coercion:near_ring_as_near_rig","kind":"coercion","start":260,"body":null,"status":"ok","short":{"text":"A bundled near-ring can stand where a near-rig is expected, via [[AffineConstructive.interfaces.bundled_algebra.near_ring_as_near_rig]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_morphism","base":"near_ring_morphism","kind":"def","start":262,"body":null,"status":"ok","short":{"text":"The set of morphisms between two near-rings: the near-rig morphisms between them","status":"ok"},"long":{"text":"The hom-set of the category of near-rings: [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]] between the underlying near-rigs. A map preserving addition and zero between additive groups preserves negation, so near-ring morphisms need no further condition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.near_ring_cat_t","base":"near_ring_cat_t","kind":"def","start":263,"body":null,"status":"ok","short":{"text":"The category data of near-rings: bundled near-rings with near-rig morphisms","status":"ok"},"long":{"text":"The data of the category of near-rings, with objects [[AffineConstructive.interfaces.bundled_algebra.near_ring]] and hom-sets [[AffineConstructive.interfaces.bundled_algebra.near_ring_morphism]], declared canonical so that the category notation and laws apply to near-rings.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ring","base":"ring","kind":"rec","start":264,"body":null,"status":"ok","short":{"text":"A bundled ring: a set with addition, zero, multiplication, one and negation satisfying the ring laws","status":"ok"},"long":{"text":"A ring with unit packaged as one object: a carrier set with addition, zero, multiplication, one and negation, and a proof of [[AffineConstructive.interfaces.abstract_algebra.Ring]], so a rng that is also a rig. The carrier is a coercion and the operations are recovered by resolution.\n\nA ring is both a rig and a near-ring, through [[AffineConstructive.interfaces.bundled_algebra.ring_as_rig]] and [[AffineConstructive.interfaces.bundled_algebra.ring_as_near_ring]], so the hierarchy of bundled structures forms a diamond below near-rigs; both paths give the same near-rig. Ring morphisms are near-rig morphisms.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.ring_car","base":"ring_car","kind":"proj","short":{"text":"The carrier set of a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_p","base":"ring_p","kind":"proj","short":{"text":"The addition of a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_z","base":"ring_z","kind":"proj","short":{"text":"The zero of a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_m","base":"ring_m","kind":"proj","short":{"text":"The multiplication of a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_o","base":"ring_o","kind":"proj","short":{"text":"The one of a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_n","base":"ring_n","kind":"proj","short":{"text":"The negation of a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_prop","base":"ring_prop","kind":"proj","short":{"text":"The ring laws of a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_ring","base":"Build_ring","kind":"constr","short":{"text":"Builds a ring from a set, its five operations and the ring laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_ring","base":"make_ring","kind":"def","start":266,"body":null,"status":"ok","short":{"text":"Builds a ring from a set whose operations and ring laws are found by resolution","status":"ok"},"long":{"text":"Bundles a set R into a [[AffineConstructive.interfaces.bundled_algebra.ring]], taking its addition, zero, multiplication, one, negation and the proof of [[AffineConstructive.interfaces.abstract_algebra.Ring]] from the instances on R. It is [[AffineConstructive.interfaces.bundled_algebra.Build_ring]] with only the carrier explicit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_as_rig","base":"ring_as_rig","kind":"def","start":268,"body":null,"status":"ok","short":{"text":"A ring regarded as a rig, forgetting its negation","status":"ok"},"long":{"text":"Forgets the negation of a ring and bundles the rest as a [[AffineConstructive.interfaces.bundled_algebra.rig]] by [[AffineConstructive.interfaces.bundled_algebra.make_rig]]. Declared as a coercion and a canonical structure, so a ring is accepted wherever a rig is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:ring_as_rig","base":"coercion:ring_as_rig","kind":"coercion","start":269,"body":null,"status":"ok","short":{"text":"A bundled ring can stand where a rig is expected, via [[AffineConstructive.interfaces.bundled_algebra.ring_as_rig]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_as_near_ring","base":"ring_as_near_ring","kind":"def","start":271,"body":null,"status":"ok","short":{"text":"A ring regarded as a near-ring","status":"ok"},"long":{"text":"A ring is a near-ring: the same carrier and operations, bundled as a [[AffineConstructive.interfaces.bundled_algebra.near_ring]] by [[AffineConstructive.interfaces.bundled_algebra.make_near_ring]], with the ring laws weakened to [[AffineConstructive.interfaces.abstract_algebra.NearRing]]. Declared as a coercion and a canonical structure; together with [[AffineConstructive.interfaces.bundled_algebra.ring_as_rig]] it gives a ring two routes to a near-rig, which agree definitionally.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:ring_as_near_ring","base":"coercion:ring_as_near_ring","kind":"coercion","start":272,"body":null,"status":"ok","short":{"text":"A bundled ring can stand where a near-ring is expected, via [[AffineConstructive.interfaces.bundled_algebra.ring_as_near_ring]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_morphism","base":"ring_morphism","kind":"def","start":274,"body":null,"status":"ok","short":{"text":"The set of ring morphisms between two rings: the near-rig morphisms between them","status":"ok"},"long":{"text":"The hom-set of the category of rings: [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]] between the underlying near-rigs, the functions preserving addition, zero, multiplication and one. Preservation of negation follows, so it is not part of the definition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ring_cat_t","base":"ring_cat_t","kind":"def","start":275,"body":null,"status":"ok","short":{"text":"The category data of rings: bundled rings with ring morphisms between them","status":"ok"},"long":{"text":"The data of the category of rings, with objects [[AffineConstructive.interfaces.bundled_algebra.ring]] and hom-sets [[AffineConstructive.interfaces.bundled_algebra.ring_morphism]], declared canonical so that the category notation and laws apply to rings.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring","base":"commutative_ring","kind":"rec","start":276,"body":null,"status":"ok","short":{"text":"A commutative ring: a set bundled with +, 0, ·, 1, − forming a commutative ring","status":"ok"},"long":{"text":"A commutative ring packaged as one object: a carrier set with addition, zero, multiplication, one and negation, and a proof of [[AffineConstructive.interfaces.abstract_algebra.CommutativeRing]], a ring that is also a commutative rig. It is bundled with its own fields and related to the rest of the hierarchy by the coercions [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_as_ring]] and [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_as_commutative_rig]].\n\nObjects are built with [[AffineConstructive.interfaces.bundled_algebra.make_commutative_ring]]; they are the objects of [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_cat_t]], whose morphisms [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_morphism]] are the near-rig morphisms, the maps preserving +, 0, · and 1.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_car","base":"commutative_ring_car","kind":"proj","short":{"text":"The carrier set of a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_p","base":"commutative_ring_p","kind":"proj","short":{"text":"The addition of a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_z","base":"commutative_ring_z","kind":"proj","short":{"text":"The zero of a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_m","base":"commutative_ring_m","kind":"proj","short":{"text":"The multiplication of a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_o","base":"commutative_ring_o","kind":"proj","short":{"text":"The one of a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_n","base":"commutative_ring_n","kind":"proj","short":{"text":"The negation of a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_prop","base":"commutative_ring_prop","kind":"proj","short":{"text":"The commutative ring laws of a commutative ring","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_commutative_ring","base":"Build_commutative_ring","kind":"constr","short":{"text":"Builds a commutative ring from a set, its five operations and the commutative ring laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_commutative_ring","base":"make_commutative_ring","kind":"def","start":278,"body":null,"status":"ok","short":{"text":"Builds a commutative ring from a set whose operations and laws are found by resolution","status":"ok"},"long":{"text":"Bundles a set R into a [[AffineConstructive.interfaces.bundled_algebra.commutative_ring]], taking its addition, zero, multiplication, one, negation and the proof of [[AffineConstructive.interfaces.abstract_algebra.CommutativeRing]] from the instances on R. It is [[AffineConstructive.interfaces.bundled_algebra.Build_commutative_ring]] with only the carrier explicit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_as_ring","base":"commutative_ring_as_ring","kind":"def","start":280,"body":null,"status":"ok","short":{"text":"A commutative ring regarded as a ring","status":"ok"},"long":{"text":"Forgets commutativity: the same carrier and operations bundled as a [[AffineConstructive.interfaces.bundled_algebra.ring]] by [[AffineConstructive.interfaces.bundled_algebra.make_ring]]. Declared as a coercion and a canonical structure, so a commutative ring is accepted wherever a ring, and hence a rig or near-ring, is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:commutative_ring_as_ring","base":"coercion:commutative_ring_as_ring","kind":"coercion","start":281,"body":null,"status":"ok","short":{"text":"A bundled commutative ring can stand where a ring is expected, via [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_as_ring]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_as_commutative_rig","base":"commutative_ring_as_commutative_rig","kind":"def","start":283,"body":null,"status":"ok","short":{"text":"A commutative ring regarded as a commutative rig, forgetting its negation","status":"ok"},"long":{"text":"Forgets the negation of a commutative ring and bundles the rest as a [[AffineConstructive.interfaces.bundled_algebra.commutative_rig]] by [[AffineConstructive.interfaces.bundled_algebra.make_commutative_rig]]. Declared as a coercion and a canonical structure; with [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_as_ring]] it closes the square between commutative rings, rings, commutative rigs and rigs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:commutative_ring_as_commutative_rig","base":"coercion:commutative_ring_as_commutative_rig","kind":"coercion","start":284,"body":null,"status":"ok","short":{"text":"A bundled commutative ring can stand where a commutative rig is expected, via [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_as_commutative_rig]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_morphism","base":"commutative_ring_morphism","kind":"def","start":286,"body":null,"status":"ok","short":{"text":"The set of morphisms between two commutative rings: the near-rig morphisms between them","status":"ok"},"long":{"text":"The hom-set of the category of commutative rings: [[AffineConstructive.interfaces.bundled_algebra.near_rig_morphism]] between the underlying near-rigs. Commutativity and negation impose no further condition on morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_ring_cat_t","base":"commutative_ring_cat_t","kind":"def","start":287,"body":null,"status":"ok","short":{"text":"The category data of commutative rings: bundled commutative rings with near-rig morphisms","status":"ok"},"long":{"text":"The data of the category of commutative rings, with objects [[AffineConstructive.interfaces.bundled_algebra.commutative_ring]] and hom-sets [[AffineConstructive.interfaces.bundled_algebra.commutative_ring_morphism]], declared canonical so that the category notation and laws apply to commutative rings.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_notation":{"page":"bundled_notation.html","short":"One-field records holding an operation, and hints for resolution to read it back","summary":"The file defines one-field records, each holding a single operation or structure: an order relation ([[has_le]]); a monoid unit, zero, one, top or bottom element; a binary operation, addition, multiplication, meet or join; an inversion or negation; or a decision procedure for the equality of a set ([[has_dec_eq]]). The constructors of all but the last are coercions. Global hints at priority 4 let instance resolution recover the operation: given a goal such as `Plus X`, they strip the coercions from X to reach the term underneath and apply the record's projection to it. The module `definition_hints` adds fallback hints at priority 8 that take the operation from a record found among the hypotheses in context. They cover the unit, zero, one, the binary operation, inversion, addition, negation, multiplication and decidable equality."},"AffineConstructive.interfaces.cat":{"page":"cat.html","short":"Minimal categories with affine hom-sets, and the category of affine sets","summary":"This file sets up a minimal notion of category in which the objects form a type and the hom-sets are affine sets, so equality of morphisms is an affine equality, carrying apartness as well. It separates the data ([[cat_t]]) from the operations ([[Id]] and [[Compose]]) and from the laws ([[IsCat]]), then packages them in the bundled [[cat]]. Composition is a function out of the tensor of hom-sets, so it is required to be extensional only in the multiplicative sense. The main instance is [[𝐒𝐞𝐭]], with affine sets as objects and the function sets of interfaces/set.v as hom-sets, and [[set_IsCat]] proves its laws."},"AffineConstructive.theory.projected_set":{"page":"../theory/projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.theory.rings":{"page":"../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

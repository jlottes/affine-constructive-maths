"e":33132,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_as_ring","kind":"canonstruc","local":true},{"s":33156,"e":33170,"lib":"AffineConstructive.tactics.strip_coercions","name":"StripCoercions","kind":"def","local":false,"page":"../tactics/strip_coercions.html"},{"s":33172,"e":33196,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_as_ring","kind":"canonstruc","local":true},{"s":33308,"e":33324,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring","kind":"rec","local":true},{"s":33329,"e":33349,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"make_commutative_rig","kind":"def","local":true},{"s":33353,"e":33436,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_as_commutative_rig","kind":"canonstruc","local":true},{"s":33460,"e":33474,"lib":"AffineConstructive.tactics.strip_coercions","name":"StripCoercions","kind":"def","local":false,"page":"../tactics/strip_coercions.html"},{"s":33476,"e":33511,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_as_commutative_rig","kind":"canonstruc","local":true},{"s":33612,"e":33628,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring","kind":"rec","local":true},{"s":33637,"e":33654,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"near_rig_morphism","kind":"def","local":true},{"s":33707,"e":33718,"lib":"AffineConstructive.interfaces.cat","name":"Build_cat_t","kind":"constr","local":false,"page":"cat.html"},{"s":33719,"e":33735,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring","kind":"rec","local":true},{"s":33736,"e":33761,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_morphism","kind":"def","local":true}],"gloss":{"summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[AffineConstructive.interfaces.bundled_algebra.𝐒𝐭𝐫𝐒𝐞𝐭]].","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","items":[{"name":"AffineConstructive.interfaces.bundled_algebra.strong_set_cat_t","base":"strong_set_cat_t","kind":"def","start":80,"body":null,"status":"ok","short":{"text":"The data of the category of strong sets: strong sets as objects, functions between them as morphisms","status":"ok"},"long":{"text":"The objects are strong sets, sets whose equality is strongly transitive so that their inequality is an apartness ([[AffineConstructive.interfaces.set.strong_set]]), and the morphisms from X to Y form the set of functions between the underlying sets ([[AffineConstructive.interfaces.set.strong_set_morphism]]). There is no extra condition on morphisms: a function between sets already preserves equality, and in the affine reading that means it also reflects apartness, so it is strongly extensional. Identities are [[AffineConstructive.interfaces.set.id_fun]] and composition is [[AffineConstructive.interfaces.set.scompose]]. The laws are proved in [[AffineConstructive.interfaces.bundled_algebra.strong_set_is_cat]], and the category built from this data is [[AffineConstructive.interfaces.bundled_algebra.𝐒𝐭𝐫𝐒𝐞𝐭]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_set_is_cat","base":"strong_set_is_cat","kind":"prf","start":83,"body":[84,86],"status":"ok","short":{"text":"Strong sets and their functions satisfy the category laws; each law holds by reflexivity","status":"ok"},"proof":[{"text":"The category laws are three equations between functions of strong sets: the identity is neutral for composition on each side, and composition is associative. In each one the two sides agree at every point by definition, so each law holds by reflexivity of equality.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.interfaces.bundled_algebra.𝐒𝐭𝐫𝐒𝐞𝐭","base":"𝐒𝐭𝐫𝐒𝐞𝐭","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"The category of strong sets and the functions between them","status":"ok"},"long":{"text":"The category of strong sets: sets whose equality is strongly transitive, so that their inequality is an apartness. It is assembled with [[AffineConstructive.interfaces.cat.Build_cat]] from the data [[AffineConstructive.interfaces.bundled_algebra.strong_set_cat_t]] (strong sets as objects, the functions of the underlying sets as morphisms), with the identity function, composition of functions, and the category laws [[AffineConstructive.interfaces.bundled_algebra.strong_set_is_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup","base":"semigroup","kind":"rec","start":89,"body":null,"status":"ok","short":{"text":"A semigroup as an object: a set bundled with an associative binary operation","status":"ok"},"long":{"text":"A semigroup as a single object. It packs a carrier set, a binary operation on it, and the proof that the operation is associative ([[AffineConstructive.interfaces.abstract_algebra.SemiGroup]]). The unbundled class [[AffineConstructive.interfaces.abstract_algebra.SemiGroup]] is a property of a set that already has an operation; this record is what a category needs, namely a thing that can be passed around as one object. The carrier is a coercion, so a semigroup can be used wherever a set is expected, and the operation and the axioms stay available to resolution. Its morphisms form [[AffineConstructive.interfaces.bundled_algebra.semigroup_morphism]], and the two together make up [[AffineConstructive.interfaces.bundled_algebra.semigroup_cat_t]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup_car","base":"semigroup_car","kind":"proj","short":{"text":"The carrier set of a semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup_op","base":"semigroup_op","kind":"proj","short":{"text":"The binary operation of a semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup_prop","base":"semigroup_prop","kind":"proj","short":{"text":"The semigroup axioms of a semigroup: its operation is associative","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_semigroup","base":"Build_semigroup","kind":"constr","short":{"text":"Builds a semigroup from a set, an operation on it and the proof of associativity","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_semigroup","base":"make_semigroup","kind":"def","start":91,"body":null,"status":"ok","short":{"text":"Builds a semigroup from a set whose operation and semigroup axioms are found by resolution","status":"ok"},"long":{"text":"Builds a semigroup from a set alone. The operation and the proof of [[AffineConstructive.interfaces.abstract_algebra.SemiGroup]] are found by instance resolution. This is the usual way to see a concrete set with known structure as an object of [[AffineConstructive.interfaces.bundled_algebra.semigroup_cat_t]], and it is also how the forgetful coercions, such as [[AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_as_sg]], are written.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup_morphism_t","base":"semigroup_morphism_t","kind":"rec","start":93,"body":null,"status":"ok","short":{"text":"A semigroup morphism: a function between semigroups that preserves the operation","status":"ok"},"long":{"text":"A semigroup morphism between two semigroups: a function of the underlying sets together with the proof that it preserves the operation, f (x ∙ y) = f x ∙ f y ([[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]]). This record is only the type of morphisms. Its equality is supplied by [[AffineConstructive.interfaces.bundled_algebra.semigroup_morphism]], which makes these morphisms the elements of a set.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup_morphism_fun","base":"semigroup_morphism_fun","kind":"proj","short":{"text":"The underlying function of a semigroup morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup_morphism_prop","base":"semigroup_morphism_prop","kind":"proj","short":{"text":"A semigroup morphism preserves the operation","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_semigroup_morphism_t","base":"Build_semigroup_morphism_t","kind":"constr","short":{"text":"Builds a semigroup morphism from a function and the proof that it preserves the operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup_morphism","base":"semigroup_morphism","kind":"def","start":95,"body":null,"status":"ok","short":{"text":"The set of semigroup morphisms between two semigroups, with equality that of the underlying functions","status":"ok"},"long":{"text":"The semigroup morphisms from X to Y, as a set. The equality comes from the underlying functions through [[AffineConstructive.interfaces.bundled_algebra.semigroup_morphism_fun]] (a projected set): two morphisms are equal when they are equal as functions, and apart when they are apart as functions. The proof that they preserve the operation plays no part in the equality. These are the hom-sets of [[AffineConstructive.interfaces.bundled_algebra.semigroup_cat_t]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_semigroup_morphism","base":"make_semigroup_morphism","kind":"def","start":96,"body":null,"status":"ok","short":{"text":"Builds a semigroup morphism from a function whose morphism property is found by resolution","status":"ok"},"long":{"text":"Builds an element of [[AffineConstructive.interfaces.bundled_algebra.semigroup_morphism]] from a function between semigroups. The proof that the function preserves the operation ([[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]]) is found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.semigroup_cat_t","base":"semigroup_cat_t","kind":"def","start":98,"body":null,"status":"ok","short":{"text":"The data of the category of semigroups and semigroup morphisms","status":"ok"},"long":{"text":"The data of the category of semigroups. The objects are given by [[AffineConstructive.interfaces.bundled_algebra.semigroup]] and the hom-sets by [[AffineConstructive.interfaces.bundled_algebra.semigroup_morphism]], packaged by [[AffineConstructive.interfaces.cat.Build_cat_t]]. This lets semigroups be used in the category-theoretic framework of interfaces.cat.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup","base":"multiplicative_semigroup","kind":"rec","start":99,"body":null,"status":"ok","short":{"text":"A bundled multiplicative semigroup: a set with an associative multiplication ·","status":"ok"},"long":{"text":"A semigroup written multiplicatively, packaged as one object: a carrier set, a multiplication ·, and the proof [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup]] that the multiplication is associative. Its content is that of [[AffineConstructive.interfaces.bundled_algebra.semigroup]], whose operation is written ∙; this record carries the multiplication symbol instead, so that what is stated about it reads as a statement about a multiplication.\n\nObjects are built with [[AffineConstructive.interfaces.bundled_algebra.make_multiplicative_semigroup]], which finds the multiplication and its law by resolution. The one structure the development turns into a multiplicative semigroup is a semigroup itself: [[AffineConstructive.theory.bundled_groups.semigroup_as_mul_sg]] reads the operation ∙ of a bundled semigroup as ·. Morphisms, the maps preserving multiplication, form the set [[AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism]], and with them the record gives the category data [[AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_cat_t]]; the identity [[AffineConstructive.theory.bundled_groups.multiplicative_semigroup_id]] and composition [[AffineConstructive.theory.bundled_groups.multiplicative_semigroup_morphism_compose_op]] are supplied in theory.bundled_groups.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_car","base":"multiplicative_semigroup_car","kind":"proj","short":{"text":"The carrier set of a multiplicative semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_op","base":"multiplicative_semigroup_op","kind":"proj","short":{"text":"The multiplication of a multiplicative semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_prop","base":"multiplicative_semigroup_prop","kind":"proj","short":{"text":"The associativity of the multiplication of a multiplicative semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_multiplicative_semigroup","base":"Build_multiplicative_semigroup","kind":"constr","short":{"text":"Builds a multiplicative semigroup from a set, a multiplication and its associativity","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_multiplicative_semigroup","base":"make_multiplicative_semigroup","kind":"def","start":101,"body":null,"status":"ok","short":{"text":"Builds a multiplicative semigroup from a set whose multiplication and axioms are found by resolution","status":"ok"},"long":{"text":"Builds a multiplicative semigroup from a set alone. The multiplication and the proof of [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup]] are found by instance resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism_t","base":"multiplicative_semigroup_morphism_t","kind":"rec","start":103,"body":null,"status":"ok","short":{"text":"A morphism of multiplicative semigroups: a function preserving multiplication","status":"ok"},"long":{"text":"A morphism between multiplicative semigroups: a function of the underlying sets together with the proof that it preserves multiplication, f (x · y) = f x · f y ([[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup_Morphism]]). Its equality as a set is given by [[AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism_fun","base":"multiplicative_semigroup_morphism_fun","kind":"proj","short":{"text":"The underlying function of a morphism of multiplicative semigroups","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism_prop","base":"multiplicative_semigroup_morphism_prop","kind":"proj","short":{"text":"A morphism of multiplicative semigroups preserves multiplication","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_multiplicative_semigroup_morphism_t","base":"Build_multiplicative_semigroup_morphism_t","kind":"constr","short":{"text":"Builds a morphism of multiplicative semigroups from a function preserving multiplication","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism","base":"multiplicative_semigroup_morphism","kind":"def","start":105,"body":null,"status":"ok","short":{"text":"The set of morphisms between two multiplicative semigroups, with equality that of the underlying functions","status":"ok"},"long":{"text":"The morphisms between two multiplicative semigroups, as a set. The equality is inherited from the underlying functions through [[AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism_fun]], and the proof that the function preserves multiplication plays no part in it. These are the hom-sets of [[AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_cat_t]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_multiplicative_semigroup_morphism","base":"make_multiplicative_semigroup_morphism","kind":"def","start":106,"body":null,"status":"ok","short":{"text":"Builds a morphism of multiplicative semigroups from a function, its property found by resolution","status":"ok"},"long":{"text":"Builds an element of [[AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism]] from a function between multiplicative semigroups. The proof of [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup_Morphism]] is found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_cat_t","base":"multiplicative_semigroup_cat_t","kind":"def","start":108,"body":null,"status":"ok","short":{"text":"The data of the category of multiplicative semigroups","status":"ok"},"long":{"text":"The data of the category of multiplicative semigroups. The objects are given by [[AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup]] and the hom-sets by [[AffineConstructive.interfaces.bundled_algebra.multiplicative_semigroup_morphism]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_semigroup","base":"commutative_semigroup","kind":"rec","start":109,"body":null,"status":"ok","short":{"text":"A commutative semigroup as an object: a set with an associative, commutative operation","status":"ok"},"long":{"text":"A commutative semigroup as a single object. It packs a carrier set, a binary operation, and the proof that the operation is associative and commutative ([[AffineConstructive.interfaces.abstract_algebra.CommutativeSemiGroup]]). Commutativity is a property of the operation and not extra data, so every commutative semigroup is a semigroup, by [[AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_as_sg]]. Its morphisms are the semigroup morphisms ([[AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_morphism]]), which makes the commutative semigroups a full subcategory of the semigroups.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_car","base":"commutative_semigroup_car","kind":"proj","short":{"text":"The carrier set of a commutative semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_op","base":"commutative_semigroup_op","kind":"proj","short":{"text":"The binary operation of a commutative semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_prop","base":"commutative_semigroup_prop","kind":"proj","short":{"text":"The axioms of a commutative semigroup: its operation is associative and commutative","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_commutative_semigroup","base":"Build_commutative_semigroup","kind":"constr","short":{"text":"Builds a commutative semigroup from a set, an operation and the proof of its axioms","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_as_sg","base":"commutative_semigroup_as_sg","kind":"def","start":111,"body":null,"status":"ok","short":{"text":"The underlying semigroup of a commutative semigroup","status":"ok"},"long":{"text":"Forgets commutativity: it sends a commutative semigroup to the semigroup with the same carrier and operation. It is a coercion and a canonical structure, so a commutative semigroup can be used wherever a [[AffineConstructive.interfaces.bundled_algebra.semigroup]] is expected. It is the object part of the inclusion of commutative semigroups into semigroups.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:commutative_semigroup_as_sg","base":"coercion:commutative_semigroup_as_sg","kind":"coercion","start":112,"body":null,"status":"ok","short":{"text":"A bundled commutative semigroup can stand where a semigroup is expected, via [[AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_as_sg]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_morphism","base":"commutative_semigroup_morphism","kind":"def","start":114,"body":null,"status":"ok","short":{"text":"The set of morphisms between commutative semigroups: the semigroup morphisms of their underlying semigroups","status":"ok"},"long":{"text":"The morphisms between two commutative semigroups, defined as the [[AffineConstructive.interfaces.bundled_algebra.semigroup_morphism]] set of the underlying semigroups. Commutativity adds no condition on morphisms, so the commutative semigroups form a full subcategory of the semigroups.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_cat_t","base":"commutative_semigroup_cat_t","kind":"def","start":115,"body":null,"status":"ok","short":{"text":"The data of the category of commutative semigroups","status":"ok"},"long":{"text":"The data of the category of commutative semigroups. The objects are given by [[AffineConstructive.interfaces.bundled_algebra.commutative_semigroup]] and the hom-sets by [[AffineConstructive.interfaces.bundled_algebra.commutative_semigroup_morphism]], which are the semigroup morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.monoid","base":"monoid","kind":"rec","start":116,"body":null,"status":"ok","short":{"text":"A monoid as an object: a set bundled with an operation, a unit and the monoid axioms","status":"ok"},"long":{"text":"A monoid as a single object. It packs a carrier set, a binary operation, a unit, and the proof that the operation is associative and the unit is a two-sided identity ([[AffineConstructive.interfaces.abstract_algebra.Monoid]]). The other bundled monoids map into it by forgetful coercions: [[AffineConstructive.interfaces.bundled_algebra.commutative_monoid_as_monoid]], [[AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_as_monoid]] and [[AffineConstructive.interfaces.bundled_algebra.group_as_monoid]]. Its morphisms are in [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_car","base":"monoid_car","kind":"proj","short":{"text":"The carrier set of a monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_op","base":"monoid_op","kind":"proj","short":{"text":"The binary operation of a monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_u","base":"monoid_u","kind":"proj","short":{"text":"The unit of a monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_prop","base":"monoid_prop","kind":"proj","short":{"text":"The monoid axioms of a monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_monoid","base":"Build_monoid","kind":"constr","short":{"text":"Builds a monoid from a set, an operation, a unit and the monoid axioms","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_monoid","base":"make_monoid","kind":"def","start":118,"body":null,"status":"ok","short":{"text":"Builds a monoid from a set whose operation, unit and axioms are found by resolution","status":"ok"},"long":{"text":"Builds a monoid from a set alone. The operation, the unit and the proof of [[AffineConstructive.interfaces.abstract_algebra.Monoid]] are found by instance resolution. The forgetful maps into [[AffineConstructive.interfaces.bundled_algebra.monoid]] are written with it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_morphism_t","base":"monoid_morphism_t","kind":"rec","start":120,"body":null,"status":"ok","short":{"text":"A monoid morphism: a function preserving the operation and the unit","status":"ok"},"long":{"text":"A monoid morphism between two monoids: a function of the underlying sets with the proof that it preserves the operation and the unit ([[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]]). Unit preservation is required separately because it does not follow from preservation of the operation. Its equality as a set is given by [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_morphism_fun","base":"monoid_morphism_fun","kind":"proj","short":{"text":"The underlying function of a monoid morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_morphism_prop","base":"monoid_morphism_prop","kind":"proj","short":{"text":"A monoid morphism preserves the operation and the unit","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_monoid_morphism_t","base":"Build_monoid_morphism_t","kind":"constr","short":{"text":"Builds a monoid morphism from a function preserving the operation and the unit","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_morphism","base":"monoid_morphism","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"The set of monoid morphisms between two monoids, with equality that of the underlying functions","status":"ok"},"long":{"text":"The monoid morphisms between two monoids, as a set whose equality is inherited from the underlying functions through [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism_fun]]. These are the hom-sets of [[AffineConstructive.interfaces.bundled_algebra.monoid_cat_t]]. The categories of commutative monoids, strong-operation monoids, groups and abelian groups use the same hom-sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_monoid_morphism","base":"make_monoid_morphism","kind":"def","start":123,"body":null,"status":"ok","short":{"text":"Builds a monoid morphism from a function whose morphism property is found by resolution","status":"ok"},"long":{"text":"Builds an element of [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]] from a function between monoids. The proof of [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]] is found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.monoid_cat_t","base":"monoid_cat_t","kind":"def","start":125,"body":null,"status":"ok","short":{"text":"The data of the category of monoids and monoid morphisms","status":"ok"},"long":{"text":"The data of the category of monoids. The objects are given by [[AffineConstructive.interfaces.bundled_algebra.monoid]] and the hom-sets by [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid","base":"multiplicative_monoid","kind":"rec","start":126,"body":null,"status":"ok","short":{"text":"A multiplicative monoid as an object: a set with an associative multiplication and identity 1","status":"ok"},"long":{"text":"The multiplicative counterpart of [[AffineConstructive.interfaces.bundled_algebra.monoid]]. It packs a carrier set, a multiplication ·, an element 1, and the proof that these form a monoid ([[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid]]). It is the structure a rig or ring has under multiplication, written in that notation. Its morphisms are in [[AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_car","base":"multiplicative_monoid_car","kind":"proj","short":{"text":"The carrier set of a multiplicative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_op","base":"multiplicative_monoid_op","kind":"proj","short":{"text":"The multiplication of a multiplicative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_u","base":"multiplicative_monoid_u","kind":"proj","short":{"text":"The unit 1 of a multiplicative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_prop","base":"multiplicative_monoid_prop","kind":"proj","short":{"text":"The axioms of a multiplicative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_multiplicative_monoid","base":"Build_multiplicative_monoid","kind":"constr","short":{"text":"Builds a multiplicative monoid from a set, a multiplication, a one and the monoid axioms","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_multiplicative_monoid","base":"make_multiplicative_monoid","kind":"def","start":128,"body":null,"status":"ok","short":{"text":"Builds a multiplicative monoid from a set whose multiplication, one and axioms are found by resolution","status":"ok"},"long":{"text":"Builds a multiplicative monoid from a set alone. The multiplication, the element 1 and the proof of [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid]] are found by instance resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism_t","base":"multiplicative_monoid_morphism_t","kind":"rec","start":130,"body":null,"status":"ok","short":{"text":"A morphism of multiplicative monoids: a function preserving multiplication and one","status":"ok"},"long":{"text":"A morphism between multiplicative monoids: a function of the underlying sets with the proof that it preserves multiplication and 1 ([[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid_Morphism]]). Its equality as a set is given by [[AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism_fun","base":"multiplicative_monoid_morphism_fun","kind":"proj","short":{"text":"The underlying function of a morphism of multiplicative monoids","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism_prop","base":"multiplicative_monoid_morphism_prop","kind":"proj","short":{"text":"A morphism of multiplicative monoids preserves multiplication and one","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_multiplicative_monoid_morphism_t","base":"Build_multiplicative_monoid_morphism_t","kind":"constr","short":{"text":"Builds a morphism of multiplicative monoids from a function preserving multiplication and one","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism","base":"multiplicative_monoid_morphism","kind":"def","start":132,"body":null,"status":"ok","short":{"text":"The set of morphisms between two multiplicative monoids, with equality that of the underlying functions","status":"ok"},"long":{"text":"The morphisms between two multiplicative monoids, as a set whose equality is inherited from the underlying functions through [[AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism_fun]]. These are the hom-sets of [[AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_cat_t]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_multiplicative_monoid_morphism","base":"make_multiplicative_monoid_morphism","kind":"def","start":133,"body":null,"status":"ok","short":{"text":"Builds a morphism of multiplicative monoids from a function, its property found by resolution","status":"ok"},"long":{"text":"Builds an element of [[AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism]] from a function between multiplicative monoids. The proof of [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid_Morphism]] is found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_cat_t","base":"multiplicative_monoid_cat_t","kind":"def","start":135,"body":null,"status":"ok","short":{"text":"The data of the category of multiplicative monoids","status":"ok"},"long":{"text":"The data of the category of multiplicative monoids. The objects are given by [[AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid]] and the hom-sets by [[AffineConstructive.interfaces.bundled_algebra.multiplicative_monoid_morphism]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_op_monoid","base":"strong_op_monoid","kind":"rec","start":136,"body":null,"status":"ok","short":{"text":"A monoid with a strong operation, as an object","status":"ok"},"long":{"text":"A monoid whose operation is strong ([[AffineConstructive.interfaces.abstract_algebra.StrongOpMonoid]]). The operation of a monoid is a function on the tensor product X ⊗ X, so it respects the multiplicative equality of pairs. A strong operation also respects the cartesian equality of X × X, which is the stronger condition: if x ∙ y is apart from x' ∙ y', then x is apart from x' or y is apart from y', with an additive or. This record bundles such a monoid. It forgets to a plain [[AffineConstructive.interfaces.bundled_algebra.monoid]] by [[AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_as_monoid]], and its morphisms are the monoid morphisms.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_car","base":"strong_op_monoid_car","kind":"proj","short":{"text":"The carrier set of a strong-operation monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_op","base":"strong_op_monoid_op","kind":"proj","short":{"text":"The binary operation of a strong-operation monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_u","base":"strong_op_monoid_u","kind":"proj","short":{"text":"The unit of a strong-operation monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_prop","base":"strong_op_monoid_prop","kind":"proj","short":{"text":"The axioms of a strong-operation monoid: a monoid whose operation is strong","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_strong_op_monoid","base":"Build_strong_op_monoid","kind":"constr","short":{"text":"Builds a strong-operation monoid from a set, an operation, a unit and its axioms","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_strong_op_monoid","base":"make_strong_op_monoid","kind":"def","start":138,"body":null,"status":"ok","short":{"text":"Builds a strong-operation monoid from a set whose structure is found by resolution","status":"ok"},"long":{"text":"Builds a strong-operation monoid from a set alone. The operation, the unit and the proof of [[AffineConstructive.interfaces.abstract_algebra.StrongOpMonoid]] are found by instance resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_as_monoid","base":"strong_op_monoid_as_monoid","kind":"def","start":140,"body":null,"status":"ok","short":{"text":"The underlying monoid of a strong-operation monoid","status":"ok"},"long":{"text":"Forgets that the operation is strong: it sends a strong-operation monoid to the [[AffineConstructive.interfaces.bundled_algebra.monoid]] with the same carrier, operation and unit. It is a coercion and a canonical structure, so these monoids can be used wherever a monoid is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:strong_op_monoid_as_monoid","base":"coercion:strong_op_monoid_as_monoid","kind":"coercion","start":141,"body":null,"status":"ok","short":{"text":"A bundled monoid with strong operation can stand where a monoid is expected, via [[AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_as_monoid]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_morphism","base":"strong_op_monoid_morphism","kind":"def","start":143,"body":null,"status":"ok","short":{"text":"The set of morphisms between strong-operation monoids: the monoid morphisms","status":"ok"},"long":{"text":"The morphisms between two strong-operation monoids, defined as the [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]] set of the underlying monoids. Strength of the operation adds no condition on morphisms, so these monoids form a full subcategory of the monoids.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_cat_t","base":"strong_op_monoid_cat_t","kind":"def","start":144,"body":null,"status":"ok","short":{"text":"The data of the category of strong-operation monoids","status":"ok"},"long":{"text":"The data of the category of strong-operation monoids. The objects are given by [[AffineConstructive.interfaces.bundled_algebra.strong_op_monoid]] and the hom-sets by [[AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_morphism]], which are the monoid morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_monoid","base":"commutative_monoid","kind":"rec","start":145,"body":null,"status":"ok","short":{"text":"A commutative monoid as an object: a set with a commutative operation and its unit","status":"ok"},"long":{"text":"A commutative monoid as a single object. It packs a carrier set, a binary operation, a unit, and the proof of [[AffineConstructive.interfaces.abstract_algebra.CommutativeMonoid]]. It forgets to a [[AffineConstructive.interfaces.bundled_algebra.monoid]] by [[AffineConstructive.interfaces.bundled_algebra.commutative_monoid_as_monoid]], and its morphisms are the monoid morphisms ([[AffineConstructive.interfaces.bundled_algebra.commutative_monoid_morphism]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_monoid_car","base":"commutative_monoid_car","kind":"proj","short":{"text":"The carrier set of a commutative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_monoid_op","base":"commutative_monoid_op","kind":"proj","short":{"text":"The binary operation of a commutative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_monoid_u","base":"commutative_monoid_u","kind":"proj","short":{"text":"The unit of a commutative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_monoid_prop","base":"commutative_monoid_prop","kind":"proj","short":{"text":"The axioms of a commutative monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_commutative_monoid","base":"Build_commutative_monoid","kind":"constr","short":{"text":"Builds a commutative monoid from a set, an operation, a unit and its axioms","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_commutative_monoid","base":"make_commutative_monoid","kind":"def","start":147,"body":null,"status":"ok","short":{"text":"Builds a commutative monoid from a set whose operation, unit and axioms are found by resolution","status":"ok"},"long":{"text":"Builds a commutative monoid from a set alone. The operation, the unit and the proof of [[AffineConstructive.interfaces.abstract_algebra.CommutativeMonoid]] are found by instance resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_monoid_as_monoid","base":"commutative_monoid_as_monoid","kind":"def","start":149,"body":null,"status":"ok","short":{"text":"The underlying monoid of a commutative monoid","status":"ok"},"long":{"text":"Forgets commutativity: it sends a commutative monoid to the [[AffineConstructive.interfaces.bundled_algebra.monoid]] with the same carrier, operation and unit. It is a coercion and a canonical structure, so a commutative monoid can be used wherever a monoid is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:commutative_monoid_as_monoid","base":"coercion:commutative_monoid_as_monoid","kind":"coercion","start":150,"body":null,"status":"ok","short":{"text":"A bundled commutative monoid can stand where a monoid is expected, via [[AffineConstructive.interfaces.bundled_algebra.commutative_monoid_as_monoid]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_monoid_morphism","base":"commutative_monoid_morphism","kind":"def","start":152,"body":null,"status":"ok","short":{"text":"The set of morphisms between commutative monoids: the monoid morphisms of their underlying monoids","status":"ok"},"long":{"text":"The morphisms between two commutative monoids, defined as the [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]] set of the underlying monoids. Commutativity adds no condition on morphisms, so the commutative monoids form a full subcategory of the monoids.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.commutative_monoid_cat_t","base":"commutative_monoid_cat_t","kind":"def","start":153,"body":null,"status":"ok","short":{"text":"The category data of commutative monoids, with monoid morphisms as arrows","status":"ok"},"long":{"text":"The category data whose objects are bundled commutative monoids ([[AffineConstructive.interfaces.bundled_algebra.commutative_monoid]]) and whose arrows are the monoid morphisms between them ([[AffineConstructive.interfaces.bundled_algebra.commutative_monoid_morphism]]). Commutativity is a property of the objects only, so the arrows are those of [[AffineConstructive.interfaces.bundled_algebra.monoid_cat_t]], and the category of commutative monoids is a full subcategory of monoids.\n\nIt is declared canonical, so the category framework of `interfaces/cat.v` recognises the type of commutative monoids as the objects of a category; the identities and composition are those of the underlying functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid","base":"additive_non_com_monoid","kind":"rec","start":154,"body":null,"status":"ok","short":{"text":"A bundled additive monoid, not necessarily commutative: a set with + and 0 satisfying the monoid laws","status":"ok"},"long":{"text":"An object of the category of additive monoids that are not assumed commutative: a set together with an addition and a zero and the proof [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid]] that + is associative with 0 as two-sided identity. It is the same mathematical structure as [[AffineConstructive.interfaces.bundled_algebra.monoid]], written additively; the additive notation matters because the rig and ring hierarchy builds on it, and the additive group of a near-ring need not be abelian.\n\nThe record is the base of the additive side of the hierarchy: [[AffineConstructive.interfaces.bundled_algebra.additive_monoid]] and [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group]] coerce to it, and its morphisms, [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism]], are reused for both.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_car","base":"additive_non_com_monoid_car","kind":"proj","short":{"text":"The underlying set of a bundled additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_op","base":"additive_non_com_monoid_op","kind":"proj","short":{"text":"The addition of a bundled additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_u","base":"additive_non_com_monoid_u","kind":"proj","short":{"text":"The zero of a bundled additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_prop","base":"additive_non_com_monoid_prop","kind":"proj","short":{"text":"The monoid laws for + and 0 of a bundled additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_additive_non_com_monoid","base":"Build_additive_non_com_monoid","kind":"constr","short":{"text":"Builds a bundled additive monoid from a set, its addition, its zero and the monoid laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_additive_non_com_monoid","base":"make_additive_non_com_monoid","kind":"def","start":156,"body":null,"status":"ok","short":{"text":"Bundles a set with its addition and zero into an additive monoid, found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid]]: given a set M, it takes the addition, the zero and the proof of [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid]] from instances already declared on M, and packs them into the bundled object. It is how an unbundled additive monoid is turned into an object of its category, and how the coercions from richer structures ([[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_as_add_nc_mon]], [[AffineConstructive.interfaces.bundled_algebra.additive_monoid_as_add_nc_monoid]]) are defined.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism_t","base":"additive_non_com_monoid_morphism_t","kind":"rec","start":158,"body":null,"status":"ok","short":{"text":"A morphism of additive monoids: a function preserving addition and zero","status":"ok"},"long":{"text":"The type of arrows between two bundled additive monoids: a function of the underlying sets together with the proof [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] that it preserves addition and zero. As every function of sets ([[AffineConstructive.interfaces.set.func]]), it preserves equality, and so by the affine reading also inequality is reflected: it is strongly extensional.\n\nThis record is the raw type; the set of morphisms, with its equality, is [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism_fun","base":"additive_non_com_monoid_morphism_fun","kind":"proj","short":{"text":"The underlying function of a morphism of additive monoids","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism_prop","base":"additive_non_com_monoid_morphism_prop","kind":"proj","short":{"text":"The proof that a morphism of additive monoids preserves addition and zero","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_additive_non_com_monoid_morphism_t","base":"Build_additive_non_com_monoid_morphism_t","kind":"constr","short":{"text":"Builds a morphism of additive monoids from a function preserving addition and zero","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism","base":"additive_non_com_monoid_morphism","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"The set of morphisms between two additive monoids, equal when their functions are equal","status":"ok"},"long":{"text":"The hom-set of the category of additive monoids: the morphisms of [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism_t]], made into a set whose equality is that of the underlying functions. The preservation proof carries no information, so two morphisms are equal exactly when they agree as functions, and apart exactly when the functions are apart.\n\nThe same set serves as the hom-set of additive monoids, of non-commutative additive groups and of additive groups ([[AffineConstructive.interfaces.bundled_algebra.additive_monoid_morphism]], [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_morphism]], [[AffineConstructive.interfaces.bundled_algebra.additive_group_morphism]]): preserving + and 0 is the whole condition in each case, negation being preserved automatically in a group.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_additive_non_com_monoid_morphism","base":"make_additive_non_com_monoid_morphism","kind":"def","start":161,"body":null,"status":"ok","short":{"text":"Builds a morphism of additive monoids from a function, its preservation of + and 0 found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism]]: given a function f between the carriers of two additive monoids, it finds the proof of [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] for f by resolution and returns the bundled morphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_cat_t","base":"additive_non_com_monoid_cat_t","kind":"def","start":163,"body":null,"status":"ok","short":{"text":"The category data of additive monoids, not necessarily commutative, with their morphisms","status":"ok"},"long":{"text":"The category data whose objects are the bundled additive monoids ([[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid]]) and whose arrows are the maps preserving addition and zero ([[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism]]). Declared canonical, it lets the category framework see this type as a category, composition and identities being those of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_monoid","base":"additive_monoid","kind":"rec","start":164,"body":null,"status":"ok","short":{"text":"A commutative additive monoid: a set bundled with its addition, zero and the monoid laws","status":"ok"},"long":{"text":"An object of the category of commutative additive monoids. It is a carrier set together with an addition and a zero, and the proof [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]] that + is associative and commutative with 0 as its identity. Its morphisms are the maps preserving + and 0, collected in [[AffineConstructive.interfaces.bundled_algebra.additive_monoid_morphism]], and objects are built with [[AffineConstructive.interfaces.bundled_algebra.make_additive_monoid]]. It coerces to [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid]] by [[AffineConstructive.interfaces.bundled_algebra.additive_monoid_as_add_nc_monoid]], which forgets commutativity.\n\nOne example is an additive abelian group with its negation forgotten, [[AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_monoid]]. The free commutative monoids take their values in a commutative additive monoid when they are evaluated: [[AffineConstructive.implementations.free.com_monoids.eval.eval_spec]] computes the evaluation term by term, as a sum of products in such a monoid.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.additive_monoid_car","base":"additive_monoid_car","kind":"proj","short":{"text":"The carrier set of a commutative additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_monoid_op","base":"additive_monoid_op","kind":"proj","short":{"text":"The addition of a commutative additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_monoid_u","base":"additive_monoid_u","kind":"proj","short":{"text":"The zero of a commutative additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_monoid_prop","base":"additive_monoid_prop","kind":"proj","short":{"text":"The commutative additive monoid laws of a commutative additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_additive_monoid","base":"Build_additive_monoid","kind":"constr","short":{"text":"Builds a commutative additive monoid from a set, an addition, a zero and the monoid laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_additive_monoid","base":"make_additive_monoid","kind":"def","start":166,"body":null,"status":"ok","short":{"text":"Bundles a set with its addition and zero into a commutative additive monoid, found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.additive_monoid]]: for a set M on which an addition, a zero and the class [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]] are already declared, it packs them into the bundled object. The coercion [[AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_monoid]] is defined through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_monoid_as_add_nc_monoid","base":"additive_monoid_as_add_nc_monoid","kind":"def","start":168,"body":null,"status":"ok","short":{"text":"A commutative additive monoid regarded as an additive monoid, forgetting commutativity","status":"ok"},"long":{"text":"The forgetful passage from commutative additive monoids to additive monoids not assumed commutative: the same set, addition and zero, with the weaker laws [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid]] obtained from [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]] by resolution. It is a coercion and a canonical structure, so a commutative additive monoid can be used wherever an [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid]] is expected, in particular as the domain and codomain of [[AffineConstructive.interfaces.bundled_algebra.additive_monoid_morphism]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:additive_monoid_as_add_nc_monoid","base":"coercion:additive_monoid_as_add_nc_monoid","kind":"coercion","start":169,"body":null,"status":"ok","short":{"text":"A bundled commutative additive monoid can stand where an additive monoid, not necessarily commutative, is expected, via [[AffineConstructive.interfaces.bundled_algebra.additive_monoid_as_add_nc_monoid]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_monoid_morphism","base":"additive_monoid_morphism","kind":"def","start":171,"body":null,"status":"ok","short":{"text":"The set of morphisms of commutative additive monoids: maps preserving + and 0","status":"ok"},"long":{"text":"The hom-set of the category of commutative additive monoids. Commutativity adds no condition on maps, so it is defined as the set [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism]] of the underlying additive monoids: functions preserving addition and zero, equal when equal as functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_additive_monoid_morphism","base":"make_additive_monoid_morphism","kind":"def","start":172,"body":null,"status":"ok","short":{"text":"Builds a morphism of commutative additive monoids from a proof that a map preserves + and 0","status":"ok"},"long":{"text":"Packs a function between commutative additive monoids, with its proof of [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]], into an element of [[AffineConstructive.interfaces.bundled_algebra.additive_monoid_morphism]]. Unlike [[AffineConstructive.interfaces.bundled_algebra.make_additive_non_com_monoid_morphism]] the function is read off the given proof rather than supplied first.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_monoid_cat_t","base":"additive_monoid_cat_t","kind":"def","start":173,"body":null,"status":"ok","short":{"text":"The category data of commutative additive monoids with their morphisms","status":"ok"},"long":{"text":"The category data whose objects are the bundled commutative additive monoids ([[AffineConstructive.interfaces.bundled_algebra.additive_monoid]]) and whose arrows are [[AffineConstructive.interfaces.bundled_algebra.additive_monoid_morphism]]. It is a full subcategory of [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_cat_t]]; declared canonical, so the category framework recognises it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.group","base":"group","kind":"rec","start":174,"body":null,"status":"ok","short":{"text":"A bundled group: a set with operation ∙, unit and inverse satisfying the group laws","status":"ok"},"long":{"text":"An object of the category of groups, in multiplicative notation: a set with a binary operation, a unit and an inversion, and the proof [[AffineConstructive.interfaces.abstract_algebra.Group]] that the operation is associative, the unit a two-sided identity and x⁻¹ a two-sided inverse of x.\n\nA group morphism is a monoid morphism, so the record coerces to [[AffineConstructive.interfaces.bundled_algebra.monoid]] by [[AffineConstructive.interfaces.bundled_algebra.group_as_monoid]] and its hom-sets are those of monoids ([[AffineConstructive.interfaces.bundled_algebra.group_morphism]]); preservation of inverses follows from preservation of the operation and unit.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.group_car","base":"group_car","kind":"proj","short":{"text":"The underlying set of a bundled group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.group_op","base":"group_op","kind":"proj","short":{"text":"The binary operation of a bundled group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.group_u","base":"group_u","kind":"proj","short":{"text":"The unit of a bundled group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.group_i","base":"group_i","kind":"proj","short":{"text":"The inversion of a bundled group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.group_prop","base":"group_prop","kind":"proj","short":{"text":"The group laws of a bundled group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_group","base":"Build_group","kind":"constr","short":{"text":"Builds a bundled group from a set, its operation, unit, inversion and the group laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_group","base":"make_group","kind":"def","start":176,"body":null,"status":"ok","short":{"text":"Bundles a set with its operation, unit and inverse into a group, found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.group]]: for a set G on which an operation, a unit, an inversion and the class [[AffineConstructive.interfaces.abstract_algebra.Group]] are declared, it packs them into the bundled object. The coercion [[AffineConstructive.interfaces.bundled_algebra.ab_group_as_group]] is defined through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.group_as_monoid","base":"group_as_monoid","kind":"def","start":178,"body":null,"status":"ok","short":{"text":"A group regarded as a monoid, forgetting the inverse","status":"ok"},"long":{"text":"The forgetful passage from groups to monoids: the same set, operation and unit, with the monoid laws obtained from [[AffineConstructive.interfaces.abstract_algebra.Group]] by resolution. As a coercion and canonical structure it lets a group stand wherever a [[AffineConstructive.interfaces.bundled_algebra.monoid]] is expected, and it is what makes [[AffineConstructive.interfaces.bundled_algebra.group_morphism]] the monoid hom-set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:group_as_monoid","base":"coercion:group_as_monoid","kind":"coercion","start":179,"body":null,"status":"ok","short":{"text":"A bundled group can stand where a monoid is expected, via [[AffineConstructive.interfaces.bundled_algebra.group_as_monoid]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.group_morphism","base":"group_morphism","kind":"def","start":181,"body":null,"status":"ok","short":{"text":"The set of group morphisms: the monoid morphisms between the underlying monoids","status":"ok"},"long":{"text":"The hom-set of the category of groups, defined as [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]] of the underlying monoids: functions preserving the operation and the unit, equal when equal as functions. No condition on inverses is needed, since in a group f(x⁻¹) is forced to be the inverse of f x; the category of groups is thereby a full subcategory of monoids.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.group_cat_t","base":"group_cat_t","kind":"def","start":182,"body":null,"status":"ok","short":{"text":"The category data of groups with group morphisms","status":"ok"},"long":{"text":"The category data whose objects are bundled groups ([[AffineConstructive.interfaces.bundled_algebra.group]]) and whose arrows are [[AffineConstructive.interfaces.bundled_algebra.group_morphism]]. Declared canonical, so the category framework recognises the type of groups as a category.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group","base":"ab_group","kind":"rec","start":183,"body":null,"status":"ok","short":{"text":"A bundled abelian group: a group, in multiplicative notation, whose operation is commutative","status":"ok"},"long":{"text":"An object of the category of abelian groups written multiplicatively: a set with operation, unit and inversion and the proof [[AffineConstructive.interfaces.abstract_algebra.AbGroup]] that it is a group with commutative operation. It coerces both to [[AffineConstructive.interfaces.bundled_algebra.group]] ([[AffineConstructive.interfaces.bundled_algebra.ab_group_as_group]]) and directly to [[AffineConstructive.interfaces.bundled_algebra.monoid]] ([[AffineConstructive.interfaces.bundled_algebra.ab_group_as_monoid]]); its morphisms are monoid morphisms. The additively written counterpart, used under rings, is [[AffineConstructive.interfaces.bundled_algebra.additive_group]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_car","base":"ab_group_car","kind":"proj","short":{"text":"The underlying set of a bundled abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_op","base":"ab_group_op","kind":"proj","short":{"text":"The binary operation of a bundled abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_u","base":"ab_group_u","kind":"proj","short":{"text":"The unit of a bundled abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_i","base":"ab_group_i","kind":"proj","short":{"text":"The inversion of a bundled abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_prop","base":"ab_group_prop","kind":"proj","short":{"text":"The abelian group laws of a bundled abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_ab_group","base":"Build_ab_group","kind":"constr","short":{"text":"Builds a bundled abelian group from a set, operation, unit, inversion and the laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_ab_group","base":"make_ab_group","kind":"def","start":185,"body":null,"status":"ok","short":{"text":"Bundles a set with operation, unit and inverse into an abelian group, found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.ab_group]]: for a set G on which an operation, a unit, an inversion and the class [[AffineConstructive.interfaces.abstract_algebra.AbGroup]] are declared, it packs them into the bundled object.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_as_monoid","base":"ab_group_as_monoid","kind":"def","start":187,"body":null,"status":"ok","short":{"text":"An abelian group regarded as a monoid, forgetting inverses and commutativity","status":"ok"},"long":{"text":"The forgetful passage from abelian groups directly to monoids: the abelian group repackaged by [[AffineConstructive.interfaces.bundled_algebra.make_monoid]] with its operation and unit, the monoid laws found by resolution. It is declared a canonical structure and a coercion, so a bundled abelian group stands where a monoid is expected in one step, alongside the route through [[AffineConstructive.interfaces.bundled_algebra.group]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_as_group","base":"ab_group_as_group","kind":"def","start":188,"body":null,"status":"ok","short":{"text":"An abelian group regarded as a group, forgetting commutativity","status":"ok"},"long":{"text":"The forgetful passage from abelian groups to groups: the same data with the group laws obtained from [[AffineConstructive.interfaces.abstract_algebra.AbGroup]] by resolution. As a coercion and canonical structure it lets an abelian group stand wherever a [[AffineConstructive.interfaces.bundled_algebra.group]] is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:ab_group_as_monoid","base":"coercion:ab_group_as_monoid","kind":"coercion","start":189,"body":null,"status":"ok","short":{"text":"A bundled abelian group can stand directly where a monoid is expected, via [[AffineConstructive.interfaces.bundled_algebra.ab_group_as_monoid]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:ab_group_as_group","base":"coercion:ab_group_as_group","kind":"coercion","start":190,"body":null,"status":"ok","short":{"text":"A bundled abelian group can stand where a group is expected, via [[AffineConstructive.interfaces.bundled_algebra.ab_group_as_group]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_morphism","base":"ab_group_morphism","kind":"def","start":193,"body":null,"status":"ok","short":{"text":"The set of morphisms of abelian groups: monoid morphisms between the underlying monoids","status":"ok"},"long":{"text":"The hom-set of the category of abelian groups, defined as [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]] of the underlying monoids, so that abelian groups form a full subcategory of groups and of monoids. Two morphisms are equal when their functions are.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.ab_group_cat_t","base":"ab_group_cat_t","kind":"def","start":194,"body":null,"status":"ok","short":{"text":"The category data of abelian groups with their morphisms","status":"ok"},"long":{"text":"The category data whose objects are bundled abelian groups ([[AffineConstructive.interfaces.bundled_algebra.ab_group]]) and whose arrows are [[AffineConstructive.interfaces.bundled_algebra.ab_group_morphism]]; declared canonical for the category framework.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group","base":"additive_non_com_group","kind":"rec","start":195,"body":null,"status":"ok","short":{"text":"A bundled additive group, not necessarily abelian: a set with +, 0 and negation","status":"ok"},"long":{"text":"An object of the category of groups written additively but not assumed commutative: a set with addition, zero and negation and the proof [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]] of the group laws. Such groups arise as the additive groups of near-rings, where commutativity of + is not part of the axioms.\n\nIt coerces to [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid]] by [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_as_add_nc_mon]], and its morphisms are the maps preserving + and 0 ([[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_morphism]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_car","base":"additive_non_com_group_car","kind":"proj","short":{"text":"The underlying set of a bundled additive group, not necessarily abelian","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_op","base":"additive_non_com_group_op","kind":"proj","short":{"text":"The addition of a bundled additive group, not necessarily abelian","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_u","base":"additive_non_com_group_u","kind":"proj","short":{"text":"The zero of a bundled additive group, not necessarily abelian","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_i","base":"additive_non_com_group_i","kind":"proj","short":{"text":"The negation of a bundled additive group, not necessarily abelian","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_prop","base":"additive_non_com_group_prop","kind":"proj","short":{"text":"The group laws for +, 0 and − of a bundled additive group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_additive_non_com_group","base":"Build_additive_non_com_group","kind":"constr","short":{"text":"Builds a bundled additive group from a set, +, 0, negation and the group laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_additive_non_com_group","base":"make_additive_non_com_group","kind":"def","start":197,"body":null,"status":"ok","short":{"text":"Bundles a set with +, 0 and negation into an additive group, found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group]]: for a set G on which addition, zero, negation and the class [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]] are declared, it packs them into the bundled object. The coercion [[AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_nc_group]] is defined through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_as_add_nc_mon","base":"additive_non_com_group_as_add_nc_mon","kind":"def","start":199,"body":null,"status":"ok","short":{"text":"An additive group regarded as an additive monoid, forgetting negation","status":"ok"},"long":{"text":"The forgetful passage from additive groups, not necessarily abelian, to additive monoids: the same set, addition and zero, with the monoid laws obtained by resolution. As a coercion and canonical structure it makes [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism]] available as the hom-set of additive groups.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:additive_non_com_group_as_add_nc_mon","base":"coercion:additive_non_com_group_as_add_nc_mon","kind":"coercion","start":200,"body":null,"status":"ok","short":{"text":"A bundled additive group, not necessarily abelian, can stand where an additive monoid is expected, via [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_as_add_nc_mon]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_morphism","base":"additive_non_com_group_morphism","kind":"def","start":202,"body":null,"status":"ok","short":{"text":"The set of morphisms of additive groups: maps preserving + and 0","status":"ok"},"long":{"text":"The hom-set of the category of additive groups not assumed abelian, defined as [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism]] of the underlying additive monoids. Preservation of negation is not required, since it follows from preservation of addition and zero.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_cat_t","base":"additive_non_com_group_cat_t","kind":"def","start":203,"body":null,"status":"ok","short":{"text":"The category data of additive groups, not necessarily abelian, with their morphisms","status":"ok"},"long":{"text":"The category data whose objects are [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group]] and whose arrows are [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group_morphism]]; declared canonical for the category framework.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group","base":"additive_group","kind":"rec","start":204,"body":null,"status":"ok","short":{"text":"A bundled abelian group written additively: a set with +, 0 and negation, + commutative","status":"ok"},"long":{"text":"An object of the category of abelian groups in additive notation: a set with addition, zero and negation and the proof [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]] that it is an abelian group under +. This is the additive structure of a ring.\n\nIt coerces both to [[AffineConstructive.interfaces.bundled_algebra.additive_monoid]] ([[AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_monoid]]) and to [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_group]] ([[AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_nc_group]]), the two ways of forgetting part of its structure; its morphisms are the maps preserving + and 0.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_car","base":"additive_group_car","kind":"proj","short":{"text":"The underlying set of a bundled additive abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_op","base":"additive_group_op","kind":"proj","short":{"text":"The addition of a bundled additive abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_u","base":"additive_group_u","kind":"proj","short":{"text":"The zero of a bundled additive abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_i","base":"additive_group_i","kind":"proj","short":{"text":"The negation of a bundled additive abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_prop","base":"additive_group_prop","kind":"proj","short":{"text":"The abelian group laws for +, 0 and − of a bundled additive group","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_algebra.Build_additive_group","base":"Build_additive_group","kind":"constr","short":{"text":"Builds a bundled additive abelian group from a set, +, 0, negation and the laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_algebra.make_additive_group","base":"make_additive_group","kind":"def","start":206,"body":null,"status":"ok","short":{"text":"Bundles a set with +, 0 and negation into an additive abelian group, found by resolution","status":"ok"},"long":{"text":"The working constructor of [[AffineConstructive.interfaces.bundled_algebra.additive_group]]: for a set G on which addition, zero, negation and the class [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]] are declared, it packs them into the bundled object.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_monoid","base":"additive_group_as_add_monoid","kind":"def","start":208,"body":null,"status":"ok","short":{"text":"An additive abelian group regarded as a commutative additive monoid, forgetting negation","status":"ok"},"long":{"text":"The forgetful passage from additive abelian groups to commutative additive monoids, a coercion and canonical structure built with [[AffineConstructive.interfaces.bundled_algebra.make_additive_monoid]]. It lets an additive group stand wherever an [[AffineConstructive.interfaces.bundled_algebra.additive_monoid]] is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:additive_group_as_add_monoid","base":"coercion:additive_group_as_add_monoid","kind":"coercion","start":209,"body":null,"status":"ok","short":{"text":"A bundled additive abelian group can stand where a commutative additive monoid is expected, via [[AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_monoid]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_nc_group","base":"additive_group_as_add_nc_group","kind":"def","start":211,"body":null,"status":"ok","short":{"text":"An additive abelian group regarded as an additive group, forgetting commutativity","status":"ok"},"long":{"text":"The forgetful passage from additive abelian groups to additive groups not assumed abelian, a coercion and canonical structure built with [[AffineConstructive.interfaces.bundled_algebra.make_additive_non_com_group]]. Together with [[AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_monoid]] it closes the square of forgetful maps among additive monoids and groups.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.coercion:additive_group_as_add_nc_group","base":"coercion:additive_group_as_add_nc_group","kind":"coercion","start":212,"body":null,"status":"ok","short":{"text":"A bundled additive abelian group can stand where an additive group, not necessarily abelian, is expected, via [[AffineConstructive.interfaces.bundled_algebra.additive_group_as_add_nc_group]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_morphism","base":"additive_group_morphism","kind":"def","start":214,"body":null,"status":"ok","short":{"text":"The set of morphisms of additive abelian groups: maps preserving + and 0","status":"ok"},"long":{"text":"The hom-set of the category of additive abelian groups, defined as [[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism]] of the underlying additive monoids; so additive abelian groups form a full subcategory of each of the additive categories above them.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_algebra.additive_group_cat_t","base":"additive_group_cat_t","kind":"def","start":215,"body":null,"status":"ok","short":{"text":"The category data of additive abelian groups with their morphisms","status":"ok"},"long":{"text":"The category data whose objects are [[AffineConstructive.interfaces.bundled_algebra.additive_group]] and whose arrows are [[AffineConstructive.interfaces.bundled_

onstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":8100,"e":8117,"lib":"AffineConstructive.interfaces.bundled_jections","name":"make_projected_op","kind":"abbrev","local":true},{"s":8120,"e":8139,"lib":"AffineConstructive.interfaces.bundled_jections","name":"tensor_bijection_op","kind":"canonstruc","local":true},{"s":8153,"e":8166,"lib":"AffineConstructive.theory.set","name":"tensor_map_op","kind":"def","local":false,"page":"../theory/set.html"},{"s":1892,"e":1895,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":3703,"e":3706,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":5435,"e":5438,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file packages functions together with their properties as elements of sets. An injection X ⇾ Y comes with its injectivity, and a surjection or bijection comes with a designated inverse and surjectivity or bijectivity. Each kind forms a set whose equality is pulled back from the function set. Each also forms a category, with identities and a composition that is itself a function of sets. Bijections, written X ≅ Y, can be inverted and can be viewed as injections and as surjections. The tensor product of maps preserves each kind. The symmetries, associators and unitors of the tensor product, and the symmetry and associators of the cartesian product, are registered as canonical bijections.","short":"Bundled injections, surjections and bijections between sets, with their categories and the structural bijections","items":[{"name":"AffineConstructive.interfaces.bundled_jections.injection_t","base":"injection_t","kind":"rec","start":6,"body":null,"status":"ok","short":{"text":"An injection from X to Y: a function together with the proof that it is injective","status":"ok"},"long":{"text":"The record packs a function X ⇾ Y with the fact that it is [[AffineConstructive.interfaces.set.Injective]]. Injectivity is a proposition, so an injection carries no data beyond its underlying function. The record is the carrier of the set [[AffineConstructive.interfaces.bundled_jections.injection]] of injections, whose equality comes from the underlying functions.\n\nThe function field is a coercion, so an injection can be applied and composed like a function. The injectivity field is recovered through the coercion chain whenever an injective function is needed, so lemmas stated for [[AffineConstructive.interfaces.set.Injective]] functions apply to bundled injections directly.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_jections.injection_fun","base":"injection_fun","kind":"proj","short":{"text":"The underlying function of an injection","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_jections.injection_prop","base":"injection_prop","kind":"proj","short":{"text":"The injectivity of an injection's underlying function","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_jections.Build_injection_t","base":"Build_injection_t","kind":"constr","short":{"text":"Builds an injection from an injective function","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_jections.injection","base":"injection","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The set of injections from X to Y, with equality that of the underlying functions","status":"ok"},"long":{"text":"The injections from X to Y form a set by projection along [[AffineConstructive.interfaces.bundled_jections.injection_fun]]: two injections are equal when their underlying functions are equal in the function set X ⇾ Y. Since injectivity is a proposition, nothing is lost by comparing only the functions, and the projection to functions is an injection itself ([[AffineConstructive.interfaces.bundled_jections.injection_to_func]]).\n\nThis set is the hom-set of the category [[AffineConstructive.interfaces.bundled_jections.injection_cat]] of sets and injections.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.make_injection","base":"make_injection","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"Builds an injection from a function, with its injectivity found by resolution","status":"ok"},"long":{"text":"The preferred constructor for injections. It takes the function explicitly and finds the proof that it is [[AffineConstructive.interfaces.set.Injective]] by resolution, so an injection whose injectivity is already known can be written as the function alone. Most of the canonical injections of the file are built this way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.injection_to_func","base":"injection_to_func","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The forgetful map from injections X to Y into functions X ⇾ Y, an injection","status":"ok"},"long":{"text":"Forgetting the injectivity proof sends an injection to its underlying function. Because the equality of [[AffineConstructive.interfaces.bundled_jections.injection]] is defined as that of the underlying functions, this map is injective, and the general fact that the projection of a projected set is injective makes it an injection. It exhibits the injections from X to Y as a subset of the functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.injection_cat_t","base":"injection_cat_t","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"The data of the category of sets and injections","status":"ok"},"long":{"text":"The objects are sets and the hom-set from X to Y is [[AffineConstructive.interfaces.bundled_jections.injection]] X Y. Identities ([[AffineConstructive.interfaces.bundled_jections.id_injection]]) and composition ([[AffineConstructive.interfaces.bundled_jections.injection_compose]]) are attached by resolution, and the laws are checked in [[AffineConstructive.interfaces.bundled_jections.injection_is_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.id_injection","base":"id_injection","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"The identity function on X, as an injection","status":"ok"},"long":{"text":"The identity function [[AffineConstructive.interfaces.set.id_fun]] is injective, so it bundles into an injection. It is declared canonical, so the identity, used where an injection is expected, is recognised as one, and it serves as the identity of [[AffineConstructive.interfaces.bundled_jections.injection_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.make_projected_op","base":"make_projected_op","kind":"abbrev","start":17,"body":null,"status":"ok","short":{"text":"Builds a function between projected sets from an operation lifting a known function","status":"ok"},"long":{"text":"Given an operation op on bundled objects whose underlying function is, by definition, the function f applied to the underlying functions, this produces op as a function between the sets. It preserves equality because f does: after projection, op is f, and the agreement holds by reflexivity. Equality of bundled objects is that of their projections, so nothing more has to be proved.\n\nThe file uses it to make composition and tensor pairing of injections, surjections and bijections into functions on tensor products of hom-sets, each inheriting extensionality from the matching operation on plain functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.make_compose_fun","base":"make_compose_fun","kind":"abbrev","start":18,"body":null,"status":"ok","short":{"text":"Makes a composition operation on bundled maps into a function, lifting composition of functions","status":"ok"},"long":{"text":"The instance of [[AffineConstructive.interfaces.bundled_jections.make_projected_op]] for composition. An operation that composes bundled maps by composing their underlying functions becomes a function on the tensor product of hom-sets, because composition of functions is one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.injection_compose_op","base":"injection_compose_op","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The composite of two injections, as an injection","status":"ok"},"long":{"text":"The composite g ∘ f of injections is injective, and resolution finds this fact, so the composite bundles into an injection. It is declared canonical: a composite of injections used where an injection is expected is recognised as one. [[AffineConstructive.interfaces.bundled_jections.injection_compose]] makes it into a function of its two arguments.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.injection_compose","base":"injection_compose","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"Composition of injections, as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"Composition is a function from injection Y Z ⊗ injection X Y to injection X Z. It is built from [[AffineConstructive.interfaces.bundled_jections.injection_compose_op]] with [[AffineConstructive.interfaces.bundled_jections.make_compose_fun]] and preserves equality because composition of functions does. The tensor product is used, as for composition of plain functions: equality of a pair of maps is the tensor of the equalities of its parts, each used once. This is the composition of [[AffineConstructive.interfaces.bundled_jections.injection_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.injection_is_cat","base":"injection_is_cat","kind":"inst","start":22,"body":[23,25],"status":"ok","short":{"text":"Sets and injections satisfy the category laws","status":"ok"},"proof":[{"text":"The category laws split into the two identity laws and associativity, together with the requirement that composition respect equality of injections. Two injections are equal when their underlying functions are. Composing with the identity, or reassociating a triple composite, gives a function that agrees with the original at every point by definition, so each law holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.interfaces.bundled_jections.injection_cat","base":"injection_cat","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"The category of sets and injections","status":"ok"},"long":{"text":"The category whose objects are sets and whose morphisms are injections, with the identity [[AffineConstructive.interfaces.bundled_jections.id_injection]] and composition [[AffineConstructive.interfaces.bundled_jections.injection_compose]]. The laws are those of functions, since equality of injections is equality of the underlying functions ([[AffineConstructive.interfaces.bundled_jections.injection_is_cat]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_t","base":"surjection_t","kind":"rec","start":27,"body":null,"status":"ok","short":{"text":"A surjection from X to Y: a function with a designated inverse that is a section of it","status":"ok"},"long":{"text":"Constructively, surjectivity is witnessed by data: the record packs a function X ⇾ Y with a designated [[AffineConstructive.interfaces.set.Inverse]] and the fact that the function is [[AffineConstructive.interfaces.set.Surjective]], which says that this inverse is a section, so every element of Y is the image of its chosen preimage. A surjection is therefore a split epimorphism, with the splitting carried along.\n\nThe set [[AffineConstructive.interfaces.bundled_jections.surjection]] of surjections compares only the underlying functions, so two surjections with different chosen inverses are equal when their functions are. The function, the inverse and the surjectivity are all coercions, recovered through the coercion chain whenever a lemma needs them.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_jections.surjection_fun","base":"surjection_fun","kind":"proj","short":{"text":"The underlying function of a surjection","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_inv","base":"surjection_inv","kind":"proj","short":{"text":"The designated inverse of a surjection","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_prop","base":"surjection_prop","kind":"proj","short":{"text":"The surjectivity of a surjection: its designated inverse is a section","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_jections.Build_surjection_t","base":"Build_surjection_t","kind":"constr","short":{"text":"Builds a surjection from a function, a designated inverse, and the proof that it is a section","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_jections.surjection","base":"surjection","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"The set of surjections from X to Y, with equality that of the underlying functions","status":"ok"},"long":{"text":"The surjections from X to Y form a set by projection along [[AffineConstructive.interfaces.bundled_jections.surjection_fun]]: two surjections are equal when their underlying functions are equal, whatever inverses they carry. Equality therefore depends only on the map, not on the chosen splitting.\n\nThis set is the hom-set of [[AffineConstructive.interfaces.bundled_jections.surjection_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.make_surjection","base":"make_surjection","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"Builds a surjection from a function, with its inverse and surjectivity found by resolution","status":"ok"},"long":{"text":"The preferred constructor for surjections. It takes the function explicitly and finds both its designated [[AffineConstructive.interfaces.set.Inverse]] and the proof that it is [[AffineConstructive.interfaces.set.Surjective]] by resolution, so a surjection whose structure is already known can be written as the function alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_to_func","base":"surjection_to_func","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"The forgetful map from surjections X to Y into functions X ⇾ Y, an injection","status":"ok"},"long":{"text":"Forgetting the inverse and the surjectivity sends a surjection to its underlying function. Equality of [[AffineConstructive.interfaces.bundled_jections.surjection]] is that of the underlying functions, so this map is injective, and it is packaged as an injection. Two surjections with different chosen inverses have the same image.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_cat_t","base":"surjection_cat_t","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"The data of the category of sets and surjections","status":"ok"},"long":{"text":"The objects are sets and the hom-set from X to Y is [[AffineConstructive.interfaces.bundled_jections.surjection]] X Y. Identities ([[AffineConstructive.interfaces.bundled_jections.id_surjection]]) and composition ([[AffineConstructive.interfaces.bundled_jections.surjection_compose]]) are attached by resolution, and the laws are checked in [[AffineConstructive.interfaces.bundled_jections.surjection_is_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.id_surjection","base":"id_surjection","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"The identity function on X, as a surjection","status":"ok"},"long":{"text":"The identity function [[AffineConstructive.interfaces.set.id_fun]] is its own inverse and is surjective, so it bundles into a surjection. It is declared canonical and serves as the identity of [[AffineConstructive.interfaces.bundled_jections.surjection_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_compose_op","base":"surjection_compose_op","kind":"def","start":39,"body":null,"status":"ok","short":{"text":"The composite of two surjections, as a surjection","status":"ok"},"long":{"text":"The composite g ∘ f of surjections has as designated inverse the composite of the inverses in the opposite order, and that inverse is a section. Resolution finds both, so the composite bundles into a surjection. It is declared canonical, and [[AffineConstructive.interfaces.bundled_jections.surjection_compose]] makes it into a function of its two arguments.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_compose","base":"surjection_compose","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"Composition of surjections, as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"Composition is a function from surjection Y Z ⊗ surjection X Y to surjection X Z. It is built from [[AffineConstructive.interfaces.bundled_jections.surjection_compose_op]] with [[AffineConstructive.interfaces.bundled_jections.make_compose_fun]] and preserves equality because composition of functions does. This is the composition of [[AffineConstructive.interfaces.bundled_jections.surjection_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_is_cat","base":"surjection_is_cat","kind":"inst","start":42,"body":[43,45],"status":"ok","short":{"text":"Sets and surjections satisfy the category laws","status":"ok"},"proof":[{"text":"The category laws split into the two identity laws and associativity, together with the requirement that composition respect equality of surjections. Two surjections are equal when their underlying functions are. Composing with the identity, or reassociating a triple composite, gives a function that agrees with the original at every point by definition, so each law holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.interfaces.bundled_jections.surjection_cat","base":"surjection_cat","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"The category of sets and surjections","status":"ok"},"long":{"text":"The category whose objects are sets and whose morphisms are surjections, with the identity [[AffineConstructive.interfaces.bundled_jections.id_surjection]] and composition [[AffineConstructive.interfaces.bundled_jections.surjection_compose]]. The laws are those of functions, since equality of surjections ignores the designated inverses ([[AffineConstructive.interfaces.bundled_jections.surjection_is_cat]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_t","base":"bijection_t","kind":"rec","start":47,"body":null,"status":"ok","short":{"text":"A bijection from X to Y: a function with a designated inverse, injective and surjective","status":"ok"},"long":{"text":"The record packs a function X ⇾ Y with a designated [[AffineConstructive.interfaces.set.Inverse]] and the fact that it is [[AffineConstructive.interfaces.set.Bijective]]: the function is injective and its inverse is a section. Together these make the designated inverse a two-sided inverse, so a bijection is an isomorphism of sets, written X ≅ Y.\n\nThe set [[AffineConstructive.interfaces.bundled_jections.bijection]] compares only the underlying functions. A bijection is also an injection and a surjection, through the coercions [[AffineConstructive.interfaces.bundled_jections.bijection_t_as_injection_t]] and [[AffineConstructive.interfaces.bundled_jections.bijection_t_as_surjection_t]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_jections.bijection_fun","base":"bijection_fun","kind":"proj","short":{"text":"The underlying function of a bijection","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_inv","base":"bijection_inv","kind":"proj","short":{"text":"The designated inverse of a bijection","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_prop","base":"bijection_prop","kind":"proj","short":{"text":"The bijectivity of a bijection: injective, with its designated inverse a section","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_jections.Build_bijection_t","base":"Build_bijection_t","kind":"constr","short":{"text":"Builds a bijection from a function, a designated inverse, and the proof of bijectivity","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection","base":"bijection","kind":"def","start":50,"body":null,"status":"ok","short":{"text":"The set X ≅ Y of bijections from X to Y, with equality that of the underlying functions","status":"ok"},"long":{"text":"The bijections from X to Y form a set by projection along [[AffineConstructive.interfaces.bundled_jections.bijection_fun]]: two bijections are equal when their underlying functions are equal. Since a bijective function determines its inverse up to equality, nothing is lost by ignoring the inverse.\n\nThe notation X ≅ Y stands for this set. It is the hom-set of [[AffineConstructive.interfaces.bundled_jections.bijection_cat]], the groupoid of sets and isomorphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.make_bijection","base":"make_bijection","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"Builds a bijection from a function, with its inverse and bijectivity found by resolution","status":"ok"},"long":{"text":"The preferred constructor for bijections. It takes the function explicitly and finds its designated [[AffineConstructive.interfaces.set.Inverse]] and the proof that it is [[AffineConstructive.interfaces.set.Bijective]] by resolution. The canonical bijections of the file, such as the symmetry and associativity isomorphisms of the tensor and cartesian products, are built this way from the corresponding functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_to_func","base":"bijection_to_func","kind":"def","start":54,"body":null,"status":"ok","short":{"text":"The forgetful map from bijections X ≅ Y into functions X ⇾ Y, an injection","status":"ok"},"long":{"text":"Forgetting the inverse and the bijectivity sends a bijection to its underlying function. Equality of [[AffineConstructive.interfaces.bundled_jections.bijection]] is that of the underlying functions, so this map is injective, and it is packaged as an injection.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_cat_t","base":"bijection_cat_t","kind":"def","start":59,"body":null,"status":"ok","short":{"text":"The data of the category of sets and bijections","status":"ok"},"long":{"text":"The objects are sets and the hom-set from X to Y is X ≅ Y. Identities ([[AffineConstructive.interfaces.bundled_jections.id_bijection]]) and composition ([[AffineConstructive.interfaces.bundled_jections.bijection_compose]]) are attached by resolution, and the laws are checked in [[AffineConstructive.interfaces.bundled_jections.bijection_is_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.id_bijection","base":"id_bijection","kind":"def","start":60,"body":null,"status":"ok","short":{"text":"The identity function on X, as a bijection","status":"ok"},"long":{"text":"The identity function [[AffineConstructive.interfaces.set.id_fun]] is its own inverse and is bijective, so it bundles into a bijection X ≅ X. It is declared canonical and serves as the identity of [[AffineConstructive.interfaces.bundled_jections.bijection_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_compose_op","base":"bijection_compose_op","kind":"def","start":62,"body":null,"status":"ok","short":{"text":"The composite of two bijections, as a bijection","status":"ok"},"long":{"text":"The composite g ∘ f of bijections is bijective, with the composite of the inverses in the opposite order as its inverse. Resolution finds both, so the composite bundles into a bijection X ≅ Z. It is declared canonical, and [[AffineConstructive.interfaces.bundled_jections.bijection_compose]] makes it into a function of its two arguments.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_compose","base":"bijection_compose","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"Composition of bijections, as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"Composition is a function from (Y ≅ Z) ⊗ (X ≅ Y) to X ≅ Z. It is built from [[AffineConstructive.interfaces.bundled_jections.bijection_compose_op]] with [[AffineConstructive.interfaces.bundled_jections.make_compose_fun]] and preserves equality because composition of functions does. This is the composition of [[AffineConstructive.interfaces.bundled_jections.bijection_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_is_cat","base":"bijection_is_cat","kind":"inst","start":65,"body":[66,68],"status":"ok","short":{"text":"Sets and bijections satisfy the category laws","status":"ok"},"proof":[{"text":"The category laws split into the two identity laws and associativity, together with the requirement that composition respect equality of bijections. Two bijections are equal when their underlying functions are. Composing with the identity, or reassociating a triple composite, gives a function that agrees with the original at every point by definition, so each law holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_cat","base":"bijection_cat","kind":"def","start":69,"body":null,"status":"ok","short":{"text":"The category of sets and bijections","status":"ok"},"long":{"text":"The category whose objects are sets and whose morphisms are bijections, with the identity [[AffineConstructive.interfaces.bundled_jections.id_bijection]] and composition [[AffineConstructive.interfaces.bundled_jections.bijection_compose]]. Every morphism has an inverse, [[AffineConstructive.interfaces.bundled_jections.invert_bijection]], so this is the groupoid of sets and isomorphisms. The laws are those of functions ([[AffineConstructive.interfaces.bundled_jections.bijection_is_cat]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.invert_bijection","base":"invert_bijection","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"The inverse of a bijection X ≅ Y, as a bijection Y ≅ X","status":"ok"},"long":{"text":"The designated inverse f⁻¹ of a bijection is itself bijective, with f as its inverse, so it bundles into a bijection in the other direction. It is declared canonical, so the inverse of a bijection used where a bijection is expected is recognised as one. This makes the category [[AffineConstructive.interfaces.bundled_jections.bijection_cat]] a groupoid.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_as_injection","base":"bijection_as_injection","kind":"def","start":71,"body":null,"status":"ok","short":{"text":"A bijection, regarded as an injection","status":"ok"},"long":{"text":"A bijective function is injective, so a bijection bundles into an injection with the same underlying function. It is declared canonical: a bijection used where an injection is expected is recognised as one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_as_surjection","base":"bijection_as_surjection","kind":"def","start":72,"body":null,"status":"ok","short":{"text":"A bijection, regarded as a surjection with the same designated inverse","status":"ok"},"long":{"text":"A bijective function is surjective, with the same designated inverse, so a bijection bundles into a surjection with the same underlying function. It is declared canonical: a bijection used where a surjection is expected is recognised as one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_t_as_injection_t","base":"bijection_t_as_injection_t","kind":"def","start":73,"body":null,"status":"ok","short":{"text":"The coercion from bijections to injections","status":"ok"},"long":{"text":"The record-level form of [[AffineConstructive.interfaces.bundled_jections.bijection_as_injection]], declared as a coercion, so a bijection can be passed wherever an injection is expected without being converted by hand.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.coercion:bijection_t_as_injection_t","base":"coercion:bijection_t_as_injection_t","kind":"coercion","start":74,"body":null,"status":"ok","short":{"text":"A bundled bijection stands as a bundled injection, through [[AffineConstructive.interfaces.bundled_jections.bijection_t_as_injection_t]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.bijection_t_as_surjection_t","base":"bijection_t_as_surjection_t","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"The coercion from bijections to surjections","status":"ok"},"long":{"text":"The record-level form of [[AffineConstructive.interfaces.bundled_jections.bijection_as_surjection]], declared as a coercion, so a bijection can be passed wherever a surjection is expected without being converted by hand.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.coercion:bijection_t_as_surjection_t","base":"coercion:bijection_t_as_surjection_t","kind":"coercion","start":76,"body":null,"status":"ok","short":{"text":"A bundled bijection stands as a bundled surjection, through [[AffineConstructive.interfaces.bundled_jections.bijection_t_as_surjection_t]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_swap_bijection","base":"tensor_swap_bijection","kind":"def","start":77,"body":null,"status":"ok","short":{"text":"The symmetry X ⊗ Y ≅ Y ⊗ X of the tensor product","status":"ok"},"long":{"text":"The swap function [[AffineConstructive.theory.set.tensor_swap]] on the tensor product is its own inverse, so it bundles into a bijection. It is declared canonical, so the swap is recognised as a bijection wherever one is expected. With the associativity and unit bijections it gives the symmetric monoidal structure of the tensor product up to isomorphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.prod_swap_bijection","base":"prod_swap_bijection","kind":"def","start":78,"body":null,"status":"ok","short":{"text":"The symmetry X × Y ≅ Y × X of the cartesian product","status":"ok"},"long":{"text":"The swap function [[AffineConstructive.theory.set.prod_swap]] on the cartesian product is its own inverse, so it bundles into a bijection. It is declared canonical, so the swap is recognised as a bijection wherever one is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_assoc_l_bijection","base":"tensor_assoc_l_bijection","kind":"def","start":79,"body":null,"status":"ok","short":{"text":"The associativity (X ⊗ Y) ⊗ Z ≅ X ⊗ (Y ⊗ Z) of the tensor product","status":"ok"},"long":{"text":"The reassociation [[AffineConstructive.theory.set.tensor_assoc_l]] has [[AffineConstructive.theory.set.tensor_assoc_r]] as its inverse, so it bundles into a bijection. It is declared canonical, so the reassociation is recognised as a bijection wherever one is expected. [[AffineConstructive.interfaces.bundled_jections.tensor_assoc_r_bijection]] is the bijection in the other direction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_assoc_r_bijection","base":"tensor_assoc_r_bijection","kind":"def","start":80,"body":null,"status":"ok","short":{"text":"The reassociation X ⊗ (Y ⊗ Z) ≅ (X ⊗ Y) ⊗ Z of the tensor product, as a bijection","status":"ok"},"long":{"text":"The map [[AffineConstructive.theory.set.tensor_assoc_r]], which regroups a triple from right-nested to left-nested form, bundled as a bijection by [[AffineConstructive.interfaces.bundled_jections.make_bijection]]. Its inverse and its bijectivity are found by resolution from the facts about the tensor product of sets; it is the inverse of [[AffineConstructive.interfaces.bundled_jections.tensor_assoc_l_bijection]].\n\nIt is declared canonical, so that wherever [[AffineConstructive.theory.set.tensor_assoc_r]] appears where a bijection is expected, this bundling is chosen without being named.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.prod_assoc_l_bijection","base":"prod_assoc_l_bijection","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"The reassociation (X × Y) × Z ≅ X × (Y × Z) of the cartesian product, as a bijection","status":"ok"},"long":{"text":"The map [[AffineConstructive.theory.set.prod_assoc_l]], which regroups a triple of the cartesian product from left-nested to right-nested form, bundled as a bijection by [[AffineConstructive.interfaces.bundled_jections.make_bijection]]. It is the cartesian counterpart of [[AffineConstructive.interfaces.bundled_jections.tensor_assoc_l_bijection]]: the same regrouping, for the product whose equality is the additive conjunction of the componentwise equalities rather than their tensor.\n\nAs a canonical structure it lets [[AffineConstructive.theory.set.prod_assoc_l]] be used wherever a bijection is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.prod_assoc_r_bijection","base":"prod_assoc_r_bijection","kind":"def","start":82,"body":null,"status":"ok","short":{"text":"The reassociation X × (Y × Z) ≅ (X × Y) × Z of the cartesian product, as a bijection","status":"ok"},"long":{"text":"The map [[AffineConstructive.theory.set.prod_assoc_r]], regrouping a triple of the cartesian product from right-nested to left-nested form, bundled as a bijection by [[AffineConstructive.interfaces.bundled_jections.make_bijection]]. It is the inverse of [[AffineConstructive.interfaces.bundled_jections.prod_assoc_l_bijection]] and the cartesian counterpart of [[AffineConstructive.interfaces.bundled_jections.tensor_assoc_r_bijection]].\n\nAs a canonical structure it lets [[AffineConstructive.theory.set.prod_assoc_r]] be used wherever a bijection is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_unit_l_bijection","base":"tensor_unit_l_bijection","kind":"def","start":83,"body":null,"status":"ok","short":{"text":"The left unit law 𝟏 ⊗ X ≅ X of the tensor product, as a bijection","status":"ok"},"long":{"text":"The projection [[AffineConstructive.theory.set.tensor_unit_l]] from 𝟏 ⊗ X to X, which discards the trivial left component, bundled as a bijection by [[AffineConstructive.interfaces.bundled_jections.make_bijection]]. Its inverse pairs an element with the point of the one-element set 𝟏; the two are mutually inverse because 𝟏 has a single element and its equality is truth, the unit of the tensor.\n\nTogether with [[AffineConstructive.interfaces.bundled_jections.tensor_unit_r_bijection]] and the associativity bijections it records the monoidal structure of sets under the tensor product, at the level of bijections.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_unit_r_bijection","base":"tensor_unit_r_bijection","kind":"def","start":84,"body":null,"status":"ok","short":{"text":"The right unit law X ⊗ 𝟏 ≅ X of the tensor product, as a bijection","status":"ok"},"long":{"text":"The projection [[AffineConstructive.theory.set.tensor_unit_r]] from X ⊗ 𝟏 to X, which discards the trivial right component, bundled as a bijection by [[AffineConstructive.interfaces.bundled_jections.make_bijection]]. It is the mirror image of [[AffineConstructive.interfaces.bundled_jections.tensor_unit_l_bijection]]: the one-element set 𝟏, whose equality is truth, is a unit for the tensor product on either side.\n\nAs a canonical structure it lets [[AffineConstructive.theory.set.tensor_unit_r]] be used wherever a bijection is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_swap_tail_bijection","base":"tensor_swap_tail_bijection","kind":"def","start":85,"body":null,"status":"ok","short":{"text":"The bijection X ⊗ Y ⊗ Z ≅ X ⊗ Z ⊗ Y exchanging the last two factors of a left-nested tensor","status":"ok"},"long":{"text":"The map [[AffineConstructive.theory.set.tensor_swap_tail]] packaged as a bijection by [[AffineConstructive.interfaces.bundled_jections.make_bijection]]. On a left-nested triple, it keeps the first component and exchanges the second and third. Its inverse is the same exchange with Y and Z renamed. Because it is declared canonical, unification recognises this map as an element of X ⊗ Y ⊗ Z ≅ X ⊗ Z ⊗ Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_injection_op","base":"tensor_injection_op","kind":"def","start":86,"body":null,"status":"ok","short":{"text":"The tensor product f₁ ⊗ f₂ : X₁ ⊗ X₂ → Y₁ ⊗ Y₂ of two injections, as an injection","status":"ok"},"long":{"text":"Given injections f₁ from X₁ to Y₁ and f₂ from X₂ to Y₂, the map acting componentwise on the tensor product, ⟨f₁, f₂⟩ (the tensor map), is again injective, and this definition bundles it by [[AffineConstructive.interfaces.bundled_jections.make_injection]]. Injectivity is found by resolution: if (f₁ x₁, f₂ x₂) equals (f₁ x₁', f₂ x₂') in Y₁ ⊗ Y₂, that is, f₁ x₁ = f₁ x₁' tensor f₂ x₂ = f₂ x₂', then each injectivity applies to its own factor, and the multiplicative equality of the tensor product is what lets each hypothesis be used once.\n\nThis is the operation on elements; [[AffineConstructive.interfaces.bundled_jections.tensor_injection]] is the same operation packaged as a function of sets. Being canonical, it lets a tensor map of injections be used directly as an injection.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_injection","base":"tensor_injection","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"The tensor product of injections, as a function of sets from pairs of injections to injections","status":"ok"},"long":{"text":"The operation [[AffineConstructive.interfaces.bundled_jections.tensor_injection_op]] made into a function from the tensor product of the sets of injections [[AffineConstructive.interfaces.bundled_jections.injection]] X₁ Y₁ ⊗ [[AffineConstructive.interfaces.bundled_jections.injection]] X₂ Y₂ to the set of injections of the tensor products. Equality on [[AffineConstructive.interfaces.bundled_jections.injection]] is the equality of the underlying functions, and the underlying function of [[AffineConstructive.interfaces.bundled_jections.tensor_injection_op]] f₁ f₂ is by definition the tensor map of f₁ and f₂; the operation therefore preserves equality because [[AffineConstructive.theory.set.tensor_map_op]] does, and this is how the function is built.\n\nThe domain is the tensor product of the hom-sets, as for [[AffineConstructive.theory.set.tensor_map_op]] and for composition [[AffineConstructive.interfaces.bundled_jections.injection_compose]]: the equality of two pairs of injections is f₁ = g₁ tensor f₂ = g₂, each used once to compare the tensor maps.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_surjection_op","base":"tensor_surjection_op","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"The tensor product f₁ ⊗ f₂ : X₁ ⊗ X₂ → Y₁ ⊗ Y₂ of two surjections, as a surjection","status":"ok"},"long":{"text":"Given surjections f₁ from X₁ to Y₁ and f₂ from X₂ to Y₂, the tensor map ⟨f₁, f₂⟩ is a surjection, bundled by [[AffineConstructive.interfaces.bundled_jections.make_surjection]]. A surjection here carries a designated inverse which is a section; the designated inverse of the tensor map is the tensor map of the two designated inverses, and it is a section because each component is. Both the inverse and the surjectivity are found by resolution.\n\nThis is the operation on elements; [[AffineConstructive.interfaces.bundled_jections.tensor_surjection]] packages it as a function of sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_surjection","base":"tensor_surjection","kind":"def","start":89,"body":null,"status":"ok","short":{"text":"The tensor product of surjections, as a function of sets from pairs of surjections to surjections","status":"ok"},"long":{"text":"The operation [[AffineConstructive.interfaces.bundled_jections.tensor_surjection_op]] made into a function from [[AffineConstructive.interfaces.bundled_jections.surjection]] X₁ Y₁ ⊗ [[AffineConstructive.interfaces.bundled_jections.surjection]] X₂ Y₂ to the set of surjections between the tensor products. Since equality on [[AffineConstructive.interfaces.bundled_jections.surjection]] is the equality of the underlying functions, and the underlying function of the result is the tensor map of the arguments, the operation preserves equality because [[AffineConstructive.theory.set.tensor_map_op]] does.\n\nIt is the analogue for surjections of [[AffineConstructive.interfaces.bundled_jections.tensor_injection]], with the same tensor domain.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_bijection_op","base":"tensor_bijection_op","kind":"def","start":90,"body":null,"status":"ok","short":{"text":"The tensor product f₁ ⊗ f₂ : X₁ ⊗ X₂ ≅ Y₁ ⊗ Y₂ of two bijections, as a bijection","status":"ok"},"long":{"text":"Given bijections f₁ : X₁ ≅ Y₁ and f₂ : X₂ ≅ Y₂, the tensor map ⟨f₁, f₂⟩ is a bijection, bundled by [[AffineConstructive.interfaces.bundled_jections.make_bijection]]; its designated inverse is the tensor map of the inverses, and injectivity and surjectivity hold factor by factor, as for [[AffineConstructive.interfaces.bundled_jections.tensor_injection_op]] and [[AffineConstructive.interfaces.bundled_jections.tensor_surjection_op]].\n\nThis makes the tensor product of sets functorial on bijections: together with the reassociation, unit and swap bijections of this file it shows that bijections respect the monoidal structure of sets. [[AffineConstructive.interfaces.bundled_jections.tensor_bijection]] packages it as a function of sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.bundled_jections.tensor_bijection","base":"tensor_bijection","kind":"def","start":91,"body":null,"status":"ok","short":{"text":"The tensor product of bijections, as a function of sets from pairs of bijections to bijections","status":"ok"},"long":{"text":"The operation [[AffineConstructive.interfaces.bundled_jections.tensor_bijection_op]] made into a function from (X₁ ≅ Y₁) ⊗ (X₂ ≅ Y₂) to X₁ ⊗ X₂ ≅ Y₁ ⊗ Y₂. Equality on [[AffineConstructive.interfaces.bundled_jections.bijection]] is the equality of the underlying functions, and the underlying function of the result is the tensor map of the arguments, so the operation preserves equality because [[AffineConstructive.theory.set.tensor_map_op]] does.\n\nIt is the analogue for bijections of [[AffineConstructive.interfaces.bundled_jections.tensor_injection]] and [[AffineConstructive.interfaces.bundled_jections.tensor_surjection]], with the domain a tensor product as for [[AffineConstructive.interfaces.bundled_jections.bijection_compose]].","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.projected_set":{"page":"../theory/projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.interfaces.cat":{"page":"cat.html","short":"Minimal categories with affine hom-sets, and the category of affine sets","summary":"This file sets up a minimal notion of category in which the objects form a type and the hom-sets are affine sets, so equality of morphisms is an affine equality, carrying apartness as well. It separates the data ([[cat_t]]) from the operations ([[Id]] and [[Compose]]) and from the laws ([[IsCat]]), then packages them in the bundled [[cat]]. Composition is a function out of the tensor of hom-sets, so it is required to be extensional only in the multiplicative sense. The main instance is [[𝐒𝐞𝐭]], with affine sets as objects and the function sets of interfaces/set.v as hom-sets, and [[set_IsCat]] proves its laws."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."}},"constants":null}</script>

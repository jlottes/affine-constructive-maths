le defines one-field records, each holding a single operation or structure: an order relation ([[AffineConstructive.interfaces.bundled_notation.has_le]]); a monoid unit, zero, one, top or bottom element; a binary operation, addition, multiplication, meet or join; an inversion or negation; or a decision procedure for the equality of a set ([[AffineConstructive.interfaces.bundled_notation.has_dec_eq]]). The constructors of all but the last are coercions. Global hints at priority 4 let instance resolution recover the operation: given a goal such as `Plus X`, they strip the coercions from X to reach the term underneath and apply the record's projection to it. The module `definition_hints` adds fallback hints at priority 8 that take the operation from a record found among the hypotheses in context. They cover the unit, zero, one, the binary operation, inversion, addition, negation, multiplication and decidable equality.","short":"One-field records holding an operation, and hints for resolution to read it back","items":[{"name":"AffineConstructive.interfaces.bundled_notation.has_le","base":"has_le","kind":"rec","start":3,"body":null,"status":"ok","short":{"text":"A record holding one order relation on a type, read back by resolution through op_le","status":"ok"},"long":{"text":"The record `has_le T` holds one field, an order relation [[AffineConstructive.interfaces.relation_notation.Le]] on the type T. It is stated over a bare type, not over a [[AffineConstructive.interfaces.set.set]], as the class [[AffineConstructive.interfaces.relation_notation.Le]] is.\n\nResolution reads the order back with [[AffineConstructive.interfaces.bundled_notation.op_le]]: when it needs the order of a type T, a hint of this file strips the coercions from T to reach the term underneath and applies [[AffineConstructive.interfaces.bundled_notation.op_le]] to it. The constructor [[AffineConstructive.interfaces.bundled_notation.HasLe]] is a coercion, so an order relation can stand where the record is expected. Unlike most of the file's records, it has no counterpart among the lower-priority hints of the `definition_hints` module.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_le","base":"op_le","kind":"proj","short":{"text":"The order relation held by a has_le record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasLe","base":"HasLe","kind":"constr","short":{"text":"Builds a has_le record from an order relation on a type; a coercion","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_mon_unit","base":"has_mon_unit","kind":"rec","start":4,"body":null,"status":"ok","short":{"text":"A set packaged with a monoid unit, so a bundled structure can carry its unit","status":"ok"},"long":{"text":"The record `has_mon_unit X` holds one field, a monoid unit [[AffineConstructive.interfaces.algebra_notation.MonUnit]] on the set X. It is one of a family of single-field wrappers, one for each operation of the algebraic hierarchy. Each wrapper lets a bundled structure, a term that packs a set with its operations, carry that operation and give it back to instance resolution.\n\nA bundled monoid that coerces to `has_mon_unit` supplies its unit as follows. When resolution needs the unit of a set that is the image of the bundled term under coercions, it strips the coercions and applies [[AffineConstructive.interfaces.bundled_notation.op_mon_unit]] to the term. Within a definition that assumes a hypothesis of type `has_mon_unit X`, the lower-priority hints of `definition_hints` find the unit in that hypothesis.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_mon_unit","base":"op_mon_unit","kind":"proj","short":{"text":"The monoid unit carried by a has_mon_unit record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasMonUnit","base":"HasMonUnit","kind":"constr","short":{"text":"Builds a has_mon_unit record from a monoid unit on a set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_zero","base":"has_zero","kind":"rec","start":5,"body":null,"status":"ok","short":{"text":"A set packaged with a zero element, so a bundled structure can carry its zero","status":"ok"},"long":{"text":"The record `has_zero X` holds one field, a zero element [[AffineConstructive.interfaces.algebra_notation.Zero]] of the set X. A bundled additive structure that coerces to it carries its zero along. Instance resolution recovers the zero of a set built by coercion from such a structure: it strips the coercions and applies [[AffineConstructive.interfaces.bundled_notation.op_zero]]. Inside a definition, a hypothesis `has_zero X` supplies the zero of X through the hints of `definition_hints`.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_zero","base":"op_zero","kind":"proj","short":{"text":"The zero element carried by a has_zero record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasZero","base":"HasZero","kind":"constr","short":{"text":"Builds a has_zero record from a zero element of a set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_one","base":"has_one","kind":"rec","start":6,"body":null,"status":"ok","short":{"text":"A set packaged with a unit element 1, so a bundled structure can carry its one","status":"ok"},"long":{"text":"The record `has_one X` holds one field, a unit element [[AffineConstructive.interfaces.algebra_notation.One]] of the set X. A bundled multiplicative structure, a ring for example, carries its 1 through this record. Instance resolution recovers the 1 of a set built by coercion from such a structure with [[AffineConstructive.interfaces.bundled_notation.op_one]]. Inside a definition, a hypothesis `has_one X` supplies the 1 of X through the hints of `definition_hints`.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_one","base":"op_one","kind":"proj","short":{"text":"The unit element carried by a has_one record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasOne","base":"HasOne","kind":"constr","short":{"text":"Builds a has_one record from a unit element of a set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_top","base":"has_top","kind":"rec","start":7,"body":null,"status":"ok","short":{"text":"A record holding one top element of a set, read back by resolution through op_top","status":"ok"},"long":{"text":"The record `has_top X` holds one field, a top element [[AffineConstructive.interfaces.algebra_notation.Top]] of the set X. When resolution needs the top of a set, a hint of this file strips the coercions from the set to reach the term underneath and applies [[AffineConstructive.interfaces.bundled_notation.op_top]] to it. The constructor [[AffineConstructive.interfaces.bundled_notation.HasTop]] is a coercion, so a top element can stand where the record is expected. The record has no counterpart among the hints of the `definition_hints` module.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_top","base":"op_top","kind":"proj","short":{"text":"The top element held by a has_top record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasTop","base":"HasTop","kind":"constr","short":{"text":"Builds a has_top record from a top element of a set; a coercion","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_bottom","base":"has_bottom","kind":"rec","start":8,"body":null,"status":"ok","short":{"text":"A record holding one bottom element of a set, read back by resolution through op_bottom","status":"ok"},"long":{"text":"The record `has_bottom X` holds one field, a bottom element [[AffineConstructive.interfaces.algebra_notation.Bottom]] of the set X. It is the dual of [[AffineConstructive.interfaces.bundled_notation.has_top]]. When resolution needs the bottom of a set, a hint of this file strips the coercions from the set to reach the term underneath and applies [[AffineConstructive.interfaces.bundled_notation.op_bottom]] to it. The constructor [[AffineConstructive.interfaces.bundled_notation.HasBottom]] is a coercion, so a bottom element can stand where the record is expected.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_bottom","base":"op_bottom","kind":"proj","short":{"text":"The bottom element held by a has_bottom record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasBottom","base":"HasBottom","kind":"constr","short":{"text":"Builds a has_bottom record from a bottom element of a set; a coercion","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_sg_op","base":"has_sg_op","kind":"rec","start":9,"body":null,"status":"ok","short":{"text":"A set packaged with a binary operation, so a bundled semigroup can carry its operation","status":"ok"},"long":{"text":"The record `has_sg_op X` holds one field, a semigroup operation [[AffineConstructive.interfaces.algebra_notation.SgOp]] on the set X: a function from the tensor X ⊗ X to X. A bundled semigroup, monoid or group carries its operation through this record. Instance resolution recovers the operation of a set built by coercion from such a structure with [[AffineConstructive.interfaces.bundled_notation.op_sg_op]]. Inside a definition, a hypothesis `has_sg_op X` supplies the operation through the hints of `definition_hints`.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_sg_op","base":"op_sg_op","kind":"proj","short":{"text":"The binary operation carried by a has_sg_op record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasSgOp","base":"HasSgOp","kind":"constr","short":{"text":"Builds a has_sg_op record from a binary operation on a set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_inv","base":"has_inv","kind":"rec","start":10,"body":null,"status":"ok","short":{"text":"A set packaged with an inversion, so a bundled group can carry its inverse","status":"ok"},"long":{"text":"The record `has_inv X` holds one field, an inversion [[AffineConstructive.interfaces.algebra_notation.Inv]] on the set X. A bundled group carries its inverse through this record. Instance resolution recovers the inversion of a set built by coercion from such a structure with [[AffineConstructive.interfaces.bundled_notation.op_inv]]. Inside a definition, a hypothesis `has_inv X` supplies the inversion through the hints of `definition_hints`.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_inv","base":"op_inv","kind":"proj","short":{"text":"The inversion carried by a has_inv record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasInv","base":"HasInv","kind":"constr","short":{"text":"Builds a has_inv record from an inversion on a set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_plus","base":"has_plus","kind":"rec","start":11,"body":null,"status":"ok","short":{"text":"A set packaged with an addition, so a bundled structure can carry its addition","status":"ok"},"long":{"text":"The record `has_plus X` holds one field, an addition [[AffineConstructive.interfaces.algebra_notation.Plus]] on the set X: a function from X ⊗ X to X. A bundled additive group or ring carries its addition through this record. Instance resolution recovers the addition of a set built by coercion from such a structure with [[AffineConstructive.interfaces.bundled_notation.op_plus]]. Inside a definition, a hypothesis `has_plus X` supplies the addition through the hints of `definition_hints`.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_plus","base":"op_plus","kind":"proj","short":{"text":"The addition carried by a has_plus record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasPlus","base":"HasPlus","kind":"constr","short":{"text":"Builds a has_plus record from an addition on a set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_mult","base":"has_mult","kind":"rec","start":12,"body":null,"status":"ok","short":{"text":"A set packaged with a multiplication, so a bundled structure can carry its multiplication","status":"ok"},"long":{"text":"The record `has_mult X` holds one field, a multiplication [[AffineConstructive.interfaces.algebra_notation.Mult]] on the set X: a function from X ⊗ X to X. A bundled ring carries its multiplication through this record. Instance resolution recovers the multiplication of a set built by coercion from such a structure with [[AffineConstructive.interfaces.bundled_notation.op_mult]]. Inside a definition, a hypothesis `has_mult X` supplies the multiplication through the hints of `definition_hints`.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_mult","base":"op_mult","kind":"proj","short":{"text":"The multiplication carried by a has_mult record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasMult","base":"HasMult","kind":"constr","short":{"text":"Builds a has_mult record from a multiplication on a set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_negate","base":"has_negate","kind":"rec","start":13,"body":null,"status":"ok","short":{"text":"A set packaged with a negation, so a bundled additive group can carry its negation","status":"ok"},"long":{"text":"The record `has_negate X` holds one field, a negation [[AffineConstructive.interfaces.algebra_notation.Negate]] on the set X: the additive inverse. A bundled additive group or ring carries its negation through this record. Instance resolution recovers the negation of a set built by coercion from such a structure with [[AffineConstructive.interfaces.bundled_notation.op_negate]]. Inside a definition, a hypothesis `has_negate X` supplies the negation through the hints of `definition_hints`.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_negate","base":"op_negate","kind":"proj","short":{"text":"The negation carried by a has_negate record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasNegate","base":"HasNegate","kind":"constr","short":{"text":"Builds a has_negate record from a negation on a set","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_meet","base":"has_meet","kind":"rec","start":14,"body":null,"status":"ok","short":{"text":"A record holding one meet on a set, read back by resolution through op_meet","status":"ok"},"long":{"text":"The record `has_meet X` holds one field, a meet [[AffineConstructive.interfaces.algebra_notation.Meet]] on the set X, a function from X ⊗ X to X. When resolution needs the meet of a set, a hint of this file strips the coercions from the set to reach the term underneath and applies [[AffineConstructive.interfaces.bundled_notation.op_meet]] to it. The constructor [[AffineConstructive.interfaces.bundled_notation.HasMeet]] is a coercion, so a meet can stand where the record is expected.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_meet","base":"op_meet","kind":"proj","short":{"text":"The meet held by a has_meet record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasMeet","base":"HasMeet","kind":"constr","short":{"text":"Builds a has_meet record from a meet on a set; a coercion","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_join","base":"has_join","kind":"rec","start":15,"body":null,"status":"ok","short":{"text":"A record holding one join on a set, read back by resolution through op_join","status":"ok"},"long":{"text":"The record `has_join X` holds one field, a join [[AffineConstructive.interfaces.algebra_notation.Join]] on the set X, a function from X ⊗ X to X. It is the dual of [[AffineConstructive.interfaces.bundled_notation.has_meet]]. When resolution needs the join of a set, a hint of this file strips the coercions from the set to reach the term underneath and applies [[AffineConstructive.interfaces.bundled_notation.op_join]] to it. The constructor [[AffineConstructive.interfaces.bundled_notation.HasJoin]] is a coercion, so a join can stand where the record is expected.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_join","base":"op_join","kind":"proj","short":{"text":"The join held by a has_join record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasJoin","base":"HasJoin","kind":"constr","short":{"text":"Builds a has_join record from a join on a set; a coercion","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.has_dec_eq","base":"has_dec_eq","kind":"rec","start":16,"body":null,"status":"ok","short":{"text":"A set packaged with a decision procedure for its equality","status":"ok"},"long":{"text":"The record `has_dec_eq X` holds one field, a boolean decision function [[AffineConstructive.interfaces.aprop.Dec]] for the equality of the set X, regarded as a predicate on the cartesian product X ∗ X. A set with such a record has decidable equality in the strong sense: a computation settles each instance of x = y.\n\nAs with the operation records, the purpose is to let a bundled structure carry the decision procedure for the equality of its carrier. When a decision for the equality of a set is required and the set is the image of such a structure under coercions, instance resolution strips the coercions and applies [[AffineConstructive.interfaces.bundled_notation.op_dec_eq]]. Inside a definition, a hypothesis `has_dec_eq X` supplies the decision procedure through `definition_hints`. Unlike the operation records, its constructor is not a coercion.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.bundled_notation.op_dec_eq","base":"op_dec_eq","kind":"proj","short":{"text":"The decision procedure for equality carried by a has_dec_eq record","status":"ok"}},{"name":"AffineConstructive.interfaces.bundled_notation.HasDecEq","base":"HasDecEq","kind":"constr","short":{"text":"Builds a has_dec_eq record from a decision procedure for a set's equality","status":"ok"}}]},{"name":"AffineConstructive.interfaces.bundled_notation.definition_hints.find","base":"find","kind":"ltac","start":33,"body":null,"status":"ok","short":{"text":"Closes an operation goal by taking the operation from a bundled record hypothesis on the same set","status":"ok"},"long":{"text":"Given the name of a bundling record and its projection, the tactic looks at a goal asking for an operation on a set X, such as a zero, a unit or an addition on X. It searches the context for a hypothesis H that says X has that operation, a record of the given kind on the same X, and closes the goal with the projection applied to H. If no such hypothesis is present it fails, so resolution moves on to other instances.\n\nThe tactic is local to the module `definition_hints` and is used only by that module's hints: at priority 8, one for each of the monoid unit, zero, one, binary operation, inversion, addition, negation and multiplication, and a similar hint that takes decidable equality from a [[AffineConstructive.interfaces.bundled_notation.has_dec_eq]] hypothesis. Importing the module lets a definition that takes an operation as a bundled argument, such as a [[AffineConstructive.interfaces.bundled_notation.has_plus]] X, use the operation's notation inside its body without stating a separate instance. Proofs do not call the tactic directly; it runs during instance resolution.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.algebra_notation":{"page":"algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

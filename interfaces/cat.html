e":285,"lib":"AffineConstructive.interfaces.set","name":"func_set","kind":"def","local":false,"page":"set.html"},{"s":300,"e":305,"lib":"AffineConstructive.interfaces.cat","name":"cat_t","kind":"rec","local":true},{"s":347,"e":352,"lib":"AffineConstructive.interfaces.cat","name":"cat_t","kind":"rec","local":true},{"s":432,"e":439,"lib":"AffineConstructive.interfaces.set","name":"func_op","kind":"proj","local":false,"page":"set.html"},{"s":440,"e":447,"lib":"AffineConstructive.interfaces.cat","name":"compose","kind":"def","local":true},{"s":492,"e":494,"lib":"AffineConstructive.interfaces.cat","name":"Id","kind":"class","local":true},{"s":495,"e":504,"lib":"AffineConstructive.interfaces.cat","name":"set_cat_t","kind":"canonstruc","local":true},{"s":516,"e":522,"lib":"AffineConstructive.interfaces.set","name":"id_fun","kind":"canonstruc","local":false,"page":"set.html"},{"s":568,"e":575,"lib":"AffineConstructive.interfaces.cat","name":"Compose","kind":"class","local":true},{"s":576,"e":585,"lib":"AffineConstructive.interfaces.cat","name":"set_cat_t","kind":"canonstruc","local":true},{"s":598,"e":606,"lib":"AffineConstructive.interfaces.set","name":"scompose","kind":"def","local":false,"page":"set.html"},{"s":646,"e":651,"lib":"AffineConstructive.interfaces.cat","name":"cat_t","kind":"rec","local":true},{"s":660,"e":662,"lib":"AffineConstructive.interfaces.cat","name":"Id","kind":"class","local":true},{"s":669,"e":676,"lib":"AffineConstructive.interfaces.cat","name":"Compose","kind":"class","local":true},{"s":798,"e":802,"lib":"AffineConstructive.interfaces.cat","name":"𝗂𝖽","kind":"def","local":true},{"s":848,"e":852,"lib":"AffineConstructive.interfaces.cat","name":"𝗂𝖽","kind":"def","local":true},{"s":885,"e":890,"lib":"AffineConstructive.interfaces.cat","name":"IsCat","kind":"class","local":true},{"s":913,"e":919,"lib":"AffineConstructive.interfaces.set","name":"id_fun","kind":"canonstruc","local":false,"page":"set.html"},{"s":891,"e":900,"lib":"AffineConstructive.interfaces.cat","name":"set_cat_t","kind":"canonstruc","local":true},{"s":972,"e":977,"lib":"AffineConstructive.interfaces.cat","name":"IsCat","kind":"class","local":true},{"s":978,"e":987,"lib":"AffineConstructive.interfaces.cat","name":"set_cat_t","kind":"canonstruc","local":true},{"s":999,"e":1008,"lib":"AffineConstructive.interfaces.cat","name":"set_IsCat","kind":"thm","local":true},{"s":1061,"e":1066,"lib":"AffineConstructive.interfaces.cat","name":"cat_t","kind":"rec","local":true},{"s":1110,"e":1112,"lib":"AffineConstructive.interfaces.cat","name":"Id","kind":"class","local":true},{"s":1113,"e":1121,"lib":"AffineConstructive.interfaces.cat","name":"cat_data:35","kind":"meth","local":true},{"s":1170,"e":1177,"lib":"AffineConstructive.interfaces.cat","name":"Compose","kind":"class","local":true},{"s":1178,"e":1186,"lib":"AffineConstructive.interfaces.cat","name":"cat_data:35","kind":"meth","local":true},{"s":1234,"e":1239,"lib":"AffineConstructive.interfaces.cat","name":"IsCat","kind":"class","local":true},{"s":1240,"e":1248,"lib":"AffineConstructive.interfaces.cat","name":"cat_data:35","kind":"meth","local":true},{"s":1262,"e":1271,"lib":"AffineConstructive.interfaces.cat","name":"Build_cat","kind":"constr","local":true},{"s":1314,"e":1323,"lib":"AffineConstructive.interfaces.cat","name":"Build_cat","kind":"constr","local":true},{"s":1324,"e":1333,"lib":"AffineConstructive.interfaces.cat","name":"set_cat_t","kind":"canonstruc","local":true},{"s":934,"e":937,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file sets up a minimal notion of category in which the objects form a type and the hom-sets are affine sets, so equality of morphisms is an affine equality, carrying apartness as well. It separates the data ([[AffineConstructive.interfaces.cat.cat_t]]) from the operations ([[AffineConstructive.interfaces.cat.Id]] and [[AffineConstructive.interfaces.cat.Compose]]) and from the laws ([[AffineConstructive.interfaces.cat.IsCat]]), then packages them in the bundled [[AffineConstructive.interfaces.cat.cat]]. Composition is a function out of the tensor of hom-sets, so it is required to be extensional only in the multiplicative sense. The main instance is [[AffineConstructive.interfaces.cat.𝐒𝐞𝐭]], with affine sets as objects and the function sets of interfaces/set.v as hom-sets, and [[AffineConstructive.interfaces.cat.set_IsCat]] proves its laws.","short":"Minimal categories with affine hom-sets, and the category of affine sets","items":[{"name":"AffineConstructive.interfaces.cat.cat_t","base":"cat_t","kind":"rec","start":3,"body":null,"status":"ok","short":{"text":"The data of a category: a type of objects and an affine set of morphisms between each pair","status":"ok"},"long":{"text":"A category's underlying data, before identities, composition and laws: a type of objects together with, for each pair of objects X and Y, a hom-set X ⟶ Y. The hom-sets are affine sets ([[AffineConstructive.interfaces.set.set]]), not bare types, so a hom-set carries its own affine equality of morphisms. Equality of morphisms is therefore at once a way of identifying morphisms and a way of telling them apart, and the category laws stated later are equations in these sets.\n\nThe objects form a type one universe above the hom-sets, which is what lets the affine sets themselves be the objects of a category whose hom-sets are function sets ([[AffineConstructive.interfaces.cat.set_cat_t]]). The record coerces to its type of objects, so an object of C is written X : C.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.cat.cat_ob","base":"cat_ob","kind":"proj","short":{"text":"The type of objects of a category","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.cat_hom","base":"cat_hom","kind":"proj","short":{"text":"The hom-set X ⟶ Y of a category: the affine set of morphisms from X to Y","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.Build_cat_t","base":"Build_cat_t","kind":"constr","short":{"text":"Builds the data of a category from a type of objects and a hom-set assignment","status":"ok"}}]},{"name":"AffineConstructive.interfaces.cat.set_cat_t","base":"set_cat_t","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"The data of the category of sets: affine sets as objects, function sets as hom-sets","status":"ok"},"long":{"text":"The category data whose objects are the affine sets and whose hom-set from X to Y is the function set X ⇾ Y ([[AffineConstructive.interfaces.set.func_set]]), so that two morphisms are equal when they are pointwise equal. Its identities are the identity functions ([[AffineConstructive.interfaces.set.id_fun]]) and its composition is composition of functions ([[AffineConstructive.interfaces.set.scompose]]); these are attached by resolution hints, and [[AffineConstructive.interfaces.cat.set_IsCat]] proves the laws. It is declared canonical, so a set appearing where an object of a category is expected is read as an object of this one. Bundled with its structure it is [[AffineConstructive.interfaces.cat.𝐒𝐞𝐭]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.cat.Id","base":"Id","kind":"ind","start":7,"body":null,"status":"ok","short":{"text":"The structure of identity morphisms on the data of a category","status":"ok"},"long":{"text":"A choice, for every object X of a category, of an identity morphism 𝗂𝖽 X in X ⟶ X. It is a class with a single field, so an instance is the identity-assigning function itself. The identities are only named here; that they are units for composition is required by [[AffineConstructive.interfaces.cat.IsCat]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.cat.Id","base":"Id","kind":"rec","short":{"text":"The class of identity assignments on the data of a category","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.𝗂𝖽","base":"𝗂𝖽","kind":"proj","short":{"text":"The identity morphism 𝗂𝖽 X on an object X","status":"ok"}}]},{"name":"AffineConstructive.interfaces.cat.Compose","base":"Compose","kind":"ind","start":8,"body":null,"status":"ok","short":{"text":"The structure of composition on the data of a category, as a function out of a tensor","status":"ok"},"long":{"text":"Composition in a category, given for objects X, Y, Z as a function of affine sets (Y ⟶ Z) ⊗ (X ⟶ Y) ⇾ (X ⟶ Z), written g ⊚ f. The domain is the tensor product of the hom-sets and not the cartesian product: the pair (g, f) is apart from (g', f') when g is apart from g' tensor f is apart from f', which is the multiplicative equality. Because composition is a morphism of sets it preserves equality, and in affine logic this carries its contrapositive: if g ⊚ f is apart from g' ⊚ f', then g is apart from g' or f is apart from f' in the par sense. Using the tensor asks for the weaker extensionality in each argument, the one that composition of functions between sets actually satisfies ([[AffineConstructive.interfaces.set.scompose]]).\n\nLike [[AffineConstructive.interfaces.cat.Id]], the class only supplies the operation; associativity is required by [[AffineConstructive.interfaces.cat.IsCat]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.cat.Compose","base":"Compose","kind":"rec","short":{"text":"The class of composition operations on the data of a category","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.compose","base":"compose","kind":"proj","short":{"text":"Composition, the function (Y ⟶ Z) ⊗ (X ⟶ Y) ⇾ (X ⟶ Z) taking (g, f) to g ⊚ f","status":"ok"}}]},{"name":"AffineConstructive.interfaces.cat.IsCat","base":"IsCat","kind":"rec","start":12,"body":null,"status":"ok","short":{"text":"The category laws: composition is associative and the identities are its units","status":"ok"},"long":{"text":"The axioms that make category data with identities and composition into a category: h ⊚ (g ⊚ f) = (h ⊚ g) ⊚ f, 𝗂𝖽 ⊚ f = f and f ⊚ 𝗂𝖽 = f. The equalities are those of the hom-sets, so the laws hold up to the affine equality of morphisms rather than definitionally. Being a statement about equalities, the class lives in the proof-irrelevant base logic: there is at most one witness that given data form a category.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.cat.cat_assoc","base":"cat_assoc","kind":"proj","short":{"text":"Associativity of composition: h ⊚ (g ⊚ f) = (h ⊚ g) ⊚ f","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.cat_id_l","base":"cat_id_l","kind":"proj","short":{"text":"The identity is a left unit: 𝗂𝖽 ⊚ f = f","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.cat_id_r","base":"cat_id_r","kind":"proj","short":{"text":"The identity is a right unit: f ⊚ 𝗂𝖽 = f","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.Build_IsCat","base":"Build_IsCat","kind":"constr","short":{"text":"Builds the category laws from associativity and the two unit laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.cat.set_IsCat","base":"set_IsCat","kind":"prf","start":13,"body":[14,16],"status":"ok","short":{"text":"Affine sets and functions, with identity functions and composition, satisfy the category laws","status":"ok"},"proof":[{"text":"The structure [[AffineConstructive.interfaces.cat.IsCat]] has one field for each category law. Each law holds because both sides are the same function, so every law is an instance of reflexivity of equality in the function sets.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.interfaces.cat.cat","base":"cat","kind":"rec","start":18,"body":null,"status":"ok","short":{"text":"A category: category data bundled with identities, composition and the category laws","status":"ok"},"long":{"text":"The bundled notion of category: the data of [[AffineConstructive.interfaces.cat.cat_t]] together with an identity structure ([[AffineConstructive.interfaces.cat.Id]]), a composition ([[AffineConstructive.interfaces.cat.Compose]]) and a proof of the laws ([[AffineConstructive.interfaces.cat.IsCat]]). The record coerces to its data, and so to its type of objects, and each structure field is a coercion so that, given a category C, its identities, composition and laws are found by resolution without being named. The structure fields are not used for canonical inference; categories are recognised from their data, as [[AffineConstructive.interfaces.cat.𝐒𝐞𝐭]] is from [[AffineConstructive.interfaces.cat.set_cat_t]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.cat.cat_data","base":"cat_data","kind":"proj","short":{"text":"The underlying data (objects and hom-sets) of a category","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.cat_id","base":"cat_id","kind":"proj","short":{"text":"The identity morphisms of a category","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.cat_compose","base":"cat_compose","kind":"proj","short":{"text":"The composition of a category","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.cat_is_cat","base":"cat_is_cat","kind":"proj","short":{"text":"The category laws of a category","status":"ok"}},{"name":"AffineConstructive.interfaces.cat.Build_cat","base":"Build_cat","kind":"constr","short":{"text":"Builds a category from its data, with identities, composition and laws found by resolution","status":"ok"}}]},{"name":"AffineConstructive.interfaces.cat.𝐒𝐞𝐭","base":"𝐒𝐞𝐭","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"The category of affine sets and functions","status":"ok"},"long":{"text":"The category whose objects are the affine sets and whose morphisms are functions of sets, compared pointwise: the data [[AffineConstructive.interfaces.cat.set_cat_t]], with identity functions, composition of functions and the laws [[AffineConstructive.interfaces.cat.set_IsCat]] supplied by resolution. It is declared canonical, so that wherever a category is expected and the objects are sets, this is the category found.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."}},"constants":null}</script>

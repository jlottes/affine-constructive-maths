oduct.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export theory.set.\n\nRequire Import set_lambda.\n\nImport of_course_set_notation.\n\n(** Affine definitions. *)\nSection defns.\n  Universes u.\n  Definition aAssociative      {X    :set@{u}} := set:(λ f : !(X ⊗ X ⇾ X), ∏ x y z, f(x, f(y, z)) = f(f(x, y), z) ).\n  Definition aCommutative      {X Y  :set@{u}} := set:(λ f : !(X ⊗ X ⇾ Y), ∏ x y, f(x, y) = f(y, x) ).\n  Definition aBinaryIdempotent {X    :set@{u}} := set:(λ f :  (X ⊗ X ⇾ X), ∏ x, f (x, x) = x ).\n  Definition aInvolutive       {X    :set@{u}} := set:(λ f : !(X ⇾ X), f ∘ f = id_fun _).\n  Definition aIdempotent       {X    :set@{u}} := set:(λ f : !(X ⇾ X), f ∘ f = f).\n  Definition aAbsorption       {X Y Z:set@{u}} := set:(λ (f:X ⊗ Z ⇾ X) (g:X ⊗ Y ⇾ Z), ∏ x y, f(x, g(x, y)) = x ).\n  Definition aLeftDistribute   {X    :set@{u}} := set:(λ (f g : !(X ⊗ X ⇾ X)), ∏ x y z, f(x, g(y, z)) = g(f(x, y), f(x, z)) ).\n  Definition aRightDistribute  {X    :set@{u}} := set:(λ (f g : !(X ⊗ X ⇾ X)), ∏ x y z, f(g(x, y), z) = g(f(x, z), f(y, z)) ).\n  \n  Definition aLeftIdentity     {X Y  :set@{u}} := set:(λ (f : (X ⊗ Y ⇾ Y)) (x: X), ∏ y, f (x, y) = y ).\n  Definition aRightIdentity    {X Y  :set@{u}} := set:(λ (f : (X ⊗ Y ⇾ X)) (y: Y), ∏ x, f (x, y) = x ).\n  Definition aLeftAbsorb       {X Y  :set@{u}} := set:(λ (f : (X ⊗ Y ⇾ X)) (x:!X), ∏ y, f (x, y) = x ).\n  Definition aRightAbsorb      {X Y  :set@{u}} := set:(λ (f : (X ⊗ Y ⇾ Y)) (y:!Y), ∏ x, f (x, y) = y ).\n  \n  Definition aLeftInverse      {X Y Z:set@{u}} := set:( λ (f:X ⊗ Y ⇾ Z) (inv:Y ⇾ X) (unit:Z), ∏ y, f (inv y, y) = unit ).\n  Definition aRightInverse     {X Y Z:set@{u}} := set:( λ (f:X ⊗ Y ⇾ Z) (inv:X ⇾ Y) (unit:Z), ∏ x, f (x, inv x) = unit ).\n\n  Definition aDistribute       {X    :set@{u}} := set:(λ (f:!(X ⇾ X)) (g : !(X ⊗ X ⇾ X)), ∏ x y, f(g(x, y)) = g(f x, f y) ).\n  Definition aAntiDistribute   {X    :set@{u}} := set:(λ (f:!(X ⇾ X)) (g : !(X ⊗ X ⇾ X)), ∏ x y, f(g(x, y)) = g(f y, f x) ).\nEnd defns.\n\n(** A declaration such as\n\n   [ H : aCommutative (+) ]\n\n   is really\n\n   [ H : apos (aCommutative (+)) ]\n\n   involving the implicit coercion [apos] to an [SProp]. It's convenenient to define [SProp] versions\n   so that they may participate in coercions.\n*)\n\nSection defns.\n  Universes u.\n  Definition Associative      {X    :set@{u}} (f:X ⊗ X ⇾ X)               : SProp := Eval simpl in aAssociative f.\n  Definition Commutative      {X Y  :set@{u}} (f:X ⊗ X ⇾ Y)               : SProp := Eval simpl in aCommutative f.\n  Definition BinaryIdempotent {X    :set@{u}} (f:X ⊗ X ⇾ X)               : SProp := Eval simpl in aBinaryIdempotent f.\n  Definition Involutive       {X    :set@{u}} (f:X ⇾ X)                   : SProp := f ∘ f = id_fun _.\n  Definition Idempotent       {X    :set@{u}} (f:X ⇾ X)                   : SProp := f ∘ f = f.\n  Definition Absorption       {X Y Z:set@{u}} (f:X ⊗ Z ⇾ X) (g:X ⊗ Y ⇾ Z) : SProp := Eval simpl in aAbsorption f g.\n  Definition LeftDistribute   {X    :set@{u}} (f g : X ⊗ X ⇾ X)           : SProp := Eval simpl in aLeftDistribute f g.\n  Definition RightDistribute  {X    :set@{u}} (f g : X ⊗ X ⇾ X)           : SProp := Eval simpl in aRightDistribute f g.\n  \n  Definition LeftIdentity     {X Y  :set@{u}} (f : X ⊗ Y ⇾ Y) (x:X) : SProp := Eval simpl in aLeftIdentity f x.\n  Definition RightIdentity    {X Y  :set@{u}} (f : X ⊗ Y ⇾ X) (y:Y) : SProp := Eval simpl in aRightIdentity f y.\n  Definition LeftAbsorb       {X Y  :set@{u}} (f : X ⊗ Y ⇾ X) (x:X) : SProp := Eval simpl in aLeftAbsorb f x.\n  Definition RightAbsorb      {X Y  :set@{u}} (f : X ⊗ Y ⇾ Y) (y:Y) : SProp := Eval simpl in aRightAbsorb f y.\n  \n  Definition LeftInverse      {X Y Z:set@{u}} (f:X ⊗ Y ⇾ Z) (inv:Y ⇾ X) (unit:Z) : SProp := Eval simpl in aLeftInverse f inv unit.\n  Definition RightInverse     {X Y Z:set@{u}} (f:X ⊗ Y ⇾ Z) (inv:X ⇾ Y) (unit:Z) : SProp := Eval simpl in aRightInverse f inv unit.\n\n  Definition Distribute       {X    :set@{u}} (f:X ⇾ X) (g : X ⊗ X ⇾ X) : SProp := Eval simpl in aDistribute f g.\n  Definition AntiDistribute   {X    :set@{u}} (f:X ⇾ X) (g : X ⊗ X ⇾ X) : SProp := Eval simpl in aAntiDistribute f g.\nEnd defns.\n\nExisting Class Associative.\nExisting Class Commutative.\nExisting Class BinaryIdempotent.\nExisting Class Involutive.\nExisting Class Idempotent.\nExisting Class Absorption.\nExisting Class LeftDistribute.\nExisting Class RightDistribute.\n\nExisting Class LeftIdentity.\nExisting Class RightIdentity.\nExisting Class LeftAbsorb.\nExisting Class RightAbsorb.\nExisting Class LeftInverse.\nExisting Class RightInverse.\n\nExisting Class Distribute.\nExisting Class AntiDistribute.\n\n\nDefinition associativity      {X    } f {H:@Associative X f} x y z := H x y z.\nDefinition commutativity      {X Y  } f {H:@Commutative X Y f} x y := H x y.\nDefinition binary_idempotency {X    } f {H:@BinaryIdempotent X f} x := H x.\nDefinition involutive         {X    } f {H:@Involutive X f} : f ∘ f = id_fun _ := H.\nDefinition idempotent         {X    } f {H:@Idempotent X f} : f ∘ f = f := H.\nDefinition absorption         {X Y Z} f g {H:@Absorption X Y Z f g} x y := H x y.\nDefinition distribute_l       {X    } f g {H:@LeftDistribute X f g} x y z := H x y z.\nDefinition distribute_r       {X    } f g {H:@RightDistribute X f g} x y z := H x y z.\nDefinition left_identity      {X Y  } f `{H:@LeftIdentity X Y f x} y := H y.\nDefinition right_identity     {X Y  } f `{H:@RightIdentity X Y f y} x := H x.\nDefinition left_absorb        {X Y  } f `{H:@LeftAbsorb X Y f x} y := H y.\nDefinition right_absorb       {X Y  } f `{H:@RightAbsorb X Y f y} x := H x.\nDefinition left_inverse       {X Y Z} f ":"def","local":true},{"s":7647,"e":7660,"lib":"AffineConstructive.interfaces.prelude","name":"eval_tuncurry","kind":"abbrev","local":false,"page":"prelude.html"},{"s":7663,"e":7676,"lib":"AffineConstructive.interfaces.common_props","name":"RightIdentity","kind":"class","local":true},{"s":7767,"e":7779,"lib":"AffineConstructive.theory.set","name":"make_fun_alt","kind":"abbrev","local":false,"page":"../theory/set.html"},{"s":7816,"e":7829,"lib":"AffineConstructive.interfaces.common_props","name":"weaken_apred2","kind":"def","local":true},{"s":7832,"e":7843,"lib":"AffineConstructive.interfaces.common_props","name":"aLeftAbsorb","kind":"def","local":true},{"s":7781,"e":7794,"lib":"AffineConstructive.interfaces.prelude","name":"eval_tuncurry","kind":"abbrev","local":false,"page":"prelude.html"},{"s":7797,"e":7807,"lib":"AffineConstructive.interfaces.common_props","name":"LeftAbsorb","kind":"class","local":true},{"s":7896,"e":7908,"lib":"AffineConstructive.theory.set","name":"make_fun_alt","kind":"abbrev","local":false,"page":"../theory/set.html"},{"s":7946,"e":7959,"lib":"AffineConstructive.interfaces.common_props","name":"weaken_apred2","kind":"def","local":true},{"s":7962,"e":7974,"lib":"AffineConstructive.interfaces.common_props","name":"aRightAbsorb","kind":"def","local":true},{"s":7910,"e":7923,"lib":"AffineConstructive.interfaces.prelude","name":"eval_tuncurry","kind":"abbrev","local":false,"page":"prelude.html"},{"s":7926,"e":7937,"lib":"AffineConstructive.interfaces.common_props","name":"RightAbsorb","kind":"class","local":true},{"s":8029,"e":8041,"lib":"AffineConstructive.theory.set","name":"make_fun_alt","kind":"abbrev","local":false,"page":"../theory/set.html"},{"s":8082,"e":8095,"lib":"AffineConstructive.interfaces.common_props","name":"weaken_apred3","kind":"def","local":true},{"s":8098,"e":8110,"lib":"AffineConstructive.interfaces.common_props","name":"aLeftInverse","kind":"def","local":true},{"s":8043,"e":8057,"lib":"AffineConstructive.interfaces.prelude","name":"eval_tuncurry3","kind":"abbrev","local":false,"page":"prelude.html"},{"s":8060,"e":8071,"lib":"AffineConstructive.interfaces.common_props","name":"LeftInverse","kind":"class","local":true},{"s":8168,"e":8180,"lib":"AffineConstructive.theory.set","name":"make_fun_alt","kind":"abbrev","local":false,"page":"../theory/set.html"},{"s":8222,"e":8235,"lib":"AffineConstructive.interfaces.common_props","name":"weaken_apred3","kind":"def","local":true},{"s":8238,"e":8251,"lib":"AffineConstructive.interfaces.common_props","name":"aRightInverse","kind":"def","local":true},{"s":8182,"e":8196,"lib":"AffineConstructive.interfaces.prelude","name":"eval_tuncurry3","kind":"abbrev","local":false,"page":"prelude.html"},{"s":8199,"e":8211,"lib":"AffineConstructive.interfaces.common_props","name":"RightInverse","kind":"class","local":true}],"gloss":{"summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[AffineConstructive.interfaces.common_props.associativity]], [[AffineConstructive.interfaces.common_props.commutativity]] and [[AffineConstructive.interfaces.common_props.left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[AffineConstructive.interfaces.common_props.weaken_apred1]], [[AffineConstructive.interfaces.common_props.weaken_apred2]] and [[AffineConstructive.interfaces.common_props.weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes.","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","items":[{"name":"AffineConstructive.interfaces.common_props.aAssociative","base":"aAssociative","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"The affine proposition that a binary operation f on X is associative","status":"ok"},"long":{"text":"For an operation f on X, taken on the tensor square X ⊗ X, the affine proposition that for all x, y, z, f(x, f(y, z)) = f(f(x, y), z). Because the equality is affine, refuting it amounts to exhibiting x, y, z at which the two bracketings are apart.\n\nThe statement uses f four times, so it is a function of !f, the operation affirmed and thereby reusable. Being built by set-internalisation, it is a function of sets into Ω: an operation equal to f has an equivalent associativity statement. Its affirmation is the typeclass [[AffineConstructive.interfaces.common_props.Associative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aCommutative","base":"aCommutative","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"The affine proposition that a binary operation f : X ⊗ X ⇾ Y is commutative","status":"ok"},"long":{"text":"The affine proposition that for all x, y, f(x, y) = f(y, x). Its refutation is a pair at which f(x, y) and f(y, x) are apart. The codomain Y may differ from X, so the notion also covers symmetric relations and pairings, not only operations.\n\nThe operation appears twice and so enters under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.Commutative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aBinaryIdempotent","base":"aBinaryIdempotent","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The affine proposition that f(x, x) = x for all x, for a binary operation f on X","status":"ok"},"long":{"text":"The affine proposition that a binary operation f on X is idempotent in the sense of lattices and semilattices: for all x, f(x, x) = x. Here f occurs once in the statement, so it is a plain argument rather than one under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.BinaryIdempotent]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aInvolutive","base":"aInvolutive","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"The affine proposition that an endomap f of X is an involution, f ∘ f = id","status":"ok"},"long":{"text":"For an endomap f of X, the affine proposition that f ∘ f = [[AffineConstructive.interfaces.set.id_fun]], an equality in the set of functions X ⇾ X, so pointwise f(f x) = x for all x; its refutation is a point whose double image is apart from it. Since f is composed with itself it is used twice, so it is taken under of course: the proposition is a morphism from !(X ⇾ X) to Ω, which makes it respect equality of maps.\n\nThe class [[AffineConstructive.interfaces.common_props.Involutive]] is its affirmation, and [[AffineConstructive.interfaces.common_props.Involutive_fun]] builds on it to make involutivity a morphism of the map, so that the map can be rewritten inside it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aIdempotent","base":"aIdempotent","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The affine proposition that an endofunction f of X is idempotent: f ∘ f equals f","status":"ok"},"long":{"text":"The affine proposition that f ∘ f = f as functions X ⇾ X, so that f(f x) = f x for every x. Interior and closure operators are of this kind. As f occurs three times, it enters under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.Idempotent]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aAbsorption","base":"aAbsorption","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"The affine proposition that f absorbs g: f(x, g(x, y)) = x for all x, y","status":"ok"},"long":{"text":"For f : X ⊗ Z ⇾ X and g : X ⊗ Y ⇾ Z, the affine proposition that for all x, y, f(x, g(x, y)) = x. This is the absorption law of lattices, x ⊔ (x ⊓ y) = x and its dual, stated with types general enough to allow the two operations to have different signatures. Each operation occurs once, so neither is under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.Absorption]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aLeftDistribute","base":"aLeftDistribute","kind":"def","start":11,"body":null,"status":"ok","short":{"text":"The affine proposition that f distributes over g on the left: f(x, g(y, z)) = g(f(x, y), f(x, z))","status":"ok"},"long":{"text":"For binary operations f and g on X, the affine proposition that for all x, y, z, f(x, g(y, z)) = g(f(x, y), f(x, z)): multiplication over addition on the left, for instance. Both operations occur more than once, so both enter under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.LeftDistribute]]; [[AffineConstructive.interfaces.common_props.aRightDistribute]] is the mirror law.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aRightDistribute","base":"aRightDistribute","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"The affine proposition that f distributes over g on the right: f(g(x, y), z) = g(f(x, z), f(y, z))","status":"ok"},"long":{"text":"For binary operations f and g on X, the affine proposition that for all x, y, z, f(g(x, y), z) = g(f(x, z), f(y, z)). This is the mirror image of [[AffineConstructive.interfaces.common_props.aLeftDistribute]], which is needed separately when f is not commutative. Both operations are under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.RightDistribute]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aLeftIdentity","base":"aLeftIdentity","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The affine proposition that x is a left identity for f: f(x, y) = y for all y","status":"ok"},"long":{"text":"For an operation f : X ⊗ Y ⇾ Y and an element x of X, the affine proposition that for all y, f(x, y) = y. On a single set this is the left unit law. The operation and the element each occur once in the statement, so neither is taken under of course, and the proposition is a morphism of both.\n\nThe class [[AffineConstructive.interfaces.common_props.LeftIdentity]] is its affirmation, and [[AffineConstructive.interfaces.common_props.LeftIdentity_fun]] builds on it to make the left identity law a morphism of the pair (operation, element).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aRightIdentity","base":"aRightIdentity","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"The affine proposition that y is a right identity for f : X ⊗ Y ⇾ X","status":"ok"},"long":{"text":"The affine proposition that for all x, f(x, y) = x: the right unit law, with the right argument allowed to come from a different set. Neither argument needs of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.RightIdentity]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aLeftAbsorb","base":"aLeftAbsorb","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"The affine proposition that x is left absorbing for f: f(x, y) = x for all y","status":"ok"},"long":{"text":"For an operation f : X ⊗ Y ⇾ X and an element x of X, the affine proposition that for all y, f(x, y) = x. Unlike an identity, the element x occurs twice, as the argument and as the result, so it is taken under of course; the operation occurs once and is not.\n\nThe class [[AffineConstructive.interfaces.common_props.LeftAbsorb]] is its affirmation, and [[AffineConstructive.interfaces.common_props.LeftAbsorb_fun]] builds on it to make the law a morphism of the pair (operation, element).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aRightAbsorb","base":"aRightAbsorb","kind":"def","start":16,"body":null,"status":"ok","short":{"text":"The affine proposition that y is right absorbing for f : X ⊗ Y ⇾ Y: f(x, y) = y for all x","status":"ok"},"long":{"text":"The affine proposition that for all x, f(x, y) = y, the mirror of [[AffineConstructive.interfaces.common_props.aLeftAbsorb]]. The element y occurs twice and is taken under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.RightAbsorb]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aLeftInverse","base":"aLeftInverse","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"The affine proposition that inv gives left inverses for f with respect to unit: f(inv y, y) = unit","status":"ok"},"long":{"text":"For f : X ⊗ Y ⇾ Z, a map inv : Y ⇾ X and an element unit of Z, the affine proposition that for all y, f(inv y, y) = unit. For a group this is the law (−y) + y = 0. The signature is general enough for the inverse to land in another set. Each argument occurs once, so none is under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.LeftInverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aRightInverse","base":"aRightInverse","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"The affine proposition that inv gives right inverses for f with respect to unit: f(x, inv x) = unit","status":"ok"},"long":{"text":"For f : X ⊗ Y ⇾ Z, inv : X ⇾ Y and unit in Z, the affine proposition that for all x, f(x, inv x) = unit: the mirror of [[AffineConstructive.interfaces.common_props.aLeftInverse]]. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.RightInverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aDistribute","base":"aDistribute","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The affine proposition that a unary f distributes over a binary g: f(g(x, y)) = g(f x, f y)","status":"ok"},"long":{"text":"For an endomap f and a binary operation g on X, the affine proposition that for all x and y, f(g(x, y)) = g(f x, f y): f is a homomorphism for g. Both f and g occur more than once in the statement and are taken under of course. Its order-reversing counterpart is [[AffineConstructive.interfaces.common_props.aAntiDistribute]].\n\nThe class [[AffineConstructive.interfaces.common_props.Distribute]] is its affirmation, and [[AffineConstructive.interfaces.common_props.Distribute_fun]] builds on it to make the law a morphism of the pair (f, g).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.aAntiDistribute","base":"aAntiDistribute","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"The affine proposition that f anti-distributes over g: f(g(x, y)) = g(f y, f x)","status":"ok"},"long":{"text":"For an endofunction f and a binary operation g on X, the affine proposition that for all x, y, f(g(x, y)) = g(f y, f x): f is an anti-homomorphism for g, as inversion is for multiplication in a group, (xy)⁻¹ = y⁻¹x⁻¹. Both functions are under of course. The affirmation is the typeclass [[AffineConstructive.interfaces.common_props.AntiDistribute]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Associative","base":"Associative","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"The class of associative binary operations on X: the affirmation of aAssociative","status":"ok"},"long":{"text":"The base-logic proposition that f is associative, obtained by affirming [[AffineConstructive.interfaces.common_props.aAssociative]] and unfolding the result. It states that for all x, y, z, f(x, f(y, z)) = f(f(x, y), z), with each equality affirmed. It is declared a class, so associativity of an operation is found by instance resolution, and [[AffineConstructive.interfaces.common_props.associativity]] retrieves the equation. The affine statement exists for when its refutation matters. Writing the class directly over SProp, rather than through the affirmation coercion, lets it take part in coercions and resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Commutative","base":"Commutative","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The class of commutative binary operations f : X ⊗ X ⇾ Y: the affirmation of aCommutative","status":"ok"},"long":{"text":"The base-logic proposition that f(x, y) = f(y, x) for all x and y, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aCommutative]] and declared a class. The equation is retrieved by [[AffineConstructive.interfaces.common_props.commutativity]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.BinaryIdempotent","base":"BinaryIdempotent","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"The class of binary operations with f(x, x) = x: the affirmation of aBinaryIdempotent","status":"ok"},"long":{"text":"The base-logic proposition that f(x, x) = x for every x, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aBinaryIdempotent]] and declared a class. Meets and joins of semilattices are the typical instances. The equation is retrieved by [[AffineConstructive.interfaces.common_props.binary_idempotency]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Involutive","base":"Involutive","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"The class of involutions: endofunctions f with f ∘ f equal to the identity","status":"ok"},"long":{"text":"The base-logic proposition that f ∘ f = [[AffineConstructive.interfaces.set.id_fun]] as functions on X, declared a class. It is written directly as this equality rather than as an unfolding of [[AffineConstructive.interfaces.common_props.aInvolutive]], to which it is definitionally the affirmation. The law is retrieved by [[AffineConstructive.interfaces.common_props.involutive]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Idempotent","base":"Idempotent","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"The class of idempotent endofunctions: f ∘ f equals f","status":"ok"},"long":{"text":"The base-logic proposition that f ∘ f = f as functions on X, declared a class. It is written directly as this equality, which is the affirmation of [[AffineConstructive.interfaces.common_props.aIdempotent]]. The law is retrieved by [[AffineConstructive.interfaces.common_props.idempotent]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Absorption","base":"Absorption","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"The class stating that f absorbs g: f(x, g(x, y)) = x, the affirmation of aAbsorption","status":"ok"},"long":{"text":"The base-logic proposition that f(x, g(x, y)) = x for all x and y, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aAbsorption]] and declared a class. A lattice carries two instances, join absorbing meet and meet absorbing join. The equation is retrieved by [[AffineConstructive.interfaces.common_props.absorption]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.LeftDistribute","base":"LeftDistribute","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"The class stating that f distributes over g on the left: the affirmation of aLeftDistribute","status":"ok"},"long":{"text":"The base-logic proposition that f(x, g(y, z)) = g(f(x, y), f(x, z)) for all x, y, z, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aLeftDistribute]] and declared a class. The equation is retrieved by [[AffineConstructive.interfaces.common_props.distribute_l]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.RightDistribute","base":"RightDistribute","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"The class stating that f distributes over g on the right: the affirmation of aRightDistribute","status":"ok"},"long":{"text":"The base-logic proposition that f(g(x, y), z) = g(f(x, z), f(y, z)) for all x, y, z, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aRightDistribute]] and declared a class. The equation is retrieved by [[AffineConstructive.interfaces.common_props.distribute_r]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.LeftIdentity","base":"LeftIdentity","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"The class stating that x is a left identity for f: the affirmation of aLeftIdentity","status":"ok"},"long":{"text":"The base-logic proposition that f(x, y) = y for every y, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aLeftIdentity]] and declared a class indexed by the operation and the element. Resolution therefore finds the unit of an operation together with its law, and [[AffineConstructive.interfaces.common_props.left_identity]] retrieves the equation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.RightIdentity","base":"RightIdentity","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"The class stating that y is a right identity for f: the affirmation of aRightIdentity","status":"ok"},"long":{"text":"The base-logic proposition that f(x, y) = x for every x, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aRightIdentity]] and declared a class. The equation is retrieved by [[AffineConstructive.interfaces.common_props.right_identity]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.LeftAbsorb","base":"LeftAbsorb","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"The class stating that x is left absorbing for f: the affirmation of aLeftAbsorb","status":"ok"},"long":{"text":"The base-logic proposition that f(x, y) = x for every y, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aLeftAbsorb]] and declared a class. Once affirmed, the element no longer needs to be marked reusable, so it is an ordinary argument here. The equation is retrieved by [[AffineConstructive.interfaces.common_props.left_absorb]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.RightAbsorb","base":"RightAbsorb","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"The class stating that y is right absorbing for f: the affirmation of aRightAbsorb","status":"ok"},"long":{"text":"The base-logic proposition that f(x, y) = y for every x, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aRightAbsorb]] and declared a class. The equation is retrieved by [[AffineConstructive.interfaces.common_props.right_absorb]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.LeftInverse","base":"LeftInverse","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"The class stating that inv gives left inverses for f with respect to unit: f(inv y, y) = unit","status":"ok"},"long":{"text":"The base-logic proposition that f(inv y, y) = unit for every y, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aLeftInverse]] and declared a class indexed by the operation, the inverse map and the unit. The equation is retrieved by [[AffineConstructive.interfaces.common_props.left_inverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.RightInverse","base":"RightInverse","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"The class stating that inv gives right inverses for f with respect to unit: f(x, inv x) = unit","status":"ok"},"long":{"text":"The base-logic proposition that f(x, inv x) = unit for every x, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aRightInverse]] and declared a class. The equation is retrieved by [[AffineConstructive.interfaces.common_props.right_inverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Distribute","base":"Distribute","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"The class stating that a unary f distributes over a binary g: f(g(x, y)) = g(f x, f y)","status":"ok"},"long":{"text":"The base-logic proposition that f(g(x, y)) = g(f x, f y) for all x and y, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aDistribute]] and declared a class. The equation is retrieved by [[AffineConstructive.interfaces.common_props.distribute]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.AntiDistribute","base":"AntiDistribute","kind":"def","start":39,"body":null,"status":"ok","short":{"text":"The class stating that f anti-distributes over g: f(g(x, y)) = g(f y, f x)","status":"ok"},"long":{"text":"The base-logic proposition that f(g(x, y)) = g(f y, f x) for all x and y, unfolded from the affirmation of [[AffineConstructive.interfaces.common_props.aAntiDistribute]] and declared a class. The equation is retrieved by [[AffineConstructive.interfaces.common_props.anti_distribute]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.associativity","base":"associativity","kind":"def","start":57,"body":null,"status":"ok","short":{"text":"The associativity law f(x, f(y, z)) = f(f(x, y), z) of an associative operation","status":"ok"},"long":{"text":"Given an operation f and an instance of [[AffineConstructive.interfaces.common_props.Associative]] for it, found by resolution, the equation f(x, f(y, z)) = f(f(x, y), z) at given x, y, z. The operation is named explicitly so that the law can be invoked for a chosen operation, typically as a rewriting rule.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.commutativity","base":"commutativity","kind":"def","start":58,"body":null,"status":"ok","short":{"text":"The commutativity law f(x, y) = f(y, x) of a commutative operation","status":"ok"},"long":{"text":"Given f and an instance of [[AffineConstructive.interfaces.common_props.Commutative]], found by resolution, the equation f(x, y) = f(y, x) at given x and y. The operation is named explicitly, so the law can be stated for a chosen operation and used to rewrite.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.binary_idempotency","base":"binary_idempotency","kind":"def","start":59,"body":null,"status":"ok","short":{"text":"The law f(x, x) = x of a binary idempotent operation","status":"ok"},"long":{"text":"Given f and an instance of [[AffineConstructive.interfaces.common_props.BinaryIdempotent]], found by resolution, the equation f(x, x) = x at a given x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.involutive","base":"involutive","kind":"def","start":60,"body":null,"status":"ok","short":{"text":"The law f ∘ f = id of an involution, applicable pointwise as f(f x) = x","status":"ok"},"long":{"text":"Given f and an instance of [[AffineConstructive.interfaces.common_props.Involutive]], found by resolution, the equality f ∘ f = [[AffineConstructive.interfaces.set.id_fun]] of functions. Applied to a point, the same law yields f(f x) = x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.idempotent","base":"idempotent","kind":"def","start":61,"body":null,"status":"ok","short":{"text":"The law f ∘ f = f of an idempotent endofunction, applicable pointwise as f(f x) = f x","status":"ok"},"long":{"text":"Given f and an instance of [[AffineConstructive.interfaces.common_props.Idempotent]], found by resolution, the equality f ∘ f = f of functions. Applied to a point, the same law yields f(f x) = f x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.absorption","base":"absorption","kind":"def","start":62,"body":null,"status":"ok","short":{"text":"The absorption law f(x, g(x, y)) = x for operations f absorbing g","status":"ok"},"long":{"text":"Given f and g and an instance of [[AffineConstructive.interfaces.common_props.Absorption]], found by resolution, the equation f(x, g(x, y)) = x at given x and y. Both operations are named explicitly, since a lattice satisfies absorption in two ways.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.distribute_l","base":"distribute_l","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"The left distributive law f(x, g(y, z)) = g(f(x, y), f(x, z))","status":"ok"},"long":{"text":"Given f and g and an instance of [[AffineConstructive.interfaces.common_props.LeftDistribute]], found by resolution, the equation f(x, g(y, z)) = g(f(x, y), f(x, z)) at given x, y, z.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.distribute_r","base":"distribute_r","kind":"def","start":64,"body":null,"status":"ok","short":{"text":"The right distributive law f(g(x, y), z) = g(f(x, z), f(y, z))","status":"ok"},"long":{"text":"Given f and g and an instance of [[AffineConstructive.interfaces.common_props.RightDistribute]], found by resolution, the equation f(g(x, y), z) = g(f(x, z), f(y, z)) at given x, y, z.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.left_identity","base":"left_identity","kind":"def","start":65,"body":null,"status":"ok","short":{"text":"From a left identity x for f, the equation f(x, y) = y for every y","status":"ok"},"long":{"text":"The accessor for [[AffineConstructive.interfaces.common_props.LeftIdentity]]: from the class hypothesis, found by resolution, it gives the identity law at each y. The identity element x is recovered from the instance, so the law is stated for an operation without naming its unit. This is the form used for rewriting away a unit on the left.\n\nIts uses are mostly in the theory of groups, where [[AffineConstructive.theory.groups.group_basic]] rewrites with it among the unit, inverse and cancellation laws, and in the natural-number rig, product algebras and subgroups.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.right_identity","base":"right_identity","kind":"def","start":66,"body":null,"status":"ok","short":{"text":"If y is a right identity for f, then f(x, y) = x for every x","status":"ok"},"long":{"text":"The accessor for [[AffineConstructive.interfaces.common_props.RightIdentity]], the mirror image of [[AffineConstructive.interfaces.common_props.left_identity]]. The class hypothesis is found by resolution and the identity element y is inferred from it, so `right_identity f` gives f(x, y) = x at each x and serves as a rewriting law that removes a unit on the right.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.left_absorb","base":"left_absorb","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"From a left absorbing x for f, the equation f(x, y) = x for every y","status":"ok"},"long":{"text":"The accessor for [[AffineConstructive.interfaces.common_props.LeftAbsorb]]: an element absorbing on the left swallows whatever stands beside it. Resolution supplies the class hypothesis together with x, and the lemma gives the equation at each y. In the theory of rings it gives 0 · y = 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.right_absorb","base":"right_absorb","kind":"def","start":68,"body":null,"status":"ok","short":{"text":"If y absorbs on the right for f, then f(x, y) = y for every x","status":"ok"},"long":{"text":"The accessor for [[AffineConstructive.interfaces.common_props.RightAbsorb]], the mirror image of [[AffineConstructive.interfaces.common_props.left_absorb]]. It gives the absorption law f(x, y) = y at each x, with the absorbing element y and the hypothesis both found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.left_inverse","base":"left_inverse","kind":"def","start":69,"body":null,"status":"ok","short":{"text":"If inv is a left inverse for f with unit e, then f(inv y, y) = e for every y","status":"ok"},"long":{"text":"The accessor for [[AffineConstructive.interfaces.common_props.LeftInverse]]. The inverse map and the unit are implicit, recovered from the instance, so `left_inverse f` gives the law (−y) + y = 0 or y⁻¹y = 1 for whichever structure is in play. The three sets are kept apart, so the same statement also covers heterogeneous pairings in which the inverse lands in a different set from its argument.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.right_inverse","base":"right_inverse","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"If inv is a right inverse for f with unit e, then f(x, inv x) = e for every x","status":"ok"},"long":{"text":"The accessor for [[AffineConstructive.interfaces.common_props.RightInverse]], the mirror image of [[AffineConstructive.interfaces.common_props.left_inverse]]. It gives f(x, inv x) = e at each x, with the inverse map, the unit and the hypothesis all supplied by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.distribute","base":"distribute","kind":"def","start":71,"body":null,"status":"ok","short":{"text":"From Distribute f g, the equation f(g(x, y)) = g(f x, f y) for all x, y","status":"ok"},"long":{"text":"The accessor for [[AffineConstructive.interfaces.common_props.Distribute]]: f commutes with the binary operation g, that is, f is a homomorphism for g. Resolution supplies the class hypothesis, and the lemma gives the equation at each pair x, y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.anti_distribute","base":"anti_distribute","kind":"def","start":72,"body":null,"status":"ok","short":{"text":"If f anti-distributes over g, then f(g(x, y)) = g(f y, f x) for all x, y","status":"ok"},"long":{"text":"The accessor for [[AffineConstructive.interfaces.common_props.AntiDistribute]]. A unary map f anti-distributes over a binary operation g when it passes through g and swaps the two arguments. Applied to f and g, the accessor takes the class hypothesis from resolution and returns the equation for each pair x, y. Without the swap, this is the law [[AffineConstructive.interfaces.common_props.distribute]] states.\n\nThe development uses it for the star of a star semigroup. [[AffineConstructive.theory.groups.inv_distr]] states (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ in a star semigroup through it, and the proofs that build star semigroups in theory.groups and theory.subgroups, such as [[AffineConstructive.theory.subgroups.sub_star_semigroup_star_semigroup]], use it to check this law.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.weaken_apred1","base":"weaken_apred1","kind":"def","start":73,"body":null,"status":"ok","short":{"text":"Turns an affine predicate on X into a base-logic predicate on !X, by affirming it","status":"ok"},"long":{"text":"Given an affine predicate P on X, this is the composite of P under of course, which is a map from !X, with the proof component [[AffineConstructive.interfaces.aprop.apos]]. The result sends x to the base proposition that P x is affirmed. It is a function of sets into the set of base propositions, so it respects equality.\n\nThe set of base propositions has only an affirmative equality, namely logical equivalence, and a morphism into it uses only the affirmed equality of its argument. That is why the domain is !X and not X. The function serves as the morphism witness for the canonical structures of this file ([[AffineConstructive.interfaces.common_props.Associative_fun]] and the other one-argument cases): once an affine property is a set morphism, the corresponding base class respects equality of the operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.weaken_apred2","base":"weaken_apred2","kind":"def","start":74,"body":null,"status":"ok","short":{"text":"Turns a two-argument affine predicate into a base-logic predicate on !X ⊗ !Y","status":"ok"},"long":{"text":"The two-argument version of [[AffineConstructive.interfaces.common_props.weaken_apred1]]. The curried affine predicate P is uncurried and placed under of course, which gives a map from !X ⊗ !Y, and that map is composed with [[AffineConstructive.interfaces.aprop.apos]]. The result is a set morphism into base propositions. It respects equality in each argument separately, and only affirmed equality is used. It supplies the morphism witness for the two-argument canonical structures, such as [[AffineConstructive.interfaces.common_props.Absorption_fun]] and [[AffineConstructive.interfaces.common_props.LeftIdentity_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.weaken_apred3","base":"weaken_apred3","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"Turns a three-argument affine predicate into a base-logic predicate on !X ⊗ !Y ⊗ !Z","status":"ok"},"long":{"text":"The three-argument version of [[AffineConstructive.interfaces.common_props.weaken_apred1]]: it uncurries twice, places the predicate under of course on the nested tensor !X ⊗ !Y ⊗ !Z, and composes with [[AffineConstructive.interfaces.aprop.apos]]. It supplies the morphism witness for [[AffineConstructive.interfaces.common_props.LeftInverse_fun]] and [[AffineConstructive.interfaces.common_props.RightInverse_fun]], whose properties depend on an operation, an inverse map and a unit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Associative_fun","base":"Associative_fun","kind":"def","start":76,"body":null,"status":"ok","short":{"text":"Associativity as a morphism from binary operations to base propositions, respecting equality of the operation","status":"ok"},"long":{"text":"This structure presents the class [[AffineConstructive.interfaces.common_props.Associative]] as a function of sets from !(X ⊗ X ⇾ X) to base propositions. Its respect for equality comes from the affine definition [[AffineConstructive.interfaces.common_props.aAssociative]] through [[AffineConstructive.interfaces.common_props.weaken_apred1]]. Because it is declared canonical, unification finds this morphism structure whenever `Associative f` appears. An equality f = g between operations can then be rewritten inside the hypothesis, so that associativity transfers from one operation to an equal one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Commutative_fun","base":"Commutative_fun","kind":"def","start":77,"body":null,"status":"ok","short":{"text":"Commutativity as a morphism from binary operations to base propositions, respecting equality of the operation","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.Commutative]], with its respect for equality inherited from [[AffineConstructive.interfaces.common_props.aCommutative]] through [[AffineConstructive.interfaces.common_props.weaken_apred1]]. It lets commutativity be transported along an equality of operations by rewriting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.BinaryIdempotent_fun","base":"BinaryIdempotent_fun","kind":"def","start":78,"body":null,"status":"ok","short":{"text":"Binary idempotency as a morphism from binary operations to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.BinaryIdempotent]], obtained from [[AffineConstructive.interfaces.common_props.aBinaryIdempotent]] through [[AffineConstructive.interfaces.common_props.weaken_apred1]]. It makes the law f(x, x) = x invariant under rewriting the operation f.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Involutive_fun","base":"Involutive_fun","kind":"def","start":79,"body":null,"status":"ok","short":{"text":"Involutivity as a morphism from endomaps of X to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.Involutive]], obtained from [[AffineConstructive.interfaces.common_props.aInvolutive]] through [[AffineConstructive.interfaces.common_props.weaken_apred1]]. Equal endomaps are then interchangeable in the hypothesis f ∘ f = id.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Idempotent_fun","base":"Idempotent_fun","kind":"def","start":80,"body":null,"status":"ok","short":{"text":"Idempotency as a morphism from endomaps of X to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.Idempotent]], obtained from [[AffineConstructive.interfaces.common_props.aIdempotent]] through [[AffineConstructive.interfaces.common_props.weaken_apred1]]. It lets the hypothesis f ∘ f = f be rewritten along an equality of endomaps.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Absorption_fun","base":"Absorption_fun","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"The absorption law as a morphism from pairs of operations to base propositions","status":"ok"},"long":{"text":"The canonical function structure on [[AffineConstructive.interfaces.common_props.Absorption]], viewed as a function of the pair (f, g) on the tensor of the two function sets, each under of course. The uncurrying is done by [[AffineConstructive.interfaces.prelude.eval_tuncurry]], and respect for equality comes from [[AffineConstructive.interfaces.common_props.aAbsorption]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]]. Declared canonical, it lets unification see an absorption hypothesis as the application of a function of sets, so either operation can be rewritten in it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.LeftDistribute_fun","base":"LeftDistribute_fun","kind":"def","start":82,"body":null,"status":"ok","short":{"text":"Left distributivity as a morphism from pairs of operations to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.LeftDistribute]], a function of the pair (f, g) uncurried by [[AffineConstructive.interfaces.prelude.eval_tuncurry]], with respect for equality from [[AffineConstructive.interfaces.common_props.aLeftDistribute]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]]. Both operations can be replaced by equal ones in a distributivity hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.RightDistribute_fun","base":"RightDistribute_fun","kind":"def","start":83,"body":null,"status":"ok","short":{"text":"Right distributivity as a morphism from pairs of operations to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.RightDistribute]], built as in [[AffineConstructive.interfaces.common_props.LeftDistribute_fun]] from [[AffineConstructive.interfaces.common_props.aRightDistribute]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.Distribute_fun","base":"Distribute_fun","kind":"def","start":84,"body":null,"status":"ok","short":{"text":"Distribution of a unary map over a binary operation, as a morphism to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.Distribute]], a function of the pair consisting of the endomap f and the operation g, with respect for equality from [[AffineConstructive.interfaces.common_props.aDistribute]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]]. It allows rewriting either f or g in the hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.AntiDistribute_fun","base":"AntiDistribute_fun","kind":"def","start":85,"body":null,"status":"ok","short":{"text":"Anti-distribution of a unary map over a binary operation, as a morphism to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.AntiDistribute]], obtained from [[AffineConstructive.interfaces.common_props.aAntiDistribute]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]], so that the law f(g(x, y)) = g(f y, f x) respects equality of f and g.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.LeftIdentity_fun","base":"LeftIdentity_fun","kind":"def","start":86,"body":null,"status":"ok","short":{"text":"Being a left identity, as a morphism from pairs (operation, element) to base propositions","status":"ok"},"long":{"text":"The canonical function structure on [[AffineConstructive.interfaces.common_props.LeftIdentity]], a function of the operation f and the candidate unit x, both under of course, with respect for equality from [[AffineConstructive.interfaces.common_props.aLeftIdentity]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]]. Declared canonical, it lets unification see a left identity hypothesis as the application of a function of sets, so the operation and the unit can both be rewritten in it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.RightIdentity_fun","base":"RightIdentity_fun","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"Being a right identity, as a morphism from pairs (operation, element) to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.RightIdentity]], obtained from [[AffineConstructive.interfaces.common_props.aRightIdentity]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]]. It makes the property invariant under equality of the operation and of the unit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.LeftAbsorb_fun","base":"LeftAbsorb_fun","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"Being left absorbing, as a morphism from pairs (operation, element) to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.LeftAbsorb]], obtained from [[AffineConstructive.interfaces.common_props.aLeftAbsorb]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]]. Both the operation and the absorbing element can be rewritten in the hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.RightAbsorb_fun","base":"RightAbsorb_fun","kind":"def","start":89,"body":null,"status":"ok","short":{"text":"Being right absorbing, as a morphism from pairs (operation, element) to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.RightAbsorb]], obtained from [[AffineConstructive.interfaces.common_props.aRightAbsorb]] through [[AffineConstructive.interfaces.common_props.weaken_apred2]]. Both the operation and the absorbing element can be rewritten in the hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.LeftInverse_fun","base":"LeftInverse_fun","kind":"def","start":90,"body":null,"status":"ok","short":{"text":"Being a left inverse, as a morphism from triples (operation, inverse, unit) to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.LeftInverse]], a function of the operation, the inverse map and the unit on the nested tensor of their sets under of course. The uncurrying is done by [[AffineConstructive.interfaces.prelude.eval_tuncurry3]], and respect for equality comes from [[AffineConstructive.interfaces.common_props.aLeftInverse]] through [[AffineConstructive.interfaces.common_props.weaken_apred3]]. Each of the three data can be replaced by an equal one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.common_props.RightInverse_fun","base":"RightInverse_fun","kind":"def","start":91,"body":null,"status":"ok","short":{"text":"Being a right inverse, as a morphism from triples (operation, inverse, unit) to base propositions","status":"ok"},"long":{"text":"The canonical morphism structure on [[AffineConstructive.interfaces.common_props.RightInverse]], built as in [[AffineConstructive.interfaces.common_props.LeftInverse_fun]] from [[AffineConstructive.interfaces.common_props.aRightInverse]] through [[AffineConstructive.interfaces.common_props.weaken_apred3]].","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.set_lambda":{"page":"set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

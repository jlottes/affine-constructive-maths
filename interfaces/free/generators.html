ripCoercions","kind":"def","local":false,"page":"../../tactics/strip_coercions.html"},{"s":909,"e":920,"lib":"AffineConstructive.interfaces.free.generators","name":"var_set_car","kind":"proj","local":true},{"s":1003,"e":1006,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"../set.html"},{"s":1011,"e":1014,"lib":"AffineConstructive.interfaces.free.generators","name":"Var","kind":"class","local":true},{"s":1019,"e":1026,"lib":"AffineConstructive.interfaces.free.generators","name":"var_set","kind":"rec","local":true},{"s":1031,"e":1044,"lib":"AffineConstructive.interfaces.free.generators","name":"Build_var_set","kind":"constr","local":true},{"s":1056,"e":1068,"lib":"AffineConstructive.interfaces.free.generators","name":"make_var_set","kind":"def","local":true},{"s":1106,"e":1113,"lib":"AffineConstructive.interfaces.free.generators","name":"var_set","kind":"rec","local":true},{"s":1122,"e":1125,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"../set.html"},{"s":1134,"e":1138,"lib":"AffineConstructive.implementations.list.base","name":"list","kind":"ind","local":false,"page":"../../implementations/list/base.html"},{"s":1168,"e":1172,"lib":"AffineConstructive.interfaces.set","name":"func","kind":"rec","local":false,"page":"../set.html"},{"s":1231,"e":1243,"lib":"AffineConstructive.interfaces.free.generators","name":"Var_Morphism","kind":"class","local":true},{"s":1246,"e":1263,"lib":"AffineConstructive.interfaces.free.generators","name":"var_morphism_func:25","kind":"meth","local":true},{"s":1289,"e":1303,"lib":"AffineConstructive.tactics.strip_coercions","name":"StripCoercions","kind":"def","local":false,"page":"../../tactics/strip_coercions.html"},{"s":1305,"e":1322,"lib":"AffineConstructive.interfaces.free.generators","name":"var_morphism_func","kind":"proj","local":true},{"s":1396,"e":1408,"lib":"AffineConstructive.interfaces.free.generators","name":"Var_Morphism","kind":"class","local":true},{"s":1505,"e":1512,"lib":"AffineConstructive.interfaces.free.generators","name":"var_set","kind":"rec","local":true},{"s":1521,"e":1524,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"../set.html"},{"s":1533,"e":1537,"lib":"AffineConstructive.implementations.list.base","name":"list","kind":"ind","local":false,"page":"../../implementations/list/base.html"},{"s":1546,"e":1559,"lib":"AffineConstructive.theory.projected_set","name":"projected_set","kind":"def","local":false,"page":"../../theory/projected_set.html"},{"s":1562,"e":1579,"lib":"AffineConstructive.interfaces.free.generators","name":"var_morphism_func","kind":"proj","local":true},{"s":1628,"e":1635,"lib":"AffineConstructive.interfaces.free.generators","name":"var_set","kind":"rec","local":true},{"s":1644,"e":1647,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"../set.html"},{"s":1656,"e":1660,"lib":"AffineConstructive.implementations.list.base","name":"list","kind":"ind","local":false,"page":"../../implementations/list/base.html"},{"s":1677,"e":1689,"lib":"AffineConstructive.interfaces.free.generators","name":"Var_Morphism","kind":"class","local":true},{"s":1696,"e":1708,"lib":"AffineConstructive.interfaces.free.generators","name":"var_morphism","kind":"canonstruc","local":true},{"s":1717,"e":1737,"lib":"AffineConstructive.interfaces.free.generators","name":"Build_var_morphism_t","kind":"constr","local":true},{"s":1749,"e":1766,"lib":"AffineConstructive.interfaces.free.generators","name":"make_var_morphism","kind":"def","local":true}],"gloss":{"summary":"This file sets up the interface for sets with named generators, which the quoting and normalization tactics use. A [[AffineConstructive.interfaces.free.generators.Var]] structure on a set names its generators var 0, var 1, … by the naturals. [[AffineConstructive.interfaces.free.generators.Var_Morphism]] says that a function sends each var n to the n-th entry of an environment list Γ, which makes it the evaluation at Γ of terms over the generators. The two are bundled: [[AffineConstructive.interfaces.free.generators.var_set]] is a set with named generators, and [[AffineConstructive.interfaces.free.generators.var_morphism]] is the set of functions that respect a given environment, with its equality projected from that of functions. The file states definitions only, no theorems; the free structures built on it supply the instances.","short":"Sets with generators named by naturals, and evaluation morphisms at an environment","items":[{"name":"AffineConstructive.interfaces.free.generators.Var","base":"Var","kind":"ind","start":4,"body":null,"status":"ok","short":{"text":"A naming of generators of a set: a function from the naturals to it, n ↦ var n","status":"ok"},"long":{"text":"A `Var X` is a function from the naturals into the set X, written `var n`. It names the generators, or variables, of a free algebraic structure: the n-th generator is `var n`. Nothing is required of the function. It is not assumed injective, and the generators need not generate anything. The class only fixes which elements play the role of variables.\n\nThe interface is there for the quoting and normalization tactics. A term over an algebraic signature is read as an element of a free structure, where its atoms appear as variables, and it is evaluated back into the target by a morphism that sends each variable to its value in an environment ([[AffineConstructive.interfaces.free.generators.Var_Morphism]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.generators.Var","base":"Var","kind":"rec","short":{"text":"The class of namings of generators of a set by the naturals","status":"ok"}},{"name":"AffineConstructive.interfaces.free.generators.var","base":"var","kind":"proj","short":{"text":"The n-th generator of a set with named generators","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.generators.Var_Morphism","base":"Var_Morphism","kind":"ind","start":6,"body":null,"status":"ok","short":{"text":"A function sends each generator var n to the n-th entry of an environment list Γ","status":"ok"},"long":{"text":"For a set X with named generators, a set Y, a list Γ of elements of Y and a function f from X to Y, `Var_Morphism Γ f` says that f(var n) = Γₙ for every index n within the bounds of Γ. The condition is the equality of Y, an affine proposition, and it is quantified in the base logic over n and over the proof that n is in bounds, so indices past the end of Γ impose nothing.\n\nThis is the interpretation half of a free construction: Γ assigns values to the variables, and a function satisfying the condition evaluates a term over the generators at that assignment. In the normalization tactics, Γ lists the atoms of a goal and f is the evaluation map out of a free structure.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.generators.Var_Morphism","base":"Var_Morphism","kind":"rec","short":{"text":"The property that f sends var n to the n-th element of Γ for every index in bounds","status":"ok"}},{"name":"AffineConstructive.interfaces.free.generators.preserves_var","base":"preserves_var","kind":"proj","short":{"text":"f(var n) equals the n-th element of Γ, for n in bounds, when f respects the variables","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.generators.has_var","base":"has_var","kind":"rec","start":9,"body":null,"status":"ok","short":{"text":"A record wrapping a naming of generators of a set, as a field of bundled structures","status":"ok"},"long":{"text":"`has_var X` holds a single [[AffineConstructive.interfaces.free.generators.Var]] structure on X. It exists so that a bundled record such as [[AffineConstructive.interfaces.free.generators.var_set]] can store its generators as a field that is a coercion, while instance resolution recovers the [[AffineConstructive.interfaces.free.generators.Var]] instance from the bundle through a hint that strips coercions. It has no mathematical content beyond [[AffineConstructive.interfaces.free.generators.Var]] itself.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.generators.op_var","base":"op_var","kind":"proj","short":{"text":"The naming of generators held by a has_var record","status":"ok"}},{"name":"AffineConstructive.interfaces.free.generators.HasVar","base":"HasVar","kind":"constr","short":{"text":"Builds a has_var record from a naming of generators","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.generators.var_set","base":"var_set","kind":"rec","start":12,"body":null,"status":"ok","short":{"text":"A set with named generators: a set bundled with a function from the naturals to it","status":"ok"},"long":{"text":"A `var_set` bundles a [[AffineConstructive.interfaces.set.set]] with a [[AffineConstructive.interfaces.free.generators.Var]] structure on it, so it is a set whose elements include named generators var 0, var 1, …. It is the type of the free structures the normalization tactics compute in: a free algebra over countably many variables, with its variables picked out. The carrier is a coercion, so a var_set can be used wherever a set is expected.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.generators.var_set_car","base":"var_set_car","kind":"proj","short":{"text":"The underlying set of a set with named generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.generators.var_set_var","base":"var_set_var","kind":"proj","short":{"text":"The naming of generators of a set with named generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.generators.Build_var_set","base":"Build_var_set","kind":"constr","short":{"text":"Builds a set with named generators from a set and a has_var record on it","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.generators.make_var_set","base":"make_var_set","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"Bundles a set and a naming of its generators into a set with named generators","status":"ok"},"long":{"text":"`make_var_set X` is the [[AffineConstructive.interfaces.free.generators.var_set]] whose carrier is X and whose generators come from the [[AffineConstructive.interfaces.free.generators.Var]] instance on X that resolution finds. It is the constructor to use in practice, since it takes the instance directly rather than wrapped in a [[AffineConstructive.interfaces.free.generators.has_var]] record.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.generators.var_morphism_t","base":"var_morphism_t","kind":"rec","start":16,"body":null,"status":"ok","short":{"text":"Functions from a set with generators to Y that send var n to the n-th entry of Γ","status":"ok"},"long":{"text":"For a set X with named generators, a set Y and an environment Γ, a list of elements of Y, a `var_morphism_t X Γ` is a [[AffineConstructive.interfaces.set.func]] from X to Y together with a proof of [[AffineConstructive.interfaces.free.generators.Var_Morphism]] for Γ. These are the evaluation maps that interpret the variables of X by the entries of Γ. The record is the carrier of the set [[AffineConstructive.interfaces.free.generators.var_morphism]], and the function is a coercion, so such a morphism is applied as a function.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.generators.var_morphism_func","base":"var_morphism_func","kind":"proj","short":{"text":"The underlying function of a morphism that respects the variable assignment","status":"ok"}},{"name":"AffineConstructive.interfaces.free.generators.var_morphism_prop","base":"var_morphism_prop","kind":"proj","short":{"text":"The proof that the function sends each var n to the n-th entry of Γ","status":"ok"}},{"name":"AffineConstructive.interfaces.free.generators.Build_var_morphism_t","base":"Build_var_morphism_t","kind":"constr","short":{"text":"Builds a variable-respecting morphism from a function and the proof that it respects Γ","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.generators.var_morphism","base":"var_morphism","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The set of functions from X to Y sending each generator var n to the n-th entry of Γ","status":"ok"},"long":{"text":"`var_morphism X Γ` makes the morphisms of [[AffineConstructive.interfaces.free.generators.var_morphism_t]] into a [[AffineConstructive.interfaces.set.set]]. Its equality is the equality of the underlying functions in [[AffineConstructive.interfaces.set.func]], pulled back along [[AffineConstructive.interfaces.free.generators.var_morphism_func]] as a projected set. The proof of [[AffineConstructive.interfaces.free.generators.Var_Morphism]] carries no information, so two such morphisms are equal exactly when their functions are equal. It is declared canonical, so that a variable-respecting morphism is seen as an element of a set without further annotation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.generators.make_var_morphism","base":"make_var_morphism","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"Packages a function and a proof that it respects Γ as an element of var_morphism X Γ","status":"ok"},"long":{"text":"`make_var_morphism Γ f` is f, regarded as an element of [[AffineConstructive.interfaces.free.generators.var_morphism]] X Γ. The proof of [[AffineConstructive.interfaces.free.generators.Var_Morphism]] for Γ and f is found by instance resolution. It is the constructor to use in practice, stated with the target type [[AffineConstructive.interfaces.free.generators.var_morphism]] rather than the bare record [[AffineConstructive.interfaces.free.generators.var_morphism_t]].","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_notation":{"page":"../bundled_notation.html","short":"One-field records holding an operation, and hints for resolution to read it back","summary":"The file defines one-field records, each holding a single operation or structure: an order relation ([[has_le]]); a monoid unit, zero, one, top or bottom element; a binary operation, addition, multiplication, meet or join; an inversion or negation; or a decision procedure for the equality of a set ([[has_dec_eq]]). The constructors of all but the last are coercions. Global hints at priority 4 let instance resolution recover the operation: given a goal such as `Plus X`, they strip the coercions from X to reach the term underneath and apply the record's projection to it. The module `definition_hints` adds fallback hints at priority 8 that take the operation from a record found among the hypotheses in context. They cover the unit, zero, one, the binary operation, inversion, addition, negation, multiplication and decidable equality."},"AffineConstructive.theory.projected_set":{"page":"../../theory/projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.implementations.nat":{"page":"../../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.implementations.list":{"page":"../../implementations/list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.tactics.strip_coercions":{"page":"../../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

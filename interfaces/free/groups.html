","kind":"rec","local":true},{"s":5762,"e":5837,"lib":"AffineConstructive.interfaces.free.groups","name":"car","kind":"proj","local":true},{"s":5846,"e":5914,"lib":"AffineConstructive.interfaces.free.groups","name":"var","kind":"proj","local":true},{"s":5923,"e":5997,"lib":"AffineConstructive.interfaces.free.groups","name":"dec_eq","kind":"proj","local":true},{"s":6006,"e":6080,"lib":"AffineConstructive.interfaces.free.groups","name":"is_dec_eq","kind":"proj","local":true},{"s":6089,"e":6164,"lib":"AffineConstructive.interfaces.free.groups","name":"to_var_set","kind":"canonstruc","local":true},{"s":6173,"e":6272,"lib":"AffineConstructive.interfaces.free.groups","name":"mor_f","kind":"proj","local":true},{"s":6281,"e":6361,"lib":"AffineConstructive.interfaces.free.groups","name":"mor_prop","kind":"proj","local":true},{"s":6370,"e":6454,"lib":"AffineConstructive.interfaces.free.groups","name":"to_var_mor","kind":"def","local":true},{"s":6463,"e":6543,"lib":"AffineConstructive.interfaces.free.groups","name":"X","kind":"proj","local":true}],"gloss":{"summary":"The file states the interfaces of three free algebraic structures on countably many generators: commutative additive monoids, commutative monoids written multiplicatively, and abelian groups. Each interface has the same three layers. The first is the algebra with named generators and a correct decision procedure for its equality ([[free_additive_monoid.t]] and its siblings). The second is the type of evaluation morphisms into a target algebra, which send the n-th generator to the n-th entry of an environment Γ. The third is the free structure itself, an algebra with generators together with an evaluation into every target for every environment. Only the existence half of the universal property is required. That half is what the quoting and normalisation tactics need: they decide an equation in the free structure and carry the verdict to the target along the evaluation. The file builds on the generic notions of [[AffineConstructive.interfaces.free.generators.has_var]] and [[AffineConstructive.interfaces.free.generators.var_morphism_t]] from interfaces/free/generators.v. Concrete free algebras in implementations/ meet these interfaces.","short":"Free commutative monoids and abelian groups on countably many generators, for the decision tactics","items":[{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.t","base":"t","kind":"rec","start":5,"body":null,"status":"ok","short":{"text":"A commutative additive monoid with named generators and a decision procedure for its equality","status":"ok"},"long":{"text":"The carrier half of the interface of a free commutative additive monoid. It is an [[AffineConstructive.interfaces.bundled_algebra.additive_monoid]] together with a naming of its generators ([[AffineConstructive.interfaces.free.generators.has_var]]: the n-th generator is var n), a boolean test for equality ([[AffineConstructive.interfaces.bundled_notation.has_dec_eq]]) and the proof that the test decides the monoid's equality ([[AffineConstructive.interfaces.set.IsDecEq]]).\n\nThe decision procedure is part of the structure because the quoting tactics use this monoid as a place to compute normal forms. Both sides of an equation are read as terms over generators, compared by the decision procedure, and the verdict is carried back to the original monoid along an evaluation morphism. Freeness itself, the existence of that evaluation, is added in [[free_additive_monoid.F]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.car","base":"car","kind":"proj","short":{"text":"The underlying commutative additive monoid of a monoid with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.var","base":"var","kind":"proj","short":{"text":"The naming of generators of a monoid with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.dec_eq","base":"dec_eq","kind":"proj","short":{"text":"The boolean equality test of a monoid with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.is_dec_eq","base":"is_dec_eq","kind":"proj","short":{"text":"The proof that the equality test decides the monoid's equality","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.Build_t","base":"Build_t","kind":"constr","short":{"text":"Builds a monoid with generators from a monoid, its generators and a correct equality test","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.to_var_set","base":"to_var_set","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The set with named generators underlying a monoid with generators","status":"ok"},"long":{"text":"Forgets the algebra and the equality test of a [[free_additive_monoid.t]], keeping its carrier with the naming of its generators, by [[AffineConstructive.interfaces.free.generators.make_var_set]]. Through it the generic notions about generators, in particular the morphisms that respect an environment ([[AffineConstructive.interfaces.free.generators.var_morphism_t]]), apply to the monoid.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.coercion:to_var_set","base":"coercion:to_var_set","kind":"coercion","start":8,"body":null,"status":"ok","short":{"text":"A monoid with generators can be used as its underlying set with named generators","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.mor","base":"mor","kind":"rec","start":11,"body":null,"status":"ok","short":{"text":"Monoid morphisms from F to M sending the n-th generator to the n-th entry of Γ","status":"ok"},"long":{"text":"For a monoid with generators F, a commutative additive monoid M and a list Γ of elements of M (an environment), a morphism of additive monoids from F to M ([[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism_t]]: it preserves addition and zero) that sends each generator var n to the n-th element of Γ whenever n is in bounds ([[AffineConstructive.interfaces.free.generators.Var_Morphism]]).\n\nThis is the evaluation map of the universal property of a free monoid, restricted to finitely many generators named by position: Γ assigns values to the variables, and the morphism extends the assignment to all of F.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.mor_f","base":"mor_f","kind":"proj","short":{"text":"The underlying monoid morphism of an evaluation morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.mor_prop","base":"mor_prop","kind":"proj","short":{"text":"An evaluation morphism sends each generator to its entry of Γ","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.Build_mor","base":"Build_mor","kind":"constr","short":{"text":"Builds an evaluation morphism from a monoid morphism that respects Γ","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.to_var_mor","base":"to_var_mor","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"An evaluation morphism seen as a function respecting the environment Γ","status":"ok"},"long":{"text":"Forgets that an evaluation morphism [[free_additive_monoid.mor]] preserves the monoid structure and keeps the function with its behaviour on generators, as an element of [[AffineConstructive.interfaces.free.generators.var_morphism_t]] built by [[AffineConstructive.interfaces.free.generators.make_var_morphism]]. The generic facts about functions on sets with generators then apply to it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.coercion:to_var_mor","base":"coercion:to_var_mor","kind":"coercion","start":15,"body":null,"status":"ok","short":{"text":"An evaluation morphism of monoids with generators can be used as a function respecting the environment Γ","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.F","base":"F","kind":"rec","start":17,"body":null,"status":"ok","short":{"text":"A free commutative additive monoid: a monoid with generators and an evaluation into every monoid","status":"ok"},"long":{"text":"The interface of a free commutative additive monoid on countably many generators. It is a monoid with generators and a correct equality test ([[free_additive_monoid.t]]) with an evaluation: for every commutative additive monoid M and every environment Γ, a list of elements of M, a monoid morphism from it to M that sends the n-th generator to the n-th entry of Γ ([[free_additive_monoid.mor]]).\n\nThis is the existence half of the universal property of the free monoid. Uniqueness of the evaluation is not part of the interface, and the tactics do not need it. They quote two expressions of M as elements of the free monoid with the same environment and decide their equality there. Equal quotations evaluate to equal results because the evaluation is a function that preserves equality, and the evaluation of a quotation is the original expression because it is a morphism that respects Γ.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.X","base":"X","kind":"proj","short":{"text":"The monoid with generators underlying a free commutative additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.eval","base":"eval","kind":"proj","short":{"text":"The evaluation morphism into a monoid M determined by an environment Γ in M","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid.Build_F","base":"Build_F","kind":"constr","short":{"text":"Builds a free commutative additive monoid from a monoid with generators and an evaluation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_monoid","base":"free_additive_monoid","kind":"abbrev","start":19,"body":null,"status":"ok","short":{"text":"Shorthand for the interface of free commutative additive monoids","status":"ok"},"long":{"text":"An abbreviation for [[free_additive_monoid.F]], so that a free commutative additive monoid is written by the name of its kind. Its carrier, generators, equality test and evaluation are reached through the record's projections and coercions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_monoid.car","base":"coercion:free_additive_monoid.car","kind":"coercion","start":20,"body":null,"status":"ok","short":{"text":"Outside its module, a monoid with generators can be used as its carrier additive monoid","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_monoid.var","base":"coercion:free_additive_monoid.var","kind":"coercion","start":21,"body":null,"status":"ok","short":{"text":"Outside its module, a monoid with generators supplies its map from variables to elements","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_monoid.dec_eq","base":"coercion:free_additive_monoid.dec_eq","kind":"coercion","start":22,"body":null,"status":"ok","short":{"text":"Outside its module, a monoid with generators supplies the decidable equality on its variables","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_monoid.is_dec_eq","base":"coercion:free_additive_monoid.is_dec_eq","kind":"coercion","start":23,"body":null,"status":"ok","short":{"text":"Outside its module, a monoid with generators supplies the proof that its equality on variables is decidable","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_monoid.to_var_set", undled_algebra.commutative_monoid]] with a naming of its generators ([[AffineConstructive.interfaces.free.generators.has_var]]), a boolean equality test ([[AffineConstructive.interfaces.bundled_notation.has_dec_eq]]) and the proof that the test decides equality ([[AffineConstructive.interfaces.set.IsDecEq]]).\n\nIts role is the same as that of [[free_additive_monoid.t]] for the additive notation. The quoting tactics use it to compute normal forms of products and decide their equality.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.car","base":"car","kind":"proj","short":{"text":"The underlying commutative monoid of a monoid with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.var","base":"var","kind":"proj","short":{"text":"The naming of generators of a commutative monoid with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.dec_eq","base":"dec_eq","kind":"proj","short":{"text":"The boolean equality test of a commutative monoid with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.is_dec_eq","base":"is_dec_eq","kind":"proj","short":{"text":"The proof that the equality test decides the monoid's equality","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.Build_t","base":"Build_t","kind":"constr","short":{"text":"Builds a commutative monoid with generators from a monoid, its generators and a correct equality test","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.to_var_set","base":"to_var_set","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"The set with named generators underlying a commutative monoid with generators","status":"ok"},"long":{"text":"Keeps the carrier and the naming of generators of a [[free_commutative_monoid.t]], by [[AffineConstructive.interfaces.free.generators.make_var_set]], so that the notions about generators, such as [[AffineConstructive.interfaces.free.generators.var_morphism_t]], apply to it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.coercion:to_var_set","base":"coercion:to_var_set","kind":"coercion","start":34,"body":null,"status":"ok","short":{"text":"A commutative monoid with generators can be used as its underlying set with named generators","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.mor","base":"mor","kind":"rec","start":37,"body":null,"status":"ok","short":{"text":"Monoid morphisms from F to M sending the n-th generator to the n-th entry of Γ","status":"ok"},"long":{"text":"For a commutative monoid with generators F, a commutative monoid M and an environment Γ in M, a monoid morphism from F to M ([[AffineConstructive.interfaces.bundled_algebra.monoid_morphism_t]]: it preserves the operation and the unit) that sends var n to the n-th element of Γ whenever n is in bounds ([[AffineConstructive.interfaces.free.generators.Var_Morphism]]). This is the evaluation of the universal property of the free commutative monoid, with the variables given values by Γ.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.mor_f","base":"mor_f","kind":"proj","short":{"text":"The underlying monoid morphism of an evaluation morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.mor_prop","base":"mor_prop","kind":"proj","short":{"text":"An evaluation morphism sends each generator to its entry of Γ","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.Build_mor","base":"Build_mor","kind":"constr","short":{"text":"Builds an evaluation morphism from a monoid morphism that respects Γ","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.to_var_mor","base":"to_var_mor","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"An evaluation morphism seen as a function respecting the environment Γ","status":"ok"},"long":{"text":"Forgets the monoid structure that an evaluation morphism [[free_commutative_monoid.mor]] preserves and keeps the function with its behaviour on generators, as an element of [[AffineConstructive.interfaces.free.generators.var_morphism_t]] built by [[AffineConstructive.interfaces.free.generators.make_var_morphism]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.coercion:to_var_mor","base":"coercion:to_var_mor","kind":"coercion","start":41,"body":null,"status":"ok","short":{"text":"An evaluation morphism of commutative monoids with generators can be used as a function respecting the environment Γ","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.F","base":"F","kind":"rec","start":43,"body":null,"status":"ok","short":{"text":"A free commutative monoid: a monoid with generators and an evaluation into every commutative monoid","status":"ok"},"long":{"text":"The interface of a free commutative monoid on countably many generators, written multiplicatively. It is a commutative monoid with generators and a correct equality test ([[free_commutative_monoid.t]]) with an evaluation: for every commutative monoid M and environment Γ in M, a monoid morphism into M that sends the n-th generator to the n-th entry of Γ ([[free_commutative_monoid.mor]]).\n\nAs with [[free_additive_monoid.F]], only the existence of the evaluation is required. That is what a decision procedure needs: an equality decided between quotations in the free monoid is carried along the evaluation to the expressions they quote.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_commutative_monoid.X","base":"X","kind":"proj","shor n generators can be used as the commutative monoid with generators it is built on","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.t","base":"t","kind":"rec","start":57,"body":null,"status":"ok","short":{"text":"An abelian group with named generators and a decision procedure for its equality","status":"ok"},"long":{"text":"The carrier half of the interface of a free abelian group, written additively. It is an [[AffineConstructive.interfaces.bundled_algebra.additive_group]] with a naming of its generators ([[AffineConstructive.interfaces.free.generators.has_var]]), a boolean equality test ([[AffineConstructive.interfaces.bundled_notation.has_dec_eq]]) and the proof that the test decides equality ([[AffineConstructive.interfaces.set.IsDecEq]]).\n\nThe group simplification tactics compute in it. Expressions in an abelian group are quoted as elements of the free group, where they have decidable normal forms.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.car","base":"car","kind":"proj","short":{"text":"The underlying abelian group of a group with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.var","base":"var","kind":"proj","short":{"text":"The naming of generators of a group with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.dec_eq","base":"dec_eq","kind":"proj","short":{"text":"The boolean equality test of a group with generators","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.is_dec_eq","base":"is_dec_eq","kind":"proj","short":{"text":"The proof that the equality test decides the group's equality","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.Build_t","base":"Build_t","kind":"constr","short":{"text":"Builds a group with generators from an abelian group, its generators and a correct equality test","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.to_var_set","base":"to_var_set","kind":"def","start":59,"body":null,"status":"ok","short":{"text":"The set with named generators underlying a group with generators","status":"ok"},"long":{"text":"Keeps the carrier and the naming of generators of a [[free_additive_group.t]], by [[AffineConstructive.interfaces.free.generators.make_var_set]], so that the notions about generators, such as [[AffineConstructive.interfaces.free.generators.var_morphism_t]], apply to it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.coercion:to_var_set","base":"coercion:to_var_set","kind":"coercion","start":60,"body":null,"status":"ok","short":{"text":"A group with generators can be used as its underlying set with named generators","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.mor","base":"mor","kind":"rec","start":63,"body":null,"status":"ok","short":{"text":"Group morphisms from F to G sending the n-th generator to the n-th entry of Γ","status":"ok"},"long":{"text":"For a group with generators F, an abelian group G and an environment Γ in G, a function from F to G that preserves addition and zero ([[AffineConstructive.interfaces.bundled_algebra.additive_non_com_monoid_morphism_t]]) and sends var n to the n-th element of Γ whenever n is in bounds ([[AffineConstructive.interfaces.free.generators.Var_Morphism]]).\n\nThe morphism is asked only to preserve the monoid structure. Between groups this is enough, because a function that preserves addition and zero also preserves negation. This is the evaluation of the universal property of the free abelian group.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.mor_f","base":"mor_f","kind":"proj","short":{"text":"The underlying additive morphism of an evaluation morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.mor_prop","base":"mor_prop","kind":"proj","short":{"text":"An evaluation morphism sends each generator to its entry of Γ","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.Build_mor","base":"Build_mor","kind":"constr","short":{"text":"Builds an evaluation morphism from an additive morphism that respects Γ","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.to_var_mor","base":"to_var_mor","kind":"def","start":66,"body":null,"status":"ok","short":{"text":"An evaluation morphism seen as a function respecting the environment Γ","status":"ok"},"long":{"text":"Forgets the additive structure that an evaluation morphism [[free_additive_group.mor]] preserves and keeps the function with its behaviour on generators, as an element of [[AffineConstructive.interfaces.free.generators.var_morphism_t]] built by [[AffineConstructive.interfaces.free.generators.make_var_morphism]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.coercion:to_var_mor","base":"coercion:to_var_mor","kind":"coercion","start":67,"body":null,"status":"ok","short":{"text":"An evaluation morphism of groups with generators can be used as a function respecting the environment Γ","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.F","base":"F","kind":"rec","start":69,"body":null,"status":"ok","short":{"text":"A free abelian group: a group with generators and an evaluation into every abelian group","status":"ok"},"long":{"text":"The interface of a free abelian group on countably many generators, written additively. It is a group with generators and a correct equality test ([[free_additive_group.t]]) with an evaluation: for every abelian group G and environment Γ in G, a morphism into G that sends the n-th generator to the n-th entry of Γ ([[free_additive_group.mor]]).\n\nOnly the existence half of the universal property is required. Concrete implementations, such as formal integer combinations of generators, supply it, and the group simplification tactics use it. A goal in G is quoted into the free group, normalised and decided there, and the result is carried back along the evaluation.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.X","base":"X","kind":"proj","short":{"text":"The group with generators underlying a free abelian group","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.eval","base":"eval","kind":"proj","short":{"text":"The evaluation morphism into an abelian group G determined by an environment Γ in G","status":"ok"}},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group.Build_F","base":"Build_F","kind":"constr","short":{"text":"Builds a free abelian group from a group with generators and an evaluation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free.groups.free_additive_group","base":"free_additive_group","kind":"abbrev","start":71,"body":null,"status":"ok","short":{"text":"Shorthand for the interface of free abelian groups","status":"ok"},"long":{"text":"An abbreviation for [[free_additive_group.F]], so that a free abelian group is written by the name of its kind.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.car","base":"coercion:free_additive_group.car","kind":"coercion","start":72,"body":null,"status":"ok","short":{"text":"Outside its module, a group with generators can be used as its carrier additive group","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.var","base":"coercion:free_additive_group.var","kind":"coercion","start":73,"body":null,"status":"ok","short":{"text":"Outside its module, a group with generators supplies its map from variables to elements","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.dec_eq","base":"coercion:free_additive_group.dec_eq","kind":"coercion","start":74,"body":null,"status":"ok","short":{"text":"Outside its module, a group with generators supplies the decidable equality on its variables","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.is_dec_eq","base":"coercion:free_additive_group.is_dec_eq","kind":"coercion","start":75,"body":null,"status":"ok","short":{"text":"Outside its module, a group with generators supplies the proof that its equality on variables is decidable","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.to_var_set","base":"coercion:free_additive_group.to_var_set","kind":"coercion","start":76,"body":null,"status":"ok","short":{"text":"Outside its module, a group with generators can be used as its underlying set with named generators","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.mor_f","base":"coercion:free_additive_group.mor_f","kind":"coercion","start":77,"body":null,"status":"ok","short":{"text":"Outside its module, an evaluation morphism of groups can be used as its underlying monoid morphism","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.mor_prop","base":"coercion:free_additive_group.mor_prop","kind":"coercion","start":78,"body":null,"status":"ok","short":{"text":"Outside its module, an evaluation morphism of groups supplies the fact that it sends each generator to its value in Γ","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.to_var_mor","base":"coercion:free_additive_group.to_var_mor","kind":"coercion","start":79,"body":null,"status":"ok","short":{"text":"Outside its module, an evaluation morphism of groups can be used as a function respecting the environment Γ","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.free.groups.coercion:free_additive_group.X","base":"coercion:free_additive_group.X","kind":"coercion","start":80,"body":null,"status":"ok","short":{"text":"A free group on given generators can be used as the group with generators it is built on","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.free.generators":{"page":"generators.html","short":"Sets with generators named by naturals, and evaluation morphisms at an environment","summary":"This file sets up the interface for sets with named generators, which the quoting and normalization tactics use. A [[Var]] structure on a set names its generators var 0, var 1, … by the naturals. [[Var_Morphism]] says that a function sends each var n to the n-th entry of an environment list Γ, which makes it the evaluation at Γ of terms over the generators. The two are bundled: [[var_set]] is a set with named generators, and [[var_morphism]] is the set of functions that respect a given environment, with its equality projected from that of functions. The file states definitions only, no theorems; the free structures built on it supply the instances."},"AffineConstructive.implementations.nat":{"page":"../../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.implementations.list":{"page":"../../implementations/list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.tactics.strip_coercions":{"page":"../../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

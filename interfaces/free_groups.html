"page":"set.html"},{"s":610,"e":616,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Monoid","kind":"class","local":false,"page":"abstract_algebra.html"},{"s":632,"e":648,"lib":"AffineConstructive.interfaces.free_groups","name":"from_free_monoid","kind":"def","local":true},{"s":686,"e":689,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":697,"e":703,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Monoid","kind":"class","local":false,"page":"abstract_algebra.html"},{"s":730,"e":745,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Monoid_Morphism","kind":"class","local":false,"page":"abstract_algebra.html"},{"s":767,"e":783,"lib":"AffineConstructive.interfaces.free_groups","name":"from_free_monoid","kind":"def","local":true},{"s":791,"e":845,"lib":"AffineConstructive.interfaces.free_groups","name":"free_monoid_structure","kind":"meth","local":true},{"s":872,"e":887,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Monoid_Morphism","kind":"class","local":false,"page":"abstract_algebra.html"},{"s":889,"e":905,"lib":"AffineConstructive.interfaces.free_groups","name":"from_free_monoid","kind":"def","local":true},{"s":943,"e":963,"lib":"AffineConstructive.interfaces.free_groups","name":"from_free_monoid_mor","kind":"meth","local":true},{"s":1012,"e":1036,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"MonUnit_Pointed_Morphism","kind":"class","local":false,"page":"abstract_algebra.html"},{"s":1038,"e":1054,"lib":"AffineConstructive.interfaces.free_groups","name":"from_free_monoid","kind":"def","local":true},{"s":1092,"e":1112,"lib":"AffineConstructive.interfaces.free_groups","name":"from_free_monoid_mor","kind":"meth","local":true},{"s":1161,"e":1179,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"SemiGroup_Morphism","kind":"class","local":false,"page":"abstract_algebra.html"},{"s":1181,"e":1197,"lib":"AffineConstructive.interfaces.free_groups","name":"from_free_monoid","kind":"def","local":true},{"s":1235,"e":1255,"lib":"AffineConstructive.interfaces.free_groups","name":"from_free_monoid_mor","kind":"meth","local":true}],"gloss":{"summary":"This file states the interface for free monoids. [[AffineConstructive.interfaces.free_groups.FromFreeMonoid]] equips a map i : X ⇾ F with an extension operation sending each f : X ⇾ Y, Y carrying an operation and a unit, to a map F ⇾ Y. [[AffineConstructive.interfaces.free_groups.FreeMonoid]] states the universal property: F is a monoid, and for every monoid Y the extension of f is a monoid morphism, agrees with f along i, and is the only monoid morphism that does. The free monoid's monoid structure is available by coercion, and hints let resolution see the extension as a monoid, semigroup and unit-preserving morphism. A free semigroup interface is sketched in a comment but not defined.","short":"The interface for free monoids: the extension operation and its universal property","items":[{"name":"AffineConstructive.interfaces.free_groups.FromFreeMonoid","base":"FromFreeMonoid","kind":"ind","start":1,"body":null,"status":"ok","short":{"text":"The extension operation for i : X ⇾ F, sending each f : X ⇾ Y to a map F ⇾ Y","status":"ok"},"long":{"text":"For a function i : X ⇾ F, an instance of this class provides the operation that is supposed to witness F as the free monoid on X. Given any set Y with a binary operation and a unit, and any function f : X ⇾ Y, it produces a function F ⇾ Y, the intended extension of f along i.\n\nThe class provides only this operation. It makes no claim that the result is a monoid morphism, that it extends f, or that it is unique. Those properties are the content of [[AffineConstructive.interfaces.free_groups.FreeMonoid]], the only definition built on it, which states the universal property of the free monoid as a proposition about this map. Keeping the operation apart from its laws follows the arrangement of the algebraic hierarchy, where operations such as [[AffineConstructive.interfaces.algebra_notation.SgOp]] and [[AffineConstructive.interfaces.algebra_notation.MonUnit]] are structure and the axioms are propositions about them.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free_groups.FromFreeMonoid","base":"FromFreeMonoid","kind":"rec","short":{"text":"The class of extension operations for a map i : X ⇾ F","status":"ok"}},{"name":"AffineConstructive.interfaces.free_groups.from_free_monoid","base":"from_free_monoid","kind":"proj","short":{"text":"The extension F ⇾ Y of a function f : X ⇾ Y along i","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free_groups.FreeMonoid","base":"FreeMonoid","kind":"rec","start":3,"body":null,"status":"ok","short":{"text":"F with i : X ⇾ F is the free monoid on X: each f extends uniquely to a monoid morphism","status":"ok"},"long":{"text":"This class asserts that F, together with its operation, its unit and the map i : X ⇾ F of generators, is the free monoid on X. F must be a [[AffineConstructive.interfaces.abstract_algebra.Monoid]]. For every monoid Y and every function f : X ⇾ Y, the extension from_free_monoid i f must be a [[AffineConstructive.interfaces.abstract_algebra.Monoid_Morphism]] satisfying from_free_monoid i f ∘ i = f. Any monoid morphism h : F ⇾ Y with h ∘ i = f must equal it. These are existence and uniqueness of the factorisation through i, which is the universal property of the free monoid, or equivalently initiality of i among maps from X into monoids.\n\n```tikzcd\nX \\arrow[r, \"i\"] \\arrow[dr, \"f\"'] & F \\arrow[d, dashed, \"\\exists!\\, h\"] \\\\\n & Y\n```\n\nThe equations relate functions of sets, so they are affine equalities, and uniqueness is stated as an implication from h ∘ i = f to h = from_free_monoid i f. The class is a proposition, so the extension itself is data that has to be supplied beforehand, by [[AffineConstructive.interfaces.free_groups.FromFreeMonoid]]. A free monoid is in particular a monoid by coercion. Instance resolution finds the extension to be a monoid morphism, a [[AffineConstructive.interfaces.abstract_algebra.SemiGroup_Morphism]] and a [[AffineConstructive.interfaces.abstract_algebra.MonUnit_Pointed_Morphism]] by projecting the morphism field.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free_groups.free_monoid_structure","base":"free_monoid_structure","kind":"proj","short":{"text":"The monoid structure on the carrier of a free monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.free_groups.from_free_monoid_mor","base":"from_free_monoid_mor","kind":"proj","short":{"text":"The extension of any f : X ⇾ Y into a monoid is a monoid morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.free_groups.from_free_monoid_ext","base":"from_free_monoid_ext","kind":"proj","short":{"text":"The extension of f along i restricts to f on the generators: from_free_monoid i f ∘ i = f","status":"ok"}},{"name":"AffineConstructive.interfaces.free_groups.free_monoid_initial","base":"free_monoid_initial","kind":"proj","short":{"text":"A monoid morphism h with h ∘ i = f equals the extension of f","status":"ok"}},{"name":"AffineConstructive.interfaces.free_groups.Build_FreeMonoid","base":"Build_FreeMonoid","kind":"constr","short":{"text":"Builds a free monoid from monoid laws, the extension's morphism and extension properties, and uniqueness","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free_groups.coercion:free_monoid_structure","base":"coercion:free_monoid_structure","kind":"coercion","start":4,"body":null,"status":"ok","short":{"text":"A free monoid serves as a monoid, so the monoid laws apply to its carrier, through [[AffineConstructive.interfaces.free_groups.free_monoid_structure]]","status":"ok"},"proof":[]}],"diagrams":{"svg":{"\nX \\arrow[r, \"i\"] \\arrow[dr, \"f\"'] & F \\arrow[d, dashed, \"\\exists!\\, h\"] \\\\\n & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.  two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."}},"constants":null}</script>

g_monoid","kind":"def","local":true},{"s":1019,"e":1020,"lib":"AffineConstructive.interfaces.free_monoid","name":"strong.i","kind":"var","local":true},{"s":1059,"e":1075,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"strong_op_monoid","kind":"rec","local":false,"page":"bundled_algebra.html"},{"s":1084,"e":1085,"lib":"AffineConstructive.interfaces.free_monoid","name":"strong.X","kind":"var","local":true},{"s":1094,"e":1096,"lib":"AffineConstructive.interfaces.free_monoid","name":"strong.Xs","kind":"var","local":true},{"s":1118,"e":1119,"lib":"AffineConstructive.interfaces.free_monoid","name":"strong.i","kind":"var","local":true},{"s":1126,"e":1149,"lib":"AffineConstructive.interfaces.free_monoid","name":"from_free_strong_monoid","kind":"def","local":true}],"gloss":{"summary":"The file states the universal property of a free monoid, separating data from laws. [[AffineConstructive.interfaces.free_monoid.FromFreeMonoid]] gives the data: for a map i from a set X into a monoid Xs, an operation extending each map from X into a monoid M to a monoid morphism from Xs to M. [[AffineConstructive.interfaces.free_monoid.FreeMonoid]] gives the laws: the extension restricts to the original map along i, and it is the only morphism that does. A parallel pair, [[AffineConstructive.interfaces.free_monoid.FromFreeStrongMonoid]] and [[AffineConstructive.interfaces.free_monoid.FreeStrongMonoid]], states the same property among monoids with a strong operation; there the extension is a function of sets, so it preserves equality and, being affine, apartness as well. Concrete models, such as lists, use these interfaces to show that they are free monoids.","short":"Universal property of free monoids and free strong monoids, data separated from laws","items":[{"name":"AffineConstructive.interfaces.free_monoid.FromFreeMonoid","base":"FromFreeMonoid","kind":"ind","start":5,"body":null,"status":"ok","short":{"text":"The extension operation of a candidate free monoid: each map from the generators to a monoid gives a monoid morphism","status":"ok"},"long":{"text":"Given a set X of generators, a monoid Xs and a map i from X to Xs, an instance of this class provides, for every monoid M, an operation sending a map f from X to M to a monoid morphism from Xs to M (an element of [[AffineConstructive.interfaces.bundled_algebra.monoid_morphism]]). It is the data of the universal property of the free monoid on X, with i as the insertion of generators; the laws that make the data universal are stated separately in [[AffineConstructive.interfaces.free_monoid.FreeMonoid]].\n\nThe operation is an operation of the base logic, not a function of sets: nothing is asked here of how it treats equal maps f. Uniqueness in [[AffineConstructive.interfaces.free_monoid.FreeMonoid]] gives that consequence for equality anyway, and the strong variant [[AffineConstructive.interfaces.free_monoid.FromFreeStrongMonoid]] builds it into the type.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free_monoid.FromFreeMonoid","base":"FromFreeMonoid","kind":"rec","short":{"text":"The class of extension operations along a map from a set into a monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.free_monoid.from_free_monoid","base":"from_free_monoid","kind":"proj","short":{"text":"The monoid morphism out of Xs extending a map from the generators to a monoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free_monoid.FreeMonoid","base":"FreeMonoid","kind":"rec","start":7,"body":null,"status":"ok","short":{"text":"Xs is the free monoid on X with insertion of generators i: maps from X extend uniquely to monoid morphisms","status":"ok"},"long":{"text":"The universal property of the free monoid, relative to an extension operation [[AffineConstructive.interfaces.free_monoid.from_free_monoid]]. Two laws hold for every monoid M and every map f from X to M: the extension of f, composed with i, equals f; and any monoid morphism h from Xs to M whose composite with i equals f is equal to the extension of f. Equality of maps and of morphisms here is the affine equality of the function sets, so both laws are affine statements carrying their contrapositives; uniqueness, for instance, also says that a morphism apart from the extension of f differs from f on the generators.\n\n\\begin{tikzcd} X \\arrow[r, \"i\"] \\arrow[dr, \"f\"'] & X_s \\arrow[d, \"\\bar f\"] \\\\ & M \\end{tikzcd}\n\nThe class is a proposition about the data in [[AffineConstructive.interfaces.free_monoid.FromFreeMonoid]]; separating data from laws lets a concrete model (lists over X, say) supply the extension operation by computation and prove the laws afterwards.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free_monoid.from_free_monoid_spec","base":"from_free_monoid_spec","kind":"proj","short":{"text":"The extension of f, restricted along the generators, equals f","status":"ok"}},{"name":"AffineConstructive.interfaces.free_monoid.from_free_monoid_unique","base":"from_free_monoid_unique","kind":"proj","short":{"text":"A monoid morphism that agrees with f on the generators equals the extension of f","status":"ok"}},{"name":"AffineConstructive.interfaces.free_monoid.Build_FreeMonoid","base":"Build_FreeMonoid","kind":"constr","short":{"text":"Builds the free-monoid property from the extension law and the uniqueness law","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free_monoid.FromFreeStrongMonoid","base":"FromFreeStrongMonoid","kind":"ind","start":13,"body":null,"status":"ok","short":{"text":"The extension operation of a candidate free strong-operation monoid, as a function of sets","status":"ok"},"long":{"text":"The counterpart of [[AffineConstructive.interfaces.free_monoid.FromFreeMonoid]] for monoids with a strong operation ([[AffineConstructive.interfaces.bundled_algebra.strong_op_monoid]]). Given a set X, a strong-operation monoid Xs and a map i from X to Xs, an instance provides, for every strong-operation monoid M, a function of sets from the set of maps X to M to the set of morphisms from Xs to M ([[AffineConstructive.interfaces.bundled_algebra.strong_op_monoid_morphism]]).\n\nThe difference from the plain version is that the extension is a morphism of sets rather than a bare operation: it preserves equality, and therefore, as an affine implication, also its contrapositive, so that extensions apart from each other come from maps apart from each other. This is the form of the universal property suited to the strong setting, where the extension is itself used as a function on a set of maps.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free_monoid.FromFreeStrongMonoid","base":"FromFreeStrongMonoid","kind":"rec","short":{"text":"The class of extension functions along a map from a set into a strong-operation monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.free_monoid.from_free_strong_monoid","base":"from_free_strong_monoid","kind":"proj","short":{"text":"The function sending a map from the generators to its extension, a morphism of strong-operation monoids","status":"ok"}}]},{"name":"AffineConstructive.interfaces.free_monoid.FreeStrongMonoid","base":"FreeStrongMonoid","kind":"rec","start":15,"body":null,"status":"ok","short":{"text":"Xs is the free strong-operation monoid on X: maps from X extend uniquely to morphisms","status":"ok"},"long":{"text":"The universal property of the free monoid among monoids with a strong operation, relative to an extension function [[AffineConstructive.interfaces.free_monoid.from_free_strong_monoid]]. For every strong-operation monoid M and every map f from X to M, the extension of f composed with i equals f, and any morphism h from Xs to M whose composite with i equals f equals the extension of f. The laws are those of [[AffineConstructive.interfaces.free_monoid.FreeMonoid]] word for word; only the category (strong-operation monoids and their morphisms) and the extension operation, now a function of sets, change.\n\n\\begin{tikzcd} X \\arrow[r, \"i\"] \\arrow[dr, \"f\"'] & X_s \\arrow[d, \"\\bar f\"] \\\\ & M \\end{tikzcd}","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.free_monoid.from_free_strong_monoid_spec","base":"from_free_strong_monoid_spec","kind":"proj","short":{"text":"The extension of f, restricted along the generators, equals f","status":"ok"}},{"name":"AffineConstructive.interfaces.free_monoid.from_free_strong_monoid_unique","base":"from_free_strong_monoid_unique","kind":"proj","short":{"text":"A morphism of strong-operation monoids that agrees with f on the generators equals the extension of f","status":"ok"}},{"name":"AffineConstructive.interfaces.free_monoid.Build_FreeStrongMonoid","base":"Build_FreeStrongMonoid","kind":"constr","short":{"text":"Builds the free strong-operation monoid property from the extension and uniqueness laws","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."}},"constants":null}</script>

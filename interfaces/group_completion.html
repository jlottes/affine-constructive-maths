nstructive.interfaces.group_completion","name":"group_completion_mor","kind":"meth","local":true}],"gloss":{"summary":"This file states the universal property of the group completion (Grothendieck group) of an additive monoid. A map i : M ⇾ K from an additive monoid to an additive group comes with an extension operation, [[AffineConstructive.interfaces.group_completion.FromGroupCompletion]], that turns each monoid morphism f : M ⇾ A into a map K ⇾ A, where A is any additive group, abelian or not. [[AffineConstructive.interfaces.group_completion.FromGroupCompletionProp]] says that a map g is the unique monoid morphism with g ∘ i = f. [[AffineConstructive.interfaces.group_completion.GroupCompletion]] requires this of the extension for every such f, which makes K the free group on M. The file is an interface only: it proves nothing, and concrete models such as the integers over the naturals provide instances.","short":"Universal property of the group completion of an additive monoid","items":[{"name":"AffineConstructive.interfaces.group_completion.FromGroupCompletion","base":"FromGroupCompletion","kind":"ind","start":4,"body":null,"status":"ok","short":{"text":"The extension operation of a group completion i : M ⇾ K: monoid morphisms out of M extended to K","status":"ok"},"long":{"text":"Given an additive monoid M, an additive group K and a map i : M ⇾ K, an instance of this class is an operation that takes any additive group A, not necessarily abelian, and any [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] f : M ⇾ A, and returns a function K ⇾ A. It is the data half of the universal property of the group completion (the Grothendieck group): the intended meaning is that every monoid morphism from M into a group factors through i. The class asserts no laws. Those are stated separately in [[AffineConstructive.interfaces.group_completion.GroupCompletion]], so that the operation can be found by resolution and computed with before anything is proved about it.\n\nThe extension is required for every additive group, abelian or not, and not only for abelian ones. Since the image of a commutative monoid commutes with itself, this is no stronger in substance, but it lets the completion map into groups that are not themselves known to be abelian. The class has a single field, so it is the operation itself.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.group_completion.FromGroupCompletion","base":"FromGroupCompletion","kind":"rec","short":{"text":"The type of extension operations for a candidate group completion i : M ⇾ K","status":"ok"}},{"name":"AffineConstructive.interfaces.group_completion.from_group_completion","base":"from_group_completion","kind":"proj","short":{"text":"The extension K ⇾ A of a monoid morphism f : M ⇾ A along i","status":"ok"}}]},{"name":"AffineConstructive.interfaces.group_completion.FromGroupCompletionProp","base":"FromGroupCompletionProp","kind":"rec","start":6,"body":null,"status":"ok","short":{"text":"g : K ⇾ A is the unique monoid morphism extending f : M ⇾ A along i","status":"ok"},"long":{"text":"For a map i : M ⇾ K, a monoid morphism f : M ⇾ A into an additive group (not necessarily abelian) and a map g : K ⇾ A, this proposition states that g is the factorisation of f through i that the universal property requires. It has three parts: g is an [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]], g ∘ i = f, and every monoid morphism h : K ⇾ A with h ∘ i = f is equal to g. The equalities are equalities of functions in the set K ⇾ A, so they are the affine equality of morphisms and carry their apartness readings with them.\n\nThe properties are collected into one structure so that [[AffineConstructive.interfaces.group_completion.GroupCompletion]] can state its universal property as a single field, [[AffineConstructive.interfaces.group_completion.from_group_completion_prop]], and so that a proof of the property for a concrete construction can be supplied piece by piece through its constructor.\n\n```tikzcd\nM \\arrow[r, \"i\"] \\arrow[dr, \"f\"'] & K \\arrow[d, \"g\", dashed] \\\\\n & A\n```","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.group_completion.from_group_completion_mor","base":"from_group_completion_mor","kind":"proj","short":{"text":"The extension g preserves addition and zero","status":"ok"}},{"name":"AffineConstructive.interfaces.group_completion.from_group_completion_spec","base":"from_group_completion_spec","kind":"proj","short":{"text":"The extension g restricts to f along i: g ∘ i = f","status":"ok"}},{"name":"AffineConstructive.interfaces.group_completion.from_group_completion_unique","base":"from_group_completion_unique","kind":"proj","short":{"text":"Any monoid morphism h : K ⇾ A with h ∘ i = f equals g","status":"ok"}},{"name":"AffineConstructive.interfaces.group_completion.Build_FromGroupCompletionProp","base":"Build_FromGroupCompletionProp","kind":"constr","short":{"text":"Builds the extension property from the morphism law, the factorisation and uniqueness","status":"ok"}}]},{"name":"AffineConstructive.interfaces.group_completion.GroupCompletion","base":"GroupCompletion","kind":"rec","start":7,"body":null,"status":"ok","short":{"text":"i : M ⇾ K exhibits the additive group K as the group completion of the monoid M","status":"ok"},"long":{"text":"This class is the universal property of the group completion, or Grothendieck group, of an additive monoid. It requires M to be an [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]], K an [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]], and i a monoid morphism. For every additive group A, abelian or not, and every monoid morphism f : M ⇾ A, the extension supplied by [[AffineConstructive.interfaces.group_completion.FromGroupCompletion]] must satisfy [[AffineConstructive.interfaces.group_completion.FromGroupCompletionProp]]: it is a monoid morphism, it satisfies g ∘ i = f, and it is the only such morphism. So K is the free group on M, and i is the unit.\n\nThe operation and the laws are split, as elsewhere in the hierarchy. The operation is a parameter found by resolution, and this class is a proposition about it. The facts that M is a monoid and i a morphism are coercions from the class, so a hypothesis that i is a group completion yields them directly. Concrete models, the integers as the completion of the naturals in particular, provide instances.\n\n```tikzcd\nM \\arrow[r, \"i\"] \\arrow[dr, \"f\"'] & K \\arrow[d, \"\\exists!\\, g\", dashed] \\\\\n & A\n```","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.group_completion.group_completion_src","base":"group_completion_src","kind":"proj","short":{"text":"The source M of a group completion is an additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.group_completion.group_completion_dst","base":"group_completion_dst","kind":"proj","short":{"text":"The target K of a group completion is an additive group","status":"ok"}},{"name":"AffineConstructive.interfaces.group_completion.group_completion_mor","base":"group_completion_mor","kind":"proj","short":{"text":"The unit i of a group completion is a monoid morphism","status":"ok"}},{"name":"AffineConstructive.interfaces.group_completion.from_group_completion_prop","base":"from_group_completion_prop","kind":"proj","short":{"text":"The extension of each monoid morphism f is the unique monoid morphism factoring f through i","status":"ok"}},{"name":"AffineConstructive.interfaces.group_completion.Build_GroupCompletion","base":"Build_GroupCompletion","kind":"constr","short":{"text":"Builds a group completion from the structures on M and K, the morphism i and the universal property","status":"ok"}}]},{"name":"AffineConstructive.interfaces.group_completion.coercion:group_completion_src","base":"coercion:group_completion_src","kind":"coercion","start":9,"body":null,"status":"ok","short":{"text":"A group completion can stand for its source additive monoid M, via [[AffineConstructive.interfaces.group_completion.group_completion_src]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.group_completion.coercion:group_completion_mor","base":"coercion:group_completion_mor","kind":"coercion","start":10,"body":null,"status":"ok","short":{"text":"A group completion can stand for its unit, the monoid morphism i out of M, via [[AffineConstructive.interfaces.group_completion.group_completion_mor]]","status":"ok"},"proof":[]}],"diagrams":{"svg":{"\nM \\arrow[r, \"i\"] \\arrow[dr, \"f\"'] & K \\arrow[d, \"g\", dashed] \\\\\n & A":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='64.968pt' height='51.25pt' viewBox='0 0 64.968 51.25'>\n<defs>\n<path id='g1-1' d='M2.83679-2.75315H3.51985C3.65925-2.75315 3.74986-2.75315 3.74986-2.90649C3.74986-3.00407 3.65925-3.00407 3.53379-3.00407H2.88558C3.04589-3.88926 3.10165-4.20988 3.15741-4.41201C3.19226-4.56535 3.3456-4.71172 3.51288-4.71172C3.51985-4.71172 3.70804-4.71172 3.84047-4.62808C3.5547-4.53747 3.53379-4.28655 3.53379-4.24473C3.53379-4.09139 3.65228-3.98684 3.81259-3.98684C4.00078-3.98684 4.20988-4.14715 4.20988-4.41201C4.20988-4.73263 3.86835-4.90688 3.51288-4.90688C3.2062-4.90688 2.86467-4.73263 2.67648-4.38413C2.53708-4.12624 2.48132-3.81259 2.33495-3.00407H1.78432C1.64492-3.00407 1.55431-3.00407 1.55431-2.85073C1.55431-2.75315 1.64492-2.75315 1.77038-2.75315H2.28616C2.27919-2.71133 1.84008-.20213 1.6728 .54366C1.63795 .697 1.51946 1.22672 1.1849 1.22672C1.17793 1.22672 1.01065 1.22672 .87822 1.14308C1.16399 1.05247 1.1849 .80155 1.1849 .75973C1.1849 .60639 1.06641 .50184 .9061 .50184C.71791 .50184 .50881 .66215 .50881 .92701C.50881 1.24066 .8364 1.42188 1.1849 1.42188C1.63098 1.42188 1.93766 .96186 2.0213 .80852C2.27222 .34153 2.43253-.51578 2.44647-.59942L2.83679-2.75315Z'/>\n<path id='g1-2' d='M3.70804-2.57193C3.73592-2.67648 3.735 e body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."}},"constants":null}</script>

"name":"ints_ring","kind":"proj","local":true},{"s":1817,"e":1832,"lib":"AffineConstructive.interfaces.integers","name":"IntegersToGroup","kind":"class","local":true},{"s":1909,"e":1917,"lib":"AffineConstructive.interfaces.integers","name":"Integers","kind":"class","local":true},{"s":2017,"e":2021,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Zero","kind":"class","local":false,"page":"algebra_notation.html"},{"s":2029,"e":2032,"lib":"AffineConstructive.interfaces.algebra_notation","name":"One","kind":"class","local":false,"page":"algebra_notation.html"},{"s":2040,"e":2044,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Plus","kind":"class","local":false,"page":"algebra_notation.html"},{"s":2052,"e":2058,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Negate","kind":"class","local":false,"page":"algebra_notation.html"},{"s":2066,"e":2070,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Mult","kind":"class","local":false,"page":"algebra_notation.html"},{"s":2079,"e":2081,"lib":"AffineConstructive.interfaces.relation_notation","name":"Le","kind":"class","local":false,"page":"relation_notation.html"},{"s":2088,"e":2103,"lib":"AffineConstructive.interfaces.integers","name":"IntegersToGroup","kind":"class","local":true},{"s":2152,"e":2160,"lib":"AffineConstructive.interfaces.integers","name":"Integers","kind":"class","local":true},{"s":2197,"e":2228,"lib":"AffineConstructive.interfaces.ring_order","name":"StrongLinearRefutativeRingOrder","kind":"class","local":false,"page":"ring_order.html"},{"s":2249,"e":2264,"lib":"AffineConstructive.interfaces.integers","name":"OrderedIntegers","kind":"rec","local":true}],"gloss":{"summary":"The file gives the interface for the integers, characterised by a universal property. [[AffineConstructive.interfaces.integers.IntegersToGroup]] supplies a canonical map from Z into every additive group with a distinguished element, and [[AffineConstructive.interfaces.integers.Integers]] states that Z is a ring for which this map is the unique additive morphism preserving 1, so that Z is the free group on one generator. The bundled record [[AffineConstructive.interfaces.integers.integers]] packages a ring with this structure, and [[AffineConstructive.interfaces.integers.OrderedIntegers]] adds a strong linear refutative ring order, giving the integers as an ordered ring. The theory of the integers and their concrete models build on these classes.","short":"Interface for the integers as the free group on one generator, and ordered integers","items":[{"name":"AffineConstructive.interfaces.integers.IntegersToGroup","base":"IntegersToGroup","kind":"ind","start":1,"body":null,"status":"ok","short":{"text":"The structure of a canonical map from Z into every additive group with a distinguished element","status":"ok"},"long":{"text":"An `IntegersToGroup Z` assigns to every additive group G (not necessarily commutative, see [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]]) with a distinguished element 1 a function Z ⇾ G. It holds only the data of the map; the laws it satisfies, and its uniqueness, are the content of [[AffineConstructive.interfaces.integers.Integers]].\n\nSeparating the operation from its laws lets the canonical map be named, and computed with, before the integers are known to be integers: an implementation supplies the map once, and [[AffineConstructive.interfaces.integers.Integers]] then states that it is the unique one. The target groups are allowed to be non-commutative because the universal property of the integers is that of the free group on one generator, which needs no commutativity in the target.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.integers.IntegersToGroup","base":"IntegersToGroup","kind":"rec","short":{"text":"The structure of a canonical map from Z into every additive group with a distinguished element","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.integers_to_group","base":"integers_to_group","kind":"proj","short":{"text":"The canonical map Z ⇾ G into an additive group G with a distinguished element 1","status":"ok"}}]},{"name":"AffineConstructive.interfaces.integers.Integers","base":"Integers","kind":"rec","start":3,"body":null,"status":"ok","short":{"text":"Z is the integers: a ring whose canonical map into each pointed additive group is the unique morphism","status":"ok"},"long":{"text":"`Integers Z` characterises the integers by a universal property. Z is a [[AffineConstructive.interfaces.abstract_algebra.Ring]], and for every additive group G with a distinguished element 1, the canonical map of [[AffineConstructive.interfaces.integers.IntegersToGroup]] is a morphism of additive monoids ([[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]]) sending 1 to 1 ([[AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism]]), and every other such map h : Z ⇾ G is equal to it. Thus Z, with its addition, zero and one, is the initial additive group with a distinguished element: the free group on one generator, the generator being 1.\n\nThe uniqueness clause is an equality of functions, an affine proposition, so it carries its contrapositive: a map apart from the canonical one fails to preserve addition, zero or one. Preservation of negation is not required separately, since it follows from preservation of addition and zero in a group. The ring structure of Z itself is not part of the universal property, only assumed alongside it; that multiplication is the usual one is a consequence, proved elsewhere from initiality.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.integers.integers_ring","base":"integers_ring","kind":"proj","short":{"text":"The ring structure of the integers","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.integers_to_group_mor","base":"integers_to_group_mor","kind":"proj","short":{"text":"The canonical map into an additive group preserves addition and zero","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.integers_to_group_pointed","base":"integers_to_group_pointed","kind":"proj","short":{"text":"The canonical map into a pointed additive group sends 1 to the distinguished element","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.integers_initial","base":"integers_initial","kind":"proj","short":{"text":"Every additive monoid morphism Z ⇾ G preserving 1 equals the canonical map","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.Build_Integers","base":"Build_Integers","kind":"constr","short":{"text":"Builds the integers structure from a ring, the morphism laws of the canonical map and its uniqueness","status":"ok"}}]},{"name":"AffineConstructive.interfaces.integers.coercion:integers_ring","base":"coercion:integers_ring","kind":"coercion","start":4,"body":null,"status":"ok","short":{"text":"Integers reach their ring structure, so every ring law applies to them","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.integers.integers","base":"integers","kind":"rec","start":9,"body":null,"status":"ok","short":{"text":"A bundled model of the integers: a ring with its canonical maps and their universal property","status":"ok"},"long":{"text":"The bundled record `integers` packs a [[AffineConstructive.interfaces.bundled_algebra.ring]] together with an [[AffineConstructive.interfaces.integers.IntegersToGroup]] structure on it and the proof that it satisfies [[AffineConstructive.interfaces.integers.Integers]]. It allows a model of the integers to be passed around as a single object, in the manner of the other bundled algebraic structures of `interfaces/bundled_algebra.v`.\n\nThe projections are coercions, so a bundled model is used directly as a ring, and its canonical maps and universal property are recovered from it by instance resolution, which looks through the coercions.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.integers.ints_ring","base":"ints_ring","kind":"proj","short":{"text":"The underlying ring of a bundled model of the integers","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.ints_to_grp","base":"ints_to_grp","kind":"proj","short":{"text":"The canonical maps into additive groups of a bundled model of the integers","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.ints_integers","base":"ints_integers","kind":"proj","short":{"text":"The universal property of a bundled model of the integers","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.Build_integers","base":"Build_integers","kind":"constr","short":{"text":"Builds a bundled model of the integers from a ring, its canonical maps and their universal property","status":"ok"}}]},{"name":"AffineConstructive.interfaces.integers.OrderedIntegers","base":"OrderedIntegers","kind":"rec","start":13,"body":null,"status":"ok","short":{"text":"Z is the integers together with a strong linear refutative ring order","status":"ok"},"long":{"text":"`OrderedIntegers Z` asks that Z satisfy [[AffineConstructive.interfaces.integers.Integers]] and carry an order ≤ making it a [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRingOrder]]: an order compatible with addition and multiplication, linear, refutative in Shulman's sense, and strong, so that the strict order agrees with apartness.\n\nThe order is not determined here from the universal property but assumed alongside it; the two parts are independent fields, both available through coercions, so an ordered model of the integers is at once a model of the integers and an ordered ring.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.integers.ord_int_int","base":"ord_int_int","kind":"proj","short":{"text":"Ordered integers are integers","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.ord_int_ord","base":"ord_int_ord","kind":"proj","short":{"text":"The strong linear refutative ring order of the ordered integers","status":"ok"}},{"name":"AffineConstructive.interfaces.integers.Build_OrderedIntegers","base":"Build_OrderedIntegers","kind":"constr","short":{"text":"Builds the ordered integers from the integers and a strong linear refutative ring order","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.interfaces.ring_order":{"page":"ring_order.html","short":"Cones, and order compatible with addition and multiplication in monoids, groups, rigs and rings","summary":"This file sets out the interfaces for ordered algebra. It first defines the cones of a weak poset with a zero as subsets: the nonzero elements, the nonnegative cone R⁺, the positive cone R₊, the nonpositive cone R⁻ and the negative cone R₋. It then gives the compatibility of order with addition: an ordered additive monoid, where adding z on the left is an order embedding, and an ordered additive group, where adding z on the left preserves the order. On these it builds two classes. A strong linear refutative rig order is a rig with a strong, linear, refutative partial order that is an ordered additive monoid and satisfies b < a ⊠ d < c ⊸ a·d + b·c < a·c + b·d. A strong linear refutative ring order is the ring version, with the same order axioms, an ordered additive group, and closure of the positive elements under products."}},"constants":null}</script>

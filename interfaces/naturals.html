nd":"def","local":false,"page":"../theory/projected_set.html"},{"s":3661,"e":3662,"lib":"AffineConstructive.interfaces.naturals","name":"t","kind":"ind","local":true,"m":"natsubtract"},{"s":3667,"e":3674,"lib":"AffineConstructive.interfaces.set","name":"sum_set","kind":"def","local":false,"page":"set.html"},{"s":3679,"e":3686,"lib":"AffineConstructive.interfaces.set","name":"sum_set","kind":"def","local":false,"page":"set.html"},{"s":3718,"e":3726,"lib":"AffineConstructive.interfaces.naturals","name":"is_lt_by","kind":"constr","local":true,"m":"natsubtract"},{"s":3732,"e":3735,"lib":"AffineConstructive.interfaces.prelude","name":"inr","kind":"constr","local":false,"page":"prelude.html"},{"s":3737,"e":3740,"lib":"AffineConstructive.interfaces.prelude","name":"inl","kind":"constr","local":false,"page":"prelude.html"},{"s":3746,"e":3751,"lib":"AffineConstructive.interfaces.naturals","name":"is_eq","kind":"constr","local":true,"m":"natsubtract"},{"s":3755,"e":3758,"lib":"AffineConstructive.interfaces.prelude","name":"inl","kind":"constr","local":false,"page":"prelude.html"},{"s":3759,"e":3762,"lib":"AffineConstructive.interfaces.notation","name":"the","kind":"def","local":false,"page":"notation.html"},{"s":3765,"e":3773,"lib":"AffineConstructive.interfaces.naturals","name":"is_gt_by","kind":"constr","local":true,"m":"natsubtract"},{"s":3779,"e":3782,"lib":"AffineConstructive.interfaces.prelude","name":"inr","kind":"constr","local":false,"page":"prelude.html"},{"s":3784,"e":3787,"lib":"AffineConstructive.interfaces.prelude","name":"inr","kind":"constr","local":false,"page":"prelude.html"},{"s":3824,"e":3837,"lib":"AffineConstructive.interfaces.naturals","name":"T","kind":"def","local":true},{"s":3861,"e":3875,"lib":"AffineConstructive.theory.projected_set","name":"IsProjectedSet","kind":"class","local":false,"page":"../theory/projected_set.html"},{"s":3877,"e":3882,"lib":"AffineConstructive.interfaces.set","name":"set_T","kind":"proj","local":false,"page":"set.html"},{"s":3884,"e":3897,"lib":"AffineConstructive.interfaces.naturals","name":"T","kind":"def","local":true},{"s":3927,"e":3955,"lib":"AffineConstructive.theory.projected_set","name":"projected_set_IsProjectedSet","kind":"thm","local":false,"page":"../theory/projected_set.html"},{"s":4001,"e":4004,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":4032,"e":4045,"lib":"AffineConstructive.interfaces.naturals","name":"T","kind":"def","local":true},{"s":4075,"e":4078,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":4082,"e":4086,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Zero","kind":"class","local":false,"page":"algebra_notation.html"},{"s":4092,"e":4096,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Plus","kind":"class","local":false,"page":"algebra_notation.html"},{"s":4103,"e":4114,"lib":"AffineConstructive.interfaces.naturals","name":"NatSubtract","kind":"class","local":true},{"s":4170,"e":4182,"lib":"AffineConstructive.interfaces.naturals","name":"nat_subtract","kind":"def","local":true},{"s":4199,"e":4219,"lib":"AffineConstructive.interfaces.naturals","name":"is_lt_by","kind":"constr","local":true},{"s":4247,"e":4264,"lib":"AffineConstructive.interfaces.naturals","name":"is_eq","kind":"constr","local":true},{"s":4278,"e":4298,"lib":"AffineConstructive.interfaces.naturals","name":"is_gt_by","kind":"constr","local":true},{"s":4373,"e":4377,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Zero","kind":"class","local":false,"page":"algebra_notation.html"},{"s":4385,"e":4388,"lib":"AffineConstructive.interfaces.algebra_notation","name":"One","kind":"class","local":false,"page":"algebra_notation.html"},{"s":4396,"e":4400,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Plus","kind":"class","local":false,"page":"algebra_notation.html"},{"s":4408,"e":4412,"lib":"AffineConstructive.interfaces.algebra_notation","name":"Mult","kind":"class","local":false,"page":"algebra_notation.html"},{"s":4421,"e":4423,"lib":"AffineConstructive.interfaces.relation_notation","name":"Le","kind":"class","local":false,"page":"relation_notation.html"},{"s":4430,"e":4443,"lib":"AffineConstructive.interfaces.naturals","name":"NaturalsToMon","kind":"class","local":true},{"s":4492,"e":4500,"lib":"AffineConstructive.interfaces.naturals","name":"Naturals","kind":"class","local":true},{"s":4537,"e":4567,"lib":"AffineConstructive.interfaces.ring_order","name":"StrongLinearRefutativeRigOrder","kind":"class","local":false,"page":"ring_order.html"},{"s":4588,"e":4603,"lib":"AffineConstructive.interfaces.naturals","name":"OrderedNaturals","kind":"rec","local":true}],"gloss":{"summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[AffineConstructive.interfaces.naturals.NaturalNumbersObject]] says that N, with a zero and a [[AffineConstructive.interfaces.naturals.Successor]], is initial among such sets, with morphisms given by [[AffineConstructive.interfaces.naturals.MaybeAlgebra_Morphism]]. The second, [[AffineConstructive.interfaces.naturals.Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[AffineConstructive.interfaces.naturals.naturals]] packs this structure. The file also gives an interface, [[AffineConstructive.interfaces.naturals.NatSubtract]] with specification [[AffineConstructive.interfaces.naturals.NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[AffineConstructive.interfaces.naturals.OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes.","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","items":[{"name":"AffineConstructive.interfaces.naturals.Successor","base":"Successor","kind":"ind","start":3,"body":null,"status":"ok","short":{"text":"The structure of a successor map X ⇾ X on a set X","status":"ok"},"long":{"text":"A successor on a set X is a function from X to itself, written `suc`. With a zero it makes X an algebra for the functor X ↦ 𝟏 + X, the structure a natural numbers object is initial for (see [[AffineConstructive.interfaces.naturals.NaturalNumbersObject]]).\n\nWhen no successor is declared, resolution falls back on adding one on the left, x ↦ 1 + x. So any set with a one and an addition, a near-rig in particular, has a successor without further declaration. Since the near-rigs here are right near-rigs with addition not assumed commutative, the side matters: one is added on the left.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.Successor","base":"Successor","kind":"rec","short":{"text":"The structure of a successor map X ⇾ X on a set X","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.suc","base":"suc","kind":"proj","short":{"text":"The successor function of a set with a successor","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.MaybeAlgebra_Morphism","base":"MaybeAlgebra_Morphism","kind":"rec","start":5,"body":null,"status":"ok","short":{"text":"A morphism of pointed sets with successor: f preserves zero and commutes with successor","status":"ok"},"long":{"text":"Given sets X and Y, each with a zero and a successor, a function f : X ⇾ Y is a morphism of these structures when f 0 = 0 and f (suc x) = suc (f x) for every x. A zero and a successor together are an algebra for the functor X ↦ 𝟏 + X (the \"maybe\" functor, hence the name), and these are the morphisms of such algebras. The class inherits from [[AffineConstructive.interfaces.abstract_algebra.Zero_Pointed_Morphism]], so a morphism of this kind can be used wherever a zero-preserving map is needed.\n\nThese morphisms appear in the universal property of a natural numbers object, [[AffineConstructive.interfaces.naturals.NaturalNumbersObject]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.maybe_alg_preserves_zero","base":"maybe_alg_preserves_zero","kind":"proj","short":{"text":"A morphism of pointed sets with successor preserves zero","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.preserves_suc","base":"preserves_suc","kind":"proj","short":{"text":"A morphism of pointed sets with successor commutes with successor: f (suc x) = suc (f x)","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.Build_MaybeAlgebra_Morphism","base":"Build_MaybeAlgebra_Morphism","kind":"constr","short":{"text":"Builds a morphism of pointed sets with successor from preservation of zero and of successor","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.coercion:maybe_alg_preserves_zero","base":"coercion:maybe_alg_preserves_zero","kind":"coercion","start":6,"body":null,"status":"ok","short":{"text":"A morphism of pointed sets with successor counts as a zero-preserving map, so the facts about preserving 0 apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.naturals.FromNNO","base":"FromNNO","kind":"ind","start":12,"body":null,"status":"ok","short":{"text":"The operation giving, for each set with zero and successor, a map out of N into it","status":"ok"},"long":{"text":"For a set N, this structure supplies, for each set X with a zero and a successor, a function `nno_to_set N X` : N ⇾ X. It is the data half of the definition of a natural numbers object. The map is intended to be the recursor: it sends 0 to 0 and n + 1 to the successor of the image of n. The laws saying that it is so, and that it is the only such map, are in [[AffineConstructive.interfaces.naturals.NaturalNumbersObject]]. Keeping the map separate from those laws lets the laws be a proposition while the map stays computational data.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.FromNNO","base":"FromNNO","kind":"rec","short":{"text":"The operation giving, for each set with zero and successor, a map out of N into it","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.nno_to_set","base":"nno_to_set","kind":"proj","short":{"text":"The canonical map from N into a set with zero and successor","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.NaturalNumbersObject","base":"NaturalNumbersObject","kind":"rec","start":13,"body":null,"status":"ok","short":{"text":"N with zero and successor is a natural numbers object: initial among sets with zero and successor","status":"ok"},"long":{"text":"This is Lawvere's natural numbers object in the category of affine sets. N, with its zero and successor, is initial among sets carrying a zero and a successor. For every such X the canonical map [[AffineConstructive.interfaces.naturals.nno_to_set]] N X is a [[AffineConstructive.interfaces.naturals.MaybeAlgebra_Morphism]], so it sends 0 to 0 and commutes with successor. Every other morphism f : N ⇾ X of this kind is equal to it, as a function of sets. Existence is definition by recursion and uniqueness is proof by induction.\n\nThe universal property quantifies only over sets in the same universe as N. This is one of the file's two characterisations of the naturals. The other, [[AffineConstructive.interfaces.naturals.Naturals]], is stated in terms of additive monoids and is the one the hierarchy builds on.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.nno_to_set_mor","base":"nno_to_set_mor","kind":"proj","short":{"text":"The canonical map out of a natural numbers object preserves zero and successor","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.nno_initial","base":"nno_initial","kind":"proj","short":{"text":"Any map out of a natural numbers object preserving zero and successor equals the canonical map","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.Build_NaturalNumbersObject","base":"Build_NaturalNumbersObject","kind":"constr","short":{"text":"Builds a natural numbers object from the canonical map's morphism property and its uniqueness","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.NaturalsToMon","base":"NaturalsToMon","kind":"ind","start":19,"body":null,"status":"ok","short":{"text":"The operation giving, for each set with +, 0 and 1, a map out of N into it","status":"ok"},"long":{"text":"For a set N, this structure supplies, for each set M with an addition, a zero and a one, a function `naturals_to_mon N M` : N ⇾ M. It is the data half of [[AffineConstructive.interfaces.naturals.Naturals]]. The map is intended to send n to the n-fold sum 1 + ⋯ + 1 in M, and the laws in [[AffineConstructive.interfaces.naturals.Naturals]] say that it is the unique additive monoid morphism preserving one.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.NaturalsToMon","base":"NaturalsToMon","kind":"rec","short":{"text":"The operation giving, for each set with +, 0 and 1, a map out of N into it","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.naturals_to_mon","base":"naturals_to_mon","kind":"proj","short":{"text":"The canonical map from N into a set with +, 0 and 1, sending n to 1 + ⋯ + 1","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.Naturals","base":"Naturals","kind":"rec","start":21,"body":null,"status":"ok","short":{"text":"N is the naturals: a near-rig initial among additive monoids with a chosen element 1","status":"ok"},"long":{"text":"This is the characterisation of the natural numbers that the algebraic hierarchy uses. N is a right near-rig ([[AffineConstructive.interfaces.abstract_algebra.NearRig]]). Its universal property is stated without multiplication: take any M that is a monoid under + with identity 0, not necessarily commutative ([[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid]]), together with a chosen element 1. Then the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] N M is an additive monoid morphism ([[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]]) that preserves one ([[AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism]]), and every other such morphism equals it.\n\nNo commutativity is assumed of the target. That makes the universal property apply to the widest class of targets, and makes it imply that the addition of N is commutative rather than assume it. Multiplication is part of the structure but takes no part in initiality: in the naturals it is determined by addition, and the near-rig axioms state the laws it must satisfy. The class inherits from [[AffineConstructive.interfaces.abstract_algebra.NearRig]], so the ring-like laws of N are available directly.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.naturals_near_rig","base":"naturals_near_rig","kind":"proj","short":{"text":"The naturals form a right near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.naturals_to_mon_mor","base":"naturals_to_mon_mor","kind":"proj","short":{"text":"The canonical map from the naturals into an additive monoid preserves addition and zero","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.naturals_to_mon_pointed","base":"naturals_to_mon_pointed","kind":"proj","short":{"text":"The canonical map from the naturals into an additive monoid with 1 preserves one","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.naturals_initial","base":"naturals_initial","kind":"proj","short":{"text":"Any additive monoid morphism out of the naturals preserving one equals the canonical map","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.Build_Naturals","base":"Build_Naturals","kind":"constr","short":{"text":"Builds the naturals structure from a near-rig, the canonical map's morphism laws, and uniqueness","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.coercion:naturals_near_rig","base":"coercion:naturals_near_rig","kind":"coercion","start":22,"body":null,"status":"ok","short":{"text":"Naturals reach their near-rig structure, so the laws of + and · apply to them directly","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.naturals.naturals","base":"naturals","kind":"rec","start":27,"body":null,"status":"ok","short":{"text":"A bundled model of the naturals: a near-rig with its canonical maps and the naturals laws","status":"ok"},"long":{"text":"The bundled form of [[AffineConstructive.interfaces.naturals.Naturals]]. It packs a bundled right near-rig ([[AffineConstructive.interfaces.bundled_algebra.near_rig]]) with the canonical maps into additive monoids with one and the proof that these make it the naturals. The near-rig projection is a coercion, so a bundled model of the naturals can be used as a near-rig and as a set. Resolution recovers the map and the laws from the bundle when an unbundled [[AffineConstructive.interfaces.naturals.Naturals]] instance is needed. Statements that range over all models of the naturals use this record.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.nats_near_rig","base":"nats_near_rig","kind":"proj","short":{"text":"The underlying near-rig of a bundled model of the naturals","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.nats_to_mon","base":"nats_to_mon","kind":"proj","short":{"text":"The canonical maps into additive monoids with one, of a bundled model of the naturals","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.nats_naturals","base":"nats_naturals","kind":"proj","short":{"text":"The proof that a bundled model of the naturals satisfies the naturals laws","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.Build_naturals","base":"Build_naturals","kind":"constr","short":{"text":"Builds a bundled model of the naturals from a near-rig, its canonical maps and the naturals laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.natsubtract.t","base":"t","kind":"ind","start":32,"body":null,"status":"ok","short":{"text":"The outcomes of comparing two naturals: less by z, equal, or greater by z","status":"ok"},"long":{"text":"The type of results of a three-way comparison of naturals that also records the difference. The outcome is `is_lt_by z` when the first argument falls short of the second by z, `is_eq` when they are equal, and `is_gt_by z` when it exceeds the second by z. This is a bare type. The set of outcomes, with its equality, is [[natsubtract.T]], and the operation that produces outcomes is [[AffineConstructive.interfaces.naturals.NatSubtract]], specified by [[AffineConstructive.interfaces.naturals.NatSubtractSpec]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.natsubtract.t_rect","base":"t_rect","kind":"scheme","short":{"text":"Case analysis on a comparison outcome, into an arbitrary type","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.natsubtract.t_ind","base":"t_ind","kind":"scheme","short":{"text":"Case analysis on a comparison outcome, into Prop","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.natsubtract.t_rec","base":"t_rec","kind":"scheme","short":{"text":"Case analysis on a comparison outcome, into Set","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.natsubtract.t_sind","base":"t_sind","kind":"scheme","short":{"text":"Case analysis on a comparison outcome, into SProp","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.natsubtract.is_lt_by","base":"is_lt_by","kind":"constr","short":{"text":"The outcome: the first argument is less than the second by the given amount","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.natsubtract.is_eq","base":"is_eq","kind":"constr","short":{"text":"The outcome: the two arguments are equal","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.natsubtract.is_gt_by","base":"is_gt_by","kind":"constr","short":{"text":"The outcome: the first argument is greater than the second by the given amount","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.natsubtract.T","base":"T","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"The set of comparison outcomes, with equality inherited from 𝟏 + (N + N)","status":"ok"},"long":{"text":"The comparison outcomes [[AffineConstructive.interfaces.naturals.natsubtract.t]] made into a set. Each outcome is sent to the disjoint sum 𝟏 + (N + N) ([[AffineConstructive.interfaces.set.sum_set]]): `is_eq` goes to the point of 𝟏, `is_lt_by z` to z in the first copy of N, and `is_gt_by z` to z in the second. Two outcomes are equal when their images are, so this is a [[AffineConstructive.theory.projected_set.projected_set]]. Outcomes of different kinds are therefore apart, and two outcomes of the same kind are equal exactly when their differences are equal in N. This is the equality the comparison map [[AffineConstructive.interfaces.naturals.NatSubtract]] must respect.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.naturals.canonical:natsubtract.T","base":"canonical:natsubtract.T","kind":"canonical","start":38,"body":null,"status":"ok","short":{"text":"Lets unification find the subtraction structure [[natsubtract.T]] on the naturals from its projections, so its subtraction and laws apply without naming it","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.naturals.NatSubtract","base":"NatSubtract","kind":"ind","start":40,"body":null,"status":"ok","short":{"text":"The structure of a three-way comparison with difference, N ⊗ N ⇾ outcomes","status":"ok"},"long":{"text":"A comparison-with-subtraction operation on N is a function from N ⊗ N to the outcome set [[natsubtract.T]]. Given x and y, it reports whether x falls short of y, equals y, or exceeds it, and by how much. The domain is the tensor product, so the map has to respect equality only in each argument separately, as a binary operation does. It does not have to respect the stronger additive equality of the cartesian product.\n\nOn the naturals, truncated subtraction is not invertible, and this operation stands in for subtraction: it returns the difference together with the direction. Its correctness is the separate proposition [[AffineConstructive.interfaces.naturals.NatSubtractSpec]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.NatSubtract","base":"NatSubtract","kind":"rec","short":{"text":"The structure of a three-way comparison with difference, N ⊗ N ⇾ outcomes","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.nat_subtract","base":"nat_subtract","kind":"proj","short":{"text":"The comparison-with-difference map of a set with such an operation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.NatSubtractSpec","base":"NatSubtractSpec","kind":"ind","start":41,"body":null,"status":"ok","short":{"text":"The comparison map is correct: each outcome's equation holds, with a nonzero difference","status":"ok"},"long":{"text":"The specification of a [[AffineConstructive.interfaces.naturals.NatSubtract]] operation. For all x and y the reported outcome must be correct. If the outcome is less by z, then x + z = y, tensor z ≠ 0. If it is equal, then x = y. If it is greater by z, then x = y + z, tensor z ≠ 0. The tensor gives the equation and the apartness of z from zero together, each usable once, which is how the two facts are used. Because z ≠ 0 is required, the three outcomes cannot overlap: a strict difference is never reported for equal arguments.\n\nIn the less-than case z is added on the right of x, and in the greater-than case on the right of y. Addition is not assumed commutative here, so the sides are part of the statement.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.NatSubtractSpec","base":"NatSubtractSpec","kind":"rec","short":{"text":"The comparison map is correct: each outcome's equation holds, with a nonzero difference","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.nat_subtract_spec","base":"nat_subtract_spec","kind":"proj","short":{"text":"The outcome of comparing x and y satisfies its defining equation, with nonzero difference where applicable","status":"ok"}}]},{"name":"AffineConstructive.interfaces.naturals.OrderedNaturals","base":"OrderedNaturals","kind":"rec","start":42,"body":null,"status":"ok","short":{"text":"N is the naturals with an order making it a strong linear refutative rig order","status":"ok"},"long":{"text":"The naturals together with their order. N satisfies [[AffineConstructive.interfaces.naturals.Naturals]], and its order relation, with the near-rig operations, is a [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRigOrder]]: a linear order compatible with addition and multiplication, whose strict order is an apartness. Refutative refers to Shulman's class of propositions: x ≤ y is refutative. The order is part of the data rather than defined from addition, so a model may supply whatever order is convenient, provided it satisfies these laws. Both components are inherited, so the naturals laws and the order laws are available directly from the structure.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.naturals.ord_nat_nat","base":"ord_nat_nat","kind":"proj","short":{"text":"Ordered naturals are the naturals","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.ord_nat_ord","base":"ord_nat_ord","kind":"proj","short":{"text":"The order of ordered naturals is a strong linear refutative rig order","status":"ok"}},{"name":"AffineConstructive.interfaces.naturals.Build_OrderedNaturals","base":"Build_OrderedNaturals","kind":"constr","short":{"text":"Builds ordered naturals from the naturals laws and the order laws","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.interfaces.orders":{"page":"orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.ring_order":{"page":"ring_order.html","short":"Cones, and order compatible with addition and multiplication in monoids, groups, rigs and rings","summary":"This file sets out the interfaces for ordered algebra. It first defines the cones of a weak poset with a zero as subsets: the nonzero elements, the nonnegative cone R⁺, the positive cone R₊, the nonpositive cone R⁻ and the negative cone R₋. It then gives the compatibility of order with addition: an ordered additive monoid, where adding z on the left is an order embedding, and an ordered additive group, where adding z on the left preserves the order. On these it builds two classes. A strong linear refutative rig order is a rig with a strong, linear, refutative partial order that is an ordered additive monoid and satisfies b < a ⊠ d < c ⊸ a·d + b·c < a·c + b·d. A strong linear refutative ring order is the ring version, with the same order axioms, an ordered additive group, and closure of the positive elements under products."},"AffineConstructive.theory.projected_set":{"page":"../theory/projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."}},"constants":null}</script>

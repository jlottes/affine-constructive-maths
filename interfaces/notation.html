t","kind":"class","local":true},{"s":6809,"e":6815,"lib":"AffineConstructive.interfaces.notation","name":"tensor","kind":"def","local":true},{"s":6851,"e":6857,"lib":"AffineConstructive.interfaces.notation","name":"Tensor","kind":"class","local":true},{"s":6971,"e":6979,"lib":"AffineConstructive.interfaces.notation","name":"BoldZero","kind":"class","local":true},{"s":6996,"e":7001,"lib":"AffineConstructive.interfaces.prelude","name":"empty","kind":"ind","local":false,"page":"prelude.html"},{"s":7047,"e":7054,"lib":"AffineConstructive.interfaces.notation","name":"BoldOne","kind":"class","local":true},{"s":7072,"e":7076,"lib":"AffineConstructive.interfaces.prelude","name":"unit","kind":"class","local":false,"page":"prelude.html"},{"s":7123,"e":7130,"lib":"AffineConstructive.interfaces.notation","name":"Product","kind":"class","local":true},{"s":7148,"e":7153,"lib":"AffineConstructive.interfaces.prelude","name":"tprod","kind":"rec","local":false,"page":"prelude.html"}],"gloss":{"summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[AffineConstructive.interfaces.notation.The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[AffineConstructive.interfaces.notation.BoldZero]], [[AffineConstructive.interfaces.notation.BoldOne]], [[AffineConstructive.interfaces.notation.Product]] and [[AffineConstructive.interfaces.notation.Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type.","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","items":[{"name":"AffineConstructive.interfaces.notation.projection_notation.π₁","base":"π₁","kind":"abbrev","start":51,"body":null,"status":"ok","short":{"text":"The name π₁ for the first projection of a pair","status":"ok"},"long":{"text":"An abbreviation that makes π₁ another name for [[AffineConstructive.interfaces.prelude.proj1]], the first component of a pair in [[AffineConstructive.interfaces.prelude.tprod]]. It is kept in its own module, projection_notation, so files that want the Greek name import that module and other files keep proj1 alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.notation.projection_notation.π₂","base":"π₂","kind":"abbrev","start":52,"body":null,"status":"ok","short":{"text":"The name π₂ for the second projection of a pair","status":"ok"},"long":{"text":"An abbreviation that makes π₂ another name for [[AffineConstructive.interfaces.prelude.proj2]], the second component of a pair in [[AffineConstructive.interfaces.prelude.tprod]]. Like [[AffineConstructive.interfaces.notation.projection_notation.π₁]], it is available only where the module projection_notation is imported.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.notation.The","base":"The","kind":"ind","start":71,"body":null,"status":"ok","short":{"text":"A chosen term of a type, found by instance resolution","status":"ok"},"long":{"text":"A class with one field: an instance of The X is a chosen element of X, and [[AffineConstructive.interfaces.notation.the]] returns it. Instance resolution supplies the element, so a statement or definition can refer to it without passing it as an argument. The class is transparent to resolution, and resolution searches for an instance only once X is known. A notation ! for it is reserved in the scope the_scope but is not switched on in this file.\n\nThe development uses it for canonical maps. The canonical function out of the empty set and the canonical function into the one-point set are such terms, and [[AffineConstructive.theory.set.empty_initial]] and [[AffineConstructive.theory.set.unit_terminal]] state that every function 𝟎 ⇾ X, or X ⇾ 𝟏, equals the canonical one. The constant-function map [[AffineConstructive.theory.set.const]] and the set of comparison outcomes [[AffineConstructive.interfaces.naturals.natsubtract.T]] also build on it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.notation.The","base":"The","kind":"rec","short":{"text":"The class of a chosen term of a type","status":"ok"}},{"name":"AffineConstructive.interfaces.notation.the","base":"the","kind":"proj","short":{"text":"The chosen term of a type that has an instance of The","status":"ok"}}]},{"name":"AffineConstructive.interfaces.notation.BoldZero","base":"BoldZero","kind":"ind","start":76,"body":null,"status":"ok","short":{"text":"A distinguished object, written 𝟎 in cat_scope","status":"ok"},"long":{"text":"A class with one field, a chosen element of a collection of objects, written 𝟎 in cat_scope. On Type a hint in this file resolves it to the empty type [[AffineConstructive.interfaces.prelude.empty]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.notation.BoldZero","base":"BoldZero","kind":"rec","short":{"text":"The class of a distinguished object written 𝟎","status":"ok"}},{"name":"AffineConstructive.interfaces.notation.bzero","base":"bzero","kind":"proj","short":{"text":"The object 𝟎 chosen by a BoldZero instance","status":"ok"}}]},{"name":"AffineConstructive.interfaces.notation.BoldOne","base":"BoldOne","kind":"ind","start":79,"body":null,"status":"ok","short":{"text":"A distinguished object, written 𝟏 in cat_scope","status":"ok"},"long":{"text":"A class with one field, a chosen element of a collection of objects, written 𝟏 in cat_scope. On Type a hint in this file resolves it to the unit type [[AffineConstructive.interfaces.prelude.unit]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.notation.BoldOne","base":"BoldOne","kind":"rec","short":{"text":"The class of a distinguished object written 𝟏","status":"ok"}},{"name":"AffineConstructive.interfaces.notation.bone","base":"bone","kind":"proj","short":{"text":"The object 𝟏 chosen by a BoldOne instance","status":"ok"}}]},{"name":"AffineConstructive.interfaces.notation.Product","base":"Product","kind":"ind","start":82,"body":null,"status":"ok","short":{"text":"A binary operation on objects, written X × Y in cat_scope","status":"ok"},"long":{"text":"A class with one field, a binary operation on a collection of objects, written X × Y in cat_scope. On Type a hint in this file resolves it to the product of types [[AffineConstructive.interfaces.prelude.tprod]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.notation.Product","base":"Product","kind":"rec","short":{"text":"The class of a binary operation on objects written ×","status":"ok"}},{"name":"AffineConstructive.interfaces.notation.prod","base":"prod","kind":"proj","short":{"text":"The binary operation × given by a Product instance","status":"ok"}}]},{"name":"AffineConstructive.interfaces.notation.Tensor","base":"Tensor","kind":"ind","start":85,"body":null,"status":"ok","short":{"text":"A binary operation on objects, written X ⊗ Y in cat_scope","status":"ok"},"long":{"text":"A class with one field, a binary operation on a collection of objects, written X ⊗ Y in cat_scope. This file gives it no instance.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.notation.Tensor","base":"Tensor","kind":"rec","short":{"text":"The class of a binary operation on objects written ⊗","status":"ok"}},{"name":"AffineConstructive.interfaces.notation.tensor","base":"tensor","kind":"proj","short":{"text":"The binary operation ⊗ given by a Tensor instance","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.prelude":{"page":"prelude.html","short":"The prelude: global settings, basic types and term-building notations replacing the standard library","summary":"This file stands in for Rocq's standard library. It declares the type and function scopes and loads the Ltac, number-notation and firstorder plugins. It also turns on the global settings the rest of the development relies on: primitive projections, universe polymorphism with cumulative inductives, and keyed unification. It sets up the `core` and `typeclass_instances` hint databases. It then defines the basic types from scratch: the empty type with [[abort]] and [[dep_abort]], [[unit]] (which also serves as a trivially satisfied class), [[bool]], the product [[tprod]], the dependent sum [[tsig]], the disjoint union [[tsum]], and [[ssig]], whose elements are points paired with a proof-irrelevant property. Last come the identity function, currying and uncurrying, and a few notations that build terms by running a tactic."},"AffineConstructive.tactics.try_all_hyps":{"page":"../tactics/try_all_hyps.html","short":"Trying a tactic on every hypothesis, and typeclass resolution through coerced hypotheses","summary":"This file provides [[try_all_hyps]], which tries a tactic on each hypothesis in turn and backtracks across them. It uses a trick from Jonathan Leivent: [[revert_clearbody_all]] reverts the whole context, and closing the goal with [[dummy]] then yields a term of type [[Dummy]] that records the hypotheses as a stack. [[filtered_hyp_stack]] first narrows the stack to the hypotheses on which the tactic succeeds, which keeps the backtracking short. On top of this, [[use_assumption]] closes a goal with any hypothesis, possibly through a coercion. Two global typeclass hints add it to resolution for propositional goals, at priority 1 when the goal has no existential variables and at priority 99 when it has some. With these hints, coercions from hypotheses act as forward-mode instance declarations throughout the development."}},"constants":null}</script>

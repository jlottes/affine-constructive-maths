ces.\n\nSubClass IsDecLe X {Xle:Le X} {d:@Dec (X∗X) (≤)} := @IsDec (X∗X) (≤) d.\nExisting Class IsDecLe.\nGlobal Hint Extern 2 (@IsDec (?X ∗ _) (@le _ ?Xle) ?d) => change (@IsDecLe X Xle d) : typeclass_instances.\n\nRecord StrongPoset (X:set) {Xle: Le X} : SProp :=\n{ #[reversible=no] StrongPoset_poset :> Poset X\n; #[reversible=no] StrongPoset_prop :> StrongLe X\n}.\nRecord DecidableOrder (X:set) {Xle: Le X} : SProp :=\n{ #[reversible=no] DecidableOrder_poset :> Poset X\n; #[reversible=no] DecidableOrder_prop :> DecidableLe X\n}.\nRecord AffirmativeOrder (X:set) {Xle: Le X} : SProp :=\n{ #[reversible=no] AffirmativeOrder_poset :> Poset X\n; #[reversible=no] AffirmativeOrder_prop :> AffirmativeLe X\n}.\nRecord RefutativeOrder (X:set) {Xle: Le X} : SProp :=\n{ #[reversible=no] RefutativeOrder_poset :> Poset X\n; #[reversible=no] RefutativeOrder_prop :> RefutativeLe X\n}.\nRecord TotalOrder (X:set) {Xle: Le X} : SProp :=\n{ #[reversible=no] TotalOrder_poset :> Poset X\n; #[reversible=no] TotalOrder_prop :> @TotalRelation  X (≤)\n}.\nRecord LinearOrder (X:set) {Xle: Le X} : SProp :=\n{ #[reversible=no] LinearOrder_poset :> Poset X\n; #[reversible=no] LinearOrder_prop :> @PseudoTotalRelation  X (≤)\n}.\nExisting Class StrongPoset.\nExisting Class DecidableOrder.\nExisting Class AffirmativeOrder.\nExisting Class RefutativeOrder.\nExisting Class TotalOrder.\nExisting Class LinearOrder.\nArguments StrongPoset_prop {_ _ _}.\nArguments DecidableOrder_prop {_ _ _}.\nArguments AffirmativeOrder_prop {_ _ _}.\nArguments RefutativeOrder_prop {_ _ _}.\nArguments TotalOrder_prop {_ _ _}.\nArguments LinearOrder_prop {_ _ _}.\n(*\nGlobal Hint Extern 2 (StronglyTransitive  (≤)) => simple notypeclasses refine StrongPoset_prop      : typeclass_instances.\nGlobal Hint Extern 2 (DecidableRelation   (≤)) => simple notypeclasses refine DecidableOrder_prop   : typeclass_instances.\nGlobal Hint Extern 2 (AffirmativeRelation (≤)) => simple notypeclasses refine AffirmativeOrder_prop : typeclass xt {X Y:set@{u}} {Xle:Le X} {Yle:Le Y} (f : X ⇾ Y).\n\n  Definition OrderPreservingFlip : SProp := @OrderPreserving X (Y ᵒᵖ) _ _ f.\n  Definition OrderReflectingFlip : SProp := @OrderReflecting X (Y ᵒᵖ) _ _ f.\n  Definition OrderEmbeddingFlip : SProp := @OrderEmbedding X (Y ᵒᵖ) _ _ f.\n  Existing Class OrderPreservingFlip.\n  Existing Class OrderReflectingFlip.\n  Existing Class OrderEmbeddingFlip.\n\n  Definition order_embedding_preserving_flip : OrderEmbeddingFlip → OrderPreservingFlip := @order_embedding_preserving X (Y ᵒᵖ) _ _ f.\n  Definition order_embedding_reflecting_flip : OrderEmbeddingFlip → OrderReflectingFlip := @order_embedding_reflecting X (Y ᵒᵖ) _ _ f.\n  Coercion order_embedding_preserving_flip : OrderEmbeddingFlip >-> OrderPreservingFlip.\n  Coercion order_embedding_reflecting_flip : OrderEmbeddingFlip >-> OrderReflectingFlip.\n\n  Definition order_preserving_flip {H:OrderPreservingFlip} : ∀ x y, x ≤ y ⊸ f y ≤ f x := @order_preserving _ _ _ _ _ H.\n  Definition order_reflecting_flip {H:OrderReflectingFlip} : ∀ x y, f y ≤ f x ⊸ x ≤ y := @order_reflecting _ _ _ _ _ H.\n  Definition order_embedding_flip  {H:OrderEmbeddingFlip}  : ∀ x y, x ≤ y ⧟ f y ≤ f x := @order_embedding _ _ _ _ _ H.\nEnd morphisms_flip.\n\n\n(** Lattices *)\n\nRecord UpDirected X {Xle:Le X} : SProp :=\n{ #[reversible=no] UpDirected_preorder :> PreOrder X\n; #[reversible=no] up_directed_inhabited :> Inhabited X\n; up_directed (x y : X) : ∐ z, x ≤ z ⊠ y ≤ z\n}.\nExisting Class UpDirected.\nArguments up_directed_inhabited X {_ _}.\nArguments up_directed {_ _ _} _ _.\n\nDefinition DownDirected X `{Le X} : SProp := UpDirected (X ᵒᵖ).\nExisting Class DownDirected.\nCoercion down_directed_inhabited `{H:DownDirected X} : Inhabited X := up_directed_inhabited (X ᵒᵖ).\nDefinition down_directed `{H:DownDirected X} (x y : X) : ∐ z, z ≤ x ⊠ z ≤ y := up_directed (X:=X ᵒᵖ) x y.\n\n\nRecord MeetSemiLatticeOrder (L:set) `{Le L} `{Meet L} : SProp :=\n{ #[reversible=no] meet_sl_poset :> WeakPoset L\n; meet_lb_l (x y : L) : x ⊓ y ≤ x\n; meet_lb_r (x y : L) : x ⊓ y ≤ y\n; meet_glb (x y z : L) : z ≤ x ⊠ z ≤ y ⊸ z ≤ x ⊓ y\n}.\nExisting Class MeetSemiLatticeOrder.\nArguments meet_lb_l {L _ _ _} _ _.\nArguments meet_lb_r {L _ _ _} _ _.\nArguments meet_glb {L _ _ _} _ _ _.\n\nDefinition JoinSemiLatticeOrder (L:set) `{Le L} `{Join L} : SProp := MeetSemiLatticeOrder (L ᵒᵖ).\nExisting Class JoinSemiLatticeOrder.\nDefinition join_ub_l `{H:JoinSemiLatticeOrder L} (x y : L) : x ≤ x ⊔ y := meet_lb_l (m:=H) x y.\nDefinition join_ub_r `{H:JoinSemiLatticeOrder L} (x y : L) : y ≤ x ⊔ y := meet_lb_r (m:=H) x y.\nDefinition join_lub `{H:JoinSemiLatticeOrder L} (x y z : L) : x ≤ z ⊠ y ≤ z ⊸ x ⊔ y ≤ z:= meet_glb (m:=H) x y z.\n\nRecord LatticeOrder (L:set) `{Le L} `{Meet L} `{Join L} : SProp :=\n{ #[reversible=no] lattice_order_meet :> MeetSemiLatticeOrder L\n; #[reversible=no] lattice_order_join :> JoinSemiLatticeOrder L\n}.\nExisting Class LatticeOrder.\n\nRecord BoundedMeetSemiLatticeOrder (L:set) `{Le L} `{Meet L} `{Top L} : SProp :=\n{ #[reversible=no] bounded_meet_sl_order_meet :> MeetSemiLatticeOrder L\n; below_top (x : L) : x ≤ ⊤\n}.\nExisting Class BoundedMeetSemiLatticeOrder.\nArguments below_top {L _ _ _ _} _.\n\nDefinition BoundedJoinSemiLatticeOrder (L:set) `{Le L} `{Join L} `{Bottom L} : SProp := BoundedMeetSemiLatticeOrder (L ᵒᵖ).\nExisting Class BoundedJoinSemiLatticeOrder.\nDefinition above_bottom `{H:BoundedJoinSemiLatticeOrder L} (x : L) : ⊥ ≤ x := below_top (L:=L ᵒᵖ) x.\n\nRecord BoundedLatticeOrder (L:set) `{Le L} `{Meet L} `{Join L} `{Top L} `{Bottom L} : SProp :=\n{ #[reversible=no] bounded_lattice_order_meet :> BoundedMeetSemiLatticeOrder L\n; #[reversible=no] bounded_lattice_order_join :> BoundedJoinSemiLatticeOrder L\n}.\nExisting Class BoundedLatticeOrder.\n\n#[global] Hint Extern 2 (apos (_ ≤ ⊤)) => simple notypeclasses refine (below_top _) : typeclass_instances.\n#[global] Hint Extern 2 (apos (⊥ ≤ _)) => simple notypeclasses refine (above_bottom _) : typeclass_instances.\n\n(** Subsets *)\n\nGlobal Hint Extern 2 (Le AProp) => exact aimpl : typeclass_instances.\nGlobal Hint Extern 2 (Le (set_T AProp_set)) => exact aimpl : typeclass_instances.\n\nDefinition UpSet {X:set} {Xle:Le X} (U : 𝒫 X) := OrderPreserving U.\nExisting Class UpSet.\nDefinition up_closed {X Xle} U {H:@UpSet X Xle U} : ∀ x y, x ≤ y ⊸ x ∊ U ⊸ y ∊ U := order_preserving U.\nIdentity Coercion UpSet_OrderPreserving : UpSet >-> OrderPreserving.\n\nDefinition DownSet {X:set} {Xle:Le X} (U : 𝒫 X) : SProp := UpSet (X:=X ᵒᵖ) U.\nExisting Class DownSet.\nDefinition down_closed {X Xle} U {H:@DownSet X Xle U} x y : x ≤ y ⊸ y ∊ U ⊸ x ∊ U := up_closed U (H:=H) y x.\n\n\nRecord LeastUpSet {X:set} {Xle:Le X} (U : 𝒫 X) : SProp :=\n{ #[canonical=no, reversible=no] LeastUpSet_WeakPoset :> WeakPoset X\n; least_upset x : x ∊ U ⧟ ∐ a:U, subset_pt a ≤ x\n}.\nExisting Class LeastUpSet.\nArguments least_upset {X Xle} U {_} x.\n\nDefinition LeastDownSet {X:set} {Xle:Le X} (U : 𝒫 X) : SProp := LeastUpSet (X:=X ᵒᵖ) U.\nExisting Class LeastDownSet.\nDefinition least_downset {X Xle} U {H:@LeastDownSet X Xle U} x : x ∊ U ⧟ ∐ a:U, x ≤ subset_pt a := @least_upset _ _ _ H x.\n\n\n(** Induced order on subsets when viewed as sets. *)\nGlobal Hint Extern 2 (Le (set_T (subset_to_set (X:=?X) _))) => let t := get_instance (Le X) in refine (λ '(x, y), t (subset_pt x, subset_pt y)) : typeclass_instances.\nGlobal Hint Extern 2 (Le (@subset_el ?X _)) => let t := get_instance (Le X) in refine (λ '(x, y), t (subset_pt x, subset_pt y)) : typeclass_instances.\nGlobal Hint Extern 2 (Le (@powerset_el ?X _)) => let t := get_instance (Le (𝒫 X)) in refine (λ '(x, y), t (powerset_pt x, powerset_pt y)) : typeclass_instances.\n\n(*\nRecord Filter {X:set} {Xle:Le X} (U : 𝒫 X) : SProp :=\n{ #[reversible=no] Filter_UpSet :> LeastUpSet U\n; #[reversible=no] Filter_directed :> DownDirected U\n}.\nExisting Class Filter.\n\nDefinition Ideal {X:set} {Xle:Le X} (U : 𝒫 X) : SProp := Filter (X:=X ᵒᵖ) U.\nExisting Class Ideal.\nCoercion Ideal_DownSet `{H:@Ideal X Xle U} : LeastDownSet U := Filter_UpSet (X:=X ᵒᵖ) U _.\nCoercion Ideal_directed `{H:@Ideal X Xle U} : UpDirected U.  Proof. apply H. Defined.\n*)\n\n(** Directed subsets with full affine membership content *)\n\nRecord UpDirectedSubset {X:set} {Xle:Le X} (U : 𝒫 X) : SProp :=\n{ #[reversible=no] UpDirectedSubset_preorder :> PreOrder X\n; up_directed_subset_inhabited : ∐ x : X, x ∊ U\n; up_directed_subset (x y : X) : x ∊ U ⊠ y ∊ U ⊸ ∐ z : X, z ∊ U ⊠ x ≤ z ⊠ y ≤ z\n}.\nExisting Class UpDirectedSubset.\nArguments up_directed_subset_inhabited {_ _} U {_}.\nArguments up_directed_subset {_ _} U {_} _ _.\n\nDefinition DownDirectedSubset {X:set} {Xle:Le X} (U : 𝒫 X) : SProp := UpDirectedSubset (X:=X ᵒᵖ) U.\nExisting Class DownDirectedSubset.\nDefinition down_directed_subset_inhabited `{H:DownDirectedSubset (X:=X) U} : ∐ x : X, x ∊ U := up_directed_subset_inhabited U (u:=H).\nDefinition down_directed_subset `{H:DownDirectedSubset (X:=X) U} (x y : X) : x ∊ U ⊠ y ∊ U ⊸ ∐ z : X, z ∊ U ⊠ z ≤ x ⊠ z ≤ y := up_directed_subset U (u:=H) x y.\n\nRecord Filter {X:set} {Xle:Le X} (U : 𝒫 X) : SProp :=\n{ #[reversible=no] Filter_UpSet :> UpSet U\n; #[reversible=no] Filter_directed :> DownDirectedSubset U\n}.\nExisting Class Filter.\n\nDefinition Ideal {X:set} {Xle:Le X} (U : 𝒫 X) : SProp := Filter (X:=X ᵒᵖ) U.\nExisting Class Ideal.\nCoercion Ideal_DownSet `{H:@Ideal X Xle U} : DownSet U := Filter_UpSet (X:=X ᵒᵖ) U _.\nCoercion Ideal_directed `{H:@Ideal X Xle U} : UpDirectedSubset U := Filter_directed (X:=X ᵒᵖ) U _.\n\nRecord FilterPresentation@{u} {X:set@{u}} {Xle:Le X} (U : 𝒫 X) {Λ:Type@{u}} (β:Λ → X) : SProp :=\n{ #[canonical=no, reversible=no] filter_presentation_poset :> WeakPoset X\n;  filter_presentation x : x ∊ U ⧟ ∐ i, β i ≤ x\n}.\nExisting Class FilterPresentation.\nArguments filter_presentation {_ _} U {_} β {_} x.\n\nClass FilterBasis@{u} {X:set@{u}} {Xle:Le X} {Λ:Type@{u}} (β:Λ → X) : SProp :=\n  filter_basis (x:X) : ∐ i, β i ≤ x elation_notation","name":"Le","kind":"class","local":false,"page":"relation_notation.html"},{"s":15270,"e":15272,"lib":"AffineConstructive.interfaces.subset.notation","name":"𝒫","kind":"abbrev","local":false,"page":"subset/notation.html"},{"s":15313,"e":15331,"lib":"AffineConstructive.interfaces.orders","name":"FilterPresentation","kind":"class","local":true},{"s":15377,"e":15380,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":15391,"e":15393,"lib":"AffineConstructive.interfaces.relation_notation","name":"Le","kind":"class","local":false,"page":"relation_notation.html"},{"s":15434,"e":15445,"lib":"AffineConstructive.interfaces.orders","name":"FilterBasis","kind":"class","local":true},{"s":15475,"e":15492,"lib":"AffineConstructive.interfaces.orders","name":"IdealPresentation","kind":"def","local":true},{"s":15509,"e":15519,"lib":"AffineConstructive.interfaces.orders","name":"IdealBasis","kind":"def","local":true},{"s":15557,"e":15574,"lib":"AffineConstructive.interfaces.orders","name":"IdealPresentation","kind":"class","local":true},{"s":15622,"e":15641,"lib":"AffineConstructive.interfaces.orders","name":"filter_presentation","kind":"proj","local":true},{"s":15683,"e":15693,"lib":"AffineConstructive.interfaces.orders","name":"IdealBasis","kind":"class","local":true},{"s":15745,"e":15763,"lib":"AffineConstructive.interfaces.orders","name":"ideal_presentation","kind":"def","local":true},{"s":15795,"e":15806,"lib":"AffineConstructive.interfaces.orders","name":"ideal_basis","kind":"def","local":true},{"s":1617,"e":1620,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1637,"e":1640,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1698,"e":1701,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1723,"e":1726,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1793,"e":1796,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1827,"e":1830,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1856,"e":1868,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"}],"gloss":{"summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/.","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","items":[{"name":"AffineConstructive.interfaces.orders.PreOrder","base":"PreOrder","kind":"rec","start":5,"body":null,"status":"ok","short":{"text":"A preorder: the order ≤ on X is reflexive and transitive","status":"ok"},"long":{"text":"A preorder on X asks that ≤ be reflexive and transitive ([[AffineConstructive.interfaces.aprop.Reflexive]], [[AffineConstructive.interfaces.aprop.Transitive]]). Transitivity is the multiplicative one: x ≤ y tensor y ≤ z implies x ≤ z, each hypothesis used once. Since the implication is affine, it carries its contrapositive: if x ≰ z, then x ≰ y par y ≰ z.\n\nThe carrier is any type, not a set, so nothing here relates ≤ to equality. That comes in [[AffineConstructive.interfaces.orders.WeakPoset]], the structure that most of the development assumes. The bare preorder is used where only reflexivity and transitivity matter, as in [[AffineConstructive.interfaces.orders.UpDirected]] and [[AffineConstructive.interfaces.orders.UpDirectedSubset]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.le_refl","base":"le_refl","kind":"proj","short":{"text":"The reflexivity of the order of a preorder","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.le_trans","base":"le_trans","kind":"proj","short":{"text":"The transitivity of the order of a preorder","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_PreOrder","base":"Build_PreOrder","kind":"constr","short":{"text":"Builds a preorder from the reflexivity and transitivity of ≤","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.WeakPoset","base":"WeakPoset","kind":"rec","start":11,"body":null,"status":"ok","short":{"text":"A weak partial order on a set: a preorder containing equality and pseudo-antisymmetric","status":"ok"},"long":{"text":"A weak poset is a preorder on a set X with two links between ≤ and the equality of X. First, equality is contained in the order: x = y implies x ≤ y ([[AffineConstructive.interfaces.aprop.Subrelation]]). Together with transitivity, this makes ≤ respect equality ([[AffineConstructive.interfaces.orders.le_is_fun]]). Second, ≤ is pseudo-antisymmetric ([[AffineConstructive.interfaces.aprop.PseudoAntisymmetric]]): x ≤ y tensor y ≤ x implies x = y. Read contrapositively, x ≠ y implies x ≰ y par y ≰ x.\n\nAntisymmetry is the weaker, multiplicative form here. The additive form, with the and, belongs to [[AffineConstructive.interfaces.orders.Poset]]. Most order notions in the development need only a weak poset: order morphisms ([[AffineConstructive.interfaces.orders.OrderMorphism]]), semilattices ([[AffineConstructive.interfaces.orders.MeetSemiLatticeOrder]]) and filter presentations.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.partial_order_preorder","base":"partial_order_preorder","kind":"proj","short":{"text":"The underlying preorder of a weak poset","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.eq_le_sub","base":"eq_le_sub","kind":"proj","short":{"text":"In a weak poset, equal elements are related by ≤","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.le_pseudo_antisym","base":"le_pseudo_antisym","kind":"proj","short":{"text":"The pseudo-antisymmetry of a weak poset: x ≤ y tensor y ≤ x implies x = y","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_WeakPoset","base":"Build_WeakPoset","kind":"constr","short":{"text":"Builds a weak poset from a preorder that contains equality and is pseudo-antisymmetric","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.le_is_fun","base":"le_is_fun","kind":"prf","start":18,"body":[19,32],"status":"ok","short":{"text":"The order of a weak poset respects equality, as a function on the tensor product P ⊗ P","status":"ok"},"proof":[{"text":"It suffices to show one direction for arbitrary points: x₁ = x₂ and y₁ = y₂ together give x₁ ≤ y₁ ⊸ x₂ ≤ y₂. First the lemma is derived from this, then it is proved.","status":"ok","from":0,"to":1},{"text":"Take two pairs (x₁, y₁) and (x₂, y₂). Equality in the tensor product P ⊗ P is the tensor of the componentwise equalities, and equality of affine propositions is ⧟, so the goal asks that x₁ = x₂ ⊠ y₁ = y₂ implies x₁ ≤ y₁ ⧟ x₂ ≤ y₂.","status":"ok","from":2,"to":4},{"text":"The equivalence is the additive conjunction of two implications, so each is proved from the same pair of equalities. The forward implication is the reduced statement. For the backward one, turn both equalities around by symmetry ([[AffineConstructive.logic.relations.symmetry_iff]]); the reduced statement then applies with the roles of the two pairs exchanged.","status":"ok","from":5,"to":6},{"text":"Now the reduced statement itself. Fix x₁, x₂, y₁, y₂.","status":"ok","from":7,"to":8},{"text":"By transitivity ([[AffineConstructive.interfaces.aprop.transitivity]]) applied twice, x₂ ≤ y₂ follows from x₂ ≤ x₁ ⊠ x₁ ≤ y₁ ⊠ y₁ ≤ y₂. The middle factor is the hypothesis x₁ ≤ y₁. The outer factors still have to come from the two equalities, and x₁ = x₂ is reversed to x₂ = x₁ by symmetry.","status":"ok","from":9,"to":10},{"text":"In a weak poset equality implies ≤ ([[AffineConstructive.interfaces.aprop.subrelation]]). Applied to each equality separately, it turns x₂ = x₁ into x₂ ≤ x₁ and y₁ = y₂ into y₁ ≤ y₂. Each hypothesis is then used exactly once, as one factor of the tensor, and the goal follows by rearranging.","status":"ok","from":11,"to":13}]},{"name":"AffineConstructive.interfaces.orders.le_fun","base":"le_fun","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"The order of a weak poset, as a function P ⊗ P ⇾ Ω","status":"ok"},"long":{"text":"This is the relation ≤ packaged as a morphism of sets from the tensor product P ⊗ P to the affine propositions. It rests on [[AffineConstructive.interfaces.orders.le_is_fun]]. Equalities x₁ = x₂ tensor y₁ = y₂ imply that x₁ ≤ y₁ if and only if x₂ ≤ y₂. The tensor product is the right domain because the two equalities are used together, multiplicatively, through two applications of transitivity.\n\nIt is registered canonically, so the rewriting system can rewrite by equalities inside x ≤ y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.lt_is_fun","base":"lt_is_fun","kind":"prf","start":34,"body":[35,37],"status":"ok","short":{"text":"The strict order of a weak poset respects equality, as a function on P ⊗ P","status":"ok"},"proof":[{"text":"In a weak poset x < y is the negation of y ≤ x. So the strict order is a composite of three functions: swap the two factors of P ⊗ P, apply the order (a function by the preceding lemma), then negate (negation is a function on Ω). A composite of functions is a function.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.interfaces.orders.lt_fun","base":"lt_fun","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"The strict order of a weak poset, as a function P ⊗ P ⇾ Ω","status":"ok"},"long":{"text":"The strict order x < y is the negation of y ≤ x. As a morphism it is a composite: first swap the two factors of P ⊗ P, then apply [[AffineConstructive.interfaces.orders.le_fun]], then negate. Because of this, the strict order respects equality without further work ([[AffineConstructive.interfaces.orders.lt_is_fun]]), and the rewriting system can rewrite by equalities inside x < y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.Poset","base":"Poset","kind":"rec","start":39,"body":null,"status":"ok","short":{"text":"A partial order: a weak poset whose order is antisymmetric for the additive and","status":"ok"},"long":{"text":"A poset is a weak poset that is also antisymmetric in the additive sense ([[AffineConstructive.interfaces.aprop.Antisymmetric]]): x ≤ y and y ≤ x implies x = y. The tensor implies the and, so this is stronger than the pseudo-antisymmetry of [[AffineConstructive.interfaces.orders.WeakPoset]]. The difference shows in the contrapositive. Here x ≠ y implies x ≰ y or y ≰ x, so an apartness decides which of the two comparisons fails. Pseudo-antisymmetry gives only the par.\n\nThe decorated orders ([[AffineConstructive.interfaces.orders.StrongPoset]], [[AffineConstructive.interfaces.orders.DecidableOrder]], [[AffineConstructive.interfaces.orders.TotalOrder]], [[AffineConstructive.interfaces.orders.LinearOrder]], …) are all posets with one more property.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.poset_weak_poset","base":"poset_weak_poset","kind":"proj","short":{"text":"The underlying weak poset of a poset","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.le_antisym","base":"le_antisym","kind":"proj","short":{"text":"The antisymmetry of a poset: x ≤ y and y ≤ x implies x = y","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_Poset","base":"Build_Poset","kind":"constr","short":{"text":"Builds a poset from a weak poset with antisymmetric order","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.StrongLe","base":"StrongLe","kind":"def","start":44,"body":null,"status":"ok","short":{"text":"The order is strongly transitive: x ≤ y and y ≤ z implies x ≤ z","status":"ok"},"long":{"text":"This is [[AffineConstructive.interfaces.aprop.StronglyTransitive]] at the order ≤. It is transitivity with the additive and in place of the tensor, so both hypotheses may be used freely. Its contrapositive is a cotransitivity: if x ≰ z, then x ≰ y or y ≰ z, for every y. The name gives instance resolution a handle on the property of ≤ alone. It is the extra field of [[AffineConstructive.interfaces.orders.StrongPoset]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.DecidableLe","base":"DecidableLe","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"Every comparison x ≤ y of the order is decidable","status":"ok"},"long":{"text":"This is [[AffineConstructive.interfaces.aprop.DecidableRelation]] at the order ≤ on X ∗ X: every proposition x ≤ y is decidable in Shulman's sense. The name gives instance resolution a handle on the property of ≤ alone. It is the extra field of [[AffineConstructive.interfaces.orders.DecidableOrder]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.AffirmativeLe","base":"AffirmativeLe","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"Every comparison x ≤ y of the order is affirmative","status":"ok"},"long":{"text":"This is [[AffineConstructive.interfaces.aprop.AffirmativeRelation]] at the order ≤: every proposition x ≤ y is affirmative, so it is determined by its proofs, and its refutation is the impossibility of a proof. The name gives instance resolution a handle on the property of ≤ alone. It is the extra field of [[AffineConstructive.interfaces.orders.AffirmativeOrder]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.RefutativeLe","base":"RefutativeLe","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"The order of X is refutative: every comparison x ≤ y is a refutative proposition","status":"ok"},"long":{"text":"This is [[AffineConstructive.interfaces.aprop.RefutativeRelation]] stated for the order ≤ of X: for every pair x, y, the proposition x ≤ y belongs to Shulman's class of refutative propositions. Naming it as a property of ≤ alone lets instance resolution find it from the order of a set. It is the extra field of [[AffineConstructive.interfaces.orders.RefutativeOrder]], next to [[AffineConstructive.interfaces.orders.DecidableLe]] and [[AffineConstructive.interfaces.orders.AffirmativeLe]], which do the same for the other two classes.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.IsDecLe","base":"IsDecLe","kind":"def","start":56,"body":null,"status":"ok","short":{"text":"The given decision function for the order of X is correct","status":"ok"},"long":{"text":"This is [[AffineConstructive.interfaces.aprop.IsDec]] at the order ≤. Given a boolean decision function for ≤ ([[AffineConstructive.interfaces.aprop.Dec]]), it says that true yields x ≤ y and false yields its negation. It is the computational form of [[AffineConstructive.interfaces.orders.DecidableLe]], and the name gives instance resolution a handle on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.StrongPoset","base":"StrongPoset","kind":"rec","start":59,"body":null,"status":"ok","short":{"text":"A poset whose order is strongly transitive","status":"ok"},"long":{"text":"A strong poset is a [[AffineConstructive.interfaces.orders.Poset]] whose order satisfies [[AffineConstructive.interfaces.orders.StrongLe]]. The additive transitivity gives a cotransitivity: x ≰ z implies x ≰ y or y ≰ z. This plays the role that cotransitivity of < plays in constructive order theory.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.StrongPoset_poset","base":"StrongPoset_poset","kind":"proj","short":{"text":"The underlying poset of a strong poset","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.StrongPoset_prop","base":"StrongPoset_prop","kind":"proj","short":{"text":"The strong transitivity of the order of a strong poset","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_StrongPoset","base":"Build_StrongPoset","kind":"constr","short":{"text":"Builds a strong poset from a poset with strongly transitive order","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.DecidableOrder","base":"DecidableOrder","kind":"rec","start":60,"body":null,"status":"ok","short":{"text":"A poset whose order is decidable: each x ≤ y is either proved or refuted","status":"ok"},"long":{"text":"A [[AffineConstructive.interfaces.orders.Poset]] whose order is a decidable relation ([[AffineConstructive.interfaces.orders.DecidableLe]]): for all x and y the affine proposition x ≤ y is decidable, so it either holds or is refuted. A refutation of x ≤ y is a proof of y < x, so a decidable order compares any two elements one way or the other, and the stronger properties follow from it: a decidable order is affirmative, refutative and strong ([[AffineConstructive.orders.orders.dec_order_aff]], [[AffineConstructive.orders.orders.dec_order_ref]], [[AffineConstructive.orders.orders.dec_order_strong]]), and with antisymmetry its equality is decidable too ([[AffineConstructive.orders.orders.DecidableOrder_DecidableEquality]]).\n\nThe usual source of the property is a correct three-way comparison ([[AffineConstructive.orders.orders.trich_decidable]]); the order of an ordered model of the naturals is one example ([[AffineConstructive.orders.naturals.naturals_dec_order]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.DecidableOrder_poset","base":"DecidableOrder_poset","kind":"proj","short":{"text":"The poset underlying a decidable order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.DecidableOrder_prop","base":"DecidableOrder_prop","kind":"proj","short":{"text":"The decidability of the order of a decidable order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_DecidableOrder","base":"Build_DecidableOrder","kind":"constr","short":{"text":"Builds a decidable order from a poset and the decidability of its order","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.AffirmativeOrder","base":"AffirmativeOrder","kind":"rec","start":61,"body":null,"status":"ok","short":{"text":"A poset in which every comparison x ≤ y is affirmative","status":"ok"},"long":{"text":"A [[AffineConstructive.interfaces.orders.Poset]] whose order is an affirmative relation ([[AffineConstructive.interfaces.orders.AffirmativeLe]]): each proposition x ≤ y is affirmative in Shulman's sense. Dually, the strict order, being the negation of ≤ with the arguments swapped, is then refutative ([[AffineConstructive.orders.orders.AffirmativeOrder_RefutativeLt]]).\n\nEvery decidable order is affirmative ([[AffineConstructive.orders.orders.dec_order_aff]]). The property passes to opposites, subsets and projected orders, and the development establishes it for the order on a fibre of a reflection pair ([[AffineConstructive.topology.interfaces.reflection_pair.fib_aff_order]]) and for the group completion of a monoid with affirmative order ([[AffineConstructive.theory.group_completion.group_completion_affirmative_order]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.AffirmativeOrder_poset","base":"AffirmativeOrder_poset","kind":"proj","short":{"text":"The poset underlying an affirmative order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.AffirmativeOrder_prop","base":"AffirmativeOrder_prop","kind":"proj","short":{"text":"The affirmativity of ≤ in an affirmative order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_AffirmativeOrder","base":"Build_AffirmativeOrder","kind":"constr","short":{"text":"Builds an affirmative order from a poset whose order is affirmative","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.RefutativeOrder","base":"RefutativeOrder","kind":"rec","start":62,"body":null,"status":"ok","short":{"text":"A poset whose order relation is refutative","status":"ok"},"long":{"text":"A refutative order is a [[AffineConstructive.interfaces.orders.Poset]] together with [[AffineConstructive.interfaces.orders.RefutativeLe]]: each comparison x ≤ y is a refutative proposition. It belongs to the same family as [[AffineConstructive.interfaces.orders.DecidableOrder]] and [[AffineConstructive.interfaces.orders.AffirmativeOrder]]. Each of these three adds to a poset the requirement that its order lies in one of Shulman's classes of propositions.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.RefutativeOrder_poset","base":"RefutativeOrder_poset","kind":"proj","short":{"text":"The poset underlying a refutative order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.RefutativeOrder_prop","base":"RefutativeOrder_prop","kind":"proj","short":{"text":"The refutativity of the order of a refutative order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_RefutativeOrder","base":"Build_RefutativeOrder","kind":"constr","short":{"text":"Builds a refutative order from a poset and the refutativity of its order","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.TotalOrder","base":"TotalOrder","kind":"rec","start":63,"body":null,"status":"ok","short":{"text":"A poset whose order is total: x ≤ y or y ≤ x for all x and y","status":"ok"},"long":{"text":"A total order is a [[AffineConstructive.interfaces.orders.Poset]] whose order is total in the sense of [[AffineConstructive.interfaces.aprop.TotalRelation]]: for all x and y, x ≤ y ∨ y ≤ x, with the additive or. A proof of the additive or names which of the two disjuncts holds, so totality provides, for each pair, one of the two comparisons. [[AffineConstructive.interfaces.orders.LinearOrder]] is the weaker condition that uses the par in place of the or.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.TotalOrder_poset","base":"TotalOrder_poset","kind":"proj","short":{"text":"The poset underlying a total order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.TotalOrder_prop","base":"TotalOrder_prop","kind":"proj","short":{"text":"The totality of the order of a total order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_TotalOrder","base":"Build_TotalOrder","kind":"constr","short":{"text":"Builds a total order from a poset and the totality of its order","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.LinearOrder","base":"LinearOrder","kind":"rec","start":64,"body":null,"status":"ok","short":{"text":"A poset whose order is pseudo-total: x ≤ y par y ≤ x for all x and y","status":"ok"},"long":{"text":"A linear order is a [[AffineConstructive.interfaces.orders.Poset]] whose order is pseudo-total in the sense of [[AffineConstructive.interfaces.aprop.PseudoTotalRelation]]: for all x and y, x ≤ y ⊞ y ≤ x. The strict order x < y is the negation of y ≤ x, and the dual of a par is the tensor of the duals. So the condition reads, dually, as the refutation of y < x ⊠ x < y: the strict order is asymmetric. Unlike [[AffineConstructive.interfaces.orders.TotalOrder]], which uses the additive or, the par does not provide either comparison by itself.\n\nIn this file a linear order is the order that a trichotomy function must agree with: [[AffineConstructive.interfaces.orders.IsTrich]] asks for a linear order and a three-way comparison [[AffineConstructive.interfaces.orders.trich]] that is correct with respect to < and =.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.LinearOrder_poset","base":"LinearOrder_poset","kind":"proj","short":{"text":"The poset underlying a linear order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.LinearOrder_prop","base":"LinearOrder_prop","kind":"proj","short":{"text":"The pseudo-totality of the order of a linear order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_LinearOrder","base":"Build_LinearOrder","kind":"constr","short":{"text":"Builds a linear order from a poset and the pseudo-totality of its order","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.trich_t","base":"trich_t","kind":"ind","start":79,"body":null,"status":"ok","short":{"text":"The three outcomes of a comparison: less, equal, greater","status":"ok"},"long":{"text":"A three-element type of comparison outcomes. A comparison function ([[AffineConstructive.interfaces.orders.Trich]]) returns one of these, and [[AffineConstructive.interfaces.orders.IsTrich]] says what each outcome means.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.trich_t_rect","base":"trich_t_rect","kind":"scheme","short":{"text":"Case analysis on a comparison outcome, into a type","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.trich_t_ind","base":"trich_t_ind","kind":"scheme","short":{"text":"Case analysis on a comparison outcome, into Prop","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.trich_t_rec","base":"trich_t_rec","kind":"scheme","short":{"text":"Case analysis on a comparison outcome, into Set","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.trich_t_sind","base":"trich_t_sind","kind":"scheme","short":{"text":"Case analysis on a comparison outcome, into SProp","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.is_lt","base":"is_lt","kind":"constr","short":{"text":"The outcome less than","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.is_eq","base":"is_eq","kind":"constr","short":{"text":"The outcome equal","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.is_gt","base":"is_gt","kind":"constr","short":{"text":"The outcome greater than","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.Trich","base":"Trich","kind":"ind","start":80,"body":null,"status":"ok","short":{"text":"A comparison function sending each pair of elements of X to less, equal or greater","status":"ok"},"long":{"text":"A function from pairs of elements of X to [[AffineConstructive.interfaces.orders.trich_t]]. On its own it is data with no specification. [[AffineConstructive.interfaces.orders.IsTrich]] makes it a correct three-way comparison for a linear order. It lets computation branch on the comparison of two elements.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.Trich","base":"Trich","kind":"rec","short":{"text":"The class of three-way comparison functions on X","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.trich","base":"trich","kind":"proj","short":{"text":"The three-way comparison function of X","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.IsTrich","base":"IsTrich","kind":"rec","start":81,"body":null,"status":"ok","short":{"text":"A linear order whose comparison function is correct: less, equal, greater mean x < y, x = y, y < x","status":"ok"},"long":{"text":"A trichotomous order is a [[AffineConstructive.interfaces.orders.LinearOrder]] with a comparison function [[AffineConstructive.interfaces.orders.trich]] that is correct. On each pair it returns less only when x < y, equal only when x = y, and greater only when y < x. This is a decidable three-way comparison. It is stronger than totality, because it also decides equality. It holds for the naturals and the integers.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.trich_linear","base":"trich_linear","kind":"proj","short":{"text":"The underlying linear order of a trichotomous order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.trich_spec","base":"trich_spec","kind":"proj","short":{"text":"The correctness of the comparison: each outcome yields x < y, x = y, or y < x","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_IsTrich","base":"Build_IsTrich","kind":"constr","short":{"text":"Builds a trichotomous order from a linear order and a correct comparison function","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.OrderMorphism","base":"OrderMorphism","kind":"rec","start":86,"body":null,"status":"ok","short":{"text":"Domain and codomain of a map between ordered sets are both weak posets","status":"ok"},"long":{"text":"An auxiliary record that holds the [[AffineConstructive.interfaces.orders.WeakPoset]] structures of the domain and the codomain. The classes of order maps ([[AffineConstructive.interfaces.orders.OrderPreserving]], [[AffineConstructive.interfaces.orders.OrderReflecting]]) carry it, so a hypothesis that f is monotone also provides both weak posets. Only the domain's structure is a coercion. Instance resolution can therefore reach the domain's order from such a hypothesis but not the codomain's.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.order_mor_X","base":"order_mor_X","kind":"proj","short":{"text":"The weak poset structure of the domain","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.order_mor_Y","base":"order_mor_Y","kind":"proj","short":{"text":"The weak poset structure of the codomain","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_OrderMorphism","base":"Build_OrderMorphism","kind":"constr","short":{"text":"Builds an order morphism record from weak posets on domain and codomain","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.OrderPreserving","base":"OrderPreserving","kind":"rec","start":89,"body":null,"status":"ok","short":{"text":"f preserves the order: x ≤ y implies f x ≤ f y","status":"ok"},"long":{"text":"A map f of sets between weak posets is order-preserving when x ≤ y implies f x ≤ f y. The implication is affine, so f also reflects the strict order: f y < f x implies y < x. In the affine setting monotonicity and this reflection are one condition.\n\nIn the development, upward closed subsets ([[AffineConstructive.interfaces.orders.UpSet]]) are the order-preserving maps into Ω, and order-reversing maps ([[AffineConstructive.interfaces.orders.OrderPreservingFlip]]) are order-preserving maps into the opposite order.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.order_preserving_mor_X","base":"order_preserving_mor_X","kind":"proj","short":{"text":"The weak poset structures of domain and codomain of an order-preserving map","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.order_preserving","base":"order_preserving","kind":"proj","short":{"text":"The monotonicity of an order-preserving map: x ≤ y implies f x ≤ f y","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_OrderPreserving","base":"Build_OrderPreserving","kind":"constr","short":{"text":"Builds an order-preserving map from weak posets and the monotonicity of f","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.OrderReflecting","base":"OrderReflecting","kind":"rec","start":90,"body":null,"status":"ok","short":{"text":"f reflects the order: f x ≤ f y implies x ≤ y","status":"ok"},"long":{"text":"A map f between weak posets reflects the order when f x ≤ f y implies x ≤ y. The contrapositive says that f preserves the strict order: y < x implies f y < f x. Together with [[AffineConstructive.interfaces.orders.OrderPreserving]] it makes an order embedding ([[AffineConstructive.interfaces.orders.OrderEmbedding]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.order_reflecting_mor","base":"order_reflecting_mor","kind":"proj","short":{"text":"The weak poset structures of domain and codomain of an order-reflecting map","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.order_reflecting","base":"order_reflecting","kind":"proj","short":{"text":"The order reflection of f: f x ≤ f y implies x ≤ y","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_OrderReflecting","base":"Build_OrderReflecting","kind":"constr","short":{"text":"Builds an order-reflecting map from weak posets and the reflection property","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.OrderEmbedding","base":"OrderEmbedding","kind":"rec","start":91,"body":null,"status":"ok","short":{"text":"f both preserves and reflects the order","status":"ok"},"long":{"text":"An order embedding is a map that is order-preserving and order-reflecting. Then x ≤ y holds exactly when f x ≤ f y ([[AffineConstructive.interfaces.orders.order_embedding]]). It is the order-theoretic counterpart of the initial maps of the topology half.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.order_embedding_preserving","base":"order_embedding_preserving","kind":"proj","short":{"text":"An order embedding is order-preserving","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.order_embedding_reflecting","base":"order_embedding_reflecting","kind":"proj","short":{"text":"An order embedding is order-reflecting","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_OrderEmbedding","base":"Build_OrderEmbedding","kind":"constr","short":{"text":"Builds an order embedding from order preservation and reflection","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.order_embedding","base":"order_embedding","kind":"def","start":97,"body":null,"status":"ok","short":{"text":"For an order embedding f, x ≤ y if and only if f x ≤ f y","status":"ok"},"long":{"text":"This is the affine equivalence carried by an [[AffineConstructive.interfaces.orders.OrderEmbedding]]. It pairs [[AffineConstructive.interfaces.orders.order_preserving]] and [[AffineConstructive.interfaces.orders.order_reflecting]] into one statement, x ≤ y ⧟ f x ≤ f y, so it can serve as a rewriting rule.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.OrderPreservingFlip","base":"OrderPreservingFlip","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"f reverses the order: x ≤ y implies f y ≤ f x","status":"ok"},"long":{"text":"An order-reversing map is defined as an order-preserving map into the opposite order on the codomain. Duality is by instantiation, so every fact about [[AffineConstructive.interfaces.orders.OrderPreserving]] applies to it directly. [[AffineConstructive.interfaces.orders.order_preserving_flip]] states the property at the direct order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.OrderReflectingFlip","base":"OrderReflectingFlip","kind":"def","start":103,"body":null,"status":"ok","short":{"text":"f reflects the order in reverse: f y ≤ f x implies x ≤ y","status":"ok"},"long":{"text":"An order-reflecting map into the opposite order on the codomain. [[AffineConstructive.interfaces.orders.order_reflecting_flip]] states the property at the direct order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.OrderEmbeddingFlip","base":"OrderEmbeddingFlip","kind":"def","start":104,"body":null,"status":"ok","short":{"text":"f is an order-reversing embedding: x ≤ y if and only if f y ≤ f x","status":"ok"},"long":{"text":"An order-reversing embedding is an [[AffineConstructive.interfaces.orders.OrderEmbedding]] into the opposite order of the codomain: f reverses the order and reflects it in reverse, so x ≤ y if and only if f y ≤ f x. It is defined at the opposite order rather than as a record of its own, so it inherits the whole theory of order embeddings; [[AffineConstructive.interfaces.orders.order_embedding_flip]], [[AffineConstructive.interfaces.orders.order_embedding_preserving_flip]] and [[AffineConstructive.interfaces.orders.order_embedding_reflecting_flip]] restate the fields at the direct order of the codomain.\n\nNegation on Ω is the first example: P ⊸ Q if and only if Qᗮ ⊸ Pᗮ ([[AffineConstructive.orders.orders.anot_order_embedding_flip]]), and the complement of subsets is another ([[AffineConstructive.orders.subset.complement_order_embedding_flip]]). Two order-reversing embeddings compose to an order embedding ([[AffineConstructive.orders.maps.OrderEmbedding_compose_flip]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.order_embedding_preserving_flip","base":"order_embedding_preserving_flip","kind":"def","start":108,"body":null,"status":"ok","short":{"text":"An order-reversing embedding is order-reversing","status":"ok"},"long":{"text":"The preservation half of an [[AffineConstructive.interfaces.orders.OrderEmbeddingFlip]], restated at the flipped class [[AffineConstructive.interfaces.orders.OrderPreservingFlip]] and registered as a coercion, so that resolution finds it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.order_embedding_reflecting_flip","base":"order_embedding_reflecting_flip","kind":"def","start":109,"body":null,"status":"ok","short":{"text":"An order-reversing embedding reflects the order in reverse","status":"ok"},"long":{"text":"The reflection half of an [[AffineConstructive.interfaces.orders.OrderEmbeddingFlip]], restated at the flipped class [[AffineConstructive.interfaces.orders.OrderReflectingFlip]] and registered as a coercion, so that resolution finds it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.morphisms_flip.coercion:order_embedding_preserving_flip","base":"coercion:order_embedding_preserving_flip","kind":"coercion","start":110,"body":null,"status":"ok","short":{"text":"An order-reversing embedding serves wherever an order-reversing map is asked for, through [[AffineConstructive.interfaces.orders.order_embedding_preserving_flip]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.morphisms_flip.coercion:order_embedding_reflecting_flip","base":"coercion:order_embedding_reflecting_flip","kind":"coercion","start":111,"body":null,"status":"ok","short":{"text":"An order-reversing embedding serves wherever reflection of the order in reverse is asked for, through [[AffineConstructive.interfaces.orders.order_embedding_reflecting_flip]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.order_preserving_flip","base":"order_preserving_flip","kind":"def","start":112,"body":null,"status":"ok","short":{"text":"An order-reversing map sends x ≤ y to f y ≤ f x","status":"ok"},"long":{"text":"The defining property of [[AffineConstructive.interfaces.orders.OrderPreservingFlip]], stated at the direct order of the codomain rather than at its opposite.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.order_reflecting_flip","base":"order_reflecting_flip","kind":"def","start":113,"body":null,"status":"ok","short":{"text":"For an order-reversing reflecting map, f y ≤ f x implies x ≤ y","status":"ok"},"long":{"text":"The defining property of [[AffineConstructive.interfaces.orders.OrderReflectingFlip]], stated at the direct order of the codomain rather than at its opposite.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.order_embedding_flip","base":"order_embedding_flip","kind":"def","start":114,"body":null,"status":"ok","short":{"text":"For an order-reversing embedding, x ≤ y if and only if f y ≤ f x","status":"ok"},"long":{"text":"The defining equivalence of [[AffineConstructive.interfaces.orders.OrderEmbeddingFlip]], stated at the direct order of the codomain, for use as a rewriting rule.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.UpDirected","base":"UpDirected","kind":"rec","start":116,"body":null,"status":"ok","short":{"text":"An inhabited preorder in which any two elements have a common upper bound","status":"ok"},"long":{"text":"A type X with a preorder is directed upward when it is inhabited and, for all x and y, there is z with x ≤ z ⊠ y ≤ z. The existential is affine and the conjunction multiplicative: one bound z comes with both comparisons, each usable once. The condition concerns the whole carrier; directedness of a subset, where membership of the bound is part of the content, is [[AffineConstructive.interfaces.orders.UpDirectedSubset]]. The downward notion [[AffineConstructive.interfaces.orders.DownDirected]] is this one at the opposite order.\n\nAn inhabited join semilattice order is up-directed, with x ⊔ y as the common bound ([[AffineConstructive.orders.lattices.join_sl_directed]]). The hypothesis is used to show that a family on an up-directed index presents an ideal ([[AffineConstructive.orders.filters.presented_ideal_ideal]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.UpDirected_preorder","base":"UpDirected_preorder","kind":"proj","short":{"text":"The preorder underlying an up-directed type","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.up_directed_inhabited","base":"up_directed_inhabited","kind":"proj","short":{"text":"An up-directed type is inhabited","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.up_directed","base":"up_directed","kind":"proj","short":{"text":"In an up-directed type, any two elements have a common upper bound","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_UpDirected","base":"Build_UpDirected","kind":"constr","short":{"text":"Builds an up-directed type from a preorder, an element, and common upper bounds","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.DownDirected","base":"DownDirected","kind":"def","start":120,"body":null,"status":"ok","short":{"text":"A preorder that is inhabited and in which any two elements have a common lower bound","status":"ok"},"long":{"text":"Downward directedness is upward directedness ([[AffineConstructive.interfaces.orders.UpDirected]]) of the opposite order. [[AffineConstructive.interfaces.orders.down_directed]] and [[AffineConstructive.interfaces.orders.down_directed_inhabited]] restate its fields at the direct order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.down_directed_inhabited","base":"down_directed_inhabited","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"A downward directed type is inhabited","status":"ok"},"long":{"text":"The inhabitation field of [[AffineConstructive.interfaces.orders.DownDirected]], obtained from the opposite order. It is registered as a coercion, so a downward directed type yields an element through resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.down_directed","base":"down_directed","kind":"def","start":123,"body":null,"status":"ok","short":{"text":"In a downward directed type, any two elements have a common lower bound","status":"ok"},"long":{"text":"The directedness field of [[AffineConstructive.interfaces.orders.DownDirected]] at the direct order: for all x and y there is z with z ≤ x tensor z ≤ y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.MeetSemiLatticeOrder","base":"MeetSemiLatticeOrder","kind":"rec","start":124,"body":null,"status":"ok","short":{"text":"The meet of a weak poset is a greatest lower bound","status":"ok"},"long":{"text":"Given a weak poset L with a binary operation ⊓, this says that x ⊓ y is a lower bound of x and of y, and that z ≤ x tensor z ≤ y implies z ≤ x ⊓ y. The universal property uses the tensor because both comparisons are consumed together. Its contrapositive says that z ≰ x ⊓ y implies z ≰ x par z ≰ y.\n\nThe order and the meet are given separately, and the structure states that they agree. The algebraic description of semilattices lives elsewhere. The join version, [[AffineConstructive.interfaces.orders.JoinSemiLatticeOrder]], is this structure on the opposite order.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.meet_sl_poset","base":"meet_sl_poset","kind":"proj","short":{"text":"The underlying weak poset of a meet semilattice order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.meet_lb_l","base":"meet_lb_l","kind":"proj","short":{"text":"The meet is below its left argument: x ⊓ y ≤ x","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.meet_lb_r","base":"meet_lb_r","kind":"proj","short":{"text":"The meet is below its right argument: x ⊓ y ≤ y","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.meet_glb","base":"meet_glb","kind":"proj","short":{"text":"The meet is the greatest lower bound: z ≤ x tensor z ≤ y implies z ≤ x ⊓ y","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_MeetSemiLatticeOrder","base":"Build_MeetSemiLatticeOrder","kind":"constr","short":{"text":"Builds a meet semilattice order from a weak poset and the bound properties of ⊓","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.JoinSemiLatticeOrder","base":"JoinSemiLatticeOrder","kind":"def","start":129,"body":null,"status":"ok","short":{"text":"The join of a weak poset is a least upper bound","status":"ok"},"long":{"text":"A join semilattice order is a [[AffineConstructive.interfaces.orders.MeetSemiLatticeOrder]] on the opposite order, with the join playing the role of the meet. Every result about meets therefore transfers to joins by instantiation. [[AffineConstructive.interfaces.orders.join_ub_l]], [[AffineConstructive.interfaces.orders.join_ub_r]] and [[AffineConstructive.interfaces.orders.join_lub]] restate the fields at the direct order: x ≤ x ⊔ y, y ≤ x ⊔ y, and x ≤ z tensor y ≤ z implies x ⊔ y ≤ z.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.join_ub_l","base":"join_ub_l","kind":"def","start":131,"body":null,"status":"ok","short":{"text":"In a join semilattice order, x lies below x ⊔ y","status":"ok"},"long":{"text":"The left upper-bound law of a join semilattice order, x ≤ x ⊔ y. Since [[AffineConstructive.interfaces.orders.JoinSemiLatticeOrder]] is a meet semilattice order on the opposite order, this is [[AffineConstructive.interfaces.orders.meet_lb_l]] read at the opposite order, restated here at the direct order so that it can be used without unfolding the duality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.join_ub_r","base":"join_ub_r","kind":"def","start":132,"body":null,"status":"ok","short":{"text":"In a join semilattice order, y lies below x ⊔ y","status":"ok"},"long":{"text":"The right upper-bound law of a join semilattice order, y ≤ x ⊔ y. It is [[AffineConstructive.interfaces.orders.meet_lb_r]] at the opposite order, restated at the direct order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.join_lub","base":"join_lub","kind":"def","start":133,"body":null,"status":"ok","short":{"text":"In a join semilattice order, x ≤ z tensor y ≤ z implies x ⊔ y ≤ z","status":"ok"},"long":{"text":"The least-upper-bound law of a join semilattice order: if x ≤ z and y ≤ z, then x ⊔ y ≤ z. It is [[AffineConstructive.interfaces.orders.meet_glb]] at the opposite order, restated at the direct order.\n\nThe hypotheses are joined by the tensor, as in [[AffineConstructive.interfaces.orders.meet_glb]]. The contrapositive carried by the implication reads: if x ⊔ y is not below z, then x is not below z par y is not below z, which is the constructive content of the law in the apartness reading.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.LatticeOrder","base":"LatticeOrder","kind":"rec","start":134,"body":null,"status":"ok","short":{"text":"A lattice order: a meet semilattice order and a join semilattice order on the same order","status":"ok"},"long":{"text":"A lattice order on L, with an order, a meet and a join, is the conjunction of [[AffineConstructive.interfaces.orders.MeetSemiLatticeOrder]] and [[AffineConstructive.interfaces.orders.JoinSemiLatticeOrder]]: the meet is a greatest lower bound and the join a least upper bound for the same order. The order-theoretic characterisation is kept separate from the algebraic one (lattices as structures with absorptive operations), which lives elsewhere in the development; this record is the order-side description.\n\nSince the join half is the meet half at the opposite order, a lattice order is self-dual: the opposite of a lattice order is again one, with meet and join exchanged.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.lattice_order_meet","base":"lattice_order_meet","kind":"proj","short":{"text":"The meet semilattice order of a lattice order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.lattice_order_join","base":"lattice_order_join","kind":"proj","short":{"text":"The join semilattice order of a lattice order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_LatticeOrder","base":"Build_LatticeOrder","kind":"constr","short":{"text":"Builds a lattice order from a meet semilattice order and a join semilattice order","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.BoundedMeetSemiLatticeOrder","base":"BoundedMeetSemiLatticeOrder","kind":"rec","start":136,"body":null,"status":"ok","short":{"text":"A meet semilattice order with a top element ⊤ above every element","status":"ok"},"long":{"text":"A bounded meet semilattice order is a [[AffineConstructive.interfaces.orders.MeetSemiLatticeOrder]] together with a top element ⊤ satisfying x ≤ ⊤ for every x. The top is the meet of the empty family, so the structure has all finite meets.\n\nThe dual notion, [[AffineConstructive.interfaces.orders.BoundedJoinSemiLatticeOrder]], is defined as this one at the opposite order, where the top becomes the bottom.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.bounded_meet_sl_order_meet","base":"bounded_meet_sl_order_meet","kind":"proj","short":{"text":"The meet semilattice order underlying a bounded meet semilattice order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.below_top","base":"below_top","kind":"proj","short":{"text":"Every element lies below the top ⊤","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_BoundedMeetSemiLatticeOrder","base":"Build_BoundedMeetSemiLatticeOrder","kind":"constr","short":{"text":"Builds a bounded meet semilattice order from a meet semilattice order and the law x ≤ ⊤","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.BoundedJoinSemiLatticeOrder","base":"BoundedJoinSemiLatticeOrder","kind":"def","start":139,"body":null,"status":"ok","short":{"text":"A join semilattice order with a bottom element ⊥, as a bounded meet semilattice order on the opposite","status":"ok"},"long":{"text":"A bounded join semilattice order is a join semilattice order with a bottom element ⊥ below every element. It is defined as a [[AffineConstructive.interfaces.orders.BoundedMeetSemiLatticeOrder]] on the opposite order, in which joins become meets and the bottom becomes the top; every theorem about bounded meet semilattice orders thereby yields its dual. The law at the direct order is restated as [[AffineConstructive.interfaces.orders.above_bottom]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.above_bottom","base":"above_bottom","kind":"def","start":141,"body":null,"status":"ok","short":{"text":"In a bounded join semilattice order, ⊥ lies below every element","status":"ok"},"long":{"text":"The bottom law ⊥ ≤ x of a bounded join semilattice order: [[AffineConstructive.interfaces.orders.below_top]] at the opposite order, restated at the direct order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.BoundedLatticeOrder","base":"BoundedLatticeOrder","kind":"rec","start":142,"body":null,"status":"ok","short":{"text":"A lattice order with top and bottom: bounded meet and bounded join semilattice orders together","status":"ok"},"long":{"text":"A bounded lattice order on L is a [[AffineConstructive.interfaces.orders.BoundedMeetSemiLatticeOrder]] and a [[AffineConstructive.interfaces.orders.BoundedJoinSemiLatticeOrder]] for the same order: meets are greatest lower bounds, joins least upper bounds, ⊤ is above and ⊥ below every element. Like [[AffineConstructive.interfaces.orders.LatticeOrder]], it is self-dual, the opposite order exchanging the two halves.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.bounded_lattice_order_meet","base":"bounded_lattice_order_meet","kind":"proj","short":{"text":"The bounded meet semilattice order of a bounded lattice order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.bounded_lattice_order_join","base":"bounded_lattice_order_join","kind":"proj","short":{"text":"The bounded join semilattice order of a bounded lattice order","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_BoundedLatticeOrder","base":"Build_BoundedLatticeOrder","kind":"constr","short":{"text":"Builds a bounded lattice order from bounded meet and bounded join semilattice orders","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.UpSet","base":"UpSet","kind":"def","start":148,"body":null,"status":"ok","short":{"text":"A subset of an ordered set is an up-set: membership is preserved upward along ≤","status":"ok"},"long":{"text":"A subset U of an ordered set X is an up-set when membership is upward closed: x ≤ y implies that x ∊ U implies y ∊ U. The definition regards U as a function X ⇾ Ω and asks it to be [[AffineConstructive.interfaces.orders.OrderPreserving]], with the affine propositions ordered by affine implication. Upward closure is then a special case of monotonicity, and what is proved about order-preserving maps applies to up-sets directly.\n\nSince the implications are affine, the condition carries its contrapositive along with it: the closure law constrains the refutations of membership as well as its proofs, in the opposite direction. The law itself is restated as [[AffineConstructive.interfaces.orders.up_closed]], and the dual notion, closure downward, is [[AffineConstructive.interfaces.orders.DownSet]], defined as an up-set for the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.up_closed","base":"up_closed","kind":"def","start":150,"body":null,"status":"ok","short":{"text":"An up-set is upward closed: x ≤ y implies that x ∊ U implies y ∊ U","status":"ok"},"long":{"text":"The defining law of an [[AffineConstructive.interfaces.orders.UpSet]]: x ≤ y implies (x ∊ U implies y ∊ U). It is [[AffineConstructive.interfaces.orders.order_preserving]] for the membership predicate of U, read at the order of Ω by implication.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.DownSet","base":"DownSet","kind":"def","start":152,"body":null,"status":"ok","short":{"text":"U is a down-set: an up-set for the opposite order","status":"ok"},"long":{"text":"A subset U is a down-set when membership is downward closed: x ≤ y implies that y ∊ U implies x ∊ U. It is defined as an [[AffineConstructive.interfaces.orders.UpSet]] for the opposite order, so that the theory of down-sets is obtained from that of up-sets by duality. The law at the direct order is [[AffineConstructive.interfaces.orders.down_closed]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.down_closed","base":"down_closed","kind":"def","start":154,"body":null,"status":"ok","short":{"text":"A down-set is downward closed: x ≤ y implies that y ∊ U implies x ∊ U","status":"ok"},"long":{"text":"The defining law of a [[AffineConstructive.interfaces.orders.DownSet]] at the direct order: x ≤ y implies (y ∊ U implies x ∊ U). It is [[AffineConstructive.interfaces.orders.up_closed]] at the opposite order with the two points exchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.LeastUpSet","base":"LeastUpSet","kind":"rec","start":155,"body":null,"status":"ok","short":{"text":"Membership in U is equivalent to lying above some element of U","status":"ok"},"long":{"text":"A subset U of a weak poset is a least up-set when x ∊ U if and only if there is an element a of U with a ≤ x. The condition says that U coincides with its own upward closure, as an affine iff: the backward direction is upward closure, and the forward direction, trivial in its positive reading by reflexivity, contributes through its contrapositive that refuting membership of x amounts to x lying above no element of U. So the refutation side of membership in U is determined by the order, which is the sense in which U is the least up-set generated by its own elements.\n\nThe quantifier is the affine existential over the elements of U taken as a set, so the witness comes with its membership. The dual notion is [[AffineConstructive.interfaces.orders.LeastDownSet]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.LeastUpSet_WeakPoset","base":"LeastUpSet_WeakPoset","kind":"proj","short":{"text":"The weak poset structure on the ambient set of a least up-set","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.least_upset","base":"least_upset","kind":"proj","short":{"text":"x ∊ U if and only if there is an element of U below x","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_LeastUpSet","base":"Build_LeastUpSet","kind":"constr","short":{"text":"Builds a least up-set from a weak poset and the membership characterisation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.LeastDownSet","base":"LeastDownSet","kind":"def","start":158,"body":null,"status":"ok","short":{"text":"Membership in U is equivalent to lying below some element of U; the dual of a least up-set","status":"ok"},"long":{"text":"A least down-set is a [[AffineConstructive.interfaces.orders.LeastUpSet]] for the opposite order: x ∊ U if and only if there is an element a of U with x ≤ a. The characterisation at the direct order is [[AffineConstructive.interfaces.orders.least_downset]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.least_downset","base":"least_downset","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"In a least down-set, x ∊ U if and only if there is an element of U above x","status":"ok"},"long":{"text":"The membership characterisation of a [[AffineConstructive.interfaces.orders.LeastDownSet]] at the direct order: x ∊ U if and only if x ≤ a for some element a of U. It is [[AffineConstructive.interfaces.orders.least_upset]] at the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.UpDirectedSubset","base":"UpDirectedSubset","kind":"rec","start":164,"body":null,"status":"ok","short":{"text":"U is inhabited and any two of its elements have a common upper bound in U","status":"ok"},"long":{"text":"A subset U of a preordered set is up-directed when there is an x with x ∊ U, and when x ∊ U tensor y ∊ U implies that there is z with z ∊ U, x ≤ z and y ≤ z. Unlike [[AffineConstructive.interfaces.orders.UpDirected]], which speaks of the subset as a set in its own right, this formulation quantifies over the whole of X and keeps membership as an affine proposition, so the affine content of membership (in particular its refutation side) is part of the statement: the contrapositive of the directedness law says that if every common upper bound is refuted to lie in U, then x or y is refuted to lie in U, in the par sense.\n\nThe two memberships are combined by the tensor, the multiplicative conjunction, as befits a hypothesis whose two parts are both used once. The dual notion is [[AffineConstructive.interfaces.orders.DownDirectedSubset]], and filters are built from it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.UpDirectedSubset_preorder","base":"UpDirectedSubset_preorder","kind":"proj","short":{"text":"The preorder on the ambient set of an up-directed subset","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.up_directed_subset_inhabited","base":"up_directed_subset_inhabited","kind":"proj","short":{"text":"An up-directed subset has an element","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.up_directed_subset","base":"up_directed_subset","kind":"proj","short":{"text":"Two elements of an up-directed subset have a common upper bound in it","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_UpDirectedSubset","base":"Build_UpDirectedSubset","kind":"constr","short":{"text":"Builds an up-directed subset from a preorder, an element, and the directedness law","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.DownDirectedSubset","base":"DownDirectedSubset","kind":"def","start":168,"body":null,"status":"ok","short":{"text":"U is inhabited and any two of its elements have a common lower bound in U","status":"ok"},"long":{"text":"A down-directed subset is an [[AffineConstructive.interfaces.orders.UpDirectedSubset]] for the opposite order: U has an element, and x ∊ U tensor y ∊ U implies that there is z ∊ U below both. The laws at the direct order are [[AffineConstructive.interfaces.orders.down_directed_subset_inhabited]] and [[AffineConstructive.interfaces.orders.down_directed_subset]]. Together with upward closure it makes a [[AffineConstructive.interfaces.orders.Filter]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.down_directed_subset_inhabited","base":"down_directed_subset_inhabited","kind":"def","start":170,"body":null,"status":"ok","short":{"text":"A down-directed subset has an element","status":"ok"},"long":{"text":"The inhabitation law of a [[AffineConstructive.interfaces.orders.DownDirectedSubset]], restated from [[AffineConstructive.interfaces.orders.up_directed_subset_inhabited]] at the opposite order: there is x with x ∊ U.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.down_directed_subset","base":"down_directed_subset","kind":"def","start":171,"body":null,"status":"ok","short":{"text":"Two elements of a down-directed subset have a common lower bound in it","status":"ok"},"long":{"text":"The directedness law of a [[AffineConstructive.interfaces.orders.DownDirectedSubset]] at the direct order: x ∊ U tensor y ∊ U implies that there is z with z ∊ U, z ≤ x and z ≤ y. It is [[AffineConstructive.interfaces.orders.up_directed_subset]] at the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.Filter","base":"Filter","kind":"rec","start":172,"body":null,"status":"ok","short":{"text":"A filter on an ordered set: an inhabited, upward closed subset in which any two members have a common lower bound","status":"ok"},"long":{"text":"A filter on an ordered set X is a subset U that is an [[AffineConstructive.interfaces.orders.UpSet]] and a [[AffineConstructive.interfaces.orders.DownDirectedSubset]]: it is upward closed, there is an element of U, and for x and y, x ∊ U ⊠ y ∊ U implies that there is z ∊ U below both. The two memberships are joined by the tensor, each used once to produce the common lower bound. In a meet semilattice the directedness condition amounts to closure under binary meets, but the directed form makes sense over any preorder; in the development filters are used mostly on (𝒫 X, ⊆), where they are filters of subsets in the traditional sense.\n\nMembership in U stays an affine proposition throughout, so the conditions constrain refutations of membership as well as proofs. The dual notion, an [[AffineConstructive.interfaces.orders.Ideal]], is a filter for the opposite order.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.Filter_UpSet","base":"Filter_UpSet","kind":"proj","short":{"text":"A filter is an up-set","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Filter_directed","base":"Filter_directed","kind":"proj","short":{"text":"A filter is an inhabited, downward directed subset","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_Filter","base":"Build_Filter","kind":"constr","short":{"text":"Builds a filter from an up-set that is inhabited and downward directed","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.Ideal","base":"Ideal","kind":"def","start":174,"body":null,"status":"ok","short":{"text":"An ideal: a down-set that is inhabited and up-directed; a filter for the opposite order","status":"ok"},"long":{"text":"An ideal on an ordered set is a [[AffineConstructive.interfaces.orders.Filter]] for the opposite order: a subset that is downward closed, has an element, and in which any two elements have a common upper bound. Bornologies, for instance, are ideals of subsets. The components at the direct order are [[AffineConstructive.interfaces.orders.Ideal_DownSet]] and [[AffineConstructive.interfaces.orders.Ideal_directed]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.Ideal_DownSet","base":"Ideal_DownSet","kind":"def","start":176,"body":null,"status":"ok","short":{"text":"An ideal is a down-set","status":"ok"},"long":{"text":"The upward-closure component of an ideal, seen at the direct order: an [[AffineConstructive.interfaces.orders.Ideal]] is a [[AffineConstructive.interfaces.orders.DownSet]]. It is [[AffineConstructive.interfaces.orders.Filter_UpSet]] at the opposite order, declared as a coercion so that an ideal can be used wherever a down-set is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.Ideal_directed","base":"Ideal_directed","kind":"def","start":177,"body":null,"status":"ok","short":{"text":"An ideal is an inhabited up-directed subset","status":"ok"},"long":{"text":"The directedness component of an ideal, seen at the direct order: an [[AffineConstructive.interfaces.orders.Ideal]] is an [[AffineConstructive.interfaces.orders.UpDirectedSubset]]. It is [[AffineConstructive.interfaces.orders.Filter_directed]] at the opposite order, declared as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.orders.FilterPresentation","base":"FilterPresentation","kind":"rec","start":178,"body":null,"status":"ok","short":{"text":"β presents U: x ∊ U if and only if some β i lies below x","status":"ok"},"long":{"text":"A family β indexed by Λ presents the subset U of a weak poset when, for every x, x ∊ U if and only if there is an index i with β i ≤ x. U is thus the upward closure of the image of β. Because the equivalence is affine, it fixes the refutation of membership as well: x is outside U exactly when no β i lies below x. The index is an ordinary type without an equality, so the existential ranges over bare indices.\n\nEvery family presents a subset: the filter presented by β is presented by β ([[AffineConstructive.orders.filters.presented_filter_correct]]). The presented subset is a filter when β is order-preserving on a down-directed index ([[AffineConstructive.orders.filters.presented_filter_filter]]), and its generators form a filter basis of it ([[AffineConstructive.orders.filters.filter_presentation_basis_correct]]). The concrete structure built on it is the uniformity: [[AffineConstructive.topology.interfaces.uniform.UniformityPresentation]] says that a family of relations presents the filter of entourages. The dual notion, a subset generated downward, is [[AffineConstructive.interfaces.orders.IdealPresentation]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.filter_presentation_poset","base":"filter_presentation_poset","kind":"proj","short":{"text":"The weak poset structure on X carried by a filter presentation","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.filter_presentation","base":"filter_presentation","kind":"proj","short":{"text":"For a presentation β of U, x ∊ U if and only if some β i lies below x","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.Build_FilterPresentation","base":"Build_FilterPresentation","kind":"constr","short":{"text":"Builds a filter presentation of U by β from a weak poset and the membership equivalence","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.FilterBasis","base":"FilterBasis","kind":"ind","start":181,"body":null,"status":"ok","short":{"text":"The family β is coinitial: every element lies above some β i","status":"ok"},"long":{"text":"A family β indexed by Λ is a filter basis of the ordered set X when every x has an index i with β i ≤ x: the family is coinitial, so that X itself, viewed as the filter of all its elements, is presented by β. It is the form a base takes when the filter in question is a whole set, for instance when entourages or a filter are packaged as a set ordered by inclusion and one wants a smaller family that reaches below each of them. The dual notion is [[AffineConstructive.interfaces.orders.IdealBasis]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.orders.FilterBasis","base":"FilterBasis","kind":"rec","short":{"text":"The class asserting that a family is coinitial in an ordered set","status":"ok"}},{"name":"AffineConstructive.interfaces.orders.filter_basis","base":"filter_basis","kind":"proj","short":{"text":"Every element lies above some member β i of a filter basis","status":"ok"}}]},{"name":"AffineConstructive.interfaces.orders.IdealPresentation","base":"IdealPresentation","kind":"def","start":183,"body":null,"status":"ok","short":{"text":"U is generated downward by β: x ∊ U if and only if x lies below some β i","status":"ok"},"long":{"text

projection_notation.\n\n(** Lifting of operations on sets to functions into the sets. *)\n\n(** The lift of an arity 1 function is just post-composition. *)\nDefinition pointwise_func@{u} {X Y:set@{u}} (f:X ⇾ Y) (D:set@{u}) : (D ⇾ X) ⇾ (D ⇾ Y) := (f ∘).\n\n(** The lift of an arity 2 function cannot be defined in general.\n  It is possible whenever the operation is strong, and also whenever\n  the domain has affirmative equality. *)\n\nDefinition PointwiseOp@{u} {X Y Z:set@{u}} (f:X ⊗ Y ⇾ Z) (D:set@{u}) :=\n  @IsFun ((D ⇾ X) ⊗ (D ⇾ Y) ⊗ D) Z (λ p, f (π₁ (π₁ p) (π₂ p), π₂ (π₁ p) (π₂ p))).\nExisting Class PointwiseOp.\n\nDefinition pointwise_op@{u} {X Y Z:set@{u}} (f:X ⊗ Y ⇾ Z) (D:set@{u}) {H:PointwiseOp f D}\n  := curry (@func_make _ _ _ H).\n\nLemma StrongOp_PointWiseOp@{u} {X Y Z D:set@{u}} {f:X ⊗ Y ⇾ Z} `{!StrongOp f} : PointwiseOp f D.\nProof. apply (uncurry set:(λ '(g,h) : (D ⇾ X) ⊗ (D ⇾ Y), λ x:D, f (g x, h x))). Qed.\n\nLemma AffEq_PointWiseOp@{u} {X Y Z D:set@{u}} {f:X ⊗ Y ⇾ Z} `{!AffirmativeEquality D} : PointwiseOp f D.\nProof. apply (uncurry set:( (λ '(g, h) : (D ⇾ X) ⊗ (D ⇾ Y), λ x:D, f (g x, h x)) )). Qed.\n\nGlobal Hint Extern 10 (PointwiseOp _ _) => simple notypeclasses refine StrongOp_PointWiseOp : typeclass_instances.\nGlobal Hint Extern 11 (PointwiseOp _ _) => simple notypeclasses refine AffEq_PointWiseOp : typeclass_instances.\n\n","sentences":[{"i":0,"s":0,"e":43,"kind":"vernac","status":"ok","ms":30,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":44,"e":70,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":2,"s":72,"e":99,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":3,"s":101,"e":327,"kind":"vernac","status":"ok","ms":12,"messages":["6891d7638e008efd"],"goals":null},{"i":4,"s":329,"e":660,"kind":"vernac","status":"ok","ms":20,"messages":["810624a8bb7db9ba"],"goals":null},{"i":5,"s":661,"e":688,"kind":"vernac","status": ","page":"notation.html"},{"s":676,"e":687,"lib":"AffineConstructive.interfaces.pointwise","name":"PointwiseOp","kind":"def","local":true},{"s":725,"e":728,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":751,"e":754,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":763,"e":774,"lib":"AffineConstructive.interfaces.pointwise","name":"PointwiseOp","kind":"class","local":true},{"s":785,"e":790,"lib":"AffineConstructive.theory.set","name":"curry","kind":"def","local":false,"page":"../theory/set.html"},{"s":793,"e":802,"lib":"AffineConstructive.interfaces.set","name":"func_make","kind":"constr","local":false,"page":"set.html"},{"s":854,"e":857,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":880,"e":888,"lib":"AffineConstructive.interfaces.set","name":"StrongOp","kind":"class","local":false,"page":"set.html"},{"s":894,"e":905,"lib":"AffineConstructive.interfaces.pointwise","name":"PointwiseOp","kind":"class","local":true},{"s":925,"e":932,"lib":"AffineConstructive.theory.set","name":"uncurry","kind":"def","local":false,"page":"../theory/set.html"},{"s":1034,"e":1037,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"set.html"},{"s":1060,"e":1079,"lib":"AffineConstructive.interfaces.set","name":"AffirmativeEquality","kind":"class","local":false,"page":"set.html"},{"s":1085,"e":1096,"lib":"AffineConstructive.interfaces.pointwise","name":"PointwiseOp","kind":"class","local":true},{"s":1116,"e":1123,"lib":"AffineConstructive.theory.set","name":"uncurry","kind":"def","local":false,"page":"../theory/set.html"},{"s":1216,"e":1227,"lib":"AffineConstructive.interfaces.pointwise","name":"PointwiseOp","kind":"class","local":true},{"s":1264,"e":1284,"lib":"AffineConstructive.interfaces.pointwise","name":"StrongOp_PointWiseOp","kind":"thm","local":true},{"s":1331,"e":1342,"lib":"AffineConstructive.interfaces.pointwise","name":"PointwiseOp","kind":"class","local":true},{"s":1379,"e":1396,"lib":"AffineConstructive.interfaces.pointwise","name":"AffEq_PointWiseOp","kind":"thm","local":true}],"gloss":{"summary":"The file lifts operations on affine sets to the functions into them. A unary function f : X ⇾ Y lifts by post-composition ([[AffineConstructive.interfaces.pointwise.pointwise_func]]) with no further hypothesis. A binary operation f : X ⊗ Y ⇾ Z does not lift in general, because the point d at which g and h are evaluated is needed by both arguments of f while the equality d = d' may be used only once; the class [[AffineConstructive.interfaces.pointwise.PointwiseOp]] records that the lift exists, and [[AffineConstructive.interfaces.pointwise.pointwise_op]] then gives the function (g, h) ↦ (d ↦ f(g d, h d)). Two sufficient conditions are proved: f is strong, so that it preserves the cartesian equality and the two argument equalities can be proved additively ([[AffineConstructive.interfaces.pointwise.StrongOp_PointWiseOp]]), or D has affirmative equality, so that d = d' may be duplicated ([[AffineConstructive.interfaces.pointwise.AffEq_PointWiseOp]]). Both are registered for resolution, with the strong case tried first.","short":"Pointwise lifting of operations to function sets, for strong operations or affirmative domains","items":[{"name":"AffineConstructive.interfaces.pointwise.pointwise_func","base":"pointwise_func","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"The pointwise lift of a function f : X ⇾ Y to functions D ⇾ X, by post-composition with f","status":"ok"},"long":{"text":"For a function f : X ⇾ Y and a set D, `pointwise_func f D` is the function (D ⇾ X) ⇾ (D ⇾ Y) sending g to f ∘ g, so that the lifted map acts as f at each point of D. It is defined as the section (f ∘) of composition, which is already a function of sets: equal g and g' give equal f ∘ g and f ∘ g', because f preserves equality pointwise.\n\nThis is the unary case of lifting an operation on a set to the function space into it. Unlike the binary case ([[AffineConstructive.interfaces.pointwise.PointwiseOp]], [[AffineConstructive.interfaces.pointwise.pointwise_op]]), it needs no hypothesis on f or on D, because each argument of the lifted map is used once.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.pointwise.PointwiseOp","base":"PointwiseOp","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"The assertion that (g, h, d) ↦ f(g d, h d) preserves equality, so that f lifts pointwise over D","status":"ok"},"long":{"text":"For a binary operation f : X ⊗ Y ⇾ Z and a set D, `PointwiseOp f D` states that the map from (D ⇾ X) ⊗ (D ⇾ Y) ⊗ D to Z sending (g, h, d) to f(g d, h d) is a function of sets, that is, it preserves equality ([[AffineConstructive.interfaces.set.IsFun]]). It is a class, so that the lift [[AffineConstructive.interfaces.pointwise.pointwise_op]] can find it by resolution.\n\nThe statement can fail in general, which is why it is a hypothesis rather than a construction. The equality of the domain is multiplicative: from g = g', h = h' and d = d' tensored together one must reach f(g d, h d) = f(g' d', h' d'). The point d occurs in both arguments of f, while the hypothesis d = d' may be used only once, so in affine logic the two evaluations cannot both draw on it. Two ways around this are proved in the file: if f is strong ([[AffineConstructive.interfaces.pointwise.StrongOp_PointWiseOp]]) it suffices to prove the two argument equalities additively, each with its own use of d = d'; and if D has affirmative equality ([[AffineConstructive.interfaces.pointwise.AffEq_PointWiseOp]]) the hypothesis d = d' may be duplicated.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.pointwise.pointwise_op","base":"pointwise_op","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"The pointwise lift of a binary operation f : X ⊗ Y ⇾ Z to a function (D ⇾ X) ⊗ (D ⇾ Y) ⇾ (D ⇾ Z)","status":"ok"},"long":{"text":"Given a binary operation f : X ⊗ Y ⇾ Z and a proof of [[AffineConstructive.interfaces.pointwise.PointwiseOp]] f D, `pointwise_op f D` sends a pair (g, h) of functions on D to the function d ↦ f(g d, h d). It is obtained by packaging the map of [[AffineConstructive.interfaces.pointwise.PointwiseOp]] as a function of sets with [[AffineConstructive.interfaces.set.func_make]] and currying it in its last argument, d.\n\nThis is how operations on a set (an addition, a meet, a multiplication) become operations on the functions into it. The hypothesis is found by resolution, from a [[AffineConstructive.interfaces.set.StrongOp]] instance on f when there is one and otherwise from [[AffineConstructive.interfaces.set.AffirmativeEquality]] on D.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.pointwise.StrongOp_PointWiseOp","base":"StrongOp_PointWiseOp","kind":"prf","start":7,"body":[8,10],"status":"ok","short":{"text":"A strong binary operation lifts pointwise over any domain D","status":"ok"},"proof":[{"text":"The lift is given outright: the function (g, h) ↦ (x ↦ f(g x, h x)), built as a morphism out of the tensor product (D ⇾ X) ⊗ (D ⇾ Y) by uncurrying. The remaining obligation is that each x ↦ f(g x, h x) preserves equality. This is discharged automatically. Because f is strong, it preserves the cartesian equality. The single equality d = d' therefore only has to prove g d = g d' and h d = h d' additively, as a choice of one conjunct each time, and is never used twice.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.interfaces.pointwise.AffEq_PointWiseOp","base":"AffEq_PointWiseOp","kind":"prf","start":11,"body":[12,14],"status":"ok","short":{"text":"Any binary operation lifts pointwise over a domain D with affirmative equality","status":"ok"},"proof":[{"text":"The same function (g, h) ↦ (x ↦ f(g x, h x)) is given, built by uncurrying out of (D ⇾ X) ⊗ (D ⇾ Y). This time f preserves only the tensor equality, so showing that x ↦ f(g x, h x) preserves equality needs d = d' twice: once for g and once for h. That is allowed because D has affirmative equality, so d = d' can be used freely, and the obligation is again discharged automatically.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.abstract_algebra":{"page":"abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.set_lambda":{"page":"set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

d":"proj","local":true},{"s":2117,"e":2122,"lib":"AffineConstructive.interfaces.prelude","name":"spair","kind":"constr","local":true},{"s":2170,"e":2175,"lib":"AffineConstructive.interfaces.prelude","name":"tprod","kind":"rec","local":true},{"s":2194,"e":2198,"lib":"AffineConstructive.interfaces.prelude","name":"pair","kind":"constr","local":true},{"s":2274,"e":2279,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":true},{"s":2264,"e":2269,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":true},{"s":2487,"e":2495,"lib":"AffineConstructive.interfaces.prelude","name":"eval_red","kind":"abbrev","local":true},{"s":2497,"e":2505,"lib":"AffineConstructive.interfaces.prelude","name":"tuncurry","kind":"def","local":true},{"s":2562,"e":2575,"lib":"AffineConstructive.interfaces.prelude","name":"eval_tuncurry","kind":"abbrev","local":true},{"s":2577,"e":2590,"lib":"AffineConstructive.interfaces.prelude","name":"eval_tuncurry","kind":"abbrev","local":true}],"gloss":{"summary":"This file stands in for Rocq's standard library. It declares the type and function scopes and loads the Ltac, number-notation and firstorder plugins. It also turns on the global settings the rest of the development relies on: primitive projections, universe polymorphism with cumulative inductives, and keyed unification. It sets up the `core` and `typeclass_instances` hint databases. It then defines the basic types from scratch: the empty type with [[AffineConstructive.interfaces.prelude.abort]] and [[AffineConstructive.interfaces.prelude.dep_abort]], [[AffineConstructive.interfaces.prelude.unit]] (which also serves as a trivially satisfied class), [[AffineConstructive.interfaces.prelude.bool]], the product [[AffineConstructive.interfaces.prelude.tprod]], the dependent sum [[AffineConstructive.interfaces.prelude.tsig]], the disjoint union [[AffineConstructive.interfaces.prelude.tsum]], and [[AffineConstructive.interfaces.prelude.ssig]], whose elements are points paired with a proof-irrelevant property. Last come the identity function, currying and uncurrying, and a few notations that build terms by running a tactic.","short":"The prelude: global settings, basic types and term-building notations replacing the standard library","items":[{"name":"AffineConstructive.interfaces.prelude.id","base":"id","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"The identity function on a type of any sort","status":"ok"},"long":{"text":"The identity function, returning its argument unchanged. It is polymorphic in the sort as well as the universe, so the one definition serves types in `Type`, `Prop` and `SProp` alike. The development has no standard library, so even this has to be defined here.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.empty","base":"empty","kind":"ind","start":23,"body":null,"status":"ok","short":{"text":"The empty type, with no elements","status":"ok"},"long":{"text":"The empty inductive type, with no constructors. It stands in for falsity at the level of types. Elimination from it into any sort is available through [[AffineConstructive.interfaces.prelude.abort]] and [[AffineConstructive.interfaces.prelude.dep_abort]], and through the generated recursion schemes.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.prelude.empty_rect","base":"empty_rect","kind":"scheme","short":{"text":"Dependent elimination from the empty type into any type family","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.empty_ind","base":"empty_ind","kind":"scheme","short":{"text":"Dependent elimination from the empty type into a family of propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.empty_rec","base":"empty_rec","kind":"scheme","short":{"text":"Dependent elimination from the empty type into a family of sets","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.empty_sind","base":"empty_sind","kind":"scheme","short":{"text":"Dependent elimination from the empty type into a family of strict propositions","status":"ok"}}]},{"name":"AffineConstructive.interfaces.prelude.abort","base":"abort","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"From an element of the empty type, an element of any type","status":"ok"},"long":{"text":"Ex falso at the level of types: an element of [[AffineConstructive.interfaces.prelude.empty]] yields an element of any type A, of any sort, by an empty case analysis. It is the non-dependent form of [[AffineConstructive.interfaces.prelude.dep_abort]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.dep_abort","base":"dep_abort","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"From an element of the empty type, an element of any family over the empty type","status":"ok"},"long":{"text":"This is the dependent form of [[AffineConstructive.interfaces.prelude.abort]]. Take any family P indexed by [[AffineConstructive.interfaces.prelude.empty]], with values in any sort. Then an element x of the empty type gives an element of P x. It is the elimination principle of the empty type, with the target allowed to depend on the impossible element.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.unit","base":"unit","kind":"ind","start":26,"body":null,"status":"ok","short":{"text":"The unit type, with the single element tt, declared a typeclass","status":"ok"},"long":{"text":"The one-element inductive type, whose only element is [[AffineConstructive.interfaces.prelude.tt]]. It is declared a class, with a hint that resolves any goal of type unit by tt, so a unit argument can be left to instance resolution and always succeeds. [[AffineConstructive.interfaces.prelude.to_unit]] uses this to send anything to tt.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.prelude.unit_rect","base":"unit_rect","kind":"scheme","short":{"text":"Dependent elimination from the unit type into any type family","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.unit_ind","base":"unit_ind","kind":"scheme","short":{"text":"Dependent elimination from the unit type into a family of propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.unit_rec","base":"unit_rec","kind":"scheme","short":{"text":"Dependent elimination from the unit type into a family of sets","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.unit_sind","base":"unit_sind","kind":"scheme","short":{"text":"Dependent elimination from the unit type into a family of strict propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.tt","base":"tt","kind":"constr","short":{"text":"The unique element of the unit type","status":"ok"}}]},{"name":"AffineConstructive.interfaces.prelude.to_unit","base":"to_unit","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"The constant map from any type to the unit type","status":"ok"},"long":{"text":"The unique map from a type A to [[AffineConstructive.interfaces.prelude.unit]], sending every element to [[AffineConstructive.interfaces.prelude.tt]]. Its body is left to instance resolution, which finds tt through the hint declared with the unit class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.bool","base":"bool","kind":"ind","start":30,"body":null,"status":"ok","short":{"text":"The type of booleans, true and false","status":"ok"},"long":{"text":"The two-element inductive type of booleans, with constructors [[AffineConstructive.interfaces.prelude.true]] and [[AffineConstructive.interfaces.prelude.false]]. It is the type-level carrier of decisions, used for instance where a decidable proposition is computed by a boolean test.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.prelude.bool_rect","base":"bool_rect","kind":"scheme","short":{"text":"Dependent elimination from the booleans into any type family","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.bool_ind","base":"bool_ind","kind":"scheme","short":{"text":"Dependent elimination from the booleans into a family of propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.bool_rec","base":"bool_rec","kind":"scheme","short":{"text":"Dependent elimination from the booleans into a family of sets","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.bool_sind","base":"bool_sind","kind":"scheme","short":{"text":"Dependent elimination from the booleans into a family of strict propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.true","base":"true","kind":"constr","short":{"text":"The boolean true","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.false","base":"false","kind":"constr","short":{"text":"The boolean false","status":"ok"}}]},{"name":"AffineConstructive.interfaces.prelude.tprod","base":"tprod","kind":"rec","start":31,"body":null,"status":"ok","short":{"text":"The product of two types of the same sort, as a record of pairs","status":"ok"},"long":{"text":"The cartesian product of two types, as a record with primitive projections [[AffineConstructive.interfaces.prelude.proj1]] and [[AffineConstructive.interfaces.prelude.proj2]], so that a pair is definitionally equal to the pair of its projections. It is polymorphic in the sort, so the same record gives the product of types and the conjunction of strict propositions. This is the type-theoretic product, not the product of affine sets, which carries its own equality and is built later on top of it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.prelude.proj1","base":"proj1","kind":"proj","short":{"text":"The first component of a pair","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.proj2","base":"proj2","kind":"proj","short":{"text":"The second component of a pair","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.pair","base":"pair","kind":"constr","short":{"text":"Builds a pair from its two components","status":"ok"}}]},{"name":"AffineConstructive.interfaces.prelude.tsig","base":"tsig","kind":"ind","start":35,"body":null,"status":"ok","short":{"text":"The dependent sum of a family of types B over A","status":"ok"},"long":{"text":"The dependent sum, or Σ-type, of a family B over A: its elements are pairs of an a in A and an element of B a. It is an inductive type rather than a record, so its projections [[AffineConstructive.interfaces.prelude.tproj1]] and [[AffineConstructive.interfaces.prelude.tproj2]] are defined by case analysis. Where the second component is a strict proposition, the record [[AffineConstructive.interfaces.prelude.ssig]] is used instead.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.prelude.tsig_rect","base":"tsig_rect","kind":"scheme","short":{"text":"Dependent elimination from a dependent sum into any type family","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.tsig_ind","base":"tsig_ind","kind":"scheme","short":{"text":"Dependent elimination from a dependent sum into a family of propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.tsig_rec","base":"tsig_rec","kind":"scheme","short":{"text":"Dependent elimination from a dependent sum into a family of sets","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.tsig_sind","base":"tsig_sind","kind":"scheme","short":{"text":"Dependent elimination from a dependent sum into a family of strict propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.dpair","base":"dpair","kind":"constr","short":{"text":"Builds an element of a dependent sum from a point a and an element of B a","status":"ok"}}]},{"name":"AffineConstructive.interfaces.prelude.tproj1","base":"tproj1","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"The first component of an element of a dependent sum","status":"ok"},"long":{"text":"The first projection of the dependent sum [[AffineConstructive.interfaces.prelude.tsig]], defined by case analysis on the pair: the point a of A.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.tproj2","base":"tproj2","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"The second component of an element of a dependent sum, in B of its first","status":"ok"},"long":{"text":"The second projection of the dependent sum [[AffineConstructive.interfaces.prelude.tsig]]: the element of B a, where a is the first component given by [[AffineConstructive.interfaces.prelude.tproj1]]. Its type depends on the first projection of the same pair.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.tsum","base":"tsum","kind":"ind","start":39,"body":null,"status":"ok","short":{"text":"The disjoint union of two types, with injections inl and inr","status":"ok"},"long":{"text":"The disjoint union, or coproduct, of two types A and B, with the left injection [[AffineConstructive.interfaces.prelude.inl]] and the right injection [[AffineConstructive.interfaces.prelude.inr]]. A case analysis on an element of the sum separates the two cases.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.prelude.tsum_rect","base":"tsum_rect","kind":"scheme","short":{"text":"Dependent elimination from a disjoint union into any type family","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.tsum_ind","base":"tsum_ind","kind":"scheme","short":{"text":"Dependent elimination from a disjoint union into a family of propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.tsum_rec","base":"tsum_rec","kind":"scheme","short":{"text":"Dependent elimination from a disjoint union into a family of sets","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.tsum_sind","base":"tsum_sind","kind":"scheme","short":{"text":"Dependent elimination from a disjoint union into a family of strict propositions","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.inl","base":"inl","kind":"constr","short":{"text":"The left injection into a disjoint union","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.inr","base":"inr","kind":"constr","short":{"text":"The right injection into a disjoint union","status":"ok"}}]},{"name":"AffineConstructive.interfaces.prelude.ssig","base":"ssig","kind":"rec","start":42,"body":null,"status":"ok","short":{"text":"The subtype of A cut out by a predicate with values in strict propositions","status":"ok"},"long":{"text":"The subtype of the elements of A satisfying a predicate P with values in `SProp`: a point [[AffineConstructive.interfaces.prelude.pt]] together with a proof [[AffineConstructive.interfaces.prelude.pt_prop]] that it satisfies P. Since the proof lives in `SProp` it is irrelevant, so two elements with equal points are definitionally equal, and with primitive projections an element is the pair of its projections. This is the type-theoretic subtype on which carved-out sets of the development are built.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.prelude.pt","base":"pt","kind":"proj","short":{"text":"The underlying point of an element of a subtype","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.pt_prop","base":"pt_prop","kind":"proj","short":{"text":"The proof that the underlying point satisfies the predicate","status":"ok"}},{"name":"AffineConstructive.interfaces.prelude.spair","base":"spair","kind":"constr","short":{"text":"Builds an element of the subtype from a point and a proof that it satisfies P","status":"ok"}}]},{"name":"AffineConstructive.interfaces.prelude.tcurry","base":"tcurry","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"Curries a function on pairs into a function of two arguments","status":"ok"},"long":{"text":"Turns a function f on the product [[AffineConstructive.interfaces.prelude.tprod]] A B into a function of two arguments, by applying f to the [[AffineConstructive.interfaces.prelude.pair]] of them. It is inverse to [[AffineConstructive.interfaces.prelude.tuncurry]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.tuncurry","base":"tuncurry","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"Uncurries a function of two arguments into a function on pairs","status":"ok"},"long":{"text":"Turns a function f of two arguments into a function on the product [[AffineConstructive.interfaces.prelude.tprod]] A B, applying f to the two projections of a pair. It is inverse to [[AffineConstructive.interfaces.prelude.tcurry]], and with primitive projections the round trips hold definitionally. The abbreviations [[AffineConstructive.interfaces.prelude.eval_tuncurry]] and [[AffineConstructive.interfaces.prelude.eval_tuncurry3]] unfold it at once when building terms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.eval_red","base":"eval_red","kind":"abbrev","start":49,"body":null,"status":"ok","short":{"text":"A term notation that unfolds the head constant of a term once","status":"ok"},"long":{"text":"A notation for building terms: it elaborates the given term and replaces it by its one-step head reduction, so the resulting term has the head definition unfolded. It is used where a definition should be stored in its unfolded form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.eval_tuncurry","base":"eval_tuncurry","kind":"abbrev","start":50,"body":null,"status":"ok","short":{"text":"The uncurried form of a two-argument function, with the uncurrying unfolded","status":"ok"},"long":{"text":"Applies [[AffineConstructive.interfaces.prelude.tuncurry]] to a function of two arguments and unfolds it once with [[AffineConstructive.interfaces.prelude.eval_red]], giving the function on pairs as a lambda that applies the original function to the two projections, without a residual tuncurry in the term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.prelude.eval_tuncurry3","base":"eval_tuncurry3","kind":"abbrev","start":51,"body":null,"status":"ok","short":{"text":"The uncurried form of a three-argument function, on nested pairs, with the uncurrying unfolded","status":"ok"},"long":{"text":"Applies [[AffineConstructive.interfaces.prelude.eval_tuncurry]] twice, turning a function of three arguments into a function on nested pairs, with both uncurryings unfolded so that the resulting term mentions only projections.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{},"constants":null}</script>

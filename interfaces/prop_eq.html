l":true}],"gloss":{"summary":"The file defines the library's propositional (Leibniz) equality [[AffineConstructive.interfaces.prop_eq.eq]], written x ≡ y, with its constructor [[AffineConstructive.interfaces.prop_eq.eq_refl]] and its elimination principles into Type, Prop, Set and SProp. The library is built without the standard library, so this equality takes the place of the standard one. The file registers it with the kernel so that Rocq's built-in rewriting and tactics recognise it. Throughout the development, ≡ stands for definitional equality. It is kept separate from the affine equality = of a set, which is an affine proposition and carries a dual.","short":"Propositional (Leibniz) equality ≡, registered with the kernel in place of the standard one","items":[{"name":"AffineConstructive.interfaces.prop_eq.eq","base":"eq","kind":"ind","start":1,"body":null,"status":"ok","short":{"text":"Leibniz equality in Prop, written x ≡ y: the inductive family generated by reflexivity","status":"ok"},"long":{"text":"The development's own propositional equality. It is the inductive family whose single constructor [[AffineConstructive.interfaces.prop_eq.eq_refl]] relates each element to itself. The library is compiled without the standard library, so it has to provide this equality itself. The elimination principles say that whatever holds of x also holds of anything equal to it.\n\nThis is definitional equality as the vocabulary uses the term. It is not the affine equality x = y of a set, which is an affine proposition in Ω and may carry an apartness. The relation ≡ is an intuitionistic Prop with no dual. Elsewhere the library uses it for conversions and for the coherence of definitions, and rarely for mathematical content. The file registers the type, its constructor and its eliminators with the kernel, so that Rocq's built-in rewriting and the tactics that expect an equality type recognise this one.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.prop_eq.eq_rect","base":"eq_rect","kind":"scheme","short":{"text":"transports an element of a type family along x ≡ a, from P x to P a","status":"ok"}},{"name":"AffineConstructive.interfaces.prop_eq.eq_ind","base":"eq_ind","kind":"scheme","short":{"text":"if a Prop-valued predicate holds of x and x ≡ a, it holds of a","status":"ok"}},{"name":"AffineConstructive.interfaces.prop_eq.eq_rec","base":"eq_rec","kind":"scheme","short":{"text":"transports an element of a Set-valued family along x ≡ a","status":"ok"}},{"name":"AffineConstructive.interfaces.prop_eq.eq_sind","base":"eq_sind","kind":"scheme","short":{"text":"if an SProp-valued predicate holds of x and x ≡ a, it holds of a","status":"ok"}},{"name":"AffineConstructive.interfaces.prop_eq.eq_refl","base":"eq_refl","kind":"constr","short":{"text":"reflexivity: every element is definitionally equal to itself","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."}},"constants":null}</script>

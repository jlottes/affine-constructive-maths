s.relation_notation","name":"lt","kind":"def","local":true},{"s":969,"e":973,"lib":"AffineConstructive.interfaces.prelude","name":"pair","kind":"constr","local":false,"page":"prelude.html"},{"s":1033,"e":1035,"lib":"AffineConstructive.interfaces.relation_notation","name":"lt","kind":"def","local":true},{"s":1075,"e":1077,"lib":"AffineConstructive.interfaces.relation_notation","name":"lt","kind":"def","local":true},{"s":1238,"e":1240,"lib":"AffineConstructive.interfaces.relation_notation","name":"Le","kind":"class","local":true},{"s":1242,"e":1250,"lib":"AffineConstructive.interfaces.relation_notation","name":"order_op","kind":"def","local":true},{"s":1288,"e":1292,"lib":"AffineConstructive.interfaces.aprop","name":"flip","kind":"def","local":false,"page":"aprop.html"},{"s":1295,"e":1297,"lib":"AffineConstructive.interfaces.relation_notation","name":"le","kind":"def","local":true},{"s":1349,"e":1354,"lib":"AffineConstructive.interfaces.relation_notation","name":"Equiv","kind":"class","local":true},{"s":1356,"e":1364,"lib":"AffineConstructive.interfaces.relation_notation","name":"order_op","kind":"def","local":true},{"s":1381,"e":1386,"lib":"AffineConstructive.interfaces.relation_notation","name":"Equiv","kind":"class","local":true}],"gloss":{"summary":"This file declares the two basic relations of the development as typeclasses: [[AffineConstructive.interfaces.relation_notation.equiv]], the equality of a type, and [[AffineConstructive.interfaces.relation_notation.le]], its order. Each is an affine proposition on pairs, written x = y and x ≤ y, and inequality x ≠ y is the negation of equality. The strict order [[AffineConstructive.interfaces.relation_notation.lt]] is the complement of the converse order, so x < y is (y ≤ x)ᗮ. The file also defines [[AffineConstructive.interfaces.relation_notation.order_op]], a renaming of a type that carries the converse order and the same equality. The opposite orders, and with them the duality between the order notions, are built on this renaming in `interfaces/algebra_notation.v` and `orders/orders.v`.","short":"Equality, order and strict order as affine relations, and the opposite order","items":[{"name":"AffineConstructive.interfaces.relation_notation.Equiv","base":"Equiv","kind":"ind","start":5,"body":null,"status":"ok","short":{"text":"The class of an affine equality on a type: a relation on pairs valued in affine propositions","status":"ok"},"long":{"text":"An equality on a type A is an affine relation on A, a map from pairs of elements of A to affine propositions; x = y is its value at the pair (x, y). Because the value is an affine proposition, the relation carries its own refutation, and the inequality x ≠ y is the negation (x = y)ᗮ, not a separately supplied relation. When the set is strong this inequality is its apartness. The relation as a predicate on pairs, (≠), is the [[AffineConstructive.interfaces.aprop.complement]] of (=).\n\nThe relation takes a pair rather than two arguments so that it is itself an affine predicate on the product A ∗ A, and the operations on predicates (complement, converse) apply to it directly. Equality is a class, found by resolution from the type, so that a type carries one equality and the notation = names it; the axioms that make it an equality (reflexivity, symmetry, transitivity in the affine sense) come later, with sets.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.relation_notation.Equiv","base":"Equiv","kind":"rec","short":{"text":"The class of affine equality relations on a type","status":"ok"}},{"name":"AffineConstructive.interfaces.relation_notation.equiv","base":"equiv","kind":"proj","short":{"text":"The equality of a type, as an affine predicate on pairs of its elements","status":"ok"}}]},{"name":"AffineConstructive.interfaces.relation_notation.Le","base":"Le","kind":"ind","start":13,"body":null,"status":"ok","short":{"text":"The class of an affine order relation on a type: a relation on pairs valued in affine propositions","status":"ok"},"long":{"text":"An order on a type A is, like an equality, an affine relation on A: a map from pairs of elements to affine propositions, written x ≤ y. Its value carries both a way of proving x ≤ y and a way of refuting it, and the refutation is what the strict order [[AffineConstructive.interfaces.relation_notation.lt]] is made of.\n\nThe class says nothing about the order's laws; reflexivity, transitivity and antisymmetry are imposed by the order structures built on it. Its role here is to fix the notation ≤ and let resolution find the order of a type.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.relation_notation.Le","base":"Le","kind":"rec","short":{"text":"The class of affine order relations on a type","status":"ok"}},{"name":"AffineConstructive.interfaces.relation_notation.le","base":"le","kind":"proj","short":{"text":"The order of a type, as an affine predicate on pairs of its elements","status":"ok"}}]},{"name":"AffineConstructive.interfaces.relation_notation.lt","base":"lt","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"The strict order: x < y is the negation of y ≤ x","status":"ok"},"long":{"text":"The strict order is not a separate datum but is derived from the order: x < y is (y ≤ x)ᗮ, the negation of the reversed comparison. As a predicate on pairs it is the [[AffineConstructive.interfaces.aprop.complement]] of the converse ([[AffineConstructive.interfaces.aprop.flip]]) of ≤.\n\nIn affine logic this is the right definition and not a weakening. Negation swaps proof and refutation, so a proof of x < y is a refutation of y ≤ x, and a refutation of x < y is a proof of y ≤ x. Under the translation to the base logic, when the order is that of a constructive ordered structure, the refutation of ≤ is the positive strict order, so x < y comes out as the usual constructive strict order and its refutation as y ≤ x, as in Shulman's account of ordered sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.relation_notation.order_op","base":"order_op","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"The type A renamed to carry the opposite order: the order reversed, equality unchanged","status":"ok"},"long":{"text":"order_op A is A itself, under another name that resolution treats as opaque, so that the renamed type can carry its own instances. Two hints in this file give them. The order on order_op A is the converse of the order on A, built with [[AffineConstructive.interfaces.aprop.flip]], so that x ≤ y in order_op A is y ≤ x in A. The equality is that of A, unchanged. Since [[AffineConstructive.interfaces.relation_notation.lt]] is defined from ≤, the strict order of the renamed type is the converse of the strict order of A, with nothing more to declare.\n\nThis is how duality works in the development. The opposite of an ordered set, [[AffineConstructive.interfaces.algebra_notation.Order_op]], is built on this renaming: it has the same elements and equality, the reversed order, and meet and join exchanged. Each order class then comes with an instance saying that it passes to the opposite, as [[AffineConstructive.orders.orders.PreOrder_op]] does for preorders, so a statement proved for one order also holds for its opposite. Some definitions are themselves stated through the opposite. For example, [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Flip_Morphism]], the class of maps taking meets to joins, is the meet-preserving property with the codomain replaced by its opposite.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.aprop":{"page":"aprop.html","short":"Affine propositions Ω, their connectives and quantifiers, and the affine properties of relations","summary":"The file defines Ω, the type of affine propositions: a pair of an affirmation and a refutation in SProp that cannot both hold, together with a classicality field supplied by the kernel. The field is trivial in the constructive kernel and forces decidability in the classical one. It builds the connectives from these pairs: truth and falsity, the additive ∧ and ∨, the tensor ⊠ and the par ⊞, the implication ⊸ carrying its contrapositive, the negation, ⧟, the modalities ! and ?, and the quantifiers ∏ and ∐. On top of these it defines Shulman's classes Decidable, Affirmative and Refutative, De Morgan duals, boolean decision procedures (Dec, IsDec), and the affine properties of relations. Symmetry, transitivity (with ⊠ for the multiplicative form and ∧ for the strong one), antisymmetry, totality and equivalence are each stated as an implication between affine propositions. The laws of these connectives are proved in logic/aprop.v, and the rest of the development is written in this language."}},"constants":null}</script>

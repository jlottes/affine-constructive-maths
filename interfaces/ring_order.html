{"s":2939,"e":2957,"lib":"AffineConstructive.interfaces.ring_order","name":"AdditiveGroupOrder","kind":"class","local":true},{"s":3042,"e":3073,"lib":"AffineConstructive.interfaces.ring_order","name":"StrongLinearRefutativeRingOrder","kind":"rec","local":true},{"s":3085,"e":3108,"lib":"AffineConstructive.interfaces.ring_order","name":"slr_ring_order_pos_mult","kind":"proj","local":true}],"gloss":{"summary":"This file sets out the interfaces for ordered algebra. It first defines the cones of a weak poset with a zero as subsets: the nonzero elements, the nonnegative cone R⁺, the positive cone R₊, the nonpositive cone R⁻ and the negative cone R₋. It then gives the compatibility of order with addition: an ordered additive monoid, where adding z on the left is an order embedding, and an ordered additive group, where adding z on the left preserves the order. On these it builds two classes. A strong linear refutative rig order is a rig with a strong, linear, refutative partial order that is an ordered additive monoid and satisfies b < a ⊠ d < c ⊸ a·d + b·c < a·c + b·d. A strong linear refutative ring order is the ring version, with the same order axioms, an ordered additive group, and closure of the positive elements under products.","short":"Cones, and order compatible with addition and multiplication in monoids, groups, rigs and rings","items":[{"name":"AffineConstructive.interfaces.ring_order.NonZero","base":"NonZero","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"The subset of a set with zero consisting of the elements x ≠ 0","status":"ok"},"long":{"text":"The subset of P cut out by x ≠ 0. When P is a strong set the inequality is an apartness, so membership in NonZero says that x is apart from zero, and its refutation is x = 0. Unlike the four order cones beside it, it needs only a zero on P and no order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.ring_order.NonNeg","base":"NonNeg","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"The nonnegative cone R⁺: the elements x of a weak poset with zero such that 0 ≤ x","status":"ok"},"long":{"text":"The subset of a weak poset with a zero made of the elements x with 0 ≤ x, written R⁺. Membership is the affine proposition 0 ≤ x, so the subset brings its refutation with it: by [[AffineConstructive.orders.groups.nonneg_dual]], the dual of x being nonnegative is x < 0, so the complement of R⁺ is the negative cone [[AffineConstructive.interfaces.ring_order.Neg]].\n\nThe cone is used mainly as a structure in its own right, carrying the operations and the order of the ambient set. The nonnegative elements of an ordered additive monoid form an ordered additive monoid ([[AffineConstructive.orders.groups.add_mon_order_nonneg_order]]). For the integers, the nonnegative cone Z⁺ is a model of the naturals ([[AffineConstructive.orders.integers.nonneg_int_naturals]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.ring_order.NonPos","base":"NonPos","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The non-positive cone R⁻ of an ordered set with zero: the elements x with x ≤ 0","status":"ok"},"long":{"text":"The subset of P of elements x with x ≤ 0, written R⁻. It is the mirror of [[AffineConstructive.interfaces.ring_order.NonNeg]]: the non-negative cone of the opposite order. It is defined over a weak poset with a zero, and its complement is the strict cone [[AffineConstructive.interfaces.ring_order.Pos]] when the order is linear and refutative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.ring_order.Pos","base":"Pos","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"The positive cone R₊: the subset of elements x with 0 < x","status":"ok"},"long":{"text":"The subset of P of the elements x with 0 < x, written R₊. Like the other cones of the file it is defined over a weak poset with a zero, with no algebra assumed, and it is a subset in the affine sense: membership is the affine proposition 0 < x, which carries both a way of affirming and a way of refuting it.\n\nThe strict order is the dual of the reversed order: x < y is the negation of y ≤ x. So refuting that x is positive is affirming x ≤ 0, and the complement of R₊ is the nonpositive cone R⁻. This duality is what the development records about it: [[AffineConstructive.orders.groups.pos_dual]] says the dual of x being positive is x being nonpositive, and [[AffineConstructive.orders.groups.nonpos_dual]] says the converse, its proof going through the definition of the positive cone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.ring_order.Neg","base":"Neg","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The negative cone R₋: the elements x with x < 0 of a weak poset with zero","status":"ok"},"long":{"text":"The subset of P of the elements x with x < 0, written R₋, defined over a weak poset with a zero. It is the dual of the nonnegative cone [[AffineConstructive.interfaces.ring_order.NonNeg]]: the dual of 0 ≤ x is x < 0 and the dual of x < 0 is 0 ≤ x, which is what [[AffineConstructive.orders.groups.nonneg_dual]] and [[AffineConstructive.orders.groups.neg_dual]] state, so each of the two cones is the complement of the other.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.ring_order.AdditiveMonoidOrder","base":"AdditiveMonoidOrder","kind":"rec","start":18,"body":null,"status":"ok","short":{"text":"A partially ordered commutative monoid in which every translation z + − is an order embedding","status":"ok"},"long":{"text":"An ordered additive monoid: a commutative monoid (M, +, 0) that is also a [[AffineConstructive.interfaces.orders.Poset]], such that for each z the translation x ↦ z + x is an [[AffineConstructive.interfaces.orders.OrderEmbedding]], that is, x ≤ y if and only if z + x ≤ z + y. Asking for reflection as well as preservation is the cancellative form of compatibility; in a monoid without negation reflection does not follow from preservation, so it is part of the definition. Since an affine order relation carries its dual, the embedding condition says equally that translation preserves and reflects the strict order.\n\nHints make the translation instance available whenever a goal asks that z + − be order preserving, order reflecting or an order embedding. The structure is the additive part of [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRigOrder]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.ring_order.AdditiveMonoidOrder_AdditiveMonoid","base":"AdditiveMonoidOrder_AdditiveMonoid","kind":"proj","short":{"text":"an ordered additive monoid is a commutative additive monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.AdditiveMonoidOrder_Order","base":"AdditiveMonoidOrder_Order","kind":"proj","short":{"text":"an ordered additive monoid is a partially ordered set","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.plus_l_order_embedding","base":"plus_l_order_embedding","kind":"proj","short":{"text":"the law of an ordered additive monoid that each translation z + − is an order embedding","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.Build_AdditiveMonoidOrder","base":"Build_AdditiveMonoidOrder","kind":"constr","short":{"text":"builds an ordered additive monoid from a monoid, a partial order, and translations that are order embeddings","status":"ok"}}]},{"name":"AffineConstructive.interfaces.ring_order.AdditiveGroupOrder","base":"AdditiveGroupOrder","kind":"rec","start":24,"body":null,"status":"ok","short":{"text":"A partially ordered abelian group in which every translation z + − preserves the order","status":"ok"},"long":{"text":"An ordered additive group: an abelian group (G, +, 0, −) that is also a [[AffineConstructive.interfaces.orders.Poset]], with each translation x ↦ z + x [[AffineConstructive.interfaces.orders.OrderPreserving]]. Only preservation is required: in a group, reflection follows by translating back by −z, so an ordered group is in particular an [[AffineConstructive.interfaces.ring_order.AdditiveMonoidOrder]]. The structure is the additive part of [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRingOrder]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.ring_order.AdditiveGroupOrder_AdditiveGroup","base":"AdditiveGroupOrder_AdditiveGroup","kind":"proj","short":{"text":"an ordered additive group is an abelian additive group","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.AdditiveGroupOrder_Order","base":"AdditiveGroupOrder_Order","kind":"proj","short":{"text":"an ordered additive group is a partially ordered set","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.add_group_plus_order_preserving","base":"add_group_plus_order_preserving","kind":"proj","short":{"text":"the law of an ordered additive group that each translation z + − preserves the order","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.Build_AdditiveGroupOrder","base":"Build_AdditiveGroupOrder","kind":"constr","short":{"text":"builds an ordered additive group from a group, a partial order, and order-preserving translations","status":"ok"}}]},{"name":"AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRigOrder","base":"StrongLinearRefutativeRigOrder","kind":"rec","start":27,"body":null,"status":"ok","short":{"text":"A rig with a strong, linear, refutative order, translation-invariant addition and a strict compatibility law for multiplication","status":"ok"},"long":{"text":"An ordered rig: a [[AffineConstructive.interfaces.abstract_algebra.Rig]] whose order is a [[AffineConstructive.interfaces.orders.StrongPoset]], a [[AffineConstructive.interfaces.orders.LinearOrder]] and a [[AffineConstructive.interfaces.orders.RefutativeOrder]], whose addition makes it an [[AffineConstructive.interfaces.ring_order.AdditiveMonoidOrder]] (adding on the left is an order embedding), and which satisfies one law linking multiplication with the strict order, [[AffineConstructive.interfaces.ring_order.mult_lt_compat_full]]: if b < a and d < c then a·d + b·c < a·c + b·d. In a ring this says that the product of the two positive differences a − b and c − d is positive; a rig has no subtraction, so the law is written with the four products distributed over the two sides of the inequality.\n\nThe two hypotheses are joined by the tensor, b < a ⊠ d < c, and the implication is affine, so the law carries its contrapositive: a failure of the strict inequality between the sums gives a failure of b < a par a failure of d < c. The multiplicative conjunction is the one that makes this dual reading the right one; with the additive conjunction the contrapositive would have to name which hypothesis fails.\n\nThis is the rig counterpart of [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRingOrder]] in the same file, where the additive structure is a group and the multiplicative axiom becomes closure of positivity under products, [[AffineConstructive.interfaces.ring_order.slr_ring_order_pos_mult]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.ring_order.slr_rig_order_rig","base":"slr_rig_order_rig","kind":"proj","short":{"text":"The rig structure of a strong linear refutative rig order","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_rig_order_strong","base":"slr_rig_order_strong","kind":"proj","short":{"text":"The order of a strong linear refutative rig order is strongly transitive","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_rig_order_linear","base":"slr_rig_order_linear","kind":"proj","short":{"text":"The order of a strong linear refutative rig order is linear","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_rig_order_refutative","base":"slr_rig_order_refutative","kind":"proj","short":{"text":"The order of a strong linear refutative rig order is refutative","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_rig_order_mon_order","base":"slr_rig_order_mon_order","kind":"proj","short":{"text":"Addition and order of a strong linear refutative rig order form an additive monoid order","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.mult_lt_compat_full","base":"mult_lt_compat_full","kind":"proj","short":{"text":"If b < a and d < c then a·d + b·c < a·c + b·d","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.Build_StrongLinearRefutativeRigOrder","base":"Build_StrongLinearRefutativeRigOrder","kind":"constr","short":{"text":"Builds a strong linear refutative rig order from its rig, order, monoid-order and multiplicative laws","status":"ok"}}]},{"name":"AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRingOrder","base":"StrongLinearRefutativeRingOrder","kind":"rec","start":30,"body":null,"status":"ok","short":{"text":"A ring with a strong, linear, refutative order, ordered additively, whose positive cone is closed under products","status":"ok"},"long":{"text":"An ordered ring: a [[AffineConstructive.interfaces.abstract_algebra.Ring]] whose order is a [[AffineConstructive.interfaces.orders.StrongPoset]], a [[AffineConstructive.interfaces.orders.LinearOrder]] and a [[AffineConstructive.interfaces.orders.RefutativeOrder]], whose additive group is an [[AffineConstructive.interfaces.ring_order.AdditiveGroupOrder]], and in which the product of two positive elements is positive, [[AffineConstructive.interfaces.ring_order.slr_ring_order_pos_mult]]. With subtraction available this single condition on the positive cone [[AffineConstructive.interfaces.ring_order.Pos]] replaces the four-term law of [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRigOrder]].\n\nThe hypotheses 0 < x and 0 < y are joined by the tensor, so the axiom carries its contrapositive: if x · y ≤ 0 then x ≤ 0 par y ≤ 0. This is the affine form of the classical statement that an ordered ring has no positive elements with non-positive product.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.ring_order.slr_ring_order_ring","base":"slr_ring_order_ring","kind":"proj","short":{"text":"a strong linear refutative ring order is a ring","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_ring_order_strong","base":"slr_ring_order_strong","kind":"proj","short":{"text":"a strong linear refutative ring order is a strong partial order","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_ring_order_linear","base":"slr_ring_order_linear","kind":"proj","short":{"text":"a strong linear refutative ring order is a linear order","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_ring_order_refutative","base":"slr_ring_order_refutative","kind":"proj","short":{"text":"a strong linear refutative ring order is a refutative order","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_ring_order_grp_order","base":"slr_ring_order_grp_order","kind":"proj","short":{"text":"a strong linear refutative ring order is an ordered additive group","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.slr_ring_order_pos_mult","base":"slr_ring_order_pos_mult","kind":"proj","short":{"text":"the multiplicative law of a ring order: 0 < x tensor 0 < y implies 0 < x·y","status":"ok"}},{"name":"AffineConstructive.interfaces.ring_order.Build_StrongLinearRefutativeRingOrder","base":"Build_StrongLinearRefutativeRingOrder","kind":"constr","short":{"text":"builds a strong linear refutative ring order from a ring, the order properties, additive compatibility and positive products","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.orders":{"page":"orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.orders.orders":{"page":"../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.interfaces.set_lambda":{"page":"set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

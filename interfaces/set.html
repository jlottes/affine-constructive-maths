ns.\n  Universes u.\n  Context {X Y:set@{u}}.\n  Class IsFun (f:X → Y) : SProp := is_fun x₁ x₂ : x₁ = x₂ ⊸ f x₁ = f x₂ .\n  Global Arguments is_fun f {_} _ _.\n\n\n  Record func := func_make\n  { func_op :> X → Y\n  ; #[canonical=no, reversible=no] func_is_fun :> IsFun func_op\n  }.\n  Global Arguments func_make _ {_}.\n\n  Local Instance func_ext_eq : Equiv func := λ '(f, g), ∏ x, f x = g x.\n  Local Instance func_is_set : IsSet func.\n  Proof. split; hnf; intros; change (?f = ?g) with (func_op f = func_op g).\n  + refl.\n  + now apply symmetry.\n  + now apply transitivity.\n  Qed.\n\n  Definition func_set := set_make func.\nEnd functions.\nArguments func X Y : clear implicits.\nArguments func_set X Y : clear implicits.\nCanonical func_set.\nGlobal Hint Extern 2 (IsFun _) => simple notypeclasses refine (func_is_fun _) : typeclass_instances.\nGlobal Hint Extern 0 (Equiv (func _ _)) => simple notypeclasses refine func_ext_eq : typeclass_instances.\nInfix \"⇾\" := func_set : set_scope.\nAbbreviation func_op2 f x y := (func_op (func_op f x) y) (only parsing).\n\n\nDefinition strong_set_morphism (X Y : strong_set) := X ⇾ Y.\n\nCanonical Structure id_fun (X:set) : X ⇾ X := @func_make X X id (λ x₁ x₂, aimpl_refl _).\n(*Global Hint Extern 1 (Id set) => refine id_fun : typeclass_instances.*)\n\nImport projection_notation.\n\nSection product.\n  Universes u.\n  Definition prod_set_eq (X Y : set@{u}) : Equiv (X ∗ Y)\n    := λ '((x₁, y₁), (x₂, y₂)), x₁ = x₂ ∧ y₁ = y₂.\n  Definition tensor_set_eq (X Y : set@{u}) : Equiv (X ∗ Y)\n    := λ '((x₁, y₁), (x₂, y₂)), x₁ = x₂ ⊠ y₁ = y₂.\n\n  Local Instance prod_set_is_set (X Y : set@{u}) : IsSet (X∗Y) (e:=prod_set_eq X Y).\n  Proof. split; unfold equiv, prod_set_eq.\n  + intros [x y]. now split.\n  + intros [x₁ y₁] [x₂ y₂]. apply aand_proper_aimpl; now apply symmetry.\n  + intros [x₁ y₁] [x₂ y₂] [x₃ y₃]. refine (aand_intro _ _).\n    * rew [ (aandl (x₁ = x₂) _) | (aandl (x₂ = x₃) _) ]. now apply transitivity.\n    * rew [ (aandr _ (y₁ et@{u}} : (Y ⇾ Z) ⊗ (X ⇾ Y) ⇾ (X ⇾ Z) := func_make scompose.\nEnd composition.\nGlobal Hint Extern 2 (IsFun scompose) => simple notypeclasses refine scompose_is_fun : typeclass_instances.\nCanonical scompose_fun.\nNotation \"(∘)\" := scompose : set_scope.\nNotation \"g ∘ f\" := ((∘) (@pair (set_T (_ ⇾ _)) (set_T (_ ⇾ _)) g f)) : set_scope.\n\n(** The \"obvious\" function from X to Y *)\nClass Cast X Y := cast : X ⇾ Y.\nArguments cast X Y {_}.\n\n(** Coercions: set morphisms whose underyling function is the identity *)\nClass Coerce@{u} (X Y : set@{u}) := coerce : X ⇾ Y.\nArguments coerce X Y {_}.\n#[global] Hint Extern 1 (Coerce ?X ?X) => exact (id_fun X) : typeclass_instances.\n#[global] Hint Extern 100 (Coerce _ _) => simple notypeclasses refine (id_fun _) : typeclass_instances.\n\n\nClass Inverse `(f:X ⇾ Y) := inverse : Y ⇾ X.\nArguments inverse {_ _} f {_}.\nGlobal Typeclasses Transparent Inverse.\nDeclare Scope fun_inv_scope.\nLocal Open Scope fun_inv_scope.\nNotation \"f ⁻¹\" := (inverse f) (at level 1, left associativity, format \"f ⁻¹\") : fun_inv_scope.\n\nGlobal Hint Extern 2 (Inverse (id_fun ?X)) => refine (id_fun X) : typeclass_instances.\nGlobal Hint Extern 2 (Inverse (?g ∘ ?f)) => notypeclasses refine (inverse f ∘ inverse g) : typeclass_instances.\n\n\nSection jections.\n  Class Injective `(f:X ⇾ Y) : SProp := injective x y : f x = f y ⊸ x = y.\n\n  Class WeaklySurjective@{u} {A:Type@{u}} {Y:set@{u}} (f:A → Y) : SProp := weakly_surjective : ∏ y, ∐ x, f x = y.\n\n  Class Surjective `(f:X ⇾ Y) {inv:Inverse f} : SProp := surjective : f ∘ f⁻¹ = id_fun Y.\n\n  Record Bijective `(f:X ⇾ Y) {inv:Inverse f} : SProp :=\n  { #[reversible=no] bijective_injective :> Injective f\n  ; #[reversible=no] bijective_surjective :> Surjective f\n  }.\n  Existing Class Bijective.\nEnd jections.\n\nArguments injective {_ _} f {_} x y.\nArguments weakly_surjective {_ _} f {_}.\nArguments surjective {_ _} f {_ _}.\n\n\nSection sum.\n  Universes u.\n  Import tsum_notation.\n  Lo e/rewrite.html"},{"s":9966,"e":9969,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":9991,"e":9994,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12492,"e":12495,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12551,"e":12554,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12613,"e":12616,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12642,"e":12654,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"}],"gloss":{"summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory.","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","items":[{"name":"AffineConstructive.interfaces.set.IsSet","base":"IsSet","kind":"def","start":2,"body":null,"status":"ok","short":{"text":"A type's affine equality is an equivalence: reflexive, symmetric and transitive","status":"ok"},"long":{"text":"A type A with an affine equality `=` (an [[AffineConstructive.interfaces.relation_notation.Equiv]] instance, valued in affine propositions) is a set when that equality is an [[AffineConstructive.interfaces.aprop.Equivalence]]: reflexive, symmetric, and transitive in the affine sense, where transitivity takes the tensor x = y ⊠ y = z as hypothesis. Because an affine proposition is a way of proving together with a way of refuting, the equality of a set is at once an equality and an inequality that cannot both hold. This is the notion of set in Shulman's *Affine logic for constructive mathematics*.\n\nTransitivity carries its contrapositive: x ≠ z implies x ≠ y par y ≠ z. That is weaker than cotransitivity, so the inequality of a set is not in general an apartness; the sets whose equality is strongly transitive, with the additive conjunction as hypothesis, are singled out as [[AffineConstructive.interfaces.set.StrongSet]].\n\n`IsSet` is a class standing for the equivalence. Resolution answers requests for reflexivity, symmetry, transitivity or partial equivalence of a set's equality from the one `IsSet` instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.set","base":"set","kind":"rec","start":10,"body":null,"status":"ok","short":{"text":"An affine set: a type bundled with an affine equality that is an equivalence","status":"ok"},"long":{"text":"The bundled notion of set used throughout the development: a carrier type, its affine equality, and the proof that the equality is an equivalence ([[AffineConstructive.interfaces.set.IsSet]]). The carrier is a coercion, so a set can be used wherever a type is expected, and hints recover the equality and its laws from the bundle. Constructions of new sets (products, function sets, sums) build the carrier and its equality separately and then package them with [[AffineConstructive.interfaces.set.set_make]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.set_T","base":"set_T","kind":"proj","short":{"text":"The carrier type of a set","status":"ok"}},{"name":"AffineConstructive.interfaces.set.set_eq","base":"set_eq","kind":"proj","short":{"text":"The equality of a set, an affine predicate on pairs of its elements","status":"ok"}},{"name":"AffineConstructive.interfaces.set.set_is_set","base":"set_is_set","kind":"proj","short":{"text":"The proof that the equality of a set is an equivalence","status":"ok"}},{"name":"AffineConstructive.interfaces.set.set_make","base":"set_make","kind":"constr","short":{"text":"Builds a set from a type whose affine equality is an equivalence","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.StrongSet","base":"StrongSet","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"A set whose equality is strongly transitive, so its inequality is an apartness","status":"ok"},"long":{"text":"A set is strong when its equality is [[AffineConstructive.interfaces.aprop.StronglyTransitive]]: x = y and y = z (the additive conjunction) implies x = z. The hypothesis of transitivity is now `∧` rather than the tensor. Since the tensor implies the additive conjunction, this is a stronger condition than ordinary transitivity. Its contrapositive says x ≠ z implies x ≠ y or y ≠ z. That is cotransitivity, so in a strong set the inequality is an apartness relation in Bishop's sense. These are Shulman's strong sets, and the reason the vocabulary reads x ≠ y as apartness when the set is strong.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.DecidableEquality","base":"DecidableEquality","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"A set whose equality is decidable at every pair of elements","status":"ok"},"long":{"text":"A set has decidable equality when its equality is a [[AffineConstructive.interfaces.aprop.DecidableRelation]]: each instance x = y is a decidable affine proposition, so that either x = y or x ≠ y holds. This is the first of three classes describing the modality of a set's equality, after Shulman's decidable, affirmative and refutative propositions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.AffirmativeEquality","base":"AffirmativeEquality","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"The equality of the set X is affirmative: each x = y is an affirmative proposition","status":"ok"},"long":{"text":"A set X has affirmative equality when its equality, read as an affine predicate on pairs, is an [[AffineConstructive.interfaces.aprop.AffirmativeRelation]]: every proposition x = y is affirmative in Shulman's sense, so its way of refuting is the negation of its way of proving.\n\nThis is a property of the set, not extra structure: a name for a property of its equality, with the same meaning as the relation class it restates. A hint lets resolution find it whenever the property is asked of the equality of a set, and the other way round. Which sets have affirmative equality is proved set by set in the files that construct them.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.RefutativeEquality","base":"RefutativeEquality","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"The equality of the set X is refutative: each x = y is a refutative proposition","status":"ok"},"long":{"text":"A set X has refutative equality when its equality, read as an affine predicate on pairs, is a [[AffineConstructive.interfaces.aprop.RefutativeRelation]]: every proposition x = y is refutative in Shulman's sense, so its way of proving is the negation of its way of refuting, and equality is the negation of inequality.\n\nIt is the dual of [[AffineConstructive.interfaces.set.AffirmativeEquality]] and is arranged the same way: a name for a property of the set's equality, which a hint links to the relation class so that resolution finds either from the other. Which sets have refutative equality is proved set by set in the files that construct them.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.IsDecEq","base":"IsDecEq","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"A boolean decision procedure for the equality of a set is correct","status":"ok"},"long":{"text":"Given a boolean decision function for the equality of X (a [[AffineConstructive.interfaces.aprop.Dec]] instance), `IsDecEq` states that it is correct ([[AffineConstructive.interfaces.aprop.IsDec]]): it returns true exactly when x = y and false exactly when x ≠ y. Decidable equality ([[AffineConstructive.interfaces.set.DecidableEquality]]) is a property. This is computational content attached to the set, so that equality can be decided by evaluation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.strong_set","base":"strong_set","kind":"rec","start":33,"body":null,"status":"ok","short":{"text":"A strong set: a set bundled with the strong transitivity of its equality","status":"ok"},"long":{"text":"The bundled form of [[AffineConstructive.interfaces.set.StrongSet]]: a set together with the proof that its equality is strongly transitive. The underlying set is a coercion and the strong transitivity is recovered by resolution, so a strong set can be used wherever a set is expected. Its morphisms are the functions of the underlying sets ([[AffineConstructive.interfaces.set.strong_set_morphism]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.strong_set_car","base":"strong_set_car","kind":"proj","short":{"text":"The underlying set of a strong set","status":"ok"}},{"name":"AffineConstructive.interfaces.set.strong_set_prop","base":"strong_set_prop","kind":"proj","short":{"text":"The strong transitivity of the equality of a strong set","status":"ok"}},{"name":"AffineConstructive.interfaces.set.make_strong_set","base":"make_strong_set","kind":"constr","short":{"text":"Builds a strong set from a set whose equality is strongly transitive","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.empty_set","base":"empty_set","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"The empty set 𝟎: the empty type, with every pair related by truth","status":"ok"},"long":{"text":"The empty set 𝟎 is the empty type, with the relation that relates every pair by truth 𝐓. That relation is an equivalence by [[AffineConstructive.logic.relations.trivial_Equivalence]]. Since there are no elements, the choice of equality makes no difference. The notation 𝟎 denotes it, and resolution supplies it wherever a distinguished set written 𝟎 is required.\n\nTwo things are recorded about it. Its equality is decidable: [[AffineConstructive.theory.set.empty_eq_dec]] is the constant test true, and [[AffineConstructive.theory.set.empty_is_dec_eq]] shows that this test decides equality on 𝟎 correctly. It is also the initial set: [[AffineConstructive.theory.set.from_Empty]] is the function 𝟎 ⇾ X out of it, and [[AffineConstructive.theory.set.empty_initial]] shows that every function 𝟎 ⇾ X equals that one. The topological files then show that this map out of 𝟎 is uniformly continuous ([[AffineConstructive.topology.uniform.basis.from_empty_ufm_cont]]) and bornological ([[AffineConstructive.topology.bornology.basis.from_empty_bornological]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.unit_set","base":"unit_set","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"The unit set 𝟏, on the one-element type with the trivial equality","status":"ok"},"long":{"text":"The unit set 𝟏: the one-element type with the trivial equivalence, under which its one element equals itself. It is the unit object of sets, written 𝟏, and the terminal set: every set has a unique function into it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.ext_eq","base":"ext_eq","kind":"inst","start":46,"body":null,"status":"ok","short":{"text":"Pointwise equality of maps from a type into a set: for all x, f x = g x","status":"ok"},"long":{"text":"Two maps f, g from a type A into a set Y are equal when f x = g x for all x, with the affine universal quantifier. Refuting this equality means finding a point where f and g are apart: there is x with f x ≠ g x. A has no equality of its own, so the maps need not preserve anything. This equality makes [[AffineConstructive.interfaces.set.operation]] A Y a set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.opn_is_set","base":"opn_is_set","kind":"inst","start":47,"body":[48,62],"status":"ok","short":{"text":"Pointwise equality of maps from a type into a set is an equivalence","status":"ok"},"proof":[{"text":"An equivalence has three parts, and each is checked for the pointwise equality, under which f and g are equal when f x = g x for every x in A.","status":"ok","from":0,"to":1},{"text":"Reflexivity: f x = f x holds at every x by reflexivity of the equality of Y.","status":"ok","from":2,"to":3},{"text":"Symmetry: fix f and g, and then a point x of A. Specialising the hypothesis at x gives f x = g x, and symmetry of the equality of Y turns it into g x = f x.","status":"ok","from":4,"to":8},{"text":"Transitivity: fix f, g, h and a point x. Each of the two universal hypotheses is specialised at x, one in each factor of the tensor, giving f x = g x and g x = h x; the transitivity of Y, which takes exactly such a tensor, yields f x = h x.","status":"ok","from":9,"to":14}]},{"name":"AffineConstructive.interfaces.set.operation","base":"operation","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"The set of all maps from a type A into a set Y, with pointwise equality","status":"ok"},"long":{"text":"For a type A and a set Y, `operation A Y` is the set of all maps A → Y. Two maps are equal when they agree at every point, f = g being ∏ x, f x = g x ([[AffineConstructive.interfaces.set.ext_eq]]). A has no equality of its own, so the maps are not required to preserve one. The relation is an equivalence ([[AffineConstructive.interfaces.set.opn_is_set]]) because the equality of Y is one, applied pointwise. The set prints as A → Y. Compare [[AffineConstructive.interfaces.set.func_set]], where the domain is a set and the maps must preserve its equality.\n\nA canonical-structure declaration lets unification read a type of maps into a set as this set. Set internalization uses it to interpret a raw map applied to an argument ([[AffineConstructive.tactics.set_internalize.interpret_operation_eval_or_const]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.canonical:operation","base":"canonical:operation","kind":"canonical","start":66,"body":null,"status":"ok","short":{"text":"Unification recognises a type of maps into a set as the set [[AffineConstructive.interfaces.set.operation]], with pointwise equality","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.IsFun","base":"IsFun","kind":"ind","start":72,"body":null,"status":"ok","short":{"text":"A map between sets is a function: equal arguments give equal values","status":"ok"},"long":{"text":"A map f between the carriers of two sets is a function when, for all x₁ and x₂, x₁ = x₂ implies f x₁ = f x₂, with the affine implication. The implication carries its contrapositive, so the same condition says that f x₁ ≠ f x₂ implies x₁ ≠ x₂: a function of affine sets is strongly extensional, and no separate condition is needed for it. This is the notion of function in Shulman's *Affine logic for constructive mathematics*.\n\nThe class is the property part of the bundled functions [[AffineConstructive.interfaces.set.func]], which pack a map with its proof of `IsFun`; the condition [[AffineConstructive.interfaces.set.is_fun]] is what proofs invoke to pass an equality through a function.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.IsFun","base":"IsFun","kind":"rec","short":{"text":"The class of maps that preserve equality","status":"ok"}},{"name":"AffineConstructive.interfaces.set.is_fun","base":"is_fun","kind":"proj","short":{"text":"A function f gives x₁ = x₂ implies f x₁ = f x₂","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.func","base":"func","kind":"rec","start":74,"body":null,"status":"ok","short":{"text":"Functions between sets: maps bundled with the proof that they preserve equality","status":"ok"},"long":{"text":"The type of functions from X to Y: a map of carriers together with the proof that it preserves equality ([[AffineConstructive.interfaces.set.IsFun]]). The map is a coercion, so a function can be applied directly, and the preservation property is recovered by resolution. Made into a set by pointwise equality, it is the function set X ⇾ Y ([[AffineConstructive.interfaces.set.func_set]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.func_op","base":"func_op","kind":"proj","short":{"text":"The underlying map of a function between sets","status":"ok"}},{"name":"AffineConstructive.interfaces.set.func_is_fun","base":"func_is_fun","kind":"proj","short":{"text":"The proof that a function between sets preserves equality","status":"ok"}},{"name":"AffineConstructive.interfaces.set.func_make","base":"func_make","kind":"constr","short":{"text":"Builds a function between sets from an equality-preserving map","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.func_ext_eq","base":"func_ext_eq","kind":"inst","start":76,"body":null,"status":"ok","short":{"text":"Pointwise equality of functions: f = g when f x = g x for all x","status":"ok"},"long":{"text":"Two functions X ⇾ Y are equal when f x = g x for every x, with the affine universal quantifier. They are apart when there is x with f x ≠ g x. Only the underlying maps are compared. The proofs of preservation are proof-irrelevant and play no part.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.func_is_set","base":"func_is_set","kind":"inst","start":77,"body":[78,86],"status":"ok","short":{"text":"Pointwise equality of functions between sets is an equivalence","status":"ok"},"proof":[{"text":"The equality of functions is pointwise equality of their underlying maps ([[AffineConstructive.interfaces.set.func_ext_eq]]), so each of the three laws is restated as the corresponding law for the underlying maps.","status":"ok","from":0,"to":1},{"text":"Reflexivity holds pointwise.","status":"ok","from":2,"to":3},{"text":"Symmetry is the symmetry of pointwise equality of maps.","status":"ok","from":4,"to":5},{"text":"Transitivity is the transitivity of pointwise equality of maps, which concludes the proof.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.interfaces.set.func_set","base":"func_set","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"The function set X ⇾ Y: functions from X to Y with pointwise equality","status":"ok"},"long":{"text":"The set X ⇾ Y of functions from X to Y ([[AffineConstructive.interfaces.set.func]]) with pointwise equality ([[AffineConstructive.interfaces.set.func_ext_eq]]). This is the internal hom of sets. Functions of two arguments are curried as X ⇾ (Y ⇾ Z), or else taken from a product or tensor set. Composition is itself a function of these sets ([[AffineConstructive.interfaces.set.scompose_fun]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.canonical:func_set","base":"canonical:func_set","kind":"canonical","start":91,"body":null,"status":"ok","short":{"text":"Unification recognises the functions from X to Y as the set X ⇾ Y with pointwise equality, [[AffineConstructive.interfaces.set.func_set]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.func_op2","base":"func_op2","kind":"abbrev","start":95,"body":null,"status":"ok","short":{"text":"Applies a curried two-argument function f to x and then y","status":"ok"},"long":{"text":"A parsing abbreviation for applying a function f : X ⇾ (Y ⇾ Z) to two arguments: f x is a function and is applied to y. It spells out the two coercions to maps that the application involves.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.strong_set_morphism","base":"strong_set_morphism","kind":"def","start":96,"body":null,"status":"ok","short":{"text":"The set of functions between two strong sets, those of the underlying sets","status":"ok"},"long":{"text":"The morphisms between strong sets are the functions of the underlying sets, with pointwise equality. Strength is a property of a set and imposes nothing more on functions between strong sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.id_fun","base":"id_fun","kind":"def","start":97,"body":null,"status":"ok","short":{"text":"The identity function on a set","status":"ok"},"long":{"text":"The identity map on the carrier of X, as a function X ⇾ X. It preserves equality by reflexivity of the affine implication. It is the default inhabitant of [[AffineConstructive.interfaces.set.Coerce]] X X and is its own [[AffineConstructive.interfaces.set.Inverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.prod_set_eq","base":"prod_set_eq","kind":"def","start":101,"body":null,"status":"ok","short":{"text":"Equality on pairs by the additive conjunction: x₁ = x₂ and y₁ = y₂","status":"ok"},"long":{"text":"The equality of the cartesian product: (x₁, y₁) = (x₂, y₂) when x₁ = x₂ and y₁ = y₂, with the additive conjunction. Its dual says two pairs are apart when x₁ ≠ x₂ or y₁ ≠ y₂, which is the expected apartness of a product. A proof of this equality allows using either component equation, but only one of them.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.tensor_set_eq","base":"tensor_set_eq","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"Equality on pairs by the tensor: x₁ = x₂ tensor y₁ = y₂","status":"ok"},"long":{"text":"The equality of the tensor product: (x₁, y₁) = (x₂, y₂) when x₁ = x₂ ⊠ y₁ = y₂. The tensor allows using both component equations together. Since the tensor implies the additive conjunction, this equality is finer than the cartesian one ([[AffineConstructive.interfaces.set.prod_set_eq]]). Its inequality is correspondingly weaker: refuting a tensor means that either component equation refutes the other, which is weaker than x₁ ≠ x₂ or y₁ ≠ y₂.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.prod_set_is_set","base":"prod_set_is_set","kind":"inst","start":103,"body":[104,121],"status":"ok","short":{"text":"The additive equality on pairs is an equivalence","status":"ok"},"proof":[{"text":"The three laws are checked for the additive equality on pairs, where (x₁, y₁) = (x₂, y₂) means x₁ = x₂ and y₁ = y₂ with the additive conjunction.","status":"ok","from":0,"to":1},{"text":"Reflexivity: for a pair (x, y) both conjuncts x = x and y = y hold by reflexivity.","status":"ok","from":2,"to":4},{"text":"Symmetry: the additive conjunction is monotone in each argument, so it suffices to reverse each equality separately, which symmetry does.","status":"ok","from":5,"to":7},{"text":"Transitivity: the hypothesis is a tensor of two additive conjunctions and the conclusion an additive conjunction, so each conjunct of the conclusion is proved separately from the whole hypothesis.","status":"ok","from":8,"to":10},{"text":"For the X-component, choose the first conjunct of each factor: x₁ = x₂ ⊠ x₂ = x₃, which gives x₁ = x₃ by transitivity. The additive conjunction lets the proof discard the Y-equalities here.","status":"ok","from":11,"to":13},{"text":"For the Y-component, choose the second conjunct of each factor instead, and y₁ = y₂ ⊠ y₂ = y₃ gives y₁ = y₃ by transitivity.","status":"ok","from":14,"to":17}]},{"name":"AffineConstructive.interfaces.set.tensor_set_is_set","base":"tensor_set_is_set","kind":"inst","start":122,"body":[123,135],"status":"ok","short":{"text":"The tensor equality on pairs is an equivalence","status":"ok"},"proof":[{"text":"The three laws are checked for the multiplicative equality on pairs, where (x₁, y₁) = (x₂, y₂) means x₁ = x₂ ⊠ y₁ = y₂.","status":"ok","from":0,"to":1},{"text":"Reflexivity: both factors hold by reflexivity.","status":"ok","from":2,"to":3},{"text":"Symmetry: the tensor is monotone in each factor, so each equality is reversed separately by symmetry.","status":"ok","from":4,"to":5},{"text":"Transitivity: for three pairs the hypothesis is a tensor of four equalities, two in X and two in Y, each usable once.","status":"ok","from":6,"to":7},{"text":"Reassociating and exchanging the middle factors regroups the four equalities as (x₁ = x₂ ⊠ x₂ = x₃) ⊠ (y₁ = y₂ ⊠ y₂ = y₃), so that each component's pair of equalities sits in its own factor.","status":"ok","from":8,"to":10},{"text":"Each factor now meets its own transitivity step, giving x₁ = x₃ and y₁ = y₃, and their tensor is the conclusion.","status":"ok","from":11,"to":12}]},{"name":"AffineConstructive.interfaces.set.prod_set","base":"prod_set","kind":"def","start":136,"body":null,"status":"ok","short":{"text":"The cartesian product X × Y, pairs with the additive equality","status":"ok"},"long":{"text":"The cartesian product X × Y: pairs of elements, equal when the components are equal under the additive conjunction ([[AffineConstructive.interfaces.set.prod_set_eq]]). It is the categorical product of sets: the projections are functions, and pairing two functions X ⇾ Y and X ⇾ Z gives a function into Y × Z. Its apartness is the expected disjunction of the componentwise apartnesses.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.tensor_set","base":"tensor_set","kind":"def","start":137,"body":null,"status":"ok","short":{"text":"The tensor product X ⊗ Y, pairs with the tensor equality","status":"ok"},"long":{"text":"The tensor product X ⊗ Y: pairs of elements, equal when x₁ = x₂ ⊠ y₁ = y₂ ([[AffineConstructive.interfaces.set.tensor_set_eq]]). A function out of X ⊗ Y may use the equations of both components at once. This is what a function of two arguments needs in order to preserve equality by transitivity. Composition, for example, is a function on a tensor of function sets ([[AffineConstructive.interfaces.set.scompose_fun]]). The tensor equality implies the cartesian one, so the identity of pairs is a function X ⊗ Y ⇾ X × Y but not in general the other way. The tensor set is the canonical set structure on the pair type.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.canonical:tensor_set","base":"canonical:tensor_set","kind":"canonical","start":141,"body":null,"status":"ok","short":{"text":"Unification recognises pairs from X and Y as the tensor product X ⊗ Y with its multiplicative equality, [[AffineConstructive.interfaces.set.tensor_set]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.StrongOp","base":"StrongOp","kind":"def","start":144,"body":null,"status":"ok","short":{"text":"A function out of X ⊗ Y also preserves the cartesian equality of X × Y","status":"ok"},"long":{"text":"A function f : X ⊗ Y ⇾ Z is strong when its map also preserves the cartesian equality: x₁ = x₂ and y₁ = y₂ (additively) implies f (x₁, y₁) = f (x₂, y₂). Read contrapositively, f (x₁, y₁) ≠ f (x₂, y₂) implies x₁ ≠ x₂ or y₁ ≠ y₂. This is strong extensionality of a binary operation in the usual constructive sense. Every function out of X × Y gives one out of X ⊗ Y, and strong operations are those for which the converse holds.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.strong_op","base":"strong_op","kind":"def","start":146,"body":null,"status":"ok","short":{"text":"A strong operation on X ⊗ Y, repackaged as a function on X × Y","status":"ok"},"long":{"text":"Given a function f : X ⊗ Y ⇾ Z satisfying [[AffineConstructive.interfaces.set.StrongOp]], `strong_op f` is the same map regarded as a function X × Y ⇾ Z. This turns a binary operation known to be strongly extensional into a function on the cartesian product.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.scompose_op_is_fun","base":"scompose_op_is_fun","kind":"inst","start":149,"body":[150,154],"status":"ok","short":{"text":"The composite of two functions preserves equality","status":"ok"},"proof":[{"text":"Take x₁ and x₂ in X; it is to be shown that x₁ = x₂ implies g (f x₁) = g (f x₂).","status":"ok","from":0,"to":1},{"text":"Since g is a function, f x₁ = f x₂ implies g (f x₁) = g (f x₂) ([[AffineConstructive.interfaces.set.is_fun]]), so it suffices to obtain f x₁ = f x₂, which is what f being a function gives. The implications compose, and with them their contrapositives.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.interfaces.set.scompose","base":"scompose","kind":"def","start":155,"body":null,"status":"ok","short":{"text":"Composition of functions between sets, taking the pair (g, f) to g ∘ f","status":"ok"},"long":{"text":"Composition of functions between sets: the pair (g, f) of functions Y ⇾ Z and X ⇾ Y goes to the function x ↦ g (f x) from X to Z. It takes its two arguments as a pair, so that it can be made into a function on a tensor of function sets ([[AffineConstructive.interfaces.set.scompose_fun]]). The notation g ∘ f stands for it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.scompose_is_fun","base":"scompose_is_fun","kind":"inst","start":156,"body":[157,164],"status":"ok","short":{"text":"Composition preserves the tensor equality: g₁ = g₂ tensor f₁ = f₂ implies g₁ ∘ f₁ = g₂ ∘ f₂","status":"ok"},"proof":[{"text":"Take two pairs (g₁, f₁) and (g₂, f₂). Their equality in the tensor product is the tensor of the pointwise equalities g₁ = g₂ and f₁ = f₂, and the conclusion is the pointwise equality of the composites.","status":"ok","from":0,"to":2},{"text":"Fix x in X; it remains to derive g₁ (f₁ x) = g₂ (f₂ x) from the two pointwise equalities.","status":"ok","from":3,"to":4},{"text":"Specialise the equality f₁ = f₂ at x, and pass through g₂ (f₁ x) by transitivity, so that the goal becomes g₁ (f₁ x) = g₂ (f₁ x) ⊠ g₂ (f₁ x) = g₂ (f₂ x).","status":"ok","from":5,"to":5},{"text":"The factors match one for one: g₁ = g₂ specialised at f₁ x gives the first, and f₁ x = f₂ x carried through g₂ by [[AffineConstructive.interfaces.set.is_fun]] gives the second. Each hypothesis is used once, which is why the domain carries the tensor equality.","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.interfaces.set.scompose_fun","base":"scompose_fun","kind":"def","start":165,"body":null,"status":"ok","short":{"text":"Composition as a function (Y ⇾ Z) ⊗ (X ⇾ Y) ⇾ (X ⇾ Z)","status":"ok"},"long":{"text":"Composition of functions as a function of sets, on the tensor of the two function sets. The tensor is needed because the proof of g₁ (f₁ x) = g₂ (f₂ x) uses both hypotheses: g₁ = g₂ at f₁ x, and f₁ = f₂ transported along g₂, combined by transitivity. Transitivity has a tensor hypothesis. Composition is not in general a function on the cartesian product (Y ⇾ Z) × (X ⇾ Y).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.canonical:scompose_fun","base":"canonical:scompose_fun","kind":"canonical","start":168,"body":null,"status":"ok","short":{"text":"Unification recognises composition of functions as the function [[AffineConstructive.interfaces.set.scompose_fun]] out of (Y ⇾ Z) ⊗ (X ⇾ Y)","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.Cast","base":"Cast","kind":"ind","start":171,"body":null,"status":"ok","short":{"text":"A class naming a distinguished function X ⇾ Y, written cast X Y","status":"ok"},"long":{"text":"A class naming a distinguished function X ⇾ Y. Its single field is the function itself. Resolution supplies the instance, so the function can be written `cast X Y` without naming it. In the development the curried pairing functions [[AffineConstructive.theory.set.prod_pair]] and [[AffineConstructive.theory.set.prod_pair_swap]] into the cartesian product X × Y are built on it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.Cast","base":"Cast","kind":"rec","short":{"text":"The class of a distinguished function X ⇾ Y","status":"ok"}},{"name":"AffineConstructive.interfaces.set.cast","base":"cast","kind":"proj","short":{"text":"The distinguished function X ⇾ Y of a Cast instance","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.Coerce","base":"Coerce","kind":"ind","start":173,"body":null,"status":"ok","short":{"text":"A class of coercions X ⇾ Y: functions of sets whose underlying map is the identity","status":"ok"},"long":{"text":"A class of coercions between sets. These are functions X ⇾ Y intended to have the identity on carriers as their underlying map. The identity function [[AffineConstructive.interfaces.set.id_fun]] is the default instance. One hint supplies it when X and Y are the same set, and another tries it as a last resort whenever the two sets unify.\n\nThe class lets a statement about values in Y also hold after passing to another set. [[AffineConstructive.theory.set.operation_proper_equiv]] and [[AffineConstructive.theory.set.func_proper_equiv]] state that equal maps at equal arguments give equal values, also after a coercion out of Y. The simplification lemmas of the rewriting system, such as [[AffineConstructive.tactics.simplify.base.simplify_app]] and [[AffineConstructive.tactics.simplify.base.simplify_arg]], carry a coercion in the same way.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.Coerce","base":"Coerce","kind":"rec","short":{"text":"The class of a coercion function X ⇾ Y","status":"ok"}},{"name":"AffineConstructive.interfaces.set.coerce","base":"coerce","kind":"proj","short":{"text":"The coercion function X ⇾ Y of a Coerce instance","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.Inverse","base":"Inverse","kind":"ind","start":177,"body":null,"status":"ok","short":{"text":"The class of a designated inverse function Y ⇾ X for a function f : X ⇾ Y","status":"ok"},"long":{"text":"A class attaching to a function f : X ⇾ Y a function in the opposite direction, written f⁻¹. The class asserts no laws. Those are added by [[AffineConstructive.interfaces.set.Surjective]] (f⁻¹ is a section of f) and [[AffineConstructive.interfaces.set.Bijective]]. Hints give the identity function as its own inverse and f⁻¹ ∘ g⁻¹ as the inverse of g ∘ f.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.Inverse","base":"Inverse","kind":"rec","short":{"text":"The class of a designated inverse for f","status":"ok"}},{"name":"AffineConstructive.interfaces.set.inverse","base":"inverse","kind":"proj","short":{"text":"The designated inverse f⁻¹ : Y ⇾ X of a function f","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.Injective","base":"Injective","kind":"ind","start":186,"body":null,"status":"ok","short":{"text":"A function reflects equality: f x = f y implies x = y","status":"ok"},"long":{"text":"A function f is injective when f x = f y implies x = y. As an affine implication this also says that x ≠ y implies f x ≠ f y, so f preserves inequality, or apartness for strong sets. Together with preservation of equality, the condition says that f x = f y and x = y are equivalent affine propositions.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.Injective","base":"Injective","kind":"rec","short":{"text":"The class of injective functions","status":"ok"}},{"name":"AffineConstructive.interfaces.set.injective","base":"injective","kind":"proj","short":{"text":"For an injective f, f x = f y implies x = y","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.WeaklySurjective","base":"WeaklySurjective","kind":"ind","start":187,"body":null,"status":"ok","short":{"text":"Every element of Y is a value of the map: for all y there is x with f x = y","status":"ok"},"long":{"text":"A map f from a type A into a set Y is weakly surjective when for all y there is x with f x = y, with the affine quantifiers. No section is chosen. This is surjectivity as a property, stated for maps from a bare type, where no preservation of equality is needed. Refuting it means finding y apart from every value of f.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.WeaklySurjective","base":"WeaklySurjective","kind":"rec","short":{"text":"The class of weakly surjective maps","status":"ok"}},{"name":"AffineConstructive.interfaces.set.weakly_surjective","base":"weakly_surjective","kind":"proj","short":{"text":"For a weakly surjective f, every y has some x with f x = y","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.Surjective","base":"Surjective","kind":"ind","start":188,"body":null,"status":"ok","short":{"text":"The designated inverse is a section: f ∘ f⁻¹ equals the identity of Y","status":"ok"},"long":{"text":"A function f with a designated inverse ([[AffineConstructive.interfaces.set.Inverse]]) is surjective when f ∘ f⁻¹ = id, as functions on Y. This is split surjectivity: the witness of surjectivity is the function f⁻¹, which picks a preimage of each element in a way that preserves equality. Compare [[AffineConstructive.interfaces.set.WeaklySurjective]], which asks only for the existence of preimages.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.Surjective","base":"Surjective","kind":"rec","short":{"text":"The class of functions whose designated inverse is a section","status":"ok"}},{"name":"AffineConstructive.interfaces.set.surjective","base":"surjective","kind":"proj","short":{"text":"For a surjective f, f ∘ f⁻¹ = id_fun Y","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.Bijective","base":"Bijective","kind":"rec","start":189,"body":null,"status":"ok","short":{"text":"A function with a designated inverse is both injective and surjective","status":"ok"},"long":{"text":"A function f with a designated inverse f⁻¹ is bijective when it is [[AffineConstructive.interfaces.set.Injective]] and [[AffineConstructive.interfaces.set.Surjective]] for that inverse. Then f⁻¹ is a two-sided inverse: f ∘ f⁻¹ is the identity by surjectivity, and f⁻¹ ∘ f is the identity because f (f⁻¹ (f x)) = f x and f is injective. Both components are coercions, so a bijection can be used as an injection or a surjection.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.set.bijective_injective","base":"bijective_injective","kind":"proj","short":{"text":"A bijective function is injective","status":"ok"}},{"name":"AffineConstructive.interfaces.set.bijective_surjective","base":"bijective_surjective","kind":"proj","short":{"text":"A bijective function is surjective","status":"ok"}},{"name":"AffineConstructive.interfaces.set.Build_Bijective","base":"Build_Bijective","kind":"constr","short":{"text":"Builds a bijection from injectivity and surjectivity of a function with a designated inverse","status":"ok"}}]},{"name":"AffineConstructive.interfaces.set.sum_set_eq","base":"sum_set_eq","kind":"inst","start":198,"body":null,"status":"ok","short":{"text":"The equality of the disjoint sum: componentwise within a summand, falsity across summands","status":"ok"},"long":{"text":"The equality on the disjoint union of the carriers of two sets X and Y. Two left injections are equal when their components are equal in X, two right injections when their components are equal in Y, and a left and a right injection are never equal: their equality is 𝐅. Because 𝐅 is refuted outright, elements from different summands are apart, so the sum is the coproduct of affine sets: no information about one summand's equality leaks into the other. The relation is defined by cases on the two elements, not as a combination of connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.sum_set_is_set","base":"sum_set_is_set","kind":"inst","start":199,"body":[200,210],"status":"ok","short":{"text":"The equality of the disjoint sum is an equivalence relation","status":"ok"},"proof":[{"text":"The three laws are checked for the equality of the disjoint sum, which is the given equality within each summand and falsity across them.","status":"ok","from":0,"to":1},{"text":"Reflexivity: an element of either summand is equal to itself by the reflexivity of that summand.","status":"ok","from":2,"to":3},{"text":"Symmetry: by cases on which summands the two elements lie in. Within a summand symmetry of that summand applies; across summands the hypothesis is falsity, which implies anything.","status":"ok","from":4,"to":5},{"text":"Transitivity: by cases on the summands of the three elements, eight cases.","status":"ok","from":6,"to":7},{"text":"When all three lie in the same summand, transitivity of that summand applies. In the six mixed cases at least one factor of the hypothesis is falsity, and a tensor with falsity implies anything.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.interfaces.set.sum_set","base":"sum_set","kind":"def","start":211,"body":null,"status":"ok","short":{"text":"The disjoint sum X + Y of two sets, with summandwise equality","status":"ok"},"long":{"text":"The coproduct of two affine sets: the disjoint union of their carriers, with the equality [[AffineConstructive.interfaces.set.sum_set_eq]] that compares elements of the same summand by that summand's equality and makes elements of different summands unequal. [[AffineConstructive.interfaces.set.sum_set_is_set]] supplies the equivalence axioms. It is declared canonical, so the disjoint union of two set carriers is recognised as this set wherever a set is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set.canonical:sum_set","base":"canonical:sum_set","kind":"canonical","start":213,"body":null,"status":"ok","short":{"text":"Unification recognises the disjoint sum of two carriers as the set X + Y with summandwise equality, [[AffineConstructive.interfaces.set.sum_set]]","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.relation_notation":{"page":"relation_notation.html","short":"Equality, order and strict order as affine relations, and the opposite order","summary":"This file declares the two basic relations of the development as typeclasses: [[equiv]], the equality of a type, and [[le]], its order. Each is an affine proposition on pairs, written x = y and x ≤ y, and inequality x ≠ y is the negation of equality. The strict order [[lt]] is the complement of the converse order, so x < y is (y ≤ x)ᗮ. The file also defines [[order_op]], a renaming of a type that carries the converse order and the same equality. The opposite orders, and with them the duality between the order notions, are built on this renaming in `interfaces/algebra_notation.v` and `orders/orders.v`."},"AffineConstructive.interfaces.sprop":{"page":"sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

ffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export interfaces.set interfaces.set_lambda.notation.\nRequire Import tactics.set_internalize.\n\nNotation \"'set:(' expr )\" := ltac:(set_internalize_tac expr) (only parsing, expr constr at level 200).\n\nGlobal Hint Extern 20 (SetLambdaDerivation _) => solve_SetLambda : typeclass_instances.\n\n","sentences":[{"i":0,"s":0,"e":61,"kind":"vernac","status":"ok","ms":22,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":62,"e":101,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":2,"s":103,"e":205,"kind":"vernac","status":"ok","ms":11,"messages":["fafd81aa5a891f2d"],"goals":null},{"i":3,"s":207,"e":294,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null}],"pp":{"239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","7ee0ddd10f8b2374":"[Loading ML file rocq-runtime.plugins.tauto ... done]","af331431bd614838":"[Loading ML file rocq-runtime.plugins.firstorder_core (implicit dependency) ... done]","fafd81aa5a891f2d":["Setting",{"brk":[1,0]},"notation",{"brk":[1,0]},"at",{"brk":[1,0]},"level",{"brk":[1,0]},"0."]},"defs":[],"refs":[{"s":15,"e":29,"lib":"AffineConstructive.interfaces.set","name":"","kind":"lib","local":false,"page":"set.html"},{"s":30,"e":60,"lib":"AffineConstructive.interfaces.set_lambda.notation","name":"","kind":"lib","local":false,"page":"set_lambda/notation.html"},{"s":77,"e":100,"lib":"AffineConstructive.tactics.set_internalize","name":"","kind":"lib","local":false,"page":"../tactics/set_internalize.html"},{"s":230,"e":249,"lib":"AffineConstructive.interfaces.set_lambda.notation","name":"SetLambdaDerivation","kind":"class","local":false,"m":"AffineConstructive.interfaces.set_lambda","page":"set_lambda/notation.html"}],"gloss":{"summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v.","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","items":[],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.set_lambda.notation":{"page":"set_lambda/notation.html","short":"Lambda notation for functions of affine sets, with the equality obligation as its own class","summary":"The file sets up the notation λₛ x .. y, t for writing functions between affine sets as lambda terms. Behind it are [[set_lambda]], which packages a raw map as a function of sets through [[func_make]], and [[SetLambdaDerivation]], a separate class name for [[IsFun]] that holds the obligation that each such map preserves equality. Because this obligation has its own class, the derivation rules elsewhere in set_lambda can discharge it by following the structure of the term. Two printing-only notations show lambdas that take pairs apart in their destructured form."},"AffineConstructive.tactics.set_internalize":{"page":"../tactics/set_internalize.html","short":"The set_internalize tactic: turning internal-language terms into functions of sets","summary":"This file implements `set_internalize`, a tactic that takes a term written in the internal language of affine sets and recovers the function of sets it denotes. Coercions from sets to types and from functions to maps let a term like λ x y, f y x be written directly. The tactic reads that term's syntax and builds the corresponding morphism by interpreting each typing judgment as a function out of its context. The context records how each variable may be used. A variable whose set has affirmative equality has a diagonal and may be copied; any other variable may be used at most once. The interpretation handles abstraction (by currying), application (by evaluation, or strong evaluation when the codomain is a strong set), pairs, projections, aliases introduced by let, the quantifiers ∏ and ∐, subset comprehension, and coercions between !X, X ⊗ Y and X × Y. A pair goes to the tensor product when its two components draw on disjoint resources, or overlap only in copyable ones. Otherwise it goes to the cartesian product. A resource used twice where it cannot be copied is reported as an error. The entry point `solve_SetLambda` uses the tactic to discharge the obligation that a λₛ-term preserves equality."}},"constants":null}</script>

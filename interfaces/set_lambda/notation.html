en_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export interfaces.set.\n\nDefinition SetLambdaDerivation@{u} {X Y : set@{u}} (f : X → Y) := IsFun f.\nExisting Class SetLambdaDerivation.\n\nDefinition set_lambda@{u} : ∀ {X Y : set@{u}} (f : X → Y) {H:SetLambdaDerivation f}, X ⇾ Y := @func_make.\nNotation \"'λₛ' x .. y , t\" := (set_lambda (fun x => .. (set_lambda (fun y => t)) ..))\n  (at level 10, x binder, y binder, t at level 200).\n\n(** Pretty-printing for binary destructuring lambdas at the top level.\n    When the pattern lambda is nested inside other lambdas, the recursive\n    [λ x .. y, t] form absorbs the pattern binder; the [let '(...)]\n    printing notation below recovers the destructuring in the body. *)\nNotation \"'λₛ' ' '(' a ',' b ')' ',' t\" :=\n  (set_lambda (fun pat => let p := pat in let a := proj1 p in let b := proj2 p in t))\n  (at level 10, t at level 200, only printing,\n   format \"'λₛ'  ''' '(' a ','  b ')' ','  t\").\n\n(** Pretty-printing for doubly-nested binary destructuring lambdas. *)\nNotation \"'λₛ' ' '(' '(' x1 ',' y1 ')' ',' '(' x2 ',' y2 ')' ')' ',' t\" :=\n  (set_lambda (fun pat =>\n   let z := pat in\n   let a := proj1 z in let b := proj2 z in\n   let w := a in let x1 := proj1 w in let y1 := proj2 w in\n   let v := b in let x2 := proj1 v in let y2 := proj2 v in\n   t))\n  (at level 10, t at level 200, only printing,\n   format \"'λₛ'  ''' '(' '(' x1 ','  y1 ')' ','  '(' x2 ','  y2 ')' ')' ','  t\").\n\n","sentences":[{"i":0,"s":0,"e":30,"kind":"vernac","status":"ok","ms":22,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":32,"e":106,"kind":"vernac","status":"ok","ms":11,"messages":["1f182a95aed621a9"],"goals":null},{"i":2,"s":107,"e":142,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":3,"s":144,"e":249,"kind":"vernac","status":"ok","ms":11,"messages":["7ea8923129e1ba74"],"goals":null},{"i":4,"s":250,"e":388,"kind":"vernac","status":"ok","ms":11,"messages":["b2cec9cf315c0dc6"],"goals":null},{"i":5,"s":390,"e":897,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":6,"s":899,"e":1386,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null}],"pp":{"1f182a95aed621a9":"SetLambdaDerivation is defined","239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","7ea8923129e1ba74":"set_lambda is defined","7ee0ddd10f8b2374":"[Loading ML file rocq-runtime.plugins.tauto ... done]","af331431bd614838":"[Loading ML file rocq-runtime.plugins.firstorder_core (implicit dependency) ... done]","b2cec9cf315c0dc6":"Identifier 'λₛ' now a keyword"},"defs":[{"s":43,"e":62,"kind":"def","name":"SetLambdaDerivation"},{"s":155,"e":165,"kind":"def","name":"set_lambda"}],"refs":[{"s":15,"e":29,"lib":"AffineConstructive.interfaces.set","name":"","kind":"lib","local":false,"page":"../set.html"},{"s":74,"e":77,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"../set.html"},{"s":98,"e":103,"lib":"AffineConstructive.interfaces.set","name":"IsFun","kind":"class","local":false,"page":"../set.html"},{"s":122,"e":141,"lib":"AffineConstructive.interfaces.set_lambda.notation","name":"SetLambdaDerivation","kind":"def","local":true},{"s":181,"e":184,"lib":"AffineConstructive.interfaces.set","name":"set","kind":"rec","local":false,"page":"../set.html"},{"s":205,"e":224,"lib":"AffineConstructive.interfaces.set_lambda.notation","name":"SetLambdaDerivation","kind":"class","local":true},{"s":239,"e":248,"lib":"AffineConstructive.interfaces.set","name":"func_make","kind":"constr","local":false,"page":"../set.html"},{"s":281,"e":291,"lib":"AffineConstructive.interfaces.set_lambda.notation","name":"set_lambda","kind":"def","local":true},{"s":306,"e":316,"lib":"AffineConstructive.interfaces.set_lambda.notation","name":"set_lambda","kind":"def","local":true},{"s":720,"e":730,"lib":"AffineConstructive.interfaces.set_lambda.notation","name":"set_lambda","kind":"def","local":true},{"s":768,"e":773,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":false,"page":"../prelude.html"},{"s":788,"e":793,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../prelude.html"},{"s":1048,"e":1058,"lib":"AffineConstructive.interfaces.set_lambda.notation","name":"set_lambda","kind":"def","local":true},{"s":1102,"e":1107,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":false,"page":"../prelude.html"},{"s":1122,"e":1127,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../prelude.html"},{"s":1160,"e":1165,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":false,"page":"../prelude.html"},{"s":1181,"e":1186,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../prelude.html"},{"s":1219,"e":1224,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":false,"page":"../prelude.html"},{"s":1240,"e":1245,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../prelude.html"}],"gloss":{"summary":"The file sets up the notation λₛ x .. y, t for writing functions between affine sets as lambda terms. Behind it are [[AffineConstructive.interfaces.set_lambda.notation.set_lambda]], which packages a raw map as a function of sets through [[AffineConstructive.interfaces.set.func_make]], and [[AffineConstructive.interfaces.set_lambda.notation.SetLambdaDerivation]], a separate class name for [[AffineConstructive.interfaces.set.IsFun]] that holds the obligation that each such map preserves equality. Because this obligation has its own class, the derivation rules elsewhere in set_lambda can discharge it by following the structure of the term. Two printing-only notations show lambdas that take pairs apart in their destructured form.","short":"Lambda notation for functions of affine sets, with the equality obligation as its own class","items":[{"name":"AffineConstructive.interfaces.set_lambda.notation.SetLambdaDerivation","base":"SetLambdaDerivation","kind":"def","start":1,"body":null,"status":"ok","short":{"text":"The obligation that a raw map between sets preserves equality, as a class for the λₛ notation","status":"ok"},"long":{"text":"For a map f from the carrier of X to the carrier of Y, SetLambdaDerivation f is the proposition that f preserves equality, which is exactly [[AffineConstructive.interfaces.set.IsFun]] f. In affine logic this makes f strongly extensional as well: the affine implication from x = y to f x = f y carries its contrapositive, so apartness of images reflects apartness of arguments.\n\nThe definition is a copy of [[AffineConstructive.interfaces.set.IsFun]] under a new name, declared as a class of its own. Instance resolution for the set-lambda notation therefore looks for SetLambdaDerivation rather than IsFun. That gives the development a separate place to put the derivation rules that discharge the obligation for a λₛ term by following the shape of its body, and those rules do not affect ordinary searches for IsFun.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.set_lambda.notation.set_lambda","base":"set_lambda","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"Builds a function of sets from a raw map whose preservation of equality is found by resolution","status":"ok"},"long":{"text":"Given a raw map f from X to Y and a proof that it preserves equality, set_lambda gives the function of sets X ⇾ Y. It is [[AffineConstructive.interfaces.set.func_make]] with the proof obligation stated as [[AffineConstructive.interfaces.set_lambda.notation.SetLambdaDerivation]] and left to instance resolution.\n\nThe notation λₛ x .. y, t is set_lambda nested once for each binder, so a function of several arguments is written in curried form, like an ordinary lambda term. Each layer is a morphism into a set of morphisms, and each layer brings its own equality-preservation obligation. The printing-only notations give back the destructuring form λₛ '(a, b), t, and its doubly nested version, when the body takes a pair apart with [[AffineConstructive.interfaces.prelude.proj1]] and [[AffineConstructive.interfaces.prelude.proj2]].","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."}},"constants":null}</script>

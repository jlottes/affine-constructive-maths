op := seq_refl : seqt x x.\nArguments seq_refl {A x} , [A] x.\nDefinition seq {A:Type} : A ∗ A → SProp := λ '(x,y), seqt x y.\n\nDefinition scomplement `(R:A → SProp) := λ x, ¬ R x.\nClass sSubrelation {A} (R R' : A → SProp) : SProp := ssubrelation p : R p → R' p.\nDefinition sflip `(R:A ∗ B → SProp) := λ '(x, y), R (y, x).\n\nDefinition srelation (A:Type) := A ∗ A → SProp.\n\nClass sReflexive     `(R : srelation A) : SProp := sreflexivity x : R (x, x).\nClass sIrreflexive   `(R : srelation A) : SProp := sirreflexivity x : ¬ R (x, x).\nClass sSymmetric     `(R : srelation A) : SProp := ssymmetry x y: R (x, y) → R (y, x).\nClass sTransitive    `(R : srelation A) : SProp := stransitivity x y z : R (x, y) → R (y, z) → R (x, z).\nClass sAntisymmetric {A} (eq R : srelation A) : SProp := santisymmetry x y : R (x, y) → R (y, x) → eq (x, y).\n\nRecord sEquivalence `(R : srelation A) : SProp :=\n{ #[reversible=no] sequiv_refl  :> sReflexive R\n; #[reversible=no] sequiv_sym   :> sSymmetric R\n; #[reversible=no] sequiv_trans :> sTransitive R\n}.\nExisting Class sEquivalence.\n\nRecord sPartialEquivalence `(R : srelation A) : SProp :=\n{ #[reversible=no] spartial_equiv_sym   :> sSymmetric R\n; #[reversible=no] spartial_equiv_trans :> sTransitive R\n}.\nExisting Class sPartialEquivalence.\n\nDefinition sEquivalence_is_sPartialEquivalence `(@sEquivalence A R) : sPartialEquivalence R\n  := Build_sPartialEquivalence _ _ _ _.\nCoercion sEquivalence_is_sPartialEquivalence : sEquivalence >-> sPartialEquivalence.\n\n\n","sentences":[{"i":0,"s":0,"e":35,"kind":"vernac","status":"ok","ms":16,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8"],"goals":null},{"i":1,"s":37,"e":63,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":2,"s":64,"e":101,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":3,"s":102,"e":131,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":133,"e":168,"kind":"verna faces.sprop","name":"sEquivalence","kind":"rec","local":true},{"s":2610,"e":2619,"lib":"AffineConstructive.interfaces.sprop","name":"srelation","kind":"def","local":true},{"s":2677,"e":2687,"lib":"AffineConstructive.interfaces.sprop","name":"sSymmetric","kind":"class","local":true},{"s":2733,"e":2744,"lib":"AffineConstructive.interfaces.sprop","name":"sTransitive","kind":"class","local":true},{"s":2765,"e":2784,"lib":"AffineConstructive.interfaces.sprop","name":"sPartialEquivalence","kind":"rec","local":true},{"s":2837,"e":2849,"lib":"AffineConstructive.interfaces.sprop","name":"sEquivalence","kind":"class","local":true},{"s":2857,"e":2876,"lib":"AffineConstructive.interfaces.sprop","name":"sPartialEquivalence","kind":"class","local":true},{"s":2884,"e":2909,"lib":"AffineConstructive.interfaces.sprop","name":"Build_sPartialEquivalence","kind":"constr","local":true},{"s":2919,"e":3002,"lib":"AffineConstructive.interfaces.sprop","name":"sEquivalence_is_sPartialEquivalence","kind":"def","local":true}],"gloss":{"summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes.","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","items":[{"name":"AffineConstructive.interfaces.sprop.True","base":"True","kind":"ind","start":4,"body":null,"status":"ok","short":{"text":"The true strict proposition 𝐓, with the single proof I","status":"ok"},"long":{"text":"The true proposition of the base logic: an inductive strict proposition with one constructor, [[AffineConstructive.interfaces.sprop.I]]. With `-nois` there is no standard library, so the base logic's connectives are defined here from scratch, all valued in `SProp`, where any two proofs of a proposition are equal.\n\nThe notation `𝐓` is shared with the affine truth of `Ω`; which one is meant is decided by the open scope.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.True_sind","base":"True_sind","kind":"scheme","short":{"text":"Induction on 𝐓: a property of its proofs holds of all of them once it holds of I","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.I","base":"I","kind":"constr","short":{"text":"The proof of 𝐓","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.False","base":"False","kind":"ind","start":5,"body":null,"status":"ok","short":{"text":"The false strict proposition 𝐅, with no proofs","status":"ok"},"long":{"text":"The false proposition of the base logic: an inductive strict proposition with no constructors. Its eliminators are ex falso: from a proof of 𝐅 anything follows, in any sort. Unlike most strict propositions here, 𝐅 can be eliminated into `Type`, since an empty inductive has nothing to distinguish.\n\nThe notation `𝐅` is shared with the affine falsity of `Ω`, resolved by the open scope.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.False_rect","base":"False_rect","kind":"scheme","short":{"text":"Ex falso into Type: from a proof of 𝐅, an element of any type","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.False_ind","base":"False_ind","kind":"scheme","short":{"text":"Ex falso into Prop: from a proof of 𝐅, any proposition","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.False_rec","base":"False_rec","kind":"scheme","short":{"text":"Ex falso into Set: from a proof of 𝐅, an element of any small type","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.False_sind","base":"False_sind","kind":"scheme","short":{"text":"Ex falso into SProp: from a proof of 𝐅, any strict proposition","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.not","base":"not","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"Negation ¬P in the base logic: P implies 𝐅","status":"ok"},"long":{"text":"Intuitionistic negation of a strict proposition, defined as implication into [[AffineConstructive.interfaces.sprop.False]]. It is registered with Rocq as the negation the built-in tactics should use.\n\nThis is the base-logic negation; it is not the dual `Pᗮ` of an affine proposition, which swaps the ways of proving and refuting rather than passing to an implication into falsity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.sprop.and","base":"and","kind":"rec","start":8,"body":null,"status":"ok","short":{"text":"Conjunction P ∧ Q of strict propositions","status":"ok"},"long":{"text":"Conjunction in the base logic, a record of a proof of each side with projections [[AffineConstructive.interfaces.sprop.andl]] and [[AffineConstructive.interfaces.sprop.andr]]. Being a record with primitive projections, a proof of P ∧ Q is determined by its two components (eta holds definitionally).\n\nThe notation `∧` is shared with the additive conjunction of `Ω`, resolved by the open scope.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.andl","base":"andl","kind":"proj","short":{"text":"The left component of a proof of P ∧ Q","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.andr","base":"andr","kind":"proj","short":{"text":"The right component of a proof of P ∧ Q","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.conj","base":"conj","kind":"constr","short":{"text":"Builds a proof of P ∧ Q from proofs of P and Q","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.or","base":"or","kind":"ind","start":9,"body":null,"status":"ok","short":{"text":"Disjunction P ∨ Q of strict propositions","status":"ok"},"long":{"text":"Intuitionistic disjunction in the base logic, an inductive with one constructor for each side. As a strict proposition it can only be eliminated into strict propositions: a proof of P ∨ Q yields a case analysis only when the goal is itself a strict proposition.\n\nThe notation `∨` is shared with the additive disjunction of `Ω`, resolved by the open scope.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.or_sind","base":"or_sind","kind":"scheme","short":{"text":"Case analysis on P ∨ Q into a strict proposition","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.or_introl","base":"or_introl","kind":"constr","short":{"text":"Builds P ∨ Q from a proof of P","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.or_intror","base":"or_intror","kind":"constr","short":{"text":"Builds P ∨ Q from a proof of Q","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.impl","base":"impl","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"Implication P → Q of strict propositions, as a relation on pairs","status":"ok"},"long":{"text":"Implication between strict propositions, taking its two arguments as a pair. The development writes its binary relations as predicates on a product, as equality of a set is a predicate on pairs; in that form implication is a relation on `SProp`, the order of the base logic, and can be stated reflexive and transitive with the classes below.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.sprop.iff","base":"iff","kind":"def","start":16,"body":null,"status":"ok","short":{"text":"Logical equivalence P ↔ Q of strict propositions, as a relation on pairs","status":"ok"},"long":{"text":"Equivalence in the base logic: the conjunction of the two implications, with its arguments taken as a pair so that it is a relation on `SProp` in the development's form. The notation `P ↔ Q` hides the pairing. It is distinct from the affine `⧟` on `Ω`.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.sprop.ex","base":"ex","kind":"ind","start":17,"body":null,"status":"ok","short":{"text":"The existential ∃ x, P x of the base logic","status":"ok"},"long":{"text":"Existential quantification over a type, valued in `SProp`: a proof is a witness together with a proof that it satisfies the predicate. Since the result is a strict proposition the witness cannot be extracted except toward another strict proposition, so this is the propositionally truncated existence of constructive mathematics.\n\nThis is the base-logic quantifier; the affine one, read \"there is\", is `∐`.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.ex_sind","base":"ex_sind","kind":"scheme","short":{"text":"Elimination of ∃: a strict consequence of every witness follows from the existential","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.exists","base":"exists","kind":"constr","short":{"text":"Builds ∃ x, P x from a witness and a proof that it satisfies P","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.Inhabited","base":"Inhabited","kind":"ind","start":29,"body":null,"status":"ok","short":{"text":"The class asserting that a type has an element","status":"ok"},"long":{"text":"A type is inhabited when there exists an element of it, in the truncated sense of [[AffineConstructive.interfaces.sprop.ex]]. As a class it lets resolution supply the fact wherever a nonempty carrier is needed.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.Inhabited","base":"Inhabited","kind":"rec","short":{"text":"The class asserting that a type has an element","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.inhabited","base":"inhabited","kind":"proj","short":{"text":"The existence of an element of an inhabited type","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.seqt","base":"seqt","kind":"ind","start":31,"body":null,"status":"ok","short":{"text":"Strict equality of two elements of a type, generated by reflexivity","status":"ok"},"long":{"text":"The identity type valued in `SProp`, in curried form: its one constructor [[AffineConstructive.interfaces.sprop.seq_refl]] proves x equal to itself, and its eliminator transports strict properties along it. It underlies [[AffineConstructive.interfaces.sprop.seq]], the version on pairs.\n\nThis is definitional equality in the base logic, the `≡` of the development, which rarely matters; the equality of an affine set is its own structure.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.seqt_sind","base":"seqt_sind","kind":"scheme","short":{"text":"Transport of a strict property of x along a strict equality from x","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.seq_refl","base":"seq_refl","kind":"constr","short":{"text":"Every element is strictly equal to itself","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.seq","base":"seq","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"Strict equality as a relation on pairs","status":"ok"},"long":{"text":"The strict equality [[AffineConstructive.interfaces.sprop.seqt]] taken on a pair, so that it is a relation in the development's form, a predicate on the product of a type with itself.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.sprop.scomplement","base":"scomplement","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"The pointwise negation of a strict predicate","status":"ok"},"long":{"text":"The complement of a predicate in the base logic: it holds at x when the predicate fails there, in the sense of [[AffineConstructive.interfaces.sprop.not]]. Applied to a relation, a predicate on pairs, it gives the complementary relation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.sprop.sSubrelation","base":"sSubrelation","kind":"ind","start":35,"body":null,"status":"ok","short":{"text":"The class asserting that one strict predicate implies another pointwise","status":"ok"},"long":{"text":"One predicate is a subrelation of another when every point satisfying the first satisfies the second. It is stated for predicates on any type, so applies to relations as predicates on pairs.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.sSubrelation","base":"sSubrelation","kind":"rec","short":{"text":"The class asserting that one strict predicate implies another pointwise","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.ssubrelation","base":"ssubrelation","kind":"proj","short":{"text":"The pointwise implication of a subrelation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.sflip","base":"sflip","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"The converse of a strict relation, with arguments swapped","status":"ok"},"long":{"text":"The converse of a relation between A and B, a relation between B and A holding of (y, x) when the original holds of (x, y).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.sprop.srelation","base":"srelation","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"A binary relation on A in the base logic: an SProp-valued predicate on pairs","status":"ok"},"long":{"text":"A binary relation on A in the base logic: a predicate on the product A ∗ A, valued in SProp, rather than a curried function of two arguments. Taking the pair as the single argument matches the way relations are stated throughout the development, where an equality or an order is a predicate on pairs.\n\nThe relation classes of this file are stated for it, reflexivity ([[AffineConstructive.interfaces.sprop.sReflexive]]) and its companions, and bundled into equivalence relations ([[AffineConstructive.interfaces.sprop.sEquivalence]]). The simplification relation of the rewriting system, taken on the pairs of a set, is one such relation ([[AffineConstructive.tactics.simplify.base.SimplifiesToR]]). Later files transfer the classes to the affine level, for instance that of course applied to a reflexive strict relation gives a reflexive affine relation ([[AffineConstructive.logic.relations.of_course_rel_Reflexive]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.sprop.sReflexive","base":"sReflexive","kind":"ind","start":38,"body":null,"status":"ok","short":{"text":"The class asserting that a strict relation is reflexive","status":"ok"},"long":{"text":"A relation is reflexive when every element is related to itself. This and the classes following are the base-logic counterparts of the standard relation classes, stated for relations in [[AffineConstructive.interfaces.sprop.srelation]] form.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.sReflexive","base":"sReflexive","kind":"rec","short":{"text":"The class asserting that a strict relation is reflexive","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.sreflexivity","base":"sreflexivity","kind":"proj","short":{"text":"Every element is related to itself by a reflexive relation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.sIrreflexive","base":"sIrreflexive","kind":"ind","start":39,"body":null,"status":"ok","short":{"text":"The class asserting that a strict relation is irreflexive","status":"ok"},"long":{"text":"A relation is irreflexive when no element is related to itself, negation being [[AffineConstructive.interfaces.sprop.not]] of the base logic.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.sIrreflexive","base":"sIrreflexive","kind":"rec","short":{"text":"The class asserting that a strict relation is irreflexive","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.sirreflexivity","base":"sirreflexivity","kind":"proj","short":{"text":"No element is related to itself by an irreflexive relation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.sSymmetric","base":"sSymmetric","kind":"ind","start":40,"body":null,"status":"ok","short":{"text":"The class asserting that a strict relation is symmetric","status":"ok"},"long":{"text":"A relation is symmetric when x related to y gives y related to x.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.sSymmetric","base":"sSymmetric","kind":"rec","short":{"text":"The class asserting that a strict relation is symmetric","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.ssymmetry","base":"ssymmetry","kind":"proj","short":{"text":"A symmetric relation relating x to y relates y to x","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.sTransitive","base":"sTransitive","kind":"ind","start":41,"body":null,"status":"ok","short":{"text":"The class asserting that a strict relation is transitive","status":"ok"},"long":{"text":"A relation is transitive when x related to y and y related to z give x related to z.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.sTransitive","base":"sTransitive","kind":"rec","short":{"text":"The class asserting that a strict relation is transitive","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.stransitivity","base":"stransitivity","kind":"proj","short":{"text":"A transitive relation relating x to y and y to z relates x to z","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.sAntisymmetric","base":"sAntisymmetric","kind":"ind","start":42,"body":null,"status":"ok","short":{"text":"The class asserting that a strict relation is antisymmetric with respect to a given equality","status":"ok"},"long":{"text":"A relation R is antisymmetric with respect to an equality relation when R relating x to y and y to x forces x and y to be equal. The equality is a parameter rather than fixed to strict equality, so that a preorder can be antisymmetric up to a chosen equivalence.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.sAntisymmetric","base":"sAntisymmetric","kind":"rec","short":{"text":"The class asserting that a strict relation is antisymmetric with respect to a given equality","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.santisymmetry","base":"santisymmetry","kind":"proj","short":{"text":"Elements related in both directions by an antisymmetric relation are equal","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.sEquivalence","base":"sEquivalence","kind":"rec","start":43,"body":null,"status":"ok","short":{"text":"The class asserting that a strict relation is an equivalence relation","status":"ok"},"long":{"text":"An equivalence relation in the base logic: reflexive, symmetric and transitive. The three fields are coercions, so an equivalence supplies each of the three properties to resolution; they are marked not to be reversed, so resolution does not try to assemble an equivalence from the parts.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.sequiv_refl","base":"sequiv_refl","kind":"proj","short":{"text":"The reflexivity of an equivalence relation","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.sequiv_sym","base":"sequiv_sym","kind":"proj","short":{"text":"The symmetry of an equivalence relation","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.sequiv_trans","base":"sequiv_trans","kind":"proj","short":{"text":"The transitivity of an equivalence relation","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.Build_sEquivalence","base":"Build_sEquivalence","kind":"constr","short":{"text":"Builds an equivalence relation from reflexivity, symmetry and transitivity","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.sPartialEquivalence","base":"sPartialEquivalence","kind":"rec","start":45,"body":null,"status":"ok","short":{"text":"The class asserting that a strict relation is a partial equivalence relation","status":"ok"},"long":{"text":"A partial equivalence relation in the base logic: symmetric and transitive, not necessarily reflexive. It is an equivalence relation on the elements related to themselves. As with [[AffineConstructive.interfaces.sprop.sEquivalence]], the fields are one-way coercions.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.sprop.spartial_equiv_sym","base":"spartial_equiv_sym","kind":"proj","short":{"text":"The symmetry of a partial equivalence relation","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.spartial_equiv_trans","base":"spartial_equiv_trans","kind":"proj","short":{"text":"The transitivity of a partial equivalence relation","status":"ok"}},{"name":"AffineConstructive.interfaces.sprop.Build_sPartialEquivalence","base":"Build_sPartialEquivalence","kind":"constr","short":{"text":"Builds a partial equivalence relation from symmetry and transitivity","status":"ok"}}]},{"name":"AffineConstructive.interfaces.sprop.sEquivalence_is_sPartialEquivalence","base":"sEquivalence_is_sPartialEquivalence","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"An equivalence relation is a partial equivalence relation","status":"ok"},"long":{"text":"Forgets reflexivity: the symmetry and transitivity of an equivalence relation make it a partial equivalence relation. Declared a coercion, so an equivalence can be used wherever a partial equivalence is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.sprop.coercion:sEquivalence_is_sPartialEquivalence","base":"coercion:sEquivalence_is_sPartialEquivalence","kind":"coercion","start":48,"body":null,"status":"ok","short":{"text":"Lets an SProp equivalence relation serve wherever a partial equivalence relation is asked for, through [[AffineConstructive.interfaces.sprop.sEquivalence_is_sPartialEquivalence]]","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."}},"constants":null}</script>

name":"JoinSubSemiLattice","kind":"class","local":true},{"s":6250,"e":6268,"lib":"AffineConstructive.interfaces.subalgebra","name":"MeetSubSemiLattice","kind":"class","local":true},{"s":6321,"e":6334,"lib":"AffineConstructive.interfaces.subalgebra","name":"sub_sg_closed","kind":"proj","local":true},{"s":6376,"e":6394,"lib":"AffineConstructive.interfaces.subalgebra","name":"JoinSubSemiLattice","kind":"class","local":true},{"s":6447,"e":6460,"lib":"AffineConstructive.interfaces.subalgebra","name":"sub_sg_closed","kind":"proj","local":true},{"s":6501,"e":6526,"lib":"AffineConstructive.interfaces.subalgebra","name":"MeetSubBoundedSemiLattice","kind":"class","local":true},{"s":6551,"e":6570,"lib":"AffineConstructive.interfaces.subalgebra","name":"sub_mon_unit_closed","kind":"proj","local":true},{"s":6611,"e":6636,"lib":"AffineConstructive.interfaces.subalgebra","name":"JoinSubBoundedSemiLattice","kind":"class","local":true},{"s":6661,"e":6680,"lib":"AffineConstructive.interfaces.subalgebra","name":"sub_mon_unit_closed","kind":"proj","local":true},{"s":6714,"e":6716,"lib":"AffineConstructive.interfaces.subset.notation","name":"𝒫","kind":"abbrev","local":false,"page":"subset/notation.html"},{"s":6773,"e":6780,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Lattice","kind":"class","local":false,"page":"abstract_algebra.html"},{"s":6825,"e":6843,"lib":"AffineConstructive.interfaces.subalgebra","name":"MeetSubSemiLattice","kind":"class","local":true},{"s":6884,"e":6902,"lib":"AffineConstructive.interfaces.subalgebra","name":"JoinSubSemiLattice","kind":"class","local":true},{"s":6923,"e":6933,"lib":"AffineConstructive.interfaces.subalgebra","name":"SubLattice","kind":"rec","local":true}],"gloss":{"summary":"This file defines substructures as predicates on subsets U : 𝒫 G, each packaging the ambient structure with closure conditions on U: [[AffineConstructive.interfaces.subalgebra.SubSemiGroup]] (closed under ∙), [[AffineConstructive.interfaces.subalgebra.SubMonoid]] (also containing the unit), [[AffineConstructive.interfaces.subalgebra.SubStarSemiGroup]] and [[AffineConstructive.interfaces.subalgebra.SubStarMonoid]] (closed under the involution), [[AffineConstructive.interfaces.subalgebra.SubGroup]], and [[AffineConstructive.interfaces.subalgebra.NormalSubGroup]] (closed under conjugation y ∙ x ∙ y⁻¹). Binary closure is stated with the tensor, x ∊ U ⊠ y ∊ U ⊸ x ∙ y ∊ U, so each membership is used once and the contrapositive comes with it. The generic notions are renamed for addition and multiplication, with accessors such as [[AffineConstructive.interfaces.subalgebra.sub_add_sg_closed]] and [[AffineConstructive.interfaces.subalgebra.sub_mul_one_closed]] in the ring notation, and combined into [[AffineConstructive.interfaces.subalgebra.SubNearRg]], [[AffineConstructive.interfaces.subalgebra.SubNearRig]], [[AffineConstructive.interfaces.subalgebra.SubNearRng]] and [[AffineConstructive.interfaces.subalgebra.SubNearRing]] over the near-ring structures of abstract_algebra. In the same way the meet and join semilattice versions are the semigroup and monoid notions for ⊓ and ⊔, and [[AffineConstructive.interfaces.subalgebra.SubLattice]] joins the two.","short":"Subsemigroups, submonoids, subgroups, sub-near-rings and sublattices as closure predicates on subsets","items":[{"name":"AffineConstructive.interfaces.subalgebra.e","base":"e","kind":"abbrev","start":2,"body":null,"status":"ok","short":{"text":"Local abbreviation e for the monoid unit","status":"ok"},"long":{"text":"Inside this file, e stands for the unit [[AffineConstructive.interfaces.algebra_notation.mon_unit]] of the ambient monoid. It is used only to state that a submonoid contains the unit, and it is not exported.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.SubSemiGroup","base":"SubSemiGroup","kind":"rec","start":3,"body":null,"status":"ok","short":{"text":"A subset H of a semigroup that is closed under the operation ∙","status":"ok"},"long":{"text":"A subsemigroup of a semigroup G is a subset H of G such that x ∙ y ∊ H whenever x ∊ H and y ∊ H. The record also includes the ambient [[AffineConstructive.interfaces.abstract_algebra.SemiGroup]] structure, so a subsemigroup hypothesis brings the semigroup laws of G into scope. The coercion to that structure is one-way: a semigroup is never inferred to be a subsemigroup.\n\nThe two memberships are combined by tensor, and the condition is an affine implication. The hypothesis is therefore multiplicative: each membership is used once, as with x ∊ H ⊠ x ∊ H when the two elements are the same. The implication also carries its contrapositive. Read for complemented subsets, the condition says that if x ∙ y lies outside H, then x lies outside H par y lies outside H. In words, a product that is apart from H has a factor that is apart from H.\n\nThe definition is general: it is reused as the additive and multiplicative subsemigroups of a ring and as the meet and join sub-semilattices of a lattice.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubSemiGroup_sg","base":"SubSemiGroup_sg","kind":"proj","short":{"text":"The ambient semigroup structure of a subsemigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.sub_sg_closed","base":"sub_sg_closed","kind":"proj","short":{"text":"If x and y lie in a subsemigroup H, then so does x ∙ y","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubSemiGroup","base":"Build_SubSemiGroup","kind":"constr","short":{"text":"Builds a subsemigroup from the semigroup structure and closure under ∙","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.SubMonoid","base":"SubMonoid","kind":"rec","start":6,"body":null,"status":"ok","short":{"text":"A subsemigroup of a monoid that contains the unit e","status":"ok"},"long":{"text":"A submonoid of a monoid M is a subsemigroup N ([[AffineConstructive.interfaces.subalgebra.SubSemiGroup]]) that also contains the unit e. As with a subsemigroup, the ambient [[AffineConstructive.interfaces.abstract_algebra.Monoid]] structure is part of the record. It is the common shape behind additive submonoids, which contain 0, multiplicative submonoids, which contain 1, and bounded sub-semilattices, which contain ⊤ or ⊥.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubMonoid_mon","base":"SubMonoid_mon","kind":"proj","short":{"text":"The ambient monoid structure of a submonoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubMonoid_sub_sg","base":"SubMonoid_sub_sg","kind":"proj","short":{"text":"A submonoid is a subsemigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.sub_mon_unit_closed","base":"sub_mon_unit_closed","kind":"proj","short":{"text":"The unit lies in a submonoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubMonoid","base":"Build_SubMonoid","kind":"constr","short":{"text":"Builds a submonoid from the monoid structure, a subsemigroup and membership of the unit","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.SubStarSemiGroup","base":"SubStarSemiGroup","kind":"rec","start":10,"body":null,"status":"ok","short":{"text":"A subsemigroup of a star semigroup that is closed under the involution","status":"ok"},"long":{"text":"A sub-star-semigroup of a [[AffineConstructive.interfaces.abstract_algebra.StarSemiGroup]] G is a subsemigroup H ([[AffineConstructive.interfaces.subalgebra.SubSemiGroup]]) such that x* ∊ H whenever x ∊ H. The condition is an affine implication, so it also states the dual: if x* is apart from H, then so is x.\n\nIn a group the inverse is the star operation. Closure under inverses is therefore stated once here, at the level of star semigroups, and inherited by [[AffineConstructive.interfaces.subalgebra.SubStarMonoid]] and [[AffineConstructive.interfaces.subalgebra.SubGroup]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubStarSemiGroup_ssg","base":"SubStarSemiGroup_ssg","kind":"proj","short":{"text":"The ambient star semigroup structure of a sub-star-semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubStarSemiGroup_sub_sg","base":"SubStarSemiGroup_sub_sg","kind":"proj","short":{"text":"A sub-star-semigroup is a subsemigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.sub_inv_closed","base":"sub_inv_closed","kind":"proj","short":{"text":"If x lies in a sub-star-semigroup H, then so does its involute x*","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubStarSemiGroup","base":"Build_SubStarSemiGroup","kind":"constr","short":{"text":"Builds a sub-star-semigroup from the star semigroup structure, a subsemigroup and closure under the involution","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.SubStarMonoid","base":"SubStarMonoid","kind":"rec","start":14,"body":null,"status":"ok","short":{"text":"A subset of a star monoid that is both a submonoid and a sub-star-semigroup","status":"ok"},"long":{"text":"A sub-star-monoid of a [[AffineConstructive.interfaces.abstract_algebra.StarMonoid]] M is a subset N that is a submonoid ([[AffineConstructive.interfaces.subalgebra.SubMonoid]]) and a sub-star-semigroup ([[AffineConstructive.interfaces.subalgebra.SubStarSemiGroup]]). It is closed under the operation and the involution and contains the unit. It adds no conditions of its own and serves as the step from submonoids to subgroups.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubStarMonoid_ssg","base":"SubStarMonoid_ssg","kind":"proj","short":{"text":"The ambient star monoid structure of a sub-star-monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubStarMonoid_sub_mon","base":"SubStarMonoid_sub_mon","kind":"proj","short":{"text":"A sub-star-monoid is a submonoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubStarMonoid_sub_ssg","base":"SubStarMonoid_sub_ssg","kind":"proj","short":{"text":"A sub-star-monoid is a sub-star-semigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubStarMonoid","base":"Build_SubStarMonoid","kind":"constr","short":{"text":"Builds a sub-star-monoid from the star monoid structure, a submonoid and a sub-star-semigroup","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.SubGroup","base":"SubGroup","kind":"rec","start":16,"body":null,"status":"ok","short":{"text":"A subgroup: a subset of a group closed under ∙ and inverses and containing the unit","status":"ok"},"long":{"text":"A subgroup of a [[AffineConstructive.interfaces.abstract_algebra.Group]] G is a subset H that is a sub-star-monoid ([[AffineConstructive.interfaces.subalgebra.SubStarMonoid]]) for the group's operation, unit and inverse. The closure conditions are those of [[AffineConstructive.interfaces.subalgebra.sub_sg_closed]], [[AffineConstructive.interfaces.subalgebra.sub_mon_unit_closed]] and [[AffineConstructive.interfaces.subalgebra.sub_inv_closed]]. Each closure condition is an affine implication, so a subgroup is also co-closed: if a product is apart from H, then a factor is apart from H, and if x⁻¹ is apart from H, then so is x.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubGroup_grp","base":"SubGroup_grp","kind":"proj","short":{"text":"The ambient group structure of a subgroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubGroup_sub_sm","base":"SubGroup_sub_sm","kind":"proj","short":{"text":"A subgroup is a sub-star-monoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubGroup","base":"Build_SubGroup","kind":"constr","short":{"text":"Builds a subgroup from the group structure and a sub-star-monoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.NormalSubGroup","base":"NormalSubGroup","kind":"rec","start":19,"body":null,"status":"ok","short":{"text":"A normal subgroup: a subgroup closed under conjugation by every element of G","status":"ok"},"long":{"text":"A normal subgroup of a group G is a subgroup H ([[AffineConstructive.interfaces.subalgebra.SubGroup]]) such that x ∊ H implies y ∙ x ∙ y⁻¹ ∊ H for all y in G. The quantifier is the affine for-all, placed after the implication: one hypothesis x ∊ H yields membership of every conjugate. Read dually, if some conjugate of x is apart from H, then x is apart from H.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.NormalSubGroup_sub_grp","base":"NormalSubGroup_sub_grp","kind":"proj","short":{"text":"A normal subgroup is a subgroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.normality","base":"normality","kind":"proj","short":{"text":"If x lies in a normal subgroup H, then every conjugate y ∙ x ∙ y⁻¹ lies in H","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_NormalSubGroup","base":"Build_NormalSubGroup","kind":"constr","short":{"text":"Builds a normal subgroup from a subgroup and closure under conjugation","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveSubSemiGroup","base":"AdditiveSubSemiGroup","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"A subset closed under addition: a subsemigroup for +","status":"ok"},"long":{"text":"An additive subsemigroup is a [[AffineConstructive.interfaces.subalgebra.SubSemiGroup]] for the addition of X. It is declared as a class of its own so that, on a ring, instance resolution keeps it apart from the multiplicative subsemigroup on the same set. The ambient structure it carries is an [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComSemiGroup]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveSubMonoid","base":"AdditiveSubMonoid","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"A subset closed under addition and containing 0: a submonoid for + and 0","status":"ok"},"long":{"text":"An additive submonoid is a [[AffineConstructive.interfaces.subalgebra.SubMonoid]] for the addition and zero of X, declared as a separate class to keep additive and multiplicative structure apart. It is the additive part of a [[AffineConstructive.interfaces.subalgebra.SubNearRg]] and a [[AffineConstructive.interfaces.subalgebra.SubNearRig]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveSubGroup","base":"AdditiveSubGroup","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"A subset closed under addition and negation and containing 0: a subgroup for +","status":"ok"},"long":{"text":"An additive subgroup is a [[AffineConstructive.interfaces.subalgebra.SubGroup]] for the addition, zero and negation of X. Commutativity is not assumed, matching [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]]. It is the additive part of a [[AffineConstructive.interfaces.subalgebra.SubNearRng]] and a [[AffineConstructive.interfaces.subalgebra.SubNearRing]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveNormalSubGroup","base":"AdditiveNormalSubGroup","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"A normal subgroup for +: an additive subgroup closed under conjugation y + x − y","status":"ok"},"long":{"text":"An additive normal subgroup is a [[AffineConstructive.interfaces.subalgebra.NormalSubGroup]] for the addition, zero and negation of X. Addition need not be commutative, as in a near-ring, so normality is a real condition here and not automatic.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.MultiplicativeSubSemiGroup","base":"MultiplicativeSubSemiGroup","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"A subset closed under multiplication: a subsemigroup for ·","status":"ok"},"long":{"text":"A multiplicative subsemigroup is a [[AffineConstructive.interfaces.subalgebra.SubSemiGroup]] for the multiplication of X. It is declared as a separate class so that instance resolution can tell it from the additive one on the same ring. It is the multiplicative part of a [[AffineConstructive.interfaces.subalgebra.SubNearRg]] and a [[AffineConstructive.interfaces.subalgebra.SubNearRng]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.MultiplicativeSubMonoid","base":"MultiplicativeSubMonoid","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"A subset closed under multiplication and containing 1: a submonoid for · and 1","status":"ok"},"long":{"text":"A multiplicative submonoid is a [[AffineConstructive.interfaces.subalgebra.SubMonoid]] for the multiplication and unit of X. It is the multiplicative part of a [[AffineConstructive.interfaces.subalgebra.SubNearRig]] and a [[AffineConstructive.interfaces.subalgebra.SubNearRing]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveSubMonoid_sg","base":"AdditiveSubMonoid_sg","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"An additive submonoid is an additive subsemigroup","status":"ok"},"long":{"text":"Restates [[AffineConstructive.interfaces.subalgebra.SubMonoid_sub_sg]] for the additive classes, as a coercion between the additive classes.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveSubGroup_sub_mon","base":"AdditiveSubGroup_sub_mon","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"An additive subgroup is an additive submonoid","status":"ok"},"long":{"text":"The step from [[AffineConstructive.interfaces.subalgebra.AdditiveSubGroup]] to [[AffineConstructive.interfaces.subalgebra.AdditiveSubMonoid]], passing through the sub-star-monoid underlying a subgroup. It is a coercion, so additive subgroups can be used wherever additive submonoids are expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveNormalSubGroup_sub_grp","base":"AdditiveNormalSubGroup_sub_grp","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"An additive normal subgroup is an additive subgroup","status":"ok"},"long":{"text":"Restates [[AffineConstructive.interfaces.subalgebra.NormalSubGroup_sub_grp]] for the additive classes, as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveSubSemiGroup_sg","base":"AdditiveSubSemiGroup_sg","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"The ambient set of an additive subsemigroup is an additive semigroup","status":"ok"},"long":{"text":"Extracts the ambient [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComSemiGroup]] from an [[AffineConstructive.interfaces.subalgebra.AdditiveSubSemiGroup]] hypothesis, as a coercion. This lets the associativity of + be used wherever an additive subsemigroup is assumed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveSubMonoid_mon","base":"AdditiveSubMonoid_mon","kind":"def","start":39,"body":null,"status":"ok","short":{"text":"The ambient set of an additive submonoid is an additive monoid","status":"ok"},"long":{"text":"Extracts the ambient [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid]] from an [[AffineConstructive.interfaces.subalgebra.AdditiveSubMonoid]] hypothesis, as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.AdditiveSubGroup_grp","base":"AdditiveSubGroup_grp","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"The ambient set of an additive subgroup is an additive group","status":"ok"},"long":{"text":"Extracts the ambient [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]] from an [[AffineConstructive.interfaces.subalgebra.AdditiveSubGroup]] hypothesis, as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.MultiplicativeSubMonoid_sg","base":"MultiplicativeSubMonoid_sg","kind":"def","start":41,"body":null,"status":"ok","short":{"text":"A multiplicative submonoid is a multiplicative subsemigroup","status":"ok"},"long":{"text":"Restates [[AffineConstructive.interfaces.subalgebra.SubMonoid_sub_sg]] for the multiplicative classes, as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.MultiplicativeSubSemiGroup_sg","base":"MultiplicativeSubSemiGroup_sg","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"The ambient set of a multiplicative subsemigroup is a multiplicative semigroup","status":"ok"},"long":{"text":"Extracts the ambient [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup]] from a [[AffineConstructive.interfaces.subalgebra.MultiplicativeSubSemiGroup]] hypothesis, as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.MultiplicativeSubMonoid_mon","base":"MultiplicativeSubMonoid_mon","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"The ambient set of a multiplicative submonoid is a multiplicative monoid","status":"ok"},"long":{"text":"Extracts the ambient [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid]] from a [[AffineConstructive.interfaces.subalgebra.MultiplicativeSubMonoid]] hypothesis, as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_add_sg_closed","base":"sub_add_sg_closed","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"An additive subsemigroup is closed under addition: x ∊ U and y ∊ U imply x + y ∊ U","status":"ok"},"long":{"text":"The closure condition of an [[AffineConstructive.interfaces.subalgebra.AdditiveSubSemiGroup]], restated with the additive notation: from x ∊ U ⊠ y ∊ U follows x + y ∊ U. Since an additive subsemigroup is by definition a [[AffineConstructive.interfaces.subalgebra.SubSemiGroup]] for the operation +, this is [[AffineConstructive.interfaces.subalgebra.sub_sg_closed]] read for that instance.\n\nThe two memberships are combined by the tensor, so each is used once. Being an affine implication, the condition carries its contrapositive: if x + y is apart from U, then x is apart from U par y is apart from U.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_mul_sg_closed","base":"sub_mul_sg_closed","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"If x and y lie in a multiplicative subsemigroup U, then so does x · y","status":"ok"},"long":{"text":"[[AffineConstructive.interfaces.subalgebra.sub_sg_closed]] restated with · for a [[AffineConstructive.interfaces.subalgebra.MultiplicativeSubSemiGroup]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_add_zero_closed","base":"sub_add_zero_closed","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"0 lies in an additive submonoid","status":"ok"},"long":{"text":"[[AffineConstructive.interfaces.subalgebra.sub_mon_unit_closed]] restated with 0 for an [[AffineConstructive.interfaces.subalgebra.AdditiveSubMonoid]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_mul_one_closed","base":"sub_mul_one_closed","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"1 lies in a multiplicative submonoid","status":"ok"},"long":{"text":"[[AffineConstructive.interfaces.subalgebra.sub_mon_unit_closed]] restated with 1 for a [[AffineConstructive.interfaces.subalgebra.MultiplicativeSubMonoid]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_add_neg_closed","base":"sub_add_neg_closed","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"If x lies in an additive subgroup U, then so does −x","status":"ok"},"long":{"text":"[[AffineConstructive.interfaces.subalgebra.sub_inv_closed]] restated with negation for an [[AffineConstructive.interfaces.subalgebra.AdditiveSubGroup]]. Dually, if −x is apart from U, then so is x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRg","base":"SubNearRg","kind":"rec","start":50,"body":null,"status":"ok","short":{"text":"A sub-near-rg: an additive submonoid that is also a multiplicative subsemigroup of a near-rg","status":"ok"},"long":{"text":"A sub-near-rg of a [[AffineConstructive.interfaces.abstract_algebra.NearRg]] R is a subset S that contains 0 and is closed under + and ·. In other words, it is an [[AffineConstructive.interfaces.subalgebra.AdditiveSubMonoid]] and a [[AffineConstructive.interfaces.subalgebra.MultiplicativeSubSemiGroup]] at once. The ambient near-rg structure is part of the record. This is the weakest of the four ring-like substructures; the others add a unit, negation or both.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubNearRg_near_rg","base":"SubNearRg_near_rg","kind":"proj","short":{"text":"The ambient near-rg structure of a sub-near-rg","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRg_sub_add_mon","base":"SubNearRg_sub_add_mon","kind":"proj","short":{"text":"A sub-near-rg is an additive submonoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRg_sub_mul_sg","base":"SubNearRg_sub_mul_sg","kind":"proj","short":{"text":"A sub-near-rg is a multiplicative subsemigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubNearRg","base":"Build_SubNearRg","kind":"constr","short":{"text":"Builds a sub-near-rg from the near-rg structure, an additive submonoid and a multiplicative subsemigroup","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRig","base":"SubNearRig","kind":"rec","start":52,"body":null,"status":"ok","short":{"text":"A sub-near-rig: an additive and multiplicative submonoid of a near-rig","status":"ok"},"long":{"text":"A sub-near-rig of a [[AffineConstructive.interfaces.abstract_algebra.NearRig]] R is a subset S that contains 0 and 1 and is closed under + and ·. In other words, it is an [[AffineConstructive.interfaces.subalgebra.AdditiveSubMonoid]] and a [[AffineConstructive.interfaces.subalgebra.MultiplicativeSubMonoid]] at once, with the ambient near-rig structure carried in the record.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubNearRig_near_rig","base":"SubNearRig_near_rig","kind":"proj","short":{"text":"The ambient near-rig structure of a sub-near-rig","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRig_sub_add_mon","base":"SubNearRig_sub_add_mon","kind":"proj","short":{"text":"A sub-near-rig is an additive submonoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRig_sub_mul_mon","base":"SubNearRig_sub_mul_mon","kind":"proj","short":{"text":"A sub-near-rig is a multiplicative submonoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubNearRig","base":"Build_SubNearRig","kind":"constr","short":{"text":"Builds a sub-near-rig from the near-rig structure, an additive submonoid and a multiplicative submonoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRng","base":"SubNearRng","kind":"rec","start":54,"body":null,"status":"ok","short":{"text":"A sub-near-rng: an additive subgroup that is also a multiplicative subsemigroup of a near-rng","status":"ok"},"long":{"text":"A sub-near-rng of a [[AffineConstructive.interfaces.abstract_algebra.NearRng]] R is a subset S that contains 0 and is closed under +, negation and ·. In other words, it is an [[AffineConstructive.interfaces.subalgebra.AdditiveSubGroup]] and a [[AffineConstructive.interfaces.subalgebra.MultiplicativeSubSemiGroup]] at once, with the ambient near-rng structure carried in the record.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubNearRng_near_rng","base":"SubNearRng_near_rng","kind":"proj","short":{"text":"The ambient near-rng structure of a sub-near-rng","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRng_sub_add_grp","base":"SubNearRng_sub_add_grp","kind":"proj","short":{"text":"A sub-near-rng is an additive subgroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRng_sub_mul_sg","base":"SubNearRng_sub_mul_sg","kind":"proj","short":{"text":"A sub-near-rng is a multiplicative subsemigroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubNearRng","base":"Build_SubNearRng","kind":"constr","short":{"text":"Builds a sub-near-rng from the near-rng structure, an additive subgroup and a multiplicative subsemigroup","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRing","base":"SubNearRing","kind":"rec","start":56,"body":null,"status":"ok","short":{"text":"A sub-near-ring: an additive subgroup that is also a multiplicative submonoid of a near-ring","status":"ok"},"long":{"text":"A sub-near-ring of a [[AffineConstructive.interfaces.abstract_algebra.NearRing]] R is a subset S that contains 0 and 1 and is closed under +, negation and ·. In other words, it is an [[AffineConstructive.interfaces.subalgebra.AdditiveSubGroup]] and a [[AffineConstructive.interfaces.subalgebra.MultiplicativeSubMonoid]] at once. This is the strongest of the four ring-like substructures in the file.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubNearRing_near_ring","base":"SubNearRing_near_ring","kind":"proj","short":{"text":"The ambient near-ring structure of a sub-near-ring","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRing_sub_add_grp","base":"SubNearRing_sub_add_grp","kind":"proj","short":{"text":"A sub-near-ring is an additive subgroup","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubNearRing_sub_mul_mon","base":"SubNearRing_sub_mul_mon","kind":"proj","short":{"text":"A sub-near-ring is a multiplicative submonoid","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubNearRing","base":"Build_SubNearRing","kind":"constr","short":{"text":"Builds a sub-near-ring from the near-ring structure, an additive subgroup and a multiplicative submonoid","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subalgebra.MeetSubSemiLattice","base":"MeetSubSemiLattice","kind":"def","start":58,"body":null,"status":"ok","short":{"text":"A subset closed under binary meets: a subsemigroup for ⊓","status":"ok"},"long":{"text":"A meet sub-semilattice is a [[AffineConstructive.interfaces.subalgebra.SubSemiGroup]] for the meet of L. A meet semilattice is a semigroup under ⊓, so no new record is needed. It is declared as a class of its own so that resolution keeps it apart from the join structure on the same set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.MeetSubBoundedSemiLattice","base":"MeetSubBoundedSemiLattice","kind":"def","start":59,"body":null,"status":"ok","short":{"text":"A subset closed under binary meets and containing ⊤: a submonoid for ⊓ and ⊤","status":"ok"},"long":{"text":"A bounded meet sub-semilattice is a [[AffineConstructive.interfaces.subalgebra.SubMonoid]] for the meet and top of L, so it is closed under all finite meets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.JoinSubSemiLattice","base":"JoinSubSemiLattice","kind":"def","start":60,"body":null,"status":"ok","short":{"text":"A subset closed under binary joins: a subsemigroup for ⊔","status":"ok"},"long":{"text":"A join sub-semilattice is a [[AffineConstructive.interfaces.subalgebra.SubSemiGroup]] for the join of L. It is the dual of [[AffineConstructive.interfaces.subalgebra.MeetSubSemiLattice]] and is declared as a separate class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.JoinSubBoundedSemiLattice","base":"JoinSubBoundedSemiLattice","kind":"def","start":61,"body":null,"status":"ok","short":{"text":"A subset closed under binary joins and containing ⊥: a submonoid for ⊔ and ⊥","status":"ok"},"long":{"text":"A bounded join sub-semilattice is a [[AffineConstructive.interfaces.subalgebra.SubMonoid]] for the join and bottom of L, so it is closed under all finite joins.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.MeetSubBoundedSemiLattice_sl","base":"MeetSubBoundedSemiLattice_sl","kind":"def","start":66,"body":null,"status":"ok","short":{"text":"A bounded meet sub-semilattice is a meet sub-semilattice","status":"ok"},"long":{"text":"Restates [[AffineConstructive.interfaces.subalgebra.SubMonoid_sub_sg]] for the meet classes, as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.JoinSubBoundedSemiLattice_sl","base":"JoinSubBoundedSemiLattice_sl","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"A bounded join sub-semilattice is a join sub-semilattice","status":"ok"},"long":{"text":"Restates [[AffineConstructive.interfaces.subalgebra.SubMonoid_sub_sg]] for the join classes, as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_meet_closed","base":"sub_meet_closed","kind":"def","start":68,"body":null,"status":"ok","short":{"text":"If x and y lie in a meet sub-semilattice U, then so does x ⊓ y","status":"ok"},"long":{"text":"[[AffineConstructive.interfaces.subalgebra.sub_sg_closed]] restated with ⊓ for a [[AffineConstructive.interfaces.subalgebra.MeetSubSemiLattice]]. Dually, if x ⊓ y is apart from U, then x is apart from U par y is apart from U.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_join_closed","base":"sub_join_closed","kind":"def","start":69,"body":null,"status":"ok","short":{"text":"If x and y lie in a join sub-semilattice U, then so does x ⊔ y","status":"ok"},"long":{"text":"[[AffineConstructive.interfaces.subalgebra.sub_sg_closed]] restated with ⊔ for a [[AffineConstructive.interfaces.subalgebra.JoinSubSemiLattice]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_top_closed","base":"sub_top_closed","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"⊤ lies in a bounded meet sub-semilattice","status":"ok"},"long":{"text":"[[AffineConstructive.interfaces.subalgebra.sub_mon_unit_closed]] restated with ⊤ for a [[AffineConstructive.interfaces.subalgebra.MeetSubBoundedSemiLattice]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.sub_bot_closed","base":"sub_bot_closed","kind":"def","start":71,"body":null,"status":"ok","short":{"text":"A bounded join-subsemilattice contains the bottom element: ⊥ ∊ U","status":"ok"},"long":{"text":"The bottom condition of a [[AffineConstructive.interfaces.subalgebra.JoinSubBoundedSemiLattice]], stated with lattice notation: the bottom element ⊥ of L belongs to U. A bounded join-subsemilattice is by definition a [[AffineConstructive.interfaces.subalgebra.SubMonoid]] for the join with unit ⊥, so this is [[AffineConstructive.interfaces.subalgebra.sub_mon_unit_closed]] read for that instance, under the name of the lattice condition; [[AffineConstructive.interfaces.subalgebra.sub_top_closed]] is its counterpart for meets.\n\nIts uses are in the bornology files, topology.bornology.subspace and topology.unif_born.open_immersion, where proofs cite it to obtain that the bottom element lies in a bounded join-subsemilattice.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subalgebra.SubLattice","base":"SubLattice","kind":"rec","start":72,"body":null,"status":"ok","short":{"text":"A sublattice: a subset of a lattice closed under both meet and join","status":"ok"},"long":{"text":"A subset U of a lattice L is a sublattice when it is a meet-subsemilattice and a join-subsemilattice at once. The record packs the ambient [[AffineConstructive.interfaces.abstract_algebra.Lattice]] structure on L with the two closure conditions: for x and y in U, x ⊓ y and x ⊔ y are in U, each condition an affine implication from the tensor x ∊ U ⊠ y ∊ U ([[AffineConstructive.interfaces.subalgebra.sub_meet_closed]], [[AffineConstructive.interfaces.subalgebra.sub_join_closed]]). Because these are affine implications, each condition also carries its contrapositive: if x ⊓ y lies outside U then x or y does, read with par.\n\nNothing is required of top or bottom; a bounded sublattice would also ask for ⊤ and ⊥ through [[AffineConstructive.interfaces.subalgebra.MeetSubBoundedSemiLattice]] and [[AffineConstructive.interfaces.subalgebra.JoinSubBoundedSemiLattice]]. As with the algebraic subobjects earlier in the file, the definition reuses the semigroup machinery: each half is a [[AffineConstructive.interfaces.subalgebra.SubSemiGroup]] for the corresponding operation.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subalgebra.SubLattice_lattice","base":"SubLattice_lattice","kind":"proj","short":{"text":"The ambient lattice structure on L of a sublattice","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubLattice_meet","base":"SubLattice_meet","kind":"proj","short":{"text":"A sublattice is closed under meet: the meet-subsemilattice part of a sublattice","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.SubLattice_join","base":"SubLattice_join","kind":"proj","short":{"text":"A sublattice is closed under join: the join-subsemilattice part of a sublattice","status":"ok"}},{"name":"AffineConstructive.interfaces.subalgebra.Build_SubLattice","base":"Build_SubLattice","kind":"constr","short":{"text":"Builds a sublattice from a lattice structure and closure of the subset under meet and join","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.subset":{"page":"subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."}},"constants":null}</script>

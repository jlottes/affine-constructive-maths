t_T (subset_set _)) (@is_subset _)\n   (@pair (subset _) (subset _) x y)) (only parsing) : set_scope.\nNotation \"x ⊆ y\" := (@le _ is_subset (x, y)) (only printing) : set_scope.\n\nLemma subset_apply {X:set} (x:X) (U V : 𝒫 X) : x ∊ U ⊠ U ⊆ V ⊸ x ∊ V.\nProof. change (U ⊆ V) with (∏ x, x ∊ U ⊸ x ∊ V). rew (all_lb _ x). exact (aprod_mp_r _ _). Qed.\n\nImport projection_notation.\n\nDefinition empty_subset X : 𝒫 X := { x : X | 𝐅 }.\nDefinition full_subset  X : 𝒫 X := { x : X | 𝐓 }.\nNotation \"⌈ X ⌉\" := (full_subset X) (at level 0, format \"⌈ X ⌉\") : subset_scope.\n\nDefinition singleton {X} : X ⇾ 𝒫 X := set:(λ x:X, { y:X | x = y }).\n\nDefinition intersection {X} : 𝒫 X × 𝒫 X ⇾ 𝒫 X := set:(λ '(U, V) : 𝒫 X × 𝒫 X, { x | x ∊ U ∧ x ∊ V }).\nDefinition union        {X} : 𝒫 X × 𝒫 X ⇾ 𝒫 X := set:(λ '(U, V) : 𝒫 X × 𝒫 X, { x | x ∊ U ∨ x ∊ V }).\nDefinition complement   {X} : 𝒫 X ⇾ 𝒫 X := set:(λ U : 𝒫 X, { x | x ∊̸ U }).\n\nGlobal Hint Extern 1 (Inverse (@complement ?X)) => refine (@complement X) : typeclass_instances.\n\nNotation \"∅\" := (@bottom (subset_set _) (empty_subset _)) : set_scope.\nNotation \"U 'ᗮ'\" := (complement U) (at level 1, left associativity) : subset_scope.\n\n\nGlobal Hint Extern 1 (Bottom (subset_set ?X)) => refine (empty_subset X) : typeclass_instances.\nGlobal Hint Extern 1 (Top    (subset_set ?X)) => refine (full_subset  X) : typeclass_instances.\nGlobal Hint Extern 1 (Meet (subset_set ?X)) => refine (@intersection X ∘ tensor_to_prod _ _) : typeclass_instances.\nGlobal Hint Extern 1 (Join (subset_set ?X)) => refine (@union X ∘ tensor_to_prod _ _) : typeclass_instances.\n\nGlobal Hint Extern 1 (apos (_ ∊ full_subset _)) => refine sprop.I : typeclass_instances.\nGlobal Hint Extern 1 (apos (_ ∊ @top _ (full_subset _))) => refine sprop.I : typeclass_instances.\nGlobal Hint Extern 1 (apos (?y ∊ func_op (@singleton ?X) ?x)) => change (x = y :> X)  : typeclass_instances.\n\nDefinition mult_intersection {X} : 𝒫 X ⊗ 𝒫 X ⇾ 𝒫 X := λₛ '(U, V), { x : X | ∐ y, x = y ⊠ y ∊ U ⊠ y ∊ V }.\nDefinition mult_union        {X} : 𝒫 X ⊗ 𝒫 X ⇾ 𝒫 X := λₛ '(U, V), { x : X | ∏ y, x = y ⊸ y ∊ U ⊞ y ∊ V }.\nNotation \"U ⨶ V\" := (func_op mult_intersection (@pair (𝒫 _) (𝒫 _) U V)) (at level 54, left associativity) : subset_scope.\n\nDefinition tensor_subset@{u} {X Y:set@{u}} := set:(λ '(U, V) : 𝒫 X ⊗ 𝒫 Y, { '(x, y) : X ⊗ Y | x ∊ U ⊠ y ∊ V }).\nDefinition prod_subset@{u}   {X Y:set@{u}} := set:(λ '(U, V) : 𝒫 X × 𝒫 Y, { '(x, y) : X × Y | x ∊ U ∧ y ∊ V }).\nNotation \"U ⊗ V\" := (func_op tensor_subset (@pair (𝒫 _) (𝒫 _) U V)) (only parsing) : subset_scope.\nNotation \"U × V\" := (func_op prod_subset   (@pair (𝒫 _) (𝒫 _) U V)) (only parsing) : subset_scope.\nNotation \"U ⊗ V\" := (func_op tensor_subset (U, V)) (only printing) : subset_scope.\nNotation \"U × V\" := (func_op prod_subset   (U, V)) (only printing) : subset_scope.\n\n#[global] Hint Extern 2 (apos ((_, _) ∊ func_op tensor_subset (_, _))) => split : typeclass_instances.\n#[global] Hint Extern 2 (apos ((_, _) ∊ func_op prod_subset (_, _))) => split : typeclass_instances.\n\n(** Relations *)\n\nDefinition id_rel X := { '(x,y) : X ⊗ X | x = y }.\n\nDefinition compose_rel@{u} {X Y Z : set@{u}}\n  := set:(λ '(R, S) : 𝒫 (X ⊗ Y) ⊗ 𝒫 (Y ⊗ Z), { '(x, z) : X ⊗ Z | ∐ y, (x, y) ∊ R ⊠ (y, z) ∊ S}).\nNotation \"R ⋄ S\" := (func_op compose_rel (@pair (𝒫 _) (𝒫 _) R S)) (only parsing) : set_scope.\nNotation \"R ⋄ S\" := (func_op compose_rel (R, S)) (only printing) : set_scope.\nNotation \"(⋄)\" := compose_rel (only parsing) : set_scope.\n\nDefinition flip@{u} {X Y : set@{u}} := set:(λ R : 𝒫 (X ⊗ Y), { '(y, x) : Y ⊗ X | (x, y) ∊ R }).\nDeclare Scope rel_inv_scope.\nNotation \"R ⁻¹\" := (flip R) (at level 1, left associativity, format \"R ⁻¹\") : rel_inv_scope.\n\n#[global] Hint Extern 2 (SgOp (subset_set (_ ⊗ _))) => refine compose_rel : typeclass_instances.\n#[global] Hint Extern 2 (MonUnit (subset_set (_ ⊗ _))) => refine (id_rel _) : typeclass_instances.\n#[global] Hint Extern 2 (Inv (subset_set (_ ⊗ _))) => refine flip : typeclass_instances.\n\n\n(** Image and preimage, and range *)\n\n\nDefinition preimage@{u} {X Y:set@{u}} : (X ⇾ Y) ⇾ 𝒫 Y ⇾ 𝒫 X := set:(λ (f:X ⇾ Y) (V: 𝒫 Y), { x : X | f x ∊ V } ).\nDefinition image@{u} {X Y:set@{u}} : (X → Y) ⇾ 𝒫 X ⇾ 𝒫 Y := set:(λ (f:X → Y) (U: 𝒫 X), { y : Y | ∐ x, f x = y ⊠ x ∊ U } ).\nDefinition range@{u} {A:Type@{u}} {Y:set@{u}} : (A → Y) ⇾ 𝒫 Y := set:(λ (f:A → Y), { y : Y | ∐ x, f x = y } ).\n\n(** universal_image f ≡ {y:Y | ∏ x, f x = y ⊸ x ∊ U} *)\nDefinition universal_image@{u} {X Y:set@{u}} := set:(λ (f:X → Y), complement ∘ image f ∘ complement).\n\n\nModule image_notation.\n  Notation \"f ⁎\" := (func_op image f) (at level 1, left associativity, format \"f ⁎\") : op_scope.\n  Notation \"f *\" := (func_op preimage f) (at level 1, left associativity, format \"f *\") : op_scope.\n  Notation \"f ⁎⁎\" := (f⁎ ⁎) (at level 1, no associativity, only parsing) : op_scope.\n  Notation \"f **\" := (f* *) (at level 1, no associativity, only parsing) : op_scope.\n  Notation \"∀.[ f ]\" := (func_op universal_image f) (format \"∀.[ f ]\") : op_scope.\nEnd image_notation.\n\n#[global] Hint Extern 2 (Inverse (func_op image (func_op ?f))) => refine (func_op preimage f) : typeclass_instances.\n#[global] Hint Extern 2 (Inverse (func_op preimage ?f)) => refine (func_op    image f) : typeclass_instances.\n#[global] Hint Extern 2 (Inverse (func_op universal_image (func_op ?f))) => refine (func_op preimage f) : typeclass_instances.\n\nLtac unfold_image :=\n  progress (try change (?y ∊ func_op (func_op image ?f) ?U) with (∐ x, f x = y ⊠ x ∊ U);\n            try change (?x ∊ func_op (func_op preimage ?f) ?U) with (f x ∊ U)).\n\n\n(** Define a coercion subset → set, that forgets the negative part of \"∊\". *)\nRecord subset_el `(U:𝒫 X) :=\n{ subset_pt :> set_T X\n; subset_pt_is_el : subset_pt ∊ U\n}.\nArguments subset_pt {X U} _.\nArguments subset_pt_is_el {X U} _.\n\n#[global] Hint Extern 1 (Equiv (@subset_el ?X ?U)) => refine (projected_set_eq (@subset_pt X U)) : typeclass_instances.\n#[global] Hint Extern 2 (apos (subset_pt (U:=?U) ?x ∊ ?V)) => match U with V => refine (subset_pt_is_el x) end : typeclass_instances.\n\nCanonical subset_to_set@{u} {X:set@{u}} (U:𝒫 X) := @set_make (subset_el U) (projected_set_eq subset_pt) _.\nCoercion  subset_to_set : subset >-> set.\n\n#[global] Hint Extern 1 (IsProjectedSet (set_T (subset_to_set _))) => notypeclasses refine projected_set_IsProjectedSet : typeclass_instances.\n\nCanonical Structure from_subset@{u} {X:set@{u}} (U:𝒫 X) : U ⇾ X\n  := Eval red in projected_set_project (subset_to_set U).\nDefinition from_subset_injective@{u} {X:set@{u}} {U:𝒫 X} : Injective (from_subset U)\n  := projected_set_project_injective (subset_to_set U).\nGlobal Hint Extern 2 (Injective (from_subset _)) => simple notypeclasses refine from_subset_injective : typeclass_instances.\n#[global] Hint Extern 2 (apos (func_op (from_subset ?U) ?x ∊ ?V)) => match U with V => refine (subset_pt_is_el x) end : typeclass_instances.\n\n(** Congruence through the [subset_pt] coercion for the properness search.\n    [subset_pt] is a primitive projection, so a [Proj] node is not an\n    application and the generic [?f ?x] upgrade hints in orders/maps.v and\n    theory/set.v can never match it; upgrade explicitly to the canonical\n    [from_subset] morphism and let those hints descend. *)\n#[global] Hint Extern 4 (apos (subset_pt ?x ≤ subset_pt ?y)) =>\n  change (apos (func_op (from_subset _) x ≤ func_op (from_subset _) y)) : proper.\n#[global] Hint Extern 4 (apos (subset_pt ?x = subset_pt ?y)) =>\n  change (apos (func_op (from_subset _) x = func_op (from_subset _) y)) : proper.\n\nDefinition to_subset `{U:𝒫 X} x {el:x ∊ U} : U := {| subset_pt := x ; subset_pt_is_el := el |}.\n\nLemma singleton_inhabited {X:set} {x:X} : sprop.Inhabited (subset_to_set (singleton x)).\nProof. exists (to_subset x). constructor. Qed.\n#[global] Hint Extern 1 (sprop.Inhabited (set_T (subset_to_set (func_op singleton _)))) => simple notypeclasses refine singleton_inhabited : typeclass_instances.\n\n\n(** restrictions of maps *)\n\nClass MapsInto@{u} {A:Type@{u}} {Y:set@{u}} (f:A → Y) (V : 𝒫 Y) : SProp := maps_into x : f x ∊ V.\nArguments maps_into {_ _} f V {_} x.\n#[global] Hint Extern 19 (apos (?f ?x ∊ ?V)) => simple notypeclasses refine (maps_into f V x) : typeclass_instances.\n\nLemma corestrict_is_fun@{u} {X Y:set@{u}} {f:X ⇾ Y} {V:𝒫 Y} {H:MapsInto f V} : @IsFun X V (λ x, to_subset (f x)).\nProof. intros x y. exact (is_fun f x y). Qed.\n\nDefinition corestrict@{u} {X Y:set@{u}} (f:X ⇾ Y) (V:𝒫 Y) {H:MapsInto f V} : X ⇾ V := @func_make X V (λ x, to_subset (f x)) corestrict_is_fun.\n\n(** MapsTo f U V ≣ U ⊆ f* V *)\nClass MapsTo@{u} {X Y:set@{u}} (f:X ⇾ Y) (U : 𝒫 X) (V : 𝒫 Y) : SProp := maps_to x : x ∊ U ⊸ f x ∊ V.\nArguments maps_to {_ _} f U V {_} x.\n\nClass WeakMapsTo@{u} {X Y:set@{u}} (f:X ⇾ Y) (U : 𝒫 X) (V : 𝒫 Y) : SProp := weak_maps_to x : x ∊ U → f x ∊ V.\nArguments weak_maps_to {_ _} f U V {_} x.\n\nCoercion MapsTo_WeakMapsTo@{u} {X Y:set@{u}} `{@MapsTo X Y f U V} : WeakMapsTo f U V\n  := λ x, aimpl_impl_pos (maps_to f U V x).\n\nCoercion WeaksMapsTo_MapsInto `{@WeakMapsTo X Y f U V} : MapsInto (f ∘ from_subset U) V\n  := λ u, H u (subset_pt_is_el u).\n\nDefinition restrict@{u} {X Y} f U V `{@WeakMapsTo@{u} X Y f U V} : U ⇾ V := corestrict (f ∘ from_subset U) V.\n\n(** A map maps its preimage of [V] into [V], definitionally; so [restrict f (f* V) V]\n    needs no side condition. *)\nDefinition preimage_maps_to@{u} {X Y:set@{u}} (f:X ⇾ Y) (V:𝒫 Y) : MapsTo f (func_op2 preimage f V) V\n  := λ x, aimpl_refl _.\n#[global] Hint Extern 2 (MapsTo _ ?U _) =>\n  lazymatch U with func_op2 preimage _ _ => simple notypeclasses refine (preimage_maps_to _ _) end : typeclass_instances.\n#[global] Hint Extern 2 (WeakMapsTo _ ?U _) =>\n  lazymatch U with func_op2 preimage _ _ => simple notypeclasses refine (MapsTo_WeakMapsTo (H:=preimage_maps_to _ _)) end : typeclass_instances.\n#[global] Hint Extern 2 (MapsInto ?fc _) =>\n  lazymatch fc with _ ∘ from_subset (func_op2 preimage _ _) => simple notypeclasses refine (WeaksMapsTo_MapsInto (H:=MapsTo_WeakMapsTo (H:=preimage_maps_to _ _))) end : typeclass_instances.\n\n(** Iterated powerset *)\n\nDefinition double_subset (X:set) := 𝒫 (𝒫 X).\nNotation \"𝒫²\" := double_subset.\n#[global] Hint Extern 1 (Le (double_subset _)) => unfold double_subset : typeclass_instances.\n\nDefinition powerset_el {X:set} : 𝒫² X → Type := @subset_el (𝒫 X).\nDefinition powerset_pt `(A:@powerset_el X F) : 𝒫 X := subset_pt A.\n#[reversible] Coercion powerset_pt : powerset_el >-> subset.\nCoercion powerset_el : double_subset >-> Sortclass.\n#[global] Hint Extern 2 (apos (powerset_pt (F:=?F) ?x ∊ ?F)) => refine (subset_pt_is_el x) : typeclass_instances.\n\n#[global] Hint Extern 1 (Equiv (@powerset_el ?X ?F)) => refine (projected_set_eq (@powerset_pt X F)) : typeclass_instances.\n\nCanonical Structure powerset_pt_fun `(F:𝒫² X) : F ⇾ 𝒫 X := @func_make F (𝒫 X) powerset_pt (from_subset F).\n\nCanonical double_subset_to_set `(F:𝒫² X) := @set_make (powerset_el F) (projected_set_eq powerset_pt) _.\nCoercion double_subset_to_set : double_subset >-> set.\nIdentity Coercion double_subset_subset : double_subset >-> subset.\n\n\n#[global] Hint Extern 50 => real_progress ltac:(fun _ => match goal with |- context [ double_subset_to_set ?F ] =>\n  change (double_subset_to_set F) with (subset_to_set F) end) : typeclass_instances.\n#[global] Hint Extern 50 => real_progress ltac:(fun _ => match goal with |- context [ double_subset_to_set ?F ] =>\n  change (double_subset_to_set F) with (subset_to_set F) end) : proper.\n  \n","sentences":[{"i":0,"s":0,"e":64,"kind":"vernac","status":"ok","ms":26,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":65,"e":92,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":93,"e":135,"kind":"vernac","status":"ok","ms":11 "e":12176,"lib":"AffineConstructive.interfaces.subset","name":"powerset_pt","kind":"def","local":true},{"s":12178,"e":12189,"lib":"AffineConstructive.interfaces.subset","name":"from_subset","kind":"canonstruc","local":true},{"s":12241,"e":12249,"lib":"AffineConstructive.interfaces.set","name":"set_make","kind":"constr","local":false,"page":"set.html"},{"s":12251,"e":12262,"lib":"AffineConstructive.interfaces.subset","name":"powerset_el","kind":"def","local":true},{"s":12267,"e":12283,"lib":"AffineConstructive.theory.projected_set","name":"projected_set_eq","kind":"def","local":false,"page":"../theory/projected_set.html"},{"s":12284,"e":12295,"lib":"AffineConstructive.interfaces.subset","name":"powerset_pt","kind":"def","local":true},{"s":12300,"e":12353,"lib":"AffineConstructive.interfaces.subset","name":"double_subset_to_set","kind":"canonstruc","local":true},{"s":12510,"e":12530,"lib":"AffineConstructive.interfaces.subset","name":"double_subset_to_set","kind":"canonstruc","local":true},{"s":12549,"e":12569,"lib":"AffineConstructive.interfaces.subset","name":"double_subset_to_set","kind":"canonstruc","local":true},{"s":12579,"e":12592,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":true},{"s":12710,"e":12730,"lib":"AffineConstructive.interfaces.subset","name":"double_subset_to_set","kind":"canonstruc","local":true},{"s":12749,"e":12769,"lib":"AffineConstructive.interfaces.subset","name":"double_subset_to_set","kind":"canonstruc","local":true},{"s":12779,"e":12792,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":true},{"s":737,"e":740,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":928,"e":931,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1629,"e":1632,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[AffineConstructive.interfaces.subset.from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[AffineConstructive.interfaces.subset.MapsInto]], [[AffineConstructive.interfaces.subset.MapsTo]] and [[AffineConstructive.interfaces.subset.WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way.","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","items":[{"name":"AffineConstructive.interfaces.subset.element","base":"element","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"Membership x ∊ U, as a function from X ⊗ 𝒫 X to affine propositions","status":"ok"},"long":{"text":"A subset U of a set X is an affine predicate on X, and membership x ∊ U is the value of U at x. The membership relation is packaged here as a function of sets from the tensor product X ⊗ 𝒫 X to Ω, so that it respects equality in both arguments at once: equal points and equal subsets give equivalent memberships, with the two equalities consumed multiplicatively. Since x ∊ U is an affine proposition, it carries both an affirmation of membership and a refutation, the latter written x ∊̸ U.\n\nEvery other notion of the file is built from this relation: inclusion, the lattice operations on subsets, images and preimages, and the set of members of a subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.equal_element","base":"equal_element","kind":"prf","start":10,"body":[11,14],"status":"ok","short":{"text":"If x = y and x ∊ U, tensored, then y ∊ U","status":"ok"},"proof":[{"text":"Curry the tensor, then use that U is a function on X: the equality x = y gives the equality of truth values U x = U y. What is left is that this equality of affine propositions, with x ∊ U, gives y ∊ U.","status":"ok","from":0,"to":1},{"text":"An equality of affine propositions is a biconditional, and its first conjunct, the implication U x ⊸ U y, is what is wanted. The additive conjunction lets the proof take that half and discard the other.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.interfaces.subset.member_apart_nonmember","base":"member_apart_nonmember","kind":"prf","start":15,"body":[16,21],"status":"ok","short":{"text":"A member of U and a nonmember of U are apart: x ∊ U tensor y ∊̸ U implies x ≠ y","status":"ok"},"proof":[{"text":"Pass to the contrapositive. The dual of x ∊ U ⊠ y ∊̸ U is the par x ∊̸ U ⊞ y ∊ U, and a par with a negated first factor is an implication, so the goal becomes: x = y implies that x ∊ U implies y ∊ U.","status":"ok","from":0,"to":2},{"text":"Uncurried, this says that x = y and x ∊ U give y ∊ U, which is [[AffineConstructive.interfaces.subset.equal_element]].","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.interfaces.subset.is_subset","base":"is_subset","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"Inclusion U ⊆ V: for all x, x ∊ U implies x ∊ V","status":"ok"},"long":{"text":"Inclusion of subsets is the affine proposition ∏ x, x ∊ U ⊸ x ∊ V. Because the implication is affine, an inclusion carries its contrapositive: every nonmember of V is a nonmember of U. Its refutation is a point that is in U and not in V.\n\nThis relation is installed as the order on 𝒫 X, so that the order-theoretic vocabulary (filters, ideals, meets, joins, top and bottom) applies to subsets, and is written U ⊆ V.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.subset_apply","base":"subset_apply","kind":"prf","start":27,"body":[28,32],"status":"ok","short":{"text":"Membership passes along an inclusion: x ∊ U tensor U ⊆ V implies x ∊ V","status":"ok"},"proof":[{"text":"Unfold the inclusion U ⊆ V to its definition, the statement that every member of U is a member of V.","status":"ok","from":0,"to":1},{"text":"Specialise the inclusion at x, which leaves x ∊ U together with x ∊ U ⊸ x ∊ V. Modus ponens gives x ∊ V, and each hypothesis is used exactly once.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.interfaces.subset.empty_subset","base":"empty_subset","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"The empty subset ∅ of X, whose membership is falsity","status":"ok"},"long":{"text":"The empty subset ∅ = { x | 𝐅 }: no point is a member and every point is refuted to be one. It is installed as the bottom element of the inclusion order on 𝒫 X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.full_subset","base":"full_subset","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"The full subset ⌈X⌉ of X, whose membership is truth","status":"ok"},"long":{"text":"The full subset ⌈X⌉ = { x | 𝐓 }: every point is a member, trivially. It is installed as the top element of the inclusion order on 𝒫 X, and membership in it is discharged automatically.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.singleton","base":"singleton","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"The singleton {x} = { y | x = y }, as a function from X to 𝒫 X","status":"ok"},"long":{"text":"The singleton of x is the subset of points equal to x. Membership y ∊ {x} is the affine equality x = y, so its refutation is apartness when X is strong. The assignment x ↦ {x} is itself a function of sets X ⇾ 𝒫 X, which holds because equality is symmetric and transitive in the affine sense.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.intersection","base":"intersection","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"The intersection U ⊓ V = { x | x ∊ U ∧ x ∊ V }, with the additive and","status":"ok"},"long":{"text":"The intersection of two subsets uses the additive conjunction: x is in U ⊓ V when it is in U and in V, and is refuted to be when it is refuted to be in one of them. Because the conjunction is additive, x may be used for both memberships, and the operation is a function on the cartesian product 𝒫 X × 𝒫 X.\n\nIt is installed as the meet of the inclusion order. The multiplicative counterpart is [[AffineConstructive.interfaces.subset.mult_intersection]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.union","base":"union","kind":"def","start":39,"body":null,"status":"ok","short":{"text":"The union U ⊔ V = { x | x ∊ U ∨ x ∊ V }, with the additive or","status":"ok"},"long":{"text":"The union of two subsets uses the additive disjunction: x is in U ⊔ V when it is in one of them, and refuted to be when it is refuted to be in both. It is a function on the cartesian product 𝒫 X × 𝒫 X and is installed as the join of the inclusion order. The multiplicative counterpart is [[AffineConstructive.interfaces.subset.mult_union]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.complement","base":"complement","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"The complement Uᗮ = { x | x ∊̸ U }","status":"ok"},"long":{"text":"The complement of a subset negates membership, swapping its affirmation and refutation: a point is in Uᗮ exactly when it is refuted to be in U, and conversely. Since affine negation is involutive, so is the complement, and it is registered as its own designated inverse. In the translation of affine sets into intuitionistic ones, this is the swap of the two halves of a complemented subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.mult_intersection","base":"mult_intersection","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"The multiplicative intersection U ⨶ V: there is y equal to x, in U, and in V, all tensored","status":"ok"},"long":{"text":"The multiplicative intersection uses the tensor in place of the additive and. The naive predicate x ∊ U ⊠ x ∊ V would use x twice, and an equality x = y can only be spent once in affine logic, so it would not respect equality. The definition { x | ∐ y, x = y ⊠ y ∊ U ⊠ y ∊ V } repairs this by passing through a witness y: it is the smallest extensional subset containing every point whose memberships in U and V hold together.\n\nIt is written U ⨶ V and takes its arguments from the tensor product 𝒫 X ⊗ 𝒫 X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.mult_union","base":"mult_union","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"The multiplicative union: every y equal to x is in U par in V","status":"ok"},"long":{"text":"The multiplicative union uses the par, dual to the tensor. As with [[AffineConstructive.interfaces.subset.mult_intersection]], the predicate x ∊ U ⊞ x ∊ V would use x twice, so membership is defined through all points equal to x: { x | ∏ y, x = y ⊸ y ∊ U ⊞ y ∊ V }. This makes it the de Morgan dual of the multiplicative intersection under [[AffineConstructive.interfaces.subset.complement]]. It takes its arguments from the tensor product 𝒫 X ⊗ 𝒫 X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.tensor_subset","base":"tensor_subset","kind":"def","start":54,"body":null,"status":"ok","short":{"text":"The tensor pairing U ⊗ V ⊆ X ⊗ Y: pairs with x ∊ U tensor y ∊ V","status":"ok"},"long":{"text":"The tensor pairing of subsets U of X and V of Y is the subset of the tensor product X ⊗ Y whose members are the pairs (x, y) with x ∊ U ⊠ y ∊ V. It must live on the tensor product: equality there is the tensor of the component equalities, and that is exactly what is needed to transport a tensor of memberships along it. It is a function on 𝒫 X ⊗ 𝒫 Y, and is the shape of the basic entourages and neighbourhoods of products in the topology half.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.prod_subset","base":"prod_subset","kind":"def","start":55,"body":null,"status":"ok","short":{"text":"The cartesian pairing U × V ⊆ X × Y: pairs with x ∊ U and y ∊ V","status":"ok"},"long":{"text":"The cartesian pairing of subsets U of X and V of Y is the subset of the cartesian product X × Y whose members are the pairs with x ∊ U ∧ y ∊ V, using the additive and. It matches the additive equality of the cartesian product, as [[AffineConstructive.interfaces.subset.tensor_subset]] matches the multiplicative one, and is a function on 𝒫 X × 𝒫 Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.id_rel","base":"id_rel","kind":"def","start":62,"body":null,"status":"ok","short":{"text":"The identity relation on X: the diagonal { (x, y) ∊ X ⊗ X | x = y }","status":"ok"},"long":{"text":"Relations from X to Y are subsets of the tensor product X ⊗ Y. The identity relation is the diagonal, the pairs of equal points; its refutation on a pair is apartness when X is strong. It is installed as the unit of relational composition [[AffineConstructive.interfaces.subset.compose_rel]], and is the smallest entourage in a uniformity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.compose_rel","base":"compose_rel","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"The composite R ⋄ S of a relation from X to Y with a relation from Y to Z","status":"ok"},"long":{"text":"The composite of a relation R ⊆ X ⊗ Y with a relation S ⊆ Y ⊗ Z relates x to z when there is a middle point y with (x, y) ∊ R ⊠ (y, z) ∊ S. The two links are joined by the tensor, so the witness y is used once in each factor. A relation here is a subset of the tensor product, and the composite is again a subset of X ⊗ Z, so membership in it respects equality in each coordinate. Its refutation says that for every y, the two links cannot both hold: one of them is refuted.\n\nComposition is written R ⋄ S and is a function of sets in the pair (R, S). It is registered as the binary operation on relations, with the identity relation [[AffineConstructive.interfaces.subset.id_rel]] as its unit and the converse [[AffineConstructive.interfaces.subset.flip]] as its inversion, so the algebraic notation for a monoid with inverses applies to relations on a set, and in particular to the entourages of a uniformity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.flip","base":"flip","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"The converse R⁻¹ of a relation: (y, x) ∊ R⁻¹ when (x, y) ∊ R","status":"ok"},"long":{"text":"The converse of a relation from X to Y is the relation from Y to X with the pairs swapped. It is installed as the inverse operation on relations, giving the inverse entourage U⁻¹ of a uniformity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.preimage","base":"preimage","kind":"def","start":73,"body":null,"status":"ok","short":{"text":"The preimage f* V of a subset V of Y under a function f : X ⇾ Y","status":"ok"},"long":{"text":"The preimage of a subset V of Y under a function f : X ⇾ Y is the subset of X whose members are the points x with f x ∊ V; traditionally f⁻¹(V). Membership x ∊ f* V is by definition f x ∊ V, both for proving and for refuting it. The map must be a function of sets: its preservation of equality is what makes x ↦ f x ∊ V respect equality in X, so that the preimage is a subset at all.\n\nPreimage is itself a function of sets in both arguments, (X ⇾ Y) ⇾ 𝒫 Y ⇾ 𝒫 X, written f*. It is registered as the designated inverse of the image [[AffineConstructive.interfaces.subset.image]] and of the universal image [[AffineConstructive.interfaces.subset.universal_image]], and f maps f* V into V with no side condition ([[AffineConstructive.interfaces.subset.preimage_maps_to]]), so a function restricts to the preimage of any subset of its codomain.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.image","base":"image","kind":"def","start":74,"body":null,"status":"ok","short":{"text":"The image f⁎ U of a subset U of X under a map f from X to Y","status":"ok"},"long":{"text":"The image of a subset U of X under f has as members the points y of Y for which there is x with f x = y ⊠ x ∊ U; traditionally f(U). Its refutation says that every x with f x = y is refuted to be in U. The tensor joins the equation and the membership, so the witness x is used once in each. The point y occurs only in the equation f x = y, which respects equality in Y; this is what makes the image a subset, and it is why f need only be a map of carriers, not a function of sets.\n\nThe image is a function of sets in both arguments, written f⁎. It is registered as the designated inverse of the preimage [[AffineConstructive.interfaces.subset.preimage]], and composed with complements on both sides it gives the universal image [[AffineConstructive.interfaces.subset.universal_image]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.range","base":"range","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"The range of a map A → Y: the points y such that there is x with f x = y","status":"ok"},"long":{"text":"The range of a map from any type A into a set Y is the subset of values attained, up to equality: y is in the range when there is x with f x = y. It is the [[AffineConstructive.interfaces.subset.image]] of the whole domain, and is stated for an arbitrary type of indices so that it applies to families as well as to functions of sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.universal_image","base":"universal_image","kind":"def","start":76,"body":null,"status":"ok","short":{"text":"The universal image ∀.[f] U: points y such that every x with f x = y is in U","status":"ok"},"long":{"text":"The universal image is the dual of the image, obtained by conjugating it with the complement: ∀.[f] U = (f⁎ (Uᗮ))ᗮ. Unfolded, y is a member when every x with f x = y lies in U. It is right adjoint to [[AffineConstructive.interfaces.subset.preimage]], completing the chain f⁎ ⊣ f* ⊣ ∀.[f].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.unfold_image","base":"unfold_image","kind":"ltac","start":87,"body":null,"status":"ok","short":{"text":"Restates membership in an image or a preimage as the condition that defines it","status":"ok"},"long":{"text":"The tactic rewrites membership in an image or a preimage in the goal into the proposition that defines it. A membership y ∊ f⁎ U becomes ∐ x, f x = y ⊠ x ∊ U: there is a point x of U whose value is y, with the equality and the membership joined by ⊠, as in [[AffineConstructive.interfaces.subset.image]]. A membership x ∊ f* V becomes f x ∊ V, as in [[AffineConstructive.interfaces.subset.preimage]]. Both restatements are definitional, so the tactic only changes how the goal is displayed and leaves the proposition the same. The pattern is matched once for images and once for preimages. Each match fixes the function, the point and the subset, and only that membership, wherever it occurs, is restated. A goal with several different image memberships may therefore need the tactic more than once. The tactic takes no arguments and fails if neither form occurs in the goal.\n\nA proof uses it before working on the existential that an image hides, either by choosing a witness for it or by taking the point it provides, and before rewriting with a fact about f x when the goal is stated about a preimage. A plain `change` or `unfold` would do the same, but the proof would have to write out the restated goal or unfold more than these two memberships.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.subset_el","base":"subset_el","kind":"rec","start":88,"body":null,"status":"ok","short":{"text":"A member of a subset U: a point of X with an affirmation of its membership","status":"ok"},"long":{"text":"An element of the set of members of U is a point x of X together with a proof that x ∊ U holds. Only the affirmation of membership is kept; the refutation side of ∊ is forgotten. The equality between members is that of X, through the underlying point, so the result is a projected set over X.\n\nThis is how a subset is regarded as a set in its own right, through [[AffineConstructive.interfaces.subset.subset_to_set]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subset.subset_pt","base":"subset_pt","kind":"proj","short":{"text":"The underlying point of X of a member of a subset","status":"ok"}},{"name":"AffineConstructive.interfaces.subset.subset_pt_is_el","base":"subset_pt_is_el","kind":"proj","short":{"text":"The proof that the underlying point of a member lies in the subset","status":"ok"}},{"name":"AffineConstructive.interfaces.subset.Build_subset_el","base":"Build_subset_el","kind":"constr","short":{"text":"Builds a member of U from a point of X and a proof that it lies in U","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subset.subset_to_set","base":"subset_to_set","kind":"def","start":93,"body":null,"status":"ok","short":{"text":"A subset U of X regarded as a set: its members, with the equality of X","status":"ok"},"long":{"text":"Every subset is coerced to a set whose elements are the members of U ([[AffineConstructive.interfaces.subset.subset_el]]) and whose equality is that of X on the underlying points. Since only affirmations of membership are carried, this is the subobject of points known to be in U. It lets a subset appear wherever a set is expected, as the domain or codomain of a function, notably for [[AffineConstructive.interfaces.subset.restrict]] and [[AffineConstructive.interfaces.subset.corestrict]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.coercion:subset_to_set","base":"coercion:subset_to_set","kind":"coercion","start":94,"body":null,"status":"ok","short":{"text":"A subset U of X stands as a set, its members with the equality of X, through [[AffineConstructive.interfaces.subset.subset_to_set]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.from_subset","base":"from_subset","kind":"def","start":96,"body":null,"status":"ok","short":{"text":"The inclusion U ⇾ X of the members of a subset into X","status":"ok"},"long":{"text":"The canonical inclusion sends a member of U to its underlying point. It is the projection of the projected set [[AffineConstructive.interfaces.subset.subset_to_set]], hence a function of sets, and it is injective ([[AffineConstructive.interfaces.subset.from_subset_injective]]). Statements about members are moved to statements about points of X through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.from_subset_injective","base":"from_subset_injective","kind":"def","start":97,"body":null,"status":"ok","short":{"text":"The inclusion of a subset into X is injective","status":"ok"},"long":{"text":"The inclusion [[AffineConstructive.interfaces.subset.from_subset]] is injective: members of U with equal underlying points are equal, and the contrapositive holds too, since the equality on U is defined as the equality of X on underlying points. This is an instance of the general fact that the projection of a projected set is injective, and it is registered so that resolution finds it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.to_subset","base":"to_subset","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"Builds a member of U from a point x and a proof that x ∊ U","status":"ok"},"long":{"text":"The member of U with underlying point x, given an affirmation of x ∊ U. The proof of membership is left to resolution, so this is how points are lifted into a subset when the membership is evident from context.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.singleton_inhabited","base":"singleton_inhabited","kind":"prf","start":103,"body":[104,107],"status":"ok","short":{"text":"The singleton {x}, as a set, is inhabited (by x)","status":"ok"},"proof":[{"text":"Take x itself, as an element of the subset {x}. Its membership x = x holds by reflexivity, and nothing further remains to prove.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.interfaces.subset.MapsInto","base":"MapsInto","kind":"ind","start":109,"body":null,"status":"ok","short":{"text":"The class of maps f : A → Y all of whose values lie in V","status":"ok"},"long":{"text":"A map f from a type A into a set Y maps into V when every value f x is affirmed to be in V. This is a statement in the base logic, for all x, and is what is needed to restrict the codomain of f to V, by [[AffineConstructive.interfaces.subset.corestrict]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subset.MapsInto","base":"MapsInto","kind":"rec","short":{"text":"The class of maps whose values all lie in V","status":"ok"}},{"name":"AffineConstructive.interfaces.subset.maps_into","base":"maps_into","kind":"proj","short":{"text":"For f mapping into V, each value f x is in V","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subset.corestrict_is_fun","base":"corestrict_is_fun","kind":"prf","start":112,"body":[113,116],"status":"ok","short":{"text":"A function into V with its codomain restricted to V still preserves equality","status":"ok"},"proof":[{"text":"Fix x and y in X. The values f x and f y lie in V because f maps into V, and the goal is that x = y implies their equality as elements of V.","status":"ok","from":0,"to":1},{"text":"Equality in the subset V is the equality of Y, so this is the fact that f preserves equality.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.interfaces.subset.corestrict","base":"corestrict","kind":"def","start":117,"body":null,"status":"ok","short":{"text":"The corestriction X ⇾ V of a function f : X ⇾ Y that maps into V","status":"ok"},"long":{"text":"Given a function f : X ⇾ Y whose values all lie in V, its corestriction sends x to f x regarded as a member of V. It is a function of sets because equality in V is equality in Y ([[AffineConstructive.interfaces.subset.corestrict_is_fun]]). Composed with the inclusion [[AffineConstructive.interfaces.subset.from_subset]], it gives back f.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.MapsTo","base":"MapsTo","kind":"ind","start":118,"body":null,"status":"ok","short":{"text":"The class of functions f with x ∊ U implying f x ∊ V for all x","status":"ok"},"long":{"text":"A function f : X ⇾ Y maps U to V when for each x, x ∊ U ⊸ f x ∊ V; equivalently U ⊆ f* V. The implication is affine, so the statement carries its contrapositive: a point whose image is refuted to be in V is refuted to be in U. This is the stronger of the two forms of mapping a subset into another; [[AffineConstructive.interfaces.subset.WeakMapsTo]] keeps only the forward direction on affirmations.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subset.MapsTo","base":"MapsTo","kind":"rec","short":{"text":"The class of functions mapping U to V, with the affine implication","status":"ok"}},{"name":"AffineConstructive.interfaces.subset.maps_to","base":"maps_to","kind":"proj","short":{"text":"For f mapping U to V, x ∊ U implies f x ∊ V","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subset.WeakMapsTo","base":"WeakMapsTo","kind":"ind","start":120,"body":null,"status":"ok","short":{"text":"The class of functions f sending each affirmed member of U to a member of V","status":"ok"},"long":{"text":"The weak form of [[AffineConstructive.interfaces.subset.MapsTo]]: for each x, an affirmation of x ∊ U yields an affirmation of f x ∊ V, by base-logic implication, with no statement about refutations. This is all that is needed to restrict f to a function between the members of U and of V, by [[AffineConstructive.interfaces.subset.restrict]], and it follows from the affine form ([[AffineConstructive.interfaces.subset.MapsTo_WeakMapsTo]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.interfaces.subset.WeakMapsTo","base":"WeakMapsTo","kind":"rec","short":{"text":"The class of functions sending affirmed members of U into V","status":"ok"}},{"name":"AffineConstructive.interfaces.subset.weak_maps_to","base":"weak_maps_to","kind":"proj","short":{"text":"For f weakly mapping U to V, a proof of x ∊ U gives a proof of f x ∊ V","status":"ok"}}]},{"name":"AffineConstructive.interfaces.subset.MapsTo_WeakMapsTo","base":"MapsTo_WeakMapsTo","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"A function that maps U to V affinely maps it weakly","status":"ok"},"long":{"text":"The affine form of mapping U to V implies the weak form, by keeping only the forward direction of each affine implication on affirmations. It is a coercion, so every [[AffineConstructive.interfaces.subset.MapsTo]] hypothesis serves where [[AffineConstructive.interfaces.subset.WeakMapsTo]] is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.WeaksMapsTo_MapsInto","base":"WeaksMapsTo_MapsInto","kind":"def","start":123,"body":null,"status":"ok","short":{"text":"If f weakly maps U to V, then f restricted to the members of U maps into V","status":"ok"},"long":{"text":"From a weak mapping of U to V, the composite of f with the inclusion of U maps into V: each member of U has its membership proof, which f carries to a proof that the image is in V. This is the side condition of the corestriction used to define [[AffineConstructive.interfaces.subset.restrict]], and it is a coercion so that resolution supplies it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.restrict","base":"restrict","kind":"def","start":124,"body":null,"status":"ok","short":{"text":"The restriction U ⇾ V of a function f : X ⇾ Y that maps U into V","status":"ok"},"long":{"text":"Given f : X ⇾ Y sending members of U to members of V, its restriction is the function between the sets of members, defined as the corestriction to V of f composed with the inclusion of U. Only the weak form of mapping is needed. It is the square\n\n```tikzcd\nU \\arrow[r, \"\\mathrm{restrict}\\,f\"] \\arrow[d, hook] & V \\arrow[d, hook] \\\\\nX \\arrow[r, \"f\"'] & Y\n```\n\nwhich commutes on the nose.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.preimage_maps_to","base":"preimage_maps_to","kind":"def","start":125,"body":null,"status":"ok","short":{"text":"A function f maps the preimage f* V to V","status":"ok"},"long":{"text":"Membership of x in f* V is by definition f x ∊ V, so f maps f* V to V with the identity implication. It is registered so that the restriction of f to f* V and V, and the side conditions derived from it, are found without any proof obligation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.double_subset","base":"double_subset","kind":"def","start":129,"body":null,"status":"ok","short":{"text":"The sets of subsets 𝒫² X = 𝒫 (𝒫 X)","status":"ok"},"long":{"text":"The iterated powerset, the type of families of subsets of X, written 𝒫² X. Filters, uniformities, bornologies and neighbourhood systems are families of this kind. The name exists so that a family can be coerced to a set of its member subsets ([[AffineConstructive.interfaces.subset.double_subset_to_set]]) and given the inclusion order of subsets of 𝒫 X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.powerset_el","base":"powerset_el","kind":"def","start":132,"body":null,"status":"ok","short":{"text":"The members of a family F of subsets of X, as a type","status":"ok"},"long":{"text":"The members of a family F ∊ 𝒫² X, that is, the subsets of X affirmed to belong to F, each with its proof of membership. It is [[AffineConstructive.interfaces.subset.subset_el]] at 𝒫 X, under its own name, and is the type of variables U : Φ ranging over the entourages of a uniformity or the members of a filter.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.powerset_pt","base":"powerset_pt","kind":"def","start":133,"body":null,"status":"ok","short":{"text":"The underlying subset of X of a member of a family F","status":"ok"},"long":{"text":"The subset of X underlying a member of a family F ∊ 𝒫² X. It is a coercion, so a member of a filter or an entourage of a uniformity is used directly as a subset, and it is the underlying map of the inclusion of F into 𝒫 X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.coercion:powerset_pt","base":"coercion:powerset_pt","kind":"coercion","start":134,"body":null,"status":"ok","short":{"text":"A member of a family F of subsets of X stands as a subset of X, through [[AffineConstructive.interfaces.subset.powerset_pt]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.coercion:powerset_el","base":"coercion:powerset_el","kind":"coercion","start":135,"body":null,"status":"ok","short":{"text":"A family F of subsets of X stands as the type of its members, through [[AffineConstructive.interfaces.subset.powerset_el]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.powerset_pt_fun","base":"powerset_pt_fun","kind":"def","start":138,"body":null,"status":"ok","short":{"text":"The inclusion F ⇾ 𝒫 X of a set of subsets F into the powerset","status":"ok"},"long":{"text":"For a set of subsets F of X, this is the inclusion F ⇾ 𝒫 X. It sends a member of F to the subset of X that it is. Its underlying map is [[AffineConstructive.interfaces.subset.powerset_pt]]. The fact that it preserves equality comes from [[AffineConstructive.interfaces.subset.from_subset]] at F, so as a function it is the inclusion [[AffineConstructive.interfaces.subset.from_subset]] F, read through the coercion from members of F to subsets of X.\n\nIt is declared canonical. So wherever a member of a set of subsets is used as a subset at a place that needs a function of sets, unification finds this inclusion, and rewriting can pass through it. The ordering of 𝒫 X uses it in [[AffineConstructive.orders.subset.powerset_pt_fun_order_embedding]], which shows that it is an order embedding: for members A and B of F, A ⊆ B in F exactly when A ⊆ B in 𝒫 X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.double_subset_to_set","base":"double_subset_to_set","kind":"def","start":139,"body":null,"status":"ok","short":{"text":"A set of subsets F of X, regarded as a set whose elements are the members of F","status":"ok"},"long":{"text":"This turns a set of subsets F (an element of 𝒫² X) into a set. Its elements are the subsets U of X together with a proof that U ∊ F. Two elements are equal when their underlying subsets are equal in 𝒫 X. It is the same construction as [[AffineConstructive.interfaces.subset.subset_to_set]] at 𝒫 X, set up so that its elements are seen through [[AffineConstructive.interfaces.subset.powerset_pt]] as subsets of X.\n\nIt is declared as a coercion. This lets a uniformity Φ or a filter F appear wherever a set is expected, which is what allows the topology files to write U : Φ for an entourage. Hints rewrite it back to [[AffineConstructive.interfaces.subset.subset_to_set]] when resolution needs the general form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.coercion:double_subset_to_set","base":"coercion:double_subset_to_set","kind":"coercion","start":140,"body":null,"status":"ok","short":{"text":"A family F of subsets of X stands as a set whose elements are its members, through [[AffineConstructive.interfaces.subset.double_subset_to_set]]","status":"ok"},"proof":[]}],"diagrams":{"svg":{"\nU \\arrow[r, \"\\mathrm{restrict}\\,f\"] \\arrow[d, hook] & V \\arrow[d, hook] \\\\\nX \\arrow[r, \"f\"'] & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='62.104pt' height='57.385pt' viewBox='0 0 62.104 57.385'>\n<defs>\n<path id='g2-1' d='M2.83679-2.75315H3.51985C3.65925-2.75315 3.74986-2.75315 3.74986-2.90649C3.74986-3.00407 3.65925-3.00407 3.53379-3.00407H2.88558C3.04589-3.88926 3.10165-4.20988 3.15741-4.41201C3.19226-4.56535 3.3456-4.71172 3.51288-4.71172C3.51985-4.71172 3.70804-4.71172 3.84047-4.62808C3.5547-4.53747 3.53379-4.28655 3.53379-4.24473C3.53379-4.09139 3.65228-3.98684 3.81259-3.98684C4.00078-3.98684 4.20988-4.14715 4.20988-4.41201C4.20988-4.73263 3.86835-4.90688 3.51288-4.90688C3.2062-4.90688 2.86467-4.73263 2.67648-4.38413C2.53708-4.12624 2.48132-3.81259 2.33495-3.00407H1.78432C1.64492-3.00407 1.55431-3.00407 1.55431-2.85073C1.55431-2.75315 1.64492-2.75315 1.77038-2.75315H2.28616C2.27919-2.71133 1.84008-.20213 1.6728 .54366C1.63795 .697 1.51946 1.22672 1.1849 1.22672C1.17793 1.22672 1.01065 1.22672 .87822 1.14308C1.16399 1.05247 1.1849 .80155 1.1849 .75973C1.1849 .60639 1.06641 .50184 .9061 .50184C.71791 .50184 .50881 .66215 .50881 .92701C.50881 1.24066 .8364 1.42188 1.1849 1.42188C1.63098 1.42188 1.93766 .96186 2.0213 .80852C2.27222 .34153 2.43253-.51578 2.44647-.59942L2.83679-2.75315Z'/>\n<path id='g1-1' d='M2.71133-2.78103C2.58587-2.72527 2.51617-2.61375 2.51617-2.47435C2.51617-2.28616 2.6486-2.14676 2.84376-2.14676C3.03195-2.14676 3.17832-2.26525 3.17832-2.48829C3.17832-3.10862 2.20949-3.10862 2.01433-3.10862C.96883-3.10862 .32062-2.30707 .32062-1.50552C.32062-.6273 1.06641 .0697 1.97948 .0697C3.01801 .0697 3.26196-.75276 3.26196-.8364S3.17135-.92004 3.14347-.92004C3.05286-.92004 3.04589-.89913 3.01104-.80155C2.8577-.36941 2.48829-.15334 2.06312-.15334C xlink:href='#g1-4'/>\n<use x='31.797432' y='-48.378624' xlink:href='#g1-3'/>\n<use x='34.048745' y='-48.378624' xlink:href='#g1-1'/>\n<use x='37.589504' y='-48.378624' xlink:href='#g1-6'/>\n<use x='42.069064' y='-48.378624' xlink:href='#g2-1'/>\n<\/g>\n<path d='M10.79838 20.259258V36.145558' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M12.8905 20.259259C12.8905 19.681529 12.42216 19.213189 11.84443 19.213189C11.26672 19.213189 10.79838 19.681529 10.79838 20.259259' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M13.38664 33.741388C11.83366 34.217028 11.10034 35.276938 10.79838 36.344808C10.49642 35.276938 9.7631 34.217028 8.21012 33.741388' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<path d='M51.81067 20.259258V36.145558' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M53.90279 20.259259C53.90279 19.681529 53.43445 19.213189 52.85672 19.213189C52.27901 19.213189 51.81067 19.681529 51.81067 20.259259' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M54.39893 33.741388C52.84595 34.217028 52.11263 35.276938 51.81067 36.344808C51.50871 35.276938 50.77539 34.217028 49.22241 33.741388' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<path d='M19.80394 44.705698H42.92554' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M40.52135 42.117438C40.99699 43.670418 42.0569 44.403738 43.12477 44.705698C42.0569 45.007658 40.99699 45.740978 40.52135 47.293958' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 57.385)'>\n<use x='29.215072' y='-5.490007' xlink:href='#g2-1'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.projected_set":{"page":"../theory/projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.interfaces.algebra_notation":{"page":"algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.interfaces.subset.notation":{"page":"subset/notation.html","short":"Subsets 𝒫 X as functions into Ω, their equality, and comprehension notation","summary":"This file defines the powerset 𝒫 X, the type of subsets of an affine set X, as the functions from X to the affine propositions Ω, following Shulman's *Affine logic for constructive mathematics*. Since an affine proposition pairs proving with refuting, every subset comes with its complement. The canonical set [[subset_set]] gives subsets their pointwise equality. [[subset_comprehension]] supplies the notation { x | P }, which builds a subset from a predicate that respects equality, through [[func_make]]. The files that follow build membership, inclusion and the lattice operations on subsets on top of these definitions."},"AffineConstructive.interfaces.set_lambda":{"page":"set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

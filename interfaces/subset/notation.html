y destructuring subset comprehensions. *)\nNotation \"{ ' '(' '(' x1 ',' y1 ')' ',' '(' x2 ',' y2 ')' ')' : T | P }\" :=\n  (subset_comprehension (fun pat : T =>\n   let z := pat in\n   let a := proj1 z in let b := proj2 z in\n   let w := a in let x1 := proj1 w in let y1 := proj2 w in\n   let v := b in let x2 := proj1 v in let y2 := proj2 v in\n   P))\n  (only printing,\n   format \"{  ''' '(' '(' x1 ','  y1 ')' ','  '(' x2 ','  y2 ')' ')'  :  T  |  P  }\") : set_scope.\n\n\n","sentences":[{"i":0,"s":0,"e":43,"kind":"vernac","status":"ok","ms":24,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":44,"e":90,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":2,"s":92,"e":278,"kind":"vernac","status":"ok","ms":11,"messages":["9bb08d1ad1c9ae6e"],"goals":null},{"i":3,"s":279,"e":305,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":4,"s":306,"e":354,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":5,"s":355,"e":455,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":6,"s":457,"e":484,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":7,"s":485,"e":524,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":8,"s":525,"e":561,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":9,"s":563,"e":679,"kind":"vernac","status":"ok","ms":11,"messages":["94786f67f49c314c"],"goals":null},{"i":10,"s":680,"e":726,"kind":"vernac","status":"ok","ms":10,"messages":["fafd81aa5a891f2d"],"goals":null},{"i":11,"s":728,"e":836,"kind":"vernac","status":"ok","ms":12,"messages":["748a6f42192b381a"],"goals":null},{"i":12,"s":838,"e":935,"kind":"vernac","status":"ok","ms":12,"messages":["fafd81aa5a891f2d"],"goals":null},{"i":13,"s":936,"e":1053,"kind":"vernac","status":"ok","ms":12,"messages":["fafd81aa5a891f2d"],"goals":null},{"i":14,"s":1055,"e":1161,"kind":"vernac","status":"ok","m cal":true},{"s":822,"e":831,"lib":"AffineConstructive.interfaces.set","name":"func_make","kind":"constr","local":false,"page":"../set.html"},{"s":863,"e":883,"lib":"AffineConstructive.interfaces.subset.notation","name":"subset_comprehension","kind":"def","local":true},{"s":965,"e":985,"lib":"AffineConstructive.interfaces.subset.notation","name":"subset_comprehension","kind":"def","local":true},{"s":1084,"e":1104,"lib":"AffineConstructive.interfaces.subset.notation","name":"subset_comprehension","kind":"def","local":true},{"s":1281,"e":1301,"lib":"AffineConstructive.interfaces.subset.notation","name":"subset_comprehension","kind":"def","local":true},{"s":1343,"e":1348,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":false,"page":"../prelude.html"},{"s":1363,"e":1368,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../prelude.html"},{"s":1626,"e":1646,"lib":"AffineConstructive.interfaces.subset.notation","name":"subset_comprehension","kind":"def","local":true},{"s":1694,"e":1699,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":false,"page":"../prelude.html"},{"s":1714,"e":1719,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../prelude.html"},{"s":1752,"e":1757,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":false,"page":"../prelude.html"},{"s":1773,"e":1778,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../prelude.html"},{"s":1811,"e":1816,"lib":"AffineConstructive.interfaces.prelude","name":"proj1","kind":"proj","local":false,"page":"../prelude.html"},{"s":1832,"e":1837,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../prelude.html"}],"gloss":{"summary":"This file defines the powerset 𝒫 X, the type of subsets of an affine set X, as the functions from X to the affine propositions Ω, following Shulman's *Affine logic for constructive mathematics*. Since an affine proposition pairs proving with refuting, every subset comes with its complement. The canonical set [[AffineConstructive.interfaces.subset.notation.subset_set]] gives subsets their pointwise equality. [[AffineConstructive.interfaces.subset.notation.subset_comprehension]] supplies the notation { x | P }, which builds a subset from a predicate that respects equality, through [[AffineConstructive.interfaces.set.func_make]]. The files that follow build membership, inclusion and the lattice operations on subsets on top of these definitions.","short":"Subsets 𝒫 X as functions into Ω, their equality, and comprehension notation","items":[{"name":"AffineConstructive.interfaces.subset.notation.subset","base":"subset","kind":"def","start":2,"body":null,"status":"ok","short":{"text":"The type of subsets of a set X: functions from X to the affine propositions Ω","status":"ok"},"long":{"text":"A subset of an affine set X is a function of sets from X to Ω, a [[AffineConstructive.interfaces.set.func]] X Ω. This is the notion of subset in Shulman's *Affine logic for constructive mathematics*, where a subset is a map into the affine propositions. Because the map preserves equality, membership respects the equality of X. Because an affine proposition has a way of refuting as well as a way of proving, a subset also carries its complement, so in the translation into the base logic it is a complemented subset.\n\nThe definition only gives the function type a new name, and it unfolds to that type. With a separate name, coercions, notations and instances can apply to subsets without applying to every function into Ω. An identity coercion leads back to [[AffineConstructive.interfaces.set.func]], and a resolution hint finds the equality of subsets as the equality of the corresponding function set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.notation.𝒫","base":"𝒫","kind":"abbrev","start":3,"body":null,"status":"ok","short":{"text":"The powerset notation: 𝒫 X is the type of subsets of X","status":"ok"},"long":{"text":"𝒫 is an abbreviation for [[AffineConstructive.interfaces.subset.notation.subset]], so 𝒫 X is the type of subsets of X, the functions from X to the affine propositions. Throughout the development the powerset is written this way. When 𝒫 X is regarded as a set, its equality is pointwise, given by [[AffineConstructive.interfaces.subset.notation.subset_set]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.notation.subset_set","base":"subset_set","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The set of subsets of X, with pointwise equality of membership","status":"ok"},"long":{"text":"This makes the subsets of X into an affine set. Its carrier is [[AffineConstructive.interfaces.subset.notation.subset]] X, and two subsets are equal when they are equal pointwise as functions into Ω, by [[AffineConstructive.interfaces.set.func_ext_eq]]: U = V when, for every x, x ∊ U and x ∊ V are equivalent affine propositions. The proof that this is an equivalence is [[AffineConstructive.interfaces.set.func_is_set]]. Since equality in Ω is the affine biconditional, this one equality says both that the subsets have the same members and that their complements agree.\n\nThe set is declared as a canonical structure, so wherever a set is expected and 𝒫 X appears, this set is used. It is printed as 𝒫.","status":"ok"},"proof":[]},{"name":"AffineConstructive.interfaces.subset.notation.subset_comprehension","base":"subset_comprehension","kind":"def","start":11,"body":null,"status":"ok","short":{"text":"Builds the subset { x | P x } from an affine predicate that respects equality","status":"ok"},"long":{"text":"Comprehension takes a predicate f on the elements of X, with values in Ω, and returns the subset whose membership is f. A subset is a morphism of sets, so f has to respect the equality of X. That requirement is the argument SetLambdaDerivation f, which is found automatically from the syntax of the predicate. The construction itself is [[AffineConstructive.interfaces.set.func_make]].\n\nThe notations { x | P } and { x : X | P } read as comprehension. Printing-only variants show a predicate that destructures a pair, or a pair of pairs, as a comprehension over the pattern. Subsets of products, such as entourages, then print as { (x, y) | … }.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.aprop":{"page":"../aprop.html","short":"Affine propositions Ω, their connectives and quantifiers, and the affine properties of relations","summary":"The file defines Ω, the type of affine propositions: a pair of an affirmation and a refutation in SProp that cannot both hold, together with a classicality field supplied by the kernel. The field is trivial in the constructive kernel and forces decidability in the classical one. It builds the connectives from these pairs: truth and falsity, the additive ∧ and ∨, the tensor ⊠ and the par ⊞, the implication ⊸ carrying its contrapositive, the negation, ⧟, the modalities ! and ?, and the quantifiers ∏ and ∐. On top of these it defines Shulman's classes Decidable, Affirmative and Refutative, De Morgan duals, boolean decision procedures (Dec, IsDec), and the affine properties of relations. Symmetry, transitivity (with ⊠ for the multiplicative form and ∧ for the strong one), antisymmetry, totality and equivalence are each stated as an implication between affine propositions. The laws of these connectives are proved in logic/aprop.v, and the rest of the development is written in this language."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.set_lambda.notation":{"page":"../set_lambda/notation.html","short":"Lambda notation for functions of affine sets, with the equality obligation as its own class","summary":"The file sets up the notation λₛ x .. y, t for writing functions between affine sets as lambda terms. Behind it are [[set_lambda]], which packages a raw map as a function of sets through [[func_make]], and [[SetLambdaDerivation]], a separate class name for [[IsFun]] that holds the obligation that each such map preserves equality. Because this obligation has its own class, the derivation rules elsewhere in set_lambda can discharge it by following the structure of the term. Two printing-only notations show lambdas that take pairs apart in their destructured form."}},"constants":null}</script>

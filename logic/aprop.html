p.aand_true_l]]: a proved right conjunct can be dropped.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_true_l","base":"aprod_true_l","kind":"def","start":164,"body":null,"status":"ok","short":{"text":"If P holds, P ⊠ Q is equivalent to Q","status":"ok"},"long":{"text":"A proved factor of a tensor can be dropped. The direction from Q to P ⊠ Q does not consume a hypothesis. It supplies P from the external proof, which is a base-logic fact and available without limit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_true_r","base":"aprod_true_r","kind":"def","start":165,"body":null,"status":"ok","short":{"text":"If Q holds, P ⊠ Q is equivalent to P","status":"ok"},"long":{"text":"This is the mirror image of [[AffineConstructive.logic.aprop.aprod_true_l]]: a proved right factor of a tensor can be dropped.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_is_true_l","base":"aor_is_true_l","kind":"def","start":166,"body":null,"status":"ok","short":{"text":"If P holds, P ∨ Q is equivalent to truth","status":"ok"},"long":{"text":"A disjunction with a proved left disjunct is true. This is used to collapse a disjunction by rewriting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_is_true_r","base":"aor_is_true_r","kind":"def","start":167,"body":null,"status":"ok","short":{"text":"If Q holds, P ∨ Q is equivalent to truth","status":"ok"},"long":{"text":"This is the mirror image of [[AffineConstructive.logic.aprop.aor_is_true_l]], with the right disjunct proved.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_is_true_l","base":"apar_is_true_l","kind":"def","start":168,"body":null,"status":"ok","short":{"text":"If P holds, P ⊞ Q is equivalent to truth","status":"ok"},"long":{"text":"A par with a proved left disjunct is true, because the par is implied by each of its disjuncts ([[AffineConstructive.logic.aprop.aparl]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_is_true_r","base":"apar_is_true_r","kind":"def","start":169,"body":null,"status":"ok","short":{"text":"If Q holds, P ⊞ Q is equivalent to truth","status":"ok"},"long":{"text":"This is the mirror image of [[AffineConstructive.logic.aprop.apar_is_true_l]], with the right disjunct proved.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_is_false_l","base":"apar_is_false_l","kind":"def","start":170,"body":null,"status":"ok","short":{"text":"If P holds, Pᗮ ⊞ Q is equivalent to Q","status":"ok"},"long":{"text":"When P is proved, its negation is refuted, and falsity is a unit for par ([[AffineConstructive.logic.aprop.apar_unit_l]]). So Pᗮ can be dropped from the par. Since Pᗮ ⊞ Q has the same meaning as P ⊸ Q, this is modus ponens stated as an equivalence. [[AffineConstructive.logic.aprop.apar_is_false_l_dual]] states it with any De Morgan dual of P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_is_false_r","base":"apar_is_false_r","kind":"def","start":171,"body":null,"status":"ok","short":{"text":"If Q holds, P ⊞ Qᗮ is equivalent to P","status":"ok"},"long":{"text":"This is the mirror image of [[AffineConstructive.logic.aprop.apar_is_false_l]]: a refuted right disjunct can be dropped from a par.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_true_l","base":"aimpl_true_l","kind":"def","start":172,"body":null,"status":"ok","short":{"text":"Given P, the implication P ⊸ Q is equivalent to Q","status":"ok"},"long":{"text":"When P is proved, the antecedent of P ⊸ Q can be discharged: P ⊸ Q and Q are equivalent. The hypothesis is a proof of P in the base logic, so it can be used on both sides of the equivalence. Since the result is an affine equivalence, it rewrites inside any context, and it acts on refutations as well. Refuting P ⊸ Q means proving P ⊠ Qᗮ, and given P this is the same as refuting Q.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_true_r","base":"aimpl_true_r","kind":"def","start":173,"body":null,"status":"ok","short":{"text":"A proved proposition is implied by every proposition: Q gives P ⊸ Q","status":"ok"},"long":{"text":"Weakening for affine implication. An affine implication P ⊸ Q also carries its contrapositive, which turns a refutation of Q into a refutation of P. When Q is proved it cannot also be refuted, so the contrapositive holds vacuously and the forward direction needs nothing from P. [[AffineConstructive.logic.aprop.aimpl_is_true_r]] gives the same fact as an equivalence with truth, for rewriting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_is_true_r","base":"aimpl_is_true_r","kind":"def","start":174,"body":null,"status":"ok","short":{"text":"Given Q, the implication P ⊸ Q is equivalent to truth","status":"ok"},"long":{"text":"The rewriting form of [[AffineConstructive.logic.aprop.aimpl_true_r]]. Once Q is proved, an implication P ⊸ Q occurring inside a statement can be replaced by 𝐓 and then removed by the unit laws for the connective around it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_true_l","base":"aiff_true_l","kind":"def","start":175,"body":null,"status":"ok","short":{"text":"Given P, the equivalence P ⧟ Q is equivalent to Q","status":"ok"},"long":{"text":"The analogue of [[AffineConstructive.logic.aprop.aimpl_true_l]] for the affine biconditional. When P is proved, P ⧟ Q holds exactly when Q does: the direction Q ⊸ P becomes trivial and the direction P ⊸ Q reduces to Q. The equivalence also governs refutations, so a refutation of P ⧟ Q, given P, is a refutation of Q.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_true_r","base":"aiff_true_r","kind":"def","start":176,"body":null,"status":"ok","short":{"text":"Given Q, the equivalence P ⧟ Q is equivalent to P","status":"ok"},"long":{"text":"The mirror image of [[AffineConstructive.logic.aprop.aiff_true_l]]: when the right-hand side is proved, an affine biconditional reduces to its left-hand side.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_is_false_l_dual","base":"apar_is_false_l_dual","kind":"def","start":177,"body":null,"status":"ok","short":{"text":"Given P and a dual Pd of P, the par Pd ⊞ Q is equivalent to Q","status":"ok"},"long":{"text":"A proved P makes its dual false, and falsity is the unit of par, so the par of the dual with Q reduces to Q. This is [[AffineConstructive.logic.aprop.apar_is_false_l]] restated for a dual Pd supplied by [[AffineConstructive.interfaces.aprop.DeMorganDual]] rather than the literal negation Pᗮ. In practice a dual appears in normal form, with the negation pushed through the connectives, and this form lets rewriting match it as it stands.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_is_false_r_dual","base":"apar_is_false_r_dual","kind":"def","start":178,"body":null,"status":"ok","short":{"text":"Given Q and a dual Qd of Q, the par P ⊞ Qd is equivalent to P","status":"ok"},"long":{"text":"The mirror image of [[AffineConstructive.logic.aprop.apar_is_false_l_dual]]: a par whose right factor is the dual of a proved proposition reduces to its left factor. The dual is found by [[AffineConstructive.interfaces.aprop.DeMorganDual]], so it may be in normal form rather than written Qᗮ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_refl","base":"aimpl_refl","kind":"def","start":180,"body":null,"status":"ok","short":{"text":"Affine implication is reflexive: P implies P","status":"ok"},"long":{"text":"The identity implication P ⊸ P, which holds together with its contrapositive Pᗮ ⊸ Pᗮ. It is registered as the reflexivity instance for ⊸, so that `reflexivity` closes such goals and rewriting can leave a side of an implication unchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_trans","base":"aimpl_trans","kind":"def","start":181,"body":null,"status":"ok","short":{"text":"Affine implication is transitive: (P ⊸ Q) ⊠ (Q ⊸ R) implies P ⊸ R","status":"ok"},"long":{"text":"Composition of affine implications, stated internally in the development's affine sense of transitivity. The two implications are combined with the tensor, not the additive conjunction, because composition uses each of them exactly once. The statement is itself an affine implication, so it also gives the dual reading: a refutation of P ⊸ R, that is P ⊠ Rᗮ, refutes one of the two links. Registering it as the transitivity instance lets `transitivity` and rewriting chain implications.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_equiv","base":"aiff_equiv","kind":"def","start":184,"body":null,"status":"ok","short":{"text":"The affine biconditional ⧟ is an equivalence relation on affine propositions","status":"ok"},"long":{"text":"Reflexivity, symmetry and transitivity of ⧟, packaged as an [[AffineConstructive.interfaces.aprop.Equivalence]]. The hints that follow it expose each of the three properties to resolution separately. With this instance an equivalence of affine propositions can be used for rewriting, which is the principal method of proof in the development.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_subrel_aiff","base":"aimpl_subrel_aiff","kind":"def","start":189,"body":null,"status":"ok","short":{"text":"An affine equivalence P ⧟ Q gives the affine implication P ⊸ Q","status":"ok"},"long":{"text":"The biconditional is contained in implication, as a [[AffineConstructive.interfaces.aprop.Subrelation]]. Through this instance, rewriting accepts an equivalence wherever an implication is expected, for example in a positive position of a goal that is an implication.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.antisym_aimpl_aiff","base":"antisym_aimpl_aiff","kind":"prf","start":191,"body":[192,194],"status":"ok","short":{"text":"Implications P ⊸ Q and Q ⊸ P together give P ⧟ Q","status":"ok"},"proof":[{"text":"An affine equivalence P ⧟ Q is by definition the pair of implications P ⊸ Q and Q ⊸ P, so the two hypotheses are already what the conclusion asks for, and unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.aprop.aex_adj","base":"aex_adj","kind":"def","start":196,"body":null,"status":"ok","short":{"text":"An implication out of ∐ x, P x amounts to an implication P x ⊸ Q for every x","status":"ok"},"long":{"text":"The quantifier rule on the left, in the form of an adjunction: the affine existential is left adjoint to weakening. The family of implications is quantified in the base logic, since a proof is required for every x. Read backward, it lets a proof of (∐ x, P x) ⊸ Q take the x that the hypothesis provides and work with P x. The contrapositive holds automatically, because the dual of an existential is a universal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.all_adj","base":"all_adj","kind":"def","start":197,"body":null,"status":"ok","short":{"text":"An implication into ∏ x, P x amounts to an implication Q ⊸ P x for every x","status":"ok"},"long":{"text":"The quantifier rule on the right: the affine universal quantifier is right adjoint to weakening. Read backward, it reduces a goal Q ⊸ ∏ x, P x to Q ⊸ P x for an arbitrary fixed x. It is the dual of [[AffineConstructive.logic.aprop.aex_adj]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aex_ub","base":"aex_ub","kind":"def","start":198,"body":null,"status":"ok","short":{"text":"A witness gives the existential: P a implies ∐ x, P x","status":"ok"},"long":{"text":"Introduction of the affine existential: ∐ x, P x is an upper bound of the propositions P a. Rewriting backward by it chooses a as the witness for an existential goal. The contrapositive is instantiation of the dual universal quantifier.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.all_lb","base":"all_lb","kind":"def","start":199,"body":null,"status":"ok","short":{"text":"Instantiation: ∏ x, P x implies P a","status":"ok"},"long":{"text":"Elimination of the affine universal quantifier: ∏ x, P x is a lower bound of the propositions P a. Rewriting by it specialises a universal hypothesis at a. Its contrapositive is [[AffineConstructive.logic.aprop.aex_ub]] applied to the duals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.all_dual","base":"all_dual","kind":"def","start":200,"body":null,"status":"ok","short":{"text":"The dual of ∏ x, P x is ∐ x, Pd x, where each Pd x is the dual of P x","status":"ok"},"long":{"text":"De Morgan's law for the universal quantifier, as a [[AffineConstructive.interfaces.aprop.DeMorganDual]] instance: a refutation of a universal statement is a point together with a refutation at that point. The dual of each instance is found pointwise, so the dual of a quantified statement is again in normal form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aex_dual","base":"aex_dual","kind":"def","start":201,"body":null,"status":"ok","short":{"text":"The dual of ∐ x, P x is ∏ x, Pd x, where each Pd x is the dual of P x","status":"ok"},"long":{"text":"De Morgan's law for the existential quantifier, as a [[AffineConstructive.interfaces.aprop.DeMorganDual]] instance: a refutation of an existential statement refutes every instance. It is the counterpart of [[AffineConstructive.logic.aprop.all_dual]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.all_aimpl","base":"all_aimpl","kind":"def","start":204,"body":null,"status":"ok","short":{"text":"Pointwise implications pass to universals: (∏ x, P x ⊸ Q x) implies ∏ P ⊸ ∏ Q","status":"ok"},"long":{"text":"Monotonicity of the universal quantifier, stated internally: the family of implications is a single affine proposition, used once, rather than a base-logic family. The internal form matters when the pointwise implications are themselves hypotheses to be accounted for. The external form, which takes a base-logic family, is [[AffineConstructive.logic.aprop.all_proper_aimpl]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.all_aiff","base":"all_aiff","kind":"def","start":205,"body":null,"status":"ok","short":{"text":"Pointwise equivalences pass to universals: (∏ x, P x ⧟ Q x) implies ∏ P ⧟ ∏ Q","status":"ok"},"long":{"text":"The congruence of the universal quantifier for the affine biconditional, stated internally, as in [[AffineConstructive.logic.aprop.all_aimpl]]. The external form is [[AffineConstructive.logic.aprop.all_proper_aiff]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aex_aimpl","base":"aex_aimpl","kind":"def","start":206,"body":null,"status":"ok","short":{"text":"Pointwise implications pass to existentials: (∏ x, P x ⊸ Q x) implies ∐ P ⊸ ∐ Q","status":"ok"},"long":{"text":"Monotonicity of the existential quantifier, with the family of implications given as one affine universal statement. A witness for P is a witness for Q, and in the dual reading a refutation of every Q x refutes every P x. The external form is [[AffineConstructive.logic.aprop.aex_proper_aimpl]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aex_aiff","base":"aex_aiff","kind":"def","start":207,"body":null,"status":"ok","short":{"text":"Pointwise equivalences pass to existentials: (∏ x, P x ⧟ Q x) implies ∐ P ⧟ ∐ Q","status":"ok"},"long":{"text":"The congruence of the existential quantifier for the affine biconditional, stated internally. The external form is [[AffineConstructive.logic.aprop.aex_proper_aiff]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aex_frob_l","base":"aex_frob_l","kind":"def","start":208,"body":null,"status":"ok","short":{"text":"Frobenius law: P ⊠ ∐ x, Q x is equivalent to ∐ x, P ⊠ Q x","status":"ok"},"long":{"text":"Frobenius reciprocity for the affine existential and the tensor: a factor that does not depend on x can move into or out of the existential. Its main use is bookkeeping. Together with currying ([[AffineConstructive.logic.aprop.aprod_adj]]) and [[AffineConstructive.logic.aprop.aex_adj]], it exposes an existential hypothesis that sits beside other hypotheses, so that the proof can take its witness.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aex_frob_r","base":"aex_frob_r","kind":"def","start":209,"body":null,"status":"ok","short":{"text":"Frobenius law: (∐ x, P x) ⊠ Q is equivalent to ∐ x, P x ⊠ Q","status":"ok"},"long":{"text":"The Frobenius law of [[AffineConstructive.logic.aprop.aex_frob_l]] with the existential factor on the left of the tensor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.all_frob_l","base":"all_frob_l","kind":"def","start":210,"body":null,"status":"ok","short":{"text":"P ⊞ ∏ x, Q x is equivalent to ∏ x, P ⊞ Q x","status":"ok"},"long":{"text":"The dual of the Frobenius law: par distributes over the affine universal quantifier when one factor does not depend on x. It follows from [[AffineConstructive.logic.aprop.aex_frob_l]] by taking duals. It lets a goal of the form Q ⊸ P ⊞ ∏ x, … be brought to a form where the quantifier rule on the right applies.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.all_frob_r","base":"all_frob_r","kind":"def","start":211,"body":null,"status":"ok","short":{"text":"(∏ x, P x) ⊞ Q is equivalent to ∏ x, P x ⊞ Q","status":"ok"},"long":{"text":"The law of [[AffineConstructive.logic.aprop.all_frob_l]] with the universal factor on the left of the par.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_aex","base":"of_course_aex","kind":"def","start":212,"body":null,"status":"ok","short":{"text":"Of course commutes with the existential: !(∐ x, P x) is equivalent to ∐ x, !(P x)","status":"ok"},"long":{"text":"Affirming an existential is the same as affirming some instance, since a proof of ∐ x, P x is a witness with a proof. On the refutation side, every instance failing to be affirmed is the same as the existential failing to be affirmed. The equivalence therefore holds in both directions constructively.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.why_not_all","base":"why_not_all","kind":"def","start":213,"body":null,"status":"ok","short":{"text":"Why not commutes with the universal: ?(∏ x, P x) is equivalent to ∏ x, ?(P x)","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.logic.aprop.of_course_aex]], obtained by passing to negations: why not, on the universal quantifier, is the universal quantifier of why not on the instances.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_all_aimpl","base":"of_course_all_aimpl","kind":"def","start":214,"body":null,"status":"ok","short":{"text":"Affirming a universal affirms each instance: !(∏ x, P x) implies ∏ x, !(P x)","status":"ok"},"long":{"text":"Only this direction holds. Both sides are proved by a proof of every P x. The right side is refuted by a point where P fails to be affirmed, and such a point refutes the left side. The converse would need a failure of the universal statement to produce such a point, which is not available constructively.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aex_why_not_aimpl","base":"aex_why_not_aimpl","kind":"def","start":215,"body":null,"status":"ok","short":{"text":"∐ x, ?(P x) implies ?(∐ x, P x)","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.logic.aprop.of_course_all_aimpl]], and like it valid in one direction only: the converse would need a witness that the hypothesis does not provide.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.Affirmative_of_course","base":"Affirmative_of_course","kind":"def","start":216,"body":null,"status":"ok","short":{"text":"!P is affirmative","status":"ok"},"long":{"text":"!P is proved by a strict proof of P and refuted by ¬P, so it is refuted exactly when it cannot be proved. That is the defining condition of Shulman's class of [[AffineConstructive.interfaces.aprop.Affirmative]] propositions. The instance is registered for resolution, so every affirmed proposition is known to be affirmative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.Refutative_why_not","base":"Refutative_why_not","kind":"def","start":217,"body":null,"status":"ok","short":{"text":"Why not P is refutative","status":"ok"},"long":{"text":"?P is proved exactly when it cannot be refuted, which makes it [[AffineConstructive.interfaces.aprop.Refutative]]. This is the dual of [[AffineConstructive.logic.aprop.Affirmative_of_course]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_impl_pos","base":"aimpl_impl_pos","kind":"def","start":220,"body":null,"status":"ok","short":{"text":"An affine implication P ⊸ Q turns a proof of P into a proof of Q","status":"ok"},"long":{"text":"The forward half of an affine implication. Since P ⊸ Q is the pair of a map on proofs and a map on refutations, this is its first component, defined by the projection [[AffineConstructive.interfaces.sprop.andl]]. Through the hint registered with it, a proof of an affine implication can be used to rewrite inside goals that are base-logic statements of the form 'P is proved'.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_iff_pos","base":"aiff_iff_pos","kind":"def","start":221,"body":null,"status":"ok","short":{"text":"An affine equivalence P ⧟ Q gives the base-logic equivalence of their proofs","status":"ok"},"long":{"text":"An affine equivalence relates both components of the two propositions. This gives the proof components: if P ⧟ Q, a proof of P is equivalent to a proof of Q in the base logic. It is registered as a congruence hint, so base-logic rewriting can replace a proved affine statement by an equivalent one. It is used in proofs in this file and in uniform factorizations, and by the tactic [[AffineConstructive.tactics.quote.base.quote_injective]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_impl_neg","base":"aimpl_impl_neg","kind":"def","start":224,"body":null,"status":"ok","short":{"text":"An affine implication P ⊸ Q turns a refutation of Q into a refutation of P","status":"ok"},"long":{"text":"The contrapositive half of an affine implication, defined as its second component by [[AffineConstructive.interfaces.sprop.andr]]. Every affine implication carries it: this is why a function that preserves equality is strongly extensional. The hint registered with it extends rewriting to statements about refutations.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_iff_neg","base":"aiff_iff_neg","kind":"def","start":225,"body":null,"status":"ok","short":{"text":"An affine equivalence P ⧟ Q makes P and Q refutable together","status":"ok"},"long":{"text":"The refutation components of an affine equivalence are equivalent in the base logic. This is the counterpart of [[AffineConstructive.logic.aprop.aiff_iff_pos]] for refutations.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_proper_aimpl","base":"aimpl_proper_aimpl","kind":"def","start":230,"body":null,"status":"ok","short":{"text":"Implication is antitone in its antecedent and monotone in its consequent","status":"ok"},"long":{"text":"Given P₂ ⊸ P₁ and Q₁ ⊸ Q₂, an implication P₁ ⊸ Q₁ gives P₂ ⊸ Q₂. The result is itself an affine implication, so the contrapositive is included as well. Rewriting uses this congruence to replace a subterm on either side of an implication, in the right direction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_proper_aiff","base":"aimpl_proper_aiff","kind":"def","start":231,"body":null,"status":"ok","short":{"text":"Implication respects equivalence: P₁ ⧟ P₂ and Q₁ ⧟ Q₂ give (P₁ ⊸ Q₁) ⧟ (P₂ ⊸ Q₂)","status":"ok"},"long":{"text":"The congruence of affine implication for the biconditional, used by rewriting to replace an antecedent or a consequent with an equivalent proposition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_proper_aimpl","base":"aiff_proper_aimpl","kind":"def","start":232,"body":null,"status":"ok","short":{"text":"Equivalence respects equivalence, as an implication: P₁ ⧟ Q₁ implies P₂ ⧟ Q₂","status":"ok"},"long":{"text":"Given P₁ ⧟ P₂ and Q₁ ⧟ Q₂, the biconditional P₁ ⧟ Q₁ implies P₂ ⧟ Q₂. This is the congruence rewriting uses inside a biconditional when the surrounding goal is an implication. [[AffineConstructive.logic.aprop.aiff_proper_aiff]] is the version with an equivalence in the conclusion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_proper_aiff","base":"aiff_proper_aiff","kind":"def","start":233,"body":null,"status":"ok","short":{"text":"Equivalence respects equivalence: P₁ ⧟ P₂ and Q₁ ⧟ Q₂ give (P₁ ⧟ Q₁) ⧟ (P₂ ⧟ Q₂)","status":"ok"},"long":{"text":"The congruence of the affine biconditional for itself, used by rewriting to replace either side of a biconditional with an equivalent proposition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.anot_proper_aimpl","base":"anot_proper_aimpl","kind":"def","start":234,"body":null,"status":"ok","short":{"text":"Negation reverses implication: if P₂ implies P₁, then P₁ᗮ implies P₂ᗮ","status":"ok"},"long":{"text":"The congruence law of negation for implication. Negation is contravariant: a proof of P₂ ⊸ P₁ gives P₁ᗮ ⊸ P₂ᗮ. This is contraposition, as in [[AffineConstructive.logic.aprop.acontra]], but stated in the form the rewriting system asks for when it has to rewrite inside a negation. Its premise is a proof in the base logic, not an affine hypothesis.\n\nThe lemma is registered with the rewriting system. A rewrite by an implication can then pass under a negation, and the direction of the rewrite reverses there.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.anot_proper_aiff","base":"anot_proper_aiff","kind":"def","start":235,"body":null,"status":"ok","short":{"text":"Negation respects equivalence: P₁ ⧟ P₂ gives P₁ᗮ ⧟ P₂ᗮ","status":"ok"},"long":{"text":"The congruence law of negation for affine equivalence: equivalent propositions have equivalent negations. It is the companion of [[AffineConstructive.logic.aprop.anot_proper_aimpl]] for ⧟. Since an equivalence goes both ways, the direction of the rewrite does not change under the negation.\n\nThe lemma is registered with the rewriting system, so a rewrite by an equivalence can reach inside a negation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_proper_aimpl","base":"aand_proper_aimpl","kind":"def","start":236,"body":null,"status":"ok","short":{"text":"Additive conjunction is monotone: P₁ ⊸ P₂ and Q₁ ⊸ Q₂ give P₁ ∧ Q₁ ⊸ P₂ ∧ Q₂","status":"ok"},"long":{"text":"Monotonicity of the additive conjunction in both arguments. Its two premises are proofs in the base logic, which is how the rewriting system supplies them.\n\nThe lemma is registered with the rewriting system. A rewrite by an implication can then descend into either conjunct, and the conjunct it does not touch is closed by reflexivity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_proper_aiff","base":"aand_proper_aiff","kind":"def","start":237,"body":null,"status":"ok","short":{"text":"Additive conjunction respects equivalence in both arguments","status":"ok"},"long":{"text":"The congruence law of the additive conjunction for affine equivalence: if P₁ ⧟ P₂ and Q₁ ⧟ Q₂ then P₁ ∧ Q₁ ⧟ P₂ ∧ Q₂. It is the companion of [[AffineConstructive.logic.aprop.aand_proper_aimpl]] for ⧟.\n\nThe lemma is registered with the rewriting system, so rewriting by an equivalence can descend into either conjunct.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_proper_aimpl","base":"aor_proper_aimpl","kind":"def","start":238,"body":null,"status":"ok","short":{"text":"Additive disjunction is monotone: P₁ ⊸ P₂ and Q₁ ⊸ Q₂ give P₁ ∨ Q₁ ⊸ P₂ ∨ Q₂","status":"ok"},"long":{"text":"Monotonicity of the additive disjunction in both arguments, with both premises given as proofs in the base logic. It is the dual of [[AffineConstructive.logic.aprop.aand_proper_aimpl]].\n\nThe lemma is registered with the rewriting system, so a rewrite by an implication can descend into either disjunct.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_proper_aiff","base":"aor_proper_aiff","kind":"def","start":239,"body":null,"status":"ok","short":{"text":"Additive disjunction respects equivalence in both arguments","status":"ok"},"long":{"text":"The congruence law of the additive disjunction for affine equivalence: if P₁ ⧟ P₂ and Q₁ ⧟ Q₂ then P₁ ∨ Q₁ ⧟ P₂ ∨ Q₂.\n\nThe lemma is registered with the rewriting system, so rewriting by an equivalence can descend into either disjunct.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_proper_aimpl","base":"aprod_proper_aimpl","kind":"def","start":240,"body":null,"status":"ok","short":{"text":"The tensor is monotone: P₁ ⊸ P₂ and Q₁ ⊸ Q₂ give P₁ ⊠ Q₁ ⊸ P₂ ⊠ Q₂","status":"ok"},"long":{"text":"Monotonicity of the multiplicative conjunction in each factor. This is the law that lets a proof of P₁ ⊠ … ⊠ Pₙ ⊸ Q treat its hypotheses one at a time. Each factor of a tensor of hypotheses can be weakened by its own implication, independently of the others.\n\nThe lemma is registered with the rewriting system. Rewriting one factor of a tensor, with the remaining factors closed by reflexivity, is the most common rewriting step in the development.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_proper_aiff","base":"aprod_proper_aiff","kind":"def","start":241,"body":null,"status":"ok","short":{"text":"The tensor respects equivalence in both factors","status":"ok"},"long":{"text":"The congruence law of the tensor for affine equivalence: if P₁ ⧟ P₂ and Q₁ ⧟ Q₂ then P₁ ⊠ Q₁ ⧟ P₂ ⊠ Q₂. It is the companion of [[AffineConstructive.logic.aprop.aprod_proper_aimpl]] for ⧟.\n\nThe lemma is registered with the rewriting system, so rewriting by an equivalence can descend into either factor of a tensor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_proper_aimpl","base":"apar_proper_aimpl","kind":"def","start":242,"body":null,"status":"ok","short":{"text":"Par is monotone: P₁ ⊸ P₂ and Q₁ ⊸ Q₂ give P₁ ⊞ Q₁ ⊸ P₂ ⊞ Q₂","status":"ok"},"long":{"text":"Monotonicity of the multiplicative disjunction in each argument, the dual of [[AffineConstructive.logic.aprop.aprod_proper_aimpl]]. A single affine statement of the same law, with the two implications as tensored hypotheses, is [[AffineConstructive.logic.aprop.aprod_aimpl_apar]]. This version takes its premises in the base logic, the form rewriting uses.\n\nThe lemma is registered with the rewriting system, so a rewrite by an implication can descend into either side of a par.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_proper_aiff","base":"apar_proper_aiff","kind":"def","start":243,"body":null,"status":"ok","short":{"text":"Par respects equivalence in both arguments","status":"ok"},"long":{"text":"The congruence law of par for affine equivalence: if P₁ ⧟ P₂ and Q₁ ⧟ Q₂ then P₁ ⊞ Q₁ ⧟ P₂ ⊞ Q₂.\n\nThe lemma is registered with the rewriting system, so rewriting by an equivalence can descend into either side of a par.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_proper_aimpl","base":"of_course_proper_aimpl","kind":"def","start":259,"body":null,"status":"ok","short":{"text":"Of course is monotone: a proof of P ⊸ Q gives !P ⊸ !Q","status":"ok"},"long":{"text":"Monotonicity of the modality of course. The premise has to be a proof in the base logic. A proof of P ⊸ Q established outright can be reused as often as !P is, which an affine hypothesis P ⊸ Q could not be. A proved implication therefore passes under !.\n\nThe lemma is registered with the rewriting system, so rewriting by an implication can descend under !.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_proper_aiff","base":"of_course_proper_aiff","kind":"def","start":260,"body":null,"status":"ok","short":{"text":"Of course respects equivalence: P ⧟ Q gives !P ⧟ !Q","status":"ok"},"long":{"text":"The congruence law of the modality of course for affine equivalence. It is the companion of [[AffineConstructive.logic.aprop.of_course_proper_aimpl]] for ⧟.\n\nThe lemma is registered with the rewriting system, so a rewrite by an equivalence can reach under !.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.why_not_proper_aimpl","base":"why_not_proper_aimpl","kind":"def","start":261,"body":null,"status":"ok","short":{"text":"Why not is monotone: a proof of P ⊸ Q gives ?P ⊸ ?Q","status":"ok"},"long":{"text":"Monotonicity of the modality why not, the dual of [[AffineConstructive.logic.aprop.of_course_proper_aimpl]]. Its premise is a proof in the base logic.\n\nThe lemma is registered with the rewriting system, so rewriting by an implication can descend under ?.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.why_not_proper_aiff","base":"why_not_proper_aiff","kind":"def","start":262,"body":null,"status":"ok","short":{"text":"Why not respects equivalence: P ⧟ Q gives ?P ⧟ ?Q","status":"ok"},"long":{"text":"The congruence law of the modality why not for affine equivalence.\n\nThe lemma is registered with the rewriting system, so a rewrite by an equivalence can reach under ?.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.Decidable_proper_impl","base":"Decidable_proper_impl","kind":"def","start":267,"body":null,"status":"ok","short":{"text":"Decidability transfers along an equivalence: given P ⧟ Q, if P is decidable so is Q","status":"ok"},"long":{"text":"Decidability in Shulman's sense depends only on the proposition up to affine equivalence: if P ⧟ Q and P is decidable, then Q is decidable. The statement is an implication of the base logic.\n\nThe lemma is registered with the rewriting system, so that rewriting by an equivalence can transform a goal that asks for decidability. It is the one-directional companion of [[AffineConstructive.logic.aprop.Decidable_proper_iff]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.Decidable_proper_iff","base":"Decidable_proper_iff","kind":"def","start":268,"body":null,"status":"ok","short":{"text":"Equivalent affine propositions are equally decidable","status":"ok"},"long":{"text":"If P ⧟ Q, then P is decidable if and only if Q is. This is the two-sided form of [[AffineConstructive.logic.aprop.Decidable_proper_impl]].\n\nThe lemma is registered with the rewriting system, so that rewriting by an equivalence can act on a decidability goal or hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.Affirmative_proper_impl","base":"Affirmative_proper_impl","kind":"def","start":269,"body":null,"status":"ok","short":{"text":"Being affirmative transfers along an equivalence: given P ⧟ Q, if P is affirmative so is Q","status":"ok"},"long":{"text":"The class of affirmative propositions, those whose refutation is the impossibility of a proof, is closed under affine equivalence. This lemma states that closure as an implication of the base logic.\n\nThe lemma is registered with the rewriting system, so that rewriting by an equivalence can act on a goal asking that a proposition be affirmative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.Affirmative_proper_iff","base":"Affirmative_proper_iff","kind":"def","start":270,"body":null,"status":"ok","short":{"text":"Equivalent affine propositions are equally affirmative","status":"ok"},"long":{"text":"If P ⧟ Q, then P is affirmative if and only if Q is. This is the two-sided form of [[AffineConstructive.logic.aprop.Affirmative_proper_impl]].\n\nThe lemma is registered with the rewriting system, so that rewriting by an equivalence can act on an affirmativity goal or hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.Refutative_proper_impl","base":"Refutative_proper_impl","kind":"def","start":271,"body":null,"status":"ok","short":{"text":"Being refutative transfers along an equivalence: given P ⧟ Q, if P is refutative so is Q","status":"ok"},"long":{"text":"The class of refutative propositions, those whose proof is the impossibility of a refutation, is closed under affine equivalence. This lemma states that closure as an implication of the base logic.\n\nThe lemma is registered with the rewriting system, so that rewriting by an equivalence can act on a goal asking that a proposition be refutative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.Refutative_proper_iff","base":"Refutative_proper_iff","kind":"def","start":272,"body":null,"status":"ok","short":{"text":"Equivalent affine propositions are equally refutative","status":"ok"},"long":{"text":"If P ⧟ Q, then P is refutative if and only if Q is. This is the two-sided form of [[AffineConstructive.logic.aprop.Refutative_proper_impl]].\n\nThe lemma is registered with the rewriting system, so that rewriting by an equivalence can act on a refutativity goal or hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.all_proper_aimpl","base":"all_proper_aimpl","kind":"prf","start":279,"body":[280,282],"status":"ok","short":{"text":"The universal quantifier is monotone: if P x ⊸ Q x for every x, then ∏ x, P x implies ∏ x, Q x","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.logic.aprop.all_aimpl]], read with the pointwise implications given in the base logic rather than as an affine universal: each P x ⊸ Q x passes to ∏ x, P x ⊸ ∏ x, Q x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.aprop.all_proper_aiff","base":"all_proper_aiff","kind":"prf","start":283,"body":[284,286],"status":"ok","short":{"text":"The universal quantifier respects pointwise equivalence","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.logic.aprop.all_aiff]], with the pointwise equivalences given in the base logic: each P x ⧟ Q x passes to the equivalence of the universals.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.aprop.aex_proper_aimpl","base":"aex_proper_aimpl","kind":"prf","start":287,"body":[288,290],"status":"ok","short":{"text":"The existential quantifier is monotone: if P x ⊸ Q x for every x, then ∐ x, P x implies ∐ x, Q x","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.logic.aprop.aex_aimpl]], with the pointwise implications given in the base logic: each P x ⊸ Q x passes to ∐ x, P x ⊸ ∐ x, Q x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.aprop.aex_proper_aiff","base":"aex_proper_aiff","kind":"prf","start":291,"body":[292,294],"status":"ok","short":{"text":"The existential quantifier respects pointwise equivalence","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.logic.aprop.aex_aiff]], with the pointwise equivalences given in the base logic: each P x ⧟ Q x passes to the equivalence of the existentials.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.aprop.proper_beta_reduce","base":"proper_beta_reduce","kind":"ltac","start":295,"body":null,"status":"ok","short":{"text":"Reduces a function applied to the fixed point on either side of a comparison goal","status":"ok"},"long":{"text":"A clean-up step for rewriting under a quantifier. To rewrite inside ∏ y, P y or ∐ y, P y, the congruence hints of this file apply [[AffineConstructive.logic.aprop.all_proper_aimpl]], [[AffineConstructive.logic.aprop.all_proper_aiff]], [[AffineConstructive.logic.aprop.aex_proper_aimpl]] or [[AffineConstructive.logic.aprop.aex_proper_aiff]] and fix a point x; the resulting goal compares the bodies of the two families at x, but in the form of an anonymous function applied to x. This tactic substitutes x into the body, on the left side of the comparison, on the right side, or both, so that the goal reads as an implication or equivalence between the instantiated bodies.\n\nIt matters because the rewriting system finds congruence lemmas by the head of each side of the goal: an unreduced application hides the connective underneath, and the search would stop there. Each side is reduced only if it has the redex shape, so the step never fails.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aex_adj2","base":"aex_adj2","kind":"def","start":300,"body":[301,319],"status":"ok","short":{"text":"The quantifier rule for two existentials tensored: (∐ P₁) ⊠ (∐ P₂) ⊸ Q iff P₁ x₁ ⊠ P₂ x₂ ⊸ Q for all x₁, x₂","status":"ok"},"proof":[{"text":"Read the equivalence from right to left and go through an intermediate form in which the first existential has been pulled out of the tensor.","status":"ok","from":0,"to":2},{"text":"Pulling out the first existential leaves the conclusion Q alone. The Frobenius law [[AffineConstructive.logic.aprop.aex_frob_r]] makes the two hypotheses equivalent, and an implication into Q respects equivalence of its hypothesis.","status":"ok","from":3,"to":7},{"text":"The quantifier rule [[AffineConstructive.logic.aprop.aex_adj]] turns an implication out of ∐ x₁, … into one implication for each x₁. It then remains, for a fixed y, to show that P₁ y ⊠ ∐ x₂, P₂ x₂ ⊸ Q holds exactly when P₁ y ⊠ P₂ x₂ ⊸ Q holds for every x₂.","status":"ok","from":8,"to":10},{"text":"The Frobenius law [[AffineConstructive.logic.aprop.aex_frob_l]] moves the second existential out over the factor P₁ y, and the implication into Q is unchanged under this equivalence.","status":"ok","from":11,"to":16},{"text":"The quantifier rule [[AffineConstructive.logic.aprop.aex_adj]] applied once more gives one implication for each x₂, which is the right-hand side.","status":"ok","from":17,"to":18}]},{"name":"AffineConstructive.logic.aprop.all_adj2","base":"all_adj2","kind":"prf","start":320,"body":[321,331],"status":"ok","short":{"text":"The quantifier rule for two universals under par: Q ⊸ (∏ P₁) ⊞ (∏ P₂) iff Q ⊸ P₁ x₁ ⊞ P₂ x₂ for all x₁, x₂","status":"ok"},"proof":[{"text":"Read the equivalence from right to left and take contrapositives. By [[AffineConstructive.logic.aprop.acontra_eq]], Q ⊸ (∏ P₁) ⊞ (∏ P₂) is equivalent to an implication into Qᗮ from the tensor of the two existentials ∐ x₁, (P₁ x₁)ᗮ and ∐ x₂, (P₂ x₂)ᗮ. The De Morgan duals of par and the universal let the two statements be identified.","status":"ok","from":0,"to":5},{"text":"The two-variable quantifier rule [[AffineConstructive.logic.aprop.aex_adj2]] splits this into one implication (P₁ x₁)ᗮ ⊠ (P₂ x₂)ᗮ ⊸ Qᗮ for each pair x₁, x₂.","status":"ok","from":6,"to":7},{"text":"Fix x₁ and x₂. By [[AffineConstructive.logic.aprop.acontra_eq]] the implication is equivalent to its contrapositive, which is Q ⊸ P₁ x₁ ⊞ P₂ x₂.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.logic.aprop.affirmative_alt","base":"affirmative_alt","kind":"def","start":332,"body":null,"status":"ok","short":{"text":"P is affirmative iff refuting P is equivalent to P having no proof","status":"ok"},"long":{"text":"A reformulation of Shulman's class of affirmative propositions in terms of the two components. P is affirmative exactly when its refutation is equivalent, in the base logic, to the impossibility of a proof. The refutation then carries no information beyond the absence of a proof.\n\nThis is the form used when an argument has to look at the components, as in [[AffineConstructive.logic.aprop.affirmative_aex]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.refutative_alt","base":"refutative_alt","kind":"def","start":333,"body":null,"status":"ok","short":{"text":"P is refutative iff proving P is equivalent to P having no refutation","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.logic.aprop.affirmative_alt]]. P is refutative exactly when its proof is equivalent, in the base logic, to the impossibility of a refutation. Equality and membership on a set are refutative in this sense, and so is every negated of course.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.decidable_affirmative","base":"decidable_affirmative","kind":"def","start":334,"body":null,"status":"ok","short":{"text":"Every decidable affine proposition is affirmative","status":"ok"},"long":{"text":"A decidable proposition, one for which P ∨ Pᗮ holds, is affirmative: either a proof or a refutation is at hand, so the impossibility of a proof yields a refutation.\n\nThe lemma is declared as a coercion. A decidability instance therefore serves wherever an affirmativity instance is wanted, with no separate instance declared.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.decidable_refutative","base":"decidable_refutative","kind":"def","start":335,"body":null,"status":"ok","short":{"text":"Every decidable affine proposition is refutative","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.logic.aprop.decidable_affirmative]]: a decidable proposition is refutative, since the impossibility of a refutation yields a proof.\n\nThe lemma is declared as a coercion, so a decidability instance serves wherever a refutativity instance is wanted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.not_of_course_refutative","base":"not_of_course_refutative","kind":"def","start":336,"body":null,"status":"ok","short":{"text":"For strict P, the proposition proved by ¬P and refuted by P is refutative","status":"ok"},"long":{"text":"For a strict proposition P, the affine proposition proved by ¬P and refuted by P is [[AffineConstructive.interfaces.aprop.Refutative]]: it is proved exactly when it cannot be refuted. The instance is registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.atrue_decidable","base":"atrue_decidable","kind":"def","start":340,"body":null,"status":"ok","short":{"text":"Truth is decidable","status":"ok"},"long":{"text":"Truth 𝐓 is decidable, since it is proved outright. Through the coercions [[AffineConstructive.logic.aprop.decidable_affirmative]] and [[AffineConstructive.logic.aprop.decidable_refutative]], the same proof shows that 𝐓 is affirmative and refutative. Hints register it for all three classes.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.afalse_decidable","base":"afalse_decidable","kind":"def","start":341,"body":null,"status":"ok","short":{"text":"Falsity is decidable","status":"ok"},"long":{"text":"Falsity 𝐅 is decidable, since it is refuted outright. Hints register this one proof for decidability, affirmativity and refutativity of 𝐅.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.anot_decidable","base":"anot_decidable","kind":"def","start":348,"body":null,"status":"ok","short":{"text":"The negation of a decidable proposition is decidable","status":"ok"},"long":{"text":"If P is decidable then so is Pᗮ. Negation swaps proof and refutation, so the case split P ∨ Pᗮ is also the case split for Pᗮ. The instance is registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.anot_refutative","base":"anot_refutative","kind":"def","start":349,"body":null,"status":"ok","short":{"text":"The negation of an affirmative proposition is refutative","status":"ok"},"long":{"text":"Negation exchanges the two classes: if P is affirmative, then Pᗮ is refutative. Its proof is the refutation of P, which is the impossibility of a proof of P, and that is the impossibility of a refutation of Pᗮ. The instance is registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.anot_affirmative","base":"anot_affirmative","kind":"def","start":350,"body":null,"status":"ok","short":{"text":"The negation of a refutative proposition is affirmative","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.logic.aprop.anot_refutative]]: if P is refutative, then Pᗮ is affirmative. Negation swaps the proofs and the refutations, so it exchanges the two classes. The instance is registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_decidable","base":"aand_decidable","kind":"def","start":354,"body":null,"status":"ok","short":{"text":"The additive conjunction of decidable propositions is decidable","status":"ok"},"long":{"text":"If P and Q are decidable, so is P ∧ Q. Case analysis on the two decisions either proves both conjuncts or refutes one of them, which is a refutation of the conjunction. The instance is registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_decidable","base":"aor_decidable","kind":"def","start":355,"body":null,"status":"ok","short":{"text":"The additive disjunction of decidable propositions is decidable","status":"ok"},"long":{"text":"If P and Q are decidable, so is P ∨ Q. This is the dual of [[AffineConstructive.logic.aprop.aand_decidable]], and the instance is registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_decidable","base":"aprod_decidable","kind":"def","start":356,"body":null,"status":"ok","short":{"text":"The tensor of decidable propositions is decidable","status":"ok"},"long":{"text":"If P and Q are decidable, so is P ⊠ Q. When both are decided, the tensor collapses to the additive conjunction (compare [[AffineConstructive.logic.aprop.aand_aprod_dec_l]]), so its decision comes from the two decisions. The instance is registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_decidable","base":"apar_decidable","kind":"def","start":357,"body":null,"status":"ok","short":{"text":"The par of two decidable propositions is decidable","status":"ok"},"long":{"text":"If P and Q are decidable, so is P ⊞ Q. This is the dual of [[AffineConstructive.logic.aprop.aprod_decidable]]. The instance is registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_decidable","base":"aimpl_decidable","kind":"def","start":362,"body":null,"status":"ok","short":{"text":"P ⊸ Q is decidable when P and Q are","status":"ok"},"long":{"text":"An affine implication P ⊸ Q is decidable when P and Q both are. The definition reads the implication as the par Pᗮ ⊞ Q and takes the instance for that par, which comes from [[AffineConstructive.logic.aprop.anot_decidable]] and [[AffineConstructive.logic.aprop.apar_decidable]]: decidability of a compound follows the connective it unfolds to.\n\nIt is registered with resolution, so a decidable hypothesis and conclusion give a decidable implication without further proof.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_decidable","base":"aiff_decidable","kind":"def","start":364,"body":null,"status":"ok","short":{"text":"P ⧟ Q is decidable when P and Q are","status":"ok"},"long":{"text":"The affine biconditional P ⧟ Q is decidable when P and Q both are. It is the additive conjunction of the two implications P ⊸ Q and Q ⊸ P, so the instance is assembled from [[AffineConstructive.logic.aprop.aimpl_decidable]] twice and [[AffineConstructive.logic.aprop.aand_decidable]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_aprod_dec_l","base":"aand_aprod_dec_l","kind":"def","start":366,"body":null,"status":"ok","short":{"text":"If P is decidable, P ∧ Q is equivalent to P ⊠ Q","status":"ok"},"long":{"text":"When P is decidable, the additive conjunction P ∧ Q and the tensor P ⊠ Q are equivalent. The two have the same proofs, a proof of each conjunct; they differ in their refutations. A refutation of P ∧ Q is a refutation of one of the conjuncts, while a refutation of P ⊠ Q is weaker: a way to turn a proof of P into a refutation of Q and a proof of Q into a refutation of P. The tensor therefore always implies the additive conjunction ([[AffineConstructive.logic.aprop.aprod_aand]]), and the converse is where decidability is needed. Deciding P settles which case holds: if P is refuted, that refutes P ∧ Q; if P is proved, the refutation of the tensor applied to it refutes Q, which again refutes P ∧ Q.\n\nSo with one decidable factor the distinction between the additive and the multiplicative conjunction disappears, and a proof may rewrite between them in either direction, using P twice or choosing one conjunct as it needs. [[AffineConstructive.logic.aprop.aand_aprod_dec_r]] is the same statement with the decidability on Q, and [[AffineConstructive.logic.aprop.apar_aor_dec_l]], [[AffineConstructive.logic.aprop.apar_aor_dec_r]] are the dual collapse of par onto the additive disjunction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_aprod_dec_r","base":"aand_aprod_dec_r","kind":"def","start":367,"body":null,"status":"ok","short":{"text":"When Q is decidable, P ∧ Q and P ⊠ Q are equivalent","status":"ok"},"long":{"text":"The mirror of [[AffineConstructive.logic.aprop.aand_aprod_dec_l]]: deciding the right conjunct Q is enough to make the additive conjunction P ∧ Q and the tensor P ⊠ Q equivalent.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_aor_dec_l","base":"apar_aor_dec_l","kind":"def","start":368,"body":null,"status":"ok","short":{"text":"When P is decidable, P ⊞ Q and P ∨ Q are equivalent","status":"ok"},"long":{"text":"If P is decidable, the par P ⊞ Q and the additive disjunction P ∨ Q are equivalent. The disjunction always implies the par; conversely, a proof of P ⊞ Q gives Q from any refutation of P, and deciding P supplies either P itself or such a refutation, hence a definite disjunct.\n\nIt is the dual of [[AffineConstructive.logic.aprop.aand_aprod_dec_l]], and with it says that a decidable factor makes the additive and multiplicative disjunctions agree.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_aor_dec_r","base":"apar_aor_dec_r","kind":"def","start":369,"body":null,"status":"ok","short":{"text":"When Q is decidable, P ⊞ Q and P ∨ Q are equivalent","status":"ok"},"long":{"text":"The mirror of [[AffineConstructive.logic.aprop.apar_aor_dec_l]]: deciding the right disjunct Q is enough to make the par P ⊞ Q equivalent to the additive disjunction P ∨ Q.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_affirmative","base":"aor_affirmative","kind":"def","start":370,"body":null,"status":"ok","short":{"text":"The disjunction of two affirmative propositions is affirmative","status":"ok"},"long":{"text":"P ∨ Q is affirmative when P and Q are. An affirmative proposition is one whose refutation is exactly the impossibility of its proof; a refutation of P ∨ Q refutes both disjuncts, which is the impossibility of proving either, hence of proving the disjunction.\n\nAffirmative propositions are closed under the positive connectives (∨, ⊞, ⊠ and ∐); this is the instance for the additive disjunction, the dual of [[AffineConstructive.logic.aprop.aand_refutative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_refutative","base":"aand_refutative","kind":"def","start":371,"body":null,"status":"ok","short":{"text":"The additive conjunction of two refutative propositions is refutative","status":"ok"},"long":{"text":"P ∧ Q is refutative when P and Q are. A refutative proposition is one whose proof is exactly the impossibility of its refutation; a proof of P ∧ Q proves both conjuncts, which is the impossibility of refuting either.\n\nIt is the dual of [[AffineConstructive.logic.aprop.aor_affirmative]]: refutative propositions are closed under the negative connectives (∧, ⊠, ⊞ and ∏).","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_affirmative","base":"apar_affirmative","kind":"def","start":374,"body":null,"status":"ok","short":{"text":"The par of two affirmative propositions is affirmative","status":"ok"},"long":{"text":"P ⊞ Q is affirmative when P and Q are. The refutation of a par is the tensor of the refutations, and for affirmative factors this is the impossibility of proving either, which is the impossibility of proving the par. Dual to [[AffineConstructive.logic.aprop.aprod_refutative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_refutative","base":"aprod_refutative","kind":"def","start":375,"body":null,"status":"ok","short":{"text":"The tensor of two refutative propositions is refutative","status":"ok"},"long":{"text":"P ⊠ Q is refutative when P and Q are. The proof of a tensor is the pair of proofs, and for refutative factors each is the impossibility of a refutation, which together make the impossibility of refuting P ⊠ Q. Dual to [[AffineConstructive.logic.aprop.apar_affirmative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_affirmative","base":"aprod_affirmative","kind":"def","start":378,"body":null,"status":"ok","short":{"text":"The tensor P ⊠ Q of two affirmative propositions is affirmative","status":"ok"},"long":{"text":"An instance: if P and Q are affirmative, so is P ⊠ Q. Resolution finds it whenever a tensor of affirmative propositions is asked to be affirmative. The rules in this file that require an affirmative premise then apply to such a tensor as a whole: [[AffineConstructive.logic.aprop.affirmative_aimpl]] proves an implication out of it by a base-logic argument, [[AffineConstructive.logic.aprop.affirmative_aimpl_of_course]] promotes a conclusion to of course, [[AffineConstructive.logic.aprop.affirmative_aand_aprod]] turns an additive conclusion into a tensor, and [[AffineConstructive.logic.aprop.affirmative_aprod_aimpl_l]] lets the tensor be used as a hypothesis more than once.\n\nAffirmative propositions are closed under the tensor and also, by [[AffineConstructive.logic.aprop.apar_affirmative]], under par. The dual instance is [[AffineConstructive.logic.aprop.apar_refutative]]: a par of refutative propositions is refutative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_refutative","base":"apar_refutative","kind":"def","start":379,"body":null,"status":"ok","short":{"text":"The par of two refutative propositions is refutative","status":"ok"},"long":{"text":"P ⊞ Q is refutative when P and Q are: the instance dual to [[AffineConstructive.logic.aprop.aprod_affirmative]], obtained by the same argument with proof and refutation exchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_affirmative","base":"aimpl_affirmative","kind":"def","start":382,"body":null,"status":"ok","short":{"text":"P ⊸ Q is affirmative when P is refutative and Q affirmative","status":"ok"},"long":{"text":"An implication P ⊸ Q is affirmative when its hypothesis P is refutative and its conclusion Q is affirmative. The implication reads as the par Pᗮ ⊞ Q, the negation of a refutative proposition is affirmative ([[AffineConstructive.logic.aprop.anot_affirmative]]), and a par of affirmatives is affirmative ([[AffineConstructive.logic.aprop.apar_affirmative]]).\n\nThe variance is that of the hypothesis position: an implication is contravariant in P, so the class it requires of P is the dual one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_refutative","base":"aimpl_refutative","kind":"def","start":383,"body":null,"status":"ok","short":{"text":"P ⊸ Q is refutative when P is affirmative and Q refutative","status":"ok"},"long":{"text":"An implication P ⊸ Q is refutative when P is affirmative and Q refutative: the dual of [[AffineConstructive.logic.aprop.aimpl_affirmative]]. Its refutation is the tensor P ⊠ Qᗮ, a tensor of refutatives once P is affirmative, so the instance follows from [[AffineConstructive.logic.aprop.anot_refutative]] and [[AffineConstructive.logic.aprop.aprod_refutative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.affirmative_aimpl","base":"affirmative_aimpl","kind":"def","start":386,"body":null,"status":"ok","short":{"text":"For affirmative P, a base-logic implication from P to Q gives the affine implication P ⊸ Q","status":"ok"},"long":{"text":"If P is affirmative, then a base-logic implication from a proof of P to a proof of Q is already the affine implication P ⊸ Q. The contrapositive half comes free: a refutation of Q together with a proof of P would yield a proof of Q and so a contradiction, hence P cannot be proved, and for an affirmative P that impossibility is its refutation ([[AffineConstructive.logic.aprop.affirmative_alt]]).\n\nThe lemma lets an affine implication with an affirmative hypothesis be proved by an argument about proofs alone, with no separate argument for the dual half. In this file [[AffineConstructive.logic.aprop.decidable_aimpl]] is this lemma at a decidable hypothesis, through the coercion [[AffineConstructive.logic.aprop.decidable_affirmative]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.refutative_aimpl","base":"refutative_aimpl","kind":"def","start":387,"body":null,"status":"ok","short":{"text":"For refutative Q, a base-logic implication from a refutation of Q to one of P gives P ⊸ Q","status":"ok"},"long":{"text":"If Q is refutative, then a base-logic implication from a refutation of Q to a refutation of P is already the affine implication P ⊸ Q. It is the dual of [[AffineConstructive.logic.aprop.affirmative_aimpl]]: given a proof of P, any refutation of Q would yield a refutation of P and so a contradiction, hence Q cannot be refuted, and for a refutative Q that impossibility is its proof ([[AffineConstructive.logic.aprop.refutative_alt]]).\n\nThe lemma lets an affine implication with a refutative conclusion be proved by contraposition alone, as an argument about refutations. [[AffineConstructive.logic.aprop.refutative_aimpl_dual]] states the same with the refutations of P and Q given by their De Morgan duals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.refutative_aimpl_dual","base":"refutative_aimpl_dual","kind":"def","start":388,"body":null,"status":"ok","short":{"text":"For refutative Q, a base-logic map from Qd to Pd proves P ⊸ Q","status":"ok"},"long":{"text":"The form of [[AffineConstructive.logic.aprop.refutative_aimpl]] that uses the De Morgan duals Pd and Qd computed by resolution in place of the bare negations Pᗮ and Qᗮ. When Q is refutative, a base-logic argument from a refutation of Q, in normal form, to a refutation of P is enough to prove P ⊸ Q. It is used once, in the file on the naturals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.decidable_aimpl","base":"decidable_aimpl","kind":"def","start":389,"body":null,"status":"ok","short":{"text":"For decidable P, a base-logic implication P → Q proves P ⊸ Q","status":"ok"},"long":{"text":"The special case of [[AffineConstructive.logic.aprop.affirmative_aimpl]] for a decidable hypothesis: a decidable proposition is affirmative ([[AffineConstructive.logic.aprop.decidable_affirmative]]), so a base-logic implication from P to Q is an affine implication. It is defined as that lemma, the coercion supplying the affirmative instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.affirmative_aiff","base":"affirmative_aiff","kind":"def","start":390,"body":null,"status":"ok","short":{"text":"Affirmative P and Q are affinely equivalent when their proofs are equivalent","status":"ok"},"long":{"text":"For affirmative P and Q, a base-logic equivalence between their proofs gives the affine equivalence P ⧟ Q. Each direction is an instance of [[AffineConstructive.logic.aprop.affirmative_aimpl]]: an affirmative proposition is determined by its proofs, so two of them with the same proofs are the same affine proposition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.refutative_aiff","base":"refutative_aiff","kind":"def","start":391,"body":null,"status":"ok","short":{"text":"Refutative P and Q are affinely equivalent when their refutations are equivalent","status":"ok"},"long":{"text":"For refutative P and Q, a base-logic equivalence between their refutations gives the affine equivalence P ⧟ Q, the dual of [[AffineConstructive.logic.aprop.affirmative_aiff]]: a refutative proposition is determined by its refutations.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.refutative_apar_l","base":"refutative_apar_l","kind":"def","start":392,"body":null,"status":"ok","short":{"text":"For refutative P, a base-logic derivation of Q from a refutation of P proves P ⊞ Q","status":"ok"},"long":{"text":"If P is refutative, then to prove the par P ⊞ Q it suffices to derive Q from a refutation of P in the base logic. The par P ⊞ Q amounts to the implication Pᗮ ⊸ Q, whose hypothesis Pᗮ is affirmative by [[AffineConstructive.logic.aprop.anot_affirmative]], so this is [[AffineConstructive.logic.aprop.affirmative_aimpl]] in another form.\n\n[[AffineConstructive.logic.aprop.refutative_apar_r]] is the same statement with the refutative factor on the right.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.refutative_apar_r","base":"refutative_apar_r","kind":"def","start":393,"body":null,"status":"ok","short":{"text":"For refutative P, a base-logic implication Pᗮ → Q proves Q ⊞ P","status":"ok"},"long":{"text":"The mirror of [[AffineConstructive.logic.aprop.refutative_apar_l]], with the refutative proposition as the right side of the par: from a base-logic implication taking a refutation of P to a proof of Q follows Q ⊞ P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.whynot_aimpl_refutative","base":"whynot_aimpl_refutative","kind":"def","start":394,"body":null,"status":"ok","short":{"text":"For refutative Q, P ⊸ Q gives ?P ⊸ Q","status":"ok"},"long":{"text":"If Q is refutative, an implication P ⊸ Q extends to ?P ⊸ Q. Why not P is the weakest proposition with the refutations of P, and a refutative conclusion asks of its hypothesis only what its refutation side provides; so ? may be added to the hypothesis.\n\nIt is the dual of [[AffineConstructive.logic.aprop.affirmative_aimpl_of_course]], and lets an argument with a refutative goal discharge the modality ? on a hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.affirmative_aimpl_of_course","base":"affirmative_aimpl_of_course","kind":"def","start":395,"body":null,"status":"ok","short":{"text":"For affirmative P, P ⊸ Q strengthens to P ⊸ !Q","status":"ok"},"long":{"text":"If P is affirmative, an implication P ⊸ Q strengthens to P ⊸ !Q. The proofs of !Q are those of Q, and its refutation is the weakest possible one, the impossibility of a proof of Q. The contrapositive must take that refutation to a refutation of P. An affirmative P is refuted by the impossibility of a proof, which the forward direction of P ⊸ Q supplies.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.affirmative_aand_aprod","base":"affirmative_aand_aprod","kind":"def","start":396,"body":null,"status":"ok","short":{"text":"For affirmative P, P ⊸ Q ∧ R strengthens to P ⊸ Q ⊠ R","status":"ok"},"long":{"text":"If P is affirmative, an implication into the additive conjunction Q ∧ R strengthens to an implication into the tensor Q ⊠ R. Proving a tensor from P would normally require splitting P between the two factors. An affirmative P is equivalent to !P, which is equivalent to P ⊠ P ([[AffineConstructive.logic.aprop.aprod_of_course]]), so each factor may use all of P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_apar_refutative","base":"aor_apar_refutative","kind":"def","start":397,"body":null,"status":"ok","short":{"text":"For refutative R, P ∨ Q ⊸ R gives P ⊞ Q ⊸ R","status":"ok"},"long":{"text":"If R is refutative, an implication from the additive disjunction P ∨ Q to R extends to the par P ⊞ Q. It is the dual of [[AffineConstructive.logic.aprop.affirmative_aand_aprod]], obtained by contraposition: the refutation of R, being refutative-dual hence reusable, can be spent on each disjunct.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.affirmative_aprod_aimpl_l","base":"affirmative_aprod_aimpl_l","kind":"def","start":398,"body":null,"status":"ok","short":{"text":"For affirmative P, assuming P in the base logic proves P ⊠ Q ⊸ R from Q ⊸ R","status":"ok"},"long":{"text":"If P is affirmative, then to prove P ⊠ Q ⊸ R it suffices to prove Q ⊸ R assuming a proof of P in the base logic. An affirmative factor of a hypothesis can thus be introduced into the context as an ordinary assumption, usable freely, while the rest of the hypothesis keeps its affine accounting.\n\nIt is the affine substitute for introducing a hypothesis: only an affirmative factor, or one under ! as in [[AffineConstructive.logic.aprop.of_course_aprod_aimpl_l]], can be moved out of the affine statement this way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.affirmative_aprod_aimpl_r","base":"affirmative_aprod_aimpl_r","kind":"def","start":399,"body":null,"status":"ok","short":{"text":"For affirmative P, assuming P in the base logic proves Q ⊠ P ⊸ R from Q ⊸ R","status":"ok"},"long":{"text":"The mirror of [[AffineConstructive.logic.aprop.affirmative_aprod_aimpl_l]], with the affirmative factor on the right of the tensor: a proof of Q ⊸ R under the base-logic assumption P gives Q ⊠ P ⊸ R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_aprod_aimpl_l","base":"of_course_aprod_aimpl_l","kind":"def","start":400,"body":null,"status":"ok","short":{"text":"Assuming P in the base logic, Q ⊸ R proves !P ⊠ Q ⊸ R","status":"ok"},"long":{"text":"To prove !P ⊠ Q ⊸ R it suffices to prove Q ⊸ R assuming a proof of P in the base logic. Of course P is always affirmative ([[AffineConstructive.logic.aprop.Affirmative_of_course]]) and its proofs are those of P, so this is [[AffineConstructive.logic.aprop.affirmative_aprod_aimpl_l]] for the factor !P, stated without the instance: an affirmed hypothesis is an ordinary assumption.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_aprod_aimpl_r","base":"of_course_aprod_aimpl_r","kind":"def","start":401,"body":null,"status":"ok","short":{"text":"Assuming P in the base logic, Q ⊸ R proves Q ⊠ !P ⊸ R","status":"ok"},"long":{"text":"The mirror of [[AffineConstructive.logic.aprop.of_course_aprod_aimpl_l]], with the affirmed factor !P on the right of the tensor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.affirmative_aex","base":"affirmative_aex","kind":"prf","start":402,"body":[403,420],"status":"ok","short":{"text":"An existential of affirmative propositions is affirmative","status":"ok"},"proof":[{"text":"By [[AffineConstructive.logic.aprop.affirmative_alt]], it suffices to show that a refutation of ∐ y, P y amounts to the absence of any proof of it. The two directions are proved separately.","status":"ok","from":0,"to":2},{"text":"Assume a refutation of the existential and a proof of it, which gives a point y and a proof of P y. The refutation of the existential refutes each P y. Because P y is affirmative, [[AffineConstructive.logic.aprop.affirmative_alt]] says that refuting P y means P y has no proof, which contradicts the proof of P y.","status":"ok","from":3,"to":9},{"text":"Conversely, suppose the existential has no proof, and fix y. A refutation of the existential is a refutation of each P y. Because P y is affirmative, [[AffineConstructive.logic.aprop.affirmative_alt]] reduces this to showing that P y has no proof. A proof of P y would prove the existential, with y as the witness, and this contradicts the assumption.","status":"ok","from":10,"to":17}]},{"name":"AffineConstructive.logic.aprop.refutative_all","base":"refutative_all","kind":"prf","start":422,"body":[423,425],"status":"ok","short":{"text":"A universal of refutative propositions is refutative","status":"ok"},"proof":[{"text":"By De Morgan duality, ∏ y, P y is the negation of ∐ y, (P y)ᗮ. Each (P y)ᗮ is affirmative because P y is refutative, so by [[AffineConstructive.logic.aprop.affirmative_aex]] the existential is affirmative, and the negation of an affirmative proposition is refutative ([[AffineConstructive.logic.aprop.anot_refutative]]).","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.tactics.tauto":{"page":"../tactics/tauto.html","short":"tauto and intuition: intuitionistic propositional decision procedures for the base logic SProp","summary":"The file supplies `tauto` and `intuition` for the base logic `SProp`. Both are adapted from the Rocq core library's tactics of the same names, which do not work on strict propositions as shipped. `tauto` is a complete decision procedure for intuitionistic propositional logic. It handles and, or, implication, [[not]], [[iff]], truth and [[False]], and recognises any connective defined as a record or inductive type of the right shape. `intuition` runs the same search but hands every goal the search leaves open to a solver, `trivial` by default. The changes from the core library are these: negation and equivalence are this development's own; negation is unfolded by restating it as an implication into [[False]]; the classical branch is removed, so only intuitionistic reasoning is used; and two hypothesis-flattening steps are rewritten so that the binders they create get the right relevance for strict propositions. These tactics act only on the base logic. Affine statements are handled by the rewriting system of the neighbouring tactic files."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.logic.srelations":{"page":"srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.interfaces.aprop":{"page":"../interfaces/aprop.html","short":"Affine propositions Ω, their connectives and quantifiers, and the affine properties of relations","summary":"The file defines Ω, the type of affine propositions: a pair of an affirmation and a refutation in SProp that cannot both hold, together with a classicality field supplied by the kernel. The field is trivial in the constructive kernel and forces decidability in the classical one. It builds the connectives from these pairs: truth and falsity, the additive ∧ and ∨, the tensor ⊠ and the par ⊞, the implication ⊸ carrying its contrapositive, the negation, ⧟, the modalities ! and ?, and the quantifiers ∏ and ∐. On top of these it defines Shulman's classes Decidable, Affirmative and Refutative, De Morgan duals, boolean decision procedures (Dec, IsDec), and the affine properties of relations. Symmetry, transitivity (with ⊠ for the multiplicative form and ∧ for the strong one), antisymmetry, totality and equivalence are each stated as an implication between affine propositions. The laws of these connectives are proved in logic/aprop.v, and the rest of the development is written in this language."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.rewrite.proper":{"page":"../tactics/rewrite/proper.html","short":"Hint databases and search tactics for the congruence obligations of rewriting","summary":"The file sets up the hint databases on which the development's rewriting system rests. It creates the `proper` database, where properness and congruence lemmas are registered, and the tactic [[solve_proper]] that searches it by instance resolution, together with [[proper_solution]], which returns the term such a search finds. It also defines a small tagging device, the inductive `RewriteSwapTag` and the database `rewrite_swap_tag`, and the tactic [[swap_rewrite_tag]], which looks up the term declared as the partner of a given term. The rewriting tactics built on top of this file call these to discharge the congruence obligations a rewrite generates and to pass between paired terms."}},"constants":null}</script>

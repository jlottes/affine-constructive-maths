niform/base.html","AffineConstructive.topology.uniform.completion":"topology/uniform/completion.html","AffineConstructive.topology.uniform.uniformly_below":"topology/uniform/uniformly_below.html","AffineConstructive.topology.uniform.basis":"topology/uniform/basis.html","AffineConstructive.topology.uniform.final":"topology/uniform/final.html","AffineConstructive.topology.uniform.product":"topology/uniform/product.html","AffineConstructive.topology.uniform.cylinder":"topology/uniform/cylinder.html","AffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.notation sprop tauto easy srelations.\nRequire Export interfaces.aprop.\nRequire Import tactics.misc rewrite.proper.\n\nImport props_notation.\nImport modality_notation.\n\nLtac tautological_hook ::= unfold seq, Decidable, Affirmative, Refutative, DeMorganDual in *; simpl in *.\n\n(** [atautological]: like [tautological], but first replace every maximal\n    subterm that is *not* built from the affine connectives with a fresh\n    opaque [_ : Ω], and clear the rest of the hypothesis context.  This stops\n    [tautological]'s [simpl in *] from unfolding the atoms (and from churning\n    over a large context), which is the usual cause of slowness.  It automates\n    the manual [set (P := ..); ..; clearbody P ..; clear ..] idiom. *)\n\n(** Syntactic head symbol of [t], peeling applications without any\n    conversion/unfolding. *)\nLtac aprop_term_head t :=\n  lazymatch t with ?g _ => aprop_term_head g | ?h => h end.\n\n(** [A]'s outermost symbol is an affine connective.  This *must* be a syntactic\n    head test, not an [lazymatch A with aprod _ => .. end]: Ltac constr patterns\n    match up to conversion, and every Ω-valued atom reduces in whnf to a\n    connective — a membership [x ∊ U] or equality [x = y] is refutative, so it\n    unfolds to [not_of_course _].  A pattern match therefore classifies *every*\n    atom as a connective, which silently makes [abstract_aprop_atoms] a no-op.\n    Comparing the syntactic head against each connective constant with\n    [constr_eq_nounivs] (universe-insensitive: [all]/[aex] are polymorphic)\n    sidesteps conversion entirely. *)\nLtac aprop_connective_head A :=\n  let h := aprop_term_head A in\n  first\n  [ constr_eq_nounivs h (@atrue)      | constr_eq_nounivs h (@afalse)\n  | constr_eq_nounivs h (@aand)       | constr_eq_nounivs h (@aor)\n  | constr_eq_nounivs h (@aprod)      | constr_eq_nounivs h (@apar)\n  | constr_eq_nounivs h (@aimpl)      | constr_eq_nounivs h (@aiff)\n  | constr_eq_nounivs h (@anot)\n  | constr_eq_nounivs h (@of_course)  | constr_eq_nounivs h (@not_of_course)\n  | constr_eq_nounivs h (@why_not) ].\n  (* | constr_eq_nounivs h (@all)        | constr_eq_nounivs h (@aex) ]. *)\n\n(** [T] is the type of an affine proposition.  By default this is just the\n    bare constant [AProp]; once [theory.set] makes [Ω] into a set, equality and\n    membership atoms are typed through the set's carrier [set_T AProp_set]\n    instead, so [theory.set] extends this recognizer (via [::=]) to accept that\n    form too.  Kept to [constr_eq] alternatives — a general [unify] convertibility\n    test would be far more expensive across the many subterms scanned. *)\nLtac is_aprop_type T := constr_eq T AProp.\n\n(** [A] is an atom worth abstracting: it has type [Ω], its head is not a\n    connective, and it is not already an opaque variable. *)\nLtac is_aprop_atom A :=\n  let T := type of A in is_aprop_type T;\n  assert_fails (is_var A);\n  assert_fails (aprop_connective_head A).\n\n(** Before sealing an atom [A] under a fresh opaque [P], fold every occurrence\n    that is *convertible* to [A] onto [A] itself, so they all abstract to the\n    same [P].  This matters for universe-variant copies of one atom: the goal\n    routinely contains several copies of, say, [w ⪽ W] at distinct (fresh,\n    not-yet-collapsed) universe levels.  [set] only seals syntactically identical\n    occurrences, so without this they would become *different* opaque atoms and a\n    real tautology would no longer look like one.  [constr_eq_nounivs] is too\n    weak here (the copies can differ in more than a head universe instance);\n    [change B with A] is the honest test — it succeeds exactly when [B ≡ A],\n    emitting the universe constraints that collapse the copies.  A same-head\n    [constr_eq_nounivs] pre-filter keeps us from attempting [change] against every\n    subterm. *)\nLtac abstract_aprop_atoms :=\n  repeat match goal with\n  | |- context [ ?A ] =>\n      is_aprop_atom A;\n      repeat (match goal with |- context [ ?B ] =>\n        assert_fails (constr_eq A B);\n        let hA := aprop_term_head A in let hB := aprop_term_head B in\n        constr_eq_nounivs hA hB;\n        change B with A end);\n      let P := fresh \"P\" in set (P := A); clearbody P\n  end.\n\nLtac clear_aprop_context :=\n  repeat match goal with H : _ |- _ => clear H end.\n\nLtac tautological := abstract_aprop_atoms; clear_aprop_context; full_tautological.\nAbbreviation tautology := ltac:(normalize_proof full_tautological) (only parsing).\n\n(** Extensible typeclass mechanism for inferring the DeMorgan dual of a proposition P. *)\nDefinition demorgan_dual_base {P} : DeMorganDual P (P ᗮ) := tautology.\nGlobal Hint Extern 100 (DeMorganDual _ _) => simple notypeclasses refine demorgan_dual_base : typeclass_instances.\n\nNotation \"'dual:(' P )\" :=  ltac:( let t := constr:( _ : DeMorganDual P _ ) in\n    lazymatch type of t with DeMorganDual _ ?Q => exact Q end) (only parsing).\n\nDefinition atrue_dual : DeMorganDual 𝐓 𝐅 := tautology.\nDefinition afalse_dual : DeMorganDual 𝐅 𝐓 := tautology.\nDefinition anot_dual {P} : DeMorganDual (P ᗮ) P := tautology.\nDefinition aand_dual  `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : DeMorganDual (P ∧ Q) (Pd ∨ Qd) := tautology.\nDefinition aor_dual   `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : DeMorganDual (P ∨ Q) (Pd ∧ Qd) := tautology.\nDefinition aprod_dual `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : DeMorganDual (P ⊠ Q) (Pd ⊞ Qd) := tautology.\nDefinition apar_dual  `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : DeMorganDual (P ⊞ Q) (Pd ⊠ Qd) := tautology.\nDefinition aimpl_dual  {P} `{DeMorganDual Q Qd} : DeMorganDual (P ⊸ Q) (P ⊠ Qd) := tautology.\nDefinition aiff_dual `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : DeMorganDual (P ⧟ Q) ((P ⊠ Qd) ∨ (Pd ⊠ Q)) := tautology.\nDefinition aimpl_dual_back1 {P Q} : DeMorganDual (P ᗮ ⊠ Q) (Q ⊸ P) := tautology.\nDefinition aimpl_dual_back2 {P Q} : DeMorganDual (P ⊠ Q ᗮ) (P ⊸ Q) := tautology.\nDefinition of_course_dual `{DeMorganDual P Pd} : DeMorganDual (!P) (? Pd) := tautology.\nDefinition why_not_dual `{DeMorganDual P Pd} : DeMorganDual (? P) (!Pd) := tautology.\n\nGlobal Hint Extern 2 (DeMorganDual atrue _) => notypeclasses refine atrue_dual : typeclass_instances.\nGlobal Hint Extern 2 (DeMorganDual afalse _) => notypeclasses refine afalse_dual : typeclass_instances.\nGlobal Hint Extern 2 (DeMorganDual (_ ᗮ) _) => notypeclasses refine anot_dual : typeclass_instances.\nGlobal Hint Extern 10 (DeMorganDual (aand _) _) => notypeclasses refine aand_dual : typeclass_instances.\nGlobal Hint Extern 10 (DeMorganDual (aor _) _) => notypeclasses refine aor_dual : typeclass_instances.\nGlobal Hint Extern 10 (DeMorganDual (_ ⊠ _) _) => notypeclasses refine aprod_dual : typeclass_instances.\nGlobal Hint Extern 10 (DeMorganDual (_ ⊞ _) _) => notypeclasses refine apar_dual : typeclass_instances.\nGlobal Hint Extern 10 (DeMorganDual (_ ⊸ _) _) => notypeclasses refine aimpl_dual : typeclass_instances.\nGlobal Hint Extern 10 (DeMorganDual (_ ⧟ _) _) => notypeclasses refine aiff_dual : typeclass_instances.\nGlobal Hint Extern 5 (DeMorganDual (! _) _) => notypeclasses refine of_course_dual : typeclass_instances.\nGlobal Hint Extern 5 (DeMorganDual (? _) _) => notypeclasses refine why_not_dual : typeclass_instances.\n\n\nDefinition contradiction {P:Ω} : P → P ᗮ → False := tautology.\nDefinition aimpl_by_contradiction `{DeMorganDual P Pd} {Q} : Pd → (P ⊸ Q) := tautology.\nDefinition by_contradiction `{DeMorganDual P Pd} {Q:Ω} : P → Pd → Q := tautology.\n\nDefinition acontra_eq (P Q : Ω) : (P ⊸ Q) ⧟ (Q ᗮ ⊸ P ᗮ) := tautology.\nDefinition acontra_iff_eq (P Q : Ω) : (P ⧟ Q) ⧟ (P ᗮ ⧟ Q ᗮ) := tautology.\n\nDefinition acontra : ∀ {P Q : Ω}, (P ⊸ Q) → (Q ᗮ ⊸ P ᗮ) := tautology.\nDefinition acontra_iff : ∀ {P Q : Ω}, (P ⧟ Q) → (P ᗮ ⧟ Q ᗮ) := tautology.\n\nDefinition contrapositive_eq     `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : (P ⊸ Q) ⧟ (Qd ⊸ Pd) := tautology.\nDefinition contrapositive_iff_eq `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : (P ⧟ Q) ⧟ (Pd ⧟ Qd) := tautology.\nDefinition contrapositive        `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : (Q ⊸ P) → (Pd ⊸ Qd) := tautology.\nDefinition contrapositive_iff    `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : (P ⧟ Q) → (Pd ⧟ Qd) := tautology.\nDefinition by_contrapositive     `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : (Qd ⊸ Pd) → (P ⊸ Q) := tautology.\nDefinition by_contrapositive_iff `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : (Pd ⧟ Qd) → (P ⧟ Q) := tautology.\n\nDefinition aimpl_split_dual `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : (P → Q) → (Qd → Pd) → (P ⊸ Q) := tautology.\nDefinition apar_split_dual `{DeMorganDual P Pd} `{DeMorganDual Q Qd} : (Pd → Q) → (Qd → P) → (P ⊞ Q) := tautology.\n\nDefinition why_not_by_dual `{DeMorganDual P Pd} : (¬Pd) → ? P := tautology.\n\nDefinition decidable_dual P `{DeMorganDual P Pd} `{Decidable P} : P ∨ Pd := tautology.\nDefinition decidable_by_dual `{DeMorganDual P Pd} : P ∨ Pd → Decidable P := tautology.\n\nSection tautologies.\n  Context (P Q R S : Ω).\n\n  Definition aimpl_true : P ⊸ 𝐓 := tautology.\n  Definition false_aimpl: 𝐅 ⊸ P := tautology.\n  Definition true_aimpl : (𝐓 ⊸ P) ⧟ P := tautology.\n  Definition aimpl_false: (P ⊸ 𝐅) ⧟ P ᗮ := tautology.\n  Definition aiff_true  : (P ⧟ 𝐓) ⧟ P := tautology.\n  Definition aiff_false : (P ⧟ 𝐅) ⧟ P ᗮ := tautology.\n\n  Definition aandl : P ∧ Q ⊸ P := tautology.\n  Definition aandr : P ∧ Q ⊸ Q := tautology.\n  Definition aand_lub : (R ⊸ P) ∧ (R ⊸ Q) ⊸ (R ⊸ P ∧ Q) := tautology.\n  Definition ot_idem P : ? (? P) ⧟ ? P := tautology.\nEnd tautologies.\nArguments aand_intro {P Q R} _ _.\nArguments aor_elim {P Q R} _ _.\n\nGlobal Hint Extern 20 (apos (aand _)) => split : typeclass_instances.\nGlobal Hint Extern 20 (apos (aprod _)) => split : typeclass_instances.\n\nGlobal Hint Extern 2 (apos atrue) => refine sprop.I : typeclass_instances.\n\nGlobal Hint Extern 2 (apos (_ ⊸ atrue)) => refine (aimpl_true _) : typeclass_instances.\nGlobal Hint Extern 2 (apos (afalse ⊸ _)) => refine (false_aimpl _) : typeclass_instances.\nGlobal Hint Extern 2 (apos (aand (?P, _) ⊸ ?Q)) => match P with Q => refine (aandl _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (aand (_, ?P) ⊸ ?Q)) => match P with Q => refine (aandr _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (?P ⊸ aor (?Q, _))) => match P with Q => refine (aorl _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (?P ⊸ aor (_, ?Q))) => match P with Q => refine (aorr _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (?P ⊠ _ ⊸ ?Q)) => match P with Q => refine (aprodl _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (_ ⊠ ?P ⊸ ?Q)) => match P with Q => refine (aprodr _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (?P ⊠ ?Q ⊸ aand (?P2, ?Q2))) => match P with P2 => match Q with Q2 => refine (aprod_aand _ _) end end : typeclass_instances.\nGlobal Hint Extern 2 (apos (?P ⊸ ?Q ⊞ _)) => match P with Q => refine (aparl _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (?P ⊸ _ ⊞ ?Q)) => match P with Q => refine (aparr _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (aor (?P, ?Q) ⊸ ?P2 ⊞ ?Q2)) => match P with P2 => match Q with Q2 => refine (aor_apar _ _) end end : typeclass_instances.\n\nGlobal Hint Extern 2 (apos (! apos ?P ⊸ ?Q)) => match P with Q => refine (of_course_aimpl _ _) end : typeclass_instances.\nGlobal Hint Extern 2 (apos (?P ⊸ ? ?Q)) => match P with Q => refine (aimpl_why_not _ _) end : typeclass_instances.\nGlobal Hint Extern 2 ( ../tactics/easy.html"},{"s":26137,"e":26140,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":26142,"e":26147,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26251,"e":26255,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":26283,"e":26288,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26326,"e":26329,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":26348,"e":26369,"lib":"AffineConstructive.logic.srelations","name":"forall_proper_iff_tac","kind":"ltac","local":false,"page":"srelations.html"},{"s":26373,"e":26378,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26480,"e":26484,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":26512,"e":26515,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":26644,"e":26647,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":26649,"e":26654,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26760,"e":26765,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26804,"e":26807,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":26832,"e":26853,"lib":"AffineConstructive.logic.srelations","name":"forall_proper_iff_tac","kind":"ltac","local":false,"page":"srelations.html"},{"s":34185,"e":34188,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":34398,"e":34401,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable.","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","items":[{"name":"AffineConstructive.logic.aprop.tautological_hook","base":"tautological_hook","kind":"ltac","start":5,"body":null,"status":"ok","short":{"text":"Unfolds the classes of propositions and De Morgan duals before the tautology checker runs","status":"ok"},"long":{"text":"A hook that the tautology decision procedure calls before it starts. This file redefines it so that strict equality as a relation ([[AffineConstructive.interfaces.sprop.seq]]), the classes [[AffineConstructive.interfaces.aprop.Decidable]], [[AffineConstructive.interfaces.aprop.Affirmative]] and [[AffineConstructive.interfaces.aprop.Refutative]], and the class [[AffineConstructive.interfaces.aprop.DeMorganDual]] are unfolded everywhere, in the goal and in every hypothesis, and the result simplified. Each of these is a statement about the proof and refutation components of affine propositions, so once unfolded they are visible to the decision procedure as plain statements of the base logic.\n\nThis is what lets the file prove, by the same one-word proof as an ordinary tautology, that 𝐓 is decidable, that a disjunction of affirmative propositions is affirmative, or that P ⊠ Q has P ⊞ Q as a dual normal form. The hook is not called by hand; it takes effect through [[AffineConstructive.logic.aprop.tautological]] and the abbreviation [[AffineConstructive.logic.aprop.tautology]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprop_term_head","base":"aprop_term_head","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"Returns the head symbol of a term, peeling off its arguments without unfolding anything","status":"ok"},"long":{"text":"The tactic strips arguments from a term one at a time and returns the function that remains, the syntactic head. Nothing is reduced or unfolded, so the head returned is the constant actually written. It supports the atom recognisers below, which need to know whether a term is literally built by a connective, not whether it reduces to one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprop_connective_head","base":"aprop_connective_head","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"Succeeds when the written head of an affine proposition is one of the affine connectives","status":"ok"},"long":{"text":"The tactic takes the syntactic head of a proposition (by [[AffineConstructive.logic.aprop.aprop_term_head]]) and compares it, ignoring universe levels, with each connective constant: truth, falsity, the two additive and the two multiplicative connectives, implication, the biconditional, negation, of course, its negation, and why not. The quantifiers are left out of the list on purpose.\n\nThe test has to be syntactic. A pattern match compares terms up to conversion. Every atom, such as a membership x ∊ U or an equality x = y, reduces to a connective, because a refutative atom unfolds to the negation of an of course. A pattern match would therefore count every atom as a connective.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.is_aprop_type","base":"is_aprop_type","kind":"ltac","start":8,"body":null,"status":"ok","short":{"text":"Succeeds when a type is the type Ω of affine propositions","status":"ok"},"long":{"text":"By default the tactic accepts only the constant Ω, compared syntactically. Once Ω has been made into a set, equality and membership atoms are typed through the carrier of that set, and the file that does so redefines this recogniser to accept that form as well. The test stays a cheap syntactic comparison, not a convertibility check, because it runs on every subterm scanned.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.is_aprop_atom","base":"is_aprop_atom","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"Succeeds when a term is an affine proposition, not a variable, and not headed by a connective","status":"ok"},"long":{"text":"The tactic picks out the subterms that the decision procedure should treat as opaque propositional atoms. The term must have type Ω (by [[AffineConstructive.logic.aprop.is_aprop_type]]), must not already be a variable, and its written head must not be a connective (by [[AffineConstructive.logic.aprop.aprop_connective_head]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.abstract_aprop_atoms","base":"abstract_aprop_atoms","kind":"ltac","start":10,"body":null,"status":"ok","short":{"text":"Replaces each maximal non-connective affine subproposition of the goal by a fresh opaque proposition","status":"ok"},"long":{"text":"The tactic repeatedly finds a subterm of the goal that passes [[AffineConstructive.logic.aprop.is_aprop_atom]]. It first folds onto that atom every other subterm with the same head that is convertible to it. It then names the atom by a fresh variable of type Ω and forgets the definition, so the variable is opaque. What remains is a formula built from connectives over independent atoms.\n\nThe folding step is needed because a goal often holds several copies of one atom, say a neighbourhood statement, at different universe levels. Without folding these would become different atoms, and a true tautology would no longer look like one. A same-head check limits the attempts. The convertibility check then both confirms the match and merges the universe levels.\n\nThis tactic is the first step of `tautological`. Sealing the atoms keeps the decision procedure from unfolding memberships and equalities into their components, the usual source of slowness. It replaces abstracting each atom by hand before calling the procedure.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.clear_aprop_context","base":"clear_aprop_context","kind":"ltac","start":11,"body":null,"status":"ok","short":{"text":"Clears every hypothesis from the context","status":"ok"},"long":{"text":"Removes all hypotheses, one after another, until the context is empty. It is the second stage of [[AffineConstructive.logic.aprop.tautological]]: once the affine atoms of the goal have been replaced by opaque propositions, nothing else in the context bears on whether the goal is a tautology, and a large context only slows down the decision procedure, which simplifies every hypothesis it sees. The tactic fails on no goal; a hypothesis that others depend on is cleared once its dependents are gone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.tautological","base":"tautological","kind":"ltac","start":12,"body":null,"status":"ok","short":{"text":"Proves a goal that is a propositional tautology in the affine connectives, treating everything else as atoms","status":"ok"},"long":{"text":"Decides goals that hold by the shape of their affine connectives alone. It runs in three stages. First, every maximal subterm of type Ω whose head is not one of the affine connectives (truth, falsity, the additive and multiplicative conjunctions and disjunctions, implication, the biconditional, negation, of course and why not) is replaced by a fresh opaque proposition; a membership x ∊ U, an equality x = y or a neighbourhood relation becomes a letter P. Before an atom is sealed, every other occurrence convertible to it is folded onto it, so that copies differing only in universe levels become the same letter and a genuine tautology still looks like one. Second, the context is cleared ([[AffineConstructive.logic.aprop.clear_aprop_context]]). Third, the full decision procedure for tautologies runs on what remains, after [[AffineConstructive.logic.aprop.tautological_hook]] has unfolded the classes of propositions.\n\nThe abstraction is a matter of speed and robustness: without it the decision procedure would simplify inside the atoms, unfolding a membership or an equality into its components and searching over a large context. Proofs reach for it when a step is pure propositional bookkeeping, a rearrangement of factors or a De Morgan law, too tangled to do by a short chain of rewrites. The definitions of this file use the abbreviation [[AffineConstructive.logic.aprop.tautology]] instead, which runs the decision procedure directly, since their statements consist of variables already.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.tautology","base":"tautology","kind":"abbrev","start":13,"body":null,"status":"ok","short":{"text":"Proves an affine tautology by the decision procedure for the connectives","status":"ok"},"long":{"text":"An abbreviation for a proof term that a decision procedure for affine tautologies fills in. Most results in the file are stated as the type of a definition and proved this way. The procedure unfolds the connectives into their proof and refutation components, works in the intuitionistic base logic, and normalises the proof term it finds. The definitions it proves are therefore transparent, and later developments use them as laws, not as computations.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.demorgan_dual_base","base":"demorgan_dual_base","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"Every affine proposition P has the negation Pᗮ as a De Morgan dual","status":"ok"},"long":{"text":"This is the fallback instance of [[AffineConstructive.interfaces.aprop.DeMorganDual]]. When no more specific rule applies, the dual of P is its negation Pᗮ, left unsimplified. Resolution tries it only after the instances for the individual connectives, which push the negation inward. A dual is therefore always found, and it is in normal form wherever the shape of P allows.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.atrue_dual","base":"atrue_dual","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"The De Morgan dual of truth 𝐓 is falsity 𝐅","status":"ok"},"long":{"text":"The base case of the De Morgan dual for the constants: negating 𝐓 gives 𝐅. It is registered with high priority, so the dual of truth is always the constant and never the unsimplified negation 𝐓ᗮ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.afalse_dual","base":"afalse_dual","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"The De Morgan dual of falsity 𝐅 is truth 𝐓","status":"ok"},"long":{"text":"The companion of [[AffineConstructive.logic.aprop.atrue_dual]]: negating 𝐅 gives 𝐓. It is registered with high priority, so the dual of falsity is always the constant.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.anot_dual","base":"anot_dual","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The De Morgan dual of a negation Pᗮ is P itself","status":"ok"},"long":{"text":"Negation in the affine logic is an involution, because it only swaps the proof and refutation components. The dual of Pᗮ is therefore P, with no double negation left over. This instance is what makes contraposition of a statement about a negation come out in normal form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_dual","base":"aand_dual","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"If P, Q have duals Pd, Qd, then the dual of P ∧ Q is Pd ∨ Qd","status":"ok"},"long":{"text":"The De Morgan law for the additive connectives: the negation of P ∧ Q is Pᗮ ∨ Qᗮ. The duals of the components are found recursively, so a nested proposition is negated all the way down by resolution. The additive conjunction dualises to the additive disjunction, as in linear logic.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_dual","base":"aor_dual","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"If P, Q have duals Pd, Qd, then the dual of P ∨ Q is Pd ∧ Qd","status":"ok"},"long":{"text":"The De Morgan law for the additive disjunction: the negation of P ∨ Q is Pᗮ ∧ Qᗮ. Together with [[AffineConstructive.logic.aprop.aand_dual]] it makes the additive pair self-dual.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_dual","base":"aprod_dual","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"If P, Q have duals Pd, Qd, then the dual of P ⊠ Q is Pd ⊞ Qd","status":"ok"},"long":{"text":"The De Morgan law for the multiplicatives: the negation of P ⊠ Q is the par Pᗮ ⊞ Qᗮ. In Shulman's reading, P ⊠ Q is refuted when an affirmation of either factor yields a refutation of the other. That is the meaning of par, and it is why ⊞ and not ∨ is the dual of ⊠.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_dual","base":"apar_dual","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"If P, Q have duals Pd, Qd, then the dual of P ⊞ Q is Pd ⊠ Qd","status":"ok"},"long":{"text":"The De Morgan law for par: the negation of P ⊞ Q is the tensor Pᗮ ⊠ Qᗮ. Together with [[AffineConstructive.logic.aprop.aprod_dual]] it makes the multiplicative pair self-dual.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_dual","base":"aimpl_dual","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"If Q has dual Qd, then the dual of P ⊸ Q is P ⊠ Qd","status":"ok"},"long":{"text":"An affine implication P ⊸ Q is Pᗮ ⊞ Q, so its negation is P ⊠ Qᗮ: P holds and Q fails, with both facts usable together. This is the precise sense in which a refutation of an implication is a counterexample. Only the consequent is dualised, recursively; the antecedent appears unchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_dual","base":"aiff_dual","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The dual of P ⧟ Q is (P ⊠ Qd) ∨ (Pd ⊠ Q)","status":"ok"},"long":{"text":"An affine biconditional is the additive conjunction (P ⊸ Q) ∧ (Q ⊸ P). Its negation is therefore the additive disjunction of the two duals given by [[AffineConstructive.logic.aprop.aimpl_dual]]: either P holds and Q fails, or P fails and Q holds.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_dual_back1","base":"aimpl_dual_back1","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"The dual of Pᗮ ⊠ Q is the implication Q ⊸ P","status":"ok"},"long":{"text":"A reverse reading of [[AffineConstructive.logic.aprop.aimpl_dual]]: a tensor with a negated factor is the negation of an implication. Taken as the De Morgan dual of Pᗮ ⊠ Q, this gives back the implication Q ⊸ P, not a par with a double negation. It is not registered as a hint, so resolution does not find it on its own.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_dual_back2","base":"aimpl_dual_back2","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"The dual of P ⊠ Qᗮ is the implication P ⊸ Q","status":"ok"},"long":{"text":"The mirror of [[AffineConstructive.logic.aprop.aimpl_dual_back1]], with the negated factor on the right: the negation of P ⊠ Qᗮ is P ⊸ Q. Like its mirror, it is not registered as a hint.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_dual","base":"of_course_dual","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"If P has dual Pd, then the dual of !P is ?Pd","status":"ok"},"long":{"text":"The De Morgan law for the exponentials: negating \"of course\" gives \"why not\" of the negation. It is registered at a priority above the binary connectives, so a modality is dualised as a modality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.why_not_dual","base":"why_not_dual","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"If P has dual Pd, then the dual of ?P is !Pd","status":"ok"},"long":{"text":"The companion of [[AffineConstructive.logic.aprop.of_course_dual]]: negating \"why not\" gives \"of course\" of the negation. Together they make the exponential pair self-dual.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.contradiction","base":"contradiction","kind":"def","start":41,"body":null,"status":"ok","short":{"text":"A proof of P and a proof of Pᗮ together give falsity","status":"ok"},"long":{"text":"The defining property of an affine proposition, stated in the base logic: its proofs and its refutations cannot both be had. A proof of P and a proof of its negation Pᗮ together give the false strict proposition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_by_contradiction","base":"aimpl_by_contradiction","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"A proof of the dual of P proves that P implies anything","status":"ok"},"long":{"text":"If P is refuted, then P ⊸ Q holds for every Q. The forward half holds vacuously, and the contrapositive half is supplied by the refutation of P itself. The refutation is given as the De Morgan dual, so it can be in normal form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.by_contradiction","base":"by_contradiction","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"From proofs of P and of its dual, any affine proposition follows","status":"ok"},"long":{"text":"Ex falso in the base logic: proofs of P and of its De Morgan dual are incompatible by [[AffineConstructive.logic.aprop.contradiction]], so they prove any Q. It closes a goal in a case that cannot occur.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.acontra_eq","base":"acontra_eq","kind":"def","start":44,"body":null,"status":"ok","short":{"text":"P implies Q if and only if Qᗮ implies Pᗮ, affinely","status":"ok"},"long":{"text":"Contraposition as an affine equivalence. An affine implication already carries its contrapositive, and swapping the two components of P ⊸ Q gives Qᗮ ⊸ Pᗮ. The two are therefore equivalent as affine propositions, not only as provable statements, and the equivalence can be used to rewrite inside a larger formula.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.acontra_iff_eq","base":"acontra_iff_eq","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"P ⧟ Q is equivalent, affinely, to Pᗮ ⧟ Qᗮ","status":"ok"},"long":{"text":"Contraposition for the biconditional: two propositions are equivalent exactly when their negations are, and this holds as an affine equivalence. It follows from [[AffineConstructive.logic.aprop.acontra_eq]] applied to each direction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.acontra","base":"acontra","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"If P implies Q, then Qᗮ implies Pᗮ","status":"ok"},"long":{"text":"Contraposition as a rule: a proof of P ⊸ Q gives a proof of Qᗮ ⊸ Pᗮ. This is the provable consequence of [[AffineConstructive.logic.aprop.acontra_eq]], used when the contrapositive is wanted as a fact and not as a rewrite.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.acontra_iff","base":"acontra_iff","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"If P ⧟ Q, then Pᗮ ⧟ Qᗮ","status":"ok"},"long":{"text":"The rule form of [[AffineConstructive.logic.aprop.acontra_iff_eq]]: an equivalence of propositions gives an equivalence of their negations.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.contrapositive_eq","base":"contrapositive_eq","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"P implies Q if and only if the dual of Q implies the dual of P","status":"ok"},"long":{"text":"Contraposition with the negations in De Morgan normal form: [[AffineConstructive.logic.aprop.acontra_eq]] restated with Pᗮ and Qᗮ replaced by the duals Pd and Qd that resolution finds for them. Rewriting by it turns an implication into its contrapositive with the negations already pushed inward.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.contrapositive_iff_eq","base":"contrapositive_iff_eq","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"P ⧟ Q is equivalent to Pd ⧟ Qd, with Pd, Qd the duals","status":"ok"},"long":{"text":"The biconditional form of [[AffineConstructive.logic.aprop.contrapositive_eq]]: P ⧟ Q is equivalent to the biconditional of the De Morgan duals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.contrapositive","base":"contrapositive","kind":"def","start":50,"body":null,"status":"ok","short":{"text":"If Q implies P, then the dual of P implies the dual of Q","status":"ok"},"long":{"text":"Contraposition as a rule with the negations in De Morgan normal form: from a proof of Q ⊸ P, conclude Pd ⊸ Qd. It derives a statement about refutations from one about proofs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.contrapositive_iff","base":"contrapositive_iff","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"If P ⧟ Q, then their duals are equivalent","status":"ok"},"long":{"text":"The rule form of [[AffineConstructive.logic.aprop.contrapositive_iff_eq]]: an equivalence P ⧟ Q gives the equivalence of the De Morgan duals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.by_contrapositive","base":"by_contrapositive","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"Proof by contraposition: Qd ⊸ Pd, with the duals in normal form, proves P ⊸ Q","status":"ok"},"long":{"text":"Proof by contraposition: a proof of Qd ⊸ Pd, where Pd and Qd are the De Morgan duals of P and Q found by resolution, is a proof of P ⊸ Q. Applied to a goal, it replaces the goal by its contrapositive with the negations pushed inward. Since an affine implication carries its contrapositive, nothing is lost in the exchange. It is used in about thirty proof steps, in the files on orders, naturals and rings and in bounded subspaces.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.by_contrapositive_iff","base":"by_contrapositive_iff","kind":"def","start":53,"body":null,"status":"ok","short":{"text":"To prove P ⧟ Q it suffices to prove the equivalence of their duals","status":"ok"},"long":{"text":"The biconditional form of [[AffineConstructive.logic.aprop.by_contrapositive]]: a proof of Pd ⧟ Qd is a proof of P ⧟ Q.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_split_dual","base":"aimpl_split_dual","kind":"def","start":54,"body":null,"status":"ok","short":{"text":"Builds P ⊸ Q from P → Q and Qd → Pd in the base logic","status":"ok"},"long":{"text":"An affine implication is a pair: the forward map on proofs and the backward map on refutations. This constructor builds P ⊸ Q from the two maps given separately, as base-logic implications, with the refutations in De Morgan normal form. It is the way out of the algebra into the components, for the cases where a statement must be proved by its two halves.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_split_dual","base":"apar_split_dual","kind":"def","start":55,"body":null,"status":"ok","short":{"text":"Builds P ⊞ Q from Pd → Q and Qd → P in the base logic","status":"ok"},"long":{"text":"A par P ⊞ Q is proved by showing that a refutation of either side gives a proof of the other. This constructor takes those two base-logic implications, with the refutations in De Morgan normal form, and assembles the par.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.why_not_by_dual","base":"why_not_by_dual","kind":"def","start":56,"body":null,"status":"ok","short":{"text":"If the dual of P cannot be proved, then why not P holds","status":"ok"},"long":{"text":"?P is proved by the impossibility of refuting P. This constructor states that with the refutation in De Morgan normal form: a base-logic proof that Pd fails gives ?P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.decidable_dual","base":"decidable_dual","kind":"def","start":57,"body":null,"status":"ok","short":{"text":"A decidable P gives the additive disjunction of P and its dual","status":"ok"},"long":{"text":"Shulman's decidable propositions are those for which P ∨ Pᗮ holds. This states the disjunction with the negation in De Morgan normal form, so that case analysis on a decidable proposition yields the two cases in a usable shape.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.decidable_by_dual","base":"decidable_by_dual","kind":"def","start":58,"body":null,"status":"ok","short":{"text":"P ∨ Pd, with Pd the dual of P, makes P decidable","status":"ok"},"long":{"text":"The converse of [[AffineConstructive.logic.aprop.decidable_dual]]: excluded middle, stated with the dual in normal form, establishes that P is [[AffineConstructive.interfaces.aprop.Decidable]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_true","base":"aimpl_true","kind":"def","start":61,"body":null,"status":"ok","short":{"text":"Every affine proposition implies truth","status":"ok"},"long":{"text":"Truth 𝐓 is the top element for implication. The forward half is trivial, and the contrapositive half is vacuous because 𝐓 is never refuted. It is registered so that resolution discharges goals of this shape on its own.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.false_aimpl","base":"false_aimpl","kind":"def","start":62,"body":null,"status":"ok","short":{"text":"Falsity implies every affine proposition","status":"ok"},"long":{"text":"Falsity 𝐅 is the bottom element for implication, the dual of [[AffineConstructive.logic.aprop.aimpl_true]]. It is registered so that goals of this shape are discharged automatically.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.true_aimpl","base":"true_aimpl","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"𝐓 implies P if and only if P","status":"ok"},"long":{"text":"Truth is a left unit for implication, as an affine equivalence. An implication from 𝐓 carries no information beyond its conclusion, and its contrapositive half adds nothing because 𝐓 is never refuted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_false","base":"aimpl_false","kind":"def","start":64,"body":null,"status":"ok","short":{"text":"P implies 𝐅 if and only if Pᗮ","status":"ok"},"long":{"text":"Implication into falsity is negation, as an affine equivalence. This is the affine counterpart of the intuitionistic definition ¬P := P → ⊥. Here negation is primitive and the law is a theorem.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_true","base":"aiff_true","kind":"def","start":65,"body":null,"status":"ok","short":{"text":"P ⧟ 𝐓 is equivalent to P","status":"ok"},"long":{"text":"To be equivalent to truth is to hold, as an affine equivalence. It is used to discard a biconditional with 𝐓 when rewriting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_false","base":"aiff_false","kind":"def","start":66,"body":null,"status":"ok","short":{"text":"P ⧟ 𝐅 is equivalent to Pᗮ","status":"ok"},"long":{"text":"To be equivalent to falsity is to be refuted, as an affine equivalence. It is the biconditional companion of [[AffineConstructive.logic.aprop.aimpl_false]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aandl","base":"aandl","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"P ∧ Q implies P","status":"ok"},"long":{"text":"The left projection of the additive conjunction. A proof of P ∧ Q offers both conjuncts, and this law chooses the left one. Its contrapositive half takes a refutation of P to the refutation Pᗮ ∨ Qᗮ. It is registered so that resolution proves goals of this shape on its own.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aandr","base":"aandr","kind":"def","start":68,"body":null,"status":"ok","short":{"text":"P ∧ Q implies Q: the right projection of the additive conjunction","status":"ok"},"long":{"text":"The second projection of the additive conjunction, companion to [[AffineConstructive.logic.aprop.aandl]]. A hypothesis P ∧ Q offers a choice of one conjunct, and this law takes the right one. Read the other way, as every affine implication can be, it says that a refutation of Q refutes P ∧ Q.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_lub","base":"aand_lub","kind":"def","start":69,"body":null,"status":"ok","short":{"text":"(R ⊸ P) ∧ (R ⊸ Q) implies R ⊸ P ∧ Q: the additive conjunction is a meet","status":"ok"},"long":{"text":"The internal form of the universal property of the additive conjunction: P ∧ Q is the greatest lower bound of P and Q under implication. The hypothesis is itself additive. To prove P ∧ Q from R, each conjunct is proved from R separately, so R is never used twice, and only one of the two implications is needed in each case. [[AffineConstructive.logic.aprop.aand_intro]] is the external form, used as a proof step.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_intro","base":"aand_intro","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"From R ⊸ P and R ⊸ Q, builds R ⊸ P ∧ Q","status":"ok"},"long":{"text":"Introduction of the additive conjunction on the right of an implication, the external form of [[AffineConstructive.logic.aprop.aand_lub]]. The proofs use it to split a conjunctive goal into two goals, each proved from the same hypothesis R. This is the asymmetry of the accounting: in the conclusion, an additive conjunction asks for each conjunct separately, and R is not duplicated.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_assoc","base":"aand_assoc","kind":"def","start":71,"body":null,"status":"ok","short":{"text":"The additive conjunction is associative: (P ∧ Q) ∧ R if and only if P ∧ (Q ∧ R)","status":"ok"},"long":{"text":"Associativity of the additive conjunction, stated as an affine equivalence so that it can be used to rewrite inside any context. It is one of the lattice laws that make Ω, ordered by implication, a lattice with ∧ as meet.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_com","base":"aand_com","kind":"def","start":72,"body":null,"status":"ok","short":{"text":"The additive conjunction is commutative: P ∧ Q if and only if Q ∧ P","status":"ok"},"long":{"text":"Commutativity of the additive conjunction, as an affine equivalence for rewriting. With [[AffineConstructive.logic.aprop.aand_assoc]] it lets a conjunction be rearranged freely.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_unit_l","base":"aand_unit_l","kind":"def","start":73,"body":null,"status":"ok","short":{"text":"Truth is a left unit for the additive conjunction: 𝐓 ∧ P if and only if P","status":"ok"},"long":{"text":"𝐓 is the top of Ω under implication, so it is the unit of the meet ∧. This is the left-hand form; [[AffineConstructive.logic.aprop.aand_unit_r]] is the right-hand one. Both are used to discard a conjunct that has become trivial after rewriting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_unit_r","base":"aand_unit_r","kind":"def","start":74,"body":null,"status":"ok","short":{"text":"Truth is a right unit for the additive conjunction: P ∧ 𝐓 if and only if P","status":"ok"},"long":{"text":"The right-hand form of [[AffineConstructive.logic.aprop.aand_unit_l]]: a conjunct 𝐓 can be dropped from an additive conjunction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_false_l","base":"aand_false_l","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"Falsity absorbs the additive conjunction: 𝐅 ∧ P if and only if 𝐅","status":"ok"},"long":{"text":"𝐅 is the bottom of Ω under implication, so it absorbs the meet ∧. This is the left-hand form; [[AffineConstructive.logic.aprop.aand_false_r]] is the right-hand one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_false_r","base":"aand_false_r","kind":"def","start":76,"body":null,"status":"ok","short":{"text":"Falsity absorbs the additive conjunction on the right: P ∧ 𝐅 if and only if 𝐅","status":"ok"},"long":{"text":"The right-hand form of [[AffineConstructive.logic.aprop.aand_false_l]]: an additive conjunction with a conjunct 𝐅 is false.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_idem","base":"aand_idem","kind":"def","start":77,"body":null,"status":"ok","short":{"text":"The additive conjunction is idempotent: P ∧ P if and only if P","status":"ok"},"long":{"text":"Idempotence of the additive conjunction, as for any meet. It is the law that separates the additive conjunction from the multiplicative one. P ∧ P offers one copy of P, while P ⊠ P offers two, and two copies amount to !P ([[AffineConstructive.logic.aprop.aprod_of_course]]), not to P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aorl","base":"aorl","kind":"def","start":78,"body":null,"status":"ok","short":{"text":"P implies P ∨ Q: the left injection into the additive disjunction","status":"ok"},"long":{"text":"The first injection of the additive disjunction, companion to [[AffineConstructive.logic.aprop.aorr]]. Read through its contrapositive, it says that a refutation of P ∨ Q refutes P. When a disjunctive goal is proved by its left disjunct, the proofs use this law.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aorr","base":"aorr","kind":"def","start":79,"body":null,"status":"ok","short":{"text":"Q implies P ∨ Q: the right injection into the additive disjunction","status":"ok"},"long":{"text":"The second injection of the additive disjunction, companion to [[AffineConstructive.logic.aprop.aorl]]. When a disjunctive goal is proved by its right disjunct, the proofs use this law.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_glb","base":"aor_glb","kind":"def","start":80,"body":null,"status":"ok","short":{"text":"(P ⊸ R) ∧ (Q ⊸ R) implies P ∨ Q ⊸ R: the additive disjunction is a join","status":"ok"},"long":{"text":"The internal form of the universal property of the additive disjunction: P ∨ Q is the least upper bound of P and Q under implication. Only one case arises in any use, so the hypothesis is the additive conjunction of the two implications. [[AffineConstructive.logic.aprop.aor_elim]] is the external form, proof by cases.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_elim","base":"aor_elim","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"From P ⊸ R and Q ⊸ R, builds P ∨ Q ⊸ R: proof by cases","status":"ok"},"long":{"text":"Elimination of the additive disjunction on the left of an implication, the external form of [[AffineConstructive.logic.aprop.aor_glb]]. To derive R from P ∨ Q, it derives R from each disjunct in turn. It is the dual of [[AffineConstructive.logic.aprop.aand_intro]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_assoc","base":"aor_assoc","kind":"def","start":82,"body":null,"status":"ok","short":{"text":"The additive disjunction is associative: (P ∨ Q) ∨ R if and only if P ∨ (Q ∨ R)","status":"ok"},"long":{"text":"Associativity of the additive disjunction, as an affine equivalence for rewriting. It is the dual of [[AffineConstructive.logic.aprop.aand_assoc]] under negation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_com","base":"aor_com","kind":"def","start":83,"body":null,"status":"ok","short":{"text":"The additive disjunction is commutative: P ∨ Q if and only if Q ∨ P","status":"ok"},"long":{"text":"Commutativity of the additive disjunction, as an affine equivalence for rewriting. It is the dual of [[AffineConstructive.logic.aprop.aand_com]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_unit_l","base":"aor_unit_l","kind":"def","start":84,"body":null,"status":"ok","short":{"text":"Falsity is a left unit for the additive disjunction: 𝐅 ∨ P if and only if P","status":"ok"},"long":{"text":"𝐅 is the bottom of Ω, so it is the unit of the join ∨. This is the left-hand form; [[AffineConstructive.logic.aprop.aor_unit_r]] is the right-hand one. Both are used to discard a disjunct that rewriting has reduced to 𝐅.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_unit_r","base":"aor_unit_r","kind":"def","start":85,"body":null,"status":"ok","short":{"text":"Falsity is a right unit for the additive disjunction: P ∨ 𝐅 if and only if P","status":"ok"},"long":{"text":"The right-hand form of [[AffineConstructive.logic.aprop.aor_unit_l]]: a disjunct 𝐅 can be dropped from an additive disjunction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_true_l","base":"aor_true_l","kind":"def","start":86,"body":null,"status":"ok","short":{"text":"Truth absorbs the additive disjunction: 𝐓 ∨ P if and only if 𝐓","status":"ok"},"long":{"text":"𝐓 is the top of Ω, so it absorbs the join ∨. This is the left-hand form; [[AffineConstructive.logic.aprop.aor_true_r]] is the right-hand one. It is the dual of [[AffineConstructive.logic.aprop.aand_false_l]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_true_r","base":"aor_true_r","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"Truth absorbs the additive disjunction on the right: P ∨ 𝐓 if and only if 𝐓","status":"ok"},"long":{"text":"The right-hand form of [[AffineConstructive.logic.aprop.aor_true_l]]: an additive disjunction with a disjunct 𝐓 is true.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_idem","base":"aor_idem","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"The additive disjunction is idempotent: P ∨ P if and only if P","status":"ok"},"long":{"text":"Idempotence of the additive disjunction, as for any join. It is the dual of [[AffineConstructive.logic.aprop.aand_idem]]. The par is not idempotent in this way: P ⊞ P amounts to ?P ([[AffineConstructive.logic.aprop.apar_why_not]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_aor_distr","base":"aand_aor_distr","kind":"def","start":89,"body":null,"status":"ok","short":{"text":"The additive disjunction distributes over the additive conjunction: P ∨ (Q ∧ R) if and only if (P ∨ Q) ∧ (P ∨ R)","status":"ok"},"long":{"text":"One of the two distributive laws of the additive connectives. With [[AffineConstructive.logic.aprop.aor_aand_distr]] it makes Ω, ordered by implication, a distributive lattice. Both directions hold, so the law is stated as an affine equivalence.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_aand_distr","base":"aor_aand_distr","kind":"def","start":90,"body":null,"status":"ok","short":{"text":"The additive and distributes over the additive or","status":"ok"},"long":{"text":"The distributive law of the additive conjunction over the additive disjunction: P ∧ (Q ∨ R) is equivalent to (P ∧ Q) ∨ (P ∧ R). It is the dual of [[AffineConstructive.logic.aprop.aand_aor_distr]], which distributes the disjunction over the conjunction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_adj","base":"aprod_adj","kind":"def","start":91,"body":null,"status":"ok","short":{"text":"Currying: P ⊠ Q ⊸ R if and only if P ⊸ Q ⊸ R","status":"ok"},"long":{"text":"The tensor–hom adjunction. Implication is right adjoint to the tensor, which makes Ω a closed symmetric monoidal order. It is the principal bookkeeping law of the affine proofs. Rewriting by it in one direction or the other turns a tensor of hypotheses into a sequence of hypotheses, each to be used once, or collects them back into a single tensor. A quantifier rule or a Frobenius law can then reach the factor it needs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_adj","base":"apar_adj","kind":"def","start":92,"body":null,"status":"ok","short":{"text":"R ⊸ P ⊞ Q if and only if R ⊠ Pᗮ ⊸ Q: a par disjunct moves across as its negation","status":"ok"},"long":{"text":"The adjunction for the par, dual to [[AffineConstructive.logic.aprop.aprod_adj]]. To prove P ⊞ Q from R is to prove Q from R together with the negation of P. This is the sense in which the par is a multiplicative disjunction: refuting either disjunct leaves the other to be proved. [[AffineConstructive.logic.aprop.apar_adj_dual]] states the same law with a normal form of the negation in place of Pᗮ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_adj_dual","base":"apar_adj_dual","kind":"def","start":93,"body":null,"status":"ok","short":{"text":"R ⊸ P ⊞ Q if and only if R ⊠ Pd ⊸ Q, for Pd a normal form of the negation of P","status":"ok"},"long":{"text":"The form of [[AffineConstructive.logic.aprop.apar_adj]] that, instead of the bare negation Pᗮ, uses the normal form Pd that [[AffineConstructive.interfaces.aprop.DeMorganDual]] computes by pushing the negation inward. The disjunct moved across then arrives in a readable form: for an implication it arrives as a tensor, for an existential as a universal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_assoc","base":"aprod_assoc","kind":"def","start":94,"body":null,"status":"ok","short":{"text":"The tensor is associative: (P ⊠ Q) ⊠ R if and only if P ⊠ (Q ⊠ R)","status":"ok"},"long":{"text":"Associativity of the multiplicative conjunction, as an affine equivalence for rewriting. With [[AffineConstructive.logic.aprop.aprod_com]] and [[AffineConstructive.logic.aprop.aprod_medial]] it is the means by which a tensor of hypotheses is regrouped so that each factor meets the step that uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_com","base":"aprod_com","kind":"def","start":95,"body":null,"status":"ok","short":{"text":"The tensor is commutative: P ⊠ Q if and only if Q ⊠ P","status":"ok"},"long":{"text":"Commutativity of the multiplicative conjunction, as an affine equivalence for rewriting. It reorders the factors of a tensor of hypotheses.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_medial","base":"aprod_medial","kind":"def","start":96,"body":null,"status":"ok","short":{"text":"The medial law: (P ⊠ Q) ⊠ (R ⊠ S) is equivalent to (P ⊠ R) ⊠ (Q ⊠ S)","status":"ok"},"long":{"text":"The interchange of the two middle factors of a tensor of four. Associativity and commutativity of the tensor give it, but stating it once saves a sequence of rewrites. It regroups a tensor of two pairs so that the first factors of the pairs stand together and the second factors stand together. It is used this way in the files on closure operators, images of subsets, orders and product topologies.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_unit_l","base":"aprod_unit_l","kind":"def","start":97,"body":null,"status":"ok","short":{"text":"Truth is a left unit for the tensor: 𝐓 ⊠ P if and only if P","status":"ok"},"long":{"text":"𝐓 is the unit of the tensor. 𝐓 is also the top of Ω, which is what makes the logic affine and not merely linear: any hypothesis can be discarded ([[AffineConstructive.logic.aprop.aprodl]], [[AffineConstructive.logic.aprop.aprodr]]). This is the left-hand form of the unit law; [[AffineConstructive.logic.aprop.aprod_unit_r]] is the right-hand one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_unit_r","base":"aprod_unit_r","kind":"def","start":98,"body":null,"status":"ok","short":{"text":"Truth is a right unit for the tensor: P ⊠ 𝐓 if and only if P","status":"ok"},"long":{"text":"The right-hand form of [[AffineConstructive.logic.aprop.aprod_unit_l]]: a factor 𝐓 can be dropped from a tensor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_false_l","base":"aprod_false_l","kind":"def","start":99,"body":null,"status":"ok","short":{"text":"Falsity absorbs the tensor: 𝐅 ⊠ P if and only if 𝐅","status":"ok"},"long":{"text":"A tensor with a false factor is false. This is the left-hand form; [[AffineConstructive.logic.aprop.aprod_false_r]] is the right-hand one. Read through the contrapositive, it says that 𝐅 ⊠ P is always refuted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_false_r","base":"aprod_false_r","kind":"def","start":100,"body":null,"status":"ok","short":{"text":"Falsity absorbs the tensor on the right: P ⊠ 𝐅 if and only if 𝐅","status":"ok"},"long":{"text":"The right-hand form of [[AffineConstructive.logic.aprop.aprod_false_l]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_mp_l","base":"aprod_mp_l","kind":"def","start":101,"body":null,"status":"ok","short":{"text":"Modus ponens: (P ⊸ Q) ⊠ P implies Q","status":"ok"},"long":{"text":"Modus ponens as an affine implication, the counit of the adjunction [[AffineConstructive.logic.aprop.aprod_adj]]. The implication and its argument appear as the two factors of a tensor, so each is used once. This is the form used to apply an implication to a hypothesis inside a rewriting proof. [[AffineConstructive.logic.aprop.aprod_mp_r]] takes the factors in the other order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_mp_r","base":"aprod_mp_r","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"Modus ponens with the argument first: P ⊠ (P ⊸ Q) implies Q","status":"ok"},"long":{"text":"The same law as [[AffineConstructive.logic.aprop.aprod_mp_l]] with the two factors swapped. It saves a commutation when the argument stands to the left of the implication.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_of_course","base":"aprod_of_course","kind":"def","start":103,"body":null,"status":"ok","short":{"text":"P ⊠ P is equivalent to !P","status":"ok"},"long":{"text":"The tensor of a proposition with itself is its of-course: P ⊠ P is equivalent to !P. Both are proved by a proof of P. The tensor is refuted when a proof of one copy refutes the other, which, since P cannot be both proved and refuted, comes to P being impossible; that is the refutation of !P. The additive conjunction behaves differently: it is idempotent, and P ∧ P is P ([[AffineConstructive.logic.aprop.aand_idem]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_aprod","base":"of_course_aprod","kind":"def","start":104,"body":null,"status":"ok","short":{"text":"Of course distributes over the tensor: !(P ⊠ Q) if and only if !P ⊠ !Q","status":"ok"},"long":{"text":"The of-course modality commutes with the tensor. Affirming both P and Q together is the same as affirming each. The dual statement for why not and par is [[AffineConstructive.logic.aprop.why_not_apar]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.why_not_aprod_aimpl","base":"why_not_aprod_aimpl","kind":"def","start":105,"body":null,"status":"ok","short":{"text":"? (P ⊠ Q) implies ? P ⊠ ? Q","status":"ok"},"long":{"text":"The why-not modality pushed into a tensor, in one direction only. Unlike of course ([[AffineConstructive.logic.aprop.of_course_aprod]]), why not does not commute with the tensor. Splitting gives a weaker statement, and the converse fails in general.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_assoc","base":"apar_assoc","kind":"def","start":106,"body":null,"status":"ok","short":{"text":"The par is associative: (P ⊞ Q) ⊞ R if and only if P ⊞ (Q ⊞ R)","status":"ok"},"long":{"text":"Associativity of the multiplicative disjunction, as an affine equivalence for rewriting. It is the dual of [[AffineConstructive.logic.aprop.aprod_assoc]] under negation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_com","base":"apar_com","kind":"def","start":107,"body":null,"status":"ok","short":{"text":"The par is commutative: P ⊞ Q if and only if Q ⊞ P","status":"ok"},"long":{"text":"Commutativity of the multiplicative disjunction, as an affine equivalence for rewriting. It is the dual of [[AffineConstructive.logic.aprop.aprod_com]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_unit_l","base":"apar_unit_l","kind":"def","start":108,"body":null,"status":"ok","short":{"text":"Falsity is a left unit for par: 𝐅 ⊞ P is equivalent to P","status":"ok"},"long":{"text":"Falsity is the left unit of the par, as truth is the unit of the tensor. The two laws are De Morgan duals of each other. A par with 𝐅 adds nothing: to refute 𝐅 ⊞ P, the refutation of 𝐅 costs nothing and P is refuted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_unit_r","base":"apar_unit_r","kind":"def","start":109,"body":null,"status":"ok","short":{"text":"Falsity is a right unit for par: P ⊞ 𝐅 is equivalent to P","status":"ok"},"long":{"text":"This is the mirror image of [[AffineConstructive.logic.aprop.apar_unit_l]]. Par is commutative, so the unit works on either side. The development states both forms so that rewriting can use whichever one matches the goal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_true_l","base":"apar_true_l","kind":"def","start":110,"body":null,"status":"ok","short":{"text":"Truth absorbs par on the left: 𝐓 ⊞ P is equivalent to 𝐓","status":"ok"},"long":{"text":"Truth is the absorbing element of the par, as falsity is the absorbing element of the tensor ([[AffineConstructive.logic.aprop.aprod_false_l]]). A par is refuted only by refuting both disjuncts, and truth cannot be refuted, so the par cannot be refuted either.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_true_r","base":"apar_true_r","kind":"def","start":111,"body":null,"status":"ok","short":{"text":"Truth absorbs par on the right: P ⊞ 𝐓 is equivalent to 𝐓","status":"ok"},"long":{"text":"This is the mirror image of [[AffineConstructive.logic.aprop.apar_true_l]], with truth as the right disjunct of the par.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_why_not","base":"apar_why_not","kind":"def","start":112,"body":null,"status":"ok","short":{"text":"P ⊞ P is equivalent to ?P","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.logic.aprop.aprod_of_course]]: a par of P with itself is equivalent to ?P, why not P. P ⊞ P is refuted by refuting P, and it is proved by the impossibility of refuting P, which is exactly what ?P asks. It is used once, in the file on ordered rings.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.why_not_apar","base":"why_not_apar","kind":"def","start":113,"body":null,"status":"ok","short":{"text":"Why not distributes over par: ?(P ⊞ Q) is equivalent to ?P ⊞ ?Q","status":"ok"},"long":{"text":"Why not commutes with the par. This is the dual of [[AffineConstructive.logic.aprop.of_course_aprod]], which says that !(P ⊠ Q) is equivalent to !P ⊠ !Q. Both sides are refuted by refuting P and refuting Q, and both are proved by the impossibility of doing so.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_of_course_aimpl","base":"apar_of_course_aimpl","kind":"def","start":114,"body":null,"status":"ok","short":{"text":"!P ⊞ !Q implies !(P ⊞ Q)","status":"ok"},"long":{"text":"Of course is compatible with the par in one direction only. A par of two affirmed propositions implies the affirmation of their par. The converse fails, because affirming a par does not split into affirmations of its parts. This complements [[AffineConstructive.logic.aprop.of_course_aprod]], where of course commutes with the tensor exactly.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprodl","base":"aprodl","kind":"def","start":115,"body":null,"status":"ok","short":{"text":"P ⊠ Q implies P","status":"ok"},"long":{"text":"This is weakening, the rule that makes the logic affine rather than linear: a factor of a tensor may be discarded. Each factor may be used at most once, not exactly once, so the tensor implies each of its factors. [[AffineConstructive.logic.aprop.aprodr]] keeps the other factor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprodr","base":"aprodr","kind":"def","start":116,"body":null,"status":"ok","short":{"text":"P ⊠ Q implies Q","status":"ok"},"long":{"text":"This is the mirror image of [[AffineConstructive.logic.aprop.aprodl]]: weakening that discards the left factor of a tensor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_aand","base":"aprod_aand","kind":"def","start":117,"body":null,"status":"ok","short":{"text":"P ⊠ Q implies P ∧ Q","status":"ok"},"long":{"text":"The tensor is stronger than the additive conjunction. Having both P and Q gives the right to choose one of them. In the other direction a choice between P and Q does not provide both. The converse holds when the conjunction is affirmed ([[AffineConstructive.logic.aprop.aand_aprod]]), or when one conjunct is decidable ([[AffineConstructive.logic.aprop.aand_aprod_dec_l]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_aprod","base":"aand_aprod","kind":"def","start":118,"body":null,"status":"ok","short":{"text":"!(P ∧ Q) implies P ⊠ Q","status":"ok"},"long":{"text":"This is the partial converse of [[AffineConstructive.logic.aprop.aprod_aand]]. When the additive conjunction is affirmed, it may be used freely. It can then be used once for P and once for Q, which yields the tensor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_aprod_swap","base":"aand_aprod_swap","kind":"def","start":119,"body":null,"status":"ok","short":{"text":"(P ∧ Q) ⊠ (R ∧ S) implies (P ⊠ R) ∧ (Q ⊠ S)","status":"ok"},"long":{"text":"A tensor of two choices gives a choice of tensors. The conclusion offers a choice between P ⊠ R and Q ⊠ S. For each option the proof chooses the matching conjunct from each factor, and it uses each factor once. This is a medial law between the additive and multiplicative conjunctions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_aprod_distr","base":"aand_aprod_distr","kind":"def","start":120,"body":null,"status":"ok","short":{"text":"(P ∧ Q) ⊠ R implies (P ⊠ R) ∧ (Q ⊠ R)","status":"ok"},"long":{"text":"The tensor distributes over the additive conjunction in one direction. In each conjunct of the conclusion, the proof chooses the matching conjunct of the hypothesis and uses R once. Only one of the two options is ever taken, so R is not used twice. The converse fails, because a choice between P ⊠ R and Q ⊠ R does not let the chooser defer the choice past R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aparl","base":"aparl","kind":"def","start":121,"body":null,"status":"ok","short":{"text":"P implies P ⊞ Q","status":"ok"},"long":{"text":"This is the left injection into the par, the dual of weakening ([[AffineConstructive.logic.aprop.aprodl]]). A proof of P proves P ⊞ Q. Equivalently, a refutation of the par refutes P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aparr","base":"aparr","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"Q implies P ⊞ Q","status":"ok"},"long":{"text":"This is the right injection into the par, the mirror image of [[AffineConstructive.logic.aprop.aparl]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_apar","base":"aor_apar","kind":"def","start":123,"body":null,"status":"ok","short":{"text":"P ∨ Q implies P ⊞ Q","status":"ok"},"long":{"text":"The additive disjunction is stronger than the par. This is the dual of [[AffineConstructive.logic.aprop.aprod_aand]]. A disjunction that commits to one side gives the par through either injection. The converse holds up to why not ([[AffineConstructive.logic.aprop.apar_aor]]), or when one disjunct is decidable ([[AffineConstructive.logic.aprop.apar_aor_dec_l]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_aor","base":"apar_aor","kind":"def","start":124,"body":null,"status":"ok","short":{"text":"P ⊞ Q implies why not (P ∨ Q)","status":"ok"},"long":{"text":"This is the partial converse of [[AffineConstructive.logic.aprop.aor_apar]], and the dual of [[AffineConstructive.logic.aprop.aand_aprod]]. A par does not say which disjunct holds, but it does rule out refuting both. Ruling that out is the meaning of why not P ∨ Q.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_apar_swap","base":"aor_apar_swap","kind":"def","start":125,"body":null,"status":"ok","short":{"text":"(P ⊞ Q) ∨ (R ⊞ S) implies (P ∨ R) ⊞ (Q ∨ S)","status":"ok"},"long":{"text":"This is the medial law between the additive disjunction and the par, the dual of [[AffineConstructive.logic.aprop.aand_aprod_swap]]. Either disjunct of the hypothesis gives the conclusion by injecting each side into the matching additive disjunction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aor_apar_distr","base":"aor_apar_distr","kind":"def","start":126,"body":null,"status":"ok","short":{"text":"(P ⊞ R) ∨ (Q ⊞ R) implies (P ∨ Q) ⊞ R","status":"ok"},"long":{"text":"The par distributes over the additive disjunction in one direction. This is the dual of [[AffineConstructive.logic.aprop.aand_aprod_distr]]. Whichever disjunct holds, its first component is injected into P ∨ Q and R is kept.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_aor_l","base":"aimpl_aor_l","kind":"def","start":127,"body":null,"status":"ok","short":{"text":"P ⊸ Q ⊞ R is equivalent to (P ⊸ Q) ⊞ R","status":"ok"},"long":{"text":"An implication into a par is equivalent to the par of the implication into its first disjunct with the second disjunct: P ⊸ Q ⊞ R is equivalent to (P ⊸ Q) ⊞ R. Reading P ⊸ Q as Pᗮ ⊞ Q, this is associativity of the par. Its companion [[AffineConstructive.logic.aprop.aimpl_aor_r]] does the same for the other disjunct. Despite the names, both laws concern the par, not the additive disjunction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_aor_r","base":"aimpl_aor_r","kind":"def","start":128,"body":null,"status":"ok","short":{"text":"P ⊸ Q ⊞ R is equivalent to Q ⊞ (P ⊸ R)","status":"ok"},"long":{"text":"This is the companion of [[AffineConstructive.logic.aprop.aimpl_aor_l]]. It moves the first disjunct of the conclusion out of the implication, using associativity and commutativity of the par, since P ⊸ R has the same meaning as Pᗮ ⊞ R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_aprod_distr_l","base":"apar_aprod_distr_l","kind":"def","start":129,"body":null,"status":"ok","short":{"text":"(P ⊠ Q) ⊠ (R ⊞ S) implies (P ⊠ R) ⊞ (Q ⊠ S)","status":"ok"},"long":{"text":"This is a form of linear (weak) distributivity, the rule that relates the tensor and the par. The two factors P and Q are distributed one into each side of the par R ⊞ S. Each factor is used once, in the side where it is paired.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.apar_aprod_distr_r","base":"apar_aprod_distr_r","kind":"def","start":130,"body":null,"status":"ok","short":{"text":"(P ⊞ Q) ⊠ (R ⊠ S) implies (P ⊠ R) ⊞ (Q ⊠ S)","status":"ok"},"long":{"text":"This is the mirror form of [[AffineConstructive.logic.aprop.apar_aprod_distr_l]]: the par comes first, and the factors R and S are distributed one into each of its sides.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aprod_aimpl_apar","base":"aprod_aimpl_apar","kind":"def","start":131,"body":null,"status":"ok","short":{"text":"(P ⊸ R) ⊠ (Q ⊸ S) implies that P ⊞ Q implies R ⊞ S","status":"ok"},"long":{"text":"The par is functorial in both arguments, internally: the two implications are hypotheses inside the logic, not external proofs. Each implication is used once, on its own side of the par, so they are combined by a tensor. Read through the duality of ⊸, the law also relates the tensors of their negations. [[AffineConstructive.logic.aprop.apar_proper_aimpl]] is the external counterpart, used for rewriting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_aimpl","base":"of_course_aimpl","kind":"def","start":132,"body":null,"status":"ok","short":{"text":"Of course P implies P","status":"ok"},"long":{"text":"This is dereliction: an affirmed proposition gives the proposition itself. !P is P made freely reusable. It is proved as P is and refuted by the impossibility of proving P, so it is at least as strong as P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aimpl_why_not","base":"aimpl_why_not","kind":"def","start":133,"body":null,"status":"ok","short":{"text":"P implies why not P","status":"ok"},"long":{"text":"This is the dual of [[AffineConstructive.logic.aprop.of_course_aimpl]]. A proof of P rules out a refutation of P, and ruling that out is the proof of ?P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.of_course_idem","base":"of_course_idem","kind":"def","start":134,"body":null,"status":"ok","short":{"text":"Of course is idempotent: !!P is equivalent to !P","status":"ok"},"long":{"text":"Applying of course twice gives nothing new. Of course takes a strict proposition, so the outer one is applied to the affirmation of !P. Affirming !P is affirming P, which gives back !P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.why_not_idem","base":"why_not_idem","kind":"def","start":135,"body":null,"status":"ok","short":{"text":"Why not is idempotent: ??P is equivalent to ?P","status":"ok"},"long":{"text":"This is the dual of [[AffineConstructive.logic.aprop.of_course_idem]]: why not applied twice is why not applied once.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_is_true","base":"aiff_is_true","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"A proved P is equivalent to truth","status":"ok"},"long":{"text":"Given a proof of P in the base logic, P ⧟ 𝐓. This lets a rewrite replace a known proposition with 𝐓, after which the unit laws simplify the result.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aiff_is_false","base":"aiff_is_false","kind":"def","start":161,"body":null,"status":"ok","short":{"text":"A refuted P is equivalent to falsity","status":"ok"},"long":{"text":"Given a refutation of P, P ⧟ 𝐅. This is the dual of [[AffineConstructive.logic.aprop.aiff_is_true]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_true_l","base":"aand_true_l","kind":"def","start":162,"body":null,"status":"ok","short":{"text":"If P holds, P ∧ Q is equivalent to Q","status":"ok"},"long":{"text":"A proved left conjunct can be dropped from an additive conjunction. The proof of P is external, so it can be used as often as needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.aprop.aand_true_r","base":"aand_true_r","kind":"def","start":163,"body":null,"status":"ok","short":{"text":"If Q holds, P ∧ Q is equivalent to P","status":"ok"},"long":{"text":"This is the mirror image of [[AffineConstructive.logic.apro

actorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.notation interfaces.aprop logic.relations.\nRequire Import implementations.bool theory.set.\nRequire Import easy rewrite.\n\nLocal Open Scope bool_scope.\n\nLemma dec_spec_by_iff `{IsDec (R:=R)} {x} {P}\n  : (R x ⧟ P) → if dec R x then P else P ᗮ.\nProof. intro Q. generalize (dec_spec R x); destruct (dec R x); apply Q. Qed.\n\nLemma dec_spec_dual `{IsDec (R:=R)} x `{!DeMorganDual (R x) P}\n  : if dec R x then R x else P.\nProof.\n  generalize (dec_spec R x).\n  destruct (dec R x); [ easy | apply (demorgan_dual (R x)) ].\nQed.\nArguments dec_spec_dual {_} R {d _} x {_ _}.\n\nLemma dec_spec_andb `{IsDec (R:=R₁)} `{IsDec (R:=R₂)} x₁ x₂\n  : if dec R₁ x₁ && dec R₂ x₂ then (R₁ x₁ ∧ R₂ x₂) else (R₁ x₁)ᗮ ∨ (R₂ x₂)ᗮ.\nProof. generalize (dec_spec R₁ x₁), (dec_spec R₂ x₂).\n  destruct (dec R₁ x₁), (dec R₂ x₂). \n+ now split.\n+ now right.\n+ now left.\n+ now left.\nQed.\n\nLemma dec_spec_true `{IsDec (R:=R)} x : R x ⧟ dec R x = true.\nProof. generalize (dec_spec R x). destruct (dec R x).\n+ intro P. now rew (aiff_true_l P).\n+ intro P. apply by_contrapositive_iff. rew (aiff_true_l P). exact false_ne_true.\nQed.\n\nLtac decide_relation :=\n  let E := lazymatch goal with |- apos ?E => E end in\n  lazymatch E with ?R ?x => apply (dec_spec_true (R:=R) x) end;\n  lazy;\n  lazymatch goal with\n  | |- sprop.seqt true true => constructor\n  | |- sprop.seqt false true => fail \"Equation does not hold:\" E\n  | |- ?G => fail \"Decision procedure stuck:\" G\n  end.\n\n","sentences":[{"i":0,"s":0,"e":68,"kind":"vernac","status":"ok","ms":21,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":69,"e":116,"kind":"vernac","status":"ok","ms":28,"messages":[],"goals":null},{"i":2,"s":117,"e":145,"kind":"vernac","status":"ok","ms":11,"messages": nstr.notation","d":"⧟ "},{"t":"constr.variable","d":"P"}]}]}},"defs":[{"s":183,"e":198,"kind":"prf","name":"dec_spec_by_iff"},{"s":351,"e":364,"kind":"prf","name":"dec_spec_dual"},{"s":595,"e":608,"kind":"prf","name":"dec_spec_andb"},{"s":880,"e":893,"kind":"prf","name":"dec_spec_true"},{"kind":"ltac","name":"decide_relation","s":1119,"e":1134}],"refs":[{"s":15,"e":34,"lib":"AffineConstructive.interfaces.notation","name":"","kind":"lib","local":false,"page":"../interfaces/notation.html"},{"s":35,"e":51,"lib":"AffineConstructive.interfaces.aprop","name":"","kind":"lib","local":false,"page":"../interfaces/aprop.html"},{"s":52,"e":67,"lib":"AffineConstructive.logic.relations","name":"","kind":"lib","local":false,"page":"relations.html"},{"s":84,"e":104,"lib":"AffineConstructive.implementations.bool","name":"","kind":"lib","local":false,"page":"../implementations/bool.html"},{"s":105,"e":115,"lib":"AffineConstructive.theory.set","name":"","kind":"lib","local":false,"page":"../theory/set.html"},{"s":132,"e":136,"lib":"AffineConstructive.tactics.easy","name":"","kind":"lib","local":false,"page":"../tactics/easy.html"},{"s":137,"e":144,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"","kind":"lib","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":201,"e":206,"lib":"AffineConstructive.interfaces.aprop","name":"IsDec","kind":"class","local":false,"page":"../interfaces/aprop.html"},{"s":242,"e":245,"lib":"AffineConstructive.interfaces.aprop","name":"dec","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":295,"e":303,"lib":"AffineConstructive.interfaces.aprop","name":"dec_spec","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":320,"e":323,"lib":"AffineConstructive.interfaces.aprop","name":"dec","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":367,"e":372,"lib":"AffineConstructive.interfaces.aprop","name":"IsDec","kind":"class","local":false,"page":"../interfaces/aprop.html"},{"s":386,"e":398,"lib":"Affine es.prelude","name":"true","kind":"constr","local":false,"page":"../interfaces/prelude.html"},{"s":1347,"e":1352,"lib":"AffineConstructive.interfaces.prelude","name":"false","kind":"constr","local":false,"page":"../interfaces/prelude.html"},{"s":500,"e":504,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":820,"e":823,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":833,"e":836,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":846,"e":849,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":858,"e":861,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1001,"e":1004,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1005,"e":1008,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1066,"e":1069,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file collects lemmas for using a relation R together with a boolean decision function that is correct for it, in the sense of [[AffineConstructive.interfaces.aprop.IsDec]]: the boolean [[AffineConstructive.interfaces.aprop.dec]] R x is true when R x holds and false when its negation does. [[AffineConstructive.logic.dec.dec_spec_by_iff]] transports this correctness along an equivalence R x ⧟ P, [[AffineConstructive.logic.dec.dec_spec_dual]] states the false branch by a De Morgan dual of R x instead of its negation, and [[AffineConstructive.logic.dec.dec_spec_andb]] combines two decisions by boolean conjunction, giving R₁ x₁ ∧ R₂ x₂ on true and R₁ x₁ᗮ ∨ R₂ x₂ᗮ on false. The main result, [[AffineConstructive.logic.dec.dec_spec_true]], is the equivalence R x ⧟ (dec R x = true), and the tactic [[AffineConstructive.logic.dec.decide_relation]] uses it to prove closed instances of a decidable relation by computing the boolean.","short":"Boolean decision functions for affine relations, and proving their instances by computation","items":[{"name":"AffineConstructive.logic.dec.dec_spec_by_iff","base":"dec_spec_by_iff","kind":"prf","start":4,"body":[5,8],"status":"ok","short":{"text":"A decision procedure for R x also decides any P equivalent to R x","status":"ok"},"proof":[{"text":"Assume the equivalence of R x and P. The goal asks for P when the decision is true and for Pᗮ when it is false.","status":"ok","from":0,"to":1},{"text":"Take the correctness of the decision at x, [[AffineConstructive.interfaces.aprop.dec_spec]], and split on the value of dec R x. On the true branch it gives R x, which the equivalence carries to P. On the false branch it gives (R x)ᗮ, which the same equivalence, read through its contrapositive, carries to Pᗮ.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.dec.dec_spec_dual","base":"dec_spec_dual","kind":"prf","start":9,"body":[10,13],"status":"ok","short":{"text":"A decision procedure for R x gives R x when true and the De Morgan dual of its negation when false","status":"ok"},"proof":[{"text":"Begin from the correctness of the decision at x, [[AffineConstructive.interfaces.aprop.dec_spec]]: it gives R x when dec R x is true and (R x)ᗮ when it is false.","status":"ok","from":0,"to":1},{"text":"Split on the value of the decision. The true branch is exactly what is asked for. On the false branch the negation (R x)ᗮ is equivalent to its De Morgan dual P, by [[AffineConstructive.interfaces.aprop.demorgan_dual]], and so gives P.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.dec.dec_spec_andb","base":"dec_spec_andb","kind":"prf","start":15,"body":[16,27],"status":"ok","short":{"text":"The boolean conjunction of two decisions decides R₁ x₁ ∧ R₂ x₂; when false, it gives the dual of one of them","status":"ok"},"proof":[{"text":"Take the correctness of both decisions, [[AffineConstructive.interfaces.aprop.dec_spec]] at x₁ for R₁ and at x₂ for R₂, and split on both boolean values. This leaves four cases, and in each the boolean conjunction evaluates to a known value.","status":"ok","from":0,"to":2},{"text":"When both decisions are true, the conjunction is true and the goal asks for R₁ x₁ ∧ R₂ x₂. The two cases supply each conjunct.","status":"ok","from":3,"to":4},{"text":"When only the second decision is false, the conjunction is false and the refutation (R₂ x₂)ᗮ proves the right disjunct.","status":"ok","from":5,"to":6},{"text":"In the remaining two cases the first decision is false, so the conjunction is false. The refutation (R₁ x₁)ᗮ proves the left disjunct.","status":"ok","from":7,"to":11}]},{"name":"AffineConstructive.logic.dec.dec_spec_true","base":"dec_spec_true","kind":"prf","start":28,"body":[29,40],"status":"ok","short":{"text":"A decidable R x holds if and only if its decision procedure returns true","status":"ok"},"proof":[{"text":"Take the correctness of the decision at x, [[AffineConstructive.interfaces.aprop.dec_spec]], and split on the value of dec R x. When it is true this gives R x, and when it is false it gives (R x)ᗮ.","status":"ok","from":0,"to":2},{"text":"In the true case R x holds. Given a proof of R x, the equivalence R x ⧟ Q reduces to Q, by [[AffineConstructive.logic.aprop.aiff_true_l]], so it remains to prove true = true, which holds by reflexivity.","status":"ok","from":3,"to":5},{"text":"In the false case (R x)ᗮ holds. By [[AffineConstructive.logic.aprop.by_contrapositive_iff]] it suffices to prove the equivalence of the duals, that (R x)ᗮ holds if and only if false ≠ true.","status":"ok","from":6,"to":8},{"text":"Since (R x)ᗮ holds, [[AffineConstructive.logic.aprop.aiff_true_l]] reduces that equivalence to false ≠ true. This is [[AffineConstructive.implementations.bool.false_ne_true]].","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.logic.dec.decide_relation","base":"decide_relation","kind":"ltac","start":41,"body":null,"status":"ok","short":{"text":"Proves an instance of a decidable relation by computing its decision function to true","status":"ok"},"long":{"text":"The tactic closes a goal that asserts an affine proposition R x, where R is a relation (or predicate) equipped with a correct boolean decision function. It rewrites the goal by [[AffineConstructive.logic.dec.dec_spec_true]], which states R x ⧟ dec R x = true, so that what remains is the boolean equation dec R x = true. It then evaluates the left side by lazy reduction. If the computation yields true the equation holds by reflexivity and the goal is closed; if it yields false the tactic fails and reports that the statement does not hold; if reduction stops at a term that is neither boolean value, it fails and reports the stuck term.\n\nA proof reaches for it when a closed instance of a decidable relation, on concrete arguments whose decision function computes, is to be proved: the affine statement is then settled by computation rather than by its laws.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.aprop":{"page":"../interfaces/aprop.html","short":"Affine propositions Ω, their connectives and quantifiers, and the affine properties of relations","summary":"The file defines Ω, the type of affine propositions: a pair of an affirmation and a refutation in SProp that cannot both hold, together with a classicality field supplied by the kernel. The field is trivial in the constructive kernel and forces decidability in the classical one. It builds the connectives from these pairs: truth and falsity, the additive ∧ and ∨, the tensor ⊠ and the par ⊞, the implication ⊸ carrying its contrapositive, the negation, ⧟, the modalities ! and ?, and the quantifiers ∏ and ∐. On top of these it defines Shulman's classes Decidable, Affirmative and Refutative, De Morgan duals, boolean decision procedures (Dec, IsDec), and the affine properties of relations. Symmetry, transitivity (with ⊠ for the multiplicative form and ∧ for the strong one), antisymmetry, totality and equivalence are each stated as an implication between affine propositions. The laws of these connectives are proved in logic/aprop.v, and the rest of the development is written in this language."},"AffineConstructive.logic.relations":{"page":"relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.implementations.bool":{"page":"../implementations/bool.html","short":"The booleans as a decidable totally ordered distributive lattice, embedded in Ω","summary":"This file defines the set 𝟐 of booleans, whose equality is strict equality affirmed, and the boolean operations and, or, not and exclusive or, each as a map and as a function of sets. A decision function for equality, shown correct, makes the equality of 𝟐 decidable, refutative and an apartness, and [[true_ne_false]] separates the two booleans. Two induction principles reduce a statement about every boolean to its two cases. The order p ≤ q, the truth of notb p || q, is a decidable total order with a computable trichotomy. With false as bottom, true as top, and as meet and or as join, it is a bounded distributive lattice. The inclusion [[bool_to_Ω]], sending true to 𝐓 and false to 𝐅, is injective, a lattice morphism and an order embedding, so 𝟐 is the two-element sublattice of Ω, made of decidable propositions."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

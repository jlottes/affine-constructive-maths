refine (why_not_LEM P) : typeclass_instances.\n\nLemma refutative_by_why_not P {H:? P} `{Refutative Q} : (P ⊸ Q) → Q.\nProof. intro. rew <-(aimpl_true_l H). now apply whynot_aimpl_refutative. Qed.\n\nLemma refutative_apar_aor {P Q R} `{Refutative R} : (P ⊞ Q) → (P ∨ Q ⊸ R) → R.\nProof. rew (apar_aor _ _). intro. now apply refutative_by_why_not. Qed.\n\nLemma refutative_apar_elim {P Q R} `{Refutative R} : (P ⊞ Q) → (P ⊸ R) → (Q ⊸ R) → R.\nProof. intros PorQ ??. apply (refutative_apar_aor PorQ). now apply aor_elim. Qed.\n\nLemma refutative_apar_elim_alt_l {P Q R} {HP:Refutative P} {HR:Refutative R} : (P ⊞ Q) → (P → R) → (Q → R) → R.\nProof. intros PorQ. assert (Affirmative (P ∨ Q)) by (clear R HR; full_tautological).\n  intros a b. apply (refutative_apar_aor (PorQ)), affirmative_aimpl.\n  intros [?|?]; [ apply a | apply b ]; assumption.\nQed.\n\nLemma refutative_apar_elim_alt_r {P Q R} {HQ:Refutative Q} {HR:Refutative R} : (P ⊞ Q) → (P → R) → (Q → R) → R.\nProof. rew (apar_com _ _); intros QorP ??. now apply (refutative_apar_elim_alt_l QorP). Qed.\n\n\nLemma refutative_by_LEM (P:Ω) `{Refutative Q} : ((P ∨ P ᗮ) ⊸ Q) → Q.\nProof. exact (refutative_apar_aor (apar_LEM P)). Qed.\n\nLemma refutative_by_cases P `{DeMorganDual P Pd} `{Refutative Q} : ((P ∨ Pd) ⊸ Q) → Q.\nProof. exact (refutative_apar_aor (apar_LEM_dual P)). Qed.\n\nLemma refutative_by_cases_alt P `{DeMorganDual P Pd} `{Refutative Q} : (P ⊸ Q) → (Pd ⊸ Q) → Q.\nProof. exact (refutative_apar_elim (apar_LEM_dual P)). Qed.\n\nLemma refutative_by_contradiction P `{DeMorganDual P Pd} `{DeMorganDual Q Qd} `{Refutative Q} : (Qd → (P ∧ Pd)) → Q.\nProof. rew [ <-(demorgan_dual Q) | <-(demorgan_dual P)]. clear H H0. intro.\n  apply (refutative_by_LEM P). apply by_contrapositive. apply affirmative_aimpl. full_tautological.\nQed.\n\nDefinition Affirmative_Decidability (P : Ω) := Affirmative (P ∨ P ᗮ).\nExisting Class Affirmative_Decidability.\n\nLemma refutative_decidability_decidable (P : Ω) : Refutative (P ∨ P ᗮ) → P ∨ P ᗮ.\nProof. unfold Refutative. now rew ( aiff_is_true (why_not_LEM P) ), (aiff_true _). Qed.\n\nLemma refutative_by_aff_cases P `{Affirmative_Decidability P} `{DeMorganDual P Pd} `{Refutative Q} : ((P ∨ Pd) → Q) → Q.\nProof. intro E. apply (refutative_by_cases P). apply @affirmative_aimpl; trivial.\n  now rew <-(@demorgan_dual P Pd _).\nQed.\n\nLemma affirmative_decidability_alt P : Affirmative_Decidability P ↔ (¬ (apos P) → ¬ (aneg P) → False).\nProof. unfold Affirmative_Decidability. rew (affirmative_alt _). tautological. Qed.\n\nLocal Ltac doit := repeat match goal with\n  | H : Affirmative_Decidability ?P |- _ => revert H\n  | H : Affirmative ?P |- _ => revert H\n  | H : Refutative ?P |- _ => revert H\nend; rew ?(affirmative_decidability_alt _); rew ?(affirmative_alt _); rew ?(refutative_alt _); tautological.\n\nLemma affirmative_affirmative_dec {P} : Affirmative P → Affirmative_Decidability P.  Proof. doit. Qed.\nLemma refutative_affirmative_dec {P} : Refutative P → Affirmative_Decidability P.  Proof. doit. Qed.\nCoercion affirmative_affirmative_dec : Affirmative >-> Affirmative_Decidability.\nCoercion refutative_affirmative_dec : Refutative >-> Affirmative_Decidability.\nGlobal Hint Extern 20 (Affirmative_Decidability _) => apply affirmative_affirmative_dec : typeclass_instances.\nGlobal Hint Extern 20 (Affirmative_Decidability _) => apply refutative_affirmative_dec : typeclass_instances.\n\nDefinition of_course_affirmative_dec {P} : Affirmative_Decidability (! P) := _.\nDefinition why_not_affirmative_dec {P} : Affirmative_Decidability (? P) := _.\nGlobal Hint Extern 2 (Affirmative_Decidability (! _)) => eapply of_course_affirmative_dec : typeclass_instances.\nGlobal Hint Extern 2 (Affirmative_Decidability (? _)) => eapply why_not_affirmative_dec : typeclass_instances.\n\nLemma anot_affirmative_dec  `{Affirmative_Decidability P} : Affirmative_Decidability P ᗮ.  Proof. doit. Qed.\nLemma aand_affirmative_dec  `{Affirmative_Decidability P} `{Affirmative_Decidability Q} : Affirmative_Decidability (P ∧ Q).  Proof. doit. Qed.\nLemma aor_affirmative_dec   `{Affirmative_Decidability P} `{Affirmative_Decidability Q} : Affirmative_Decidability (P ∨ Q).  Proof. doit. Qed.\nLemma aprod_affirmative_dec `{Affirmative_Decidability P} `{Affirmative_Decidability Q} : Affirmative_Decidability (P ⊠ Q).  Proof. doit. Qed.\nLemma apar_affirmative_dec  `{Affirmative_Decidability P} `{Affirmative_Decidability Q} : Affirmative_Decidability (P ⊞ Q).  Proof. doit. Qed.\nGlobal Hint Extern 2 (Affirmative_Decidability (_ ᗮ))      => simple notypeclasses refine anot_affirmative_dec  : typeclass_instances.\nGlobal Hint Extern 2 (Affirmative_Decidability (_ ∧ _)) => simple notypeclasses refine aand_affirmative_dec  : typeclass_instances.\nGlobal Hint Extern 2 (Affirmative_Decidability (_ ∨ _)) => simple notypeclasses refine aor_affirmative_dec   : typeclass_instances.\nGlobal Hint Extern 2 (Affirmative_Decidability (_ ⊠ _)) => simple notypeclasses refine aprod_affirmative_dec : typeclass_instances.\nGlobal Hint Extern 2 (Affirmative_Decidability (_ ⊞ _)) => simple notypeclasses refine apar_affirmative_dec  : typeclass_instances.\n\n\n","sentences":[{"i":0,"s":0,"e":83,"kind":"vernac","status":"ok","ms":21,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":85,"e":110,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":2,"s":112,"e":161,"kind":"vernac","status":"ok","ms":11,"messages":["3799e8f9d0b9885a"],"goals":null},{"i":3,"s":162,"e":236,"kind":"vernac","status":"ok","ms":16,"messages":["2a71f2bb26cc4caf"],"goals":null},{"i":4,"s":238,"e":296,"kind":"vernac","status":"ok","ms":14,"messages":["8a3cb813ca81a798"],"goals":null},{"i":5,"s":297,"e":412,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":6,"s":413,"e":525,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":7,"s":527,"e":595,"kind":"vernac","status":"ok cs/rewrite/rewrite.html"},{"s":2924,"e":2927,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2949,"e":2961,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"aprop.html"},{"s":3148,"e":3151,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3187,"e":3190,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3213,"e":3216,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3238,"e":3250,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"aprop.html"},{"s":3345,"e":3349,"lib":"AffineConstructive.logic.refutative","name":"doit","kind":"ltac","local":true},{"s":3446,"e":3450,"lib":"AffineConstructive.logic.refutative","name":"doit","kind":"ltac","local":true},{"s":4320,"e":4324,"lib":"AffineConstructive.logic.refutative","name":"doit","kind":"ltac","local":true},{"s":4463,"e":4467,"lib":"AffineConstructive.logic.refutative","name":"doit","kind":"ltac","local":true},{"s":4606,"e":4610,"lib":"AffineConstructive.logic.refutative","name":"doit","kind":"ltac","local":true},{"s":4749,"e":4753,"lib":"AffineConstructive.logic.refutative","name":"doit","kind":"ltac","local":true},{"s":4892,"e":4896,"lib":"AffineConstructive.logic.refutative","name":"doit","kind":"ltac","local":true}],"gloss":{"summary":"This file collects the classical reasoning that is valid when the conclusion is refutative. It proves the affine law of excluded middle P ⊞ Pᗮ, which holds as a par and not as a disjunction, and the related fact ?(P ∨ Pᗮ). Since a refutative Q follows from why not P whenever P ⊸ Q ([[AffineConstructive.logic.refutative.refutative_by_why_not]]), these give elimination rules for refutative goals: case analysis on a par ([[AffineConstructive.logic.refutative.refutative_apar_elim]]), on P or its negation ([[AffineConstructive.logic.refutative.refutative_by_LEM]], [[AffineConstructive.logic.refutative.refutative_by_cases]]), and proof by contradiction ([[AffineConstructive.logic.refutative.refutative_by_contradiction]]). The file then defines [[AffineConstructive.logic.refutative.Affirmative_Decidability]], which says that P ∨ Pᗮ is affirmative. When P has this property, the case split may use a base-logic function from P ∨ Pᗮ to the conclusion ([[AffineConstructive.logic.refutative.refutative_by_aff_cases]]). Affirmative and refutative propositions, !P and ?P are all affirmatively decidable, and the property is preserved by negation, ∧, ∨, ⊠ and ⊞; these facts are registered as instances.","short":"Excluded middle as a par, case analysis for refutative goals, and affirmative decidability","items":[{"name":"AffineConstructive.logic.refutative.apar_LEM","base":"apar_LEM","kind":"def","start":2,"body":null,"status":"ok","short":{"text":"The affine law of excluded middle: P ⊞ Pᗮ, for every affine proposition P","status":"ok"},"long":{"text":"Excluded middle holds in affine logic when it is stated with the par rather than the additive disjunction. P ⊞ Pᗮ is the dual of P ⊠ Pᗮ, and that tensor cannot be proved, because a proof and a refutation of P never hold together. So P ⊞ Pᗮ is a tautology, and the decision procedure [[AffineConstructive.logic.aprop.tautology]] proves it.\n\nWhat this law offers is limited. A par cannot be eliminated by cases in general. It can be when the conclusion is refutative, and the lemmas that follow in the file, starting with [[AffineConstructive.logic.refutative.refutative_by_LEM]], are built on that.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.apar_LEM_dual","base":"apar_LEM_dual","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"Excluded middle against a De Morgan dual: P ⊞ Pd, where Pd is a normal form of Pᗮ","status":"ok"},"long":{"text":"This is the same law as [[AffineConstructive.logic.refutative.apar_LEM]], with the negation Pᗮ replaced by Pd, the normal form of the negation that the class [[AffineConstructive.interfaces.aprop.DeMorganDual]] attaches to P. Pd is computed by pushing the negation through the connectives, so the cases it produces read as ordinary statements and not as negations. It is the form that [[AffineConstructive.logic.refutative.refutative_by_cases]] and [[AffineConstructive.logic.refutative.refutative_by_cases_alt]] use.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.why_not_LEM","base":"why_not_LEM","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"Why not excluded middle: ?(P ∨ Pᗮ) holds for every P","status":"ok"},"long":{"text":"This is excluded middle with the additive disjunction, weakened by the why-not modality. A refutation of P ∨ Pᗮ would be a refutation of P together with a refutation of Pᗮ, that is, both a refutation and a proof of P. That is impossible, and the impossibility is exactly what proves ?(P ∨ Pᗮ).\n\nThe statement is registered for instance resolution, so goals asking for why not (P ∨ Pᗮ), or for why not (P ∨ …) in general, are discharged automatically. It is the step from a par to a disjunction under ? that lets a refutative conclusion be proved by cases.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.refutative_by_why_not","base":"refutative_by_why_not","kind":"prf","start":7,"body":[8,12],"status":"ok","short":{"text":"For refutative Q, given ?P and P ⊸ Q, Q holds","status":"ok"},"proof":[{"text":"Assume P ⊸ Q; it remains to prove Q.","status":"ok","from":0,"to":1},{"text":"Since ?P holds, Q is equivalent to the implication ?P ⊸ Q, so it suffices to prove that.","status":"ok","from":2,"to":2},{"text":"A refutative conclusion absorbs the why-not: the implication P ⊸ Q extends to ?P ⊸ Q by [[AffineConstructive.logic.aprop.whynot_aimpl_refutative]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.refutative.refutative_apar_aor","base":"refutative_apar_aor","kind":"prf","start":13,"body":[14,18],"status":"ok","short":{"text":"For refutative R, P ⊞ Q and P ∨ Q ⊸ R give R","status":"ok"},"proof":[{"text":"The par P ⊞ Q implies ?(P ∨ Q) by [[AffineConstructive.logic.aprop.apar_aor]], so it suffices to derive R from ?(P ∨ Q) and P ∨ Q ⊸ R.","status":"ok","from":0,"to":2},{"text":"Since R is refutative, this is [[AffineConstructive.logic.refutative.refutative_by_why_not]] applied to P ∨ Q.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.refutative.refutative_apar_elim","base":"refutative_apar_elim","kind":"prf","start":19,"body":[20,24],"status":"ok","short":{"text":"Elimination of a par into a refutative R: from P ⊞ Q, P ⊸ R and Q ⊸ R, conclude R","status":"ok"},"proof":[{"text":"Assume P ⊞ Q, P ⊸ R and Q ⊸ R. By [[AffineConstructive.logic.refutative.refutative_apar_aor]], the par reduces the goal to proving P ∨ Q ⊸ R.","status":"ok","from":0,"to":2},{"text":"That implication follows from the two implications by cases ([[AffineConstructive.logic.aprop.aor_elim]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.refutative.refutative_apar_elim_alt_l","base":"refutative_apar_elim_alt_l","kind":"prf","start":25,"body":[26,32],"status":"ok","short":{"text":"Par elimination with base-logic cases, for refutative P and R: P ⊞ Q, P → R, Q → R give R","status":"ok"},"proof":[{"text":"Assume P ⊞ Q. Because P is refutative, the additive disjunction P ∨ Q is affirmative, which is a tautological consequence of the hypotheses.","status":"ok","from":0,"to":2},{"text":"Assume the base-logic implications P → R and Q → R. The par reduces the goal to P ∨ Q ⊸ R by [[AffineConstructive.logic.refutative.refutative_apar_aor]]. Since P ∨ Q is affirmative, [[AffineConstructive.logic.aprop.affirmative_aimpl]] allows that implication to be proved as a base-logic implication.","status":"ok","from":3,"to":4},{"text":"A proof of P ∨ Q is a proof of P or a proof of Q. In each case the corresponding implication gives R.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.logic.refutative.refutative_apar_elim_alt_r","base":"refutative_apar_elim_alt_r","kind":"prf","start":33,"body":[34,37],"status":"ok","short":{"text":"Par elimination with base-logic cases, for refutative Q and R: P ⊞ Q, P → R, Q → R give R","status":"ok"},"proof":[{"text":"By commutativity of the par, the hypothesis becomes Q ⊞ P. Assume it together with P → R and Q → R.","status":"ok","from":0,"to":1},{"text":"Now Q is the refutative side on the left, and [[AffineConstructive.logic.refutative.refutative_apar_elim_alt_l]] applies with the two cases exchanged.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.refutative.refutative_by_LEM","base":"refutative_by_LEM","kind":"prf","start":38,"body":[39,41],"status":"ok","short":{"text":"Excluded middle for a refutative conclusion: if P ∨ Pᗮ implies Q, then Q","status":"ok"},"proof":[{"text":"The affine law of excluded middle P ⊞ Pᗮ ([[AffineConstructive.logic.refutative.apar_LEM]]), eliminated into the refutative Q by [[AffineConstructive.logic.refutative.refutative_apar_aor]], gives the result.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.refutative_by_cases","base":"refutative_by_cases","kind":"prf","start":42,"body":[43,45],"status":"ok","short":{"text":"Case analysis for refutative Q: if P ∨ Pd implies Q, with Pd the De Morgan dual of P, then Q","status":"ok"},"proof":[{"text":"The same argument as for excluded middle, using P ⊞ Pd ([[AffineConstructive.logic.refutative.apar_LEM_dual]]) in place of P ⊞ Pᗮ and eliminating it into Q by [[AffineConstructive.logic.refutative.refutative_apar_aor]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.refutative_by_cases_alt","base":"refutative_by_cases_alt","kind":"prf","start":46,"body":[47,49],"status":"ok","short":{"text":"Case analysis for refutative Q: if P implies Q and the De Morgan dual of P implies Q, then Q","status":"ok"},"proof":[{"text":"The par P ⊞ Pd ([[AffineConstructive.logic.refutative.apar_LEM_dual]]) is eliminated into Q by [[AffineConstructive.logic.refutative.refutative_apar_elim]], with one case for each implication.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.refutative_by_contradiction","base":"refutative_by_contradiction","kind":"prf","start":50,"body":[51,59],"status":"ok","short":{"text":"Proof by contradiction for refutative Q: if Q's dual gives P ∧ Pd, then Q","status":"ok"},"proof":[{"text":"Replace the De Morgan duals Qd and Pd by the negations Qᗮ and Pᗮ to which they are equivalent ([[AffineConstructive.interfaces.aprop.demorgan_dual]]). Then assume that Qᗮ gives P ∧ Pᗮ in the base logic.","status":"ok","from":0,"to":3},{"text":"By excluded middle for a refutative conclusion ([[AffineConstructive.logic.refutative.refutative_by_LEM]]), it suffices to prove that P ∨ Pᗮ implies Q.","status":"ok","from":4,"to":4},{"text":"Pass to the contrapositive ([[AffineConstructive.logic.aprop.by_contrapositive]]). Since the dual of P ∨ Pᗮ is Pᗮ ∧ P, the goal becomes Qᗮ ⊸ Pᗮ ∧ P.","status":"ok","from":5,"to":5},{"text":"Because Q is refutative, Qᗮ is affirmative. The affine implication may therefore be proved as a base-logic one ([[AffineConstructive.logic.aprop.affirmative_aimpl]]), and that follows from the assumption by reordering the conjunction.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.logic.refutative.Affirmative_Decidability","base":"Affirmative_Decidability","kind":"def","start":60,"body":null,"status":"ok","short":{"text":"Affirmative decidability of P: the disjunction P ∨ Pᗮ is affirmative","status":"ok"},"long":{"text":"P is affirmatively decidable when P ∨ Pᗮ is [[AffineConstructive.interfaces.aprop.Affirmative]], so that refuting the disjunction amounts to having no proof of it. This is weaker than decidability, which asks that P ∨ Pᗮ be proved. By [[AffineConstructive.logic.refutative.affirmative_decidability_alt]], it says that P cannot be neither proved nor refuted.\n\nIt is used in [[AffineConstructive.logic.refutative.refutative_by_aff_cases]]: when P is affirmatively decidable, a refutative conclusion can be reached by splitting into P or its De Morgan dual with a base-logic implication, not an affine one. It is declared as a class so that resolution can find it. Every affirmative proposition and every refutative proposition qualifies, and the property is closed under the connectives; all of these facts are registered as instances.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.refutative_decidability_decidable","base":"refutative_decidability_decidable","kind":"prf","start":62,"body":[63,66],"status":"ok","short":{"text":"If P ∨ Pᗮ is refutative, then it holds: P is decidable","status":"ok"},"proof":[{"text":"Refutativity of P ∨ Pᗮ says that it is equivalent to ?(P ∨ Pᗮ).","status":"ok","from":0,"to":1},{"text":"The why-not form of excluded middle ([[AffineConstructive.logic.refutative.why_not_LEM]]) proves ?(P ∨ Pᗮ), which is therefore equivalent to truth. The hypothesis then says that P ∨ Pᗮ is equivalent to truth, which means that P ∨ Pᗮ holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.refutative.refutative_by_aff_cases","base":"refutative_by_aff_cases","kind":"prf","start":67,"body":[68,73],"status":"ok","short":{"text":"For affirmatively decidable P and refutative Q, a base-logic implication from P ∨ Pd to Q gives Q","status":"ok"},"proof":[{"text":"Assume the base-logic implication from P ∨ Pd to Q.","status":"ok","from":0,"to":1},{"text":"Since Q is refutative, case analysis applies: by [[AffineConstructive.logic.refutative.refutative_by_cases]] it suffices to prove the affine implication P ∨ Pd ⊸ Q.","status":"ok","from":2,"to":2},{"text":"A base-logic implication out of an affirmative proposition is already an affine implication ([[AffineConstructive.logic.aprop.affirmative_aimpl]]). The assumed implication therefore gives the affine one, and what remains is to show that P ∨ Pd is affirmative.","status":"ok","from":3,"to":3},{"text":"Pd is equivalent to the negation Pᗮ ([[AffineConstructive.interfaces.aprop.demorgan_dual]]), so P ∨ Pd is equivalent to P ∨ Pᗮ. That P ∨ Pᗮ is affirmative is exactly the affirmative decidability of P, and being affirmative transfers along the equivalence.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.logic.refutative.affirmative_decidability_alt","base":"affirmative_decidability_alt","kind":"prf","start":74,"body":[75,79],"status":"ok","short":{"text":"P is affirmatively decidable iff it is impossible that P is neither proved nor refuted","status":"ok"},"proof":[{"text":"By definition, P is affirmatively decidable when P ∨ Pᗮ is affirmative.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.logic.aprop.affirmative_alt]], P ∨ Pᗮ is affirmative exactly when a refutation of it is the same as the absence of a proof of it.","status":"ok","from":2,"to":2},{"text":"What is left is base-logic propositional reasoning. A refutation of P ∨ Pᗮ would be a refutation of P together with a proof of P, which is impossible. So the left side says that P ∨ Pᗮ cannot fail to be proved, which means P cannot be both unproved and unrefuted.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.refutative.doit","base":"doit","kind":"ltac","start":80,"body":null,"status":"ok","short":{"text":"Proves a closure property of affirmative decidability by reducing every class to base logic and deciding the tautology","status":"ok"},"long":{"text":"The tactic moves every hypothesis in context that says a proposition is affirmatively decidable, affirmative or refutative back into the goal. The goal then becomes one implication whose premises and conclusion are all membership in these classes. It rewrites each class into its characterisation in the base logic: [[AffineConstructive.logic.refutative.affirmative_decidability_alt]] for affirmative decidability (no proof and no refutation together are impossible), [[AffineConstructive.logic.aprop.affirmative_alt]] for affirmative and [[AffineConstructive.logic.aprop.refutative_alt]] for refutative. What remains is a statement about the proof and refutation components of the propositions involved, made with the base-logic connectives, and the tautology decision procedure closes it.\n\nThe file proves this way that affirmative and refutative propositions are affirmatively decidable, and that affirmative decidability is preserved by the negation, ∧, ∨, ⊠ and ⊞. Each of these statements is a base-logic tautology once the components are exposed. A direct affine proof would have to handle each connective separately, so a single uniform reduction is shorter. The tactic is local to the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.affirmative_affirmative_dec","base":"affirmative_affirmative_dec","kind":"prf","start":81,"body":[82,84],"status":"ok","short":{"text":"Every affirmative proposition is affirmatively decidable","status":"ok"},"proof":[{"text":"Restate both conditions in the base logic, affirmative decidability by [[AffineConstructive.logic.refutative.affirmative_decidability_alt]] and affirmativity by [[AffineConstructive.logic.aprop.affirmative_alt]]. For affirmative P the absence of a proof is a refutation, so P cannot be both unproved and unrefuted.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.refutative_affirmative_dec","base":"refutative_affirmative_dec","kind":"prf","start":85,"body":[86,88],"status":"ok","short":{"text":"Every refutative proposition is affirmatively decidable","status":"ok"},"proof":[{"text":"Restate both conditions in the base logic, affirmative decidability by [[AffineConstructive.logic.refutative.affirmative_decidability_alt]] and refutativity by [[AffineConstructive.logic.aprop.refutative_alt]]. For refutative P the absence of a refutation is a proof, so P cannot be both unproved and unrefuted.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.coercion:affirmative_affirmative_dec","base":"coercion:affirmative_affirmative_dec","kind":"coercion","start":89,"body":null,"status":"ok","short":{"text":"An affirmative proposition serves wherever affirmative decidability is asked for, through [[AffineConstructive.logic.refutative.affirmative_affirmative_dec]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.coercion:refutative_affirmative_dec","base":"coercion:refutative_affirmative_dec","kind":"coercion","start":90,"body":null,"status":"ok","short":{"text":"A refutative proposition serves wherever affirmative decidability is asked for, through [[AffineConstructive.logic.refutative.refutative_affirmative_dec]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.of_course_affirmative_dec","base":"of_course_affirmative_dec","kind":"def","start":93,"body":null,"status":"ok","short":{"text":"Of course P is affirmatively decidable, for every base-logic proposition P","status":"ok"},"long":{"text":"!P is affirmative, so by [[AffineConstructive.logic.refutative.affirmative_affirmative_dec]] it is affirmatively decidable. The definition asks resolution for that instance and states it under its own name. A hint then lets resolution reach it directly for any goal of the form !P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.why_not_affirmative_dec","base":"why_not_affirmative_dec","kind":"def","start":94,"body":null,"status":"ok","short":{"text":"Why not P is affirmatively decidable, for every affine proposition P","status":"ok"},"long":{"text":"?P is refutative, so by [[AffineConstructive.logic.refutative.refutative_affirmative_dec]] it is affirmatively decidable. The definition asks resolution for that instance and states it under its own name. A hint then lets resolution reach it directly for any goal of the form ?P.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.refutative.anot_affirmative_dec","base":"anot_affirmative_dec","kind":"prf","start":97,"body":[98,100],"status":"ok","short":{"text":"Affirmative decidability passes to the negation: if P is affirmatively decidable, so is Pᗮ","status":"ok"},"proof":[{"text":"Restate affirmative decidability in the base logic by [[AffineConstructive.logic.refutative.affirmative_decidability_alt]]. A proof of Pᗮ is a refutation of P and a refutation of Pᗮ is a proof of P, so the condition for Pᗮ is the condition for P with its two premises exchanged.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.aand_affirmative_dec","base":"aand_affirmative_dec","kind":"prf","start":101,"body":[102,104],"status":"ok","short":{"text":"If P and Q are affirmatively decidable, so is P ∧ Q","status":"ok"},"proof":[{"text":"Restate affirmative decidability in the base logic by [[AffineConstructive.logic.refutative.affirmative_decidability_alt]], for P, for Q and for P ∧ Q. A proof of P ∧ Q is a proof of each conjunct and a refutation is a refutation of one of them. Suppose P ∧ Q is neither proved nor refuted. Then neither P nor Q is refuted, so by their conditions neither can be unproved, and so P ∧ Q cannot be unproved either, which is a contradiction. The step is intuitionistic propositional reasoning.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.aor_affirmative_dec","base":"aor_affirmative_dec","kind":"prf","start":105,"body":[106,108],"status":"ok","short":{"text":"If P and Q are affirmatively decidable, so is P ∨ Q","status":"ok"},"proof":[{"text":"Restate affirmative decidability in the base logic by [[AffineConstructive.logic.refutative.affirmative_decidability_alt]], for P, for Q and for P ∨ Q. A proof of P ∨ Q is a proof of one disjunct and a refutation is a refutation of each. Suppose P ∨ Q is neither proved nor refuted. Then neither P nor Q is proved, so by their conditions neither can be unrefuted, and so P ∨ Q cannot be unrefuted either, which is a contradiction.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.aprod_affirmative_dec","base":"aprod_affirmative_dec","kind":"prf","start":109,"body":[110,112],"status":"ok","short":{"text":"If P and Q are affirmatively decidable, so is P ⊠ Q","status":"ok"},"proof":[{"text":"Restate affirmative decidability in the base logic by [[AffineConstructive.logic.refutative.affirmative_decidability_alt]], for P, for Q and for P ⊠ Q. The proofs and refutations of P ⊠ Q are built from those of P and Q, and the contradiction for P ⊠ Q follows from those for P and Q by intuitionistic propositional reasoning.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.refutative.apar_affirmative_dec","base":"apar_affirmative_dec","kind":"prf","start":113,"body":[114,116],"status":"ok","short":{"text":"If P and Q are affirmatively decidable, so is the par P ⊞ Q","status":"ok"},"proof":[{"text":"Restate affirmative decidability in the base logic by [[AffineConstructive.logic.refutative.affirmative_decidability_alt]], for P, for Q and for P ⊞ Q. The par is dual to the tensor, so the argument is the one for P ⊠ Q with proofs and refutations exchanged, again by intuitionistic propositional reasoning.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.tactics.tauto":{"page":"../tactics/tauto.html","short":"tauto and intuition: intuitionistic propositional decision procedures for the base logic SProp","summary":"The file supplies `tauto` and `intuition` for the base logic `SProp`. Both are adapted from the Rocq core library's tactics of the same names, which do not work on strict propositions as shipped. `tauto` is a complete decision procedure for intuitionistic propositional logic. It handles and, or, implication, [[not]], [[iff]], truth and [[False]], and recognises any connective defined as a record or inductive type of the right shape. `intuition` runs the same search but hands every goal the search leaves open to a solver, `trivial` by default. The changes from the core library are these: negation and equivalence are this development's own; negation is unfolded by restating it as an implication into [[False]]; the classical branch is removed, so only intuitionistic reasoning is used; and two hypothesis-flattening steps are rewritten so that the binders they create get the right relevance for strict propositions. These tactics act only on the base logic. Affine statements are handled by the rewriting system of the neighbouring tactic files."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.logic.srelations":{"page":"srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.logic.aprop":{"page":"aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

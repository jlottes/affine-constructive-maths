"e":7429,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":8226,"e":8229,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":8280,"e":8283,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":8334,"e":8338,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":8587,"e":8590,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":8776,"e":8779,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":8969,"e":8972,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":9818,"e":9821,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10090,"e":10093,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10705,"e":10708,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10709,"e":10714,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10968,"e":10971,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11398,"e":11415,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../interfaces/aprop.html"},{"s":11661,"e":11664,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11962,"e":11965,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12211,"e":12214,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[AffineConstructive.logic.relations.StronglyTransitive_Transitive]], [[AffineConstructive.logic.relations.Antisymmetric_PseudoAntisymmetric]] and [[AffineConstructive.logic.relations.Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[AffineConstructive.logic.relations.dec_trans_strong]], [[AffineConstructive.logic.relations.dec_pseudo_antisym]] and [[AffineConstructive.logic.relations.dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[AffineConstructive.logic.relations.Transitive_rel_proper_aimpl]] and [[AffineConstructive.logic.relations.PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[AffineConstructive.logic.relations.trivial_Equivalence]] and the affirmed strict equality [[AffineConstructive.logic.relations.leq_equiv]].","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","items":[{"name":"AffineConstructive.logic.relations.symmetry_iff","base":"symmetry_iff","kind":"prf","start":3,"body":[4,6],"status":"ok","short":{"text":"For a symmetric relation, R (x, y) holds if and only if R (y, x)","status":"ok"},"proof":[{"text":"Each direction of the equivalence is an instance of symmetry, one at (x, y) and one at (y, x).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.transitivity_alt","base":"transitivity_alt","kind":"prf","start":7,"body":[8,11],"status":"ok","short":{"text":"Transitivity in curried form: R (x, y) implies that R (y, z) implies R (x, z)","status":"ok"},"proof":[{"text":"Uncurry the statement, so that it asks for R (x, z) from R (x, y) ⊠ R (y, z).","status":"ok","from":0,"to":1},{"text":"That is transitivity of R as stated in the class.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.relations.IsDec_Decidable","base":"IsDec_Decidable","kind":"prf","start":12,"body":[13,18],"status":"ok","short":{"text":"A predicate with a correct decision function is decidable","status":"ok"},"proof":[{"text":"Fix a point x. Deciding R x means proving R x or its negation, an additive disjunction.","status":"ok","from":0,"to":2},{"text":"Take the correctness of the decision function at x, then split on the value it returns. If the value is true, the correctness statement gives R x, which proves the left disjunct. If it is false, the correctness statement gives the negation of R x, which proves the right disjunct.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.logic.relations.coercion:IsDec_Decidable","base":"coercion:IsDec_Decidable","kind":"coercion","start":19,"body":null,"status":"ok","short":{"text":"A relation with a correct decision function counts as decidable, through [[AffineConstructive.logic.relations.IsDec_Decidable]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.relations.dec_rel_aff_rel","base":"dec_rel_aff_rel","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"A decidable predicate is affirmative","status":"ok"},"long":{"text":"Every instance of a decidable predicate is a decidable proposition, and a decidable proposition is in particular affirmative, so a decidable predicate is an affirmative one. The definition records this inclusion of Shulman's classes pointwise, as the identity on the proof of [[AffineConstructive.interfaces.aprop.DecidableRelation]]. Declared as a coercion, it lets resolution accept a decidable predicate wherever an [[AffineConstructive.interfaces.aprop.AffirmativeRelation]] is asked for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.relations.dec_rel_ref_rel","base":"dec_rel_ref_rel","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"A decidable predicate is refutative","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.logic.relations.dec_rel_aff_rel]]: a decidable proposition is also refutative, so every decidable predicate is a [[AffineConstructive.interfaces.aprop.RefutativeRelation]]. The definition is again the identity on the proof of decidability, and is declared as a coercion so that decidable predicates are accepted wherever refutative ones are required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.relations.StronglyTransitive_Transitive","base":"StronglyTransitive_Transitive","kind":"prf","start":22,"body":[23,27],"status":"ok","short":{"text":"A strongly transitive relation is transitive","status":"ok"},"proof":[{"text":"Assume R is strongly transitive and fix x, y, z. It remains to derive R (x, z) from R (x, y) ⊠ R (y, z).","status":"ok","from":0,"to":1},{"text":"Factor the implication through the additive conjunction R (x, y) ∧ R (y, z). The tensor implies the additive and by [[AffineConstructive.logic.aprop.aprod_aand]], since a proof of both lets one choose either. From the additive and, strong transitivity gives R (x, z).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.logic.relations.coercion:StronglyTransitive_Transitive","base":"coercion:StronglyTransitive_Transitive","kind":"coercion","start":28,"body":null,"status":"ok","short":{"text":"A strongly transitive relation serves wherever transitivity is asked for, through [[AffineConstructive.logic.relations.StronglyTransitive_Transitive]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.relations.dec_trans_strong","base":"dec_trans_strong","kind":"prf","start":29,"body":[30,34],"status":"ok","short":{"text":"A decidable transitive relation is strongly transitive","status":"ok"},"proof":[{"text":"Fix x, y, z. It remains to derive R (x, z) from the additive conjunction R (x, y) ∧ R (y, z).","status":"ok","from":0,"to":1},{"text":"R (x, y) is decidable, so by [[AffineConstructive.logic.aprop.aand_aprod_dec_l]] its additive and with R (y, z) is equivalent to their tensor. Replace the hypothesis by R (x, y) ⊠ R (y, z); ordinary transitivity then gives R (x, z).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.logic.relations.Antisymmetric_PseudoAntisymmetric","base":"Antisymmetric_PseudoAntisymmetric","kind":"prf","start":35,"body":[36,40],"status":"ok","short":{"text":"An antisymmetric relation is pseudo-antisymmetric","status":"ok"},"proof":[{"text":"Assume R is antisymmetric and fix x, y. It remains to derive eq (x, y) from R (x, y) ⊠ R (y, x).","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.logic.aprop.aprod_aand]] the tensor implies the additive and R (x, y) ∧ R (y, x), which is the hypothesis that antisymmetry asks for. Antisymmetry then gives eq (x, y).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.logic.relations.coercion:Antisymmetric_PseudoAntisymmetric","base":"coercion:Antisymmetric_PseudoAntisymmetric","kind":"coercion","start":41,"body":null,"status":"ok","short":{"text":"An antisymmetric relation serves wherever pseudo-antisymmetry is asked for, through [[AffineConstructive.logic.relations.Antisymmetric_PseudoAntisymmetric]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.relations.dec_pseudo_antisym","base":"dec_pseudo_antisym","kind":"prf","start":42,"body":[43,47],"status":"ok","short":{"text":"A decidable pseudo-antisymmetric relation is antisymmetric","status":"ok"},"proof":[{"text":"Fix x, y. It remains to derive eq (x, y) from the additive conjunction R (x, y) ∧ R (y, x).","status":"ok","from":0,"to":1},{"text":"R (x, y) is decidable, so by [[AffineConstructive.logic.aprop.aand_aprod_dec_l]] the additive and is equivalent to the tensor R (x, y) ⊠ R (y, x). Pseudo-antisymmetry then gives eq (x, y).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.logic.relations.Total_PseudoTotal","base":"Total_PseudoTotal","kind":"prf","start":48,"body":[49,52],"status":"ok","short":{"text":"A total relation is pseudo-total","status":"ok"},"proof":[{"text":"Assume R is total and fix x, y. The goal is the par R (x, y) ⊞ R (y, x).","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.logic.aprop.aor_apar]] the additive disjunction implies the par, and totality gives that disjunction R (x, y) ∨ R (y, x).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.relations.coercion:Total_PseudoTotal","base":"coercion:Total_PseudoTotal","kind":"coercion","start":53,"body":null,"status":"ok","short":{"text":"A total relation serves wherever pseudo-totality is asked for, through [[AffineConstructive.logic.relations.Total_PseudoTotal]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.relations.dec_pseudo_total","base":"dec_pseudo_total","kind":"prf","start":54,"body":[55,59],"status":"ok","short":{"text":"A decidable pseudo-total relation is total","status":"ok"},"proof":[{"text":"Fix x, y. The goal is the additive disjunction R (x, y) ∨ R (y, x).","status":"ok","from":0,"to":1},{"text":"R (x, y) is decidable, so by [[AffineConstructive.logic.aprop.apar_aor_dec_l]] the disjunction is equivalent to the par R (x, y) ⊞ R (y, x). Pseudo-totality gives this par.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.logic.relations.flip_Reflexive","base":"flip_Reflexive","kind":"prf","start":60,"body":[61,63],"status":"ok","short":{"text":"The converse of a reflexive relation is reflexive","status":"ok"},"proof":[{"text":"The converse relation agrees with R on the diagonal, since flipping (x, x) leaves it unchanged. So the reflexivity of R is already the reflexivity of its converse.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.flip_Symmetric","base":"flip_Symmetric","kind":"prf","start":64,"body":[65,69],"status":"ok","short":{"text":"The converse of a symmetric relation is symmetric","status":"ok"},"proof":[{"text":"Fix x and y. Once the converse is unfolded, the goal asks that R (y, x) imply R (x, y).","status":"ok","from":0,"to":2},{"text":"This is the symmetry of R applied to the pair (y, x).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.relations.flip_Transitive","base":"flip_Transitive","kind":"prf","start":70,"body":[71,76],"status":"ok","short":{"text":"The converse of a transitive relation is transitive","status":"ok"},"proof":[{"text":"Fix x, y and z. Once the converse is unfolded, the goal asks that R (y, x) ⊠ R (z, y) imply R (z, x).","status":"ok","from":0,"to":2},{"text":"Swap the two factors of the tensor by [[AffineConstructive.logic.aprop.aprod_com]]. The hypotheses then form the chain from z through y to x.","status":"ok","from":3,"to":3},{"text":"The transitivity of R at z, y, x closes the goal.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.logic.relations.flip_StronglyTransitive","base":"flip_StronglyTransitive","kind":"prf","start":77,"body":[78,83],"status":"ok","short":{"text":"The converse of a strongly transitive relation is strongly transitive","status":"ok"},"proof":[{"text":"Fix x, y and z. Once the converse is unfolded, the goal asks that the additive conjunction of R (y, x) and R (z, y) imply R (z, x).","status":"ok","from":0,"to":2},{"text":"Swap the two conjuncts by [[AffineConstructive.logic.aprop.aand_com]], so that the hypotheses form the chain from z through y to x.","status":"ok","from":3,"to":3},{"text":"The strong transitivity of R at z, y, x closes the goal.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.logic.relations.flip_PseudoAntisymmetric","base":"flip_PseudoAntisymmetric","kind":"prf","start":84,"body":[85,90],"status":"ok","short":{"text":"The converse of a pseudo-antisymmetric relation is pseudo-antisymmetric for the same equality","status":"ok"},"proof":[{"text":"Fix x and y. Once the converse is unfolded, the goal asks that R (y, x) ⊠ R (x, y) imply R' (x, y).","status":"ok","from":0,"to":2},{"text":"The goal takes as given the pseudo-antisymmetry of R at x and y, which has the same two factors in the other order. Since the tensor is commutative, the goal follows by propositional reasoning.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.logic.relations.flip_Antisymmetric","base":"flip_Antisymmetric","kind":"prf","start":91,"body":[92,97],"status":"ok","short":{"text":"The converse of an antisymmetric relation is antisymmetric for the same equality","status":"ok"},"proof":[{"text":"Fix x and y. Once the converse is unfolded, the goal asks that the additive conjunction of R (y, x) and R (x, y) imply R' (x, y).","status":"ok","from":0,"to":2},{"text":"The goal takes as given the antisymmetry of R at x and y, which has the same two conjuncts in the other order. Since the additive and is commutative, the goal follows by propositional reasoning.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.logic.relations.flip_Subrelation","base":"flip_Subrelation","kind":"prf","start":98,"body":[99,103],"status":"ok","short":{"text":"If R is contained in R', the converse of R is contained in the converse of R'","status":"ok"},"proof":[{"text":"Fix a pair (x, y). Once the converses are unfolded, the goal asks that R (y, x) imply R' (y, x).","status":"ok","from":0,"to":2},{"text":"This is the containment of R in R' at the pair (y, x).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.relations.flip_Subrelation_symmetric","base":"flip_Subrelation_symmetric","kind":"prf","start":104,"body":[105,110],"status":"ok","short":{"text":"A symmetric R contained in R' is also contained in the converse of R'","status":"ok"},"proof":[{"text":"Fix a pair (x, y). Once the converse is unfolded, the goal asks that R (x, y) imply R' (y, x).","status":"ok","from":0,"to":2},{"text":"By the [[AffineConstructive.interfaces.aprop.symmetry]] of R, R (x, y) implies R (y, x), so it suffices to prove that R (y, x) implies R' (y, x).","status":"ok","from":3,"to":3},{"text":"This is the containment of R in R' at (y, x).","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.logic.relations.flip_DecidableRelation","base":"flip_DecidableRelation","kind":"prf","start":111,"body":[112,114],"status":"ok","short":{"text":"The converse of a decidable relation is decidable","status":"ok"},"proof":[{"text":"Each instance of the converse at a pair (x, y) is the instance of R at (y, x), and R is decidable there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.flip_AffirmativeRelation","base":"flip_AffirmativeRelation","kind":"prf","start":115,"body":[116,118],"status":"ok","short":{"text":"The converse of an affirmative relation is affirmative","status":"ok"},"proof":[{"text":"Each instance of the converse at a pair (x, y) is the instance of R at (y, x), and R is affirmative there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.flip_RefutativeRelation","base":"flip_RefutativeRelation","kind":"prf","start":119,"body":[120,122],"status":"ok","short":{"text":"The converse of a refutative relation is refutative","status":"ok"},"proof":[{"text":"Each instance of the converse at a pair (x, y) is the instance of R at (y, x), and R is refutative there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.flip_PseudoTotalRelation","base":"flip_PseudoTotalRelation","kind":"prf","start":123,"body":[124,126],"status":"ok","short":{"text":"The converse of a pseudo-total relation is pseudo-total","status":"ok"},"proof":[{"text":"Pseudo-totality of the converse at x and y asks for the par of the two comparisons with their order exchanged, and this is pseudo-totality of R at the same points. The hypothesis on R closes the goal once the property is unfolded and its points are introduced.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.flip_TotalRelation","base":"flip_TotalRelation","kind":"prf","start":127,"body":[128,130],"status":"ok","short":{"text":"The converse of a total relation is total","status":"ok"},"proof":[{"text":"Totality of the converse at x and y is totality of R at the same pair with the two disjuncts exchanged. Once the property is unfolded and its points are introduced, the hypothesis that R is total closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.flip_PartialEquivalence","base":"flip_PartialEquivalence","kind":"prf","start":144,"body":[145,147],"status":"ok","short":{"text":"The converse of a partial equivalence is a partial equivalence","status":"ok"},"proof":[{"text":"A partial equivalence is a symmetric, transitive relation. Each of these properties passes to the converse by [[AffineConstructive.logic.relations.flip_Symmetric]] and [[AffineConstructive.logic.relations.flip_Transitive]], which gives the two components.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.flip_Equivalence","base":"flip_Equivalence","kind":"prf","start":148,"body":[149,151],"status":"ok","short":{"text":"The converse of an equivalence is an equivalence","status":"ok"},"proof":[{"text":"The three components of an equivalence are proved separately. Reflexivity of the converse is reflexivity of R, and symmetry and transitivity pass to the converse by [[AffineConstructive.logic.relations.flip_Symmetric]] and [[AffineConstructive.logic.relations.flip_Transitive]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.complement_Symmetric","base":"complement_Symmetric","kind":"prf","start":156,"body":[157,161],"status":"ok","short":{"text":"The complement of a symmetric relation is symmetric","status":"ok"},"proof":[{"text":"Fix x and y. It remains to show that the negation of R(x, y) implies the negation of R(y, x).","status":"ok","from":0,"to":1},{"text":"Contraposition by [[AffineConstructive.logic.aprop.acontra]] reduces this to the implication R(y, x) ⊸ R(x, y), with the order reversed.","status":"ok","from":2,"to":2},{"text":"This implication is symmetry of R at y and x.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.relations.complement_DecidableRelation","base":"complement_DecidableRelation","kind":"prf","start":163,"body":[164,166],"status":"ok","short":{"text":"The complement of a decidable predicate is decidable","status":"ok"},"proof":[{"text":"Once the complement is unfolded, each instance is the negation of a decidable proposition. By [[AffineConstructive.logic.aprop.anot_decidable]] that negation is decidable.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.complement_RefutativeRelation","base":"complement_RefutativeRelation","kind":"prf","start":167,"body":[168,170],"status":"ok","short":{"text":"The complement of an affirmative predicate is refutative","status":"ok"},"proof":[{"text":"Once the complement is unfolded, each instance is the negation of an affirmative proposition. By [[AffineConstructive.logic.aprop.anot_refutative]] that negation is refutative.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.complement_AffirmativeRelation","base":"complement_AffirmativeRelation","kind":"prf","start":171,"body":[172,174],"status":"ok","short":{"text":"The complement of a refutative predicate is affirmative","status":"ok"},"proof":[{"text":"Once the complement is unfolded, each instance is the negation of a refutative proposition. By [[AffineConstructive.logic.aprop.anot_affirmative]] that negation is affirmative.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.Antisymmetric_refl_applied","base":"Antisymmetric_refl_applied","kind":"prf","start":178,"body":[179,181],"status":"ok","short":{"text":"Every relation is antisymmetric with respect to itself","status":"ok"},"proof":[{"text":"With R serving as both the relation and the equality, antisymmetry asks that R(x, y) ⊠ R(y, x) imply R(x, y). The second factor is discarded, which affine logic permits, so the statement is a tautology of the connectives and the decision procedure proves it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.Subrelation_refl_applied","base":"Subrelation_refl_applied","kind":"prf","start":183,"body":[184,186],"status":"ok","short":{"text":"Every predicate is contained in itself","status":"ok"},"proof":[{"text":"Fix x. The remaining goal is the implication from R x to itself, which holds by reflexivity of implication.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.Transitive_rel_proper_aimpl","base":"Transitive_rel_proper_aimpl","kind":"prf","start":188,"body":[189,194],"status":"ok","short":{"text":"For transitive R, given R (x₂, x₁) and R (y₁, y₂), R (x₁, y₁) implies R (x₂, y₂)","status":"ok"},"proof":[{"text":"Assume R (x₂, x₁) and R (y₁, y₂) in the base logic. It remains to show that R (x₁, y₁) implies R (x₂, y₂).","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.interfaces.aprop.transitivity]] through x₁, R (x₂, y₂) follows from R (x₂, x₁) ⊠ R (x₁, y₂). The first factor holds outright, so by [[AffineConstructive.logic.aprop.aprod_true_l]] the tensor is equivalent to its second factor, and what remains is to derive R (x₁, y₂) from R (x₁, y₁).","status":"ok","from":2,"to":2},{"text":"Transitivity through y₁ does the same on the right. R (x₁, y₂) follows from R (x₁, y₁) ⊠ R (y₁, y₂), and since R (y₁, y₂) holds, [[AffineConstructive.logic.aprop.aprod_true_r]] drops that factor. What is left is the trivial implication of R (x₁, y₁) by itself.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.logic.relations.Transitive_Antisymmetric_rel_proper_aiff","base":"Transitive_Antisymmetric_rel_proper_aiff","kind":"prf","start":195,"body":[196,198],"status":"ok","short":{"text":"A transitive R respects a symmetric R' contained in it: R'-related arguments give equivalent instances","status":"ok"},"proof":[{"text":"Each direction of the equivalence is an instance of [[AffineConstructive.logic.relations.Transitive_rel_proper_aimpl]] for R. Its side conditions are R-relations between the arguments, and each comes from the corresponding R'-relation through the containment of R' in R. Where the side condition runs in the reverse direction, R' is first turned around by its symmetry.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.PER_rel_proper_aimpl","base":"PER_rel_proper_aimpl","kind":"prf","start":199,"body":[200,203],"status":"ok","short":{"text":"For a partial equivalence R, R (x₁, x₂) and R (y₁, y₂) give R (x₁, y₁) implies R (x₂, y₂)","status":"ok"},"proof":[{"text":"Assume R (x₁, x₂) and R (y₁, y₂). A partial equivalence is transitive, so [[AffineConstructive.logic.relations.Transitive_rel_proper_aimpl]] applies. The R (x₂, x₁) it asks for is R (x₁, x₂) turned around by symmetry.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.logic.relations.PER_rel_proper_aiff","base":"PER_rel_proper_aiff","kind":"prf","start":204,"body":[205,207],"status":"ok","short":{"text":"A partial equivalence respects itself: R-related arguments give equivalent instances of R","status":"ok"},"proof":[{"text":"Each direction is an instance of [[AffineConstructive.logic.relations.PER_rel_proper_aimpl]]. The forward direction uses the two given relations as they are. The backward direction uses them reversed, by symmetry.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.trivial_Equivalence","base":"trivial_Equivalence","kind":"def","start":208,"body":null,"status":"ok","short":{"text":"The relation relating every pair by truth 𝐓 is an equivalence","status":"ok"},"long":{"text":"The relation on A that relates every pair by truth 𝐓 is reflexive, symmetric and transitive: each law is an implication between instances of 𝐓, which the decision procedure for the connectives, [[AffineConstructive.logic.aprop.tautology]], proves at once.\n\nIt serves as the equality of the empty set [[AffineConstructive.interfaces.set.empty_set]] and of the unit set [[AffineConstructive.interfaces.set.unit_set]], where any two points are equal. Hints make it available to resolution for each of the classes it bundles, so that equivalence, partial equivalence, reflexivity, symmetry and transitivity of the constant true relation are found automatically.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.relations.of_course_rel_Affirmative","base":"of_course_rel_Affirmative","kind":"prf","start":214,"body":[215,217],"status":"ok","short":{"text":"A relation obtained by applying of course to a base-logic relation is affirmative","status":"ok"},"proof":[{"text":"Once the class is unfolded, each instance of the relation is !R x, which is affirmative by its very form. Nothing further is needed.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.of_course_rel_Reflexive","base":"of_course_rel_Reflexive","kind":"prf","start":219,"body":[220,223],"status":"ok","short":{"text":"Of course applied to a reflexive base-logic relation gives a reflexive relation","status":"ok"},"proof":[{"text":"Fix x. The goal is !R (x, x), which holds because R is reflexive in the base logic.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.logic.relations.of_course_rel_Symmetric","base":"of_course_rel_Symmetric","kind":"prf","start":225,"body":[226,230],"status":"ok","short":{"text":"Of course applied to a symmetric base-logic relation gives a symmetric relation","status":"ok"},"proof":[{"text":"Fix x and y. The hypothesis !R (x, y) is affirmative, so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] a base-logic implication to !R (y, x) suffices.","status":"ok","from":0,"to":2},{"text":"That implication is the symmetry of R in the base logic, [[AffineConstructive.interfaces.sprop.ssymmetry]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.relations.of_course_rel_Transitive","base":"of_course_rel_Transitive","kind":"prf","start":232,"body":[233,239],"status":"ok","short":{"text":"Applying of course to a transitive strict relation gives a transitive affine relation","status":"ok"},"proof":[{"text":"Fix x, y and z. The tensor of two affirmative propositions is affirmative, so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] it suffices to prove the implication in the base logic.","status":"ok","from":0,"to":2},{"text":"In the base logic the tensor of the two of-course propositions is the plain conjunction of R (x, y) and R (y, z). Given both, transitivity of R through y gives R (x, z).","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.logic.relations.of_course_rel_Equivalence","base":"of_course_rel_Equivalence","kind":"prf","start":241,"body":[242,244],"status":"ok","short":{"text":"Applying of course to a strict equivalence relation gives an affine equivalence relation","status":"ok"},"proof":[{"text":"An equivalence relation is reflexive, symmetric and transitive. The three are [[AffineConstructive.logic.relations.of_course_rel_Reflexive]], [[AffineConstructive.logic.relations.of_course_rel_Symmetric]] and [[AffineConstructive.logic.relations.of_course_rel_Transitive]], each applied to the corresponding property of the strict equivalence R.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.leq_equiv","base":"leq_equiv","kind":"def","start":246,"body":null,"status":"ok","short":{"text":"The affirmed strict equality of a type is an affine equivalence","status":"ok"},"long":{"text":"The relation [[AffineConstructive.interfaces.aprop.leq]] relates x and y by the affirmed proposition !(x ≡ y): the strict equality of a type, raised into Ω by applying of course pointwise. Since the base equality is an equivalence relation, [[AffineConstructive.logic.relations.of_course_rel_Equivalence]] makes this relation an affine equivalence; because its instances are affirmative, transitivity may use its hypotheses as in the base logic.\n\nThe accompanying hint lets resolution find the instance wherever an equivalence on [[AffineConstructive.interfaces.aprop.leq]] is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.relations.of_course_rel_Reflexive_back","base":"of_course_rel_Reflexive_back","kind":"prf","start":248,"body":[249,251],"status":"ok","short":{"text":"If an affine relation is reflexive, so is the strict relation that its proof component defines","status":"ok"},"proof":[{"text":"The proof component of R (x, x) is part of the reflexivity of R, so the strict relation is reflexive. The decision procedure for tautologies settles this.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.relations.of_course_rel_Symmetric_back","base":"of_course_rel_Symmetric_back","kind":"prf","start":253,"body":[254,257],"status":"ok","short":{"text":"If an affine relation is symmetric, so is the strict relation that its proof component defines","status":"ok"},"proof":[{"text":"Let x and y be elements with R (x, y) proved. It remains to prove R (y, x).","status":"ok","from":0,"to":1},{"text":"Apply the symmetry of R, the implication R (x, y) ⊸ R (y, x), to the proof of R (x, y). Its proof component carries that proof to a proof of R (y, x).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.relations.of_course_rel_Transitive_back","base":"of_course_rel_Transitive_back","kind":"prf","start":259,"body":[260,263],"status":"ok","short":{"text":"If an affine relation is transitive, so is the strict relation that its proof component defines","status":"ok"},"proof":[{"text":"Let x, y and z be elements with proofs of R (x, y) and R (y, z). It remains to prove R (x, z).","status":"ok","from":0,"to":1},{"text":"Apply the transitivity of R at x, y and z. The goal becomes R (x, y) ⊠ R (y, z), and the two proofs in hand supply its two factors.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.relations.of_course_rel_Equivalence_back","base":"of_course_rel_Equivalence_back","kind":"prf","start":265,"body":[266,268],"status":"ok","short":{"text":"If an affine relation is an equivalence, so is the strict relation that its proof component defines","status":"ok"},"proof":[{"text":"A strict equivalence is reflexive, symmetric and transitive. The strict relation is reflexive by [[AffineConstructive.logic.relations.of_course_rel_Reflexive_back]], symmetric by [[AffineConstructive.logic.relations.of_course_rel_Symmetric_back]] and transitive by [[AffineConstructive.logic.relations.of_course_rel_Transitive_back]], each of which uses the corresponding property of the affine equivalence R.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.logic.aprop":{"page":"aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.tactics.tauto":{"page":"../tactics/tauto.html","short":"tauto and intuition: intuitionistic propositional decision procedures for the base logic SProp","summary":"The file supplies `tauto` and `intuition` for the base logic `SProp`. Both are adapted from the Rocq core library's tactics of the same names, which do not work on strict propositions as shipped. `tauto` is a complete decision procedure for intuitionistic propositional logic. It handles and, or, implication, [[not]], [[iff]], truth and [[False]], and recognises any connective defined as a record or inductive type of the right shape. `intuition` runs the same search but hands every goal the search leaves open to a solver, `trivial` by default. The changes from the core library are these: negation and equivalence are this development's own; negation is unfolded by restating it as an implication into [[False]]; the classical branch is removed, so only intuitionistic reasoning is used; and two hypothesis-flattening steps are rewritten so that the binders they create get the right relevance for strict propositions. These tactics act only on the base logic. Affine statements are handled by the rewriting system of the neighbouring tactic files."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."}},"constants":null}</script>

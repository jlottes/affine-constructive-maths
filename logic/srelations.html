Q₂}, iff  (P₁, P₂) → iff  (Q₁, Q₂) → iff  (impl (P₁, Q₁), impl (P₂, Q₂)).  Proof. firstorder. Qed.\nLemma iff_proper_impl      {P₁ P₂ Q₁ Q₂}: iff  (P₁, P₂) → iff  (Q₁, Q₂) → impl (iff  (P₁, Q₁), iff  (P₂, Q₂)).  Proof. exact (sPER_rel_proper_impl iff). Qed.\nLemma iff_proper_iff   : ∀ {P₁ P₂ Q₁ Q₂}, iff  (P₁, P₂) → iff  (Q₁, Q₂) → iff  (iff  (P₁, Q₁), iff  (P₂, Q₂)).  Proof. firstorder. Qed.\nLemma not_proper_impl      {P₁ P₂}      : impl (P₂, P₁) → impl (not P₁, not P₂).  Proof. unfold impl. tauto. Qed.\nLemma not_proper_iff   : ∀ {P₁ P₂}      , iff  (P₁, P₂) → iff  (not P₁, not P₂).  Proof. firstorder. Qed.\nLemma or_proper_impl       {P₁ P₂ Q₁ Q₂}: impl (P₁, P₂) → impl (Q₁, Q₂) → impl (or  P₁ Q₁, or  P₂ Q₂).  Proof. unfold impl. tauto. Qed.\nLemma or_proper_iff    : ∀ {P₁ P₂ Q₁ Q₂}, iff  (P₁, P₂) → iff  (Q₁, Q₂) → iff  (or  P₁ Q₁, or  P₂ Q₂).  Proof. firstorder. Qed.\nLemma and_proper_impl      {P₁ P₂ Q₁ Q₂}: impl (P₁, P₂) → impl (Q₁, Q₂) → impl (and P₁ Q₁, and P₂ Q₂).  Proof. unfold impl. tauto. Qed.\nLemma and_proper_iff   : ∀ {P₁ P₂ Q₁ Q₂}, iff  (P₁, P₂) → iff  (Q₁, Q₂) → iff  (and P₁ Q₁, and P₂ Q₂).  Proof. firstorder. Qed.\n\nGlobal Hint Extern 1 ((sflip ?R) (?a, ?b)) => change (R (b, a)) : proper.\nGlobal Hint Extern 10 => lazymatch goal with |- (forall _ : ?P, ?Q) => change (impl (P, Q)) end : proper.\n\nGlobal Hint Extern 2 (impl (impl _, _) ) => sapply_2 impl_proper_impl : proper.\nGlobal Hint Extern 2 (iff  (impl _, _) ) => sapply_2 impl_proper_iff  : proper.\nGlobal Hint Extern 2 (impl (iff  _, _) ) => sapply_2 iff_proper_impl  : proper.\nGlobal Hint Extern 2 (iff  (iff  _, _) ) => sapply_2 iff_proper_iff   : proper.\nGlobal Hint Extern 2 (impl (not _, _)  ) => sapply_1 not_proper_impl  : proper.\nGlobal Hint Extern 2 (iff  (not _, _)  ) => sapply_1 not_proper_iff   : proper.\nGlobal Hint Extern 2 (impl (or  _ _, _)) => sapply_2 or_proper_impl   : proper.\nGlobal Hint Extern 2 (iff  (or  _ _, _)) => sapply_2 or_proper_iff    : proper.\nGlobal Hint Extern 2 (impl (and _ _, _)) => sapply_2 and_proper_impl  : proper.\nGlobal Hint Extern 2 (iff  (and _ _, _)) => sapply_2 and_proper_iff   : proper.\n\n\nLtac forall_proper_impl_tac :=\n  first [ simple refine (impl_proper_impl _ _)\n        | let H := fresh \"H\" in let x := fresh \"x\" in intros H x;\n          specialize (H x); revert H; fold_impl ].\n\nLtac forall_proper_iff_tac :=\n  first [ simple refine (impl_proper_iff _ _)\n        | simple refine ((λ H : (∀ x, iff (_, _)), conj (λ P x, andl (H x) (P x)) (λ P x, andr (H x) (P x))) (λ _, _)) ].\n\nGlobal Hint Extern 2 (impl ((∀ x, _), _)) => forall_proper_impl_tac : proper.\nGlobal Hint Extern 2 (iff  ((∀ x, _), _)) => forall_proper_iff_tac : proper.\n\nLtac ex_proper_impl_tac :=\n  refine ((λ H : (∀ x, impl _), λ '(exists _ x p), exists _ x (H x p)) (λ _, _)).\n\nLtac ex_proper_iff_tac :=\n  refine ((λ H : (∀ x, iff _), conj (λ '(exists _ x p), exists _ x (andl (H x) p))\n                                    (λ '(exists _ x p), exists _ x (andr (H x) p)) ) (λ _, _)).\n\nGlobal Hint Extern 2 (impl (ex _, _)) => ex_proper_impl_tac : proper.\nGlobal Hint Extern 2 (iff  (ex _, _)) => ex_proper_iff_tac : proper.\n\n\n","sentences":[{"i":0,"s":0,"e":80,"kind":"vernac","status":"ok","ms":18,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":82,"e":162,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":{"fg":[{"id":"16","name":null,"hyps":["0efec766d2e23be3","382311252adb4232","94f4aa24442222ea","dc43f94557150f12"],"ccl":"82f5b21ebcd8e731"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":2,"s":163,"e":169,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":{"fg":[{"id":"16","name":null,"hyps":["0efec766d2e23be3","382311252adb4232","94f4aa24442222ea","dc43f94557150f12"],"ccl":"82f5b21ebcd8e731"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":3,"s":170,"e":179,"kind":"tactic","status":"ok","ms":11,"messages":[],"g uctive.interfaces.sprop","name":"ex","kind":"ind","local":false,"page":"../interfaces/sprop.html"},{"s":180,"e":183,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":184,"e":189,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":297,"e":300,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":301,"e":306,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1091,"e":1094,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1965,"e":1968,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2061,"e":2064,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":4039,"e":4042,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":5803,"e":5808,"lib":"AffineConstructive.tactics.tauto","name":"tauto","kind":"ltac","local":false,"page":"../tactics/tauto.html"},{"s":6772,"e":6777,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6791,"e":6794,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6795,"e":6800,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6969,"e":6974,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6981,"e":6984,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6985,"e":6988,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":6991,"e":6994,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6995,"e":7000,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":7161,"e":7170,"lib":"AffineConstructive.tactics.easy","name":"fold_impl","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":7172,"e":7175,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":7912,"e":7917,"lib":"AffineConstructive.tactics.tauto","name":"tauto","kind":"ltac","local":false,"page":"../tactics/tauto.html"},{"s":8154,"e":8159,"lib":"AffineConstructive.tactics.tauto","name":"tauto","kind":"ltac","local":false,"page":"../tactics/tauto.html"},{"s":8418,"e":8423,"lib":"AffineConstructive.tactics.tauto","name":"tauto","kind":"ltac","local":false,"page":"../tactics/tauto.html"},{"s":9724,"e":9733,"lib":"AffineConstructive.tactics.easy","name":"fold_impl","kind":"ltac","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[AffineConstructive.interfaces.sprop.sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[AffineConstructive.interfaces.sprop.scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[AffineConstructive.logic.srelations.sTransitive_rel_proper_impl]], [[AffineConstructive.logic.srelations.sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement.","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","items":[{"name":"AffineConstructive.logic.srelations.spartially_refl_l","base":"spartially_refl_l","kind":"prf","start":1,"body":[2,5],"status":"ok","short":{"text":"In a partial equivalence relation, an element related to something is related to itself","status":"ok"},"proof":[{"text":"Assume x is related to y; it remains to show that x is related to itself.","status":"ok","from":0,"to":1},{"text":"Go through y: x is related to y by assumption, and y to x by symmetry, so x is related to x by transitivity.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.srelations.spartially_refl_r","base":"spartially_refl_r","kind":"prf","start":6,"body":[7,10],"status":"ok","short":{"text":"In a partial equivalence relation, an element something is related to is related to itself","status":"ok"},"proof":[{"text":"Assume x is related to y; it remains to show that y is related to itself.","status":"ok","from":0,"to":1},{"text":"Go through x: y is related to x by symmetry, and x to y by assumption, so y is related to y by transitivity.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.srelations.flip_sReflexive","base":"flip_sReflexive","kind":"prf","start":11,"body":[12,14],"status":"ok","short":{"text":"The converse of a reflexive strict relation is reflexive","status":"ok"},"proof":[{"text":"The converse relates x to x exactly when R does, so reflexivity carries over; first-order reasoning closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.flip_sIrreflexive","base":"flip_sIrreflexive","kind":"prf","start":15,"body":[16,18],"status":"ok","short":{"text":"The converse of an irreflexive strict relation is irreflexive","status":"ok"},"proof":[{"text":"The converse relates x to x exactly when R does, so irreflexivity carries over; first-order reasoning closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.flip_sSymmetric","base":"flip_sSymmetric","kind":"prf","start":19,"body":[20,22],"status":"ok","short":{"text":"The converse of a symmetric strict relation is symmetric","status":"ok"},"proof":[{"text":"If the converse relates x to y then R relates y to x, so by symmetry of R it relates x to y, which says the converse relates y to x. First-order reasoning carries this out.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.flip_sTransitive","base":"flip_sTransitive","kind":"prf","start":23,"body":[24,26],"status":"ok","short":{"text":"The converse of a transitive strict relation is transitive","status":"ok"},"proof":[{"text":"A chain x, y, z in the converse is the chain z, y, x in R, which R's transitivity closes; read back in the converse, this relates x to z. First-order reasoning carries this out.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.flip_sAntisymmetric","base":"flip_sAntisymmetric","kind":"prf","start":27,"body":[28,30],"status":"ok","short":{"text":"A relation antisymmetric with respect to an equality has an antisymmetric converse, for the same equality","status":"ok"},"proof":[{"text":"Antisymmetry asks that relating x to y both ways forces x and y to be equal. For the converse, the two hypotheses are the same pair as for R with their roles swapped, so the antisymmetry of R applies. First-order reasoning closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.flip_sSubrelation","base":"flip_sSubrelation","kind":"prf","start":31,"body":[32,34],"status":"ok","short":{"text":"Taking converses preserves inclusion of strict relations","status":"ok"},"proof":[{"text":"The converse of R relates x to y when R relates y to x. The inclusion of R in R' then gives R'(y, x), which says the converse of R' relates x to y. First-order reasoning closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.flip_sSubrelation_symmetric","base":"flip_sSubrelation_symmetric","kind":"prf","start":35,"body":[36,40],"status":"ok","short":{"text":"A symmetric relation contained in R' is contained in the converse of R'","status":"ok"},"proof":[{"text":"Take a pair (x, y) related by R. Unfolding the converse, it remains to show that R' relates y to x.","status":"ok","from":0,"to":2},{"text":"By symmetry R relates y to x, and the inclusion of R in R' ([[AffineConstructive.interfaces.sprop.ssubrelation]]) carries this to R'.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.srelations.flip_sPartialEquivalence","base":"flip_sPartialEquivalence","kind":"prf","start":48,"body":[49,51],"status":"ok","short":{"text":"The converse of a partial equivalence relation is a partial equivalence relation","status":"ok"},"proof":[{"text":"A partial equivalence relation is one that is symmetric and transitive. The converse is symmetric by [[AffineConstructive.logic.srelations.flip_sSymmetric]] and transitive by [[AffineConstructive.logic.srelations.flip_sTransitive]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.flip_sEquivalence","base":"flip_sEquivalence","kind":"prf","start":52,"body":[53,55],"status":"ok","short":{"text":"The converse of an equivalence relation is an equivalence relation","status":"ok"},"proof":[{"text":"An equivalence relation is reflexive, symmetric and transitive, and the converse inherits each property: reflexivity because the converse agrees with R on the diagonal, symmetry and transitivity by [[AffineConstructive.logic.srelations.flip_sSymmetric]] and [[AffineConstructive.logic.srelations.flip_sTransitive]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.complement_sReflexive","base":"complement_sReflexive","kind":"prf","start":58,"body":[59,61],"status":"ok","short":{"text":"The complement of an irreflexive strict relation is reflexive","status":"ok"},"proof":[{"text":"For every x, R x x fails because R is irreflexive, and that failure is exactly the statement that x is related to itself in the complement. The first-order reasoning is routine and is done automatically.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.complement_sIrreflexive","base":"complement_sIrreflexive","kind":"prf","start":62,"body":[63,65],"status":"ok","short":{"text":"The complement of a reflexive strict relation is irreflexive","status":"ok"},"proof":[{"text":"If x were related to itself in the complement, R x x would fail, which contradicts reflexivity of R. The first-order reasoning is done automatically.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.complement_sSymmetric","base":"complement_sSymmetric","kind":"prf","start":66,"body":[67,69],"status":"ok","short":{"text":"The complement of a symmetric strict relation is symmetric","status":"ok"},"proof":[{"text":"Suppose R x y fails. If R y x held, symmetry of R would give R x y, so R y x fails too. The argument is first-order and is done automatically.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.complement_sSubrelation","base":"complement_sSubrelation","kind":"prf","start":70,"body":[71,73],"status":"ok","short":{"text":"Complementation reverses inclusion of strict predicates","status":"ok"},"proof":[{"text":"If x lies outside R', it also lies outside R, because membership in R would give membership in R' by the inclusion R ⊆ R'. The contrapositive is done automatically.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.seq_sEquivalence","base":"seq_sEquivalence","kind":"prf","start":78,"body":[79,87],"status":"ok","short":{"text":"Strict equality is an equivalence relation","status":"ok"},"proof":[{"text":"The three properties of an equivalence relation are proved in turn: reflexivity, symmetry, transitivity.","status":"ok","from":0,"to":1},{"text":"Every x is equal to itself by the constructor of strict equality.","status":"ok","from":2,"to":3},{"text":"Fix x and y and destruct the equality x = y, which identifies y with x. What remains is x = x, which holds by reflexivity.","status":"ok","from":4,"to":5},{"text":"Fix x, y and z and destruct both equalities, which identifies all three points. The conclusion is then reflexivity.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.logic.srelations.seq_sSubrelation","base":"seq_sSubrelation","kind":"prf","start":93,"body":[94,96],"status":"ok","short":{"text":"Strict equality is contained in every reflexive strict relation","status":"ok"},"proof":[{"text":"Given a pair (x, y) with x = y, destructing the equality makes y the same as x, so it remains to show R x x, which is reflexivity of R.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.impl_sReflexive","base":"impl_sReflexive","kind":"prf","start":98,"body":[99,101],"status":"ok","short":{"text":"Implication of strict propositions is reflexive","status":"ok"},"proof":[{"text":"Every proposition implies itself; the identity proof is found automatically.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.impl_sTransitive","base":"impl_sTransitive","kind":"prf","start":102,"body":[103,105],"status":"ok","short":{"text":"Implication of strict propositions is transitive","status":"ok"},"proof":[{"text":"Implications compose: from P → Q and Q → R follows P → R. The composite is found automatically.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.impl_sAntisymmetric","base":"impl_sAntisymmetric","kind":"prf","start":106,"body":[107,109],"status":"ok","short":{"text":"Implication is antisymmetric with respect to logical equivalence: mutual implication is equivalence","status":"ok"},"proof":[{"text":"If P → Q and Q → P, the two implications together are by definition the equivalence P ↔ Q. The pairing is found automatically.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.impl_sSubrelation_iff","base":"impl_sSubrelation_iff","kind":"prf","start":110,"body":[111,113],"status":"ok","short":{"text":"Logical equivalence of strict propositions implies implication","status":"ok"},"proof":[{"text":"An equivalence P ↔ Q contains the implication from P to Q as one of its two directions. First-order proof search finds this.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.iff_refl","base":"iff_refl","kind":"prf","start":119,"body":[120,122],"status":"ok","short":{"text":"Every strict proposition is equivalent to itself","status":"ok"},"proof":[{"text":"Each direction of P ↔ P is the identity implication. First-order proof search closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.iff_sym","base":"iff_sym","kind":"prf","start":123,"body":[124,126],"status":"ok","short":{"text":"Logical equivalence of strict propositions is symmetric","status":"ok"},"proof":[{"text":"The two directions of P ↔ Q, taken in the other order, are the two directions of Q ↔ P. First-order proof search closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.iff_trans","base":"iff_trans","kind":"prf","start":127,"body":[128,130],"status":"ok","short":{"text":"Logical equivalence of strict propositions is transitive","status":"ok"},"proof":[{"text":"Composing the implications from P to Q and from Q to R gives P implies R. Composing the reverse implications gives R implies P. First-order proof search does both.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.iff_sEquivalence","base":"iff_sEquivalence","kind":"prf","start":131,"body":[132,134],"status":"ok","short":{"text":"Logical equivalence of strict propositions is an equivalence relation","status":"ok"},"proof":[{"text":"The three laws of an equivalence relation hold for ↔: reflexivity, symmetry and transitivity, each argued as in the three lemmas before this one. First-order proof search checks all three.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.sAntisymmetric_refl_applied","base":"sAntisymmetric_refl_applied","kind":"prf","start":140,"body":[141,144],"status":"ok","short":{"text":"Every strict relation is antisymmetric with respect to itself","status":"ok"},"proof":[{"text":"Unfolded, antisymmetry of R with respect to R itself asks for this: whenever R relates x to y and y to x, R relates x to y.","status":"ok","from":0,"to":1},{"text":"The conclusion is already the first hypothesis, so the goal follows by propositional logic.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.srelations.sSubrelation_refl_applied","base":"sSubrelation_refl_applied","kind":"prf","start":146,"body":[147,149],"status":"ok","short":{"text":"Every strict relation is contained in itself","status":"ok"},"proof":[{"text":"Every pair that R relates is a pair that R relates, so R is contained in itself. First-order proof search closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.sTransitive_rel_proper_impl","base":"sTransitive_rel_proper_impl","kind":"prf","start":151,"body":[152,156],"status":"ok","short":{"text":"A transitive relation is antitone in its first argument and monotone in its second","status":"ok"},"proof":[{"text":"Assume that R relates x₂ to x₁ and y₁ to y₂, and that R relates x₁ to y₁. It remains to show that R relates x₂ to y₂.","status":"ok","from":0,"to":1},{"text":"By transitivity through x₁, the assumption that R relates x₂ to x₁ reduces the goal to showing that R relates x₁ to y₂.","status":"ok","from":2,"to":2},{"text":"By transitivity through y₁, R relating x₁ to y₁ and y₁ to y₂ gives that R relates x₁ to y₂.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.logic.srelations.sPER_rel_proper_impl","base":"sPER_rel_proper_impl","kind":"prf","start":157,"body":[158,161],"status":"ok","short":{"text":"A partial equivalence relation transfers along related arguments: R x₁ y₁ implies R x₂ y₂","status":"ok"},"proof":[{"text":"Assume that R relates x₁ to x₂ and y₁ to y₂, and that R relates x₁ to y₁. It remains to show that R relates x₂ to y₂.","status":"ok","from":0,"to":1},{"text":"Go by transitivity through x₁. By symmetry, R relates x₂ to x₁. By transitivity through y₁, R relating x₁ to y₁ and y₁ to y₂ gives that R relates x₁ to y₂.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.logic.srelations.sPER_rel_proper_iff","base":"sPER_rel_proper_iff","kind":"prf","start":162,"body":[163,165],"status":"ok","short":{"text":"A partial equivalence relation respects itself: R x₁ y₁ ↔ R x₂ y₂ for related arguments","status":"ok"},"proof":[{"text":"Prove the two directions separately, each by [[AffineConstructive.logic.srelations.sPER_rel_proper_impl]]. The forward direction uses the two hypotheses as given. The backward direction uses them reversed, which symmetry of R provides.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.impl_proper_impl","base":"impl_proper_impl","kind":"prf","start":166,"body":[167,169],"status":"ok","short":{"text":"Implication is antitone in its premise and monotone in its conclusion","status":"ok"},"proof":[{"text":"Implication is transitive ([[AffineConstructive.logic.srelations.impl_sTransitive]]), so this is the instance for implication of the general fact that a transitive relation is antitone in its first argument and monotone in its second, [[AffineConstructive.logic.srelations.sTransitive_rel_proper_impl]]: from P₂ → P₁ and Q₁ → Q₂, a proof of P₁ → Q₁ composes on both sides to give P₂ → Q₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.impl_proper_iff","base":"impl_proper_iff","kind":"prf","start":170,"body":[171,173],"status":"ok","short":{"text":"Implication respects logical equivalence in both arguments","status":"ok"},"proof":[{"text":"A propositional tautology. Given P₁ ↔ P₂ and Q₁ ↔ Q₂, compose an implication P₁ → Q₁ with the backward half of the first equivalence and the forward half of the second to get P₂ → Q₂, and the other way round for the converse.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.iff_proper_impl","base":"iff_proper_impl","kind":"prf","start":174,"body":[175,177],"status":"ok","short":{"text":"Equivalent arguments give implication between the two logical equivalences","status":"ok"},"proof":[{"text":"Logical equivalence is an equivalence relation ([[AffineConstructive.logic.srelations.iff_sEquivalence]]), so in particular a partial equivalence relation, and [[AffineConstructive.logic.srelations.sPER_rel_proper_impl]] says that such a relation transfers along related arguments: P₁ ↔ Q₁, chained with P₂ ↔ P₁ on one side and Q₁ ↔ Q₂ on the other, gives P₂ ↔ Q₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.iff_proper_iff","base":"iff_proper_iff","kind":"prf","start":178,"body":[179,181],"status":"ok","short":{"text":"Logical equivalence respects logical equivalence in both arguments","status":"ok"},"proof":[{"text":"A propositional tautology. Each direction chains P₁ ↔ Q₁ (or P₂ ↔ Q₂) with the two given equivalences, using symmetry and transitivity of ↔.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.not_proper_impl","base":"not_proper_impl","kind":"prf","start":182,"body":[183,186],"status":"ok","short":{"text":"Negation of strict propositions is antitone: P₂ → P₁ gives ¬P₁ → ¬P₂","status":"ok"},"proof":[{"text":"Unfolded, the goal asks for ¬P₂ from P₂ → P₁ and ¬P₁, which is contraposition: a proof of P₂ would give P₁, contradicting ¬P₁. A propositional decision procedure closes it.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.logic.srelations.not_proper_iff","base":"not_proper_iff","kind":"prf","start":187,"body":[188,190],"status":"ok","short":{"text":"Negation of strict propositions respects logical equivalence","status":"ok"},"proof":[{"text":"A propositional tautology: each half of P₁ ↔ P₂ contraposes to the opposite half of ¬P₁ ↔ ¬P₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.or_proper_impl","base":"or_proper_impl","kind":"prf","start":191,"body":[192,195],"status":"ok","short":{"text":"Disjunction of strict propositions is monotone in both disjuncts","status":"ok"},"proof":[{"text":"Unfolded, the goal asks for P₂ ∨ Q₂ from P₁ ∨ Q₁ given P₁ → P₂ and Q₁ → Q₂. By cases on the disjunction, each disjunct maps to the matching one, and a propositional decision procedure closes it.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.logic.srelations.or_proper_iff","base":"or_proper_iff","kind":"prf","start":196,"body":[197,199],"status":"ok","short":{"text":"Disjunction of strict propositions respects logical equivalence","status":"ok"},"proof":[{"text":"A propositional tautology: in each direction, map the disjuncts one by one through the corresponding half of each equivalence.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.and_proper_impl","base":"and_proper_impl","kind":"prf","start":200,"body":[201,204],"status":"ok","short":{"text":"Conjunction of strict propositions is monotone in both conjuncts","status":"ok"},"proof":[{"text":"Unfolded, the goal asks for P₂ ∧ Q₂ from P₁ ∧ Q₁ given P₁ → P₂ and Q₁ → Q₂. Apply each implication to its own conjunct; a propositional decision procedure closes it.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.logic.srelations.and_proper_iff","base":"and_proper_iff","kind":"prf","start":205,"body":[206,208],"status":"ok","short":{"text":"Conjunction of strict propositions respects logical equivalence","status":"ok"},"proof":[{"text":"A propositional tautology: in each direction, map the conjuncts one by one through the corresponding half of each equivalence.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.logic.srelations.forall_proper_impl_tac","base":"forall_proper_impl_tac","kind":"ltac","start":221,"body":null,"status":"ok","short":{"text":"Reduces an implication between two universal statements to an implication between their bodies at arbitrary x","status":"ok"},"long":{"text":"The tactic acts on a goal asking that one universal statement of the base logic, ∀ x, P x, imply another, ∀ x, Q x. When the quantifier does not bind anything, the statements are implications P₁ → Q₁ and P₂ → Q₂, and the tactic applies [[AffineConstructive.logic.srelations.impl_proper_impl]], leaving the two goals that P₂ implies P₁ and that Q₁ implies Q₂. Otherwise it assumes ∀ x, P x, fixes x, specialises the assumption at x and puts it back, so that the one remaining goal is the implication from P x to Q x for that arbitrary x.\n\nThe tactic is registered in the `proper` hint database, through which the rewriting system proves that a rewrite inside a statement is legitimate. With it, a rewrite by an implication can reach under a base-logic universal quantifier, or into either side of a base-logic implication, which the congruence lemmas for the connectives of a fixed shape cannot do. Proofs do not call it by hand.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.srelations.forall_proper_iff_tac","base":"forall_proper_iff_tac","kind":"ltac","start":222,"body":null,"status":"ok","short":{"text":"Reduces an equivalence between two universal statements to an equivalence between their bodies at arbitrary x","status":"ok"},"long":{"text":"The tactic is the version of [[AffineConstructive.logic.srelations.forall_proper_impl_tac]] for logical equivalence. Its goal asks that ∀ x, P x and ∀ x, Q x be equivalent. When the quantifier does not bind anything, the statements are implications, and the tactic applies [[AffineConstructive.logic.srelations.impl_proper_iff]], leaving the equivalences of the premises and of the conclusions. Otherwise it leaves the single goal that P x and Q x are equivalent for every x, and from that family of equivalences it builds both directions of the equivalence of the universal statements, each by applying the matching direction at each point.\n\nLike [[AffineConstructive.logic.srelations.forall_proper_impl_tac]], it is registered in the `proper` hint database, so that the rewriting system can rewrite by an equivalence under a base-logic universal quantifier. Proofs do not call it by hand.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.srelations.ex_proper_impl_tac","base":"ex_proper_impl_tac","kind":"ltac","start":225,"body":null,"status":"ok","short":{"text":"Reduces an implication between two existential statements to an implication between their bodies at arbitrary x","status":"ok"},"long":{"text":"The tactic acts on a goal asking that an existential statement of the base logic, ∃ x, P x, imply another, ∃ x, Q x. It leaves the goal that P x implies Q x for every x. From a solution it builds the implication: from a witness x with P x it gives the same witness, together with the proof of Q x that the implication at x provides.\n\nThe tactic is registered in the `proper` hint database, through which the rewriting system proves that a rewrite inside a statement is legitimate. With it, a rewrite by an implication can reach under a base-logic existential quantifier. Proofs do not call it by hand.","status":"ok"},"proof":[]},{"name":"AffineConstructive.logic.srelations.ex_proper_iff_tac","base":"ex_proper_iff_tac","kind":"ltac","start":226,"body":null,"status":"ok","short":{"text":"Reduces an equivalence between two existential statements to an equivalence between their bodies at arbitrary x","status":"ok"},"long":{"text":"The tactic is the version of [[AffineConstructive.logic.srelations.ex_proper_impl_tac]] for logical equivalence. Its goal asks that ∃ x, P x and ∃ x, Q x be equivalent. It leaves the goal that P x and Q x are equivalent for every x. From that family it builds both directions: each direction keeps the witness and moves the proof across by the matching direction of the equivalence at that witness.\n\nThe tactic is registered in the `proper` hint database, so that the rewriting system can rewrite by an equivalence under a base-logic existential quantifier. Proofs do not call it by hand.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.tactics.tauto":{"page":"../tactics/tauto.html","short":"tauto and intuition: intuitionistic propositional decision procedures for the base logic SProp","summary":"The file supplies `tauto` and `intuition` for the base logic `SProp`. Both are adapted from the Rocq core library's tactics of the same names, which do not work on strict propositions as shipped. `tauto` is a complete decision procedure for intuitionistic propositional logic. It handles and, or, implication, [[not]], [[iff]], truth and [[False]], and recognises any connective defined as a record or inductive type of the right shape. `intuition` runs the same search but hands every goal the search leaves open to a solver, `trivial` by default. The changes from the core library are these: negation and equivalence are this development's own; negation is unfolded by restating it as an implication into [[False]]; the classical branch is removed, so only intuitionistic reasoning is used; and two hypothesis-flattening steps are rewritten so that the binders they create get the right relevance for strict propositions. These tactics act only on the base logic. Affine statements are handled by the rewriting system of the neighbouring tactic files."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.proper":{"page":"../tactics/rewrite/proper.html","short":"Hint databases and search tactics for the congruence obligations of rewriting","summary":"The file sets up the hint databases on which the development's rewriting system rests. It creates the `proper` database, where properness and congruence lemmas are registered, and the tactic [[solve_proper]] that searches it by instance resolution, together with [[proper_solution]], which returns the term such a search finds. It also defines a small tagging device, the inductive `RewriteSwapTag` and the database `rewrite_swap_tag`, and the tactic [[swap_rewrite_tag]], which looks up the term declared as the partner of a given term. The rewriting tactics built on top of this file call these to discharge the congruence obligations a rewrite generates and to pass between paired terms."}},"constants":null}</script>

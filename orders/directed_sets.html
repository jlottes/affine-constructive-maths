":false,"page":"../interfaces/aprop.html"},{"s":2022,"e":2036,"lib":"AffineConstructive.orders.orders","name":"unfold_pair_le","kind":"ltac","local":false,"page":"orders.html"},{"s":2040,"e":2043,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2068,"e":2071,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file sets out the basic facts about directed preorders: inhabited preorders where any two elements have a common upper bound ([[AffineConstructive.interfaces.orders.UpDirected]]) or a common lower bound ([[AffineConstructive.interfaces.orders.DownDirected]]). The two notions are dual. A down-directed order is a preorder ([[AffineConstructive.orders.directed_sets.DownDirected_preorder]]). Taking the opposite order swaps the two notions ([[AffineConstructive.orders.directed_sets.UpDirected_op]], [[AffineConstructive.orders.directed_sets.DownDirected_op]]), and the down-directed results come from the up-directed ones that way. The unit set is directed both ways. The tensor product X ⊗ Y of two up-directed or two down-directed sets is again directed in the same sense, ordered componentwise: the two common bounds pair into one, and the medial law [[AffineConstructive.logic.aprop.aprod_medial]] puts the four order factors back together.","short":"Directed preorders: their duality, the unit set, and tensor products","items":[{"name":"AffineConstructive.orders.directed_sets.Build_DownDirected","base":"Build_DownDirected","kind":"prf","start":3,"body":[4,6],"status":"ok","short":{"text":"An inhabited preorder in which any two elements have a common lower bound is down-directed","status":"ok"},"proof":[{"text":"Down-directedness is up-directedness of the opposite order. The opposite of a preorder is a preorder, and an inhabited order stays inhabited. A common upper bound in the opposite order is a common lower bound in the original, so the hypothesis is exactly the remaining field.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.directed_sets.DownDirected_preorder","base":"DownDirected_preorder","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The preorder underlying a down-directed order","status":"ok"},"long":{"text":"A down-directed order is defined as an up-directed one on the opposite order, so its preorder structure is found at the opposite order. This definition gets it back at the direct order: it is the opposite of the opposite preorder, by [[AffineConstructive.orders.orders.PreOrder_op]]. It is declared a coercion, so that a down-directed hypothesis also supplies the preorder whenever one is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.directed_sets.coercion:DownDirected_preorder","base":"coercion:DownDirected_preorder","kind":"coercion","start":8,"body":null,"status":"ok","short":{"text":"A down-directed order reaches its underlying preorder, so reflexivity and transitivity apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.directed_sets.UpDirected_op","base":"UpDirected_op","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The opposite of a down-directed order is up-directed","status":"ok"},"long":{"text":"A common lower bound in X is a common upper bound in the opposite order. Because downward directedness is defined as upward directedness of the opposite order, this is the identity on the hypothesis. A hint registers it with instance resolution, so that the opposite of a down-directed order is found to be up-directed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.directed_sets.DownDirected_op","base":"DownDirected_op","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"The opposite of an up-directed order is down-directed","status":"ok"},"long":{"text":"An up-directed order X, read in the opposite order Xᵒᵖ, is down-directed. Reversing the order turns a common upper bound in X into a common lower bound in Xᵒᵖ, and the order is still an inhabited preorder, so the two classes match up exactly and the definition holds with no proof. This is the dual of [[AffineConstructive.orders.directed_sets.UpDirected_op]]. A hint makes it available to instance resolution, so a goal asking for down-directedness of an opposite order is filled automatically.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.directed_sets.unit_up_directed","base":"unit_up_directed","kind":"prf","start":15,"body":[16,18],"status":"ok","short":{"text":"The one-element set is up-directed","status":"ok"},"proof":[{"text":"On the one-element set every comparison holds, and its single element is an upper bound of any two elements. Each requirement of [[AffineConstructive.interfaces.orders.UpDirected]] is a tautology, so a decision procedure discharges them all.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.directed_sets.unit_down_directed","base":"unit_down_directed","kind":"prf","start":19,"body":[20,22],"status":"ok","short":{"text":"The one-element set is down-directed","status":"ok"},"proof":[{"text":"Dually, the single element is a lower bound of any two elements. The requirements of [[AffineConstructive.interfaces.orders.DownDirected]] are tautologies, discharged by the same decision procedure.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.directed_sets.tensor_up_directed","base":"tensor_up_directed","kind":"prf","start":27,"body":[28,36],"status":"ok","short":{"text":"The tensor product of two up-directed sets is up-directed in the componentwise order","status":"ok"},"proof":[{"text":"Resolution supplies two of the three requirements: X ⊗ Y is inhabited because both factors are, and the componentwise order is a preorder by [[AffineConstructive.orders.orders.tensor_preorder]]. It remains to find a common upper bound for any two elements.","status":"ok","from":0,"to":1},{"text":"Let the two elements be the pairs (x₁, y₁) and (x₂, y₂). Directedness of X gives some x with x₁ ≤ x ⊠ x₂ ≤ x, and directedness of Y gives some y with y₁ ≤ y ⊠ y₂ ≤ y.","status":"ok","from":2,"to":4},{"text":"Take (x, y) as the witness. In the componentwise order, each comparison of pairs is the ⊠ of its two coordinate comparisons. So the goal is the ⊠ of four comparisons, grouped by pair: (x₁ ≤ x ⊠ y₁ ≤ y) ⊠ (x₂ ≤ x ⊠ y₂ ≤ y).","status":"ok","from":5,"to":6},{"text":"The medial law [[AffineConstructive.logic.aprop.aprod_medial]] regroups the four factors by coordinate, as (x₁ ≤ x ⊠ x₂ ≤ x) ⊠ (y₁ ≤ y ⊠ y₂ ≤ y). The two factors of this ⊠ are the two bounds obtained above, each used once.","status":"ok","from":7,"to":8}]},{"name":"AffineConstructive.orders.directed_sets.tensor_down_directed","base":"tensor_down_directed","kind":"prf","start":38,"body":[39,41],"status":"ok","short":{"text":"The tensor product of two down-directed sets is down-directed, dual to the up-directed case","status":"ok"},"proof":[{"text":"A down-directed order is an up-directed opposite order. The tensor product of the opposites carries the opposite of the componentwise order. So the up-directed case [[AffineConstructive.orders.directed_sets.tensor_up_directed]], applied to the opposites of X and Y, gives the result.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

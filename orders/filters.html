ve.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":19175,"e":19178,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":19306,"e":19309,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":19310,"e":19318,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":19323,"e":19326,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals.","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","items":[{"name":"AffineConstructive.orders.filters.Build_Ideal","base":"Build_Ideal","kind":"prf","start":8,"body":[9,11],"status":"ok","short":{"text":"A down-set that is up-directed is an ideal","status":"ok"},"proof":[{"text":"An ideal is a filter on the opposite order, whose fields are an up-set and a down-directed subset there; read at the direct order these are a down-set and an up-directed subset, so the two hypotheses supply the fields directly.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.Build_IdealPresentation","base":"Build_IdealPresentation","kind":"prf","start":12,"body":[13,15],"status":"ok","short":{"text":"On a weak poset, U is generated downward by β if x ∊ U ⧟ x ≤ β i for some i","status":"ok"},"proof":[{"text":"An ideal presentation is a filter presentation on the opposite order. Its fields are that the opposite order is a weak poset, which follows from the hypothesis that X is a weak poset, and the membership condition, which the second hypothesis states at the direct order.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.Build_IdealBasis","base":"Build_IdealBasis","kind":"prf","start":16,"body":[17,19],"status":"ok","short":{"text":"A family β in U is an ideal basis if every element of U lies below some β i","status":"ok"},"proof":[{"text":"An ideal basis is a filter basis for the opposite order, and that condition, read at the direct order, is the hypothesis itself: every element of U lies below some β i.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.Filter_op","base":"Filter_op","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"An ideal of X is a filter of the opposite order Xᵒᵖ","status":"ok"},"long":{"text":"An ideal U of X, read as a subset of the opposite order Xᵒᵖ, is a filter there. Because [[AffineConstructive.interfaces.orders.Ideal]] is defined as a filter on the opposite order, the proof is the ideal structure itself, unchanged. A hint registers it, so resolution finds the filter structure whenever a subset of an opposite order has to be a filter.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.Ideal_op","base":"Ideal_op","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"A filter is an ideal for the opposite order","status":"ok"},"long":{"text":"The converse of [[AffineConstructive.orders.filters.Filter_op]]: a filter U of X is an ideal of Xᵒᵖ. Again the identity on proofs, registered for resolution, so that statements about ideals of an opposite order reduce to statements about filters of the original.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.Filter_proper_impl","base":"Filter_proper_impl","kind":"prf","start":24,"body":[25,28],"status":"ok","short":{"text":"Being a filter respects equality of subsets: if U = V and U is a filter, so is V","status":"ok"},"proof":[{"text":"Assume U = V and that U is a filter. A filter has two fields: it is an up-set and it is down-directed. For each field, rewriting V back to U along the equality turns it into the corresponding property of U, which is given.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.filters.Filter_fun","base":"Filter_fun","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"The filter predicate as a function on subsets, respecting their equality","status":"ok"},"long":{"text":"The predicate \"U is a filter\" packaged as a function from the of-course set !(𝒫 X) to propositions of the base logic, built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.orders.filters.Filter_proper_impl]]. It records that the predicate respects equality of subsets, so that the rewriting system may replace U by an equal subset inside a goal of the form Filter U. The of-course is there because the predicate is a base-logic one and equality of subsets is used freely.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.Ideal_proper_impl","base":"Ideal_proper_impl","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"Being an ideal respects equality of subsets: if U = V and U is an ideal, so is V","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.filters.Filter_proper_impl]], obtained by instantiating it at the opposite order: an ideal is a filter of Xᵒᵖ, and equality of subsets does not depend on the order. It is the transport lemma behind [[AffineConstructive.orders.filters.Ideal_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.Ideal_fun","base":"Ideal_fun","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"The ideal predicate as a function on subsets, respecting their equality","status":"ok"},"long":{"text":"The predicate \"U is an ideal\" packaged, like [[AffineConstructive.orders.filters.Filter_fun]], as a function from !(𝒫 X) to propositions of the base logic, built from [[AffineConstructive.orders.filters.Ideal_proper_impl]]. It lets the rewriting system rewrite the subset inside a goal Ideal U.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.filter_meet_sub_sl","base":"filter_meet_sub_sl","kind":"prf","start":32,"body":[33,42],"status":"ok","short":{"text":"In a meet semilattice, a filter is closed under binary meets","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.sublattices.alt_Build_MeetSubSemiLattice]] it suffices to show that U is closed under binary meets. Fix x and y; it remains to show that x ∊ U and y ∊ U imply x ⊓ y ∊ U.","status":"ok","from":0,"to":2},{"text":"Since a filter is down-directed, [[AffineConstructive.interfaces.orders.down_directed_subset]] turns the two memberships into some z ∊ U lying below both x and y. Let z be such an element.","status":"ok","from":3,"to":5},{"text":"Since x ⊓ y is the greatest lower bound, z ≤ x and z ≤ y amount to z ≤ x ⊓ y. Rearranged, the goal says that z ≤ x ⊓ y and z ∊ U give x ⊓ y ∊ U. This holds because U is upward closed ([[AffineConstructive.interfaces.orders.up_closed]]).","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.orders.filters.filter_sub_lattice","base":"filter_sub_lattice","kind":"prf","start":43,"body":[44,50],"status":"ok","short":{"text":"In a lattice, a filter is a sublattice","status":"ok"},"proof":[{"text":"A sublattice is a subset that is closed under meets and closed under joins, together with the lattice structure on L. That structure comes from the lattice order, so the two closure properties remain to be shown.","status":"ok","from":0,"to":1},{"text":"Closure under meets is [[AffineConstructive.orders.filters.filter_meet_sub_sl]].","status":"ok","from":2,"to":3},{"text":"Closure under joins holds for any up-set, by [[AffineConstructive.orders.closure.upset_join_sub_sl]]: an upper bound of an element of U lies in U.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.filters.ideal_join_sub_sl","base":"ideal_join_sub_sl","kind":"prf","start":51,"body":[52,54],"status":"ok","short":{"text":"In a join semilattice, an ideal is closed under binary joins","status":"ok"},"proof":[{"text":"An ideal of L is a filter of the opposite order, where the join of L is the meet. So the statement is [[AffineConstructive.orders.filters.filter_meet_sub_sl]] applied to the opposite order.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.ideal_sub_lattice","base":"ideal_sub_lattice","kind":"prf","start":55,"body":[56,62],"status":"ok","short":{"text":"In a lattice, an ideal is a sublattice","status":"ok"},"proof":[{"text":"The lattice structure on L comes from the lattice order, so it remains to show that U is closed under meets and closed under joins.","status":"ok","from":0,"to":1},{"text":"An ideal is a down-set, and a down-set is closed under meets by [[AffineConstructive.orders.closure.downset_meet_sub_sl]].","status":"ok","from":2,"to":3},{"text":"Closure under joins is [[AffineConstructive.orders.filters.ideal_join_sub_sl]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.filters.sub_meet_sl_order_down_directed","base":"sub_meet_sl_order_down_directed","kind":"prf","start":63,"body":[64,71],"status":"ok","short":{"text":"An inhabited subset closed under binary meets is down-directed","status":"ok"},"proof":[{"text":"Assume U is inhabited. By [[AffineConstructive.orders.closure.Build_DownDirectedSubset]], with inhabitedness given by that assumption, it remains to show that any two elements of U have a common lower bound in U.","status":"ok","from":0,"to":2},{"text":"Fix x and y, and take x ⊓ y as the witness. Since x ⊓ y ≤ x and x ⊓ y ≤ y always hold, those two factors are true. What remains is x ⊓ y ∊ U, given x ∊ U and y ∊ U.","status":"ok","from":3,"to":5},{"text":"This is closure of U under meets, [[AffineConstructive.interfaces.subalgebra.sub_meet_closed]].","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.orders.filters.sub_join_sl_order_up_directed","base":"sub_join_sl_order_up_directed","kind":"prf","start":72,"body":[73,75],"status":"ok","short":{"text":"An inhabited subset closed under binary joins is up-directed","status":"ok"},"proof":[{"text":"On the opposite order, joins become meets and up-directed becomes down-directed. So the statement is [[AffineConstructive.orders.filters.sub_meet_sl_order_down_directed]] applied to the opposite order.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.filter_top","base":"filter_top","kind":"prf","start":76,"body":[77,82],"status":"ok","short":{"text":"A filter in a bounded meet semilattice contains the top ⊤","status":"ok"},"proof":[{"text":"A filter is down-directed, so it is inhabited: take an element x of U.","status":"ok","from":0,"to":1},{"text":"It suffices to show that x ∊ U implies ⊤ ∊ U. Since U is upward closed, this follows from x ≤ ⊤.","status":"ok","from":2,"to":3},{"text":"Every element lies below the top, so x ≤ ⊤ holds.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.filters.filter_bounded_meet_sub_sl","base":"filter_bounded_meet_sub_sl","kind":"prf","start":83,"body":[84,88],"status":"ok","short":{"text":"In a bounded meet semilattice, a filter contains ⊤ and is closed under binary meets","status":"ok"},"proof":[{"text":"A bounded meet sub-semilattice is a subset closed under binary meets that contains ⊤ ([[AffineConstructive.theory.sublattices.alt_Build_MeetSubBoundedSemiLattice]]). Both conditions remain to be shown.","status":"ok","from":0,"to":1},{"text":"A filter in a meet semilattice is closed under binary meets ([[AffineConstructive.orders.filters.filter_meet_sub_sl]]).","status":"ok","from":2,"to":2},{"text":"The filter contains ⊤ by [[AffineConstructive.orders.filters.filter_top]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.filters.ideal_bottom","base":"ideal_bottom","kind":"prf","start":89,"body":[90,92],"status":"ok","short":{"text":"An ideal in a bounded join semilattice contains the bottom ⊥","status":"ok"},"proof":[{"text":"An ideal of L is a filter of the opposite order L ᵒᵖ, whose top is ⊥, so this is [[AffineConstructive.orders.filters.filter_top]] applied to L ᵒᵖ.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.ideal_bounded_join_sub_sl","base":"ideal_bounded_join_sub_sl","kind":"prf","start":93,"body":[94,96],"status":"ok","short":{"text":"In a bounded join semilattice, an ideal contains ⊥ and is closed under binary joins","status":"ok"},"proof":[{"text":"Pass to the opposite order. In L ᵒᵖ the ideal is a filter, joins are meets and ⊥ is the top, so the claim is [[AffineConstructive.orders.filters.filter_bounded_meet_sub_sl]] applied to L ᵒᵖ.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.sub_bounded_meet_sl_order_down_directed","base":"sub_bounded_meet_sl_order_down_directed","kind":"prf","start":97,"body":[98,102],"status":"ok","short":{"text":"A subset containing ⊤ and closed under binary meets is down-directed","status":"ok"},"proof":[{"text":"A subset closed under binary meets is down-directed once it is inhabited ([[AffineConstructive.orders.filters.sub_meet_sl_order_down_directed]]), so it remains to show that U has an element.","status":"ok","from":0,"to":1},{"text":"Take ⊤ as the witness: it lies in U because U is a bounded meet sub-semilattice ([[AffineConstructive.interfaces.subalgebra.sub_top_closed]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.filters.sub_bounded_join_sl_order_up_directed","base":"sub_bounded_join_sl_order_up_directed","kind":"prf","start":103,"body":[104,106],"status":"ok","short":{"text":"A subset containing ⊥ and closed under binary joins is up-directed","status":"ok"},"proof":[{"text":"This is the dual statement. Apply [[AffineConstructive.orders.filters.sub_bounded_meet_sl_order_down_directed]] to the opposite order, where joins become meets, ⊥ becomes the top and up-directed becomes down-directed.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.principal_filter","base":"principal_filter","kind":"def","start":107,"body":null,"status":"ok","short":{"text":"The principal filter of x: the points y with x ≤ y, as a function X ⇾ 𝒫 X","status":"ok"},"long":{"text":"The principal filter of a point x of a weak poset is the subset of points above it, { y | x ≤ y }. It is defined as a function of sets from X to its powerset, so that it is known to respect equality of points, which a weak poset guarantees since its order contains equality. The lemmas that follow identify it with the upward closure of the singleton {x}, show that it is a filter and the least up-set containing x, and that x ↦ principal_filter x is an order-reversing embedding of X into (𝒫 X, ⊆).","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.principal_filter_closure","base":"principal_filter_closure","kind":"prf","start":109,"body":[110,122],"status":"ok","short":{"text":"The principal filter is the upward closure of the singleton, as functions X ⇾ 𝒫 X","status":"ok"},"proof":[{"text":"Two subset-valued functions are equal when they agree at every x and every y, so fix x and y. Membership of y in each side must then imply membership in the other.","status":"ok","from":0,"to":2},{"text":"First suppose x ≤ y. Membership of y in the upward closure of {x} asks for some b with x = b ⊠ b ≤ y. Take x itself as the witness: x = x holds by reflexivity and x ≤ y is the hypothesis.","status":"ok","from":3,"to":5},{"text":"Conversely, membership in the upward closure gives some b with x = b and b ≤ y. Take that b, and the goal becomes deriving x ≤ y from these two facts.","status":"ok","from":6,"to":9},{"text":"In a weak poset an equality gives an inequality ([[AffineConstructive.orders.orders.eq_le]]), so x = b gives x ≤ b. Then x ≤ b ⊠ b ≤ y gives x ≤ y by transitivity.","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.orders.filters.principal_filter_point_closure","base":"principal_filter_point_closure","kind":"prf","start":123,"body":[124,127],"status":"ok","short":{"text":"The principal filter of x is the point upward closure of the singleton {x}","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.principal_filter_closure]], the principal filter of x is the upward closure of {x}. By [[AffineConstructive.orders.closure.point_upward_closure_alt]], the point upward closure of {x} is the upward closure of the of-course subset of {x}.","status":"ok","from":0,"to":1},{"text":"The of-course subset of a singleton is the singleton itself ([[AffineConstructive.orders.subset.of_course_singleton]]), so the two sides agree.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.filters.principal_filter_least_upset","base":"principal_filter_least_upset","kind":"prf","start":128,"body":[129,131],"status":"ok","short":{"text":"Membership in the principal filter of x amounts to lying above an element of it","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.principal_filter_point_closure]], the principal filter of x is the point upward closure of {x}. A point upward closure is always a least up-set ([[AffineConstructive.orders.closure.point_upward_closure_least_upset]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.principal_filter_filter","base":"principal_filter_filter","kind":"prf","start":133,"body":[134,136],"status":"ok","short":{"text":"The principal filter of a point is a filter","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.principal_filter_point_closure]], the principal filter of x is the point upward closure of {x}. The singleton is down-directed ([[AffineConstructive.orders.closure.singleton_down_directed]]), and the point upward closure of a down-directed subset is a filter ([[AffineConstructive.orders.closure.point_upward_closure_filter]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.principal_filter_order_embedding_flip","base":"principal_filter_order_embedding_flip","kind":"prf","start":142,"body":[143,155],"status":"ok","short":{"text":"x ≤ y if and only if the principal filter of y is included in that of x","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderEmbeddingFlip]] it is enough to show, for all x and y, that x ≤ y holds if and only if the principal filter of y is included in that of x. Unfolded, the inclusion says that every z above y is above x.","status":"ok","from":0,"to":3},{"text":"Forward direction: fix z. By transitivity, x ≤ y and y ≤ z together give x ≤ z.","status":"ok","from":4,"to":8},{"text":"Converse: specialise the inclusion at y itself. Its premise y ≤ y holds by reflexivity, so the inclusion yields x ≤ y.","status":"ok","from":9,"to":12}]},{"name":"AffineConstructive.orders.filters.principal_ideal","base":"principal_ideal","kind":"def","start":159,"body":null,"status":"ok","short":{"text":"The principal ideal of x: the points y with y ≤ x, as a function X ⇾ 𝒫 X","status":"ok"},"long":{"text":"The principal ideal of a point x of a weak poset is the subset of points below it, { y | y ≤ x }, the dual of [[AffineConstructive.orders.filters.principal_filter]]. It is written out directly rather than as the principal filter of the opposite order, so that membership unfolds to y ≤ x at the given order; the two agree definitionally, and the facts about it (its description as a downward closure of {x}, that it is an ideal and the least down-set containing x) are obtained from those for the principal filter at the opposite order. Unlike the principal filter, x ↦ principal_ideal x preserves the order, and is an order embedding of X into (𝒫 X, ⊆).","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.principal_ideal_closure","base":"principal_ideal_closure","kind":"def","start":161,"body":null,"status":"ok","short":{"text":"The principal ideal is the downward closure of the singleton, as functions X ⇾ 𝒫 X","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.filters.principal_filter_closure]], obtained by instantiating it at the opposite order: the principal ideal map is the composite of the singleton map with [[AffineConstructive.orders.closure.downward_closure]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.principal_ideal_point_closure","base":"principal_ideal_point_closure","kind":"def","start":162,"body":null,"status":"ok","short":{"text":"The principal ideal of x is the point downward closure of the singleton {x}","status":"ok"},"long":{"text":"This is the dual of [[AffineConstructive.orders.filters.principal_filter_point_closure]], obtained by instantiating that lemma at the opposite order. It says that the principal ideal of x, the points below x, is the [[AffineConstructive.orders.closure.point_downward_closure]] of {x}: the points lying below some member of the singleton.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.principal_ideal_least_downset","base":"principal_ideal_least_downset","kind":"def","start":163,"body":null,"status":"ok","short":{"text":"Membership in the principal ideal of x amounts to lying below an element of it","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.filters.principal_filter_least_upset]], by the opposite order: the principal ideal of x is a least down-set, membership in it being equivalent to lying below some element of it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.principal_ideal_ideal","base":"principal_ideal_ideal","kind":"def","start":164,"body":null,"status":"ok","short":{"text":"The principal ideal of a point is an ideal","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.filters.principal_filter_filter]], by the opposite order: the principal ideal of x is a down-set, inhabited by x, and up-directed. It is registered for resolution, together with the weaker structures it implies (up-directed, inhabited, down-set).","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.principal_ideal_order_embedding","base":"principal_ideal_order_embedding","kind":"prf","start":171,"body":[172,184],"status":"ok","short":{"text":"x ≤ y if and only if the principal ideal of x is included in that of y","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] it is enough to show, for all x and y, that x ≤ y holds if and only if the principal ideal of x is included in that of y. Unfolded, the inclusion says that every z below x is below y.","status":"ok","from":0,"to":3},{"text":"Forward direction: fix z. After the two comparisons are put in order, transitivity turns z ≤ x and x ≤ y into z ≤ y.","status":"ok","from":4,"to":8},{"text":"Converse: specialise the inclusion at x itself. Its premise x ≤ x holds by reflexivity, so the inclusion yields x ≤ y.","status":"ok","from":9,"to":12}]},{"name":"AffineConstructive.orders.filters.presented_filter","base":"presented_filter","kind":"def","start":188,"body":null,"status":"ok","short":{"text":"The filter presented by a family β: the points above some β i","status":"ok"},"long":{"text":"Given a family β indexed by a type Λ in a weak poset X, the presented filter is { x | ∐ i, β i ≤ x }, the points lying above some member of the family. The existential is the affine one, so refuting membership of x means refuting β i ≤ x for every i. By [[AffineConstructive.orders.filters.presented_filter_correct]] it is a filter presentation in the sense of [[AffineConstructive.interfaces.orders.FilterPresentation]], and it is a filter when the family is down-directed in the sense of [[AffineConstructive.orders.filters.presented_filter_filter]] or [[AffineConstructive.orders.filters.presented_filter_filter_alt]]: this is the filter generated by a filter base.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.presented_filter_correct","base":"presented_filter_correct","kind":"prf","start":189,"body":[190,192],"status":"ok","short":{"text":"The filter presented by β is presented by β","status":"ok"},"proof":[{"text":"By definition, the presented filter consists of the points lying above some β i. So the equivalence a presentation asks for holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.filter_presentation_alt","base":"filter_presentation_alt","kind":"prf","start":194,"body":[195,199],"status":"ok","short":{"text":"A subset presented by β is the point upward closure of the range of β","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.closure.point_upward_closure_range]], the point upward closure of the range of β is the set of points lying above some β a. It remains to show that U equals this set.","status":"ok","from":0,"to":1},{"text":"Two subsets are equal when they agree at every point x. At each x this agreement is the defining equivalence of the presentation.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.filters.filter_presentation_least_upset","base":"filter_presentation_least_upset","kind":"def","start":200,"body":[201,203],"status":"ok","short":{"text":"A subset presented by a family is a least up-set","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.filter_presentation_alt]], U is the point upward closure of the range of β. Any point upward closure is a least up-set by [[AffineConstructive.orders.closure.point_upward_closure_least_upset]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.presented_filter_filter","base":"presented_filter_filter","kind":"prf","start":204,"body":[205,207],"status":"ok","short":{"text":"A subset presented by an order-preserving family on a down-directed index is a filter","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.filter_presentation_alt]], U is the point upward closure of the range of β. Since β is order-preserving and Λ is down-directed, this range is down-directed by [[AffineConstructive.orders.closure.range_down_directed]]. The point upward closure of a down-directed subset is a filter by [[AffineConstructive.orders.closure.point_upward_closure_filter]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.presented_filter_filter_alt","base":"presented_filter_filter_alt","kind":"prf","start":208,"body":[209,226],"status":"ok","short":{"text":"A subset presented by β is a filter if Λ is inhabited and any β i, β j lie above some β k","status":"ok"},"proof":[{"text":"A filter is an up-set that is down-directed. U is an up-set because a presented subset is a least up-set ([[AffineConstructive.orders.filters.filter_presentation_least_upset]]), which leaves down-directedness.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.closure.Build_DownDirectedSubset]] it suffices to show two things: U is inhabited, and any two members of U have a common lower bound in U.","status":"ok","from":2,"to":2},{"text":"Since Λ is inhabited, it has an element i. Then β i lies in U, because β i ≤ β i holds with i as the witness.","status":"ok","from":3,"to":7},{"text":"For the second condition, fix x and y in U. By the presentation, x ∊ U means some β i lies below x, and y ∊ U means some β j lies below y. Let i and j be these indices.","status":"ok","from":8,"to":11},{"text":"The hypothesis on β gives k with β k ≤ β i and β k ≤ β j. By transitivity it is then enough to have β k ≤ x ⊠ β k ≤ y.","status":"ok","from":12,"to":12},{"text":"Take β k as the common lower bound. The two comparisons β k ≤ x and β k ≤ y carry over unchanged, so what remains is to show β k ∊ U.","status":"ok","from":13,"to":14},{"text":"β k lies in U by the presentation, with k as the witness and β k ≤ β k by reflexivity.","status":"ok","from":15,"to":17}]},{"name":"AffineConstructive.orders.filters.filter_basis_self","base":"filter_basis_self","kind":"prf","start":227,"body":[228,231],"status":"ok","short":{"text":"The identity of a weak poset is a filter basis","status":"ok"},"proof":[{"text":"Fix x. Then x itself is a basis element below x: take x as the witness, and x ≤ x holds by reflexivity.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.filters.filter_basis_compose","base":"filter_basis_compose","kind":"prf","start":233,"body":[234,242],"status":"ok","short":{"text":"A filter basis of X followed by an order-preserving filter basis of Y is a filter basis of Y","status":"ok"},"proof":[{"text":"Fix y in Y. Since β is a filter basis ([[AffineConstructive.interfaces.orders.filter_basis]]), there is x in X with β x ≤ y. By transitivity it is then enough to find i with β (α i) ≤ β x.","status":"ok","from":0,"to":3},{"text":"Since α is a filter basis, there is i with α i ≤ x; take i as the witness. Because β is order-preserving, α i ≤ x gives β (α i) ≤ β x.","status":"ok","from":4,"to":8}]},{"name":"AffineConstructive.orders.filters.tensor_filter_basis","base":"tensor_filter_basis","kind":"prf","start":245,"body":[246,252],"status":"ok","short":{"text":"The tensor pairing ⟨α, β⟩ of two filter bases is a filter basis of X ⊗ Y","status":"ok"},"proof":[{"text":"Fix a point (x, y) of X ⊗ Y. The two filter bases ([[AffineConstructive.interfaces.orders.filter_basis]]) give i with α i ≤ x and j with β j ≤ y.","status":"ok","from":0,"to":3},{"text":"Take (i, j) as the witness. The order on X ⊗ Y compares components and joins the comparisons by ⊠, so α i ≤ x and β j ≤ y together give (α i, β j) ≤ (x, y).","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.filters.filter_presentation_basis_elt","base":"filter_presentation_basis_elt","kind":"prf","start":254,"body":[255,258],"status":"ok","short":{"text":"Each generator β i of a filter presentation of U is a member of U","status":"ok"},"proof":[{"text":"By the presentation, membership of β i in U is the existence of a generator below it: some β j with β j ≤ β i.","status":"ok","from":0,"to":1},{"text":"Take i itself as the witness; β i ≤ β i holds by reflexivity.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.filters.filter_presentation_basis","base":"filter_presentation_basis","kind":"def","start":259,"body":null,"status":"ok","short":{"text":"The generators of a filter presentation of U, as a family of members of U","status":"ok"},"long":{"text":"For a subset U presented as a filter by the family β, every β i lies in U ([[AffineConstructive.orders.filters.filter_presentation_basis_elt]]), so β corestricts to a family Λ → U. This is that corestriction: the same points, now regarded as elements of U with the order and equality U inherits from X.\n\nIts purpose is to pass from a presentation of U, a statement about the ambient order, to a basis of U as an ordered set in its own right: [[AffineConstructive.orders.filters.filter_presentation_basis_correct]] shows that every member of U lies above some generator, which is the condition [[AffineConstructive.interfaces.orders.FilterBasis]] asks of a family.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.filter_presentation_basis_correct","base":"filter_presentation_basis_correct","kind":"prf","start":261,"body":[262,267],"status":"ok","short":{"text":"The generators of a filter presentation of U form a filter basis of U","status":"ok"},"proof":[{"text":"Take an element of U, a point x with x ∊ U. Read in X, what has to be shown is that some generator β i lies below x.","status":"ok","from":0,"to":2},{"text":"The presentation says that x ∊ U is equivalent to there being a generator below x. Rewriting the membership by it turns the goal into the hypothesis.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.filters.filter_presentation_basis_is_fun","base":"filter_presentation_basis_is_fun","kind":"prf","start":269,"body":[270,273],"status":"ok","short":{"text":"When β is a function of sets, its corestriction to U preserves equality","status":"ok"},"proof":[{"text":"Fix x and y in Λ. The corestriction to U has the same values as β, so equality in U is equality in X, and x = y implies β x = β y because β is a function of sets.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.filters.filter_presentation_basis_fun","base":"filter_presentation_basis_fun","kind":"def","start":274,"body":null,"status":"ok","short":{"text":"The corestriction Λ ⇾ U of a presenting function β, as a function of sets","status":"ok"},"long":{"text":"When the index of a filter presentation is a set and β is a function Λ ⇾ X, the corestriction [[AffineConstructive.orders.filters.filter_presentation_basis]] preserves equality, because the equality of U is that of X ([[AffineConstructive.orders.filters.filter_presentation_basis_is_fun]]); this packages it as a function Λ ⇾ U.\n\nAs a function it is a filter basis of U ([[AffineConstructive.orders.filters.filter_presentation_basis_correct]]) and is order preserving whenever β is ([[AffineConstructive.orders.filters.filter_presentation_basis_order_preserving]]), so a presentation by a monotone function yields a monotone basis of the filter.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.canonical:filter_presentation_basis_fun","base":"canonical:filter_presentation_basis_fun","kind":"canonical","start":275,"body":null,"status":"ok","short":{"text":"Unification finds the corestriction Λ ⇾ U of a filter's presenting function as a function of sets","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.filter_presentation_basis_order_preserving","base":"filter_presentation_basis_order_preserving","kind":"prf","start":277,"body":[278,281],"status":"ok","short":{"text":"The corestriction of an order-preserving presenting function to U preserves the order","status":"ok"},"proof":[{"text":"U is a weak poset under the order of X, so by [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it is enough to show that x ≤ y implies that the corestricted values are ordered in the same way, for all x and y.","status":"ok","from":0,"to":1},{"text":"Those values are β x and β y, ordered as in X, so this is the statement that β preserves the order.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.filters.presented_ideal","base":"presented_ideal","kind":"def","start":283,"body":null,"status":"ok","short":{"text":"The ideal presented by a family β: the points lying below some β i","status":"ok"},"long":{"text":"The subset of X of those x for which there is an index i with x ≤ β i: the downward closure of the family β. The quantifier is the affine existential ∐, so x is affirmed a member by exhibiting an index and refuted a member when it is refuted below every β i. It is the dual of [[AffineConstructive.orders.filters.presented_filter]], written out directly rather than as the presented filter of the opposite order.\n\nBy [[AffineConstructive.orders.filters.presented_ideal_correct]] it is presented by β in the sense of [[AffineConstructive.interfaces.orders.IdealPresentation]]. It is a down-set in any case, and an ideal when the family is inhabited and up-directed ([[AffineConstructive.orders.filters.presented_ideal_ideal]], [[AffineConstructive.orders.filters.presented_ideal_ideal_alt]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.presented_ideal_correct","base":"presented_ideal_correct","kind":"prf","start":284,"body":[285,287],"status":"ok","short":{"text":"The presented ideal of β is presented by β","status":"ok"},"proof":[{"text":"The presented ideal is defined as the subset whose membership condition is the one the presentation asks for. The single condition of an ideal presentation is therefore an equivalence of a proposition with itself.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.IdealPresentation_poset","base":"IdealPresentation_poset","kind":"def","start":289,"body":null,"status":"ok","short":{"text":"The weak poset structure on X carried by an ideal presentation","status":"ok"},"long":{"text":"An ideal presentation is a filter presentation for the opposite order, and a filter presentation carries the weak poset axioms of its ambient order ([[AffineConstructive.interfaces.orders.filter_presentation_poset]]). This extracts them for the opposite order and turns them back with [[AffineConstructive.orders.orders.WeakPoset_op]], giving the weak poset structure on X itself.\n\nIt is declared a coercion, so that a hypothesis that U is presented as an ideal also supplies the order axioms the lemmas about ideal presentations need.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.ideal_presentation_alt","base":"ideal_presentation_alt","kind":"prf","start":290,"body":[291,293],"status":"ok","short":{"text":"An ideal presented by β is the point downward closure of the range of β","status":"ok"},"proof":[{"text":"An ideal presentation is a filter presentation on the opposite order, and the point upward closure there is the point downward closure in X. The statement is therefore [[AffineConstructive.orders.filters.filter_presentation_alt]] applied to X ᵒᵖ.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.ideal_presentation_least_downset","base":"ideal_presentation_least_downset","kind":"def","start":294,"body":[295,297],"status":"ok","short":{"text":"A subset with an ideal presentation is a least down-set","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.ideal_presentation_alt]], U is the point downward closure of the range of β. A point downward closure is a least down-set by [[AffineConstructive.orders.closure.point_downward_closure_least_downset]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.presented_ideal_ideal","base":"presented_ideal_ideal","kind":"prf","start":298,"body":[299,301],"status":"ok","short":{"text":"A subset presented by an order-preserving family on an up-directed order is an ideal","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.ideal_presentation_alt]], U is the point downward closure of the range of β. Since β preserves the order and Λ is up-directed, the range is up-directed by [[AffineConstructive.orders.closure.range_up_directed]], and the point downward closure of an up-directed subset is an ideal by [[AffineConstructive.orders.closure.point_downward_closure_ideal]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.presented_ideal_ideal_alt","base":"presented_ideal_ideal_alt","kind":"prf","start":302,"body":[303,305],"status":"ok","short":{"text":"A subset presented by an inhabited family whose members have common upper bounds is an ideal","status":"ok"},"proof":[{"text":"In the opposite order, U is presented as a filter by the same family, and common upper bounds become common lower bounds. The result is therefore [[AffineConstructive.orders.filters.presented_filter_filter_alt]] applied to X ᵒᵖ.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.ideal_basis_self","base":"ideal_basis_self","kind":"prf","start":306,"body":[307,310],"status":"ok","short":{"text":"The identity of a weak poset is an ideal basis","status":"ok"},"proof":[{"text":"Fix x. An index of the family has to be found whose value lies below x. Take x itself as the witness: x ≤ x holds by reflexivity.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.filters.ideal_basis_compose","base":"ideal_basis_compose","kind":"prf","start":312,"body":[313,315],"status":"ok","short":{"text":"An ideal basis of X followed by an order-preserving ideal basis of Y is an ideal basis of Y","status":"ok"},"proof":[{"text":"Pass to the opposite orders. There the two ideal bases are filter bases, β still preserves the order, and the opposite of a weak poset is a weak poset, so the composite is a filter basis of Y ᵒᵖ by [[AffineConstructive.orders.filters.filter_basis_compose]]. That is, it is an ideal basis of Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.tensor_ideal_basis","base":"tensor_ideal_basis","kind":"prf","start":317,"body":[318,320],"status":"ok","short":{"text":"The tensor pairing ⟨α, β⟩ of two ideal bases is an ideal basis of X ⊗ Y","status":"ok"},"proof":[{"text":"Pass to the opposite orders, where α and β are filter bases. By [[AffineConstructive.orders.filters.tensor_filter_basis]] their tensor pairing is a filter basis of X ᵒᵖ ⊗ Y ᵒᵖ, which is an ideal basis of X ⊗ Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.ideal_presentation_basis_elt","base":"ideal_presentation_basis_elt","kind":"prf","start":322,"body":[323,326],"status":"ok","short":{"text":"Each generator β i of an ideal presentation of U is a member of U","status":"ok"},"proof":[{"text":"By the presentation of U ([[AffineConstructive.interfaces.orders.ideal_presentation]]), showing that β i lies in U means finding an index j with β i ≤ β j.","status":"ok","from":0,"to":1},{"text":"Take i itself as the witness. Then β i ≤ β i holds by reflexivity of the order that the presentation carries.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.filters.ideal_presentation_basis","base":"ideal_presentation_basis","kind":"def","start":327,"body":null,"status":"ok","short":{"text":"The generators of an ideal presentation of U, as a family of members of U","status":"ok"},"long":{"text":"For a subset U presented as an ideal by the family β, every β i lies in U ([[AffineConstructive.orders.filters.ideal_presentation_basis_elt]]), so β corestricts to a family Λ → U. This is that corestriction, the dual of [[AffineConstructive.orders.filters.filter_presentation_basis]].\n\nBy [[AffineConstructive.orders.filters.ideal_presentation_basis_correct]] every member of U lies below some generator, so the corestriction is an ideal basis of U as an ordered set: a presentation of U in the ambient order becomes a cofinal family in U.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.ideal_presentation_basis_correct","base":"ideal_presentation_basis_correct","kind":"prf","start":329,"body":[330,332],"status":"ok","short":{"text":"The generators of an ideal presentation of U form an ideal basis of U","status":"ok"},"proof":[{"text":"An ideal presentation of U is a filter presentation of U for the opposite order. Its generators therefore form a filter basis of U there by [[AffineConstructive.orders.filters.filter_presentation_basis_correct]], which is an ideal basis of U for the order of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.filters.ideal_presentation_basis_is_fun","base":"ideal_presentation_basis_is_fun","kind":"prf","start":334,"body":[335,338],"status":"ok","short":{"text":"When β is a function of sets, its corestriction to U preserves equality","status":"ok"},"proof":[{"text":"Fix indices x and y. It remains to show that x = y implies that their images in U are equal, and these images are the values of β.","status":"ok","from":0,"to":1},{"text":"Since U carries the equality of X, this is the statement that β preserves equality ([[AffineConstructive.interfaces.set.is_fun]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.filters.ideal_presentation_basis_fun","base":"ideal_presentation_basis_fun","kind":"def","start":339,"body":null,"status":"ok","short":{"text":"The corestriction Λ ⇾ U of a function presenting an ideal, as a function of sets","status":"ok"},"long":{"text":"When the index of an ideal presentation is a set and β is a function Λ ⇾ X, the corestriction [[AffineConstructive.orders.filters.ideal_presentation_basis]] preserves equality, since U carries the equality of X ([[AffineConstructive.orders.filters.ideal_presentation_basis_is_fun]]); this packages it as a function Λ ⇾ U.\n\nAs a function it is an ideal basis of U and is order preserving when β is ([[AffineConstructive.orders.filters.ideal_presentation_basis_order_preserving]]). It is the dual of [[AffineConstructive.orders.filters.filter_presentation_basis_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.canonical:ideal_presentation_basis_fun","base":"canonical:ideal_presentation_basis_fun","kind":"canonical","start":340,"body":null,"status":"ok","short":{"text":"Unification finds the corestriction Λ ⇾ U of an ideal's presenting function as a function of sets","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.ideal_presentation_basis_order_preserving","base":"ideal_presentation_basis_order_preserving","kind":"prf","start":342,"body":[343,346],"status":"ok","short":{"text":"The corestriction of an order-preserving function presenting an ideal preserves the order","status":"ok"},"proof":[{"text":"With the order of X, U is a weak poset, and so is Λ. By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]], it therefore suffices to show that for all x and y, x ≤ y implies that their images in U compare in the same way.","status":"ok","from":0,"to":1},{"text":"The images are compared as elements of X, so this is exactly the statement that β preserves the order.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.filters.preimage_upset","base":"preimage_upset","kind":"prf","start":349,"body":[350,356],"status":"ok","short":{"text":"The preimage of an up-set under an order-preserving map is an up-set","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.closure.Build_UpSet]], it suffices to fix x and y and show that x ≤ y implies that f x ∊ U implies f y ∊ U. Membership of a point in the preimage f* U is membership of its image in U.","status":"ok","from":0,"to":3},{"text":"Since f preserves the order, the hypothesis x ≤ y can be replaced by f x ≤ f y.","status":"ok","from":4,"to":4},{"text":"What remains says that U is upward closed at f x and f y, which holds because U is an up-set ([[AffineConstructive.interfaces.orders.up_closed]]).","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.orders.filters.preimage_filter","base":"preimage_filter","kind":"prf","start":358,"body":[359,370],"status":"ok","short":{"text":"The preimage of a filter under a meet-semilattice morphism is a filter when it is inhabited","status":"ok"},"proof":[{"text":"Record two facts for later. A meet-semilattice morphism preserves the order ([[AffineConstructive.orders.lattices.meet_sl_mor_preserving]]), and a filter in a meet semilattice is closed under binary meets ([[AffineConstructive.orders.filters.filter_meet_sub_sl]]).","status":"ok","from":0,"to":2},{"text":"A filter is an up-set that is down-directed. Because g preserves the order, the preimage is an up-set by [[AffineConstructive.orders.filters.preimage_upset]], so it remains to show that the preimage is down-directed.","status":"ok","from":3,"to":3},{"text":"By [[AffineConstructive.orders.closure.Build_DownDirectedSubset]], the preimage must be inhabited, which is the hypothesis that some g x lies in F. It must also contain a common lower bound of any two of its elements, and that is what remains.","status":"ok","from":4,"to":4},{"text":"Fix x and y. From g x ∊ F and g y ∊ F we must find z with g z ∊ F, z ≤ x and z ≤ y.","status":"ok","from":5,"to":6},{"text":"Take x ⊓ y as the witness. The inequalities x ⊓ y ≤ x and x ⊓ y ≤ y hold because a meet is a lower bound, so it remains to show that g (x ⊓ y) lies in F.","status":"ok","from":7,"to":8},{"text":"Since g preserves meets ([[AffineConstructive.theory.lattices.preserves_meet]]), g (x ⊓ y) equals g x ⊓ g y, so it remains to show that g x ⊓ g y lies in F.","status":"ok","from":9,"to":9},{"text":"F is closed under binary meets ([[AffineConstructive.interfaces.subalgebra.sub_meet_closed]]), and each of the two memberships g x ∊ F and g y ∊ F is used once to conclude.","status":"ok","from":10,"to":11}]},{"name":"AffineConstructive.orders.filters.preimage_downset","base":"preimage_downset","kind":"def","start":372,"body":null,"status":"ok","short":{"text":"The preimage of a down-set under an order-preserving map is a down-set","status":"ok"},"long":{"text":"If f preserves the order and U is a down-set of Y, then f* U is a down-set of X. The statement is [[AffineConstructive.orders.filters.preimage_upset]] for the opposite orders: f preserves the opposite orders as well, and a down-set is an up-set of the opposite order, so no separate argument is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.filters.preimage_ideal","base":"preimage_ideal","kind":"def","start":374,"body":null,"status":"ok","short":{"text":"The preimage of an ideal under a join-semilattice morphism that meets it is an ideal","status":"ok"},"long":{"text":"If g : Q ⇾ P is a join-semilattice morphism between join semilattice orders, F is an ideal of P, and there is x with g x ∊ F, then the preimage g* F is an ideal of Q. This is the order-theoretic pullback of an ideal. It is [[AffineConstructive.orders.filters.preimage_filter]] read at the opposite orders, where joins become meets and ideals become filters, so it needs no proof of its own.\n\nThe extra hypothesis is a proof of the affine existential ∐ x, g x ∊ F: some point of Q is sent into F. It is needed because an ideal must be inhabited, and being a morphism does not make g send any point into F. Downward closure and up-directedness of g* F come from g preserving the order and joins.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.theory.sublattices":{"page":"../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.lattices":{"page":"lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.orders.sublattices":{"page":"sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.orders.suborders":{"page":"suborders.html","short":"Subsets of an ordered set inherit its order structures; the inclusion is an order embedding","summary":"A subset U of X, regarded as a set ([[subset_to_set]]), carries the order of X restricted to its members, and this file shows that every order structure on X passes to U: preorder, weak poset, poset, strong poset, total and linear order, and the strong transitivity, decidability, affirmativity and refutativity of the order. Each proof restates the required law at the order of X and applies the corresponding law there, since a comparison of members of U is the same proposition as the comparison of the underlying points. The file ends by showing that the inclusion [[from_subset]] is an order embedding, so it both preserves and reflects the order. All of these are registered for instance resolution, so any subset of an ordered set is ordered without further declaration."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.closure":{"page":"closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.subset":{"page":"subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.subset_images":{"page":"subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

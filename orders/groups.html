ng_order.\nRequire Export orders.orders orders.maps orders.suborders.\nRequire Import theory.additive_groups theory.subrings.\nRequire Import logic.aprop relations.\nRequire Import easy rewrite simplify tactics.misc.\n\n(** Ordered Monoids *)\n\nImport cone_notation.\nLemma nonneg_dual `{WeakPoset P} {z:Zero P} {x:P} : DeMorganDual (x ∊ P⁺) (x ∊ P₋).  Proof. exact (_ : DeMorganDual (0 ≤ x) _). Qed.\nLemma nonpos_dual `{WeakPoset P} {z:Zero P} {x:P} : DeMorganDual (x ∊ P⁻) (x ∊ P₊).  Proof. exact (_ : DeMorganDual (x ≤ 0) _). Qed.\nLemma pos_dual    `{WeakPoset P} {z:Zero P} {x:P} : DeMorganDual (x ∊ P₊) (x ∊ P⁻).  Proof. exact (_ : DeMorganDual (0 < x) _). Qed.\nLemma neg_dual    `{WeakPoset P} {z:Zero P} {x:P} : DeMorganDual (x ∊ P₋) (x ∊ P⁺).  Proof. exact (_ : DeMorganDual (x < 0) _). Qed.\nGlobal Hint Extern 2 (DeMorganDual (_ ∊ _⁺) _) => notypeclasses refine nonneg_dual : typeclass_instances.\nGlobal Hint Extern 2 (DeMorganDual (_ ∊ _⁻) _) => notypeclasses refine nonpos_dual : typeclass_instances.\nGlobal Hint Extern 2 (DeMorganDual (_ ∊ _₊) _) => notypeclasses refine pos_dual : typeclass_instances.\nGlobal Hint Extern 2 (DeMorganDual (_ ∊ _₋) _) => notypeclasses refine neg_dual : typeclass_instances.\n\nLemma plus_r_order_embedding `{AdditiveMonoidOrder M} : ∀ {z:M}, OrderEmbedding (+z).\nProof. exact (right_order_embedding_from_left (@plus_l_order_embedding _ _ _ _ _)). Qed.\nGlobal Hint Extern 2 (OrderEmbedding (+_)) => simple notypeclasses refine plus_r_order_embedding : typeclass_instances.\nGlobal Hint Extern 2 (OrderPreserving (+_)) => simple notypeclasses refine plus_r_order_embedding : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflecting (+_)) => simple notypeclasses refine plus_r_order_embedding : typeclass_instances.\n\nLemma plus_order_preserving `{AdditiveMonoidOrder M} : OrderPreserving (Y:=M) (+).\nProof. apply alt_Build_OrderPreserving.\n  intros [x₁ y₁][x₂ y₂]. unfold_pair_le.\n  rew ( order_preserving_simp (+ y₁) x₁ x₂).\n  rew ( order_preserving_simp (x₂ +) y₁ y₂).\n  now apply transitivity.\nQed.\nGlobal Hint Extern 2 (OrderPreserving (+)) => simple notypeclasses refine plus_order_preserving : typeclass_instances.\n\nLemma compose_le `{AdditiveMonoidOrder M} (x y z : M) : 0 ≤ z ⊠ y = x + z ⊸ x ≤ y.\nProof. rew <-(transitivity (≤) x (x + z) y). apply aprod_proper_aimpl.\n+ exact (order_preserving_simp (x+) _ _).\n+ apply eq_le_flip.\nQed.\n\nLemma compose_lt `{AdditiveMonoidOrder M} (x y z : M) : 0 < z ⊠ y = x + z ⊸ x < y.\nProof. rew <-(lt_le_trans x (x+z) y). apply aprod_proper_aimpl.\n+ exact (strictly_order_preserving_simp (x+) _ _).\n+ apply eq_le_flip.\nQed.\n\nCoercion add_mon_order_plus_cancel `{AdditiveMonoidOrder M} : AdditiveCancellation M.\nProof. apply alt_Build_AdditiveCancellation. intros z x y; simplify.\n  rew <-(antisymmetry (≤) x y). apply aand_intro.\n  * rew <-(order_reflecting_simp (z+) x y). now apply subrelation.\n  * rew [ (symmetry_iff (=) (z+x) (z+y)) | <-(order_reflecting_simp (z+) y x)]. now apply subrelation.\nQed.\n\n\nLemma add_mon_order_nonneg_sub_mon `{AdditiveMonoidOrder M} : AdditiveSubMonoid M⁺.\nProof. apply alt_Build_AdditiveSubMonoid.\n+ intros x y. change (0 ≤ x ⊠ 0 ≤ y ⊸ 0 ≤ x + y).\n  rew (order_embedding_simp (x+) 0 y). now apply transitivity.\n+ now change (0 ≤ 0 :> M).\nQed.\nGlobal Hint Extern 2 (AdditiveSubMonoid _⁺) => simple notypeclasses refine add_mon_order_nonneg_sub_mon : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSubSemiGroup _⁺) => simple notypeclasses refine add_mon_order_nonneg_sub_mon : typeclass_instances.\n\n\nLemma add_mon_order_nonneg_order `{AdditiveMonoidOrder M} : AdditiveMonoidOrder M⁺.\nProof. split; try exact _.\n  intros z. apply alt_Build_OrderEmbedding. intros x y.\n  exact (order_embedding (subset_pt z +) (subset_pt _) (subset_pt _)).\nQed.\nGlobal Hint Extern 2 (AdditiveMonoidOrder (subset_to_set _⁺)) => simple notypeclasses refine add_mon_order_nonneg_order : typeclass_instances.\nGlobal Hint Extern 4 (AdditiveCancellation (subset_to_set _⁺)) => simple notypeclasses refine add_mon_order_nonneg_order : typeclass_instances.\n\n\nSection lt_le.\n  Context `{AdditiveMonoidOrder (M:=R)}.\n\n  Lemma plus_lt_le_compat (x₁ y₁ x₂ y₂ : R) : x₁ < y₁ ⊠ x₂ ≤ y₂ ⊸ x₁ + x₂ < y₁ + y₂.\n  Proof.\n    rew [ ( strictly_order_preserving_simp (+x₂) x₁ y₁ ) |( order_preserving_simp (y₁+) x₂ y₂ ) ].\n    apply lt_le_trans.\n  Qed.\n\n  Lemma plus_le_lt_compat (x₁ y₁ x₂ y₂ : R) : x₁ ≤ y₁ ⊠ x₂ < y₂ ⊸ x₁ + x₂ < y₁ + y₂.\n  Proof.\n    rew [ ( order_preserving_simp (+x₂) x₁ y₁ ) |( strictly_order_preserving_simp (y₁+) x₂ y₂ ) ].\n    apply le_lt_trans.\n  Qed.\nEnd lt_le.\n\n\n(*\nSection preserves_sign.\n  Context `{AdditiveMonoidOrder (M:=M)} `{AdditiveMonoidOrder (M:=N)}.\n  Context (f:M ⇾ N) `{!AdditiveMonoid_Morphism f}.\n\n  Lemma preserves_nonneg `{!OrderPreserving f} x : x ∊ M⁺ ⊸ f x ∊ N⁺.\n  Proof. change (0 ≤ x ⊸ 0 ≤ f x). rew <-(preserves_0 f). exact (order_preserving f _ _). Qed.\n\n  Lemma preserves_nonpos `{!OrderPreserving f} x : x ∊ M⁻ ⊸ f x ∊ N⁻.\n  Proof. change (x ≤ 0 ⊸ f x ≤ 0). rew <-(preserves_0 f). exact (order_preserving f _ _). Qed.\n\n  Lemma reflects_nonneg `{!OrderReflecting f} x : f x ∊ N⁺ ⊸ x ∊ M⁺.\n  Proof. change (0 ≤ f x ⊸ 0 ≤ x). rew <-(preserves_0 f). exact (order_reflecting f _ _). Qed.\n\n  Lemma reflects_nonpos `{!OrderReflecting f} x : f x ∊ N⁻ ⊸ x ∊ M⁻.\n  Proof. change (f x ≤ 0 ⊸ x ≤ 0). rew <-(preserves_0 f). exact (order_reflecting f _ _). Qed.\n\n  Lemma embeds_nonneg `{!OrderEmbedding f} x : x ∊ M⁺ ⧟ f x ∊ N⁺.\n  Proof. split; [ exact (preserves_nonneg _) | exact (reflects_nonneg _) ]. Qed.\n\n  Lemma embeds_nonpos `{!OrderEmbedding f} x : x ∊ M⁻ ⧟ f x ∊ N⁻.\n  Proof. split; [ exact (preserves_nonpos _) | exact (reflects_nonpos _) ]. Qed.\n\n  Lemma reflects_pos `{!OrderPreserving f} x : f x ∊ N₊ ⊸ x ∊ M₊.\n  Proof contrapositive (preserves_nonpos x).\n\n  Lemma reflects_neg `{!OrderPreserving f} x : f x ∊ N₋ ⊸ x ∊ M₋.\n  Proof contrapositive (preserves_nonneg x).\n\n  Lemma preserves_pos `{!OrderReflecting f} x : x ∊ M₊ ⊸ f x ∊ N₊.\n  Proof contrapositive (reflects_nonpos x).\n\n  Lemma preserves_neg `{!OrderReflecting f} x : x ∊ M₋ ⊸ f x ∊ N₋.\n  Proof contrapositive (reflects_nonneg x).\n\n  Lemma embeds_pos `{!OrderEmbedding f} x : x ∊ M₊ ⧟ f x ∊ N₊.\n  Proof contrapositive_iff (embeds_nonpos x).\n\n  Lemma embeds_neg `{!OrderEmbedding f} x : x ∊ M₋ ⧟ f x ∊ N₋.\n  Proof contrapositive_iff (embeds_nonneg x).\nEnd preserves_sign.\n*)\n\nSection preserves_sign.\n  Universes u.\n  Context `{AdditiveMonoidOrder@{u} (M:=M)} `{AdditiveMonoidOrder@{u} (M:=N)}.\n  Context (f:M ⇾ N) `{!AdditiveMonoid_Morphism f}.\n\n  Lemma preserves_nonneg `{!OrderPreserving f} x : 0 ≤ x ⊸ 0 ≤ f x.\n  Proof. rew <-(preserves_0 f). exact (order_preserving f _ _). Qed.\n\n  Lemma preserves_nonpos `{!OrderPreserving f} x : x ≤ 0 ⊸ f x ≤ 0.\n  Proof. rew <-(preserves_0 f). exact (order_preserving f _ _). Qed.\n\n  Lemma reflects_nonneg `{!OrderReflecting f} x : 0 ≤ f x ⊸ 0 ≤ x.\n  Proof. rew <-(preserves_0 f). exact (order_reflecting f _ _). Qed.\n\n  Lemma reflects_nonpos `{!OrderReflecting f} x : f x ≤ 0 ⊸ x ≤ 0.\n  Proof. rew <-(preserves_0 f). exact (order_reflecting f _ _). Qed.\n\n  Lemma embeds_nonneg `{!OrderEmbedding f} x : 0 ≤ x ⧟ 0 ≤ f x.\n  Proof. split; [ exact (preserves_nonneg _) | exact (reflects_nonneg _) ]. Qed.\n\n  Lemma embeds_nonpos `{!OrderEmbedding f} x : x ≤ 0 ⧟ f x ≤ 0.\n  Proof. split; [ exact (preserves_nonpos _) | exact (reflects_nonpos _) ]. Qed.\n\n  Lemma reflects_pos `{!OrderPreserving f} x : 0 < f x ⊸ 0 < x.\n  Proof. exact (contrapositive (preserves_nonpos x)). Qed.\n\n  Lemma reflects_neg `{!OrderPreserving f} x : f x < 0 ⊸ x < 0.\n  Proof. exact (contrapositive (preserves_nonneg x)). Qed.\n\n  Lemma preserves_pos `{!OrderReflecting f} x : 0 < x ⊸ 0 < f x.\n  Proof. exact (contrapositive (reflects_nonpos x)). Qed.\n\n  Lemma preserves_neg `{!OrderReflecting f} x : x < 0 ⊸ f x < 0.\n  Proof. exact (contrapositive (reflects_nonneg x)). Qed.\n\n  Lemma embeds_pos `{!OrderEmbedding f} x : 0 < x ⧟ 0 < f x.\n  Proof. exact (contrapositive_iff (embeds_nonpos x)). Qed.\n\n  Lemma embeds_neg `{!OrderEmbedding f} x : x < 0 ⧟ f x < 0.\n  Proof. exact (contrapositive_iff (embeds_nonneg x)). Qed.\nEnd preserves_sign.\n\nSection preserves_sign_flip.\n  Universes u.\n  Context `{AdditiveMonoidOrder@{u} (M:=M)} `{AdditiveMonoidOrder@{u} (M:=N)}.\n  Context (f:M ⇾ N) `{!AdditiveMonoid_Morphism f}.\n\n  Lemma preserves_nonneg_flip `{!OrderPreservingFlip f} x : 0 ≤ x ⊸ f x ≤ 0.\n  Proof. rew <-(preserves_0 f). exact (order_preserving_flip f _ _). Qed.\n\n  Lemma preserves_nonpos_flip `{!OrderPreservingFlip f} x : x ≤ 0 ⊸ 0 ≤ f x.\n  Proof. rew <-(preserves_0 f). exact (order_preserving_flip f _ _). Qed.\n\n  Lemma reflects_nonneg_flip `{!OrderReflectingFlip f} x : 0 ≤ f x ⊸ x ≤ 0.\n  Proof. rew <-(preserves_0 f). exact (order_reflecting_flip f _ _). Qed.\n\n  Lemma reflects_nonpos_flip `{!OrderReflectingFlip f} x : f x ≤ 0 ⊸ 0 ≤ x.\n  Proof. rew <-(preserves_0 f). exact (order_reflecting_flip f _ _). Qed.\n\n  Lemma embeds_nonneg_flip `{!OrderEmbeddingFlip f} x : 0 ≤ x ⧟ f x ≤ 0.\n  Proof. split; [ exact (preserves_nonneg_flip _) | exact (reflects_nonpos_flip _) ]. Qed.\n\n  Lemma embeds_nonpos_flip `{!OrderEmbeddingFlip f} x : x ≤ 0 ⧟ 0 ≤ f x.\n  Proof. split; [ exact (preserves_nonpos_flip _) | exact (reflects_nonneg_flip _) ]. Qed.\n\n  Lemma reflects_pos_flip `{!OrderPreservingFlip f} x : 0 < f x ⊸ x < 0.\n  Proof. exact (contrapositive (preserves_nonneg_flip x)). Qed.\n\n  Lemma reflects_neg_flip `{!OrderPreservingFlip f} x : f x < 0 ⊸ 0 < x.\n  Proof. exact (contrapositive (preserves_nonpos_flip x)). Qed.\n\n  Lemma preserves_pos_flip `{!OrderReflectingFlip f} x : 0 < x ⊸ f x < 0.\n  Proof. exact (contrapositive (reflects_nonneg_flip x)). Qed.\n\n  Lemma preserves_neg_flip `{!OrderReflectingFlip f} x : x < 0 ⊸ 0 < f x.\n  Proof. exact (contrapositive (reflects_nonpos_flip x)). Qed.\n\n  Lemma embeds_pos_flip `{!OrderEmbeddingFlip f} x : 0 < x ⧟ f x < 0.\n  Proof. exact (contrapositive_iff (embeds_nonpos_flip x)). Qed.\n\n  Lemma embeds_neg_flip `{!OrderEmbeddingFlip f} x : x < 0 ⧟ 0 < f x.\n  Proof. exact (contrapositive_iff (embeds_nonneg_flip x)). Qed.\nEnd preserves_sign_flip.\n\n\n(** Ordered Groups *)\n\nCoercion AdditiveGroupOrder_AdditiveMonoidOrder `{AdditiveGroupOrder (G:=G)} : AdditiveMonoidOrder G.\nProof. split; [ exact _ ..|]. intros z. apply alt_Build_OrderEmbedding. intros x y; simplify; split.\n+ apply (add_group_plus_order_preserving G _).\n+ pose proof add_group_plus_order_preserving G _ (-z).\n  now rew (order_preserving_simp (-z +) (z+x) (z+y)).\nQed.\n\nLemma negate_order_embedding_flip `{AdditiveGroupOrder (G:=G)} : OrderEmbeddingFlip (X:=G) (-).\nProof. apply (involutive_order_embedding_flip _). apply alt_Build_OrderPreservingFlip.\n  intros x y. now rew (order_preserving_simp (-x-y+) x y).\nQed.\n\nGlobal Hint Extern 2 (OrderEmbeddingFlip (-)) => simple notypeclasses refine negate_order_embedding_flip : typeclass_instances.\nGlobal Hint Extern 2 (OrderPreservingFlip (-)) => simple notypeclasses refine negate_order_embedding_flip : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflectingFlip (-)) => simple notypeclasses refine negate_order_embedding_flip : typeclass_instances.\n\n\nLemma nonneg_between `{AdditiveGroupOrder (G:=G)} `{!StrongPoset G} (x:G) : 0 ≤ x ⊸ -x ≤ x.\nProof.\n  rew <-(strong_transitivity (≤) (-x) 0 x).\n  rew <-(preserves_nonneg_flip (-) x).\n  now simplify.\nQed.\n\nLemma nonpos_between `{AdditiveGroupOrder (G:=G)} `{!StrongPoset G} (x:G) : x ≤ 0 ⊸ x ≤ -x.\nProof.\n  rew <-(strong_transitivity (≤) x 0 (-x)).\n  rew <-(preserves_nonpos_flip (-) x).\n  now simplify.\nQed.\n\nLemma between_neg `{AdditiveGroupOrder (G:=G)} `{!StrongPoset G} (x:G) : x < -x ⊸ x < 0.\nProof. exact (contrapositive (nonneg_between x)). Qed.\n\nLemma between_pos `{AdditiveGroupOrder (G:=G)} `{!StrongPoset G} (x:G) : -x < x ⊸ 0 < x.\nProof. exact (contrapositive (nonpos_between x)). Qed.\n\n\nLemma pos_between `{AdditiveGroupOrder (G:=G)} `{!LinearOrder G, !RefutativeOrder G} (x:G) : 0 < x ⊸ -x < x.\nProof.\n  apply affirmative_aimpl; intro.\n  rew <-(transitivity (<) (-x) 0 x).\n  now rew <-(preserves_pos_flip (-) x).\nQed.\n\nLemma neg_between `{AdditiveGroupOrder (G:=G)} `{!LinearOrder G, !RefutativeOrder G} (x:G) : x < 0 ⊸ x < -x.\nProof.\n  apply affirmative_aimpl; intro.\n  rew <-(transitivity (<) x 0 (-x)).\n  now rew <-(preserves_neg_flip (-) x).\nQed.\n\nLemma between_nonneg `{AdditiveGroupOrder (G:=G)} `{!LinearOrder G, !RefutativeOrder G} (x:G) : -x ≤ x ⊸ 0 ≤ x.\nProof. exact (contrapositive (neg_between x)). Qed.\n\nLemma between_nonpos `{AdditiveGroupOrder (G:=G)} `{!LinearOrder G, !RefutativeOrder G} (x:G) : x ≤ -x ⊸ x ≤ 0.\nProof. exact (contrapositive (pos_between x)). Qed.\n\n","sentences":[{"i":0,"s":0,"e":55,"kind":"vernac","status":"ok","ms":37,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":56,"e":114,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":2,"s":115,"e":169,"kind":"vernac","status":"ok","ms":25,"messages":[],"goals":null},{"i":3,"s":170,"e":207,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":208,"e":258,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":5,"s":260,"e":305,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":6,"s":306,"e":389,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":{"fg":[{"id":"28","name":null,"hyps":["0822a7566374def6","fd72fbbb2b1a9d2c","946e93157c353e23","8a4a8ea68e6ed4f0","6a8aefa940a82bde"],"ccl":"d9acb2755a095d2e"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":7,"s":391,"e":397,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":{"fg":[{"id":"28","name":null,"hyps":["0822a7566374def6","fd72fbbb2b1a9d2c","946e93157c353e23","8a ame":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11347,"e":11350,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11351,"e":11359,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":11468,"e":11471,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11512,"e":11515,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11551,"e":11554,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11555,"e":11563,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":12014,"e":12017,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12051,"e":12054,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12055,"e":12058,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12247,"e":12250,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12284,"e":12287,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12288,"e":12291,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file proves the basic order laws of ordered additive monoids and groups. For an ordered monoid it shows that every right translation (+z) is an order embedding and that addition is order preserving in both arguments. It also proves that 0 ≤ z and y = x + z together imply x ≤ y ([[AffineConstructive.orders.groups.compose_le]], with the strict version [[AffineConstructive.orders.groups.compose_lt]]), proves the mixed strict and non-strict addition laws, derives additive cancellation, and shows that the nonnegative part is again an ordered monoid. For an additive monoid morphism it proves how sign is preserved, reflected and embedded, both for monotone maps and for order-reversing ones, where each strict statement is the contrapositive of a non-strict one. It then shows that an ordered group is an ordered monoid ([[AffineConstructive.orders.groups.AdditiveGroupOrder_AdditiveMonoidOrder]]) and that negation is an order-reversing embedding ([[AffineConstructive.orders.groups.negate_order_embedding_flip]]). It ends with lemmas comparing x with −x according to its sign: those whose hypothesis is non-strict, and their contrapositives, need a strongly transitive order, while [[AffineConstructive.orders.groups.pos_between]], [[AffineConstructive.orders.groups.neg_between]] and their contrapositives need a linear, refutative order.","short":"Ordered additive monoids and groups: translations, negation, and sign under morphisms","items":[{"name":"AffineConstructive.orders.groups.nonneg_dual","base":"nonneg_dual","kind":"prf","start":6,"body":[7,9],"status":"ok","short":{"text":"In a weak poset with zero, the dual of x being nonnegative is x being negative","status":"ok"},"proof":[{"text":"Being in P⁺ means 0 ≤ x, and being in P₋ means x < 0. The claim is therefore the De Morgan duality between 0 ≤ x and x < 0, which [[AffineConstructive.orders.orders.le_dual]] provides.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.nonpos_dual","base":"nonpos_dual","kind":"prf","start":10,"body":[11,13],"status":"ok","short":{"text":"In a weak poset with zero, the dual of x being nonpositive is x being positive","status":"ok"},"proof":[{"text":"Being in P⁻ means x ≤ 0, and being in P₊ means 0 < x. The claim is therefore the De Morgan duality between x ≤ 0 and 0 < x, which [[AffineConstructive.orders.orders.le_dual]] provides.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.pos_dual","base":"pos_dual","kind":"prf","start":14,"body":[15,17],"status":"ok","short":{"text":"In a weak poset with zero, the dual of x being positive is x being nonpositive","status":"ok"},"proof":[{"text":"Being in P₊ means 0 < x, and being in P⁻ means x ≤ 0. The claim is therefore the De Morgan duality between 0 < x and x ≤ 0, which [[AffineConstructive.orders.orders.lt_dual]] provides.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.neg_dual","base":"neg_dual","kind":"prf","start":18,"body":[19,21],"status":"ok","short":{"text":"In a weak poset with zero, the dual of x being negative is x being nonnegative","status":"ok"},"proof":[{"text":"Being in P₋ means x < 0, and being in P⁺ means 0 ≤ x. The claim is therefore the De Morgan duality between x < 0 and 0 ≤ x, which [[AffineConstructive.orders.orders.lt_dual]] provides.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.plus_r_order_embedding","base":"plus_r_order_embedding","kind":"prf","start":26,"body":[27,29],"status":"ok","short":{"text":"In an ordered additive monoid, each right translation − + z is an order embedding","status":"ok"},"proof":[{"text":"An ordered monoid makes every left translation z + − an order embedding. Addition is commutative, so [[AffineConstructive.orders.maps.right_order_embedding_from_left]] carries this over to every right translation − + z.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.plus_order_preserving","base":"plus_order_preserving","kind":"prf","start":33,"body":[34,41],"status":"ok","short":{"text":"In an ordered additive monoid, addition is order preserving on pairs: x₁ ≤ x₂ and y₁ ≤ y₂ give x₁ + y₁ ≤ x₂ + y₂","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]], it suffices to show that a comparison of two pairs in the tensor product implies the same comparison of their sums.","status":"ok","from":0,"to":1},{"text":"Write the pairs as (x₁, y₁) and (x₂, y₂). On the tensor product the order is componentwise, so the hypothesis is x₁ ≤ x₂ ⊠ y₁ ≤ y₂.","status":"ok","from":2,"to":3},{"text":"Adding y₁ on the right turns the first factor into x₁ + y₁ ≤ x₂ + y₁. Adding x₂ on the left turns the second into x₂ + y₁ ≤ x₂ + y₂. Each translation preserves order ([[AffineConstructive.orders.maps.order_preserving_simp]]).","status":"ok","from":4,"to":5},{"text":"The two inequalities meet at x₂ + y₁, so the conclusion follows by transitivity.","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.orders.groups.compose_le","base":"compose_le","kind":"prf","start":43,"body":[44,51],"status":"ok","short":{"text":"In an ordered additive monoid, 0 ≤ z and y = x + z imply x ≤ y","status":"ok"},"proof":[{"text":"By transitivity through x + z, it suffices to prove x ≤ x + z ⊠ x + z ≤ y.","status":"ok","from":0,"to":1},{"text":"Each hypothesis is used for its own factor: 0 ≤ z for the first and the equality y = x + z for the second.","status":"ok","from":2,"to":2},{"text":"Adding x on the left preserves order, so 0 ≤ z gives x + 0 ≤ x + z ([[AffineConstructive.orders.maps.order_preserving_simp]]), and x + 0 simplifies to x.","status":"ok","from":3,"to":4},{"text":"The equality y = x + z gives x + z ≤ y by [[AffineConstructive.orders.orders.eq_le_flip]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.orders.groups.compose_lt","base":"compose_lt","kind":"prf","start":52,"body":[53,60],"status":"ok","short":{"text":"In an ordered additive monoid, 0 < z and y = x + z imply x < y","status":"ok"},"proof":[{"text":"Since a strict inequality followed by a weak one is strict ([[AffineConstructive.orders.orders.lt_le_trans]]), it suffices to prove x < x + z ⊠ x + z ≤ y.","status":"ok","from":0,"to":1},{"text":"Each hypothesis is used for its own factor: 0 < z for the first and the equality y = x + z for the second.","status":"ok","from":2,"to":2},{"text":"Adding x on the left preserves strict order, so 0 < z gives x + 0 < x + z ([[AffineConstructive.orders.maps.strictly_order_preserving_simp]]), and x + 0 simplifies to x.","status":"ok","from":3,"to":4},{"text":"The equality y = x + z gives x + z ≤ y by [[AffineConstructive.orders.orders.eq_le_flip]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.orders.groups.add_mon_order_plus_cancel","base":"add_mon_order_plus_cancel","kind":"def","start":61,"body":[62,73],"status":"ok","short":{"text":"An ordered additive monoid has additive cancellation","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.additive_groups.alt_Build_AdditiveCancellation]], it suffices that each left translation z + − is injective. Fix z, x and y; it remains to show that z + x = z + y implies x = y.","status":"ok","from":0,"to":2},{"text":"By antisymmetry, x = y follows from x ≤ y ∧ y ≤ x. The conjunction is additive, so each conjunct is proved separately from the same equality z + x = z + y.","status":"ok","from":3,"to":4},{"text":"Adding z on the left reflects order ([[AffineConstructive.orders.maps.order_reflecting_simp]]), so x ≤ y follows from z + x ≤ z + y, and that follows from the equality.","status":"ok","from":5,"to":7},{"text":"For y ≤ x, first turn the equality around to z + y = z + x. Then reflect z + y ≤ z + x through the same translation, and that inequality follows from the equality as before.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.orders.groups.add_mon_order_nonneg_sub_mon","base":"add_mon_order_nonneg_sub_mon","kind":"prf","start":74,"body":[75,84],"status":"ok","short":{"text":"The nonnegative elements of an ordered additive monoid form an additive submonoid","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.subrings.alt_Build_AdditiveSubMonoid]], it suffices that the nonnegative elements are closed under addition and contain 0.","status":"ok","from":0,"to":1},{"text":"For closure, fix x and y. Being nonnegative means being at least 0, so the goal is that 0 ≤ x and 0 ≤ y imply 0 ≤ x + y.","status":"ok","from":2,"to":4},{"text":"Adding x on the left is an order embedding ([[AffineConstructive.orders.maps.order_embedding_simp]]), so 0 ≤ y becomes x + 0 ≤ x + y, which is x ≤ x + y.","status":"ok","from":5,"to":5},{"text":"Now 0 ≤ x and x ≤ x + y give 0 ≤ x + y by transitivity.","status":"ok","from":6,"to":6},{"text":"For the zero, 0 ∊ M⁺ means 0 ≤ 0, which holds by reflexivity.","status":"ok","from":7,"to":9}]},{"name":"AffineConstructive.orders.groups.add_mon_order_nonneg_order","base":"add_mon_order_nonneg_order","kind":"prf","start":87,"body":[88,94],"status":"ok","short":{"text":"The nonnegative elements of an ordered additive monoid form an ordered additive monoid","status":"ok"},"proof":[{"text":"An ordered additive monoid structure on the nonnegative part M⁺ has several components. Resolution supplies the commutative monoid and the poset: M⁺ is an additive submonoid of M ([[AffineConstructive.orders.groups.add_mon_order_nonneg_sub_mon]]), and a subset of a poset is a poset. What remains is to show that each translation by an element z of M⁺ is an order embedding.","status":"ok","from":0,"to":1},{"text":"Fix z in M⁺. By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] it suffices to show that, for all x and y in M⁺, x ≤ y holds if and only if z + x ≤ z + y. Fix x and y.","status":"ok","from":2,"to":4},{"text":"The order and the addition of M⁺ are those of M. The equivalence is therefore the one for translation by z in M, applied to the underlying points of z, x and y, and [[AffineConstructive.interfaces.orders.order_embedding]] gives it.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.orders.groups.plus_lt_le_compat","base":"plus_lt_le_compat","kind":"prf","start":99,"body":[100,103],"status":"ok","short":{"text":"In an ordered additive monoid, x₁ < y₁ and x₂ ≤ y₂ imply x₁ + x₂ < y₁ + y₂","status":"ok"},"proof":[{"text":"Pass through the intermediate sum y₁ + x₂. Right translation by x₂ is an order embedding ([[AffineConstructive.orders.groups.plus_r_order_embedding]]), so it is strictly order preserving and x₁ < y₁ gives x₁ + x₂ < y₁ + x₂. Left translation by y₁ is order preserving, so x₂ ≤ y₂ gives y₁ + x₂ ≤ y₁ + y₂. Each factor of the hypothesis is rewritten separately.","status":"ok","from":0,"to":1},{"text":"The two comparisons combine by mixed transitivity ([[AffineConstructive.orders.orders.lt_le_trans]]): a strict inequality followed by a non-strict one is strict.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.plus_le_lt_compat","base":"plus_le_lt_compat","kind":"prf","start":104,"body":[105,108],"status":"ok","short":{"text":"In an ordered additive monoid, x₁ ≤ y₁ and x₂ < y₂ imply x₁ + x₂ < y₁ + y₂","status":"ok"},"proof":[{"text":"Pass through the intermediate sum y₁ + x₂. Right translation by x₂ is order preserving ([[AffineConstructive.orders.groups.plus_r_order_embedding]]), so x₁ ≤ y₁ gives x₁ + x₂ ≤ y₁ + x₂. Left translation by y₁ is strictly order preserving, so x₂ < y₂ gives y₁ + x₂ < y₁ + y₂.","status":"ok","from":0,"to":1},{"text":"The two comparisons combine by mixed transitivity ([[AffineConstructive.orders.orders.le_lt_trans]]): a non-strict inequality followed by a strict one is strict.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.preserves_nonneg","base":"preserves_nonneg","kind":"prf","start":114,"body":[115,118],"status":"ok","short":{"text":"An order-preserving monoid morphism sends nonnegative elements to nonnegative elements","status":"ok"},"proof":[{"text":"A monoid morphism sends 0 to 0 ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]), so 0 may be replaced by f 0 in the conclusion. The goal becomes: 0 ≤ x implies f 0 ≤ f x.","status":"ok","from":0,"to":1},{"text":"This is order preservation of f, applied to 0 and x.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.preserves_nonpos","base":"preserves_nonpos","kind":"prf","start":119,"body":[120,123],"status":"ok","short":{"text":"An order-preserving monoid morphism sends nonpositive elements to nonpositive elements","status":"ok"},"proof":[{"text":"Since f 0 = 0 ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]), 0 may be replaced by f 0 in the conclusion. The goal becomes: x ≤ 0 implies f x ≤ f 0.","status":"ok","from":0,"to":1},{"text":"This is order preservation of f, applied to x and 0.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.reflects_nonneg","base":"reflects_nonneg","kind":"prf","start":124,"body":[125,128],"status":"ok","short":{"text":"For an order-reflecting monoid morphism f, 0 ≤ f x implies 0 ≤ x","status":"ok"},"proof":[{"text":"Since f 0 = 0 ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]), 0 may be replaced by f 0 in the hypothesis. The goal becomes: f 0 ≤ f x implies 0 ≤ x.","status":"ok","from":0,"to":1},{"text":"This is order reflection for f, applied to 0 and x.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.reflects_nonpos","base":"reflects_nonpos","kind":"prf","start":129,"body":[130,133],"status":"ok","short":{"text":"For an order-reflecting monoid morphism f, f x ≤ 0 implies x ≤ 0","status":"ok"},"proof":[{"text":"Since f 0 = 0 ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]), 0 may be replaced by f 0 in the hypothesis. The goal becomes: f x ≤ f 0 implies x ≤ 0.","status":"ok","from":0,"to":1},{"text":"This is order reflection for f, applied to x and 0.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.embeds_nonneg","base":"embeds_nonneg","kind":"prf","start":134,"body":[135,137],"status":"ok","short":{"text":"For a monoid morphism f that is an order embedding, 0 ≤ x if and only if 0 ≤ f x","status":"ok"},"proof":[{"text":"An order embedding both preserves and reflects the order. The forward direction is [[AffineConstructive.orders.groups.preserves_nonneg]] and the backward direction is [[AffineConstructive.orders.groups.reflects_nonneg]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.embeds_nonpos","base":"embeds_nonpos","kind":"prf","start":138,"body":[139,141],"status":"ok","short":{"text":"For a monoid morphism f that is an order embedding, x ≤ 0 if and only if f x ≤ 0","status":"ok"},"proof":[{"text":"An order embedding both preserves and reflects the order. The forward direction is [[AffineConstructive.orders.groups.preserves_nonpos]] and the backward direction is [[AffineConstructive.orders.groups.reflects_nonpos]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.reflects_pos","base":"reflects_pos","kind":"prf","start":142,"body":[143,145],"status":"ok","short":{"text":"For an order-preserving monoid morphism f, 0 < f x implies 0 < x","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.preserves_nonpos]] at x. That lemma says x ≤ 0 implies f x ≤ 0. The dual of a non-strict inequality is the reversed strict one, so the dual statement says 0 < f x implies 0 < x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.reflects_neg","base":"reflects_neg","kind":"prf","start":146,"body":[147,149],"status":"ok","short":{"text":"For an order-preserving monoid morphism f, f x < 0 implies x < 0","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.preserves_nonneg]]: 0 ≤ x implies 0 ≤ f x, and the dual of x ≤ y is y < x, so the dual implication sends f x < 0 to x < 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.preserves_pos","base":"preserves_pos","kind":"prf","start":150,"body":[151,153],"status":"ok","short":{"text":"An order-reflecting monoid morphism sends positive elements to positive elements","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.reflects_nonpos]]: f x ≤ 0 implies x ≤ 0, and since the dual of a non-strict inequality is the reversed strict one, the dual implication sends 0 < x to 0 < f x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.preserves_neg","base":"preserves_neg","kind":"prf","start":154,"body":[155,157],"status":"ok","short":{"text":"An order-reflecting monoid morphism sends negative elements to negative elements","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.reflects_nonneg]]: 0 ≤ f x implies 0 ≤ x, and dualising both sides turns this into x < 0 implying f x < 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.embeds_pos","base":"embeds_pos","kind":"prf","start":158,"body":[159,161],"status":"ok","short":{"text":"For a monoid morphism f that is an order embedding, 0 < x if and only if 0 < f x","status":"ok"},"proof":[{"text":"Dualise both sides of the equivalence [[AffineConstructive.orders.groups.embeds_nonpos]], x ≤ 0 if and only if f x ≤ 0. The dual of x ≤ 0 is 0 < x, so the result is 0 < x if and only if 0 < f x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.embeds_neg","base":"embeds_neg","kind":"prf","start":162,"body":[163,165],"status":"ok","short":{"text":"For a monoid morphism f that is an order embedding, x < 0 if and only if f x < 0","status":"ok"},"proof":[{"text":"Dualise both sides of the equivalence [[AffineConstructive.orders.groups.embeds_nonneg]], 0 ≤ x if and only if 0 ≤ f x. The dual of 0 ≤ x is x < 0, so the result is x < 0 if and only if f x < 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.preserves_nonneg_flip","base":"preserves_nonneg_flip","kind":"prf","start":171,"body":[172,175],"status":"ok","short":{"text":"An order-reversing monoid morphism sends nonnegative elements to nonpositive elements","status":"ok"},"proof":[{"text":"Since f is a monoid morphism, f 0 = 0. Writing the 0 on the right as f 0, the goal becomes f x ≤ f 0.","status":"ok","from":0,"to":1},{"text":"An order-reversing map sends 0 ≤ x to f x ≤ f 0, which is [[AffineConstructive.interfaces.orders.order_preserving_flip]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.preserves_nonpos_flip","base":"preserves_nonpos_flip","kind":"prf","start":176,"body":[177,180],"status":"ok","short":{"text":"An order-reversing monoid morphism sends nonpositive elements to nonnegative elements","status":"ok"},"proof":[{"text":"Since f is a monoid morphism, f 0 = 0. Writing the 0 on the left as f 0, the goal becomes f 0 ≤ f x.","status":"ok","from":0,"to":1},{"text":"An order-reversing map sends x ≤ 0 to f 0 ≤ f x, which is [[AffineConstructive.interfaces.orders.order_preserving_flip]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.reflects_nonneg_flip","base":"reflects_nonneg_flip","kind":"prf","start":181,"body":[182,185],"status":"ok","short":{"text":"For a monoid morphism f reflecting the order in reverse, 0 ≤ f x implies x ≤ 0","status":"ok"},"proof":[{"text":"Since f is a monoid morphism, f 0 = 0. Writing the hypothesis's 0 as f 0, the hypothesis becomes f 0 ≤ f x.","status":"ok","from":0,"to":1},{"text":"A map that reflects the order in reverse turns f 0 ≤ f x into x ≤ 0, which is [[AffineConstructive.interfaces.orders.order_reflecting_flip]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.reflects_nonpos_flip","base":"reflects_nonpos_flip","kind":"prf","start":186,"body":[187,190],"status":"ok","short":{"text":"For a monoid morphism f reflecting the order in reverse, f x ≤ 0 implies 0 ≤ x","status":"ok"},"proof":[{"text":"Since f is a monoid morphism, f 0 = 0. Writing the hypothesis's 0 as f 0, the hypothesis becomes f x ≤ f 0.","status":"ok","from":0,"to":1},{"text":"A map that reflects the order in reverse turns f x ≤ f 0 into 0 ≤ x, which is [[AffineConstructive.interfaces.orders.order_reflecting_flip]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.groups.embeds_nonneg_flip","base":"embeds_nonneg_flip","kind":"prf","start":191,"body":[192,194],"status":"ok","short":{"text":"For a monoid morphism f that is an order-reversing embedding, 0 ≤ x if and only if f x ≤ 0","status":"ok"},"proof":[{"text":"An order-reversing embedding both reverses and reflects the order in reverse. The forward direction is therefore [[AffineConstructive.orders.groups.preserves_nonneg_flip]], and the backward direction is [[AffineConstructive.orders.groups.reflects_nonpos_flip]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.embeds_nonpos_flip","base":"embeds_nonpos_flip","kind":"prf","start":195,"body":[196,198],"status":"ok","short":{"text":"For a monoid morphism f that is an order-reversing embedding, x ≤ 0 if and only if 0 ≤ f x","status":"ok"},"proof":[{"text":"The two directions are separate lemmas. Since an order-reversing embedding is order-reversing, f sends x ≤ 0 to 0 ≤ f x by [[AffineConstructive.orders.groups.preserves_nonpos_flip]]. Since it also reflects the order in reverse, 0 ≤ f x gives back x ≤ 0 by [[AffineConstructive.orders.groups.reflects_nonneg_flip]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.reflects_pos_flip","base":"reflects_pos_flip","kind":"prf","start":199,"body":[200,202],"status":"ok","short":{"text":"For an order-reversing monoid morphism f, 0 < f x implies x < 0","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.preserves_nonneg_flip]], which says that 0 ≤ x implies f x ≤ 0. The dual of a non-strict inequality is the reversed strict one, so the dual of f x ≤ 0 is 0 < f x and the dual of 0 ≤ x is x < 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.reflects_neg_flip","base":"reflects_neg_flip","kind":"prf","start":203,"body":[204,206],"status":"ok","short":{"text":"For an order-reversing monoid morphism f, f x < 0 implies 0 < x","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.preserves_nonpos_flip]], which says that x ≤ 0 implies 0 ≤ f x. Dualising each side turns 0 ≤ f x into f x < 0 and x ≤ 0 into 0 < x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.preserves_pos_flip","base":"preserves_pos_flip","kind":"prf","start":207,"body":[208,210],"status":"ok","short":{"text":"A monoid morphism reflecting the order in reverse sends positive elements to negative elements","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.reflects_nonneg_flip]], which says that 0 ≤ f x implies x ≤ 0. The dual of x ≤ 0 is 0 < x and the dual of 0 ≤ f x is f x < 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.preserves_neg_flip","base":"preserves_neg_flip","kind":"prf","start":211,"body":[212,214],"status":"ok","short":{"text":"A monoid morphism reflecting the order in reverse sends negative elements to positive elements","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.reflects_nonpos_flip]], which says that f x ≤ 0 implies 0 ≤ x. The dual of 0 ≤ x is x < 0 and the dual of f x ≤ 0 is 0 < f x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.embeds_pos_flip","base":"embeds_pos_flip","kind":"prf","start":215,"body":[216,218],"status":"ok","short":{"text":"For a monoid morphism f that is an order-reversing embedding, 0 < x if and only if f x < 0","status":"ok"},"proof":[{"text":"Take the equivalence x ≤ 0 ⧟ 0 ≤ f x of [[AffineConstructive.orders.groups.embeds_nonpos_flip]] and dualise both sides with [[AffineConstructive.logic.aprop.contrapositive_iff]]. Each non-strict inequality becomes the reversed strict one, which gives 0 < x ⧟ f x < 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.embeds_neg_flip","base":"embeds_neg_flip","kind":"prf","start":219,"body":[220,222],"status":"ok","short":{"text":"For a monoid morphism f that is an order-reversing embedding, x < 0 if and only if 0 < f x","status":"ok"},"proof":[{"text":"Take the equivalence 0 ≤ x ⧟ f x ≤ 0 of [[AffineConstructive.orders.groups.embeds_nonneg_flip]] and dualise both sides with [[AffineConstructive.logic.aprop.contrapositive_iff]]. This gives x < 0 ⧟ 0 < f x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.AdditiveGroupOrder_AdditiveMonoidOrder","base":"AdditiveGroupOrder_AdditiveMonoidOrder","kind":"def","start":224,"body":[225,235],"status":"ok","short":{"text":"An ordered additive group is an ordered additive monoid: its translations are order embeddings","status":"ok"},"proof":[{"text":"The algebraic part of an ordered monoid comes from the group structure, since an abelian group is a commutative monoid. What remains is that every translation z + (·) is an order embedding.","status":"ok","from":0,"to":1},{"text":"Fix z. By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] it suffices to show that x ≤ y if and only if z + x ≤ z + y, for all x and y. This splits into the two implications.","status":"ok","from":2,"to":4},{"text":"The forward implication holds because, in an ordered group, translations preserve the order.","status":"ok","from":5,"to":6},{"text":"For the converse, translate by −z, which also preserves the order. This takes z + x ≤ z + y to −z + (z + x) ≤ −z + (z + y), and these sums simplify to x and y ([[AffineConstructive.orders.maps.order_preserving_simp]]).","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.orders.groups.negate_order_embedding_flip","base":"negate_order_embedding_flip","kind":"prf","start":236,"body":[237,242],"status":"ok","short":{"text":"In an ordered additive group, negation is an order-reversing embedding","status":"ok"},"proof":[{"text":"Negation is an involution, so by [[AffineConstructive.orders.maps.involutive_order_embedding_flip]] it suffices to show that negation reverses the order.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip]] this means that x ≤ y implies −y ≤ −x. Fix x and y.","status":"ok","from":2,"to":3},{"text":"Translate by −x − y, which preserves the order. Then x ≤ y gives −x − y + x ≤ −x − y + y, and in an abelian group the two sides simplify to −y and −x ([[AffineConstructive.orders.maps.order_preserving_simp]]).","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.groups.nonneg_between","base":"nonneg_between","kind":"prf","start":246,"body":[247,251],"status":"ok","short":{"text":"In an ordered additive group with strongly transitive order, 0 ≤ x implies −x ≤ x","status":"ok"},"proof":[{"text":"The order is strongly transitive, so −x ≤ x follows from the additive conjunction of −x ≤ 0 and 0 ≤ x ([[AffineConstructive.interfaces.aprop.strong_transitivity]]). It therefore suffices to derive this conjunction from 0 ≤ x.","status":"ok","from":0,"to":1},{"text":"Negation is an order-reversing monoid morphism. So, by [[AffineConstructive.orders.groups.preserves_nonneg_flip]], the conjunct −x ≤ 0 follows from 0 ≤ x.","status":"ok","from":2,"to":2},{"text":"Both conjuncts are now the hypothesis 0 ≤ x. Because the conjunction is additive, proving it uses the hypothesis only once, so it follows from a single copy of 0 ≤ x. This is why the lemma needs strong transitivity: ordinary transitivity would ask for the tensor of the two conjuncts, which would use the hypothesis twice.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.groups.nonpos_between","base":"nonpos_between","kind":"prf","start":252,"body":[253,257],"status":"ok","short":{"text":"In an ordered group with strongly transitive order, x ≤ 0 implies x ≤ −x","status":"ok"},"proof":[{"text":"Pass through 0 by strong transitivity: x ≤ −x follows from x ≤ 0 ∧ 0 ≤ −x. Because the conjunction is additive, each conjunct is proved from the whole hypothesis x ≤ 0, so the hypothesis is not consumed by either one.","status":"ok","from":0,"to":1},{"text":"Negation reverses the order, so it sends the nonpositive x to a nonnegative −x ([[AffineConstructive.orders.groups.preserves_nonpos_flip]] applied to negation, which is an order-reversing embedding by [[AffineConstructive.orders.groups.negate_order_embedding_flip]]). Both conjuncts now read x ≤ 0, and each is the hypothesis itself.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.groups.between_neg","base":"between_neg","kind":"prf","start":258,"body":[259,261],"status":"ok","short":{"text":"In an ordered group with strongly transitive order, x < −x implies x < 0","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.nonneg_between]]: its dual turns 0 ≤ x ⊸ −x ≤ x into x < −x ⊸ x < 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.between_pos","base":"between_pos","kind":"prf","start":262,"body":[263,265],"status":"ok","short":{"text":"In an ordered group with strongly transitive order, −x < x implies 0 < x","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.nonpos_between]]: its dual turns x ≤ 0 ⊸ x ≤ −x into −x < x ⊸ 0 < x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.pos_between","base":"pos_between","kind":"prf","start":266,"body":[267,271],"status":"ok","short":{"text":"In an ordered group with linear, refutative order, 0 < x implies −x < x","status":"ok"},"proof":[{"text":"In a refutative order the strict order is affirmative, so a base-logic implication is enough to give the affine one ([[AffineConstructive.logic.aprop.affirmative_aimpl]]). Assume 0 < x as an ordinary hypothesis, which may then be used as often as needed, and show −x < x.","status":"ok","from":0,"to":1},{"text":"By transitivity of < through 0 it suffices to show −x < 0 ⊠ 0 < x. The second factor is the hypothesis. The first holds because negation reverses the order and so sends the positive x to a negative −x ([[AffineConstructive.orders.groups.preserves_pos_flip]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.groups.neg_between","base":"neg_between","kind":"prf","start":272,"body":[273,277],"status":"ok","short":{"text":"In an ordered group with linear, refutative order, x < 0 implies x < −x","status":"ok"},"proof":[{"text":"In a refutative order the strict order is affirmative, so a base-logic implication is enough to give the affine one ([[AffineConstructive.logic.aprop.affirmative_aimpl]]). Assume x < 0 as an ordinary hypothesis, which may then be used as often as needed, and show x < −x.","status":"ok","from":0,"to":1},{"text":"By transitivity of < through 0 it suffices to show x < 0 ⊠ 0 < −x. The first factor is the hypothesis. The second holds because negation reverses the order and so sends the negative x to a positive −x ([[AffineConstructive.orders.groups.preserves_neg_flip]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.groups.between_nonneg","base":"between_nonneg","kind":"prf","start":278,"body":[279,281],"status":"ok","short":{"text":"In an ordered group with linear, refutative order, −x ≤ x implies 0 ≤ x","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.neg_between]]: its dual turns x < 0 ⊸ x < −x into −x ≤ x ⊸ 0 ≤ x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.groups.between_nonpos","base":"between_nonpos","kind":"prf","start":282,"body":[283,285],"status":"ok","short":{"text":"In an ordered group with linear, refutative order, x ≤ −x implies x ≤ 0","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.orders.groups.pos_between]]: its dual turns 0 < x ⊸ −x < x into x ≤ −x ⊸ x ≤ 0.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.ring_order":{"page":"../interfaces/ring_order.html","short":"Cones of a poset with zero; ordered monoids, groups, rigs and rings","summary":"The file defines the cones of a weak poset with a zero: the subsets of nonzero, nonnegative (R⁺), nonpositive (R⁻), positive (R₊) and negative (R₋) elements, as affine subsets, so that each carries its refutation. It then defines the interfaces for ordered algebra. An ordered additive monoid is a poset and additive monoid in which every left translation z + _ is an order embedding: it both preserves and reflects the order. An ordered additive group asks only that every left translation preserve the order. A strong linear refutative rig order is a rig with a strongly transitive, pseudo-total, refutative partial order that is an ordered additive monoid, with the axiom that b < a and d < c imply a·d + b·c < a·c + b·d. This is positivity of (a − b)(c − d) stated without subtraction. The ring version, with an ordered additive group, asks instead that a product of positive elements be positive. Hints let resolution find that left addition preserves, reflects or embeds the order. The theory of these structures is developed in orders.groups and orders.rings."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.suborders":{"page":"suborders.html","short":"Subsets of an ordered set inherit its order structures; the inclusion is an order embedding","summary":"A subset U of X, regarded as a set ([[subset_to_set]]), carries the order of X restricted to its members, and this file shows that every order structure on X passes to U: preorder, weak poset, poset, strong poset, total and linear order, and the strong transitivity, decidability, affirmativity and refutativity of the order. Each proof restates the required law at the order of X and applies the corresponding law there, since a comparison of members of U is the same proposition as the comparison of the underlying points. The file ends by showing that the inclusion [[from_subset]] is an order embedding, so it both preserves and reflects the order. All of these are registered for instance resolution, so any subset of an ordered set is ordered without further declaration."},"AffineConstructive.theory.additive_groups":{"page":"../theory/additive_groups.html","short":"Groups, monoids and their morphisms in additive notation","summary":"This file restates the generic group theory of theory/groups.v in the additive notation that rings use. To do so it views a set with +, 0 and − as a group through [[AdditiveGroupOps]]. It gives constructors for the additive semigroup, monoid and group structures, commutative or not, and the coercions among them. It also restates the basic laws under additive names: associativity, commutativity, the identity and inverse laws, the involution and distributivity of negation, [[negate_0]], [[equal_by_zero_sum]] and [[flip_negate]]. For additive semigroup and monoid morphisms it gives preservation of addition, negation and subtraction, together with identities, composites and inverses. [[Build_AdditiveGroup_Morphism]] shows that a map between groups that preserves addition is a monoid morphism. The file closes with simplification rules that cancel zeros and inverses, transport of structure along injections, and the quotation rules for + and −."},"AffineConstructive.theory.subrings":{"page":"../theory/subrings.html","short":"Subrings and sub-near-rings: builders, induced structure, images, preimages, zero-symmetric part","summary":"This file carries the substructure theory of `theory/subgroups.v` over to ring-like structures. It first restates the subsemigroup, submonoid and subgroup results in additive and multiplicative form (builders from closure conditions, the full subset, the induced operations, the inclusion as a morphism, images and preimages), then treats the sub-near-rg, sub-near-rig, sub-near-rng and sub-near-ring predicates: their builders from closure under +, · and −, invariance under equality of subsets, the induced near-ring, ring and commutative ring structures on a substructure, the inclusion as an rg or rig morphism, and the stability of these substructures under images and preimages. It closes with the zero-symmetric part N₀ = { n | n · 0 = 0 } of a right near-ring, shown to be a substructure of whichever kind N is. The results are instances found by resolution, so a subset closed under the ring operations is a ring wherever one is needed."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

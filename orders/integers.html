ite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10379,"e":10396,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":10400,"e":10403,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10429,"e":10432,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10433,"e":10441,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":10458,"e":10461,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10465,"e":10473,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":10519,"e":10522,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10527,"e":10544,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":10548,"e":10556,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":10564,"e":10567,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":10569,"e":10572,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10621,"e":10624,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10708,"e":10711,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10716,"e":10733,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":10737,"e":10745,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":10760,"e":10763,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10764,"e":10767,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11006,"e":11009,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11010,"e":11013,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11019,"e":11022,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11023,"e":11026,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11082,"e":11085,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11086,"e":11089,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11095,"e":11098,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11132,"e":11135,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11136,"e":11139,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12231,"e":12234,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12398,"e":12401,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file develops the order theory of the integers from the order of the naturals, treating the integers as the group completion of the naturals. In an ordered model of the integers, x ≤ y holds if and only if there is a natural z with y = x + z ([[AffineConstructive.orders.integers.integers_le_plus_nat]]). The order relates to successor by x ≤ y ⧟ x < 1 + y and x < y ⧟ 1 + x ≤ y. Every rig morphism into a ring with a strong linear refutative order, in which 1 ≠ 0, is an order embedding ([[AffineConstructive.orders.integers.integers_to_ring_ord_embedding]]). In the other direction, an order given by the additive characterisation makes any model of the integers ordered ([[AffineConstructive.orders.integers.alt_Build_OrderedIntegers]]). This gives the default order [[AffineConstructive.orders.integers.integers_le]], and the integers are a strong, total and decidable poset. The file then builds an absolute value into the naturals, [[AffineConstructive.orders.integers.integers_abs_slow]], and uses it to show that the nonnegative integers form a model of the naturals ([[AffineConstructive.orders.integers.nonneg_int_naturals]]). The file parallels the treatment of the naturals in orders/naturals.v and relies on the general results on ordered group completions.","short":"The order on the integers, its additive characterisation, absolute value, nonnegative cone as naturals","items":[{"name":"AffineConstructive.orders.integers.integers_le_plus_1","base":"integers_le_plus_1","kind":"prf","start":13,"body":[14,24],"status":"ok","short":{"text":"For integers, x ≤ y if and only if x < 1 + y","status":"ok"},"proof":[{"text":"The integers are the group completion of the naturals, so by [[AffineConstructive.theory.group_completion.group_completion_decompose]] x is ϕ₁ a − ϕ₁ b and y is ϕ₁ c − ϕ₁ d for naturals a, b, c, d. Substituting these differences turns the claim into a statement about four naturals.","status":"ok","from":0,"to":2},{"text":"Reassociate 1 + (ϕ₁ c − ϕ₁ d) so that both sides compare two differences. Then move the subtracted terms across, by [[AffineConstructive.orders.rings.minus_le_swap]] for the order and [[AffineConstructive.orders.rings.minus_lt_swap]] for the strict order. What remains compares ϕ₁ a + ϕ₁ d with ϕ₁ c + ϕ₁ b, and with 1 + ϕ₁ c + ϕ₁ b.","status":"ok","from":3,"to":4},{"text":"Since ϕ₁ preserves 1 and addition, each side is ϕ₁ of a natural number. The canonical map from the naturals is an order embedding ([[AffineConstructive.orders.naturals.naturals_to_rig_ord_embedding]]), so it reflects the order, and it reflects the strict order too ([[AffineConstructive.orders.maps.strictly_order_embedding]]). The statement is now one about naturals: a + d ≤ c + b if and only if a + d < 1 + c + b.","status":"ok","from":5,"to":7},{"text":"After reassociating, this is the same law for the naturals, [[AffineConstructive.orders.naturals.naturals_le_plus_1]], applied to a + d and c + b.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.orders.integers.integers_lt_plus_1","base":"integers_lt_plus_1","kind":"prf","start":25,"body":[26,28],"status":"ok","short":{"text":"For integers, x < y if and only if 1 + x ≤ y","status":"ok"},"proof":[{"text":"Take the previous lemma [[AffineConstructive.orders.integers.integers_le_plus_1]] at y and x, which says y ≤ x if and only if y < 1 + x, and pass to the duals of both sides ([[AffineConstructive.logic.aprop.contrapositive_iff]]). The dual of y ≤ x is x < y and the dual of y < 1 + x is 1 + x ≤ y, which is the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.integers.integers_to_ring_ord_embedding","base":"integers_to_ring_ord_embedding","kind":"prf","start":32,"body":[33,43],"status":"ok","short":{"text":"A rig morphism from the integers into a strong linear refutative ordered ring with 1 ≠ 0 is an order embedding","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] it is enough to show that f reflects and preserves the order, that is, x ≤ y if and only if f x ≤ f y. Fix x and y.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.theory.group_completion.group_completion_decompose]], write x as ϕ₁ a − ϕ₁ b and y as ϕ₁ c − ϕ₁ d for naturals a, b, c, d.","status":"ok","from":3,"to":4},{"text":"Since f preserves addition and negation, f of each difference is a difference in R. On both sides, move the subtracted terms across by [[AffineConstructive.orders.rings.minus_le_swap]], in Z and in R. Both sides then compare a sum of images of a and d with a sum of images of c and b.","status":"ok","from":5,"to":6},{"text":"The composite f ∘ ϕ₁ is a rig morphism from the naturals to R. The naturals are initial, so this composite is the canonical map ϕ₂ into R. The right-hand side becomes ϕ₂ a + ϕ₂ d ≤ ϕ₂ c + ϕ₂ b.","status":"ok","from":7,"to":7},{"text":"Gather each sum inside ϕ₁ and inside ϕ₂. Both ϕ₁ and ϕ₂ are rig morphisms from the naturals into strong linear refutative ordered rings with 1 ≠ 0, so both are order embeddings ([[AffineConstructive.orders.naturals.naturals_to_rig_ord_embedding]]). Each side is therefore equivalent to a + d ≤ c + b, which proves the claim.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.orders.integers.integers_le_plus_aux.let:inst","base":"let:inst","kind":"let","start":53,"body":[54,56],"status":"ok","short":{"text":"The canonical map from the naturals into the integers is injective, by [[AffineConstructive.theory.integers.naturals_to_integers_inj]], held as a hypothesis","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.theory.integers.naturals_to_integers_inj]]: the canonical map from the naturals into the integers is injective. Restating it here makes it a hypothesis of the section, so instance resolution can find it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.integers.integers_le_plus_aux","base":"integers_le_plus_aux","kind":"prf","start":57,"body":[58,70],"status":"ok","short":{"text":"If x = ϕ a − ϕ b and y = ϕ c − ϕ d, then a + d ≤ c + b if and only if there is z with y = x + ϕ z","status":"ok"},"proof":[{"text":"Assume x = ϕ a − ϕ b and y = ϕ c − ϕ d.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.naturals.naturals_le_plus]], a + d ≤ c + b says that there is a natural z with c + b = a + d + z. Both sides are now existentials over z, so it is enough to show that their bodies are equivalent for each z ([[AffineConstructive.logic.aprop.aex_aiff]]). Fix z.","status":"ok","from":2,"to":4},{"text":"Substitute the two differences for x and y. Rearranging gives the equation ϕ c − ϕ d = ϕ a + ϕ z − ϕ b in Z.","status":"ok","from":5,"to":6},{"text":"Adding ϕ b + ϕ d to both sides is injective, so the equation is equivalent to the one obtained after adding it ([[AffineConstructive.theory.set.injective_iff_simp]]). Simplifying cancels the negated terms and leaves ϕ c + ϕ b = ϕ a + ϕ d + ϕ z.","status":"ok","from":7,"to":9},{"text":"Since ϕ preserves addition, this equation says ϕ (c + b) = ϕ (a + d + z). Because ϕ is injective, this holds exactly when c + b = a + d + z ([[AffineConstructive.theory.set.injective_iff]]).","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.orders.integers.integers_le_plus_nat","base":"integers_le_plus_nat","kind":"prf","start":77,"body":[78,84],"status":"ok","short":{"text":"For integers, x ≤ y if and only if there is a natural z with y = x + z","status":"ok"},"proof":[{"text":"Fix x and y. By [[AffineConstructive.theory.group_completion.group_completion_decompose]], write x = ϕ a − ϕ b and y = ϕ c − ϕ d with naturals a, b, c, d.","status":"ok","from":0,"to":3},{"text":"In the ordered group completion, the order on such differences is computed in the naturals ([[AffineConstructive.theory.group_completion.group_completion_order_le]]). So x ≤ y becomes a + d ≤ c + b.","status":"ok","from":4,"to":4},{"text":"Given the two decompositions, a + d ≤ c + b is equivalent to the existence of a natural z with y = x + ϕ z, by [[AffineConstructive.orders.integers.integers_le_plus_aux]].","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.orders.integers.integers_le_plus_nat_alt","base":"integers_le_plus_nat_alt","kind":"prf","start":86,"body":[87,90],"status":"ok","short":{"text":"For integers and any rig morphism f from the naturals, x ≤ y if and only if there is z with y = x + f z","status":"ok"},"proof":[{"text":"The naturals are initial among rigs, so the rig morphism f agrees with the canonical map ϕ. Replacing f by ϕ inside the existential gives the original statement.","status":"ok","from":0,"to":1},{"text":"That statement is [[AffineConstructive.orders.integers.integers_le_plus_nat]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.integers.props2.let:le_correct","base":"let:le_correct","kind":"let","start":98,"body":[99,104],"status":"ok","short":{"text":"For x = ϕ a − ϕ b and y = ϕ c − ϕ d, x ≤ y if and only if a + d ≤ c + b, from le_plus by [[AffineConstructive.orders.integers.integers_le_plus_aux]]","status":"ok"},"proof":[{"text":"Fix integers x and y, naturals a, b, c, d, and the presentations x = ϕ a − ϕ b and y = ϕ c − ϕ d.","status":"ok","from":0,"to":1},{"text":"By the hypothesis on the order of the integers, x ≤ y holds exactly when there is a natural z with y = x + ϕ z. Rewriting by this, and turning the equivalence around, leaves to show that a + d ≤ c + b if and only if there is such a z.","status":"ok","from":2,"to":3},{"text":"Given the two presentations, this is [[AffineConstructive.orders.integers.integers_le_plus_aux]].","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.integers.AdditiveGroupOrder_instance_0","base":"AdditiveGroupOrder_instance_0","kind":"inst","start":105,"body":[106,108],"status":"ok","short":{"text":"An order on the integers with x ≤ y iff there is a natural z with y = x + z is an ordered group","status":"ok"},"proof":[{"text":"The integers are the group completion of the naturals under ϕ. The order reads ϕ a − ϕ b ≤ ϕ c − ϕ d as a + d ≤ c + b, so [[AffineConstructive.theory.group_completion.group_completion_add_grp_order]] makes it an ordered group.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.integers.OrderEmbedding_instance_0","base":"OrderEmbedding_instance_0","kind":"inst","start":109,"body":[110,112],"status":"ok","short":{"text":"Under the order x ≤ y iff y = x + z for a natural z, the naturals embed order-wise into the integers","status":"ok"},"proof":[{"text":"The order on the integers reads ϕ a − ϕ b ≤ ϕ c − ϕ d as a + d ≤ c + b. Under such an order, the map from the naturals into their group completion is an order embedding ([[AffineConstructive.theory.group_completion.to_group_completion_order_embedding]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.integers.alt_Build_OrderedIntegers","base":"alt_Build_OrderedIntegers","kind":"prf","start":113,"body":[114,117],"status":"ok","short":{"text":"Builds ordered integers from an order on Z with x ≤ y if and only if y = x + z for some natural z","status":"ok"},"proof":[{"text":"Ordered integers are integers together with an order that makes them a strong linear refutative ordered ring. The integer structure is already given, so only the ring order remains to be shown.","status":"ok","from":0,"to":1},{"text":"The integers are ordered as a group by [[AffineConstructive.orders.integers.AdditiveGroupOrder_instance_0]], and ϕ is an order embedding by [[AffineConstructive.orders.integers.OrderEmbedding_instance_0]]. With both in place, [[AffineConstructive.theory.group_completion.group_completion_ring_order]] makes the group completion of the ordered naturals a strong linear refutative ordered ring.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.integers.ℕ","base":"ℕ","kind":"abbrev","start":122,"body":null,"status":"ok","short":{"text":"Local name for Nat, the development's model of the naturals","status":"ok"},"long":{"text":"A local name for `Nat`, the development's model of the naturals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.integers_strong_poset","base":"integers_strong_poset","kind":"def","start":124,"body":null,"status":"ok","short":{"text":"The order of ordered integers is a strong poset","status":"ok"},"long":{"text":"The strong-poset structure of the order on ordered integers, obtained from that of the naturals by [[AffineConstructive.theory.group_completion.group_completion_strong_poset]] along the canonical map from `Nat`: the order of a group completion inherits strong transitivity from the monoid it completes. It is declared a coercion, so every instance of [[AffineConstructive.interfaces.integers.OrderedIntegers]] is a [[AffineConstructive.interfaces.orders.StrongPoset]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.integers_total_order","base":"integers_total_order","kind":"def","start":125,"body":null,"status":"ok","short":{"text":"The order of ordered integers is total","status":"ok"},"long":{"text":"The totality of the order on ordered integers: for all x and y, x ≤ y or y ≤ x, with the additive or. It is obtained from the totality of the order of the naturals by [[AffineConstructive.theory.group_completion.group_completion_total_order]], applied to the canonical map from `Nat`, since the integers are the group completion of the naturals. It is declared a coercion, so every instance of [[AffineConstructive.interfaces.integers.OrderedIntegers]] is a [[AffineConstructive.interfaces.orders.TotalOrder]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.integers_decidable_order","base":"integers_decidable_order","kind":"def","start":126,"body":null,"status":"ok","short":{"text":"The order of ordered integers is decidable","status":"ok"},"long":{"text":"The decidability of each comparison x ≤ y of the ordered integers, obtained from that of the naturals by [[AffineConstructive.theory.group_completion.group_completion_decidable_order]] along the canonical map from `Nat`. It is declared a coercion, so every instance of [[AffineConstructive.interfaces.integers.OrderedIntegers]] is a [[AffineConstructive.interfaces.orders.DecidableOrder]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.coercion:integers_strong_poset","base":"coercion:integers_strong_poset","kind":"coercion","start":128,"body":null,"status":"ok","short":{"text":"Ordered integers are a strong poset, through [[AffineConstructive.orders.integers.integers_strong_poset]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.coercion:integers_total_order","base":"coercion:integers_total_order","kind":"coercion","start":129,"body":null,"status":"ok","short":{"text":"The order of ordered integers is total, through [[AffineConstructive.orders.integers.integers_total_order]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.coercion:integers_decidable_order","base":"coercion:integers_decidable_order","kind":"coercion","start":130,"body":null,"status":"ok","short":{"text":"The order of ordered integers is decidable, through [[AffineConstructive.orders.integers.integers_decidable_order]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.integers_le","base":"integers_le","kind":"def","start":131,"body":null,"status":"ok","short":{"text":"The default order on the integers: x ≤ y when y = x + z for some natural z","status":"ok"},"long":{"text":"The order on a set Z with +, 0 and 1 defined by x ≤ y when there is a natural z with y = x + z, the natural taken into Z by the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]]. The existential is the affine one, ∐, so the definition gives at once the order and its dual. It needs only the additive structure and the one; on a model of the integers [[AffineConstructive.orders.integers.integers_le_order]] shows that it makes Z ordered integers, and resolution takes it as the order of any model of the integers that has not been given one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.integers_le_correct","base":"integers_le_correct","kind":"prf","start":134,"body":[135,137],"status":"ok","short":{"text":"Under the default order, x ≤ y if and only if y = x + z for some natural z","status":"ok"},"proof":[{"text":"Fix x and y. The default order [[AffineConstructive.orders.integers.integers_le]] is defined as the existence of a natural z with y = x + z, so the two sides agree by definition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.integers.integers_le_order","base":"integers_le_order","kind":"def","start":138,"body":null,"status":"ok","short":{"text":"Any model of the integers with its default order is ordered integers","status":"ok"},"long":{"text":"The instance of [[AffineConstructive.interfaces.integers.OrderedIntegers]] on a model Z of the integers ordered by [[AffineConstructive.orders.integers.integers_le]]: since that order satisfies its characterisation [[AffineConstructive.orders.integers.integers_le_correct]] by definition, [[AffineConstructive.orders.integers.alt_Build_OrderedIntegers]] applies. Resolution is taught to find it, and through it every order structure the default order carries (total, decidable, strong poset, additive group order, strong linear refutative ring order, …).","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.ϕ","base":"ϕ","kind":"abbrev","start":159,"body":null,"status":"ok","short":{"text":"The canonical map from a model N of the naturals into the integers Z","status":"ok"},"long":{"text":"A local name for the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from a model N of the naturals (or, in later sections, `Nat`) into the integers Z. The characterisation of the order, x ≤ y if and only if y = x + ϕ z for some natural z, and the constructions of the order, of the absolute value and of the nonnegative cone, are all stated through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.integers_abs_slow_op","base":"integers_abs_slow_op","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"The absolute value of an integer as a natural, computed from its splitting as a difference","status":"ok"},"long":{"text":"The map underlying the absolute value Z → Nat on ordered integers. An integer x is split by [[AffineConstructive.theory.group_completion.group_completion_split]] into a pair (a, b) of naturals with x = ϕ a − ϕ b; the two are compared by [[AffineConstructive.interfaces.naturals.nat_subtract]], and the result is the difference between them, b − a when a < b, a − b when a > b, and 0 when they are equal. The value is read off a chosen representation, so that it respects the equality of Z is a separate fact, [[AffineConstructive.orders.integers.integers_abs_slow_is_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.integers_abs_slow_op_nonneg","base":"integers_abs_slow_op_nonneg","kind":"prf","start":161,"body":[162,182],"status":"ok","short":{"text":"For 0 ≤ x, the absolute value of x, taken back into the integers, is x","status":"ok"},"proof":[{"text":"Unfold the absolute value. It compares the two halves of the split of x, and by [[AffineConstructive.theory.group_completion.group_completion_split_spec]] the split (a, b) satisfies x = ϕ a − ϕ b. Rewrite x this way in both the goal and the hypothesis 0 ≤ x.","status":"ok","from":0,"to":2},{"text":"Compare a and b, keeping the equation each outcome satisfies ([[AffineConstructive.interfaces.naturals.nat_subtract_spec]]). There are three cases: a + m = b with m ≠ 0, a = b, or a = b + m with m ≠ 0.","status":"ok","from":3,"to":3},{"text":"In the first case, substitute b = a + m. Then ϕ a − ϕ b simplifies to −ϕ m, so the goal is ϕ m = −ϕ m. Since ϕ is an injective rig morphism into a ring, [[AffineConstructive.theory.naturals.to_ring_zero_sum_alt]] turns −ϕ m = ϕ m into m = 0 ∧ m = 0, so it is enough to prove m = 0.","status":"ok","from":4,"to":8},{"text":"By antisymmetry, prove m ≤ 0 and 0 ≤ m. The second holds for every natural by [[AffineConstructive.orders.naturals.naturals_nonneg]], which leaves m ≤ 0.","status":"ok","from":9,"to":10},{"text":"This bound comes from the hypothesis. Under the same substitution, 0 ≤ ϕ a − ϕ b becomes 0 ≤ −ϕ m. Adding ϕ m to both sides, which is an order embedding, gives ϕ m ≤ 0. Since ϕ reflects the order, [[AffineConstructive.orders.groups.reflects_nonpos]] gives m ≤ 0.","status":"ok","from":11,"to":15},{"text":"If a = b, the right side is ϕ a − ϕ a = 0, and the left side is ϕ 0 = 0 because ϕ preserves zero ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]).","status":"ok","from":16,"to":17},{"text":"If a = b + m, then ϕ preserves addition, so ϕ a − ϕ b = ϕ b + ϕ m − ϕ b, which simplifies to ϕ m.","status":"ok","from":18,"to":20}]},{"name":"AffineConstructive.orders.integers.integers_abs_slow_op_nonpos","base":"integers_abs_slow_op_nonpos","kind":"prf","start":183,"body":[184,203],"status":"ok","short":{"text":"For x ≤ 0, the absolute value of x, taken back into the integers, is −x","status":"ok"},"proof":[{"text":"Unfold the absolute value and write x = ϕ a − ϕ b, where (a, b) is the split of x ([[AffineConstructive.theory.group_completion.group_completion_split_spec]]). Rewrite x this way in both the goal and the hypothesis x ≤ 0.","status":"ok","from":0,"to":2},{"text":"Compare a and b ([[AffineConstructive.interfaces.naturals.nat_subtract_spec]]). There are three cases: a + m = b with m ≠ 0, a = b, or a = b + m with m ≠ 0.","status":"ok","from":3,"to":3},{"text":"If b = a + m, then −(ϕ a − ϕ(a + m)) simplifies to ϕ m, which is the left side.","status":"ok","from":4,"to":5},{"text":"If a = b, both sides are zero: −(ϕ a − ϕ a) = −0 = 0, and ϕ 0 = 0 by [[AffineConstructive.interfaces.abstract_algebra.preserves_0]].","status":"ok","from":6,"to":7},{"text":"If a = b + m, then −(ϕ a − ϕ b) simplifies to −ϕ m, so the goal is ϕ m = −ϕ m. Since ϕ is an injective rig morphism into a ring, [[AffineConstructive.theory.naturals.to_ring_zero_sum_alt]] reduces this to m = 0 ∧ m = 0, so it is enough to prove m = 0.","status":"ok","from":8,"to":12},{"text":"By antisymmetry, prove m ≤ 0 and 0 ≤ m. The second holds by [[AffineConstructive.orders.naturals.naturals_nonneg]], which leaves m ≤ 0.","status":"ok","from":13,"to":14},{"text":"Under the substitution a = b + m, the hypothesis ϕ a − ϕ b ≤ 0 becomes ϕ m ≤ 0. Since ϕ reflects the order, [[AffineConstructive.orders.groups.reflects_nonpos]] gives m ≤ 0.","status":"ok","from":15,"to":19}]},{"name":"AffineConstructive.orders.integers.integers_abs_slow_is_fun","base":"integers_abs_slow_is_fun","kind":"prf","start":204,"body":[205,218],"status":"ok","short":{"text":"The absolute value map on the integers preserves equality","status":"ok"},"proof":[{"text":"Fix x and y. The integers have decidable, and therefore affirmative, equality, so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] the affine implication follows from the plain implication. Assume x = y.","status":"ok","from":0,"to":3},{"text":"The canonical map ϕ from the naturals is an order embedding, hence injective. So it is enough to compare the images of the two absolute values under ϕ.","status":"ok","from":4,"to":4},{"text":"The order is total, so either 0 ≤ x or x ≤ 0. In the first case 0 ≤ y as well, since x = y. By [[AffineConstructive.orders.integers.integers_abs_slow_op_nonneg]] the two images are x and y, and these are equal.","status":"ok","from":5,"to":8},{"text":"In the second case y ≤ 0 as well. By [[AffineConstructive.orders.integers.integers_abs_slow_op_nonpos]] the images are −x and −y, which are equal because x = y.","status":"ok","from":9,"to":13}]},{"name":"AffineConstructive.orders.integers.integers_abs_slow","base":"integers_abs_slow","kind":"def","start":219,"body":null,"status":"ok","short":{"text":"The absolute value Z ⇾ Nat of ordered integers, as a function of sets","status":"ok"},"long":{"text":"The absolute value of ordered integers as a function from Z to the naturals, built by [[AffineConstructive.interfaces.set.func_make]] from the map [[AffineConstructive.orders.integers.integers_abs_slow_op]] and its preservation of equality [[AffineConstructive.orders.integers.integers_abs_slow_is_fun]]. Its defining properties are [[AffineConstructive.orders.integers.integers_abs_slow_nonneg]] and [[AffineConstructive.orders.integers.integers_abs_slow_nonpos]]: taken back into Z it is x on the nonnegative integers and −x on the nonpositive ones. It is used to identify the nonnegative integers with the naturals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.integers_abs_slow_nonneg","base":"integers_abs_slow_nonneg","kind":"prf","start":220,"body":[221,223],"status":"ok","short":{"text":"For 0 ≤ x, the absolute value of x, taken back into the integers, is x","status":"ok"},"proof":[{"text":"The absolute value as a function agrees with its underlying operation, so this is [[AffineConstructive.orders.integers.integers_abs_slow_op_nonneg]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.integers.integers_abs_slow_nonpos","base":"integers_abs_slow_nonpos","kind":"prf","start":224,"body":[225,227],"status":"ok","short":{"text":"For x ≤ 0, the absolute value of x, taken back into the integers, is −x","status":"ok"},"proof":[{"text":"The absolute value as a function agrees with its underlying operation, so this is [[AffineConstructive.orders.integers.integers_abs_slow_op_nonpos]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.integers.ϕ₁","base":"ϕ₁","kind":"abbrev","start":234,"body":null,"status":"ok","short":{"text":"The canonical map from the naturals Nat into the ordered integers Z","status":"ok"},"long":{"text":"A local name, in the section on maps out of the integers, for the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from the naturals `Nat` into Z, sending n to 1 + ⋯ + 1. Z is the group completion of the naturals along this map, so each element of Z is a difference ϕ₁ a − ϕ₁ b, and the order facts of the section are moved from the naturals along it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.ϕ₂","base":"ϕ₂","kind":"abbrev","start":235,"body":null,"status":"ok","short":{"text":"Local name for the canonical map from the naturals into the nonnegative integers Z⁺","status":"ok"},"long":{"text":"A local name for the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from the naturals `Nat` into the nonnegative cone Z⁺ of ordered integers, regarded as a set with the addition, zero and one it inherits from Z. This map carries the section's instances: [[AffineConstructive.orders.integers.nat_to_nonneg_surj]] shows it is surjective, with the absolute value as its designated inverse, [[AffineConstructive.orders.integers.nat_to_nonneg_bij]] that it is bijective, and [[AffineConstructive.orders.integers.nonneg_int_to_mon]] obtains the canonical maps out of Z⁺ by going back through it to the naturals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.nonneg_to_nat","base":"nonneg_to_nat","kind":"def","start":236,"body":null,"status":"ok","short":{"text":"The map from the nonnegative integers Z⁺ to the naturals: inclusion into Z, then absolute value","status":"ok"},"long":{"text":"The function Z⁺ ⇾ Nat from the nonnegative cone of an ordered model of the integers to the naturals. It is the inclusion of Z⁺ into Z followed by the absolute value [[AffineConstructive.orders.integers.integers_abs_slow]]. On a nonnegative x the absolute value is x itself read back in the naturals: [[AffineConstructive.orders.integers.integers_abs_slow_nonneg]] says that the canonical map from the naturals sends it back to x. So the map undoes the canonical map from the naturals into Z⁺.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.nat_to_nonneg_surj","base":"nat_to_nonneg_surj","kind":"inst","start":238,"body":[239,246],"status":"ok","short":{"text":"The canonical map from the naturals into the nonnegative integers is surjective, with inverse the absolute value","status":"ok"},"proof":[{"text":"Surjectivity asks that ϕ₂ followed by its inverse is the identity on the nonnegative integers Z⁺. That inverse is the absolute value, restricted to Z⁺.","status":"ok","from":0,"to":1},{"text":"The inclusion of Z⁺ into Z is injective, so it can be cancelled on the left ([[AffineConstructive.theory.set.injective_compose_cancel]]). It remains to show that the inclusion after ϕ₂, after the absolute value on Z⁺, is the inclusion.","status":"ok","from":2,"to":3},{"text":"The inclusion after ϕ₂ is a rig morphism from the naturals into Z. By initiality of the naturals, it is the canonical map ϕ.","status":"ok","from":4,"to":4},{"text":"Take a nonnegative integer x. Then ϕ applied to the absolute value of x is x, by [[AffineConstructive.orders.integers.integers_abs_slow_nonneg]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.orders.integers.nat_to_nonneg_bij","base":"nat_to_nonneg_bij","kind":"inst","start":247,"body":[248,250],"status":"ok","short":{"text":"The canonical map from the naturals into the nonnegative integers is bijective","status":"ok"},"proof":[{"text":"ϕ₂ is injective because it reflects the order: it is a rig morphism from the naturals into the ordered rig Z⁺. It is surjective by [[AffineConstructive.orders.integers.nat_to_nonneg_surj]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.integers.nonneg_int_to_mon","base":"nonneg_int_to_mon","kind":"inst","start":251,"body":null,"status":"ok","short":{"text":"The canonical maps out of the nonnegative integers into each set with +, 0 and 1","status":"ok"},"long":{"text":"The structure [[AffineConstructive.interfaces.naturals.NaturalsToMon]] on the nonnegative cone Z⁺ of ordered integers: the map from Z⁺ into a set with +, 0 and 1 goes back to the naturals by [[AffineConstructive.orders.integers.nonneg_to_nat]], the inverse of the canonical bijection, and then out of the naturals. It is the instance of [[AffineConstructive.theory.naturals.retract_is_nat_to_mon]] for that bijection, and the structure under which [[AffineConstructive.orders.integers.nonneg_int_naturals]] makes Z⁺ a model of the naturals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.integers.nonneg_int_naturals","base":"nonneg_int_naturals","kind":"prf","start":252,"body":[253,255],"status":"ok","short":{"text":"The nonnegative integers are a model of the naturals","status":"ok"},"proof":[{"text":"ϕ₂ is a bijection from the naturals onto Z⁺. Its inverse preserves addition, zero and one, so Z⁺ is a near-rig retract of the naturals. By [[AffineConstructive.theory.naturals.retract_is_nat]], Z⁺ is a model of the naturals.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.ring_order":{"page":"../interfaces/ring_order.html","short":"Cones, and order compatible with addition and multiplication in monoids, groups, rigs and rings","summary":"This file sets out the interfaces for ordered algebra. It first defines the cones of a weak poset with a zero as subsets: the nonzero elements, the nonnegative cone R⁺, the positive cone R₊, the nonpositive cone R⁻ and the negative cone R₋. It then gives the compatibility of order with addition: an ordered additive monoid, where adding z on the left is an order embedding, and an ordered additive group, where adding z on the left preserves the order. On these it builds two classes. A strong linear refutative rig order is a rig with a strong, linear, refutative partial order that is an ordered additive monoid and satisfies b < a ⊠ d < c ⊸ a·d + b·c < a·c + b·d. A strong linear refutative ring order is the ring version, with the same order axioms, an ordered additive group, and closure of the positive elements under products."},"AffineConstructive.implementations.nat":{"page":"../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.theory.nno":{"page":"../theory/nno.html","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[nno_to_nno_bijective]]). By transport along the comparison with [[Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[nno_ind]], with a base-logic variant [[nno_ind_alt]] and the tactic [[nno_induction]]. It also defines primitive recursion [[nno_rec]] with its base and step equations, and bundles it as a function of its step function [[nno_rec_fun]] when X is a strong set."},"AffineConstructive.theory.naturals":{"page":"../theory/naturals.html","short":"General theory of the naturals: uniqueness, NNO, commutative rig, cancellation, induction","summary":"This file develops the general theory of the [[Naturals]] interface, which characterises the natural numbers as a near-rig initial among additive monoids with a chosen 1. It shows that any two models are isomorphic through their canonical maps ([[naturals_to_naturals_bijective]]), that a retract of a model is again a model ([[retract_is_nat]]), and that every model is a natural numbers object ([[naturals_nno]]) via the concrete naturals [[Nat]]. On the algebraic side, every model is a commutative rig ([[naturals_is_com_rig]]), its canonical map into any near-rig is a rig morphism ([[naturals_to_mon_rig_mor]]), 1 ≠ 0 holds, addition cancels, there are no zero divisors in the strong sense, and x + y = 0 if and only if x = 0 ⊠ y = 0 ([[zero_sum]]). The file also gives induction principles phrased with 1 + n in place of the successor ([[naturals_ind]], [[naturals_ind_alt]], the tactic [[naturals_induction]]), the distance lemma [[naturals_distance]], and facts about negating the images of naturals in near-rings and rings."},"AffineConstructive.orders.naturals":{"page":"naturals.html","short":"The order on the naturals: x ≤ y as ∐ z, y = x + z, its properties and embeddings","summary":"The file develops the order theory of the naturals, working in both directions from the characterisation x ≤ y ⧟ ∐ z, y = x + z. Starting from an ordered model of the naturals, it proves that every natural is at least 0, that x ≤ y is equivalent to x < 1 + y ([[naturals_le_plus_1]]) and x < y to 1 + x ≤ y ([[naturals_lt_plus_1]]), and that the order is the one given by the characterisation ([[naturals_le_plus]]). From this it shows that every rig morphism into a strong linear refutative rig order with 1 ≠ 0 is an order embedding ([[naturals_to_rig_ord_embedding]]). In the other direction, [[alt_Build_OrderedNaturals]] starts from an order assumed only to satisfy the characterisation and shows that it is affirmative, decidable, total and translation-invariant, which makes an ordered naturals. Applied to the order defined by that formula, [[naturals_le]], this gives the default order [[naturals_le_order]] and multiplicative cancellation by nonzero elements. Finally, the comparison-with-difference operation of a model gives a correct three-way comparison ([[naturals_trich_correct]])."},"AffineConstructive.implementations.grothendieck_group":{"page":"../implementations/grothendieck_group.html","short":"The Grothendieck group of a commutative monoid, its universal property, order and ring structure","summary":"This file constructs the Grothendieck group of a commutative additive monoid M as the quotient of M ⊗ M by the relation (a, b) ~ (c, d) when there is k with a + d + k = c + b + k. The relation is an equivalence and a congruence for addition, and negation swaps the two components, so the quotient is an abelian group. The map [[to_grothendieck_group]], a ↦ (a, 0), is a monoid morphism. With [[from_grothendieck_group]] as the extension operation, it is the group completion of M ([[grothendieck_group_is_completion]]), with the universal property taken against all additive groups, abelian or not. When addition on M cancels, equality of pairs reduces to a + d = c + b. Under that hypothesis the embedding is injective, and affirmative, refutative or decidable equality, and the strong-set structure, pass from M to its Grothendieck group; affirmative equality passes without cancellation. The file also defines the order induced by an ordered monoid and shows that a strong rig's Grothendieck group is a ring, commutative when the rig is, with the embedding a rig morphism."},"AffineConstructive.theory.integers":{"page":"../theory/integers.html","short":"The integers: initiality, group completion of the naturals, decidability and integral domain","summary":"The file develops the integers from their defining property, initiality among additive groups with a distinguished element 1. Two morphisms out of Z that preserve addition, zero and 1 are equal ([[integers_initial_alt]]), so the canonical map between any two models of the integers is a bijection ([[integers_to_integers_bijective]]). In both directions the integers are the group completion of the naturals: a ring that is the group completion of N along a rig morphism is a model of the integers ([[naturals_completion_integers]]), which makes the Grothendieck group of the naturals one, and conversely the canonical map from N exhibits any model as the group completion of N ([[integers_group_completion]]). From that it follows that the map from N is injective, that every integer is a difference of naturals ([[integers_split_spec]]) and is n or −n for some natural n ([[integers_decompose]]), and that Z has decidable equality, is an integral domain and has strongly no zero divisors. The canonical map into any near-ring preserves multiplication as well ([[integers_to_near_ring_mor]]), and a ring onto which Z retracts by additive morphisms preserving 1 is itself a model of the integers ([[retract_is_int]])."},"AffineConstructive.theory.group_completion":{"page":"../theory/group_completion.html","short":"Group completions: uniqueness, decomposition as differences, transfer of equality, order and ring structure","summary":"This file develops the general theory of a group completion i : M ⇾ K of a commutative monoid, given by the universal property of [[GroupCompletion]] rather than by a construction. It extends monoid morphisms into any additive group ([[from_group_completion2]]), shows that any two completions are isomorphic ([[group_completion_iso]]), and writes every element of K as a difference i p − i n ([[group_completion_decompose]]) by comparison with the Grothendieck group. When M is cancellative, i is injective, and strength and decidable, refutative and affirmative equality pass from M to K. On the order side, an order on K that compares differences as a + d ≤ c + b makes K an ordered group with i an order embedding ([[group_completion_add_grp_order]]), and strong, linear, total, refutative, affirmative and decidable orders transfer. For a rig M completed into a ring, extensions of rig morphisms are rig morphisms, and commutativity, nontriviality, the ordered-ring structure ([[group_completion_ring_order]]) and being an integral domain ([[group_completion_int_domain]]) transfer; each result is also registered for the Grothendieck pairs of [[GrothendieckPairs]]."},"AffineConstructive.theory.groups":{"page":"../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.rings":{"page":"../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.subrings":{"page":"../theory/subrings.html","short":"Subrings and sub-near-rings: builders, induced structure, images, preimages, zero-symmetric part","summary":"This file carries the substructure theory of `theory/subgroups.v` over to ring-like structures. It first restates the subsemigroup, submonoid and subgroup results in additive and multiplicative form (builders from closure conditions, the full subset, the induced operations, the inclusion as a morphism, images and preimages), then treats the sub-near-rg, sub-near-rig, sub-near-rng and sub-near-ring predicates: their builders from closure under +, · and −, invariance under equality of subsets, the induced near-ring, ring and commutative ring structures on a substructure, the inclusion as an rg or rig morphism, and the stability of these substructures under images and preimages. It closes with the zero-symmetric part N₀ = { n | n · 0 = 0 } of a right near-ring, shown to be a substructure of whichever kind N is. The results are instances found by resolution, so a subset closed under the ring operations is a ring wherever one is needed."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.suborders":{"page":"suborders.html","short":"Subsets of an ordered set inherit its order structures; the inclusion is an order embedding","summary":"A subset U of X, regarded as a set ([[subset_to_set]]), carries the order of X restricted to its members, and this file shows that every order structure on X passes to U: preorder, weak poset, poset, strong poset, total and linear order, and the strong transitivity, decidability, affirmativity and refutativity of the order. Each proof restates the required law at the order of X and applies the corresponding law there, since a comparison of members of U is the same proposition as the comparison of the underlying points. The file ends by showing that the inclusion [[from_subset]] is an order embedding, so it both preserves and reflects the order. All of these are registered for instance resolution, so any subset of an ordered set is ordered without further declaration."},"AffineConstructive.orders.groups":{"page":"groups.html","short":"Ordered additive monoids and groups: translations, negation, and sign under morphisms","summary":"This file proves the basic order laws of ordered additive monoids and groups. For an ordered monoid it shows that every right translation (+z) is an order embedding and that addition is order preserving in both arguments. It also proves that 0 ≤ z and y = x + z together imply x ≤ y ([[compose_le]], with the strict version [[compose_lt]]), proves the mixed strict and non-strict addition laws, derives additive cancellation, and shows that the nonnegative part is again an ordered monoid. For an additive monoid morphism it proves how sign is preserved, reflected and embedded, both for monotone maps and for order-reversing ones, where each strict statement is the contrapositive of a non-strict one. It then shows that an ordered group is an ordered monoid ([[AdditiveGroupOrder_AdditiveMonoidOrder]]) and that negation is an order-reversing embedding ([[negate_order_embedding_flip]]). It ends with lemmas comparing x with −x according to its sign: those whose hypothesis is non-strict, and their contrapositives, need a strongly transitive order, while [[pos_between]], [[neg_between]] and their contrapositives need a linear, refutative order."},"AffineConstructive.orders.rings":{"page":"rings.html","short":"Ordered rigs and rings: compatibility of multiplication with the order, signs, squares, the nonnegative cone","summary":"This file develops ordered rigs and rings, that is, rigs with a strong, linear, refutative order that addition preserves and that obeys the strict compatibility law [[mult_lt_compat_full]]. Rings are the same but with closure of the positive cone under products. The order passes to the opposite ring, so each result about multiplication on the left gives its right-hand version for free. The non-strict compatibility law [[mult_le_compat_full]] is derived from the strict one through linearity and refutativity. [[strong_linear_refutative_rig_order_from_partial_minus]] builds a rig order from a partial subtraction and closure of the positive elements under products, and it shows that every ring order is a rig order. The consequences follow from these laws: no zero divisors, and cancellation by elements apart from 0. Multiplication by a nonnegative element preserves the order and multiplication by a nonpositive one reverses it. Multiplication by a positive or a negative element is an order embedding, order-preserving or order-reversing according to the sign. A square is nonnegative, and positive when the element is apart from 0, which gives 0 ≤ 1 and 0 ≤ 2, and also 0 < 1, 0 < 2 and 2 ≠ 0 when 1 ≠ 0. The file closes with the swap law [[minus_le_swap]] for differences and with the nonnegative cone R⁺, which is a sub-near-rig and carries the same kind of order."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.algebra.com_monoids":{"page":"../tactics/algebra/com_monoids.html","short":"Decision procedures for equations in commutative additive and multiplicative monoids","summary":"This file provides the decision procedures `add_mon` and `com_mon`, which prove equations between sums in a commutative additive monoid and between products in a commutative monoid. Each one fixes a free algebra on the naturals as generators: `add_mon.F` is the free commutative additive monoid and `com_mon.F` the free commutative monoid. The tactic reflects both sides of the equation into that free algebra over a list of atoms, then decides the resulting equation by computing normal forms. Its evaluation into the monoid turns that decision back into the original equation. The free algebras come from the free commutative monoid in the implementations, and the reflection machinery comes from the quotation tactics. Other tactic files and the algebraic theory files use these procedures to close routine monoid identities."}},"constants":null}</script>

ogy.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.sprop abstract_algebra theory.lattices orders.orders orders.maps orders.directed_sets.\nRequire Import easy rewrite logic.aprop logic.relations refutative tactics.misc simplify.\n\nLocal Notation \"X 'ᵒᵖ'\" := (Order_op X) (at level 1, format \"X 'ᵒᵖ'\").\n\nLemma Build_JoinSemiLatticeOrder `{WeakPoset L} `{Join L} :\n  (∀ x y : L, x ≤ x ⊔ y) →\n  (∀ x y : L, y ≤ x ⊔ y) →\n  (∀ x y z : L, x ≤ z ⊠ y ≤ z ⊸ x ⊔ y ≤ z) →\n  JoinSemiLatticeOrder L.\nProof. now split. Qed.\n\nDefinition JoinSemiLatticeOrder_poset `{H:JoinSemiLatticeOrder L} : WeakPoset L := WeakPoset_op (X:=L ᵒᵖ).\nCoercion JoinSemiLatticeOrder_poset : JoinSemiLatticeOrder >-> WeakPoset.\n\nDefinition MeetSemiLatticeOrder_op `{H:JoinSemiLatticeOrder L} : MeetSemiLatticeOrder (L ᵒᵖ) := H.\nDefinition JoinSemiLatticeOrder_op `{H:MeetSemiLatticeOrder L} : JoinSemiLatticeOrder (L ᵒᵖ) := H.\nGlobal Hint Extern 2 (MeetSemiLatticeOrder (_ ᵒᵖ)) => simple notypeclasses refine MeetSemiLatticeOrder_op : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLatticeOrder (_ ᵒᵖ)) => simple notypeclasses refine JoinSemiLatticeOrder_op : typeclass_instances.\nLemma LatticeOrder_op `{LatticeOrder L} : LatticeOrder (L ᵒᵖ).  Proof. now split. Qed.\nGlobal Hint Extern 2 (LatticeOrder (_ ᵒᵖ)) => simple notypeclasses refine LatticeOrder_op : typeclass_instances.\n\nLemma Build_BoundedJoinSemiLatticeOrder `{JoinSemiLatticeOrder L} `{Bottom L} :\n  (∀ x : L, ⊥ ≤ x) → BoundedJoinSemiLatticeOrder L.\nProof. now split. Qed.\n\nDefinition BoundedJoinSemiLatticeOrder_poset `{H:BoundedJoinSemiLatticeOrder L} : WeakPoset L := WeakPoset_op (X:=L ᵒᵖ).\nCoercion BoundedJoinSemiLatticeOrder_poset : BoundedJoinSemiLatticeOrder >-> WeakPoset.\nDefinition BoundedJoinSemiLatticeOrder_join_sl `{H:BoundedJoinSemiLatticeOrder L} : JoinSemiLatticeOrder L := bounded_meet_sl_order_meet (L ᵒᵖ) _.\nCoercion BoundedJoinSemiLatticeOrder_join_sl : BoundedJoinSemiLatticeOrder >-> JoinSemiLatticeOrder.\n\nDefinition BoundedMeetSemiLatticeOrder_op `{H:BoundedJoinSemiLatticeOrder L} : BoundedMeetSemiLatticeOrder (L ᵒᵖ) := H.\nDefinition BoundedJoinSemiLatticeOrder_op `{H:BoundedMeetSemiLatticeOrder L} : BoundedJoinSemiLatticeOrder (L ᵒᵖ) := H.\nGlobal Hint Extern 2 (BoundedMeetSemiLatticeOrder (_ ᵒᵖ)) => simple notypeclasses refine BoundedMeetSemiLatticeOrder_op : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLatticeOrder (_ ᵒᵖ)) => simple notypeclasses refine BoundedJoinSemiLatticeOrder_op : typeclass_instances.\n\nCoercion BoundedLatticeOrder_LatticeOrder `{H:BoundedLatticeOrder L} : LatticeOrder L.\nProof. now split. Qed.\n\nLemma alt_Build_BoundedLatticeOrder `{LatticeOrder L} `{Top L} `{Bottom L} :\n  (∀ x : L, x ≤ ⊤) → (∀ x : L, ⊥ ≤ x) → BoundedLatticeOrder L.\nProof. intros. split; now split. Qed.\n\nLemma BoundedLatticeOrder_op `{BoundedLatticeOrder L} : BoundedLatticeOrder (L ᵒᵖ).  Proof. now split. Qed.\nGlobal Hint Extern 2 (BoundedLatticeOrder (_ ᵒᵖ)) => simple notypeclasses refine BoundedLatticeOrder_op : typeclass_instances.\n\n\nLemma AProp_lattice_order : BoundedLatticeOrder Ω.\nProof. tautological. Qed.\nGlobal Hint Extern 2 (BoundedLatticeOrder AProp_set) => refine AProp_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (BoundedMeetSemiLatticeOrder AProp_set) => refine AProp_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLatticeOrder AProp_set) => refine AProp_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (LatticeOrder AProp_set) => refine AProp_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (MeetSemiLatticeOrder AProp_set) => refine AProp_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLatticeOrder AProp_set) => refine AProp_lattice_order : typeclass_instances.\n\n(** A join or meet operation satisfying the semilattice order axioms is\n    automatically a function (respects equality). *)\nSection join_from_op.\n  Universes i.\n  Context `{Poset@{i} L} (jn:L → L → L).\n  Context (ub_l : ∀ x y, x ≤ jn x y)\n          (ub_r : ∀ x y, y ≤ jn x y)\n          (lub : ∀ x y z, x ≤ z ⊠ y ≤ z ⊸ jn x y ≤ z).\n\n  Local Instance jn_is_fun : @IsFun@{i} (L ⊗ L) L (λ '(x, y), jn x y).\n  Proof. intros [x₁ y₁][x₂ y₂].\n    change (x₁ = x₂ ⊠ y₁ = y₂ ⊸ jn x₁ y₁ = jn x₂ y₂).\n    rew <-(antisymmetry (≤) (jn _ _) _).\n    apply aand_intro; rew <-(lub _ _ _);\n    refine (aprod_proper_aimpl _ _);\n    [ rew <-(ub_l _ _) | rew <-(ub_r _ _)\n    | rew <-(ub_l _ _) | rew <-(ub_r _ _) ];\n    try match goal with |- apos (?a = ?b ⊸ le (?c, ?d)) => match a with d => match b with c => change (a = b ⊸ flip le (a, b)) end end end;\n    now apply subrelation.\n  Qed.\n\n  Instance join_from_op : Join L := @func_make (L ⊗ L) L (λ '(x, y), jn x y) _.\n  Lemma join_from_op_sl_order : JoinSemiLatticeOrder L.\n  Proof. now apply Build_JoinSemiLatticeOrder. Qed.\nEnd join_from_op.\nGlobal Hint Extern 2 (@JoinSemiLatticeOrder _ (join_from_op _ _ _ _)) =>\n  simple notypeclasses refine (join_from_op_sl_order _ _ _ _) : typeclass_instances.\n\nSection meet_from_op.\n  Universes i.\n  Context `{Poset@{i} L} (mt:L → L → L).\n  Context (lb_l : ∀ x y, mt x y ≤ x)\n          (lb_r : ∀ x y, mt x y ≤ y)\n          (glb : ∀ x y z, z ≤ x ⊠ z ≤ y ⊸ z ≤ mt x y).\n\n  Instance meet_from_op : Meet L := join_from_op (L:=L ᵒᵖ) mt lb_l lb_r glb.\n  Definition meet_from_op_sl_order : MeetSemiLatticeOrder L := join_from_op_sl_order (L:=L ᵒᵖ) _ _ _ _.\nEnd meet_from_op.\nGlobal Hint Extern 2 (@MeetSemiLatticeOrder _ (meet_from_op _ _ _ _)) =>\n  simple notypeclasses refine (meet_from_op_sl_order _ _ _ _) : typeclass_instances.\n\nSection join_ub_3.\n  Universes u.\n  Context `{JoinSemiLatticeOrder@{u} L}.\n\n  Local Ltac join_ub :=\n    match goal with\n      | |- apos (?x ≤ ?y ⊔ ?z) =>\n        match x with\n        | y => apply join_ub_l\n        | z => apply join_ub_r\n        end\n    end.\n\n  Lemma join_ub_3_r (x y z : L) : z ≤ x ⊔ y ⊔ z.  Proof. exact (join_ub_r _ _). Qed.\n  Lemma join_ub_3_m (x y z : L) : y ≤ x ⊔ y ⊔ z.  Proof. trans (x ⊔ y); join_ub. Qed.\n  Lemma join_ub_3_l (x y z : L) : x ≤ x ⊔ y ⊔ z.  Proof. trans (x ⊔ y); join_ub. Qed.\n\n  Lemma join_ub_3_assoc_l (x y z : L) : x ≤ x ⊔ (y ⊔ z).  Proof. exact (join_ub_l _ _). Qed.\n  Lemma join_ub_3_assoc_m (x y z : L) : y ≤ x ⊔ (y ⊔ z).  Proof. trans (y ⊔ z); join_ub. Qed.\n  Lemma join_ub_3_assoc_r (x y z : L) : z ≤ x ⊔ (y ⊔ z).  Proof. trans (y ⊔ z); join_ub. Qed.\nEnd join_ub_3.\n\nSection meet_lb_3.\n  Universes u.\n  Context `{MeetSemiLatticeOrder@{u} L}.\n\n  Definition meet_lb_3_r (x y z : L) : x ⊓ y ⊓ z ≤ z := meet_lb_r _ _.\n  Definition meet_lb_3_m : ∀ (x y z : L), x ⊓ y ⊓ z ≤ y := exact:(join_ub_3_m (L:=L ᵒᵖ)).\n  Definition meet_lb_3_l : ∀ (x y z : L), x ⊓ y ⊓ z ≤ x := exact:(join_ub_3_l (L:=L ᵒᵖ)).\n\n  Definition meet_lb_3_assoc_l (x y z : L) : x ⊓ (y ⊓ z) ≤ x := meet_lb_l _ _.\n  Definition meet_lb_3_assoc_m : ∀ (x y z : L), x ⊓ (y ⊓ z) ≤ y := exact:(join_ub_3_assoc_m (L:=L ᵒᵖ)).\n  Definition meet_lb_3_assoc_r : ∀ (x y z : L), x ⊓ (y ⊓ z) ≤ z := exact:(join_ub_3_assoc_r (L:=L ᵒᵖ)).\nEnd meet_lb_3.\n\n(** A (very) simple tactic for solving / simplifying inequalities involving lattice ops *)\nLtac lattice_order_tac :=\n    repeat match goal with\n      | |- apos (?x ≤ ?y) => match x with y => refl end\n      | |- apos (?x ⊓ _ ≤ ?y) => match x with y => apply meet_lb_l end\n      | |- apos (_ ⊓ ?x ≤ ?y) => match x with y => apply meet_lb_r end\n      | |- apos (?x ⊓ _ ⊓ _ ≤ ?y) => match x with y => apply meet_lb_3_l end\n      | |- apos (_ ⊓ ?x ⊓ _ ≤ ?y) => match x with y => apply meet_lb_3_m end\n      | |- apos (_ ⊓ (?x ⊓ _) ≤ ?y) => match x with y => apply meet_lb_3_assoc_m end\n      | |- apos (_ ⊓ (_ ⊓ ?x) ≤ ?y) => match x with y => apply meet_lb_3_assoc_r end\n      | |- apos (?x ≤ ?y ⊔ _) => match x with y => apply join_ub_l end\n      | |- apos (?x ≤ _ ⊔ ?y) => match x with y => apply join_ub_r end\n      | |- apos (?x ≤ ?y ⊔ _ ⊔ _) => match x with y => apply join_ub_3_l end\n      | |- apos (?x ≤ _ ⊔ ?y ⊔ _) => match x with y => apply join_ub_3_m end\n      | |- apos (?x ≤ _ ⊔ (?y ⊔ _)) => match x with y => apply join_ub_3_assoc_m end\n      | |- apos (?x ≤ _ ⊔ (_ ⊔ ?y)) => match x with y => apply join_ub_3_assoc_r end\n      | |- apos (?x ⊔ _ ≤ ?y) => match x with y => rew <-(join_lub x _ x); split end\n      | |- apos (_ ⊔ ?x ≤ ?y) => match x with y => rew <-(join_lub _ x x); split end\n      | |- apos (?x ≤ ?y ⊓ _) => match x with y => rew <-(meet_glb x _ x); split end\n      | |- apos (?x ≤ _ ⊓ ?y) => match x with y => rew <-(meet_glb _ x x); split end\n      | |- apos (⊥ ≤ _) => apply above_bottom\n      | |- apos (_ ≤ ⊤) => apply below_top\n    end.\n\n(** The order-theoretic semilattice structures are instances of the algebraic ones *)\nLemma join_sl_order_join_sl `{JoinSemiLatticeOrder L} : JoinSemiLattice L.\nProof. apply alt_Build_JoinSemiLattice.\n+ intros x y z. rew <-(pseudo_antisymmetry (≤) _ _); split.\n  * rew <-(join_lub _ _ _); split; [| rew <-(join_lub (L:=L) _ _ _); split ]; lattice_order_tac.\n  * rew <-(join_lub _ _ _); split; [ rew <-(join_lub (L:=L) _ _ _); split |]; lattice_order_tac.\n+ intros x y. rew <-(pseudo_antisymmetry (≤) _ _); split;\n    rew <-(join_lub (L:=L) _ _ _); split; lattice_order_tac.\n+ intros x. rew <-(pseudo_antisymmetry (≤) _ _); split;\n  [ rew <-(join_lub (L:=L) _ _ _); now split | lattice_order_tac ].\nQed.\nCoercion join_sl_order_join_sl : JoinSemiLatticeOrder >-> JoinSemiLattice.\nGlobal Hint Extern 4 (JoinSemiLattice _) => simple notypeclasses refine join_sl_order_join_sl : typeclass_instances.\n\nCoercion bounded_join_sl_order_bounded_join_sl `{BoundedJoinSemiLatticeOrder L} : BoundedJoinSemiLattice L.\nProof. apply alt_Build_BoundedJoinSemiLattice; try exact _.\n  intros x. rew <-(le_pseudo_antisym _ _). split; lattice_order_tac.\nQed.\nGlobal Hint Extern 4 (BoundedJoinSemiLattice _) => simple notypeclasses refine bounded_join_sl_order_bounded_join_sl : typeclass_instances.\n\n\nCoercion meet_sl_order_meet_sl `{MeetSemiLatticeOrder L} : MeetSemiLattice L := _ : JoinSemiLattice L ᵒᵖ.\nGlobal Hint Extern 4 (MeetSemiLattice _) => simple notypeclasses refine meet_sl_order_meet_sl : typeclass_instances.\n\nCoercion  bounded_meet_sl_order_bounded_meet_sl `{BoundedMeetSemiLatticeOrder L} : BoundedMeetSemiLattice L.\nProof. exact (bounded_join_sl_order_bounded_join_sl (L:=L ᵒᵖ)). Qed.\nGlobal Hint Extern 4 (BoundedMeetSemiLattice _) => simple notypeclasses refine bounded_meet_sl_order_bounded_meet_sl : typeclass_instances.\n\n\nSection join_sl.\n  Universes u.\n  Context `{JoinSemiLatticeOrder@{u} L}.\n\n  (*Lemma join_le_compat_r (x y z : L) : z ≤ x ⊸ z ≤ x ⊔ y.  Proof. now rew <-(join_ub_l _ _). Qed.\n  Lemma join_le_compat_l (x y z : L) : z ≤ y ⊸ z ≤ x ⊔ y.  Proof. now rew <-(join_ub_r _ _). Qed.*)\n\n  Lemma join_l_iff (x y : L) : y ≤ x ⧟ x ⊔ y = x.\n  Proof. split.\n  + rew <-(le_pseudo_antisym _ _).\n    rew (aprod_true_r (join_ub_l _ _)).\n    rew <-(join_lub _ _ _). now simplify.\n  + rew (join_ub_r x y) at 2. apply eq_le.\n  Qed.\n  Lemma join_l {x y : L} : y ≤ x → x ⊔ y = x.  Proof. apply join_l_iff. Qed.\n\n  Lemma join_r_iff (x y : L) : x ≤ y ⧟ x ⊔ y = y.\n  Proof. rew (commutativity (⊔) x y). apply join_l_iff. Qed.\n  Lemma join_r {x y : L} : x ≤ y → x ⊔ y = y.  Proof. apply join_r_iff. Qed.\n\n  Definition join_ne_l_iff (x y : L) : x < y ⧟ x ⊔ y ≠ x := acontra_iff (join_l_iff _ _).\n  Definition join_ne_r_iff (x y : L) : y < x ⧟ x ⊔ y ≠ y := acontra_iff (join_r_iff _ _).\n\n  Lemma join_order_preserving : OrderPreserving (@join L _).\n  Proof. split; [ now split |].\n    intros [x₁ y₁][x₂ y₂]. change (x₁ ≤ x₂ ⊠ y₁ ≤ y₂ ⊸ x₁ ⊔ y₁ ≤ x₂ ⊔ y₂).\n    rew <-(join_lub _ _ _).\n    rew <-(join_ub_l x₂ y₂) at 1.\n    rew <-(join_ub_r x₂ y₂).\n    refl.\n  Qed.\n\n(*\n  Lemma join_le_compat (x₁ x₂ y₁ y₂ : L) : x₁ ≤ x₂ ⊠ y₁ ≤ y₂ ⊸ x₁ ⊔ y₁ ≤ x₂ ⊔ y₂.\n  Proof.\n    rew <-(join_lub (L:=L) _ _ _).\n    rew <-(join_ub_l x₂ y₂) at 1.\n    rew <-(join_ub_r x₂ y₂).\n    refl.\n  Qed.\n\n  Lemma join_proper_le {x₁:L} {x₂ y₁ y₂} : (x₁ ≤ x₂) → (y₁ ≤ y₂) → x₁ ⊔ y₁ ≤ x₂ ⊔ y₂.\n  Proof. intros. rew <-(join_le_compat _ _ _ _). now split. Qed.\n\n  Instance join_l_order_preserving (z:L) : OrderPreserving (z ⊔).\n  Proof. apply alt_Build_OrderPreserving. intros x y. change ( x ≤ y ⊸ z ⊔ x ≤ z ⊔ y ).\n    rew <-(join_le_compat _ _ _ _).\n    now rew (aprod_true_l (_ : z ≤ z)).\n  Qed.\n\n  Instance join_r_order_preserving (z:L) : OrderPreserving (⊔ z).\n  Proof. apply alt_Build_OrderPreserving. intros x y. change ( x ≤ y ⊸ x ⊔ z ≤ y ⊔ z ).\n    rew <-(join_le_compat _ _ _ _).\n    now rew (aprod_true_r (_ : z ≤ z)).\n  Qed.\n*)\n\n  (** Above [a], joining with [a] is invisible: [a ⊔ (−)] is left adjoint to\n      the inclusion of the principal upset [↑a]. *)\n  Lemma le_join_iff_l (x a c : L) : a ≤ x → (a ⊔ c ≤ x ⧟ c ≤ x).\n  Proof. intros P. split.\n  + rew <-(transitivity (≤) c (a ⊔ c) x). now rew (aprod_true_l (join_ub_r a c)).\n  + rew <-(join_lub a c x). now rew (aprod_true_l P).\n  Qed.\n\n  Lemma le_join_iff_r (x a c : L) : c ≤ x → (a ⊔ c ≤ x ⧟ a ≤ x).\n  Proof. intros P. split.\n  + rew <-(transitivity (≤) a (a ⊔ c) x). now rew (aprod_true_l (join_ub_l a c)).\n  + rew <-(join_lub a c x). now rew (aprod_true_r P).\n  Qed.\n\n  Definition join_le_join_iff_l (a b c : L) : a ⊔ c ≤ a ⊔ b ⧟ c ≤ a ⊔ b := le_join_iff_l _ _ _ (join_ub_l a b).\n  Definition join_le_join_iff_r (a b c : L) : c ⊔ b ≤ a ⊔ b ⧟ c ≤ a ⊔ b := le_join_iff_r _ _ _ (join_ub_r a b).\n\n  Lemma join_le_join_l_alt {a b c : L} : c ≤ a ⊔ b → a ⊔ c ≤ a ⊔ b.\n  Proof. intros P. now rew (join_le_join_iff_l a b c). Qed.\n  Lemma join_le_join_r_alt {a b c : L} : c ≤ a ⊔ b → c ⊔ b ≤ a ⊔ b.\n  Proof. intros P. now rew (join_le_join_iff_r a b c). Qed.\n\n  Lemma join_sl_directed `{Inhabited L} : UpDirected L.\n  Proof. split; try exact _. intros x y. exists (x ⊔ y); split; lattice_order_tac. Qed.\nEnd join_sl.\n(*\nGlobal Hint Extern 2 (OrderPreserving (_ ⊔)) => simple notypeclasses refine (join_l_order_preserving _) : typeclass_instances.\nGlobal Hint Extern 2 (OrderPreserving (⊔ _)) => simple notypeclasses refine (join_r_order_preserving _) : typeclass_instances.\n*)\nGlobal Hint Extern 2 (OrderPreserving (⊔)) => simple notypeclasses refine join_order_preserving : typeclass_instances.\n\nCoercion bounded_join_sl_directed `{BoundedJoinSemiLatticeOrder L} : UpDirected L := join_sl_directed.\n\nSection meet_sl.\n  Universes u.\n  Context `{MeetSemiLatticeOrder@{u} L}.\n\n  Definition meet_l_iff : ∀ (x y : L), x ≤ y ⧟ x ⊓ y = x := join_l_iff (L:=L ᵒᵖ).\n  Definition meet_r_iff : ∀ (x y : L), y ≤ x ⧟ x ⊓ y = y := join_r_iff (L:=L ᵒᵖ).\n  Definition meet_l {x : L} {y} : x ≤ y → x ⊓ y = x := join_l (L:=L ᵒᵖ).\n  Definition meet_r {x : L} {y} : y ≤ x → x ⊓ y = y := join_r (L:=L ᵒᵖ).\n\n  Definition meet_ne_l_iff (x y : L) : y < x ⧟ x ⊓ y ≠ x := acontra_iff (meet_l_iff _ _).\n  Definition meet_ne_r_iff (x y : L) : x < y ⧟ x ⊓ y ≠ y := acontra_iff (meet_r_iff _ _).\n\n  Lemma meet_order_preserving : OrderPreserving (@meet L _).\n  Proof. apply alt_Build_OrderPreserving. intros [x₁ y₁][x₂ y₂]. unfold_pair_le.\n    pose proof (order_preserving ((⊔) : L ᵒᵖ ⊗ L ᵒᵖ ⇾ L ᵒᵖ)) as P.\n    exact ( P (x₂, y₂) (x₁, y₁) ).\n  Qed.\n(*\n  Lemma meet_le_compat (x₁ x₂ y₁ y₂ : L) : x₁ ≤ x₂ ⊠ y₁ ≤ y₂ ⊸ x₁ ⊓ y₁ ≤ x₂ ⊓ y₂.\n  Proof. apply exact:(join_le_compat (L:=L ᵒᵖ)). Qed.\n\n  Lemma meet_proper_le {x₁:L} {x₂ y₁ y₂} : (x₁ ≤ x₂) → (y₁ ≤ y₂) → x₁ ⊓ y₁ ≤ x₂ ⊓ y₂.\n  Proof. apply exact:(@join_proper_le (L ᵒᵖ) _ _ _). Qed.\n\n  Lemma meet_l_order_preserving (z:L) : OrderPreserving (z ⊓).\n  Proof. apply alt_Build_OrderPreserving. intros. apply exact:(order_preserving (((z:L ᵒᵖ) ⊔) : L ᵒᵖ ⇾ L ᵒᵖ)). Qed.\n\n  Lemma meet_r_order_preserving (z:L) : OrderPreserving (⊓ z).\n  Proof. apply alt_Build_OrderPreserving. intros. apply exact:(order_preserving ((⊔ (z:L ᵒᵖ)) : L ᵒᵖ ⇾ L ᵒᵖ)). Qed.\n*)\n  (** Below [a], meeting with [a] is invisible: [a ⊓ (−)] is right adjoint to\n      the inclusion of the principal downset [↓a]. *)\n  Definition le_meet_iff_l : ∀ (x a c : L), x ≤ a → (x ≤ a ⊓ c ⧟ x ≤ c) := le_join_iff_l (L:=L ᵒᵖ).\n  Definition le_meet_iff_r : ∀ (x a c : L), x ≤ c → (x ≤ a ⊓ c ⧟ x ≤ a) := le_join_iff_r (L:=L ᵒᵖ).\n\n  Definition meet_le_meet_iff_l : ∀ (a b c : L), a ⊓ b ≤ a ⊓ c ⧟ a ⊓ b ≤ c := join_le_join_iff_l (L:=L ᵒᵖ).\n  Definition meet_le_meet_iff_r : ∀ (a b c : L), a ⊓ b ≤ c ⊓ b ⧟ a ⊓ b ≤ c := join_le_join_iff_r (L:=L ᵒᵖ).\n\n  Definition meet_le_meet_l_alt {a b c : L} : a ⊓ b ≤ c → a ⊓ b ≤ a ⊓ c := join_le_join_l_alt (L:=L ᵒᵖ).\n  Definition meet_le_meet_r_alt {a b c : L} : a ⊓ b ≤ c → a ⊓ b ≤ c ⊓ b := join_le_join_r_alt (L:=L ᵒᵖ).\n\n  Definition meet_sl_directed `{Inhabited L} : DownDirected L := join_sl_directed (L:=L ᵒᵖ).\nEnd meet_sl.\n(*\nGlobal Hint Extern 2 (OrderPreserving (_ ⊓)) => simple notypeclasses refine (meet_l_order_preserving _) : typeclass_instances.\nGlobal Hint Extern 2 (OrderPreserving (⊓ _)) => simple notypeclasses refine (meet_r_order_preserving _) : typeclass_instances.\n*)\nGlobal Hint Extern 2 (OrderPreserving (⊓)) => simple notypeclasses refine meet_order_preserving : typeclass_instances.\n\nCoercion bounded_meet_sl_directed `{BoundedMeetSemiLatticeOrder L} : DownDirected L := meet_sl_directed.\n\n\nLemma below_bottom `{BoundedJoinSemiLatticeOrder L} (x:L) : x ≤ ⊥ ⧟ x = ⊥.\nProof. now rew (join_l_iff _ _), (join_bot_l _). Qed.\n\nLemma above_top `{BoundedMeetSemiLatticeOrder L} : ∀ x:L, ⊤ ≤ x ⧟ x = ⊤.\nProof. exact (below_bottom (L:=L ᵒᵖ)). Qed.\n\n\n(*Global Hint Extern 2 (apos ((_ ⊔ _) ≤ _)) => proper 2 join_proper_le : proper.\nGlobal Hint Extern 2 (apos ((_ ⊓ _) ≤ _)) => proper 2 meet_proper_le : proper.*)\n\nLemma from_algebraic_bounded_join_sl_order `{JoinSemiLatticeOrder L} `{Bottom L} `{!BoundedJoinSemiLattice L} : BoundedJoinSemiLatticeOrder L.\nProof. apply Build_BoundedJoinSemiLatticeOrder. intro x. rew (join_l_iff _ _). exact (join_bot_r _). Qed.\n\nLemma from_algebraic_bounded_meet_sl_order `{MeetSemiLatticeOrder L} `{Top L} `{!BoundedMeetSemiLattice L} : BoundedMeetSemiLatticeOrder L.\nProof. exact (from_algebraic_bounded_join_sl_order (L:=L ᵒᵖ)). Qed.\n\nSection lattice_order.\n  (** The order-theoretic lattice structure is an instance of the algebraic one *)\n  Instance lattice_order_lattice `{LatticeOrder L} : Lattice L.\n  Proof. split; try exact _; intros x y; rew <-(le_pseudo_antisym _ x); split; lattice_order_tac. Qed.\n\n  (** One direction of the distributivity laws is always satisfied. *)\n  Lemma meet_join_distr_l_le `{LatticeOrder L}\n    (x y z : L) : (x ⊓ y) ⊔ (x ⊓ z) ≤ x ⊓ (y ⊔ z).\n  Proof.\n    rew <-(meet_glb _ _ _); split; rew <-(join_lub _ _ _); split; lattice_order_tac.\n    trans y; lattice_order_tac.\n    trans z; lattice_order_tac.\n  Qed.\n\n  Lemma join_meet_distr_l_le `{LatticeOrder L} :\n    ∀ x y z : L, x ⊔ (y ⊓ z) ≤ (x ⊔ y) ⊓ (x ⊔ z).\n  Proof. exact (meet_join_distr_l_le (L:=L ᵒᵖ)). Qed.\n\n\n  Lemma Build_DistributiveLatticeOrder `{LatticeOrder L} :\n    (∀ x y z : L, (x ⊔ y) ⊓ (x ⊔ z) ≤ x ⊔ y ⊓ z) → DistributiveLattice L.\n  Proof. intro. apply alt_Build_DistributiveLattice.\n    intros x y z. rew <-(le_pseudo_antisym _ _); split; [ apply join_meet_distr_l_le | trivial ].\n  Qed.\n\n  (** A lattice order that is linear and refutative is distributive. *)\n  Lemma lattice_order_distr `{LatticeOrder L} `{!LinearOrder L, !RefutativeOrder L} : DistributiveLattice L.\n  Proof. apply Build_DistributiveLatticeOrder. intros x y z.\n    apply (refutative_by_aff_cases (x ≤ y)); intros [Ey|Ey];\n      [ rew (join_r Ey) | rew (lt_le y x) in Ey; rew (join_l Ey) ];\n    apply (refutative_by_aff_cases (x ≤ z)); (intros [Ez|Ez];\n      [ rew (join_r Ez) | rew (lt_le z x) in Ez; rew (join_l Ez) ]).\n  + lattice_order_tac.\n  + rew (meet_r Ey). lattice_order_tac.\n  + rew (meet_l Ez). lattice_order_tac.\n  + rew (binary_idempotency (⊓) _). lattice_order_tac.\n  Qed.\n\n  Lemma bounded_lattice_order_bounded_lattice `{BoundedLatticeOrder L} : BoundedLattice L.\n  Proof. now split. Qed.\nEnd lattice_order.\nCoercion lattice_order_lattice : LatticeOrder >-> Lattice.\nCoercion bounded_lattice_order_bounded_lattice : BoundedLatticeOrder >-> BoundedLattice.\nGlobal Hint Extern 4 (DistributiveLattice _) => simple notypeclasses refine lattice_order_distr : typeclass_instances.\n\n(** In the other direction, a strong partial order can be recovered from\n    a strong (algebraic) meet or join semilattice. *)\nSection from_meet_semilattice.\n  Universes u.\n  Context `{MeetSemiLattice@{u} L} `{!StrongSet L} `{Le L}.\n  Context (le_correct : ∀ x y : L, x ≤ y ⧟ x ⊓ y = x).\n\n  Let inst: @StronglyTransitive@{u} L (≤).\n  Proof. intros x y z; rew (le_correct _ _).\n    rew <-(strong_transitivity (=) (x ⊓ z) (x ⊓ y) x).\n    apply aand_intro; [| exact _].\n    rew (is_fun (⊓ z) (x ⊓ y) x); simplify.\n    rew (symmetry_iff (=) _ (x ⊓ z)).\n    rew (is_fun (x ⊓) (y ⊓ z) y); simplify.\n    rew (associativity _ _ _ _).\n    exact (strong_transitivity (=) _ _ _).\n  Qed.\n\n  Instance: PreOrder L.\n  Proof. split; [| exact _].\n    intro x. rew (le_correct _ _).\n    now apply binary_idempotency.\n  Qed.\n\n  Instance: Poset L.\n  Proof. apply alt_Build_Poset; try exact _; hnf.\n  + intros [x y]. rew (is_fun (x ⊓) _ _ : _ ⊸ x ⊓ _ = x ⊓ _).\n    rew [ (binary_idempotency (⊓) _) | (le_correct _ _) ].\n    now apply symmetry.\n  + intros x y. rew ?(le_correct _ _).\n    rew [(symmetry_iff (=) _ x) | (commutativity (⊓) y x) ].\n    exact (strong_transitivity (=) x (x ⊓ y) y).\n  Qed.\n\n  Lemma from_meet_sl_strong : StrongPoset L.\n  Proof. now split. Qed.\n\n  Instance from_meet_sl_meet_order : MeetSemiLatticeOrder L.\n  Proof. apply Build_MeetSemiLatticeOrder.\n  + exact (_ : Poset L).\n  + intros x y.\n    now rew (le_correct _ _), (commutativity (⊓) x y), <-(associativity _ _ _ _), (binary_idempotency _ _).\n  + intros x y. now rew (le_correct _ _), <-(associativity _ x _ _), (binary_idempotency _ _).\n  + intros x y z. rew (le_correct _ _).\n    rew (associativity _ z _ _). rew <-(transitivity (=) (z ⊓ x ⊓ y) (z ⊓ y) z).\n    refine (aprod_proper_aimpl _ _).\n    exact (is_fun (⊓ y) _ _).\n  Qed.\nEnd from_meet_semilattice.\n\nSection from_join_semilattice.\n  Universes u.\n  Context `{jn:Join@{u} L} `{!JoinSemiLattice L, !StrongSet L} {Lle: Le L}.\n  Context (le_correct : ∀ x y : L, y ≤ x ⧟ x ⊔ y = x).\n\n  Lemma from_join_sl_strong : StrongPoset L.\n  Proof. change (StrongPoset ((L ᵒᵖ)ᵒᵖ)). refine StrongPoset_op. refine (from_meet_sl_strong le_correct). Qed.\n  Lemma from_join_sl_join_order : JoinSemiLatticeOrder L.\n  Proof. change (JoinSemiLatticeOrder ((L ᵒᵖ)ᵒᵖ)). refine JoinSemiLatticeOrder_op. refine (from_meet_sl_meet_order _). Qed.\nEnd from_join_semilattice.\n\n\nSection from_lattice_meet.\n  Universes u.\n  Context `{Lattice@{u} L} `{!StrongSet L} `{Le L}.\n  Context (le_correct : ∀ x y : L, x ≤ y ⧟ x ⊓ y = x).\n\n  Let inst : MeetSemiLatticeOrder L := from_meet_sl_meet_order le_correct.\n\n  Lemma from_lattice_meet_order : LatticeOrder L.\n  Proof. split; [exact _ |].\n    enough (∀ x y : L, y ≤ x ⧟ x ⊔ y = x) as le_jn by now pose proof from_join_sl_join_order le_jn.\n    intros x y. rew (le_correct _ _). split.\n  + rew (commutativity (⊓) _ _), (is_fun (x ⊔) (x ⊓ y) y); simplify. rew (join_meet_absorption x y).\n    now apply symmetry.\n  + rew (commutativity (⊔) _ _), (is_fun (y ⊓) (y ⊔ x) x); simplify. rew (meet_join_absorption y x).\n    now apply symmetry.\n  Qed.\nEnd from_lattice_meet.\n\n\nSection from_lattice_join.\n  Universes u.\n  Context `{Lattice@{u} L} `{!StrongSet L} `{Le L}.\n  Context (le_correct : ∀ x y : L, y ≤ x ⧟ x ⊔ y = x).\n\n  Lemma from_lattice_join_order : LatticeOrder L.\n  Proof. change (LatticeOrder ((L ᵒᵖ)ᵒᵖ)). refine LatticeOrder_op. refine (from_lattice_meet_order (L:=L ᵒᵖ) le_correct). Qed.\nEnd from_lattice_join.\n\n(** Morphisms *)\n\nSection join_order_preserving.\n  Universes u.\n  Context `{JoinSemiLatticeOrder@{u} (L:=L)} `{JoinSemiLatticeOrder@{u} (L:=K)}\n    (f : L ⇾ K) {mor:JoinSemiLattice_Morphism f}.\n\n  Local Instance join_sl_mor_preserving: OrderPreserving f.\n  Proof. apply alt_Build_OrderPreserving. intros x y.\n    rew (join_r_iff _ _).\n    rew <-(preserves_join f _ _).\n    exact (is_fun f _ _).\n  Qed.\n\n  Lemma join_sl_mor_embedding `{!Injective f}: OrderEmbedding f.\n  Proof. split; [ exact _ |]. apply alt_Build_OrderReflecting. intros x y.\n    rew (join_r_iff _ _).\n    rew <-(preserves_join f _ _).\n    exact (injective f _ _).\n  Qed.\nEnd join_order_preserving.\n\nSection meet_order_preserving.\n  Universes u.\n  Context `{MeetSemiLatticeOrder@{u} (L:=L)} `{MeetSemiLatticeOrder@{u} (L:=K)}\n    (f : L ⇾ K) `{!MeetSemiLattice_Morphism f}.\n\n  Lemma meet_sl_mor_preserving: OrderPreserving f.\n  Proof. apply op_order_preserving_iff. exact (join_sl_mor_preserving (f:L ᵒᵖ ⇾ K ᵒᵖ) ). Qed.\n\n  Lemma meet_sl_mor_embedding `{!Injective f}: OrderEmbedding f.\n  Proof. apply op_order_embedding_iff. exact (join_sl_mor_embedding (f:L ᵒᵖ ⇾ K ᵒᵖ) ). Qed.\nEnd meet_order_preserving.\n\nSection join_order_preserving_flip.\n  Universes u.\n  Context `{JoinSemiLatticeOrder@{u} (L:=L)} `{MeetSemiLatticeOrder@{u} (L:=K)}\n    (f : L ⇾ K) {mor:JoinSemiLattice_Flip_Morphism f}.\n\n  Local Instance join_sl_mor_preserving_flip: OrderPreservingFlip f.\n  Proof. exact (join_sl_mor_preserving (f : L ⇾ K ᵒᵖ)). Qed.\n\n  Lemma join_sl_mor_embedding_flip `{!Injective f}: OrderEmbeddingFlip f.\n  Proof. exact (join_sl_mor_embedding (f : L ⇾ K ᵒᵖ)). Qed.\nEnd join_order_preserving_flip.\n\nSection meet_order_preserving_flip.\n  Universes u.\n  Context `{MeetSemiLatticeOrder@{u} (L:=L)} `{JoinSemiLatticeOrder@{u} (L:=K)}\n    (f : L ⇾ K) `{!MeetSemiLattice_Flip_Morphism f}.\n\n  Local Instance meet_sl_mor_preserving_flip: OrderPreservingFlip f.\n  Proof. exact (meet_sl_mor_preserving (f : L ⇾ K ᵒᵖ)). Qed.\n\n  Lemma meet_sl_mor_embedding_flip `{!Injective f}: OrderEmbeddingFlip f.\n  Proof. exact (meet_sl_mor_embedding (f : L ⇾ K ᵒᵖ)). Qed.\nEnd meet_order_preserving_flip.\n\n\nLemma preserves_join_lax@{u} `{JoinSemiLatticeOrder@{u} (L:=L)} `{JoinSemiLatticeOrder@{u} (L:=K)}\n  (f: L ⇾ K) `{!OrderPreserving f} x y : f x ⊔ f y ≤ f (x ⊔ y) .\nProof. apply join_lub; split; apply (order_preserving f); lattice_order_tac. Qed.\n\nLemma preserves_meet_lax@{u} `{MeetSemiLatticeOrder@{u} (L:=L)} `{MeetSemiLatticeOrder@{u} (L:=K)}\n  (f: L ⇾ K) `{!OrderPreserving f} : ∀ x y, f (x ⊓ y) ≤ f x ⊓ f y .\nProof. exact (preserves_join_lax (f:L ᵒᵖ ⇾ K ᵒᵖ)). Qed.\n\nLemma preserves_join_lax2@{u} `{JoinSemiLatticeOrder@{u} (L:=L₁)} `{JoinSemiLatticeOrder@{u} (L:=L₂)}\n  `{JoinSemiLatticeOrder@{u} (L:=K)}\n  (f: L₁ ⊗ L₂ ⇾ K) `{!OrderPreserving f} x₁ x₂ y₁ y₂\n  : f (x₁, x₂) ⊔ f (y₁, y₂) ≤ f (x₁ ⊔ y₁, x₂ ⊔ y₂) .\nProof. apply join_lub; split; apply (order_preserving f); split; simplify; lattice_order_tac. Qed.\n\nLemma preserves_meet_lax2@{u} `{MeetSemiLatticeOrder@{u} (L:=L₁)} `{MeetSemiLatticeOrder@{u} (L:=L₂)}\n  `{MeetSemiLatticeOrder@{u} (L:=K)}\n  (f: L₁ ⊗ L₂ ⇾ K) `{!OrderPreserving f} x₁ x₂ y₁ y₂\n  : f (x₁ ⊓ y₁, x₂ ⊓ y₂) ≤ f (x₁, x₂) ⊓ f (y₁, y₂) .\nProof. apply meet_glb; split; apply (order_preserving f); split; simplify; lattice_order_tac. Qed.\n\n\nSection order_preserving_join_sl_mor.\n  Universes u.\n  Context `{JoinSemiLatticeOrder@{u} (L:=L)} `{JoinSemiLatticeOrder@{u} (L:=K)}\n    `{!LinearOrder L, !RefutativeEquality L, !RefutativeOrder K} (f: L ⇾ K) `{!OrderPreserving f}.\n\n  Lemma order_preserving_join_sl_mor: JoinSemiLattice_Morphism f.\n  Proof. apply Build_JoinSemiLattice_Morphism. intros x y.\n    apply le_antisym; split.\n    * apply ( refutative_by_aff_cases (x = y) ); intros [E|E].\n      + rew E. now rew (binary_idempotency (⊔) _).\n      + rew (ne_iff_lt _ _) in E. destruct E as [E|E];\n          rew E at 1; rew (binary_idempotency _ _); lattice_order_tac.\n    * now apply preserves_join_lax.\n  Qed.\nEnd order_preserving_join_sl_mor.\nLocal Hint Extern 20 (JoinSemiLattice_Morphism _) => simple notypeclasses refine (order_preserving_join_sl_mor _) : typeclass_instances.\n\n\nSection order_preserving_meet_sl_mor.\n  Universes u.\n  Context `{MeetSemiLatticeOrder@{u} (L:=L)} `{MeetSemiLatticeOrder@{u} (L:=K)}\n    `{!LinearOrder L, !RefutativeEquality L, !RefutativeOrder K} (f: L ⇾ K) `{!OrderPreserving f}.\n\n  Lemma order_preserving_meet_sl_mor: MeetSemiLattice_Morphism f.\n  Proof. now change (JoinSemiLattice_Morphism (f:L ᵒᵖ ⇾ K ᵒᵖ)). Qed.\nEnd order_preserving_meet_sl_mor.\nLocal Hint Extern 20 (MeetSemiLattice_Morphism _) => simple notypeclasses refine (order_preserving_meet_sl_mor _) : typeclass_instances.\n\nLemma order_preserving_lat_mor@{u} `{LatticeOrder@{u} (L:=L)} `{LatticeOrder@{u} (L:=K)}\n  `{!LinearOrder L, !RefutativeEquality rite.html"},{"s":23760,"e":23763,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":23968,"e":23971,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":23994,"e":23997,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":25785,"e":25802,"lib":"AffineConstructive.orders.lattices","name":"lattice_order_tac","kind":"ltac","local":true},{"s":26344,"e":26352,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":26354,"e":26371,"lib":"AffineConstructive.orders.lattices","name":"lattice_order_tac","kind":"ltac","local":true},{"s":26689,"e":26697,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":26699,"e":26716,"lib":"AffineConstructive.orders.lattices","name":"lattice_order_tac","kind":"ltac","local":true},{"s":27183,"e":27186,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27190,"e":27193,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":27194,"e":27197,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27234,"e":27237,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27291,"e":27294,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27303,"e":27306,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27333,"e":27350,"lib":"AffineConstructive.orders.lattices","name":"lattice_order_tac","kind":"ltac","local":true},{"s":27358,"e":27361,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":27876,"e":27879,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":28324,"e":28327,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[AffineConstructive.orders.lattices.join_from_op]], [[AffineConstructive.orders.lattices.meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[AffineConstructive.orders.lattices.join_sl_order_join_sl]], [[AffineConstructive.orders.lattices.lattice_order_lattice]]). The file also proves the basic laws: [[AffineConstructive.orders.lattices.join_l_iff]] and [[AffineConstructive.orders.lattices.meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[AffineConstructive.orders.lattices.below_bottom]] and [[AffineConstructive.orders.lattices.above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[AffineConstructive.orders.lattices.from_meet_sl_meet_order]], [[AffineConstructive.orders.lattices.from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[AffineConstructive.orders.lattices.lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets.","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","items":[{"name":"AffineConstructive.orders.lattices.Build_JoinSemiLatticeOrder","base":"Build_JoinSemiLatticeOrder","kind":"prf","start":3,"body":[4,6],"status":"ok","short":{"text":"Builds a join semilattice order from the two upper-bound laws and the least-upper-bound law of ⊔","status":"ok"},"proof":[{"text":"A join semilattice order is a weak poset together with the two upper-bound laws and the least-upper-bound law for ⊔. The three hypotheses are exactly these laws, so the structure is assembled from them and the given order.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.JoinSemiLatticeOrder_poset","base":"JoinSemiLatticeOrder_poset","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"The weak poset underlying a join semilattice order","status":"ok"},"long":{"text":"The weak partial order on L that a join semilattice order carries. Since [[AffineConstructive.interfaces.orders.JoinSemiLatticeOrder]] is arranged as a meet semilattice order on the opposite order, the order of L itself is recovered as the opposite of the opposite, by [[AffineConstructive.orders.orders.WeakPoset_op]] applied to L ᵒᵖ.\n\nIt is declared a coercion, so that any statement about weak posets applies directly to a join semilattice order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.coercion:JoinSemiLatticeOrder_poset","base":"coercion:JoinSemiLatticeOrder_poset","kind":"coercion","start":8,"body":null,"status":"ok","short":{"text":"A join semilattice order reaches its underlying weak poset, so the order laws apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.MeetSemiLatticeOrder_op","base":"MeetSemiLatticeOrder_op","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"A join semilattice order on L is a meet semilattice order on the opposite L ᵒᵖ","status":"ok"},"long":{"text":"Reversing the order exchanges joins and meets. The join of L is a least upper bound, so in the opposite order L ᵒᵖ it is a greatest lower bound. The join semilattice structure is defined by instantiating the meet structure at the opposite order, so this holds by definition.\n\nA hint lets resolution find it whenever a goal asks for a meet semilattice order on an opposite. In the recorded development two proof steps use it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.JoinSemiLatticeOrder_op","base":"JoinSemiLatticeOrder_op","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"A meet semilattice order on L is a join semilattice order on the opposite L ᵒᵖ","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.lattices.MeetSemiLatticeOrder_op]]. The meet of L is a greatest lower bound, so in the opposite order L ᵒᵖ it is a least upper bound, and a meet semilattice order on L is, by definition, a join semilattice order on L ᵒᵖ.\n\nA hint makes it available to resolution at opposite orders. In this file it gives [[AffineConstructive.orders.lattices.from_join_sl_join_order]]: the meet semilattice order recovered at the opposite order is read back as a join semilattice order on L.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.LatticeOrder_op","base":"LatticeOrder_op","kind":"prf","start":13,"body":[14,16],"status":"ok","short":{"text":"The opposite of a lattice order is a lattice order","status":"ok"},"proof":[{"text":"A lattice order is a meet semilattice order and a join semilattice order on the same order. Reversing the order turns the join into a meet and the meet into a join, by [[AffineConstructive.orders.lattices.JoinSemiLatticeOrder_op]] and [[AffineConstructive.orders.lattices.MeetSemiLatticeOrder_op]]. The two halves of the structure on L ᵒᵖ come from these.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.Build_BoundedJoinSemiLatticeOrder","base":"Build_BoundedJoinSemiLatticeOrder","kind":"prf","start":18,"body":[19,21],"status":"ok","short":{"text":"Builds a bounded join semilattice order from a join semilattice order whose ⊥ lies below every element","status":"ok"},"proof":[{"text":"A bounded join semilattice order is a join semilattice order together with the law that ⊥ lies below every element. That law is the hypothesis, so the structure is assembled directly.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.BoundedJoinSemiLatticeOrder_poset","base":"BoundedJoinSemiLatticeOrder_poset","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"The weak poset underlying a bounded join semilattice order","status":"ok"},"long":{"text":"The weak partial order on L carried by a bounded join semilattice order. The structure is defined as a bounded meet semilattice order on the opposite order, so the order of L is recovered as the opposite of the opposite, by [[AffineConstructive.orders.orders.WeakPoset_op]].\n\nDeclared a coercion, so that a bounded join semilattice order may be used wherever a weak poset is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.coercion:BoundedJoinSemiLatticeOrder_poset","base":"coercion:BoundedJoinSemiLatticeOrder_poset","kind":"coercion","start":23,"body":null,"status":"ok","short":{"text":"A bounded join semilattice order reaches its underlying weak poset directly","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.BoundedJoinSemiLatticeOrder_join_sl","base":"BoundedJoinSemiLatticeOrder_join_sl","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"The join semilattice order underlying a bounded join semilattice order","status":"ok"},"long":{"text":"Forgets the bottom element of a bounded join semilattice order, leaving its join semilattice order. It is the meet semilattice order underlying the bounded meet semilattice order on the opposite, [[AffineConstructive.interfaces.orders.bounded_meet_sl_order_meet]] read at L ᵒᵖ.\n\nDeclared a coercion, so that every result about join semilattice orders applies to bounded ones.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.coercion:BoundedJoinSemiLatticeOrder_join_sl","base":"coercion:BoundedJoinSemiLatticeOrder_join_sl","kind":"coercion","start":25,"body":null,"status":"ok","short":{"text":"A bounded join semilattice order reaches its join semilattice order, so the facts about joins apply","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.BoundedMeetSemiLatticeOrder_op","base":"BoundedMeetSemiLatticeOrder_op","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"A bounded join semilattice order on L is a bounded meet semilattice order on L ᵒᵖ","status":"ok"},"long":{"text":"Reversing the order turns the join into a meet and the bottom ⊥, which lies below every element, into a top above every element. A bounded join semilattice order is defined as a bounded meet semilattice order on the opposite order, so this holds by definition.\n\nA hint makes it available to resolution at opposite orders. In the recorded development one proof step uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.BoundedJoinSemiLatticeOrder_op","base":"BoundedJoinSemiLatticeOrder_op","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"A bounded meet semilattice order on L is a bounded join semilattice order on L ᵒᵖ","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.lattices.BoundedMeetSemiLatticeOrder_op]]. A meet together with a top on L becomes a join together with a bottom on the opposite order L ᵒᵖ, and this holds by definition.\n\nA hint makes it available to resolution at opposite orders. In the recorded development one proof step uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.BoundedLatticeOrder_LatticeOrder","base":"BoundedLatticeOrder_LatticeOrder","kind":"def","start":30,"body":[31,33],"status":"ok","short":{"text":"A bounded lattice order is a lattice order","status":"ok"},"proof":[{"text":"Forget the bounds. The bounded meet semilattice order and the bounded join semilattice order give their unbounded parts, the join part through [[AffineConstructive.orders.lattices.BoundedJoinSemiLatticeOrder_join_sl]], and these two parts make up the lattice order.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.alt_Build_BoundedLatticeOrder","base":"alt_Build_BoundedLatticeOrder","kind":"prf","start":34,"body":[35,38],"status":"ok","short":{"text":"Builds a bounded lattice order from a lattice order with ⊤ above and ⊥ below every element","status":"ok"},"proof":[{"text":"Assume that ⊤ lies above every element and ⊥ below every element.","status":"ok","from":0,"to":1},{"text":"A bounded lattice order is made of a bounded meet semilattice order and a bounded join semilattice order. Each one combines the matching half of the lattice order with one of the two assumed bounds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.lattices.BoundedLatticeOrder_op","base":"BoundedLatticeOrder_op","kind":"prf","start":39,"body":[40,42],"status":"ok","short":{"text":"The opposite of a bounded lattice order is a bounded lattice order","status":"ok"},"proof":[{"text":"Reversing the order exchanges the two bounded halves. The bounded join semilattice order of L becomes a bounded meet semilattice order on L ᵒᵖ, and the bounded meet semilattice order becomes a bounded join semilattice order, by [[AffineConstructive.orders.lattices.BoundedMeetSemiLatticeOrder_op]] and [[AffineConstructive.orders.lattices.BoundedJoinSemiLatticeOrder_op]]. Together they make the bounded lattice order on L ᵒᵖ.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.AProp_lattice_order","base":"AProp_lattice_order","kind":"prf","start":44,"body":[45,47],"status":"ok","short":{"text":"The affine propositions, ordered by implication, form a bounded lattice order","status":"ok"},"proof":[{"text":"Each law of a bounded lattice order on Ω is a valid statement of affine logic: P ∧ Q is the greatest lower bound and P ∨ Q the least upper bound under implication, and 𝐅 ⊸ P and P ⊸ 𝐓 hold for every P. The decision procedure for affine tautologies proves all of them.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.jn_is_fun","base":"jn_is_fun","kind":"inst","start":58,"body":[59,64],"status":"ok","short":{"text":"An operation satisfying the join laws of a poset preserves equality in each argument","status":"ok"},"proof":[{"text":"Take two pairs (x₁, y₁) and (x₂, y₂). Equality on L ⊗ L is the tensor of the componentwise equalities, so the goal is that x₁ = x₂ ⊠ y₁ = y₂ implies jn x₁ y₁ = jn x₂ y₂.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.interfaces.aprop.antisymmetry]] it suffices to prove both inequalities, jn x₁ y₁ ≤ jn x₂ y₂ and jn x₂ y₂ ≤ jn x₁ y₁. These form an additive conjunction, so each is proved from the whole hypothesis.","status":"ok","from":3,"to":3},{"text":"For each inequality, the least-upper-bound law reduces the goal to bounding each argument by the other join, and each factor of the hypothesis is spent on one of the two bounds. For the first inequality, x₁ = x₂ gives x₁ ≤ x₂ ≤ jn x₂ y₂ and y₁ = y₂ gives y₁ ≤ y₂ ≤ jn x₂ y₂, using the upper-bound laws and transitivity. The second inequality is the same argument with the equalities read in reverse, which is allowed because equality is symmetric and is contained in ≤.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.lattices.join_from_op","base":"join_from_op","kind":"inst","start":65,"body":null,"status":"ok","short":{"text":"The join of a poset built from an operation that is a least upper bound","status":"ok"},"long":{"text":"Given a poset L and an operation jn on its elements, with no assumption that jn respects equality, but with jn x y an upper bound of x and of y and below every common upper bound, this is the join L ⊗ L ⇾ L that jn defines. That jn is a function of sets is not assumed but proved, by [[AffineConstructive.orders.lattices.jn_is_fun]]: a least upper bound is determined by its arguments up to equality, by antisymmetry.\n\nThe point is economy: a join can be supplied by its order-theoretic description alone, and [[AffineConstructive.orders.lattices.join_from_op_sl_order]] then gives the join semilattice order. The tensor in the least-upper-bound law is the multiplicative one, as in [[AffineConstructive.interfaces.orders.JoinSemiLatticeOrder]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.join_from_op_sl_order","base":"join_from_op_sl_order","kind":"prf","start":66,"body":[67,69],"status":"ok","short":{"text":"The join built from a least-upper-bound operation makes the poset a join semilattice order","status":"ok"},"proof":[{"text":"The join of [[AffineConstructive.orders.lattices.join_from_op]] is the operation jn, and its laws are the three hypotheses on jn. [[AffineConstructive.orders.lattices.Build_JoinSemiLatticeOrder]] assembles the join semilattice order from them.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.meet_from_op","base":"meet_from_op","kind":"inst","start":76,"body":null,"status":"ok","short":{"text":"The meet of a poset built from an operation that is a greatest lower bound","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.lattices.join_from_op]]: an operation mt with mt x y below x and y and above every common lower bound defines a meet L ⊗ L ⇾ L, with no separate proof that mt respects equality.\n\nIt is defined as the join built by [[AffineConstructive.orders.lattices.join_from_op]] on the opposite order, where the lower-bound laws of mt are the upper-bound laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_from_op_sl_order","base":"meet_from_op_sl_order","kind":"def","start":77,"body":null,"status":"ok","short":{"text":"The meet built from a greatest-lower-bound operation makes the poset a meet semilattice order","status":"ok"},"long":{"text":"The meet semilattice order carried by the meet of [[AffineConstructive.orders.lattices.meet_from_op]]. It is [[AffineConstructive.orders.lattices.join_from_op_sl_order]] read at the opposite order, a join semilattice order on L ᵒᵖ being a meet semilattice order on L.\n\nA hint makes resolution find it whenever the meet of a set was built by [[AffineConstructive.orders.lattices.meet_from_op]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.join_ub","base":"join_ub","kind":"ltac","start":83,"body":null,"status":"ok","short":{"text":"Closes a goal x ≤ y ⊔ z in which x is literally y or z","status":"ok"},"long":{"text":"A local tactic of the section on three-fold joins. It matches a goal stating that an element lies below a binary join, x ≤ y ⊔ z, and compares x syntactically with the two arguments: when x is y it applies [[AffineConstructive.interfaces.orders.join_ub_l]], when x is z it applies [[AffineConstructive.interfaces.orders.join_ub_r]]. When x is neither, the tactic fails. It takes no arguments and does no rewriting or unfolding.\n\nThe proofs of [[AffineConstructive.orders.lattices.join_ub_3_m]], [[AffineConstructive.orders.lattices.join_ub_3_l]], [[AffineConstructive.orders.lattices.join_ub_3_assoc_m]] and [[AffineConstructive.orders.lattices.join_ub_3_assoc_r]] go through an intermediate join by transitivity, for instance y ≤ x ⊔ y ≤ x ⊔ y ⊔ z, and each of the two resulting inequalities is an instance of one of the two upper-bound laws; the tactic picks the right one for each, so one proof script serves both goals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.join_ub_3_r","base":"join_ub_3_r","kind":"prf","start":84,"body":[85,87],"status":"ok","short":{"text":"The last of three elements lies below their left-nested join: z ≤ x ⊔ y ⊔ z","status":"ok"},"proof":[{"text":"The element z is the right argument of the outer join (x ⊔ y) ⊔ z, so z lies below it by [[AffineConstructive.interfaces.orders.join_ub_r]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_ub_3_m","base":"join_ub_3_m","kind":"prf","start":88,"body":[89,91],"status":"ok","short":{"text":"The middle of three elements lies below their left-nested join: y ≤ x ⊔ y ⊔ z","status":"ok"},"proof":[{"text":"Go through x ⊔ y and use transitivity. y lies below x ⊔ y by [[AffineConstructive.interfaces.orders.join_ub_r]], and x ⊔ y lies below (x ⊔ y) ⊔ z as its left argument by [[AffineConstructive.interfaces.orders.join_ub_l]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_ub_3_l","base":"join_ub_3_l","kind":"prf","start":92,"body":[93,95],"status":"ok","short":{"text":"The first of three elements lies below their left-nested join: x ≤ x ⊔ y ⊔ z","status":"ok"},"proof":[{"text":"Go through x ⊔ y and use transitivity. x lies below x ⊔ y, and x ⊔ y lies below (x ⊔ y) ⊔ z; both are instances of [[AffineConstructive.interfaces.orders.join_ub_l]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_ub_3_assoc_l","base":"join_ub_3_assoc_l","kind":"prf","start":96,"body":[97,99],"status":"ok","short":{"text":"The first of three elements lies below their right-nested join: x ≤ x ⊔ (y ⊔ z)","status":"ok"},"proof":[{"text":"x is the left argument of x ⊔ (y ⊔ z), so it lies below the join by [[AffineConstructive.interfaces.orders.join_ub_l]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_ub_3_assoc_m","base":"join_ub_3_assoc_m","kind":"prf","start":100,"body":[101,103],"status":"ok","short":{"text":"The middle of three elements lies below their right-nested join: y ≤ x ⊔ (y ⊔ z)","status":"ok"},"proof":[{"text":"Go through y ⊔ z and use transitivity. y lies below y ⊔ z by [[AffineConstructive.interfaces.orders.join_ub_l]], and y ⊔ z lies below x ⊔ (y ⊔ z) as its right argument by [[AffineConstructive.interfaces.orders.join_ub_r]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_ub_3_assoc_r","base":"join_ub_3_assoc_r","kind":"prf","start":104,"body":[105,107],"status":"ok","short":{"text":"The last of three elements lies below their right-nested join: z ≤ x ⊔ (y ⊔ z)","status":"ok"},"proof":[{"text":"Go through y ⊔ z and use transitivity. z lies below y ⊔ z, and y ⊔ z lies below x ⊔ (y ⊔ z); both are instances of [[AffineConstructive.interfaces.orders.join_ub_r]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.meet_lb_3_r","base":"meet_lb_3_r","kind":"def","start":112,"body":null,"status":"ok","short":{"text":"The left-nested meet of three elements lies below the last: x ⊓ y ⊓ z ≤ z","status":"ok"},"long":{"text":"In a meet semilattice order, x ⊓ y ⊓ z lies below z. It is an instance of [[AffineConstructive.interfaces.orders.meet_lb_r]], recorded under this name so that the tactic of the file can apply it by the shape of the goal; with its companions it covers each position in a meet of three, nested either way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_lb_3_m","base":"meet_lb_3_m","kind":"def","start":113,"body":null,"status":"ok","short":{"text":"The left-nested meet of three elements lies below the middle: x ⊓ y ⊓ z ≤ y","status":"ok"},"long":{"text":"In a meet semilattice order, x ⊓ y ⊓ z lies below y. It is [[AffineConstructive.orders.lattices.join_ub_3_m]] at the opposite order, where the meet is the join. Used by the file's tactic for inequalities between lattice expressions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_lb_3_l","base":"meet_lb_3_l","kind":"def","start":114,"body":null,"status":"ok","short":{"text":"The left-nested meet of three elements lies below the first: x ⊓ y ⊓ z ≤ x","status":"ok"},"long":{"text":"In a meet semilattice order, x ⊓ y ⊓ z lies below x. It is [[AffineConstructive.orders.lattices.join_ub_3_l]] at the opposite order. Used by the file's tactic for inequalities between lattice expressions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_lb_3_assoc_l","base":"meet_lb_3_assoc_l","kind":"def","start":115,"body":null,"status":"ok","short":{"text":"The right-nested meet of three elements lies below the first: x ⊓ (y ⊓ z) ≤ x","status":"ok"},"long":{"text":"In a meet semilattice order, x ⊓ (y ⊓ z) lies below x. It is an instance of [[AffineConstructive.interfaces.orders.meet_lb_l]], named for the right-nested shape so that it can be applied by pattern; it completes the family of lower bounds for meets of three.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_lb_3_assoc_m","base":"meet_lb_3_assoc_m","kind":"def","start":116,"body":null,"status":"ok","short":{"text":"The right-nested meet of three elements lies below the middle: x ⊓ (y ⊓ z) ≤ y","status":"ok"},"long":{"text":"In a meet semilattice order, x ⊓ (y ⊓ z) lies below y. It is [[AffineConstructive.orders.lattices.join_ub_3_assoc_m]] at the opposite order. Used by the file's tactic for inequalities between lattice expressions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_lb_3_assoc_r","base":"meet_lb_3_assoc_r","kind":"def","start":117,"body":null,"status":"ok","short":{"text":"The right-nested meet of three elements lies below the last: x ⊓ (y ⊓ z) ≤ z","status":"ok"},"long":{"text":"In a meet semilattice order, x ⊓ (y ⊓ z) lies below z. It is [[AffineConstructive.orders.lattices.join_ub_3_assoc_r]] at the opposite order. Used by the file's tactic for inequalities between lattice expressions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.lattice_order_tac","base":"lattice_order_tac","kind":"ltac","start":119,"body":null,"status":"ok","short":{"text":"Closes or reduces inequalities that follow directly from the bound properties of ⊓, ⊔, ⊥ and ⊤","status":"ok"},"long":{"text":"The tactic repeatedly inspects an inequality goal and closes it when it is an immediate instance of a bound property. It closes x ≤ x by reflexivity. It closes a meet below one of its meetands with [[AffineConstructive.interfaces.orders.meet_lb_l]] or [[AffineConstructive.interfaces.orders.meet_lb_r]], or, for three meetands, with [[AffineConstructive.orders.lattices.meet_lb_3_l]], [[AffineConstructive.orders.lattices.meet_lb_3_m]], [[AffineConstructive.orders.lattices.meet_lb_3_assoc_m]] and [[AffineConstructive.orders.lattices.meet_lb_3_assoc_r]], in either bracketing. Dually, it closes an element below a join of which it is a joinand with [[AffineConstructive.interfaces.orders.join_ub_l]], [[AffineConstructive.interfaces.orders.join_ub_r]] and the three-term lemmas [[AffineConstructive.orders.lattices.join_ub_3_l]], [[AffineConstructive.orders.lattices.join_ub_3_m]], [[AffineConstructive.orders.lattices.join_ub_3_assoc_m]] and [[AffineConstructive.orders.lattices.join_ub_3_assoc_r]]. It closes ⊥ ≤ y by [[AffineConstructive.interfaces.orders.above_bottom]] and x ≤ ⊤ by [[AffineConstructive.interfaces.orders.below_top]].\n\nIt also handles one partial case. When the goal is x ⊔ c ≤ x or c ⊔ x ≤ x, it applies the least-upper-bound property [[AffineConstructive.interfaces.orders.join_lub]] and splits the goal in two: x ≤ x, which it closes, and c ≤ x, which it continues to work on. Dually, it applies [[AffineConstructive.interfaces.orders.meet_glb]] to x ≤ x ⊓ c and x ≤ c ⊓ x. All matching is syntactic: an element counts as a meetand or joinand only when it appears there literally. Goals that match none of these shapes are left unchanged, so the tactic never fails.\n\nProofs use it after splitting a goal with [[AffineConstructive.interfaces.orders.join_lub]] or [[AffineConstructive.interfaces.orders.meet_glb]], or after a transitivity step through an intermediate element, when every remaining goal is an element below a join that contains it, or a meet below one of its meetands. This is how associativity, commutativity and idempotence of ⊔ are derived from the order axioms in [[AffineConstructive.orders.lattices.join_sl_order_join_sl]], how the absorption laws are derived in [[AffineConstructive.orders.lattices.lattice_order_lattice]], and how the lax preservation inequalities are proved.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.join_sl_order_join_sl","base":"join_sl_order_join_sl","kind":"prf","start":120,"body":[121,136],"status":"ok","short":{"text":"A join semilattice order is an algebraic join semilattice: ⊔ is associative, commutative and idempotent","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.lattices.alt_Build_JoinSemiLattice]], it suffices to show that ⊔ is associative, commutative and idempotent. Each law is an equation, and each is proved by pseudo-antisymmetry from two inequalities, using only that the join is a least upper bound.","status":"ok","from":0,"to":1},{"text":"Associativity. Fix x, y and z. By [[AffineConstructive.interfaces.aprop.pseudo_antisymmetry]], the equation follows from the inequalities in both directions between x ⊔ (y ⊔ z) and (x ⊔ y) ⊔ z. They form a tensor, and each is proved separately from no hypotheses.","status":"ok","from":2,"to":4},{"text":"For x ⊔ (y ⊔ z) ≤ (x ⊔ y) ⊔ z, the least-upper-bound property [[AffineConstructive.interfaces.orders.join_lub]] reduces the goal to x ≤ (x ⊔ y) ⊔ z and y ⊔ z ≤ (x ⊔ y) ⊔ z. The first is [[AffineConstructive.orders.lattices.join_ub_3_l]]. Applying [[AffineConstructive.interfaces.orders.join_lub]] again splits the second into y ≤ (x ⊔ y) ⊔ z, which is [[AffineConstructive.orders.lattices.join_ub_3_m]], and z ≤ (x ⊔ y) ⊔ z, which holds because z is the right argument.","status":"ok","from":5,"to":6},{"text":"The reverse inequality is symmetric. By [[AffineConstructive.interfaces.orders.join_lub]] it reduces to x ⊔ y ≤ x ⊔ (y ⊔ z) and z ≤ x ⊔ (y ⊔ z). The first splits again into x ≤ x ⊔ (y ⊔ z), which holds because x is the left argument, and y ≤ x ⊔ (y ⊔ z), which is [[AffineConstructive.orders.lattices.join_ub_3_assoc_m]]. The second is [[AffineConstructive.orders.lattices.join_ub_3_assoc_r]].","status":"ok","from":7,"to":8},{"text":"Commutativity. Fix x and y. By pseudo-antisymmetry, it suffices to show x ⊔ y ≤ y ⊔ x and y ⊔ x ≤ x ⊔ y. For each, [[AffineConstructive.interfaces.orders.join_lub]] asks for the two arguments on the left to lie below the join on the right, and they do, one as its right argument and the other as its left.","status":"ok","from":9,"to":11},{"text":"Idempotence. Fix x. For x ⊔ x ≤ x, the least-upper-bound property asks for x ≤ x twice, and reflexivity gives it. For x ≤ x ⊔ x, x is an argument of the join and so lies below it.","status":"ok","from":12,"to":15}]},{"name":"AffineConstructive.orders.lattices.coercion:join_sl_order_join_sl","base":"coercion:join_sl_order_join_sl","kind":"coercion","start":137,"body":null,"status":"ok","short":{"text":"A join semilattice order counts as an algebraic join semilattice, so the algebraic laws of ⊔ apply","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.bounded_join_sl_order_bounded_join_sl","base":"bounded_join_sl_order_bounded_join_sl","kind":"def","start":139,"body":[140,145],"status":"ok","short":{"text":"A bounded join semilattice order is an algebraic bounded join semilattice, with ⊥ the identity of ⊔","status":"ok"},"proof":[{"text":"Build the structure with [[AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice]]. Associativity, commutativity and idempotence of ⊔ come from [[AffineConstructive.orders.lattices.join_sl_order_join_sl]]. What is left to show is that ⊥ is a left identity for ⊔.","status":"ok","from":0,"to":1},{"text":"Fix x. By pseudo-antisymmetry, it suffices to show ⊥ ⊔ x ≤ x and x ≤ ⊥ ⊔ x. The first follows from the least-upper-bound property, since ⊥ ≤ x by [[AffineConstructive.interfaces.orders.above_bottom]] and x ≤ x. The second holds because x is an argument of the join.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.lattices.meet_sl_order_meet_sl","base":"meet_sl_order_meet_sl","kind":"def","start":147,"body":null,"status":"ok","short":{"text":"A meet semilattice order is an algebraic meet semilattice","status":"ok"},"long":{"text":"The order-theoretic meet, a greatest lower bound, satisfies the algebraic laws: ⊓ is associative, commutative and idempotent. The proof is no proof at all: a meet semilattice order on L is a join semilattice order on L ᵒᵖ, and [[AffineConstructive.orders.lattices.join_sl_order_join_sl]] there gives a join semilattice whose operation is the meet of L.\n\nDeclared a coercion, so that the algebraic laws of [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]] are available for any meet semilattice order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.bounded_meet_sl_order_bounded_meet_sl","base":"bounded_meet_sl_order_bounded_meet_sl","kind":"def","start":149,"body":[150,152],"status":"ok","short":{"text":"A bounded meet semilattice order is an algebraic bounded meet semilattice, with ⊤ the identity of ⊓","status":"ok"},"proof":[{"text":"A bounded meet semilattice order on L is a bounded join semilattice order on the opposite order. On that order, [[AffineConstructive.orders.lattices.bounded_join_sl_order_bounded_join_sl]] gives an algebraic bounded join semilattice, and read back on L this is the bounded meet semilattice.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_l_iff","base":"join_l_iff","kind":"prf","start":157,"body":[158,168],"status":"ok","short":{"text":"In a join semilattice order, y ≤ x if and only if x ⊔ y = x","status":"ok"},"proof":[{"text":"The equivalence is proved as two implications.","status":"ok","from":0,"to":1},{"text":"From y ≤ x to x ⊔ y = x: by pseudo-antisymmetry, it suffices to show x ⊔ y ≤ x and x ≤ x ⊔ y. The second factor holds outright by [[AffineConstructive.interfaces.orders.join_ub_l]], so it is dropped from the tensor. By [[AffineConstructive.interfaces.orders.join_lub]], x ⊔ y ≤ x reduces to x ≤ x and y ≤ x. The first is reflexivity, and the second is the hypothesis, used once.","status":"ok","from":2,"to":6},{"text":"From x ⊔ y = x to y ≤ x: since y ≤ x ⊔ y by [[AffineConstructive.interfaces.orders.join_ub_r]], transitivity makes it enough to show x ⊔ y ≤ x. This follows from the equation by [[AffineConstructive.orders.orders.eq_le]].","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.orders.lattices.join_l","base":"join_l","kind":"prf","start":169,"body":[170,172],"status":"ok","short":{"text":"If y ≤ x then x ⊔ y = x","status":"ok"},"proof":[{"text":"This is the forward direction of [[AffineConstructive.orders.lattices.join_l_iff]], applied to a proof of y ≤ x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_r_iff","base":"join_r_iff","kind":"prf","start":173,"body":[174,177],"status":"ok","short":{"text":"In a join semilattice order, x ≤ y if and only if x ⊔ y = y","status":"ok"},"proof":[{"text":"Commute the join, so that the equation to characterise reads y ⊔ x = y.","status":"ok","from":0,"to":1},{"text":"This is [[AffineConstructive.orders.lattices.join_l_iff]] with the roles of x and y exchanged: x ≤ y if and only if y ⊔ x = y.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.lattices.join_r","base":"join_r","kind":"prf","start":178,"body":[179,181],"status":"ok","short":{"text":"If x ≤ y then x ⊔ y = y","status":"ok"},"proof":[{"text":"Apply the forward direction of [[AffineConstructive.orders.lattices.join_r_iff]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_ne_l_iff","base":"join_ne_l_iff","kind":"def","start":182,"body":null,"status":"ok","short":{"text":"In a join semilattice order, x < y if and only if x ⊔ y ≠ x","status":"ok"},"long":{"text":"The dual reading of [[AffineConstructive.orders.lattices.join_l_iff]]: negating both sides of the affine equivalence between y ≤ x and x ⊔ y = x, by [[AffineConstructive.logic.aprop.acontra_iff]], gives an equivalence between the strict order x < y, the negation of y ≤ x, and the inequality x ⊔ y ≠ x, an apartness when the set is strong.\n\nIt is the affine bonus of [[AffineConstructive.orders.lattices.join_l_iff]]: the equivalence carries its contrapositive, and this definition names it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.join_ne_r_iff","base":"join_ne_r_iff","kind":"def","start":183,"body":null,"status":"ok","short":{"text":"y < x if and only if x ⊔ y ≠ y, the dual of join_r_iff","status":"ok"},"long":{"text":"The strict form of [[AffineConstructive.orders.lattices.join_r_iff]]. The affine equivalence x ≤ y ⧟ x ⊔ y = y has a dual on each side: the dual of x ≤ y is the strict order y < x, and the dual of the equality is the inequality x ⊔ y ≠ y. Negating both sides of the equivalence gives this statement. When L is strong, the right side is an apartness, so y lies strictly below x exactly when joining x to y moves y away from itself.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.join_order_preserving","base":"join_order_preserving","kind":"prf","start":184,"body":[185,193],"status":"ok","short":{"text":"The join is order preserving: x₁ ≤ x₂ ⊠ y₁ ≤ y₂ implies x₁ ⊔ y₁ ≤ x₂ ⊔ y₂","status":"ok"},"proof":[{"text":"An order-preserving map consists of the weak poset structures on both sides, which are found automatically for L ⊗ L and L, together with monotonicity. Monotonicity remains to be shown.","status":"ok","from":0,"to":1},{"text":"Fix pairs (x₁, y₁) and (x₂, y₂). On the tensor product the order is componentwise, combined by ⊠, so the goal is that x₁ ≤ x₂ ⊠ y₁ ≤ y₂ implies x₁ ⊔ y₁ ≤ x₂ ⊔ y₂.","status":"ok","from":2,"to":3},{"text":"By the least-upper-bound property [[AffineConstructive.interfaces.orders.join_lub]], it suffices to show both x₁ ≤ x₂ ⊔ y₂ and y₁ ≤ x₂ ⊔ y₂.","status":"ok","from":4,"to":4},{"text":"Each hypothesis meets its own transitivity step: since x₂ ≤ x₂ ⊔ y₂ ([[AffineConstructive.interfaces.orders.join_ub_l]]) and y₂ ≤ x₂ ⊔ y₂ ([[AffineConstructive.interfaces.orders.join_ub_r]]), the first target follows from x₁ ≤ x₂ and the second from y₁ ≤ y₂. What remains is exactly the hypothesis, with each factor used once.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.orders.lattices.le_join_iff_l","base":"le_join_iff_l","kind":"prf","start":194,"body":[195,204],"status":"ok","short":{"text":"If a ≤ x, then a ⊔ c ≤ x if and only if c ≤ x","status":"ok"},"proof":[{"text":"Assume a ≤ x and prove the two implications separately.","status":"ok","from":0,"to":2},{"text":"Forward: by transitivity through a ⊔ c, c ≤ x follows from c ≤ a ⊔ c together with a ⊔ c ≤ x. The first factor holds by [[AffineConstructive.interfaces.orders.join_ub_r]], so it can be dropped from the tensor, leaving the hypothesis.","status":"ok","from":3,"to":5},{"text":"Backward: by [[AffineConstructive.interfaces.orders.join_lub]], a ⊔ c ≤ x follows from a ≤ x ⊠ c ≤ x. The factor a ≤ x is the assumption and can be dropped, leaving c ≤ x, which is the hypothesis.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.orders.lattices.le_join_iff_r","base":"le_join_iff_r","kind":"prf","start":205,"body":[206,215],"status":"ok","short":{"text":"If c ≤ x, then a ⊔ c ≤ x if and only if a ≤ x","status":"ok"},"proof":[{"text":"Assume c ≤ x and prove the two implications separately.","status":"ok","from":0,"to":2},{"text":"Forward: by transitivity through a ⊔ c, a ≤ x follows from a ≤ a ⊔ c together with a ⊔ c ≤ x. The first factor holds by [[AffineConstructive.interfaces.orders.join_ub_l]] and drops out of the tensor.","status":"ok","from":3,"to":5},{"text":"Backward: by [[AffineConstructive.interfaces.orders.join_lub]], a ⊔ c ≤ x follows from a ≤ x ⊠ c ≤ x. The second factor is the assumption c ≤ x and drops out, leaving the hypothesis a ≤ x.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.orders.lattices.join_le_join_iff_l","base":"join_le_join_iff_l","kind":"def","start":216,"body":null,"status":"ok","short":{"text":"a ⊔ c ≤ a ⊔ b if and only if c ≤ a ⊔ b","status":"ok"},"long":{"text":"The case x = a ⊔ b of [[AffineConstructive.orders.lattices.le_join_iff_l]], where the side condition a ≤ a ⊔ b holds by [[AffineConstructive.interfaces.orders.join_ub_l]]. Above a, joining with a changes nothing, so comparing a ⊔ c with a ⊔ b comes down to comparing c with a ⊔ b. As an affine equivalence it also says that a ⊔ b < a ⊔ c exactly when a ⊔ b < c.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.join_le_join_iff_r","base":"join_le_join_iff_r","kind":"def","start":217,"body":null,"status":"ok","short":{"text":"c ⊔ b ≤ a ⊔ b if and only if c ≤ a ⊔ b","status":"ok"},"long":{"text":"The case x = a ⊔ b of [[AffineConstructive.orders.lattices.le_join_iff_r]], where the side condition b ≤ a ⊔ b holds by [[AffineConstructive.interfaces.orders.join_ub_r]]. It is the mirror image of [[AffineConstructive.orders.lattices.join_le_join_iff_l]], with the common joinand on the right.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.join_le_join_l_alt","base":"join_le_join_l_alt","kind":"prf","start":218,"body":[219,222],"status":"ok","short":{"text":"If c ≤ a ⊔ b then a ⊔ c ≤ a ⊔ b","status":"ok"},"proof":[{"text":"Assume c ≤ a ⊔ b. By [[AffineConstructive.orders.lattices.join_le_join_iff_l]], a ⊔ c ≤ a ⊔ b is equivalent to this assumption.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.lattices.join_le_join_r_alt","base":"join_le_join_r_alt","kind":"prf","start":223,"body":[224,227],"status":"ok","short":{"text":"If c ≤ a ⊔ b then c ⊔ b ≤ a ⊔ b","status":"ok"},"proof":[{"text":"Assume c ≤ a ⊔ b. By [[AffineConstructive.orders.lattices.join_le_join_iff_r]], c ⊔ b ≤ a ⊔ b is equivalent to this assumption.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.lattices.join_sl_directed","base":"join_sl_directed","kind":"prf","start":228,"body":[229,233],"status":"ok","short":{"text":"An inhabited join semilattice order is up-directed, with x ⊔ y as common upper bound","status":"ok"},"proof":[{"text":"Being up-directed requires a weak poset, which is inhabited, and in which any two elements have a common upper bound. The first two are already available, so only the upper bound remains.","status":"ok","from":0,"to":1},{"text":"Fix x and y and take x ⊔ y as the witness. It lies above x by [[AffineConstructive.interfaces.orders.join_ub_l]] and above y by [[AffineConstructive.interfaces.orders.join_ub_r]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.lattices.bounded_join_sl_directed","base":"bounded_join_sl_directed","kind":"def","start":236,"body":null,"status":"ok","short":{"text":"A bounded join semilattice order is up-directed","status":"ok"},"long":{"text":"A bounded join semilattice order is inhabited by ⊥, so [[AffineConstructive.orders.lattices.join_sl_directed]] applies: any two elements have x ⊔ y as a common upper bound. Declared as a coercion, so a bounded join semilattice order can be used wherever an up-directed order is asked for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_l_iff","base":"meet_l_iff","kind":"def","start":240,"body":null,"status":"ok","short":{"text":"x ≤ y if and only if x ⊓ y = x","status":"ok"},"long":{"text":"The order of a meet semilattice order recovered from its meet: x lies below y exactly when meeting with y leaves x unchanged. It is [[AffineConstructive.orders.lattices.join_l_iff]] read in the opposite order, where the meet becomes the join. Being an affine equivalence, it relates the duals too: y < x exactly when x ⊓ y ≠ x, which is [[AffineConstructive.orders.lattices.meet_ne_l_iff]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_r_iff","base":"meet_r_iff","kind":"def","start":241,"body":null,"status":"ok","short":{"text":"y ≤ x if and only if x ⊓ y = y","status":"ok"},"long":{"text":"The mirror image of [[AffineConstructive.orders.lattices.meet_l_iff]], with the smaller element on the right: y lies below x exactly when x ⊓ y = y. It is [[AffineConstructive.orders.lattices.join_r_iff]] in the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_l","base":"meet_l","kind":"def","start":242,"body":null,"status":"ok","short":{"text":"In a meet semilattice order, x ≤ y gives x ⊓ y = x","status":"ok"},"long":{"text":"The forward direction of [[AffineConstructive.orders.lattices.meet_l_iff]], stated as a base-logic implication: a proof of x ≤ y yields a proof of x ⊓ y = x. This form rewrites a meet away once the comparison is known. It is obtained from [[AffineConstructive.orders.lattices.join_l]] in the opposite order. In the recorded development one proof step in this file uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_r","base":"meet_r","kind":"def","start":243,"body":null,"status":"ok","short":{"text":"If y ≤ x then x ⊓ y = y","status":"ok"},"long":{"text":"The forward direction of [[AffineConstructive.orders.lattices.meet_r_iff]], as a base-logic implication: once y ≤ x is proved, x ⊓ y may be replaced by y. Obtained from [[AffineConstructive.orders.lattices.join_r]] in the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_ne_l_iff","base":"meet_ne_l_iff","kind":"def","start":244,"body":null,"status":"ok","short":{"text":"y < x if and only if x ⊓ y ≠ x","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.lattices.meet_l_iff]]: negating both sides of x ≤ y ⧟ x ⊓ y = x turns x ≤ y into its dual, the strict order y < x, and the equality into the inequality x ⊓ y ≠ x. In a strong set the inequality is an apartness, so x lies strictly above y exactly when meeting with y moves x apart from itself.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_ne_r_iff","base":"meet_ne_r_iff","kind":"def","start":245,"body":null,"status":"ok","short":{"text":"x < y if and only if x ⊓ y ≠ y","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.orders.lattices.meet_r_iff]], obtained by negating both sides of y ≤ x ⧟ x ⊓ y = y: the strict order x < y on one side and the inequality x ⊓ y ≠ y on the other.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_order_preserving","base":"meet_order_preserving","kind":"prf","start":246,"body":[247,253],"status":"ok","short":{"text":"The meet is order preserving: x₁ ≤ x₂ ⊠ y₁ ≤ y₂ implies x₁ ⊓ y₁ ≤ x₂ ⊓ y₂","status":"ok"},"proof":[{"text":"It suffices to prove monotonicity pointwise ([[AffineConstructive.orders.maps.alt_Build_OrderPreserving]]). Fix pairs (x₁, y₁) and (x₂, y₂) and unfold the componentwise order, so that the goal is that x₁ ≤ x₂ ⊠ y₁ ≤ y₂ implies x₁ ⊓ y₁ ≤ x₂ ⊓ y₂.","status":"ok","from":0,"to":3},{"text":"In the opposite order the meet is the join, so this is the monotonicity of the join on Lᵒᵖ ([[AffineConstructive.orders.lattices.join_order_preserving]]), applied to the pairs taken in the reverse order.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.lattices.le_meet_iff_l","base":"le_meet_iff_l","kind":"def","start":254,"body":null,"status":"ok","short":{"text":"If x ≤ a, then x ≤ a ⊓ c if and only if x ≤ c","status":"ok"},"long":{"text":"Below a, meeting with a is invisible: for x below a, being below a ⊓ c is the same as being below c. In other words a ⊓ (−) is right adjoint to the inclusion of the principal downset of a. It is [[AffineConstructive.orders.lattices.le_join_iff_l]] in the opposite order. The hypothesis x ≤ a is a base-logic premise; the conclusion is an affine equivalence, so the strict comparisons a ⊓ c < x and c < x agree as well.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.le_meet_iff_r","base":"le_meet_iff_r","kind":"def","start":255,"body":null,"status":"ok","short":{"text":"If x ≤ c, then x ≤ a ⊓ c if and only if x ≤ a","status":"ok"},"long":{"text":"The mirror image of [[AffineConstructive.orders.lattices.le_meet_iff_l]], with the known bound on the right: for x below c, being below a ⊓ c is the same as being below a. It is [[AffineConstructive.orders.lattices.le_join_iff_r]] in the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_le_meet_iff_l","base":"meet_le_meet_iff_l","kind":"def","start":256,"body":null,"status":"ok","short":{"text":"a ⊓ b ≤ a ⊓ c if and only if a ⊓ b ≤ c","status":"ok"},"long":{"text":"The case x = a ⊓ b of [[AffineConstructive.orders.lattices.le_meet_iff_l]], where the side condition a ⊓ b ≤ a holds by [[AffineConstructive.interfaces.orders.meet_lb_l]]. Comparing a ⊓ b with a ⊓ c comes down to comparing it with c. It is [[AffineConstructive.orders.lattices.join_le_join_iff_l]] in the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_le_meet_iff_r","base":"meet_le_meet_iff_r","kind":"def","start":257,"body":null,"status":"ok","short":{"text":"a ⊓ b ≤ c ⊓ b if and only if a ⊓ b ≤ c","status":"ok"},"long":{"text":"The case x = a ⊓ b of [[AffineConstructive.orders.lattices.le_meet_iff_r]], where a ⊓ b ≤ b holds by [[AffineConstructive.interfaces.orders.meet_lb_r]]; the mirror image of [[AffineConstructive.orders.lattices.meet_le_meet_iff_l]] with the common meetand on the right. It is [[AffineConstructive.orders.lattices.join_le_join_iff_r]] in the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive

.orders.lattices.meet_le_meet_l_alt","base":"meet_le_meet_l_alt","kind":"def","start":258,"body":null,"status":"ok","short":{"text":"If a ⊓ b ≤ c then a ⊓ b ≤ a ⊓ c","status":"ok"},"long":{"text":"The backward direction of [[AffineConstructive.orders.lattices.meet_le_meet_iff_l]] as a base-logic implication: from a proof that a ⊓ b lies below c, a proof that it lies below a ⊓ c. It is [[AffineConstructive.orders.lattices.join_le_join_l_alt]] in the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_le_meet_r_alt","base":"meet_le_meet_r_alt","kind":"def","start":259,"body":null,"status":"ok","short":{"text":"If a ⊓ b ≤ c then a ⊓ b ≤ c ⊓ b","status":"ok"},"long":{"text":"The backward direction of [[AffineConstructive.orders.lattices.meet_le_meet_iff_r]] as a base-logic implication: from a ⊓ b ≤ c, the bound a ⊓ b ≤ c ⊓ b. It is [[AffineConstructive.orders.lattices.join_le_join_r_alt]] in the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.meet_sl_directed","base":"meet_sl_directed","kind":"def","start":260,"body":null,"status":"ok","short":{"text":"An inhabited meet semilattice order is down-directed, with x ⊓ y as common lower bound","status":"ok"},"long":{"text":"Any two elements x, y of a meet semilattice order have the common lower bound x ⊓ y, so an inhabited meet semilattice order is down-directed. It is [[AffineConstructive.orders.lattices.join_sl_directed]] in the opposite order, where up-directed becomes down-directed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.bounded_meet_sl_directed","base":"bounded_meet_sl_directed","kind":"def","start":263,"body":null,"status":"ok","short":{"text":"A bounded meet semilattice order is down-directed","status":"ok"},"long":{"text":"A bounded meet semilattice order is inhabited by ⊤, so [[AffineConstructive.orders.lattices.meet_sl_directed]] applies. Declared as a coercion, so such an order can be used wherever a down-directed order is asked for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.below_bottom","base":"below_bottom","kind":"prf","start":264,"body":[265,267],"status":"ok","short":{"text":"In a bounded join semilattice order, x ≤ ⊥ if and only if x = ⊥","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.lattices.join_l_iff]], x ≤ ⊥ is equivalent to ⊥ ⊔ x = ⊥. Since ⊥ is the identity of the join ([[AffineConstructive.theory.lattices.join_bot_l]]), the left side equals x, and the equivalence becomes x = ⊥.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.above_top","base":"above_top","kind":"prf","start":268,"body":[269,271],"status":"ok","short":{"text":"In a bounded meet semilattice order, ⊤ ≤ x if and only if x = ⊤","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.orders.lattices.below_bottom]] read in the opposite order, where ⊤ becomes the bottom element and the meet becomes the join.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.from_algebraic_bounded_join_sl_order","base":"from_algebraic_bounded_join_sl_order","kind":"prf","start":272,"body":[273,278],"status":"ok","short":{"text":"A join semilattice order whose ⊥ is an identity for ⊔ is a bounded join semilattice order","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.lattices.Build_BoundedJoinSemiLatticeOrder]], it suffices to show that ⊥ lies below every element. Fix x.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.orders.lattices.join_l_iff]], ⊥ ≤ x is equivalent to x ⊔ ⊥ = x. This equation holds because ⊥ is the identity for ⊔ ([[AffineConstructive.theory.lattices.join_bot_r]]).","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.lattices.from_algebraic_bounded_meet_sl_order","base":"from_algebraic_bounded_meet_sl_order","kind":"prf","start":279,"body":[280,282],"status":"ok","short":{"text":"A meet semilattice order whose ⊤ is an identity for ⊓ is a bounded meet semilattice order","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.orders.lattices.from_algebraic_bounded_join_sl_order]] applied to the opposite order. There the meet is the join and ⊤ is the bottom element.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.lattice_order_lattice","base":"lattice_order_lattice","kind":"inst","start":284,"body":[285,287],"status":"ok","short":{"text":"A lattice order is an algebraic lattice: the meet and join satisfy the absorption laws","status":"ok"},"proof":[{"text":"The two semilattice parts of the structure are already available: ⊔ is an algebraic join semilattice by [[AffineConstructive.orders.lattices.join_sl_order_join_sl]], and ⊓ is an algebraic meet semilattice by [[AffineConstructive.orders.lattices.meet_sl_order_meet_sl]]. That leaves the two absorption laws. For each, fix x and y. Pseudo-antisymmetry splits the equation into two inequalities. Each inequality follows from the bound properties of the meet and the join, such as x ≤ x ⊔ y and the least-upper-bound property [[AffineConstructive.interfaces.orders.join_lub]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.meet_join_distr_l_le","base":"meet_join_distr_l_le","kind":"prf","start":288,"body":[289,293],"status":"ok","short":{"text":"In a lattice order, (x ⊓ y) ⊔ (x ⊓ z) ≤ x ⊓ (y ⊔ z)","status":"ok"},"proof":[{"text":"The right side is a meet, so by its greatest-lower-bound property it suffices to show that (x ⊓ y) ⊔ (x ⊓ z) lies below x and below y ⊔ z. The left side is a join, so by [[AffineConstructive.interfaces.orders.join_lub]] each of these bounds reduces to the same bound for x ⊓ y and for x ⊓ z. The bounds by x follow because the meet lies below each argument. This leaves x ⊓ y ≤ y ⊔ z and x ⊓ z ≤ y ⊔ z.","status":"ok","from":0,"to":1},{"text":"The first holds by transitivity through y: x ⊓ y ≤ y and y ≤ y ⊔ z.","status":"ok","from":2,"to":2},{"text":"The second holds by transitivity through z: x ⊓ z ≤ z and z ≤ y ⊔ z.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.lattices.join_meet_distr_l_le","base":"join_meet_distr_l_le","kind":"prf","start":294,"body":[295,297],"status":"ok","short":{"text":"In a lattice order, x ⊔ (y ⊓ z) ≤ (x ⊔ y) ⊓ (x ⊔ z)","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.orders.lattices.meet_join_distr_l_le]] in the opposite lattice order, where meet and join exchange roles.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.Build_DistributiveLatticeOrder","base":"Build_DistributiveLatticeOrder","kind":"prf","start":298,"body":[299,304],"status":"ok","short":{"text":"A lattice order with (x ⊔ y) ⊓ (x ⊔ z) ≤ x ⊔ (y ⊓ z) for all x, y, z is distributive","status":"ok"},"proof":[{"text":"Assume the inequality (x ⊔ y) ⊓ (x ⊔ z) ≤ x ⊔ (y ⊓ z) for all x, y, z. By [[AffineConstructive.theory.lattices.alt_Build_DistributiveLattice]], it suffices to show that join distributes over meet on the left. Fix x, y and z.","status":"ok","from":0,"to":3},{"text":"By pseudo-antisymmetry, the equation x ⊔ (y ⊓ z) = (x ⊔ y) ⊓ (x ⊔ z) splits into two inequalities. One direction holds in every lattice order ([[AffineConstructive.orders.lattices.join_meet_distr_l_le]]), and the other is the assumption.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.lattices.lattice_order_distr","base":"lattice_order_distr","kind":"prf","start":305,"body":[306,321],"status":"ok","short":{"text":"A linear, refutative lattice order is a distributive lattice","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.lattices.Build_DistributiveLatticeOrder]], it suffices to show (x ⊔ y) ⊓ (x ⊔ z) ≤ x ⊔ (y ⊓ z) for arbitrary x, y, z.","status":"ok","from":0,"to":2},{"text":"The order is refutative, so the goal is refutative, and x ≤ y is affirmatively decidable. By [[AffineConstructive.logic.refutative.refutative_by_aff_cases]], the proof may therefore split into the cases x ≤ y and y < x. Linearity weakens y < x to y ≤ x ([[AffineConstructive.orders.orders.lt_le]]). The joins then simplify: x ⊔ y becomes y in the first case ([[AffineConstructive.orders.lattices.join_r]]) and x in the second ([[AffineConstructive.orders.lattices.join_l]]). The same split on x ≤ z gives four cases.","status":"ok","from":3,"to":3},{"text":"When x ≤ y and x ≤ z, the left side is y ⊓ z, which lies below x ⊔ (y ⊓ z).","status":"ok","from":4,"to":5},{"text":"When x ≤ y and z ≤ x, the left side is y ⊓ x, which is x by [[AffineConstructive.orders.lattices.meet_r]]. And x lies below x ⊔ (y ⊓ z).","status":"ok","from":6,"to":8},{"text":"When y ≤ x and x ≤ z, the left side is x ⊓ z, which is x by [[AffineConstructive.orders.lattices.meet_l]]. Again x lies below x ⊔ (y ⊓ z).","status":"ok","from":9,"to":11},{"text":"When y ≤ x and z ≤ x, the left side is x ⊓ x, which is x by idempotency ([[AffineConstructive.interfaces.common_props.binary_idempotency]]). The bound x ≤ x ⊔ (y ⊓ z) finishes the proof.","status":"ok","from":12,"to":15}]},{"name":"AffineConstructive.orders.lattices.bounded_lattice_order_bounded_lattice","base":"bounded_lattice_order_bounded_lattice","kind":"prf","start":322,"body":[323,325],"status":"ok","short":{"text":"A bounded lattice order is an algebraic bounded lattice","status":"ok"},"proof":[{"text":"Each component of the algebraic structure is already known. The underlying lattice order is an algebraic lattice ([[AffineConstructive.orders.lattices.lattice_order_lattice]]). The bounded join and meet semilattice orders give the identities for ⊥ and ⊤ ([[AffineConstructive.orders.lattices.bounded_join_sl_order_bounded_join_sl]], [[AffineConstructive.orders.lattices.bounded_meet_sl_order_bounded_meet_sl]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.coercion:lattice_order_lattice","base":"coercion:lattice_order_lattice","kind":"coercion","start":327,"body":null,"status":"ok","short":{"text":"A lattice order counts as an algebraic lattice, so the meet, join and absorption laws apply","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.coercion:bounded_lattice_order_bounded_lattice","base":"coercion:bounded_lattice_order_bounded_lattice","kind":"coercion","start":328,"body":null,"status":"ok","short":{"text":"A bounded lattice order counts as an algebraic bounded lattice, so its laws for ⊤ and ⊥ apply","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.from_meet_semilattice.let:inst","base":"let:inst","kind":"let","start":334,"body":[335,344],"status":"ok","short":{"text":"The order defined by x ⊓ y = x is strongly transitive, from strong transitivity of equality; a hypothesis for the section's proofs","status":"ok"},"proof":[{"text":"Fix x, y and z, and read each order relation as its defining equation. What remains is to show that x ⊓ y = x and y ⊓ z = y, joined by the additive conjunction, imply x ⊓ z = x.","status":"ok","from":0,"to":1},{"text":"By strong transitivity of equality through x ⊓ y, it suffices to prove x ⊓ z = x ⊓ y and x ⊓ y = x, each from the whole hypothesis. Because the conjunction is additive, the second conjunct can choose the first equation of the hypothesis. This leaves x ⊓ z = x ⊓ y.","status":"ok","from":2,"to":3},{"text":"Rework the two equations of the hypothesis. Meeting both sides of x ⊓ y = x with z, and then reversing the result, gives x ⊓ z = x ⊓ y ⊓ z. Meeting both sides of y ⊓ z = y with x gives x ⊓ (y ⊓ z) = x ⊓ y, and by associativity this is x ⊓ y ⊓ z = x ⊓ y.","status":"ok","from":4,"to":7},{"text":"The two equations now chain through x ⊓ y ⊓ z, and strong transitivity of equality gives x ⊓ z = x ⊓ y.","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.orders.lattices.PreOrder_instance_0","base":"PreOrder_instance_0","kind":"inst","start":345,"body":[346,351],"status":"ok","short":{"text":"An order on a strong meet semilattice with x ≤ y ⧟ x ⊓ y = x is a preorder","status":"ok"},"proof":[{"text":"Transitivity follows from the assumed strong transitivity. This leaves reflexivity.","status":"ok","from":0,"to":1},{"text":"Fix x. By the assumed characterisation of the order, x ≤ x is equivalent to x ⊓ x = x, which is the idempotency of the meet ([[AffineConstructive.interfaces.common_props.binary_idempotency]]).","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.lattices.Poset_instance_0","base":"Poset_instance_0","kind":"inst","start":352,"body":[353,365],"status":"ok","short":{"text":"An order on a strong meet semilattice with x ≤ y ⧟ x ⊓ y = x is a partial order","status":"ok"},"proof":[{"text":"Build the poset with [[AffineConstructive.orders.orders.alt_Build_Poset]]. Reflexivity and transitivity come from the preorder already established on L. Two things are left to show: equality is contained in the order, and the order is antisymmetric.","status":"ok","from":0,"to":1},{"text":"Let x and y be points with x = y. Applying x ⊓ – to this equality gives x ⊓ x = x ⊓ y, and idempotency turns the left side into x. By the hypothesis characterising the order, x ≤ y means x ⊓ y = x, which is the equality just obtained read backwards, so symmetry finishes.","status":"ok","from":2,"to":6},{"text":"For antisymmetry, fix x and y. The hypothesis characterising the order turns x ≤ y and y ≤ x into x ⊓ y = x and y ⊓ x = y. Read the first backwards and apply commutativity to the second: the hypothesis becomes x = x ⊓ y ∧ x ⊓ y = y. This hypothesis is an additive conjunction, so ordinary transitivity, which needs both equalities as a tensor, does not apply. Equality on a strong set is strongly transitive, and [[AffineConstructive.interfaces.aprop.strong_transitivity]] gives x = y from the additive conjunction.","status":"ok","from":7,"to":12}]},{"name":"AffineConstructive.orders.lattices.from_meet_sl_strong","base":"from_meet_sl_strong","kind":"prf","start":366,"body":[367,369],"status":"ok","short":{"text":"On a strong meet semilattice, an order with x ≤ y ⧟ x ⊓ y = x is a strong poset","status":"ok"},"proof":[{"text":"A strong poset is a poset whose carrier is a strong set. The poset structure is [[AffineConstructive.orders.lattices.Poset_instance_0]], and the strong set is given in context.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.from_meet_sl_meet_order","base":"from_meet_sl_meet_order","kind":"inst","start":370,"body":[371,388],"status":"ok","short":{"text":"On a strong meet semilattice, the order given by x ⊓ y = x is a meet semilattice order","status":"ok"},"proof":[{"text":"A meet semilattice order needs a poset and the three axioms of a greatest lower bound. The poset is the one from [[AffineConstructive.orders.lattices.Poset_instance_0]].","status":"ok","from":0,"to":3},{"text":"Fix x and y. To show x ⊓ y ≤ x, show (x ⊓ y) ⊓ x = x ⊓ y. Commute, reassociate to x ⊓ x ⊓ y and apply idempotency, x ⊓ x = x.","status":"ok","from":4,"to":6},{"text":"Fix x and y. To show x ⊓ y ≤ y, show (x ⊓ y) ⊓ y = x ⊓ y. Reassociating gives x ⊓ (y ⊓ y), and idempotency finishes.","status":"ok","from":7,"to":9},{"text":"Fix x, y and z. In terms of meets, the hypotheses are z ⊓ x = z and z ⊓ y = z, and the goal z ⊓ (x ⊓ y) = z reassociates to (z ⊓ x) ⊓ y = z.","status":"ok","from":10,"to":13},{"text":"By [[AffineConstructive.interfaces.aprop.transitivity]] through z ⊓ y, it suffices to prove (z ⊓ x) ⊓ y = z ⊓ y ⊠ z ⊓ y = z, with each factor coming from its own hypothesis. The second factor is the hypothesis z ⊓ y = z itself. The first follows from z ⊓ x = z by applying – ⊓ y.","status":"ok","from":14,"to":17}]},{"name":"AffineConstructive.orders.lattices.from_join_sl_strong","base":"from_join_sl_strong","kind":"prf","start":394,"body":[395,399],"status":"ok","short":{"text":"On a strong join semilattice, an order with y ≤ x ⧟ x ⊔ y = x is a strong poset","status":"ok"},"proof":[{"text":"Regard L as the opposite of its opposite. By [[AffineConstructive.orders.orders.StrongPoset_op]], it suffices to show that Lᵒᵖ is a strong poset. In Lᵒᵖ the join is a meet, and the hypothesis y ≤ x ⧟ x ⊔ y = x is the characterisation of the opposite order by meets, so [[AffineConstructive.orders.lattices.from_meet_sl_strong]] applies.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.orders.lattices.from_join_sl_join_order","base":"from_join_sl_join_order","kind":"prf","start":400,"body":[401,405],"status":"ok","short":{"text":"On a strong join semilattice, the order given by x ⊔ y = x is a join semilattice order","status":"ok"},"proof":[{"text":"Regard L as the opposite of its opposite. By [[AffineConstructive.orders.lattices.JoinSemiLatticeOrder_op]], it suffices to show that Lᵒᵖ is a meet semilattice order. There the join of L acts as the meet and the hypothesis characterises the opposite order by it, so [[AffineConstructive.orders.lattices.from_meet_sl_meet_order]] applies.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.orders.lattices.from_lattice_meet.let:inst","base":"let:inst","kind":"let","start":411,"body":null,"status":"ok","short":{"text":"The meet semilattice order that x ⊓ y = x gives, from [[AffineConstructive.orders.lattices.from_meet_sl_meet_order]], used as the meet half of the lattice order","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.lattices.from_lattice_meet_order","base":"from_lattice_meet_order","kind":"prf","start":412,"body":[413,427],"status":"ok","short":{"text":"On a strong lattice, the order given by x ⊓ y = x is a lattice order","status":"ok"},"proof":[{"text":"The meet semilattice order is the instance already in context, so only the join half is left. By [[AffineConstructive.orders.lattices.from_join_sl_join_order]], it suffices to show y ≤ x ⧟ x ⊔ y = x for all x and y.","status":"ok","from":0,"to":2},{"text":"Fix x and y. Rewrite y ≤ x as y ⊓ x = y, then prove the two implications separately.","status":"ok","from":3,"to":5},{"text":"Suppose y ⊓ x = y. Commute the meet, then apply x ⊔ – to obtain x ⊔ (x ⊓ y) = x ⊔ y. Absorption reduces the left side to x, so x = x ⊔ y, and symmetry finishes.","status":"ok","from":6,"to":9},{"text":"Conversely, suppose x ⊔ y = x. Commute the join, then apply y ⊓ – to obtain y ⊓ (y ⊔ x) = y ⊓ x. Absorption reduces the left side to y, so y = y ⊓ x, and symmetry finishes.","status":"ok","from":10,"to":14}]},{"name":"AffineConstructive.orders.lattices.from_lattice_join_order","base":"from_lattice_join_order","kind":"prf","start":433,"body":[434,438],"status":"ok","short":{"text":"A strong algebraic lattice whose order satisfies y ≤ x ⧟ x ⊔ y = x is a lattice order","status":"ok"},"proof":[{"text":"Regard L as the opposite of its opposite. By [[AffineConstructive.orders.lattices.LatticeOrder_op]], it suffices to show that Lᵒᵖ is a lattice order. The opposite lattice exchanges meet and join ([[AffineConstructive.theory.lattices.Lattice_op]]), so the hypothesis becomes the characterisation of the opposite order by meets, and [[AffineConstructive.orders.lattices.from_lattice_meet_order]] applies.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.orders.lattices.join_sl_mor_preserving","base":"join_sl_mor_preserving","kind":"inst","start":443,"body":[444,450],"status":"ok","short":{"text":"A join-semilattice morphism between join semilattice orders preserves the order","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]], it suffices to fix x and y and show that x ≤ y implies f x ≤ f y.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.orders.lattices.join_r_iff]] on both sides, the claim is that x ⊔ y = y implies f x ⊔ f y = f y. By [[AffineConstructive.theory.lattices.preserves_join]], f x ⊔ f y is f (x ⊔ y), so the claim follows because f preserves equality.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.orders.lattices.join_sl_mor_embedding","base":"join_sl_mor_embedding","kind":"prf","start":451,"body":[452,459],"status":"ok","short":{"text":"An injective join-semilattice morphism between join semilattice orders is an order embedding","status":"ok"},"proof":[{"text":"An order embedding preserves and reflects the order. Preservation is [[AffineConstructive.orders.lattices.join_sl_mor_preserving]], so reflection is left to show.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderReflecting]], it suffices to fix x and y and show that f x ≤ f y implies x ≤ y.","status":"ok","from":2,"to":3},{"text":"By [[AffineConstructive.orders.lattices.join_r_iff]] on both sides and [[AffineConstructive.theory.lattices.preserves_join]], the claim is that f (x ⊔ y) = f y implies x ⊔ y = y. This is the [[AffineConstructive.interfaces.set.injective]] property of f.","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.orders.lattices.meet_sl_mor_preserving","base":"meet_sl_mor_preserving","kind":"prf","start":464,"body":[465,468],"status":"ok","short":{"text":"A meet-semilattice morphism between meet semilattice orders preserves the order","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.op_order_preserving_iff]], it suffices to show that f preserves the opposite orders. On the opposites, the meets become joins and f is a join-semilattice morphism, so [[AffineConstructive.orders.lattices.join_sl_mor_preserving]] applies.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.lattices.meet_sl_mor_embedding","base":"meet_sl_mor_embedding","kind":"prf","start":469,"body":[470,473],"status":"ok","short":{"text":"An injective meet-semilattice morphism between meet semilattice orders is an order embedding","status":"ok"},"proof":[{"text":"Being an order embedding is invariant under passing to the opposite orders ([[AffineConstructive.orders.maps.op_order_embedding_iff]]), so it suffices to show that f is an order embedding from L ᵒᵖ to K ᵒᵖ.","status":"ok","from":0,"to":1},{"text":"On the opposite orders the meets become joins, and f becomes an injective join-semilattice morphism, so [[AffineConstructive.orders.lattices.join_sl_mor_embedding]] applies.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.lattices.join_sl_mor_preserving_flip","base":"join_sl_mor_preserving_flip","kind":"inst","start":478,"body":[479,481],"status":"ok","short":{"text":"A map turning joins into meets reverses the order","status":"ok"},"proof":[{"text":"Reversing the order of K turns its meet into a join, so f becomes a join-semilattice morphism from L to K ᵒᵖ. By [[AffineConstructive.orders.lattices.join_sl_mor_preserving]] it preserves the order into K ᵒᵖ, which is to say that it reverses the order of K.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.join_sl_mor_embedding_flip","base":"join_sl_mor_embedding_flip","kind":"prf","start":482,"body":[483,485],"status":"ok","short":{"text":"An injective map turning joins into meets is an order-reversing embedding","status":"ok"},"proof":[{"text":"Regarded as a map into K ᵒᵖ, whose join is the meet of K, f is an injective join-semilattice morphism. So by [[AffineConstructive.orders.lattices.join_sl_mor_embedding]] it is an order embedding into K ᵒᵖ, which is to say an order-reversing embedding into K.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.meet_sl_mor_preserving_flip","base":"meet_sl_mor_preserving_flip","kind":"inst","start":490,"body":[491,493],"status":"ok","short":{"text":"A map turning meets into joins reverses the order","status":"ok"},"proof":[{"text":"Reversing the order of K turns its join into a meet, so f becomes a meet-semilattice morphism from L to K ᵒᵖ. By [[AffineConstructive.orders.lattices.meet_sl_mor_preserving]] it preserves the order into K ᵒᵖ, which is to say that it reverses the order of K.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.meet_sl_mor_embedding_flip","base":"meet_sl_mor_embedding_flip","kind":"prf","start":494,"body":[495,497],"status":"ok","short":{"text":"An injective map turning meets into joins is an order-reversing embedding","status":"ok"},"proof":[{"text":"Regarded as a map into K ᵒᵖ, whose meet is the join of K, f is an injective meet-semilattice morphism. So by [[AffineConstructive.orders.lattices.meet_sl_mor_embedding]] it is an order embedding into K ᵒᵖ, which is to say an order-reversing embedding into K.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.preserves_join_lax","base":"preserves_join_lax","kind":"prf","start":499,"body":[500,502],"status":"ok","short":{"text":"An order-preserving map satisfies f x ⊔ f y ≤ f (x ⊔ y)","status":"ok"},"proof":[{"text":"Since f (x ⊔ y) is an upper bound of f x and of f y, it lies above their join by [[AffineConstructive.interfaces.orders.join_lub]]. Each bound comes from applying f, which preserves the order, to x ≤ x ⊔ y and to y ≤ x ⊔ y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.preserves_meet_lax","base":"preserves_meet_lax","kind":"prf","start":503,"body":[504,506],"status":"ok","short":{"text":"An order-preserving map satisfies f (x ⊓ y) ≤ f x ⊓ f y","status":"ok"},"proof":[{"text":"This is the dual of [[AffineConstructive.orders.lattices.preserves_join_lax]]. On the opposite orders the meets become joins and f still preserves the order, so the lemma for joins, applied there, gives the required inequality.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.preserves_join_lax2","base":"preserves_join_lax2","kind":"prf","start":507,"body":[508,510],"status":"ok","short":{"text":"An order-preserving map of two arguments sends the componentwise join above the join of values","status":"ok"},"proof":[{"text":"By [[AffineConstructive.interfaces.orders.join_lub]] it suffices to show that f (x₁ ⊔ y₁, x₂ ⊔ y₂) lies above both f (x₁, x₂) and f (y₁, y₂). Since f preserves the order, each of these reduces to an inequality of pairs, which holds componentwise because x₁ ≤ x₁ ⊔ y₁ and x₂ ≤ x₂ ⊔ y₂, and the same for y₁ and y₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.preserves_meet_lax2","base":"preserves_meet_lax2","kind":"prf","start":511,"body":[512,514],"status":"ok","short":{"text":"An order-preserving map of two arguments sends the componentwise meet below the meet of values","status":"ok"},"proof":[{"text":"By [[AffineConstructive.interfaces.orders.meet_glb]] it suffices to show that f (x₁ ⊓ y₁, x₂ ⊓ y₂) lies below both f (x₁, x₂) and f (y₁, y₂). Since f preserves the order, each of these reduces to an inequality of pairs, which holds componentwise because each meet lies below each of its arguments.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.order_preserving_join_sl_mor","base":"order_preserving_join_sl_mor","kind":"prf","start":518,"body":[519,533],"status":"ok","short":{"text":"From a linear order with refutative equality, an order-preserving map into a refutative order preserves joins","status":"ok"},"proof":[{"text":"A join-semilattice morphism is a map with f (x ⊔ y) = f x ⊔ f y. Fix x and y. By antisymmetry the equation splits into two inequalities.","status":"ok","from":0,"to":3},{"text":"For f (x ⊔ y) ≤ f x ⊔ f y, the order of K is refutative and equality on L is refutative, hence affirmatively decidable. So [[AffineConstructive.logic.refutative.refutative_by_aff_cases]] lets the proof split into the cases x = y and x ≠ y.","status":"ok","from":4,"to":5},{"text":"If x = y, rewrite x as y. Both sides then reduce to f y by idempotence of the join.","status":"ok","from":6,"to":8},{"text":"If x ≠ y, then x < y or y < x by [[AffineConstructive.orders.orders.ne_iff_lt]], since the order is linear. In either case the strictly smaller element can be replaced on the left by the larger one, and the join is monotone, so f (x ⊔ y) is at most f of the larger element. Applying idempotence, that value lies below f x ⊔ f y.","status":"ok","from":9,"to":11},{"text":"The reverse inequality f x ⊔ f y ≤ f (x ⊔ y) holds for every order-preserving map, by [[AffineConstructive.orders.lattices.preserves_join_lax]].","status":"ok","from":12,"to":14}]},{"name":"AffineConstructive.orders.lattices.order_preserving_meet_sl_mor","base":"order_preserving_meet_sl_mor","kind":"prf","start":539,"body":[540,542],"status":"ok","short":{"text":"From a linear order with refutative equality, an order-preserving map into a refutative order preserves meets","status":"ok"},"proof":[{"text":"This is the dual of [[AffineConstructive.orders.lattices.order_preserving_join_sl_mor]]. A meet on L or K is the join of the opposite order. Under the opposite orders, L is still linear ([[AffineConstructive.orders.orders.LinearOrder_op]]), K is still refutative ([[AffineConstructive.orders.orders.RefutativeOrder_op]]) and f is still order-preserving ([[AffineConstructive.orders.maps.op_order_preserving]]). So f, viewed as a map from L ᵒᵖ to K ᵒᵖ, preserves joins, and that statement is the claim that f preserves meets.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.lattices.order_preserving_lat_mor","base":"order_preserving_lat_mor","kind":"prf","start":545,"body":[546,548],"status":"ok","short":{"text":"From a linear order with refutative equality, an order-preserving map into a refutative lattice order is a lattice morphism","status":"ok"},"proof":[{"text":"A lattice morphism is a map that preserves meets and preserves joins. Both lattice orders are algebraic lattices by [[AffineConstructive.orders.lattices.lattice_order_lattice]]. The two halves of the claim are then [[AffineConstructive.orders.lattices.order_preserving_meet_sl_mor]] and [[AffineConstructive.orders.lattices.order_preserving_join_sl_mor]].","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.lattices":{"page":"../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.directed_sets":{"page":"directed_sets.html","short":"Directed preorders: their duality, the unit set, and tensor products","summary":"The file sets out the basic facts about directed preorders: inhabited preorders where any two elements have a common upper bound ([[UpDirected]]) or a common lower bound ([[DownDirected]]). The two notions are dual. A down-directed order is a preorder ([[DownDirected_preorder]]). Taking the opposite order swaps the two notions ([[UpDirected_op]], [[DownDirected_op]]), and the down-directed results come from the up-directed ones that way. The unit set is directed both ways. The tensor product X ⊗ Y of two up-directed or two down-directed sets is again directed in the same sense, ordered componentwise: the two common bounds pair into one, and the medial law [[aprod_medial]] puts the four order factors back together."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.logic.refutative":{"page":"../logic/refutative.html","short":"Excluded middle as a par, case analysis for refutative goals, and affirmative decidability","summary":"This file collects the classical reasoning that is valid when the conclusion is refutative. It proves the affine law of excluded middle P ⊞ Pᗮ, which holds as a par and not as a disjunction, and the related fact ?(P ∨ Pᗮ). Since a refutative Q follows from why not P whenever P ⊸ Q ([[refutative_by_why_not]]), these give elimination rules for refutative goals: case analysis on a par ([[refutative_apar_elim]]), on P or its negation ([[refutative_by_LEM]], [[refutative_by_cases]]), and proof by contradiction ([[refutative_by_contradiction]]). The file then defines [[Affirmative_Decidability]], which says that P ∨ Pᗮ is affirmative. When P has this property, the case split may use a base-logic function from P ∨ Pᗮ to the conclusion ([[refutative_by_aff_cases]]). Affirmative and refutative propositions, !P and ?P are all affirmatively decidable, and the property is preserved by negation, ∧, ∨, ⊠ and ⊞; these facts are registered as instances."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

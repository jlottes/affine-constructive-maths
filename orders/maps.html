,"name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":24319,"e":24322,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":24611,"e":24614,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":24991,"e":24994,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":24995,"e":24998,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":25491,"e":25494,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":25495,"e":25498,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":25989,"e":25992,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":25993,"e":25996,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":26485,"e":26488,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26489,"e":26492,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":26864,"e":26867,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":27187,"e":27190,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[AffineConstructive.orders.maps.strictly_order_preserving]], [[AffineConstructive.orders.maps.strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[AffineConstructive.orders.maps.order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[AffineConstructive.orders.maps.linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[AffineConstructive.orders.maps.involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function.","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","items":[{"name":"AffineConstructive.orders.maps.alt_Build_OrderPreserving","base":"alt_Build_OrderPreserving","kind":"prf","start":7,"body":[8,10],"status":"ok","short":{"text":"Between weak posets, f is order preserving if x ≤ y implies f x ≤ f y for all x, y","status":"ok"},"proof":[{"text":"Being order preserving between weak posets is exactly the pointwise implication x ≤ y ⊸ f x ≤ f y together with the two weak-poset structures, which are in context; the structure is assembled from them directly.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.alt_Build_OrderReflecting","base":"alt_Build_OrderReflecting","kind":"prf","start":11,"body":[12,14],"status":"ok","short":{"text":"Between weak posets, f is order reflecting if f x ≤ f y implies x ≤ y for all x, y","status":"ok"},"proof":[{"text":"Being order reflecting between weak posets is exactly the pointwise implication f x ≤ f y ⊸ x ≤ y together with the two weak-poset structures, which are in context; the structure is assembled from them directly.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.alt_Build_OrderEmbedding","base":"alt_Build_OrderEmbedding","kind":"prf","start":15,"body":[16,19],"status":"ok","short":{"text":"Between weak posets, f is an order embedding if x ≤ y if and only if f x ≤ f y","status":"ok"},"proof":[{"text":"Assume the pointwise equivalence x ≤ y ⧟ f x ≤ f y.","status":"ok","from":0,"to":1},{"text":"An order embedding is a map that both preserves and reflects the order. The forward direction of the equivalence gives preservation by [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]], the backward direction gives reflection by [[AffineConstructive.orders.maps.alt_Build_OrderReflecting]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip","base":"alt_Build_OrderPreservingFlip","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"Builds an order-reversing map from the law that x ≤ y implies f y ≤ f x","status":"ok"},"long":{"text":"An order-reversing map is defined as an order-preserving map into the opposite order. This constructor accepts the law stated at the direct order of the codomain, x ≤ y implies f y ≤ f x, together with the weak poset structures of domain and codomain, and produces [[AffineConstructive.interfaces.orders.OrderPreservingFlip]] by way of [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] at the opposite order. It lets a proof of order reversal be written without mention of the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.alt_Build_OrderReflectingFlip","base":"alt_Build_OrderReflectingFlip","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"Builds an order-reversing reflecting map from the law that f y ≤ f x implies x ≤ y","status":"ok"},"long":{"text":"The reflecting counterpart of [[AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip]]: [[AffineConstructive.interfaces.orders.OrderReflectingFlip]] is order reflection into the opposite of the codomain, and this constructor takes the law at the direct order, f y ≤ f x implies x ≤ y, passing it to [[AffineConstructive.orders.maps.alt_Build_OrderReflecting]] at the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.alt_Build_OrderEmbeddingFlip","base":"alt_Build_OrderEmbeddingFlip","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"Builds an order-reversing embedding from x ≤ y if and only if f y ≤ f x","status":"ok"},"long":{"text":"The embedding counterpart of [[AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip]]: given that x ≤ y if and only if f y ≤ f x for all x and y, in weak posets, it produces [[AffineConstructive.interfaces.orders.OrderEmbeddingFlip]], an order embedding into the opposite of the codomain, by [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] at the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.Build_OrderEmbeddingFlip","base":"Build_OrderEmbeddingFlip","kind":"def","start":28,"body":[29,31],"status":"ok","short":{"text":"An order-reversing map that reflects the order in reverse is an order-reversing embedding","status":"ok"},"proof":[{"text":"An order-reversing embedding is the pair of the two order-reversing properties, so the two hypotheses assemble it directly.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.strictly_order_preserving","base":"strictly_order_preserving","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"An order-reflecting map preserves the strict order: x < y implies f x < f y","status":"ok"},"long":{"text":"The strict order is the dual of the reversed order, so x < y is the negation of y ≤ x. The contrapositive of order reflection, f y ≤ f x implies y ≤ x, is therefore x < y implies f x < f y: a map that reflects ≤ preserves <. This is the affine form of strict monotonicity, obtained from [[AffineConstructive.interfaces.orders.order_reflecting]] by [[AffineConstructive.logic.aprop.acontra]] with no further hypothesis. Note the crossing: strict preservation comes from reflection, not from preservation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.strictly_order_reflecting","base":"strictly_order_reflecting","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"An order-preserving map reflects the strict order: f x < f y implies x < y","status":"ok"},"long":{"text":"The contrapositive of [[AffineConstructive.interfaces.orders.order_preserving]] at y and x: since y ≤ x implies f y ≤ f x, its dual says f x < f y implies x < y. So every order-preserving map reflects the strict order, by [[AffineConstructive.logic.aprop.acontra]], with nothing assumed about the orders.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.strictly_order_embedding","base":"strictly_order_embedding","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"An order embedding embeds the strict order: x < y if and only if f x < f y","status":"ok"},"long":{"text":"For an order embedding, y ≤ x if and only if f y ≤ f x; the duals of the two sides are x < y and f x < f y, and [[AffineConstructive.logic.aprop.acontra_iff]] turns the equivalence into one between them. An order embedding is thus also a strict order embedding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.strictly_order_preserving_flip","base":"strictly_order_preserving_flip","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"An order-reversing reflecting map reverses the strict order: x < y implies f y < f x","status":"ok"},"long":{"text":"The order-reversing form of [[AffineConstructive.orders.maps.strictly_order_preserving]]: the contrapositive of [[AffineConstructive.interfaces.orders.order_reflecting_flip]] at y and x, by [[AffineConstructive.logic.aprop.acontra]], gives that x < y implies f y < f x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.strictly_order_reflecting_flip","base":"strictly_order_reflecting_flip","kind":"def","start":39,"body":null,"status":"ok","short":{"text":"An order-reversing map reflects the strict order in reverse: f y < f x implies x < y","status":"ok"},"long":{"text":"The order-reversing form of [[AffineConstructive.orders.maps.strictly_order_reflecting]]: the contrapositive of [[AffineConstructive.interfaces.orders.order_preserving_flip]] at y and x, by [[AffineConstructive.logic.aprop.acontra]], gives that f y < f x implies x < y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.strictly_order_embedding_flip","base":"strictly_order_embedding_flip","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"An order-reversing embedding reverses the strict order exactly: x < y if and only if f y < f x","status":"ok"},"long":{"text":"The order-reversing form of [[AffineConstructive.orders.maps.strictly_order_embedding]], obtained from [[AffineConstructive.interfaces.orders.order_embedding_flip]] by [[AffineConstructive.logic.aprop.acontra_iff]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.right_order_preserving_from_left","base":"right_order_preserving_from_left","kind":"prf","start":44,"body":[45,52],"status":"ok","short":{"text":"For a commutative operation, order preservation in each left argument gives it in each right argument","status":"ok"},"proof":[{"text":"Assume every left partial application of f is order preserving, and fix z. By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices to show, for arbitrary x and y, that x ≤ y implies f(x, z) ≤ f(y, z).","status":"ok","from":0,"to":3},{"text":"Unfold the right partial application, then rewrite both sides by commutativity, f(x, z) = f(z, x) and f(y, z) = f(z, y). It remains to show that x ≤ y implies f(z, x) ≤ f(z, y).","status":"ok","from":4,"to":5},{"text":"This is order preservation of the left partial application at z, which holds by assumption.","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.orders.maps.right_order_reflecting_from_left","base":"right_order_reflecting_from_left","kind":"prf","start":53,"body":[54,61],"status":"ok","short":{"text":"For a commutative operation, order reflection in each left argument gives it in each right argument","status":"ok"},"proof":[{"text":"Assume every left partial application of f is order reflecting, and fix z. By [[AffineConstructive.orders.maps.alt_Build_OrderReflecting]] it suffices to show, for arbitrary x and y, that f(x, z) ≤ f(y, z) implies x ≤ y.","status":"ok","from":0,"to":3},{"text":"Unfold the right partial application, then rewrite both sides by commutativity, f(x, z) = f(z, x) and f(y, z) = f(z, y). It remains to show that f(z, x) ≤ f(z, y) implies x ≤ y.","status":"ok","from":4,"to":5},{"text":"This is order reflection of the left partial application at z, which holds by assumption.","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.orders.maps.right_order_embedding_from_left","base":"right_order_embedding_from_left","kind":"prf","start":62,"body":[63,71],"status":"ok","short":{"text":"For a commutative operation, order embedding in each left argument gives it in each right argument","status":"ok"},"proof":[{"text":"Assume every left partial application of f is an order embedding, and fix z. By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] it suffices to prove the pointwise equivalence, one direction at a time.","status":"ok","from":0,"to":3},{"text":"The forward direction is preservation by the right partial application. It follows from [[AffineConstructive.orders.maps.right_order_preserving_from_left]], because each left partial application, being an embedding, preserves the order.","status":"ok","from":4,"to":5},{"text":"The backward direction is reflection by the right partial application. It follows in the same way from [[AffineConstructive.orders.maps.right_order_reflecting_from_left]].","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.orders.maps.order_morphism_flip","base":"order_morphism_flip","kind":"prf","start":72,"body":[73,79],"status":"ok","short":{"text":"If X and the opposite of Y are weak posets, so are X and Y","status":"ok"},"proof":[{"text":"Given that X and Yᵒᵖ are weak posets, both structures must be produced. The one on X is given directly.","status":"ok","from":0,"to":2},{"text":"For Y, view Y as the opposite of its opposite. By [[AffineConstructive.orders.orders.WeakPoset_op]] it is enough that Yᵒᵖ is a weak poset, which the hypothesis provides.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.orders.maps.order_preserving_flip_mor","base":"order_preserving_flip_mor","kind":"def","start":80,"body":null,"status":"ok","short":{"text":"The weak poset structures of domain and codomain of an order-reversing map","status":"ok"},"long":{"text":"An order-reversing map carries the weak poset structures of its domain and of the opposite of its codomain. Through [[AffineConstructive.orders.maps.order_morphism_flip]] this yields the weak poset structures of the domain and the codomain itself. Declared as a coercion, it lets the structure of the codomain be found from a hypothesis that a map reverses the order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.order_reflecting_flip_mor","base":"order_reflecting_flip_mor","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"The weak poset structures of domain and codomain of an order-reversing reflecting map","status":"ok"},"long":{"text":"The counterpart of [[AffineConstructive.orders.maps.order_preserving_flip_mor]] for [[AffineConstructive.interfaces.orders.OrderReflectingFlip]]: from the structures of the domain and the opposite of the codomain, by [[AffineConstructive.orders.maps.order_morphism_flip]], the weak poset structures of the domain and codomain. It is a coercion, for the same purpose.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.coercion:order_preserving_flip_mor","base":"coercion:order_preserving_flip_mor","kind":"coercion","start":82,"body":null,"status":"ok","short":{"text":"An order-reversing map reaches the weak poset structures of its domain and codomain","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.coercion:order_reflecting_flip_mor","base":"coercion:order_reflecting_flip_mor","kind":"coercion","start":83,"body":null,"status":"ok","short":{"text":"An order-reversing reflecting map reaches the weak poset structures of its domain and codomain","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.OrderPreserving_proper_impl","base":"OrderPreserving_proper_impl","kind":"prf","start":85,"body":[86,91],"status":"ok","short":{"text":"If f = g and f is order preserving, so is g","status":"ok"},"proof":[{"text":"Assume f = g and that f is order preserving. By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices to show that x ≤ y implies g x ≤ g y for all x and y.","status":"ok","from":0,"to":2},{"text":"Since f = g, the values g x and g y may be replaced by f x and f y. The resulting statement is the order preservation of f.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.maps.OrderPreserving_fun","base":"OrderPreserving_fun","kind":"def","start":92,"body":null,"status":"ok","short":{"text":"Being order preserving, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.orders.OrderPreserving]] packaged by [[AffineConstructive.theory.set.make_weak_spred]] as a function from the affirmed functions X ⇾ Y to strict propositions, using [[AffineConstructive.orders.maps.OrderPreserving_proper_impl]] to transport it along equality of functions. Declared canonical, it lets the rewriting system replace a function by an equal one inside a hypothesis or goal of order preservation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.OrderReflecting_proper_impl","base":"OrderReflecting_proper_impl","kind":"prf","start":93,"body":[94,99],"status":"ok","short":{"text":"If f = g and f is order reflecting, so is g","status":"ok"},"proof":[{"text":"Assume f = g and that f is order reflecting. By [[AffineConstructive.orders.maps.alt_Build_OrderReflecting]] it suffices to show that g x ≤ g y implies x ≤ y for all x and y.","status":"ok","from":0,"to":2},{"text":"Since f = g, the values g x and g y may be replaced by f x and f y. The resulting statement is the order reflection of f.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.maps.OrderReflecting_fun","base":"OrderReflecting_fun","kind":"def","start":100,"body":null,"status":"ok","short":{"text":"Being order reflecting, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.orders.OrderReflecting]] packaged by [[AffineConstructive.theory.set.make_weak_spred]] with [[AffineConstructive.orders.maps.OrderReflecting_proper_impl]], so that order reflection can be rewritten along equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.OrderEmbedding_proper_impl","base":"OrderEmbedding_proper_impl","kind":"prf","start":101,"body":[102,105],"status":"ok","short":{"text":"If f = g and f is an order embedding, so is g","status":"ok"},"proof":[{"text":"Assume f = g and that f is an order embedding.","status":"ok","from":0,"to":1},{"text":"An order embedding is an order-preserving map that also reflects the order. For each of the two properties in turn, the equality f = g rewrites g back to f, where the property holds by assumption.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.OrderEmbedding_fun","base":"OrderEmbedding_fun","kind":"def","start":106,"body":null,"status":"ok","short":{"text":"Being an order embedding, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.orders.OrderEmbedding]] packaged by [[AffineConstructive.theory.set.make_weak_spred]] with [[AffineConstructive.orders.maps.OrderEmbedding_proper_impl]], so that being an order embedding can be rewritten along equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.OrderPreservingFlip_proper_impl","base":"OrderPreservingFlip_proper_impl","kind":"prf","start":107,"body":[108,113],"status":"ok","short":{"text":"If f = g and f reverses the order, so does g","status":"ok"},"proof":[{"text":"Assume f = g and that f reverses the order.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip]] it suffices to show pointwise that x ≤ y implies g y ≤ g x.","status":"ok","from":2,"to":2},{"text":"The equality f = g turns g y ≤ g x into f y ≤ f x. That f reverses the order then gives this implication.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.maps.OrderPreservingFlip_fun","base":"OrderPreservingFlip_fun","kind":"def","start":114,"body":null,"status":"ok","short":{"text":"Reversing the order, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.orders.OrderPreservingFlip]] packaged by [[AffineConstructive.theory.set.make_weak_spred]] with [[AffineConstructive.orders.maps.OrderPreservingFlip_proper_impl]], so that order reversal can be rewritten along equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.OrderReflectingFlip_proper_impl","base":"OrderReflectingFlip_proper_impl","kind":"prf","start":115,"body":[116,121],"status":"ok","short":{"text":"If f = g and f reflects the order in reverse, so does g","status":"ok"},"proof":[{"text":"Assume f = g and that f reflects the order in reverse.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderReflectingFlip]] it suffices to show pointwise that g y ≤ g x implies x ≤ y.","status":"ok","from":2,"to":2},{"text":"The equality f = g turns g into f in the antecedent. The resulting implication, from f y ≤ f x to x ≤ y, is the assumption on f.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.maps.OrderReflectingFlip_fun","base":"OrderReflectingFlip_fun","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"Reflecting the order in reverse, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.orders.OrderReflectingFlip]] packaged by [[AffineConstructive.theory.set.make_weak_spred]] with [[AffineConstructive.orders.maps.OrderReflectingFlip_proper_impl]], so that it can be rewritten along equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.OrderEmbeddingFlip_proper_impl","base":"OrderEmbeddingFlip_proper_impl","kind":"prf","start":123,"body":[124,127],"status":"ok","short":{"text":"If f = g and f is an order-reversing embedding, so is g","status":"ok"},"proof":[{"text":"Assume f = g and that f is an order-reversing embedding.","status":"ok","from":0,"to":1},{"text":"The structure has two parts, reversing the order and reflecting it in reverse. For each part, the equality f = g rewrites g back to f, where the part holds by assumption.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.OrderEmbeddingFlip_fun","base":"OrderEmbeddingFlip_fun","kind":"def","start":128,"body":null,"status":"ok","short":{"text":"Being an order-reversing embedding, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.orders.OrderEmbeddingFlip]] packaged by [[AffineConstructive.theory.set.make_weak_spred]] with [[AffineConstructive.orders.maps.OrderEmbeddingFlip_proper_impl]], so that it can be rewritten along equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.ap1_order_preserving","base":"ap1_order_preserving","kind":"prf","start":129,"body":[130,135],"status":"ok","short":{"text":"An order-preserving map on X ⊗ Y is order preserving in its second argument, the first fixed","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices, for y₁ and y₂ in Y, to show that y₁ ≤ y₂ implies f (x, y₁) ≤ f (x, y₂).","status":"ok","from":0,"to":2},{"text":"Since f preserves the order, it suffices to show that y₁ ≤ y₂ implies (x, y₁) ≤ (x, y₂) in X ⊗ Y.","status":"ok","from":3,"to":3},{"text":"In the tensor order the pairs compare as x ≤ x ⊠ y₁ ≤ y₂. The factor x ≤ x holds by reflexivity and drops out, so what remains is the hypothesis y₁ ≤ y₂.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.maps.ap2_order_preserving","base":"ap2_order_preserving","kind":"prf","start":137,"body":[138,143],"status":"ok","short":{"text":"An order-preserving map on X ⊗ Y is order preserving in its first argument, the second fixed","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices, for x₁ and x₂ in X, to show that x₁ ≤ x₂ implies f (x₁, y) ≤ f (x₂, y).","status":"ok","from":0,"to":2},{"text":"Since f preserves the order, it suffices to show that x₁ ≤ x₂ implies (x₁, y) ≤ (x₂, y) in X ⊗ Y.","status":"ok","from":3,"to":3},{"text":"In the tensor order the pairs compare as x₁ ≤ x₂ ⊠ y ≤ y. The factor y ≤ y holds by reflexivity and drops out, so what remains is the hypothesis x₁ ≤ x₂.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.maps.tensor_to_prod_order_preserving","base":"tensor_to_prod_order_preserving","kind":"prf","start":145,"body":[146,150],"status":"ok","short":{"text":"The passage from the tensor product X ⊗ Y to the cartesian product X × Y preserves the order","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices to compare two pairs (a, b) and (c, d) of X ⊗ Y.","status":"ok","from":0,"to":2},{"text":"The goal is that a ≤ c ⊠ b ≤ d implies a ≤ c ∧ b ≤ d. The tensor gives both comparisons, and the additive conjunction needs each of them once, so this is a tautology of the connectives: the multiplicative and implies the additive one.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.maps.order_preserving_simp","base":"order_preserving_simp","kind":"prf","start":155,"body":[156,159],"status":"ok","short":{"text":"For f order preserving, x ≤ y implies fx ≤ fy, with f x and f y simplified","status":"ok"},"proof":[{"text":"Since f preserves the order, x ≤ y implies f x ≤ f y. It remains to show that f x ≤ f y implies fx ≤ fy.","status":"ok","from":0,"to":1},{"text":"This holds because f x simplifies to fx and f y simplifies to fy.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.order_reflecting_simp","base":"order_reflecting_simp","kind":"prf","start":160,"body":[161,164],"status":"ok","short":{"text":"For f order reflecting, fx ≤ fy implies x ≤ y, with f x and f y simplified","status":"ok"},"proof":[{"text":"Since f reflects the order, f x ≤ f y implies x ≤ y. It remains to show that fx ≤ fy implies f x ≤ f y.","status":"ok","from":0,"to":1},{"text":"This holds because f x simplifies to fx and f y simplifies to fy.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.order_embedding_simp","base":"order_embedding_simp","kind":"prf","start":165,"body":[166,169],"status":"ok","short":{"text":"For f an order embedding, x ≤ y if and only if fx ≤ fy, with images simplified","status":"ok"},"proof":[{"text":"By [[AffineConstructive.interfaces.orders.order_embedding]], x ≤ y holds if and only if f x ≤ f y. It remains to show that f x ≤ f y is equivalent to fx ≤ fy.","status":"ok","from":0,"to":1},{"text":"This holds because f x simplifies to fx and f y simplifies to fy.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.strictly_order_preserving_simp","base":"strictly_order_preserving_simp","kind":"prf","start":170,"body":[171,174],"status":"ok","short":{"text":"For f order reflecting, x < y implies fx < fy, with f x and f y simplified","status":"ok"},"proof":[{"text":"Since f reflects ≤, it preserves <, by [[AffineConstructive.orders.maps.strictly_order_preserving]]: x < y implies f x < f y. It remains to pass from f x < f y to the simplified fx < fy.","status":"ok","from":0,"to":1},{"text":"Simplifying f x to fx and f y to fy turns the remaining implication into P ⊸ P, which holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.strictly_order_reflecting_simp","base":"strictly_order_reflecting_simp","kind":"prf","start":175,"body":[176,179],"status":"ok","short":{"text":"For f order preserving, fx < fy implies x < y, with f x and f y simplified","status":"ok"},"proof":[{"text":"Since f preserves ≤, it reflects <, by [[AffineConstructive.orders.maps.strictly_order_reflecting]]: f x < f y implies x < y. It remains to obtain f x < f y from the simplified fx < fy.","status":"ok","from":0,"to":1},{"text":"Simplifying f x to fx and f y to fy makes the two sides of the remaining implication the same, and it holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.strictly_order_embedding_simp","base":"strictly_order_embedding_simp","kind":"prf","start":180,"body":[181,184],"status":"ok","short":{"text":"For f an order embedding, x < y if and only if fx < fy, with images simplified","status":"ok"},"proof":[{"text":"An order embedding embeds the strict order, by [[AffineConstructive.orders.maps.strictly_order_embedding]], so x < y may be replaced by f x < f y. It remains to show that f x < f y is equivalent to fx < fy.","status":"ok","from":0,"to":1},{"text":"Simplifying f x to fx and f y to fy makes the two sides identical, and the equivalence holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.order_preserving_flip_simp","base":"order_preserving_flip_simp","kind":"prf","start":185,"body":[186,189],"status":"ok","short":{"text":"For f order-reversing, x ≤ y implies fy ≤ fx, where fx and fy are simplified forms of f x and f y","status":"ok"},"proof":[{"text":"Since f reverses the order, x ≤ y implies f y ≤ f x, by [[AffineConstructive.interfaces.orders.order_preserving_flip]]. It remains to pass to the simplified fy ≤ fx.","status":"ok","from":0,"to":1},{"text":"Simplifying the images turns the remaining implication into P ⊸ P, which holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.order_reflecting_flip_simp","base":"order_reflecting_flip_simp","kind":"prf","start":190,"body":[191,194],"status":"ok","short":{"text":"For f reflecting in reverse, fy ≤ fx implies x ≤ y, where fx and fy are simplified forms of f x and f y","status":"ok"},"proof":[{"text":"Since f reflects the order in reverse, f y ≤ f x implies x ≤ y, by [[AffineConstructive.interfaces.orders.order_reflecting_flip]]. It remains to obtain f y ≤ f x from fy ≤ fx.","status":"ok","from":0,"to":1},{"text":"Simplifying the images makes the two sides of the remaining implication the same, and it holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.order_embedding_flip_simp","base":"order_embedding_flip_simp","kind":"prf","start":195,"body":[196,199],"status":"ok","short":{"text":"For an order-reversing embedding f, x ≤ y if and only if fy ≤ fx, with f x and f y simplified","status":"ok"},"proof":[{"text":"For an order-reversing embedding, x ≤ y is equivalent to f y ≤ f x, by [[AffineConstructive.interfaces.orders.order_embedding_flip]]. It remains to show that f y ≤ f x is equivalent to fy ≤ fx.","status":"ok","from":0,"to":1},{"text":"Simplifying the images makes the two sides identical, and the equivalence holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.strictly_order_preserving_flip_simp","base":"strictly_order_preserving_flip_simp","kind":"prf","start":200,"body":[201,204],"status":"ok","short":{"text":"For f reflecting in reverse, x < y implies fy < fx, with f x and f y simplified","status":"ok"},"proof":[{"text":"Since f reflects the order in reverse, it reverses the strict order, by [[AffineConstructive.orders.maps.strictly_order_preserving_flip]]: x < y implies f y < f x. It remains to pass to the simplified fy < fx.","status":"ok","from":0,"to":1},{"text":"Simplifying the images turns the remaining implication into P ⊸ P, which holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.strictly_order_reflecting_flip_simp","base":"strictly_order_reflecting_flip_simp","kind":"prf","start":205,"body":[206,209],"status":"ok","short":{"text":"For f order-reversing, fy < fx implies x < y, with f x and f y simplified","status":"ok"},"proof":[{"text":"Since f reverses the order, it reflects the strict order in reverse, by [[AffineConstructive.orders.maps.strictly_order_reflecting_flip]]: f y < f x implies x < y. It remains to obtain f y < f x from fy < fx.","status":"ok","from":0,"to":1},{"text":"Simplifying the images makes the two sides of the remaining implication the same, and it holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.strictly_order_embedding_flip_simp","base":"strictly_order_embedding_flip_simp","kind":"prf","start":210,"body":[211,214],"status":"ok","short":{"text":"For an order-reversing embedding f, x < y if and only if fy < fx, with f x and f y simplified","status":"ok"},"proof":[{"text":"An order-reversing embedding reverses the strict order exactly, by [[AffineConstructive.orders.maps.strictly_order_embedding_flip]], so x < y may be replaced by f y < f x. It remains to show that f y < f x is equivalent to fy < fx.","status":"ok","from":0,"to":1},{"text":"Simplifying the images makes the two sides identical, and the equivalence holds.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.maps.order_reflecting_injective","base":"order_reflecting_injective","kind":"prf","start":216,"body":[217,221],"status":"ok","short":{"text":"Between posets, a map that reflects the order is injective","status":"ok"},"proof":[{"text":"Fix x and y in X. It must be shown that f x = f y implies x = y.","status":"ok","from":0,"to":1},{"text":"In a poset, equality is equivalent to the additive conjunction of the two inequalities, by [[AffineConstructive.orders.orders.le_antisym_iff]]. Rewriting both equalities this way, it remains to show that f x ≤ f y ∧ f y ≤ f x implies x ≤ y ∧ y ≤ x.","status":"ok","from":2,"to":2},{"text":"Since f reflects ≤, f x ≤ f y implies x ≤ y and f y ≤ f x implies y ≤ x. The additive conjunction is monotone, so the two implications combine and the goal follows.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.maps.linear_order_reflecting_embedding","base":"linear_order_reflecting_embedding","kind":"prf","start":223,"body":[224,232],"status":"ok","short":{"text":"A map from a poset into a linear refutative order that reflects the order is an order embedding","status":"ok"},"proof":[{"text":"An order embedding is a map that both preserves and reflects the order. The reflecting half is the hypothesis, so it remains to show that f preserves the order.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices to prove the law pointwise. Fix x and y; the goal is that x ≤ y implies f x ≤ f y.","status":"ok","from":2,"to":3},{"text":"In the poset X, x ≤ y implies x < y ⊞ x = y ([[AffineConstructive.orders.orders.le_lt_par_eq]]), so it suffices to derive f x ≤ f y from this par.","status":"ok","from":4,"to":4},{"text":"Pass to the contrapositive ([[AffineConstructive.logic.aprop.by_contrapositive]]). The dual of a par is a tensor and the dual of an inequality is the strict inequality the other way, so the goal becomes: f y < f x implies y ≤ x ⊠ x ≠ y.","status":"ok","from":5,"to":5},{"text":"Y is linear and refutative, so f y < f x is equivalent to f y ≤ f x ⊠ f y ≠ f x ([[AffineConstructive.orders.orders.lt_iff_le_prod_ne]]). By symmetry x ≠ y becomes y ≠ x, which lines the conclusion up with the hypothesis factor by factor.","status":"ok","from":6,"to":6},{"text":"Each factor of the hypothesis gives the matching factor of the conclusion. Since f reflects the order, f y ≤ f x gives y ≤ x. Since f preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), the contrapositive of that implication turns f y ≠ f x into y ≠ x. Each factor is used exactly once.","status":"ok","from":7,"to":8}]},{"name":"AffineConstructive.orders.maps.involutive_order_embedding","base":"involutive_order_embedding","kind":"prf","start":233,"body":[234,242],"status":"ok","short":{"text":"An order-preserving involution is an order embedding","status":"ok"},"proof":[{"text":"Assume f preserves the order. That gives the preserving half of an embedding, so what remains is to show that f reflects the order.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderReflecting]] it suffices to prove the law pointwise. Fix x and y; the goal is that f x ≤ f y implies x ≤ y.","status":"ok","from":3,"to":4},{"text":"f is an involution, so x = f (f x) and y = f (f y) ([[AffineConstructive.theory.common_props.involutive_alt]]). Rewriting the conclusion with these equalities turns it into f (f x) ≤ f (f y).","status":"ok","from":5,"to":6},{"text":"Applying the order-preserving map f to f x ≤ f y gives this inequality.","status":"ok","from":7,"to":8}]},{"name":"AffineConstructive.orders.maps.involutive_order_embedding_flip","base":"involutive_order_embedding_flip","kind":"prf","start":243,"body":[244,252],"status":"ok","short":{"text":"An order-reversing involution is an order-reversing embedding","status":"ok"},"proof":[{"text":"Assume f reverses the order. That gives the preserving half of an order-reversing embedding, so what remains is to show that f reflects the order in reverse.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderReflectingFlip]] it suffices to prove the law pointwise. Fix x and y; the goal is that f y ≤ f x implies x ≤ y.","status":"ok","from":3,"to":4},{"text":"f is an involution, so x = f (f x) and y = f (f y) ([[AffineConstructive.theory.common_props.involutive_alt]]). Rewriting the conclusion with these equalities turns it into f (f x) ≤ f (f y).","status":"ok","from":5,"to":6},{"text":"Since f reverses the order, applying it to f y ≤ f x gives f (f x) ≤ f (f y) ([[AffineConstructive.interfaces.orders.order_preserving_flip]]).","status":"ok","from":7,"to":8}]},{"name":"AffineConstructive.orders.maps.id_order_embedding","base":"id_order_embedding","kind":"prf","start":253,"body":[254,256],"status":"ok","short":{"text":"On a poset, the identity is an order embedding","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] it suffices that x ≤ y holds if and only if id x ≤ id y. The two sides are the same proposition, so the equivalence holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.go","base":"go","kind":"ltac","start":263,"body":null,"status":"ok","short":{"text":"Proves that a composite g ∘ f preserves or reflects the order, directly or reversed, from the laws of g and f","status":"ok"},"long":{"text":"This tactic is local to the composition section and proves each of the eight composition instances for preserving and reflecting maps, such as [[AffineConstructive.orders.maps.OrderPreserving_compose]] and [[AffineConstructive.orders.maps.OrderReflectingFlip_compose_l]]. It reads which of the four classes the goal asks for and reduces the goal with the matching pointwise constructor, for example [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] or [[AffineConstructive.orders.maps.alt_Build_OrderReflectingFlip]]. It then fixes two points x and y and restates the composite applied to a point, (g ∘ f) x, as g (f x).\n\nThe proof is a chain of two implications. The tactic finds in context the hypothesis on g, whichever of the four classes it is, and rewrites by g's law. This turns the goal into an inequality between f x and f y, in the direction that g's class dictates. It then closes that goal with f's law, again whichever of the four classes the hypothesis on f is. One tactic therefore serves every combination: whether the composite is direct or reversed follows from how many of the two maps are reversed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.OrderPreserving_compose","base":"OrderPreserving_compose","kind":"inst","start":264,"body":[265,267],"status":"ok","short":{"text":"The composite of two order-preserving maps preserves the order","status":"ok"},"proof":[{"text":"Prove the law pointwise ([[AffineConstructive.orders.maps.alt_Build_OrderPreserving]]). Given x ≤ y, f gives f x ≤ f y, and then g gives g (f x) ≤ g (f y). The two implications compose.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderReflecting_compose","base":"OrderReflecting_compose","kind":"inst","start":268,"body":[269,271],"status":"ok","short":{"text":"The composite of two order-reflecting maps reflects the order","status":"ok"},"proof":[{"text":"Prove the law pointwise ([[AffineConstructive.orders.maps.alt_Build_OrderReflecting]]). Given g (f x) ≤ g (f y), g gives f x ≤ f y, and then f gives x ≤ y. The two implications compose.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderPreserving_compose_flip","base":"OrderPreserving_compose_flip","kind":"inst","start":272,"body":[273,275],"status":"ok","short":{"text":"The composite of two order-reversing maps preserves the order","status":"ok"},"proof":[{"text":"Prove the law pointwise ([[AffineConstructive.orders.maps.alt_Build_OrderPreserving]]). Given x ≤ y, the order-reversing f gives f y ≤ f x, and the order-reversing g then gives g (f x) ≤ g (f y) ([[AffineConstructive.interfaces.orders.order_preserving_flip]]). The two reversals cancel.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderReflecting_compose_flip","base":"OrderReflecting_compose_flip","kind":"inst","start":276,"body":[277,279],"status":"ok","short":{"text":"The composite of two maps that reflect the order in reverse reflects the order","status":"ok"},"proof":[{"text":"Prove the law pointwise ([[AffineConstructive.orders.maps.alt_Build_OrderReflecting]]). Given g (f x) ≤ g (f y), reverse reflection by g gives f y ≤ f x, and reverse reflection by f then gives x ≤ y ([[AffineConstructive.interfaces.orders.order_reflecting_flip]]). The two reversals cancel.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderPreservingFlip_compose_l","base":"OrderPreservingFlip_compose_l","kind":"inst","start":280,"body":[281,283],"status":"ok","short":{"text":"An order-reversing map after an order-preserving one reverses the order","status":"ok"},"proof":[{"text":"Prove the law pointwise ([[AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip]]). Given x ≤ y, f gives f x ≤ f y, and the order-reversing g then gives g (f y) ≤ g (f x) ([[AffineConstructive.interfaces.orders.order_preserving_flip]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderReflectingFlip_compose_l","base":"OrderReflectingFlip_compose_l","kind":"inst","start":284,"body":[285,287],"status":"ok","short":{"text":"A map that reflects in reverse, after an order-reflecting one, reflects in reverse","status":"ok"},"proof":[{"text":"Prove the law pointwise ([[AffineConstructive.orders.maps.alt_Build_OrderReflectingFlip]]). Given g (f y) ≤ g (f x), reverse reflection by g gives f x ≤ f y ([[AffineConstructive.interfaces.orders.order_reflecting_flip]]), and since f reflects the order, this gives x ≤ y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderPreservingFlip_compose_r","base":"OrderPreservingFlip_compose_r","kind":"inst","start":288,"body":[289,291],"status":"ok","short":{"text":"An order-preserving map after an order-reversing one reverses the order","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip]] it suffices to show that x ≤ y implies g (f x) ≥ g (f y) for all x, y. Since f reverses the order, x ≤ y implies f y ≤ f x. Since g preserves the order, that implies g (f y) ≤ g (f x). The two implications compose.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderReflectingFlip_compose_r","base":"OrderReflectingFlip_compose_r","kind":"inst","start":292,"body":[293,295],"status":"ok","short":{"text":"An order-reflecting map, after one that reflects in reverse, reflects in reverse","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderReflectingFlip]] it suffices to show that g (f y) ≤ g (f x) implies x ≤ y. Since g reflects the order, g (f y) ≤ g (f x) gives f y ≤ f x. Since f reflects the order in reverse, f y ≤ f x gives x ≤ y. The two implications compose.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderEmbedding_compose","base":"OrderEmbedding_compose","kind":"inst","start":296,"body":[297,299],"status":"ok","short":{"text":"The composite of two order embeddings is an order embedding","status":"ok"},"proof":[{"text":"An order embedding is a map that preserves the order and also reflects it, so each half is proved separately. The composite preserves the order by [[AffineConstructive.orders.maps.OrderPreserving_compose]] and reflects it by [[AffineConstructive.orders.maps.OrderReflecting_compose]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderEmbedding_compose_flip","base":"OrderEmbedding_compose_flip","kind":"inst","start":300,"body":[301,303],"status":"ok","short":{"text":"The composite of two order-reversing embeddings is an order embedding","status":"ok"},"proof":[{"text":"Each order-reversing embedding both reverses the order and reflects it in reverse. Reversing twice preserves the order, by [[AffineConstructive.orders.maps.OrderPreserving_compose_flip]]. Reflecting in reverse twice reflects the order, by [[AffineConstructive.orders.maps.OrderReflecting_compose_flip]]. Together these two halves make the composite an order embedding.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderEmbeddingFlip_compose_l","base":"OrderEmbeddingFlip_compose_l","kind":"inst","start":304,"body":[305,307],"status":"ok","short":{"text":"An order-reversing embedding after an order embedding is an order-reversing embedding","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.Build_OrderEmbeddingFlip]] it suffices to show that the composite reverses the order and reflects it in reverse. The first half is [[AffineConstructive.orders.maps.OrderPreservingFlip_compose_l]] and the second is [[AffineConstructive.orders.maps.OrderReflectingFlip_compose_l]]. Both apply to the two halves of the embedding f and of the reversing embedding g.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.OrderEmbeddingFlip_compose_r","base":"OrderEmbeddingFlip_compose_r","kind":"inst","start":308,"body":[309,311],"status":"ok","short":{"text":"An order embedding after an order-reversing embedding is an order-reversing embedding","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.Build_OrderEmbeddingFlip]] it suffices to show that the composite reverses the order and reflects it in reverse. The first half is [[AffineConstructive.orders.maps.OrderPreservingFlip_compose_r]] and the second is [[AffineConstructive.orders.maps.OrderReflectingFlip_compose_r]]. Both apply to the two halves of the reversing embedding f and of the embedding g.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.find_order_preserving_pack","base":"find_order_preserving_pack","kind":"def","start":327,"body":null,"status":"ok","short":{"text":"Packs the order-preserving classes and their composition lemmas for the composite-map search","status":"ok"},"long":{"text":"A local definition whose only content is a list of let-bindings. It names the classes [[AffineConstructive.interfaces.orders.OrderPreserving]] and [[AffineConstructive.interfaces.orders.OrderPreservingFlip]] and the four composition lemmas that combine them: [[AffineConstructive.orders.maps.OrderPreserving_compose]], [[AffineConstructive.orders.maps.OrderPreserving_compose_flip]], [[AffineConstructive.orders.maps.OrderPreservingFlip_compose_l]] and [[AffineConstructive.orders.maps.OrderPreservingFlip_compose_r]]. Its value, a universe, is irrelevant. The tactic find_order_morphism unfolds the definition and reads the six constants off the bindings. With them it walks a composite g ∘ f, finds for each factor whether it preserves or reverses the order, and combines the results with the matching composition lemma. Packing the constants this way lets one tactic serve preservation, reflection and embedding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_order_reflecting_pack","base":"find_order_reflecting_pack","kind":"def","start":328,"body":null,"status":"ok","short":{"text":"Packs the order-reflecting classes and their composition lemmas for the composite-map search","status":"ok"},"long":{"text":"The counterpart of [[AffineConstructive.orders.maps.find_order_preserving_pack]] for reflection. Its let-bindings name [[AffineConstructive.interfaces.orders.OrderReflecting]], [[AffineConstructive.interfaces.orders.OrderReflectingFlip]], [[AffineConstructive.orders.maps.OrderReflecting_compose]], [[AffineConstructive.orders.maps.OrderReflecting_compose_flip]], [[AffineConstructive.orders.maps.OrderReflectingFlip_compose_l]] and [[AffineConstructive.orders.maps.OrderReflectingFlip_compose_r]]. The tactic find_order_morphism reads these constants to prove that a composite map reflects the order, either directly or in reverse.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_order_embedding_pack","base":"find_order_embedding_pack","kind":"def","start":329,"body":null,"status":"ok","short":{"text":"Packs the order-embedding classes and their composition lemmas for the composite-map search","status":"ok"},"long":{"text":"The counterpart of [[AffineConstructive.orders.maps.find_order_preserving_pack]] for embeddings. Its let-bindings name [[AffineConstructive.interfaces.orders.OrderEmbedding]], [[AffineConstructive.interfaces.orders.OrderEmbeddingFlip]], [[AffineConstructive.orders.maps.OrderEmbedding_compose]], [[AffineConstructive.orders.maps.OrderEmbedding_compose_flip]], [[AffineConstructive.orders.maps.OrderEmbeddingFlip_compose_l]] and [[AffineConstructive.orders.maps.OrderEmbeddingFlip_compose_r]]. The tactic find_order_morphism reads these constants to prove that a composite map is an order embedding, either order-preserving or order-reversing.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_order_morphism","base":"find_order_morphism","kind":"ltac","start":331,"body":null,"status":"ok","short":{"text":"Builds a proof that a composite of maps preserves, reflects or embeds the order, directly or reversed","status":"ok"},"long":{"text":"This tactic is generic over the kind of order map. It takes a pack, a local definition holding six constants: the direct class, its reversed (flip) counterpart, and the four composition lemmas that combine the two. The packs are [[AffineConstructive.orders.maps.find_order_preserving_pack]], [[AffineConstructive.orders.maps.find_order_reflecting_pack]] and [[AffineConstructive.orders.maps.find_order_embedding_pack]]. It also takes a map f, which may be a nested composite.\n\nThe tactic returns a proof term rather than acting on a goal. The proof says either that f is in the direct class or that f is in the reversed class, whichever holds. It walks the structure of f. The identity is handled by instance resolution. A composite h ∘ g is handled by recursion: it obtains a proof for g and one for h, each direct or reversed, and combines them with the lemma that matches the pair. Two direct maps or two reversed maps give a direct composite; one of each gives a reversed composite. For any other map it asks resolution for the direct class first and the reversed class second.\n\nResolution cannot make this choice by itself, because the class of a composite depends on how many reversed factors it has. The tactic reaches for it whenever a composite's class must be found. The variants [[AffineConstructive.orders.maps.find_order_preserving]], [[AffineConstructive.orders.maps.find_order_reflecting]] and [[AffineConstructive.orders.maps.find_order_embedding]] fix the pack.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_compose_order_morphism","base":"find_compose_order_morphism","kind":"ltac","start":332,"body":null,"status":"ok","short":{"text":"Proves that g ∘ f is in the direct class by first finding f's class, then asking for g's","status":"ok"},"long":{"text":"This tactic acts on a goal saying that a composite g ∘ f is in the direct class of a pack: preserving, reflecting or embedding. It calls [[AffineConstructive.orders.maps.find_order_morphism]] on the inner map f to learn whether f is direct or reversed. It then applies the composition lemma that produces a direct composite from f's class: the one for two direct maps when f is direct, and the one for two reversed maps when f is reversed. The remaining goal, that g is in the matching class, is left to instance resolution.\n\nThe instance hints for OrderPreserving, OrderReflecting and OrderEmbedding of a composite call this tactic through its variants [[AffineConstructive.orders.maps.find_compose_order_preserving]], [[AffineConstructive.orders.maps.find_compose_order_reflecting]] and [[AffineConstructive.orders.maps.find_compose_order_embedding]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_compose_order_morphism_flip","base":"find_compose_order_morphism_flip","kind":"ltac","start":333,"body":null,"status":"ok","short":{"text":"Proves that g ∘ f is in the reversed class by first finding f's class, then asking for g's","status":"ok"},"long":{"text":"This is the reversed counterpart of [[AffineConstructive.orders.maps.find_compose_order_morphism]]. The goal says that a composite g ∘ f is order-reversing in the sense of the pack. The tactic finds the class of f with [[AffineConstructive.orders.maps.find_order_morphism]]. If f is direct, it applies the lemma whose outer map is reversed, so g must be reversed. If f is reversed, it applies the lemma whose outer map is direct, so g must be direct. The remaining goal on g is left to instance resolution.\n\nThe instance hints for the flip classes of a composite call this tactic through [[AffineConstructive.orders.maps.find_compose_order_preserving_flip]], [[AffineConstructive.orders.maps.find_compose_order_reflecting_flip]] and [[AffineConstructive.orders.maps.find_compose_order_embedding_flip]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_order_preserving","base":"find_order_preserving","kind":"ltac","start":334,"body":null,"status":"ok","short":{"text":"Builds a proof that a composite map preserves or reverses the order","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_order_morphism]] with the pack of order-preserving maps and their composition lemmas. Its result is a proof that the map is order-preserving or a proof that it is order-reversing. Besides serving the composition hints, it supplies the congruence step of rewriting: to prove f x ≤ f y, it finds whether f is preserving or reversing and reduces the goal to x ≤ y or to y ≤ x accordingly.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_order_reflecting","base":"find_order_reflecting","kind":"ltac","start":335,"body":null,"status":"ok","short":{"text":"Builds a proof that a composite map reflects the order, directly or reversed","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_order_morphism]] with the pack of order-reflecting maps and their composition lemmas. Its result is a proof that the map is order-reflecting or a proof that it reflects the order in reverse.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_order_embedding","base":"find_order_embedding","kind":"ltac","start":336,"body":null,"status":"ok","short":{"text":"Builds a proof that a composite map is an order embedding, direct or reversed","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_order_morphism]] with the pack of order embeddings and their composition lemmas. Its result is a proof that the map is an order embedding or a proof that it is an order-reversing embedding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_compose_order_preserving","base":"find_compose_order_preserving","kind":"ltac","start":337,"body":null,"status":"ok","short":{"text":"Proves that a composite g ∘ f is order-preserving, from the classes of f and g","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_compose_order_morphism]] with the pack of order-preserving maps. It is the instance hint for goals saying that g ∘ f is order-preserving. It finds whether f preserves or reverses the order and leaves g's matching class to resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_compose_order_reflecting","base":"find_compose_order_reflecting","kind":"ltac","start":338,"body":null,"status":"ok","short":{"text":"Proves that a composite g ∘ f is order-reflecting, from the classes of f and g","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_compose_order_morphism]] with the pack of order-reflecting maps. It is the instance hint for goals saying that g ∘ f is order-reflecting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_compose_order_embedding","base":"find_compose_order_embedding","kind":"ltac","start":339,"body":null,"status":"ok","short":{"text":"Proves that a composite g ∘ f is an order embedding, from the classes of f and g","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_compose_order_morphism]] with the pack of order embeddings. It is the instance hint for goals saying that g ∘ f is an order embedding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_compose_order_preserving_flip","base":"find_compose_order_preserving_flip","kind":"ltac","start":340,"body":null,"status":"ok","short":{"text":"Proves that a composite g ∘ f reverses the order, from the classes of f and g","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_compose_order_morphism_flip]] with the pack of order-preserving maps. It is the instance hint for goals saying that g ∘ f is order-reversing. Exactly one of f and g must reverse the order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_compose_order_reflecting_flip","base":"find_compose_order_reflecting_flip","kind":"ltac","start":341,"body":null,"status":"ok","short":{"text":"Proves that a composite g ∘ f reflects the order in reverse, from the classes of f and g","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_compose_order_morphism_flip]] with the pack of order-reflecting maps. It is the instance hint for goals saying that g ∘ f reflects the order in reverse.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.find_compose_order_embedding_flip","base":"find_compose_order_embedding_flip","kind":"ltac","start":342,"body":null,"status":"ok","short":{"text":"Proves that a composite g ∘ f is an order-reversing embedding, from the classes of f and g","status":"ok"},"long":{"text":"[[AffineConstructive.orders.maps.find_compose_order_morphism_flip]] with the pack of order embeddings. It is the instance hint for goals saying that g ∘ f is an order-reversing embedding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.maps.op_order_morphism","base":"op_order_morphism","kind":"prf","start":353,"body":[354,356],"status":"ok","short":{"text":"If X and Y are weak posets, so are their opposites","status":"ok"},"proof":[{"text":"Both components of the claim hold because the opposite of a weak poset is again a weak poset, by [[AffineConstructive.orders.orders.WeakPoset_op]]. This holds on the domain side and on the codomain side.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.op_order_preserving","base":"op_order_preserving","kind":"prf","start":358,"body":[359,363],"status":"ok","short":{"text":"An order-preserving map also preserves the opposite orders","status":"ok"},"proof":[{"text":"The opposite orders form an order morphism by [[AffineConstructive.orders.maps.op_order_morphism]]. What is left is the monotonicity law for the opposite orders.","status":"ok","from":0,"to":1},{"text":"Fix x and y. In the opposite orders, x ≤ y says y ≤ x in X, and f x ≤ f y says f y ≤ f x in Y. So the required implication is the order preservation of f, specialised at y and x.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.maps.op_order_preserving_iff","base":"op_order_preserving_iff","kind":"prf","start":365,"body":[366,371],"status":"ok","short":{"text":"f preserves the order if and only if it preserves the opposite orders","status":"ok"},"proof":[{"text":"Each direction is proved on its own. The forward direction is [[AffineConstructive.orders.maps.op_order_preserving]].","status":"ok","from":0,"to":2},{"text":"For the converse, suppose f preserves the opposite orders. Applying [[AffineConstructive.orders.maps.op_order_preserving]] to f again shows that f preserves the opposites of the opposite orders. Those are the orders of X and Y themselves.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.maps.op_order_reflecting","base":"op_order_reflecting","kind":"prf","start":372,"body":[373,377],"status":"ok","short":{"text":"An order-reflecting map also reflects the opposite orders","status":"ok"},"proof":[{"text":"The opposite orders form an order morphism by [[AffineConstructive.orders.maps.op_order_morphism]]. What is left is the reflection law for the opposite orders.","status":"ok","from":0,"to":1},{"text":"Fix x and y. In the opposite orders, f x ≤ f y says f y ≤ f x in Y, and x ≤ y says y ≤ x in X. So the required implication is the order reflection of f, specialised at y and x.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.maps.op_order_reflecting_iff","base":"op_order_reflecting_iff","kind":"prf","start":379,"body":[380,385],"status":"ok","short":{"text":"f reflects the order if and only if it reflects the opposite orders","status":"ok"},"proof":[{"text":"The two directions are proved separately. From left to right, an order-reflecting map also reflects the opposite orders, which is [[AffineConstructive.orders.maps.op_order_reflecting]].","status":"ok","from":0,"to":2},{"text":"From right to left, suppose f reflects the opposite orders. Applying [[AffineConstructive.orders.maps.op_order_reflecting]] once more shows that f reflects the opposites of the opposite orders, and these are the original orders on X and Y.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.maps.op_order_embedding","base":"op_order_embedding","kind":"prf","start":386,"body":[387,389],"status":"ok","short":{"text":"An order embedding is also an order embedding between the opposite orders","status":"ok"},"proof":[{"text":"An order embedding preserves and reflects the order. Between the opposite orders it still preserves the order by [[AffineConstructive.orders.maps.op_order_preserving]] and still reflects it by [[AffineConstructive.orders.maps.op_order_reflecting]], so it is an order embedding there as well.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.op_order_embedding_iff","base":"op_order_embedding_iff","kind":"prf","start":391,"body":[392,397],"status":"ok","short":{"text":"f is an order embedding if and only if it is one between the opposite orders","status":"ok"},"proof":[{"text":"The two directions are proved separately. From left to right, an order embedding is also an order embedding between the opposite orders, which is [[AffineConstructive.orders.maps.op_order_embedding]].","status":"ok","from":0,"to":2},{"text":"From right to left, apply [[AffineConstructive.orders.maps.op_order_embedding]] to the embedding between the opposite orders. This gives an embedding between the opposites of the opposite orders, which are the original orders.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.maps.tensor_map_applied_order_preserving","base":"tensor_map_applied_order_preserving","kind":"prf","start":399,"body":[400,405],"status":"ok","short":{"text":"The tensor map of two order-preserving maps preserves the order on tensor products","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it is enough to check the law pointwise on pairs. Take (a, b) and (c, d). On the tensor product the order is componentwise, with the two comparisons joined by ⊠, so the goal is that a ≤ c ⊠ b ≤ d implies f₁ a ≤ f₁ c ⊠ f₂ b ≤ f₂ d.","status":"ok","from":0,"to":3},{"text":"The tensor is monotone in each factor. Each factor of the hypothesis therefore meets its own map: f₁ preserves a ≤ c, and f₂ preserves b ≤ d.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.maps.tensor_map_applied_order_preserving_flip","base":"tensor_map_applied_order_preserving_flip","kind":"prf","start":407,"body":[408,413],"status":"ok","short":{"text":"The tensor map of two order-reversing maps reverses the order on tensor products","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip]] it is enough to check the reversed law pointwise on pairs. Take (a, b) and (c, d). Since the order on the tensor product is componentwise, the goal is that a ≤ c ⊠ b ≤ d implies f₁ c ≤ f₁ a ⊠ f₂ d ≤ f₂ b.","status":"ok","from":0,"to":3},{"text":"Each factor is handled separately: f₁ reverses a ≤ c, and f₂ reverses b ≤ d, both by [[AffineConstructive.interfaces.orders.order_preserving_flip]]. The tensor of the two results is the conclusion.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.maps.tensor_map_applied_order_reflecting","base":"tensor_map_applied_order_reflecting","kind":"prf","start":415,"body":[416,421],"status":"ok","short":{"text":"The tensor map of two order-reflecting maps reflects the order on tensor products","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderReflecting]] it is enough to check the law pointwise on pairs. Take (a, b) and (c, d). Since the order on the tensor product is componentwise, the goal is that f₁ a ≤ f₁ c ⊠ f₂ b ≤ f₂ d implies a ≤ c ⊠ b ≤ d.","status":"ok","from":0,"to":3},{"text":"Each factor of the hypothesis is reflected by its own map: f₁ a ≤ f₁ c gives a ≤ c, and f₂ b ≤ f₂ d gives b ≤ d.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.maps.tensor_map_applied_order_reflecting_flip","base":"tensor_map_applied_order_reflecting_flip","kind":"prf","start":423,"body":[424,429],"status":"ok","short":{"text":"The tensor map of two maps that reflect in reverse reflects in reverse on tensor products","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderReflectingFlip]] it is enough to check the reversed law pointwise on pairs. Take (a, b) and (c, d). Since the order on the tensor product is componentwise, the goal is that f₁ c ≤ f₁ a ⊠ f₂ d ≤ f₂ b implies a ≤ c ⊠ b ≤ d.","status":"ok","from":0,"to":3},{"text":"Each factor is reflected in reverse by its own map, by [[AffineConstructive.interfaces.orders.order_reflecting_flip]]: f₁ c ≤ f₁ a gives a ≤ c, and f₂ d ≤ f₂ b gives b ≤ d.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.maps.tensor_map_applied_order_embedding","base":"tensor_map_applied_order_embedding","kind":"prf","start":431,"body":[432,434],"status":"ok","short":{"text":"The tensor map of two order embeddings is an order embedding of tensor products","status":"ok"},"proof":[{"text":"An order embedding is a map that both preserves and reflects the order. The tensor map ⟨f₁, f₂⟩ preserves the order by [[AffineConstructive.orders.maps.tensor_map_applied_order_preserving]] and reflects it by [[AffineConstructive.orders.maps.tensor_map_applied_order_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.maps.tensor_map_applied_order_embedding_flip","base":"tensor_map_applied_order_embedding_flip","kind":"prf","start":436,"body":[437,439],"status":"ok","short":{"text":"The tensor map of two order-reversing embeddings is an order-reversing embedding of tensor products","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.Build_OrderEmbeddingFlip]] it is enough that the tensor map reverses the order and reflects it in reverse. The first holds by [[AffineConstructive.orders.maps.tensor_map_applied_order_preserving_flip]] and the second by [[AffineConstructive.orders.maps.tensor_map_applied_order_reflecting_flip]], since each component map has both properties.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.interfaces.common_props":{"page":"../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

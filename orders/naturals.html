trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import implementations.nat theory.naturals.\nRequire Import interfaces.orders interfaces.ring_order.\nRequire Import theory.groups theory.rings.\nRequire Import orders.orders orders.groups orders.rings.\nRequire Import rewrite easy tactics.misc simplify rewrite_preserves.\nRequire Import logic.aprop logic.relations.\n\nLocal Open Scope mult_scope.\n\n\n(** Characterization of the order on the naturals as x ≤ y ⧟ ∐ z, y = x + z *)\nSection naturals_le_plus.\n  Context `{OrderedNaturals (N:=N)}.\n\n  Local Instance naturals_nonneg : ∀ (x:N), 0 ≤ x.\n  Proof. naturals_induction.\n  + refl.\n  + intros n E. rew <-E. now simplify.\n  Qed.\n\n  Lemma naturals_le_plus_1 (x y : N) : x ≤ y ⧟ x < 1 + y.\n  Proof. pose proof naturals_distance x y as [z [Ez|Ez]].\n  + rew <-Ez, <-(order_embedding_simp (x+) 0 z).\n    pose proof (naturals_nonneg z) as Pz; simplify; rew <-Pz; simplify.\n    now rew <-(strictly_order_embedding_simp (+x) 0 1).\n  + rew Ez. apply by_contrapositive_iff.\n    rew <-(strictly_order_embedding_simp (y+) 0 z).\n    rew (commutativity (+) 1 y).\n    rew <-(order_embedding_simp (y+) 1 z).\n    destruct (nno_zero_or_suc z) as [E|[b E]].\n    * rew  E. apply by_contrapositive_iff; now simplify.\n    * change (suc b) with (1 + b) in E; rew E.\n      match goal with |- apos (?P ⧟ ?Q) => enough (P ∧ Q) as [H1 H2] by now simplify end; split;\n      rew <-(naturals_nonneg b); now simplify.\n  Qed.\n\n  Lemma naturals_lt_plus_1 (x y : N) : x < y ⧟ 1 + x ≤ y.\n  Proof. exact (contrapositive_iff (naturals_le_plus_1 y x)). Qed.\n\n  Lemma naturals_le_plus : ∀ x y : N, x ≤ y ⧟ ∐ z, y = x + z .\n  Proof. naturals_induction.\n  + intros y. pose proof _ : 0 ≤ y. simplify. exists y. now simplify.\n  + intros x P y. destruct (nno_zero_or_suc y) as [E|[b E]].\n    * rew E. apply by_contrapositive_iff.\n      rew <-(naturals_le_plus_1 _ _); pose proof (naturals_nonneg x); simplify.\n      intros z. rew (symmetry_iff (=) _ _), <-(associativity (+) _ _ _). exact (nno_suc_nonzero (x + z)).\n    * change (apos (y = 1 + b)) in E. rew E.\n      rew <-exact:(order_embedding_simp (1+) x b).\n      rew (P b). apply aex_aiff. intros w. rew <-(associativity (+) _ _ _).\n      exact (injective_iff (1+) b (x+w)).\n  Qed.\n\n  Context `{StrongLinearRefutativeRigOrder R} `{!OneNonZero R}.\n  Context  (f:N ⇾ R) `{!Rig_Morphism f}.\n  Lemma naturals_to_rig_ord_embedding: OrderEmbedding f.\n  Proof.\n    apply alt_Build_OrderEmbedding.\n    intros x y.\n    pose proof naturals_distance x y as [z[E|E]].\n  + rew <-E. rewrite_preserves f.\n    rew <-(order_embedding_simp (x+) 0 z), <-(order_embedding_simp (f x +) 0 (f z)).\n    clear E x y. pose proof (naturals_nonneg z) as P; simplify; clear P.\n    revert z. naturals_induction.\n    * now rewrite_preserves f.\n    * intros n E. rewrite_preserves f. rew <-E. now simplify.\n  + apply by_contrapositive_iff. rew E. rewrite_preserves f.\n    rew <-(strictly_order_embedding_simp (y+) 0 z), <-(strictly_order_embedding_simp (f y +) 0 (f z)).\n    clear E x y. pose proof nno_zero_or_suc z as [Ez|[n Ez]].\n    * rew Ez. rewrite_preserves f. apply by_contrapositive_iff. now simplify.\n    * change (apos (z = 1 + n)) in Ez. rew Ez. clear Ez z. rewrite_preserves f.\n      assert (0 < 1 + n) as P by (rew <-(naturals_nonneg n); now simplify); simplify; clear P.\n      revert n. naturals_induction.\n      - rewrite_preserves f. now simplify.\n      - intros n E. rewrite_preserves f. rew <-E. now simplify.\n  Qed.\nEnd naturals_le_plus.\nGlobal Hint Extern 2 (OrderEmbedding (naturals_to_mon _ _)) => simple notypeclasses refine (naturals_to_rig_ord_embedding _) : typeclass_instances.\nGlobal Hint Extern 2 (OrderPreserving (naturals_to_mon _ _)) => simple notypeclasses refine (naturals_to_rig_ord_embedding _) : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflecting (naturals_to_mon _ _)) => simple notypeclasses refine (naturals_to_rig_ord_embedding _) : typeclass_instances.\n\n\n(** In the other direction, x ≤ y ⧟ ∐ z, y = x + z  gives a rig order on ℕ. *)\nSection props2.\n  Context `{Naturals (N:=N)} {Nle:Le N}.\n\n  Lemma naturals_plus_zero (x y : N) : x = x + y ⊸ y = 0.\n  Proof. rew <-exact:(injective_iff_simp (x+) 0 y). now apply symmetry. Qed.\n\n  Lemma naturals_plus_zero_sum (x y z : N) : x = x + y + z ⊸ y = 0 ⊠ z = 0 .\n  Proof. rew [<-(zero_sum _ _)|<-(associativity (+) _ _ _)]. apply naturals_plus_zero. Qed.\n\n  Context (le_plus : ∀ x y : N, x ≤ y ⧟ ∐ z, y = x + z ).\n\n  Local Instance: AffirmativeLe N.\n  Proof. intros [x y]. now rew (le_plus _ _). Qed.\n\n  Local Instance: DecidableLe N.\n  Proof. intros [x y]. pose proof naturals_distance x y as [z [E|E]].\n  + left. rew (le_plus _ _). now exists z.\n  + destruct (_ : Decidable (z = 0)) as [P | P].\n    * left. rew (le_plus _ _). exists 0. rew E, P. now simplify.\n    * right. rew (le_plus _ _). intros w. change (y ≠ x + w). rew E.\n      revert P. apply aimpl_impl_pos, by_contrapositive.\n      now rew (naturals_plus_zero_sum _ _ _).\n  Qed.\n\n  Lemma naturals_le_ne_lt_aux (x y : N) : x ≤ y → x ≠ y → x < y.\n  Proof. change (x < y) with (anot (y ≤ x)).\n    rew [(le_plus x y) | (le_plus y x)].\n    intros [a Ea] E z. change (x ≠ y + z).\n    revert E. apply aimpl_impl_pos, by_contrapositive.\n    rew Ea, (naturals_plus_zero_sum _ _ _).\n    apply affirmative_aimpl. intros [E _].\n    rew E. now simplify.\n  Qed.\n\n  Lemma naturals_dec_order_aux : DecidableOrder N.\n  Proof. split; try exact _. apply alt_Build_Poset.\n  + intros x. rew (le_plus _ _). exists 0. now simplify.\n  + intros x y z. apply affirmative_aimpl.\n    rew ?(le_plus _ _). intros [[a Ea][b Eb]]. exists (a + b).\n    rew Eb, Ea. now rew (associativity (+) _ _ _).\n  + intros [x y]. apply affirmative_aimpl. intros E. rew (le_plus _ _). exists 0. now simplify.\n  + intros x y. apply refutative_aimpl_dual. intros E.\n    destruct (_ : Decidable (y ≤ x)) as [P | P].\n    * left. apply naturals_le_ne_lt_aux. assumption. now apply symmetry.\n    * now right.\n  Qed.\n  Let inst3 : DecidableOrder N.  Proof. exact naturals_dec_order_aux. Qed.\n\n  Lemma naturals_total_order_aux : TotalOrder N.\n  Proof. split; try exact _. intros x y.\n    pose proof naturals_distance x y as [z[E|E]]; [ left | right ]; rew (le_plus _ _); now exists z.\n  Qed.\n  Let inst4 : TotalOrder N.  Proof. exact naturals_total_order_aux. Qed.\n\n  Local Instance: AdditiveMonoidOrder N.\n  Proof. split; try exact _. intros z. apply alt_Build_OrderEmbedding. intros x y; simplify.\n    rew ?(le_plus _ _). apply aex_aiff. intros w. rew <-(associativity (+) _ _ _).\n    exact (injective_iff (z+) _ _).\n  Qed.\n\n  Lemma alt_Build_OrderedNaturals : OrderedNaturals N.\n  Proof. split; try exact _. apply strong_linear_refutative_rig_order_from_partial_minus.\n  + intros x y. apply affirmative_aimpl. intros E.\n    pose proof aimpl_impl_pos (lt_le _ _) E as P.\n    rew (le_plus _ _) in P. destruct P as [z P]. exists z. split; trivial.\n    now rew <-exact:(strictly_order_reflecting_simp (x+) 0 z), <-P.\n  + intros x y. apply by_contrapositive, affirmative_aimpl. intros E.\n    apply aor_apar. rew <-?(eq_le _ _). apply strong_no_zero_divisors.\n    apply le_antisym; split; trivial.\n    rew (le_plus _ _). exists (x · y). now simplify.\n  Qed.\nEnd props2.\n\nCoercion naturals_dec_order   `{OrderedNaturals (N:=N)} : DecidableOrder N := naturals_dec_order_aux   naturals_le_plus.\nCoercion naturals_total_order `{OrderedNaturals (N:=N)} : TotalOrder     N := naturals_total_order_aux naturals_le_plus.\n\n(** Default construction of the order. *)\nDefinition naturals_le (N:set) {p:Plus N} : Le N := λ '(x, y), ∐ z, y = x + z.\n\nGlobal Hint Extern 2 (Le nat) => simple refine (naturals_le Nat) : typeclass_instances.\nGlobal Hint Extern 2 (Le (set_T Nat)) => simple refine (naturals_le Nat) : typeclass_instances.\nGlobal Hint Extern 2 (Le (set_T (near_rig_car (nats_near_rig ?N)))) => simple refine (naturals_le N) : typeclass_instances.\n\nGlobal Hint Extern 50 (Le (set_T ?N)) => let t := get_instance constr:(NaturalsToMon N) in simple refine (naturals_le N) : typeclass_instances.\n\nLemma naturals_le_correct {N:set} {p:Plus N} : ∀ x y : N, @le N (naturals_le N) (x, y) ⧟ ∐ z, y = x + z.\nProof. now intros x y. Qed.\n\nDefinition naturals_le_order `{Naturals (N:=N)} : OrderedNaturals N (leN:=naturals_le N) := alt_Build_OrderedNaturals naturals_le_correct.\n\nGlobal Hint Extern 2 (OrderedNaturals _ (leN:=naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@TotalOrder _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@LinearOrder _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@DecidableOrder _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@AffirmativeLe _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@AffirmativeOrder _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@DecidableLe _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@Poset _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@PreOrder _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@RefutativeLe _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@StrongLe _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@StrongPoset _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (@WeakPoset _ (naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveMonoidOrder _ (Mle:=naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\nGlobal Hint Extern 2 (StrongLinearRefutativeRigOrder _ (Rle:=naturals_le _)) => simple notypeclasses refine naturals_le_order : typeclass_instances.\n\nCoercion naturals_mult_cancel `{Naturals N} : NonZeroMultiplicativeCancellation N := naturals_le_order.\n\n\nSection trich.\n  Context `{OrderedNaturals (N:=N)} `{NatSubtract N} `{!NatSubtractSpec N}.\n \n  Local Instance naturals_trich : Trich N :=\n    λ '(x, y), match nat_subtract (x, y) with\n    | natsubtract.is_lt_by _ => is_lt\n    | natsubtract.is_eq => is_eq\n    | natsubtract.is_gt_by _ => is_gt\n    end.\n\n  Lemma naturals_trich_correct : IsTrich N.\n  Proof. split; try exact _. intros x y. unfold trich, naturals_trich.\n    generalize (nat_subtract_spec x y); destruct (nat_subtract (x, y)) as [z| |z]; try easy; intros [E Ez].\n    + rew (lt_iff_le_prod_ne _ _); split; [ apply naturals_le_plus; now exists z |].\n      revert Ez. apply aimpl_impl_pos, by_contrapositive. rew <-E. apply naturals_plus_zero.\n    + rew (lt_iff_le_prod_ne _ _); split; [ apply naturals_le_plus; now exists z |].\n      revert Ez. apply aimpl_impl_pos, by_contrapositive. rew E. apply naturals_plus_zero.\n  Qed.\nEnd trich.\n\nGlobal Hint Extern 2 (Trich Nat) => simple refine naturals_trich : typeclass_instances.\nGlobal Hint Extern 2 (Trich (near_rig_car (nats_near_rig ?N))) => simple refine naturals_trich : typeclass_instances.\nGlobal Hint Extern 2 (IsTrich _ (t:=naturals_trich)) => simple notypeclasses refine naturals_trich_correct : typeclass_instances.\n\nGlobal Hint Extern 50 (Trich ?N) => let t := get_instance constr:(NaturalsToMon N) in simple refine naturals_trich : typeclass_instances.\n\n","sentences":[{"i":0,"s":0,"e":51,"kind":"vernac","status":"ok","ms":47,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":52,"e":107,"kind":"vernac","status":"ok","ms":20,"messages":[],"goals":null},{"i":2,"s":108,"e":150,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":3,"s":151,"e":207,"kind":"vernac","status":"ok","ms":37,"messages":[],"goals":null},{"i":4,"s":208,"e":276,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":5,"s":277,"e":320,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":6,"s":322,"e":350,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":7,"s":353,"e":457,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":8,"s":460,"e":494,"kind":"vernac","status":"ok","ms":11,"messages":["4ccb5e8a73caa265","a23f64601478364e","54545722853d8bfc","915d724fde766b4b","360acd3842ed7852","c42304a230469398","e1f0d52ca52cfd4a","9b3a991cb2bdab3e"],"goals":null},{"i":9,"s":498,"e":546,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":{"fg":[{"id":"14","name":null,"hyps":["4e9b220df85ee9ac","2bd6cd7d23c641c0","f463c30cbdcc76b3","93591353443069cd","2694358b65aadc69","7fb5695b0878451f","1a04a086fff614c7","c7a3a81a309f2993"],"ccl":"7b0c13542fac57f0"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":10,"s":549,"e":555, te","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10873,"e":10876,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10948,"e":10951,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10989,"e":10992,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":11051,"e":11054,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11126,"e":11129,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file develops the order theory of the naturals, working in both directions from the characterisation x ≤ y ⧟ ∐ z, y = x + z. Starting from an ordered model of the naturals, it proves that every natural is at least 0, that x ≤ y is equivalent to x < 1 + y ([[AffineConstructive.orders.naturals.naturals_le_plus_1]]) and x < y to 1 + x ≤ y ([[AffineConstructive.orders.naturals.naturals_lt_plus_1]]), and that the order is the one given by the characterisation ([[AffineConstructive.orders.naturals.naturals_le_plus]]). From this it shows that every rig morphism into a strong linear refutative rig order with 1 ≠ 0 is an order embedding ([[AffineConstructive.orders.naturals.naturals_to_rig_ord_embedding]]). In the other direction, [[AffineConstructive.orders.naturals.alt_Build_OrderedNaturals]] starts from an order assumed only to satisfy the characterisation and shows that it is affirmative, decidable, total and translation-invariant, which makes an ordered naturals. Applied to the order defined by that formula, [[AffineConstructive.orders.naturals.naturals_le]], this gives the default order [[AffineConstructive.orders.naturals.naturals_le_order]] and multiplicative cancellation by nonzero elements. Finally, the comparison-with-difference operation of a model gives a correct three-way comparison ([[AffineConstructive.orders.naturals.naturals_trich_correct]]).","short":"The order on the naturals: x ≤ y as ∐ z, y = x + z, its properties and embeddings","items":[{"name":"AffineConstructive.orders.naturals.naturals_nonneg","base":"naturals_nonneg","kind":"inst","start":9,"body":[10,18],"status":"ok","short":{"text":"Every natural x satisfies 0 ≤ x","status":"ok"},"proof":[{"text":"By induction on x, using the induction principle for an extensional family with step n to 1 + n. Two cases remain: 0 ≤ 0, and 0 ≤ 1 + n given 0 ≤ n.","status":"ok","from":0,"to":1},{"text":"The base case holds by reflexivity.","status":"ok","from":2,"to":3},{"text":"For the step, assume 0 ≤ n. Since addition is order preserving, it suffices to show 0 ≤ 1 + 0. This is 0 ≤ 1, which holds by [[AffineConstructive.orders.rings.le_0_1]].","status":"ok","from":4,"to":8}]},{"name":"AffineConstructive.orders.naturals.naturals_le_plus_1","base":"naturals_le_plus_1","kind":"prf","start":19,"body":[20,39],"status":"ok","short":{"text":"For naturals, x ≤ y if and only if x < 1 + y","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.naturals.naturals_distance]] there is a z with x + z = y or x = y + z. The proof treats the two cases separately.","status":"ok","from":0,"to":1},{"text":"In the first case, write y as x + z. Translation by x is an order embedding, so x ≤ x + z is equivalent to 0 ≤ z.","status":"ok","from":2,"to":3},{"text":"0 ≤ z holds by [[AffineConstructive.orders.naturals.naturals_nonneg]], so the left side is true. The same inequality reduces the right side to x < 1 + x. Cancelling the translation by x turns this into 0 < 1, which holds because 1 ≠ 0 in the naturals ([[AffineConstructive.theory.naturals.naturals_one_nonzero]], [[AffineConstructive.orders.rings.lt_0_1]]).","status":"ok","from":4,"to":5},{"text":"In the second case, substitute y + z for x and pass to the duals. The goal becomes y < y + z if and only if 1 + y ≤ y + z.","status":"ok","from":6,"to":8},{"text":"Commute 1 + y to y + 1 and cancel the translation by y on both sides, once as a strict and once as a non-strict order embedding. What remains is 0 < z if and only if 1 ≤ z.","status":"ok","from":9,"to":11},{"text":"By [[AffineConstructive.theory.nno.nno_zero_or_suc]], z is 0 or a successor. If z = 0, the goal is 0 < 0 if and only if 1 ≤ 0. Its dual, 0 ≤ 0 if and only if 0 < 1, is an equivalence of two true statements.","status":"ok","from":12,"to":15},{"text":"If z = 1 + b, both 0 < 1 + b and 1 ≤ 1 + b follow from 0 ≤ b ([[AffineConstructive.orders.naturals.naturals_nonneg]]), the first also using 0 < 1. Two true propositions are equivalent.","status":"ok","from":16,"to":19}]},{"name":"AffineConstructive.orders.naturals.naturals_lt_plus_1","base":"naturals_lt_plus_1","kind":"prf","start":40,"body":[41,43],"status":"ok","short":{"text":"For naturals, x < y if and only if 1 + x ≤ y","status":"ok"},"proof":[{"text":"Take the contrapositive of [[AffineConstructive.orders.naturals.naturals_le_plus_1]] at y and x. The dual of y ≤ x is x < y, and the dual of y < 1 + x is 1 + x ≤ y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.naturals.naturals_le_plus","base":"naturals_le_plus","kind":"prf","start":44,"body":[45,72],"status":"ok","short":{"text":"For naturals, x ≤ y if and only if there is z with y = x + z","status":"ok"},"proof":[{"text":"By induction on x, with the statement quantified over all y.","status":"ok","from":0,"to":1},{"text":"For the base case, fix y. 0 ≤ y holds by [[AffineConstructive.orders.naturals.naturals_nonneg]], so the equivalence reduces to the existence of a z with y = z. Take y itself as the witness.","status":"ok","from":2,"to":7},{"text":"For the step, assume the statement for x and all y, and fix y. By [[AffineConstructive.theory.nno.nno_zero_or_suc]], y is 0 or a successor.","status":"ok","from":8,"to":10},{"text":"If y = 0, pass to the duals. The goal becomes: 0 < 1 + x if and only if 0 ≠ 1 + x + z for every z.","status":"ok","from":11,"to":13},{"text":"0 < 1 + x follows from 0 ≤ x by [[AffineConstructive.orders.naturals.naturals_le_plus_1]], so the left side is true. The universal statement remains.","status":"ok","from":14,"to":14},{"text":"Fix z. After symmetry and reassociation the goal is 1 + (x + z) ≠ 0, which is [[AffineConstructive.theory.nno.nno_suc_nonzero]].","status":"ok","from":15,"to":17},{"text":"If y is the successor of b, that is y = 1 + b, substitute it.","status":"ok","from":18,"to":20},{"text":"Translation by 1 is an order embedding, so 1 + x ≤ 1 + b becomes x ≤ b. The induction hypothesis, specialised at b, turns this into the existence of a z with b = x + z.","status":"ok","from":21,"to":22},{"text":"It suffices to compare the two existentials pointwise ([[AffineConstructive.logic.aprop.aex_aiff]]). Fix w and reassociate. The equivalence of b = x + w and 1 + b = 1 + (x + w) is injectivity of the successor ([[AffineConstructive.theory.set.injective_iff]], [[AffineConstructive.theory.nno.nno_suc_inj]]).","status":"ok","from":23,"to":27}]},{"name":"AffineConstructive.orders.naturals.naturals_to_rig_ord_embedding","base":"naturals_to_rig_ord_embedding","kind":"prf","start":75,"body":[76,123],"status":"ok","short":{"text":"A rig morphism from the naturals into a strong linear refutative rig order with 1 ≠ 0 is an order embedding","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] it suffices to show that x ≤ y if and only if f x ≤ f y. Fix x and y.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.theory.naturals.naturals_distance]] there is a z with x + z = y or x = y + z.","status":"ok","from":3,"to":3},{"text":"In the first case, substitute x + z for y and use that f preserves addition. Cancelling the translation by x in N and by f x in R leaves 0 ≤ z if and only if 0 ≤ f z.","status":"ok","from":4,"to":8},{"text":"0 ≤ z holds by [[AffineConstructive.orders.naturals.naturals_nonneg]], so it remains to show 0 ≤ f z.","status":"ok","from":9,"to":9},{"text":"This is proved for all z by induction. In the base case, f 0 = 0.","status":"ok","from":10,"to":13},{"text":"For the step, f (1 + n) = 1 + f n. Since 0 ≤ f n and addition is order preserving, it suffices to show 0 ≤ 1 + 0, which holds by [[AffineConstructive.orders.rings.le_0_1]].","status":"ok","from":14,"to":18},{"text":"In the second case, pass to the duals: y < x if and only if f y < f x. Substitute y + z for x and use that f preserves addition. Cancelling the strict translations by y and f y leaves 0 < z if and only if 0 < f z.","status":"ok","from":19,"to":24},{"text":"By [[AffineConstructive.theory.nno.nno_zero_or_suc]], z is 0 or a successor. If z = 0, then f 0 = 0 and both sides are 0 < 0, so the equivalence is trivial.","status":"ok","from":25,"to":30},{"text":"If z = 1 + n, then f (1 + n) = 1 + f n. 0 < 1 + n holds by [[AffineConstructive.orders.naturals.naturals_nonneg]] and [[AffineConstructive.orders.rings.lt_0_1]], so it remains to show 0 < 1 + f n.","status":"ok","from":31,"to":36},{"text":"This is proved for all n by induction. In the base case, f 0 = 0 and 0 < 1 + 0 holds by [[AffineConstructive.orders.rings.lt_0_1]].","status":"ok","from":37,"to":41},{"text":"For the step, f (1 + n) = 1 + f n, so the goal is 0 < 1 + (1 + f n). In the linear order the hypothesis 0 < 1 + f n gives 0 ≤ 1 + f n ([[AffineConstructive.orders.orders.lt_le_sub]]). By monotonicity of addition it then suffices to show 0 < 1 + 0, which holds by [[AffineConstructive.orders.rings.lt_0_1]].","status":"ok","from":42,"to":47}]},{"name":"AffineConstructive.orders.naturals.naturals_plus_zero","base":"naturals_plus_zero","kind":"prf","start":130,"body":[131,134],"status":"ok","short":{"text":"For naturals, x = x + y implies y = 0","status":"ok"},"proof":[{"text":"Addition of x is injective ([[AffineConstructive.theory.naturals.naturals_add_cancel]]). Writing x as x + 0, the equality x = x + y is therefore equivalent to 0 = y.","status":"ok","from":0,"to":1},{"text":"The conclusion follows by symmetry.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.naturals.naturals_plus_zero_sum","base":"naturals_plus_zero_sum","kind":"prf","start":135,"body":[136,139],"status":"ok","short":{"text":"For naturals, x = x + y + z implies y = 0 ⊠ z = 0","status":"ok"},"proof":[{"text":"Reassociate the hypothesis to x = x + (y + z). By [[AffineConstructive.theory.naturals.zero_sum]], the conclusion y = 0 ⊠ z = 0 is equivalent to y + z = 0.","status":"ok","from":0,"to":1},{"text":"This is [[AffineConstructive.orders.naturals.naturals_plus_zero]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.naturals.AffirmativeLe_instance_0","base":"AffirmativeLe_instance_0","kind":"inst","start":141,"body":[142,145],"status":"ok","short":{"text":"An order on the naturals given by x ≤ y ⧟ ∐ z, y = x + z is affirmative","status":"ok"},"proof":[{"text":"Fix x and y; the goal is that x ≤ y is affirmative.","status":"ok","from":0,"to":1},{"text":"By the characterisation, x ≤ y is an existential of equalities. Equality on the naturals is decidable, hence affirmative ([[AffineConstructive.theory.nno.nno_dec_eq]], [[AffineConstructive.theory.set.dec_eq_aff_eq]]), and an existential of affirmative propositions is affirmative ([[AffineConstructive.logic.aprop.affirmative_aex]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.naturals.DecidableLe_instance_0","base":"DecidableLe_instance_0","kind":"inst","start":146,"body":[147,171],"status":"ok","short":{"text":"An order on the naturals given by x ≤ y ⧟ ∐ z, y = x + z is decidable","status":"ok"},"proof":[{"text":"Fix x and y. By [[AffineConstructive.theory.naturals.naturals_distance]] there is a z with x + z = y or x = y + z.","status":"ok","from":0,"to":2},{"text":"In the first case x ≤ y holds: by the characterisation it suffices to exhibit z as the witness.","status":"ok","from":3,"to":6},{"text":"In the second case, decide whether z = 0, using that equality on the naturals is decidable ([[AffineConstructive.theory.nno.nno_dec_eq]]).","status":"ok","from":7,"to":8},{"text":"If z = 0, then x ≤ y holds with witness 0, since y = y + 0 + 0.","status":"ok","from":9,"to":14},{"text":"If z ≠ 0, refute x ≤ y. By the characterisation this means refuting the existential: fix w and show y ≠ x + w.","status":"ok","from":15,"to":19},{"text":"Substitute y + z for x. By contraposition it suffices to show that y = y + z + w implies z = 0. [[AffineConstructive.orders.naturals.naturals_plus_zero_sum]] gives z = 0 ⊠ w = 0, and the first factor is kept.","status":"ok","from":20,"to":24}]},{"name":"AffineConstructive.orders.naturals.naturals_le_ne_lt_aux","base":"naturals_le_ne_lt_aux","kind":"prf","start":172,"body":[173,185],"status":"ok","short":{"text":"If x ≤ y means y = x + z for some z, then x ≤ y and x ≠ y give x < y","status":"ok"},"proof":[{"text":"x < y is the negation of y ≤ x. Both orders are rewritten by the characterisation as existentials of equalities.","status":"ok","from":0,"to":2},{"text":"Take a with y = x + a, and assume x ≠ y. To refute the existential, fix z and show x ≠ y + z.","status":"ok","from":3,"to":4},{"text":"By contraposition it suffices to show that x = y + z implies x = y.","status":"ok","from":5,"to":6},{"text":"Substitute x + a for y. By [[AffineConstructive.orders.naturals.naturals_plus_zero_sum]], x = x + a + z gives a = 0 ⊠ z = 0, so it remains to derive x = x + a from this.","status":"ok","from":7,"to":7},{"text":"Equalities of naturals are affirmative, and so is their tensor. By [[AffineConstructive.logic.aprop.affirmative_aimpl]] an implication in the base logic therefore suffices. From a = 0, x = x + 0 follows.","status":"ok","from":8,"to":12}]},{"name":"AffineConstructive.orders.naturals.naturals_dec_order_aux","base":"naturals_dec_order_aux","kind":"prf","start":186,"body":[187,222],"status":"ok","short":{"text":"If x ≤ y means y = x + z for some z, the order on the naturals is a decidable order","status":"ok"},"proof":[{"text":"Decidability of ≤ follows from the characterisation by [[AffineConstructive.orders.naturals.DecidableLe_instance_0]]. What remains is that ≤ is a partial order, and by [[AffineConstructive.orders.orders.alt_Build_Poset]] it suffices to show that it is reflexive and transitive, contains equality and is antisymmetric.","status":"ok","from":0,"to":2},{"text":"Reflexivity: by the characterisation, x ≤ x asks for a z with x = x + z. Take 0 as the witness; x + 0 simplifies to x.","status":"ok","from":3,"to":7},{"text":"Transitivity: fix x, y, z. The order is affirmative, and so is a tensor of affirmative propositions, so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] it suffices to give an ordinary implication from x ≤ y ⊠ y ≤ z to x ≤ z. Rewrite all three inequalities by the characterisation.","status":"ok","from":8,"to":11},{"text":"The hypotheses give a with y = x + a and b with z = y + b. Take a + b as the witness. Substituting the two equations leaves x + a + b = x + (a + b), which is associativity of addition.","status":"ok","from":12,"to":15},{"text":"Equality is contained in the order: fix x and y. Equality of the naturals is decidable, hence affirmative, so it suffices to assume x = y and prove x ≤ y. Take 0 as the witness: y = x + 0 follows from x = y.","status":"ok","from":16,"to":22},{"text":"Antisymmetry: fix x and y. Equality is decidable, hence refutative, so by [[AffineConstructive.logic.aprop.refutative_aimpl_dual]] it suffices to prove the dual implication: from x ≠ y infer y < x or x < y. Assume x ≠ y.","status":"ok","from":23,"to":26},{"text":"The order is decidable, so either y ≤ x or its negation holds. In the first case, y ≤ x together with y ≠ x (the symmetric form of x ≠ y) gives y < x by [[AffineConstructive.orders.naturals.naturals_le_ne_lt_aux]].","status":"ok","from":27,"to":32},{"text":"In the second case the negation of y ≤ x is x < y, the right disjunct.","status":"ok","from":33,"to":35}]},{"name":"AffineConstructive.orders.naturals.props2.let:inst3","base":"let:inst3","kind":"let","start":223,"body":[224,226],"status":"ok","short":{"text":"Makes the decidability of ≤ on N, where x ≤ y means y = x + z for some z, a hypothesis of the section's proofs","status":"ok"},"proof":[{"text":"The section assumes that x ≤ y holds exactly when y = x + z for some z, which is the hypothesis of [[AffineConstructive.orders.naturals.naturals_dec_order_aux]]. That lemma then makes the order decidable, and the proof ends there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.naturals.naturals_total_order_aux","base":"naturals_total_order_aux","kind":"prf","start":227,"body":[228,232],"status":"ok","short":{"text":"If x ≤ y means y = x + z for some z, the order on the naturals is total","status":"ok"},"proof":[{"text":"The order is already known to be decidable. What remains is totality: fix x and y and show x ≤ y or y ≤ x.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.theory.naturals.naturals_distance]] there is a z with x + z = y or x = y + z. In the first case z witnesses x ≤ y, and in the second it witnesses y ≤ x, by the characterisation of the order.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.naturals.props2.let:inst4","base":"let:inst4","kind":"let","start":233,"body":[234,236],"status":"ok","short":{"text":"Makes the totality of ≤ on N, where x ≤ y means y = x + z for some z, a hypothesis of the section's proofs","status":"ok"},"proof":[{"text":"Under the same assumption on the order, that x ≤ y holds exactly when y = x + z for some z, the order is total by [[AffineConstructive.orders.naturals.naturals_total_order_aux]], and the proof ends there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.naturals.AdditiveMonoidOrder_instance_0","base":"AdditiveMonoidOrder_instance_0","kind":"inst","start":237,"body":[238,248],"status":"ok","short":{"text":"With x ≤ y ⧟ ∐ z, y = x + z, the naturals form an ordered additive monoid","status":"ok"},"proof":[{"text":"The additive monoid structure is already known ([[AffineConstructive.theory.naturals.naturals_add_mon]]). What remains is that translation by each z is an order embedding.","status":"ok","from":0,"to":1},{"text":"Fix z. By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] it suffices to show that x ≤ y if and only if z + x ≤ z + y, for all x and y.","status":"ok","from":2,"to":4},{"text":"Rewrite both sides by the characterisation of the order. The two sides are now existentials over the same variable, so by [[AffineConstructive.logic.aprop.aex_aiff]] it suffices to show for each w that y = x + w if and only if z + y = z + x + w.","status":"ok","from":5,"to":7},{"text":"Associativity turns z + x + w into z + (x + w). The equivalence is then the statement that translation by z is injective ([[AffineConstructive.theory.set.injective_iff]]), which is cancellation of addition in the naturals ([[AffineConstructive.theory.naturals.naturals_add_cancel]]).","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.orders.naturals.alt_Build_OrderedNaturals","base":"alt_Build_OrderedNaturals","kind":"prf","start":249,"body":[250,274],"status":"ok","short":{"text":"An order on the naturals with x ≤ y iff y = x + z for some z makes them ordered naturals","status":"ok"},"proof":[{"text":"The remaining requirement is a strong linear refutative rig order. The decidable total order is strong, refutative and linear, and addition preserves it by the preceding instance. So by [[AffineConstructive.orders.rings.strong_linear_refutative_rig_order_from_partial_minus]] two facts remain: x < y gives a positive difference z with y = x + z, and a product of positive elements is positive.","status":"ok","from":0,"to":2},{"text":"Positive differences: fix x and y. The order is refutative, so the strict order is affirmative, and it suffices to assume x < y in the base logic.","status":"ok","from":3,"to":6},{"text":"x < y gives x ≤ y by [[AffineConstructive.orders.orders.lt_le]], and the characterisation then gives z with y = x + z.","status":"ok","from":7,"to":9},{"text":"Take z as the witness; the equation y = x + z is at hand. For 0 < z, translation by x reflects the strict order ([[AffineConstructive.orders.maps.strictly_order_reflecting_simp]]), so it suffices that x + 0 < x + z, that is x < x + z. By y = x + z this is the assumption x < y.","status":"ok","from":10,"to":12},{"text":"Positive products: fix x and y. Argue by contraposition ([[AffineConstructive.logic.aprop.by_contrapositive]]): the dual statement says that x · y ≤ 0 implies x ≤ 0 par y ≤ 0. The order is affirmative, so it suffices to assume x · y ≤ 0 in the base logic.","status":"ok","from":13,"to":16},{"text":"An additive or implies the par ([[AffineConstructive.logic.aprop.aor_apar]]), and equality implies ≤, so it suffices to show x = 0 or y = 0. Since the naturals have no zero divisors ([[AffineConstructive.theory.naturals.naturals_strong_no_zero_divisors]]), this follows from x · y = 0.","status":"ok","from":17,"to":19},{"text":"By antisymmetry, and given x · y ≤ 0, it remains to show 0 ≤ x · y. By the characterisation x · y itself is the witness, since 0 + x · y simplifies to x · y.","status":"ok","from":20,"to":24}]},{"name":"AffineConstructive.orders.naturals.naturals_dec_order","base":"naturals_dec_order","kind":"def","start":276,"body":null,"status":"ok","short":{"text":"The order of an ordered model of the naturals is a decidable order","status":"ok"},"long":{"text":"The decidable-order structure of an ordered model of the naturals. It is [[AffineConstructive.orders.naturals.naturals_dec_order_aux]] applied to the characterisation [[AffineConstructive.orders.naturals.naturals_le_plus]]. It is declared as a coercion, so that every [[AffineConstructive.interfaces.naturals.OrderedNaturals]] instance provides a [[AffineConstructive.interfaces.orders.DecidableOrder]], in which each comparison x ≤ y either holds or fails.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.naturals.naturals_total_order","base":"naturals_total_order","kind":"def","start":277,"body":null,"status":"ok","short":{"text":"The order of an ordered model of the naturals is total","status":"ok"},"long":{"text":"The total-order structure of an ordered model of the naturals: for any x and y, x ≤ y or y ≤ x, with the additive disjunction. It is [[AffineConstructive.orders.naturals.naturals_total_order_aux]] applied to [[AffineConstructive.orders.naturals.naturals_le_plus]], and it is declared as a coercion from [[AffineConstructive.interfaces.naturals.OrderedNaturals]] to [[AffineConstructive.interfaces.orders.TotalOrder]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.naturals.naturals_le","base":"naturals_le","kind":"def","start":278,"body":null,"status":"ok","short":{"text":"The default order on the naturals: x ≤ y when y = x + z for some z","status":"ok"},"long":{"text":"The default order on a set with an addition: x ≤ y is the affine proposition that there is z with y = x + z. The affine existential makes the order affirmative, since it is proved by exhibiting the difference, and its refutation says that y differs from x + z for every z.\n\nThe definition needs only the addition. Resolution hints make it the order found on the concrete naturals and on any set with a map out of the naturals. With [[AffineConstructive.orders.naturals.naturals_le_order]], every model of [[AffineConstructive.interfaces.naturals.Naturals]] becomes an ordered model under this order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.naturals.naturals_le_correct","base":"naturals_le_correct","kind":"prf","start":283,"body":[284,286],"status":"ok","short":{"text":"Under the default order, x ≤ y if and only if there is z with y = x + z","status":"ok"},"proof":[{"text":"The default order [[AffineConstructive.orders.naturals.naturals_le]] is defined by this formula, so for each x and y the equivalence holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.naturals.naturals_le_order","base":"naturals_le_order","kind":"def","start":287,"body":null,"status":"ok","short":{"text":"Any model of the naturals, ordered by the default order, is an ordered model of the naturals","status":"ok"},"long":{"text":"The canonical ordered structure on a model of the naturals: [[AffineConstructive.orders.naturals.alt_Build_OrderedNaturals]] applied to the default order [[AffineConstructive.orders.naturals.naturals_le]], whose characterisation [[AffineConstructive.orders.naturals.naturals_le_correct]] holds by definition. It equips any model of [[AffineConstructive.interfaces.naturals.Naturals]] with an [[AffineConstructive.interfaces.naturals.OrderedNaturals]] structure, and so with a [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRigOrder]].\n\nResolution hints register it as the source of every order class the default order satisfies: preorder, weak, strong and decidable poset, linear and total order, affirmative, refutative, decidable and strong order, and additive monoid order. This makes all of the order theory available for the naturals without further assumptions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.naturals.naturals_mult_cancel","base":"naturals_mult_cancel","kind":"def","start":303,"body":null,"status":"ok","short":{"text":"In the naturals, multiplication by an element apart from 0 cancels","status":"ok"},"long":{"text":"Cancellation by nonzero factors in any model of [[AffineConstructive.interfaces.naturals.Naturals]]: if c ≠ 0, then c · x = c · y implies x = y, on either side. It is obtained from the ordered structure [[AffineConstructive.orders.naturals.naturals_le_order]], whose rig order provides [[AffineConstructive.interfaces.abstract_algebra.NonZeroMultiplicativeCancellation]]. The order serves here only as a means of proof, since the statement involves only the rig. It is declared as a coercion from [[AffineConstructive.interfaces.naturals.Naturals]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.naturals.naturals_trich","base":"naturals_trich","kind":"inst","start":306,"body":null,"status":"ok","short":{"text":"The three-way comparison of naturals, read off from the comparison-with-difference map","status":"ok"},"long":{"text":"The three-way comparison function on a set with a comparison-with-difference map [[AffineConstructive.interfaces.naturals.nat_subtract]]. It compares x and y by that map and keeps only the outcome: less, equal or greater, without the difference.\n\nResolution hints make it the comparison found on the concrete naturals and on any set with a map out of the naturals. Its correctness, [[AffineConstructive.orders.naturals.naturals_trich_correct]], depends on the specification [[AffineConstructive.interfaces.naturals.NatSubtractSpec]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.naturals.naturals_trich_correct","base":"naturals_trich_correct","kind":"prf","start":307,"body":[308,325],"status":"ok","short":{"text":"With a correct comparison-with-difference map, the three-way comparison on ordered naturals is correct","status":"ok"},"proof":[{"text":"Fix x and y. By its definition [[AffineConstructive.orders.naturals.naturals_trich]], the comparison of x and y is read off from the outcome of comparing them with difference, so it suffices to show that this outcome is correct.","status":"ok","from":0,"to":3},{"text":"Split into cases on that outcome, each carrying its specification ([[AffineConstructive.interfaces.naturals.nat_subtract_spec]]). The equal case is immediate. The less-than case gives z with x + z = y and z ≠ 0, and the greater-than case gives z with x = y + z and z ≠ 0.","status":"ok","from":4,"to":4},{"text":"Less than: by [[AffineConstructive.orders.orders.lt_iff_le_prod_ne]], x < y means x ≤ y ⊠ x ≠ y. z witnesses x ≤ y by [[AffineConstructive.orders.naturals.naturals_le_plus]]. It remains to show x ≠ y.","status":"ok","from":5,"to":6},{"text":"By contraposition it suffices that x = y implies z = 0. Writing y as x + z, this is [[AffineConstructive.orders.naturals.naturals_plus_zero]].","status":"ok","from":7,"to":10},{"text":"Greater than, symmetrically: y < x means y ≤ x ⊠ y ≠ x. z witnesses y ≤ x by [[AffineConstructive.orders.naturals.naturals_le_plus]]. It remains to show y ≠ x.","status":"ok","from":11,"to":12},{"text":"By contraposition it suffices that y = x implies z = 0. Writing x as y + z, this is [[AffineConstructive.orders.naturals.naturals_plus_zero]] again.","status":"ok","from":13,"to":17}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.implementations.nat":{"page":"../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.theory.naturals":{"page":"../theory/naturals.html","short":"General theory of the naturals: uniqueness, NNO, commutative rig, cancellation, induction","summary":"This file develops the general theory of the [[Naturals]] interface, which characterises the natural numbers as a near-rig initial among additive monoids with a chosen 1. It shows that any two models are isomorphic through their canonical maps ([[naturals_to_naturals_bijective]]), that a retract of a model is again a model ([[retract_is_nat]]), and that every model is a natural numbers object ([[naturals_nno]]) via the concrete naturals [[Nat]]. On the algebraic side, every model is a commutative rig ([[naturals_is_com_rig]]), its canonical map into any near-rig is a rig morphism ([[naturals_to_mon_rig_mor]]), 1 ≠ 0 holds, addition cancels, there are no zero divisors in the strong sense, and x + y = 0 if and only if x = 0 ⊠ y = 0 ([[zero_sum]]). The file also gives induction principles phrased with 1 + n in place of the successor ([[naturals_ind]], [[naturals_ind_alt]], the tactic [[naturals_induction]]), the distance lemma [[naturals_distance]], and facts about negating the images of naturals in near-rings and rings."},"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.ring_order":{"page":"../interfaces/ring_order.html","short":"Cones of a poset with zero; ordered monoids, groups, rigs and rings","summary":"The file defines the cones of a weak poset with a zero: the subsets of nonzero, nonnegative (R⁺), nonpositive (R⁻), positive (R₊) and negative (R₋) elements, as affine subsets, so that each carries its refutation. It then defines the interfaces for ordered algebra. An ordered additive monoid is a poset and additive monoid in which every left translation z + _ is an order embedding: it both preserves and reflects the order. An ordered additive group asks only that every left translation preserve the order. A strong linear refutative rig order is a rig with a strongly transitive, pseudo-total, refutative partial order that is an ordered additive monoid, with the axiom that b < a and d < c imply a·d + b·c < a·c + b·d. This is positivity of (a − b)(c − d) stated without subtraction. The ring version, with an ordered additive group, asks instead that a product of positive elements be positive. Hints let resolution find that left addition preserves, reflects or embeds the order. The theory of these structures is developed in orders.groups and orders.rings."},"AffineConstructive.theory.groups":{"page":"../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.rings":{"page":"../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.groups":{"page":"groups.html","short":"Ordered additive monoids and groups: translations, negation, and sign under morphisms","summary":"This file proves the basic order laws of ordered additive monoids and groups. For an ordered monoid it shows that every right translation (+z) is an order embedding and that addition is order preserving in both arguments. It also proves that 0 ≤ z and y = x + z together imply x ≤ y ([[compose_le]], with the strict version [[compose_lt]]), proves the mixed strict and non-strict addition laws, derives additive cancellation, and shows that the nonnegative part is again an ordered monoid. For an additive monoid morphism it proves how sign is preserved, reflected and embedded, both for monotone maps and for order-reversing ones, where each strict statement is the contrapositive of a non-strict one. It then shows that an ordered group is an ordered monoid ([[AdditiveGroupOrder_AdditiveMonoidOrder]]) and that negation is an order-reversing embedding ([[negate_order_embedding_flip]]). It ends with lemmas comparing x with −x according to its sign: those whose hypothesis is non-strict, and their contrapositives, need a strongly transitive order, while [[pos_between]], [[neg_between]] and their contrapositives need a linear, refutative order."},"AffineConstructive.orders.rings":{"page":"rings.html","short":"Ordered rigs and rings: compatibility of multiplication with the order, signs, squares, the nonnegative cone","summary":"This file develops ordered rigs and rings, that is, rigs with a strong, linear, refutative order that addition preserves and that obeys the strict compatibility law [[mult_lt_compat_full]]. Rings are the same but with closure of the positive cone under products. The order passes to the opposite ring, so each result about multiplication on the left gives its right-hand version for free. The non-strict compatibility law [[mult_le_compat_full]] is derived from the strict one through linearity and refutativity. [[strong_linear_refutative_rig_order_from_partial_minus]] builds a rig order from a partial subtraction and closure of the positive elements under products, and it shows that every ring order is a rig order. The consequences follow from these laws: no zero divisors, and cancellation by elements apart from 0. Multiplication by a nonnegative element preserves the order and multiplication by a nonpositive one reverses it. Multiplication by a positive or a negative element is an order embedding, order-preserving or order-reversing according to the sign. A square is nonnegative, and positive when the element is apart from 0, which gives 0 ≤ 1 and 0 ≤ 2, and also 0 < 1, 0 < 2 and 2 ≠ 0 when 1 ≠ 0. The file closes with the swap law [[minus_le_swap]] for differences and with the nonnegative cone R⁺, which is a sub-near-rig and carries the same kind of order."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."}},"constants":null}</script>

neConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":16685,"e":16688,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":16713,"e":16716,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":16760,"e":16763,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":17032,"e":17049,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../interfaces/aprop.html"},{"s":17195,"e":17212,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../interfaces/aprop.html"},{"s":18006,"e":18009,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":18215,"e":18218,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":18395,"e":18398,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":18427,"e":18430,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":18460,"e":18463,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":18885,"e":18889,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":19349,"e":19352,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":19604,"e":19607,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":20402,"e":20414,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"},{"s":20473,"e":20485,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"},{"s":21466,"e":21469,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":21478,"e":21490,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"}],"gloss":{"summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[AffineConstructive.orders.orders.le_antisym_iff]], [[AffineConstructive.orders.orders.ne_iff_lt]], [[AffineConstructive.orders.orders.le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[AffineConstructive.orders.orders.le_prod_ne_lt]], and the mixed transitivity laws [[AffineConstructive.orders.orders.le_lt_trans]] and [[AffineConstructive.orders.orders.lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[AffineConstructive.orders.orders.lt_le]], [[AffineConstructive.orders.orders.lt_trans]] and, when the order is refutative, [[AffineConstructive.orders.orders.le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[AffineConstructive.orders.orders.induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏.","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","items":[{"name":"AffineConstructive.orders.orders.le_dual","base":"le_dual","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"The negation of x ≤ y has y < x as its De Morgan normal form","status":"ok"},"long":{"text":"The strict order is defined as a negation: y < x is (x ≤ y)ᗮ. This definition registers y < x as the normal form of the negation of x ≤ y. When the rewriting system pushes a negation inward, a negated comparison therefore becomes a strict comparison and does not stay as a bare negation. The proof is the generic [[AffineConstructive.logic.aprop.demorgan_dual_base]], which applies because y < x unfolds to exactly that negation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.lt_dual","base":"lt_dual","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"The negation of x < y has y ≤ x as its De Morgan normal form","status":"ok"},"long":{"text":"The counterpart of [[AffineConstructive.orders.orders.le_dual]]. Since x < y is (y ≤ x)ᗮ, its negation is a double negation, and in the affine logic a double negation is the proposition itself. This definition registers y ≤ x as the normal form, by [[AffineConstructive.logic.aprop.anot_dual]]. Together with [[AffineConstructive.orders.orders.le_dual]], it makes the rewriting system treat ≤ and < as exact duals of each other.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.lt_proper_aimpl","base":"lt_proper_aimpl","kind":"prf","start":9,"body":[10,14],"status":"ok","short":{"text":"If x₂ ≤ x₁ and y₁ ≤ y₂, then x₁ < y₁ implies x₂ < y₂","status":"ok"},"proof":[{"text":"Assume x₂ ≤ x₁ and y₁ ≤ y₂. It remains to show that x₁ < y₁ implies x₂ < y₂.","status":"ok","from":0,"to":1},{"text":"Pass to the contrapositive. Since the dual of x < y is y ≤ x ([[AffineConstructive.orders.orders.lt_dual]]), the goal becomes y₂ ≤ x₂ implies y₁ ≤ x₁.","status":"ok","from":2,"to":2},{"text":"This follows by transitivity: combine y₁ ≤ y₂ on the left with y₂ ≤ x₂, then with x₂ ≤ x₁ on the right.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.orders.lt_proper_aiff","base":"lt_proper_aiff","kind":"prf","start":15,"body":[16,20],"status":"ok","short":{"text":"If x₁ = x₂ and y₁ = y₂, then x₁ < y₁ if and only if x₂ < y₂","status":"ok"},"proof":[{"text":"Assume x₁ = x₂ and y₁ = y₂. It remains to show that x₁ < y₁ if and only if x₂ < y₂.","status":"ok","from":0,"to":1},{"text":"It suffices to prove the equivalence of the duals, which by [[AffineConstructive.orders.orders.lt_dual]] is y₁ ≤ x₁ if and only if y₂ ≤ x₂.","status":"ok","from":2,"to":2},{"text":"A transitive relation that contains equality respects it, so rewriting by the two equalities closes the goal.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.orders.IsDecLe_DecidableRelation","base":"IsDecLe_DecidableRelation","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"An order with a correct decision function is decidable","status":"ok"},"long":{"text":"When the order of X comes with a boolean decision function whose answers are correct ([[AffineConstructive.interfaces.orders.IsDecLe]]), every comparison x ≤ y is a decidable affine proposition ([[AffineConstructive.interfaces.orders.DecidableLe]]). This definition is the general fact [[AffineConstructive.logic.relations.IsDec_Decidable]], specialised to the order. It is declared a coercion, so a correct decision procedure is enough wherever decidability of the order is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.dec_le_aff_eq","base":"dec_le_aff_eq","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"A decidable order is affirmative","status":"ok"},"long":{"text":"In Shulman's terms, a decidable proposition is both affirmative and refutative. This definition is the affirmative half of that fact for the comparisons of an order. It is declared a coercion, so a decidable order can be used wherever every comparison x ≤ y must be affirmative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.dec_le_ref_eq","base":"dec_le_ref_eq","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"A decidable order is refutative","status":"ok"},"long":{"text":"The refutative half of the fact that a decidable proposition is both affirmative and refutative, applied to the comparisons of an order. It is declared a coercion alongside [[AffineConstructive.orders.orders.dec_le_aff_eq]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.dec_le_strong","base":"dec_le_strong","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"A decidable preorder is strongly transitive","status":"ok"},"long":{"text":"Strong transitivity asks for x ≤ y ∧ y ≤ z to imply x ≤ z, with the additive conjunction in the hypothesis rather than the tensor. This is stronger than ordinary transitivity, because the additive hypothesis offers only one of its conjuncts. For a decidable relation the two forms agree, by [[AffineConstructive.logic.relations.dec_trans_strong]]. This definition applies that fact to a decidable preorder. It is the step that makes a decidable order a strong poset in [[AffineConstructive.orders.orders.dec_order_strong]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.dec_order_aff","base":"dec_order_aff","kind":"def","start":29,"body":[30,32],"status":"ok","short":{"text":"A decidable order is an affirmative order","status":"ok"},"proof":[{"text":"An affirmative order needs an affirmative ≤, and a decidable ≤ is affirmative by [[AffineConstructive.orders.orders.dec_le_aff_eq]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.dec_order_ref","base":"dec_order_ref","kind":"def","start":33,"body":[34,36],"status":"ok","short":{"text":"A decidable order is a refutative order","status":"ok"},"proof":[{"text":"A refutative order needs a refutative ≤, and a decidable ≤ is refutative by [[AffineConstructive.orders.orders.dec_le_ref_eq]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.dec_order_strong","base":"dec_order_strong","kind":"def","start":37,"body":[38,41],"status":"ok","short":{"text":"A decidable order is a strong poset","status":"ok"},"proof":[{"text":"The poset structure comes from the decidable order. What remains is strong transitivity of ≤.","status":"ok","from":0,"to":1},{"text":"A decidable preorder is strongly transitive, by [[AffineConstructive.orders.orders.dec_le_strong]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.go","base":"go","kind":"ltac","start":43,"body":null,"also":[76],"status":"ok","short":{"text":"Proves an order class on an opposite order by reducing it to the class on the converse relation","status":"ok"},"long":{"text":"The file defines this tactic twice, once in each of its two sections on opposite orders. Each version proves a single instance of the form \"class C on the opposite of X\" from C on X. It first unfolds the class to its defining statement, or splits it into its fields when the class is a record, and closes by resolution every field that resolution can find directly. In each field that remains, it replaces the order of the opposite by the relation that order is defined to be, the converse of the order of X. Resolution then finds the property for the converse from the property for X, which is in context.\n\nThe first version handles the order-only classes ([[AffineConstructive.interfaces.orders.PreOrder]], [[AffineConstructive.interfaces.orders.StrongLe]], [[AffineConstructive.interfaces.orders.DecidableLe]], [[AffineConstructive.interfaces.orders.AffirmativeLe]], [[AffineConstructive.interfaces.orders.RefutativeLe]]) on [[AffineConstructive.interfaces.relation_notation.order_op]] of a type, and also unfolds [[AffineConstructive.interfaces.relation_notation.order_op]] so that resolution sees the underlying type. The second version handles the classes of ordered sets ([[AffineConstructive.interfaces.orders.WeakPoset]], [[AffineConstructive.interfaces.orders.Poset]], [[AffineConstructive.interfaces.orders.StrongPoset]], [[AffineConstructive.interfaces.orders.DecidableOrder]], [[AffineConstructive.interfaces.orders.AffirmativeOrder]], [[AffineConstructive.interfaces.orders.RefutativeOrder]], [[AffineConstructive.interfaces.orders.TotalOrder]], [[AffineConstructive.interfaces.orders.LinearOrder]]) on [[AffineConstructive.interfaces.algebra_notation.Order_op]] of a set, where the equality is unchanged and only the order needs restating. The tactic exists so that each of these instances is a one-line proof.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.PreOrder_op","base":"PreOrder_op","kind":"inst","start":44,"body":[45,47],"status":"ok","short":{"text":"The opposite of a preorder is a preorder","status":"ok"},"proof":[{"text":"The opposite order is the converse relation. It is reflexive because ≤ is, and transitive because the converse of a transitive relation is transitive ([[AffineConstructive.logic.relations.flip_Transitive]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.StrongLe_op","base":"StrongLe_op","kind":"inst","start":48,"body":[49,51],"status":"ok","short":{"text":"The opposite of a strongly transitive order is strongly transitive","status":"ok"},"proof":[{"text":"The opposite order is the converse relation, and the converse of a strongly transitive relation is strongly transitive ([[AffineConstructive.logic.relations.flip_StronglyTransitive]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.DecidableLe_op","base":"DecidableLe_op","kind":"inst","start":52,"body":[53,55],"status":"ok","short":{"text":"The opposite of a decidable order is decidable","status":"ok"},"proof":[{"text":"The opposite order is the converse relation, and the converse of a decidable relation is decidable ([[AffineConstructive.logic.relations.flip_DecidableRelation]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.AffirmativeLe_op","base":"AffirmativeLe_op","kind":"inst","start":56,"body":[57,59],"status":"ok","short":{"text":"The opposite of an affirmative order is affirmative","status":"ok"},"proof":[{"text":"The opposite order is the converse relation, and the converse of an affirmative relation is affirmative ([[AffineConstructive.logic.relations.flip_AffirmativeRelation]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.RefutativeLe_op","base":"RefutativeLe_op","kind":"inst","start":60,"body":[61,63],"status":"ok","short":{"text":"The opposite of a refutative order is refutative","status":"ok"},"proof":[{"text":"The opposite order is the converse relation, and the converse of a refutative relation is refutative ([[AffineConstructive.logic.relations.flip_RefutativeRelation]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.WeakPoset_op","base":"WeakPoset_op","kind":"inst","start":77,"body":[78,80],"status":"ok","short":{"text":"The opposite of a weak poset is a weak poset","status":"ok"},"proof":[{"text":"Each field of a weak poset passes to the opposite order: the opposite of a preorder is a preorder ([[AffineConstructive.orders.orders.PreOrder_op]]), and the converse of the order is again pseudo-antisymmetric for the same equality and still contains it, since equality is symmetric.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.Poset_op","base":"Poset_op","kind":"inst","start":81,"body":[82,84],"status":"ok","short":{"text":"The opposite of a poset is a poset","status":"ok"},"proof":[{"text":"The opposite is a weak poset by [[AffineConstructive.orders.orders.WeakPoset_op]], and the converse of an antisymmetric relation is antisymmetric for the same equality, which is the remaining field.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.StrongPoset_op","base":"StrongPoset_op","kind":"inst","start":85,"body":[86,88],"status":"ok","short":{"text":"The opposite of a strong poset is a strong poset","status":"ok"},"proof":[{"text":"The opposite is a poset by [[AffineConstructive.orders.orders.Poset_op]], and strong transitivity passes to the opposite order by [[AffineConstructive.orders.orders.StrongLe_op]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.DecidableOrder_op","base":"DecidableOrder_op","kind":"inst","start":89,"body":[90,92],"status":"ok","short":{"text":"The opposite of a decidable order is a decidable order","status":"ok"},"proof":[{"text":"The opposite is a poset by [[AffineConstructive.orders.orders.Poset_op]], and its order is decidable because the order of X is, by [[AffineConstructive.orders.orders.DecidableLe_op]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.AffirmativeOrder_op","base":"AffirmativeOrder_op","kind":"inst","start":93,"body":[94,96],"status":"ok","short":{"text":"The opposite of an affirmative order is an affirmative order","status":"ok"},"proof":[{"text":"The opposite is a poset by [[AffineConstructive.orders.orders.Poset_op]], and its order is affirmative because the order of X is, by [[AffineConstructive.orders.orders.AffirmativeLe_op]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.RefutativeOrder_op","base":"RefutativeOrder_op","kind":"inst","start":97,"body":[98,100],"status":"ok","short":{"text":"The opposite of a refutative order is a refutative order","status":"ok"},"proof":[{"text":"The opposite is a poset by [[AffineConstructive.orders.orders.Poset_op]], and its order is refutative because the order of X is, by [[AffineConstructive.orders.orders.RefutativeLe_op]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.TotalOrder_op","base":"TotalOrder_op","kind":"inst","start":101,"body":[102,104],"status":"ok","short":{"text":"The opposite of a total order is a total order","status":"ok"},"proof":[{"text":"The opposite is a poset by [[AffineConstructive.orders.orders.Poset_op]], and the converse of a total relation is total, which gives totality of the opposite order.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.LinearOrder_op","base":"LinearOrder_op","kind":"inst","start":105,"body":[106,108],"status":"ok","short":{"text":"The opposite of a linear order is a linear order","status":"ok"},"proof":[{"text":"The opposite is a poset by [[AffineConstructive.orders.orders.Poset_op]], and the converse of a pseudo-total relation is pseudo-total, which gives linearity of the opposite order.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.alt_Build_WeakPoset","base":"alt_Build_WeakPoset","kind":"prf","start":118,"body":[119,122],"status":"ok","short":{"text":"An order that is reflexive, transitive, contains equality and is pseudo-antisymmetric makes a weak poset","status":"ok"},"proof":[{"text":"Assume the order is reflexive and transitive, contains equality, and is pseudo-antisymmetric.","status":"ok","from":0,"to":1},{"text":"Unfolding the structure of a weak poset, each field is one of the four assumptions.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.alt_Build_Poset","base":"alt_Build_Poset","kind":"prf","start":123,"body":[124,127],"status":"ok","short":{"text":"An order that is reflexive, transitive, contains equality and is antisymmetric makes a poset","status":"ok"},"proof":[{"text":"Assume the order is reflexive and transitive, contains equality, and is antisymmetric.","status":"ok","from":0,"to":1},{"text":"Unfolding the structure of a poset, each field is one of the assumptions, except pseudo-antisymmetry, which follows from antisymmetry by [[AffineConstructive.logic.relations.Antisymmetric_PseudoAntisymmetric]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.preorder_is_set","base":"preorder_is_set","kind":"inst","start":132,"body":[133,148],"status":"ok","short":{"text":"For a preorder, an equality characterised as x ≤ y ∧ y ≤ x is an equivalence","status":"ok"},"proof":[{"text":"An equivalence relation has three laws: reflexivity, symmetry and transitivity. Rewriting each equality by its characterisation as two-sided comparison leaves each law to prove for x ≤ y ∧ y ≤ x.","status":"ok","from":0,"to":1},{"text":"Reflexivity: both conjuncts of x ≤ x ∧ x ≤ x hold by reflexivity of the preorder.","status":"ok","from":2,"to":3},{"text":"Symmetry: the two conjuncts change places. The right projection gives the first conjunct y ≤ x and the left projection gives the second, x ≤ y.","status":"ok","from":4,"to":5},{"text":"Transitivity: the conclusion is an additive conjunction, so each conjunct is proved from the whole hypothesis in turn.","status":"ok","from":6,"to":7},{"text":"For x ≤ z, keep the left conjunct of each factor, x ≤ y and y ≤ z. These compose by transitivity.","status":"ok","from":8,"to":10},{"text":"For z ≤ x, keep the right conjunct of each factor, y ≤ x and z ≤ y. Swapping the two factors puts them in the order z ≤ y ⊠ y ≤ x, and they compose by transitivity.","status":"ok","from":11,"to":15}]},{"name":"AffineConstructive.orders.orders.induced_poset","base":"induced_poset","kind":"def","start":149,"body":null,"status":"ok","short":{"text":"The set carried by a preordered type whose equality is x ≤ y ∧ y ≤ x","status":"ok"},"long":{"text":"The construction takes a type with a preorder and an equality, together with a proof that x = y holds if and only if x ≤ y ∧ y ≤ x. Under that characterisation the equality is an equivalence ([[AffineConstructive.orders.orders.preorder_is_set]]), so the type becomes a set, and [[AffineConstructive.orders.orders.induced_poset_poset]] shows that its order makes it a poset. The characterisation uses the additive conjunction, so the result is antisymmetric in the sense of [[AffineConstructive.interfaces.orders.Poset]] and not only pseudo-antisymmetric. Traditionally this is the poset reflection of a preorder, with the difference that no quotient is taken: the elements stay the same and the equality is replaced by mutual comparison.\n\nThe development uses it wherever a collection of structures is compared by an order and the structures are to be identified when each lies below the other. [[AffineConstructive.topology.topology.induced.Pred]] is the set of affine predicates on a type, ordered and identified pointwise. [[AffineConstructive.topology.topology.induced.induced_topology_set]] identifies points with the same neighbourhoods. [[AffineConstructive.topology.interfaces.reflection_pair.fib_set]] is the fibre over a set in a reflection pair: the structures on it, up to mutual comparison.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.induced_poset_poset","base":"induced_poset_poset","kind":"prf","start":151,"body":[152,154],"status":"ok","short":{"text":"The set induced by a preorder, with equality x ≤ y ∧ y ≤ x, is a poset","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.orders.alt_Build_Poset]] it suffices that the order is reflexive and transitive, contains equality, and is antisymmetric. The preorder supplies the first two. Rewriting the induced equality as x ≤ y ∧ y ≤ x, containment is its left projection and antisymmetry is an identity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.AProp_is_preorder","base":"AProp_is_preorder","kind":"prf","start":156,"body":[157,159],"status":"ok","short":{"text":"Implication is a preorder on the affine propositions","status":"ok"},"proof":[{"text":"With the order on Ω unfolded to implication, the two preorder laws are reflexivity and transitivity of implication.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.AProp_is_poset","base":"AProp_is_poset","kind":"prf","start":161,"body":[162,164],"status":"ok","short":{"text":"Ω is a poset under implication, with equivalence ⧟ as its equality","status":"ok"},"proof":[{"text":"Ω is the poset induced by the implication preorder [[AffineConstructive.orders.orders.AProp_is_preorder]]. Its equality ⧟ is two-sided implication, so [[AffineConstructive.orders.orders.induced_poset_poset]] applies.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.anot_order_embedding_flip","base":"anot_order_embedding_flip","kind":"prf","start":168,"body":[169,171],"status":"ok","short":{"text":"Negation is an order-reversing embedding of Ω: P ⊸ Q if and only if Qᗮ ⊸ Pᗮ","status":"ok"},"proof":[{"text":"The claim says that P ⊸ Q holds if and only if Qᗮ ⊸ Pᗮ does. This is the law of contraposition, which affine implication carries by definition, so the decision procedure for the connectives proves it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.eq_le","base":"eq_le","kind":"def","start":175,"body":null,"status":"ok","short":{"text":"In a weak poset, x = y implies x ≤ y","status":"ok"},"long":{"text":"In a weak poset the order contains equality ([[AffineConstructive.interfaces.orders.eq_le_sub]]). This definition restates that fact for the two elements x and y, as an implication that can be used for rewriting and as a law. The proof search uses it to derive x ≤ y from an equality in context.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.eq_le_flip","base":"eq_le_flip","kind":"def","start":176,"body":null,"status":"ok","short":{"text":"In a weak poset, x = y implies y ≤ x","status":"ok"},"long":{"text":"This is [[AffineConstructive.orders.orders.eq_le]] read in the opposite order. Equality is the same in the opposite order, so x = y gives x ≤ y there, which is y ≤ x in the original order. Symmetry of equality is not used.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.lt_ne","base":"lt_ne","kind":"prf","start":177,"body":[178,180],"status":"ok","short":{"text":"In a weak poset, x < y implies x ≠ y","status":"ok"},"proof":[{"text":"Pass to the contrapositive. The dual of x ≠ y is x = y, and the dual of x < y is y ≤ x, so it remains to show that x = y implies y ≤ x, which is [[AffineConstructive.orders.orders.eq_le_flip]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.lt_ne_flip","base":"lt_ne_flip","kind":"def","start":181,"body":null,"status":"ok","short":{"text":"In a weak poset, x < y implies y ≠ x","status":"ok"},"long":{"text":"This is [[AffineConstructive.orders.orders.lt_ne]] read in the opposite order, where x < y becomes y < x. It gives the inequality with its arguments swapped and does not use symmetry.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.le_antisym_iff","base":"le_antisym_iff","kind":"prf","start":183,"body":[184,190],"status":"ok","short":{"text":"In a poset, x ≤ y ∧ y ≤ x if and only if x = y","status":"ok"},"proof":[{"text":"Prove the two implications separately. The forward implication is antisymmetry of the poset.","status":"ok","from":0,"to":3},{"text":"For the converse, the conclusion is an additive conjunction, so each conjunct is proved from x = y. The first comes from [[AffineConstructive.orders.orders.eq_le]] and the second from [[AffineConstructive.orders.orders.eq_le_flip]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.orders.ne_iff_lt","base":"ne_iff_lt","kind":"prf","start":191,"body":[192,196],"status":"ok","short":{"text":"In a poset, x ≠ y if and only if x < y or y < x","status":"ok"},"proof":[{"text":"Pass to the duals of both sides. The dual of x ≠ y is x = y, and the dual of x < y ∨ y < x is y ≤ x ∧ x ≤ y. It remains to show that these two are equivalent.","status":"ok","from":0,"to":1},{"text":"Read from right to left, this is [[AffineConstructive.orders.orders.le_antisym_iff]] instantiated at the opposite poset, where y ≤ x becomes x ≤ y.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.orders.le_lt_par_eq","base":"le_lt_par_eq","kind":"prf","start":197,"body":[198,202],"status":"ok","short":{"text":"In a weak poset, x ≤ y implies x < y ⊞ x = y","status":"ok"},"proof":[{"text":"Pseudo-antisymmetry lets x ≤ y ⊠ y ≤ x stand in for x = y, so it suffices to prove that x ≤ y implies x < y ⊞ (x ≤ y ⊠ y ≤ x).","status":"ok","from":0,"to":1},{"text":"By definition x < y is the negation of y ≤ x. The goal then has the form A ⊸ Bᗮ ⊞ (A ⊠ B), a tautology of the connectives.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.orders.le_prod_ne_lt","base":"le_prod_ne_lt","kind":"prf","start":203,"body":[204,207],"status":"ok","short":{"text":"In a weak poset, x ≤ y ⊠ x ≠ y implies x < y","status":"ok"},"proof":[{"text":"Pass to the contrapositive. The dual of x < y is y ≤ x, and the dual of the tensor x ≤ y ⊠ x ≠ y is the par y < x ⊞ x = y.","status":"ok","from":0,"to":1},{"text":"The result is [[AffineConstructive.orders.orders.le_lt_par_eq]] read in the opposite weak poset.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.le_lt_trans","base":"le_lt_trans","kind":"prf","start":208,"body":[209,212],"status":"ok","short":{"text":"In a weak poset, x ≤ y ⊠ y < z implies x < z","status":"ok"},"proof":[{"text":"Transitivity of ≤ gives z ≤ x ⊠ x ≤ y ⊸ z ≤ y; its contrapositive turns y < z into y < x ⊞ x < z, a par read as the implication x ≤ y ⊸ x < z, since y < x is the dual of x ≤ y (see [[AffineConstructive.orders.orders.le_dual]]).","status":"ok","from":0,"to":1},{"text":"The goal is now modus ponens: x ≤ y together with x ≤ y ⊸ x < z gives x < z.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.lt_le_trans","base":"lt_le_trans","kind":"prf","start":213,"body":[214,217],"status":"ok","short":{"text":"In a weak poset, x < y ⊠ y ≤ z implies x < z","status":"ok"},"proof":[{"text":"The contrapositive of transitivity y ≤ z ⊠ z ≤ x ⊸ y ≤ x turns x < y into z < y ⊞ x < z, that is, the implication y ≤ z ⊸ x < z, since z < y is the dual of y ≤ z.","status":"ok","from":0,"to":1},{"text":"Modus ponens with the remaining factor y ≤ z gives x < z.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.StrongPoset_StrongSet","base":"StrongPoset_StrongSet","kind":"def","start":218,"body":[219,225],"status":"ok","short":{"text":"The underlying set of a strong poset is strong: its equality is strongly transitive","status":"ok"},"proof":[{"text":"Fix x, y, z; strong transitivity of equality asks that x = y ∧ y = z implies x = z, with the additive conjunction.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.orders.le_antisym_iff]] each equality is the additive conjunction of the two comparisons, so the goal concerns ≤ alone.","status":"ok","from":2,"to":2},{"text":"The two conclusions x ≤ z and z ≤ x each follow by strong transitivity of ≤, from x ≤ y ∧ y ≤ z and from z ≤ y ∧ y ≤ x respectively.","status":"ok","from":3,"to":4},{"text":"What remains is a tautology of the additive connectives: from the hypotheses, which may be used in each conjunct of the conclusion separately, choose the needed comparisons.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.orders.orders.coercion:StrongPoset_StrongSet","base":"coercion:StrongPoset_StrongSet","kind":"coercion","start":226,"body":null,"status":"ok","short":{"text":"Resolution gets from a strong poset to its strong set, so facts about strongly transitive equality apply to it, via [[AffineConstructive.orders.orders.StrongPoset_StrongSet]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.DecidableOrder_DecidableEquality","base":"DecidableOrder_DecidableEquality","kind":"def","start":227,"body":[228,231],"status":"ok","short":{"text":"A set with a decidable order has decidable equality","status":"ok"},"proof":[{"text":"Take a pair x, y; the claim is that x = y is decidable.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.orders.le_antisym_iff]] x = y is x ≤ y ∧ y ≤ x, an additive conjunction of decidable propositions, hence decidable.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.coercion:DecidableOrder_DecidableEquality","base":"coercion:DecidableOrder_DecidableEquality","kind":"coercion","start":232,"body":null,"status":"ok","short":{"text":"Resolution finds decidable equality from a decidable order, via [[AffineConstructive.orders.orders.DecidableOrder_DecidableEquality]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.RefutativeOrder_RefutativeEquality","base":"RefutativeOrder_RefutativeEquality","kind":"def","start":233,"body":[234,237],"status":"ok","short":{"text":"A set with a refutative order has refutative equality","status":"ok"},"proof":[{"text":"Take a pair x, y; the claim is that x = y is refutative.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.orders.le_antisym_iff]] x = y is x ≤ y ∧ y ≤ x, and an additive conjunction of refutative propositions is refutative.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.coercion:RefutativeOrder_RefutativeEquality","base":"coercion:RefutativeOrder_RefutativeEquality","kind":"coercion","start":238,"body":null,"status":"ok","short":{"text":"Resolution finds refutative equality from a refutative order, via [[AffineConstructive.orders.orders.RefutativeOrder_RefutativeEquality]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.DecidableOrder_DecidableLt","base":"DecidableOrder_DecidableLt","kind":"prf","start":239,"body":[240,242],"status":"ok","short":{"text":"In a decidable order the strict order is decidable","status":"ok"},"proof":[{"text":"The strict order is the complement of the converse of ≤; the converse of a decidable relation is decidable, and so is its complement.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.RefutativeOrder_AffirmativeLt","base":"RefutativeOrder_AffirmativeLt","kind":"prf","start":243,"body":[244,246],"status":"ok","short":{"text":"In a refutative order the strict order, a negation of ≤, is affirmative","status":"ok"},"proof":[{"text":"The strict order is the complement of the converse of ≤; the converse is refutative, and the complement of a refutative relation is affirmative.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.AffirmativeOrder_RefutativeLt","base":"AffirmativeOrder_RefutativeLt","kind":"prf","start":247,"body":[248,250],"status":"ok","short":{"text":"In an affirmative order the strict order, a negation of ≤, is refutative","status":"ok"},"proof":[{"text":"The strict order is the complement of the converse of ≤; the converse is affirmative, and the complement of an affirmative relation is refutative.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.TotalOrder_is_Linear","base":"TotalOrder_is_Linear","kind":"prf","start":254,"body":[255,257],"status":"ok","short":{"text":"A total order is linear: x ≤ y or y ≤ x gives x ≤ y par y ≤ x","status":"ok"},"proof":[{"text":"A linear order asks for pseudo-totality, x ≤ y ⊞ y ≤ x, and a total relation is pseudo-total.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.coercion:TotalOrder_is_Linear","base":"coercion:TotalOrder_is_Linear","kind":"coercion","start":258,"body":null,"status":"ok","short":{"text":"Resolution finds a linear order from a total order, so linear-order results apply to total orders, via [[AffineConstructive.orders.orders.TotalOrder_is_Linear]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.lt_le_sub","base":"lt_le_sub","kind":"def","start":259,"body":null,"status":"ok","short":{"text":"In a linear order the strict order is contained in the order","status":"ok"},"long":{"text":"In a linear order, x < y implies x ≤ y, stated as a containment of relations on pairs. Since x < y is the negation of y ≤ x, the containment is pseudo-totality itself: y ≤ x ⊞ x ≤ y is the same as the implication from the dual of y ≤ x to x ≤ y. Without linearity a weak poset need not satisfy it.\n\nIt is registered so that resolution finds the containment of < in ≤ wherever a rewrite needs it; [[AffineConstructive.orders.orders.lt_le]] is the same fact at a given pair of points.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.lt_le","base":"lt_le","kind":"def","start":261,"body":null,"status":"ok","short":{"text":"In a linear order, x < y implies x ≤ y","status":"ok"},"long":{"text":"The containment [[AffineConstructive.orders.orders.lt_le_sub]] taken at the points x and y. In a linear order x < y is the negation of y ≤ x, and pseudo-totality, x ≤ y ⊞ y ≤ x, turns that negation into x ≤ y. The statement is an affine implication, so it also carries its contrapositive. Here the contrapositive is the same statement with x and y exchanged, because the negation of x ≤ y is y < x.\n\nProofs use it to pass from a strict comparison to a non-strict one. It is used in 13 proof steps, in this file and in the files on lattices, naturals and rings.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.lt_trans","base":"lt_trans","kind":"def","start":262,"body":[263,267],"status":"ok","short":{"text":"In a linear order the strict order is transitive: x < y ⊠ y < z implies x < z","status":"ok"},"proof":[{"text":"Fix x, y, z; the goal is x < y ⊠ y < z ⊸ x < z.","status":"ok","from":0,"to":1},{"text":"In a linear order x < y implies x ≤ y ([[AffineConstructive.orders.orders.lt_le]]), so the first factor may be weakened.","status":"ok","from":2,"to":2},{"text":"The mixed transitivity [[AffineConstructive.orders.orders.le_lt_trans]] concludes.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.orders.lt_str_trans","base":"lt_str_trans","kind":"def","start":269,"body":[270,278],"status":"ok","short":{"text":"In a total order the strict order is strongly transitive: x < y and y < z implies x < z","status":"ok"},"proof":[{"text":"Fix x, y and z. The goal asks that the additive conjunction x < y ∧ y < z, of which the proof may use one conjunct, implies x < z. By totality, x ≤ y or y ≤ x; argue by cases.","status":"ok","from":0,"to":2},{"text":"If x ≤ y, choose the second conjunct y < z and weaken its left end along x ≤ y: since < is antitone in its left argument, y < z gives x < z.","status":"ok","from":3,"to":4},{"text":"If y ≤ x, pass to contrapositives. Since x < y is the negation of y ≤ x, the dual goal is that z ≤ x implies y ≤ x ∨ z ≤ y. The left disjunct is the hypothesis y ≤ x, so the disjunction is true ([[AffineConstructive.logic.aprop.aor_is_true_l]]) and the implication holds trivially.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.orders.orders.lt_or_eq_le","base":"lt_or_eq_le","kind":"prf","start":280,"body":[281,283],"status":"ok","short":{"text":"In a linear order, x < y or x = y implies x ≤ y","status":"ok"},"proof":[{"text":"Argue by cases on the disjunction: x < y gives x ≤ y in a linear order ([[AffineConstructive.orders.orders.lt_le]]), and x = y gives x ≤ y in any weak poset ([[AffineConstructive.orders.orders.eq_le]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.lt_le_and_ne","base":"lt_le_and_ne","kind":"prf","start":284,"body":[285,288],"status":"ok","short":{"text":"In a linear order, x < y implies x ≤ y and x ≠ y","status":"ok"},"proof":[{"text":"Pass to contrapositives. The dual of x ≤ y ∧ x ≠ y is y < x ∨ x = y, and the dual of x < y is y ≤ x, so it remains to show that y < x ∨ x = y implies y ≤ x.","status":"ok","from":0,"to":1},{"text":"This is [[AffineConstructive.orders.orders.lt_or_eq_le]] read in the opposite order, which is again linear ([[AffineConstructive.orders.orders.LinearOrder_op]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.lt_par_eq_le","base":"lt_par_eq_le","kind":"prf","start":289,"body":[290,293],"status":"ok","short":{"text":"In a linear refutative order, x < y ⊞ x = y implies x ≤ y","status":"ok"},"proof":[{"text":"The conclusion x ≤ y is refutative, so an implication into it from the additive disjunction x < y ∨ x = y extends to one from the par x < y ⊞ x = y ([[AffineConstructive.logic.aprop.aor_apar_refutative]]). It remains to prove the version with ∨.","status":"ok","from":0,"to":1},{"text":"That is [[AffineConstructive.orders.orders.lt_or_eq_le]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.le_iff_lt_par_eq","base":"le_iff_lt_par_eq","kind":"prf","start":294,"body":[295,299],"status":"ok","short":{"text":"In a linear refutative order, x ≤ y if and only if x < y ⊞ x = y","status":"ok"},"proof":[{"text":"Prove the two directions separately.","status":"ok","from":0,"to":1},{"text":"The forward direction holds in any weak poset ([[AffineConstructive.orders.orders.le_lt_par_eq]]).","status":"ok","from":2,"to":2},{"text":"The converse needs a linear refutative order and is [[AffineConstructive.orders.orders.lt_par_eq_le]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.orders.lt_iff_le_prod_ne","base":"lt_iff_le_prod_ne","kind":"prf","start":300,"body":[301,304],"status":"ok","short":{"text":"In a linear refutative order, x < y if and only if x ≤ y ⊠ x ≠ y","status":"ok"},"proof":[{"text":"An equivalence holds when the equivalence of the duals holds. The dual of x < y is y ≤ x, and the dual of x ≤ y ⊠ x ≠ y is y < x ⊞ x = y.","status":"ok","from":0,"to":1},{"text":"The dual equivalence is [[AffineConstructive.orders.orders.le_iff_lt_par_eq]] in the opposite order, which is again linear and refutative ([[AffineConstructive.orders.orders.LinearOrder_op]], [[AffineConstructive.orders.orders.RefutativeOrder_op]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.orders.tensor_le","base":"tensor_le","kind":"def","start":307,"body":null,"status":"ok","short":{"text":"The componentwise order on the tensor product X ⊗ Y, joining the comparisons by ⊠","status":"ok"},"long":{"text":"The order on the tensor product X ⊗ Y: (x₁, y₁) ≤ (x₂, y₂) is x₁ ≤ x₂ ⊠ y₁ ≤ y₂. The multiplicative connective matches the equality of the tensor product, which joins the componentwise equalities in the same way; its dual, the strict order, is then the par of the two strict comparisons the other way round.\n\nWith it the tensor product of preorders is a preorder ([[AffineConstructive.orders.orders.tensor_preorder]]) and that of weak posets a weak poset ([[AffineConstructive.orders.orders.tensor_weak_poset]]), the pseudo-antisymmetry of each factor meeting its own pair of comparisons after a medial rearrangement. Resolution supplies this order on any tensor product of ordered sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.prod_le","base":"prod_le","kind":"def","start":308,"body":null,"status":"ok","short":{"text":"The componentwise order on the cartesian product X × Y, joining the comparisons by additive and","status":"ok"},"long":{"text":"The order on the cartesian product X × Y: (x₁, y₁) ≤ (x₂, y₂) is x₁ ≤ x₂ ∧ y₁ ≤ y₂. The additive conjunction matches the equality of the cartesian product; its dual, the strict order, is the additive or of the two strict comparisons the other way round.\n\nWith it the cartesian product of preorders is a preorder ([[AffineConstructive.orders.orders.prod_preorder]]), of weak posets a weak poset ([[AffineConstructive.orders.orders.prod_weak_poset]]), and of posets a poset ([[AffineConstructive.orders.orders.prod_poset]]), the additive conjunction letting the antisymmetry of each factor choose the comparisons it needs. Resolution supplies this order on any cartesian product of ordered sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.unfold_pair_le","base":"unfold_pair_le","kind":"ltac","start":311,"body":null,"status":"ok","short":{"text":"Restates a comparison of two pairs as the componentwise comparisons, additive or tensor","status":"ok"},"long":{"text":"When the goal or a hypothesis compares two explicit pairs (a, b) ≤ (c, d), this tactic rewrites the comparison into the order on the components. In the cartesian product X × Y, ordered by [[AffineConstructive.orders.orders.prod_le]], it becomes a ≤ c ∧ b ≤ d. In the tensor product X ⊗ Y, ordered by [[AffineConstructive.orders.orders.tensor_le]], it becomes a ≤ c ⊠ b ≤ d. A comparison of any other form is left alone, and the tactic does not fail when nothing matches.\n\nThe proofs about product orders use it after the elements of the product have been introduced as pairs, together with the corresponding unfolding of pair equality. At that point the laws of ∧ and ⊠ (the medial law, the swap of an additive conjunction past a tensor) apply directly to the components.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.tensor_preorder","base":"tensor_preorder","kind":"prf","start":312,"body":[313,322],"status":"ok","short":{"text":"The tensor product of two preorders, ordered componentwise by ⊠, is a preorder","status":"ok"},"proof":[{"text":"The componentwise order on X ⊗ Y must be shown reflexive and transitive.","status":"ok","from":0,"to":1},{"text":"For reflexivity take a pair (x, y). Then (x, y) ≤ (x, y) is x ≤ x ⊠ y ≤ y, and each factor holds by reflexivity in its own factor.","status":"ok","from":2,"to":4},{"text":"For transitivity take three pairs (x₁, y₁), (x₂, y₂) and (x₃, y₃). After the order on pairs is unfolded, the hypothesis is the tensor of the four comparisons x₁ ≤ x₂, y₁ ≤ y₂, x₂ ≤ x₃ and y₂ ≤ y₃.","status":"ok","from":5,"to":7},{"text":"Rearrange the four factors by the medial law ([[AffineConstructive.logic.aprop.aprod_medial]]) so that the two X-comparisons sit together and the two Y-comparisons sit together. Each pair then gives its conclusion by transitivity, and each hypothesis is used exactly once.","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.orders.orders.prod_preorder","base":"prod_preorder","kind":"prf","start":324,"body":[325,334],"status":"ok","short":{"text":"The cartesian product of two preorders, ordered componentwise by additive and, is a preorder","status":"ok"},"proof":[{"text":"The componentwise order on X × Y must be shown reflexive and transitive.","status":"ok","from":0,"to":1},{"text":"For reflexivity take a pair (x, y). Then (x, y) ≤ (x, y) is x ≤ x ∧ y ≤ y, and each conjunct holds by reflexivity.","status":"ok","from":2,"to":4},{"text":"For transitivity take three pairs. After unfolding, the hypothesis is the tensor of two additive conjunctions, x₁ ≤ x₂ ∧ y₁ ≤ y₂ and x₂ ≤ x₃ ∧ y₂ ≤ y₃.","status":"ok","from":5,"to":7},{"text":"Distribute the tensor over the two conjunctions ([[AffineConstructive.logic.aprop.aand_aprod_swap]]). The result offers x₁ ≤ x₂ ⊠ x₂ ≤ x₃ for the first conjunct of the goal and y₁ ≤ y₂ ⊠ y₂ ≤ y₃ for the second. Each conjunct of the goal is proved separately from the whole hypothesis, so the proof of each one chooses the component it needs. Transitivity in X and in Y then concludes.","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.orders.orders.tensor_weak_poset","base":"tensor_weak_poset","kind":"prf","start":336,"body":[337,348],"status":"ok","short":{"text":"The tensor product of two weak posets is a weak poset","status":"ok"},"proof":[{"text":"The preorder part is [[AffineConstructive.orders.orders.tensor_preorder]]. It remains to show that equality implies ≤ and that ≤ is pseudo-antisymmetric.","status":"ok","from":0,"to":1},{"text":"For two pairs, equality in X ⊗ Y is x₁ = x₂ ⊠ y₁ = y₂. Each factor implies the corresponding comparison because equality implies ≤ in each component, and the tensor is monotone ([[AffineConstructive.logic.aprop.aprod_proper_aimpl]]).","status":"ok","from":2,"to":5},{"text":"For pseudo-antisymmetry take two pairs. Unfolded, the hypothesis is the tensor of four comparisons. The medial law ([[AffineConstructive.logic.aprop.aprod_medial]]) groups them as x₁ ≤ x₂ ⊠ x₂ ≤ x₁ and y₁ ≤ y₂ ⊠ y₂ ≤ y₁.","status":"ok","from":6,"to":9},{"text":"Each group gives the equality in its own component by pseudo-antisymmetry, and their tensor is the equality of the pairs.","status":"ok","from":10,"to":11}]},{"name":"AffineConstructive.orders.orders.prod_weak_poset","base":"prod_weak_poset","kind":"prf","start":350,"body":[351,362],"status":"ok","short":{"text":"The cartesian product of two weak posets is a weak poset","status":"ok"},"proof":[{"text":"The preorder part is [[AffineConstructive.orders.orders.prod_preorder]]. It remains to show that equality implies ≤ and that ≤ is pseudo-antisymmetric.","status":"ok","from":0,"to":1},{"text":"For two pairs, equality in X × Y is x₁ = x₂ ∧ y₁ = y₂. Each conjunct implies the corresponding comparison, and additive conjunction is monotone ([[AffineConstructive.logic.aprop.aand_proper_aimpl]]).","status":"ok","from":2,"to":5},{"text":"For pseudo-antisymmetry the hypothesis is the tensor of two additive conjunctions of comparisons. Distributing the tensor over them ([[AffineConstructive.logic.aprop.aand_aprod_swap]]) gives x₁ ≤ x₂ ⊠ x₂ ≤ x₁ ∧ y₁ ≤ y₂ ⊠ y₂ ≤ y₁.","status":"ok","from":6,"to":9},{"text":"Each conjunct gives the equality in its own component by pseudo-antisymmetry. Together these are the two conjuncts of the equality of the pairs.","status":"ok","from":10,"to":11}]},{"name":"AffineConstructive.orders.orders.prod_poset","base":"prod_poset","kind":"prf","start":364,"body":[365,376],"status":"ok","short":{"text":"The cartesian product of two posets is a poset","status":"ok"},"proof":[{"text":"The product is already a weak poset by [[AffineConstructive.orders.orders.prod_weak_poset]], so only antisymmetry remains to be shown.","status":"ok","from":0,"to":1},{"text":"Take two pairs (x₁, y₁) and (x₂, y₂). The order on the product compares the components with the additive and, and so does the equality. So the hypothesis is the additive conjunction of the two comparisons in each direction, and the goal is x₁ = x₂ ∧ y₁ = y₂.","status":"ok","from":2,"to":3},{"text":"To prove an additive conjunction, prove each component from the whole hypothesis.","status":"ok","from":4,"to":4},{"text":"For the first component, the additive conjunctions let the proof keep only x₁ ≤ x₂ and x₂ ≤ x₁ and discard the comparisons in Y. Antisymmetry in X then gives x₁ = x₂.","status":"ok","from":5,"to":7},{"text":"The second component is symmetric: keep y₁ ≤ y₂ and y₂ ≤ y₁, and antisymmetry in Y gives y₁ = y₂.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.orders.orders.tensor_le_proper","base":"tensor_le_proper","kind":"prf","start":378,"body":[379,381],"status":"ok","short":{"text":"Proofs of x₁ ≤ x₂ and y₁ ≤ y₂ give (x₁, y₁) ≤ (x₂, y₂) in X ⊗ Y","status":"ok"},"proof":[{"text":"The order on X ⊗ Y is the tensor of the comparisons in X and Y, so proofs of x₁ ≤ x₂ and y₁ ≤ y₂ together prove it. This is a tautology of the logic once [[AffineConstructive.orders.orders.tensor_le]] is unfolded.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.prod_le_proper","base":"prod_le_proper","kind":"prf","start":382,"body":[383,385],"status":"ok","short":{"text":"Proofs of x₁ ≤ x₂ and y₁ ≤ y₂ give (x₁, y₁) ≤ (x₂, y₂) in X × Y","status":"ok"},"proof":[{"text":"The order on X × Y is the additive conjunction of the comparisons in X and Y, so proofs of x₁ ≤ x₂ and y₁ ≤ y₂ prove it. This is a tautology once [[AffineConstructive.orders.orders.prod_le]] is unfolded.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.trich_le_dec","base":"trich_le_dec","kind":"def","start":389,"body":null,"status":"ok","short":{"text":"The decision function for ≤ read off a three-way comparison: true on less or equal","status":"ok"},"long":{"text":"From a three-way comparison function on X, the boolean decision function for the order: x ≤ y is decided true when the comparison of x and y says less or equal, and false when it says greater.\n\nWhen the comparison is correct ([[AffineConstructive.interfaces.orders.IsTrich]]), the decision function is correct too ([[AffineConstructive.orders.orders.trich_le_dec_correct]]), and from that the order is decidable ([[AffineConstructive.orders.orders.trich_decidable]]) and total ([[AffineConstructive.orders.orders.trich_total]]). Resolution offers it, at low priority, whenever a decision function for ≤ is wanted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.trich_le_dec_correct","base":"trich_le_dec_correct","kind":"def","start":391,"body":[392,402],"status":"ok","short":{"text":"For a correct three-way comparison, the decision function it gives for ≤ is correct","status":"ok"},"proof":[{"text":"Fix x and y. The decision function [[AffineConstructive.orders.orders.trich_le_dec]] answers true unless the three-way comparison says x is greater than y. The goal asks that a true answer comes with x ≤ y and a false answer with its negation.","status":"ok","from":0,"to":2},{"text":"Split into cases on the comparison of x and y, keeping the fact that the comparison is correct in each case.","status":"ok","from":3,"to":3},{"text":"If x < y, then x ≤ y by [[AffineConstructive.orders.orders.lt_le]].","status":"ok","from":4,"to":5},{"text":"If x = y, then x ≤ y by [[AffineConstructive.orders.orders.eq_le]].","status":"ok","from":6,"to":7},{"text":"If y < x, there is nothing to prove: y < x is by definition the negation of x ≤ y.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.orders.orders.trich_decidable","base":"trich_decidable","kind":"def","start":404,"body":[405,407],"status":"ok","short":{"text":"A set with a correct three-way comparison has a decidable order","status":"ok"},"proof":[{"text":"The decision function read off the three-way comparison is correct by [[AffineConstructive.orders.orders.trich_le_dec_correct]], and an order with a correct decision function is decidable by [[AffineConstructive.orders.orders.IsDecLe_DecidableRelation]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.trich_total","base":"trich_total","kind":"def","start":408,"body":[409,425],"status":"ok","short":{"text":"A set with a correct three-way comparison is totally ordered","status":"ok"},"proof":[{"text":"The order structure is already available, so only totality remains: for all x and y, x ≤ y or y ≤ x.","status":"ok","from":0,"to":1},{"text":"Fix x and y and split into cases on their three-way comparison, using that the comparison is correct.","status":"ok","from":2,"to":3},{"text":"If x < y, the left disjunct x ≤ y holds by [[AffineConstructive.orders.orders.lt_le]].","status":"ok","from":4,"to":7},{"text":"If x = y, the left disjunct holds by [[AffineConstructive.orders.orders.eq_le]].","status":"ok","from":8,"to":11},{"text":"If y < x, the right disjunct y ≤ x holds by [[AffineConstructive.orders.orders.lt_le]].","status":"ok","from":12,"to":16}]},{"name":"AffineConstructive.orders.orders.trich_eq_dec","base":"trich_eq_dec","kind":"def","start":426,"body":null,"status":"ok","short":{"text":"The decision function for equality read off a three-way comparison: true exactly on equal","status":"ok"},"long":{"text":"From a three-way comparison function on X, the boolean decision function for equality: x = y is decided true when the comparison of x and y says equal, and false when it says less or greater.\n\nWhen the comparison is correct ([[AffineConstructive.interfaces.orders.IsTrich]]), so is this decision function ([[AffineConstructive.orders.orders.trich_eq_dec_correct]]): the outcomes less and greater give x < y or y < x, and each of those implies x ≠ y. Resolution offers it, at low priority, whenever a decision function for the equality of a set is wanted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.orders.trich_eq_dec_correct","base":"trich_eq_dec_correct","kind":"def","start":428,"body":[429,439],"status":"ok","short":{"text":"For a correct three-way comparison, the decision function it gives for equality is correct","status":"ok"},"proof":[{"text":"Fix x and y. The decision function [[AffineConstructive.orders.orders.trich_eq_dec]] answers true exactly when the three-way comparison says the two are equal. The goal asks that a true answer comes with x = y and a false answer with x ≠ y.","status":"ok","from":0,"to":2},{"text":"Split into cases on the comparison of x and y, using that the comparison is correct.","status":"ok","from":3,"to":3},{"text":"If x < y, then x ≠ y by [[AffineConstructive.orders.orders.lt_ne]].","status":"ok","from":4,"to":5},{"text":"If x = y, the answer is true and there is nothing to prove.","status":"ok","from":6,"to":7},{"text":"If y < x, then x ≠ y by [[AffineConstructive.orders.orders.lt_ne_flip]].","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.orders.orders.of_course_aff_le","base":"of_course_aff_le","kind":"prf","start":444,"body":[445,447],"status":"ok","short":{"text":"The order of !X, each comparison of X affirmed, is affirmative","status":"ok"},"proof":[{"text":"The order on !X is the comparison of X affirmed, that is, of course applied to the base-logic relation x ≤ y. A relation of this form is affirmative by [[AffineConstructive.logic.relations.of_course_rel_Affirmative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.of_course_preorder","base":"of_course_preorder","kind":"prf","start":449,"body":[450,452],"status":"ok","short":{"text":"If X is preordered, so is !X under the affirmed order","status":"ok"},"proof":[{"text":"Reflexivity and transitivity are checked separately. Read the order of !X as of course applied to the base-logic order of X. Transitivity of the affine order of X gives transitivity of that base-logic order by [[AffineConstructive.logic.relations.of_course_rel_Transitive_back]], and of course carries it back to an affine relation by [[AffineConstructive.logic.relations.of_course_rel_Transitive]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.of_course_weak_poset","base":"of_course_weak_poset","kind":"prf","start":454,"body":[455,467],"status":"ok","short":{"text":"If X is a weak poset, so is !X with its affirmed equality and order","status":"ok"},"proof":[{"text":"!X is preordered by [[AffineConstructive.orders.orders.of_course_preorder]]. Two things remain: equality implies ≤, and pseudo-antisymmetry.","status":"ok","from":0,"to":1},{"text":"For the first, fix x and y. The equality of !X is affirmative, so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] a base-logic implication from x = y to x ≤ y suffices.","status":"ok","from":2,"to":4},{"text":"Read the equality and the order at X: there x = y gives x ≤ y by [[AffineConstructive.orders.orders.eq_le]].","status":"ok","from":5,"to":6},{"text":"For pseudo-antisymmetry, fix x and y. The order of !X is affirmative by [[AffineConstructive.orders.orders.of_course_aff_le]], and a tensor of affirmative propositions is affirmative. So again a base-logic implication from x ≤ y ⊠ y ≤ x to x = y suffices.","status":"ok","from":7,"to":9},{"text":"Read the comparisons and the equality at X, where the implication is the pseudo-antisymmetry of the weak poset X.","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.orders.orders.unit_dec_order","base":"unit_dec_order","kind":"prf","start":471,"body":[472,474],"status":"ok","short":{"text":"The one-point set 𝟏, every comparison true, is a decidable order","status":"ok"},"proof":[{"text":"Every comparison on 𝟏 is the true proposition, and truth is decidable. The decision procedure discharges the statement outright.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.unit_total_order","base":"unit_total_order","kind":"prf","start":475,"body":[476,478],"status":"ok","short":{"text":"The one-point set 𝟏 is totally ordered","status":"ok"},"proof":[{"text":"On 𝟏 every comparison x ≤ y is true, so the totality disjunction holds through either disjunct. The decision procedure discharges it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.unit_order_terminal","base":"unit_order_terminal","kind":"prf","start":487,"body":[488,490],"status":"ok","short":{"text":"Every function from a weak poset into the one-point set preserves the order","status":"ok"},"proof":[{"text":"Preserving the order asks that X and 𝟏 be weak posets and that x ≤ y imply f x ≤ f y. The order structures are the assumption on X and the one 𝟏 carries (through [[AffineConstructive.orders.orders.unit_dec_order]]). The implication holds because its conclusion, a comparison in 𝟏, is true.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.orders.from_unit_order_embed","base":"from_unit_order_embed","kind":"prf","start":492,"body":[493,495],"status":"ok","short":{"text":"Every function from the one-point set into a weak poset is an order embedding","status":"ok"},"proof":[{"text":"An order embedding both preserves and reflects the order, and the structures on 𝟏 and X are already at hand. That leaves the two comparisons between the point of 𝟏 and itself. One way round, the comparison in 𝟏 is true. The other way round, f of the point is below itself by reflexivity. In both cases the conclusion is proved, so every proposition implies it ([[AffineConstructive.logic.aprop.aimpl_true_r]]).","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1729,"e":1732,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1871,"e":1874,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1875,"e":1878,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2014,"e":2017,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2018,"e":2021,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2157,"e":2160,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2272,"e":2275,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2387,"e":2390,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2502,"e":2505,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2636,"e":2639,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2668,"e":2671,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2813,"e":2816,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2845,"e":2848,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file extends projected sets to orders. [[AffineConstructive.orders.projected.IsProjectedOrder]] says that the equality and the order of a set X both come from a map f into an ordered set Y, so x ≤ y ⧟ f x ≤ f y. Section-local instances carry the order structure of Y back to X: preorder, weak poset, poset, strong transitivity, decidable, affirmative and refutative orders, and total and linear orders. Each proof rewrites the comparison in X into the comparison in Y and applies the corresponding law there. The lemma [[AffineConstructive.orders.projected.projected_order_embedding]] states that the projection of X into Y is an order embedding. The file builds on theory/projected_set.v in the same way that set does for equality.","short":"Orders pulled back along a map: order properties transferred from the target","items":[{"name":"AffineConstructive.orders.projected.IsProjectedOrder","base":"IsProjectedOrder","kind":"rec","start":2,"body":null,"status":"ok","short":{"text":"The class saying both the equality and the order of A are pulled back along f into an ordered set","status":"ok"},"long":{"text":"A projected order extends a projected set ([[AffineConstructive.theory.projected_set.IsProjectedSet]]) to orders. A is a type with an equality and an order, f sends A into a set Y with an order, and besides x = y ⧟ f x = f y the class asks that x ≤ y ⧟ f x ≤ f y for all x and y. The order on A is therefore the one induced by f. Because an affine equivalence carries its contrapositive, the order is induced on the refuting side too: a refutation of x ≤ y in A is the same thing as a refutation of f x ≤ f y in Y.\n\nThe field for the set structure is a coercion, so a projected order can be used wherever a projected set is expected. It is not a canonical instance and the coercion is not searched in reverse. The class is used only in this file, in 16 proof steps across 10 items. Those proofs rewrite a comparison in A by [[AffineConstructive.orders.projected.is_projected_order]] into the corresponding comparison in Y and then apply the property Y has. [[AffineConstructive.orders.projected.projected_preorder]] gets reflexivity and transitivity this way, and [[AffineConstructive.orders.projected.projected_order_embedding]] shows that the projection into Y is an order embedding.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.orders.projected.projected_order_set","base":"projected_order_set","kind":"proj","short":{"text":"The projected-set structure of a projected order: x = y if and only if f x = f y","status":"ok"}},{"name":"AffineConstructive.orders.projected.is_projected_order","base":"is_projected_order","kind":"proj","short":{"text":"In a projected order, x ≤ y if and only if f x ≤ f y","status":"ok"}},{"name":"AffineConstructive.orders.projected.Build_IsProjectedOrder","base":"Build_IsProjectedOrder","kind":"constr","short":{"text":"Builds a projected order from a projected set and the equivalence x ≤ y ⧟ f x ≤ f y","status":"ok"}}]},{"name":"AffineConstructive.orders.projected.projected_preorder","base":"projected_preorder","kind":"inst","start":8,"body":[9,15],"status":"ok","short":{"text":"A projected order inherits a preorder from its target","status":"ok"},"proof":[{"text":"There are two laws to check, reflexivity and transitivity. In each, fix the points and rewrite every comparison in X as the corresponding comparison of images in Y, using the defining equivalence x ≤ y ⧟ f x ≤ f y of [[AffineConstructive.orders.projected.IsProjectedOrder]].","status":"ok","from":0,"to":1},{"text":"Reflexivity becomes f x ≤ f x, which holds by reflexivity of the order of Y.","status":"ok","from":2,"to":3},{"text":"Transitivity becomes f x ≤ f y ⊠ f y ≤ f z ⊸ f x ≤ f z, which is transitivity of the order of Y.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.projected.projected_weak_poset","base":"projected_weak_poset","kind":"inst","start":16,"body":[17,27],"status":"ok","short":{"text":"A projected order inherits a weak partial order from its target","status":"ok"},"proof":[{"text":"A weak poset is a preorder, which is [[AffineConstructive.orders.projected.projected_preorder]], together with two conditions linking the order to equality. Both remain to be shown.","status":"ok","from":0,"to":1},{"text":"First, equality implies order. For x and y in X, rewrite the equality as f x = f y using [[AffineConstructive.theory.projected_set.is_projected_set]] and the order as f x ≤ f y using [[AffineConstructive.orders.projected.IsProjectedOrder]]. What remains is the same law in Y, [[AffineConstructive.orders.orders.eq_le]].","status":"ok","from":2,"to":5},{"text":"Second, pseudo-antisymmetry: x ≤ y ⊠ y ≤ x implies x = y. After the same two rewrites the goal becomes f x ≤ f y ⊠ f y ≤ f x ⊸ f x = f y, which is pseudo-antisymmetry of Y.","status":"ok","from":6,"to":10}]},{"name":"AffineConstructive.orders.projected.projected_order_embedding","base":"projected_order_embedding","kind":"prf","start":28,"body":[29,32],"status":"ok","short":{"text":"Over a weak poset, the projection of a projected order is an order embedding","status":"ok"},"proof":[{"text":"Both X and Y are weak posets, X by [[AffineConstructive.orders.projected.projected_weak_poset]]. By [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]], it is therefore enough to show that the projection reflects and preserves order, x ≤ y ⧟ f x ≤ f y.","status":"ok","from":0,"to":1},{"text":"That equivalence is the defining property of a projected order, [[AffineConstructive.orders.projected.IsProjectedOrder]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.projected.projected_poset","base":"projected_poset","kind":"inst","start":33,"body":[34,39],"status":"ok","short":{"text":"A projected order inherits a partial order from its target","status":"ok"},"proof":[{"text":"[[AffineConstructive.orders.projected.projected_weak_poset]] supplies the weak poset structure, so only antisymmetry remains. Its hypothesis is the additive conjunction x ≤ y ∧ y ≤ x.","status":"ok","from":0,"to":1},{"text":"For x and y, rewrite both comparisons and the equality through f, using [[AffineConstructive.orders.projected.IsProjectedOrder]] and [[AffineConstructive.theory.projected_set.is_projected_set]]. The goal becomes f x ≤ f y ∧ f y ≤ f x ⊸ f x = f y, which is antisymmetry of Y.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.projected.projected_strong_le","base":"projected_strong_le","kind":"inst","start":40,"body":[41,45],"status":"ok","short":{"text":"A projected order is strongly transitive when the order of its target is","status":"ok"},"proof":[{"text":"Strong transitivity asks for x ≤ y ∧ y ≤ z ⊸ x ≤ z, with an additive rather than a tensor hypothesis. Fix x, y and z, and rewrite each comparison as the comparison of the images in Y using [[AffineConstructive.orders.projected.IsProjectedOrder]].","status":"ok","from":0,"to":2},{"text":"What remains is strong transitivity of the order of Y.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.projected.projected_decidable_le","base":"projected_decidable_le","kind":"inst","start":46,"body":[47,50],"status":"ok","short":{"text":"A projected order is decidable when the order of its target is","status":"ok"},"proof":[{"text":"Fix x and y in X. The goal is that x ≤ y is decidable.","status":"ok","from":0,"to":1},{"text":"The comparison x ≤ y is equivalent to f x ≤ f y, which is decidable by assumption on Y. Decidability transfers along an affine equivalence.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.projected.projected_affirmative_le","base":"projected_affirmative_le","kind":"inst","start":51,"body":[52,55],"status":"ok","short":{"text":"A projected order is affirmative when the order of its target is","status":"ok"},"proof":[{"text":"Fix x and y in X. The goal is that x ≤ y is affirmative.","status":"ok","from":0,"to":1},{"text":"The comparison x ≤ y is equivalent to f x ≤ f y, which is affirmative by assumption on Y. Being affirmative transfers along an affine equivalence.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.projected.projected_refutative_le","base":"projected_refutative_le","kind":"inst","start":56,"body":[57,60],"status":"ok","short":{"text":"A projected order is refutative when the order of its target is","status":"ok"},"proof":[{"text":"Fix x and y in X. The goal is that x ≤ y is refutative.","status":"ok","from":0,"to":1},{"text":"The comparison x ≤ y is equivalent to f x ≤ f y, which is refutative by assumption on Y. Being refutative transfers along an affine equivalence.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.projected.projected_strong_poset","base":"projected_strong_poset","kind":"inst","start":61,"body":[62,64],"status":"ok","short":{"text":"A projected order is a strong poset when its target is","status":"ok"},"proof":[{"text":"A strong poset is a poset whose order is strongly transitive. [[AffineConstructive.orders.projected.projected_poset]] and [[AffineConstructive.orders.projected.projected_strong_le]] supply the two parts.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.projected.projected_decidable_order","base":"projected_decidable_order","kind":"inst","start":65,"body":[66,68],"status":"ok","short":{"text":"A projected order is a decidable order when its target is","status":"ok"},"proof":[{"text":"A decidable order is a poset with a decidable order relation. [[AffineConstructive.orders.projected.projected_poset]] and [[AffineConstructive.orders.projected.projected_decidable_le]] supply the two parts.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.projected.projected_affirmative_order","base":"projected_affirmative_order","kind":"inst","start":69,"body":[70,72],"status":"ok","short":{"text":"A projected order is an affirmative order when its target is","status":"ok"},"proof":[{"text":"An affirmative order is a partial order whose ≤ is affirmative. Both fields are already instances on X: the partial order comes from [[AffineConstructive.orders.projected.projected_poset]] and the affirmativity of ≤ from [[AffineConstructive.orders.projected.projected_affirmative_le]]. Each is transported from Y along f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.projected.projected_refutative_order","base":"projected_refutative_order","kind":"inst","start":73,"body":[74,76],"status":"ok","short":{"text":"A projected order is a refutative order when its target is","status":"ok"},"proof":[{"text":"A refutative order is a partial order whose ≤ is refutative. Both fields are already instances on X: the partial order comes from [[AffineConstructive.orders.projected.projected_poset]] and the refutativity of ≤ from [[AffineConstructive.orders.projected.projected_refutative_le]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.projected.projected_total_order","base":"projected_total_order","kind":"inst","start":77,"body":[78,83],"status":"ok","short":{"text":"A projected order is total when its target is","status":"ok"},"proof":[{"text":"A total order is a partial order with a total ≤. The partial order is already an instance on X, from [[AffineConstructive.orders.projected.projected_poset]]. What remains is totality.","status":"ok","from":0,"to":1},{"text":"Fix x and y in X. Both comparisons are rewritten across f by the projection equivalence x ≤ y ⧟ f x ≤ f y. The goal becomes the additive disjunction f x ≤ f y ∨ f y ≤ f x in Y.","status":"ok","from":2,"to":3},{"text":"This disjunction is the totality of the order of Y, applied at f x and f y ([[AffineConstructive.interfaces.aprop.total]]).","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.projected.projected_linear_order","base":"projected_linear_order","kind":"inst","start":84,"body":[85,90],"status":"ok","short":{"text":"A projected order is linear (pseudo-total) when its target is","status":"ok"},"proof":[{"text":"A linear order is a partial order with a pseudo-total ≤. The partial order is already an instance on X, from [[AffineConstructive.orders.projected.projected_poset]]. What remains is pseudo-totality.","status":"ok","from":0,"to":1},{"text":"Fix x and y in X. Both comparisons are rewritten across f by the projection equivalence. Par is monotone in each factor, so the goal becomes f x ≤ f y ⊞ f y ≤ f x in Y.","status":"ok","from":2,"to":3},{"text":"This par is the pseudo-totality of the order of Y, applied at f x and f y ([[AffineConstructive.interfaces.aprop.pseudo_total]]).","status":"ok","from":4,"to":5}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.projected_set":{"page":"../theory/projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

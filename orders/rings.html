f_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export interfaces.orders interfaces.ring_order.\nRequire Export orders.orders orders.maps orders.groups.\nRequire Import theory.rings theory.subrings.\nRequire Import logic.aprop relations logic.refutative.\nRequire Import easy rewrite replc simplify.\nRequire Import tactics.algebra.com_monoids.\n\nLocal Open Scope mult_scope.\nImport cone_notation.\n\nGlobal Hint Extern 1 (Le (set_T (ring_op ?R))) => change (Le (set_T R)) : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveMonoidOrder (ring_op ?R)) => change (AdditiveMonoidOrder R) : typeclass_instances.\n\nSection opposite_ring.\n  Ltac go := split; try exact _; change (@mult (ring_op _) ?f) with f; unfold ring_op; try exact _.\n\n  Instance StrongLinearRefutativeRigOrder_op `{StrongLinearRefutativeRigOrder (R:=R)}\n    : StrongLinearRefutativeRigOrder (ring_op R).\n  Proof. go. intros b a d c. change (b < a ⊠ d < c ⊸ d · a + c · b < c · a + d · b).\n    rew (aprod_com _ _).\n    rew (mult_lt_compat_full _ _ _ _). now rew (commutativity (+) (c · b) _).\n  Qed.\n\n  Instance StrongLinearRefutativeRingOrder_op `{StrongLinearRefutativeRingOrder (R:=R)}\n    : StrongLinearRefutativeRingOrder (ring_op R).\n  Proof. go. intros x y; simplify. rew (aprod_com _ _). apply H. Qed.\nEnd opposite_ring.\nGlobal Hint Extern 2 (StrongLinearRefutativeRigOrder (ring_op ?R)) => simple notypeclasses refine StrongLinearRefutativeRigOrder_op : typeclass_instances.\nGlobal Hint Extern 2 (StrongLinearRefutativeRingOrder (ring_op ?R)) => simple notypeclasses refine StrongLinearRefutativeRingOrder_op : typeclass_instances.\n\n\nLemma mult_le_compat_full `{StrongLinearRefutativeRigOrder (R:=R)} (b a d c : R)\n: b ≤ a ⊠ d ≤ c ⊸ a · d + b · c ≤ a · c + b · d.\nProof.\n  rew (le_iff_lt_par_eq _ (a · c + b · d)).\n  rew (apar_adj_dual _ _ _).\n  rew exact:(contrapositive (mult_lt_compat_full b a d c)).\n  rew (apar_aprod_distr_l _ _ _ _).\n  rew [(le_pseudo_antisym b a)|(le_pseudo_antisym d c)].\n  rew (refutativity (a · d + b · c = a · c + b · d)), <-(apar_why_not _).\n  rew (commutativity (+) _ _) at 1.\n  rew <-exact:(is_fun (strong_op (+)) (_, _) (_,_) : _ = _ ∧ _ = _ ⊸ b · c + a · d = a · c + b · d).\n  rew <-exact:(is_fun (strong_op (+)) (_, _) (_,_) : _ = _ ∧ _ = _ ⊸ a · d + b · c = a · c + b · d).\n  rew [<-exact:(is_fun (·c) _ _ : b = a ⊸ b · c = a · c)\n      |<-exact:(is_fun (·d) _ _ : a = b ⊸ a · d = b · d)\n      |<-exact:(is_fun (a·) _ _ : d = c ⊸ a · d = a · c)\n      |<-exact:(is_fun (b·) _ _ : c = d ⊸ b · c = b · d)\n      ].\n  rew [(symmetry_iff (=) a b) | (symmetry_iff (=) c d)].\n  now simplify.\nQed.\n\n\nLemma strong_linear_refutative_rig_order_from_partial_minus\n  `{Rig (R:=R)} {Rle : Le R}\n  `{!StrongPoset R, !LinearOrder R, !RefutativeOrder R}\n  `{!AdditiveMonoidOrder R}\n  : (∀ x y : R, x < y ⊸ ∐ z : R, 0 < z ⊠ y = x + z)\n  → (∀ x y : R, 0 < x ⊠ 0 < y ⊸ 0 < x · y)\n  → StrongLinearRefutativeRigOrder R.\nProof. intros Pminus Pmult. split; try exact _.\n  intros b a d c. apply affirmative_aimpl.\n  intros [E1 E2].\n  pose proof aimpl_impl_pos (Pminus _ _) E1 as [x [Px Ex]].\n  pose proof aimpl_impl_pos (Pminus _ _) E2 as [y [Py Ey]].\n  rew [Ex | Ey]. clear Ex Ey E1 E2 a c.\n  rew (plus_mult_distr_r b x (d+y)).\n  replc (b · (d + y) + x · (d + y) + b · d) with (x · (d + y) + b · d + b · (d + y)) by add_mon.\n  apply (strictly_order_preserving (+ b·(d+y))).\n  rew [(plus_mult_distr_r b x d) | (plus_mult_distr_l x d y)].\n  replc (x · d + x · y + b · d) with (x·y + (b · d + x · d)) by add_mon.\n  apply (strictly_order_preserving_simp (+ (b · d + x · d) ) 0 (x · y)).\n  now apply Pmult.\nQed.\n\n\nCoercion StrongLinearRefutativeRingOrder_StrongLinearRefutativeRigOrder\n  `{H:StrongLinearRefutativeRingOrder R} : StrongLinearRefutativeRigOrder R.\nProof. apply strong_linear_refutative_rig_order_from_partial_minus; [| exact slr_ring_order_pos_mult ].\n  intros x y. apply affirmative_aimpl. intros E. exists (y - x). split.\n  * now apply (strictly_order_reflecting_simp (+x) 0 (y - x)).\n  * now simplify.\nQed.\n\n\nCoercion StrongLinearRefutativeRigOrder_NoZeroDivisors\n  `{H:StrongLinearRefutativeRigOrder R} : NoZeroDivisors R.\nProof. intros x y. rew <-?(le_antisym_iff _ _). apply by_contrapositive.\n  apply affirmative_aimpl; intros [[Ex|Ex] [Ey|Ey]];\n  generalize (aimpl_impl_pos (mult_lt_compat_full _ _ _ _) (sprop.conj Ex Ey));\n  apply aimpl_impl_pos; now simplify.\nQed.\n\n\nLemma nonneg_mult_order_preserving_l `{StrongLinearRefutativeRigOrder (R:=R)} {z:R} `{0 ≤ z} : OrderPreserving (z·).\nProof. apply alt_Build_OrderPreserving; intros x y; simplify. exact (simplify_thm (mult_le_compat_full 0 z x y)). Qed.\nGlobal Hint Extern 2 (OrderPreserving (_·)) => simple notypeclasses refine nonneg_mult_order_preserving_l : typeclass_instances.\n\nLemma nonneg_mult_order_preserving_r `{StrongLinearRefutativeRigOrder (R:=R)} {z:R} `{0 ≤ z} : OrderPreserving (·z).\nProof. exact (nonneg_mult_order_preserving_l (R:=ring_op R)). Qed.\nGlobal Hint Extern 2 (OrderPreserving (·_)) => simple notypeclasses refine nonneg_mult_order_preserving_r : typeclass_instances.\n\nLemma nonpos_mult_order_preserving_flip_l `{StrongLinearRefutativeRigOrder (R:=R)} {z:R} `{z ≤ 0} : OrderPreservingFlip (z·).\nProof. apply alt_Build_OrderPreservingFlip; intros x y; simplify. exact (simplify_thm (mult_le_compat_full z 0 x y)). Qed.\nGlobal Hint Extern 2 (OrderPreservingFlip (_·)) => simple notypeclasses refine nonpos_mult_order_preserving_flip_l : typeclass_instances.\n\nLemma nonpos_mult_order_preserving_flip_r `{StrongLinearRefutativeRigOrder (R:=R)} {z:R} `{z ≤ 0} : OrderPreservingFlip (·z).\nProof. exact (nonpos_mult_order_preserving_flip_l (R:=ring_op R)). Qed.\nGlobal Hint Extern 2 (OrderPreservingFlip (·_)) => simple notypeclasses refine nonpos_mult_order_preserving_flip_r : typeclass_instances.\n\n\n\nLemma pos_mult_order_embedding_l `{StrongLinearRefutativeRigOrder (R:=R)} {z:R} `{0 < z} : OrderEmbedding (z·).\nProof. split; [ exact _ |]. apply alt_Build_OrderReflecting. intros x y; simplify.\n  apply by_contrapositive. exact (simplify_thm (mult_lt_compat_full 0 z y x)).\nQed.\nGlobal Hint Extern 2 (OrderEmbedding (_·)) => simple notypeclasses refine pos_mult_order_embedding_l : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflecting (_·)) => simple notypeclasses refine pos_mult_order_embedding_l : typeclass_instances.\n\nLemma pos_mult_order_embedding_r `{StrongLinearRefutativeRigOrder (R:=R)} {z:R} `{0 < z} : OrderEmbedding (·z).\nProof. exact (pos_mult_order_embedding_l (R:=ring_op R)). Qed.\nGlobal Hint Extern 2 (OrderEmbedding (·_)) => simple notypeclasses refine pos_mult_order_embedding_r : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflecting (·_)) => simple notypeclasses refine pos_mult_order_embedding_r : typeclass_instances.\n\n\nLemma neg_mult_order_embedding_flip_l `{StrongLinearRefutativeRigOrder (R:=R)} {z:R} `{z < 0} : OrderEmbeddingFlip (z·).\nProof. apply Build_OrderEmbeddingFlip; [ exact _ |]. apply alt_Build_OrderReflectingFlip. intros x y; simplify.\n  apply by_contrapositive. exact (simplify_thm (mult_lt_compat_full z 0 y x)).\nQed.\nGlobal Hint Extern 2 (OrderEmbeddingFlip (_·)) => simple notypeclasses refine neg_mult_order_embedding_flip_l : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflectingFlip (_·)) => simple notypeclasses refine neg_mult_order_embedding_flip_l : typeclass_instances.\n\nLemma neg_mult_order_embedding_flip_r `{StrongLinearRefutativeRigOrder (R:=R)} {z:R} `{z < 0} : OrderEmbeddingFlip (z·).\nProof. exact (neg_mult_order_embedding_flip_l (R:=ring_op R)). Qed.\nGlobal Hint Extern 2 (OrderEmbeddingFlip (·_)) => simple notypeclasses refine neg_mult_order_embedding_flip_r : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflectingFlip (·_)) => simple notypeclasses refine neg_mult_order_embedding_flip_r : typeclass_instances.\n\n\nLemma rig_order_mult_cancel_left `{StrongLinearRefutativeRigOrder (R:=R)} (z:R) {E:z ≠ 0} : Injective (z·).\nProof.\n  intros x y; simplify. rew <-(le_antisym_iff (z·x) _).\n  rew (ne_iff_lt _ _) in E. destruct E as [E|E].\n+ rew [exact:(order_reflecting_flip_simp (z·) x y) | exact:(order_reflecting_flip_simp (z·) y x)].\n  rew (le_antisym_iff _ _). now apply symmetry.\n+ rew [exact:(order_reflecting_simp (z·) x y) | exact:(order_reflecting_simp (z·) y x)].\n  now apply antisymmetry.\nQed.\n\nLemma rig_order_mult_cancel_right `{StrongLinearRefutativeRigOrder (R:=R)} (z:R) {E:z ≠ 0} : Injective (·z).\nProof. exact (rig_order_mult_cancel_left (R:=ring_op R) _). Qed.\n\nCoercion rig_order_mult_cancel `{StrongLinearRefutativeRigOrder (R:=R)} : NonZeroMultiplicativeCancellation R.\nProof. split; [ exact rig_order_mult_cancel_left | exact rig_order_mult_cancel_right ]. Qed.\n\n\nSection squares.\n  Context `{StrongLinearRefutativeRigOrder (R:=R)}.\n\n  Lemma square_pos (z:R) {E:z ≠ 0} : 0 < z · z.\n  Proof. rew (ne_iff_lt _ _) in E. destruct E as [E|E].\n  + now rew <-(strictly_order_embedding_flip_simp (z·) z 0).\n  + now rew <-(strictly_order_embedding_simp (z·) 0 z).\n  Qed.\n\n  Lemma square_nonneg (z:R) : 0 ≤ z · z.\n  Proof. apply (refutative_by_aff_cases (0 ≤ z)); intros [E|E].\n  + now apply (order_preserving_simp (z·) 0 z).\n  + apply lt_le. exact (square_pos _).\n  Qed.\n\n  Lemma le_0_1: 0 ≤ 1 :> R.   Proof. exact (simplify_thm (square_nonneg 1)). Qed.\n  Lemma le_0_2: 0 ≤ 2 :> R.   Proof. rew <-le_0_1; now simplify. Qed.\n\n  Context `{!OneNonZero R}.\n  Local Instance lt_0_1: 0 < 1 :> R.  Proof. exact (simplify_thm (square_pos 1)). Qed.\n  Local Instance lt_0_2: 0 < 2 :> R.  Proof. rew <-le_0_1 at 1. now simplify. Qed.\n\n  Lemma ne_2_0: anot (2 = 0 :> R).  Proof. now apply lt_ne_flip. Qed.\nEnd squares.\n\nGlobal Hint Extern 8 (apos (0 < ?x · ?x)) => simple notypeclasses refine square_pos : typeclass_instances.\nGlobal Hint Extern 8 (apos (0 ≤ ?x · ?x)) => simple notypeclasses refine square_nonneg : typeclass_instances.\nGlobal Hint Extern 4 (apos (0 < 1)) => simple notypeclasses refine lt_0_1 : typeclass_instances.\nGlobal Hint Extern 4 (apos (0 ≤ 1)) => simple notypeclasses refine le_0_1 : typeclass_instances.\nGlobal Hint Extern 4 (apos (0 < 2)) => simple notypeclasses refine lt_0_2 : typeclass_instances.\nGlobal Hint Extern 4 (apos (0 ≤ 2)) => simple notypeclasses refine le_0_2 : typeclass_instances.\nGlobal Hint Extern 4 (apos (2 ≠ 0)) => simple notypeclasses refine ne_2_0 : typeclass_instances.\n\nSection misc.\n  Context `{StrongLinearRefutativeRingOrder (R:=R)}.\n  Lemma minus_le_swap (a b c d : R) : a - b ≤ c - d ⧟ a + d ≤ c + b.\n    rew (order_embedding_simp (+ b + d) _ _) at 1.\n    replc (a - b + (b + d)) with (a + d + (b - b)) by add_mon\n      and (c - d + (b + d)) with (c + b + (d - d)) by add_mon.\n    now simplify.\n  Qed.\n\n  Lemma minus_lt_swap (a b c d : R) : a - b < c - d ⧟ a + d < c + b.\n  Proof. exact (contrapositive_iff (minus_le_swap c d a b)). Qed.\nEnd misc.\n\n\nLemma slr_rig_order_nonneg_sub_rig `{StrongLinearRefutativeRigOrder R} : SubNearRig R⁺.\nProof. split; try exact _.\n  apply alt_Build_MultiplicativeSubMonoid.\n+ intros x y. change (0 ≤ x ⊠ 0 ≤ y ⊸ 0 ≤ x · y).\n  exact ( simplify_thm (mult_le_compat_full 0 x 0 y) ).\n+ now change (0 ≤ 1 :> R).\nQed.\nGlobal Hint Extern 2 (SubNearRig _⁺) => simple notypeclasses refine slr_rig_order_nonneg_sub_rig : typeclass_instances.\nGlobal Hint Extern 2 (SubNearRg _⁺) => simple notypeclasses refine slr_rig_order_nonneg_sub_rig : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubMonoid _⁺) => simple notypeclasses refine slr_rig_order_nonneg_sub_rig : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubSemiGroup _⁺) => simple notypeclasses refine slr_rig_order_nonneg_sub_rig : typeclass_instances.\n\n\nLemma slr_rig_order_nonneg_order `{StrongLinearRefutativeRigOrder R} : StrongLinearRefutativeRigOrder R⁺.\nProof. split; try exact _. intros a b c d. exact (mult_lt_compat_full (R:=R) a b c d). Qed.\nGlobal Hint Extern 2 (StrongLinearRefutativeRigOrder (subset_to_set _⁺)) => simple notypeclasses refine slr_rig_order_nonneg_order : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":55,"kind":"vernac","status":"ok","ms":37,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":56,"e":111,"kind":"vernac","status":"ok","ms":29,"messages":[],"goals":null},{"i":2,"s":112,"e":156,"kind":"vernac","status":"ok","ms":19,"messages":[],"goals":null},{"i":3,"s":157,"e":211,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":212,"e":255,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":5,"s":256,"e":299,"kind":"vernac","status":"ok","ms":32,"messages":[],"goals":null},{"i ite/rewrite.html"},{"s":9230,"e":9233,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":9234,"e":9242,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":9410,"e":9413,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":9429,"e":9432,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":9433,"e":9441,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":9492,"e":9495,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10376,"e":10379,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10427,"e":10432,"lib":"AffineConstructive.tactics.rewrite.replc","name":"replc","kind":"tacn","local":false,"page":"../tactics/rewrite/replc.html"},{"s":10477,"e":10484,"lib":"AffineConstructive.tactics.algebra.com_monoids","name":"add_mon","kind":"tacn","local":false,"page":"../tactics/algebra/com_monoids.html"},{"s":10539,"e":10546,"lib":"AffineConstructive.tactics.algebra.com_monoids","name":"add_mon","kind":"tacn","local":false,"page":"../tactics/algebra/com_monoids.html"},{"s":10552,"e":10555,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10556,"e":10564,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":10987,"e":10990,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file develops ordered rigs and rings, that is, rigs with a strong, linear, refutative order that addition preserves and that obeys the strict compatibility law [[AffineConstructive.interfaces.ring_order.mult_lt_compat_full]]. Rings are the same but with closure of the positive cone under products. The order passes to the opposite ring, so each result about multiplication on the left gives its right-hand version for free. The non-strict compatibility law [[AffineConstructive.orders.rings.mult_le_compat_full]] is derived from the strict one through linearity and refutativity. [[AffineConstructive.orders.rings.strong_linear_refutative_rig_order_from_partial_minus]] builds a rig order from a partial subtraction and closure of the positive elements under products, and it shows that every ring order is a rig order. The consequences follow from these laws: no zero divisors, and cancellation by elements apart from 0. Multiplication by a nonnegative element preserves the order and multiplication by a nonpositive one reverses it. Multiplication by a positive or a negative element is an order embedding, order-preserving or order-reversing according to the sign. A square is nonnegative, and positive when the element is apart from 0, which gives 0 ≤ 1 and 0 ≤ 2, and also 0 < 1, 0 < 2 and 2 ≠ 0 when 1 ≠ 0. The file closes with the swap law [[AffineConstructive.orders.rings.minus_le_swap]] for differences and with the nonnegative cone R⁺, which is a sub-near-rig and carries the same kind of order.","short":"Ordered rigs and rings: compatibility of multiplication with the order, signs, squares, the nonnegative cone","items":[{"name":"AffineConstructive.orders.rings.go","base":"go","kind":"ltac","start":11,"body":null,"status":"ok","short":{"text":"Splits an ordered-rig structure on the opposite ring and discharges every field but the multiplicative law","status":"ok"},"long":{"text":"A local tactic of the section that equips the opposite ring [[AffineConstructive.interfaces.algebra_notation.ring_op]] with an order structure. The goal is a structure such as [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRigOrder]] or [[AffineConstructive.interfaces.ring_order.StrongLinearRefutativeRingOrder]] on the opposite ring of R, where R already carries the same structure. The tactic splits the structure into its fields and tries to discharge each by instance resolution. In the opposite ring only the multiplication differs, so the order, the poset axioms and the additive laws are R's own and resolution finds them. Then it rewrites the multiplication of the opposite ring, wherever it appears as a function, back to R's multiplication with the arguments swapped, unfolds the opposite ring, and tries resolution once more.\n\nWhat is left is the multiplicative law, read at R with its products reversed: the strict compatibility law [[AffineConstructive.interfaces.ring_order.mult_lt_compat_full]] for a rig order, or closure of the positive cone under products for a ring order. Each instance proof then derives that law from R's own law, using commutativity of the tensor and of addition. The tactic exists so that both opposite-ring instances share the bookkeeping and their proofs contain only that step.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.rings.StrongLinearRefutativeRigOrder_op","base":"StrongLinearRefutativeRigOrder_op","kind":"inst","start":12,"body":[13,20],"status":"ok","short":{"text":"A strong linear refutative rig order is also one on the opposite rig","status":"ok"},"proof":[{"text":"The opposite rig is a rig and its order is that of R, so only the strict compatibility law remains. Fix b, a, d, c. Products in the opposite rig are taken in reverse order, so the law asks that b < a and d < c imply d·a + c·b < c·a + d·b.","status":"ok","from":0,"to":3},{"text":"Exchange the two hypotheses, so that d < c comes first. The strict compatibility law of R, with d, c in the first pair and b, a in the second, then gives c·b + d·a < c·a + d·b.","status":"ok","from":4,"to":5},{"text":"This differs from the goal only in the order of the two summands on the left, and addition is commutative.","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.orders.rings.StrongLinearRefutativeRingOrder_op","base":"StrongLinearRefutativeRingOrder_op","kind":"inst","start":21,"body":[22,27],"status":"ok","short":{"text":"A strong linear refutative ring order is also one on the opposite ring","status":"ok"},"proof":[{"text":"The opposite ring is a ring, and the rig part of its order comes from the opposite rig, so only closure of the positive cone under products remains. Fix x and y. In the opposite ring their product is y·x.","status":"ok","from":0,"to":2},{"text":"Exchange the hypotheses 0 < x and 0 < y. The goal is then closure of the positive cone of R under products, applied to y and x.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.rings.mult_le_compat_full","base":"mult_le_compat_full","kind":"prf","start":31,"body":[32,45],"status":"ok","short":{"text":"b ≤ a and d ≤ c imply a·d + b·c ≤ a·c + b·d","status":"ok"},"proof":[{"text":"In a linear refutative order, x ≤ y holds if and only if x < y ⊞ x = y ([[AffineConstructive.orders.orders.le_iff_lt_par_eq]]). So the conclusion becomes a strict inequality par an equality.","status":"ok","from":0,"to":1},{"text":"To prove a par, assume the dual of one side and prove the other. The dual of the strict inequality is the reverse inequality a·c + b·d ≤ a·d + b·c. So with that inequality as a further hypothesis, it remains to prove the equality a·d + b·c = a·c + b·d.","status":"ok","from":2,"to":2},{"text":"The contrapositive of the strict compatibility law turns the reverse inequality into a ≤ b ⊞ c ≤ d.","status":"ok","from":3,"to":3},{"text":"Distributing the tensor over the par pairs each hypothesis with its reverse: b ≤ a ⊠ a ≤ b, par d ≤ c ⊠ c ≤ d ([[AffineConstructive.logic.aprop.apar_aprod_distr_l]]). Antisymmetry turns each pair into an equality, which leaves b = a ⊞ d = c.","status":"ok","from":4,"to":5},{"text":"Because the order is refutative, equality in R is refutative. The equality to be proved is therefore equivalent to ?(a·d + b·c = a·c + b·d), that is, to its par with itself ([[AffineConstructive.interfaces.aprop.refutativity]], [[AffineConstructive.logic.aprop.apar_why_not]]). Duplicating the conclusion lets each factor of the hypothesis b = a ⊞ d = c prove its own copy.","status":"ok","from":6,"to":6},{"text":"In the first copy, commute the summands on the left. Addition preserves the cartesian equality, since R is strong ([[AffineConstructive.theory.set.to_strong_set_strong]]). So an equality of sums follows from the additive conjunction of the equalities of corresponding summands: b·c = a·c ∧ a·d = b·d for the first copy, and a·d = a·c ∧ b·c = b·d for the second.","status":"ok","from":7,"to":9},{"text":"Each equality of products follows from an equality of the factors in which they differ ([[AffineConstructive.interfaces.set.is_fun]]). After symmetry, the first copy asks for b = a ∧ b = a and the second for d = c ∧ d = c. A proposition in additive conjunction with itself is that proposition, so the goal becomes b = a ⊞ d = c implying itself.","status":"ok","from":10,"to":13}]},{"name":"AffineConstructive.orders.rings.strong_linear_refutative_rig_order_from_partial_minus","base":"strong_linear_refutative_rig_order_from_partial_minus","kind":"prf","start":46,"body":[47,64],"status":"ok","short":{"text":"A linear refutative rig order with positive differences for x < y and positive products is a rig order","status":"ok"},"proof":[{"text":"Assume the partial subtraction, which gives a positive difference z with y = x + z whenever x < y, and closure of the positive elements under products. All the other fields of the structure are already available from the context, so only the strict compatibility law remains.","status":"ok","from":0,"to":2},{"text":"Fix b, a, d, c. The strict order of a refutative order is affirmative, and so is the tensor of two strict inequalities. It is therefore enough to derive the conclusion in the base logic from proofs of b < a and d < c ([[AffineConstructive.logic.aprop.affirmative_aimpl]]).","status":"ok","from":3,"to":5},{"text":"Partial subtraction gives x with 0 < x and a = b + x, and y with 0 < y and c = d + y. Substitute these for a and c, after which a and c are no longer needed.","status":"ok","from":6,"to":9},{"text":"Expand (b + x)·(d + y) on the right and rearrange so that b·(d + y) is the last summand on both sides. Translation by b·(d + y) is an order embedding, so it may be cancelled ([[AffineConstructive.orders.maps.strictly_order_preserving]]). It remains to show (b + x)·d < x·(d + y) + b·d.","status":"ok","from":10,"to":12},{"text":"Expand both products and rearrange, so that b·d + x·d is added to 0 on the left and to x·y on the right. Cancelling that translation leaves 0 < x·y ([[AffineConstructive.orders.maps.strictly_order_preserving_simp]]).","status":"ok","from":13,"to":15},{"text":"This holds because x and y are positive and the positive elements are closed under products.","status":"ok","from":16,"to":17}]},{"name":"AffineConstructive.orders.rings.StrongLinearRefutativeRingOrder_StrongLinearRefutativeRigOrder","base":"StrongLinearRefutativeRingOrder_StrongLinearRefutativeRigOrder","kind":"def","start":65,"body":[66,77],"status":"ok","short":{"text":"A strong linear refutative ring order is a strong linear refutative rig order","status":"ok"},"proof":[{"text":"Apply [[AffineConstructive.orders.rings.strong_linear_refutative_rig_order_from_partial_minus]]. A ring order supplies closure of the positive cone under products, so only the partial subtraction remains: x < y gives a positive z with y = x + z.","status":"ok","from":0,"to":1},{"text":"Fix x and y. The strict order is affirmative, so it is enough to work from a proof of x < y in the base logic ([[AffineConstructive.logic.aprop.affirmative_aimpl]]).","status":"ok","from":2,"to":4},{"text":"Take y − x as the witness. It remains to show that it is positive and that y = x + (y − x).","status":"ok","from":5,"to":6},{"text":"Translation by x reflects the strict order and carries 0 < y − x to x < y, which holds ([[AffineConstructive.orders.maps.strictly_order_reflecting_simp]]).","status":"ok","from":7,"to":8},{"text":"The equation y = x + (y − x) holds in any abelian additive group.","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.orders.rings.StrongLinearRefutativeRigOrder_NoZeroDivisors","base":"StrongLinearRefutativeRigOrder_NoZeroDivisors","kind":"def","start":78,"body":[79,84],"status":"ok","short":{"text":"A rig with a strong linear refutative order has no zero divisors","status":"ok"},"proof":[{"text":"Fix x and y. The task is to show that x·y = 0 implies x = 0 ⊞ y = 0. Write each equality with 0 as the additive conjunction of two inequalities ([[AffineConstructive.orders.orders.le_antisym_iff]]).","status":"ok","from":0,"to":2},{"text":"Prove the contrapositive ([[AffineConstructive.logic.aprop.by_contrapositive]]). The dual of each inequality is the reverse strict inequality. The goal becomes: if x is positive or negative, and y is positive or negative, then x·y is positive or negative.","status":"ok","from":3,"to":3},{"text":"Strict inequalities and their disjunctions are affirmative, so the argument can be made in the base logic, by cases on the two signs. In each of the four cases the strict compatibility law, applied to the strict inequalities with 0, simplifies to the required sign of x·y.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.orders.rings.nonneg_mult_order_preserving_l","base":"nonneg_mult_order_preserving_l","kind":"prf","start":85,"body":[86,89],"status":"ok","short":{"text":"For 0 ≤ z, left multiplication by z is order preserving","status":"ok"},"proof":[{"text":"It is enough to show that x ≤ y implies z·x ≤ z·y for all x and y ([[AffineConstructive.orders.maps.alt_Build_OrderPreserving]]).","status":"ok","from":0,"to":1},{"text":"This is [[AffineConstructive.orders.rings.mult_le_compat_full]] applied to 0 ≤ z and x ≤ y. The hypothesis 0 ≤ z is given, and the terms with factor 0 drop out, leaving exactly z·x ≤ z·y.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.rings.nonneg_mult_order_preserving_r","base":"nonneg_mult_order_preserving_r","kind":"prf","start":91,"body":[92,94],"status":"ok","short":{"text":"For 0 ≤ z, right multiplication by z is order preserving","status":"ok"},"proof":[{"text":"Right multiplication by z in R is left multiplication by z in the opposite rig, which carries the same kind of order ([[AffineConstructive.orders.rings.StrongLinearRefutativeRigOrder_op]]). So the claim is [[AffineConstructive.orders.rings.nonneg_mult_order_preserving_l]] there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.nonpos_mult_order_preserving_flip_l","base":"nonpos_mult_order_preserving_flip_l","kind":"prf","start":96,"body":[97,100],"status":"ok","short":{"text":"For z ≤ 0, left multiplication by z reverses the order","status":"ok"},"proof":[{"text":"It is enough to show that x ≤ y implies z·y ≤ z·x for all x and y ([[AffineConstructive.orders.maps.alt_Build_OrderPreservingFlip]]).","status":"ok","from":0,"to":1},{"text":"This is [[AffineConstructive.orders.rings.mult_le_compat_full]] applied to z ≤ 0 and x ≤ y. The hypothesis z ≤ 0 is given, and the terms with factor 0 drop out, leaving z·y ≤ z·x.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.rings.nonpos_mult_order_preserving_flip_r","base":"nonpos_mult_order_preserving_flip_r","kind":"prf","start":102,"body":[103,105],"status":"ok","short":{"text":"For z ≤ 0, right multiplication by z reverses the order","status":"ok"},"proof":[{"text":"Right multiplication by z in R is left multiplication by z in the opposite rig, which carries the same kind of order ([[AffineConstructive.orders.rings.StrongLinearRefutativeRigOrder_op]]). So the claim is [[AffineConstructive.orders.rings.nonpos_mult_order_preserving_flip_l]] there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.pos_mult_order_embedding_l","base":"pos_mult_order_embedding_l","kind":"prf","start":107,"body":[108,114],"status":"ok","short":{"text":"For 0 < z, left multiplication by z is an order embedding","status":"ok"},"proof":[{"text":"An order embedding is an order-preserving map that also reflects the order. Since 0 < z gives 0 ≤ z, left multiplication by z preserves the order by [[AffineConstructive.orders.rings.nonneg_mult_order_preserving_l]]. It remains to show that it reflects the order.","status":"ok","from":0,"to":1},{"text":"To show that it reflects the order, it suffices to fix x and y and show that z · x ≤ z · y implies x ≤ y.","status":"ok","from":2,"to":3},{"text":"Pass to the contrapositive. The dual of x ≤ y is y < x and the dual of z · x ≤ z · y is z · y < z · x, so the goal becomes: y < x implies z · y < z · x.","status":"ok","from":4,"to":4},{"text":"This is the strict compatibility law [[AffineConstructive.interfaces.ring_order.mult_lt_compat_full]] applied to 0 < z and y < x. The factor 0 < z is already proved, so it drops out, and the terms involving 0 vanish on simplification.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.orders.rings.pos_mult_order_embedding_r","base":"pos_mult_order_embedding_r","kind":"prf","start":117,"body":[118,120],"status":"ok","short":{"text":"For 0 < z, right multiplication by z is an order embedding","status":"ok"},"proof":[{"text":"The order passes to the opposite rig, where right multiplication by z becomes left multiplication by z. The left-hand result [[AffineConstructive.orders.rings.pos_mult_order_embedding_l]], applied there, gives the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.neg_mult_order_embedding_flip_l","base":"neg_mult_order_embedding_flip_l","kind":"prf","start":123,"body":[124,130],"status":"ok","short":{"text":"For z < 0, left multiplication by z is an order-reversing embedding","status":"ok"},"proof":[{"text":"An order-reversing embedding is an order-reversing map that also reflects the order in reverse. Since z < 0 gives z ≤ 0, left multiplication by z reverses the order by [[AffineConstructive.orders.rings.nonpos_mult_order_preserving_flip_l]]. It remains to show that it reflects the order in reverse.","status":"ok","from":0,"to":1},{"text":"To show this, it suffices to fix x and y and show that z · y ≤ z · x implies x ≤ y.","status":"ok","from":2,"to":3},{"text":"Pass to the contrapositive. The goal becomes: y < x implies z · x < z · y.","status":"ok","from":4,"to":4},{"text":"This is the strict compatibility law [[AffineConstructive.interfaces.ring_order.mult_lt_compat_full]] applied to z < 0 and y < x. The factor z < 0 is already proved, so it drops out, and the terms involving 0 vanish on simplification.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.orders.rings.neg_mult_order_embedding_flip_r","base":"neg_mult_order_embedding_flip_r","kind":"prf","start":133,"body":[134,136],"status":"ok","short":{"text":"For z < 0, multiplication by z is an order-reversing embedding (stated, as printed, for z· rather than ·z)","status":"ok"},"proof":[{"text":"The claim follows from the left-hand result [[AffineConstructive.orders.rings.neg_mult_order_embedding_flip_l]], applied to the opposite rig.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.rig_order_mult_cancel_left","base":"rig_order_mult_cancel_left","kind":"prf","start":139,"body":[140,152],"status":"ok","short":{"text":"For z ≠ 0, left multiplication by z is injective","status":"ok"},"proof":[{"text":"Fix x and y. It must be shown that z · x = z · y implies x = y.","status":"ok","from":0,"to":1},{"text":"By antisymmetry, rewrite the equality z · x = z · y as the additive conjunction of the two inequalities z · x ≤ z · y and z · y ≤ z · x.","status":"ok","from":2,"to":2},{"text":"In a linear order, z ≠ 0 means z < 0 or 0 < z. The proof treats the two cases separately.","status":"ok","from":3,"to":4},{"text":"Suppose z < 0. Then left multiplication by z reflects the order in reverse ([[AffineConstructive.orders.rings.neg_mult_order_embedding_flip_l]]). Applied to each of the two inequalities, this turns them into y ≤ x and x ≤ y. Together these give y = x, and x = y follows by symmetry.","status":"ok","from":5,"to":8},{"text":"Suppose 0 < z. Then left multiplication by z reflects the order ([[AffineConstructive.orders.rings.pos_mult_order_embedding_l]]). The two inequalities become x ≤ y and y ≤ x, and antisymmetry gives x = y.","status":"ok","from":9,"to":12}]},{"name":"AffineConstructive.orders.rings.rig_order_mult_cancel_right","base":"rig_order_mult_cancel_right","kind":"prf","start":153,"body":[154,156],"status":"ok","short":{"text":"For z ≠ 0, right multiplication by z is injective","status":"ok"},"proof":[{"text":"Pass to the opposite rig, where right multiplication becomes left multiplication. The left-hand result [[AffineConstructive.orders.rings.rig_order_mult_cancel_left]], applied there, gives the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.rig_order_mult_cancel","base":"rig_order_mult_cancel","kind":"def","start":157,"body":[158,160],"status":"ok","short":{"text":"In a strong linear refutative rig order, multiplication by an element apart from 0 cancels","status":"ok"},"proof":[{"text":"Cancellation by an element apart from 0 has two parts, one on each side. They are [[AffineConstructive.orders.rings.rig_order_mult_cancel_left]] and [[AffineConstructive.orders.rings.rig_order_mult_cancel_right]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.square_pos","base":"square_pos","kind":"prf","start":163,"body":[164,171],"status":"ok","short":{"text":"The square of an element apart from 0 is positive","status":"ok"},"proof":[{"text":"In a linear order, z ≠ 0 means z < 0 or 0 < z. The proof treats the two cases separately.","status":"ok","from":0,"to":2},{"text":"Suppose z < 0. Left multiplication by z is then an order-reversing embedding ([[AffineConstructive.orders.rings.neg_mult_order_embedding_flip_l]]). It turns z < 0 into z · 0 < z · z, that is, 0 < z · z.","status":"ok","from":3,"to":4},{"text":"Suppose 0 < z. Left multiplication by z is then an order embedding ([[AffineConstructive.orders.rings.pos_mult_order_embedding_l]]). It turns 0 < z into z · 0 < z · z, that is, 0 < z · z.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.orders.rings.square_nonneg","base":"square_nonneg","kind":"prf","start":172,"body":[173,180],"status":"ok","short":{"text":"Every square is nonnegative: 0 ≤ z · z","status":"ok"},"proof":[{"text":"The goal 0 ≤ z · z is refutative, and 0 ≤ z is affirmatively decidable. So [[AffineConstructive.logic.refutative.refutative_by_aff_cases]] allows a case split on 0 ≤ z or its dual, z < 0.","status":"ok","from":0,"to":1},{"text":"Suppose 0 ≤ z. Left multiplication by z then preserves the order ([[AffineConstructive.orders.rings.nonneg_mult_order_preserving_l]]). It takes 0 ≤ z to z · 0 ≤ z · z, that is, 0 ≤ z · z.","status":"ok","from":2,"to":3},{"text":"Suppose z < 0. Then z ≠ 0, so the square is strictly positive by [[AffineConstructive.orders.rings.square_pos]]. A strict inequality gives the weak one.","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.orders.rings.le_0_1","base":"le_0_1","kind":"prf","start":181,"body":[182,184],"status":"ok","short":{"text":"0 ≤ 1 in a strong linear refutative rig order","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.rings.square_nonneg]], 0 ≤ 1 · 1, and 1 · 1 simplifies to 1.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.le_0_2","base":"le_0_2","kind":"prf","start":185,"body":[186,188],"status":"ok","short":{"text":"0 ≤ 2 in a strong linear refutative rig order","status":"ok"},"proof":[{"text":"Since 2 = 1 + 1, it suffices by [[AffineConstructive.orders.rings.le_0_1]] to replace the second summand 1 with 0: addition preserves the order, so 0 ≤ 1 turns the goal into 0 ≤ 1 + 0, which simplifies to 0 ≤ 1, another instance of [[AffineConstructive.orders.rings.le_0_1]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.lt_0_1","base":"lt_0_1","kind":"inst","start":190,"body":[191,193],"status":"ok","short":{"text":"0 < 1 when 1 ≠ 0","status":"ok"},"proof":[{"text":"Since 1 is apart from 0, its square 1 · 1 is positive by [[AffineConstructive.orders.rings.square_pos]], and 1 · 1 simplifies to 1.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.lt_0_2","base":"lt_0_2","kind":"inst","start":194,"body":[195,198],"status":"ok","short":{"text":"0 < 2 when 1 ≠ 0","status":"ok"},"proof":[{"text":"Write 2 as 1 + 1 and lower the first summand: by [[AffineConstructive.orders.rings.le_0_1]] and the monotonicity of addition, 0 + 1 ≤ 2, so it suffices to show 0 < 0 + 1.","status":"ok","from":0,"to":1},{"text":"This simplifies to 0 < 1, which is [[AffineConstructive.orders.rings.lt_0_1]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.rings.ne_2_0","base":"ne_2_0","kind":"prf","start":199,"body":[200,202],"status":"ok","short":{"text":"2 ≠ 0 when 1 ≠ 0","status":"ok"},"proof":[{"text":"A strict inequality gives apartness: 0 < 2, which is [[AffineConstructive.orders.rings.lt_0_2]], implies 2 ≠ 0 by [[AffineConstructive.orders.orders.lt_ne_flip]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.minus_le_swap","base":"minus_le_swap","kind":"prf","start":213,"body":[214,217],"status":"ok","short":{"text":"In an ordered ring, a − b ≤ c − d if and only if a + d ≤ c + b","status":"ok"},"proof":[{"text":"Adding b + d to both sides is an order embedding, so the inequality a − b ≤ c − d is equivalent to the same inequality with b + d added to each side ([[AffineConstructive.orders.maps.order_embedding_simp]]).","status":"ok","from":0,"to":0},{"text":"By the additive monoid laws, the two sides rearrange to a + d + (b − b) and c + b + (d − d). Since b − b = 0 and d − d = 0, these simplify to a + d and c + b, and both sides of the equivalence then agree.","status":"ok","from":1,"to":3}]},{"name":"AffineConstructive.orders.rings.minus_lt_swap","base":"minus_lt_swap","kind":"prf","start":218,"body":[219,221],"status":"ok","short":{"text":"In an ordered ring, a − b < c − d if and only if a + d < c + b","status":"ok"},"proof":[{"text":"The strict order is the dual of the reversed non-strict order. Taking duals in the equivalence c − d ≤ a − b ⧟ c + b ≤ a + d, which is [[AffineConstructive.orders.rings.minus_le_swap]], gives the strict version by [[AffineConstructive.logic.aprop.contrapositive_iff]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.rings.slr_rig_order_nonneg_sub_rig","base":"slr_rig_order_nonneg_sub_rig","kind":"prf","start":223,"body":[224,233],"status":"ok","short":{"text":"The nonnegative cone R⁺ of an ordered rig is a sub-near-rig","status":"ok"},"proof":[{"text":"The nonnegative cone is already an additive submonoid ([[AffineConstructive.orders.groups.add_mon_order_nonneg_sub_mon]]), so what remains is that it is a multiplicative submonoid.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.subrings.alt_Build_MultiplicativeSubMonoid]] it suffices to show closure under products and that 1 is nonnegative.","status":"ok","from":2,"to":2},{"text":"Fix x and y. Closure asks for 0 ≤ x and 0 ≤ y to imply 0 ≤ x · y. This is the non-strict compatibility law [[AffineConstructive.orders.rings.mult_le_compat_full]] at a = x, b = 0, c = y, d = 0, once the products with 0 and the sums with 0 are simplified.","status":"ok","from":3,"to":6},{"text":"That 1 is in the cone means 0 ≤ 1, which is [[AffineConstructive.orders.rings.le_0_1]].","status":"ok","from":7,"to":9}]},{"name":"AffineConstructive.orders.rings.slr_rig_order_nonneg_order","base":"slr_rig_order_nonneg_order","kind":"prf","start":238,"body":[239,243],"status":"ok","short":{"text":"The nonnegative cone R⁺ inherits a strong linear refutative rig order","status":"ok"},"proof":[{"text":"With the restricted order, the cone inherits strength, linearity and refutativity from R, and it is an ordered additive monoid by [[AffineConstructive.orders.groups.add_mon_order_nonneg_order]]. Only the strict compatibility law for products remains.","status":"ok","from":0,"to":1},{"text":"Fix a, b, c and d in the cone. The law for them is [[AffineConstructive.interfaces.ring_order.mult_lt_compat_full]] in R, applied to the same elements, since the order and the operations on the cone are those of R.","status":"ok","from":2,"to":4}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.ring_order":{"page":"../interfaces/ring_order.html","short":"Cones of a poset with zero; ordered monoids, groups, rigs and rings","summary":"The file defines the cones of a weak poset with a zero: the subsets of nonzero, nonnegative (R⁺), nonpositive (R⁻), positive (R₊) and negative (R₋) elements, as affine subsets, so that each carries its refutation. It then defines the interfaces for ordered algebra. An ordered additive monoid is a poset and additive monoid in which every left translation z + _ is an order embedding: it both preserves and reflects the order. An ordered additive group asks only that every left translation preserve the order. A strong linear refutative rig order is a rig with a strongly transitive, pseudo-total, refutative partial order that is an ordered additive monoid, with the axiom that b < a and d < c imply a·d + b·c < a·c + b·d. This is positivity of (a − b)(c − d) stated without subtraction. The ring version, with an ordered additive group, asks instead that a product of positive elements be positive. Hints let resolution find that left addition preserves, reflects or embeds the order. The theory of these structures is developed in orders.groups and orders.rings."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.groups":{"page":"groups.html","short":"Ordered additive monoids and groups: translations, negation, and sign under morphisms","summary":"This file proves the basic order laws of ordered additive monoids and groups. For an ordered monoid it shows that every right translation (+z) is an order embedding and that addition is order preserving in both arguments. It also proves that 0 ≤ z and y = x + z together imply x ≤ y ([[compose_le]], with the strict version [[compose_lt]]), proves the mixed strict and non-strict addition laws, derives additive cancellation, and shows that the nonnegative part is again an ordered monoid. For an additive monoid morphism it proves how sign is preserved, reflected and embedded, both for monotone maps and for order-reversing ones, where each strict statement is the contrapositive of a non-strict one. It then shows that an ordered group is an ordered monoid ([[AdditiveGroupOrder_AdditiveMonoidOrder]]) and that negation is an order-reversing embedding ([[negate_order_embedding_flip]]). It ends with lemmas comparing x with −x according to its sign: those whose hypothesis is non-strict, and their contrapositives, need a strongly transitive order, while [[pos_between]], [[neg_between]] and their contrapositives need a linear, refutative order."},"AffineConstructive.theory.rings":{"page":"../theory/rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.subrings":{"page":"../theory/subrings.html","short":"Subrings and sub-near-rings: builders, induced structure, images, preimages, zero-symmetric part","summary":"This file carries the substructure theory of `theory/subgroups.v` over to ring-like structures. It first restates the subsemigroup, submonoid and subgroup results in additive and multiplicative form (builders from closure conditions, the full subset, the induced operations, the inclusion as a morphism, images and preimages), then treats the sub-near-rg, sub-near-rig, sub-near-rng and sub-near-ring predicates: their builders from closure under +, · and −, invariance under equality of subsets, the induced near-ring, ring and commutative ring structures on a substructure, the inclusion as an rg or rig morphism, and the stability of these substructures under images and preimages. It closes with the zero-symmetric part N₀ = { n | n · 0 = 0 } of a right near-ring, shown to be a substructure of whichever kind N is. The results are instances found by resolution, so a subset closed under the ring operations is a ring wherever one is needed."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.logic.refutative":{"page":"../logic/refutative.html","short":"Excluded middle as a par, case analysis for refutative goals, and affirmative decidability","summary":"This file collects the classical reasoning that is valid when the conclusion is refutative. It proves the affine law of excluded middle P ⊞ Pᗮ, which holds as a par and not as a disjunction, and the related fact ?(P ∨ Pᗮ). Since a refutative Q follows from why not P whenever P ⊸ Q ([[refutative_by_why_not]]), these give elimination rules for refutative goals: case analysis on a par ([[refutative_apar_elim]]), on P or its negation ([[refutative_by_LEM]], [[refutative_by_cases]]), and proof by contradiction ([[refutative_by_contradiction]]). The file then defines [[Affirmative_Decidability]], which says that P ∨ Pᗮ is affirmative. When P has this property, the case split may use a base-logic function from P ∨ Pᗮ to the conclusion ([[refutative_by_aff_cases]]). Affirmative and refutative propositions, !P and ?P are all affirmatively decidable, and the property is preserved by negation, ∧, ∨, ⊠ and ⊞; these facts are registered as instances."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.algebra.com_monoids":{"page":"../tactics/algebra/com_monoids.html","short":"Decision procedures for equations in commutative additive and multiplicative monoids","summary":"This file provides the decision procedures `add_mon` and `com_mon`, which prove equations between sums in a commutative additive monoid and between products in a commutative monoid. Each one fixes a free algebra on the naturals as generators: `add_mon.F` is the free commutative additive monoid and `com_mon.F` the free commutative monoid. The tactic reflects both sides of the equation into that free algebra over a list of atoms, then decides the resulting equation by computing normal forms. Its evaluation into the monoid turns that decision back into the original equation. The free algebras come from the free commutative monoid in the implementations, and the reflection machinery comes from the quotation tactics. Other tactic files and the algebraic theory files use these procedures to close routine monoid identities."}},"constants":null}</script>

ame":"sub_monoid_monoid","kind":"thm","local":false,"page":"../theory/subgroups.html"},{"s":6569,"e":6596,"lib":"AffineConstructive.orders.sublattices","name":"sub_star_sg_inv_join_sl_mor","kind":"thm","local":true},{"s":6607,"e":6623,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"preserves_bottom","kind":"def","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":6658,"e":6689,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"BoundedJoinSemiLattice_Morphism","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":6732,"e":6735,"lib":"AffineConstructive.interfaces.algebra_notation","name":"inv","kind":"def","local":false,"page":"../interfaces/algebra_notation.html"},{"s":6715,"e":6728,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":false,"page":"../interfaces/subset.html"},{"s":6694,"e":6707,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":false,"page":"../interfaces/subset.html"},{"s":6770,"e":6805,"lib":"AffineConstructive.orders.sublattices","name":"sub_star_sg_inv_bounded_join_sl_mor","kind":"thm","local":true},{"s":6854,"e":6877,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Bottom_Pointed_Morphism","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":6920,"e":6923,"lib":"AffineConstructive.interfaces.algebra_notation","name":"inv","kind":"def","local":false,"page":"../interfaces/algebra_notation.html"},{"s":6903,"e":6916,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":false,"page":"../interfaces/subset.html"},{"s":6882,"e":6895,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":false,"page":"../interfaces/subset.html"},{"s":6958,"e":6993,"lib":"AffineConstructive.orders.sublattices","name":"sub_star_sg_inv_bounded_join_sl_mor","kind":"thm","local":true},{"s":7063,"e":7079,"lib":"AffineConstructive.interfaces.subalgebra","name":"SubStarSemiGroup","kind":"class","local":false,"page":"../interfaces/subalgebra.html"},{"s":7093,"e":7118,"lib":"AffineConstructive.interfaces.subalgebra","name":"MeetSubBoundedSemiLattice","kind":"class","local":false,"page":"../interfaces/subalgebra.html"},{"s":7131,"e":7162,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"BoundedMeetSemiLattice_Morphism","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":7170,"e":7173,"lib":"AffineConstructive.interfaces.algebra_notation","name":"inv","kind":"def","local":false,"page":"../interfaces/algebra_notation.html"},{"s":7179,"e":7210,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"BoundedMeetSemiLattice_Morphism","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":7218,"e":7221,"lib":"AffineConstructive.interfaces.algebra_notation","name":"inv","kind":"def","local":false,"page":"../interfaces/algebra_notation.html"},{"s":7244,"e":7261,"lib":"AffineConstructive.theory.subgroups","name":"sub_monoid_monoid","kind":"thm","local":false,"page":"../theory/subgroups.html"},{"s":7280,"e":7307,"lib":"AffineConstructive.orders.sublattices","name":"sub_star_sg_inv_meet_sl_mor","kind":"thm","local":true},{"s":7318,"e":7331,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"preserves_top","kind":"def","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":7366,"e":7397,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"BoundedMeetSemiLattice_Morphism","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":7440,"e":7443,"lib":"AffineConstructive.interfaces.algebra_notation","name":"inv","kind":"def","local":false,"page":"../interfaces/algebra_notation.html"},{"s":7423,"e":7436,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":false,"page":"../interfaces/subset.html"},{"s":7402,"e":7415,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":false,"page":"../interfaces/subset.html"},{"s":7478,"e":7513,"lib":"AffineConstructive.orders.sublattices","name":"sub_star_sg_inv_bounded_meet_sl_mor","kind":"thm","local":true},{"s":7562,"e":7582,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Top_Pointed_Morphism","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":7625,"e":7628,"lib":"AffineConstructive.interfaces.algebra_notation","name":"inv","kind":"def","local":false,"page":"../interfaces/algebra_notation.html"},{"s":7608,"e":7621,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":false,"page":"../interfaces/subset.html"},{"s":7587,"e":7600,"lib":"AffineConstructive.interfaces.subset","name":"subset_to_set","kind":"canonstruc","local":false,"page":"../interfaces/subset.html"},{"s":7663,"e":7698,"lib":"AffineConstructive.orders.sublattices","name":"sub_star_sg_inv_bounded_meet_sl_mor","kind":"thm","local":true},{"s":1051,"e":1054,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":4751,"e":4754,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6121,"e":6124,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[AffineConstructive.orders.sublattices.sub_meet_sl_order]], [[AffineConstructive.orders.sublattices.sub_join_sl_order]], [[AffineConstructive.orders.sublattices.sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`.","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","items":[{"name":"AffineConstructive.orders.sublattices.sub_meet_sl_order","base":"sub_meet_sl_order","kind":"prf","start":2,"body":[3,14],"status":"ok","short":{"text":"A subset closed under meets is a meet semilattice order with the restricted order and meet","status":"ok"},"proof":[{"text":"A meet semilattice order is a weak poset with a meet that is a greatest lower bound. The subset is a weak poset with the order of L, and it carries the meet of L restricted to U. What remains are the three meet laws in U.","status":"ok","from":0,"to":1},{"text":"Fix x and y in U. The meet of x and y in U is their meet in L, so x ⊓ y ≤ x is the same law in L, applied to the underlying points.","status":"ok","from":2,"to":4},{"text":"Similarly, x ⊓ y ≤ y holds because it holds in L for the underlying points.","status":"ok","from":5,"to":7},{"text":"Fix x, y and z. That z ≤ x ⊠ z ≤ y implies z ≤ x ⊓ y is the greatest-lower-bound property of the meet in L, read at the underlying points.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.orders.sublattices.sub_join_sl_order","base":"sub_join_sl_order","kind":"prf","start":16,"body":[17,28],"status":"ok","short":{"text":"A subset closed under joins is a join semilattice order with the restricted order and join","status":"ok"},"proof":[{"text":"A join semilattice order is a meet semilattice order on the opposite order, with the join as the meet. U is a weak poset with the order of L, and so is its opposite. U also carries the join of L restricted to it. What remain are the three meet laws in the opposite of U, which are the join laws of U read backwards.","status":"ok","from":0,"to":1},{"text":"Fix x and y. In the opposite order the first law says that x lies below x ⊔ y. This is [[AffineConstructive.interfaces.orders.join_ub_l]] in L, applied to the underlying points.","status":"ok","from":2,"to":4},{"text":"In the same way, y lies below x ⊔ y by [[AffineConstructive.interfaces.orders.join_ub_r]] in L.","status":"ok","from":5,"to":7},{"text":"Fix x, y and z. Read in the original order, the last law says that x ≤ z ⊠ y ≤ z implies x ⊔ y ≤ z. This is [[AffineConstructive.interfaces.orders.join_lub]] in L, at the underlying points.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.orders.sublattices.sub_lattice_order","base":"sub_lattice_order","kind":"prf","start":30,"body":[31,33],"status":"ok","short":{"text":"A sublattice of a lattice order is a lattice order with the restricted order, meet and join","status":"ok"},"proof":[{"text":"A lattice order is both a meet semilattice order and a join semilattice order. A sublattice is closed under both operations, so the two halves are [[AffineConstructive.orders.sublattices.sub_meet_sl_order]] and [[AffineConstructive.orders.sublattices.sub_join_sl_order]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.sublattices.sub_sg_op_order_preserving","base":"sub_sg_op_order_preserving","kind":"prf","start":36,"body":[37,41],"status":"ok","short":{"text":"If the operation of a semigroup preserves the order, so does its restriction to a subsemigroup","status":"ok"},"proof":[{"text":"Both sides are weak posets: H ⊗ H has the componentwise order, which joins the two comparisons by ⊠. So by [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices that every comparison of pairs implies the comparison of their products.","status":"ok","from":0,"to":1},{"text":"Take pairs (a, b) and (c, d) in H ⊗ H. Their comparison and the comparison of a ∙ b with c ∙ d are those of the underlying points of G. So the claim is the order preservation of the operation of G, applied to these pairs.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.sublattices.sub_sg_op_join_sl_mor_l","base":"sub_sg_op_join_sl_mor_l","kind":"prf","start":43,"body":[44,49],"status":"ok","short":{"text":"In a subsemigroup closed under joins, y ↦ x ∙ y preserves joins if it does in the ambient set","status":"ok"},"proof":[{"text":"A join-semilattice morphism is a semigroup morphism for the join as the operation. Both H and the codomain are semigroups under the restricted join ([[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]]), so what remains is that left multiplication by x carries joins to joins.","status":"ok","from":0,"to":1},{"text":"Restated, the goal asks that x ∙ (y ⊔ z) = x ∙ y ⊔ x ∙ z for all y and z in H. Fix y and z. Products and joins in H are those of G, so the equation is [[AffineConstructive.theory.lattices.preserves_join]] for left multiplication by the underlying point of x in G.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.sublattices.sub_sg_op_join_sl_mor_r","base":"sub_sg_op_join_sl_mor_r","kind":"prf","start":51,"body":[52,57],"status":"ok","short":{"text":"In a subsemigroup closed under joins, y ↦ y ∙ x preserves joins if it does in the ambient set","status":"ok"},"proof":[{"text":"As on the left: H is a semigroup under the restricted join ([[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]]), so what remains is that right multiplication by x carries joins to joins.","status":"ok","from":0,"to":1},{"text":"Restated, the goal asks that (y ⊔ z) ∙ x = y ∙ x ⊔ z ∙ x for all y and z in H. Fix y and z. The equation is [[AffineConstructive.theory.lattices.preserves_join]] for right multiplication by the underlying point of x in G.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.sublattices.sub_sg_op_join_distr_l","base":"sub_sg_op_join_distr_l","kind":"prf","start":59,"body":[60,64],"status":"ok","short":{"text":"Left distributivity of the operation over joins passes to a subsemigroup closed under joins","status":"ok"},"proof":[{"text":"Restated, left distributivity in H asks that x ∙ (y ⊔ z) = x ∙ y ⊔ x ∙ z for all x, y and z in H. Fix x, y and z.","status":"ok","from":0,"to":2},{"text":"Products and joins in H are those of G, so the equation is the left distributive law [[AffineConstructive.interfaces.common_props.distribute_l]] of G, applied to the underlying points.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.sublattices.sub_sg_op_join_distr_r","base":"sub_sg_op_join_distr_r","kind":"prf","start":66,"body":[67,71],"status":"ok","short":{"text":"Right distributivity of the operation over joins passes to a subsemigroup closed under joins","status":"ok"},"proof":[{"text":"Restated, right distributivity in H asks that (y ⊔ z) ∙ x = y ∙ x ⊔ z ∙ x for all y, z and x in H. Fix y, z and x.","status":"ok","from":0,"to":2},{"text":"The equation is the right distributive law [[AffineConstructive.interfaces.common_props.distribute_r]] of G, applied to the underlying points.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.sublattices.sub_star_sg_inv_order_preserving","base":"sub_star_sg_inv_order_preserving","kind":"prf","start":74,"body":[75,79],"status":"ok","short":{"text":"If the involution preserves the order, so does its restriction to a star subsemigroup","status":"ok"},"proof":[{"text":"H with the order of G is a weak poset, and it carries the restricted involution. So by [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices that x ≤ y implies x* ≤ y* for all x, y in H.","status":"ok","from":0,"to":1},{"text":"Fix x and y. The comparisons in H are those of the underlying points, and the restricted involution acts as the involution of G. So the implication is the order preservation of the involution of G at those points.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.sublattices.sub_star_sg_inv_order_reflecting","base":"sub_star_sg_inv_order_reflecting","kind":"prf","start":81,"body":[82,86],"status":"ok","short":{"text":"If the involution reflects the order, so does its restriction to a star subsemigroup","status":"ok"},"proof":[{"text":"H is a weak poset with the order of G. So by [[AffineConstructive.orders.maps.alt_Build_OrderReflecting]] it suffices that x* ≤ y* implies x ≤ y for all x, y in H.","status":"ok","from":0,"to":1},{"text":"Fix x and y. The implication is the order reflection of the involution of G, applied to the underlying points.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.sublattices.sub_star_sg_inv_order_embedding","base":"sub_star_sg_inv_order_embedding","kind":"prf","start":88,"body":[89,91],"status":"ok","short":{"text":"If the involution is an order embedding, so is its restriction to a star subsemigroup","status":"ok"},"proof":[{"text":"An order embedding is a map that preserves the order and also reflects it. The restricted involution does both, by [[AffineConstructive.orders.sublattices.sub_star_sg_inv_order_preserving]] and [[AffineConstructive.orders.sublattices.sub_star_sg_inv_order_reflecting]], and this closes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.sublattices.sub_star_sg_inv_join_sl_mor","base":"sub_star_sg_inv_join_sl_mor","kind":"prf","start":93,"body":[94,99],"status":"ok","short":{"text":"If the involution preserves joins, so does its restriction to a star subsemigroup closed under joins","status":"ok"},"proof":[{"text":"A join-semilattice morphism is a semigroup morphism for the join operations. The structural parts hold because H with the restricted join is a semigroup ([[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]]). It remains to show that the restricted involution preserves joins.","status":"ok","from":0,"to":1},{"text":"Restated, the goal is (x ⊔ y)* = x* ⊔ y* for x, y in H. Fix x and y. Join, involution and equality in H are those of G on the underlying points, so the equation is the instance of [[AffineConstructive.theory.lattices.preserves_join]] for the involution of G at those points.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.sublattices.sub_star_sg_inv_meet_sl_mor","base":"sub_star_sg_inv_meet_sl_mor","kind":"prf","start":101,"body":[102,107],"status":"ok","short":{"text":"If the involution preserves meets, so does its restriction to a star subsemigroup closed under meets","status":"ok"},"proof":[{"text":"A meet-semilattice morphism is a semigroup morphism for the meet operations. The structural parts hold because H with the restricted meet is a semigroup ([[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]]). It remains to show that the restricted involution preserves meets.","status":"ok","from":0,"to":1},{"text":"Restated, the goal is (x ⊓ y)* = x* ⊓ y* for x, y in H. Fix x and y. Meet, involution and equality in H are those of G on the underlying points, so the equation is the instance of [[AffineConstructive.theory.lattices.preserves_meet]] for the involution of G at those points.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.sublattices.sub_star_sg_inv_lat_mor","base":"sub_star_sg_inv_lat_mor","kind":"prf","start":109,"body":[110,112],"status":"ok","short":{"text":"If the involution is a lattice morphism, so is its restriction to a star subsemigroup and sublattice","status":"ok"},"proof":[{"text":"A lattice morphism preserves joins and preserves meets. By [[AffineConstructive.orders.sublattices.sub_star_sg_inv_join_sl_mor]] and [[AffineConstructive.orders.sublattices.sub_star_sg_inv_meet_sl_mor]], the restricted involution does both. For this, H is a lattice ([[AffineConstructive.theory.sublattices.sub_lattice_lattice]]), and so it is closed under both operations.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.sublattices.sub_star_sg_inv_bounded_join_sl_mor","base":"sub_star_sg_inv_bounded_join_sl_mor","kind":"prf","start":114,"body":[115,121],"status":"ok","short":{"text":"If the involution preserves joins and ⊥, so does its restriction to a subset closed under both","status":"ok"},"proof":[{"text":"A bounded join-semilattice morphism is a monoid morphism for join and ⊥. The structural parts hold because H with the restricted join and ⊥ is a monoid ([[AffineConstructive.theory.subgroups.sub_monoid_monoid]]). Two things remain: the involution preserves joins, and it preserves ⊥.","status":"ok","from":0,"to":1},{"text":"The restricted involution preserves joins by [[AffineConstructive.orders.sublattices.sub_star_sg_inv_join_sl_mor]]. This applies because H is in particular closed under joins, and the involution of G preserves joins.","status":"ok","from":2,"to":3},{"text":"The bottom of H is the bottom of G, and the involution of G sends it to ⊥ ([[AffineConstructive.interfaces.abstract_algebra.preserves_bottom]]). So the restricted involution preserves ⊥.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.sublattices.sub_star_sg_inv_bounded_meet_sl_mor","base":"sub_star_sg_inv_bounded_meet_sl_mor","kind":"prf","start":124,"body":[125,131],"status":"ok","short":{"text":"If the involution preserves meets and ⊤, so does its restriction to a subset closed under both","status":"ok"},"proof":[{"text":"A bounded meet-semilattice morphism is a monoid morphism for meet and ⊤. The structural parts hold because H with the restricted meet and ⊤ is a monoid ([[AffineConstructive.theory.subgroups.sub_monoid_monoid]]). Two things remain: the involution preserves meets, and it preserves ⊤.","status":"ok","from":0,"to":1},{"text":"The restricted involution preserves meets by [[AffineConstructive.orders.sublattices.sub_star_sg_inv_meet_sl_mor]]. This applies because H is in particular closed under meets, and the involution of G preserves meets.","status":"ok","from":2,"to":3},{"text":"The top of H is the top of G, and the involution of G sends it to ⊤ ([[AffineConstructive.interfaces.abstract_algebra.preserves_top]]). So the restricted involution preserves ⊤.","status":"ok","from":4,"to":6}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.theory.sublattices":{"page":"../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.lattices":{"page":"lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.orders.suborders":{"page":"suborders.html","short":"Subsets of an ordered set inherit its order structures; the inclusion is an order embedding","summary":"A subset U of X, regarded as a set ([[subset_to_set]]), carries the order of X restricted to its members, and this file shows that every order structure on X passes to U: preorder, weak poset, poset, strong poset, total and linear order, and the strong transitivity, decidability, affirmativity and refutativity of the order. Each proof restates the required law at the order of X and applies the corresponding law there, since a comparison of members of U is the same proposition as the comparison of the underlying points. The file ends by showing that the inclusion [[from_subset]] is an order embedding, so it both preserves and reflects the order. All of these are registered for instance resolution, so any subset of an ordered set is ordered without further declaration."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."}},"constants":null}</script>

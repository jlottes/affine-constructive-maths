arison of the underlying points. The file ends by showing that the inclusion [[AffineConstructive.interfaces.subset.from_subset]] is an order embedding, so it both preserves and reflects the order. All of these are registered for instance resolution, so any subset of an ordered set is ordered without further declaration.","short":"Subsets of an ordered set inherit its order structures; the inclusion is an order embedding","items":[{"name":"AffineConstructive.orders.suborders.sub_preorder_preorder","base":"sub_preorder_preorder","kind":"prf","start":4,"body":[5,14],"status":"ok","short":{"text":"A subset of a preorder, with the order of X, is a preorder","status":"ok"},"proof":[{"text":"A preorder is a reflexive and transitive order, so there are two laws to check on U.","status":"ok","from":0,"to":1},{"text":"For reflexivity, fix x in U. The comparison x ≤ x in U is the comparison of the underlying point with itself in X, and holds by reflexivity there.","status":"ok","from":2,"to":4},{"text":"For transitivity, fix x, y, z in U. Restated at the order of X, the goal is that x ≤ y ⊠ y ≤ z implies x ≤ z, which is the transitivity of the order of X.","status":"ok","from":5,"to":9}]},{"name":"AffineConstructive.orders.suborders.sub_weakposet_weakposet","base":"sub_weakposet_weakposet","kind":"prf","start":18,"body":[19,30],"status":"ok","short":{"text":"A subset of a weak poset, with the order of X, is a weak poset","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.suborders.sub_preorder_preorder]], U is already a preorder.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.orders.alt_Build_WeakPoset]], it remains to show that equality is contained in the order and that the order is pseudo-antisymmetric. Reflexivity and transitivity are already known.","status":"ok","from":2,"to":2},{"text":"Fix x and y in U. Restated at X, the goal is that x = y implies x ≤ y, and this holds because equality is contained in the order of X.","status":"ok","from":3,"to":6},{"text":"Fix x and y in U. At X, the goal is that x ≤ y ⊠ y ≤ x implies x = y, which is the pseudo-antisymmetry of the order of X.","status":"ok","from":7,"to":11}]},{"name":"AffineConstructive.orders.suborders.sub_poset_poset","base":"sub_poset_poset","kind":"prf","start":32,"body":[33,38],"status":"ok","short":{"text":"A subset of a poset, with the order of X, is a poset","status":"ok"},"proof":[{"text":"A poset is a weak poset with an antisymmetric order. The first part comes from [[AffineConstructive.orders.suborders.sub_weakposet_weakposet]], so only antisymmetry is left.","status":"ok","from":0,"to":1},{"text":"Fix x and y in U. At the order of X, the goal is that the additive conjunction x ≤ y ∧ y ≤ x implies x = y, which is the antisymmetry of X.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.suborders.sub_strongle_strongle","base":"sub_strongle_strongle","kind":"prf","start":40,"body":[41,45],"status":"ok","short":{"text":"The order a subset inherits from a strongly transitive order is strongly transitive","status":"ok"},"proof":[{"text":"Fix x, y, z in U. Restated at the order of X, the goal is that the additive conjunction x ≤ y ∧ y ≤ z implies x ≤ z, which is the strong transitivity of the order of X.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.orders.suborders.sub_decidablele_decidablele","base":"sub_decidablele_decidablele","kind":"prf","start":47,"body":[48,51],"status":"ok","short":{"text":"The order a subset inherits from a decidable order is decidable","status":"ok"},"proof":[{"text":"Fix x and y in U. The comparison x ≤ y in U is the same proposition as the comparison of the underlying points in X, which is decidable by hypothesis.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.suborders.sub_affirmativele_affirmativele","base":"sub_affirmativele_affirmativele","kind":"prf","start":53,"body":[54,57],"status":"ok","short":{"text":"The order a subset inherits from an affirmative order is affirmative","status":"ok"},"proof":[{"text":"Fix x and y in U. The comparison x ≤ y in U is the same proposition as the comparison of the underlying points in X, which is affirmative by hypothesis.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.suborders.sub_refutativele_refutativele","base":"sub_refutativele_refutativele","kind":"prf","start":59,"body":[60,63],"status":"ok","short":{"text":"The order a subset inherits from a refutative order is refutative","status":"ok"},"proof":[{"text":"Fix x and y in U. The comparison x ≤ y in U is the same proposition as the comparison of the underlying points in X, which is refutative by hypothesis.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.suborders.sub_strongposet_strongposet","base":"sub_strongposet_strongposet","kind":"prf","start":65,"body":[66,68],"status":"ok","short":{"text":"A subset of a strong poset, with the order of X, is a strong poset","status":"ok"},"proof":[{"text":"A strong poset is a poset whose order is strongly transitive. Both parts hold for U, by [[AffineConstructive.orders.suborders.sub_poset_poset]] and [[AffineConstructive.orders.suborders.sub_strongle_strongle]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.suborders.sub_decidableorder_decidableorder","base":"sub_decidableorder_decidableorder","kind":"prf","start":69,"body":[70,72],"status":"ok","short":{"text":"A subset of a poset with decidable order is again one","status":"ok"},"proof":[{"text":"A decidable order is a poset whose order is decidable. Both parts hold for U, by [[AffineConstructive.orders.suborders.sub_poset_poset]] and [[AffineConstructive.orders.suborders.sub_decidablele_decidablele]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.suborders.sub_affirmativeorder_affirmativeorder","base":"sub_affirmativeorder_affirmativeorder","kind":"prf","start":73,"body":[74,76],"status":"ok","short":{"text":"A subset of a poset with affirmative order is again one","status":"ok"},"proof":[{"text":"An affirmative order is a poset whose order is affirmative. Both parts hold for U, by [[AffineConstructive.orders.suborders.sub_poset_poset]] and [[AffineConstructive.orders.suborders.sub_affirmativele_affirmativele]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.suborders.sub_refutativeorder_refutativeorder","base":"sub_refutativeorder_refutativeorder","kind":"prf","start":77,"body":[78,80],"status":"ok","short":{"text":"A subset of a poset with refutative order is again one","status":"ok"},"proof":[{"text":"A refutative order is a poset whose order is refutative. Both parts are already known for U: it is a poset by [[AffineConstructive.orders.suborders.sub_poset_poset]], and its inherited order is refutative by [[AffineConstructive.orders.suborders.sub_refutativele_refutativele]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.suborders.sub_total_order_total_order","base":"sub_total_order_total_order","kind":"prf","start":85,"body":[86,91],"status":"ok","short":{"text":"A subset of a total order, with the order of X, is a total order","status":"ok"},"proof":[{"text":"A total order is a poset whose order is total. U is a poset by [[AffineConstructive.orders.suborders.sub_poset_poset]], so totality of the inherited order is what remains.","status":"ok","from":0,"to":1},{"text":"Fix members x and y of U. The comparisons x ≤ y and y ≤ x in U are by definition the comparisons of the underlying points in X. Totality of the order of X therefore gives the disjunction x ≤ y ∨ y ≤ x, which is the [[AffineConstructive.interfaces.aprop.total]] law.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.suborders.sub_linear_order_linear_order","base":"sub_linear_order_linear_order","kind":"prf","start":93,"body":[94,99],"status":"ok","short":{"text":"A subset of a linear order, with the order of X, is a linear order","status":"ok"},"proof":[{"text":"A linear order is a poset whose order is pseudo-total. U is a poset by [[AffineConstructive.orders.suborders.sub_poset_poset]], so pseudo-totality of the inherited order is what remains.","status":"ok","from":0,"to":1},{"text":"Fix members x and y of U. The comparisons x ≤ y and y ≤ x in U are the comparisons of the underlying points in X. The par x ≤ y ⊞ y ≤ x therefore holds by pseudo-totality of the order of X, the [[AffineConstructive.interfaces.aprop.pseudo_total]] law.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.suborders.from_subset_order_embedding","base":"from_subset_order_embedding","kind":"prf","start":101,"body":[102,104],"status":"ok","short":{"text":"The inclusion of a subset into a weak poset is an order embedding","status":"ok"},"proof":[{"text":"Between weak posets, [[AffineConstructive.orders.maps.alt_Build_OrderEmbedding]] says a map is an order embedding when it both preserves and reflects the order, x ≤ y ⧟ f x ≤ f y. U is a weak poset by [[AffineConstructive.orders.suborders.sub_weakposet_weakposet]]. For the inclusion the two sides of that biconditional are the same proposition, because a comparison in U is defined as the comparison of the underlying points, so the biconditional holds by reflexivity.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.interfaces.subset":{"page":"../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

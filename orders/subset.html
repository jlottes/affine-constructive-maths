logy.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import abstract_algebra theory.groups theory.lattices theory.common_props.\nRequire Import interfaces.orders orders.orders orders.lattices orders.maps orders.suborders.\nRequire Import set_lambda sprop srelations logic.aprop logic.relations.\nRequire Export interfaces.subset.\nRequire Import tactics.misc easy rewrite simplify.\n\nLocal Abbreviation id := (id_fun _).\n\nLocal Ltac unfold_subset :=\n  try change (?U ≤ ?W) with (∏ x, x ∊ U ⊸ x ∊ W);\n  try change (?U = ?W) with (∏ x, x ∊ U ⧟ x ∊ W).\n\nLemma subset_poset {X} : Poset (𝒫 X).\nProof. split; [ split | .. ].\n+ tautological.\n+ tautological.\n+ tautological.\n+ hnf; intros U V; unfold_subset. rew <-all_adj. intros x. now rew (all_lb _ x).\nQed.\n\nGlobal Hint Extern 2 (Poset (subset_set _)) => simple notypeclasses refine subset_poset : typeclass_instances.\nGlobal Hint Extern 2 (WeakPoset (subset_set _)) => simple notypeclasses refine subset_poset : typeclass_instances.\nGlobal Hint Extern 2 (PreOrder (subset _)) => simple notypeclasses refine subset_poset : typeclass_instances.\nGlobal Hint Extern 2 (PreOrder (set_T (subset_set _))) => simple notypeclasses refine subset_poset : typeclass_instances.\n\nLemma element_proper_aimpl {X:set} {x y:X} {U V : 𝒫 X} : x = y → U ⊆ V → (x ∊ U ⊸ y ∊ V).\nProof. intros E H. rew (H x). apply (is_fun element (x,V) (y,V)). now split. Qed.\nGlobal Hint Extern 2 (apos (aimpl (_ ∊ _, _))) => sapply_2 element_proper_aimpl : proper.\n\nLemma element_proper_le_aimpl {X:set} {Xle:Le X} {x y:X} {U V : 𝒫 X} {H:UpSet V} :\n  x ≤ y → U ⊆ V → (x ∊ U ⊸ y ∊ V).\nProof. intros E HUV. rew (HUV x). exact (aimpl_impl_pos (up_closed V x y) E). Qed.\n\nLemma element_proper_le_flip_aimpl {X:set} {Xle:Le X} {x y:X} {U V : 𝒫 X} {H:DownSet V} :\n  y ≤ x → U ⊆ V → (x ∊ U ⊸ y ∊ V).\nProof. intros E HUV. rew (HUV x). exact (aimpl_impl_pos (down_closed V y x) E). Qed.\n\n(** Order rewriting in the point position of [∊]: fires only when a tag\n    carrying an order relation is syntactically present in the point terms,\n    so equality rewrites never spawn the [UpSet]/[DownSet] search. *)\nLtac element_le_proper x y V :=\n  lazymatch constr:((x, y)) with\n  | context [ @arewrite_tag_l _ (@le _ _) _ _ _ ] => idtac\n  | context [ @arewrite_tag_r _ (@le _ _) _ _ _ ] => idtac\n  end;\n  (  (let H := get_instance (UpSet V) in sapply_2 (element_proper_le_aimpl (H:=H)))\n   + (let H := get_instance (DownSet V) in sapply_2 (element_proper_le_flip_aimpl (H:=H))) ).\n\nGlobal Hint Extern 1 (apos (aimpl (?x ∊ _, ?y ∊ ?V))) => element_le_proper x y V : proper.\n\n(*\nSection test_element_le_rewrite.\n  Context `{WeakPoset X} (U D W : 𝒫 X) {HU:UpSet U} {HD:DownSet D} (x y : X) (E : x ≤ y).\n\n  Example test_hyp_upset (m : x ∊ U) : y ∊ U.\n  Proof. rew E in m. exact m. Qed.\n\n  Example test_goal_downset (m : y ∊ D) : x ∊ D.\n  Proof. rew E. exact m. Qed.\n\n  Example test_goal_rev_upset (m : x ∊ U) : y ∊ U.\n  Proof. rew <-E. exact m. Qed.\n\n  Example test_hyp_rev_downset (m : y ∊ D) : x ∊ D.\n  Proof. rew <-E in m. exact m. Qed.\n\n  Example test_eq_regression (Ee : x = y) (m : x ∊ W) : y ∊ W.\n  Proof. rew <-Ee. exact m. Qed.\n\n  Example test_subset_position (A B : 𝒫 X) (HAB : A ⊆ B) (m : x ∊ A) : x ∊ B.\n  Proof. rew <-HAB. exact m. Qed.\nEnd test_element_le_rewrite.\n*)\n\n\nLemma subset_bounded_lattice_order {X} : BoundedLatticeOrder (𝒫 X).\nProof. split.\n+ split; [ split|..]; [ exact _ | tautological.. ].\n+ simple notypeclasses refine (Build_BoundedJoinSemiLatticeOrder _);\n  [ apply Build_JoinSemiLatticeOrder |]; tautological.\nQed.\n\nGlobal Hint Extern 2 (BoundedLatticeOrder (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (LatticeOrder (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (BoundedMeetSemiLatticeOrder (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (MeetSemiLatticeOrder (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLatticeOrder (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLatticeOrder (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (BoundedLattice (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (BoundedMeetSemiLattice (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLattice (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (Lattice (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (MeetSemiLattice (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLattice (subset_set _)) => simple notypeclasses refine subset_bounded_lattice_order : typeclass_instances.\n\nLemma subset_distr_lattice {X} : DistributiveLattice (𝒫 X).\nProof. apply Build_DistributiveLatticeOrder. tautological. Qed.\nGlobal Hint Extern 2 (DistributiveLattice (subset_set _)) => simple notypeclasses refine subset_distr_lattice : typeclass_instances.\n\nLemma nonempty_alt {X} {U : 𝒫 X} : U ≠ ∅ ⧟ ∐ x, x ∊ U.\nProof. full_tautological. Qed.\n\nLemma complement_involutive {X:set} : Involutive (@complement X).\nProof. full_tautological. Qed.\nGlobal Hint Extern 2 (Involutive complement) => simple notypeclasses refine complement_involutive : typeclass_instances.\nGlobal Hint Extern 2 (Bijective complement) => simple notypeclasses refine complement_involutive : typeclass_instances.\nGlobal Hint Extern 2 (Injective complement) => simple notypeclasses refine complement_involutive : typeclass_instances.\nGlobal Hint Extern 2 (Surjective complement) => simple notypeclasses refine complement_involutive : typeclass_instances.\n\nLemma complement_latmor_flip {X:set} : BoundedLattice_Flip_Morphism (@complement X).\nProof. apply Build_BoundedLattice_Flip_Morphism; full_tautological. Qed.\nGlobal Hint Extern 2 (BoundedLattice_Flip_Morphism complement) => simple notypeclasses refine complement_latmor_flip : typeclass_instances.\nGlobal Hint Extern 2 (Lattice_Flip_Morphism complement) => simple notypeclasses refine complement_latmor_flip : typeclass_instances.\nGlobal Hint Extern 2 (BoundedMeetSemiLattice_Flip_Morphism complement) => simple notypeclasses refine complement_latmor_flip : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLattice_Flip_Morphism complement) => simple notypeclasses refine complement_latmor_flip : typeclass_instances.\nGlobal Hint Extern 2 (MeetSemiLattice_Flip_Morphism complement) => simple notypeclasses refine complement_latmor_flip : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLattice_Flip_Morphism complement) => simple notypeclasses refine complement_latmor_flip : typeclass_instances.\n\nLemma complement_order_embedding_flip {X:set} : OrderEmbeddingFlip (@complement X).\nProof. exact (join_sl_mor_embedding_flip _). Qed.\nGlobal Hint Extern 2 (OrderEmbeddingFlip complement) => simple notypeclasses refine complement_order_embedding_flip : typeclass_instances.\nGlobal Hint Extern 2 (OrderPreservingFlip complement) => simple notypeclasses refine complement_order_embedding_flip : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflectingFlip complement) => simple notypeclasses refine complement_order_embedding_flip : typeclass_instances.\n\nLemma powerset_pt_fun_order_embedding `{F: 𝒫² X} : OrderEmbedding (powerset_pt_fun F).\nProof. exact from_subset_order_embedding. Qed.\nGlobal Hint Extern 2 (OrderEmbedding  (powerset_pt_fun _)) => simple notypeclasses refine powerset_pt_fun_order_embedding : typeclass_instances.\nGlobal Hint Extern 2 (OrderPreserving (powerset_pt_fun _)) => simple notypeclasses refine powerset_pt_fun_order_embedding : typeclass_instances.\nGlobal Hint Extern 2 (OrderReflecting (powerset_pt_fun _)) => simple notypeclasses refine powerset_pt_fun_order_embedding : typeclass_instances.\n\n(** Multiplicative intersection *)\n\nLocal Open Scope subset_scope.\n\nLemma mult_intersection_commutative {X:set} : Commutative (@mult_intersection X).\nProof. tautological. Qed.\n#[global] Hint Extern 2 (Commutative mult_intersection) => simple notypeclasses refine mult_intersection_commutative : typeclass_instances.\n\n(*\nLemma mult_intersection_associative {X:set} : Associative (@mult_intersection X).\nProof. tautological. Qed.\n#[global] Hint Extern 2 (Associative mult_intersection) => simple notypeclasses refine mult_intersection_associative : typeclass_instances.\n*)\n\n(*\nLemma mult_intersection_commutative {X:set} : Commutative (@mult_intersection X).\nProof. tautological. Qed.\n#[global] Hint Extern 2 (Commutative mult_intersection) => simple notypeclasses refine mult_intersection_commutative : typeclass_instances.\n\nLemma mult_intersection_apos {X:set} {U V : 𝒫 X} {x} : x ∊ U ⨶ V ↔ x ∊ U ∧ x ∊ V.\nProof. split.\n+ intros [y[E[??]]]. change (apos (x=y)) in E. now rew E.\n+ intros [??]. exists x. now change (x = x ⊠ x ∊ U ⊠ x ∊ V).\nQed.\n\nLemma mult_intersection_aneg {X:set} {U V : 𝒫 X} {x} : x ∊̸ U ⨶ V ↔ (x ∊̸ U ⊞ x ∊̸ V) ∧ (∀ y, y ∊ U ⨶ V → x ≠ y).\nProof. split.\n+ intros P. split.\n  - specialize (P x); change (apos (x = x ⊠ x ∊ U ⊠ x ∊ V)ᗮ) in P. revert P; now simplify.\n  - intros y. rew mult_intersection_apos. intros [??]. now apply (P y).\n+ intros [H1 P]. intros y. change ( anot (x = y ⊠ y ∊ U ⊠ y ∊ V) ). split.\n  - intros E. change (anot (y ∊ U ⊠ y ∊ V)). now rew <-E.\n  - intros [??]. apply (P y). now apply (@mult_intersection_apos _ U V y).\nQed.\n\n\nLemma mult_intersection_inhabited_alt {X:set} (U V : 𝒫 X) :\n  (∐ x, x ∊ U ⨶ V) ⧟ (∐ x, x ∊ U ⊠ x ∊ V).\nProof. change  (∐ x, x ∊ U ⨶ V) with (∐ x, ∐ y, x = y ⊠ y ∊ U ⊠ y ∊ V); split.\n+ rew <-aex_adj; intros x. rew <-aex_adj; intros y.\n  rew <-(aex_ub _ y). tautological.\n+ rew <-aex_adj; intros x.\n  rew <-(aex_ub _ x), <-(aex_ub _ x). \n  now simplify.\nQed.\n\nLemma mult_disjoint_subset_complement_l {X:set} (U V : 𝒫 X) :\n  U ⨶ V = ∅ ⧟ U ⊆ V ᗮ.\nProof. apply by_contrapositive_iff.\n  now rew (nonempty_alt (U:= U ⨶ V)), (mult_intersection_inhabited_alt _ _).\nQed.\n\nLemma mult_disjoint_subset_complement_r {X:set} (U V : 𝒫 X) :\n  U ⨶ V = ∅ ⧟ V ⊆ U ᗮ.\nProof. rew (commutativity _ _ _). exact (mult_disjoint_subset_complement_l _ _). Qed.\n*)\n\nLemma mult_empty_subset_complement_l {X:set} (U V : 𝒫 X) :\n  anot (∐ x, x ∊ U ⊠ x ∊ V) ⧟ U ⊆ V ᗮ.\nProof. refl. Qed.\n\nLemma mult_empty_subset_complement_r {X:set} (U V : 𝒫 X) :\n  anot (∐ x, x ∊ U ⊠ x ∊ V) ⧟ V ⊆ U ᗮ.\nProof. rew <-(mult_empty_subset_complement_l _ _).\n  apply anot_proper_aiff, aex_proper_aiff. intros x. exact (aprod_com _ _).\nQed.\n\nLemma mult_disjoint_subset_complement_l {X:set} (U V : 𝒫 X) :\n  (∏ x, x ∊̸ U ⊞ x ∊̸ V) ⧟ U ⊆ V ᗮ.\nProof. refl. Qed.\n\n(*\nLemma mult_disjoint_subset_complement_r {X:set} (U V : 𝒫 X) :\n  (∏ x, x ∊̸ U ⊞ x ∊̸ V) ⧟ V ⊆ U ᗮ.\nProof. exact (mult_empty_subset_complement_r _ _). Qed.\n*)\n\n(** Singleton *)\n\nLemma tensor_singleton@{u} {X Y:set@{u}} (x:X) (y:Y) : @singleton (X ⊗ Y) (x, y) = singleton x ⊗ singleton y.\nProof. refl. Qed.\n\nLemma singleton_subset {X:set} (x:X) (U:𝒫 X) : singleton x ⊆ U ⧟ x ∊ U.\nProof. change ((∏ y, x = y ⊸ y ∊ U) ⧟ x ∊ U). split.\n+ rew (all_lb _ x). now simplify.\n+ rew <-all_adj; intros y. rew <-(aprod_adj _ _ _), (aprod_com _ _). apply equal_element.\nQed.\n\n(** of_course_subset *)\n\nDefinition of_course_subset {X:set} `(U:𝒫 X) := range (from_subset U).\n\nImport of_course_set_notation.\nLemma of_course_subset_is_fun {X:set} : @IsFun !(𝒫 X) (𝒫 X) of_course_subset.\nProof. intros U V. apply affirmative_aimpl. intros E. change (𝒫 X) in U,V.\n  change (apos (U = V)) in E. intros x.\n  change ( (∐ a : U, subset_pt a = x) ⧟ ∐ a : V, subset_pt a = x).\n  split; rew <-aex_adj; intros [a Ha]; unfold subset_pt, pt.\n* assert (a ∊ V) by now rew <-E. exact (aex_ub _ (to_subset a)).\n* assert (a ∊ U) by now rew   E. exact (aex_ub _ (to_subset a)).\nQed.\n\nCanonical Structure of_course_subset_fun (X:set) : _ ⇾ _ := @func_make _ _ _ (@of_course_subset_is_fun X).\n\nLemma of_course_subset_subset `(U:𝒫 X) : of_course_subset U ⊆ U.\nProof.\n  intros x. change ((∐ u:U, from_subset U u = x) ⊸ x ∊ U).\n  rew <-aex_adj; intros u. rew <-(equal_element U (from_subset U u) x). now simplify.\nQed.\n\nLemma of_course_subset_order_preserving {X:set} : OrderPreserving (@of_course_subset_fun X).\nProof. apply alt_Build_OrderPreserving.\n  intros U V. apply affirmative_aimpl. intros E. change (𝒫 X) in U,V. intros x.\n  change ( (∐ a : U, subset_pt a = x) ⊸ ∐ a : V, subset_pt a = x).\n  rew <-aex_adj; intros [a Ha]; unfold subset_pt, pt.\n  assert (a ∊ V) by now rew <-(E:U ⊆ V). exact (aex_ub _ (to_subset a)).\nQed.\n#[global] Hint Extern 2 (OrderPreserving (of_course_subset_fun _)) => simple notypeclasses refine of_course_subset_order_preserving : typeclass_instances.\n\nLemma of_course_singleton {X:set} (x:X) : of_course_subset (singleton x) = singleton x.\nProof. intros y. change ((∐ u:subset_to_set (singleton x), from_subset (singleton x) u = y) ⧟ x = y). split.\n+ rew <-aex_adj; intros [a Ha]. change (apos (x = a)) in Ha. change (a = y ⊸ x = y). now rew <-Ha.\n+ now rew <-(aex_ub _ (to_subset x)).\nQed.\n\n(** subset_to_set *)\nLemma aex_subset_aiff {X:set} {S:𝒫 X} {P:X → Ω} : (∐ x:S, P x) ⧟ (∐ x:X, of_course (x ∊ S) ⊠ P x).\nProof. split.\n+ rew <-aex_adj; intros s. rew <-(aex_ub _ (subset_pt s)).\n  now rew (aprod_true_l (subset_pt_is_el s : of_course (subset_pt s ∊ S))).\n+ rew <-aex_adj; intros x. rew (aprod_adj _ _ _). apply affirmative_aimpl. intros Hx. exact (aex_ub _ (to_subset x)).\nQed.\n\nLemma all_subset_aiff {X:set} {S:𝒫 X} {P:X → Ω} : (∏ x:S, P x) ⧟ (∏ x:X, of_course (x ∊ S) ⊸ P x).\nProof. apply by_contrapositive_iff. exact aex_subset_aiff. Qed.\n\nLemma aex_subset {X:set} {S:𝒫 X} {P:X → Ω} : (∐ x:S, P x) ↔ (∐ x:X, x ∊ S ⊠ P x).\nProof. now rew aex_subset_aiff at 1. Qed.\n\n(** Congruence for quantifiers over a subset-as-type binder. In [rew]-generated\n    properness goals both bodies are one context instantiated at [S] resp. [T],\n    and the pointwise premise closes by conversion: [to_subset] witnesses are\n    strict, and [subset_pt (to_subset x)] reduces to [x]. *)\nLemma aex_subset_proper_aimpl {X:set} {S T:𝒫 X} {P:S → Ω} {Q:T → Ω}\n  : S ⊆ T → (∀ (x:X) (hs : x ∊ S) (ht : x ∊ T), P (@to_subset X S x hs) ⊸ Q (@to_subset X T x ht))\n  → ((∐ a:S, P a) ⊸ (∐ b:T, Q b)).\nProof. intros E HPQ.\n  rew <-aex_adj. intros a.\n  assert (subset_pt a ∊ T) as ht by (rew <-E; exact (subset_pt_is_el a)).\n  rew <-(aex_ub _ (@to_subset X T (subset_pt a) ht)).\n  exact (HPQ (subset_pt a) (subset_pt_is_el a) ht).\nQed.\n\nLemma all_subset_proper_aimpl {X:set} {S T:𝒫 X} {P:S → Ω} {Q:T → Ω}\n  : T ⊆ S → (∀ (x:X) (hs : x ∊ S) (ht : x ∊ T), P (@to_subset X S x hs) ⊸ Q (@to_subset X T x ht))\n  → ((∏ a:S, P a) ⊸ (∏ b:T, Q b)).\nProof. intros E HPQ.\n  rew <-all_adj. intros b.\n  assert (subset_pt b ∊ S) as hs by (rew <-E; exact (subset_pt_is_el b)).\n  rew (all_lb _ (@to_subset X S (subset_pt b) hs)).\n  exact (HPQ (subset_pt b) hs (subset_pt_is_el b)).\nQed.\n\nLemma aex_subset_proper_aiff {X:set} {S T:𝒫 X} {P:S → Ω} {Q:T → Ω}\n  : S = T → (∀ (x:X) (hs : x ∊ S) (ht : x ∊ T), P (@to_subset X S x hs) ⧟ Q (@to_subset X T x ht))\n  → ((∐ a:S, P a) ⧟ (∐ b:T, Q b)).\nProof. intros E HPQ. split.\n+ apply (aex_subset_proper_aimpl (aimpl_impl_pos (eq_le _ _) E)).\n  intros x hs ht. exact (andl (HPQ x hs ht)).\n+ apply (aex_subset_proper_aimpl (aimpl_impl_pos (eq_le_flip _ _) E)).\n  intros x ht hs. exact (andr (HPQ x hs ht)).\nQed.\n\nLemma all_subset_proper_aiff {X:set} {S T:𝒫 X} {P:S → Ω} {Q:T → Ω}\n  : S = T → (∀ (x:X) (hs : x ∊ S) (ht : x ∊ T), P (@to_subset X S x hs) ⧟ Q (@to_subset X T x ht))\n  → ((∏ a:S, P a) ⧟ (∏ b:T, Q b)).\nProof. intros E HPQ. split.\n+ apply (all_subset_proper_aimpl (aimpl_impl_pos (eq_le_flip _ _) E)).\n  intros x hs ht. exact (andl (HPQ x hs ht)).\n+ apply (all_subset_proper_aimpl (aimpl_impl_pos (eq_le _ _) E)).\n  intros x ht hs. exact (andr (HPQ x hs ht)).\nQed.\n\nGlobal Hint Extern 3 (apos (aex _ ⊸ aex _)) =>\n  simple notypeclasses refine (aex_subset_proper_aimpl _ _); [ | intros ? ? ?; refl ] : proper.\nGlobal Hint Extern 3 (apos (all _ ⊸ all _)) =>\n  simple notypeclasses refine (all_subset_proper_aimpl _ _); [ | intros ? ? ?; refl ] : proper.\nGlobal Hint Extern 3 (apos (aex _ ⧟ aex _)) =>\n  simple notypeclasses refine (aex_subset_proper_aiff _ _); [ | intros ? ? ?; refl ] : proper.\nGlobal Hint Extern 3 (apos (all _ ⧟ all _)) =>\n  simple notypeclasses refine (all_subset_proper_aiff _ _); [ | intros ? ? ?; refl ] : proper.\n\n(** SProp-level twin, for record fields quantifying over a subset carrier\n    ([∀ U:Φ, …] : SProp). The pointwise premise is left to the proper search,\n    so tagged structure inside the body (e.g. an inner [∐ V:Φ]) recurses into\n    the hints above. *)\nLemma sall_subset_proper_impl {X:set} {S T:𝒫 X} {P:S → SProp} {Q:T → SProp}\n  : T ⊆ S → (∀ (x:X) (hs : x ∊ S) (ht : x ∊ T), sprop.impl (P (@to_subset X S x hs), Q (@to_subset X T x ht)))\n  → sprop.impl (∀ a:S, P a, ∀ b:T, Q b).\nProof. intros E HPQ H b.\n  assert (subset_pt b ∊ S) as hs by (rew <-E; exact (subset_pt_is_el b)).\n  exact (HPQ (subset_pt b) hs (subset_pt_is_el b) (H (@to_subset X S (subset_pt b) hs))).\nQed.\n\nLemma sall_subset_proper_iff {X:set} {S T:𝒫 X} {P:S → SProp} {Q:T → SProp}\n  : S = T → (∀ (x:X) (hs : x ∊ S) (ht : x ∊ T), sprop.iff (P (@to_subset X S x hs), Q (@to_subset X T x ht)))\n  → sprop.iff (∀ a:S, P a, ∀ b:T, Q b).\nProof. intros E HPQ. split.\n+ apply (sall_subset_proper_impl (aimpl_impl_pos (eq_le_flip _ _) E)).\n  intros x hs ht. exact (andl (HPQ x hs ht)).\n+ apply (sall_subset_proper_impl (aimpl_impl_pos (eq_le _ _) E)).\n  intros x ht hs. exact (andr (HPQ x hs ht)).\nQed.\n\nGlobal Hint Extern 3 (sprop.impl ((∀ x, _), (∀ y, _))) =>\n  simple notypeclasses refine (sall_subset_proper_impl _ _); [ | intros ? ? ?; cbv beta ] : proper.\nGlobal Hint Extern 3 (sprop.iff ((∀ x, _), (∀ y, _))) =>\n  simple notypeclasses refine (sall_subset_proper_iff _ _); [ | intros ? ? ?; cbv beta ] : proper.\n"," e":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":15165,"e":15168,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":17319,"e":17322,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[AffineConstructive.orders.subset.of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers.","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","items":[{"name":"AffineConstructive.orders.subset.id","base":"id","kind":"abbrev","start":5,"body":null,"status":"ok","short":{"text":"Local shorthand for the identity function on the set at hand","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.set.id_fun]], the identity function on a set, with the set left to be inferred. It is not exported and does not appear outside this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.subset.unfold_subset","base":"unfold_subset","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"Restates inclusion and equality of subsets in the goal as pointwise statements about membership","status":"ok"},"long":{"text":"The tactic unfolds the order and the equality of the powerset to their pointwise definitions. An inclusion U ≤ W in the goal becomes ∏ x, x ∊ U ⊸ x ∊ W, and an equality U = W becomes ∏ x, x ∊ U ⧟ x ∊ W. Both restatements hold by definition, so the tactic only converts the goal and never fails: each of the two forms is tried, and a goal of neither shape is left as it is.\n\nA proof uses it when it has to reason element by element. Once the goal is a universal statement over points, the quantifier rule fixes a point x and the hypotheses can be specialised to it. In [[AffineConstructive.orders.subset.subset_poset]] it is used for antisymmetry: the two inclusions U ⊆ V and V ⊆ U, specialised at the same x, give the two directions of x ∊ U ⧟ x ∊ V. It is local to this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.subset.subset_poset","base":"subset_poset","kind":"prf","start":7,"body":[8,21],"status":"ok","short":{"text":"The subsets of X, ordered by inclusion, form a poset","status":"ok"},"proof":[{"text":"The poset structure splits into four obligations: inclusion is a preorder, equal subsets include each other, pseudo-antisymmetry, and antisymmetry. Reflexivity and transitivity of inclusion are pointwise tautologies, which the decision procedure proves.","status":"ok","from":0,"to":3},{"text":"Equality of subsets gives inclusion, and pseudo-antisymmetry holds, both by the same decision procedure, using that equality of subsets is pointwise equality of membership.","status":"ok","from":4,"to":7},{"text":"For antisymmetry, take subsets U and V and unfold the inclusions. The goal is that U ⊆ V and V ⊆ U, taken together additively, imply that membership in U and in V is equivalent at every point.","status":"ok","from":8,"to":9},{"text":"Fix x and specialise both inclusions at x. This leaves x ∊ U ⊸ x ∊ V and x ∊ V ⊸ x ∊ U, joined by the additive conjunction, and that is exactly x ∊ U ⧟ x ∊ V. The additive conjunction suits the goal: each half of the equivalence takes the one inclusion it needs.","status":"ok","from":10,"to":13}]},{"name":"AffineConstructive.orders.subset.element_proper_aimpl","base":"element_proper_aimpl","kind":"prf","start":26,"body":[27,32],"status":"ok","short":{"text":"If x = y and U ⊆ V, then x ∊ U implies y ∊ V","status":"ok"},"proof":[{"text":"Assume x = y and U ⊆ V. The inclusion, specialised at x, turns x ∊ U into x ∊ V, so it remains to show that x ∊ V implies y ∊ V.","status":"ok","from":0,"to":2},{"text":"Membership is a function of the pair (point, subset). By [[AffineConstructive.interfaces.set.is_fun]] it therefore suffices that (x, V) = (y, V). This holds componentwise, by x = y and reflexivity.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.orders.subset.element_proper_le_aimpl","base":"element_proper_le_aimpl","kind":"prf","start":34,"body":[35,39],"status":"ok","short":{"text":"For an up-set V, x ≤ y and U ⊆ V give that x ∊ U implies y ∊ V","status":"ok"},"proof":[{"text":"Assume x ≤ y and U ⊆ V. The inclusion, specialised at x, turns x ∊ U into x ∊ V, so it remains to show that x ∊ V implies y ∊ V.","status":"ok","from":0,"to":2},{"text":"This is [[AffineConstructive.interfaces.orders.up_closed]] for the up-set V, applied to x ≤ y.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.subset.element_proper_le_flip_aimpl","base":"element_proper_le_flip_aimpl","kind":"prf","start":40,"body":[41,45],"status":"ok","short":{"text":"For a down-set V, y ≤ x and U ⊆ V give that x ∊ U implies y ∊ V","status":"ok"},"proof":[{"text":"Assume y ≤ x and U ⊆ V. The inclusion, specialised at x, turns x ∊ U into x ∊ V, so it remains to show that x ∊ V implies y ∊ V.","status":"ok","from":0,"to":2},{"text":"This is [[AffineConstructive.interfaces.orders.down_closed]] for the down-set V, applied to y ≤ x.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.subset.element_le_proper","base":"element_le_proper","kind":"ltac","start":46,"body":null,"status":"ok","short":{"text":"Lets rew move the point of a membership along ≤, upward in an up-set, downward in a down-set","status":"ok"},"long":{"text":"The rewriting system meets a goal of the form x ∊ U ⊸ y ∊ V when it rewrites inside a membership, and it asks for a reason why the first membership implies the second. For rewriting by an equality x = y the reason is [[AffineConstructive.orders.subset.element_proper_aimpl]]. This tactic gives the reason when the rewrite is by an order x ≤ y, which holds only when the subset is closed in the matching direction. It applies [[AffineConstructive.orders.subset.element_proper_le_aimpl]] when V is an up-set ([[AffineConstructive.interfaces.orders.UpSet]]), so that x ∊ U implies y ∊ V for x ≤ y and U ⊆ V. When V is a down-set ([[AffineConstructive.interfaces.orders.DownSet]]) it applies [[AffineConstructive.orders.subset.element_proper_le_flip_aimpl]] instead, where the order runs the other way, y ≤ x. It tries the up-set case first and falls back to the down-set case, taking whichever instance resolution finds for V.\n\nBefore any of this it checks that the point terms x and y carry the marker the rewriting system attaches to the two sides of an order relation. If there is no such marker it fails at once. This means a rewrite by an equality never starts a search for an up-set or down-set instance, and such rewrites keep going through the equality lemma. The tactic is registered as a properness hint and is not called directly. A proof uses it whenever `rew` with an inequality x ≤ y changes the point of a membership in an up-set or a down-set, in a hypothesis or in the goal, in either direction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.subset.subset_bounded_lattice_order","base":"subset_bounded_lattice_order","kind":"prf","start":48,"body":[49,55],"status":"ok","short":{"text":"Under inclusion 𝒫 X is a bounded lattice: meet, join, the full subset as top, ∅ as bottom","status":"ok"},"proof":[{"text":"A bounded lattice order is a bounded meet semilattice order together with a bounded join semilattice order; the two halves are proved separately.","status":"ok","from":0,"to":1},{"text":"For the meet half, the order is the poset of [[AffineConstructive.orders.subset.subset_poset]]. The laws of intersection as a greatest lower bound, and of the full subset as top, are pointwise tautologies, proved by the decision procedure.","status":"ok","from":2,"to":3},{"text":"The join half is assembled with [[AffineConstructive.orders.lattices.Build_BoundedJoinSemiLatticeOrder]] and [[AffineConstructive.orders.lattices.Build_JoinSemiLatticeOrder]]. It requires that union is an upper bound of both arguments and lies below every common upper bound, and that ∅ lies below every subset. Each of these is a pointwise tautology.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.subset.subset_distr_lattice","base":"subset_distr_lattice","kind":"prf","start":68,"body":[69,72],"status":"ok","short":{"text":"The lattice of subsets 𝒫 X is distributive","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.lattices.Build_DistributiveLatticeOrder]], it suffices to prove one inclusion for all subsets x, y, z: that (x ⊔ y) ⊓ (x ⊔ z) is contained in x ⊔ (y ⊓ z).","status":"ok","from":0,"to":1},{"text":"Pointwise this is the distributive law of the connectives on membership, which the decision procedure proves.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.subset.nonempty_alt","base":"nonempty_alt","kind":"prf","start":74,"body":[75,77],"status":"ok","short":{"text":"U ≠ ∅ if and only if there is a member of U","status":"ok"},"proof":[{"text":"With apartness from ∅ unfolded into pointwise terms, both directions of the equivalence are tautologies, and the decision procedure proves them.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.complement_involutive","base":"complement_involutive","kind":"prf","start":78,"body":[79,81],"status":"ok","short":{"text":"The complement is an involution on 𝒫 X: Uᗮᗮ = U","status":"ok"},"proof":[{"text":"Pointwise, the double complement is the double negation of membership, which the logic identifies with membership itself. The decision procedure proves this.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.complement_latmor_flip","base":"complement_latmor_flip","kind":"prf","start":86,"body":[87,89],"status":"ok","short":{"text":"The complement exchanges meet with join and the full subset with ∅","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.lattices.Build_BoundedLattice_Flip_Morphism]], four equations remain: the complement of a meet is the join of the complements, the complement of a join is the meet of the complements, the complement of the full subset is ∅, and the complement of ∅ is the full subset. Each is a pointwise De Morgan law, which the decision procedure proves.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.complement_order_embedding_flip","base":"complement_order_embedding_flip","kind":"prf","start":96,"body":[97,99],"status":"ok","short":{"text":"The complement reverses inclusion both ways: U ⊆ V if and only if Vᗮ ⊆ Uᗮ","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.lattices.join_sl_mor_embedding_flip]], an injective map that turns joins into meets is an order-reversing embedding. The complement turns joins into meets by [[AffineConstructive.orders.subset.complement_latmor_flip]], and it is injective because it is an involution, [[AffineConstructive.orders.subset.complement_involutive]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.powerset_pt_fun_order_embedding","base":"powerset_pt_fun_order_embedding","kind":"prf","start":103,"body":[104,106],"status":"ok","short":{"text":"The inclusion of a set of subsets F into 𝒫 X is an order embedding","status":"ok"},"proof":[{"text":"F is a subset of 𝒫 X, and its inclusion into 𝒫 X is the inclusion of a subset into a poset. The general fact [[AffineConstructive.orders.suborders.from_subset_order_embedding]] applies, with 𝒫 X ordered by inclusion as in [[AffineConstructive.orders.subset.subset_poset]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.mult_intersection_commutative","base":"mult_intersection_commutative","kind":"prf","start":111,"body":[112,114],"status":"ok","short":{"text":"The multiplicative intersection of subsets is commutative","status":"ok"},"proof":[{"text":"Unfolded, membership in the multiplicative intersection is a tensor of an equality and the two memberships. Exchanging the order of the two memberships is a tautology of affine logic, and the decision procedure for such tautologies proves it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.mult_empty_subset_complement_l","base":"mult_empty_subset_complement_l","kind":"prf","start":116,"body":[117,119],"status":"ok","short":{"text":"There being no x with x ∊ U ⊠ x ∊ V is equivalent to U ⊆ Vᗮ","status":"ok"},"proof":[{"text":"The two sides are the same proposition by definition. U ⊆ Vᗮ says that for all x, x ∊ U implies the negation of x ∊ V. The negation of an existential is a universal of negations, and the negation of x ∊ U ⊠ x ∊ V is exactly that implication.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.mult_empty_subset_complement_r","base":"mult_empty_subset_complement_r","kind":"prf","start":120,"body":[121,126],"status":"ok","short":{"text":"There being no x with x ∊ U ⊠ x ∊ V is equivalent to V ⊆ Uᗮ","status":"ok"},"proof":[{"text":"Apply the left-hand version [[AffineConstructive.orders.subset.mult_empty_subset_complement_l]] with U and V exchanged, reading V ⊆ Uᗮ as there being no x with x ∊ V ⊠ x ∊ U. What remains is to compare the two negated existentials.","status":"ok","from":0,"to":1},{"text":"Negation and the existential both respect equivalence, so it is enough to compare their bodies at a fixed x. There, x ∊ U ⊠ x ∊ V and x ∊ V ⊠ x ∊ U are equivalent because the tensor is commutative ([[AffineConstructive.logic.aprop.aprod_com]]).","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.orders.subset.mult_disjoint_subset_complement_l","base":"mult_disjoint_subset_complement_l","kind":"prf","start":127,"body":[128,130],"status":"ok","short":{"text":"Every x lying outside U par outside V is equivalent to U ⊆ Vᗮ","status":"ok"},"proof":[{"text":"This holds by definition. An implication P ⊸ Q is the par Pᗮ ⊞ Q, so x ∊ U ⊸ x ∊̸ V is the same proposition as x ∊̸ U ⊞ x ∊̸ V. Quantifying over x gives U ⊆ Vᗮ.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.tensor_singleton","base":"tensor_singleton","kind":"prf","start":131,"body":[132,134],"status":"ok","short":{"text":"The singleton of (x, y) in X ⊗ Y is the tensor pairing {x} ⊗ {y}","status":"ok"},"proof":[{"text":"The two subsets are equal by definition. A pair (x', y') belongs to the singleton of (x, y) when (x, y) = (x', y') in X ⊗ Y, which is x = x' ⊠ y = y'. That is also the condition for membership in the tensor pairing of {x} and {y}.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.singleton_subset","base":"singleton_subset","kind":"prf","start":135,"body":[136,146],"status":"ok","short":{"text":"{x} ⊆ U if and only if x ∊ U","status":"ok"},"proof":[{"text":"By definition, {x} ⊆ U says that for every y, x = y implies y ∊ U. Prove the equivalence one direction at a time.","status":"ok","from":0,"to":2},{"text":"Forwards: specialise the universal hypothesis at x itself. Since x = x holds, the hypothesis reduces to x ∊ U.","status":"ok","from":3,"to":5},{"text":"Backwards: fix y and rearrange the goal: x = y and x ∊ U should together give y ∊ U. This is [[AffineConstructive.interfaces.subset.equal_element]], which says membership respects equality.","status":"ok","from":6,"to":10}]},{"name":"AffineConstructive.orders.subset.of_course_subset","base":"of_course_subset","kind":"def","start":147,"body":null,"status":"ok","short":{"text":"The points of X equal to some member of U, as the range of U's inclusion","status":"ok"},"long":{"text":"For a subset U of X, of_course_subset U is the range of the inclusion [[AffineConstructive.interfaces.subset.from_subset]] of U into X. A point x belongs to it when there is a member u of U, U regarded as a set, with u = x. A member of U as a set comes with a base-logic proof that it lies in U, so this subset keeps the points witnessed by an affirmed membership and drops the rest of U's affine membership. It lies inside U ([[AffineConstructive.orders.subset.of_course_subset_subset]]), and it equals U when U is a singleton ([[AffineConstructive.orders.subset.of_course_singleton]]).\n\nThe quantifier ranges over the members of U, and that range changes with U. So the construction respects only an affirmed equality of subsets, and it is a function out of !(𝒫 X), not out of 𝒫 X ([[AffineConstructive.orders.subset.of_course_subset_fun]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.subset.of_course_subset_is_fun","base":"of_course_subset_is_fun","kind":"prf","start":149,"body":[150,165],"status":"ok","short":{"text":"An affirmed equality U = V gives equal subsets of_course_subset U and of_course_subset V","status":"ok"},"proof":[{"text":"Take U and V in !(𝒫 X) with U = V. The equality of !(𝒫 X) is affirmative ([[AffineConstructive.theory.set.of_course_set_aff_eq]]), so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] the required implication may be proved from a proof of U = V in the base logic. A proof E of that equality may then be reused freely.","status":"ok","from":0,"to":3},{"text":"Regard U and V as subsets of X and E as a proof of their equality. Fix x. The goal is to show that the two of-course subsets agree at x, that is, there is a point a of U equal to x if and only if there is a point a of V equal to x.","status":"ok","from":4,"to":7},{"text":"For each direction, take the point a that the hypothesis provides, together with its membership in the source subset. The goal is then to show that a = x implies the existential over the other subset.","status":"ok","from":8,"to":8},{"text":"Going from U to V, rewriting the membership a ∊ U along U = V gives a ∊ V. Then a, as a point of V, is the witness.","status":"ok","from":9,"to":11},{"text":"Going from V to U, rewriting the membership a ∊ V along U = V in the other direction gives a ∊ U. Then a, as a point of U, is the witness. This direction reuses E, which is possible because E is a base-logic proof.","status":"ok","from":12,"to":15}]},{"name":"AffineConstructive.orders.subset.of_course_subset_fun","base":"of_course_subset_fun","kind":"def","start":166,"body":null,"status":"ok","short":{"text":"of_course_subset as a function of sets from !(𝒫 X) to 𝒫 X","status":"ok"},"long":{"text":"The construction [[AffineConstructive.orders.subset.of_course_subset]] bundled as a function of sets, with domain !(𝒫 X), the subsets compared by affirmed equality. [[AffineConstructive.orders.subset.of_course_subset_is_fun]] shows that it respects this equality, and [[AffineConstructive.orders.subset.of_course_subset_order_preserving]] that it preserves inclusion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.orders.subset.of_course_subset_subset","base":"of_course_subset_subset","kind":"prf","start":167,"body":[168,174],"status":"ok","short":{"text":"of_course_subset U is contained in U","status":"ok"},"proof":[{"text":"Fix x. Membership of x in the of-course subset of U says there is a point u of U whose inclusion into X equals x. Take the u the hypothesis provides.","status":"ok","from":0,"to":3},{"text":"By [[AffineConstructive.interfaces.subset.equal_element]], x ∊ U follows from u = x together with u ∊ U. The second factor holds because u is a point of U, so the tensor reduces to the given equality u = x.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.subset.of_course_subset_order_preserving","base":"of_course_subset_order_preserving","kind":"prf","start":175,"body":[176,187],"status":"ok","short":{"text":"of_course_subset, as a function on !(𝒫 X), preserves inclusion","status":"ok"},"proof":[{"text":"Both !(𝒫 X) and 𝒫 X are weak posets. By [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]], it suffices to show that U ≤ V implies that the of-course subset of U is contained in the of-course subset of V.","status":"ok","from":0,"to":1},{"text":"Take U and V. The order of !(𝒫 X) is affirmative ([[AffineConstructive.orders.orders.of_course_aff_le]]), so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] the inclusion U ⊆ V may be assumed as a proof in the base logic. U and V are then regarded as subsets of X.","status":"ok","from":2,"to":5},{"text":"Fix x, and take the point a of U, with a ∊ U, that membership of x in the first of-course subset provides. It remains to show that a = x implies there is a point of V equal to x.","status":"ok","from":6,"to":8},{"text":"The inclusion U ⊆ V carries a ∊ U to a ∊ V. Then a, as a point of V, is the witness.","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.orders.subset.of_course_singleton","base":"of_course_singleton","kind":"prf","start":189,"body":[190,201],"status":"ok","short":{"text":"of_course_subset of the singleton {x} is {x} itself","status":"ok"},"proof":[{"text":"Two subsets are equal when they have the same members, so fix a point y. Unfolded, y is in the of-course subset of {x} when some member of {x} has underlying point equal to y, and y is in {x} when x = y. The two directions of this equivalence are proved separately.","status":"ok","from":0,"to":3},{"text":"Forward: let a be the member of {x} that the hypothesis provides, so x = a. The goal becomes that a = y implies x = y, which follows by transitivity through the equality x = a.","status":"ok","from":4,"to":8},{"text":"Backward: take x itself, as a member of {x}, as the witness. Its underlying point is x, so the goal reduces to x = y implying itself.","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.orders.subset.aex_subset_aiff","base":"aex_subset_aiff","kind":"prf","start":202,"body":[203,215],"status":"ok","short":{"text":"There is a member of S with P if and only if there is x with x ∊ S affirmed (!) and P x","status":"ok"},"proof":[{"text":"The equivalence is proved as two implications.","status":"ok","from":0,"to":1},{"text":"Forward: let s be the member of S that the hypothesis provides, and take its underlying point in X as the witness. A member of S lies in S, and the membership can be affirmed. So the factor !(s ∊ S) holds and drops out of the tensor by [[AffineConstructive.logic.aprop.aprod_true_l]], which leaves P s ⊸ P s.","status":"ok","from":2,"to":5},{"text":"Backward: let x be the point that the hypothesis provides. After currying, the goal is to show that the affirmed membership !(x ∊ S) implies that P x gives a member of S with P.","status":"ok","from":6,"to":8},{"text":"Since !(x ∊ S) is affirmative, [[AffineConstructive.logic.aprop.affirmative_aimpl]] reduces the affine implication out of it to a base-logic one. So we may assume that x ∊ S has been affirmed, and use it as an ordinary hypothesis.","status":"ok","from":9,"to":10},{"text":"With that membership, x is a member of S, and taking it as the witness turns P x into the existential.","status":"ok","from":11,"to":12}]},{"name":"AffineConstructive.orders.subset.all_subset_aiff","base":"all_subset_aiff","kind":"prf","start":216,"body":[217,220],"status":"ok","short":{"text":"P holds of every member of S if and only if, for every x, x ∊ S affirmed (!) implies P x","status":"ok"},"proof":[{"text":"It suffices to prove that the duals are equivalent. The dual of a universal is an existential of the negations, and the dual of !(x ∊ S) ⊸ P x is !(x ∊ S) ⊠ (P x)ᗮ. So the goal becomes the existential form of the statement for the negation of P.","status":"ok","from":0,"to":1},{"text":"This is [[AffineConstructive.orders.subset.aex_subset_aiff]], applied to the family (P x)ᗮ.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.subset.aex_subset","base":"aex_subset","kind":"prf","start":221,"body":[222,224],"status":"ok","short":{"text":"Proving there is a member of S with P amounts to proving there is x with x ∊ S ⊠ P x","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.subset.aex_subset_aiff]], proving there is a member of S with P amounts to proving ∐ x, !(x ∊ S) ⊠ P x. A proof of !(x ∊ S) is a proof of x ∊ S, so this has the same proofs as the right-hand side, and the two sides are equivalent.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset.aex_subset_proper_aimpl","base":"aex_subset_proper_aimpl","kind":"prf","start":225,"body":[226,233],"status":"ok","short":{"text":"For S ⊆ T, a pointwise implication carries an existential over S's members to one over T's","status":"ok"},"proof":[{"text":"Assume S ⊆ T and the pointwise implications. To show the existential over S implies the one over T, let a be the member of S the hypothesis provides. It remains to show that P a implies there is some b in T with Q b.","status":"ok","from":0,"to":3},{"text":"The inclusion S ⊆ T carries the membership of a's point in S to its membership in T.","status":"ok","from":4,"to":4},{"text":"Take a's point, now regarded as a member of T, as the witness. What remains, P a implies Q at that point, is the pointwise hypothesis instantiated at a's point and its two memberships.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.orders.subset.all_subset_proper_aimpl","base":"all_subset_proper_aimpl","kind":"prf","start":234,"body":[235,242],"status":"ok","short":{"text":"For T ⊆ S, a pointwise implication carries a universal over S's members to one over T's","status":"ok"},"proof":[{"text":"Assume T ⊆ S and the pointwise implications. To prove the universal over T, fix a member b of T. It remains to show that the universal over S implies Q b.","status":"ok","from":0,"to":3},{"text":"The inclusion T ⊆ S carries the membership of b's point in T to its membership in S.","status":"ok","from":4,"to":4},{"text":"Specialise the universal over S at b's point, regarded as a member of S. What remains, P at that point implies Q b, is the pointwise hypothesis instantiated at b's point and its two memberships.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.orders.subset.aex_subset_proper_aiff","base":"aex_subset_proper_aiff","kind":"prf","start":243,"body":[244,255],"status":"ok","short":{"text":"For S = T, a pointwise equivalence makes the existentials over S's and T's members equivalent","status":"ok"},"proof":[{"text":"Assume S = T and the pointwise equivalences. The equivalence of the two existentials is proved one direction at a time.","status":"ok","from":0,"to":3},{"text":"From S to T: the equality S = T gives S ⊆ T by [[AffineConstructive.orders.orders.eq_le]], so [[AffineConstructive.orders.subset.aex_subset_proper_aimpl]] applies. The pointwise implications it asks for are the forward halves of the pointwise equivalences.","status":"ok","from":4,"to":6},{"text":"From T to S: the equality also gives T ⊆ S by [[AffineConstructive.orders.orders.eq_le_flip]], and [[AffineConstructive.orders.subset.aex_subset_proper_aimpl]] applies with the roles exchanged. The pointwise implications come from the backward halves of the equivalences.","status":"ok","from":7,"to":11}]},{"name":"AffineConstructive.orders.subset.all_subset_proper_aiff","base":"all_subset_proper_aiff","kind":"prf","start":256,"body":[257,268],"status":"ok","short":{"text":"For S = T, a pointwise equivalence makes the universals over S's and T's members equivalent","status":"ok"},"proof":[{"text":"Assume S = T and the pointwise equivalences. The equivalence of the two universals is proved one direction at a time.","status":"ok","from":0,"to":3},{"text":"From S to T: a universal passes to a smaller subset, so the step needs T ⊆ S. The equality S = T gives this by [[AffineConstructive.orders.orders.eq_le_flip]], so [[AffineConstructive.orders.subset.all_subset_proper_aimpl]] applies. Its pointwise implications are the forward halves of the equivalences.","status":"ok","from":4,"to":6},{"text":"From T to S: the equality gives S ⊆ T by [[AffineConstructive.orders.orders.eq_le]], and [[AffineConstructive.orders.subset.all_subset_proper_aimpl]] applies with the roles exchanged. The pointwise implications come from the backward halves of the equivalences.","status":"ok","from":7,"to":11}]},{"name":"AffineConstructive.orders.subset.sall_subset_proper_impl","base":"sall_subset_proper_impl","kind":"prf","start":273,"body":[274,278],"status":"ok","short":{"text":"For T ⊆ S, a base-logic universal over S's members implies one over T's, pointwise","status":"ok"},"proof":[{"text":"Assume T ⊆ S, the pointwise implications, and that P holds at every member of S. Fix a member b of T. The goal is Q b.","status":"ok","from":0,"to":1},{"text":"The inclusion T ⊆ S makes b's point a member of S. P holds there by the hypothesis on S, and the pointwise implication at b's point turns that into Q b.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.orders.subset.sall_subset_proper_iff","base":"sall_subset_proper_iff","kind":"prf","start":279,"body":[280,291],"status":"ok","short":{"text":"For S = T, base-logic universals over S's and T's members are equivalent, pointwise","status":"ok"},"proof":[{"text":"Assume S = T and the pointwise equivalences. The equivalence of the two universals is proved one direction at a time.","status":"ok","from":0,"to":3},{"text":"From S to T: the equality gives T ⊆ S by [[AffineConstructive.orders.orders.eq_le_flip]], so [[AffineConstructive.orders.subset.sall_subset_proper_impl]] applies. Its pointwise implications are the forward halves of the equivalences.","status":"ok","from":4,"to":6},{"text":"From T to S: the equality gives S ⊆ T by [[AffineConstructive.orders.orders.eq_le]], and [[AffineConstructive.orders.subset.sall_subset_proper_impl]] applies with the roles exchanged. The pointwise implications come from the backward halves of the equivalences.","status":"ok","from":7,"to":11}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.groups":{"page":"../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.lattices":{"page":"../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.common_props":{"page":"../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.lattices":{"page":"lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.suborders":{"page":"suborders.html","short":"Subsets of an ordered set inherit its order structures; the inclusion is an order embedding","summary":"A subset U of X, regarded as a set ([[subset_to_set]]), carries the order of X restricted to its members, and this file shows that every order structure on X passes to U: preorder, weak poset, poset, strong poset, total and linear order, and the strong transitivity, decidability, affirmativity and refutativity of the order. Each proof restates the required law at the order of X and applies the corresponding law there, since a comparison of members of U is the same proposition as the comparison of the underlying points. The file ends by showing that the inclusion [[from_subset]] is an order embedding, so it both preserves and reflects the order. All of these are registered for instance resolution, so any subset of an ordered set is ordered without further declaration."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.subset":{"page":"../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

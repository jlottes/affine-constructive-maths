t compose_rel_assoc. Qed.\n#[global] Hint Extern 2 (Associative (⋄)) => simple notypeclasses refine compose_rel_assoc_alt : typeclass_instances.\n\n\nLemma rel_compose@{u} {X Y Z:set@{u}} (R:𝒫 (X ⊗ Y)) (S:𝒫 (Y ⊗ Z))\n  x y z : (x, y) ∊ R ⊠ (y, z) ∊ S ⊸ (x, z) ∊ R ⋄ S .\nProof. exact (aex_ub _ y). Qed.\n\nLemma rel_compose3@{u} {X Y Z W:set@{u}} (R:𝒫 (X ⊗ Y)) (S:𝒫 (Y ⊗ Z)) (T:𝒫 (Z ⊗ W))\n  a b c d : (a, b) ∊ R ⊠ (b, c) ∊ S ⊠ (c, d) ∊ T ⊸ (a, d) ∊ R ⋄ S ⋄ T.\nProof. rew <-(aprod_assoc _ _ _), (rel_compose _ _ _ _ _). exact (rel_compose (R ⋄ S) T a c d). Qed.\n\nLemma rel_compose4@{u} {X Y Z W V:set@{u}} (R:𝒫 (X ⊗ Y)) (S:𝒫 (Y ⊗ Z)) (T:𝒫 (Z ⊗ W)) (U:𝒫 (W ⊗ V))\n  a b c d e : (a, b) ∊ R ⊠ (b, c) ∊ S ⊠ (c, d) ∊ T ⊠ (d, e) ∊ U ⊸ (a, e) ∊ R ⋄ S ⋄ T ⋄ U.\nProof. rew (rel_compose3 _ _ _ _ _ _ _), (rel_compose _ _ _ _ _).\n  now do 2 rew (compose_rel_assoc _ _ _).\nQed.\n\nLemma compose_rel_join_distr_l@{u} {X Y Z:set@{u}} (R:𝒫 (X ⊗ Y)) (S T:𝒫 (Y ⊗ Z))\n  : R ⋄ (S ⊔ T) = (R ⋄ S) ⊔ (R ⋄ T).\nProof.\n  intros [x z]. change ( (∐ y, (x, y) ∊ R ⊠ ((y, z) ∊ S ∨ (y, z) ∊ T)) ⧟ ( (∐ y, (x, y) ∊ R ⊠ (y, z) ∊ S) ∨ (∐ y, (x, y) ∊ R ⊠ (y, z) ∊ T) )).\n  split.\n+ rew <-aex_adj; intros y. rew <-(aex_ub _ y). tautological.\n+ apply aor_elim; rew <-aex_adj; intros y; rew <-(aex_ub _ y); tautological.\nQed.\n\nLemma compose_rel_join_distr_l_alt {X:set} : LeftDistribute (X:=𝒫 (X ⊗ X)) (⋄) (⊔).\nProof. exact compose_rel_join_distr_l. Qed.\n#[global] Hint Extern 2 (LeftDistribute (⋄) (⊔)) => simple notypeclasses refine compose_rel_join_distr_l_alt : typeclass_instances.\n#[global] Hint Extern 2 (LeftDistribute (@sg_op _ (⋄)) (⊔)) => simple notypeclasses refine compose_rel_join_distr_l_alt : typeclass_instances.\n\nLemma compose_rel_join_distr_r@{u} {X Y Z:set@{u}} (R S:𝒫 (X ⊗ Y)) (T:𝒫 (Y ⊗ Z))\n  : (R ⊔ S) ⋄ T = (R ⋄ T) ⊔ (S ⋄ T).\nProof.\n  intros [x z]. change ( (∐ y, ((x, y) ∊ R ∨ (x, y) ∊ S) ⊠ (y, z) ∊ T) ⧟ ( (∐ y, (x, y) ∊ R ⊠ (y, z) ∊ T) ∨ (∐ y, (x, y) ∊ S ⊠ (y, z) ∊ T) )).\n  split.\n+ rew <-aex_adj; intros y. rew <-(aex_ub _ y). tautological.\n+ apply aor_elim; rew <-aex_adj; intros y; rew <-(aex_ub _ y); tautological.\nQed.\n\nLemma compose_rel_join_distr_r_alt {X:set} : RightDistribute (X:=𝒫 (X ⊗ X)) (⋄) (⊔).\nProof. exact compose_rel_join_distr_r. Qed.\n#[global] Hint Extern 2 (RightDistribute (⋄) (⊔)) => simple notypeclasses refine compose_rel_join_distr_r_alt : typeclass_instances.\n#[global] Hint Extern 2 (RightDistribute (@sg_op _ (⋄)) (⊔)) => simple notypeclasses refine compose_rel_join_distr_r_alt : typeclass_instances.\n\nLemma compose_rel_join_sl_mor_l@{u} {X Y Z:set@{u}} (R:𝒫 (X ⊗ Y))\n  : BoundedJoinSemiLattice_Morphism (ap1 (@compose_rel X Y Z) R).\nProof. apply alt_Build_BoundedJoinSemiLattice_Morphism.\n+ exact (compose_rel_join_distr_l R).\n+ full_tautological.\nQed.\n\nLemma compose_rel_join_sl_mor_r@{u} {X Y Z:set@{u}} (R:𝒫 (Y ⊗ Z))\n  : BoundedJoinSemiLattice_Morphism (ap2 (@compose_rel X Y Z) R).\nProof. apply alt_Build_BoundedJoinSemiLattice_Morphism.\n+ intros S T. exact (compose_rel_join_distr_r _ _ _).\n+ full_tautological.\nQed.\n\n#[global] Hint Extern 2 (BoundedJoinSemiLattice_Morphism (func_op2 ap1 (⋄) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_l _) : typeclass_instances.\n#[global] Hint Extern 2 (JoinSemiLattice_Morphism (func_op2 ap1 (⋄) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_l _) : typeclass_instances.\n#[global] Hint Extern 2 (Bottom_Pointed_Morphism (func_op2 ap1 (⋄) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_l _) : typeclass_instances.\n#[global] Hint Extern 2 (BoundedJoinSemiLattice_Morphism (func_op2 ap2 (⋄) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_r _) : typeclass_instances.\n#[global] Hint Extern 2 (JoinSemiLattice_Morphism (func_op2 ap2 (⋄) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_r _) : typeclass_instances.\n#[global] Hint Extern 2 (Bottom_Pointed_Morphism (func_op2 ap2 (⋄) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_r _) : typeclass_instances.\n\n#[global] Hint Extern 2 (BoundedJoinSemiLattice_Morphism (func_op2 ap1 (@sg_op _ (⋄)) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_l _) : typeclass_instances.\n#[global] Hint Extern 2 (JoinSemiLattice_Morphism (func_op2 ap1 (@sg_op _ (⋄)) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_l _) : typeclass_instances.\n#[global] Hint Extern 2 (Bottom_Pointed_Morphism (func_op2 ap1 (@sg_op _ (⋄)) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_l _) : typeclass_instances.\n#[global] Hint Extern 2 (BoundedJoinSemiLattice_Morphism (func_op2 ap2 (@sg_op _ (⋄)) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_r _) : typeclass_instances.\n#[global] Hint Extern 2 (JoinSemiLattice_Morphism (func_op2 ap2 (@sg_op _ (⋄)) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_r _) : typeclass_instances.\n#[global] Hint Extern 2 (Bottom_Pointed_Morphism (func_op2 ap2 (@sg_op _ (⋄)) _)) => simple notypeclasses refine (compose_rel_join_sl_mor_r _) : typeclass_instances.\n\nLemma compose_rel_order_preserving@{u} {X Y Z:set@{u}} : OrderPreserving (@compose_rel X Y Z).\nProof. apply alt_Build_OrderPreserving. intros [R₁ S₁][R₂ S₂]; unfold_pair_le.\n  enough ((R₁ ⊆ R₂ ⊸ R₁ ⋄ S₁ ⊆ R₂ ⋄ S₁) ∧ (S₁ ⊆ S₂ ⊸ R₂ ⋄ S₁ ⊆ R₂ ⋄ S₂)) as [ER ES]\n    by (rew [ER|ES]; now apply transitivity); split.\n+ refine (order_preserving (ap2 (⋄) S₁) _ _). now apply join_sl_mor_preserving.\n+ refine (order_preserving (ap1 (⋄) R₂) _ _). now apply join_sl_mor_preserving.\nQed.\n#[global] Hint Extern 2 (OrderPreserving (⋄)) => simple notypeclasses refine compose_rel_order_preserving : typeclass_instances.\n#[global] Hint Extern 2 (OrderPreserving (@sg_op _ (⋄))) => simple notypeclasses refine compose_rel_order_preserving : typeclass_instances.\n\n\n\nLemma compose_rel_meet_lax_distr_l@{u} {X Y Z:set@{u}} (R:𝒫 (X ⊗ Y)) (S T:𝒫 (Y ⊗ Z))\n  : R ⋄ (S ⊓ T) ⊆ (R ⋄ S) ⊓ (R ⋄ T).\nProof.\n  apply meet_glb; split.\n  * now rew (meet_lb_l _ _).\n  * now rew (meet_lb_r _ _).\nQed.\n\nLemma compose_rel_meet_lax_distr_r@{u} {X Y Z:set@{u}} (R S:𝒫 (X ⊗ Y)) (T:𝒫 (Y ⊗ Z))\n  : (R ⊓ S) ⋄ T ⊆ (R ⋄ T) ⊓ (S ⋄ T).\nProof.\n  apply meet_glb; split.\n  * now rew (meet_lb_l _ _).\n  * now rew (meet_lb_r _ _).\nQed.\n\nLemma compose_rel_left_id@{u} {X Y:set@{u}} : LeftIdentity (@compose_rel X X Y) (id_rel _).\nProof. intros R [x y]. change ( (∐ x', x = x' ⊠ (x', y) ∊ R) ⧟ (x, y) ∊ R). split.\n+ rew <-aex_adj; intros x'. rew (aprod_adj _ _ _).\n  rew (is_fun { x:X | (x, y) ∊ R } x x'); full_tautological.\n+ rew <-(aex_ub _ x). now simplify.\nQed.\n#[global] Hint Extern 2 (LeftIdentity (⋄) _) => simple notypeclasses refine compose_rel_left_id : typeclass_instances.\n\nLemma compose_rel_right_id@{u} {X Y:set@{u}} : RightIdentity (@compose_rel X Y Y) (id_rel _).\nProof. intros R [x y]. change ( (∐ y', (x, y') ∊ R ⊠ y' = y) ⧟ (x, y) ∊ R). split.\n+ rew <-aex_adj; intros y'. rew (aprod_com _ _), (aprod_adj _ _ _).\n  rew (is_fun { y:Y | (x, y) ∊ R } y' y); full_tautological.\n+ rew <-(aex_ub _ y). now simplify.\nQed.\n#[global] Hint Extern 2 (RightIdentity (⋄) _) => simple notypeclasses refine compose_rel_right_id : typeclass_instances.\n\nLemma compose_rel_left_absorb@{u} {X Y Z:set@{u}} (R:𝒫 (Y ⊗ Z)) : ∅ ⋄ R = ∅ :> 𝒫 (X ⊗ Z) .\nProof. intros [x z]. change ( (∐ y, 𝐅 ⊠ (y,z) ∊ R) ⧟ 𝐅 ). now simplify. Qed.\n\nLemma compose_rel_right_absorb@{u} {X Y Z:set@{u}} (R:𝒫 (X ⊗ Y)) : R ⋄ ∅ = ∅ :> 𝒫 (X ⊗ Z) .\nProof. intros [x z]. change ( (∐ y, (x,y) ∊ R ⊠ 𝐅) ⧟ 𝐅 ). now simplify. Qed.\n\nLocal Open Scope rel_inv_scope.\nLemma flip_involutive@{u} {X Y:set@{u}} (R:𝒫 (X ⊗ Y)) : (R⁻¹)⁻¹ = R.\nProof. refl. Qed.\n#[global] Hint Extern 2 (Involutive flip) => simple notypeclasses refine flip_involutive : typeclass_instances.\n\n#[global] Hint Extern 1 (Inverse flip) => refine flip : typeclass_instances.\nLemma flip_bijective@{u} {X Y:set@{u}} : Bijective (@flip X Y).\nProof. apply alt_Build_Bijective; intros R; exact (flip_involutive R). Qed.\n#[global] Hint Extern 2 (Bijective flip) => simple notypeclasses refine flip_bijective : typeclass_instances.\n#[global] Hint Extern 2 (Injective flip) => simple notypeclasses refine flip_bijective : typeclass_instances.\n#[global] Hint Extern 2 (Surjective flip) => simple notypeclasses refine flip_bijective : typeclass_instances.\n\nLemma flip_lat_mor@{u} {X Y:set@{u}} : BoundedLattice_Morphism (@flip X Y).\nProof. apply alt_Build_BoundedLattice_Morphism.\n+ now intros R S [y x].\n+ now intros R S [y x].\n+ refl.\n+ refl.\nQed.\n#[global] Hint Extern 2 (BoundedLattice_Morphism flip) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (Lattice_Morphism flip) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (BoundedJoinSemiLattice_Morphism flip) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (BoundedMeetSemiLattice_Morphism flip) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (JoinSemiLattice_Morphism flip) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (MeetSemiLattice_Morphism flip) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (Bottom_Pointed_Morphism flip) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (Top_Pointed_Morphism flip) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n\nLemma flip_ord_embed@{u} {X Y:set@{u}} : OrderEmbedding (@flip X Y).\nProof. exact (join_sl_mor_embedding _). Qed.\n#[global] Hint Extern 2 (OrderEmbedding flip) => simple notypeclasses refine flip_ord_embed : typeclass_instances.\n#[global] Hint Extern 2 (OrderMorphism flip) => simple notypeclasses refine flip_ord_embed : typeclass_instances.\n#[global] Hint Extern 2 (OrderPreserving flip) => simple notypeclasses refine flip_ord_embed : typeclass_instances.\n#[global] Hint Extern 2 (OrderReflecting flip) => simple notypeclasses refine flip_ord_embed : typeclass_instances.\n\nLemma flip_compose_rel_distr@{u} {X Y Z:set@{u}} (R:𝒫 (X ⊗ Y)) (S:𝒫 (Y ⊗ Z)) : (R ⋄ S)⁻¹ = S⁻¹ ⋄ R⁻¹.\nProof. intros [z x]. change ((∐ y, (x,y) ∊ R ⊠ (y,z) ∊ S) ⧟ (∐ y, (y,z) ∊ S ⊠ (x,y) ∊ R)).\n  apply aex_aiff; intros y; apply aprod_com.\nQed.\nLemma flip_anti_distribute {X} : AntiDistribute (X:=𝒫 (X ⊗ X)) flip (⋄).\nProof. exact flip_compose_rel_distr. Qed.\n#[global] Hint Extern 2 (AntiDistribute flip (⋄)) => simple notypeclasses refine flip_anti_distribute : typeclass_instances.\n\nLemma flip_id {X} : (id_rel X)⁻¹ = id_rel X.\nProof. intros [x y]. change (y = x ⧟ x = y). now apply symmetry_iff. Qed.\n\nLemma compose_rel_star_monoid {X} : StarMonoid (𝒫 (X ⊗ X)).\nProof. apply alt_Build_StarMonoid.\n+ now change (Associative (X:=𝒫 (X ⊗ X)) (⋄)).\n+ now change (LeftIdentity (@compose_rel X X X) (id_rel X)).\n+ now change (RightIdentity (@compose_rel X X X) (id_rel X)).\n+ now change (Involutive (X:=𝒫 (X ⊗ X)) flip).\n+ now change (AntiDistribute (X:=𝒫 (X ⊗ X)) flip (⋄)).\nQed.\n#[global] Hint Extern 2 (StarMonoid (subset_set (_ ⊗ _))) => simple notypeclasses refine compose_rel_star_monoid : typeclass_instances.\n#[global] Hint Extern 2 (Monoid (subset_set (_ ⊗ _))) => simple notypeclasses refine compose_rel_star_monoid : typeclass_instances.\n#[global] Hint Extern 2 (SemiGroup (subset_set (_ ⊗ _))) => simple notypeclasses refine compose_rel_star_monoid : typeclass_instances.\n#[global] Hint Extern 2 (StarSemiGroup (subset_set (_ ⊗ _))) => simple notypeclasses refine compose_rel_star_monoid : typeclass_instances.\n\n#[global] Hint Extern 2 (BoundedLattice_Morphism (@inv _ flip)) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (Lattice_Morphism (@inv _ flip)) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (BoundedJoinSemiLattice_Morphism (@inv _ flip)) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (BoundedMeetSemiLattice_Morphism (@inv _ flip)) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (JoinSemiLattice_Morphism (@inv _ flip)) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (MeetSemiLattice_Morphism (@inv _ flip)) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (Bottom_Pointed_Morphism (@inv _ flip)) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n#[global] Hint Extern 2 (Top_Pointed_Morphism (@inv _ flip)) => simple notypeclasses refine flip_lat_mor : typeclass_instances.\n\n#[global] Hint Extern 2 (OrderEmbedding  (@inv _ flip)) => simple notypeclasses refine flip_ord_embed : typeclass_instances.\n#[global] Hint Extern 2 (OrderPreserving (@inv _ flip)) => simple notypeclasses refine flip_ord_embed : typeclass_instances.\n#[global] Hint Extern 2 (OrderReflecting (@inv _ flip)) => simple notypeclasses refine flip_ord_embed : typeclass_instances.\n\nLocal Open Scope sg_op_scope.\n\nLemma compose_rel_ub_l@{u} {X:set@{u}} (R S : 𝒫 (X ⊗ X))\n  : mon_unit ⊆ S ⊸ R ⊆ R ∙ S.\nProof. now rew (order_preserving_simp (R∙) (mon_unit) S). Qed.\n\nLemma compose_rel_ub_r@{u} {X:set@{u}} (R S : 𝒫 (X ⊗ X))\n  : mon_unit ⊆ R ⊸ S ⊆ R ∙ S.\nProof. now rew (order_preserving_simp (∙S) (mon_unit) R). Qed.\n\nLocal Close Scope sg_op_scope.\n\n\n(** Tensor subset *)\n\nLocal Open Scope subset_scope.\nLemma tensor_subset_order_preserving {X Y} : OrderPreserving (@tensor_subset X Y).\nProof. apply alt_Build_OrderPreserving. intros [U₁ V₁][U₂ V₂].\n  change (U₁ ⊆ U₂ ⊠ V₁ ⊆ V₂ ⊸ U₁ ⊗ V₁ ⊆ U₂ ⊗ V₂).\n  change (?A ⊆ ?B) with (∏ x, x ∊ A ⊸ x ∊ B).\n  rew <-all_adj; intros [x y]. rew [(all_lb _ x)|(all_lb _ y)].\n  full_tautological.\nQed.\n#[global] Hint Extern 2 (OrderPreserving tensor_subset) => simple notypeclasses refine tensor_subset_order_preserving : typeclass_instances.\n\nLemma tensor_subset_flip@{u} {X Y:set@{u}} (U : 𝒫 X) (V : 𝒫 Y) : (U ⊗ V)⁻¹ = V ⊗ U.\nProof. intros [y x]. apply aprod_com. Qed.\n\nLemma tensor_subset_compose@{u} {X Y Z:set@{u}} (A : 𝒫 X) (B : 𝒫 Y) (C : 𝒫 Z) U V `{!Inhabited B} :\n  A ⊗ B ⊆ U ⊠ B ⊗ C ⊆ V ⊸ A ⊗ C ⊆ U ⋄ V.\nProof. \n  change (?A ⊆ ?B) with (∏ x, x ∊ A ⊸ x ∊ B).\n  rew <-all_adj; intros [x z].\n  pose proof inhabited B as [y _].\n  rew [(all_lb _ (x, y:Y)) | (all_lb _ (y:Y, z))].\n  change ((?x, ?y) ∊ ?A ⊗ ?B) with (x ∊ A ⊠ y ∊ B); simplify.\n  destruct y as [y ?].\n  change ((x ∊ A ⊸ (x, y) ∊ U) ⊠ (z ∊ C ⊸ (y, z) ∊ V) ⊸ x ∊ A ⊠ z ∊ C ⊸ ∐ y:Y, (x, y) ∊ U ⊠ (y, z) ∊ V).\n  rew <-(aex_ub _ y). tautological.\nQed.\n\n(** Product subset *)\n\nLemma prod_subset_order_preserving {X Y} : OrderPreserving (@prod_subset X Y).\nProof. apply alt_Build_OrderPreserving. intros [U₁ V₁][U₂ V₂]. unfold_pair_le.\n  change (?A ≤ ?B) with (∏ x, x ∊ A ⊸ x ∊ B).\n  rew <-all_adj; intros [x y]. rew [(all_lb _ x)|(all_lb _ y)].\n  full_tautological.\nQed.\n#[global] Hint Extern 2 (OrderPreserving prod_subset) => simple notypeclasses refine prod_subset_order_preserving : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":82,"kind":"vernac","status":"ok","ms":31,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":83,"e":175,"kind":"vernac","status":"ok","ms":21,"messages":[],"goals":null},{"i":2,"s":176,"e":247,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":3,"s":248,"e":277,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":278,"e":328,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":5,"s":330,"e":360,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":6,"s":362,"e":512,"kind":"vernac","status":"ok","ms":14,"messages":[],"goals":{"fg":[{"id":"50","name":null,"hyps":["e4bab5ccae73685a","40ba76a96d53c504","5b20df2f9109c e":15242,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":15340,"e":15348,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":15480,"e":15483,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":15500,"e":15512,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../logic/aprop.html"},{"s":15685,"e":15699,"lib":"AffineConstructive.orders.orders","name":"unfold_pair_le","kind":"ltac","local":false,"page":"orders.html"},{"s":15749,"e":15752,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":15778,"e":15781,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":15813,"e":15830,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../interfaces/aprop.html"}],"gloss":{"summary":"The algebra of relations, viewed as subsets of a tensor product X ⊗ Y, under composition [[AffineConstructive.interfaces.subset.compose_rel]], the identity relation [[AffineConstructive.interfaces.subset.id_rel]] and the converse [[AffineConstructive.interfaces.subset.flip]]. Composition is associative, has the identity relation as a unit on both sides, distributes over joins and absorbs the empty relation, but only laxly distributes over meets. The converse is an involutive bounded lattice isomorphism that reverses composition, and all of this together makes the relations on a set a star monoid ([[AffineConstructive.orders.subset_relations.compose_rel_star_monoid]]). The file closes with monotonicity of the tensor and cartesian pairings of subsets and a rule for composing tensor pairings through an inhabited middle subset. These laws are the calculus of entourages used by the uniform spaces in `topology/`.","short":"Composition, identity and converse of relations: a star monoid of subsets of X ⊗ X","items":[{"name":"AffineConstructive.orders.subset_relations.compose_rel_assoc","base":"compose_rel_assoc","kind":"prf","start":6,"body":[7,21],"status":"ok","short":{"text":"Composition of relations is associative: R ⋄ (S ⋄ T) = (R ⋄ S) ⋄ T","status":"ok"},"proof":[{"text":"Two relations are equal when they agree at every pair, so fix x and w. Unfolding the composites, the left side says there is a y with (x, y) ∊ R ⊠ (there is a z with (y, z) ∊ S ⊠ (z, w) ∊ T). The right side says there is a z with (there is a y with (x, y) ∊ R ⊠ (y, z) ∊ S) ⊠ (z, w) ∊ T. The equivalence is proved one direction at a time.","status":"ok","from":0,"to":3},{"text":"Left to right: take the y the hypothesis provides. Moving the inner existential out of the tensor, take the z it provides as well. What remains is the three memberships.","status":"ok","from":4,"to":6},{"text":"Take z and then y as the witnesses. The goal is now the same three memberships grouped the other way, so associativity of the tensor ([[AffineConstructive.logic.aprop.aprod_assoc]]) finishes this direction.","status":"ok","from":7,"to":8},{"text":"Right to left, symmetrically: take the z the hypothesis provides. Then move the existential over y out of the tensor and take that y.","status":"ok","from":9,"to":11},{"text":"Take y and then z as the witnesses. The two sides differ only in how the tensor is bracketed, and [[AffineConstructive.logic.aprop.aprod_assoc]] closes the goal.","status":"ok","from":12,"to":14}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_assoc_alt","base":"compose_rel_assoc_alt","kind":"prf","start":22,"body":[23,25],"status":"ok","short":{"text":"Composition of relations on a single set X is an associative operation","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.orders.subset_relations.compose_rel_assoc]] with all four sets equal to X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.rel_compose","base":"rel_compose","kind":"prf","start":27,"body":[28,30],"status":"ok","short":{"text":"(x, y) ∊ R and (y, z) ∊ S imply (x, z) ∊ R ⋄ S","status":"ok"},"proof":[{"text":"Membership in R ⋄ S says there is a middle point linking x to z. Taking y as the witness gives exactly that.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.rel_compose3","base":"rel_compose3","kind":"prf","start":31,"body":[32,35],"status":"ok","short":{"text":"A chain of three related pairs gives (a, d) ∊ R ⋄ S ⋄ T","status":"ok"},"proof":[{"text":"Regroup the hypotheses so that the first two come together. By [[AffineConstructive.orders.subset_relations.rel_compose]], (a, b) ∊ R and (b, c) ∊ S give (a, c) ∊ R ⋄ S.","status":"ok","from":0,"to":1},{"text":"Applying [[AffineConstructive.orders.subset_relations.rel_compose]] again, to R ⋄ S and T through c, gives (a, d) ∊ R ⋄ S ⋄ T.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.subset_relations.rel_compose4","base":"rel_compose4","kind":"prf","start":36,"body":[37,40],"status":"ok","short":{"text":"A chain of four related pairs gives (a, e) ∊ R ⋄ S ⋄ T ⋄ U","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.subset_relations.rel_compose3]], the last three memberships give (b, e) ∊ S ⋄ T ⋄ U. Then [[AffineConstructive.orders.subset_relations.rel_compose]] joins this to (a, b) ∊ R, giving (a, e) ∊ R ⋄ (S ⋄ T ⋄ U).","status":"ok","from":0,"to":1},{"text":"Reassociating twice by [[AffineConstructive.orders.subset_relations.compose_rel_assoc]] turns R ⋄ (S ⋄ T ⋄ U) into R ⋄ S ⋄ T ⋄ U. Membership respects equality of subsets, so this gives the goal.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_join_distr_l","base":"compose_rel_join_distr_l","kind":"prf","start":41,"body":[42,52],"status":"ok","short":{"text":"Composition distributes over joins on the left: R ⋄ (S ⊔ T) = R ⋄ S ⊔ R ⋄ T","status":"ok"},"proof":[{"text":"Fix x and z and unfold both sides. The left side says there is a y with (x, y) ∊ R ⊠ ((y, z) ∊ S ∨ (y, z) ∊ T). The right side is the disjunction of the two existentials. The equivalence is proved one direction at a time.","status":"ok","from":0,"to":3},{"text":"Left to right: take the y the hypothesis provides, and use it as the witness in both disjuncts. What remains is that P ⊠ (Q ∨ Q') implies (P ⊠ Q) ∨ (P ⊠ Q'). This is the distributivity of the tensor over the additive disjunction, which the decision procedure proves.","status":"ok","from":4,"to":7},{"text":"Right to left, by cases on the disjunction. In each case take the y the hypothesis provides and use it as the witness. The remaining implication from (x, y) ∊ R ⊠ (y, z) ∊ S, or the same with T, into the tensor with the disjunction is a tautology.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_join_distr_l_alt","base":"compose_rel_join_distr_l_alt","kind":"prf","start":53,"body":[54,56],"status":"ok","short":{"text":"Composition of relations on X distributes over joins on the left","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.orders.subset_relations.compose_rel_join_distr_l]] with all three sets equal to X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_join_distr_r","base":"compose_rel_join_distr_r","kind":"prf","start":59,"body":[60,70],"status":"ok","short":{"text":"Composition distributes over joins on the right: (R ⊔ S) ⋄ T = R ⋄ T ⊔ S ⋄ T","status":"ok"},"proof":[{"text":"Fix x and z and unfold both sides. The left side says there is a y with ((x, y) ∊ R ∨ (x, y) ∊ S) ⊠ (y, z) ∊ T. The right side is the disjunction of the two existentials. The equivalence is proved one direction at a time.","status":"ok","from":0,"to":3},{"text":"Left to right: take the y the hypothesis provides, and use it as the witness in both disjuncts. What remains is the distributivity of the tensor over the additive disjunction, now on the left factor, which the decision procedure proves.","status":"ok","from":4,"to":7},{"text":"Right to left, by cases on the disjunction. In each case take the y the hypothesis provides and use it as the witness. The rest is a tautology.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_join_distr_r_alt","base":"compose_rel_join_distr_r_alt","kind":"prf","start":71,"body":[72,74],"status":"ok","short":{"text":"Composition of relations on X distributes over joins on the right","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.orders.subset_relations.compose_rel_join_distr_r]] with all three sets equal to X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_join_sl_mor_l","base":"compose_rel_join_sl_mor_l","kind":"prf","start":77,"body":[78,84],"status":"ok","short":{"text":"Composing on the left with R, S ↦ R ⋄ S, preserves joins and the empty relation","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice_Morphism]], a map is a bounded join-semilattice morphism once it preserves binary joins and the bottom. Here the bottom is the empty relation. These are the two things to show.","status":"ok","from":0,"to":1},{"text":"Preservation of joins is left distributivity, [[AffineConstructive.orders.subset_relations.compose_rel_join_distr_l]].","status":"ok","from":2,"to":3},{"text":"R ⋄ ∅ = ∅: a pair in the composite would need a middle point y with (y, z) ∊ ∅, which is impossible. The decision procedure proves this after unfolding.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_join_sl_mor_r","base":"compose_rel_join_sl_mor_r","kind":"prf","start":85,"body":[86,93],"status":"ok","short":{"text":"Composing on the right with R, S ↦ S ⋄ R, preserves joins and the empty relation","status":"ok"},"proof":[{"text":"A bounded join-semilattice morphism is built from two facts ([[AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice_Morphism]]): composing on the right with R must preserve binary joins and send ∅ to ∅.","status":"ok","from":0,"to":1},{"text":"For relations S and T, the composite (S ⊔ T) ⋄ R is S ⋄ R ⊔ T ⋄ R by right distributivity, [[AffineConstructive.orders.subset_relations.compose_rel_join_distr_r]].","status":"ok","from":2,"to":4},{"text":"That ∅ ⋄ R = ∅ is a tautology once the composite is unfolded: the existential over the middle point has the false factor 𝐅 in every instance.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_order_preserving","base":"compose_rel_order_preserving","kind":"prf","start":106,"body":[107,117],"status":"ok","short":{"text":"Composition of relations is monotone in both arguments together","status":"ok"},"proof":[{"text":"The order on a tensor product of posets compares the components and joins the comparisons by ⊠. So for pairs (R₁, S₁) and (R₂, S₂) the claim is that R₁ ⊆ R₂ ⊠ S₁ ⊆ S₂ implies R₁ ⋄ S₁ ⊆ R₂ ⋄ S₂.","status":"ok","from":0,"to":2},{"text":"It suffices to vary one argument at a time: R₁ ⊆ R₂ gives R₁ ⋄ S₁ ⊆ R₂ ⋄ S₁, and S₁ ⊆ S₂ gives R₂ ⋄ S₁ ⊆ R₂ ⋄ S₂. Each factor of the tensor hypothesis is spent on one of these inclusions, and the two inclusions compose by transitivity. Both one-sided statements are asked for together, as an additive conjunction.","status":"ok","from":3,"to":3},{"text":"For the first argument, composing on the right with S₁ preserves joins by [[AffineConstructive.orders.subset_relations.compose_rel_join_sl_mor_r]]. A join-semilattice morphism preserves the order ([[AffineConstructive.orders.lattices.join_sl_mor_preserving]]), so this composition is monotone.","status":"ok","from":4,"to":6},{"text":"For the second argument, composing on the left with R₂ preserves joins by [[AffineConstructive.orders.subset_relations.compose_rel_join_sl_mor_l]], so it is monotone for the same reason.","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_meet_lax_distr_l","base":"compose_rel_meet_lax_distr_l","kind":"prf","start":120,"body":[121,127],"status":"ok","short":{"text":"R ⋄ (S ⊓ T) is included in R ⋄ S ⊓ R ⋄ T","status":"ok"},"proof":[{"text":"A subset lies in a meet when it lies in each meetand. So it suffices to show that R ⋄ (S ⊓ T) is included both in R ⋄ S and in R ⋄ T.","status":"ok","from":0,"to":1},{"text":"S ⊓ T ⊆ S, and composition is monotone ([[AffineConstructive.orders.subset_relations.compose_rel_order_preserving]]), so R ⋄ (S ⊓ T) ⊆ R ⋄ S.","status":"ok","from":2,"to":3},{"text":"In the same way, S ⊓ T ⊆ T gives R ⋄ (S ⊓ T) ⊆ R ⋄ T.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_meet_lax_distr_r","base":"compose_rel_meet_lax_distr_r","kind":"prf","start":128,"body":[129,135],"status":"ok","short":{"text":"(R ⊓ S) ⋄ T is included in R ⋄ T ⊓ S ⋄ T","status":"ok"},"proof":[{"text":"A subset lies in a meet when it lies in each meetand. So it suffices to show that (R ⊓ S) ⋄ T is included both in R ⋄ T and in S ⋄ T.","status":"ok","from":0,"to":1},{"text":"R ⊓ S ⊆ R, and composition is monotone ([[AffineConstructive.orders.subset_relations.compose_rel_order_preserving]]), so (R ⊓ S) ⋄ T ⊆ R ⋄ T.","status":"ok","from":2,"to":3},{"text":"In the same way, R ⊓ S ⊆ S gives (R ⊓ S) ⋄ T ⊆ S ⋄ T.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_left_id","base":"compose_rel_left_id","kind":"prf","start":136,"body":[137,148],"status":"ok","short":{"text":"The identity relation is a left identity for composition","status":"ok"},"proof":[{"text":"Fix a relation R and a pair (x, y). Unfolded, membership of (x, y) in the composite says there is an x' with x = x' and (x', y) ∊ R. This must be equivalent to (x, y) ∊ R, and the two directions are proved separately.","status":"ok","from":0,"to":3},{"text":"Forward: let x' be the point the existential provides. Its two factors become two successive hypotheses. Membership of the first coordinate in R, with y fixed, is a function of x, and functions preserve equality ([[AffineConstructive.interfaces.set.is_fun]]). So x = x' turns (x', y) ∊ R into (x, y) ∊ R.","status":"ok","from":4,"to":7},{"text":"Backward: take x itself as the witness. The equality x = x holds by reflexivity, and what remains is the hypothesis (x, y) ∊ R.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_right_id","base":"compose_rel_right_id","kind":"prf","start":150,"body":[151,162],"status":"ok","short":{"text":"The identity relation is a right identity for composition","status":"ok"},"proof":[{"text":"Fix a relation R and a pair (x, y). Unfolded, membership of (x, y) in the composite says there is a y' with (x, y') ∊ R and y' = y. This must be equivalent to (x, y) ∊ R, and the two directions are proved separately.","status":"ok","from":0,"to":3},{"text":"Forward: let y' be the point the existential provides. After the two factors are swapped and separated, the equality y' = y comes first. Membership of the second coordinate in R, with x fixed, is a function of y, and functions preserve equality ([[AffineConstructive.interfaces.set.is_fun]]). So y' = y carries (x, y') ∊ R to (x, y) ∊ R.","status":"ok","from":4,"to":7},{"text":"Backward: take y itself as the witness. The equality y = y holds by reflexivity, and what remains is the hypothesis (x, y) ∊ R.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_left_absorb","base":"compose_rel_left_absorb","kind":"prf","start":164,"body":[165,169],"status":"ok","short":{"text":"Composing the empty relation with any relation gives the empty relation: ∅ ⋄ R = ∅","status":"ok"},"proof":[{"text":"Relations are compared pointwise, so fix (x, z). Membership in ∅ ⋄ R says that some y satisfies 𝐅 ⊠ (y, z) ∊ R. Each such tensor is false, so the existential is false and equivalent to membership in ∅.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_right_absorb","base":"compose_rel_right_absorb","kind":"prf","start":170,"body":[171,175],"status":"ok","short":{"text":"Composing any relation with the empty relation gives the empty relation: R ⋄ ∅ = ∅","status":"ok"},"proof":[{"text":"Relations are compared pointwise, so fix (x, z). Membership in R ⋄ ∅ says that some y satisfies (x, y) ∊ R ⊠ 𝐅. Each such tensor is false, so the existential is false and equivalent to membership in ∅.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.orders.subset_relations.flip_involutive","base":"flip_involutive","kind":"prf","start":177,"body":[178,180],"status":"ok","short":{"text":"The converse of the converse is the relation itself: (R⁻¹)⁻¹ = R","status":"ok"},"proof":[{"text":"Taking the converse twice swaps the coordinates of a pair back again. So (R⁻¹)⁻¹ is R by definition, and the equality holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.flip_bijective","base":"flip_bijective","kind":"prf","start":183,"body":[184,186],"status":"ok","short":{"text":"Taking the converse is a bijection between relations, with itself as inverse","status":"ok"},"proof":[{"text":"Taking the converse is its own designated inverse. Both composites are the identity by [[AffineConstructive.orders.subset_relations.flip_involutive]], and a function with a two-sided inverse is a bijection ([[AffineConstructive.theory.set.alt_Build_Bijective]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.flip_lat_mor","base":"flip_lat_mor","kind":"prf","start":190,"body":[191,201],"status":"ok","short":{"text":"Taking the converse preserves meets, joins, the full and the empty relation","status":"ok"},"proof":[{"text":"A map between bounded lattices that preserves meet, join, top and bottom is a bounded lattice morphism ([[AffineConstructive.theory.lattices.alt_Build_BoundedLattice_Morphism]]), so four equations remain: the converse of a meet, of a join, of the full relation and of the empty relation.","status":"ok","from":0,"to":1},{"text":"For meets and joins, fix relations R and S and a pair (y, x). Membership of (y, x) in the converse of R ⊓ S unfolds to membership of (x, y) in R ⊓ S, which is literally membership of (y, x) in R⁻¹ ⊓ S⁻¹; joins work the same way.","status":"ok","from":2,"to":5},{"text":"The converse of the full relation is the full relation and the converse of the empty relation is empty; both hold by unfolding the definitions.","status":"ok","from":6,"to":10}]},{"name":"AffineConstructive.orders.subset_relations.flip_ord_embed","base":"flip_ord_embed","kind":"prf","start":210,"body":[211,213],"status":"ok","short":{"text":"Taking the converse is an order embedding of relations under inclusion","status":"ok"},"proof":[{"text":"The converse is a bijection ([[AffineConstructive.orders.subset_relations.flip_bijective]]) and preserves joins ([[AffineConstructive.orders.subset_relations.flip_lat_mor]]). An injective join-semilattice morphism is an order embedding ([[AffineConstructive.orders.lattices.join_sl_mor_embedding]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.flip_compose_rel_distr","base":"flip_compose_rel_distr","kind":"prf","start":218,"body":[219,223],"status":"ok","short":{"text":"The converse reverses composition: (R ⋄ S)⁻¹ = S⁻¹ ⋄ R⁻¹","status":"ok"},"proof":[{"text":"Fix a pair (z, x). Unfolded, the goal asks for the equivalence of the statements that there is a y with (x, y) ∊ R ⊠ (y, z) ∊ S and that there is a y with (y, z) ∊ S ⊠ (x, y) ∊ R.","status":"ok","from":0,"to":2},{"text":"An equivalence that holds for each y carries over to the existentials ([[AffineConstructive.logic.aprop.aex_aiff]]). For a fixed y the two sides differ only in the order of the factors, and the tensor is commutative ([[AffineConstructive.logic.aprop.aprod_com]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.subset_relations.flip_anti_distribute","base":"flip_anti_distribute","kind":"prf","start":224,"body":[225,227],"status":"ok","short":{"text":"On relations on X, the converse anti-distributes over composition","status":"ok"},"proof":[{"text":"This is the reversal law [[AffineConstructive.orders.subset_relations.flip_compose_rel_distr]] for relations on a single set X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.flip_id","base":"flip_id","kind":"prf","start":229,"body":[230,234],"status":"ok","short":{"text":"The identity relation is its own converse","status":"ok"},"proof":[{"text":"Fix a pair (x, y). Unfolding the converse and the identity relation, the goal is y = x ⧟ x = y.","status":"ok","from":0,"to":2},{"text":"This holds because equality is symmetric ([[AffineConstructive.logic.relations.symmetry_iff]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_star_monoid","base":"compose_rel_star_monoid","kind":"prf","start":235,"body":[236,248],"status":"ok","short":{"text":"Relations on X form a star monoid under composition, the identity relation and the converse","status":"ok"},"proof":[{"text":"A star monoid is built from five laws ([[AffineConstructive.theory.groups.alt_Build_StarMonoid]]): associativity, the two identity laws, involutivity of the star, and the star reversing products. In this case the product is composition, the unit is the identity relation and the star is the converse.","status":"ok","from":0,"to":1},{"text":"Associativity is the associativity of composition, [[AffineConstructive.orders.subset_relations.compose_rel_assoc_alt]].","status":"ok","from":2,"to":3},{"text":"The identity relation is a left unit ([[AffineConstructive.orders.subset_relations.compose_rel_left_id]]) and a right unit ([[AffineConstructive.orders.subset_relations.compose_rel_right_id]]) for composition.","status":"ok","from":4,"to":7},{"text":"The converse is involutive ([[AffineConstructive.orders.subset_relations.flip_involutive]]).","status":"ok","from":8,"to":9},{"text":"The converse reverses composition ([[AffineConstructive.orders.subset_relations.flip_anti_distribute]]).","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_ub_l","base":"compose_rel_ub_l","kind":"prf","start":265,"body":[266,268],"status":"ok","short":{"text":"If S contains the identity relation, then R ⊆ R ∙ S","status":"ok"},"proof":[{"text":"Composing on the left with R is monotone ([[AffineConstructive.orders.subset_relations.compose_rel_order_preserving]]), so the inclusion of the identity relation in S gives R ∙ id ⊆ R ∙ S ([[AffineConstructive.orders.maps.order_preserving_simp]]). In the star monoid R ∙ id is R, and this is the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.compose_rel_ub_r","base":"compose_rel_ub_r","kind":"prf","start":269,"body":[270,272],"status":"ok","short":{"text":"If R contains the identity relation, then S ⊆ R ∙ S","status":"ok"},"proof":[{"text":"Composing on the right with S is monotone ([[AffineConstructive.orders.subset_relations.compose_rel_order_preserving]]), so the inclusion of the identity relation in R gives id ∙ S ⊆ R ∙ S ([[AffineConstructive.orders.maps.order_preserving_simp]]). Since id ∙ S is S, this is the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.orders.subset_relations.tensor_subset_order_preserving","base":"tensor_subset_order_preserving","kind":"prf","start":275,"body":[276,284],"status":"ok","short":{"text":"The tensor pairing U ⊗ V of subsets is monotone in both arguments","status":"ok"},"proof":[{"text":"Monotonicity reduces to its definition ([[AffineConstructive.orders.maps.alt_Build_OrderPreserving]]). Fix pairs (U₁, V₁) and (U₂, V₂). Since the order on a tensor product is componentwise and joined by ⊠, the goal is that U₁ ⊆ U₂ ⊠ V₁ ⊆ V₂ implies U₁ ⊗ V₁ ⊆ U₂ ⊗ V₂.","status":"ok","from":0,"to":3},{"text":"Write each inclusion as a universal implication between memberships. Fix a pair (x, y), and specialise the inclusion U₁ ⊆ U₂ at x and the inclusion V₁ ⊆ V₂ at y. Each inclusion is used once, at its own point.","status":"ok","from":4,"to":6},{"text":"What remains is a tautology: x ∊ U₁ ⊸ x ∊ U₂ and y ∊ V₁ ⊸ y ∊ V₂ together turn x ∊ U₁ ⊠ y ∊ V₁ into x ∊ U₂ ⊠ y ∊ V₂.","status":"ok","from":7,"to":8}]},{"name":"AffineConstructive.orders.subset_relations.tensor_subset_flip","base":"tensor_subset_flip","kind":"prf","start":286,"body":[287,290],"status":"ok","short":{"text":"The converse of U ⊗ V is V ⊗ U","status":"ok"},"proof":[{"text":"Fix a pair (y, x). Membership in the converse of U ⊗ V is x ∊ U ⊠ y ∊ V, and membership in V ⊗ U is y ∊ V ⊠ x ∊ U. These are equivalent because the tensor is commutative ([[AffineConstructive.logic.aprop.aprod_com]]).","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.orders.subset_relations.tensor_subset_compose","base":"tensor_subset_compose","kind":"prf","start":291,"body":[292,302],"status":"ok","short":{"text":"For B inhabited, A ⊗ B ⊆ U and B ⊗ C ⊆ V imply A ⊗ C ⊆ U ⋄ V","status":"ok"},"proof":[{"text":"Read each inclusion as a universal implication of memberships, and fix a pair (x, z) in X ⊗ Z. It remains to show that if x ∊ A and z ∊ C, then (x, z) lies in the composite U ⋄ V, given the two inclusions.","status":"ok","from":0,"to":2},{"text":"Since B is inhabited, it has a point y ([[AffineConstructive.interfaces.sprop.inhabited]]). Specialise the inclusion A ⊗ B ⊆ U at (x, y) and the inclusion B ⊗ C ⊆ V at (y, z). Each inclusion is used once, at its own pair.","status":"ok","from":3,"to":4},{"text":"Membership of a pair in a tensor pairing is the tensor of the two memberships. Because y ∊ B is already known, that factor drops out, and the specialised hypotheses become x ∊ A ⊸ (x, y) ∊ U and z ∊ C ⊸ (y, z) ∊ V. Write y as a point of Y together with the proof that it lies in B.","status":"ok","from":5,"to":6},{"text":"Unfolded, membership in U ⋄ V asks for some middle point y′ with (x, y′) ∊ U ⊠ (y′, z) ∊ V. Take y as the witness. What remains applies each implication to its own factor of x ∊ A ⊠ z ∊ C, a tautology.","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.orders.subset_relations.prod_subset_order_preserving","base":"prod_subset_order_preserving","kind":"prf","start":303,"body":[304,312],"status":"ok","short":{"text":"The cartesian pairing U × V of subsets is monotone in both arguments","status":"ok"},"proof":[{"text":"Between posets, preserving order means that x ≤ y implies f x ≤ f y ([[AffineConstructive.orders.maps.alt_Build_OrderPreserving]]). So take pairs (U₁, V₁) and (U₂, V₂) of subsets. The componentwise order on the pairs is the additive conjunction U₁ ⊆ U₂ ∧ V₁ ⊆ V₂, and from it U₁ × V₁ ⊆ U₂ × V₂ must follow.","status":"ok","from":0,"to":3},{"text":"Read the inclusions as universal implications of memberships and fix a pair (x, y). Then specialise the first inclusion at x and the second at y.","status":"ok","from":4,"to":6},{"text":"Membership of (x, y) in a cartesian pairing is the additive conjunction of x ∊ U and y ∊ V. Each conjunct of the hypothesis maps its own component, so the remaining implication is a tautology.","status":"ok","from":7,"to":8}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.groups":{"page":"../theory/groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.lattices":{"page":"../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.common_props":{"page":"../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.orders":{"page":"../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.orders.orders":{"page":"orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.lattices":{"page":"lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.orders.maps":{"page":"maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.suborders":{"page":"suborders.html","short":"Subsets of an ordered set inherit its order structures; the inclusion is an order embedding","summary":"A subset U of X, regarded as a set ([[subset_to_set]]), carries the order of X restricted to its members, and this file shows that every order structure on X passes to U: preorder, weak poset, poset, strong poset, total and linear order, and the strong transitivity, decidability, affirmativity and refutativity of the order. Each proof restates the required law at the order of X and applies the corresponding law there, since a comparison of members of U is the same proposition as the comparison of the underlying points. The file ends by showing that the inclusion [[from_subset]] is an order embedding, so it both preserves and reflects the order. All of these are registered for instance resolution, so any subset of an ordered set is ordered without further declaration."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.orders.subset":{"page":"subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

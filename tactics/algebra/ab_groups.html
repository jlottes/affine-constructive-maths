AffineConstructive.tactics.algebra.ab_groups","name":"eval","kind":"def","local":true},{"s":1169,"e":1174,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../quote/base.html"},{"s":1190,"e":1195,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../quote/base.html"},{"s":1209,"e":1219,"lib":"AffineConstructive.theory.bundled_groups","name":"quote_plus","kind":"def","local":false,"page":"../../theory/bundled_groups.html"},{"s":1267,"e":1271,"lib":"AffineConstructive.implementations.list.base","name":"list","kind":"ind","local":false,"page":"../../implementations/list/base.html"},{"s":1287,"e":1299,"lib":"AffineConstructive.tactics.algebra.ab_groups","name":"eval","kind":"def","local":true},{"s":1305,"e":1315,"lib":"AffineConstructive.theory.bundled_groups","name":"quote_zero","kind":"def","local":false,"page":"../../theory/bundled_groups.html"},{"s":1370,"e":1374,"lib":"AffineConstructive.implementations.list.base","name":"list","kind":"ind","local":false,"page":"../../implementations/list/base.html"},{"s":1390,"e":1402,"lib":"AffineConstructive.tactics.algebra.ab_groups","name":"eval","kind":"def","local":true},{"s":1427,"e":1432,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../quote/base.html"},{"s":1444,"e":1460,"lib":"AffineConstructive.theory.additive_groups","name":"quote_negate_alt","kind":"thm","local":false,"page":"../../theory/additive_groups.html"},{"s":661,"e":684,"lib":"AffineConstructive.tactics.strip_coercions","name":"strip_coercions_or_self","kind":"ltac","local":false,"page":"../strip_coercions.html"},{"s":790,"e":805,"lib":"AffineConstructive.tactics.quote.onepass","name":"quote_onepass_3","kind":"ltac","local":false,"page":"../quote/onepass.html"},{"s":1470,"e":1485,"lib":"AffineConstructive.logic.dec","name":"decide_relation","kind":"ltac","local":false,"page":"../../logic/dec.html"},{"s":1516,"e":1527,"lib":"AffineConstructive.tactics.algebra.ab_groups","name":"add_grp_tac","kind":"ltac","local":true}],"gloss":{"summary":"The file provides `add_grp`, a decision procedure for equations in an abelian group written additively. It fixes the free abelian group used for normal forms, [[AffineConstructive.implementations.free.ab_groups.free_add_group]] with coefficients in the signed naturals [[AffineConstructive.implementations.signed_naturals_integers.SignedNat]], together with its evaluation into any [[AffineConstructive.interfaces.bundled_algebra.additive_group]] at a list of generators. The tactic quotes both sides of the goal into that free group in one pass, reduces the goal to an equation between the quoted terms, and decides that equation by computing normal forms. The quotation framework comes from tactics/quote, the free group from implementations/free/ab_groups, and the morphism laws used in quoting come from theory/bundled_groups and theory/additive_groups.","short":"The add_grp tactic: deciding equations in abelian groups via the free abelian group","items":[{"name":"AffineConstructive.tactics.algebra.ab_groups.add_grp.F","base":"F","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The free abelian group used by add_grp, with signed naturals as coefficients","status":"ok"},"long":{"text":"The free abelian group that serves as the normal form for the `add_grp` decision procedure. It is the implementation `free_add_group` with coefficients in `SignedNat`, the signed natural numbers. An element is a finite formal sum of generators, each with an integer coefficient, so two terms are equal in it exactly when their coefficient lists agree after normalisation. Coefficients are compared by computation, which makes equality in the free group decidable.\n\nThe tactic sends both sides of an equation in an arbitrary additive group into this free group, over generators for the atoms it finds. Because the free group satisfies only the abelian group laws, an equality that holds here holds in every abelian group once the generators are evaluated.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.ab_groups.add_grp.eval","base":"eval","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"Evaluation from the free abelian group add_grp.F into an additive group G, given an environment Γ","status":"ok"},"long":{"text":"The evaluation morphism [[AffineConstructive.tactics.algebra.ab_groups.add_grp.eval]] specialised to the free group [[AffineConstructive.tactics.algebra.ab_groups.add_grp.F]]. Given an additive abelian group G and a list Γ of elements of G, it sends each generator to the corresponding entry of Γ and extends additively, so it is a morphism of groups from the free group to G.\n\nThe `add_grp` tactic uses it as the interpretation of quoted terms: the quoting step finds the atoms of the goal, collects them into Γ, and rewrites each side of the equation as the image under this evaluation of a term of the free group. Since a morphism preserves equality, deciding the equality in the free group settles the original one in G.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.ab_groups.add_grp_tac","base":"add_grp_tac","kind":"ltac","start":13,"body":null,"status":"ok","short":{"text":"Proves an equation in an abelian group by normalising both sides in the free abelian group","status":"ok"},"long":{"text":"The tactic behind the notation `add_grp`. It proves a goal x = y in the carrier of an abelian group written additively, where x and y are built from +, 0 and negation over arbitrary terms of the group. It first finds the group: either the set of the equation is already the carrier of a bundled [[AffineConstructive.interfaces.bundled_algebra.additive_group]], seen through its coercions, or it bundles that set with the +, 0 and negation that resolution finds for it, by [[AffineConstructive.interfaces.bundled_algebra.make_additive_group]]. The tactic fails when neither works.\n\nIt then quotes both sides in a single pass. Each subterm that is not a sum, a zero or a negation becomes a generator, and these are collected in a list Γ of elements of the group. Each side becomes a term of the free abelian group on integer coefficients ([[AffineConstructive.implementations.free.ab_groups.free_add_group]] over [[AffineConstructive.implementations.signed_naturals_integers.SignedNat]], packaged in the module as add_grp.F), whose image under the evaluation morphism determined by Γ is the original side. Sums, zero and negation are carried through the quotation by [[AffineConstructive.theory.bundled_groups.quote_plus]], [[AffineConstructive.theory.bundled_groups.quote_zero]] and [[AffineConstructive.theory.additive_groups.quote_negate_alt]], and generators by [[AffineConstructive.tactics.quote.vars.quote_var]]. By [[AffineConstructive.tactics.quote.base.quote_equation]], an equality of the two quoted terms in the free group implies the goal, because evaluation is a morphism. The free equality is then decided by computing normal forms, which are finite sequences of integer coefficients, and comparing them. The tactic therefore proves exactly the equations that hold in every abelian group, with the atoms as independent generators, and fails on any other.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.ab_groups.add_grp","base":"add_grp","kind":"tacn","start":14,"body":null,"status":"ok","short":{"text":"Proves a goal that is an equation valid in every additive abelian group","status":"ok"},"long":{"text":"The notation by which proofs call the decision procedure [[AffineConstructive.tactics.algebra.ab_groups.add_grp_tac]]. It takes no arguments. It proves an equation between two expressions of an additive group when the equation follows from the abelian group laws alone, that is, when both sides have the same integer coefficient on each atomic subterm. Otherwise it fails.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphisms","summary":"This file sets up the hierarchy of algebraic structures, each defined as a base-logic class on an affine set. The group-like classes run from [[SemiGroup]] through commutative semigroups, semilattices, monoids, star semigroups and groups to abelian groups ([[AbGroup]]). Each is stated once for a generic operation ∙. Lattices and the additive and multiplicative structures of rings reuse those classes by viewing a set through [[MeetSemigroupOps]], [[JoinSemigroupOps]], [[AdditiveGroupOps]] or [[MultiplicativeGroupOps]]. The ring-like classes are assembled from these parts, from near-rgs through rigs, rngs and rings to [[IntegralDomain]]. An integral domain is nontrivial and has no zero divisors in the par form, x · y = 0 ⊸ x = 0 ⊞ y = 0; [[StrongNoZeroDivisors]] uses the additive or instead. The file closes with the morphism classes: pointed maps, semigroup and monoid morphisms, lattice morphisms and their order-flipping versions through the opposite order, and rg and rig morphisms."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.implementations.nat":{"page":"../../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.implementations.list":{"page":"../../implementations/list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.interfaces.free.generators":{"page":"../../interfaces/free/generators.html","short":"Sets with generators named by naturals, and evaluation morphisms at an environment","summary":"This file sets up the interface for sets with named generators, which the quoting and normalization tactics use. A [[Var]] structure on a set names its generators var 0, var 1, … by the naturals. [[Var_Morphism]] says that a function sends each var n to the n-th entry of an environment list Γ, which makes it the evaluation at Γ of terms over the generators. The two are bundled: [[var_set]] is a set with named generators, and [[var_morphism]] is the set of functions that respect a given environment, with its equality projected from that of functions. The file states definitions only, no theorems; the free structures built on it supply the instances."},"AffineConstructive.interfaces.free.groups":{"page":"../../interfaces/free/groups.html","short":"Free commutative monoids and abelian groups on countably many generators, for the decision tactics","summary":"The file states the interfaces of three free algebraic structures on countably many generators: commutative additive monoids, commutative monoids written multiplicatively, and abelian groups. Each interface has the same three layers. The first is the algebra with named generators and a correct decision procedure for its equality ([[free_additive_monoid.t]] and its siblings). The second is the type of evaluation morphisms into a target algebra, which send the n-th generator to the n-th entry of an environment Γ. The third is the free structure itself, an algebra with generators together with an evaluation into every target for every environment. Only the existence half of the universal property is required. That half is what the quoting and normalisation tactics need: they decide an equation in the free structure and carry the verdict to the target along the evaluation. The file builds on the generic notions of [[has_var]] and [[var_morphism_t]] from interfaces/free/generators.v. Concrete free algebras in implementations/ meet these interfaces."},"AffineConstructive.implementations.free.ab_groups":{"page":"../../implementations/free/ab_groups.html","short":"Free abelian groups as finite sequences of integers, with evaluation at generators","summary":"This file builds the free abelian group on countably many generators, over a model ℤ of the integers whose equality is decidable. It follows the free commutative monoid of `implementations/free/com_monoids.v`. The carrier is the finite sequences of integers [[FinSeq]] with decidable equality, and the generators are the unit sequences [[eval.v]]. For an additive group G and a list of elements Γ, evaluation [[eval.eval]] sends a sequence s to Σᵢ sᵢ · Γᵢ. Here the scalar multiplication is the integer action [[int_action]], where the monoid construction used the action of the naturals. The result [[free_add_group]] shows that evaluation is a morphism of additive monoids that sends the n-th generator to the n-th element of Γ, using 1 · x = x ([[int_action_1_r]]). It provides the free abelian group interface of `interfaces/free/groups.v`."},"AffineConstructive.implementations.signed_naturals_integers":{"page":"../../implementations/signed_naturals_integers.html","short":"The integers as signed naturals pos n | neg n, a model of the integers","summary":"The file builds a concrete model of the integers over any model ℕ of the naturals that has a comparison with difference: the signed naturals, written pos n or neg n, where 0 has two representations, pos 0 and neg 0. Their equality is pulled back from the Grothendieck group of ℕ along the map that sends pos n to n and neg n to −n. So pos x = neg y holds exactly when x = 0 ∧ y = 0, and equality is decided by comparisons in ℕ ([[eq_is_dec]]). Negation, multiplication and addition are defined by cases on the signs, and addition with mixed signs uses the comparison with difference. Each operation is shown to commute with the interpretation map, so the commutative ring laws carry over by [[projected_commutative_ring]]. The extension [[of_ℤ]] of ℕ ⇾ signed naturals along the group completion is surjective, and the retract construction then makes the signed naturals the integers ([[is_integers]]). Bundled as [[ints]], this gives [[SignedNat]] over Nat, with its decidable equality."},"AffineConstructive.theory.additive_groups":{"page":"../../theory/additive_groups.html","short":"Groups, monoids and their morphisms in additive notation","summary":"This file restates the generic group theory of theory/groups.v in the additive notation that rings use. To do so it views a set with +, 0 and − as a group through [[AdditiveGroupOps]]. It gives constructors for the additive semigroup, monoid and group structures, commutative or not, and the coercions among them. It also restates the basic laws under additive names: associativity, commutativity, the identity and inverse laws, the involution and distributivity of negation, [[negate_0]], [[equal_by_zero_sum]] and [[flip_negate]]. For additive semigroup and monoid morphisms it gives preservation of addition, negation and subtraction, together with identities, composites and inverses. [[Build_AdditiveGroup_Morphism]] shows that a map between groups that preserves addition is a monoid morphism. The file closes with simplification rules that cancel zeros and inverses, transport of structure along injections, and the quotation rules for + and −."},"AffineConstructive.logic.dec":{"page":"../../logic/dec.html","short":"Decision functions for affine predicates, and proving decidable propositions by computation","summary":"This file is about affine propositions R x where R has a decision function, meaning a boolean procedure whose answer true gives R x and whose answer false gives its negation. [[dec_spec_by_iff]] moves a decision along an equivalence R x ⧟ P. [[dec_spec_dual]] gives the false answer as a De Morgan normal form of the negation. [[dec_spec_andb]] decides a conjunction by the boolean and of two decisions, with the dual R₁ᗮ ∨ R₂ᗮ on the false branch. [[dec_spec_true]] states the equivalence R x ⧟ (dec R x = true). Its consequence [[dec_true]] proves R x as soon as the decision is strictly equal to true. The implementations of the integers and the Grothendieck group, and the order theory of rings and integers, use [[dec_true]] to settle concrete instances by computation, and the tactic [[decide_relation]] packages that step."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.strip_coercions":{"page":"../strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.quote.base":{"page":"../quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.quote.vars":{"page":"../quote/vars.html","short":"Quoting: discovering a term's atoms, building the environment, quoting atoms as generators","summary":"This file supplies the variables of the quoting framework: how the atoms of a term are found and gathered into an environment Γ, and how an atom is quoted as a generator of a free structure. A trial quotation under the empty class [[AffineConstructive.tactics.quote.vars.QuoteFindEnv]] records every subterm no other rule handles, and [[AffineConstructive.tactics.quote.vars.quote_build_env]] collects those atoms without repetition; [[AffineConstructive.tactics.quote.vars.quote_var]] and [[AffineConstructive.tactics.quote.vars.quote_var_alt]] then quote each atom as var n, for n its position in Γ. The tactic [[AffineConstructive.tactics.quote.vars.quote_equation]] runs the whole pipeline on an affine goal, and [[AffineConstructive.tactics.quote.vars.find_structure_and_quote_equation]] first finds the algebraic structure on the set of an equation. It builds on the quoting relation of quote.base and the generators interface, and the decision procedures for the algebraic theories are built on it."},"AffineConstructive.tactics.quote.onepass":{"page":"../quote/onepass.html","short":"One-pass quoting of an equation into a free structure, without typeclass search","summary":"This file implements a second way to quote an equation into a free structure, for the reflective decision procedures. The quoter in `quote.vars` works by typeclass search in two passes. This one makes a single syntactic walk over the two sides of the goal, which yields a tree for each side and the list Γ of atoms. A fold over each tree then builds the proof term directly from the structure's preservation lemmas, with no search and no retyping. A structure is given as an operation table, each entry a pattern for the operation together with the lemma that says quoting commutes with it. The main tactic, `onepass.quote_equation`, reduces an equation between terms of the goal's carrier to the corresponding equation in the free structure. `quote_onepass_2` and `quote_onepass_3` are its Ltac1 entry points for tables of two and three operations. Nothing in the recorded development uses them yet."},"AffineConstructive.theory.bundled_groups":{"page":"../../theory/bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."}},"constants":null}</script>

ffineConstructive.interfaces.free.groups","name":"eval","kind":"proj","local":false,"m":"free_additive_group","page":"../../interfaces/free/groups.html"},{"s":479,"e":480,"lib":"AffineConstructive.tactics.algebra.ab_groups","name":"F","kind":"def","local":true,"m":"add_grp"},{"s":494,"e":498,"lib":"AffineConstructive.tactics.algebra.ab_groups","name":"eval","kind":"def","local":true,"m":"add_grp"},{"s":624,"e":643,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"make_additive_group","kind":"def","local":false,"page":"../../interfaces/bundled_algebra.html"},{"s":678,"e":690,"lib":"AffineConstructive.tactics.algebra.ab_groups","name":"eval","kind":"def","local":true},{"s":544,"e":577,"lib":"AffineConstructive.tactics.quote.vars","name":"find_structure_and_quote_equation","kind":"ltac","local":false,"page":"../quote/vars.html"},{"s":700,"e":715,"lib":"AffineConstructive.logic.dec","name":"decide_relation","kind":"ltac","local":false,"page":"../../logic/dec.html"},{"s":746,"e":757,"lib":"AffineConstructive.tactics.algebra.ab_groups","name":"add_grp_tac","kind":"ltac","local":true}],"gloss":{"summary":"The file sets up `add_grp`, a decision procedure for equations in an additive (abelian) group. Its free abelian group is the free additive group on the signed naturals (`SignedNat`), and it evaluates that free group into a given group through an environment. The tactic quotes both sides of the goal as words over variables, and the equation is then decided by computing normal forms in the free group. The reasoning rests on the free-group interface and its implementation. This file only connects them to the quoting machinery, so that other files can prove group identities with one tactic.","short":"The add_grp tactic: deciding equations in abelian groups through the free abelian group","items":[{"name":"AffineConstructive.tactics.algebra.ab_groups.add_grp.F","base":"F","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The free abelian group used by add_grp, with signed naturals as coefficients","status":"ok"},"long":{"text":"The free abelian group that serves as the normal form for the `add_grp` decision procedure. It is the implementation `free_add_group` with coefficients in `SignedNat`, the signed natural numbers. An element is a finite formal sum of generators, each with an integer coefficient, so two terms are equal in it exactly when their coefficient lists agree after normalisation. Coefficients are compared by computation, which makes equality in the free group decidable.\n\nThe tactic sends both sides of an equation in an arbitrary additive group into this free group, over generators for the atoms it finds. Because the free group satisfies only the abelian group laws, an equality that holds here holds in every abelian group once the generators are evaluated.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.ab_groups.add_grp.eval","base":"eval","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"Evaluation from the free abelian group add_grp.F into an additive group G, given an environment Γ","status":"ok"},"long":{"text":"The evaluation morphism [[AffineConstructive.tactics.algebra.ab_groups.add_grp.eval]] specialised to the free group [[AffineConstructive.tactics.algebra.ab_groups.add_grp.F]]. Given an additive abelian group G and a list Γ of elements of G, it sends each generator to the corresponding entry of Γ and extends additively, so it is a morphism of groups from the free group to G.\n\nThe `add_grp` tactic uses it as the interpretation of quoted terms: the quoting step finds the atoms of the goal, collects them into Γ, and rewrites each side of the equation as the image under this evaluation of a term of the free group. Since a morphism preserves equality, deciding the equality in the free group settles the original one in G.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.ab_groups.add_grp_tac","base":"add_grp_tac","kind":"ltac","start":13,"body":null,"status":"ok","short":{"text":"Proves an equation in an additive group by checking it in the free abelian group","status":"ok"},"long":{"text":"The tactic behind the `add_grp` notation. It takes a goal that is an equation between two terms of a group, built from +, 0, negation and other subterms. It finds the additive group the equation lives in, assembling one with [[AffineConstructive.interfaces.bundled_algebra.make_additive_group]] when the carrier is only equipped with the operations. It then quotes the goal: each subterm that is not an operation becomes a variable, collected into an environment Γ, a list of elements of G. The two sides become elements of the free abelian group on those variables, related to the original terms by the evaluation morphism [[AffineConstructive.tactics.algebra.ab_groups.add_grp.eval]] into G. The equation is then decided by computing a normal form on each side, an integer coefficient for each variable, and comparing them.\n\nThe tactic proves exactly the equations that hold in every abelian group. It needs no commutativity or associativity rewriting step by step and no cancellation of inverses by hand. A proof uses it when an equation is a consequence of the group axioms alone. When the equation also depends on hypotheses, those must be rewritten in first. The argument it takes is unused; it is there only so that the notation can call it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.ab_groups.add_grp","base":"add_grp","kind":"tacn","start":14,"body":null,"status":"ok","short":{"text":"Proves a goal that is an equation valid in every additive abelian group","status":"ok"},"long":{"text":"The notation by which proofs call the decision procedure [[AffineConstructive.tactics.algebra.ab_groups.add_grp_tac]]. It takes no arguments. It proves an equation between two expressions of an additive group when the equation follows from the abelian group laws alone, that is, when both sides have the same integer coefficient on each atomic subterm. Otherwise it fails.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.implementations.nat":{"page":"../../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.implementations.list":{"page":"../../implementations/list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.interfaces.free.generators":{"page":"../../interfaces/free/generators.html","short":"Sets with generators named by naturals, and evaluation morphisms at an environment","summary":"This file sets up the interface for sets with named generators, which the quoting and normalization tactics use. A [[Var]] structure on a set names its generators var 0, var 1, … by the naturals. [[Var_Morphism]] says that a function sends each var n to the n-th entry of an environment list Γ, which makes it the evaluation at Γ of terms over the generators. The two are bundled: [[var_set]] is a set with named generators, and [[var_morphism]] is the set of functions that respect a given environment, with its equality projected from that of functions. The file states definitions only, no theorems; the free structures built on it supply the instances."},"AffineConstructive.interfaces.free.groups":{"page":"../../interfaces/free/groups.html","short":"Free commutative monoids and abelian groups on countably many generators, for the decision tactics","summary":"The file states the interfaces of three free algebraic structures on countably many generators: commutative additive monoids, commutative monoids written multiplicatively, and abelian groups. Each interface has the same three layers. The first is the algebra with named generators and a correct decision procedure for its equality ([[free_additive_monoid.t]] and its siblings). The second is the type of evaluation morphisms into a target algebra, which send the n-th generator to the n-th entry of an environment Γ. The third is the free structure itself, an algebra with generators together with an evaluation into every target for every environment. Only the existence half of the universal property is required. That half is what the quoting and normalisation tactics need: they decide an equation in the free structure and carry the verdict to the target along the evaluation. The file builds on the generic notions of [[has_var]] and [[var_morphism_t]] from interfaces/free/generators.v. Concrete free algebras in implementations/ meet these interfaces."},"AffineConstructive.implementations.free.ab_groups":{"page":"../../implementations/free/ab_groups.html","short":"Free abelian groups as finite sequences of integers, with evaluation at generators","summary":"This file builds the free abelian group on countably many generators, over a model ℤ of the integers whose equality is decidable. It follows the free commutative monoid of `implementations/free/com_monoids.v`. The carrier is the finite sequences of integers [[FinSeq]] with decidable equality, and the generators are the unit sequences [[eval.v]]. For an additive group G and a list of elements Γ, evaluation [[eval.eval]] sends a sequence s to Σᵢ sᵢ · Γᵢ. Here the scalar multiplication is the integer action [[int_action]], where the monoid construction used the action of the naturals. The result [[free_add_group]] shows that evaluation is a morphism of additive monoids that sends the n-th generator to the n-th element of Γ, using 1 · x = x ([[int_action_1_r]]). It provides the free abelian group interface of `interfaces/free/groups.v`."},"AffineConstructive.implementations.signed_naturals_integers":{"page":"../../implementations/signed_naturals_integers.html","short":"The integers as signed naturals pos n | neg n, a model of the integers","summary":"The file builds a concrete model of the integers over any model ℕ of the naturals that has a comparison with difference: the signed naturals, written pos n or neg n, where 0 has two representations, pos 0 and neg 0. Their equality is pulled back from the Grothendieck group of ℕ along the map that sends pos n to n and neg n to −n. So pos x = neg y holds exactly when x = 0 ∧ y = 0, and equality is decided by comparisons in ℕ ([[eq_is_dec]]). Negation, multiplication and addition are defined by cases on the signs, and addition with mixed signs uses the comparison with difference. Each operation is shown to commute with the interpretation map, so the commutative ring laws carry over by [[projected_commutative_ring]]. The extension [[of_ℤ]] of ℕ ⇾ signed naturals along the group completion is surjective, and the retract construction then makes the signed naturals the integers ([[is_integers]]). Bundled as [[ints]], this gives [[SignedNat]] over Nat, with its decidable equality."},"AffineConstructive.logic.dec":{"page":"../../logic/dec.html","short":"Boolean decision functions for affine relations, and proving their instances by computation","summary":"The file collects lemmas for using a relation R together with a boolean decision function that is correct for it, in the sense of [[IsDec]]: the boolean [[AffineConstructive.interfaces.aprop.dec]] R x is true when R x holds and false when its negation does. [[dec_spec_by_iff]] transports this correctness along an equivalence R x ⧟ P, [[dec_spec_dual]] states the false branch by a De Morgan dual of R x instead of its negation, and [[dec_spec_andb]] combines two decisions by boolean conjunction, giving R₁ x₁ ∧ R₂ x₂ on true and R₁ x₁ᗮ ∨ R₂ x₂ᗮ on false. The main result, [[dec_spec_true]], is the equivalence R x ⧟ (dec R x = true), and the tactic [[decide_relation]] uses it to prove closed instances of a decidable relation by computing the boolean."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.strip_coercions":{"page":"../strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.quote.base":{"page":"../quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.quote.vars":{"page":"../quote/vars.html","short":"Quoting: discovering a term's atoms, building the environment, quoting atoms as generators","summary":"This file supplies the variables of the quoting framework: how the atoms of a term are found and gathered into an environment Γ, and how an atom is quoted as a generator of a free structure. A trial quotation under the empty class [[AffineConstructive.tactics.quote.vars.QuoteFindEnv]] records every subterm no other rule handles, and [[AffineConstructive.tactics.quote.vars.quote_build_env]] collects those atoms without repetition; [[AffineConstructive.tactics.quote.vars.quote_var]] and [[AffineConstructive.tactics.quote.vars.quote_var_alt]] then quote each atom as var n, for n its position in Γ. The tactic [[AffineConstructive.tactics.quote.vars.quote_equation]] runs the whole pipeline on an affine goal, and [[AffineConstructive.tactics.quote.vars.find_structure_and_quote_equation]] first finds the algebraic structure on the set of an equation. It builds on the quoting relation of quote.base and the generators interface, and the decision procedures for the algebraic theories are built on it."},"AffineConstructive.theory.bundled_groups":{"page":"../../theory/bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."}},"constants":null}</script>

alse,"page":"../../implementations/nat/rig.html"},{"s":578,"e":606,"lib":"AffineConstructive.interfaces.free.groups","name":"eval","kind":"proj","local":false,"m":"free_commutative_monoid","page":"../../interfaces/free/groups.html"},{"s":607,"e":608,"lib":"AffineConstructive.tactics.algebra.com_monoids","name":"F","kind":"def","local":true,"m":"com_mon"},{"s":622,"e":626,"lib":"AffineConstructive.tactics.algebra.com_monoids","name":"eval","kind":"def","local":true,"m":"com_mon"},{"s":753,"e":773,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"make_additive_monoid","kind":"def","local":false,"page":"../../interfaces/bundled_algebra.html"},{"s":808,"e":820,"lib":"AffineConstructive.tactics.algebra.com_monoids","name":"eval","kind":"def","local":true},{"s":1007,"e":1030,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"make_commutative_monoid","kind":"def","local":false,"page":"../../interfaces/bundled_algebra.html"},{"s":1065,"e":1077,"lib":"AffineConstructive.tactics.algebra.com_monoids","name":"eval","kind":"def","local":true},{"s":672,"e":705,"lib":"AffineConstructive.tactics.quote.vars","name":"find_structure_and_quote_equation","kind":"ltac","local":false,"page":"../quote/vars.html"},{"s":830,"e":845,"lib":"AffineConstructive.logic.dec","name":"decide_relation","kind":"ltac","local":false,"page":"../../logic/dec.html"},{"s":876,"e":887,"lib":"AffineConstructive.tactics.algebra.com_monoids","name":"add_mon_tac","kind":"ltac","local":true},{"s":923,"e":956,"lib":"AffineConstructive.tactics.quote.vars","name":"find_structure_and_quote_equation","kind":"ltac","local":false,"page":"../quote/vars.html"},{"s":1087,"e":1102,"lib":"AffineConstructive.logic.dec","name":"decide_relation","kind":"ltac","local":false,"page":"../../logic/dec.html"},{"s":1133,"e":1144,"lib":"AffineConstructive.tactics.algebra.com_monoids","name":"com_mon_tac","kind":"ltac","local":true}],"gloss":{"summary":"This file provides the decision procedures `add_mon` and `com_mon`, which prove equations between sums in a commutative additive monoid and between products in a commutative monoid. Each one fixes a free algebra on the naturals as generators: `add_mon.F` is the free commutative additive monoid and `com_mon.F` the free commutative monoid. The tactic reflects both sides of the equation into that free algebra over a list of atoms, then decides the resulting equation by computing normal forms. Its evaluation into the monoid turns that decision back into the original equation. The free algebras come from the free commutative monoid in the implementations, and the reflection machinery comes from the quotation tactics. Other tactic files and the algebraic theory files use these procedures to close routine monoid identities.","short":"Decision procedures for equations in commutative additive and multiplicative monoids","items":[{"name":"AffineConstructive.tactics.algebra.com_monoids.add_mon.F","base":"F","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"The free additive monoid on the natural numbers, the algebra that the add_mon tactic quotes into","status":"ok"},"long":{"text":"The free additive monoid used by the `add_mon` decision procedure, built by `free_add_mon` with the natural numbers of the development as the set of generators. A generator n stands for the n-th entry of an environment, so a term of the free monoid is a sum of variables written as indices.\n\nIt is defined once and used for every additive monoid. Because its equality is decidable and computed on a normal form, an equation between two quoted terms can be checked by evaluation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.com_monoids.add_mon.eval","base":"eval","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"Evaluation from the free additive monoid into an additive monoid M, given an environment Γ in M","status":"ok"},"long":{"text":"The evaluation morphism [[free_additive_monoid.eval]] specialised to the free monoid [[add_mon.F]]. A list Γ of elements of an additive monoid M assigns the n-th entry of Γ to the generator n, and evaluation extends this assignment to a morphism of monoids from the free monoid to M.\n\nIt connects the quoted equation to the original one: quoting replaces each atom of the goal by its index in Γ, and evaluating the quoted terms recovers the goal. An equality proved in the free monoid then transports along this morphism to M.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.com_monoids.com_mon.F","base":"F","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The free commutative monoid on the natural numbers, the algebra that the com_mon tactic quotes into","status":"ok"},"long":{"text":"The free commutative monoid used by the `com_mon` decision procedure, built by `free_com_mon` with the natural numbers of the development as generators. A generator n stands for the n-th entry of an environment, so an element of the free commutative monoid records how many times each variable occurs.\n\nIts equality is decidable and computed on that normal form. Two monoid expressions are therefore equal in every commutative monoid exactly when their quotations have the same normal form, which is what the tactic checks.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.com_monoids.com_mon.eval","base":"eval","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"Evaluation from the free commutative monoid into a commutative monoid M, given an environment Γ in M","status":"ok"},"long":{"text":"The evaluation morphism [[free_commutative_monoid.eval]] specialised to the free commutative monoid [[com_mon.F]]. A list Γ of elements of a commutative monoid M sends generator n to the n-th entry of Γ, and evaluation extends this to a monoid morphism into M.\n\nThe `com_mon` tactic expresses both sides of the goal as evaluations of quoted terms along this morphism. An equality decided in the free commutative monoid then gives the equality in M.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.com_monoids.add_mon_tac","base":"add_mon_tac","kind":"ltac","start":17,"body":null,"status":"ok","short":{"text":"Proves an equation in a commutative additive monoid by reflecting it into the free one and computing","status":"ok"},"long":{"text":"The goal must be an equation between two expressions built from addition and zero in a commutative additive monoid. The tactic finds the monoid in the goal and bundles it with [[AffineConstructive.interfaces.bundled_algebra.make_additive_monoid]]. It then quotes both sides as terms over a list of atoms: these are the subexpressions that are neither sums nor zero. That turns the goal into an equation between the images of two elements of the free commutative additive monoid on the naturals under [[free_additive_monoid.eval]], with the atoms as the environment. Because evaluation is a morphism, the equation holds if the two free elements are equal. Equality in the free algebra is decidable, so the tactic settles it by computing the normal forms.\n\nThe tactic fails if the two normal forms differ: it proves only the equations that hold in every commutative additive monoid, by associativity, commutativity and the zero laws alone. A proof uses it instead of a chain of rewrites when it needs to rearrange or regroup a sum or to drop zeros. The argument it takes is a dummy, there for the notation `add_mon`.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.com_monoids.add_mon","base":"add_mon","kind":"tacn","start":18,"body":null,"status":"ok","short":{"text":"Closes an equation that holds in every commutative additive monoid","status":"ok"},"long":{"text":"The notation for [[AffineConstructive.tactics.algebra.com_monoids.add_mon_tac]], which it calls without arguments. It proves an equation between sums in a commutative additive monoid by normalising both sides in the free commutative additive monoid. It fails when the equation does not follow from associativity, commutativity and the zero laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.com_monoids.com_mon_tac","base":"com_mon_tac","kind":"ltac","start":19,"body":null,"status":"ok","short":{"text":"Proves an equation in a commutative monoid by reflecting it into the free one and computing","status":"ok"},"long":{"text":"This is the multiplicative counterpart of [[AffineConstructive.tactics.algebra.com_monoids.add_mon_tac]]. The goal must be an equation between two expressions built from the operation and unit of a commutative monoid. The tactic finds the monoid and bundles it with [[AffineConstructive.interfaces.bundled_algebra.make_commutative_monoid]]. It then quotes both sides over a list of atoms, as elements of the free commutative monoid on the naturals, and rewrites the goal as an equation between their images under [[free_commutative_monoid.eval]]. It decides the free equation by computing the normal forms.\n\nIt proves exactly the equations that follow from associativity, commutativity and the unit laws, and it fails on any other equation. A proof uses it to rearrange a product without spelling out the rewrites. The argument it takes is a dummy, there for the notation `com_mon`.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.algebra.com_monoids.com_mon","base":"com_mon","kind":"tacn","start":20,"body":null,"status":"ok","short":{"text":"Closes an equation that holds in every commutative monoid","status":"ok"},"long":{"text":"The notation for [[AffineConstructive.tactics.algebra.com_monoids.com_mon_tac]], which it calls without arguments. It proves an equation between products in a commutative monoid by normalising both sides in the free commutative monoid. It fails when the equation does not follow from associativity, commutativity and the unit laws.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.implementations.nat":{"page":"../../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.implementations.list":{"page":"../../implementations/list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.interfaces.free.generators":{"page":"../../interfaces/free/generators.html","short":"Sets with generators named by naturals, and evaluation morphisms at an environment","summary":"This file sets up the interface for sets with named generators, which the quoting and normalization tactics use. A [[Var]] structure on a set names its generators var 0, var 1, … by the naturals. [[Var_Morphism]] says that a function sends each var n to the n-th entry of an environment list Γ, which makes it the evaluation at Γ of terms over the generators. The two are bundled: [[var_set]] is a set with named generators, and [[var_morphism]] is the set of functions that respect a given environment, with its equality projected from that of functions. The file states definitions only, no theorems; the free structures built on it supply the instances."},"AffineConstructive.interfaces.free.groups":{"page":"../../interfaces/free/groups.html","short":"Free commutative monoids and abelian groups on countably many generators, for the decision tactics","summary":"The file states the interfaces of three free algebraic structures on countably many generators: commutative additive monoids, commutative monoids written multiplicatively, and abelian groups. Each interface has the same three layers. The first is the algebra with named generators and a correct decision procedure for its equality ([[free_additive_monoid.t]] and its siblings). The second is the type of evaluation morphisms into a target algebra, which send the n-th generator to the n-th entry of an environment Γ. The third is the free structure itself, an algebra with generators together with an evaluation into every target for every environment. Only the existence half of the universal property is required. That half is what the quoting and normalisation tactics need: they decide an equation in the free structure and carry the verdict to the target along the evaluation. The file builds on the generic notions of [[has_var]] and [[var_morphism_t]] from interfaces/free/generators.v. Concrete free algebras in implementations/ meet these interfaces."},"AffineConstructive.implementations.free.com_monoids":{"page":"../../implementations/free/com_monoids.html","short":"Free commutative monoids as finite sequences of natural-number coefficients","summary":"The file builds the free commutative additive monoid over a naturals type ℕ with decidable equality: its elements are finite sequences of naturals ([[FinSeq]]), the coefficients of the generators, and the n-th generator is the sequence with a single 1 at index n ([[eval.v]]). Given an environment Γ, a list of elements of a monoid X, and an action of the coefficients on X, [[eval.eval]] sends a coefficient sequence s to the sum Γ₀ · s₀ + Γ₁ · s₁ + ⋯. It is shown to be a morphism of additive monoids ([[eval.eval_addmon_mor]]) that sends each generator to the corresponding entry of Γ ([[eval.eval_var]]). With the action of the naturals by repeated addition ([[nat_action]]) this gives [[free_add_mon]], which [[free_com_mon]] repackages as a free commutative monoid through [[free_additive_monoid_as_free_com_mon]]."},"AffineConstructive.logic.dec":{"page":"../../logic/dec.html","short":"Boolean decision functions for affine relations, and proving their instances by computation","summary":"The file collects lemmas for using a relation R together with a boolean decision function that is correct for it, in the sense of [[IsDec]]: the boolean [[AffineConstructive.interfaces.aprop.dec]] R x is true when R x holds and false when its negation does. [[dec_spec_by_iff]] transports this correctness along an equivalence R x ⧟ P, [[dec_spec_dual]] states the false branch by a De Morgan dual of R x instead of its negation, and [[dec_spec_andb]] combines two decisions by boolean conjunction, giving R₁ x₁ ∧ R₂ x₂ on true and R₁ x₁ᗮ ∨ R₂ x₂ᗮ on false. The main result, [[dec_spec_true]], is the equivalence R x ⧟ (dec R x = true), and the tactic [[decide_relation]] uses it to prove closed instances of a decidable relation by computing the boolean."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.strip_coercions":{"page":"../strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.quote.base":{"page":"../quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.quote.vars":{"page":"../quote/vars.html","short":"Quoting: discovering a term's atoms, building the environment, quoting atoms as generators","summary":"This file supplies the variables of the quoting framework: how the atoms of a term are found and gathered into an environment Γ, and how an atom is quoted as a generator of a free structure. A trial quotation under the empty class [[AffineConstructive.tactics.quote.vars.QuoteFindEnv]] records every subterm no other rule handles, and [[AffineConstructive.tactics.quote.vars.quote_build_env]] collects those atoms without repetition; [[AffineConstructive.tactics.quote.vars.quote_var]] and [[AffineConstructive.tactics.quote.vars.quote_var_alt]] then quote each atom as var n, for n its position in Γ. The tactic [[AffineConstructive.tactics.quote.vars.quote_equation]] runs the whole pipeline on an affine goal, and [[AffineConstructive.tactics.quote.vars.find_structure_and_quote_equation]] first finds the algebraic structure on the set of an equation. It builds on the quoting relation of quote.base and the generators interface, and the decision procedures for the algebraic theories are built on it."},"AffineConstructive.theory.bundled_groups":{"page":"../../theory/bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."}},"constants":null}</script>

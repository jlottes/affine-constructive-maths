tesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.notation interfaces.aprop tactics.misc.\n\nLtac rewrite_quantifiers tm :=\n  let inner var body :=\n    let body' := rewrite_quantifiers body in exact body'\n  in\n  lazymatch tm with\n  | ∀ binder : ?A, ?body => let res := eval_under_binder inner binder A body in constr:(all res)\n  | ∃ binder : ?A, ?body => let res := eval_under_binder inner binder A body in constr:(aex res)\n  | apos ?P => constr:(P)\n  end.\n\nLtac change_quantifiers :=\n  progress lazymatch goal with |- ?G => let G' := rewrite_quantifiers G in change (apos G') end.\n","sentences":[{"i":0,"s":0,"e":65,"kind":"vernac","status":"ok","ms":17,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":67,"e":430,"kind":"vernac","status":"ok","ms":11,"messages":["801fd6b831517c7f"],"goals":null},{"i":2,"s":432,"e":555,"kind":"vernac","status":"ok","ms":10,"messages":["070d787e04a6ff08"],"goals":null}],"pp":{"070d787e04a6ff08":"change_quantifiers is defined","239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","7ee0ddd10f8b2374":"[Loading ML file rocq-runtime.plugins.tauto ... done]","801fd6b831517c7f":"rewrite_quantifiers is defined","af331431bd614838":"[Loading ML file rocq-runtime.plugins.firstorder_core (implicit dependency) ... done]"},"defs":[{"kind":"ltac","name":"rewrite_quantifiers","s":72,"e":91},{"kind":"ltac","name":"change_quantifiers","s":437,"e":455}],"refs":[{"s":15,"e":34,"lib":"AffineConstructive.interfaces.notation","name":"","kind":"lib","local":false,"page":"../interfaces/notation.html"},{"s":35,"e":51,"lib":"AffineConstructive.interfaces.aprop","name":"","kind":"lib","local":false,"page":"../interfaces/aprop.html"},{"s":52,"e":64,"lib":"AffineConstructive.tactics.misc","name":"","kind":"lib","local":false,"page":"misc.html"},{"s":402,"e":406,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../interfaces/aprop.html"},{"s":389,"e":392,"lib":"AffineConstructive.interfaces.aprop","name":"aex","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":292,"e":295,"lib":"AffineConstructive.interfaces.aprop","name":"all","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":542,"e":546,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../interfaces/aprop.html"},{"s":139,"e":158,"lib":"AffineConstructive.tactics.change_quantifiers","name":"rewrite_quantifiers","kind":"ltac","local":true},{"s":243,"e":260,"lib":"AffineConstructive.tactics.misc","name":"eval_under_binder","kind":"ltac","local":false,"page":"misc.html"},{"s":340,"e":357,"lib":"AffineConstructive.tactics.misc","name":"eval_under_binder","kind":"ltac","local":false,"page":"misc.html"},{"s":509,"e":528,"lib":"AffineConstructive.tactics.change_quantifiers","name":"rewrite_quantifiers","kind":"ltac","local":true}],"gloss":{"summary":"This file provides a tactic that turns a goal written with the base quantifiers ∀ and ∃ over the proof component of an affine proposition into the proof of one affine proposition, made with the affine quantifiers ∏ and ∐. [[AffineConstructive.tactics.change_quantifiers.rewrite_quantifiers]] works through the nested quantifiers and builds the affine proposition, keeping the bound variables in place. [[AffineConstructive.tactics.change_quantifiers.change_quantifiers]] uses it to restate the goal. The conversion relies only on the fact that the proof components of [[AffineConstructive.interfaces.aprop.all]] and [[AffineConstructive.interfaces.aprop.aex]] are, by definition, the base quantifiers of the proof components. So the new goal is definitionally equal to the old one, and after the change the affine laws of the connectives can rewrite it.","short":"A tactic converting base ∀/∃ goals into affine ∏/∐ propositions","items":[{"name":"AffineConstructive.tactics.change_quantifiers.rewrite_quantifiers","base":"rewrite_quantifiers","kind":"ltac","start":1,"body":null,"status":"ok","short":{"text":"Rebuilds a goal of nested base quantifiers over a proved affine proposition as the matching affine proposition","status":"ok"},"long":{"text":"Given a statement built from the base quantifiers `∀` and `∃` over the proof component of an affine proposition, such as ∀ x, ∃ y, (P x y)⁺, this tactic computes the affine proposition whose proof component it is: here ∏ x, ∐ y, P x y. It goes through the statement from the outside in. At a base universal it builds the affine universal [[AffineConstructive.interfaces.aprop.all]] of the rewritten body, at a base existential the affine existential [[AffineConstructive.interfaces.aprop.aex]], and at a leaf of the form [[AffineConstructive.interfaces.aprop.apos]] P it returns P. The body is rewritten under its binder, so the result can depend on the bound variable.\n\nThe result is a term, not a change to the goal. Its proof component is definitionally equal to the statement it started from, because the proof component of ∏ x, P x is ∀ x, (P x)⁺ and that of ∐ x, P x is ∃ x, (P x)⁺. A statement of any other shape, such as one with a base implication or a conjunction between the quantifiers, makes the tactic fail. It is the engine behind [[AffineConstructive.tactics.change_quantifiers.change_quantifiers]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.change_quantifiers.change_quantifiers","base":"change_quantifiers","kind":"ltac","start":2,"body":null,"status":"ok","short":{"text":"Restates a goal of base quantifiers over a proved affine proposition as the proof of one affine proposition","status":"ok"},"long":{"text":"When the goal is the proof of an affine proposition stated through base quantifiers, ∀ x, ∃ y, (P x y)⁺ for instance, this tactic restates it as the proof of a single affine proposition, (∏ x, ∐ y, P x y)⁺. It computes the new statement with [[AffineConstructive.tactics.change_quantifiers.rewrite_quantifiers]] and replaces the goal by a definitionally equal one, so nothing is proved and no rewriting takes place. It fails when the goal does not have this shape, and also when it would leave the goal unchanged, which happens when the goal has no quantifier to convert.\n\nA proof uses it when a goal arrives with its quantifiers in the base logic but the argument runs in the affine logic. After the change the goal concerns one affine proposition, and the affine laws for ∏ and ∐ can act on it by rewriting.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.aprop":{"page":"../interfaces/aprop.html","short":"Affine propositions Ω, their connectives and quantifiers, and the affine properties of relations","summary":"The file defines Ω, the type of affine propositions: a pair of an affirmation and a refutation in SProp that cannot both hold, together with a classicality field supplied by the kernel. The field is trivial in the constructive kernel and forces decidability in the classical one. It builds the connectives from these pairs: truth and falsity, the additive ∧ and ∨, the tensor ⊠ and the par ⊞, the implication ⊸ carrying its contrapositive, the negation, ⧟, the modalities ! and ?, and the quantifiers ∏ and ∐. On top of these it defines Shulman's classes Decidable, Affirmative and Refutative, De Morgan duals, boolean decision procedures (Dec, IsDec), and the affine properties of relations. Symmetry, transitivity (with ⊠ for the multiplicative form and ∧ for the strong one), antisymmetry, totality and equivalence are each stated as an implication between affine propositions. The laws of these connectives are proved in logic/aprop.v, and the rest of the development is written in this language."},"AffineConstructive.tactics.misc":{"page":"misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

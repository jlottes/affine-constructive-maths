ontradiction | exact _ ] in\n  let rec do_ccl :=\n    try do_atom;\n    repeat (do_intro; try do_atom);\n    solve [ split; do_ccl ] in\n  solve [ do_atom | use_hyps; do_ccl ] ||\n  fail \"Cannot solve this goal\".\n\nTactic Notation \"now\" tactic(t) := t; easy.\n\n(*\nNotation \"'by_easy' '(' P ')'\" := ltac:(\n  let P' := constr:(P) in\n  match type of P' with Ω => set_goal (apos P') | _ => set_goal P' end;\n  easy) (only parsing).\n*)\n","sentences":[{"i":0,"s":0,"e":71,"kind":"vernac","status":"ok","ms":19,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":73,"e":183,"kind":"vernac","status":"ok","ms":11,"messages":["8bdec100b530d4c7"],"goals":null},{"i":2,"s":185,"e":272,"kind":"vernac","status":"ok","ms":10,"messages":["70dadaac8a73f3ce"],"goals":null},{"i":3,"s":274,"e":363,"kind":"vernac","status":"ok","ms":11,"messages":["4ea2f0e54d3f4cbc"],"goals":null},{"i":4,"s":365,"e":500,"kind":"vernac","status":"ok","ms":11,"messages":["9624ae4aa05cc28a"],"goals":null},{"i":5,"s":502,"e":663,"kind":"vernac","status":"ok","ms":11,"messages":["183b3887e30ff648"],"goals":null},{"i":6,"s":665,"e":885,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":7,"s":887,"e":995,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":8,"s":996,"e":1076,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":9,"s":1078,"e":1822,"kind":"vernac","status":"ok","ms":11,"messages":["bd7f9799dceb7357"],"goals":null},{"i":10,"s":1824,"e":1867,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null}],"pp":{"183b3887e30ff648":"sym is defined","239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","4ea2f0e54d3f4cbc":"unfold_sflip is defined","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","70dadaac8a73f3ce":"fold :425,"e":436,"lib":"AffineConstructive.interfaces.aprop","name":"reflexivity","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":543,"e":547,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../interfaces/aprop.html"},{"s":647,"e":656,"lib":"AffineConstructive.interfaces.sprop","name":"ssymmetry","kind":"def","local":false,"page":"../interfaces/sprop.html"},{"s":622,"e":631,"lib":"AffineConstructive.interfaces.sprop","name":"ssymmetry","kind":"def","local":false,"page":"../interfaces/sprop.html"},{"s":561,"e":565,"lib":"AffineConstructive.interfaces.sprop","name":"andl","kind":"proj","local":false,"page":"../interfaces/sprop.html"},{"s":567,"e":575,"lib":"AffineConstructive.interfaces.aprop","name":"symmetry","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":732,"e":736,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../interfaces/aprop.html"},{"s":857,"e":870,"lib":"AffineConstructive.interfaces.sprop","name":"stransitivity","kind":"def","local":false,"page":"../interfaces/sprop.html"},{"s":821,"e":834,"lib":"AffineConstructive.interfaces.sprop","name":"stransitivity","kind":"def","local":false,"page":"../interfaces/sprop.html"},{"s":750,"e":754,"lib":"AffineConstructive.interfaces.sprop","name":"andl","kind":"proj","local":false,"page":"../interfaces/sprop.html"},{"s":779,"e":783,"lib":"AffineConstructive.interfaces.sprop","name":"conj","kind":"constr","local":false,"page":"../interfaces/sprop.html"},{"s":756,"e":768,"lib":"AffineConstructive.interfaces.aprop","name":"transitivity","kind":"def","local":false,"page":"../interfaces/aprop.html"},{"s":941,"e":944,"lib":"AffineConstructive.interfaces.sprop","name":"iff","kind":"def","local":false,"page":"../interfaces/sprop.html"},{"s":975,"e":988,"lib":"AffineConstructive.interfaces.sprop","name":"santisymmetry","kind":"def","local":false,"page":"../interfaces/sprop.html"},{"s":1054,"e":1067,"lib":"AffineConstructive.interfaces.sprop","name":"santisymmetry","kind":"def","local":false,"page":"../interfaces/sprop.html"},{"s":1180,"e":1183,"lib":"AffineConstructive.interfaces.sprop","name":"and","kind":"rec","local":false,"page":"../interfaces/sprop.html"},{"s":1432,"e":1435,"lib":"AffineConstructive.interfaces.sprop","name":"and","kind":"rec","local":false,"page":"../interfaces/sprop.html"},{"kind":"tacn","name":"antisym","s":1012,"e":1021,"lib":"AffineConstructive.tactics.easy","local":true},{"s":458,"e":473,"lib":"AffineConstructive.tactics.easy","name":"fold_complement","kind":"ltac","local":true},{"s":599,"e":614,"lib":"AffineConstructive.tactics.easy","name":"fold_complement","kind":"ltac","local":true},{"s":804,"e":813,"lib":"AffineConstructive.tactics.easy","name":"fold_impl","kind":"ltac","local":true},{"s":1862,"e":1866,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":true}],"gloss":{"summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[AffineConstructive.tactics.easy.refl]], [[AffineConstructive.tactics.easy.sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[AffineConstructive.interfaces.sprop.sreflexivity]] and [[AffineConstructive.interfaces.sprop.stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`.","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","items":[{"name":"AffineConstructive.tactics.easy.fold_complement","base":"fold_complement","kind":"ltac","start":1,"body":null,"status":"ok","short":{"text":"Restates a goal ¬ R (x, y) as membership of (x, y) in the complement of R","status":"ok"},"long":{"text":"When the goal is the negation of a strict relation R at a pair (x, y), this tactic restates it as the complement relation [[AffineConstructive.interfaces.sprop.scomplement]] of R at that pair. The two goals are definitionally equal, so nothing is proved. The change only alters how the goal is presented. With the goal in this form, a law about the complement relation can be applied directly: the reflexivity of the complement, which says that R is irreflexive, or its symmetry. `refl` and `sym` call it before trying the strict laws on a negated goal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.easy.fold_impl","base":"fold_impl","kind":"ltac","start":2,"body":null,"status":"ok","short":{"text":"Restates an implication goal P → Q as the relation impl at the pair (P, Q)","status":"ok"},"long":{"text":"When the goal is an implication between strict propositions, this tactic restates it as the relation [[AffineConstructive.interfaces.sprop.impl]] applied to the pair (P, Q). The two forms are definitionally equal. In the relation form, the goal can be attacked with the transitivity of implication, regarded as a relation on propositions. `trans` uses it to split P → Q into P → Y and Y → Q through an intermediate proposition Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.easy.unfold_sflip","base":"unfold_sflip","kind":"ltac","start":3,"body":null,"status":"ok","short":{"text":"Restates a goal about the converse relation, sflip R (a, b), as R (b, a)","status":"ok"},"long":{"text":"When the goal is the converse [[AffineConstructive.interfaces.sprop.sflip]] of a strict relation R at a pair (a, b), this tactic restates it as R at the swapped pair (b, a). The two forms are definitionally equal. Laws stated for R can then be applied to the goal without first unfolding the converse by hand.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.easy.refl","base":"refl","kind":"ltac","start":4,"body":null,"status":"ok","short":{"text":"Proves R (x, x) by reflexivity, for an affine or a strict relation, or a negated relation by irreflexivity","status":"ok"},"long":{"text":"If the goal is the proof component [[AffineConstructive.interfaces.aprop.apos]] of an affine proposition R (x, x), this tactic closes it with the affine law [[AffineConstructive.interfaces.aprop.reflexivity]]. Otherwise the goal is about a strict relation and the tactic applies [[AffineConstructive.interfaces.sprop.sreflexivity]]. If the goal is a negated relation ¬ R (x, x), it is first restated by `fold_complement`, so that the reflexivity of the complement, the irreflexivity of R, applies. A proof uses it in place of Rocq's own reflexivity tactic because it covers affine relations, strict relations and their negations alike. It is also one of the basic moves of `easy`.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.easy.sym","base":"sym","kind":"ltac","start":5,"body":null,"status":"ok","short":{"text":"Reduces a goal R (x, y) to R (y, x) by symmetry, for affine, strict or negated relations","status":"ok"},"long":{"text":"If the goal is the proof component of an affine proposition R (x, y), this tactic applies the proof half of the implication R (y, x) ⊸ R (x, y) given by [[AffineConstructive.interfaces.aprop.symmetry]], so the remaining goal is R (y, x). For a strict relation it applies [[AffineConstructive.interfaces.sprop.ssymmetry]] in the same way. For a negated relation ¬ R (x, y), it first moves to the complement, so that the symmetry of the complement relation turns the goal into ¬ R (y, x). In each case the goal is reduced to the swapped one rather than closed. Inside `easy` the tactic is followed by trivial, so a hypothesis stating the swapped relation finishes the proof.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.easy.trans","base":"trans","kind":"tacn","start":6,"body":null,"status":"ok","short":{"text":"trans y splits a goal R (x, z) into R (x, y) and R (y, z) by transitivity","status":"ok"},"long":{"text":"The argument y is the intermediate point. If the goal is the proof component of an affine proposition R (x, z), the tactic applies the proof half of the implication R (x, y) ⊠ R (y, z) ⊸ R (x, z) given by [[AffineConstructive.interfaces.aprop.transitivity]]. A proof of a tensor's proof component is a pair of proofs, so the tactic leaves two goals: R (x, y) and R (y, z). For a strict relation it applies [[AffineConstructive.interfaces.sprop.stransitivity]] through y. If the goal is an implication P → Q, it is first restated as the relation [[AffineConstructive.interfaces.sprop.impl]], and the tactic then splits it into P → y and y → Q. The tactic lets a proof name the middle term once, at whichever level the relation lives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.easy.antisym","base":"antisym","kind":"tacn","start":7,"body":null,"also":[8],"status":"ok","short":{"text":"Splits an equation into the two directions of an antisymmetric relation, or an iff into two implications","status":"ok"},"long":{"text":"Without an argument, the tactic splits a goal that is an equivalence of strict propositions into its two implications. Any other goal is taken to be an equality, and the tactic applies [[AffineConstructive.interfaces.sprop.santisymmetry]], leaving the relation in both directions, x related to y and y to x. The relation is found by resolution. The variant `antisym with R` names the relation, which is needed when more than one antisymmetric relation could apply. Examples are an order and its opposite, or two orders on the same carrier.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.easy.easy","base":"easy","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"Closes a goal by reflexivity, symmetry, an assumption, a contradiction, instance resolution, or by splitting conjunctions","status":"ok"},"long":{"text":"`easy` closes goals that need no idea, or it fails with \"Cannot solve this goal\". It is adapted from the tactic of the same name in Rocq's standard library. The difference is that its reflexivity and symmetry steps are [[AffineConstructive.tactics.easy.refl]] and [[AffineConstructive.tactics.easy.sym]], so they work on a strict relation (a statement in `SProp`) and also on the proof component of an affine one. A goal x = x in a set, or R (x, x) for an affine reflexive relation, is therefore closed in the same way as its strict counterpart.\n\nFirst it tries to close the goal outright. It tries, in order: an assumption or a hint (`trivial`); reflexivity; symmetry followed by an assumption, so that R (y, x) in context closes R (x, y); a contradiction among the hypotheses; and resolution of the goal as an instance (`exact _`). This last step lets it discharge a class goal such as a decidability or properness instance. If none of these works, it takes apart every strict conjunction among the hypotheses and checks whether some hypothesis is impossible by inversion. Then it works on the conclusion. It introduces the premises of an implication or universal statement one at a time, splitting conjunctions as they arrive and retrying the direct attempts after each one. It splits a conjunction in the goal and handles each conjunct in the same way.\n\nA proof reaches for `easy`, usually through [[AffineConstructive.tactics.easy.now]], to finish a side condition left by a rewrite or an `apply`, for example a reflexive equality, a hypothesis read in the other direction, or an instance. It does not rewrite or use any affine law, so an affine goal that needs more than reflexivity, symmetry or an assumption is out of its reach.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.easy.now","base":"now","kind":"tacn","start":10,"body":null,"status":"ok","short":{"text":"Runs a tactic, then closes every resulting goal with easy","status":"ok"},"long":{"text":"`now t` runs t and then calls `easy` on every goal t leaves. It fails if any of those goals is not closed. The `easy` used here is the one defined in this file. It is adapted from Rocq's standard tactic of the same name, with the reflexivity and symmetry tactics of this file as basic moves, so it also closes goals that hold by affine or strict reflexivity or symmetry. `easy` first breaks conjunctive hypotheses apart and disposes of absurd ones. It then tries `trivial`, `refl`, `sym` followed by `trivial`, contradiction, and instance resolution, introducing hypotheses and splitting conjunctive goals as it goes. A proof uses `now` to write a step and its routine leftovers as one.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.interfaces.aprop":{"page":"../interfaces/aprop.html","short":"Affine propositions Ω, their connectives and quantifiers, and the affine properties of relations","summary":"The file defines Ω, the type of affine propositions: a pair of an affirmation and a refutation in SProp that cannot both hold, together with a classicality field supplied by the kernel. The field is trivial in the constructive kernel and forces decidability in the classical one. It builds the connectives from these pairs: truth and falsity, the additive ∧ and ∨, the tensor ⊠ and the par ⊞, the implication ⊸ carrying its contrapositive, the negation, ⧟, the modalities ! and ?, and the quantifiers ∏ and ∐. On top of these it defines Shulman's classes Decidable, Affirmative and Refutative, De Morgan duals, boolean decision procedures (Dec, IsDec), and the affine properties of relations. Symmetry, transitivity (with ⊠ for the multiplicative form and ∧ for the strong one), antisymmetry, totality and equivalence are each stated as an implication between affine propositions. The laws of these connectives are proved in logic/aprop.v, and the rest of the development is written in this language."},"AffineConstructive.tactics.misc":{"page":"misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

lazymatch goal with H : t |- _ => fail | _ => pose proof tm end.\n\n\n(** [real_progress tac] runs [tac] and fails if the goal didn't change\n    syntactically (modulo universe instances). Stricter than the built-in\n    [progress], which is fooled by fresh universe metavariables — useful\n    around [change] or other tactics that re-elaborate the goal and refresh\n    its universes without changing its shape. *)\nLtac real_progress tac :=\n  let G := lazymatch goal with |- ?G => G end in\n  tac tt;\n  lazymatch goal with\n  | |- ?G' => tryif constr_eq G G' then fail else idtac\n  end.\n\n\n(** Given a constr [body] under the given [binder] with type [T],\n   runs [tac var body] in a context where the (possibly renamed) binder\n   has been added as the hypothesis [var].\n\n   Returns the constr [ λ binder: T, result ], where [result] is the\n   result of [tac] (via [exact]), but with [var] renamed back to [binder].\n*)\nLtac eval_under_binder tac binder T body :=\n  let var := fresh binder in\n  let body_var := fresh \"body\" in\n  let res := constr:(\n    λ var : T, let body_var := match var with binder => body end in\n    ltac:(\n      let b := eval red in body_var in clear body_var;\n      tac var b\n    )\n  ) in\n  lazymatch res with\n  | λ var : ?T, let _ := ?body in ?result =>\n    constr:(λ binder : T, match binder with var => result end)\n  end.\n\n\nLtac eval_under_let tac binder T defn body :=\n  let var := fresh binder in\n  let body_var := fresh \"body\" in\n  let res := constr:(\n    let var : T := defn in let body_var := match var with binder => body end in\n    ltac:(\n      let b := eval red in body_var in clear body_var;\n      tac var b\n    )\n  ) in\n  lazymatch res with\n  | let var : ?T := ?defn in let _ := ?body in ?result =>\n    constr:(let binder : T := defn in match binder with var => result end)\n  end.\n\n\nLtac eval_under_binder2 tac binder1 T1 binder2 T2 body :=\n  let var1 := fresh binder1 in\n  let var2 := fresh binder2 in\n  let body_var := fresh \"body\" in\n  let res := constr:(\n    λ (var1 : T1) (var2 : T2),\n    let body_var := match var1 with binder1 => match var2 with binder2 => body end end in\n    ltac:(\n      let b := eval red in body_var in clear body_var;\n      tac var1 var2 b\n    )\n  ) in\n  lazymatch res with\n  | λ (var1 : ?T1) (var2 : ?T2), let _ := ?body in ?result =>\n    constr:(λ (binder1 : T1) (binder2 : T2),\n      match binder1 with var1 => match binder2 with var2 => result end end)\n  end.\n\n\n(** Given a constr [body] under the given [binder] with type [T],\n   runs [tac var body] in a context where the (possibly renamed) binder\n   has been added as the hypothesis [var].\n\n   The tactic [tac] is expected to \"return\" via [ exact ( res, body' ) ]\n   where [var] may appear in [body'] but not [res].\n\n   Returns the constr [ (res, λ var: T, body') ], but with [var] renamed\n   back to the original [binder].\n*)\nLtac eval_under_binder_pair tac binder T body :=\n  let res := eval_under_binder tac binder T body in\n  lazymatch res with\n  | λ var : ?T, (?res, ?body) =>  constr:( (res, λ var : T, body) )\n  end.\n","sentences":[{"i":0,"s":0,"e":49,"kind":"vernac","status":"ok","ms":17,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8"],"goals":null},{"i":1,"s":51,"e":113,"kind":"vernac","status":"ok","ms":10,"messages":["53c8321047177fd9"],"goals":null},{"i":2,"s":114,"e":178,"kind":"vernac","status":"ok","ms":10,"messages":["31de155fffaaf8b4"],"goals":null},{"i":3,"s":180,"e":263,"kind":"vernac","status":"ok","ms":11,"messages":["93a032b0f6845dc5"],"goals":null},{"i":4,"s":265,"e":411,"kind":"vernac","status":"ok","ms":11,"messages":["5fb57e21ada1a182"],"goals":null},{"i":5,"s":413,"e":490,"kind":"vernac","status":"ok","ms":10,"messages":["ccfdb2057a1c5e48"],"goals":null},{"i":6,"s":491,"e":545,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":7,"s":547,"e":603,"kind":"vernac","status":"ok","ms":11,"messag rop.html"},{"s":342,"e":349,"lib":"AffineConstructive.interfaces.prop_eq","name":"eq_refl","kind":"constr","local":false,"page":"../interfaces/prop_eq.html"},{"s":379,"e":386,"lib":"AffineConstructive.interfaces.prop_eq","name":"eq_refl","kind":"constr","local":false,"page":"../interfaces/prop_eq.html"},{"s":295,"e":310,"lib":"AffineConstructive.tactics.misc","name":"constr_from_tac","kind":"ltac","local":true},{"s":444,"e":452,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":true},{"s":466,"e":472,"lib":"AffineConstructive.tactics.misc","name":"eunify","kind":"ltac","local":true},{"s":531,"e":542,"lib":"AffineConstructive.tactics.misc","name":"echange_tac","kind":"ltac","local":true},{"s":570,"e":585,"lib":"AffineConstructive.tactics.misc","name":"constr_from_tac","kind":"ltac","local":true},{"s":642,"e":650,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":true},{"s":831,"e":839,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":true},{"s":1026,"e":1034,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":true},{"s":1244,"e":1256,"lib":"AffineConstructive.tactics.misc","name":"sapply_1_tac","kind":"ltac","local":true},{"s":1325,"e":1337,"lib":"AffineConstructive.tactics.misc","name":"sapply_2_tac","kind":"ltac","local":true},{"s":1406,"e":1418,"lib":"AffineConstructive.tactics.misc","name":"sapply_3_tac","kind":"ltac","local":true}],"gloss":{"summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[AffineConstructive.tactics.misc.real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[AffineConstructive.tactics.misc.eval_under_binder]], [[AffineConstructive.tactics.misc.eval_under_let]], [[AffineConstructive.tactics.misc.eval_under_binder2]] and [[AffineConstructive.tactics.misc.eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities.","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","items":[{"name":"AffineConstructive.tactics.misc.get_goal","base":"get_goal","kind":"ltac","start":1,"body":null,"status":"ok","short":{"text":"Returns the current goal as an untyped term","status":"ok"},"long":{"text":"Reads the statement of the current goal and returns it as a term that has not been typechecked, so it can be put into a larger expression and elaborated there. The goal is not changed. This is the first step of [[AffineConstructive.tactics.misc.echange_tac]] and of the `sapply` family, which all need the goal as data before they act on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.unify_goal","base":"unify_goal","kind":"ltac","start":2,"body":null,"status":"ok","short":{"text":"Unifies the current goal with a given term, filling holes on either side","status":"ok"},"long":{"text":"Unifies the goal with the term it is given. Holes on either side are filled by the unifier, and the tactic fails if the two do not match. The goal is not changed except that its holes get instantiated. A proof uses it to commit a partly determined goal to a known shape, or to check that the goal has that shape before going on.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.constr_from_tac","base":"constr_from_tac","kind":"ltac","start":3,"body":null,"status":"ok","short":{"text":"Builds a term of a given type by running a tactic, and returns that term","status":"ok"},"long":{"text":"Takes a type and a tactic, runs the tactic as a proof of the type in a separate goal, and returns the term it built. The current goal is not touched. The other tactics in the file use it to turn tactic work, such as resolving an instance or elaborating a term against an expected shape, into a value they can inspect or use. [[AffineConstructive.tactics.misc.get_instance]] and [[AffineConstructive.tactics.misc.eunify]] are both one-line uses of it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.eunify","base":"eunify","kind":"ltac","start":4,"body":null,"status":"ok","short":{"text":"Elaborates an untyped term by unifying it with a given term, and returns the result","status":"ok"},"long":{"text":"Elaborates an untyped term that may contain holes so that it matches a second, typed term, and returns the elaborated term with the holes filled in. It works by proving that the second term is definitionally equal to itself by reflexivity ([[AffineConstructive.interfaces.prop_eq.eq_refl]]) at the first term. That forces the two to unify, and the filled-in first term is then read back from the proof. The result is the term as written by the caller, with the gaps filled from the target, and not the target itself. [[AffineConstructive.tactics.misc.echange_tac]] uses it with the goal as the target.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.echange_tac","base":"echange_tac","kind":"ltac","start":5,"body":null,"status":"ok","short":{"text":"Restates the goal as a pattern whose holes are filled by unification with the goal","status":"ok"},"long":{"text":"The tactic behind [[AffineConstructive.tactics.misc.echange]]. It reads the goal, elaborates the given pattern against it with [[AffineConstructive.tactics.misc.eunify]], filling the pattern's holes from the goal, and then replaces the goal by the filled-in pattern, which is definitionally equal to it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.echange","base":"echange","kind":"tacn","start":6,"body":null,"status":"ok","short":{"text":"Like change, but the new statement may contain holes, filled from the current goal","status":"ok"},"long":{"text":"Restates the goal in a definitionally equal form, as `change` does. The difference is that the new statement may leave holes, which are filled by unification with the current goal. A proof can then give only the part of the new form that matters, for example an unfolded head or a regrouping, without writing out the sets, functions or instances that the goal already fixes. It is used in place of a plain `change` when spelling those parts out would be long or would require naming arguments that are implicit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.get_instance","base":"get_instance","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"Returns the instance that typeclass resolution finds for a given class","status":"ok"},"long":{"text":"Runs typeclass resolution on the given class and returns the instance it finds as a term, without changing the goal. A tactic uses it when it needs a structure explicitly, for example to pass it as an argument or to inspect it, and not only implicitly as an argument filled in by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.sapply_1_tac","base":"sapply_1_tac","kind":"ltac","start":8,"body":null,"status":"ok","short":{"text":"The tactic behind sapply_1: applies a lemma with one premise left as a new goal","status":"ok"},"long":{"text":"The implementation of [[AffineConstructive.tactics.misc.sapply_1]]. It elaborates the term so that its conclusion matches the goal after exactly one premise. The term's instance arguments are filled by resolution. The term is then applied, leaving that premise as the only new goal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.sapply_2_tac","base":"sapply_2_tac","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"The tactic behind sapply_2: applies a lemma with two premises left as new goals","status":"ok"},"long":{"text":"The implementation of [[AffineConstructive.tactics.misc.sapply_2]]. It works like [[AffineConstructive.tactics.misc.sapply_1_tac]], except that the term's conclusion is matched against the goal after exactly two premises, and those two premises become the new goals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.sapply_3_tac","base":"sapply_3_tac","kind":"ltac","start":10,"body":null,"status":"ok","short":{"text":"The tactic behind sapply_3: applies a lemma with three premises left as new goals","status":"ok"},"long":{"text":"The implementation of [[AffineConstructive.tactics.misc.sapply_3]]. It works like [[AffineConstructive.tactics.misc.sapply_1_tac]], except that the term's conclusion is matched against the goal after exactly three premises, and those three premises become the new goals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.sapply_1","base":"sapply_1","kind":"tacn","start":11,"body":null,"status":"ok","short":{"text":"Applies a lemma to the goal through exactly one premise, leaving it as the new goal","status":"ok"},"long":{"text":"A structured `apply`, where the number of premises the lemma must still take is fixed in advance. The term is elaborated against the shape \"one premise, then the current goal\". Its instance arguments are resolved first, by typeclass resolution, while it is being elaborated. The term is then applied without further typeclass resolution, so the remaining premise becomes a goal and is not attacked by resolution. A proof uses it in place of a plain `apply` when `apply` would guess the wrong number of premises, for instance because the conclusion is itself an implication. It is also used when resolution would run on the premise too early, or would pick the wrong instance because the premise is not yet determined.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.sapply_2","base":"sapply_2","kind":"tacn","start":12,"body":null,"status":"ok","short":{"text":"Applies a lemma to the goal through exactly two premises, leaving them as new goals","status":"ok"},"long":{"text":"The two-premise version of [[AffineConstructive.tactics.misc.sapply_1]]. The term's instance arguments are resolved first, its conclusion is unified with the goal after exactly two premises, and those two premises are left as goals without typeclass resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.sapply_3","base":"sapply_3","kind":"tacn","start":13,"body":null,"status":"ok","short":{"text":"Applies a lemma to the goal through exactly three premises, leaving them as new goals","status":"ok"},"long":{"text":"The three-premise version of [[AffineConstructive.tactics.misc.sapply_1]]. The term's instance arguments are resolved first, its conclusion is unified with the goal after exactly three premises, and those three premises are left as goals without typeclass resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.normalize_proof","base":"normalize_proof","kind":"ltac","start":14,"body":null,"status":"ok","short":{"text":"Proves the goal with a tactic, then closes it with the fully reduced proof term","status":"ok"},"long":{"text":"Runs the given tactic as a proof of the current goal and reduces the term it builds to normal form by lazy evaluation. The goal is then closed with that normal form. The statement proved is the same; only the recorded proof changes. It replaces the indirections the tactic left, such as calls to lemmas and intermediate definitions, by their computed result. A proof reaches for it where the proof term itself matters: when the term will be computed with, or unfolded and compared definitionally, later on.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.learn","base":"learn","kind":"ltac","start":15,"body":null,"status":"ok","short":{"text":"Adds a fact to the context unless a hypothesis of the same statement is already there","status":"ok"},"long":{"text":"Given a proof, adds its statement as a new hypothesis. It fails, leaving the context unchanged, when a hypothesis with exactly that statement is already present. The failure is useful: in an automation loop that keeps deriving consequences of the hypotheses, `learn` makes each fact enter the context only once, and its failure tells the loop that nothing new was found.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.real_progress","base":"real_progress","kind":"ltac","start":16,"body":null,"status":"ok","short":{"text":"Runs a tactic and fails unless the goal changed syntactically, universe instances aside","status":"ok"},"long":{"text":"`real_progress tac` records the goal, runs `tac` (passed as a thunk, so it is applied to the unit value), and then compares the new goal with the old one by syntactic identity. It fails if the two are the same and succeeds otherwise.\n\nThe built-in `progress` counts any change in the goal's term as progress, including fresh universe variables introduced when a tactic such as `change` elaborates the goal again. A tactic can then report progress while leaving the goal's shape unchanged, and a loop that repeats it never stops. `real_progress` ignores such changes, so it is the guard for repeated rewriting and simplification steps that re-elaborate the goal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.eval_under_binder","base":"eval_under_binder","kind":"ltac","start":17,"body":null,"status":"ok","short":{"text":"Runs a term-computing tactic on the body of a binder and abstracts the result over that binder","status":"ok"},"long":{"text":"`eval_under_binder tac binder T body` takes the body of an abstraction over `binder : T`, which may mention the bound variable. It adds a fresh variable of type `T` to the context, renamed if the name is already taken, and calls `tac` with that variable and the body instantiated at it. Inside, `tac` sees an ordinary hypothesis and a closed term, so it can inspect, rewrite or normalise the body as it would any term, and it delivers its answer with `exact`. The tactic returns the λ-abstraction of that answer over the original binder name, so the result reads as the input did and no generated name leaks into it.\n\nIt is how tactics that transform terms go under a λ, and so under the body of a quantifier, without leaving Ltac. File siblings handle a `let` ([[AffineConstructive.tactics.misc.eval_under_let]]) and two binders at once ([[AffineConstructive.tactics.misc.eval_under_binder2]]), and [[AffineConstructive.tactics.misc.eval_under_binder_pair]] builds on it when the computation also returns data that does not depend on the bound variable.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.eval_under_let","base":"eval_under_let","kind":"ltac","start":18,"body":null,"status":"ok","short":{"text":"Runs a tactic on a term under a local definition, and rebuilds the definition around the result","status":"ok"},"long":{"text":"The let-binding form of eval_under_binder. The term given is the body of a local definition `let x : T := d in …`. The tactic puts the defined variable, with its value, into the context under a fresh name, so that it does not clash with existing names. It then runs the given tactic on that variable and the body. The tactic returns its result with `exact`. That result is put back under the same local definition, and the variable gets back its original name. Tactics that transform terms structurally use it to go inside a `let` and continue their work on the body.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.eval_under_binder2","base":"eval_under_binder2","kind":"ltac","start":19,"body":null,"status":"ok","short":{"text":"Runs a tactic on a term under two binders, and rebinds the result under the original names","status":"ok"},"long":{"text":"The two-binder form of eval_under_binder. The term given is the body of a two-argument function. The tactic puts both bound variables into the context under fresh names and runs the given tactic on them and the body. The tactic returns its result with `exact`. That result is wrapped in the same two binders, with their original names restored. Structural tactics use it to work under a binary binder in one step, without peeling off one binder and then the other.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.misc.eval_under_binder_pair","base":"eval_under_binder_pair","kind":"ltac","start":20,"body":null,"status":"ok","short":{"text":"Like eval_under_binder, but the tactic also returns a result independent of the bound variable","status":"ok"},"long":{"text":"`eval_under_binder_pair tac binder T body` works like [[AffineConstructive.tactics.misc.eval_under_binder]], except that `tac` answers with a pair `(res, body')`. Here `body'` is the transformed body and may mention the bound variable, while `res` must not. The tactic returns the pair `(res, λ binder : T, body')`, with only the second component abstracted over the original binder name.\n\nIt serves computations under a binder that produce two things: a new body and a value that lives outside the binder, such as a proof term or the information that a step applied. Because `res` must not depend on the bound variable, it can be extracted from under the λ.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.prop_eq":{"page":"../interfaces/prop_eq.html","short":"Propositional (Leibniz) equality ≡, registered with the kernel in place of the standard one","summary":"The file defines the library's propositional (Leibniz) equality [[eq]], written x ≡ y, with its constructor [[eq_refl]] and its elimination principles into Type, Prop, Set and SProp. The library is built without the standard library, so this equality takes the place of the standard one. The file registers it with the kernel so that Rocq's built-in rewriting and tactics recognise it. Throughout the development, ≡ stands for definitional equality. It is kept separate from the affine equality = of a set, which is an affine proposition and carries a dual."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."}},"constants":null}</script>

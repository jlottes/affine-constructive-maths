topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import abstract_algebra logic.aprop.\nRequire Import rewrite tactics.misc strip_coercions.\n\nDefinition quote `(f:X ⇾ Y) (x:X) (y:Y) : SProp := f x = y.\nDefinition quote_wrap `(f:X ⇾ Y) (P:SProp) := P.\n\nDefinition quote_refl `(f:X ⇾ Y) (x:X) : quote f x (f x) := reflexivity (=) (f x).\n\nLemma quote_equation `(f:X ⇾ Y) {x₁ y₁ x₂ y₂} :\n  quote f x₁ y₁ → quote f x₂ y₂ → (x₁ = x₂ ⊸ y₁ = y₂).\nProof. unfold quote. intros P Q. rew [ <-P | <-Q ]. exact (is_fun f _ _). Qed.\n\nLemma quote_ne `(f:X ⇾ Y) {x₁ y₁ x₂ y₂} :\n  quote f x₁ y₁ → quote f x₂ y₂ → (y₁ ≠ y₂ ⊸ x₁ ≠ x₂).\nProof. intros P Q. exact (contrapositive (quote_equation f P Q)). Qed.\n\nLemma quote_injective `(f:X ⇾ Y) `{!Injective f} {x₁ y₁ x₂ y₂} :\n  quote f x₁ y₁ → quote f x₂ y₂ → (x₁ = x₂ ⧟ y₁ = y₂).\nProof. unfold quote. intros P Q. rew [ <-P | <-Q ]. exact (injective_iff f _ _). Qed.\n\nLemma quote_injective_ne `(f:X ⇾ Y) `{!Injective f} {x₁ y₁ x₂ y₂} :\n  quote f x₁ y₁ → quote f x₂ y₂ → (x₁ ≠ x₂ ⧟ y₁ ≠ y₂).\nProof. intros P Q. exact (contrapositive_iff (quote_injective f P Q)). Qed.\n\nCreate HintDb quote discriminated.\nLtac solve_quote := typeclasses eauto with quote nocore.\n\nTactic Notation \"quote_hint_strip\" tactic(tac) :=\n  let f := lazymatch goal with |- quote ?f _ _ => strip_coercions_or_self f end in tac f.\nLtac quote_unwrap := change (quote_wrap _ ?P) with P.\n\nGlobal Hint Extern 100 (quote ?f _ _) => refine (quote_refl f _) : quote.\n\nGlobal Hint Extern 2 (quote_wrap ?f (apos (_ ⊸ _ = _))) => quote_unwrap; refine (quote_equation f _ _) : quote.\nGlobal Hint Extern 2 (quote_wrap ?f (apos (_ = _ ⊸ _))) => quote_unwrap; refine (quote_equation f _ _) : quote.\n\nGlobal Hint Extern 2 (quote_wrap ?f (apos (_ ⊸ _ ≠ _))) => quote_unwrap; refine (quote_ne f _ _) : quote.\nGlobal Hint Extern 2 (quote_wrap ?f (apos (_ ≠ _ ⊸ _))) => quote_unwrap; refine (quote_ne f _ _) : quote.\n\nGlobal Hint Extern 2 (quote_wrap ?f (apos (_ ⧟ _ = _))) => quote_unwrap; refine (quote_injective f _ _) : quote.\nGlobal Hint Extern 2 (quote_wrap ?f (apos (_ = _ ⧟ _))) => quote_unwrap; refine (quote_injective f _ _) : quote.\n\nGlobal Hint Extern 2 (quote_wrap ?f (apos (_ ⧟ _ ≠ _))) => quote_unwrap; refine (quote_injective_ne f _ _) : quote.\nGlobal Hint Extern 2 (quote_wrap ?f (apos (_ ≠ _ ⧟ _))) => quote_unwrap; refine (quote_injective_ne f _ _) : quote.\n\nLtac quote_source f expr :=\n  lazymatch constr:(ltac:(solve_quote) : quote f expr _) with ?P => P end.\n\nLtac quote_target f expr :=\n  lazymatch constr:(ltac:(solve_quote) : quote f _ expr) with ?P => P end.\n\nLtac quote_wrap f P :=\n  lazymatch constr:(ltac:(solve_quote) : quote_wrap f P) with ?Q => Q end.\n\nLtac quote_injective f :=\n  lazymatch goal with |- apos ?E =>\n    let q := quote_wrap f uconstr:(apos (E ⧟ _)) in\n    simple notypeclasses refine (sprop.andr (aiff_iff_pos q) _);\n    try lazymatch goal with |- proj2 (_, ?b) => change b end\n  end.\n\nLtac quote_ne f :=\n  lazymatch goal with |- apos ?E =>\n    let q := quote_wrap f uconstr:(apos (_ ⊸ E)) in\n    simple notypeclasses refine (aimpl_impl_pos q _)\n  end.\n","sentences":[{"i":0,"s":0,"e":44,"kind":"vernac","status":"ok","ms":30,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":45,"e":97,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":99,"e":158,"kind":"vernac","status":"ok","ms":11,"messages":["4da5c262971429e9"],"goals":null},{"i":3,"s":159,"e":207,"kind":"vernac","status":"ok","ms":10,"messages":["422b0d390c039115"],"goals":null},{"i":4,"s":209,"e":291,"kind":"vernac","status":"ok","ms":16,"messages":["c55fd7764fe06ae9"],"goals":null},{"i":5,"s":293,"e":395,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":{"fg":[{"id":"91","name":null,"hyps":["e35da6b13a20a90a","9525a7d8ee4722f5","a6917ccc0f1a5367","6e14426f1b0edc03","9ce7ed525b4fde9a","c70 ces/aprop.html"},{"s":1721,"e":1729,"lib":"AffineConstructive.tactics.quote.base","name":"quote_ne","kind":"thm","local":true},{"s":1768,"e":1778,"lib":"AffineConstructive.tactics.quote.base","name":"quote_wrap","kind":"def","local":true},{"s":1783,"e":1787,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":1827,"e":1835,"lib":"AffineConstructive.tactics.quote.base","name":"quote_ne","kind":"thm","local":true},{"s":1875,"e":1885,"lib":"AffineConstructive.tactics.quote.base","name":"quote_wrap","kind":"def","local":true},{"s":1890,"e":1894,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":1934,"e":1949,"lib":"AffineConstructive.tactics.quote.base","name":"quote_injective","kind":"thm","local":true},{"s":1988,"e":1998,"lib":"AffineConstructive.tactics.quote.base","name":"quote_wrap","kind":"def","local":true},{"s":2003,"e":2007,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":2047,"e":2062,"lib":"AffineConstructive.tactics.quote.base","name":"quote_injective","kind":"thm","local":true},{"s":2102,"e":2112,"lib":"AffineConstructive.tactics.quote.base","name":"quote_wrap","kind":"def","local":true},{"s":2117,"e":2121,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":2161,"e":2179,"lib":"AffineConstructive.tactics.quote.base","name":"quote_injective_ne","kind":"thm","local":true},{"s":2218,"e":2228,"lib":"AffineConstructive.tactics.quote.base","name":"quote_wrap","kind":"def","local":true},{"s":2233,"e":2237,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":2277,"e":2295,"lib":"AffineConstructive.tactics.quote.base","name":"quote_injective_ne","kind":"thm","local":true},{"s":2382,"e":2387,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":true},{"s":2486,"e":2491,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":true},{"s":2585,"e":2595,"lib":"AffineConstructive.tactics.quote.base","name":"quote_wrap","kind":"def","local":true},{"s":2671,"e":2675,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":2717,"e":2721,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":2767,"e":2777,"lib":"AffineConstructive.interfaces.sprop","name":"andr","kind":"proj","local":false,"page":"../../interfaces/sprop.html"},{"s":2779,"e":2791,"lib":"AffineConstructive.logic.aprop","name":"aiff_iff_pos","kind":"def","local":false,"page":"../../logic/aprop.html"},{"s":2830,"e":2835,"lib":"AffineConstructive.interfaces.prelude","name":"proj2","kind":"proj","local":false,"page":"../../interfaces/prelude.html"},{"s":2912,"e":2916,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":2958,"e":2962,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":3008,"e":3022,"lib":"AffineConstructive.logic.aprop","name":"aimpl_impl_pos","kind":"def","local":false,"page":"../../logic/aprop.html"},{"s":429,"e":432,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../rewrite/rewrite.html"},{"s":798,"e":801,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../rewrite/rewrite.html"},{"s":1245,"e":1268,"lib":"AffineConstructive.tactics.strip_coercions","name":"strip_coercions_or_self","kind":"ltac","local":false,"page":"../strip_coercions.html"},{"s":2367,"e":2378,"lib":"AffineConstructive.tactics.quote.base","name":"solve_quote","kind":"ltac","local":true},{"s":2471,"e":2482,"lib":"AffineConstructive.tactics.quote.base","name":"solve_quote","kind":"ltac","local":true},{"s":2570,"e":2581,"lib":"AffineConstructive.tactics.quote.base","name":"solve_quote","kind":"ltac","local":true},{"s":2695,"e":2705,"lib":"AffineConstructive.tactics.quote.base","name":"ltac:quote_wrap","kind":"ltac","local":true},{"s":2936,"e":2946,"lib":"AffineConstructive.tactics.quote.base","name":"ltac:quote_wrap","kind":"ltac","local":true}],"gloss":{"summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[AffineConstructive.tactics.quote.base.quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[AffineConstructive.tactics.quote.base.quote_refl]] as the fallback. The lemmas [[AffineConstructive.tactics.quote.base.quote_equation]] and [[AffineConstructive.tactics.quote.base.quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[AffineConstructive.tactics.quote.base.quote_injective]] and [[AffineConstructive.tactics.quote.base.quote_injective_ne]] make each of these an equivalence. The tactics [[AffineConstructive.tactics.quote.base.ltac:quote_wrap]], [[AffineConstructive.tactics.quote.base.quote_source]] and [[AffineConstructive.tactics.quote.base.quote_target]] run this search to compute one side of a quoted statement from the other, and [[AffineConstructive.tactics.quote.base.ltac:quote_injective]] and [[AffineConstructive.tactics.quote.base.ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps.","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","items":[{"name":"AffineConstructive.tactics.quote.base.quote","base":"quote","kind":"def","start":2,"body":null,"status":"ok","short":{"text":"The statement f x = y: the term y is a quotation of x under f","status":"ok"},"long":{"text":"For a function f : X ⇾ Y, `quote f x y` holds when f x = y. It is the judgement the quoting tactics search for: given an expression y in Y, find an x in X whose image under f is y (or, given x, compute an expression y equal to f x), so that a statement about images under f can be pulled back to one about X, or pushed forward.\n\nIt is an ordinary proposition of the base logic, not an affine one: a quotation is a fact established once and used as often as needed, and the lemmas of the file take it as a plain hypothesis to turn statements about x₁, x₂ into statements about y₁, y₂. The hint database `quote` supplies its proofs, built up from [[AffineConstructive.tactics.quote.base.quote_refl]] and from the preservation laws registered by later files.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.quote_wrap","base":"quote_wrap","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"A statement P tagged with a function f, marking it as a goal for the quote hints","status":"ok"},"long":{"text":"`quote_wrap f P` is P itself, with the function f carried alongside as a tag. It exists only for proof search. A goal `quote_wrap f P` tells the `quote` hint database which function to quote along, and the hints recognise the shape of P. When P is an implication or an equivalence between an equation or apartness in the source of f and one in its target, they apply [[AffineConstructive.tactics.quote.base.quote_equation]], [[AffineConstructive.tactics.quote.base.quote_ne]], [[AffineConstructive.tactics.quote.base.quote_injective]] or [[AffineConstructive.tactics.quote.base.quote_injective_ne]]. The images on either side are then computed as `quote` goals.\n\nThe definition is transparent, so a term proving `quote_wrap f P` is a proof of P. Two tactics in this file name it. [[AffineConstructive.tactics.quote.base.quote_unwrap]] removes the tag and leaves the bare statement P; the hints call it before they apply one of the four lemmas. [[AffineConstructive.tactics.quote.base.ltac:quote_wrap]] poses `quote_wrap f P` for a statement P with holes, solves it by the quote hints and returns the proof, so the search fills in the side of the statement the caller does not know.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.quote_refl","base":"quote_refl","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"Every x quotes to f x under f","status":"ok"},"long":{"text":"The trivial quotation, by reflexivity of the equality of Y. It is the fallback of the quoting search, tried last: when no finer rule decomposes an expression, its image is left as f x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.quote_equation","base":"quote_equation","kind":"prf","start":5,"body":[6,11],"status":"ok","short":{"text":"If x₁, x₂ quote to y₁, y₂ under f, then x₁ = x₂ implies y₁ = y₂","status":"ok"},"proof":[{"text":"Unfolding the quotations, the hypotheses are the equalities f x₁ = y₁ and f x₂ = y₂, and the goal is that x₁ = x₂ implies y₁ = y₂.","status":"ok","from":0,"to":2},{"text":"Replacing y₁ and y₂ by f x₁ and f x₂ along these equalities leaves x₁ = x₂ implies f x₁ = f x₂. A function preserves equality, so this is [[AffineConstructive.interfaces.set.is_fun]] for f.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.tactics.quote.base.quote_ne","base":"quote_ne","kind":"prf","start":12,"body":[13,16],"status":"ok","short":{"text":"If f x₁ is y₁ and f x₂ is y₂, then y₁ ≠ y₂ implies x₁ ≠ x₂","status":"ok"},"proof":[{"text":"Assume f x₁ = y₁ and f x₂ = y₂. It remains to show that y₁ ≠ y₂ implies x₁ ≠ x₂.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.tactics.quote.base.quote_equation]], the two facts give that x₁ = x₂ implies y₁ = y₂. The claim is the contrapositive of this implication, obtained by passing to duals with [[AffineConstructive.logic.aprop.contrapositive]]: inequality is the dual of equality.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.tactics.quote.base.quote_injective","base":"quote_injective","kind":"prf","start":17,"body":[18,23],"status":"ok","short":{"text":"For injective f, if f x₁ is y₁ and f x₂ is y₂, then x₁ = x₂ if and only if y₁ = y₂","status":"ok"},"proof":[{"text":"Unfold the definition of [[AffineConstructive.tactics.quote.base.quote]] and assume f x₁ = y₁ and f x₂ = y₂. It remains to show that x₁ = x₂ if and only if y₁ = y₂.","status":"ok","from":0,"to":2},{"text":"Rewrite y₁ as f x₁ and y₂ as f x₂, using the two equations. The goal becomes x₁ = x₂ if and only if f x₁ = f x₂.","status":"ok","from":3,"to":3},{"text":"Since f is injective, this is [[AffineConstructive.theory.set.injective_iff]].","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.tactics.quote.base.quote_injective_ne","base":"quote_injective_ne","kind":"prf","start":24,"body":[25,28],"status":"ok","short":{"text":"For injective f, if x₁, x₂ quote to y₁, y₂, then x₁ ≠ x₂ iff y₁ ≠ y₂","status":"ok"},"proof":[{"text":"Under the two quotations, [[AffineConstructive.tactics.quote.base.quote_injective]] gives that x₁ = x₂ if and only if y₁ = y₂. Taking duals of both sides with [[AffineConstructive.logic.aprop.contrapositive_iff]] gives the claim: x₁ ≠ x₂ if and only if y₁ ≠ y₂.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.tactics.quote.base.solve_quote","base":"solve_quote","kind":"ltac","start":30,"body":null,"status":"ok","short":{"text":"Solves a quoting goal by proof search in the `quote` hint database alone","status":"ok"},"long":{"text":"`solve_quote` runs typeclass proof search restricted to the `quote` hint database, without the core hints. Its goals are `quote f x y`, where usually one of x and y is unknown, and `quote_wrap f P`. Other files add hints that push f through the operations it preserves, so the image of a compound term is computed part by part. The last-resort hint, at low priority, closes `quote f x ?y` with [[AffineConstructive.tactics.quote.base.quote_refl]], taking f x itself as the image. The search therefore succeeds whenever the source term is known, and a subterm that no hint covers is left as its literal image.\n\nThe tactic is the search behind [[AffineConstructive.tactics.quote.base.quote_source]], [[AffineConstructive.tactics.quote.base.quote_target]] and [[AffineConstructive.tactics.quote.base.quote_wrap]], and is seldom called directly.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.quote_hint_strip","base":"quote_hint_strip","kind":"tacn","start":31,"body":null,"status":"ok","short":{"text":"Runs a tactic on the map of a quoting goal, with its coercions removed","status":"ok"},"long":{"text":"In a goal `quote f x y`, the tactic `quote_hint_strip tac` takes f, removes the coercions wrapped around it (or keeps f as it is when there are none) and applies tac to the result. Hints in other files use it so that they can recognise the underlying map, for instance a structure-preserving map seen as a bare function of sets. They can then choose the matching quoting lemma without matching on the form of the coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.quote_unwrap","base":"quote_unwrap","kind":"ltac","start":32,"body":null,"status":"ok","short":{"text":"Removes the `quote_wrap` marker from a goal, leaving the bare statement","status":"ok"},"long":{"text":"The marker `quote_wrap f P` is definitionally P. It records the map f that a goal about P is to be quoted along, so that the hints of the `quote` database can match on f and on the shape of P together. `quote_unwrap` changes such a goal back to P. Each of those hints does this first and then applies the quoting lemma that fits.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.quote_source","base":"quote_source","kind":"ltac","start":42,"body":null,"status":"ok","short":{"text":"Given a term x of the source, finds the quoted image y with a proof that f x = y","status":"ok"},"long":{"text":"`quote_source f expr` solves `quote f expr ?y` with [[AffineConstructive.tactics.quote.base.solve_quote]] and returns the proof term. The type of that term names the image y. The image is computed by the quoting hints for f, which push f through the operations it preserves. For any part of expr that no hint covers, the image falls back to f applied to that part. Tactics in other files use it to put an image under f into normal form, for instance before rewriting by a preservation law.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.quote_target","base":"quote_target","kind":"ltac","start":43,"body":null,"status":"ok","short":{"text":"Given a term y of the target, finds an x with a proof that f x = y","status":"ok"},"long":{"text":"`quote_target f expr` solves `quote f ?x expr` with [[AffineConstructive.tactics.quote.base.solve_quote]] and returns the proof term. The type of that term names the source term x. This is the reverse of [[AffineConstructive.tactics.quote.base.quote_source]]: the quoting hints recognise expr as the image under f of a term built from the same operations in the source. It is used when a statement in the target is to be moved back to the source of f.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.ltac:quote_wrap","base":"ltac:quote_wrap","kind":"ltac","start":44,"body":null,"status":"ok","short":{"text":"Solves `quote_wrap f P` by the quote hints and returns the proof, filling in P's holes","status":"ok"},"long":{"text":"Given a function f and a statement P that may contain holes, the tactic runs [[AffineConstructive.tactics.quote.base.solve_quote]] on the goal `quote_wrap f P` and returns the term it builds. The tactic does not touch the current goal; it only builds a term. The hints match the shape of P and apply the matching quoting lemma. The `quote` goals that lemma leaves are then solved by the database, which works out the image under f of a source expression, or the source of a target expression. In the result, the holes of P are replaced by those normal forms.\n\nThis is the shared step behind [[AffineConstructive.tactics.quote.base.ltac:quote_injective]] and [[AffineConstructive.tactics.quote.base.ltac:quote_ne]]. Each poses a statement with one side known and the other a hole, then uses the proof that comes back.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.ltac:quote_injective","base":"ltac:quote_injective","kind":"ltac","start":45,"body":null,"status":"ok","short":{"text":"For injective f, turns an equation or apartness in X into the same between f-images","status":"ok"},"long":{"text":"The goal is an equation x₁ = x₂ or an apartness x₁ ≠ x₂ in the source of an injective f. The tactic asks [[AffineConstructive.tactics.quote.base.ltac:quote_wrap]] for an equivalence between the goal and an unknown statement. The hints answer with [[AffineConstructive.tactics.quote.base.quote_injective]] for an equation and [[AffineConstructive.tactics.quote.base.quote_injective_ne]] for an apartness, and compute the images y₁, y₂ of x₁, x₂ in their normal form, with f pushed through the operations it preserves. The tactic then takes the direction of the equivalence that goes from the target statement to the goal, via [[AffineConstructive.logic.aprop.aiff_iff_pos]], so the new goal is y₁ = y₂ or y₁ ≠ y₂ in Y. Finally it removes the pair projection that this step leaves around the new goal.\n\nA proof uses it to move a question about X into Y along an injective structure-preserving map, for example to prove an identity in X by the corresponding identity of the images, where a decision procedure or the rewriting system can handle it. Because f is injective, the step loses nothing: the new goal is equivalent to the old one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.base.ltac:quote_ne","base":"ltac:quote_ne","kind":"ltac","start":46,"body":null,"status":"ok","short":{"text":"Reduces an apartness in X to one of f-images, or an equation of f-images to one in X","status":"ok"},"long":{"text":"The goal is the conclusion E of an implication whose premise is unknown. The tactic asks [[AffineConstructive.tactics.quote.base.ltac:quote_wrap]] for an implication ending in E and applies it through [[AffineConstructive.logic.aprop.aimpl_impl_pos]], so the new goal is its premise. There are two cases. When E is an apartness x₁ ≠ x₂ in the source of f, the hints apply [[AffineConstructive.tactics.quote.base.quote_ne]], and the new goal is the apartness y₁ ≠ y₂ of the images, computed in normal form. When E is an equation y₁ = y₂ in the target, the hints apply [[AffineConstructive.tactics.quote.base.quote_equation]]: they find x₁, x₂ that f sends to y₁, y₂, and the new goal is x₁ = x₂.\n\nNeither case needs injectivity. The first case is strong extensionality of f: images being apart implies the points are apart. The second is preservation of equality. These are the two halves of one affine implication, so the step needs no more than a function of sets. Unlike [[AffineConstructive.tactics.quote.base.ltac:quote_injective]], the new goal is only sufficient for the old one, not equivalent to it.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.strip_coercions":{"page":"../strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

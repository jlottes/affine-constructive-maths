tive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** One-pass quoting of an equation into a free structure.\n\n  [quote_equation] in [quote.vars] quotes by typeclass search in the [quote]\n  database: a first search with atom placeholders, a loop that extracts the\n  atoms from that partial proof, and a second search that builds the proof.\n  Here a single syntactic walk over the goal produces a tree and the atom\n  list [Γ], and a fold over the tree builds the proof term directly from the\n  preservation lemmas, with no search.\n\n  A structure is described by an operation table. Each operation is a pair\n  - a pattern [fun a₁ … aₙ => op a₁ … aₙ], elaborated at the goal's carrier,\n    so that it is syntactically the operation as it appears in the goal;\n  - a lemma head [fun Γ => let ev := eval Γ in\n      fun x₁ y₁ … xₙ yₙ (p₁ : quote ev x₁ y₁) … (pₙ : quote ev xₙ yₙ) =>\n        (proof of quote ev (op x₁ … xₙ) (op y₁ … yₙ))].\n  Patterns are matched first-order and up to universe instances. Subterms\n  that match no pattern are atoms, identified syntactically.\n\n  Lemma heads are elaborated by Ltac1, which inserts coercions (see\n  [try_all_hyps] for why Ltac2 cannot). [Γ] and [ev] are posed once, so the\n  proof term binds them with [let]; each node of the certificate is the\n  lemma applied to its arguments, obtained by substitution, and the\n  free-side term of each node is read off a template computed once per\n  lemma, so the fold does no retyping. *)\n\nRequire Import prelude.\nRequire Import abstract_algebra logic.aprop nat list.\nRequire Export quote.base quote.vars.\nFrom Ltac2 Require Import Ltac2.\nSet Default Proof Mode \"Classic\".\n\nModule onepass.\n\nLtac2 fail_msg (s : string) : 'a :=\n  Control.throw (Tactic_failure (Some (Message.of_string s))).\n\nLtac2 mk_app (f : constr) (args : constr list) : constr :=\n  match args with\n  | [] => f\n  | _ => Constr.Unsafe.make (Constr.Unsafe.App f (Array.of_list args))\n  end.\n\nLtac2 rec lam_count (t : constr) : int :=\n  match Constr.Unsafe.kind t with\n  | Constr.Unsafe.Lambda _ b => Int.add 1 (lam_count b)\n  | _ => 0\n  end.\n\nLtac2 rec lam_body (n : int) (t : constr) : constr :=\n  if Int.equal n 0 then t else\n  match Constr.Unsafe.kind t with\n  | Constr.Unsafe.Lambda _ b => lam_body (Int.sub n 1) b\n  | _ => fail_msg \"onepass: too few binders\"\n  end.\n\nLtac2 rec prod_body (n : int) (t : constr) : constr :=\n  if Int.equal n 0 then t else\n  match Constr.Unsafe.kind t with\n  | Constr.Unsafe.Prod _ b => prod_body (Int.sub n 1) b\n  | _ => fail_msg \"onepass: too few products\"\n  end.\n\n(** [fun Γ => let ev := e in body] at [Γ := g], [ev := v] *)\nLtac2 inst_env (lam : constr) (g : constr) (v : constr) : constr :=\n  match Constr.Unsafe.kind lam with\n  | Constr.Unsafe.Lambda _ body =>\n      match Constr.Unsafe.kind body with\n      | Constr.Unsafe.LetIn _ _ inner => Constr.Unsafe.substnl [v; g] 0 inner\n      | _ => Constr.Unsafe.substnl [g] 0 body\n      end\n  | _ => fail_msg \"onepass: lemma head is not a function of Γ\"\n  end.\n\n(** First-order matching of [pat], open in the pattern variables\n    [Rel 1 … Rel n], against the closed term [t], up to universe\n    instances. [sub.(k-1)] receives the match of [Rel k]. *)\nLtac2 rec tmatch (n : int) (sub : constr option array) (pat : constr) (t : constr) : bool :=\n  match Constr.Unsafe.kind pat with\n  | Constr.Unsafe.Rel k =>\n      if Int.le k n then\n        match Array.get sub (Int.sub k 1) with\n        | None => Array.set sub (Int.sub k 1) (Some t); true\n        | Some u => Constr.equal u t\n        end\n      else false\n  | Constr.Unsafe.App f args =>\n      match Constr.Unsafe.kind t with\n      | Constr.Unsafe.App g args' =>\n          if Int.equal (Array.length args) (Array.length args')\n          then if tmatch n sub f g then Array.for_all2 (tmatch n sub) args args' else false\n          else false\n      | _ => false\n      end\n  | Constr.Unsafe.Constant c _ =>\n      match Constr.Unsafe.kind t with\n      | Constr.Unsafe.Constant c' _ => Constant.equal c c'\n      | _ => false\n      end\n  | Constr.Unsafe.Ind i _ =>\n      match Constr.Unsafe.kind t with\n      | Constr.Unsafe.Ind i' _ => Ind.equal i i'\n      | _ => false\n      end\n  | Constr.Unsafe.Constructor c _ =>\n      match Constr.Unsafe.kind t with\n      | Constr.Unsafe.Constructor c' _ => Constructor.equal c c'\n      | _ => false\n      end\n  | Constr.Unsafe.Proj p _ c =>\n      match Constr.Unsafe.kind t with\n      (* folded and unfolded forms of a projection are the same operation *)\n      | Constr.Unsafe.Proj p' _ c' =>\n          if Ind.equal (Proj.ind p) (Proj.ind p') then\n            if Int.equal (Proj.index p) (Proj.index p') then tmatch n sub c c' else false\n          else false\n      | _ => false\n      end\n  (* under binders only for closed comparisons, so de Bruijn indices need no shifting *)\n  | Constr.Unsafe.Lambda b c =>\n      match Constr.Unsafe.kind t with\n      | Constr.Unsafe.Lambda b' c' =>\n          if Int.equal n 0 then\n            if tmatch 0 sub (Constr.Binder.type b) (Constr.Binder.type b') then tmatch 0 sub c c' else false\n          else Constr.equal pat t\n      | _ => false\n      end\n  | Constr.Unsafe.Prod b c =>\n      match Constr.Unsafe.kind t with\n      | Constr.Unsafe.Prod b' c' =>\n          if Int.equal n 0 then\n            if tmatch 0 sub (Constr.Binder.type b) (Constr.Binder.type b') then tmatch 0 sub c c' else false\n          else Constr.equal pat t\n      | _ => false\n      end\n  | _ => Constr.equal pat t\n  end.\n\nLtac2 rec head_of (t : constr) : constr :=\n  match Constr.Unsafe.kind t with\n  | Constr.Unsafe.App f _ => head_of f\n  | _ => t\n  end.\n\n(** Atoms are identified up to conversion, as by the search-based quoter,\n    but conversion is only tried between atoms whose heads agree up to\n    universe instances. Conversion also records universe constraints. *)\nLtac2 same_atom (a : constr) (t : constr) : bool :=\n  if Constr.equal a t then true\n  else if tmatch 0 (Array.make 0 None) (head_of a) (head_of t) then Unification.conv_current a t\n  else false.\n\n(** An operation: its pattern body and arity, and its lemma head. *)\nLtac2 Type op := { pat : constr; arity : int; lemma : constr }.\n\nLtac2 rec strip_cast (t : constr) : constr :=\n  match Constr.Unsafe.kind t with\n  | Constr.Unsafe.Cast c _ _ => strip_cast c\n  | _ => t\n  end.\n\n(** a nullary pattern is usually written with an ascription, [(0 : Y)] *)\nLtac2 mk_op (p : constr) (l : constr) : op :=\n  let n := lam_count p in { pat := strip_cast (lam_body n p); arity := n; lemma := l }.\n\n(** the children of [t] if it is an instance of [o] *)\nLtac2 match_op (o : op) (t : constr) : constr list option :=\n  let n := o.(arity) in\n  let sub := Array.make n None in\n  if tmatch n sub (o.(pat)) t then\n    Some (List.map (fun i => Option.get (Array.get sub (Int.sub (Int.sub n i) 1))) (List.seq 0 1 n))\n  else None.\n\nLtac2 Type rec qtree := [ QAtom (int, constr) | QOp (int, qtree list, constr) ].\n\nLtac2 rec find_atom (atoms : constr list) (t : constr) (i : int) : int option :=\n  match atoms with\n  | [] => None\n  | a :: rest => if same_atom a t then Some i else find_atom rest t (Int.add i 1)\n  end.\n\nLtac2 rec first_op (ops : op list) (i : int) (t : constr) : (int * constr list) option :=\n  match ops with\n  | [] => None\n  | o :: rest =>\n      match match_op o t with\n      | Some cs => Some (i, cs)\n      | None => first_op rest (Int.add i 1) t\n      end\n  end.\n\n(** atoms are kept in discovery order *)\nLtac2 rec walk (ops : op list) (atoms : constr list) (t : constr) : qtree * constr list :=\n  match first_op ops 0 t with\n  | Some (i, cs) =>\n      let rec go atoms cs :=\n        match cs with\n        | [] => ([], atoms)\n        | c :: cs =>\n            let (q, atoms) := walk ops atoms c in\n            let (qs, atoms) := go atoms cs in\n            (q :: qs, atoms)\n        end in\n      let (qs, atoms) := go atoms cs in\n      (QOp i qs t, atoms)\n  | None =>\n      match find_atom atoms t 0 with\n      | Some i => (QAtom i t, atoms)\n      | None => (QAtom (List.length atoms) t, List.append atoms [t])\n      end\n  end.\n\nLtac2 rec mk_list (cons : constr) (nil : constr) (l : constr list) : constr :=\n  match l with\n  | [] => nil\n  | a :: rest => mk_app cons [a; mk_list cons nil rest]\n  end.\n\nLtac2 rec mk_nat (n : int) : constr :=\n  if Int.equal n 0 then 'nno.nat_0 else mk_app 'nno.nat_S [mk_nat (Int.sub n 1)].\n\n(** A lemma head instantiated at [Γ] and [ev]: a function of [k] arguments\n    whose conclusion is [quote ev x y]; [xtmpl] is that [x], open in the\n    arguments. With [beta], application substitutes into the body. *)\nLtac2 Type head := { hd : constr; nargs : int; xtmpl : constr; beta : bool }.\n\nLtac2 mk_head (h : constr) (k : int) (beta : bool) : head :=\n  let t := prod_body k (Constr.type h) in\n  match Constr.Unsafe.kind t with\n  | Constr.Unsafe.App _ args =>\n      if Int.equal (Array.length args) 5 then { hd := h; nargs := k; xtmpl := Array.get args 3; beta := beta }\n      else fail_msg \"onepass: lemma conclusion is not [quote f x y]\"\n  | _ => fail_msg \"onepass: lemma conclusion is not [quote f x y]\"\n  end.\n\n(** apply a head to [args] (in binder order): the proof and its free side *)\nLtac2 app_head (h : head) (args : constr list) : constr * constr :=\n  let sub := List.rev args in\n  let p := if h.(beta) then Constr.Unsafe.substnl sub 0 (lam_body (h.(nargs)) (h.(hd)))\n           else mk_app (h.(hd)) args in\n  (p, Constr.Unsafe.substnl sub 0 (h.(xtmpl))).\n\n(** the proof of [quote ev x y], with [x] and [y] *)\nLtac2 rec build (heads : head list) (qvar : head) (t : qtree) : constr * constr * constr :=\n  match t with\n  | QAtom i y => let (p, x) := app_head qvar [mk_nat i; 'sprop.I] in (p, x, y)\n  | QOp i qs y =>\n      let rs := List.map (build heads qvar) qs in\n      let xys := List.flat_map (fun (_, x, y) => [x; y]) rs in\n      let ps := List.map (fun (p, _, _) => p) rs in\n      let (p, x) := app_head (List.nth heads i) (List.append xys ps) in\n      (p, x, y)\n  end.\n\n(** Reduce the goal [apos (l = r)] to [apos (x₁ = x₂)] in the free structure. *)\nLtac2 quote_equation (qev : constr) (qeq : constr) (qvar : constr) (cons : constr) (nil : constr)\n    (ops : (constr * constr) list) : unit :=\n  let ops' := List.map (fun (p, l) => mk_op p l) ops in\n  lazy_match! goal with\n  | [ |- apos (?l = ?r) ] =>\n      let e := lazy_match! goal with [ |- apos ?e ] => e end in\n      let (tl, atoms) := walk ops' [] l in\n      let (tr, atoms) := walk ops' atoms r in\n      let gid := Fresh.in_goal @Γ in\n      Std.pose (Some gid) (mk_list cons nil atoms);\n      let g := Control.hyp gid in\n      let eid := Fresh.in_goal @ev in\n      Std.pose (Some eid) (Constr.Unsafe.substnl [g] 0 (lam_body 1 qev));\n      let v := Control.hyp eid in\n      let heads := List.map (fun o =>\n        let h := inst_env (o.(lemma)) g v in\n        mk_head h (Int.mul 3 (o.(arity))) true) ops' in\n      let qvar := mk_head (inst_env qvar g v) 2 false in\n      let (p, x1, y1) := build heads qvar tl in\n      let (q, x2, y2) := build heads qvar tr in\n      let h := mk_app (inst_env qeq g v) [x1; y1; x2; y2; p; q] in\n      (* the conclusion is the goal itself, not the type unification would\n         infer through [ev]: otherwise the kernel may unfold the free\n         structure's definition when checking against a cast goal *)\n      refine open_constr:(@aimpl_impl_pos _ $e $h _);\n      Control.plus (fun () => Std.clear [eid; gid]) (fun _ => ())\n  | [ |- _ ] => fail_msg \"onepass: goal is not an equation\"\n  end.\n\nEnd onepass.\n\n(** Ltac1 entry points, one per table size. [qev] is [fun Γ => eval Γ];\n    [qeq] and [qvar] are [quote_equation] and [quote_var] at [ev], as lemma\n    heads; [cons], [nil] build [Γ]; each [pᵢ], [lᵢ] is an operation. *)\nLtac quote_onepass_2 qev qeq qvar cons nil p1 l1 p2 l2 :=\n  let f := ltac2:(qev qeq qvar cons nil p1 l1 p2 l2 |-\n    let c x := Option.get (Ltac1.to_constr x) in\n    onepass.quote_equation (c qev) (c qeq) (c qvar) (c cons) (c nil)\n      [(c p1, c l1); (c p2, c l2)]) in\n  f qev qeq qvar cons nil p1 l1 p2 l2.\n\nLtac quote_onepass_3 qev qeq qvar cons nil p1 l1 p2 l2 p3 l3 :=\n  let f := ltac2:(qev qeq qvar cons nil p1 l1 p2 l2 p3 l3 |-\n    let c x := Option.get (Ltac1.to_constr x) in\n    onepass.quote_equation (c qev) (c qeq) (c qvar) (c cons) (c nil)\n      [(c p1, c l1); (c p2, c l2); (c p3, c l3)]) in\n  f qev qeq qvar cons nil p1 l1 p2 l2 p3 l3.\n","sentences":[{"i":0,"s":0,"e":1438,"kind":"vernac","status":"ok","ms":16,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8"],"goals":null},{"i":1,"s":1439,"e":1492,"kind":"vernac","status":"ok","ms":51,"messages":["dce8be94fc52eab6","7f70dd02016b7ca9","63548cfadb7f5b35","7ee0ddd10f8b2374"],"goals":null},{"i":2,"s":1493,"e":1530,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":3,"s":1531,"e":1563,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":1564,"e":1597,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":5,"s":1599,"e":1614,"kind":"vernac","status":"ok","ms":11,"messages":["c30d6ec1ebc374fa"],"goals":null},{"i":6,"s":1616,"e":1714,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":7,"s":1716,"e":1882,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":8,"s":1884,"e":2033,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":9,"s":2035,"e":2262,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals me":"","kind":"lib","local":false,"page":"../../interfaces/prelude.html"},{"s":1454,"e":1470,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"","kind":"lib","local":false,"page":"../../interfaces/abstract_algebra.html"},{"s":1471,"e":1482,"lib":"AffineConstructive.logic.aprop","name":"","kind":"lib","local":false,"page":"../../logic/aprop.html"},{"s":1483,"e":1486,"lib":"AffineConstructive.implementations.nat","name":"","kind":"lib","local":false,"page":"../../implementations/nat.html"},{"s":1487,"e":1491,"lib":"AffineConstructive.implementations.list","name":"","kind":"lib","local":false,"page":"../../implementations/list.html"},{"s":1508,"e":1518,"lib":"AffineConstructive.tactics.quote.base","name":"","kind":"lib","local":false,"page":"base.html"},{"s":1519,"e":1529,"lib":"AffineConstructive.tactics.quote.vars","name":"","kind":"lib","local":false,"page":"vars.html"},{"s":1557,"e":1562,"lib":"Ltac2.Ltac2","name":"","kind":"lib","local":false},{"s":8207,"e":8216,"lib":"AffineConstructive.implementations.nat.nno","name":"nat_0","kind":"constr","local":false,"page":"../../implementations/nat/nno.html"},{"s":8230,"e":8239,"lib":"AffineConstructive.implementations.nat.nno","name":"nat_S","kind":"constr","local":false,"page":"../../implementations/nat/nno.html"},{"s":9555,"e":9562,"lib":"AffineConstructive.interfaces.sprop","name":"I","kind":"constr","local":false,"page":"../../interfaces/sprop.html"},{"s":10169,"e":10173,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":10231,"e":10235,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":11211,"e":11225,"lib":"AffineConstructive.logic.aprop","name":"aimpl_impl_pos","kind":"def","local":false,"page":"../../logic/aprop.html"},{"kind":"ltac","name":"rec","m":"onepass","s":2041,"e":2044,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":2270,"e":2273,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":3137,"e":3140,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":5404,"e":5407,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":6087,"e":6090,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":6846,"e":6849,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":7051,"e":7054,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":7357,"e":7360,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":7977,"e":7980,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":8149,"e":8152,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"rec","m":"onepass","s":9397,"e":9400,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"Type","m":"onepass","s":6764,"e":6768,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"kind":"ltac","name":"Type","m":"onepass","s":8489,"e":8493,"lib":"AffineConstructive.tactics.quote.onepass","local":true},{"s":2220,"e":2228,"lib":"AffineConstructive.tactics.quote.onepass","name":"fail_msg","kind":"ltac","local":true,"m":"onepass"},{"s":2449,"e":2457,"lib":"AffineConstructive.tactics.quote.onepass","name":"fail_msg","kind":"ltac","local":true,"m":"onepass"},{"s":6769,"e":6772,"lib":"AffineConstructive.tactics.quote.onepass","name":"rec","kind":"ltac","local":true,"m":"onepass"},{"s":6975,"e":6984,"lib":"AffineConstructive.tactics.quote.onepass","name":"same_atom","kind":"ltac","local":true,"m":"onepass"},{"s":7196,"e":7204,"lib":"AffineConstructive.tactics.quote.onepass","name":"match_op","kind":"ltac","local":true,"m":"onepass"},{"s":8096,"e":8102,"lib":"AffineConstructive.tactics.quote.onepass","name":"mk_app","kind":"ltac","local":true,"m":"onepass"},{"s":8222,"e":8228,"lib":"AffineConstructive.tactics.quote.onepass","name":"mk_app","kind":"ltac","local":true,"m":"onepass"},{"s":8853,"e":8861,"lib":"AffineConstructive.tactics.quote.onepass","name":"fail_msg","kind":"ltac","local":true,"m":"onepass"},{"s":8920,"e":8928,"lib":"AffineConstructive.tactics.quote.onepass","name":"fail_msg","kind":"ltac","local":true,"m":"onepass"},{"s":12102,"e":12116,"lib":"AffineConstructive.tactics.quote.onepass","name":"quote_equation","kind":"ltac","local":true,"m":"onepass"}],"gloss":{"summary":"This file implements a second way to quote an equation into a free structure, for the reflective decision procedures. The quoter in `quote.vars` works by typeclass search in two passes. This one makes a single syntactic walk over the two sides of the goal, which yields a tree for each side and the list Γ of atoms. A fold over each tree then builds the proof term directly from the structure's preservation lemmas, with no search and no retyping. A structure is given as an operation table, each entry a pattern for the operation together with the lemma that says quoting commutes with it. The main tactic, `onepass.quote_equation`, reduces an equation between terms of the goal's carrier to the corresponding equation in the free structure. `quote_onepass_2` and `quote_onepass_3` are its Ltac1 entry points for tables of two and three operations. Nothing in the recorded development uses them yet.","short":"One-pass quoting of an equation into a free structure, without typeclass search","items":[{"name":"AffineConstructive.tactics.quote.onepass.onepass.fail_msg","base":"fail_msg","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"Fails the tactic with the given message","status":"ok"},"long":{"text":"This raises a tactic failure that carries the string as its error message. Its result type is arbitrary, so it can stand in any branch of a function. The one-pass quoter uses it to report malformed input: a lemma head that is not a function of the atom list, a lemma whose conclusion is not a quotation, a binder count that does not fit the term, or a goal that is not an equation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.mk_app","base":"mk_app","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"Applies a term to a list of arguments as raw syntax, without type checking","status":"ok"},"long":{"text":"This builds the application of a term to a list of arguments directly as a term, and returns the term unchanged when the list is empty. No typing or elaboration takes place. The quoter assembles its proof certificate, the atom list and its numerals this way, because each piece is well typed by construction and retyping it would cost time for nothing.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.rec","base":"rec","kind":"ltac","start":8,"body":null,"also":[9,10,12,13,16,20,21,22,23,24,28],"status":"ok","short":{"text":"The quoter's recursive helpers: binder stripping, pattern matching, the walk over the goal, the fold into a proof","status":"ok"},"long":{"text":"This item groups the recursive functions of the one-pass quoter. `lam_count` counts the leading binders of a function, and `lam_body` and `prod_body` strip a given number of leading binders or products, failing if there are too few. `head_of` returns the head of an application. `strip_cast` removes type ascriptions. `mk_list` builds a list term from its two constructors, and `mk_nat` builds the numeral of a natural number from [[AffineConstructive.implementations.nat.nno.nat_0]] and [[AffineConstructive.implementations.nat.nno.nat_S]].\n\n`tmatch` is the matcher. It matches a pattern whose variables are the first n de Bruijn indices against a closed term, recording the match of each variable in an array; a variable seen a second time must match a syntactically equal term. Constants, inductives and constructors are compared up to universe instances. A primitive projection matches another of the same record and field, so its folded and unfolded forms count as the same operation. Binders are compared only when the comparison is closed, which spares the matcher any shifting of indices.\n\n`walk` turns a term into a quoted tree. `first_op` tries the operations of the table in order. When one matches, the term becomes an operation node and the walk goes into its children; when none matches, the term is an atom, and `find_atom` looks it up in the list of atoms found so far, appending it if it is new, so atoms keep the order of discovery. `build` folds a tree into a proof. An atom becomes the variable lemma applied to its index and the trivial proof [[AffineConstructive.interfaces.sprop.I]]. An operation node becomes its lemma applied to the free-side and goal-side terms of its children, followed by their proofs. Each node returns its proof together with the free-structure term x and the goal term y it relates.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.inst_env","base":"inst_env","kind":"ltac","start":11,"body":null,"status":"ok","short":{"text":"Instantiates a lemma head at the posed atom list Γ and its evaluation ev","status":"ok"},"long":{"text":"A lemma head in an operation table is a function of the atom list Γ whose body usually opens with a local definition of the evaluation ev. Given the local hypotheses the quoter has posed for Γ and ev, this replaces the bound Γ and ev in the head with those hypotheses. The certificate therefore refers to one shared Γ and one shared ev instead of repeating the list and its evaluation at every node. When the head has no local definition, only Γ is substituted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.same_atom","base":"same_atom","kind":"ltac","start":14,"body":null,"status":"ok","short":{"text":"Decides whether two subterms are the same atom: syntactically equal, or convertible with matching heads","status":"ok"},"long":{"text":"Two subterms are the same atom when they are syntactically equal. Failing that, they are compared up to conversion, as in the search-based quoter, but only when their heads agree up to universe instances; this keeps the cost of conversion off pairs that cannot be equal. A successful conversion also records the universe constraints it needs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.Type","base":"Type","kind":"ltac","start":15,"body":null,"also":[19,25],"status":"ok","short":{"text":"The quoter's data types: operations, quoted trees, and prepared lemma heads","status":"ok"},"long":{"text":"This item groups three types. An `op` is one operation of a structure's table: the body of its pattern, the pattern's arity, and the lemma head saying that quotation commutes with the operation. A `qtree` is a quoted term. It is either an atom, with its index in the atom list and the original subterm, or an operation node, with the operation's index in the table, the trees of its children and the original subterm. A `head` is a lemma head instantiated at Γ and ev. It records the number of arguments the head takes, a template for the free-structure side x of its conclusion, which mentions those arguments, and a flag saying whether to apply the head by substitution into its body or by forming an application.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.mk_op","base":"mk_op","kind":"ltac","start":17,"body":null,"status":"ok","short":{"text":"Builds an operation from a pattern function and a lemma head","status":"ok"},"long":{"text":"This turns a pattern, a function of the operation's arguments, into its body and its arity, and pairs them with the lemma head. It strips a type ascription from the body, because a nullary pattern is usually written with one so that it is elaborated at the goal's carrier.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.match_op","base":"match_op","kind":"ltac","start":18,"body":null,"status":"ok","short":{"text":"Matches a term against an operation's pattern, returning its children in argument order if it matches","status":"ok"},"long":{"text":"This matches the term first-order against the pattern body of the operation. On success it returns the subterms bound to the pattern's variables, in the order of the operation's arguments, which reverses the order of the de Bruijn indices. These subterms are the children the walk descends into. When the term does not match, it returns nothing.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.mk_head","base":"mk_head","kind":"ltac","start":26,"body":null,"status":"ok","short":{"text":"Prepares an instantiated lemma head: its argument count and the template of the free side of its conclusion","status":"ok"},"long":{"text":"This takes a lemma head already instantiated at Γ and ev, together with its number of arguments. It looks past those arguments in the head's type to its conclusion, which must be a quotation relating a free-structure term x to a goal term y, and records x as a template that mentions the arguments. The quoter computes this template once per lemma. Each node of the certificate then reads its own free-side term off the template by substitution, without inferring the type of the node. A conclusion of any other shape makes the tactic fail.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.app_head","base":"app_head","kind":"ltac","start":27,"body":null,"status":"ok","short":{"text":"Applies a prepared lemma head to arguments, giving the proof and its free-side term","status":"ok"},"long":{"text":"This applies a prepared head to its arguments, given in binder order. When the head's flag is set, the arguments are substituted into the body of the head, so each node of the certificate is the lemma's proof already reduced at its arguments. Otherwise an application is formed; the variable lemma is applied this way. The free-side term of the result comes from substituting the same arguments into the head's template.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.onepass.quote_equation","base":"quote_equation","kind":"ltac","start":29,"body":null,"status":"ok","short":{"text":"Reduces a goal l = r to the corresponding equation between quoted terms of the free structure","status":"ok"},"long":{"text":"The goal must be a proof of an equation l = r on the carrier of some structure; any other goal fails. The tactic walks l and then r against the operation table, with one atom list for both sides, and poses that list as Γ and its evaluation as ev. It instantiates each operation's lemma head at Γ and ev; an operation of arity n takes, for each child, a free-side term, a goal-side term and a proof relating them. It instantiates the variable lemma the same way. Folding each tree gives a proof that a free-structure term x₁ quotes l and one that x₂ quotes r. Applied to these two proofs, the equation lemma yields an affine implication from the equation x₁ = x₂ in the free structure to l = r. The tactic refines the goal with it through [[AffineConstructive.logic.aprop.aimpl_impl_pos]], so the remaining goal is the free-structure equation. Γ and ev are then cleared if nothing depends on them.\n\nThe implication is stated with the goal itself as its conclusion, not with the type that unification would infer through ev. Otherwise the kernel may unfold the free structure's definition when it checks the proof against a cast goal. The tactic does what the search-based quoter of `quote.vars` does, with a single syntactic walk and a direct fold in place of two typeclass searches.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.quote_onepass_2","base":"quote_onepass_2","kind":"ltac","start":31,"body":null,"status":"ok","short":{"text":"Quotes an equation goal into a free structure described by two operations","status":"ok"},"long":{"text":"This is the Ltac1 entry point to the one-pass quoter for a structure with two operations. It takes the evaluation as a function of Γ; the equation lemma and the variable lemma as lemma heads at ev; the two list constructors used to build Γ; and a pattern and a lemma head for each operation. It passes them to `onepass.quote_equation`. The arguments are elaborated by Ltac1, which inserts the coercions the lemma heads need, something Ltac2 elaboration cannot do.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.onepass.quote_onepass_3","base":"quote_onepass_3","kind":"ltac","start":32,"body":null,"status":"ok","short":{"text":"Quotes an equation goal into a free structure described by three operations","status":"ok"},"long":{"text":"This is the Ltac1 entry point to the one-pass quoter for a structure with three operations. Its arguments are those of `quote_onepass_2` with a third pattern and lemma head: the evaluation as a function of Γ, the equation and variable lemmas as heads at ev, the list constructors for Γ, and a pattern and a lemma head for each operation. Ltac1 elaborates them, inserting coercions, and they are passed on to `onepass.quote_equation`.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.prelude":{"page":"../../interfaces/prelude.html","short":"The prelude: global settings, basic types and term-building notations replacing the standard library","summary":"This file stands in for Rocq's standard library. It declares the type and function scopes and loads the Ltac, number-notation and firstorder plugins. It also turns on the global settings the rest of the development relies on: primitive projections, universe polymorphism with cumulative inductives, and keyed unification. It sets up the `core` and `typeclass_instances` hint databases. It then defines the basic types from scratch: the empty type with [[abort]] and [[dep_abort]], [[unit]] (which also serves as a trivially satisfied class), [[bool]], the product [[tprod]], the dependent sum [[tsig]], the disjoint union [[tsum]], and [[ssig]], whose elements are points paired with a proof-irrelevant property. Last come the identity function, currying and uncurrying, and a few notations that build terms by running a tactic."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphisms","summary":"This file sets up the hierarchy of algebraic structures, each defined as a base-logic class on an affine set. The group-like classes run from [[SemiGroup]] through commutative semigroups, semilattices, monoids, star semigroups and groups to abelian groups ([[AbGroup]]). Each is stated once for a generic operation ∙. Lattices and the additive and multiplicative structures of rings reuse those classes by viewing a set through [[MeetSemigroupOps]], [[JoinSemigroupOps]], [[AdditiveGroupOps]] or [[MultiplicativeGroupOps]]. The ring-like classes are assembled from these parts, from near-rgs through rigs, rngs and rings to [[IntegralDomain]]. An integral domain is nontrivial and has no zero divisors in the par form, x · y = 0 ⊸ x = 0 ⊞ y = 0; [[StrongNoZeroDivisors]] uses the additive or instead. The file closes with the morphism classes: pointed maps, semigroup and monoid morphisms, lattice morphisms and their order-flipping versions through the opposite order, and rg and rig morphisms."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.implementations.nat":{"page":"../../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.implementations.list":{"page":"../../implementations/list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.tactics.quote.base":{"page":"base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.quote.vars":{"page":"vars.html","short":"Quoting: discovering a term's atoms, building the environment, quoting atoms as generators","summary":"This file supplies the variables of the quoting framework: how the atoms of a term are found and gathered into an environment Γ, and how an atom is quoted as a generator of a free structure. A trial quotation under the empty class [[AffineConstructive.tactics.quote.vars.QuoteFindEnv]] records every subterm no other rule handles, and [[AffineConstructive.tactics.quote.vars.quote_build_env]] collects those atoms without repetition; [[AffineConstructive.tactics.quote.vars.quote_var]] and [[AffineConstructive.tactics.quote.vars.quote_var_alt]] then quote each atom as var n, for n its position in Γ. The tactic [[AffineConstructive.tactics.quote.vars.quote_equation]] runs the whole pipeline on an affine goal, and [[AffineConstructive.tactics.quote.vars.find_structure_and_quote_equation]] first finds the algebraic structure on the set of an equation. It builds on the quoting relation of quote.base and the generators interface, and the decision procedures for the algebraic theories are built on it."},"Ltac2.Ltac2":{"page":null,"short":null,"summary":null}},"constants":null}</script>

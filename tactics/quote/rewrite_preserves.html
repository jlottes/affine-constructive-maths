ounterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import abstract_algebra.\nRequire Import tactics.misc rewrite.\nRequire Export quote.base.\n\nDefinition quote_tag `(f:X ⇾ Y) x := f x.\nDefinition unfold_quote {X Y} {f : X ⇾ Y} {x y} (q : quote f x y) : f x = y := q.\n\n(** Recursively walk the marks + tagged term from [match_tag_on_subterms],\n    replacing each [quote_tag f x] with [arewrite_tag_l (quote_source f x)]\n    when [quote_source] produces a non-trivial equation, or leaving the tag\n    as-is (with [skip_match]) for [quote_refl] results.\n\n    Must be called inside [constr:(ltac:(...))] since it returns via [exact]. *)\nLtac quote_replace_tags marks tm :=\n  lazymatch marks with\n  | found_match =>\n      exact (mark found_match tm)\n  | mark skip_match ?ms =>\n      lazymatch tm with\n      | (fun (binder : ?T) => ?body) (@quote_tag ?X ?Y ?ff ?x) =>\n          let q := quote_source ff x in\n          let inner := eval_under_binder\n            ltac:(fun _ b => quote_replace_tags ms b) binder T body in\n          lazymatch inner with (fun binder' : ?T => mark ?ms' ?body') =>\n            lazymatch q with\n            | quote_refl _ _ =>\n                exact (mark (mark skip_match ms')\n                  ((fun binder' : T => body') (quote_tag ff x)))\n            | _ =>\n                exact (mark (mark found_match ms')\n                  ((fun binder' : T => body') (arewrite_tag_l (unfold_quote q))))\n            end\n          end\n      end\n  end.\n\n(** Tag tactic for [goal_rewrite]: finds all [f ?x] subterms via\n    [match_tag_on_subterms], expands structure-preserving properties\n    via [quote_source], and produces the swapped tag pair. *)\nLtac quote_tag_tac f tm :=\n  let tagged := match_tag_on_subterms uconstr:(quote_tag f _) tag_done tm in\n  lazymatch tagged with mark ?m ?t =>\n    let r := constr:(ltac:(quote_replace_tags m t)) in\n    lazymatch r with mark ?m' ?t' =>\n      swap_tags uconstr:(quote_tag f _) m' t'\n    end\n  end.\n\n(** Rewrite occurrences of [f ?x] in the goal or a hypothesis, expanding\n    any structure preserving properties of [f] (e.g., [f(a+b) = f a + f b]). *)\nTactic Notation \"rewrite_preserves\" uconstr(f) :=\n  goal_rewrite ltac:(quote_tag_tac f).\nTactic Notation \"rewrite_preserves\" uconstr(f) \"in\" hyp(H) :=\n  hyp_rewrite H ltac:(quote_tag_tac f).\n\n","sentences":[{"i":0,"s":0,"e":32,"kind":"vernac","status":"ok","ms":29,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":33,"e":69,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":2,"s":70,"e":96,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":3,"s":98,"e":139,"kind":"vernac","status":"ok","ms":11,"messages":["792bda52a7c128a7"],"goals":null},{"i":4,"s":140,"e":221,"kind":"vernac","status":"ok","ms":11,"messages":["6e6159d0b05569c7"],"goals":null},{"i":5,"s":223,"e":1416,"kind":"vernac","status":"ok","ms":11,"messages":["e51af43444704f79"],"goals":null},{"i":6,"s":1418,"e":1908,"kind":"vernac","status":"ok","ms":11,"messages":["0620a8d7e0633d8a"],"goals":null},{"i":7,"s":1910,"e":2151,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":8,"s":2152,"e":2253,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null}],"pp":{"0620a8d7e0633d8a":"quote_tag_tac is defined","239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","6e6159d0b05569c7":" uctive.tactics.quote.base","name":"quote_refl","kind":"def","local":false,"page":"base.html"},{"s":1260,"e":1264,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"mark","kind":"def","local":false,"page":"../rewrite/rewrite.html"},{"s":1266,"e":1270,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"mark","kind":"def","local":false,"page":"../rewrite/rewrite.html"},{"s":1271,"e":1282,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"found_match","kind":"constr","local":false,"page":"../rewrite/rewrite.html"},{"s":1335,"e":1349,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"arewrite_tag_l","kind":"def","local":false,"page":"../rewrite/arewrite.html"},{"s":1351,"e":1363,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"unfold_quote","kind":"def","local":true},{"s":1126,"e":1130,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"mark","kind":"def","local":false,"page":"../rewrite/rewrite.html"},{"s":1132,"e":1136,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"mark","kind":"def","local":false,"page":"../rewrite/rewrite.html"},{"s":1137,"e":1147,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"skip_match","kind":"def","local":false,"page":"../rewrite/rewrite.html"},{"s":1200,"e":1209,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"quote_tag","kind":"def","local":true},{"s":679,"e":683,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"mark","kind":"def","local":false,"page":"../rewrite/rewrite.html"},{"s":684,"e":695,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"found_match","kind":"constr","local":false,"page":"../rewrite/rewrite.html"},{"s":1688,"e":1697,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"quote_tag","kind":"def","local":true},{"s":1742,"e":1746,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"mark","kind":"def","local":false,"page":"../rewrite/rewrite.html"},{"s":1832,"e":1836,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"mark","kind":"def","local":false,"page":"../rewrite/rewrite.html"},{"s":1873,"e":1882,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"quote_tag","kind":"def","local":true},{"kind":"tacn","name":"rewrite_preserves","s":2168,"e":2187,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","local":true},{"s":2216,"e":2227,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"hyp_rewrite","kind":"ltac","local":false,"page":"../rewrite/rewrite.html"},{"s":2236,"e":2249,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"quote_tag_tac","kind":"ltac","local":true}],"gloss":{"summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[AffineConstructive.tactics.quote.rewrite_preserves.quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[AffineConstructive.tactics.quote.rewrite_preserves.quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[AffineConstructive.tactics.quote.rewrite_preserves.quote_tag]] and [[AffineConstructive.tactics.quote.rewrite_preserves.unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality.","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","items":[{"name":"AffineConstructive.tactics.quote.rewrite_preserves.quote_tag","base":"quote_tag","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"The value f x, under a name the rewriter can find: marks an application of f for quoting","status":"ok"},"long":{"text":"The application f x, wrapped in a transparent definition so that a term can carry a visible mark on each occurrence of f applied to an argument. Unfolding gives f x back, so marking changes nothing about the term's meaning.\n\nThe rewriter marks every application of the given map in the goal with this tag. Each marked argument is then quoted under f: the quotation finds a term y with f x = y that pushes f inward through the structure f preserves, so f (a + b) becomes f a + f b. Where the quotation yields only the trivial [[AffineConstructive.tactics.quote.base.quote_refl]], the tag stays and the occurrence is skipped. Elsewhere the tag is swapped for [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_l]] on the equation, and the rewriting system replaces f x by y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.rewrite_preserves.unfold_quote","base":"unfold_quote","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"A quotation of x as y under f is the equality f x = y","status":"ok"},"long":{"text":"Reads a [[AffineConstructive.tactics.quote.base.quote]] certificate as the equality it stands for. A quotation of x as y under f is by definition a proof of f x = y, so this is the identity with the type changed.\n\nThe rewriter uses it to turn the output of the quotation into the equation it hands to [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_l]]. The left side f x is the occurrence to replace and the right side y is the image with f pushed through the structure it preserves.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.rewrite_preserves.quote_replace_tags","base":"quote_replace_tags","kind":"ltac","start":5,"body":null,"status":"ok","short":{"text":"Replaces each tagged occurrence of f x by its quotation equation, marking the occurrences that change","status":"ok"},"long":{"text":"The middle stage of [[AffineConstructive.tactics.quote.rewrite_preserves.rewrite_preserves]]. Its input is what the subterm matcher produces from a term: the term with every occurrence of f x abstracted as a binder applied to the tag [[AffineConstructive.tactics.quote.rewrite_preserves.quote_tag]] f x, together with a stack of markers built from [[AffineConstructive.tactics.rewrite.rewrite.mark]], one marker per occurrence. The tactic walks the abstractions and the stack in step, from the outermost occurrence inward. For each occurrence it computes the quotation of x under f, which is an equality f x = y in which y has the preserved operations of f pushed through to the leaves (for example f(a + b) = f a + f b when f preserves addition).\n\nIf the quotation is trivial, that is the reflexive one [[AffineConstructive.tactics.quote.base.quote_refl]], the occurrence keeps its tag and is marked [[AffineConstructive.tactics.rewrite.rewrite.skip_match]]. Otherwise the tag is replaced by the equation f x = y, read out of the quotation by [[AffineConstructive.tactics.quote.rewrite_preserves.unfold_quote]] and marked as the left side of a rewrite by [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_l]], and the occurrence is marked [[AffineConstructive.tactics.rewrite.rewrite.found_match]]. The result is the rebuilt term with its new marker stack. The tactic returns its result as a term rather than by side effect, so it is run inside a term construction, as [[AffineConstructive.tactics.quote.rewrite_preserves.quote_tag_tac]] does.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.rewrite_preserves.quote_tag_tac","base":"quote_tag_tac","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"Tags every occurrence of f x in a term with its quotation equation, for the generic rewriter","status":"ok"},"long":{"text":"The tagging tactic that [[AffineConstructive.tactics.quote.rewrite_preserves.rewrite_preserves]] hands to the development's generic rewriter. Given a map f and a term, it first locates every subterm of the shape f x and wraps each in the tag [[AffineConstructive.tactics.quote.rewrite_preserves.quote_tag]], recording a marker per occurrence. It then runs [[AffineConstructive.tactics.quote.rewrite_preserves.quote_replace_tags]] on the result, which replaces each occurrence whose quotation is non-trivial by its equation f x = y and marks it selected, and leaves the others marked as skipped. Finally it swaps the tags into the orientation the rewriter expects, so that each selected occurrence is rewritten from f x to y.\n\nIt is not used directly in proofs; it is the parameter that turns the generic rewriter into the rewriter by preservation laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.rewrite_preserves.rewrite_preserves","base":"rewrite_preserves","kind":"tacn","start":7,"body":null,"also":[8],"status":"ok","short":{"text":"Pushes a structure-preserving map f through the terms it is applied to, in the goal or a hypothesis","status":"ok"},"long":{"text":"rewrite_preserves f rewrites the goal by replacing each occurrence of f x by the term obtained from the quotation of x under f: the operations and constants that f is known to preserve are moved outside f, down to the leaves of x, so that f(a + b) becomes f a + f b, f 0 becomes 0, and so on, as far as the instances of preservation for f allow. Occurrences on which nothing is preserved are left alone. Each replacement is justified by the equality f x = y that the quotation provides ([[AffineConstructive.tactics.quote.base.quote]]), and the rewriting goes through the development's affine rewriting system, so it works under the connectives and in any position where the context respects equality of the set.\n\nThe variant rewrite_preserves f in H performs the same rewriting in the hypothesis H instead of the goal. A proof reaches for the tactic in place of a chain of rewrites by individual preservation lemmas when f is applied to a compound expression, or to several, and all of them are to be expanded at once.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.base":{"page":"base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."}},"constants":null}</script>

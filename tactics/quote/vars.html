 ]\n     [ x : X ]\n   returns [ n ] such that [ list_nth Γ n ] is [ x ] *)\nLtac list_index Γ x :=\n  let rec slow Δ n :=\n    lazymatch Δ with\n    | nil => fail \"term \" x \" not in list \" Γ\n    | cons ?y ?Δ' =>\n      let c := test_eq y x in lazymatch c with\n      | true => n\n      | false => slow Δ' (nat_S n)\n      end\n    end in\n  let rec fast Δ n :=\n    lazymatch Δ with\n    | nil => slow Γ nat_0\n    | cons ?y ?Δ' =>\n      lazymatch y with\n      | x => n\n      | _ => fast Δ' (nat_S n)\n      end\n    end in\n  fast Γ nat_0.\n\n\nLtac quote_add_env Γ f quote_tac :=\n  let build_env _ :=\n    let e := fresh \"e\" in intro e;\n    let t := quote_tac f in\n    let rec aux t := lazymatch t with\n    | context C [ quote_find_atom _ ?z ] =>\n         let a := constr:(quote_find_atom f z) in\n         let Q := type of a in\n         let t' := context C [ @abort Q e ] in\n         let Γ' := aux t' in\n         union_list z Γ'\n    | _ => Γ\n    end in\n    let Γ' := aux t in\n    exact Γ'\n  in\n  let T := type of Γ in\n  let t := constr:(ltac:(build_env ltac:(0)) : ∀ e:QuoteFindEnv, T) in\n  lazymatch t with λ _, ?Γ' => constr:(Γ') end.\n\nLtac quote_build_env f quote_tac :=\n  let Y := lazymatch constr:(quote f) with @quote ?X ?Y _ => Y end in\n  quote_add_env constr:(@nil Y) f quote_tac.\n\n\nLtac quote_unfold_list Γ :=\n  lazymatch Γ with nil => Γ | cons _ _ => Γ | _ => let t := eval red in Γ in t end.\n\nLtac quote_var f y := first\n  [ let cf := constr:(f : var_morphism_t _ _) in\n    let vf := lazymatch cf with ?g => g end in\n    let Γ := lazymatch type of vf with var_morphism_t _ ?Γ => quote_unfold_list Γ end in\n    let n := list_index Γ y in\n    refine (quote_var vf n)\n  | let H' := constr:(_ : Var_Morphism _ f) in\n    let H := lazymatch H' with ?H => H end in\n    let Γ := lazymatch type of H with Var_Morphism ?Γ _ => quote_unfold_list Γ end in\n    let n := list_index Γ y in\n    refine (quote_var_alt _ _ (H:=H) n)\n  ].\n\nGlobal Hint Extern 90 (quote _ ?x ?y) => is_evar x; quote_hint_strip (fun f => quote_var f y) : quote.\n\n\nLtac quote_equation ev :=\n    lazymatch goal with |- apos ?E =>\n      let quote_tac f := quote_wrap f uconstr:(apos (_ ⊸ E)) in\n      let ev₀ := ev uconstr:(nil) in\n      let Γ' := quote_build_env ev₀ quote_tac in\n      let Γ := fresh \"Γ\" in pose (Γ := Γ');\n      let evΓ := ev uconstr:(Γ) in\n      let f := fresh \"ev\" in pose (f := evΓ);\n      let H := quote_tac f in\n      refine (sprop.andl H _); clear Γ f\n    end.\n\nLtac find_structure_and_quote_equation structure make ev :=\n  let Y := lazymatch goal with |- apos (_ = _ :> set_T ?Y) => strip_coercions_or_self Y end in\n  let X := fresh \"X\" in\n  lazymatch constr:(ltac:(solve [ exact Y | make Y ] ) : structure) with ?s => pose (X := s) end;\n  quote_equation ltac:(ev X); clear X.\n\n\n","sentences":[{"i":0,"s":0,"e":86,"kind":"vernac","status":"ok","ms":50,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":87,"e":111,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":112,"e":138,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":3,"s":139,"e":170,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":4,"s":172,"e":205,"kind":"vernac","status":"ok","ms":11,"messages":["843aceca6af4c458"],"goals":null},{"i":5,"s":206,"e":234,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":6,"s":236,"e":310,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":{"fg":[{"id":"12","name":null,"hyps":["e35da6b13a20a90a","9525a7d8ee4722f5","b5ca933f572adeeb","433645c1e702fca4"],"ccl":"04919becab05ad31"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":7,"s":311,"e":317,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":{"fg":[{"id":"12","name":null,"hyps":["e35da6b13a20a90a","9525a7d8ee4722f5","b5ca933f572adeeb","433645c1e702fca4"],"ccl":"04919becab ":true},{"s":4023,"e":4046,"lib":"AffineConstructive.tactics.strip_coercions","name":"strip_coercions_or_self","kind":"ltac","local":false,"page":"../strip_coercions.html"},{"s":4180,"e":4194,"lib":"AffineConstructive.tactics.quote.vars","name":"quote_equation","kind":"ltac","local":true}],"gloss":{"summary":"This file supplies the variables of the quoting framework: how the atoms of a term are found and gathered into an environment Γ, and how an atom is quoted as a generator of a free structure. A trial quotation under the empty class [[AffineConstructive.tactics.quote.vars.QuoteFindEnv]] records every subterm no other rule handles, and [[AffineConstructive.tactics.quote.vars.quote_build_env]] collects those atoms without repetition; [[AffineConstructive.tactics.quote.vars.quote_var]] and [[AffineConstructive.tactics.quote.vars.quote_var_alt]] then quote each atom as var n, for n its position in Γ. The tactic [[AffineConstructive.tactics.quote.vars.quote_equation]] runs the whole pipeline on an affine goal, and [[AffineConstructive.tactics.quote.vars.find_structure_and_quote_equation]] first finds the algebraic structure on the set of an equation. It builds on the quoting relation of quote.base and the generators interface, and the decision procedures for the algebraic theories are built on it.","short":"Quoting: discovering a term's atoms, building the environment, quoting atoms as generators","items":[{"name":"AffineConstructive.tactics.quote.vars.QuoteFindEnv","base":"QuoteFindEnv","kind":"def","start":4,"body":null,"status":"ok","short":{"text":"An empty class used as a marker while the quoting tactic searches for the variables of a term","status":"ok"},"long":{"text":"QuoteFindEnv is the empty type, declared as a class. It is never inhabited. It exists so that the variable-discovery pass of the quoting tactic can hypothetically assume an inhabitant e. Under that assumption, any subterm that the quotation hints do not recognise can be quoted as abort e. That quotation is a valid proof term in context, and it marks the subterm as an atom to be collected.\n\nThe tactic quote_add_env runs the quotation under a binder e : QuoteFindEnv. It then reads the resulting proof term for occurrences of [[AffineConstructive.tactics.quote.vars.quote_find_atom]] and gathers the atoms they mark into the environment Γ. Because the type is empty, nothing found this way can leak into a real proof. The second, real quotation runs with no inhabitant in context, so the marker hint does not fire.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.quote_find_atom","base":"quote_find_atom","kind":"prf","start":6,"body":[7,9],"status":"ok","short":{"text":"Under the impossible assumption QuoteFindEnv, any y is a quotation of abort e: the atom-marking hint","status":"ok"},"proof":[{"text":"The class QuoteFindEnv has no instances, so the assumption e is impossible, and an empty case analysis on it proves anything, here that y quotes abort e. The lemma is used for its statement, not its proof: during the trial quotation it marks y as an atom and does not quote it any further.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.tactics.quote.vars.quote_var_alt","base":"quote_var_alt","kind":"prf","start":11,"body":[12,14],"status":"ok","short":{"text":"If f respects the variables for Γ, then var n quotes the n-th entry of Γ, for n in bounds","status":"ok"},"proof":[{"text":"Quoting var n as the n-th entry of Γ means that f sends the generator var n to that entry. This is what it means for f to respect the variables for Γ, stated at an index n within the bounds of Γ, and [[AffineConstructive.interfaces.free.generators.preserves_var]] gives it directly.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.tactics.quote.vars.quote_var","base":"quote_var","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"For f a variable-respecting morphism with environment Γ, var n quotes the n-th entry of Γ","status":"ok"},"long":{"text":"For a function f in [[AffineConstructive.interfaces.free.generators.var_morphism]] X Γ, that is, a function out of a set with named generators that sends each generator to the matching entry of the list Γ, this states that the generator [[AffineConstructive.interfaces.free.generators.var]] n is a quotation, under f, of the n-th entry of Γ, provided n is within the bounds of Γ. It is the bundled form of [[AffineConstructive.tactics.quote.vars.quote_var_alt]], which asks for the property [[AffineConstructive.interfaces.free.generators.Var_Morphism]] as a separate hypothesis; the two differ only in how the variable-respecting structure of f is found.\n\nIt is the base case of quoting: when the quoting tactic meets a term that is not built from the operations of the structure but appears in the environment, it replaces that term by the generator at its position. The tactic [[AffineConstructive.tactics.quote.vars.ltac:quote_var]] applies it, after locating the term in Γ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.test_eq","base":"test_eq","kind":"ltac","start":16,"body":null,"status":"ok","short":{"text":"Returns true if two terms unify and false otherwise","status":"ok"},"long":{"text":"Given two terms, this local helper attempts to unify them and returns the boolean [[AffineConstructive.interfaces.prelude.true]] on success and [[AffineConstructive.interfaces.prelude.false]] on failure, as a value of [[AffineConstructive.interfaces.prelude.bool]]. It leaves no goal behind and can be matched on, which lets a search through a list fall back from syntactic to unification-based comparison. It serves [[AffineConstructive.tactics.quote.vars.union_list]] and [[AffineConstructive.tactics.quote.vars.list_index]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.union_list","base":"union_list","kind":"ltac","start":17,"body":null,"status":"ok","short":{"text":"Adds a term to a list unless the list already contains it","status":"ok"},"long":{"text":"Given a term x and a list Γ, this returns Γ when x already occurs in Γ and x prepended to Γ otherwise. It searches in two passes: first for an entry syntactically identical to x, which is fast, and only if none is found for an entry that unifies with x, through [[AffineConstructive.tactics.quote.vars.test_eq]]. The environment built for quoting thus holds each atom once, up to unification, and two occurrences of the same atom are quoted as the same generator.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.list_index","base":"list_index","kind":"ltac","start":18,"body":null,"status":"ok","short":{"text":"Finds the position of a term in a list, failing if absent","status":"ok"},"long":{"text":"Given a list Γ and a term x, this returns a natural number n such that the n-th entry of Γ is x. Like [[AffineConstructive.tactics.quote.vars.union_list]], it looks first for a syntactically identical entry and then for one that unifies with x, and fails with a message when x is not in the list. It supplies the index that [[AffineConstructive.tactics.quote.vars.ltac:quote_var]] passes to [[AffineConstructive.tactics.quote.vars.quote_var]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.quote_add_env","base":"quote_add_env","kind":"ltac","start":19,"body":null,"status":"ok","short":{"text":"Extends an environment with the atoms a trial quotation of a term discovers","status":"ok"},"long":{"text":"Given a list Γ, an evaluation function f and a quoting tactic, this runs the quoting tactic once in a hypothetical context with an inhabitant of [[AffineConstructive.tactics.quote.vars.QuoteFindEnv]], an empty class. In that context the fallback hint [[AffineConstructive.tactics.quote.vars.quote_find_atom]] applies to any subterm that no other quoting rule handles, recording it as an atom; since the class is empty, the quotation is a valid term only under that impossible hypothesis and is never used as a proof. The tactic then walks the resulting term, collects every recorded atom and adds each to Γ with [[AffineConstructive.tactics.quote.vars.union_list]], returning the extended list.\n\nThis is the discovery pass of quoting: the variables of a term are not known in advance, and the trial run finds them without a separate traversal of the term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.quote_build_env","base":"quote_build_env","kind":"ltac","start":20,"body":null,"status":"ok","short":{"text":"Builds the environment of atoms of a term, starting from the empty list","status":"ok"},"long":{"text":"This is [[AffineConstructive.tactics.quote.vars.quote_add_env]] started from the empty list over the codomain of the evaluation function f, which it reads off the type of [[AffineConstructive.tactics.quote.base.quote]] f. It returns the list of distinct atoms the quoting tactic meets, in the order that fixes which generator stands for which atom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.quote_unfold_list","base":"quote_unfold_list","kind":"ltac","start":21,"body":null,"status":"ok","short":{"text":"Unfolds an environment one step unless it is already a literal list","status":"ok"},"long":{"text":"Given a term Γ standing for a list, this returns it unchanged when it is already the empty list or a cons, and otherwise reduces its head once. The environment of a quotation is introduced as a local definition, so the variable-respecting structure of an evaluation function mentions a name rather than the list itself; this unfolding exposes the entries for [[AffineConstructive.tactics.quote.vars.list_index]] to search.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.ltac:quote_var","base":"ltac:quote_var","kind":"ltac","start":22,"body":null,"status":"ok","short":{"text":"Quotes an atom of the environment as the generator at its position","status":"ok"},"long":{"text":"Given an evaluation function f and a term y, this solves a quotation goal for y by a generator. It first tries to see f as an element of [[AffineConstructive.interfaces.free.generators.var_morphism_t]], reading the environment Γ from its type; failing that, it looks for an instance of [[AffineConstructive.interfaces.free.generators.Var_Morphism]] for f and reads Γ from that. In both cases it unfolds Γ with [[AffineConstructive.tactics.quote.vars.quote_unfold_list]], finds the position n of y with [[AffineConstructive.tactics.quote.vars.list_index]], and applies [[AffineConstructive.tactics.quote.vars.quote_var]] or [[AffineConstructive.tactics.quote.vars.quote_var_alt]] at n.\n\nIt is registered as a quoting hint, tried after the rules for the operations of the structure and before the atom-recording fallback, on goals whose quoted side is still to be determined; coercions around f are stripped first. Proofs do not call it directly.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.quote_equation","base":"quote_equation","kind":"ltac","start":24,"body":null,"status":"ok","short":{"text":"Replaces an affine goal by its quotation in a free structure over the goal's atoms","status":"ok"},"long":{"text":"On a goal asking for a proof of an affine proposition E, and given a function ev that builds an evaluation morphism from an environment, this carries out the whole quoting pipeline. It builds ev over the empty environment and makes a trial quotation of the goal with it, collecting the atoms with [[AffineConstructive.tactics.quote.vars.quote_build_env]]; it then names the resulting list Γ, builds the evaluation morphism over Γ, quotes the goal for real, so that each atom becomes the generator at its position, and refines the goal by the left component ([[AffineConstructive.interfaces.sprop.andl]]) of the resulting quotation fact. What remains is the goal restated about the quoted term, an element of a free structure, to be decided by computation on that representation. The local names are cleared at the end.\n\nIt is the entry point of the decision procedures built on quoting: a proof reaches for it, through those procedures, when an equation holds by the laws of an algebraic structure alone and the free structure decides it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.quote.vars.find_structure_and_quote_equation","base":"find_structure_and_quote_equation","kind":"ltac","start":25,"body":null,"status":"ok","short":{"text":"Finds the structure of an equation's set and quotes the equation there","status":"ok"},"long":{"text":"On a goal that is an equality in a set Y, this strips coercions from Y, then finds the algebraic structure in which to quote: either Y itself already has the required structure, or the supplied tactic make builds it from Y. It names that structure X and calls [[AffineConstructive.tactics.quote.vars.quote_equation]] with the evaluation function ev X, clearing X afterwards. Its arguments are the type of structure sought, the tactic that builds one, and the function producing the evaluation morphism from a structure and an environment; the decision procedure for each algebraic theory instantiates it with its own three.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.free.generators":{"page":"../../interfaces/free/generators.html","short":"Sets with generators named by naturals, and evaluation morphisms at an environment","summary":"This file sets up the interface for sets with named generators, which the quoting and normalization tactics use. A [[Var]] structure on a set names its generators var 0, var 1, … by the naturals. [[Var_Morphism]] says that a function sends each var n to the n-th entry of an environment list Γ, which makes it the evaluation at Γ of terms over the generators. The two are bundled: [[var_set]] is a set with named generators, and [[var_morphism]] is the set of functions that respect a given environment, with its equality projected from that of functions. The file states definitions only, no theorems; the free structures built on it supply the instances."},"AffineConstructive.implementations.nat":{"page":"../../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.implementations.list":{"page":"../../implementations/list.html","short":"Lists over a set: the comparison maps between tensor equality and product equality","summary":"This file re-exports the three list modules (the common base, lists with tensor equality and lists with product equality) and compares the two list equalities. On [[TensorList]] X, the element comparisons along two lists are joined by ⊠; on [[ProdList]] X, they are joined by ∧. Since the tensor implies the additive conjunction, the identity on lists is a function [[tensor_to_prod_list]] from tensor lists to product lists, registered as the default cast between them. When X has decidable equality the converse also holds, because there the two conjunctions agree; this gives [[dec_prod_to_tensor_list]], so in that case the two list sets are isomorphic."},"AffineConstructive.tactics.quote.base":{"page":"base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.strip_coercions":{"page":"../strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

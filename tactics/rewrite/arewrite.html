ian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.notation sprop srelations tactics.misc tactics.easy rewrite.proper logic.aprop.\n\nDefinition arewrite_tag_l `{R:A ∗ A → Ω} `(E:R (a, b)) := a.\nDefinition arewrite_tag_r `{R:A ∗ A → Ω} `(E:R (a, b)) := b.\n\nGlobal Hint Unfold arewrite_tag_l : typeclass_instances.\nGlobal Hint Unfold arewrite_tag_r : typeclass_instances.\n\nGlobal Hint Extern 0 (RewriteSwapTag (@arewrite_tag_r ?A ?R ?a ?b ?E))\n  => simple refine (DeclareRewriteSwapTag (@arewrite_tag_l A R a b E)) : rewrite_swap_tag.\nGlobal Hint Extern 0 (RewriteSwapTag (@arewrite_tag_l ?A ?R ?a ?b ?E))\n  => simple refine (DeclareRewriteSwapTag (@arewrite_tag_r A R a b E)) : rewrite_swap_tag.\n\nLocal Ltac debug_msg tac := idtac.\n(* Local Ltac debug_msg tac ::= match goal with |- ?G => tac G end. *)\n\n(** Proves [ R2 (a, b) → R (a, b) ], by finding a [ Subrelation ] instance *)\nLocal Ltac handle_subrel R2 R :=\n  let _ := debug_msg ltac:(fun G => idtac \"handle_subrel\" R2 R G) in\n  lazymatch R2 with\n  | R => solve [ refine (λ E, E) ]\n  | _ => solve [ let S := get_instance (Subrelation R2 R) in simple refine (andl (S (_, _)))\n               | let S := get_instance (sSubrelation (of_course_rel R2) (of_course_rel R)) in simple refine (S (_, _))\n               | let g := get_goal in\n                   idtac \"No Subrelation instance found to show\" g;\n                   fail 1 \"No Subrelation instance found to show\" g ]\n  end.\n\n(** Proves [ R2 (b, a) → R (a, b) ], by applying symmetry and invoking [ handle_subrel ] if needed. *)\nLocal Ltac handle_symmetry R2 R a b :=\n  let _ := debug_msg ltac:(fun G => idtac \"handle_symmetry\" R2 R a b G) in\n  let error _ := (let g := get_goal in\n                  idtac \"No Symmetric instance found to show\" g;\n                  fail 1 \"No Symmetric instance found to show\" g) in\n  lazymatch R with\n  | R2 => solve [ let S := get_instance (Symmetric R2) in simple refine (andl (S _ _))\n                | error ltac:(0) ]\n  | _  => first [ let S := get_instance (Symmetric R2) in\n                  let H := fresh in intro H; cut (apos (R2 (a, b))); [ clear H | simple refine ( andl (S _ _) H) ]\n                | let S := get_instance (Symmetric R) in\n                  let H := fresh in intro H; cut (apos (R (b, a))); [ clear H; simple refine ( andl (S _ _) ) | revert H ]\n                | error ltac:(0) ];\n          handle_subrel R2 R\n  end.\n\nLocal Ltac fixup_given_sym _ :=\n  lazymatch goal with\n  | |- apos (?R2 (?b, ?a)) → apos (?R (?a, ?b)) => handle_symmetry R2 R a b\n  | |- apos ?P → apos (?R (?a, ?b)) =>\n    echange (apos (_ (b, a)) → apos (R (a, b)));\n    lazymatch goal with |- apos (?R2 _) → _ => handle_symmetry R2 R a b end\n  end.\n\nLocal Ltac fixup_given _ :=\n  let _ := debug_msg ltac:(fun G => idtac \"fixup given\" G) in\n  lazymatch goal with\n  | |- apos (?R2 ?p) → apos (?R ?p) => handle_subrel R2 R\n  | |- apos ?P → apos (?R ?p) =>\n    echange (apos (_ p) → apos (R p));\n    lazymatch goal with |- apos (?R2 _) → _ => handle_subrel R2 R end\n  end.\n\nLocal Ltac solve_given_aux fixup E :=\n  unfold arewrite_tag_l, arewrite_tag_r;\n  simple notypeclasses refine (_ E);\n  try lazymatch goal with |- (∀ _ : ?P, ?Q) → ?P2 => change (impl (P, Q) → P2) end;\n  fixup ltac:(0).\n\nLocal Ltac solve_given := solve_given_aux fixup_given.\nLocal Ltac solve_given_sym := solve_given_aux fixup_given_sym.\n\nLocal Ltac solve_if_given :=\n  let _ := debug_msg ltac:(fun G => idtac \"solve_if_given\" G) in\n  let error E txt := (\n    let g := get_goal in\n    let g' := eval unfold arewrite_tag_l, arewrite_tag_r in g in\n    let t := type of E in\n    txt ltac:(0);\n    idtac \"  Goal : \" g;\n    idtac \"     = : \" g';\n    idtac \"  Given: \" t;\n    fail 1 \"solve_if_given failed on\" g\n  ) in\n  lazymatch goal with\n  | |- apos (?R (arewrite_tag_l (R:=?R') ?E, arewrite_tag_r _)) =>\n         first [ lazymatch R' with R => exact E end (* \"exact\" can try really hard to unify, so don't always try it *)\n               | solve_given E\n               | error E ltac:(fun _ => idtac \"Could not solve using given relation\")\n               ]\n  | |- apos (?R (arewrite_tag_r ?E, arewrite_tag_l _)) =>\n         first [ solve_given_sym E\n               | error E ltac:(fun _ => idtac \"Could not solve using (reverse of) given relation\")\n               ]\n  end.\n\n(* Linear [(?a, ?b)] + universe-insensitive [lazymatch a with b] guard: a\n   nonlinear [(?a, ?a)] pattern misses pairs whose sides differ only in\n   universe instances, which [refl] would close by unification. *)\nLocal Ltac solve_if_refl :=\n  lazymatch goal with\n  | |- apos (?R (?a, ?b)) =>\n    lazymatch a with b => solve [ refl |\n       idtac \"Reflexivity failed for\" R \"on\" a;\n       fail 1 \"Reflexivity failed for\" R \"on\" a ] end\n  end.\n\nGlobal Hint Extern 1 => solve_if_given : proper.\nGlobal Hint Extern 1 => solve_if_refl : proper.\n\n","sentences":[{"i":0,"s":0,"e":105,"kind":"vernac","status":"ok","ms":21,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":107,"e":167,"kind":"vernac","status":"ok","ms":11,"messages":["79903470d7a7e113"],"goals":null},{"i":2,"s":168,"e":228,"kind":"vernac","status":"ok","ms":11,"messages":["2191626fd326652a"],"goals":null},{"i":3,"s":230,"e":286,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":4,"s":287,"e":343,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":5,"s":345,"e":506,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":6,"s":507 ame":"arewrite_tag_l","kind":"def","local":true},{"s":3766,"e":3780,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"arewrite_tag_r","kind":"def","local":true},{"s":4048,"e":4052,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":4058,"e":4072,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"arewrite_tag_r","kind":"def","local":true},{"s":4077,"e":4091,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"arewrite_tag_l","kind":"def","local":true},{"s":4528,"e":4532,"lib":"AffineConstructive.interfaces.aprop","name":"apos","kind":"class","local":false,"page":"../../interfaces/aprop.html"},{"s":2470,"e":2485,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"handle_symmetry","kind":"ltac","local":true},{"s":2538,"e":2545,"lib":"AffineConstructive.tactics.misc","name":"echange","kind":"tacn","local":false,"page":"../misc.html"},{"s":2630,"e":2645,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"handle_symmetry","kind":"ltac","local":true},{"s":2706,"e":2715,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"debug_msg","kind":"ltac","local":true},{"s":2818,"e":2831,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"handle_subrel","kind":"ltac","local":true},{"s":2874,"e":2881,"lib":"AffineConstructive.tactics.misc","name":"echange","kind":"tacn","local":false,"page":"../misc.html"},{"s":2956,"e":2969,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"handle_subrel","kind":"ltac","local":true},{"s":3232,"e":3247,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"solve_given_aux","kind":"ltac","local":true},{"s":3248,"e":3259,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"fixup_given","kind":"ltac","local":true},{"s":3291,"e":3306,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"solve_given_aux","kind":"ltac","local":true},{"s":3307,"e":3322,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"fixup_given_sym","kind":"ltac","local":true},{"s":3365,"e":3374,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"debug_msg","kind":"ltac","local":true},{"s":3455,"e":3463,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":false,"page":"../misc.html"},{"s":3924,"e":3935,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"solve_given","kind":"ltac","local":true},{"s":4116,"e":4131,"lib":"AffineConstructive.tactics.rewrite.arewrite","name":"solve_given_sym","kind":"ltac","local":true}],"gloss":{"summary":"This file connects the rewriting system to affine relations, R (a, b) for R : A ∗ A → Ω. Two tag terms, [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_l]] and [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_r]], mark the two sides of the equation being rewritten with, and are declared as each other's swap so that the generic machinery of the proper-morphism layer can rewrite in either direction. The hint solve_if_given discharges the obligation the rewrite produces by the supplied equation itself: as given when the relation matches, through a [[AffineConstructive.interfaces.aprop.Subrelation]] when the requested relation is weaker ([[AffineConstructive.tactics.rewrite.arewrite.handle_subrel]]), and through [[AffineConstructive.interfaces.aprop.Symmetric]] when the rewrite runs right to left ([[AffineConstructive.tactics.rewrite.arewrite.handle_symmetry]]). A second hint, [[AffineConstructive.tactics.rewrite.arewrite.solve_if_refl]], closes obligations whose two sides coincide by reflexivity. Both hints go into the proper database, where the `rew` tactic used throughout the development finds them.","short":"Rewriting with affine relations: tagging an equation's sides and discharging rewrite obligations","items":[{"name":"AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_l","base":"arewrite_tag_l","kind":"def","start":1,"body":null,"status":"ok","short":{"text":"Marks the left side a of a given affine relation R (a, b), for rewriting","status":"ok"},"long":{"text":"Given a proof E of an affine relation R (a, b), the term `arewrite_tag_l E` is a itself: the definition reduces to the left side and resolution unfolds it freely. What it adds is a record of where the term came from. When the rewriting system rewrites by E, it puts this tag where a occurs and its partner [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_r]] where b occurs. The obligation it later has to discharge then has the form R' (arewrite_tag_l E, arewrite_tag_r E), and the tags carry E along with the relation R it proves.\n\nThe tactics in the file use the tags to recognise these obligations and close them from E. If R' is R they use E as it is. If R' differs they look for a [[AffineConstructive.interfaces.aprop.Subrelation]] instance from R to R', or for one between the of-course relations ([[AffineConstructive.interfaces.aprop.of_course_rel]]), the case where the rewrite needs E to be usable freely. If the tags appear in the opposite order, so that the obligation is R' (b, a), they apply a [[AffineConstructive.interfaces.aprop.Symmetric]] instance first. A [[AffineConstructive.tactics.rewrite.proper.RewriteSwapTag]] hint pairs each tag with the other, so the base framework can turn a left-to-right rewrite into a right-to-left one by swapping them.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_r","base":"arewrite_tag_r","kind":"def","start":2,"body":null,"status":"ok","short":{"text":"Marks the right side b of a given affine relation R (a, b), for rewriting","status":"ok"},"long":{"text":"The companion of [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_l]]. Given a proof E of R (a, b), the term `arewrite_tag_r E` is b itself, tagged with the proof it came from. A rewrite by E puts it where b occurs. An obligation R' (arewrite_tag_l E, arewrite_tag_r E) is then closed from E, through a [[AffineConstructive.interfaces.aprop.Subrelation]] instance when R' is not R. When the two tags appear in the opposite order the obligation is closed through a [[AffineConstructive.interfaces.aprop.Symmetric]] instance. Through [[AffineConstructive.tactics.rewrite.proper.RewriteSwapTag]] each tag is declared the swap partner of the other, which is how a rewrite runs in the reverse direction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.debug_msg","base":"debug_msg","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"A tracing hook for the tactics of this file; as shipped it does nothing","status":"ok"},"long":{"text":"Each tactic of the file calls `debug_msg` on entry with a printing continuation that receives the current goal. As defined it ignores its argument and succeeds without effect. A commented-out redefinition beside it makes it print the tactic's name, its arguments and the goal. Re-enabling that line traces how a rewrite obligation is discharged, or why it is not.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.handle_subrel","base":"handle_subrel","kind":"ltac","start":8,"body":null,"status":"ok","short":{"text":"Proves that R₂ (a, b) gives R (a, b), directly when the relations agree and otherwise by a subrelation instance","status":"ok"},"long":{"text":"The step at which a rewrite by a relation R₂ is used where the rewriting system asked for a relation R on the same pair. The goal is that a proof of R₂ (a, b) yields a proof of R (a, b). When R₂ and R are syntactically the same relation, the given proof is passed through unchanged. Otherwise it looks for a [[AffineConstructive.interfaces.aprop.Subrelation]] instance from R₂ to R and uses its forward half; failing that, it looks for an [[AffineConstructive.interfaces.sprop.sSubrelation]] between the of-course forms of the two relations ([[AffineConstructive.interfaces.aprop.of_course_rel]]), which covers relations that are affirmed pointwise. When neither instance exists it prints the goal and fails, so that a rewrite with the wrong relation reports why it could not proceed.\n\nIt is the last step of the local tactics that discharge a rewrite obligation from the equation the user supplied, and is also called by [[AffineConstructive.tactics.rewrite.arewrite.handle_symmetry]] after the sides have been put in order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.handle_symmetry","base":"handle_symmetry","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"Proves that R₂ (b, a) gives R (a, b), using a symmetry instance and then a subrelation if needed","status":"ok"},"long":{"text":"The step used when an equation is rewritten from right to left: the rewriting system asks for R (a, b) and the proof supplied is of R₂ (b, a), with the sides in the opposite order. When R₂ and R are the same relation it applies the [[AffineConstructive.interfaces.aprop.Symmetric]] instance of R and is done. When they differ it first tries symmetry of R₂, turning the given R₂ (b, a) into R₂ (a, b); if R₂ has no symmetry instance it tries symmetry of R, reducing the goal R (a, b) to R (b, a). Either way what remains is a comparison of two relations on pairs in the same order, which it hands to [[AffineConstructive.tactics.rewrite.arewrite.handle_subrel]].\n\nIf no symmetry instance is found it prints the goal and fails with a message naming the missing instance, so a reversed rewrite with an asymmetric relation reports its cause.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.fixup_given_sym","base":"fixup_given_sym","kind":"ltac","start":10,"body":null,"status":"ok","short":{"text":"Proves R (a, b) from a given relation between b and a, by symmetry and, if needed, a subrelation","status":"ok"},"long":{"text":"The goal has the form: a proof of a relation between b and a implies a proof of R (a, b). It arises when an equation is used right to left. When the hypothesis is not syntactically a relation applied to the pair (b, a), the tactic first restates it as one, letting unification find the relation. It then applies symmetry. If the given relation and R are the same, the [[AffineConstructive.interfaces.aprop.Symmetric]] instance for that relation closes the goal.\n\nIf the two relations differ, there are two routes, tried in order. The first symmetrises the given relation to get it on (a, b), then passes to R by a subrelation. The second passes to R on (b, a) by a subrelation, then uses the symmetry of R. If neither relation is known to be symmetric, the tactic prints the goal and fails with a message saying so. The subrelation step is the one [[AffineConstructive.tactics.rewrite.arewrite.fixup_given]] uses.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.fixup_given","base":"fixup_given","kind":"ltac","start":11,"body":null,"status":"ok","short":{"text":"Proves R p from a given relation on the same pair p, through a subrelation","status":"ok"},"long":{"text":"The goal has the form: a proof of R₂ p implies a proof of R p, where R₂ is the relation of the equation being rewritten with and R is the relation the rewrite requires. When the hypothesis is not syntactically a relation applied to p, the tactic first restates it as one, letting unification find the relation.\n\nIf R₂ and R coincide, the identity closes the goal. Otherwise the tactic looks for a [[AffineConstructive.interfaces.aprop.Subrelation]] instance from R₂ to R and uses its proof component. Failing that, it looks for an [[AffineConstructive.interfaces.sprop.sSubrelation]] between the [[AffineConstructive.interfaces.aprop.of_course_rel]] versions of the two relations. This covers relations that are strict predicates made affine with of course. If neither instance exists, the tactic prints the goal and fails, reporting that no subrelation was found.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.solve_given_aux","base":"solve_given_aux","kind":"ltac","start":12,"body":null,"status":"ok","short":{"text":"Reduces a rewrite obligation to deriving the required relation from a given proof E, then closes it","status":"ok"},"long":{"text":"The tactic takes a fix-up tactic and a proof E of a relation R₂ (a, b). It removes the tags [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_l]] and [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_r]], which reveals the bare pair, and applies an unknown function to E. What remains is to show that a proof of E's statement implies a proof of the required relation. A strict implication appears as a plain function type. When E's statement has that form, it is restated as the relation [[AffineConstructive.interfaces.sprop.impl]] on a pair, so that the subrelation machinery recognises it. The fix-up tactic then closes the implication.\n\nThe file uses it in two variants. [[AffineConstructive.tactics.rewrite.arewrite.solve_given]] passes [[AffineConstructive.tactics.rewrite.arewrite.fixup_given]], for an equation used in its own direction. [[AffineConstructive.tactics.rewrite.arewrite.solve_given_sym]] passes [[AffineConstructive.tactics.rewrite.arewrite.fixup_given_sym]], for an equation used in reverse.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.solve_given","base":"solve_given","kind":"ltac","start":13,"body":null,"status":"ok","short":{"text":"Discharges a rewrite obligation in the direction of the given proof, through a subrelation","status":"ok"},"long":{"text":"This is [[AffineConstructive.tactics.rewrite.arewrite.solve_given_aux]] with [[AffineConstructive.tactics.rewrite.arewrite.fixup_given]]. Given E : R₂ (a, b) and an obligation R (a, b), it proves R (a, b) from E. It does so through a [[AffineConstructive.interfaces.aprop.Subrelation]] from R₂ to R, or through an [[AffineConstructive.interfaces.sprop.sSubrelation]] of their of-course forms. [[AffineConstructive.tactics.rewrite.arewrite.solve_if_given]] calls it when the required relation differs from the given one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.solve_given_sym","base":"solve_given_sym","kind":"ltac","start":14,"body":null,"status":"ok","short":{"text":"Discharges a reversed rewrite obligation from the given proof by symmetry and a subrelation","status":"ok"},"long":{"text":"This is [[AffineConstructive.tactics.rewrite.arewrite.solve_given_aux]] with [[AffineConstructive.tactics.rewrite.arewrite.fixup_given_sym]]. Given E : R₂ (a, b) and an obligation R (b, a), it proves R (b, a) from E. It uses the symmetry of R₂ or of R, together with a subrelation when the two relations differ. [[AffineConstructive.tactics.rewrite.arewrite.solve_if_given]] calls it when an equation is rewritten right to left.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.solve_if_given","base":"solve_if_given","kind":"ltac","start":15,"body":null,"status":"ok","short":{"text":"Closes a tagged rewrite obligation using the equation being rewritten with, directly or reversed","status":"ok"},"long":{"text":"Rewriting with a proof E of R₂ (a, b) leaves obligations. Each asks for some relation R between the two sides, and the sides are marked by the tags [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_l]] and [[AffineConstructive.tactics.rewrite.arewrite.arewrite_tag_r]] applied to E. This tactic recognises those obligations. When the left tag comes first, the rewrite runs in E's direction. If R is syntactically R₂, E itself closes the goal. The full unification of a direct `exact` is tried only in that case, because it can be slow. Otherwise [[AffineConstructive.tactics.rewrite.arewrite.solve_given]] derives R from R₂ by a subrelation. When the right tag comes first, the rewrite runs in reverse, and [[AffineConstructive.tactics.rewrite.arewrite.solve_given_sym]] uses symmetry as well. On failure it prints the obligation, the obligation with the tags unfolded, and the type of E, then fails.\n\nIt is registered as a priority-1 hint in the `proper` database, together with a companion that closes an obligation between identical sides by reflexivity. These are the leaves at which the properness search for a rewrite ends: the step where the equation itself, or reflexivity, is used. A proof never calls it directly. It runs whenever `rew` rewrites with an affine relation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.arewrite.solve_if_refl","base":"solve_if_refl","kind":"ltac","start":16,"body":null,"status":"ok","short":{"text":"Closes a rewrite obligation R (a, a) by reflexivity of R","status":"ok"},"long":{"text":"A hint for the rewriting system's search, registered in the proper database at priority 1. It matches a goal asking for a proof of R (a, b) whose two sides are the same term, up to universe instances, and closes it by the reflexivity of R; when the two sides coincide but R has no reflexivity instance, it fails with a message naming the relation and the term, instead of letting the search wander.\n\nThe pair is matched as two separate terms and compared afterwards rather than by a pattern demanding equal sides, because two sides that differ only in universe instances would escape such a pattern, though reflexivity closes them by unification. A proof does not call this tactic: the rewriting machinery reaches for it when a subterm left unchanged by the rewrite needs its trivial relation to itself.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.easy":{"page":"../easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.proper":{"page":"proper.html","short":"Hint databases and search tactics for the congruence obligations of rewriting","summary":"The file sets up the hint databases on which the development's rewriting system rests. It creates the `proper` database, where properness and congruence lemmas are registered, and the tactic [[solve_proper]] that searches it by instance resolution, together with [[proper_solution]], which returns the term such a search finds. It also defines a small tagging device, the inductive `RewriteSwapTag` and the database `rewrite_swap_tag`, and the tactic [[swap_rewrite_tag]], which looks up the term declared as the partner of a given term. The rewriting tactics built on top of this file call these to discharge the congruence obligations a rewrite generates and to pass between paired terms."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."}},"constants":null}</script>

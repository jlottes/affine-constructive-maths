},{"i":7,"s":329,"e":430,"kind":"vernac","status":"ok","ms":12,"messages":["3b59c464e22261a4","5d08ffe6f04fee1a","b3008a998c484b7a","94c205c0ab2fae4c","5ef4c4c05f05569f"],"goals":null},{"i":8,"s":431,"e":471,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":9,"s":473,"e":788,"kind":"vernac","status":"ok","ms":13,"messages":["528ca4c0934240dd"],"goals":null}],"pp":{"239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","3b59c464e22261a4":"RewriteSwapTag is defined","528ca4c0934240dd":"swap_rewrite_tag is defined","5d08ffe6f04fee1a":"RewriteSwapTag_rect is defined","5ef4c4c05f05569f":"RewriteSwapTag_sind is defined","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","8222b157921b5663":"solve_proper is defined","94c205c0ab2fae4c":"RewriteSwapTag_rec is defined","af331431bd614838":"[Loading ML file rocq-runtime.plugins.firstorder_core (implicit dependency) ... done]","b3008a998c484b7a":"RewriteSwapTag_ind is defined","ffefc0f05ae0b97a":"proper_solution is defined"},"defs":[{"s":339,"e":353,"kind":"ind","name":"RewriteSwapTag"},{"s":372,"e":393,"kind":"constr","name":"DeclareRewriteSwapTag"},{"s":339,"e":353,"kind":"scheme","name":"RewriteSwapTag_rect"},{"s":339,"e":353,"kind":"scheme","name":"RewriteSwapTag_ind"},{"s":339,"e":353,"kind":"scheme","name":"RewriteSwapTag_rec"},{"s":339,"e":353,"kind":"scheme","name":"RewriteSwapTag_sind"},{"kind":"ltac","name":"solve_proper","s":163,"e":175},{"kind":"ltac","name":"proper_solution","s":222,"e":237},{"kind":"ltac","name":"swap_rewrite_tag","s":478,"e":494}],"refs":[{"s":15,"e":22,"lib":"AffineConstructive.interfaces.prelude","name":"","kind":"lib","local":false,"page":"../../interfaces/prelude.html"},{"s":23,"e":35,"lib":"AffineConstructive.tactics.misc","name":"","kind":"lib","local":false,"page":"../misc.html"},{"s":410,"e":424,"lib":"AffineConstructive.tactics.rewrite.proper","name":"RewriteSwapTag:3","kind":"ind","local":true},{"s":441,"e":462,"lib":"AffineConstructive.tactics.rewrite.proper","name":"DeclareRewriteSwapTag","kind":"constr","local":true},{"s":702,"e":716,"lib":"AffineConstructive.tactics.rewrite.proper","name":"RewriteSwapTag","kind":"ind","local":true},{"s":743,"e":764,"lib":"AffineConstructive.tactics.rewrite.proper","name":"DeclareRewriteSwapTag","kind":"constr","local":true},{"s":243,"e":258,"lib":"AffineConstructive.tactics.misc","name":"constr_from_tac","kind":"ltac","local":false,"page":"../misc.html"},{"s":267,"e":279,"lib":"AffineConstructive.tactics.rewrite.proper","name":"solve_proper","kind":"ltac","local":true}],"gloss":{"summary":"The file sets up the hint databases on which the development's rewriting system rests. It creates the `proper` database, where properness and congruence lemmas are registered, and the tactic [[AffineConstructive.tactics.rewrite.proper.solve_proper]] that searches it by instance resolution, together with [[AffineConstructive.tactics.rewrite.proper.proper_solution]], which returns the term such a search finds. It also defines a small tagging device, the inductive `RewriteSwapTag` and the database `rewrite_swap_tag`, and the tactic [[AffineConstructive.tactics.rewrite.proper.swap_rewrite_tag]], which looks up the term declared as the partner of a given term. The rewriting tactics built on top of this file call these to discharge the congruence obligations a rewrite generates and to pass between paired terms.","short":"Hint databases and search tactics for the congruence obligations of rewriting","items":[{"name":"AffineConstructive.tactics.rewrite.proper.solve_proper","base":"solve_proper","kind":"ltac","start":4,"body":null,"status":"ok","short":{"text":"Proves a properness or congruence goal by instance search in the proper database alone","status":"ok"},"long":{"text":"The tactic runs typeclass resolution on the current goal using only the hints of the `proper` database, without the core hints. That database collects the properness lemmas of the development: statements that an operation respects a relation in each argument, such as an implication between propositions being preserved by a connective. The database is discriminated, and its constants and variables are treated as opaque, so the search matches the head symbols of a goal as written and does not unfold definitions to find a hint.\n\nThe rewriting tactics reach for it when a rewrite inside a context leaves the obligation that the context respects the relation being rewritten by; a proof calls it directly when such an obligation appears as a goal of its own. It succeeds only if the registered lemmas compose to a proof, and otherwise fails.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.proper.proper_solution","base":"proper_solution","kind":"ltac","start":5,"body":null,"status":"ok","short":{"text":"Returns, as a term, a proof of the type H found by solve_proper","status":"ok"},"long":{"text":"Given a type `H`, typically a properness statement, the tactic produces a term of that type by running [[AffineConstructive.tactics.rewrite.proper.solve_proper]] on it as a separate goal, and returns the term rather than closing a goal. It is the form used when a proof term is needed as a value: inside another tactic, to build the argument of a lemma, or to assemble the congruence step of a rewrite before applying it. It fails when [[AffineConstructive.tactics.rewrite.proper.solve_proper]] finds no proof.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.proper.RewriteSwapTag","base":"RewriteSwapTag","kind":"ind","start":7,"body":null,"status":"ok","short":{"text":"A tag pairing a term with its swapped counterpart, for the rewriting system's lookups","status":"ok"},"long":{"text":"`RewriteSwapTag t` is a type whose inhabitants are `DeclareRewriteSwapTag t'` for terms t' of the same type as t. An instance of it in the `rewrite_swap_tag` hint database declares that, where the rewriting system meets the tag t, it should swap it for t'. The type carries no mathematics: its single constructor stores t', and the index t is there only so that the hint database can be searched by the term being swapped.\n\nThe tactic `swap_rewrite_tag` looks up such an instance for a given t and returns the t' it stores, failing with a message when there is none. It is an internal device of the rewriting system, used to pass from a term to the counterpart registered for it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.rewrite.proper.RewriteSwapTag_rect","base":"RewriteSwapTag_rect","kind":"scheme","short":{"text":"The generated recursion principle of the swap tag, into types","status":"ok"}},{"name":"AffineConstructive.tactics.rewrite.proper.RewriteSwapTag_ind","base":"RewriteSwapTag_ind","kind":"scheme","short":{"text":"The generated induction principle of the swap tag, into propositions","status":"ok"}},{"name":"AffineConstructive.tactics.rewrite.proper.RewriteSwapTag_rec","base":"RewriteSwapTag_rec","kind":"scheme","short":{"text":"The generated recursion principle of the swap tag, into sets","status":"ok"}},{"name":"AffineConstructive.tactics.rewrite.proper.RewriteSwapTag_sind","base":"RewriteSwapTag_sind","kind":"scheme","short":{"text":"The generated induction principle of the swap tag, into strict propositions","status":"ok"}},{"name":"AffineConstructive.tactics.rewrite.proper.DeclareRewriteSwapTag","base":"DeclareRewriteSwapTag","kind":"constr","short":{"text":"Builds a swap tag for a term from the counterpart it is to be swapped for","status":"ok"}}]},{"name":"AffineConstructive.tactics.rewrite.proper.swap_rewrite_tag","base":"swap_rewrite_tag","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"Returns the term declared as the swap partner of a given term t","status":"ok"},"long":{"text":"Terms are paired by declaring instances in the `rewrite_swap_tag` database: an instance of `RewriteSwapTag t` built as `DeclareRewriteSwapTag t'` records `t'` as the partner of `t`. Given `t`, the tactic searches that database alone by instance resolution, reads the partner off the instance found, and returns it as a term. If no instance is declared for `t`, it prints a message naming `t` and fails.\n\nThe rewriting tactics use it to pass from a term they are given to its declared counterpart, so that the correspondence between the two is fixed once by a declaration and not rederived in each tactic.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.prelude":{"page":"../../interfaces/prelude.html","short":"The prelude: global settings, basic types and term-building notations replacing the standard library","summary":"This file stands in for Rocq's standard library. It declares the type and function scopes and loads the Ltac, number-notation and firstorder plugins. It also turns on the global settings the rest of the development relies on: primitive projections, universe polymorphism with cumulative inductives, and keyed unification. It sets up the `core` and `typeclass_instances` hint databases. It then defines the basic types from scratch: the empty type with [[abort]] and [[dep_abort]], [[unit]] (which also serves as a trivially satisfied class), [[bool]], the product [[tprod]], the dependent sum [[tsig]], the disjoint union [[tsum]], and [[ssig]], whose elements are points paired with a proof-irrelevant property. Last come the identity function, currying and uncurrying, and a few notations that build terms by running a tactic."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

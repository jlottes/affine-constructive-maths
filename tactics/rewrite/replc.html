ct.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export rewrite.\nRequire Import relation_notation.\n\n\nTactic Notation \"replc\" constr(x) \"with\" uconstr(y) :=\n  let E := fresh \"E\" in assert (x = y) as E; [| rew E; clear E ].\n\nTactic Notation \"replc\" constr(x) \"with\" uconstr(y) \"by\" tactic3(tac) :=\n  let E := fresh \"E\" in assert (x = y) as E by tac; rew E; clear E.\n\nTactic Notation \"replc\" constr(x₁) \"with\" uconstr(y₁) \"by\" tactic3(tac₁)\n                \"and\"   constr(x₂) \"with\" uconstr(y₂) \"by\" tactic3(tac₂) :=\n  let E₁ := fresh \"E\" in let E₂ := fresh \"E\" in\n  assert (x₁ = y₁ ∧ x₂ = y₂) as [E₁ E₂] by (split; [tac₁ | tac₂]);\n  rew [ E₁ | E₂ ]; clear E₁ E₂.\n\nTactic Notation \"replc\" constr(x) \"with\" uconstr(y) \"using\" uconstr(R) :=\n  let E := fresh \"E\" in assert (R (x, y)) as E; [| rew E; clear E ].\n\nTactic Notation \"replc\" constr(x) \"with\" uconstr(y) \"using\" uconstr(R) \"by\" tactic3(tac) :=\n  let E := fresh \"E\" in assert (R (x, y)) as E by tac; rew E; clear E.\n  \n","sentences":[{"i":0,"s":0,"e":23,"kind":"vernac","status":"ok","ms":19,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":24,"e":57,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":60,"e":180,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":3,"s":182,"e":322,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":324,"e":619,"kind":"vernac","status":"ok","ms":14,"messages":[],"goals":null},{"i":5,"s":621,"e":763,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":6,"s":765,"e":927,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null}],"pp":{"239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","7ee0ddd10f8b2374":"[Loading ML file rocq-runtime.plugins.tauto ... done]","af331431bd614838":"[Loading ML file rocq-runtime.plugins.firstorder_core (implicit dependency) ... done]"},"defs":[{"kind":"tacn","name":"replc","s":76,"e":83}],"refs":[{"s":15,"e":22,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"","kind":"lib","local":false,"page":"rewrite.html"},{"s":39,"e":56,"lib":"AffineConstructive.interfaces.relation_notation","name":"","kind":"lib","local":false,"page":"../../interfaces/relation_notation.html"},{"kind":"tacn","name":"replc","s":198,"e":205,"lib":"AffineConstructive.tactics.rewrite.replc","local":true},{"kind":"tacn","name":"replc","s":340,"e":347,"lib":"AffineConstructive.tactics.rewrite.replc","local":true},{"kind":"tacn","name":"replc","s":637,"e":644,"lib":"AffineConstructive.tactics.rewrite.replc","local":true},{"kind":"tacn","name":"replc","s":781,"e":788,"lib":"AffineConstructive.tactics.rewrite.replc","local":true},{"s":163,"e":166,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"rewrite.html"},{"s":307,"e":310,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"rewrite.html"},{"s":590,"e":593,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"rewrite.html"},{"s":746,"e":749,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"rewrite.html"},{"s":912,"e":915,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"rewrite.html"}],"gloss":{"summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting.","short":"replc: replacing a subterm by an equal one, through the rewriting system","items":[{"name":"AffineConstructive.tactics.rewrite.replc.replc","base":"replc","kind":"tacn","start":2,"body":null,"also":[3,4,5,6],"status":"ok","short":{"text":"Replaces a subterm of the goal with an equal one: proves the equality, then rewrites by it","status":"ok"},"long":{"text":"`replc x with y` replaces x with y in the goal. It first asks for a proof of the equality x = y as a separate goal, and then uses that equality to rewrite x into y wherever the rewriting system can reach it. With `by tac` the equality is proved on the spot by tac and does not appear as a goal. The two-subterm form `replc x₁ with y₁ by tac₁ and x₂ with y₂ by tac₂` proves both equalities, each with its own tactic, and rewrites by the two at once. The `using R` forms do the same with a relation R other than equality: they ask for R between x and y and rewrite by that. In each form the auxiliary equality or relation is used only for the rewriting and then removed from the context.\n\nThe tactic is a convenience on top of `rew`, the rewriting tactic of the development, and differs from it in where the equation comes from. `rew` needs a lemma or hypothesis already in hand. `replc` says the replacement first and proves why it holds second, which suits restating a subterm into a form that later steps can work with: an argument of a function changed to an equal one, a composite of entourages regrouped, a subset restated. Since the rewriting goes through `rew`, the replacement reaches any position where the relevant properness or congruence instances are available, under affine connectives and quantifiers included, and not only positions that are syntactically the same, which is what Rocq's own `replace` needs.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.tactics.rewrite.rewrite":{"page":"rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.interfaces.relation_notation":{"page":"../../interfaces/relation_notation.html","short":"Equality, order and strict order as affine relations, and the opposite order","summary":"This file declares the two basic relations of the development as typeclasses: [[equiv]], the equality of a type, and [[le]], its order. Each is an affine proposition on pairs, written x = y and x ≤ y, and inequality x ≠ y is the negation of equality. The strict order [[lt]] is the complement of the converse order, so x < y is (y ≤ x)ᗮ. The file also defines [[order_op]], a renaming of a type that carries the converse order and the same equality. The opposite orders, and with them the duality between the order notions, are built on this renaming in `interfaces/algebra_notation.v` and `orders/orders.v`."}},"constants":null}</script>

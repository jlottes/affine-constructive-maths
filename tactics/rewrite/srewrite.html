ete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.notation sprop tactics.easy srelations tactics.misc rewrite.proper.\n\nDefinition srewrite_tag_l `{R:srelation A} `(E:R (a, b)) := a.\nDefinition srewrite_tag_r `{R:srelation A} `(E:R (a, b)) := b.\n\nGlobal Hint Unfold srewrite_tag_l : typeclass_instances.\nGlobal Hint Unfold srewrite_tag_r : typeclass_instances.\n\nGlobal Hint Extern 0 (RewriteSwapTag (@srewrite_tag_r ?A ?R ?a ?b ?E))\n  => simple refine (DeclareRewriteSwapTag (@srewrite_tag_l A R a b E)) : rewrite_swap_tag.\nGlobal Hint Extern 0 (RewriteSwapTag (@srewrite_tag_l ?A ?R ?a ?b ?E))\n  => simple refine (DeclareRewriteSwapTag (@srewrite_tag_r A R a b E)) : rewrite_swap_tag.\n\n(** Proves [ R2 (a, b) → R (a, b) ], by finding an [ sSubrelation ] instance *)\nLocal Ltac handle_subrel R2 R :=\n  lazymatch R2 with\n  | R => exact (λ E, E)\n  | _ => solve [ let S := get_instance (sSubrelation R2 R) in simple refine (S _)\n               | let g := get_goal in\n                   idtac \"No sSubrelation instance found to show\" g;\n                   fail 1 \"No sSubrelation instance found to show\" g ]\n  end.\n\n(** Proves [ R2 (b, a) → R (a, b) ], by applying symmetry and invoking [ handle_subrel ] if needed. *)\nLocal Ltac handle_symmetry R2 R a b :=\n  let error _ := (let g := get_goal in\n                  idtac \"No sSymmetric instance found to show\" g;\n                  fail 1 \"No sSymmetric instance found to show\" g) in\n  lazymatch R with\n  | R2 => solve [ let S := get_instance (sSymmetric R2) in simple refine (S _ _)\n                | error ltac:(0) ]\n  | _  => first [ let S := get_instance (sSymmetric R2) in\n                  let H := fresh in intro H; cut (R2 (a, b)); [ clear H | simple refine (S _ _ H) ]\n                | let S := get_instance (sSymmetric R) in\n                  let H := fresh in intro H; cut (R (b, a)); [ clear H; simple refine (S _ _) | revert H ]\n                | error ltac:(0) ];\n          handle_subrel R2 R\n  end.\n\nLocal Ltac fixup_given_sym _ :=\n  lazymatch goal with\n  | |- ?R2 (?b, ?a) → ?R (?a, ?b) => handle_symmetry R2 R a b\n  | |- ?P → ?R (?a, ?b) =>\n    echange (_ (b, a) → R (a, b));\n    lazymatch goal with |- ?R2 _ → _ => handle_symmetry R2 R a b end\n  end.\n\nLocal Ltac fixup_given _ :=\n  lazymatch goal with\n  | |- ?R2 ?p → ?R ?p => handle_subrel R2 R\n  | |- ?P → ?R ?p =>\n    echange (_ p → R p);\n    lazymatch goal with |- ?R2 _ → _ => handle_subrel R2 R end\n  end.\n\nLocal Ltac solve_given_aux fixup E :=\n  unfold srewrite_tag_l, srewrite_tag_r;\n  simple notypeclasses refine (_ E);\n  try lazymatch goal with |- (∀ _ : ?P, ?Q) → ?P2 => change (impl (P, Q) → P2) end;\n  fixup ltac:(0).\n\nLocal Ltac solve_given := solve_given_aux fixup_given.\nLocal Ltac solve_given_sym := solve_given_aux fixup_given_sym.\n\nLtac solve_if_given :=\n  let error E txt := (\n    let g := get_goal in\n    let g' := eval unfold srewrite_tag_l, srewrite_tag_r in g in\n    let t := type of E in\n    txt ltac:(0);\n    idtac \"  Goal : \" g;\n    idtac \"     = : \" g';\n    idtac \"  Given: \" t;\n    fail 1 \"solve_if_given failed on\" g\n  ) in\n  lazymatch goal with\n  | |- ?R (srewrite_tag_l (R:=?R') ?E, srewrite_tag_r _) =>\n         first [ lazymatch R' with R => exact E end (* \"exact\" can try really hard to unify, so don't always try it *)\n               | solve_given E\n               | error E ltac:(fun _ => idtac \"Could not solve using given relation\")\n               ]\n  | |- ?R (srewrite_tag_r ?E, srewrite_tag_l _) =>\n         first [ solve_given_sym E\n               | error E ltac:(fun _ => idtac \"Could not solve using (reverse of) given relation\")\n               ]\n  end.\n\n(* Linear [(?a, ?b)] + universe-insensitive [lazymatch a with b] guard; see\n   the same idiom in arewrite.v. *)\nLocal Ltac solve_if_refl :=\n  lazymatch goal with\n  | |- ?R (?a, ?b) =>\n    lazymatch a with b => solve [ refl |\n       idtac \"Reflexivity failed for\" R \"on\" a;\n       fail 1 \"Reflexivity failed for\" R \"on\" a ] end\n  end.\n\nGlobal Hint Extern 1 => solve_if_given : proper.\nGlobal Hint Extern 1 => solve_if_refl : proper.\n\n","sentences":[{"i":0,"s":0,"e":93,"kind":"vernac","status":"ok","ms":18,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":95,"e":157,"kind":"vernac","status":"ok","ms":11,"messages":["db3e8a874302bd6d"],"goals":null},{"i":2,"s":158,"e":220,"kind":"vernac","status":"ok","ms":11,"messages":["e9c7a92f06273fe8"],"goals":null},{"i":3,"s":222,"e":278,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":279,"e":335,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":5,"s":337,"e":498,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":6,"s":499,"e":660,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":7,"s":662,"e":1085,"kind":"vernac","status":"ok","ms":11,"messages":["d028f985dde8b955"],"goals":null},{"i":8,"s":1087,"e":1934,"kind":"vernac","status":"ok","ms":12,"messages":["4948f633f457eaea"],"goals":null},{"i":9,"s":1936,"e":2189,"kind":"vernac","status":"ok","ms":11,"messages":["732a81c07a94e382"],"goals":null},{"i":10,"s":2191,"e":2400,"kind":"vernac","status":"ok","ms":11,"messages":["9b5f2d5a74d985ff"],"goals":null},{"i":11,"s":2402,"e":2619,"kind":"vernac","status":"ok","ms":11,"messages":["863a019a0eac91d8"],"goals":null},{"i":12,"s":2621,"e":2675,"kind":"vernac","status":"ok","ms":11,"messages":["958c82d5bf4 .rewrite.proper","name":"RewriteSwapTag","kind":"ind","local":false,"page":"proper.html"},{"s":538,"e":552,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_l","kind":"def","local":true},{"s":590,"e":611,"lib":"AffineConstructive.tactics.rewrite.proper","name":"DeclareRewriteSwapTag","kind":"constr","local":false,"page":"proper.html"},{"s":614,"e":628,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_r","kind":"def","local":true},{"s":859,"e":871,"lib":"AffineConstructive.interfaces.sprop","name":"sSubrelation","kind":"class","local":false,"page":"../../interfaces/sprop.html"},{"s":1580,"e":1590,"lib":"AffineConstructive.interfaces.sprop","name":"sSymmetric","kind":"class","local":false,"page":"../../interfaces/sprop.html"},{"s":1739,"e":1749,"lib":"AffineConstructive.interfaces.sprop","name":"sSymmetric","kind":"class","local":false,"page":"../../interfaces/sprop.html"},{"s":1464,"e":1474,"lib":"AffineConstructive.interfaces.sprop","name":"sSymmetric","kind":"class","local":false,"page":"../../interfaces/sprop.html"},{"s":2449,"e":2463,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_l","kind":"def","local":true},{"s":2465,"e":2479,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_r","kind":"def","local":true},{"s":2579,"e":2583,"lib":"AffineConstructive.interfaces.sprop","name":"impl","kind":"def","local":false,"page":"../../interfaces/sprop.html"},{"s":2837,"e":2851,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_l","kind":"def","local":true},{"s":2853,"e":2867,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_r","kind":"def","local":true},{"s":3076,"e":3090,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_l","kind":"def","local":true},{"s":3104,"e":3118,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_r","kind":"def","local":true},{"s":3389,"e":3403,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_r","kind":"def","local":true},{"s":3408,"e":3422,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"srewrite_tag_l","kind":"def","local":true},{"s":2027,"e":2042,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"handle_symmetry","kind":"ltac","local":true},{"s":2083,"e":2090,"lib":"AffineConstructive.tactics.misc","name":"echange","kind":"tacn","local":false,"page":"../misc.html"},{"s":2154,"e":2169,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"handle_symmetry","kind":"ltac","local":true},{"s":2266,"e":2279,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"handle_subrel","kind":"ltac","local":true},{"s":2310,"e":2317,"lib":"AffineConstructive.tactics.misc","name":"echange","kind":"tacn","local":false,"page":"../misc.html"},{"s":2371,"e":2384,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"handle_subrel","kind":"ltac","local":true},{"s":2647,"e":2662,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"solve_given_aux","kind":"ltac","local":true},{"s":2663,"e":2674,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"fixup_given","kind":"ltac","local":true},{"s":2706,"e":2721,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"solve_given_aux","kind":"ltac","local":true},{"s":2722,"e":2737,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"fixup_given_sym","kind":"ltac","local":true},{"s":2799,"e":2807,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":false,"page":"../misc.html"},{"s":3261,"e":3272,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"solve_given","kind":"ltac","local":true},{"s":3446,"e":3461,"lib":"AffineConstructive.tactics.rewrite.srewrite","name":"solve_given_sym","kind":"ltac","local":true}],"gloss":{"summary":"This file is the base-logic counterpart of the affine rewriting setup. It lets the rewriting system use equations stated as strict relations ([[AffineConstructive.interfaces.sprop.srelation]]) on SProp. Two tags, [[AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_l]] and [[AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_r]], mark the left and right sides of a supplied equation, and each tag is declared the swap of the other ([[AffineConstructive.tactics.rewrite.proper.RewriteSwapTag]]). The tactic [[AffineConstructive.tactics.rewrite.srewrite.solve_if_given]] solves a rewrite obligation from the supplied equation. When the target relation differs, it goes through an [[AffineConstructive.interfaces.sprop.sSubrelation]] instance, and for a reversed rewrite through an [[AffineConstructive.interfaces.sprop.sSymmetric]] instance. [[AffineConstructive.tactics.rewrite.srewrite.solve_if_refl]] closes obligations on positions the rewrite leaves unchanged. Both tactics are registered in the `proper` hint database used by the rewriting framework.","short":"Rewriting with strict (SProp) relations: solving obligations from a given equation or reflexivity","items":[{"name":"AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_l","base":"srewrite_tag_l","kind":"def","start":1,"body":null,"status":"ok","short":{"text":"The left side a of a given strict relation R (a, b), tagged with the proof that relates it","status":"ok"},"long":{"text":"Given a proof E that a and b are related by a strict relation R, the tag is the left side a. Definitionally it is a; the tag exists so that a rewrite obligation of the form R (tag_l E, tag_r E) carries the proof E with it, and the automation can close the obligation from E without searching for it. Its partner is [[AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_r]], and the two are registered as each other's swap tag ([[AffineConstructive.tactics.rewrite.proper.RewriteSwapTag]]), so a rewrite in the opposite direction turns one into the other.\n\nThis is the base-logic counterpart of the tags in the affine rewriting file. It serves rewriting by relations valued in SProp ([[AffineConstructive.interfaces.sprop.srelation]]), such as the base-logic implication [[AffineConstructive.interfaces.sprop.impl]], whereas the affine tags serve relations valued in affine propositions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_r","base":"srewrite_tag_r","kind":"def","start":2,"body":null,"status":"ok","short":{"text":"The right side b of a given strict relation R (a, b), tagged with the proof that relates it","status":"ok"},"long":{"text":"Given a proof E that a and b are related by a strict relation R, the tag is the right side b, carrying E as its witness. It is the partner of [[AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_l]]. A goal R (tag_l E, tag_r E) is closed by E itself, or through an [[AffineConstructive.interfaces.sprop.sSubrelation]] instance when the goal's relation differs from E's. A goal with the two tags exchanged, which comes from a rewrite from right to left, is closed through an [[AffineConstructive.interfaces.sprop.sSymmetric]] instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.handle_subrel","base":"handle_subrel","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"Proves that a given strict relation implies the target one on a pair, through an sSubrelation instance","status":"ok"},"long":{"text":"Given two strict relations R2 and R, the tactic closes a goal saying that R2 holding at a pair implies R holding at the same pair. When R2 and R are syntactically the same relation, the identity closes it. Otherwise it looks for an instance of [[AffineConstructive.interfaces.sprop.sSubrelation]] from R2 to R and applies it. If there is none, it prints the goal and fails with a message naming the missing instance.\n\nIt is the last step in using a supplied equation to solve a rewrite obligation stated in a different relation. A proof reaches for it through [[AffineConstructive.tactics.rewrite.srewrite.solve_if_given]], never directly; it is local to the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.handle_symmetry","base":"handle_symmetry","kind":"ltac","start":8,"body":null,"status":"ok","short":{"text":"Proves that a given strict relation at (b, a) implies the target relation at (a, b), using symmetry","status":"ok"},"long":{"text":"The tactic is the reversed counterpart of [[AffineConstructive.tactics.rewrite.srewrite.handle_subrel]]. It closes a goal saying that R2 at (b, a) implies R at (a, b). When R and R2 are the same relation, an instance of [[AffineConstructive.interfaces.sprop.sSymmetric]] for that relation finishes the proof. When they differ, it tries two routes. The first uses the symmetry of R2 to turn the hypothesis into R2 at (a, b). The second reduces the goal to R at (b, a) and then uses the symmetry of R. Either route leaves R2 implying R on a single pair, which [[AffineConstructive.tactics.rewrite.srewrite.handle_subrel]] then proves. If neither relation has a symmetry instance, it prints the goal and fails with a message naming the missing instance.\n\nIt serves rewrites from right to left, where the obligation runs opposite to the supplied equation. It is local to the file and is reached through [[AffineConstructive.tactics.rewrite.srewrite.solve_if_given]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.fixup_given_sym","base":"fixup_given_sym","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"Proves that the given relation between b and a implies the demanded relation between a and b","status":"ok"},"long":{"text":"The goal is an implication: the type of the given equation implies a strict relation R (a, b). The tactic expects the hypothesis to be a relation R2 on the reversed pair (b, a). If the hypothesis is not visibly of that form, the tactic first restates it as R2 (b, a) by conversion.\n\nWhen R2 and R are the same relation, the tactic applies an [[AffineConstructive.interfaces.sprop.sSymmetric]] instance for it. When they differ, there are two routes. The first applies symmetry of R2, which turns the hypothesis into R2 (a, b), and then a [[AffineConstructive.interfaces.sprop.sSubrelation]] instance from R2 to R. The second applies symmetry of R, which turns the goal into R (b, a), and then the subrelation instance. If no symmetry instance or no subrelation instance is found, the tactic prints the goal and fails. It serves [[AffineConstructive.tactics.rewrite.srewrite.solve_given_sym]], for rewrites that run from right to left.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.fixup_given","base":"fixup_given","kind":"ltac","start":10,"body":null,"status":"ok","short":{"text":"Proves that the given relation on a pair implies the demanded relation on the same pair","status":"ok"},"long":{"text":"The goal is an implication: the type of the given equation implies a strict relation R p. The tactic expects the hypothesis to be R2 p for some relation R2 on the same pair. If it is not visibly of that form, the tactic first restates it that way by conversion.\n\nWhen R2 is R, the implication is the identity. Otherwise the tactic looks for a [[AffineConstructive.interfaces.sprop.sSubrelation]] instance from R2 to R and applies it, or prints the goal and fails when there is none. It serves [[AffineConstructive.tactics.rewrite.srewrite.solve_given]], for rewrites that run from left to right.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.solve_given_aux","base":"solve_given_aux","kind":"ltac","start":11,"body":null,"status":"ok","short":{"text":"Reduces a tagged obligation to an implication from the given equation, then finishes it with a supplied tactic","status":"ok"},"long":{"text":"The tactic takes a finishing tactic and the given equation E. The goal is a relation between two tagged terms. The tactic unfolds the tags [[AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_l]] and [[AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_r]] to the endpoints they stand for. It then applies an unknown function to E, which leaves the goal of showing that the type of E implies the relation demanded.\n\nIf the type of E is a universal statement, it is a dependent product that the relation-matching cannot see as a relation on a pair. The tactic restates it as the strict implication [[AffineConstructive.interfaces.sprop.impl]] on the corresponding pair, so that the hypothesis can be matched against the subrelation instances for implication. The finishing tactic, [[AffineConstructive.tactics.rewrite.srewrite.fixup_given]] or [[AffineConstructive.tactics.rewrite.srewrite.fixup_given_sym]], then proves the implication.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.solve_given","base":"solve_given","kind":"ltac","start":12,"body":null,"status":"ok","short":{"text":"Closes a forward tagged obligation from the given equation, through a subrelation instance if needed","status":"ok"},"long":{"text":"[[AffineConstructive.tactics.rewrite.srewrite.solve_given_aux]] with [[AffineConstructive.tactics.rewrite.srewrite.fixup_given]] as the finishing tactic. It handles an obligation R (a, b) with a and b tagged in the forward order, for a given equation whose relation may differ from R as long as an [[AffineConstructive.interfaces.sprop.sSubrelation]] instance links them. [[AffineConstructive.tactics.rewrite.srewrite.solve_if_given]] uses it when the relation of the equation is not syntactically the one demanded.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.solve_given_sym","base":"solve_given_sym","kind":"ltac","start":13,"body":null,"status":"ok","short":{"text":"Closes a reversed tagged obligation from the given equation, using symmetry and a subrelation if needed","status":"ok"},"long":{"text":"[[AffineConstructive.tactics.rewrite.srewrite.solve_given_aux]] with [[AffineConstructive.tactics.rewrite.srewrite.fixup_given_sym]] as the finishing tactic. It handles an obligation in which the tags appear swapped, as happens when a rewrite runs from right to left. The given equation relates a to b, and the goal asks for a relation from b to a. The obligation is met with an [[AffineConstructive.interfaces.sprop.sSymmetric]] instance, together with an [[AffineConstructive.interfaces.sprop.sSubrelation]] instance when the relations differ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.solve_if_given","base":"solve_if_given","kind":"ltac","start":14,"body":null,"status":"ok","short":{"text":"Closes a rewriting obligation that relates the two endpoints of the given equation","status":"ok"},"long":{"text":"When a term is rewritten by an equation E proving R' (a, b), the rewriting system marks the occurrences of a and b with [[AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_l]] and [[AffineConstructive.tactics.rewrite.srewrite.srewrite_tag_r]]. At the leaf of the rewrite it then asks for a proof that the two tagged terms are related by whatever relation R the surrounding properness instances demand. This tactic answers that request.\n\nIn the forward case the goal relates the left tag to the right tag. If R' is syntactically R, E closes the goal as it stands. Unification is not attempted otherwise, since it can be expensive. Failing that, [[AffineConstructive.tactics.rewrite.srewrite.solve_given]] passes from R' to R through a subrelation instance. In the reversed case the goal relates the right tag to the left tag, and [[AffineConstructive.tactics.rewrite.srewrite.solve_given_sym]] uses symmetry as well. On failure the tactic prints the goal, the goal with its tags unfolded, and the type of E before it fails.\n\nThe tactic is registered as an extern hint in the `proper` database, alongside a solver for obligations whose two sides coincide. It is invoked automatically by the rewriting tactics and is not called by hand in proofs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.rewrite.srewrite.solve_if_refl","base":"solve_if_refl","kind":"ltac","start":15,"body":null,"status":"ok","short":{"text":"Closes a strict-relation goal R (a, a) by reflexivity, or fails with a message","status":"ok"},"long":{"text":"The tactic matches a goal R (a, b) in which a and b are the same term. On such a goal it applies reflexivity of R and fails with a message naming R and a if no reflexivity is found. The comparison of a and b is syntactic and ignores universe levels, so a pair that becomes equal only after unfolding is not matched.\n\nIt is registered as a hint in the `proper` database. Rewriting therefore discharges, without further help, the congruence obligations on positions the rewrite leaves unchanged. It is local to the file, and a proof never calls it by name.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.tactics.easy":{"page":"../easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.logic.srelations":{"page":"../../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.rewrite.proper":{"page":"proper.html","short":"Hint databases and search tactics for the congruence obligations of rewriting","summary":"The file sets up the hint databases on which the development's rewriting system rests. It creates the `proper` database, where properness and congruence lemmas are registered, and the tactic [[solve_proper]] that searches it by instance resolution, together with [[proper_solution]], which returns the term such a search finds. It also defines a small tagging device, the inductive `RewriteSwapTag` and the database `rewrite_swap_tag`, and the tactic [[swap_rewrite_tag]], which looks up the term declared as the partner of a given term. The rewriting tactics built on top of this file call these to discharge the congruence obligations a rewrite generates and to pass between paired terms."}},"constants":null}</script>

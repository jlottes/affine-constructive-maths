xcn_rect","base":"Excn_rect","kind":"scheme","short":{"text":"Dependent recursion on interpretation errors","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.Excn_ind","base":"Excn_ind","kind":"scheme","short":{"text":"Induction on interpretation errors","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.Excn_rec","base":"Excn_rec","kind":"scheme","short":{"text":"Recursion on interpretation errors into Set","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.Excn_sind","base":"Excn_sind","kind":"scheme","short":{"text":"Induction on interpretation errors into SProp","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.var_not_found","base":"var_not_found","kind":"constr","short":{"text":"Error: the term is not a variable of the context","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.nonlinear_var_use","base":"nonlinear_var_use","kind":"constr","short":{"text":"Error: the given resource is used more than once","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.unexpected_projection","base":"unexpected_projection","kind":"constr","short":{"text":"Error: a projection from a variable whose shape is not a product","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.not_implemented","base":"not_implemented","kind":"constr","short":{"text":"Error: a form the interpretation does not handle","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.type_not_a_set","base":"type_not_a_set","kind":"constr","short":{"text":"Error: a binder's type is not the carrier of a set","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.operation_open_arg","base":"operation_open_arg","kind":"constr","short":{"text":"Error: an operation applied to an argument that depends on the context","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.not_closed","base":"not_closed","kind":"constr","short":{"text":"Error: a term taken as constant mentions a variable of the context","status":"ok"}}]},{"name":"AffineConstructive.tactics.set_internalize.closed_wrt_ctx","base":"closed_wrt_ctx","kind":"ltac","start":39,"body":null,"status":"ok","short":{"text":"Tests whether a term mentions none of the variables of an interpretation context","status":"ok"},"long":{"text":"This tactic walks the variables of a context ([[AffineConstructive.tactics.set_internalize.ACtx]]) and answers false as soon as the term contains one of them, and true otherwise. A term that is closed in this sense mentions no resource, so the interpreter can treat it as a constant.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.closed_wrt_aliases","base":"closed_wrt_aliases","kind":"ltac","start":40,"body":null,"status":"ok","short":{"text":"Tests whether a term mentions none of the names bound by an alias list","status":"ok"},"long":{"text":"This is the counterpart of [[AffineConstructive.tactics.set_internalize.closed_wrt_ctx]] for the names that `let` has introduced as aliases ([[AffineConstructive.tactics.set_internalize.AliasList]]). The test is needed because an alias stands for part of a context variable: a term that mentions the alias uses that resource even though no context variable appears in it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.closed_wrt","base":"closed_wrt","kind":"ltac","start":41,"body":null,"status":"ok","short":{"text":"Tests whether a term is closed with respect to both the context and the aliases","status":"ok"},"long":{"text":"This tactic combines [[AffineConstructive.tactics.set_internalize.closed_wrt_ctx]] and [[AffineConstructive.tactics.set_internalize.closed_wrt_aliases]]. A closed term is interpreted as a constant function on the empty selection of the context. An open term must instead be decomposed, and an open term the interpreter cannot decompose is reported as an error ([[AffineConstructive.tactics.set_internalize.not_closed]], [[AffineConstructive.tactics.set_internalize.operation_open_arg]]) rather than captured in a constant.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.reify_ctx","base":"reify_ctx","kind":"ltac","start":42,"body":null,"status":"ok","short":{"text":"Builds the tuple of a context's variables, a point of the context's set","status":"ok"},"long":{"text":"This tactic turns the variables of a context into a nested pair, or the unit element when the context is empty. The result is the point of the context's set at which the context's variables take their present values. After an abstraction, [[AffineConstructive.tactics.set_internalize.unwrap_abs_inner]] evaluates the interpreted function at this point to obtain the proof that the rebuilt λ-term preserves equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.aprodt","base":"aprodt","kind":"ltac","start":43,"body":null,"status":"ok","short":{"text":"The tensor of two shapes, omitting a unit factor","status":"ok"},"long":{"text":"This smart constructor forms [[AffineConstructive.tactics.set_internalize.AProdT]] of two shapes unless one of them is [[AffineConstructive.tactics.set_internalize.AUnit]], in which case the other is returned. The realized sets therefore never carry a spurious factor 𝟏, which keeps the generated functions free of unitors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.aprodc","base":"aprodc","kind":"ltac","start":44,"body":null,"status":"ok","short":{"text":"The cartesian product of two shapes, omitting a unit factor","status":"ok"},"long":{"text":"This is the counterpart of [[AffineConstructive.tactics.set_internalize.aprodt]] for [[AffineConstructive.tactics.set_internalize.AProdC]]: a factor [[AffineConstructive.tactics.set_internalize.AUnit]] is dropped and the other shape is returned.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.realize_shape","base":"realize_shape","kind":"ltac","start":45,"body":null,"status":"ok","short":{"text":"The shape of the part of a set that a selection keeps","status":"ok"},"long":{"text":"A selection ([[AffineConstructive.tactics.set_internalize.ASubShape]]) marks leaves of a shape as used ([[AffineConstructive.tactics.set_internalize.ASubTop]]) or unused ([[AffineConstructive.tactics.set_internalize.ASubBot]]). This tactic returns the shape of the selected part. A selected subtree keeps its shape, an unused one becomes the unit, and products are rebuilt with [[AffineConstructive.tactics.set_internalize.aprodt]] and [[AffineConstructive.tactics.set_internalize.aprodc]], so units disappear.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.realize_ctx_shape","base":"realize_ctx_shape","kind":"ltac","start":46,"body":null,"status":"ok","short":{"text":"The shape of the selected part of a whole context, the tensor of its variables' parts","status":"ok"},"long":{"text":"This tactic applies [[AffineConstructive.tactics.set_internalize.realize_shape]] to each variable of a context selection ([[AffineConstructive.tactics.set_internalize.ASubCtx]]) and combines the results with [[AffineConstructive.tactics.set_internalize.aprodt]]. The variables of a context are separate resources, so they are combined by the tensor. The set of the resulting shape is the domain D of the [[AffineConstructive.tactics.set_internalize.Judgment]] of a term that uses exactly this selection.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.comp","base":"comp","kind":"ltac","start":47,"body":null,"status":"ok","short":{"text":"Composition of two functions of sets, omitting identities","status":"ok"},"long":{"text":"This tactic forms g ∘ f, except that when either factor is syntactically [[AffineConstructive.interfaces.set.id_fun]] it returns the other. Every composite the interpreter generates goes through it, so the resulting functions stay readable and reduce well.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.tmap","base":"tmap","kind":"ltac","start":48,"body":null,"status":"ok","short":{"text":"The tensor ⟨f, g⟩ of two functions, the identity when both are identities","status":"ok"},"long":{"text":"This tactic builds the map f ⊗ g between tensor products. When both maps are identities it returns the identity on the tensor instead. It is the tensor counterpart of [[AffineConstructive.tactics.set_internalize.pmap]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.pmap","base":"pmap","kind":"ltac","start":49,"body":null,"status":"ok","short":{"text":"The cartesian product of two functions, the identity when both are identities","status":"ok"},"long":{"text":"This tactic builds [[AffineConstructive.theory.set.prod_map]] of two functions between cartesian products. When both are identities it returns the identity on the product instead.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.aprodt_mor","base":"aprodt_mor","kind":"ltac","start":50,"body":null,"status":"ok","short":{"text":"Combines two shape morphisms into one between tensor products of shapes","status":"ok"},"long":{"text":"Given morphisms ([[AffineConstructive.tactics.set_internalize.SMor]]) A₁ → B₁ and A₂ → B₂, this tactic produces a morphism from the tensor of the domains to the tensor of the codomains, dropping unit factors as [[AffineConstructive.tactics.set_internalize.aprodt]] does. When one domain is the unit, the other morphism is returned unchanged. When one codomain is the unit, that factor is discarded by the projection [[AffineConstructive.theory.set.tensor_proj1]] or [[AffineConstructive.theory.set.tensor_proj2]]. Discarding a factor is allowed because the logic is affine. Otherwise the result is [[AffineConstructive.tactics.set_internalize.tmap]] of the two maps.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.aprodc_mor","base":"aprodc_mor","kind":"ltac","start":51,"body":null,"status":"ok","short":{"text":"Combines two shape morphisms into one between cartesian products of shapes","status":"ok"},"long":{"text":"This is the counterpart of [[AffineConstructive.tactics.set_internalize.aprodt_mor]] for cartesian products. It drops unit factors in the same way, discards a factor by [[AffineConstructive.theory.set.prod_proj1]] or [[AffineConstructive.theory.set.prod_proj2]], and otherwise forms [[AffineConstructive.tactics.set_internalize.pmap]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.realize_shape_mor","base":"realize_shape_mor","kind":"ltac","start":52,"body":null,"status":"ok","short":{"text":"The projection from a shape's set onto the part a selection keeps","status":"ok"},"long":{"text":"For a selection of a shape, this tactic builds the morphism from the whole set to the realized selected part ([[AffineConstructive.tactics.set_internalize.realize_shape]]). A selected leaf contributes the identity, and an unused leaf the map [[AffineConstructive.theory.set.to_Unit]] into the one-point set. Products are combined by [[AffineConstructive.tactics.set_internalize.aprodt_mor]] and [[AffineConstructive.tactics.set_internalize.aprodc_mor]], so the result is the composite of projections that throws away what is not used.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.realize_ctx_shape_mor","base":"realize_ctx_shape_mor","kind":"ltac","start":53,"body":null,"status":"ok","short":{"text":"The projection from the whole context's set onto the part a context selection keeps","status":"ok"},"long":{"text":"This tactic applies [[AffineConstructive.tactics.set_internalize.realize_shape_mor]] to each variable of a context selection and combines the results by the tensor with [[AffineConstructive.tactics.set_internalize.aprodt_mor]]. A judgment's function is defined only on the resources the term uses. Precomposing it with this projection extends it to the set of the whole context, which is how [[AffineConstructive.tactics.set_internalize.unwrap_abs_inner]] evaluates it at the tuple of [[AffineConstructive.tactics.set_internalize.reify_ctx]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.F_A_mor","base":"F_A_mor","kind":"ltac","start":54,"body":null,"status":"ok","short":{"text":"Builds the map from the part of a variable selected by S to the smaller part selected by T","status":"ok"},"long":{"text":"Given two selections S and T of the same variable shape (values of [[AffineConstructive.tactics.set_internalize.ASubShape]]), with T selecting no more than S, the tactic produces the function from the set realized by S to the set realized by T, wrapped as an [[AffineConstructive.tactics.set_internalize.SMor]]. This is the action on morphisms of the functor that sends a selection to the product of the components it selects: a selection of nothing goes to the one-point set by [[AffineConstructive.theory.set.to_Unit]], a full selection S goes to the map that keeps exactly the leaves T selects, and a tensor or cartesian node is handled componentwise.\n\nThe components are combined so that unit factors never appear: a side that selects nothing is dropped, and when only one side of a product survives in the target the map is a projection ([[AffineConstructive.theory.set.tensor_proj1]], [[AffineConstructive.theory.set.tensor_proj2]], [[AffineConstructive.theory.set.prod_proj1]], [[AffineConstructive.theory.set.prod_proj2]]) followed by the map on that side. It does not check that T is below S; [[AffineConstructive.tactics.set_internalize.F_Γ_mor_checked]] does that for whole contexts.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.F_Γ_mor","base":"F_Γ_mor","kind":"ltac","start":55,"body":null,"status":"ok","short":{"text":"Builds the map from the context part selected by S to the smaller part selected by T","status":"ok"},"long":{"text":"The context version of [[AffineConstructive.tactics.set_internalize.F_A_mor]]. Given two selections S and T of the same context (values of [[AffineConstructive.tactics.set_internalize.ASubCtx]]), with T below S, it walks the list of variables, applies [[AffineConstructive.tactics.set_internalize.F_A_mor]] to each variable's pair of selections, and tensors the results along the spine, dropping unit factors. The result is the function from the set interpreting the variables used by S to the set interpreting those used by T, the projection that forgets what T does not need.\n\nThe interpreter uses it to bring a subterm's interpretation, whose domain is the subterm's own variables, onto a larger domain: the variables of an enclosing pair, or the context extended by a binder.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.LeOk","base":"LeOk","kind":"ind","start":56,"body":null,"status":"ok","short":{"text":"The sentinel reporting that one selection is contained in another","status":"ok"},"long":{"text":"A one-element type whose element is the success value of the linearity check. The check walks two selections of a context side by side. It returns this value when the second is contained in the first; otherwise it returns the path to a resource the second uses and the first lacks.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.set_internalize.LeOk_rect","base":"LeOk_rect","kind":"scheme","short":{"text":"Dependent recursion on the sentinel type","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.LeOk_ind","base":"LeOk_ind","kind":"scheme","short":{"text":"Induction on the sentinel type","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.LeOk_rec","base":"LeOk_rec","kind":"scheme","short":{"text":"Recursion on the sentinel type into Set","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.LeOk_sind","base":"LeOk_sind","kind":"scheme","short":{"text":"Induction on the sentinel type into SProp","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.le_ok","base":"le_ok","kind":"constr","short":{"text":"The success value of the containment check","status":"ok"}}]},{"name":"AffineConstructive.tactics.set_internalize.find_bot_leaf","base":"find_bot_leaf","kind":"ltac","start":57,"body":null,"status":"ok","short":{"text":"Finds a leaf a selection leaves out, returning the projection chain to it, or reports none","status":"ok"},"long":{"text":"Walks a selection S of a variable shape and returns the first leaf S does not select, as the chain of first and second projections from the given term that reaches it; when S selects every leaf it returns the marker [[AffineConstructive.tactics.set_internalize.le_ok]]. It is the case of [[AffineConstructive.tactics.set_internalize.find_violation]] where the smaller selection takes the whole of a subtree, so the larger must too.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.find_top_leaf","base":"find_top_leaf","kind":"ltac","start":58,"body":null,"status":"ok","short":{"text":"Finds a leaf a selection uses, returning the projection chain to it, or reports none","status":"ok"},"long":{"text":"Walks a selection T of a variable shape and returns the first leaf T selects, as a chain of projections from the given term; when T selects nothing it returns [[AffineConstructive.tactics.set_internalize.le_ok]]. It is the case of [[AffineConstructive.tactics.set_internalize.find_violation]] where the larger selection has nothing in a subtree, so anything the smaller one uses there is a violation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.find_violation","base":"find_violation","kind":"ltac","start":59,"body":null,"status":"ok","short":{"text":"Checks one selection of a variable lies below another, locating a leaf where it fails","status":"ok"},"long":{"text":"Walks two selections S and T of the same variable shape in lockstep, carrying the term reached so far as a chain of projections. It returns [[AffineConstructive.tactics.set_internalize.le_ok]] when every leaf T selects is also selected by S, and otherwise the projection chain naming a component that T uses and S does not have. When one side is a whole leaf or a whole subtree it defers to [[AffineConstructive.tactics.set_internalize.find_bot_leaf]] or [[AffineConstructive.tactics.set_internalize.find_top_leaf]].\n\nThis is the linearity check: S is what remains available, T is what a subterm wants, and a violation means a resource would be used twice.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.find_violation_Γ","base":"find_violation_Γ","kind":"ltac","start":60,"body":null,"status":"ok","short":{"text":"Checks one context selection lies below another, locating the first resource used twice","status":"ok"},"long":{"text":"Runs [[AffineConstructive.tactics.set_internalize.find_violation]] on each variable of a context, starting from the variable itself as the root of the projection chain, and returns the first violation found, or [[AffineConstructive.tactics.set_internalize.le_ok]] when the selection T is below S at every variable.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.F_Γ_mor_checked","base":"F_Γ_mor_checked","kind":"ltac","start":61,"body":null,"status":"ok","short":{"text":"Builds the projection between two context selections, or reports the resource used twice","status":"ok"},"long":{"text":"Combines the linearity check with the construction of the map: it runs [[AffineConstructive.tactics.set_internalize.find_violation_Γ]] on S and T, and if T lies below S returns [[AffineConstructive.tactics.set_internalize.F_Γ_mor]] of them; otherwise it returns the error [[AffineConstructive.tactics.set_internalize.nonlinear_var_use]] applied to the projection chain that names the offending component. The interpreter of pairs calls it with S the resources left over after the first component, so a failure means the second component needs something the first has consumed, and the pair must be cartesian instead of a tensor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_check_ok","base":"test_check_ok","kind":"def","start":62,"body":null,"status":"ok","short":{"text":"Test: the checked projection between nested selections succeeds","status":"ok"},"long":{"text":"A test of the linearity check. The context has a variable x in X and a variable y in Y ⊗ Z. The larger selection uses everything; the smaller uses only x. The check succeeds and returns the projection onto X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_check_var_violation","base":"test_check_var_violation","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"Test: the check reports y when a selection uses a variable the other lacks","status":"ok"},"long":{"text":"A test of the linearity check. The second selection uses the variable y, which the first does not have. The check returns the error [[AffineConstructive.tactics.set_internalize.nonlinear_var_use]] naming y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_check_leaf_violation","base":"test_check_leaf_violation","kind":"def","start":64,"body":null,"status":"ok","short":{"text":"Test: the check pinpoints the second factor of y as the overused resource","status":"ok"},"long":{"text":"A test of the linearity check at the level of a single factor. The first selection holds only the left factor of y in Y ⊗ Z, and the second uses all of y. The check returns [[AffineConstructive.tactics.set_internalize.nonlinear_var_use]] naming the second projection of y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.SplitMor","base":"SplitMor","kind":"ind","start":65,"body":null,"status":"ok","short":{"text":"A function X ⇾ Y ⊗ Z splitting a resource into a used part and a residue","status":"ok"},"long":{"text":"A function from the realisation of one shape into the tensor of two others, tagged with all three shapes. It splits the resources of a selection into the part a subterm uses and the residue left for the rest of the term. Copyable atoms appear on both sides through their diagonal. Atoms are consumed. A cartesian product that is entered at all has no residue, since its components cannot be separated. The tensor pairing of two subterms factors through such a splitting.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.set_internalize.SplitMor_rect","base":"SplitMor_rect","kind":"scheme","short":{"text":"Dependent recursion on splittings","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.SplitMor_ind","base":"SplitMor_ind","kind":"scheme","short":{"text":"Induction on splittings","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.SplitMor_rec","base":"SplitMor_rec","kind":"scheme","short":{"text":"Recursion on splittings into Set","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.SplitMor_sind","base":"SplitMor_sind","kind":"scheme","short":{"text":"Induction on splittings into SProp","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.splitmor","base":"splitmor","kind":"constr","short":{"text":"Tags a splitting function with the shapes of its source, used part and residue","status":"ok"}}]},{"name":"AffineConstructive.tactics.set_internalize.exchange","base":"exchange","kind":"def","start":66,"body":null,"status":"ok","short":{"text":"The middle-four interchange (A ⊗ B) ⊗ (C ⊗ D) ⇾ (A ⊗ C) ⊗ (B ⊗ D)","status":"ok"},"long":{"text":"The interchange of the two middle factors of a fourfold tensor product. It is built from associators and the swap of the tail of a triple. The tactic splits each of two tensor factors into a used part and a residue. The interchange regroups the result so that the used parts sit together and the residues sit together.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.unitor_combine_t","base":"unitor_combine_t","kind":"ltac","start":67,"body":null,"status":"ok","short":{"text":"The map X ⊗ Y ⇾ X ⊗ Y with unit factors removed, matching how shapes are tensored","status":"ok"},"long":{"text":"Shapes are tensored without unit factors: tensoring with the empty shape returns the other shape. When two split morphisms are tensored, their targets come out as honest tensors, possibly with a factor 𝟏, and this tactic supplies the map from that tensor to the set of the combined shape: the left or right unitor ([[AffineConstructive.theory.set.tensor_unit_l]], [[AffineConstructive.theory.set.tensor_unit_r]]) when one side is the unit shape, and the identity otherwise.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.aprodt_split","base":"aprodt_split","kind":"ltac","start":68,"body":null,"status":"ok","short":{"text":"Tensors two split morphisms, regrouping the used and residual parts","status":"ok"},"long":{"text":"A split morphism ([[AffineConstructive.tactics.set_internalize.SplitMor]]) is a function X ⇾ Y ⊗ Z sending a resource to the part a subterm uses and the part left over. Given two of them, on X₁ and X₂, this tactic builds the split morphism on X₁ ⊗ X₂: tensor the two maps, regroup (Y₁ ⊗ Z₁) ⊗ (Y₂ ⊗ Z₂) into (Y₁ ⊗ Y₂) ⊗ (Z₁ ⊗ Z₂) by [[AffineConstructive.tactics.set_internalize.exchange]], and remove unit factors on each side by [[AffineConstructive.tactics.set_internalize.unitor_combine_t]]. A side whose source shape is the unit is dropped altogether.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asplit_all","base":"asplit_all","kind":"ltac","start":69,"body":null,"status":"ok","short":{"text":"Splits a whole resource into all of it used and the largest residue that survives","status":"ok"},"long":{"text":"For a shape A, builds the split morphism from A to A itself (everything used) and the maximal residue, what can still be offered to a later subterm. A plain atom is consumed, its residue the unit; an atom with affirmative equality is duplicated by its diagonal [[AffineConstructive.theory.set.tensor_diag]] and survives whole; a tensor is split componentwise by [[AffineConstructive.tactics.set_internalize.aprodt_split]]; a cartesian product is consumed whole, since using one of its components already commits to the choice the additive product offers. This is where affirmative equality pays: such variables may be used any number of times.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.realize_shape_split","base":"realize_shape_split","kind":"ltac","start":70,"body":null,"status":"ok","short":{"text":"Splits a whole resource into the part a selection uses and the largest residue","status":"ok"},"long":{"text":"The split morphism for a full resource of shape A and a selection T of it: a function from the set of A to the tensor of the selected part and the residue. Where T selects nothing, the whole resource is residue; where T selects a whole subtree, [[AffineConstructive.tactics.set_internalize.asplit_all]] applies; a tensor node is split componentwise. At a cartesian node that is partly used, a projection picks the used side when the other is untouched, and otherwise the used parts are taken by a product of maps and the residue is the unit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.F_A_split","base":"F_A_split","kind":"ltac","start":71,"body":null,"status":"ok","short":{"text":"Splits the part S of a resource into the part T a subterm uses and the residue","status":"ok"},"long":{"text":"The general case of [[AffineConstructive.tactics.set_internalize.realize_shape_split]], for an available part S of a variable rather than the whole of it, with T below S. It returns a split morphism from the set realized by S to the tensor of the set realized by T and the residue. The cases follow those of [[AffineConstructive.tactics.set_internalize.F_A_mor]], with the residue rules of [[AffineConstructive.tactics.set_internalize.asplit_all]]: plain atoms are consumed, affirmative atoms duplicated, tensors split componentwise, and a cartesian product that is used commits, leaving no residue.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.F_Γ_split","base":"F_Γ_split","kind":"ltac","start":72,"body":null,"status":"ok","short":{"text":"Splits the available part of a context into the part a subterm uses and the residue","status":"ok"},"long":{"text":"Runs [[AffineConstructive.tactics.set_internalize.F_A_split]] on each variable of a context and tensors the results along the spine by [[AffineConstructive.tactics.set_internalize.aprodt_split]]. Given the selection S of the context a pair needs and the selection T its first component uses, the result is the function that hands the first component its resources and keeps the rest for the second: the multiplicative splitting of the context in the rule for a tensor pair.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asubprodt","base":"asubprodt","kind":"ltac","start":73,"body":null,"status":"ok","short":{"text":"Pairs two selections over a tensor shape, collapsing all-used or all-unused pairs","status":"ok"},"long":{"text":"This smart constructor forms [[AffineConstructive.tactics.set_internalize.ASubProdT]] of two selections. When both are [[AffineConstructive.tactics.set_internalize.ASubTop]], or both are [[AffineConstructive.tactics.set_internalize.ASubBot]], it returns the corresponding single leaf for the tensor shape instead. Selections are thereby kept in a normal form, which the matching of the other tactics relies on.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asubprodc","base":"asubprodc","kind":"ltac","start":74,"body":null,"status":"ok","short":{"text":"Pairs two selections over a cartesian shape, collapsing all-used or all-unused pairs","status":"ok"},"long":{"text":"This is the counterpart of [[AffineConstructive.tactics.set_internalize.asubprodt]] for [[AffineConstructive.tactics.set_internalize.ASubProdC]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asub_union","base":"asub_union","kind":"ltac","start":75,"body":null,"status":"ok","short":{"text":"The union of two selections of the same shape","status":"ok"},"long":{"text":"This tactic computes the union of two selections leafwise: a part is used if either selection uses it. The products are rebuilt with [[AffineConstructive.tactics.set_internalize.asubprodt]] and [[AffineConstructive.tactics.set_internalize.asubprodc]]. The union is the resource requirement of a term with two subterms, such as a pair.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asubctx_empty","base":"asubctx_empty","kind":"ltac","start":76,"body":null,"status":"ok","short":{"text":"The selection of a context that uses no variable","status":"ok"},"long":{"text":"This tactic marks every variable of a context with [[AffineConstructive.tactics.set_internalize.ASubBot]]. A constant, which uses no resource, has this selection, and the variable look-up starts from it for the variables it passes over.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asubctx_union","base":"asubctx_union","kind":"ltac","start":77,"body":null,"status":"ok","short":{"text":"The union of two selections of the same context, variable by variable","status":"ok"},"long":{"text":"This tactic applies [[AffineConstructive.tactics.set_internalize.asub_union]] to each variable of two selections of the same context. A pair or an application uses the union of the resources its two subterms use.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asplit_residue","base":"asplit_residue","kind":"ltac","start":78,"body":null,"status":"ok","short":{"text":"The selection describing what remains of a whole resource after a selection T is used","status":"ok"},"long":{"text":"The selection-level counterpart of the residue computed by [[AffineConstructive.tactics.set_internalize.realize_shape_split]]: for a shape A and a selection T of it, the selection of A that remains available. Unused subtrees remain whole; a used plain atom is gone, a used affirmative atom remains, a tensor is treated componentwise, and a cartesian product that is used is gone. The interpreter needs both the morphism and this selection, the latter to check the next subterm against.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asub_residue_subshape","base":"asub_residue_subshape","kind":"ltac","start":79,"body":null,"status":"ok","short":{"text":"The selection describing what remains of an available part S after T is used","status":"ok"},"long":{"text":"Generalises [[AffineConstructive.tactics.set_internalize.asplit_residue]] from a whole resource to an available part S of it, mirroring the rules of [[AffineConstructive.tactics.set_internalize.F_A_split]]: if T uses nothing the residue is S, at a full leaf of S the residue of the whole shape applies, tensor nodes are treated componentwise, and a cartesian node of S leaves nothing.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.asubctx_residue","base":"asubctx_residue","kind":"ltac","start":80,"body":null,"status":"ok","short":{"text":"The context selection describing what remains after a subterm uses T out of S","status":"ok"},"long":{"text":"Applies [[AffineConstructive.tactics.set_internalize.asub_residue_subshape]] to each variable of a context. The interpreter of pairs computes with it the resources left for the second component once the first has taken its share, and then checks the second component's needs against them with [[AffineConstructive.tactics.set_internalize.F_Γ_mor_checked]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.var_shape","base":"var_shape","kind":"ltac","start":81,"body":null,"status":"ok","short":{"text":"Looks up the shape of a variable in a context, or reports it not found","status":"ok"},"long":{"text":"This tactic returns the [[AffineConstructive.tactics.set_internalize.AShape]] that the context assigns to a variable. When the variable is absent it returns the error value [[AffineConstructive.tactics.set_internalize.var_not_found]], which tells the interpreter to try the term as something other than a variable.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.resource_shape","base":"resource_shape","kind":"ltac","start":82,"body":null,"status":"ok","short":{"text":"The shape of a context variable or of a chain of projections out of one","status":"ok"},"long":{"text":"This tactic follows a chain of first and second projections down to a context variable. The variable's shape comes from [[AffineConstructive.tactics.set_internalize.var_shape]], and each projection descends into the corresponding factor of a tensor or cartesian shape. A projection out of a shape that is not a product yields [[AffineConstructive.tactics.set_internalize.unexpected_projection]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.lookup_alias","base":"lookup_alias","kind":"ltac","start":83,"body":null,"status":"ok","short":{"text":"The term an alias stands for, or not found","status":"ok"},"long":{"text":"This tactic searches an alias list ([[AffineConstructive.tactics.set_internalize.AliasList]]) for a name and returns the term recorded for it. When the name is absent it returns [[AffineConstructive.tactics.set_internalize.var_not_found]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.expand_alias","base":"expand_alias","kind":"ltac","start":84,"body":null,"status":"ok","short":{"text":"Resolves a term to a context resource through aliases, returning its shape and expansion","status":"ok"},"long":{"text":"Given a variable, an alias, or a chain of projections out of either, this tactic returns a pair: the shape of the resource the term denotes, and the term rewritten in terms of context variables. Aliases are resolved first, and each projection then selects a factor of the shape. When the term does not denote a resource, it returns [[AffineConstructive.tactics.set_internalize.var_not_found]] or [[AffineConstructive.tactics.set_internalize.unexpected_projection]]. [[AffineConstructive.tactics.set_internalize.interpret_let_in]] uses the result to decide whether a definiens is an alias.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.proj_path_acc","base":"proj_path_acc","kind":"ltac","start":85,"body":null,"status":"ok","short":{"text":"Peels the projections off a term, returning the root and the path of left and right steps","status":"ok"},"long":{"text":"Given a term built by first and second projections from some root, returns the root together with the path down to the term, as a nested list of booleans read from the root (true for the first component, false for the second), appended to the given accumulator. Variable lookup uses the path to select, inside a variable's shape, exactly the component a projection reaches.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.alias_proj_path_acc","base":"alias_proj_path_acc","kind":"ltac","start":86,"body":null,"status":"ok","short":{"text":"Splits a projection chain into its root variable and its path, resolving an alias root","status":"ok"},"long":{"text":"This tactic peels first and second projections off a term and records them as a path of left and right turns read from the root. When the root is an alias, the term the alias stands for is substituted and its own projections are peeled too. The result is a context variable together with the path that locates the used part inside it. The variable look-up then turns this path into a selection that uses that part only.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.descend_subshape","base":"descend_subshape","kind":"ltac","start":87,"body":null,"status":"ok","short":{"text":"The selection of a shape consisting of the one subtree a projection path reaches","status":"ok"},"long":{"text":"Walks a shape along a path from [[AffineConstructive.tactics.set_internalize.proj_path_acc]], selecting the whole subtree at its end and nothing elsewhere. A projection of a variable thus uses only the component it names, leaving the other components of a tensor available to the rest of the term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.build_coercion","base":"build_coercion","kind":"ltac","start":88,"body":null,"status":"ok","short":{"text":"Builds the canonical function from one set to another along !, ⊗ and × structure","status":"ok"},"long":{"text":"Given two sets X and Y whose carriers agree, builds a function X ⇾ Y that is the identity on elements, by recursion on their structure: the identity when they are equal, the counit [[AffineConstructive.theory.set.of_course_counit]] from !X to X, coextension [[AffineConstructive.theory.set.of_course_extend]] between of-course sets, the comparisons [[AffineConstructive.theory.set.of_course_tensor_set]] and [[AffineConstructive.theory.set.of_course_prod_set]] to push ! into a product, componentwise maps on tensors and cartesian products, and [[AffineConstructive.theory.set.tensor_to_prod]] from a tensor to a cartesian product. When nothing applies it falls back to the counit or the identity.\n\nThe interpreter inserts it where the set a term was found to live in is finer than the one its position asks for: a variable of !X used at X, a tensor pair where a cartesian one is expected, a body landing in !Ω where Ω is wanted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_var_aux","base":"interpret_var_aux","kind":"ltac","start":89,"body":null,"status":"ok","short":{"text":"Looks a variable up in the context and interprets it, or its projection, as an identity","status":"ok"},"long":{"text":"Searches the context from the most recent variable for one equal to the given root. At the match, the selection of that variable is the subtree reached by the projection path ([[AffineConstructive.tactics.set_internalize.descend_subshape]]), every other variable is unselected, and the judgment is the identity on the set the selection realizes, with the original term recorded. The domain of a judgment is the set of exactly the resources it uses, so a variable's interpretation is the identity. Returns [[AffineConstructive.tactics.set_internalize.var_not_found]] when no variable matches.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_var","base":"interpret_var","kind":"ltac","start":90,"body":null,"status":"ok","short":{"text":"Interprets a variable or a projection chain of one, resolving let-aliases and coercing to the expected set","status":"ok"},"long":{"text":"Peels projections off the term, resolving any let-bound alias at the root to its definition, and calls [[AffineConstructive.tactics.set_internalize.interpret_var_aux]]. The expected type, when it is the carrier of a set Y different from the set the variable lives in, makes it compose with [[AffineConstructive.tactics.set_internalize.build_coercion]]. Returns [[AffineConstructive.tactics.set_internalize.var_not_found]] when the term is not a variable, which sends [[AffineConstructive.tactics.set_internalize.interpret]] on to applications and constants.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.ashape_from_set","base":"ashape_from_set","kind":"ltac","start":91,"body":null,"status":"ok","short":{"text":"Computes the resource shape of a set from its tensor and cartesian structure","status":"ok"},"long":{"text":"Decomposes a set X into tensor and cartesian products, down to convertibility, so that names defined as products are seen through, and builds the corresponding [[AffineConstructive.tactics.set_internalize.AShape]]. At an atom it asks resolution for [[AffineConstructive.interfaces.set.AffirmativeEquality]]: if found, the atom is copyable and carries its diagonal [[AffineConstructive.theory.set.tensor_diag]]; otherwise it is a plain, use-once atom. The shape decides how a bound variable may be used and split among subterms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.ashape_from_type","base":"ashape_from_type","kind":"ltac","start":92,"body":null,"status":"ok","short":{"text":"Computes the resource shape of a type that is the carrier of a set","status":"ok"},"long":{"text":"Recognises a type as the carrier of some set X, up to convertibility, and hands X to [[AffineConstructive.tactics.set_internalize.ashape_from_set]]. When the type is not a carrier it returns [[AffineConstructive.tactics.set_internalize.type_not_a_set]]. It is applied to the type of each λ-binder.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_ashape_atom","base":"test_ashape_atom","kind":"def","start":93,"body":null,"status":"ok","short":{"text":"Test: an arbitrary set gets the atomic shape","status":"ok"},"long":{"text":"A test that the shape computed for a set with no further structure is a plain atom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_ashape_iatom","base":"test_ashape_iatom","kind":"def","start":94,"body":null,"status":"ok","short":{"text":"Test: a set with affirmative equality gets the copyable atomic shape","status":"ok"},"long":{"text":"A test that a set with [[AffineConstructive.interfaces.set.AffirmativeEquality]] receives the copyable atomic shape, whose diagonal comes from the affirmative equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_ashape_tensor","base":"test_ashape_tensor","kind":"def","start":95,"body":null,"status":"ok","short":{"text":"Test: X ⊗ Y gets a tensor shape","status":"ok"},"long":{"text":"A test that the shape computed for X ⊗ Y is the tensor of two atoms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_ashape_cart","base":"test_ashape_cart","kind":"def","start":96,"body":null,"status":"ok","short":{"text":"Test: X × Y gets a cartesian shape","status":"ok"},"long":{"text":"A test that the shape computed for X × Y is the cartesian product of two atoms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_ashape_nested","base":"test_ashape_nested","kind":"def","start":97,"body":null,"status":"ok","short":{"text":"Test: the shape of (X ⊗ !Y) × Z, a nested product","status":"ok"},"long":{"text":"A test of shape computation on a nested product that mixes ⊗ and ×. Its middle factor is !Y, whose equality is affirmative, so that factor is a copyable atom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.JudgmentAbsInner","base":"JudgmentAbsInner","kind":"rec","start":98,"body":null,"status":"ok","short":{"text":"An interpreted λ-body: a morphism D ⇾ (X ⇾ Y) from the context, with the body","status":"ok"},"long":{"text":"The result of interpreting a body under a binder of set X. Once the bound variable is discharged, the body becomes a morphism from the realised outer context D into the function set X ⇾ Y; this is the curried form of the body's interpretation over D ⊗ X. The record also carries the rewritten body. A second step takes the body out from under the binder, rebuilds the λ-term as a [[AffineConstructive.interfaces.set_lambda.notation.set_lambda]], and produces a [[AffineConstructive.tactics.set_internalize.Judgment]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.set_internalize.judgment_abs_inner_mor","base":"judgment_abs_inner_mor","kind":"proj","short":{"text":"The curried morphism of an interpreted λ-body","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.judgment_abs_inner_tm","base":"judgment_abs_inner_tm","kind":"proj","short":{"text":"The rewritten body of an interpreted λ-body","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.judgment_abs_inner","base":"judgment_abs_inner","kind":"constr","short":{"text":"Builds an interpreted λ-body from a curried morphism and a body","status":"ok"}}]},{"name":"AffineConstructive.tactics.set_internalize.interpret_abs_inner","base":"interpret_abs_inner","kind":"ltac","start":100,"body":null,"status":"ok","short":{"text":"Interprets the body of a λ under its binder and curries the result","status":"ok"},"long":{"text":"Run under the binder of λ x : T, body. It computes the shape of T, extends the context by x, and interprets the body. The body's interpretation has as domain only the resources it uses; [[AffineConstructive.tactics.set_internalize.F_Γ_mor]] widens it to the outer resources the body uses tensored with the whole of x, an unused binder being discarded, and a left unitor supplies the missing factor when the outer part is empty. Currying by [[AffineConstructive.theory.set.curry]] then gives a function from the outer resources to X ⇾ Y, returned as a [[AffineConstructive.tactics.set_internalize.JudgmentAbsInner]]: the rule for abstraction, Γ, x ⊢ t : Y giving Γ ⊢ λ x, t : X ⇾ Y.\n\nThe interpreter of the body is passed as an argument, so the tactic can be tested with [[AffineConstructive.tactics.set_internalize.interpret_stub]] before the full interpreter exists.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_stub","base":"interpret_stub","kind":"ltac","start":101,"body":null,"status":"ok","short":{"text":"A minimal interpreter handling only variables and projections, for testing","status":"ok"},"long":{"text":"Stands in for [[AffineConstructive.tactics.set_internalize.interpret]] in the tests of abstraction defined before it: it interprets a term only when it is a variable or a projection chain of one, by [[AffineConstructive.tactics.set_internalize.interpret_var]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_abs_id","base":"test_abs_id","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"Test: the body x under λ x : X in the empty context","status":"ok"},"long":{"text":"A test of the inner abstraction step. The body x under a binder of X, in the empty context, gives the curried identity 𝟏 ⇾ (X ⇾ X).","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_abs_proj","base":"test_abs_proj","kind":"def","start":103,"body":null,"status":"ok","short":{"text":"Test: the body π₂ p under λ p : X ⊗ Y","status":"ok"},"long":{"text":"A test of the inner abstraction step. The binder has a tensor shape and the body projects onto its second factor. The result is the curried projection 𝟏 ⇾ (X ⊗ Y ⇾ Y).","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_abs_const_ctx","base":"test_abs_const_ctx","kind":"def","start":104,"body":null,"status":"ok","short":{"text":"Test: a body that ignores its binder and uses a context variable","status":"ok"},"long":{"text":"A test of the inner abstraction step. The body is x, from the outer context, under a binder of Y. The interpretation uses only x and gives a morphism X ⇾ (Y ⇾ X).","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.unwrap_abs_inner","base":"unwrap_abs_inner","kind":"ltac","start":105,"body":null,"status":"ok","short":{"text":"Turns an interpreted λ-body into the judgment for the whole λ-term","status":"ok"},"long":{"text":"The body of a λ-term is interpreted under its binder, which gives a family, indexed by the bound variable, of results ([[AffineConstructive.tactics.set_internalize.JudgmentAbsInner]]) carrying a function D ⇾ (X ⇾ Y), already curried. This tactic removes the binder from that family. It rebuilds the λ-term from the reinterpreted body, and wraps it as a function of sets with [[AffineConstructive.interfaces.set_lambda.notation.set_lambda]]. The proof that this function preserves equality comes from [[AffineConstructive.interfaces.set.func_is_fun]] of the interpreted function, composed with the projection of [[AffineConstructive.tactics.set_internalize.realize_ctx_shape_mor]] and evaluated at the tuple of [[AffineConstructive.tactics.set_internalize.reify_ctx]]. The result is a [[AffineConstructive.tactics.set_internalize.Judgment]] with codomain X ⇾ Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_abs","base":"interpret_abs","kind":"ltac","start":106,"body":null,"status":"ok","short":{"text":"Interprets a λ-abstraction as the curried function of its body","status":"ok"},"long":{"text":"Given λ x : T, body and an expected type T → T', this tactic interprets the body in the context extended by x, with T' as the expected type. The shape of x is read off T: tensor or cartesian products where T is one, and a duplicable atom where its set has affirmative equality. The function from the used part of the extended context is curried with [[AffineConstructive.theory.set.curry]]. When the body uses nothing from the outer context, a left unitor removes the unit factor first. [[AffineConstructive.tactics.set_internalize.unwrap_abs_inner]] then produces the judgment. This is the internal-language counterpart of the rule that interprets abstraction by currying.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_id","base":"test_iabs_id","kind":"def","start":107,"body":null,"status":"ok","short":{"text":"Test: λ x : X, x interprets as the identity X ⇾ X","status":"ok"},"long":{"text":"A test of the full abstraction step on the identity λ-term, in the empty context.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_proj","base":"test_iabs_proj","kind":"def","start":108,"body":null,"status":"ok","short":{"text":"Test: λ p : X ⊗ Y, π₂ p interprets as the second projection","status":"ok"},"long":{"text":"A test of the full abstraction step on a projection out of a tensor-shaped binder.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_const_ctx","base":"test_iabs_const_ctx","kind":"def","start":109,"body":null,"status":"ok","short":{"text":"Test: λ y : Y, x interprets as a morphism X ⇾ (Y ⇾ X)","status":"ok"},"long":{"text":"A test of the full abstraction step on a constant function whose value is the context variable x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_subset_comprehension","base":"interpret_subset_comprehension","kind":"ltac","start":110,"body":null,"status":"ok","short":{"text":"Interprets a subset comprehension { x | P x } as a function into the powerset","status":"ok"},"long":{"text":"The predicate of a comprehension is interpreted as a λ-term with expected type X → Ω, which gives a judgment with codomain X ⇾ Ω. This tactic then gives the same judgment codomain 𝒫 X, and rebuilds the term with [[AffineConstructive.interfaces.subset.notation.subset_comprehension]], using the proof that the predicate respects equality. A subset of X is a predicate on X that respects equality, so the function itself is unchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.PairBias","base":"PairBias","kind":"ind","start":111,"body":null,"status":"ok","short":{"text":"What a pair is expected to be: tensor, cartesian, or either","status":"ok"},"long":{"text":"The expectation the context of a pair imposes. If the expected set is a tensor product, the pair must be a tensor pairing, and a shared resource is an error. If it is a cartesian product, the pair is a cartesian pairing, and both components may use the whole context. With no expectation, the tactic tries a tensor pairing and falls back to a cartesian one when the components share a resource that cannot be copied.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.set_internalize.PairBias_rect","base":"PairBias_rect","kind":"scheme","short":{"text":"Dependent recursion on pair expectations","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.PairBias_ind","base":"PairBias_ind","kind":"scheme","short":{"text":"Induction on pair expectations","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.PairBias_rec","base":"PairBias_rec","kind":"scheme","short":{"text":"Recursion on pair expectations into Set","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.PairBias_sind","base":"PairBias_sind","kind":"scheme","short":{"text":"Induction on pair expectations into SProp","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.NoPairBias","base":"NoPairBias","kind":"constr","short":{"text":"No expectation: prefer a tensor pair, fall back to a cartesian one","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.TensorBias","base":"TensorBias","kind":"constr","short":{"text":"The pair must be a tensor pair","status":"ok"}},{"name":"AffineConstructive.tactics.set_internalize.CartesianBias","base":"CartesianBias","kind":"constr","short":{"text":"The pair is a cartesian pair","status":"ok"}}]},{"name":"AffineConstructive.tactics.set_internalize.interpret_pair_aux","base":"interpret_pair_aux","kind":"ltac","start":112,"body":null,"status":"ok","short":{"text":"Combines the judgments of two components into a tensor or cartesian pairing","status":"ok"},"long":{"text":"This tactic carries the linear accounting. The pair needs the union of the two components' resources. For a tensor pairing it computes what remains of that union after the first component has taken its share. Atoms are consumed. Duplicable atoms remain, since their diagonal lets them be used again. A cartesian product counts as consumed once it is touched. A linearity check then asks whether the second component needs only this remainder. If so, a split morphism sends the union to the tensor of the two shares, duplicating the shared duplicable atoms by their diagonals and reordering factors with [[AffineConstructive.tactics.set_internalize.exchange]]. The two functions are then applied side by side in X₁ ⊗ X₂. When the check fails, or when the expected type is cartesian, each component's function is restricted to its share of the union and the two are paired by [[AffineConstructive.theory.set.to_prod]] into X₁ × X₂. This is the additive pairing, in which both components may draw on the same resources. When the tensor was required ([[AffineConstructive.tactics.set_internalize.PairBias]]) and the check fails, the result is the error [[AffineConstructive.tactics.set_internalize.nonlinear_var_use]], naming the resource used twice.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.split_bias","base":"split_bias","kind":"ltac","start":113,"body":null,"status":"ok","short":{"text":"Splits the expected type of a pair into the expected types of its components","status":"ok"},"long":{"text":"The expected type of a pair is either a type product or the carrier of a set convertible to a tensor or a cartesian product. This tactic returns the expected types of the two components. The comparison is up to conversion, so a name that unfolds to a product is recognised.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_pair","base":"interpret_pair","kind":"ltac","start":114,"body":null,"status":"ok","short":{"text":"Interprets a pair, choosing tensor or cartesian pairing from its expected type","status":"ok"},"long":{"text":"This tactic interprets the two components with the expected types given by [[AffineConstructive.tactics.set_internalize.split_bias]] and combines them with [[AffineConstructive.tactics.set_internalize.interpret_pair_aux]]. An expected tensor product requires the tensor pairing. An expected cartesian product requires the cartesian one. With no expectation, the tensor pairing is tried first and the cartesian one taken when the components share a resource that cannot be duplicated.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.strong_eval","base":"strong_eval","kind":"def","start":115,"body":null,"status":"ok","short":{"text":"Evaluation on the cartesian product, (X ⇾ Y) × X ⇾ Y, for a strong set Y","status":"ok"},"long":{"text":"Evaluation normally lives on the tensor product (X ⇾ Y) ⊗ X: the equality of functions and the equality of arguments are both spent to compare values. When Y is a [[AffineConstructive.interfaces.set.StrongSet]], evaluation is a strong operation, and [[AffineConstructive.interfaces.set.strong_op]] repackages it as a function on the cartesian product. The function and its argument may then draw on the same resources of the context. The tactic uses this evaluation when the codomain is strong.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.strong_eval_op_is_fun","base":"strong_eval_op_is_fun","kind":"prf","start":116,"body":[117,123],"status":"ok","short":{"text":"For strong Y, evaluating f : X₁ ⊗ X₂ ⇾ Y at a pair from X₁ × X₂ preserves equality","status":"ok"},"proof":[{"text":"Take two pairs (f, p) and (g, q) in the cartesian product. Their equality is the additive conjunction of f = g and p = q, and from it f p = g q must follow.","status":"ok","from":0,"to":1},{"text":"Because Y is strong, f also preserves the cartesian equality of X₁ × X₂ ([[AffineConstructive.theory.set.to_strong_set_strong]]), so the conjunct p = q may be replaced by f p = f q.","status":"ok","from":2,"to":2},{"text":"Equality of functions is pointwise equality, so specialise f = g at q, which gives f q = g q, and swap the two conjuncts.","status":"ok","from":3,"to":4},{"text":"What is left is f p = f q ∧ f q = g q ⊸ f p = g q. Ordinary transitivity would need both equalities at once, a tensor, and here the hypothesis is only an additive conjunction. In a strong set equality is strongly transitive, so the additive conjunction is enough ([[AffineConstructive.interfaces.aprop.strong_transitivity]]).","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.tactics.set_internalize.strong_eval_op","base":"strong_eval_op","kind":"def","start":124,"body":null,"status":"ok","short":{"text":"Evaluation (X₁ ⊗ X₂ ⇾ Y) × (X₁ × X₂) ⇾ Y, for a strong set Y","status":"ok"},"long":{"text":"The evaluation of a function of two variables at a pair taken from the cartesian product X₁ × X₂, with the function and the pair also paired cartesianly. It makes sense when Y is strong. Then the strong form of the function accepts additively paired arguments, and comparing values needs the equality of the functions only at one point ([[AffineConstructive.tactics.set_internalize.strong_eval_op_is_fun]]). The tactic chooses it for the application of a two-argument function to a pair whose components share resources.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.force_fun_type","base":"force_fun_type","kind":"ltac","start":125,"body":null,"status":"ok","short":{"text":"Puts the interpretation of an applied head into the form of a function set X ⇾ Y","status":"ok"},"long":{"text":"The head of an application may have been interpreted with a codomain that is a function set only up to conversion, or a function set under of course, !(X ⇾ Y). This tactic exposes X ⇾ Y. It composes with [[AffineConstructive.theory.set.of_course_counit]] to strip each !, and otherwise asks Rocq to convert the codomain to a function set. It returns the function set together with the adjusted function.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.find_eval","base":"find_eval","kind":"ltac","start":126,"body":null,"status":"ok","short":{"text":"Chooses the evaluation map for an application: strong if the codomain is strong, else tensor","status":"ok"},"long":{"text":"This tactic picks the evaluation map for functions X ⇾ Y. When Y is a strong set ([[AffineConstructive.interfaces.set.StrongSet]]), evaluation is a function on the cartesian product: [[AffineConstructive.tactics.set_internalize.strong_eval]], or [[AffineConstructive.tactics.set_internalize.strong_eval_op]] when X is a tensor product X₁ ⊗ X₂, whose argument then lies in X₁ × X₂. The function and its argument may then share resources. Otherwise it returns the ordinary [[AffineConstructive.theory.set.eval]] on the tensor product (X ⇾ Y) ⊗ X, in which the function and its argument must use separate resources.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_app_aux","base":"interpret_app_aux","kind":"ltac","start":127,"body":null,"status":"ok","short":{"text":"Interprets an application from the judgment of its head: evaluation after pairing","status":"ok"},"long":{"text":"Given the judgment of a head f, this tactic exposes its function set with [[AffineConstructive.tactics.set_internalize.force_fun_type]], chooses an evaluation map with [[AffineConstructive.tactics.set_internalize.find_eval]], and interprets the argument with the domain as its expected type. The two judgments are paired, cartesian or tensor according to the domain of the evaluation, and the evaluation map is composed after the pair. When the argument's set differs from the expected domain in a way the interpreter can bridge (a !, a tensor where a cartesian product is expected), a canonical coercion is inserted. Interpreting application as evaluation after the pairing of function and argument is the usual categorical semantics.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.check_for_strong_op","base":"check_for_strong_op","kind":"ltac","start":128,"body":null,"status":"ok","short":{"text":"Replaces a constant head on a tensor domain by its strong form on the cartesian product","status":"ok"},"long":{"text":"When the head of an application has been interpreted as a constant function f : X₁ ⊗ X₂ ⇾ Y, this tactic tries to replace it by [[AffineConstructive.interfaces.set.strong_op]] f, the same map on X₁ × X₂, which exists when f is a strong operation. The two components of the argument may then share resources, as in g (x, x) for a strong g. When the replacement is unavailable the tactic answers false and the head is left alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_func_op_app","base":"interpret_func_op_app","kind":"ltac","start":129,"body":null,"status":"ok","short":{"text":"Interprets the application of a function of sets, f x, to an argument","status":"ok"},"long":{"text":"This tactic handles the application of a function of sets through its underlying map, which is the form a coercion produces. It interprets the head with expected type X → Y and tries [[AffineConstructive.tactics.set_internalize.check_for_strong_op]]. It then completes the application with [[AffineConstructive.tactics.set_internalize.interpret_app_aux]]. When the strong form was used, the rebuilt term is restored to mention f rather than its strong form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_lambda_app","base":"interpret_lambda_app","kind":"ltac","start":130,"body":null,"status":"ok","short":{"text":"Interprets a β-redex, a λ-abstraction applied to an argument","status":"ok"},"long":{"text":"This tactic interprets the abstraction with [[AffineConstructive.tactics.set_internalize.interpret_abs]], with expected type the argument's type to the expected result. It then applies the result to the argument with [[AffineConstructive.tactics.set_internalize.interpret_app_aux]], so the redex becomes evaluation of a curried function rather than a substitution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_const_raw","base":"interpret_const_raw","kind":"ltac","start":131,"body":null,"status":"ok","short":{"text":"Interprets a term using no variable as a constant function out of the one-point set","status":"ok"},"long":{"text":"Builds the judgment that selects no variable of the context and interprets the term as the constant function from the one-point set 𝟏 at that term, using [[AffineConstructive.theory.set.const]]. It does not check that the term is closed; callers do.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_const","base":"interpret_const","kind":"ltac","start":132,"body":null,"status":"ok","short":{"text":"Interprets a closed term as a constant, failing on a term that mentions a variable","status":"ok"},"long":{"text":"Checks that the term mentions no variable of the context and no let-alias, then calls [[AffineConstructive.tactics.set_internalize.interpret_const_raw]]. A term that does mention a variable but matched none of the interpreter's forms would otherwise become a constant capturing a bound variable, failing obscurely later; instead the tactic returns [[AffineConstructive.tactics.set_internalize.not_closed]] with the term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_operation_eval_or_const","base":"interpret_operation_eval_or_const","kind":"ltac","start":133,"body":null,"status":"ok","short":{"text":"Interprets a raw map applied to a closed argument by evaluation at that point, else as a constant","status":"ok"},"long":{"text":"Reached when an application f x has a head that is not a function of sets. If f is an operation, a raw map from a type into a set, the tactic distinguishes three cases. An argument mentioning a variable cannot be interpreted, and gives the error [[AffineConstructive.tactics.set_internalize.operation_open_arg]]. A closed argument with a closed head makes the whole term a constant. A closed argument with a head that depends on the context is rewritten as evaluation at x, [[AffineConstructive.theory.set.eval_pt]] x applied to f, which is a function of sets in f; that is interpreted as an application, and f x is restored in the recorded term. Anything that is not an application of an operation is passed to [[AffineConstructive.tactics.set_internalize.interpret_const]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_coerce_app_or_const","base":"interpret_coerce_app_or_const","kind":"ltac","start":134,"body":null,"status":"ok","short":{"text":"Interprets a term that is neither variable nor known form: constant, or application of a function","status":"ok"},"long":{"text":"This tactic is the fallback for terms that are not variables or projections of variables. A term closed with respect to the context becomes a constant function, [[AffineConstructive.theory.set.const]] of the term on the empty selection. Otherwise it looks for an application f x, f x y or f x y z whose head, after uncurrying with [[AffineConstructive.interfaces.prelude.tuncurry]] or [[AffineConstructive.interfaces.prelude.eval_tuncurry3]], is a function of sets. Such an application is interpreted as one application of that function to a tuple, and the original form of the term is rebuilt on the way out. Failing that, an application of a bare map into a set whose argument is closed becomes [[AffineConstructive.theory.set.eval_pt]] at the argument applied to the map. Anything else is a constant if closed, and the error [[AffineConstructive.tactics.set_internalize.not_closed]] or [[AffineConstructive.tactics.set_internalize.operation_open_arg]] if not.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_alias_let_inner","base":"interpret_alias_let_inner","kind":"ltac","start":135,"body":null,"status":"ok","short":{"text":"Interprets the body of a let whose definition is a variable or projection, as an alias","status":"ok"},"long":{"text":"Run under the binder of let y := e in body when e is a variable or a projection chain of one. Instead of interpreting the let as an application of a λ, it records y as an alias for e and interprets the body; a use of y is then a use of the corresponding part of e, so that naming a component of a tensor neither consumes nor copies anything.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_let_in","base":"interpret_let_in","kind":"ltac","start":136,"body":null,"status":"ok","short":{"text":"Interprets a let-binding, as an alias when the definiens is a resource, else as a redex","status":"ok"},"long":{"text":"When the definiens of let x := e in b is a context variable, an alias, or a projection chain of one of these ([[AffineConstructive.tactics.set_internalize.expand_alias]]), this tactic records x as an alias for e and interprets the body. A use of x then counts as a use of the resource e denotes, and the alias costs nothing. Otherwise the binding is interpreted as the redex (λ x, b) e: the body by [[AffineConstructive.tactics.set_internalize.interpret_abs]]'s inner step and [[AffineConstructive.tactics.set_internalize.unwrap_abs_inner]], the application by [[AffineConstructive.tactics.set_internalize.interpret_app_aux]]. In both cases the let-binding is restored in the rebuilt term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.all_mor_prop","base":"all_mor_prop","kind":"prf","start":137,"body":[138,144],"status":"ok","short":{"text":"For a family m of functions Γ ⇾ Ω, u ↦ ∏ x, m x u preserves equality","status":"ok"},"proof":[{"text":"Take u and v in Γ. Equality in Ω is affine equivalence, so the goal is that u = v implies the equivalence of the two universals.","status":"ok","from":0,"to":2},{"text":"Pointwise equivalences pass to universals ([[AffineConstructive.logic.aprop.all_aiff]]). So it suffices to fix x in A and show that u = v implies m x u ⧟ m x v.","status":"ok","from":3,"to":4},{"text":"This is the statement that m x is a function: it preserves equality.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.tactics.set_internalize.aex_mor_prop","base":"aex_mor_prop","kind":"prf","start":145,"body":[146,152],"status":"ok","short":{"text":"For a family m of functions Γ ⇾ Ω, u ↦ ∐ x, m x u preserves equality","status":"ok"},"proof":[{"text":"Take u and v in Γ. Equality in Ω is affine equivalence, so the goal is that u = v implies the equivalence of the two existentials.","status":"ok","from":0,"to":2},{"text":"Pointwise equivalences pass to existentials ([[AffineConstructive.logic.aprop.aex_aiff]]). So it suffices to fix x in A and show that u = v implies m x u ⧟ m x v.","status":"ok","from":3,"to":4},{"text":"This is the statement that m x is a function: it preserves equality.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.tactics.set_internalize.all_mor","base":"all_mor","kind":"def","start":153,"body":null,"status":"ok","short":{"text":"The function Γ ⇾ Ω sending u to ∏ x, m x u, for a family m","status":"ok"},"long":{"text":"The universal quantifier taken pointwise over a family of affine predicates on Γ, indexed by an arbitrary type A. It is a function of sets by [[AffineConstructive.tactics.set_internalize.all_mor_prop]]: equal points u and v give equivalent propositions in each instance, and therefore equivalent universals. This is the interpretation of a term ∏ x, P x whose body depends on the context, where x ranges over a type and not over a set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.aex_mor","base":"aex_mor","kind":"def","start":154,"body":null,"status":"ok","short":{"text":"The function Γ ⇾ Ω sending u to ∐ x, m x u, for a family m","status":"ok"},"long":{"text":"The existential quantifier taken pointwise over a family of affine predicates on Γ, indexed by an arbitrary type A. It is a function of sets by [[AffineConstructive.tactics.set_internalize.aex_mor_prop]]. It interprets a term ∐ x, P x whose body depends on the context.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret_quantifier","base":"interpret_quantifier","kind":"ltac","start":155,"body":null,"status":"ok","short":{"text":"Interprets an affine quantifier ∏ x, P x or ∐ x, P x as a function into Ω","status":"ok"},"long":{"text":"Handles a term of the form ∏ x, P x or ∐ x, P x met by the interpreter. It interprets the body P x under the binder, with the result biased towards the set Ω of affine propositions, giving for each x a function from the context to Ω. The family of these functions is then closed off by [[AffineConstructive.tactics.set_internalize.all_mor]] or [[AffineConstructive.tactics.set_internalize.aex_mor]], which take the pointwise universal or existential and package it as a single function from the context to Ω; the term reconstructed beside it is the quantified proposition itself.\n\nThe bound variable ranges over a type, not over a set of the context: it is not entered into the affine context and is not subject to the accounting of resources. That is why the quantifier is a separate case and not an abstraction followed by an application. The proofs [[AffineConstructive.tactics.set_internalize.all_mor_prop]] and [[AffineConstructive.tactics.set_internalize.aex_mor_prop]] that these maps preserve equality are what make the quantifier case sound.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.interpret","base":"interpret","kind":"ltac","start":156,"body":null,"status":"ok","short":{"text":"Interprets a term in the internal language of sets as a function of sets, by its syntax","status":"ok"},"long":{"text":"The interpreter behind set_internalize. Given a context of variables with their resource shapes, a list of let-aliases, the expected type and a term, it returns a [[AffineConstructive.tactics.set_internalize.Judgment]]: the selection of the context the term uses, and a function of sets from the tensor of those resources to the set the term lives in, together with the term rebuilt, or else an error of [[AffineConstructive.tactics.set_internalize.Excn]]. It dispatches on the form of the term: λ-abstractions, [[AffineConstructive.interfaces.set_lambda.notation.set_lambda]] and [[AffineConstructive.interfaces.subset.notation.subset_comprehension]] by currying; applications of a function of sets by evaluation, through [[AffineConstructive.theory.set.eval]], or [[AffineConstructive.tactics.set_internalize.strong_eval]] and [[AffineConstructive.tactics.set_internalize.strong_eval_op]] when the codomain is strong; applications of a λ by β; pairs as tensor or cartesian pairs; let-bindings as aliases or as β-redexes; affine quantifiers by [[AffineConstructive.tactics.set_internalize.all_mor]] and [[AffineConstructive.tactics.set_internalize.aex_mor]]; and otherwise variables, projections, applications seen through coercions, and closed constants.\n\nThe resource accounting is that of affine logic. A pair becomes a tensor pair when the context can be split between its components, which holds when they use disjoint resources or share only variables with affirmative equality, which can be copied; otherwise it is a cartesian pair, each component seeing all of the shared resources. The expected type steers this choice and inserts coercions where a finer set is found than the one asked for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_const_ctx2","base":"test_iabs_const_ctx2","kind":"def","start":157,"body":null,"status":"ok","short":{"text":"Test: the full interpreter on λ y : Y, x in the context x : X","status":"ok"},"long":{"text":"The same constant-function test as [[AffineConstructive.tactics.set_internalize.test_iabs_const_ctx]], run through the full interpreter rather than the abstraction step alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_proj1","base":"test_iabs_proj1","kind":"def","start":158,"body":null,"status":"ok","short":{"text":"Test: λ '(x, y) : X ⊗ Y, x interprets as the first projection","status":"ok"},"long":{"text":"A test of the full interpreter on a λ-term that destructures its tensor argument with a pattern and returns the first component.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_swap_t","base":"test_iabs_swap_t","kind":"def","start":159,"body":null,"status":"ok","short":{"text":"Test: λ '(x, y) : X ⊗ Y, (y, x) interprets as the tensor swap","status":"ok"},"long":{"text":"A test of the full interpreter on the swap of a tensor product. The pattern-bound components are each used once and paired again in the other order, so a tensor pairing is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_swap_c","base":"test_iabs_swap_c","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"Test: internalizes the cartesian swap λ '(x, y) : X × Y, (y, x) as a function X × Y ⇾ Y × X","status":"ok"},"long":{"text":"A test of the interpreter on a destructured binder of cartesian shape and a pair in the body, with the target annotated as the cartesian product Y × X. Since the expected type is cartesian, the pair is built as a cartesian pairing: each component is interpreted separately against the whole binder, and the two results are combined into a function into the product, without any check that the components use disjoint resources.\n\nThe comment in the source still marks the test as an expected failure from before pairs were handled. The definition now compiles, and the result is a [[AffineConstructive.tactics.set_internalize.Judgment]] over the empty context with codomain X × Y ⇾ Y × X. Its tensor counterpart is [[AffineConstructive.tactics.set_internalize.test_iabs_swap_t]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_swap_infer","base":"test_iabs_swap_inf

er","kind":"def","start":161,"body":null,"status":"ok","short":{"text":"Test: the swap λ '(x, y) : X ⊗ Y, (y, x) with no product chosen for the result, which comes out as a tensor","status":"ok"},"long":{"text":"The same swap as [[AffineConstructive.tactics.set_internalize.test_iabs_swap_t]], except that the expected result type is the bare type-level pair of the carriers, which says nothing about which product of sets is meant. The interpreter therefore runs with no pair bias and decides for itself. It first tries the tensor: y and x come from different factors of the binder X ⊗ Y, so each is used once and the residue check passes. The result is X ⊗ Y ⇾ Y ⊗ X, the tensor symmetry.\n\nThe test shows that, when nothing forces a choice, a pair whose components draw on disjoint resources is read multiplicatively. The cartesian product is the fallback used only when the tensor would need a resource twice.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_app","base":"test_app","kind":"def","start":162,"body":null,"status":"ok","short":{"text":"Test: the application f x in context f : X ⇾ Y, x : X internalizes as evaluation (X ⇾ Y) ⊗ X ⇾ Y","status":"ok"},"long":{"text":"A test of application on its own. The context holds the two variables f and x, and the term f x is a function of sets applied to an element, which Rocq displays after inserting coercions. The interpreter reads the head and the argument as two judgments, pairs them, and composes the pair with an evaluation map. In this test Y carries no strong structure, so the pairing is a tensor and the evaluation is the ordinary one on (X ⇾ Y) ⊗ X.\n\nThe resulting [[AffineConstructive.tactics.set_internalize.Judgment]] uses all of both variables, which the selection f ↦ ⊤, x ↦ ⊤ records. Its domain is the tensor (X ⇾ Y) ⊗ X of their sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_eta","base":"test_iabs_eta","kind":"def","start":163,"body":null,"status":"ok","short":{"text":"Test: λ x : X, f x in context f : X ⇾ Y internalizes as a map (X ⇾ Y) ⇾ (X ⇾ Y)","status":"ok"},"long":{"text":"A test that combines abstraction, application and currying. The body f x is interpreted in the context extended by x, which gives evaluation on (X ⇾ Y) ⊗ X as in [[AffineConstructive.tactics.set_internalize.test_app]]. Abstracting x then curries that evaluation into a map from the set of the context variable f to X ⇾ Y.\n\nThe result is the curried evaluation, which is the identity on X ⇾ Y up to η. The [[AffineConstructive.tactics.set_internalize.Judgment]] records that f is used once, in full.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_let_alias","base":"test_iabs_let_alias","kind":"def","start":164,"body":null,"status":"ok","short":{"text":"Test: λ x : X, let y := x in y internalizes as the identity X ⇾ X","status":"ok"},"long":{"text":"A test of local definitions. When a let binds a variable, or a chain of projections of one, the interpreter adds no new resource to the context. It records the bound name as an alias in an [[AffineConstructive.tactics.set_internalize.AliasList]], and an occurrence of the name is resolved to the variable it stands for, so the resources it consumes are that variable's. Here y is an alias of x, the body uses x once, and the result is the identity function on X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_let_proj","base":"test_iabs_let_proj","kind":"def","start":165,"body":null,"status":"ok","short":{"text":"Test: λ p : X ⊗ Y, let x := π₁ p in x internalizes as the first projection X ⊗ Y ⇾ X","status":"ok"},"long":{"text":"A test of a let that aliases a projection. The name x stands for π₁ p, so its use selects only the left factor of the binder X ⊗ Y. The interpreter follows the alias to the projection path and marks exactly that factor as used. The result is the first projection of the tensor, the same function that [[AffineConstructive.tactics.set_internalize.test_iabs_proj1]] obtains from a destructuring binder.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.test_iabs_let_chain","base":"test_iabs_let_chain","kind":"def","start":166,"body":null,"status":"ok","short":{"text":"Test: nested aliases λ p : X ⊗ Y, let x := p in let y := π₂ x in y give the second projection","status":"ok"},"long":{"text":"A test of alias chains. Aliases are resolved eagerly: when y is defined as π₂ x, the alias x is already known to stand for p, so y is recorded as π₂ p and not as π₂ x. A later use of y therefore goes straight back to the right factor of the binder. The result is the second projection X ⊗ Y ⇾ Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.set_internalize_tac","base":"set_internalize_tac","kind":"tacn","start":167,"body":null,"status":"ok","short":{"text":"Solves a goal X ⇾ Y with the function of sets that a term of the internal language denotes","status":"ok"},"long":{"text":"Given a term written in the internal language of sets, which Rocq reads as a plain map between carriers with coercions inserted, the tactic recovers the function of sets the term denotes. It interprets the term in the empty context, against the term's own type, and on success closes the goal with the interpreted term, now built from functions of sets: abstractions become curried functions, applications evaluations, pairs tensor or cartesian pairings, quantifiers and comprehensions the corresponding functions into Ω and 𝒫 X. When the interpretation fails, the tactic fails and reports the reason, for instance a variable used twice where the context allows only one use, or an argument that depends on a bound variable where an operation expects a constant.\n\nA proof reaches for it to obtain a function of sets from a λ-term without proving by hand that the term preserves equality; the companion `solve_SetLambda` uses the same interpreter to discharge the obligation of a [[AffineConstructive.interfaces.set_lambda.notation.set_lambda]] term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.set_internalize.solve_SetLambda","base":"solve_SetLambda","kind":"ltac","start":168,"body":null,"status":"ok","short":{"text":"Proves that a raw map between sets preserves equality, by interpreting it as a function of sets","status":"ok"},"long":{"text":"Solves a goal [[AffineConstructive.interfaces.set_lambda.notation.SetLambdaDerivation]] for a raw map between the carriers of X and Y, the obligation behind the λₛ notation. It interprets the map with [[AffineConstructive.tactics.set_internalize.interpret]] in the empty context, using X and Y from the goal as the expected types rather than the type of the term, which would not distinguish Ω from !Ω. When the function found lands in a finer set Y′ than Y, it is composed with [[AffineConstructive.tactics.set_internalize.build_coercion]], which is the identity on elements and so does not change the map. The proof that the resulting function preserves equality, [[AffineConstructive.interfaces.set.func_is_fun]], closes the goal; a failure reports the interpreter's error.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.prop_eq":{"page":"../interfaces/prop_eq.html","short":"Propositional (Leibniz) equality ≡, registered with the kernel in place of the standard one","summary":"The file defines the library's propositional (Leibniz) equality [[eq]], written x ≡ y, with its constructor [[eq_refl]] and its elimination principles into Type, Prop, Set and SProp. The library is built without the standard library, so this equality takes the place of the standard one. The file registers it with the kernel so that Rocq's built-in rewriting and tactics recognise it. Throughout the development, ≡ stands for definitional equality. It is kept separate from the affine equality = of a set, which is an affine proposition and carries a dual."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.theory.set":{"page":"../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.set_lambda.notation":{"page":"../interfaces/set_lambda/notation.html","short":"Lambda notation for functions of affine sets, with the equality obligation as its own class","summary":"The file sets up the notation λₛ x .. y, t for writing functions between affine sets as lambda terms. Behind it are [[set_lambda]], which packages a raw map as a function of sets through [[func_make]], and [[SetLambdaDerivation]], a separate class name for [[IsFun]] that holds the obligation that each such map preserves equality. Because this obligation has its own class, the derivation rules elsewhere in set_lambda can discharge it by following the structure of the term. Two printing-only notations show lambdas that take pairs apart in their destructured form."},"AffineConstructive.interfaces.subset.notation":{"page":"../interfaces/subset/notation.html","short":"Subsets 𝒫 X as functions into Ω, their equality, and comprehension notation","summary":"This file defines the powerset 𝒫 X, the type of subsets of an affine set X, as the functions from X to the affine propositions Ω, following Shulman's *Affine logic for constructive mathematics*. Since an affine proposition pairs proving with refuting, every subset comes with its complement. The canonical set [[subset_set]] gives subsets their pointwise equality. [[subset_comprehension]] supplies the notation { x | P }, which builds a subset from a predicate that respects equality, through [[func_make]]. The files that follow build membership, inclusion and the lattice operations on subsets on top of these definitions."},"AffineConstructive.tactics.easy":{"page":"easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

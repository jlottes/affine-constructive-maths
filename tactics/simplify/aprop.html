interfaces.sprop theory.set logic.aprop logic.relations.\nRequire Import rewrite easy tactics.misc.\nRequire Export simplify.base.\n\nLemma simplify_impl (P Q : SProp) {P' Q': SProp} : ∀ `{!SimplifiesTo P P', !SimplifiesTo Q Q'}, SimplifiesTo (P → Q) (P' → Q').\nProof. intros [E1][E2]; split; revert E1 E2; lazy; tautological. Qed.\nGlobal Hint Extern 104 (SimplifiesTo (?P → ?Q) _) => simplify_progress constr:(simplify_impl P Q) : typeclass_instances.\n\nDefinition simplify_thm {P P':Ω} (H:P) {E:SimplifiesTo P P'} : P' := aimpl_impl_pos (sprop.andl E.(simplify _)) H.\nDefinition full_simplify_thm {P P':Ω} (H:P) {E:FullSimplifiesTo P P'} : P' := simplify_thm _ (E:=E).\n\nGlobal Hint Extern 4 (SimplifiesTo (func_op anot_fun  ?P) ?out) => change (SimplifiesTo (anot  P) out)  : typeclass_instances.\nGlobal Hint Extern 4 (SimplifiesTo (func_op aand_fun  ?P) ?out) => change (SimplifiesTo (aand  P) out) : typeclass_instances.\nGlobal Hint Extern 4 (SimplifiesTo (func_op aprod_fun ?P) ?out) => change (SimplifiesTo (aprod P) out) : typeclass_instances.\nGlobal Hint Extern 4 (SimplifiesTo (func_op aor_fun   ?P) ?out) => change (SimplifiesTo (aor   P) out) : typeclass_instances.\nGlobal Hint Extern 4 (SimplifiesTo (func_op apar_fun  ?P) ?out) => change (SimplifiesTo (apar  P) out) : typeclass_instances.\nGlobal Hint Extern 4 (SimplifiesTo (func_op aimpl_fun ?P) ?out) => change (SimplifiesTo (aimpl P) out) : typeclass_instances.\nGlobal Hint Extern 4 (SimplifiesTo (func_op aiff_fun  ?P) ?out) => change (SimplifiesTo (aiff  P) out) : typeclass_instances.\n\n\nGlobal Hint Extern 4 (SimplifiesTo (anot atrue) _) => exact (simplify_base (x:=afalse)) : typeclass_instances.\nGlobal Hint Extern 4 (SimplifiesTo (anot afalse) _) => exact (simplify_base (x:=atrue)) : typeclass_instances.\nGlobal Hint Extern 4 (SimplifiesTo (anot (anot ?P)) ?out) => change (SimplifiesTo P out) : typeclass_instances.\n\nImport modality_notation.\n\nLemma simplify_anot_aimpl `{@SimplifiesTo Ω P P'} `{@Simplif nProof. split. rew (simplify P). apply aiff_true. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (_ ⧟ atrue) _) => notypeclasses refine simplify_aiff_true : typeclass_instances.\n\nLemma simplify_true_aiff `{@SimplifiesTo Ω P P'} : SimplifiesTo (atrue ⧟ P) P'.\nProof. split. rew (simplify P). exact tautology. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (atrue ⧟ _) _) => notypeclasses refine simplify_true_aiff : typeclass_instances.\n\nLemma simplify_aiff_false `{@SimplifiesTo Ω (anot P) Pd} : SimplifiesTo (P ⧟ afalse) Pd.\nProof. chain (anot P); trivial. split. exact tautology. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (_ ⧟ afalse) _) => notypeclasses refine simplify_aiff_false : typeclass_instances.\n\nLemma simplify_false_aiff `{@SimplifiesTo Ω (anot P) Pd} : SimplifiesTo (afalse ⧟ P) Pd.\nProof. chain (anot P); trivial. split. exact tautology. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (afalse ⧟ _) _) => notypeclasses refine simplify_false_aiff : typeclass_instances.\n\nDefinition simplify_aimpl_refl {P} := Build_SimplifiesTo _ (P ⊸ P) atrue tautology.\nDefinition simplify_aiff_refl {P} := Build_SimplifiesTo _ (P ⧟ P) atrue tautology.\nGlobal Hint Extern 2 (SimplifiesTo (?P ⊸ ?P) _) => notypeclasses refine simplify_aimpl_refl : typeclass_instances.\nGlobal Hint Extern 2 (SimplifiesTo (?P ⧟ ?P) _) => notypeclasses refine simplify_aiff_refl : typeclass_instances.\n\n\nDefinition simplify_aandl {P Q} := Build_SimplifiesTo _ (P ∧ Q ⊸ P) atrue tautology.\nGlobal Hint Extern 4 (SimplifiesTo (?P ∧ _ ⊸ ?P) _) => notypeclasses refine simplify_aandl : typeclass_instances.\nDefinition simplify_aandr {P Q} := Build_SimplifiesTo _ (P ∧ Q ⊸ Q) atrue tautology.\nGlobal Hint Extern 4 (SimplifiesTo (_ ∧ ?P ⊸ ?P) _) => notypeclasses refine simplify_aandr : typeclass_instances.\n\nLemma simplify_true_aand `{@SimplifiesTo Ω P P'} : SimplifiesTo (𝐓 ∧ P) P'.\nProof. chain P; trivial. split. apply aand_unit_l. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (𝐓 ∧ _) _) => notypeclasses refine simplify_tru ffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":4751,"e":4756,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":5805,"e":5810,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":6052,"e":6057,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":6705,"e":6710,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":7367,"e":7372,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":7613,"e":7618,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":8252,"e":8257,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":8524,"e":8529,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":8774,"e":8779,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":9438,"e":9443,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":9687,"e":9692,"lib":"AffineConstructive.tactics.simplify.aprop","name":"chain","kind":"ltac","local":true},{"s":10846,"e":10849,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../rewrite/rewrite.html"},{"s":11109,"e":11112,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../rewrite/rewrite.html"},{"s":12459,"e":12476,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../../interfaces/aprop.html"},{"s":12670,"e":12687,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../../interfaces/aprop.html"}],"gloss":{"summary":"This file supplies the simplifier's rules for affine propositions, as instances of [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] found by resolution. It covers the unit and absorption laws of 𝐓 and 𝐅 for ⊸, ⧟, ∧, ∨, ⊠ and ⊞, the idempotence of ∧, ∨, ! and ?, the trivial implications P ⊸ P, P ∧ Q ⊸ P and P ⊸ P ∨ Q, and the de Morgan dualities pushing a negation through ⊸, ! and ?. It also simplifies under the quantifiers ∏ and ∐, collapses ∏ over 𝐓 and ∐ over 𝐅, and turns a proved proposition into 𝐓. The theorems [[AffineConstructive.tactics.simplify.aprop.simplify_thm]] and [[AffineConstructive.tactics.simplify.aprop.full_simplify_thm]] transport a proof of a proposition to a proof of its simplified form; the framework itself is in the simplifier's base file.","short":"Simplification rules for affine propositions: units, absorption, idempotence, duals, quantifiers","items":[{"name":"AffineConstructive.tactics.simplify.aprop.simplify_impl","base":"simplify_impl","kind":"prf","start":3,"body":[4,6],"status":"ok","short":{"text":"A base-logic implication P → Q simplifies to P' → Q' when P simplifies to P' and Q to Q'","status":"ok"},"proof":[{"text":"Unpack the two simplifications into the equivalences P ⟷ P' and Q ⟷ Q' of the base logic. The goal is then P → Q ⟷ P' → Q'. Unfolding the definitions turns all of this into propositional logic, and the base-logic decision procedure closes it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_thm","base":"simplify_thm","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"Turns a proof of P into a proof of its simplified form P'","status":"ok"},"long":{"text":"Given a proof of an affine proposition P and a simplification of P to P', this produces a proof of P'. A simplification of affine propositions is an equivalence P ⧟ P'; the definition takes its forward implication and applies it to the proof by [[AffineConstructive.logic.aprop.aimpl_impl_pos]].\n\nIt is the forward use of the simplifier on a hypothesis or a proved lemma: a theorem stated in a raw form, after instantiation, is restated in its simplified form without the reader or the proof having to name the laws that justify each step.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.full_simplify_thm","base":"full_simplify_thm","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"Turns a proof of P into a proof of its fully simplified form P'","status":"ok"},"long":{"text":"The same as [[AffineConstructive.tactics.simplify.aprop.simplify_thm]], for the full simplification relation, the variant of the simplifier that keeps rewriting until no rule applies. A full simplification is in particular a simplification, and the definition passes it to [[AffineConstructive.tactics.simplify.aprop.simplify_thm]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_anot_aimpl","base":"simplify_anot_aimpl","kind":"prf","start":21,"body":[22,27],"status":"ok","short":{"text":"The negation of P ⊸ Q simplifies to P' ⊠ Qd, with P' simplifying P and Qd simplifying Qᗮ","status":"ok"},"proof":[{"text":"A simplification is an equality of affine propositions, so the goal is the equation (P ⊸ Q)ᗮ = P' ⊠ Qd.","status":"ok","from":0,"to":1},{"text":"Rewrite P to its simplified form P' on the left. On the right, replace Qd by the negation Qᗮ that it simplifies. What remains is (P' ⊸ Q)ᗮ = P' ⊠ Qᗮ.","status":"ok","from":2,"to":3},{"text":"This is the duality of implication: the negation of P' ⊸ Q is P' ⊠ Qᗮ, by [[AffineConstructive.logic.aprop.aimpl_dual]].","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_anot_of_course","base":"simplify_anot_of_course","kind":"prf","start":28,"body":[29,33],"status":"ok","short":{"text":"The negation of !P simplifies to ?Pd, where Pd simplifies Pᗮ","status":"ok"},"proof":[{"text":"The goal is the equation (!P)ᗮ = ?Pd. Replace Pd by the negation Pᗮ that it simplifies, which leaves (!P)ᗮ = ?Pᗮ.","status":"ok","from":0,"to":2},{"text":"This is the duality of the modalities: the negation of !P is ?Pᗮ, by [[AffineConstructive.logic.aprop.of_course_dual]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_anot_why_not","base":"simplify_anot_why_not","kind":"prf","start":34,"body":[35,39],"status":"ok","short":{"text":"The negation of ?P simplifies to !Pd, where Pd simplifies Pᗮ","status":"ok"},"proof":[{"text":"The goal is the equation (?P)ᗮ = !Pd. Replace Pd by the negation Pᗮ that it simplifies, which leaves (?P)ᗮ = !Pᗮ.","status":"ok","from":0,"to":2},{"text":"This is the duality of the modalities: the negation of ?P is !Pᗮ, by [[AffineConstructive.logic.aprop.why_not_dual]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.chain","base":"chain","kind":"ltac","start":43,"body":null,"status":"ok","short":{"text":"Splits a simplification of x to y into two steps through a given intermediate term","status":"ok"},"long":{"text":"On a goal asking that x simplify to y, `chain t` restates the goal as the simplification relation [[AffineConstructive.tactics.simplify.base.SimplifiesToR]] on the pair (x, y) and applies its transitivity at t. Two goals are left: x simplifies to t, and t simplifies to y. Since a simplification is an equality in the set, the step amounts to transitivity of that equality.\n\nThe tactic is local to this file. The rules use it when a logical law reduces the left side to a subterm whose simplification is already given by an assumed instance. In [[AffineConstructive.tactics.simplify.aprop.simplify_true_aand]], for example, the goal that 𝐓 ∧ P simplifies to P′ is chained through P. The instance in context closes the second step, from P to P′. The first step, from 𝐓 ∧ P to P, is the unit law [[AffineConstructive.logic.aprop.aand_unit_l]]. A plain transitivity would need the relation spelled out each time; `chain` makes the change of form itself.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aimpl_true","base":"simplify_aimpl_true","kind":"def","start":44,"body":null,"status":"ok","short":{"text":"P ⊸ 𝐓 simplifies to 𝐓","status":"ok"},"long":{"text":"Anything implies truth, so an implication with conclusion 𝐓 is equivalent to 𝐓 and the simplifier replaces it by 𝐓. The equivalence is an affine tautology, proved by the decision procedure for the connectives; the rule needs no simplification of P, since P disappears.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_false_aimpl","base":"simplify_false_aimpl","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"𝐅 ⊸ P simplifies to 𝐓","status":"ok"},"long":{"text":"Falsity implies anything, so an implication with hypothesis 𝐅 is equivalent to 𝐓. Dually, its refutation would require refuting 𝐅's negation and proving 𝐅 together, which is impossible. The equivalence is an affine tautology, proved by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_true_aimpl","base":"simplify_true_aimpl","kind":"prf","start":48,"body":[49,53],"status":"ok","short":{"text":"𝐓 ⊸ P simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"The goal is the equation 𝐓 ⊸ P = P'. Rewriting P to P' leaves 𝐓 ⊸ P' = P'.","status":"ok","from":0,"to":2},{"text":"Truth is a left unit for implication, by [[AffineConstructive.logic.aprop.true_aimpl]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aimpl_false","base":"simplify_aimpl_false","kind":"prf","start":55,"body":[56,61],"status":"ok","short":{"text":"P ⊸ 𝐅 simplifies to Pd, where Pd simplifies the negation Pᗮ","status":"ok"},"proof":[{"text":"Simplification is transitive, and Pᗮ simplifies to Pd by hypothesis. So it suffices to show that P ⊸ 𝐅 simplifies to Pᗮ.","status":"ok","from":0,"to":2},{"text":"That simplification is the equation P ⊸ 𝐅 = Pᗮ, which says that implying falsity is negation, by [[AffineConstructive.logic.aprop.aimpl_false]].","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aiff_true","base":"simplify_aiff_true","kind":"prf","start":63,"body":[64,68],"status":"ok","short":{"text":"P ⧟ 𝐓 simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"The goal is the equation P ⧟ 𝐓 = P'. Rewriting P to P' leaves P' ⧟ 𝐓 = P'.","status":"ok","from":0,"to":2},{"text":"Being equivalent to truth is the proposition itself, by [[AffineConstructive.logic.aprop.aiff_true]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_true_aiff","base":"simplify_true_aiff","kind":"prf","start":70,"body":[71,75],"status":"ok","short":{"text":"𝐓 ⧟ P simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"The goal is the equation 𝐓 ⧟ P = P'. Rewriting P to P' leaves 𝐓 ⧟ P' = P'.","status":"ok","from":0,"to":2},{"text":"This equation is a tautology of the connectives, and the decision procedure proves it.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aiff_false","base":"simplify_aiff_false","kind":"prf","start":77,"body":[78,82],"status":"ok","short":{"text":"P ⧟ 𝐅 simplifies to Pd, where Pd simplifies the negation Pᗮ","status":"ok"},"proof":[{"text":"Pᗮ simplifies to Pd by hypothesis. Chaining through Pᗮ, it suffices to show that P ⧟ 𝐅 simplifies to Pᗮ.","status":"ok","from":0,"to":1},{"text":"That simplification is the equation P ⧟ 𝐅 = Pᗮ, a tautology of the connectives that the decision procedure proves.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_false_aiff","base":"simplify_false_aiff","kind":"prf","start":84,"body":[85,89],"status":"ok","short":{"text":"𝐅 ⧟ P simplifies to Pd, where Pd simplifies the negation Pᗮ","status":"ok"},"proof":[{"text":"Pᗮ simplifies to Pd by hypothesis. Chaining through Pᗮ, it suffices to show that 𝐅 ⧟ P simplifies to Pᗮ.","status":"ok","from":0,"to":1},{"text":"That simplification is the equation 𝐅 ⧟ P = Pᗮ, a tautology of the connectives that the decision procedure proves.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aimpl_refl","base":"simplify_aimpl_refl","kind":"def","start":91,"body":null,"status":"ok","short":{"text":"P ⊸ P simplifies to 𝐓","status":"ok"},"long":{"text":"Every affine proposition implies itself, so P ⊸ P is equivalent to 𝐓. The simplifier tries this rule early, before descending into P, so that an implication whose two sides are syntactically the same is discharged at once. The equivalence is proved by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aiff_refl","base":"simplify_aiff_refl","kind":"def","start":92,"body":null,"status":"ok","short":{"text":"P ⧟ P simplifies to 𝐓","status":"ok"},"long":{"text":"The affine biconditional is reflexive, so P ⧟ P is equivalent to 𝐓. Like [[AffineConstructive.tactics.simplify.aprop.simplify_aimpl_refl]] it is tried before the simplifier descends into P. The equivalence is proved by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aandl","base":"simplify_aandl","kind":"def","start":95,"body":null,"status":"ok","short":{"text":"P ∧ Q implies P simplifies to 𝐓","status":"ok"},"long":{"text":"The simplification rule recording that the implication P ∧ Q ⊸ P is true, so that the simplifier replaces it by 𝐓. The additive conjunction offers a choice of either conjunct, so a proof of P ∧ Q yields P by choosing the left one; this is the left projection of the additive conjunction stated as a simplification. Its companion [[AffineConstructive.tactics.simplify.aprop.simplify_aandr]] does the same for the right conjunct. The equivalence with 𝐓 is proved by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aandr","base":"simplify_aandr","kind":"def","start":97,"body":null,"status":"ok","short":{"text":"P ∧ Q ⊸ Q simplifies to 𝐓","status":"ok"},"long":{"text":"The right projection of the additive conjunction as a simplification rule: P ∧ Q implies Q, so the implication is equivalent to 𝐓. The companion of [[AffineConstructive.tactics.simplify.aprop.simplify_aandl]], proved the same way by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_true_aand","base":"simplify_true_aand","kind":"prf","start":99,"body":[100,104],"status":"ok","short":{"text":"𝐓 ∧ P simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that 𝐓 ∧ P simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for 𝐓 ∧ P = P. That is the unit law [[AffineConstructive.logic.aprop.aand_unit_l]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aand_true","base":"simplify_aand_true","kind":"prf","start":106,"body":[107,111],"status":"ok","short":{"text":"P ∧ 𝐓 simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that P ∧ 𝐓 simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for P ∧ 𝐓 = P. That is the unit law [[AffineConstructive.logic.aprop.aand_unit_r]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_false_aand","base":"simplify_false_aand","kind":"def","start":113,"body":null,"status":"ok","short":{"text":"𝐅 ∧ P simplifies to 𝐅","status":"ok"},"long":{"text":"Falsity absorbs the additive conjunction: 𝐅 ∧ P is equivalent to 𝐅, by [[AffineConstructive.logic.aprop.aand_false_l]]. P is discarded, so the rule does not simplify it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aand_false","base":"simplify_aand_false","kind":"def","start":114,"body":null,"status":"ok","short":{"text":"P ∧ 𝐅 simplifies to 𝐅","status":"ok"},"long":{"text":"Falsity absorbs the additive conjunction on the right: P ∧ 𝐅 is equivalent to 𝐅, by [[AffineConstructive.logic.aprop.aand_false_r]]. The mirror image of [[AffineConstructive.tactics.simplify.aprop.simplify_false_aand]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aand_idem","base":"simplify_aand_idem","kind":"prf","start":117,"body":[118,122],"status":"ok","short":{"text":"P ∧ P simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that P ∧ P simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for P ∧ P = P. That is idempotence of the additive conjunction, [[AffineConstructive.logic.aprop.aand_idem]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aorl","base":"simplify_aorl","kind":"def","start":124,"body":null,"status":"ok","short":{"text":"P ⊸ P ∨ Q simplifies to 𝐓","status":"ok"},"long":{"text":"The left injection into the additive disjunction as a simplification rule: P implies P ∨ Q, so the implication is equivalent to 𝐓. It is the dual of [[AffineConstructive.tactics.simplify.aprop.simplify_aandl]], and like it is proved by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aorr","base":"simplify_aorr","kind":"def","start":126,"body":null,"status":"ok","short":{"text":"Q ⊸ P ∨ Q simplifies to 𝐓","status":"ok"},"long":{"text":"The right injection into the additive disjunction as a simplification rule: Q implies P ∨ Q, so the implication is equivalent to 𝐓. The companion of [[AffineConstructive.tactics.simplify.aprop.simplify_aorl]], proved by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_false_aor","base":"simplify_false_aor","kind":"prf","start":128,"body":[129,133],"status":"ok","short":{"text":"𝐅 ∨ P simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that 𝐅 ∨ P simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for 𝐅 ∨ P = P. That is the unit law [[AffineConstructive.logic.aprop.aor_unit_l]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aor_false","base":"simplify_aor_false","kind":"prf","start":135,"body":[136,140],"status":"ok","short":{"text":"P ∨ 𝐅 simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that P ∨ 𝐅 simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for P ∨ 𝐅 = P. That is the unit law [[AffineConstructive.logic.aprop.aor_unit_r]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_true_aor","base":"simplify_true_aor","kind":"def","start":142,"body":null,"status":"ok","short":{"text":"𝐓 ∨ P simplifies to 𝐓","status":"ok"},"long":{"text":"Truth absorbs the additive disjunction: 𝐓 ∨ P is equivalent to 𝐓, by [[AffineConstructive.logic.aprop.aor_true_l]]. The dual of [[AffineConstructive.tactics.simplify.aprop.simplify_false_aand]]; P is discarded unsimplified.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aor_true","base":"simplify_aor_true","kind":"def","start":143,"body":null,"status":"ok","short":{"text":"P ∨ 𝐓 simplifies to 𝐓","status":"ok"},"long":{"text":"Truth absorbs the additive disjunction on the right: P ∨ 𝐓 is equivalent to 𝐓, by [[AffineConstructive.logic.aprop.aor_true_r]]. The mirror image of [[AffineConstructive.tactics.simplify.aprop.simplify_true_aor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aor_idem","base":"simplify_aor_idem","kind":"prf","start":146,"body":[147,151],"status":"ok","short":{"text":"P ∨ P simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that P ∨ P simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for P ∨ P = P. That is idempotence of the additive disjunction, [[AffineConstructive.logic.aprop.aor_idem]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_true_aprod","base":"simplify_true_aprod","kind":"prf","start":153,"body":[154,158],"status":"ok","short":{"text":"𝐓 ⊠ P simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that 𝐓 ⊠ P simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for 𝐓 ⊠ P = P. That is the unit law [[AffineConstructive.logic.aprop.aprod_unit_l]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aprod_true","base":"simplify_aprod_true","kind":"prf","start":160,"body":[161,165],"status":"ok","short":{"text":"P ⊠ 𝐓 simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that P ⊠ 𝐓 simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for P ⊠ 𝐓 = P. That is the unit law [[AffineConstructive.logic.aprop.aprod_unit_r]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_false_aprod","base":"simplify_false_aprod","kind":"def","start":167,"body":null,"status":"ok","short":{"text":"𝐅 ⊠ P simplifies to 𝐅","status":"ok"},"long":{"text":"Falsity absorbs the tensor: 𝐅 ⊠ P is equivalent to 𝐅, by [[AffineConstructive.logic.aprop.aprod_false_l]]. Both conjunctions, additive and multiplicative, are absorbed by 𝐅; the tensor is not idempotent, which is why this file has no idempotency rule for ⊠ as it has for ∧.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aprod_false","base":"simplify_aprod_false","kind":"def","start":168,"body":null,"status":"ok","short":{"text":"P ⊠ 𝐅 simplifies to 𝐅","status":"ok"},"long":{"text":"Falsity absorbs the tensor on the right: P ⊠ 𝐅 is equivalent to 𝐅, by [[AffineConstructive.logic.aprop.aprod_false_r]]. The mirror image of [[AffineConstructive.tactics.simplify.aprop.simplify_false_aprod]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_false_apar","base":"simplify_false_apar","kind":"prf","start":171,"body":[172,176],"status":"ok","short":{"text":"𝐅 ⊞ P simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that 𝐅 ⊞ P simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for 𝐅 ⊞ P = P. That is the unit law for par, [[AffineConstructive.logic.aprop.apar_unit_l]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_apar_false","base":"simplify_apar_false","kind":"prf","start":178,"body":[179,183],"status":"ok","short":{"text":"P ⊞ 𝐅 simplifies to P', where P simplifies to P'","status":"ok"},"proof":[{"text":"Simplification is transitive, so the step goes through P: the hypothesis takes P to P', and what is left is that P ⊞ 𝐅 simplifies to P.","status":"ok","from":0,"to":1},{"text":"A single simplification step is an equality of propositions, so the goal asks for P ⊞ 𝐅 = P. That is the unit law for par, [[AffineConstructive.logic.aprop.apar_unit_r]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_true_apar","base":"simplify_true_apar","kind":"def","start":185,"body":null,"status":"ok","short":{"text":"𝐓 ⊞ P simplifies to 𝐓","status":"ok"},"long":{"text":"Truth absorbs par: 𝐓 ⊞ P is equivalent to 𝐓, by [[AffineConstructive.logic.aprop.apar_true_l]]. It is the dual of [[AffineConstructive.tactics.simplify.aprop.simplify_false_aprod]], as par is the dual of the tensor.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_apar_true","base":"simplify_apar_true","kind":"def","start":186,"body":null,"status":"ok","short":{"text":"P ⊞ 𝐓 simplifies to 𝐓","status":"ok"},"long":{"text":"Truth absorbs par on the right: P ⊞ 𝐓 is equivalent to 𝐓, by [[AffineConstructive.logic.aprop.apar_true_r]]. The mirror image of [[AffineConstructive.tactics.simplify.aprop.simplify_true_apar]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_of_course_true","base":"simplify_of_course_true","kind":"def","start":189,"body":null,"status":"ok","short":{"text":"!𝐓 simplifies to 𝐓","status":"ok"},"long":{"text":"Truth affirmed is truth: !𝐓 is equivalent to 𝐓, so the modality is dropped. The rule applies where the of-course modality is taken of the proof component of 𝐓, which is the form !𝐓 takes in the code. The equivalence is proved by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_of_course_false","base":"simplify_of_course_false","kind":"def","start":190,"body":null,"status":"ok","short":{"text":"!𝐅 simplifies to 𝐅","status":"ok"},"long":{"text":"The simplification rule recording that falsity affirmed is falsity: !𝐅 is equivalent to 𝐅, so the simplifier removes the modality. Together with [[AffineConstructive.tactics.simplify.aprop.simplify_of_course_true]], which turns !𝐓 into 𝐓, it handles the of-course modality applied to a constant. The equivalence is proved by the decision procedure for the connectives.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_of_course_idem","base":"simplify_of_course_idem","kind":"prf","start":193,"body":[194,198],"status":"ok","short":{"text":"!!P simplifies to !P′ when P simplifies to P′, since of course is idempotent","status":"ok"},"proof":[{"text":"A simplification is an equality of affine propositions, so the goal is to show that !!P equals !P′.","status":"ok","from":0,"to":1},{"text":"Replace P by its simplified form P′ inside the double modality, using the equality P = P′ that the hypothesis provides. What remains is !!P′ = !P′.","status":"ok","from":2,"to":2},{"text":"This is the idempotence of of course, [[AffineConstructive.logic.aprop.of_course_idem]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_why_not_idem","base":"simplify_why_not_idem","kind":"prf","start":200,"body":[201,205],"status":"ok","short":{"text":"??P simplifies to ?P′ when P simplifies to P′, since why not is idempotent","status":"ok"},"proof":[{"text":"A simplification is an equality of affine propositions, so the goal is to show that ??P equals ?P′.","status":"ok","from":0,"to":1},{"text":"Replace P by its simplified form P′ inside the double modality, using the equality P = P′ that the hypothesis provides. What remains is ??P′ = ?P′.","status":"ok","from":2,"to":2},{"text":"This is the idempotence of why not, [[AffineConstructive.logic.aprop.why_not_idem]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_true_prop","base":"simplify_true_prop","kind":"def","start":207,"body":null,"status":"ok","short":{"text":"A proved affine proposition simplifies to truth","status":"ok"},"long":{"text":"Given a proof of an affine proposition P, the simplification of P to 𝐓, obtained from the fact that a proved proposition is equivalent to truth ([[AffineConstructive.logic.aprop.aiff_is_true]]).\n\nA low-priority hint offers this rule for every affine proposition and leaves the proof of P to instance resolution. As a result, the simplifier replaces by 𝐓 any subformula that resolution can prove outright, such as an instance of a class that is in context or can be derived. This rule is tried only after the structural rules for the connectives have failed to apply.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_all_true","base":"simplify_all_true","kind":"prf","start":211,"body":[212,214],"status":"ok","short":{"text":"The universal ∏ x, 𝐓 over any type simplifies to 𝐓","status":"ok"},"proof":[{"text":"The goal is the equality of ∏ x, 𝐓 with 𝐓, and the tautology decision procedure settles it: 𝐓 holds at every x, and refuting ∏ x, 𝐓 would mean refuting 𝐓 at some x, which is impossible.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.tactics.simplify.aprop.simplify_aex_false","base":"simplify_aex_false","kind":"prf","start":216,"body":[217,219],"status":"ok","short":{"text":"The existential ∐ x, 𝐅 over any type simplifies to 𝐅","status":"ok"},"proof":[{"text":"The goal is the equality of ∐ x, 𝐅 with 𝐅, and the tautology decision procedure settles it: a witness would give a proof of 𝐅, and 𝐅 is refuted at every x.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.easy":{"page":"../easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.simplify.base":{"page":"base.html","short":"An extensible typeclass simplifier for terms of a set, and the simplify tactics","summary":"The file sets up an extensible simplifier for terms of an affine set. The class [[SimplifiesTo]] records that a term x simplifies to a term y, carrying a proof of the equality x = y. The base rule [[simplify_base]] leaves a term unchanged. [[simplify_chain]] composes two steps, using that the simplification relation is an equivalence ([[SimplifiesToR_sEquivalence]]). Congruence lemmas push simplification into pairs of a tensor or cartesian product ([[simplify_tensor_pair]], [[simplify_prod_pair]]), into the application of a function of sets ([[simplify_app]]), into the argument of an equality-preserving map ([[simplify_arg]]), and into both arguments of a two-argument map whose uncurried form is a function on X ⊗ Y or X × Y ([[simplify_tensor_arg2]], [[simplify_prod_arg2]]). Resolution applies a congruence step only when it changes the term. [[FullSimplifiesTo]] repeats top-level steps until nothing changes. The tactics `simplify` and `full_simplify` put the resulting equality of the goal at the head of the goal. The later files under tactics/simplify add rules for particular operations."}},"constants":null}</script>

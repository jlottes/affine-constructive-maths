,"source":"Require Import interfaces.set sprop logic.srelations.\nRequire Import easy tactics.misc.\n\n(** Extensible typeclass mechanism for inferring a simplfication of a term. *)\nClass SimplifiesTo {X:set} (x y : X) : SProp := { simplify : x = y }.\nGlobal Hint Mode SimplifiesTo + + - : typeclass_instances.\nArguments simplify {X} x {y _}.\nTactic Notation \"solve_simplify\" uconstr(t) := match goal with |- @SimplifiesTo ?X ?x ?y => notypeclasses refine (Build_SimplifiesTo X x y t) end.\n\nLtac simplify := let G := get_goal in refine (sprop.andr (simplify G) _).\n\nDefinition simplify_base {X:set} {x:X} : SimplifiesTo x x := {| simplify := reflexivity (=) _ |}.\nGlobal Hint Extern 200 (SimplifiesTo ?x _) =>\n  (* idtac \"simplify base\" x; *)\n  simple notypeclasses refine simplify_base : typeclass_instances.\n\n\nDefinition SimplifiesToR {X:set} : srelation X := λ '(x, y), @SimplifiesTo X x y.\n\nLemma SimplifiesToR_sEquivalence {X} : sEquivalence (@SimplifiesToR X).\nProof. split.\n+ now intros ?; split.\n+ intros ??[?]; split; sym.\n+ intros ? y ? [?][?]; split; trans y.\nQed.\nGlobal Hint Extern 2 (sEquivalence SimplifiesToR) => simple notypeclasses refine SimplifiesToR_sEquivalence : typeclass_instances.\nGlobal Hint Extern 2 (sReflexive SimplifiesToR) => simple notypeclasses refine SimplifiesToR_sEquivalence : typeclass_instances.\nGlobal Hint Extern 2 (sSymmetric SimplifiesToR) => simple notypeclasses refine SimplifiesToR_sEquivalence : typeclass_instances.\nGlobal Hint Extern 2 (sTransitive SimplifiesToR) => simple notypeclasses refine SimplifiesToR_sEquivalence : typeclass_instances.\n\nDefinition simplify_chain {X:set} {x y z : X} : SimplifiesTo x y → SimplifiesTo y z → SimplifiesTo x z := stransitivity (R:=SimplifiesToR) _ _ _.\n\n(** \"Runs\" SimplifiesTo at top level until it makes no progress. *)\nDefinition FullSimplifiesTo := @SimplifiesTo.\nArguments FullSimplifiesTo {_} _ _.\nExisting Class FullSimplifiesTo.\nGlobal Hint Mode FullSimplifiesTo + + - : typeclass_instances.\nDefinition full_simplify {X} x {y} {H:@FullSimplifiesTo X x y} : x = y := simplify x.\n\nDefinition full_simplify_chain {X:set} {x y z : X} : SimplifiesTo x y → FullSimplifiesTo y z → FullSimplifiesTo x z := simplify_chain.\n\nGlobal Hint Extern 2 (FullSimplifiesTo ?x ?y) =>\n  (* idtac \"full simplify\" x y; *)\n  let t := \n     let s := constr:(simplify x) in lazymatch s with ?E.(simplify _) => constr:(E) end in\n  ( progress notypeclasses refine (full_simplify_chain t _)\n    || refine t ) : typeclass_instances.\n\nLtac full_simplify := let G := get_goal in refine (sprop.andr (full_simplify G) _).\n\n\nLtac simplify_progress t :=\n  lazymatch type of t with\n  | SimplifiesTo ?a ?b =>\n      lazymatch a with\n      | b => fail 1\n      | _ => notypeclasses refine (simplify_chain t _)\n      end\n  end.\n\n(** The congruence lemmas below carry [coerce] in their conclusion only so they\n    typecheck at the ambient set [A] (whose carrier matches the function\n    codomain's by convention, not definitionally).  [simplify_progress_at A t]\n    erases it: it extracts the [coerce] arguments from [t]'s type and re-ascribes\n    [t] to the clean [@SimplifiesTo A a b], which typechecks because [A] is\n    concrete in the goal.  This keeps [coerce] out of every [SimplifiesTo] arg\n    that the chain produces. *)\nLtac simplify_progress_at A t :=\n  lazymatch type of t with\n  | @SimplifiesTo _ (func_op _ ?a) (func_op _ ?b) =>\n      simplify_progress constr:(t : @SimplifiesTo A a b)\n  end.\n\n\nLemma simplify_tensor_pair {X Y} `{@SimplifiesTo X x x'} `{@SimplifiesTo Y y y'} : SimplifiesTo (X:=X⊗Y) (x, y) (x', y').\nProof. split. split; now apply simplify. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (X:=_ ⊗ _) (_, _) _) => notypeclasses refine simplify_tensor_pair : typeclass_instances.\n\nLemma simplify_prod_pair {X Y} `{@SimplifiesTo X x x'} `{@SimplifiesTo Y y y'} : SimplifiesTo (X:=X×Y) (x, y) (x', y').\nProof. split. split; now apply simplify. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (X:=_ × _) (_, _) _) => notypeclasses refine simplify_prod_pair : typeclass_instances.\n\nLemma simplify_app {X Y A} `{c:Coerce Y A} `{@SimplifiesTo (X ⇾ Y) f f'} `{@SimplifiesTo X x x'}\n  : @SimplifiesTo A (coerce Y A (f x)) (coerce Y A (f' x')).\nProof. split. apply (is_fun (coerce Y A) (f x) (f' x')).\n  trans (f' x). exact (simplify f _). apply (is_fun f'). exact (simplify x).\nQed.\nGlobal Hint Extern 100 (SimplifiesTo (func_op ?f ?x) _) =>\n  lazymatch goal with\n  | |- @SimplifiesTo ?A _ _ =>\n      simplify_progress_at A constr:(simplify_app (A:=A) (f:=f) (x:=x))\n  end : typeclass_instances.\n\nLemma simplify_arg (X Y A:set) (f:X → Y) (H:IsFun f) x `{c:Coerce Y A} `{@SimplifiesTo X x x'}\n  : @SimplifiesTo A (coerce Y A (f x)) (coerce Y A (f x')).\nProof. split. apply (is_fun (coerce Y A) (f x) (f x')). apply H. exact (simplify x). Qed.\n\nLemma simplify_tensor_arg2 (X Y Z A:set) (f:X → Y → Z) (H:IsFun (X:=X⊗Y) (tuncurry f)) x y\n  `{c:Coerce Z A} `{@SimplifiesTo X x x'} `{@SimplifiesTo Y y y'}\n  : @SimplifiesTo A (coerce Z A (f x y)) (coerce Z A (f x' y')).\nProof. split. apply (is_fun (coerce Z A) (f x y) (f x' y')).\n  change (tuncurry f (x, y) = tuncurry f (x', y')). apply H; split; now apply simplify.\nQed.\n\nLemma simplify_prod_arg2 (X Y Z A:set) (f:X → Y → Z) (H:IsFun (X:=X×Y) (tuncurry f)) x y\n  `{c:Coerce Z A} `{@SimplifiesTo X x x'} `{@SimplifiesTo Y y y'}\n  : @SimplifiesTo A (coerce Z A (f x y)) (coerce Z A (f x' y')).\nProof. split. apply (is_fun (coerce Z A) (f x y) (f x' y')).\n  change (tuncurry f (x, y) = tuncurry f (x', y')). apply H; split; now apply simplify.\nQed.\n\nGlobal Hint Extern 102 (SimplifiesTo (?f ?x₁ ?x₂) ?y) =>\n  lazymatch f with\n  | func_op => fail 1\n  | func_op _ => fail 1\n  | func_op _ _ => fail 1\n  | func_op _ _ _ => fail 1\n  | _ => idtac\n  end;\n  lazymatch goal with\n  | |- @SimplifiesTo ?A _ _ =>\n    lazymatch constr:(@id (func _ _) (tuncurry f)) with\n    | @id (func (?X ⊗ ?Y) ?Z) ?f' => simplify_progress_at A constr:(simplify_tensor_arg2 X Y Z A f (func_is_fun f') x₁ x₂)\n    | @id (func (?X × ?Y) ?Z) ?f' => simplify_progress_at A constr:(simplify_prod_arg2 X Y Z A f (func_is_fun f') x₁ x₂)\n    end\n  end\n  : typeclass_instances.\n\nGlobal Hint Extern 103 (SimplifiesTo (?f ?x) ?y) =>\n  lazymatch f with\n  | func_op => fail 1\n  | func_op _ => fail 1\n  | func_op _ _ => fail 1\n  | func_op _ _ _ => fail 1\n  | _ => idtac\n  end;\n  lazymatch goal with\n  | |- @SimplifiesTo ?A _ _ =>\n    lazymatch constr:(@id (func _ _) f) with @id (func ?X ?Y) ?f' =>\n       simplify_progress_at A constr:(simplify_arg X Y A f (func_is_fun f') x)\n    end\n  end\n  : typeclass_instances.\n\n\nGlobal Hint Extern 2 (SimplifiesTo (tuncurry ?f (?a, ?b)) ?out) => change (SimplifiesTo (f a b) out) : typeclass_instances.\n\n","sentences":[{"i":0,"s":0,"e":53,"kind":"vernac","status":"ok","ms":23,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":54,"e":87,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":2,"s":89,"e":237,"kind":"vernac","status":"ok","ms":11,"messages":["b8eaaf7d750aa1e4","bbb6416a75ba4306"],"goals":null},{"i":3,"s":238,"e":296,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":297,"e":328,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":5,"s":329,"e":475,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":6,"s":477,"e":550,"kind":"vernac","status":"ok","ms":11,"messages":["bbb6416a75ba4306"],"goals":null},{"i":7,"s":552,"e":649,"kind":"vernac","status":"ok","ms":13,"messages":["c754c8b85c65f658"],"goals":null},{"i":8,"s":650,"e":795,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":9,"s":798,"e":879,"kind":"vernac","status":"ok","ms":11,"messages":["c9278258686a4624"],"goals":null},{"i":10,"s":881,"e":952,"kind":"vernac","status":"ok","ms" e.tactics.simplify.base","name":"SimplifiesTo","kind":"class","local":true},{"s":6603,"e":6611,"lib":"AffineConstructive.interfaces.prelude","name":"tuncurry","kind":"def","local":false,"page":"../../interfaces/prelude.html"},{"s":6642,"e":6654,"lib":"AffineConstructive.tactics.simplify.base","name":"SimplifiesTo","kind":"class","local":true},{"s":503,"e":511,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":false,"page":"../misc.html"},{"s":969,"e":972,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"},{"s":1013,"e":1016,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../easy.html"},{"s":1048,"e":1053,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../easy.html"},{"s":2518,"e":2526,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":false,"page":"../misc.html"},{"s":3593,"e":3596,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"},{"s":3884,"e":3887,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"},{"s":4249,"e":4254,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../easy.html"},{"s":5140,"e":5143,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"},{"s":5515,"e":5518,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"}],"gloss":{"summary":"The file sets up an extensible simplifier for terms of an affine set. The class [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] records that a term x simplifies to a term y, carrying a proof of the equality x = y. The base rule [[AffineConstructive.tactics.simplify.base.simplify_base]] leaves a term unchanged. [[AffineConstructive.tactics.simplify.base.simplify_chain]] composes two steps, using that the simplification relation is an equivalence ([[AffineConstructive.tactics.simplify.base.SimplifiesToR_sEquivalence]]). Congruence lemmas push simplification into pairs of a tensor or cartesian product ([[AffineConstructive.tactics.simplify.base.simplify_tensor_pair]], [[AffineConstructive.tactics.simplify.base.simplify_prod_pair]]), into the application of a function of sets ([[AffineConstructive.tactics.simplify.base.simplify_app]]), into the argument of an equality-preserving map ([[AffineConstructive.tactics.simplify.base.simplify_arg]]), and into both arguments of a two-argument map whose uncurried form is a function on X ⊗ Y or X × Y ([[AffineConstructive.tactics.simplify.base.simplify_tensor_arg2]], [[AffineConstructive.tactics.simplify.base.simplify_prod_arg2]]). Resolution applies a congruence step only when it changes the term. [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]] repeats top-level steps until nothing changes. The tactics `simplify` and `full_simplify` put the resulting equality of the goal at the head of the goal. The later files under tactics/simplify add rules for particular operations.","short":"An extensible typeclass simplifier for terms of a set, and the simplify tactics","items":[{"name":"AffineConstructive.tactics.simplify.base.SimplifiesTo","base":"SimplifiesTo","kind":"rec","start":2,"body":null,"status":"ok","short":{"text":"The class asserting that x simplifies to y in a set: a proof that x = y","status":"ok"},"long":{"text":"`SimplifiesTo x y` holds an equality x = y in the set X, where x is the term to simplify and y is its simplified form, an output for typeclass resolution to compute. The class is the interface of an extensible simplifier: each simplification rule is an instance or a hint that, given x, finds a y and proves x = y. Rules are added by later files for particular operations; this file supplies the base case, transitivity and the congruence rules for pairs and function application.\n\nThe search is directed: x must be known and y is found. The `simplify` tactic applies this to the goal itself. A goal is an affine proposition, an element of the set Ω, where equality is affine equivalence. The tactic finds a simplified form G' of the goal G, so that G = G', and proves G from G'. The goal is replaced by its simplification.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.simplify.base.simplify","base":"simplify","kind":"proj","short":{"text":"The equality x = y carried by a simplification of x to y","status":"ok"}},{"name":"AffineConstructive.tactics.simplify.base.Build_SimplifiesTo","base":"Build_SimplifiesTo","kind":"constr","short":{"text":"Builds a simplification of x to y from a proof of x = y","status":"ok"}}]},{"name":"AffineConstructive.tactics.simplify.base.solve_simplify","base":"solve_simplify","kind":"tacn","start":5,"body":null,"status":"ok","short":{"text":"Proves a goal SimplifiesTo x y by supplying a proof of x = y","status":"ok"},"long":{"text":"`solve_simplify t` closes a goal of the form `SimplifiesTo x y`, with x and y the two sides and X their set, by building the class instance directly from `t`, a proof of x = y. It is written for hints and rule files that declare a new simplification: the rule only has to provide the equation, and the tactic packages it as a [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] instance without starting another round of instance search on the way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.ltac:simplify","base":"ltac:simplify","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"Replaces the goal by its simplified form, found by SimplifiesTo instance search","status":"ok"},"long":{"text":"`simplify` treats the goal as a term of an affine set, here an affine proposition, and asks instance resolution for a [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] instance starting from it. The rules registered as hints then rewrite the goal's subterms: the components of a pair, the function and argument of an application, the arguments of a two-argument function that preserves equality, all chained by [[AffineConstructive.tactics.simplify.base.simplify_chain]], with [[AffineConstructive.tactics.simplify.base.simplify_base]] leaving a term unchanged when no rule applies. The result is an equation between the goal G and its simplified form G'. The tactic uses one direction of that equation to reduce G to G' and leaves G' as the new goal.\n\nOne call makes a single pass. Each rule simplifies the subterms it reaches, but the term it produces is not looked at again. To keep simplifying until nothing more changes, a proof uses [[AffineConstructive.tactics.simplify.base.full_simplify]] instead. A proof reaches for `simplify` when the goal holds compound expressions, such as functions applied to arguments that can be simplified, which the registered rules can bring to normal form. Rewriting each of them by hand would be tedious.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_base","base":"simplify_base","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"Every term simplifies to itself, by reflexivity of equality","status":"ok"},"long":{"text":"The trivial simplification: x simplifies to x, by the reflexivity of the equality of X. Resolution tries it last, after every other rule has failed. Simplification therefore always succeeds, and a term that no rule applies to is left unchanged. Because of this fallback, a subterm that cannot be simplified does not stop the simplification of the term around it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.SimplifiesToR","base":"SimplifiesToR","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The simplification relation on a set, as a relation on its pairs","status":"ok"},"long":{"text":"The relation that holds of a pair (x, y) when x simplifies to y, in the form of a relation on pairs that the generic theory of equivalence relations accepts. It is stated so that [[AffineConstructive.tactics.simplify.base.SimplifiesToR_sEquivalence]] can show it is an equivalence and [[AffineConstructive.tactics.simplify.base.simplify_chain]] can obtain transitivity from the generic lemma.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.SimplifiesToR_sEquivalence","base":"SimplifiesToR_sEquivalence","kind":"prf","start":10,"body":[11,19],"status":"ok","short":{"text":"Simplification is an equivalence relation on each set","status":"ok"},"proof":[{"text":"An equivalence relation is reflexive, symmetric and transitive; there are three things to show. A simplification x ↦ y is a record holding a proof of x = y, so each property reduces to the same property of the equality of X.","status":"ok","from":0,"to":1},{"text":"Reflexivity: every x simplifies to itself, by the reflexivity of equality.","status":"ok","from":2,"to":3},{"text":"Symmetry: unpack the equality x = y from a simplification and repackage its symmetric form y = x.","status":"ok","from":4,"to":5},{"text":"Transitivity: unpack x = y and y = z from the two simplifications; by transitivity through y they give x = z, which is repackaged as a simplification.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_chain","base":"simplify_chain","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"Composes simplifications: x to y and y to z give x to z","status":"ok"},"long":{"text":"Transitivity of simplification. It is how one simplification step is followed by another: the hints for function application use it to make a step and then leave the rest of the simplification of the result to further resolution. It is obtained from the transitivity of [[AffineConstructive.tactics.simplify.base.SimplifiesToR]], which is ultimately the transitivity of the equality of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.FullSimplifiesTo","base":"FullSimplifiesTo","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"Full simplification of x to y: top-level simplification repeated until nothing changes","status":"ok"},"long":{"text":"The same proposition as [[AffineConstructive.tactics.simplify.base.SimplifiesTo]], declared as a separate class so that resolution can treat it with a different strategy. A hint for this class computes one top-level simplification of x, to some x'. If that step changed the term, it continues with a full simplification of x', joined by [[AffineConstructive.tactics.simplify.base.full_simplify_chain]]. If not, the step itself is the answer. The process stops when a round makes no progress, at a fixed point of the simplifier.\n\nThe `full_simplify` tactic does the same for the goal as `simplify`: it replaces the goal by its full simplification.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.full_simplify","base":"full_simplify","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"The equality x = y between a term and its full simplification","status":"ok"},"long":{"text":"Given a term x of a set X, [[AffineConstructive.tactics.simplify.base.full_simplify]] x is the equality x = y, where y is what instance resolution finds for [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]] x y. That search runs single simplification steps ([[AffineConstructive.tactics.simplify.base.SimplifiesTo]]) at the top of the term until a step no longer changes it, joining the steps with [[AffineConstructive.tactics.simplify.base.full_simplify_chain]]. The result y is a fixed point of the simplifier: no further rule applies to it.\n\nSince [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]] is [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] under another name, the equality is just the [[AffineConstructive.tactics.simplify.base.simplify]] projection of the instance that was found. The definition exists to request the iterated search rather than a single step. The tactic `full_simplify` is built on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.full_simplify_chain","base":"full_simplify_chain","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"A simplification of x to y followed by a full simplification of y fully simplifies x","status":"ok"},"long":{"text":"The step of the fixed-point iteration behind [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]]: one round of simplification, followed by full simplification of the result, gives a full simplification of the original term. Since the two classes are the same proposition, it is [[AffineConstructive.tactics.simplify.base.simplify_chain]] restated.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.ltac:full_simplify","base":"ltac:full_simplify","kind":"ltac","start":32,"body":null,"status":"ok","short":{"text":"Assumes the equation between the goal and its full simplification, as a premise of the goal","status":"ok"},"long":{"text":"The tactic reads the goal G as a term and computes its full simplification G' by instance resolution for [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]]. This means repeating top-level simplification steps until one changes nothing. It then refines the goal by the right projection of a base-logic conjunction, whose first component is the equation [[AffineConstructive.tactics.simplify.base.full_simplify]] G : G = G'. What is left to prove is a goal that has this equation available. The same equation is how the plain `simplify` tactic proceeds, except that `simplify` takes only the single step found by [[AffineConstructive.tactics.simplify.base.SimplifiesTo]].\n\nA proof uses `full_simplify` when one round of simplification would leave terms that further rules could still reduce. An example is a rewrite that exposes a new pair or a new application at the top. The tactic finds the reduced form and its proof of equality in one go, so they do not have to be written out by hand.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_progress","base":"simplify_progress","kind":"ltac","start":33,"body":null,"status":"ok","short":{"text":"Chains a simplification step into the goal only if the step changes the term","status":"ok"},"long":{"text":"`simplify_progress t` takes a proof `t` that a changes to b. If b is syntactically a itself, the step made no progress and the tactic fails, so instance search moves on to other rules. Otherwise it refines the current goal `SimplifiesTo a ?` by [[AffineConstructive.tactics.simplify.base.simplify_chain]] with `t`, which leaves the simplification of b as the remaining subgoal. The application rules ([[AffineConstructive.tactics.simplify.base.simplify_app]], [[AffineConstructive.tactics.simplify.base.simplify_arg]], [[AffineConstructive.tactics.simplify.base.simplify_tensor_arg2]], [[AffineConstructive.tactics.simplify.base.simplify_prod_arg2]]) are used through it, by way of a variant that first strips the coercion into the ambient set from the step's type. This failure on no progress is what keeps the search from looping on a term it cannot change.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_progress_at","base":"simplify_progress_at","kind":"ltac","start":34,"body":null,"status":"ok","short":{"text":"Adds a congruence step to a simplification at a given set A, removing the coercion from its type","status":"ok"},"long":{"text":"This tactic is used inside the resolution hints for applications. It takes a set A and a proof t that a coerced application simplifies to another coerced application. The congruence lemmas [[AffineConstructive.tactics.simplify.base.simplify_app]], [[AffineConstructive.tactics.simplify.base.simplify_arg]], [[AffineConstructive.tactics.simplify.base.simplify_tensor_arg2]] and [[AffineConstructive.tactics.simplify.base.simplify_prod_arg2]] state their conclusion with a [[AffineConstructive.interfaces.set.coerce]] into A. They do so only because the codomain of the function and the ambient set A share a carrier by convention, not by definition. The tactic extracts the terms a and b from under the coercion and gives t the type of a simplification of a to b at A. This type checks because A is fixed by the goal. The result is then passed to `simplify_progress`. That tactic fails when a and b are the same term. Otherwise it chains the step onto the search with [[AffineConstructive.tactics.simplify.base.simplify_chain]].\n\nThe coercion therefore never appears in the terms that a chain of simplifications produces. A congruence step is also taken only when it makes progress, which keeps resolution from looping on a rule that leaves the term unchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_tensor_pair","base":"simplify_tensor_pair","kind":"prf","start":35,"body":[36,39],"status":"ok","short":{"text":"A pair in a tensor product simplifies componentwise","status":"ok"},"proof":[{"text":"It suffices to prove the equality (x, y) = (x', y') in the tensor product X ⊗ Y.","status":"ok","from":0,"to":1},{"text":"Equality on X ⊗ Y is the tensor of the componentwise equalities, so the two factors x = x' and y = y' are proved separately, each from the simplification of its component.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_prod_pair","base":"simplify_prod_pair","kind":"prf","start":41,"body":[42,45],"status":"ok","short":{"text":"A pair in a cartesian product simplifies componentwise","status":"ok"},"proof":[{"text":"It suffices to prove the equality (x, y) = (x', y') in the cartesian product X × Y.","status":"ok","from":0,"to":1},{"text":"Equality on X × Y is the additive conjunction of the componentwise equalities, so each conjunct, x = x' and y = y', is proved from the simplification of its component.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_app","base":"simplify_app","kind":"prf","start":47,"body":[48,55],"status":"ok","short":{"text":"An application f x simplifies by simplifying both the function f and the argument x","status":"ok"},"proof":[{"text":"It suffices to prove that the coerced values are equal in A. The coercion from Y to A is itself a function, so by [[AffineConstructive.interfaces.set.is_fun]] it is enough to show f x = f' x' in Y.","status":"ok","from":0,"to":2},{"text":"By transitivity through f' x. The first equality, f x = f' x, is the simplification of f to f', evaluated at x.","status":"ok","from":3,"to":4},{"text":"The second, f' x = f' x', follows by [[AffineConstructive.interfaces.set.is_fun]] for f' from the equality x = x' that the simplification of the argument provides.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_arg","base":"simplify_arg","kind":"prf","start":57,"body":[58,63],"status":"ok","short":{"text":"For a map preserving equality, f x simplifies by simplifying the argument x","status":"ok"},"proof":[{"text":"It suffices to prove that the coerced values are equal in A. Since the coercion preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), it is enough to show f x = f x' in Y.","status":"ok","from":0,"to":2},{"text":"The map f preserves equality, which reduces this to x = x', the equality that the simplification of x to x' provides.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_tensor_arg2","base":"simplify_tensor_arg2","kind":"prf","start":64,"body":[65,70],"status":"ok","short":{"text":"A two-argument map preserving equality on the tensor product simplifies f x y argumentwise","status":"ok"},"proof":[{"text":"It suffices to prove that the coerced values are equal in A, and since the coercion preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), it is enough to show f x y = f x' y' in Z.","status":"ok","from":0,"to":2},{"text":"Read this as the uncurried map applied to the pairs (x, y) and (x', y'). That map preserves equality on X ⊗ Y, which reduces the goal to the equality of the pairs in the tensor product. That equality is x = x' ⊠ y = y', and each factor comes from the simplification of its argument.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_prod_arg2","base":"simplify_prod_arg2","kind":"prf","start":71,"body":[72,77],"status":"ok","short":{"text":"A two-argument map preserving equality on the cartesian product simplifies f x y argumentwise","status":"ok"},"proof":[{"text":"It suffices to prove that the coerced values are equal in A, and since the coercion preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), it is enough to show f x y = f x' y' in Z.","status":"ok","from":0,"to":2},{"text":"Read this as the uncurried map applied to the pairs (x, y) and (x', y'). That map preserves equality on X × Y, which reduces the goal to the equality of the pairs in the cartesian product. That equality is the additive conjunction of x = x' and y = y', and each conjunct comes from the simplification of its argument.","status":"ok","from":3,"to":5}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.tactics.easy":{"page":"../easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

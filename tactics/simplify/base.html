"AffineConstructive.topology.uniform.product":"topology/uniform/product.html","AffineConstructive.topology.uniform.cylinder":"topology/uniform/cylinder.html","AffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set sprop logic.srelations.\nRequire Import easy tactics.misc.\n\n(** Extensible typeclass mechanism for inferring a simplfication of a term. *)\nClass SimplifiesTo {X:set} (x y : X) : SProp := { simplify : x = y }.\nGlobal Hint Mode SimplifiesTo + + - : typeclass_instances.\nArguments simplify {X} x {y _}.\nTactic Notation \"solve_simplify\" uconstr(t) := match goal with |- @SimplifiesTo ?X ?x ?y => notypeclasses refine (Build_SimplifiesTo X x y t) end.\n\nLtac simplify := let G := get_goal in refine (sprop.andr (simplify G) _).\n\nDefinition simplify_base {X:set} {x:X} : SimplifiesTo x x := {| simplify := reflexivity (=) _ |}.\nGlobal Hint Extern 200 (SimplifiesTo ?x _) =>\n  (* idtac \"simplify base\" x; *)\n  simple notypeclasses refine simplify_base : typeclass_instances.\n\n\nDefinition SimplifiesToR {X:set} : srelation X := λ '(x, y), @SimplifiesTo X x y.\n\nLemma SimplifiesToR_sEquivalence {X} : sEquivalence (@SimplifiesToR X).\nProof. split.\n+ now intros ?; split.\n+ intros ??[?]; split; sym.\n+ intros ? y ? [?][?]; split; trans y.\nQed.\nGlobal Hint Extern 2 (sEquivalence SimplifiesToR) => simple notypeclasses refine SimplifiesToR_sEquivalence : typeclass_instances.\nGlobal Hint Extern 2 (sReflexive SimplifiesToR) => simple notypeclasses refine SimplifiesToR_sEquivalence : typeclass_instances.\nGlobal Hint Extern 2 (sSymmetric SimplifiesToR) => simple notypeclasses refine SimplifiesToR_sEquivalence : typeclass_instances.\nGlobal Hint Extern 2 (sTransitive SimplifiesToR) => simple notypeclasses refine SimplifiesToR_sEquivalence : typeclass_instances.\n\nDefinition simplify_chain {X:set} {x y z : X} : SimplifiesTo x y → SimplifiesTo y z → SimplifiesTo x z := stransitivity (R:=SimplifiesToR) _ _ _.\n\n(** \"Runs\" SimplifiesTo at top level until it makes no progress. *)\nDefinition FullSimplifiesTo := @SimplifiesTo.\nArguments FullSimplifiesTo {_} _ _.\nExisting Class FullSimplifiesTo.\nGlobal Hint Mode FullSimplifiesTo + + - : typeclass_instances.\nDefinition full_simplify {X} x {y} {H:@FullSimplifiesTo X x y} : x = y := simplify x.\n\nDefinition full_simplify_chain {X:set} {x y z : X} : SimplifiesTo x y → FullSimplifiesTo y z → FullSimplifiesTo x z := simplify_chain.\n\nGlobal Hint Extern 2 (FullSimplifiesTo ?x ?y) =>\n  (* idtac \"full simplify\" x y; *)\n  let t := \n     let s := constr:(simplify x) in lazymatch s with ?E.(simplify _) => constr:(E) end in\n  ( progress notypeclasses refine (full_simplify_chain t _)\n    || refine t ) : typeclass_instances.\n\nLtac full_simplify := let G := get_goal in refine (sprop.andr (full_simplify G) _).\n\n\n(** * One step at a time, to a fixpoint\n\n    A [SimplifiesTo x z] goal is solved by iterating single steps.  The hint at\n    priority 0 wraps the goal as a chain\n    [SimplifiesTo x (simplify_step_full y) → SimplifiesToAfter x y z]: the\n    identity [simplify_step_full] on the output marks the step subgoal, which\n    is solved by the ordinary hints (a rule, a congruence, or reflexivity: a\n    rule's output unifies with the marked evar by unfolding) and is not wrapped\n    again.  [SimplifiesToAfter x y z] then compares: if nothing changed it\n    closes by reflexivity, otherwise it continues with [SimplifiesTo y z].  A\n    rule's output is simplified again in full.  A congruence's output comes\n    wrapped in the identity [simplify_descended]; the tail strips it and\n    continues with a [simplify_step_root] step, on which the congruence hints\n    stand aside: the parts were just simplified, so only the rules at the root\n    remain to be tried.  Without this every level of a chain re-traverses the\n    whole subtree below it, which is what made the old design quadratic on\n    deep progress.\n\n    The marker lives on the output, not in the context (a hypothesis would be\n    scanned by every hypothesis-trying hint of every nested resolution) and not\n    on the input or the set (the hint index keys on the head symbol there, and\n    a marked set would leak into the instance arguments of rule lemmas).  A\n    rule whose premise is [SimplifiesTo x x'] for a part [x] inherits the mark\n    on [x']: that part then takes a single step, and the tail finishes the work\n    at the rule's level.\n\n    When the output [z] is already known (a lemma's [SimplifiesTo] premise\n    instantiated by [rew] before resolution), the normal form is computed once\n    by a nested resolution and compared by conversion.  Running the chain\n    instead would let a mismatch at the end backtrack through every\n    alternative of every step. *)\nDefinition simplify_step_full {X:set} (y : X) : X := y.\nDefinition simplify_step_root {X:set} (y : X) : X := y.\nDefinition simplify_descended {X:set} (y : X) : X := y.\nDefinition simplify_descended_intro {X:set} {x y : X} (H : SimplifiesTo x y)\n  : SimplifiesTo x (simplify_step_full (simplify_descended y)) := H.\n\nDefinition SimplifiesToAfter {X:set} (x y z : X) := @SimplifiesTo X y z.\nExisting Class SimplifiesToAfter.\nGlobal Hint Mode SimplifiesToAfter + + + - : typeclass_instances.\n\nDefinition simplify_chain_full {X:set} {x y z : X} : SimplifiesTo x (simplify_step_full y) → SimplifiesToAfter x y z → SimplifiesTo x z := simplify_chain.\nDefinition simplify_chain_root {X:set} {x y z : X} : SimplifiesTo x (simplify_step_root y) → SimplifiesToAfter x y z → SimplifiesTo x z := simplify_chain.\n\n(** Constants, constructors and nullary operations ([0], [(+)]: a class\n    projection applied to a set and an instance of a class on that set)\n    simplify to themselves.  Deciding this here saves a step search per leaf,\n    and leaves are where the hint index is weakest: a transparent head matches\n    every pattern, so every rule would be tried.  Variables are not included,\n    since a hypothesis [SimplifiesTo x x'] may be in scope for them. *)\nLtac simplify_is_atom t :=\n  first\n  [ is_const t\n  | is_constructor t\n  | lazymatch t with ?c ?X ?inst =>\n      is_const c;\n      lazymatch type of X with set => idtac end;\n      lazymatch type of inst with ?cls X => first [ is_const cls | is_ind cls ] end\n    end ].\n\nGlobal Hint Extern 0 (@SimplifiesTo ?X ?x ?z) =>\n  tryif simplify_is_atom x then simple notypeclasses refine simplify_base else\n  lazymatch z with\n  | simplify_step_full _ => fail\n  | simplify_step_root _ => fail\n  | _ =>\n    tryif is_evar z then notypeclasses refine (simplify_chain_full _ _)\n    else let p := constr:(simplify x) in simple notypeclasses refine (Build_SimplifiesTo X x z p)\n  end : typeclass_instances.\n\n(** The congruence lemmas below carry [coerce] in their conclusion only so they\n    typecheck at the ambient set [A], whose carrier matches the function\n    codomain's.  The tail erases it by conversion (and keeps it in the one\n    case where that fails), so [coerce] never reaches a [SimplifiesTo]\n    argument that the chain produces. *)\nLtac simplify_strip_coerce t :=\n  lazymatch t with\n  | func_op (@coerce _ _ _) ?t' => t'\n  | _ => t\n  end.\n\n(** A step's output may still carry a step marker when the step went through\n    a set alias ([simplifies_of_course_set]): the marked evar then has a\n    different set than the solution, and unification assigns the whole marked\n    term. *)\nLtac simplify_strip_step t :=\n  lazymatch t with\n  | simplify_step_full ?t' => simplify_strip_step t'\n  | simplify_step_root ?t' => simplify_strip_step t'\n  | _ => t\n  end.\n\nGlobal Hint Extern 1 (@SimplifiesToAfter ?A ?x ?y ?z) =>\n  let y := simplify_strip_step y in\n  lazymatch y with\n  | simplify_descended ?y0 =>\n    let y' := simplify_strip_coerce y0 in\n    lazymatch x with\n    | y' => change (@SimplifiesTo A y' z); simple notypeclasses refine simplify_base\n    | _ => first\n      [ change (@SimplifiesTo A y' z); notypeclasses refine (simplify_chain_root _ _)\n      | change (@SimplifiesTo A y0 z); notypeclasses refine (simplify_chain_root _ _) ]\n    end\n  | _ =>\n    lazymatch x with\n    | y => change (@SimplifiesTo A y z); simple notypeclasses refine simplify_base\n    | _ =>\n      change (@SimplifiesTo A y z);\n      tryif simplify_is_atom y then simple notypeclasses refine simplify_base else idtac\n    end\n  end : typeclass_instances.\n\n(** Every congruence hint starts with this: it fires on full steps only. *)\nLtac simplify_congruence_start :=\n  lazymatch goal with\n  | |- @SimplifiesTo _ _ (simplify_step_full _) => idtac\n  | _ => fail\n  end.\n\n(** The identity coercion is by far the common case; resolving it by hand\n    saves a nested resolution per node. *)\nLtac simplify_coerce_instance Y A :=\n  lazymatch Y with\n  | A => constr:(id_fun A)\n  | _ => constr:(ltac:(first [ exact (id_fun A) | exact _ ]) : Coerce Y A)\n  end.\n\n\nLemma simplify_tensor_pair {X Y} `{@SimplifiesTo X x x'} `{@SimplifiesTo Y y y'} : SimplifiesTo (X:=X⊗Y) (x, y) (x', y').\nProof. split. split; now apply simplify. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (X:=_ ⊗ _) (_, _) _) =>\n  simplify_congruence_start; notypeclasses refine (simplify_descended_intro simplify_tensor_pair) : typeclass_instances.\n\nLemma simplify_prod_pair {X Y} `{@SimplifiesTo X x x'} `{@SimplifiesTo Y y y'} : SimplifiesTo (X:=X×Y) (x, y) (x', y').\nProof. split. split; now apply simplify. Qed.\nGlobal Hint Extern 4 (SimplifiesTo (X:=_ × _) (_, _) _) =>\n  simplify_congruence_start; notypeclasses refine (simplify_descended_intro simplify_prod_pair) : typeclass_instances.\n\nLemma simplify_app {X Y A} `{c:Coerce Y A} `{@SimplifiesTo (X ⇾ Y) f f'} `{@SimplifiesTo X x x'}\n  : @SimplifiesTo A (coerce Y A (f x)) (coerce Y A (f' x')).\nProof. split. apply (is_fun (coerce Y A) (f x) (f' x')).\n  trans (f' x). exact (simplify f _). apply (is_fun f'). exact (simplify x).\nQed.\nGlobal Hint Extern 100 (SimplifiesTo (func_op ?f ?x) _) =>\n  simplify_congruence_start;\n  lazymatch goal with\n  | |- @SimplifiesTo ?A _ _ =>\n      (* [f]'s codomain, through the definitional classes ([SgOp G] is [G ⊗ G ⇾ G]) *)\n      lazymatch constr:(@id (func _ _) f) with @id (func _ ?Y) _ =>\n        let c := simplify_coerce_instance Y A in\n        notypeclasses refine (simplify_descended_intro (simplify_app (A:=A) (c:=c) (f:=f) (x:=x)))\n      end\n  end : typeclass_instances.\n\nLemma simplify_arg (X Y A:set) (f:X → Y) (H:IsFun f) x `{c:Coerce Y A} `{@SimplifiesTo X x x'}\n  : @SimplifiesTo A (coerce Y A (f x)) (coerce Y A (f x')).\nProof. split. apply (is_fun (coerce Y A) (f x) (f x')). apply H. exact (simplify x). Qed.\n\nLemma simplify_tensor_arg2 (X Y Z A:set) (f:X → Y → Z) (H:IsFun (X:=X⊗Y) (tuncurry f)) x y\n  `{c:Coerce Z A} `{@SimplifiesTo X x x'} `{@SimplifiesTo Y y y'}\n  : @SimplifiesTo A (coerce Z A (f x y)) (coerce Z A (f x' y')).\nProof. split. apply (is_fun (coerce Z A) (f x y) (f x' y')).\n  change (tuncurry f (x, y) = tuncurry f (x', y')). apply H; split; now apply simplify.\nQed.\n\nLemma simplify_prod_arg2 (X Y Z A:set) (f:X → Y → Z) (H:IsFun (X:=X×Y) (tuncurry f)) x y\n  `{c:Coerce Z A} `{@SimplifiesTo X x x'} `{@SimplifiesTo Y y y'}\n  : @SimplifiesTo A (coerce Z A (f x y)) (coerce Z A (f x' y')).\nProof. split. apply (is_fun (coerce Z A) (f x y) (f x' y')).\n  change (tuncurry f (x, y) = tuncurry f (x', y')). apply H; split; now apply simplify.\nQed.\n\nGlobal Hint Extern 102 (SimplifiesTo (?f ?x₁ ?x₂) ?y) =>\n  simplify_congruence_start;\n  lazymatch f with\n  | func_op => fail 1\n  | func_op _ => fail 1\n  | func_op _ _ => fail 1\n  | func_op _ _ _ => fail 1\n  | _ => idtac\n  end;\n  lazymatch goal with\n  | |- @SimplifiesTo ?A _ _ =>\n    lazymatch constr:(@id (func _ _) (tuncurry f)) with\n    | @id (func (?X ⊗ ?Y) ?Z) ?f' =>\n        let c := simplify_coerce_instance Z A in\n        notypeclasses refine (simplify_descended_intro (simplify_tensor_arg2 X Y Z A f (func_is_fun f') x₁ x₂ (c:=c)))\n    | @id (func (?X × ?Y) ?Z) ?f' =>\n        let c := simplify_coerce_instance Z A in\n        notypeclasses refine (simplify_descended_intro (simplify_prod_arg2 X Y Z A f (func_is_fun f') x₁ x₂ (c:=c)))\n    end\n  end\n  : typeclass_instances.\n\nGlobal Hint Extern 103 (SimplifiesTo (?f ?x) ?y) =>\n  simplify_congruence_start;\n  lazymatch f with\n  | func_op => fail 1\n  | func_op _ => fail 1\n  | func_op _ _ => fail 1\n  | func_op _ _ _ => fail 1\n  | _ => idtac\n  end;\n  lazymatch goal with\n  | |- @SimplifiesTo ?A _ _ =>\n    lazymatch constr:(@id (func _ _) f) with @id (func ?X ?Y) ?f' =>\n       let c := simplify_coerce_instance Y A in\n       notypeclasses refine (simplify_descended_intro (simplify_arg X Y A f (func_is_fun f') x (c:=c)))\n    end\n  end\n  : typeclass_instances.\n\n\nGlobal Hint Extern 2 (SimplifiesTo (tuncurry ?f (?a, ?b)) ?out) => change (SimplifiesTo (f a b) out) : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":53,"kind":"vernac","status":"ok","ms":30,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","dce8be94fc52eab6","7f70dd02016b7ca9","63548cfadb7f5b35","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":54,"e":87,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":2,"s":89,"e":237,"kind":"vernac","status":"ok","ms":11,"messages":["b8eaaf7d750aa1e4","bbb6416a75ba4306"],"goals":null},{"i":3,"s":238,"e":296,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":4,"s":297,"e":328,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":5,"s":329,"e":475,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":6,"s":477,"e":550,"kind":"vernac","status":"ok","ms":13,"messages":["bbb6416a75ba4306"],"goals":null},{"i":7,"s":552,"e":649,"kind":"vernac","status":"ok","ms":17,"messages":["c754c8b85c65f658"],"goals":null},{"i":8,"s":650,"e":795,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":9,"s":798,"e":879,"kind":"vernac","status":"ok","ms":13,"messages":["c9278258686a4624"],"goals":null},{"i":10,"s":881,"e":952,"kind":"vernac","status":"ok","ms":14,"messages":[],"goal ineConstructive.interfaces.prelude","name":"id","kind":"def","local":false,"page":"../../interfaces/prelude.html"},{"s":12141,"e":12145,"lib":"AffineConstructive.interfaces.set","name":"func","kind":"rec","local":false,"page":"../../interfaces/set.html"},{"s":12398,"e":12410,"lib":"AffineConstructive.tactics.simplify.base","name":"SimplifiesTo","kind":"class","local":true},{"s":12412,"e":12420,"lib":"AffineConstructive.interfaces.prelude","name":"tuncurry","kind":"def","local":false,"page":"../../interfaces/prelude.html"},{"s":12451,"e":12463,"lib":"AffineConstructive.tactics.simplify.base","name":"SimplifiesTo","kind":"class","local":true},{"s":503,"e":511,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":false,"page":"../misc.html"},{"s":969,"e":972,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"},{"s":1013,"e":1016,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../easy.html"},{"s":1048,"e":1053,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../easy.html"},{"s":2518,"e":2526,"lib":"AffineConstructive.tactics.misc","name":"get_goal","kind":"ltac","local":false,"page":"../misc.html"},{"s":8725,"e":8728,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"},{"s":9072,"e":9075,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"},{"s":9493,"e":9498,"lib":"AffineConstructive.tactics.easy","name":"trans","kind":"tacn","local":false,"page":"../easy.html"},{"s":10654,"e":10657,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"},{"s":11029,"e":11032,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../easy.html"}],"gloss":{"summary":"The file sets up the extensible simplifier used throughout the development. A term x of a set X simplifies to y when the class [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] x y holds: a proof of x = y in which y is computed from x by instance resolution. Any term simplifies to itself ([[AffineConstructive.tactics.simplify.base.simplify_base]]), and simplifications compose ([[AffineConstructive.tactics.simplify.base.simplify_chain]]). The tactics `simplify` and `full_simplify` put the resulting equality for the goal in front of it. The file also has a driver that repeats single steps until the term stops changing. A step is a rule supplied as an instance elsewhere, a congruence that simplifies the parts of a term, or reflexivity. Identity markers on the output ([[AffineConstructive.tactics.simplify.base.simplify_step_full]], [[AffineConstructive.tactics.simplify.base.simplify_step_root]], [[AffineConstructive.tactics.simplify.base.simplify_descended]]) keep each level of the chain from going back over subterms it has already simplified. The congruences proved here cover tensor and cartesian pairs ([[AffineConstructive.tactics.simplify.base.simplify_tensor_pair]], [[AffineConstructive.tactics.simplify.base.simplify_prod_pair]]), application of a function that may itself simplify ([[AffineConstructive.tactics.simplify.base.simplify_app]]), and maps of one or two arguments that preserve equality ([[AffineConstructive.tactics.simplify.base.simplify_arg]], [[AffineConstructive.tactics.simplify.base.simplify_tensor_arg2]], [[AffineConstructive.tactics.simplify.base.simplify_prod_arg2]]). The proofs about the naturals, the integers and the binary integers lean on this simplifier heavily.","short":"The simplifier: SimplifiesTo, its step-by-step driver to a fixed point, and congruences","items":[{"name":"AffineConstructive.tactics.simplify.base.SimplifiesTo","base":"SimplifiesTo","kind":"rec","start":2,"body":null,"status":"ok","short":{"text":"The class asserting that x simplifies to y in a set: a proof that x = y","status":"ok"},"long":{"text":"`SimplifiesTo x y` holds an equality x = y in the set X, where x is the term to simplify and y is its simplified form, an output for typeclass resolution to compute. The class is the interface of an extensible simplifier: each simplification rule is an instance or a hint that, given x, finds a y and proves x = y. Rules are added by later files for particular operations; this file supplies the base case, transitivity and the congruence rules for pairs and function application.\n\nThe search is directed: x must be known and y is found. The `simplify` tactic applies this to the goal itself. A goal is an affine proposition, an element of the set Ω, where equality is affine equivalence. The tactic finds a simplified form G' of the goal G, so that G = G', and proves G from G'. The goal is replaced by its simplification.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.simplify.base.simplify","base":"simplify","kind":"proj","short":{"text":"The equality x = y carried by a simplification of x to y","status":"ok"}},{"name":"AffineConstructive.tactics.simplify.base.Build_SimplifiesTo","base":"Build_SimplifiesTo","kind":"constr","short":{"text":"Builds a simplification of x to y from a proof of x = y","status":"ok"}}]},{"name":"AffineConstructive.tactics.simplify.base.solve_simplify","base":"solve_simplify","kind":"tacn","start":5,"body":null,"status":"ok","short":{"text":"Proves a goal SimplifiesTo x y by supplying a proof of x = y","status":"ok"},"long":{"text":"`solve_simplify t` closes a goal of the form `SimplifiesTo x y`, with x and y the two sides and X their set, by building the class instance directly from `t`, a proof of x = y. It is written for hints and rule files that declare a new simplification: the rule only has to provide the equation, and the tactic packages it as a [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] instance without starting another round of instance search on the way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.ltac:simplify","base":"ltac:simplify","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"Replaces the goal by its simplified form, found by SimplifiesTo instance search","status":"ok"},"long":{"text":"`simplify` treats the goal as a term of an affine set, here an affine proposition, and asks instance resolution for a [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] instance starting from it. The rules registered as hints then rewrite the goal's subterms: the components of a pair, the function and argument of an application, the arguments of a two-argument function that preserves equality, all chained by [[AffineConstructive.tactics.simplify.base.simplify_chain]], with [[AffineConstructive.tactics.simplify.base.simplify_base]] leaving a term unchanged when no rule applies. The result is an equation between the goal G and its simplified form G'. The tactic uses one direction of that equation to reduce G to G' and leaves G' as the new goal.\n\nOne call makes a single pass. Each rule simplifies the subterms it reaches, but the term it produces is not looked at again. To keep simplifying until nothing more changes, a proof uses [[AffineConstructive.tactics.simplify.base.full_simplify]] instead. A proof reaches for `simplify` when the goal holds compound expressions, such as functions applied to arguments that can be simplified, which the registered rules can bring to normal form. Rewriting each of them by hand would be tedious.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_base","base":"simplify_base","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"Every term simplifies to itself, by reflexivity of equality","status":"ok"},"long":{"text":"The trivial simplification: x simplifies to x, by the reflexivity of the equality of X. Resolution tries it last, after every other rule has failed. Simplification therefore always succeeds, and a term that no rule applies to is left unchanged. Because of this fallback, a subterm that cannot be simplified does not stop the simplification of the term around it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.SimplifiesToR","base":"SimplifiesToR","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The simplification relation on a set, as a relation on its pairs","status":"ok"},"long":{"text":"The relation that holds of a pair (x, y) when x simplifies to y, in the form of a relation on pairs that the generic theory of equivalence relations accepts. It is stated so that [[AffineConstructive.tactics.simplify.base.SimplifiesToR_sEquivalence]] can show it is an equivalence and [[AffineConstructive.tactics.simplify.base.simplify_chain]] can obtain transitivity from the generic lemma.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.SimplifiesToR_sEquivalence","base":"SimplifiesToR_sEquivalence","kind":"prf","start":10,"body":[11,19],"status":"ok","short":{"text":"Simplification is an equivalence relation on each set","status":"ok"},"proof":[{"text":"An equivalence relation is reflexive, symmetric and transitive; there are three things to show. A simplification x ↦ y is a record holding a proof of x = y, so each property reduces to the same property of the equality of X.","status":"ok","from":0,"to":1},{"text":"Reflexivity: every x simplifies to itself, by the reflexivity of equality.","status":"ok","from":2,"to":3},{"text":"Symmetry: unpack the equality x = y from a simplification and repackage its symmetric form y = x.","status":"ok","from":4,"to":5},{"text":"Transitivity: unpack x = y and y = z from the two simplifications; by transitivity through y they give x = z, which is repackaged as a simplification.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_chain","base":"simplify_chain","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"Composes simplifications: x to y and y to z give x to z","status":"ok"},"long":{"text":"Transitivity of simplification. It is how one simplification step is followed by another: the hints for function application use it to make a step and then leave the rest of the simplification of the result to further resolution. It is obtained from the transitivity of [[AffineConstructive.tactics.simplify.base.SimplifiesToR]], which is ultimately the transitivity of the equality of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.FullSimplifiesTo","base":"FullSimplifiesTo","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"Full simplification of x to y: top-level simplification repeated until nothing changes","status":"ok"},"long":{"text":"The same proposition as [[AffineConstructive.tactics.simplify.base.SimplifiesTo]], declared as a separate class so that resolution can treat it with a different strategy. A hint for this class computes one top-level simplification of x, to some x'. If that step changed the term, it continues with a full simplification of x', joined by [[AffineConstructive.tactics.simplify.base.full_simplify_chain]]. If not, the step itself is the answer. The process stops when a round makes no progress, at a fixed point of the simplifier.\n\nThe `full_simplify` tactic does the same for the goal as `simplify`: it replaces the goal by its full simplification.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.full_simplify","base":"full_simplify","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"The equality x = y between a term and its full simplification","status":"ok"},"long":{"text":"Given a term x of a set X, [[AffineConstructive.tactics.simplify.base.full_simplify]] x is the equality x = y, where y is what instance resolution finds for [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]] x y. That search runs single simplification steps ([[AffineConstructive.tactics.simplify.base.SimplifiesTo]]) at the top of the term until a step no longer changes it, joining the steps with [[AffineConstructive.tactics.simplify.base.full_simplify_chain]]. The result y is a fixed point of the simplifier: no further rule applies to it.\n\nSince [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]] is [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] under another name, the equality is just the [[AffineConstructive.tactics.simplify.base.simplify]] projection of the instance that was found. The definition exists to request the iterated search rather than a single step. The tactic `full_simplify` is built on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.full_simplify_chain","base":"full_simplify_chain","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"A simplification of x to y followed by a full simplification of y fully simplifies x","status":"ok"},"long":{"text":"The step of the fixed-point iteration behind [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]]: one round of simplification, followed by full simplification of the result, gives a full simplification of the original term. Since the two classes are the same proposition, it is [[AffineConstructive.tactics.simplify.base.simplify_chain]] restated.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.ltac:full_simplify","base":"ltac:full_simplify","kind":"ltac","start":32,"body":null,"status":"ok","short":{"text":"Assumes the equation between the goal and its full simplification, as a premise of the goal","status":"ok"},"long":{"text":"The tactic reads the goal G as a term and computes its full simplification G' by instance resolution for [[AffineConstructive.tactics.simplify.base.FullSimplifiesTo]]. This means repeating top-level simplification steps until one changes nothing. It then refines the goal by the right projection of a base-logic conjunction, whose first component is the equation [[AffineConstructive.tactics.simplify.base.full_simplify]] G : G = G'. What is left to prove is a goal that has this equation available. The same equation is how the plain `simplify` tactic proceeds, except that `simplify` takes only the single step found by [[AffineConstructive.tactics.simplify.base.SimplifiesTo]].\n\nA proof uses `full_simplify` when one round of simplification would leave terms that further rules could still reduce. An example is a rewrite that exposes a new pair or a new application at the top. The tactic finds the reduced form and its proof of equality in one go, so they do not have to be written out by hand.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_step_full","base":"simplify_step_full","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"The identity on a set, marking a goal's output as a single full simplification step","status":"ok"},"long":{"text":"The identity on a set, used as a marker on the output of a [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] goal. When the driver meets a goal SimplifiesTo x z whose output z is still unknown, it splits the goal with [[AffineConstructive.tactics.simplify.base.simplify_chain_full]] into a single step, SimplifiesTo x (simplify_step_full y), and a tail that continues from y. The marker serves two purposes. It tells the driver not to split the step goal again, and it is the condition on which the congruence hints fire (see [[AffineConstructive.tactics.simplify.base.simplify_congruence_start]]). The step is then solved by one rule, one congruence or reflexivity. The marker is transparent, so when a rule's output is unified with the marked unknown it unfolds away.\n\nThe marker sits on the output rather than on the input, the set or a hypothesis. The input and the set are where resolution keys its hints, and a hypothesis would be scanned by every hint that tries hypotheses.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_step_root","base":"simplify_step_root","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"The identity on a set, marking a goal's output as a step taken only at the root","status":"ok"},"long":{"text":"The identity on a set, used as a marker on the output of a [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] goal, like [[AffineConstructive.tactics.simplify.base.simplify_step_full]], but for a step in which the congruence hints stand aside. Only the rules that apply at the head of the term are tried, or reflexivity. The tail of the driver asks for such a step through [[AffineConstructive.tactics.simplify.base.simplify_chain_root]] right after a congruence has simplified the parts of a term. The parts are already in normal form, so going back into them would only repeat work. Without this marker each level of a chain would go over the whole subtree below it again, and simplification would become quadratic in the depth of the term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_descended","base":"simplify_descended","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"The identity on a set, marking a step's output as produced by a congruence","status":"ok"},"long":{"text":"The identity on a set, wrapped around the output of a congruence step by [[AffineConstructive.tactics.simplify.base.simplify_descended_intro]]. It tells the tail of the driver that the step went into the parts of the term rather than applying a rule at its head. The tail strips the marker and continues with a root-only step ([[AffineConstructive.tactics.simplify.base.simplify_step_root]]) instead of a full one, because the parts have already been simplified.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_descended_intro","base":"simplify_descended_intro","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"Recasts a congruence's simplification of x to y as a full step whose output is marked as descended","status":"ok"},"long":{"text":"Takes a proof that x simplifies to y and returns the same proof as a proof that x simplifies to simplify_step_full (simplify_descended y). Every congruence hint in the file applies its congruence lemma through this function. The result then solves the marked single-step goal that the driver set up, and the [[AffineConstructive.tactics.simplify.base.simplify_descended]] marker tells the tail that only root rules remain to be tried on y. Both markers are identities, so the proof is unchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.SimplifiesToAfter","base":"SimplifiesToAfter","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"The tail of a simplification chain: y simplifies to z, with the step's input x kept for comparison","status":"ok"},"long":{"text":"SimplifiesToAfter x y z is SimplifiesTo y z. The extra argument x is the term before the step that produced y. It is a class of its own, with x and y as inputs and z as output, so that a hint can look at the outcome of the step before continuing. If nothing changed (y is x), the tail closes by reflexivity and the chain stops at a fixed point. If y is an atom, it also closes by reflexivity. Otherwise it goes on with SimplifiesTo y z, which the driver splits again. When the step was a congruence, the tail first removes the [[AffineConstructive.tactics.simplify.base.simplify_descended]] marker, and a coercion if one is present, and continues with a root-only step through [[AffineConstructive.tactics.simplify.base.simplify_chain_root]]. [[AffineConstructive.tactics.simplify.base.simplify_chain_full]] and [[AffineConstructive.tactics.simplify.base.simplify_chain_root]] take it as their second premise.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_chain_full","base":"simplify_chain_full","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"A full step from x to y, then the tail from y to z, gives x simplifies to z","status":"ok"},"long":{"text":"Transitivity of [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] ([[AffineConstructive.tactics.simplify.base.simplify_chain]]), stated so that the first premise is a single step marked with [[AffineConstructive.tactics.simplify.base.simplify_step_full]] and the second is the tail [[AffineConstructive.tactics.simplify.base.SimplifiesToAfter]] x y z. The driver hint at the highest priority applies it to every goal SimplifiesTo x z whose output is unknown and whose input is not an atom. This is how a simplification turns into a sequence of steps that runs until the term stops changing. The proofs about the naturals and the binary integers, such as [[AffineConstructive.orders.naturals.naturals_to_rig_ord_embedding]] and [[AffineConstructive.implementations.bin_int.bin_int.negater_correct]], pass through it whenever they simplify.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_chain_root","base":"simplify_chain_root","kind":"def","start":41,"body":null,"status":"ok","short":{"text":"A root-only step from x to y, then the tail from y to z, gives x simplifies to z","status":"ok"},"long":{"text":"Transitivity of [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] ([[AffineConstructive.tactics.simplify.base.simplify_chain]]), with the first premise a step marked with [[AffineConstructive.tactics.simplify.base.simplify_step_root]], so that only the rules at the head of the term are tried, and the second the tail [[AffineConstructive.tactics.simplify.base.SimplifiesToAfter]] x y z. The tail applies it after a congruence step: the parts of the term have been simplified, and what remains is to try the rules on the reassembled term, then continue to a fixed point.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_is_atom","base":"simplify_is_atom","kind":"ltac","start":42,"body":null,"status":"ok","short":{"text":"Succeeds on a term that cannot simplify: a constant, a constructor or a nullary operation","status":"ok"},"long":{"text":"Succeeds when the term is a constant or a constructor. It also succeeds when the term is a class projection applied to a set and to an instance of a class on that set, which is how a nullary operation such as 0, or an operation such as (+) mentioned without arguments, appears. Variables do not count, since a hypothesis may say that a variable simplifies to something else. The driver and the tail use it to close such a term by reflexivity at once, without trying every rule on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_strip_coerce","base":"simplify_strip_coerce","kind":"ltac","start":44,"body":null,"status":"ok","short":{"text":"Removes an outer application of a coercion from a term","status":"ok"},"long":{"text":"Returns the argument of an outer application of [[AffineConstructive.interfaces.set.coerce]], or the term unchanged if there is none. The congruence lemmas put a coercion into their output so that it has the right type at the goal's set. The tail of the driver uses this tactic to drop that coercion before it continues.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_strip_step","base":"simplify_strip_step","kind":"ltac","start":45,"body":null,"status":"ok","short":{"text":"Removes any nesting of step markers from a term","status":"ok"},"long":{"text":"Strips any number of [[AffineConstructive.tactics.simplify.base.simplify_step_full]] and [[AffineConstructive.tactics.simplify.base.simplify_step_root]] markers from the head of a term. A marker can remain in a step's output when the step goes through an alias of the set. In that case the marked unknown lives at a different set than the solution, so unification fills in the whole marked term. The tail of the driver applies this tactic before it compares the output with the input.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_congruence_start","base":"simplify_congruence_start","kind":"ltac","start":47,"body":null,"status":"ok","short":{"text":"Succeeds only when the goal's output is marked as a full step","status":"ok"},"long":{"text":"Every congruence hint in the simplifier starts with this test. It succeeds only on a [[AffineConstructive.tactics.simplify.base.SimplifiesTo]] goal whose output carries the [[AffineConstructive.tactics.simplify.base.simplify_step_full]] marker. Congruences therefore fire on single full steps and stand aside on root-only steps and on goals the driver has not yet split.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_coerce_instance","base":"simplify_coerce_instance","kind":"ltac","start":48,"body":null,"status":"ok","short":{"text":"Produces the coercion from a function's codomain to the goal's set, the identity when the two agree","status":"ok"},"long":{"text":"Given the codomain Y of a function and the set A of the goal, it returns a [[AffineConstructive.interfaces.set.Coerce]] instance from Y to A. When Y and A are the same term, the instance is the identity [[AffineConstructive.interfaces.set.id_fun]]. Otherwise it tries the identity up to conversion, and falls back on resolution. The congruence hints call it so that the common case, the identity coercion, needs no nested resolution at each node of the term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.simplify.base.simplify_tensor_pair","base":"simplify_tensor_pair","kind":"prf","start":49,"body":[50,53],"status":"ok","short":{"text":"A pair in a tensor product simplifies componentwise","status":"ok"},"proof":[{"text":"It suffices to prove the equality (x, y) = (x', y') in the tensor product X ⊗ Y.","status":"ok","from":0,"to":1},{"text":"Equality on X ⊗ Y is the tensor of the componentwise equalities, so the two factors x = x' and y = y' are proved separately, each from the simplification of its component.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_prod_pair","base":"simplify_prod_pair","kind":"prf","start":55,"body":[56,59],"status":"ok","short":{"text":"A pair in a cartesian product simplifies componentwise","status":"ok"},"proof":[{"text":"It suffices to prove the equality (x, y) = (x', y') in the cartesian product X × Y.","status":"ok","from":0,"to":1},{"text":"Equality on X × Y is the additive conjunction of the componentwise equalities, so each conjunct, x = x' and y = y', is proved from the simplification of its component.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_app","base":"simplify_app","kind":"prf","start":61,"body":[62,69],"status":"ok","short":{"text":"An application f x simplifies by simplifying both the function f and the argument x","status":"ok"},"proof":[{"text":"It suffices to prove that the coerced values are equal in A. The coercion from Y to A is itself a function, so by [[AffineConstructive.interfaces.set.is_fun]] it is enough to show f x = f' x' in Y.","status":"ok","from":0,"to":2},{"text":"By transitivity through f' x. The first equality, f x = f' x, is the simplification of f to f', evaluated at x.","status":"ok","from":3,"to":4},{"text":"The second, f' x = f' x', follows by [[AffineConstructive.interfaces.set.is_fun]] for f' from the equality x = x' that the simplification of the argument provides.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_arg","base":"simplify_arg","kind":"prf","start":71,"body":[72,77],"status":"ok","short":{"text":"For a map preserving equality, f x simplifies by simplifying the argument x","status":"ok"},"proof":[{"text":"It suffices to prove that the coerced values are equal in A. Since the coercion preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), it is enough to show f x = f x' in Y.","status":"ok","from":0,"to":2},{"text":"The map f preserves equality, which reduces this to x = x', the equality that the simplification of x to x' provides.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_tensor_arg2","base":"simplify_tensor_arg2","kind":"prf","start":78,"body":[79,84],"status":"ok","short":{"text":"A two-argument map preserving equality on the tensor product simplifies f x y argumentwise","status":"ok"},"proof":[{"text":"It suffices to prove that the coerced values are equal in A, and since the coercion preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), it is enough to show f x y = f x' y' in Z.","status":"ok","from":0,"to":2},{"text":"Read this as the uncurried map applied to the pairs (x, y) and (x', y'). That map preserves equality on X ⊗ Y, which reduces the goal to the equality of the pairs in the tensor product. That equality is x = x' ⊠ y = y', and each factor comes from the simplification of its argument.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.tactics.simplify.base.simplify_prod_arg2","base":"simplify_prod_arg2","kind":"prf","start":85,"body":[86,91],"status":"ok","short":{"text":"A two-argument map preserving equality on the cartesian product simplifies f x y argumentwise","status":"ok"},"proof":[{"text":"It suffices to prove that the coerced values are equal in A, and since the coercion preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), it is enough to show f x y = f x' y' in Z.","status":"ok","from":0,"to":2},{"text":"Read this as the uncurried map applied to the pairs (x, y) and (x', y'). That map preserves equality on X × Y, which reduces the goal to the equality of the pairs in the cartesian product. That equality is the additive conjunction of x = x' and y = y', and each conjunct comes from the simplification of its argument.","status":"ok","from":3,"to":5}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions, products, sums and the classes of equality","summary":"The file sets up the basic objects of the development. An affine set ([[set]]) is a type with an equality valued in affine propositions that is an equivalence. Functions X ⇾ Y ([[func_set]]) are maps that preserve equality, x₁ = x₂ implies f x₁ = f x₂, and two functions are equal when they agree at every point. The file defines the cartesian product X × Y, whose equality is the additive conjunction of the two component equalities, and the tensor product X ⊗ Y, whose equality is their tensor. It also defines the sum, the empty set 𝟎, the one-point set 𝟏, the identity, and composition. Composition is a function on the tensor (Y ⇾ Z) ⊗ (X ⇾ Y) ([[scompose_fun]]), because the equalities of g₁ with g₂ and of f₁ with f₂ are each used once. Alongside these are the classes of strong, decidable, affirmative and refutative equality, which classify sets by the kind of their equality, and the vocabulary of casts, coercions, inverses, injections, surjections and bijections. theory/set.v proves the properties of these definitions."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.tactics.easy":{"page":"../easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.misc":{"page":"../misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

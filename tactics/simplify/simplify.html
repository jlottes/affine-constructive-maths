 sets up an extensible simplifier for terms of an affine set. The class [[SimplifiesTo]] records that a term x simplifies to a term y, carrying a proof of the equality x = y. The base rule [[simplify_base]] leaves a term unchanged. [[simplify_chain]] composes two steps, using that the simplification relation is an equivalence ([[SimplifiesToR_sEquivalence]]). Congruence lemmas push simplification into pairs of a tensor or cartesian product ([[simplify_tensor_pair]], [[simplify_prod_pair]]), into the application of a function of sets ([[simplify_app]]), into the argument of an equality-preserving map ([[simplify_arg]]), and into both arguments of a two-argument map whose uncurried form is a function on X ⊗ Y or X × Y ([[simplify_tensor_arg2]], [[simplify_prod_arg2]]). Resolution applies a congruence step only when it changes the term. [[FullSimplifiesTo]] repeats top-level steps until nothing changes. The tactics `simplify` and `full_simplify` put the resulting equality of the goal at the head of the goal. The later files under tactics/simplify add rules for particular operations."},"AffineConstructive.tactics.simplify.aprop":{"page":"aprop.html","short":"Simplification rules for affine propositions: units, absorption, idempotence, duals, quantifiers","summary":"This file supplies the simplifier's rules for affine propositions, as instances of [[SimplifiesTo]] found by resolution. It covers the unit and absorption laws of 𝐓 and 𝐅 for ⊸, ⧟, ∧, ∨, ⊠ and ⊞, the idempotence of ∧, ∨, ! and ?, the trivial implications P ⊸ P, P ∧ Q ⊸ P and P ⊸ P ∨ Q, and the de Morgan dualities pushing a negation through ⊸, ! and ?. It also simplifies under the quantifiers ∏ and ∐, collapses ∏ over 𝐓 and ∐ over 𝐅, and turns a proved proposition into 𝐓. The theorems [[simplify_thm]] and [[full_simplify_thm]] transport a proof of a proposition to a proof of its simplified form; the framework itself is in the simplifier's base file."}},"constants":null}</script>

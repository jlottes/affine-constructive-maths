oduct.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.notation.\n\nDefinition StripCoercions `(s:T) := Dummy.\n\nCreate HintDb strip_coercions discriminated.\nLtac solve_strip_coercions := typeclasses eauto with strip_coercions nocore.\nTactic Notation \"strip_coercions_chain\" uconstr(term) := change (StripCoercions term).\n\nGlobal Hint Extern 100 (StripCoercions ?x) => let t := fresh \"t\" in pose (t := x); constructor : strip_coercions.\n\nLtac strip_coercions_or_self tm :=\n  lazymatch constr:(ltac:(solve_strip_coercions) : StripCoercions tm) with\n    (let _ := ?x in _) => x\n  end.\n\nLtac strip_coercions tm :=\n  let t := strip_coercions_or_self tm in\n  let _ := match goal with _ => assert_fails (constr_eq t tm) end in\n  t.\n\nLtac exact_strip_coercions tm :=\n  let t := strip_coercions tm in solve [ refine t ].\n","sentences":[{"i":0,"s":0,"e":35,"kind":"vernac","status":"ok","ms":17,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8"],"goals":null},{"i":1,"s":37,"e":79,"kind":"vernac","status":"ok","ms":11,"messages":["1ed1600a1b737a47"],"goals":null},{"i":2,"s":81,"e":125,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":3,"s":126,"e":202,"kind":"vernac","status":"ok","ms":11,"messages":["0572560a91423cd1"],"goals":null},{"i":4,"s":203,"e":289,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":5,"s":291,"e":404,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":6,"s":406,"e":550,"kind":"vernac","status":"ok","ms":13,"messages":["edd00fb71720a006"],"goals":null},{"i":7,"s":552,"e":693,"kind":"vernac","status":"ok","ms":13,"messages":["a4d4e221a24c0a6e"],"goals":null},{"i":8,"s":695,"e":780,"kind":"vernac","status":"ok","ms":12,"messages":["975bbdce8f89a15b"],"goals":null}],"pp":{"0572560a91423cd1":"solve_strip_coercions is defined","1ed1600a1b737a47":"StripCoercions is defined","239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","975bbdce8f89a15b":"exact_strip_coercions is defined","a4d4e221a24c0a6e":"strip_coercions is defined","af331431bd614838":"[Loading ML file rocq-runtime.plugins.firstorder_core (implicit dependency) ... done]","edd00fb71720a006":"strip_coercions_or_self is defined"},"defs":[{"s":48,"e":62,"kind":"def","name":"StripCoercions"},{"kind":"ltac","name":"solve_strip_coercions","s":131,"e":152},{"kind":"tacn","name":"strip_coercions_chain","s":219,"e":242},{"kind":"ltac","name":"strip_coercions_or_self","s":411,"e":434},{"kind":"ltac","name":"strip_coercions","s":557,"e":572},{"kind":"ltac","name":"exact_strip_coercions","s":700,"e":721}],"refs":[{"s":15,"e":34,"lib":"AffineConstructive.interfaces.notation","name":"","kind":"lib","local":false,"page":"../interfaces/notation.html"},{"s":73,"e":78,"lib":"AffineConstructive.tactics.try_all_hyps","name":"Dummy","kind":"ind","local":false,"page":"try_all_hyps.html"},{"s":268,"e":282,"lib":"AffineConstructive.tactics.strip_coercions","name":"StripCoercions","kind":"def","local":true},{"s":315,"e":329,"lib":"AffineConstructive.tactics.strip_coercions","name":"StripCoercions","kind":"def","local":true},{"s":492,"e":506,"lib":"AffineConstructive.tactics.strip_coercions","name":"StripCoercions","kind":"def","local":true},{"s":179,"e":194,"lib":"AffineConstructive.tactics.strip_coercions","name":"strip_coercions","kind":"ltac","local":true},{"s":467,"e":488,"lib":"AffineConstructive.tactics.strip_coercions","name":"solve_strip_coercions","kind":"ltac","local":true},{"s":590,"e":613,"lib":"AffineConstructive.tactics.strip_coercions","name":"strip_coercions_or_self","kind":"ltac","local":true},{"s":652,"e":664,"lib":"AffineConstructive.tactics.try_all_hyps","name":"assert_fails","kind":"tacn","local":false,"page":"try_all_hyps.html"},{"s":739,"e":754,"lib":"AffineConstructive.tactics.strip_coercions","name":"strip_coercions","kind":"ltac","local":true}],"gloss":{"summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[AffineConstructive.tactics.strip_coercions.StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[AffineConstructive.tactics.strip_coercions.strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[AffineConstructive.tactics.strip_coercions.strip_coercions_or_self]] and [[AffineConstructive.tactics.strip_coercions.strip_coercions]] read that term back from the proof found, and [[AffineConstructive.tactics.strip_coercions.exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database.","short":"Stripping coercions from a term by proof search over an extensible hint database","items":[{"name":"AffineConstructive.tactics.strip_coercions.StripCoercions","base":"StripCoercions","kind":"def","start":1,"body":null,"status":"ok","short":{"text":"A dummy goal about a term, whose proof search returns the term with its coercions stripped","status":"ok"},"long":{"text":"StripCoercions s is a proposition about a term s of any type. As a statement it says nothing: it is defined to be [[AffineConstructive.tactics.try_all_hyps.Dummy]], which has a single constructor, so any proof of it is trivial. It matters only as a goal to hand to proof search. The hint database strip_coercions is indexed by the shape of s. A hint that matches a pattern of coercions defines the simplified term as a local let-bound variable (it poses it) and then closes the goal with Dummy's constructor. The tactic reads the simplified term back out of the let-binding in the proof that search builds.\n\nUsing a goal this way keeps the rewriting of terms open to extension. To strip a new kind of coercion, add a hint for it to the database; the tactics do not change. The fallback hint, at priority 100, poses s unchanged. strip_coercions_or_self therefore always returns some term, and strip_coercions fails when nothing was stripped.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.strip_coercions.solve_strip_coercions","base":"solve_strip_coercions","kind":"ltac","start":3,"body":null,"status":"ok","short":{"text":"Solves a goal `StripCoercions tm` by proof search in the `strip_coercions` hint database alone","status":"ok"},"long":{"text":"The search engine behind the other tactics of the file. A goal [[AffineConstructive.tactics.strip_coercions.StripCoercions]] tm is a placeholder proposition, always provable, whose only role is to carry the term tm. This tactic runs typeclass-style proof search on it using only the hints of the `strip_coercions` database, without the core hints.\n\nThe hints in that database do the actual work. A hint that recognises a coercion wrapped around a term replaces the goal by the same placeholder on the term underneath, using [[AffineConstructive.tactics.strip_coercions.strip_coercions_chain]], and the search continues from there. When no specific hint applies, the fallback hint at priority 100 records the current term as a local definition and closes the goal. The proof found therefore ends with a `let` binding of the fully stripped term, and [[AffineConstructive.tactics.strip_coercions.strip_coercions_or_self]] reads the term back from it. Proofs never call this tactic directly.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.strip_coercions.strip_coercions_chain","base":"strip_coercions_chain","kind":"tacn","start":4,"body":null,"status":"ok","short":{"text":"Replaces a goal `StripCoercions tm` by `StripCoercions term`, continuing the stripping from term","status":"ok"},"long":{"text":"The step used inside hints of the `strip_coercions` database. When a hint matches a coercion applied to a term, it calls `strip_coercions_chain` with the term underneath. This changes the placeholder goal [[AffineConstructive.tactics.strip_coercions.StripCoercions]] tm into [[AffineConstructive.tactics.strip_coercions.StripCoercions]] term. The change succeeds only when the two terms are convertible, which is the case when the coercion unfolds to its argument. The search then runs again on the new goal, so a stack of coercions comes off one layer at a time. The argument is an untyped term, so a hint may write it with holes that are filled from the goal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.strip_coercions.strip_coercions_or_self","base":"strip_coercions_or_self","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"Returns tm with its coercions stripped by the hint database, or tm itself when no hint applies","status":"ok"},"long":{"text":"Builds a proof of [[AffineConstructive.tactics.strip_coercions.StripCoercions]] tm with [[AffineConstructive.tactics.strip_coercions.solve_strip_coercions]]. The proof found always ends with the local definition that the fallback hint makes of the final term, and this tactic returns that term. When no hint in the database recognises a coercion on tm, the fallback hint fires immediately and the result is tm unchanged. The tactic therefore never fails; [[AffineConstructive.tactics.strip_coercions.strip_coercions]] is the variant that insists that something was stripped.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.strip_coercions.strip_coercions","base":"strip_coercions","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"Returns tm with its coercions stripped, failing when nothing was stripped","status":"ok"},"long":{"text":"Works as [[AffineConstructive.tactics.strip_coercions.strip_coercions_or_self]], but fails when the result is syntactically the same term as tm. Callers can use it as a test: it succeeds only when the `strip_coercions` database recognised at least one coercion on tm, and it then returns the underlying term. A tactic elsewhere in the development can therefore try this step and, if it fails, fall back to a different treatment of the term.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.strip_coercions.exact_strip_coercions","base":"exact_strip_coercions","kind":"ltac","start":8,"body":null,"status":"ok","short":{"text":"Solves the goal with tm stripped of its coercions, failing if nothing was stripped or the result does not fit","status":"ok"},"long":{"text":"Computes the term returned by [[AffineConstructive.tactics.strip_coercions.strip_coercions]] for tm and refines the goal with it. The tactic must close the goal completely, with no subgoals left over. A proof uses it when the goal asks for the underlying object and only a coerced form tm of it is available. If the database strips nothing, or if the stripped term does not have the type the goal asks for, the tactic fails.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."}},"constants":null}</script>

rexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** Implementations of [tauto] and [intuition] tactics, rebased from\n    Corelib.Init.Tauto (Rocq 9.1), with edits to make the tactics work\n    with SProp:\n    - Use our own [not], [iff], [False] instead of Corelib.Init.Logic.*\n    - [change] instead of [unfold]/[red] for [not]\n    - Classical tauto removed (SProp is intuitionistic)\n    - [with_power_flags] for all entry points (recognizes record-style connectives)\n    - [flatten_contravariant_conj/disj] replaced with pure Ltac\n      to avoid the ML plugin's hardcoded [ERelevance.relevant] on arrow types,\n      which produces bad relevance marks for SProp binders.\n*)\n\nRequire Import interfaces.notation sprop.\n\nDeclare ML Module \"rocq-runtime.plugins.tauto\".\n\nLocal Ltac not_dep_intros :=\n  repeat match goal with\n  | |- (forall (_: ?X1), ?X2) => intro\n  | |- (not ?P) => change (P → False); intro\n  end.\n\nLocal Ltac axioms flags :=\n  match reverse goal with\n    | |- ?X1 => is_unit_or_eq flags X1; constructor 1\n    | H:?X1 |- _ => is_empty flags X1; elim H\n    | _:?X1 |- ?X1 => assumption\n  end.\n\nLocal Ltac simplif flags :=\n  not_dep_intros;\n  repeat\n     (match reverse goal with\n      | id: ?X1 |- _ => is_conj flags X1; elim id; do 2 intro; clear id\n      | id: (iff _) |- _ => elim id; do 2 intro; clear id\n      | id: (not ?P) |- _ => change (P → False) in id\n      | id: ?X1 |- _ => is_disj flags X1; elim id; intro; clear id\n      | _ =>\n        (* behaves as matching [ id0: ?X1 -> ?X2, id1: ?X1 |- _ ] with\n           universe-aware conversion *)\n        find_cut ltac:(fun id0 id1 X2 =>\n          (* generalize (id0 id1); intro; clear id0 does not work\n             (see Marco Maggiesi's BZ#301)\n          so we instead use Assert and exact. *)\n          assert X2; [exact (id0 id1) | clear id0]\n          )\n      | id: forall (_ : ?X1), ?X2|- _ =>\n        is_unit_or_eq flags X1; cut X2;\n    [ intro; clear id\n    | (* id : forall (_: ?X1), ?X2 |- ?X2 *)\n      cut X1; [exact id| constructor 1; fail]\n    ]\n      | id: forall (_ : ?X1), ?X2|- _ =>\n        (* flatten_contravariant_conj: id:(?A/\\?B)->?X2 ~~> ?A->?B->?X2\n           Pure Ltac replacement for the ML plugin version, which hardcodes\n           ERelevance.relevant and breaks SProp binders.\n           We match on the conjunction components and build the curried type\n           in Ltac so that Rocq infers correct relevance marks. *)\n        is_conj flags X1;\n        match X1 with\n        | ?C ?A ?B =>\n          assert (forall (_:A) (_:B), X2)\n            by (do 2 intro; apply id; split; assumption);\n          clear id\n        end\n  (* moved from \"id:(?A/\\?B)->?X2|-\" to \"?A->?B->?X2|-\" *)\n      | id: forall (_: iff (?X1, ?X2)), ?X3|- _ =>\n        assert (forall (_: forall _:X1, X2), forall (_: forall _: X2, X1), X3)\n    by (do 2 intro; apply id; split; assumption);\n          clear id\n      | id: forall (_:?X1), ?X2|- _ =>\n        (* flatten_contravariant_disj: id:(?A\\/?B)->?X2 ~~> ?A->?X2, ?B->?X2\n           Pure Ltac replacement for the ML plugin version. *)\n        is_disj flags X1;\n        match X1 with\n        | ?C ?A ?B =>\n          assert (forall (_:A), X2)\n            by (intro; apply id; constructor 1; assumption);\n          assert (forall (_:B), X2)\n            by (intro; apply id; constructor 2; assumption);\n          clear id\n        end\n  (* moved from \"id:(?A\\/?B)->?X2|-\" to \"?A->?X2,?B->?X2|-\" *)\n      | |- ?X1 => is_conj flags X1; split\n      | |- (iff _) => split\n      | |- (not ?P) => change (P → False)\n      end;\n      not_dep_intros).\n\nLocal Ltac tauto_intuit flags t_reduce t_solver :=\n let rec t_tauto_intuit :=\n (simplif flags; axioms flags\n || match reverse goal with\n    | id:forall(_: forall (_: ?X1), ?X2), ?X3|- _ =>\n  cut X3;\n    [ intro; clear id; t_tauto_intuit\n    | cut (forall (_: X1), X2);\n\t[ exact id\n\t| generalize (fun y:X2 => id (fun x:X1 => y)); intro; clear id;\n\t  solve [ t_tauto_intuit ]]]\n    | id:forall (_:not ?X1), ?X3|- _ =>\n  cut X3;\n    [ intro; clear id; t_tauto_intuit\n    | cut (not X1); [ exact id | clear id; intro; solve [t_tauto_intuit ]]]\n    | |- ?X1 =>\n        is_disj flags X1; solve [left;t_tauto_intuit | right;t_tauto_intuit]\n    end\n  ||\n  (* NB: [|- _ -> _] matches any product *)\n  match goal with | |- forall (_ : _),  _ => intro; t_tauto_intuit\n  |  |- _  => t_reduce;t_solver\n  end\n  ||\n  t_solver\n ) in t_tauto_intuit.\n\nLocal Ltac intuition_gen flags solver := tauto_intuit flags reduction_not_iff solver.\nLocal Ltac tauto_intuitionistic flags := intuition_gen flags fail || fail \"tauto failed\".\nLocal Ltac tauto_gen flags := tauto_intuitionistic flags.\n\nLtac tauto := with_power_flags ltac:(fun flags => tauto_gen flags).\nLocal Ltac intuition_then tac := with_power_flags ltac:(fun flags => intuition_gen flags tac).\nTactic Notation \"intuition\" := intuition_then ltac:(trivial).\nTactic Notation \"intuition\" tactic(t) := intuition_then t.\n\n","sentences":[{"i":0,"s":0,"e":667,"kind":"vernac","status":"ok","ms":17,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8"],"goals":null},{"i":1,"s":669,"e":716,"kind":"vernac","status":"ok","ms":12,"messages":["7ee0ddd10f8b2374"],"goals":null},{"i":2,"s":718,"e":862,"kind":"vernac","status":"ok","ms":11,"messages":["33026953c38f7898"],"goals":null},{"i":3,"s":864,"e":1056,"kind":"vernac","status":"ok","ms":11,"messages":["25dd25fcc01eba72"],"goals":null},{"i":4,"s":1058,"e":3511,"kind":"vernac","status":"ok","ms":12,"message ","kind":"def","local":false,"page":"../interfaces/sprop.html"},{"kind":"tacn","name":"intuition","s":4823,"e":4834,"lib":"AffineConstructive.tactics.tauto","local":true},{"s":1088,"e":1102,"lib":"AffineConstructive.tactics.tauto","name":"not_dep_intros","kind":"ltac","local":true},{"s":3495,"e":3509,"lib":"AffineConstructive.tactics.tauto","name":"not_dep_intros","kind":"ltac","local":true},{"s":3593,"e":3600,"lib":"AffineConstructive.tactics.tauto","name":"simplif","kind":"ltac","local":true},{"s":3608,"e":3614,"lib":"AffineConstructive.tactics.tauto","name":"axioms","kind":"ltac","local":true},{"s":4388,"e":4400,"lib":"AffineConstructive.tactics.tauto","name":"tauto_intuit","kind":"ltac","local":true},{"s":4474,"e":4487,"lib":"AffineConstructive.tactics.tauto","name":"intuition_gen","kind":"ltac","local":true},{"s":4553,"e":4573,"lib":"AffineConstructive.tactics.tauto","name":"tauto_intuitionistic","kind":"ltac","local":true},{"s":4632,"e":4641,"lib":"AffineConstructive.tactics.tauto","name":"tauto_gen","kind":"ltac","local":true},{"s":4719,"e":4732,"lib":"AffineConstructive.tactics.tauto","name":"intuition_gen","kind":"ltac","local":true},{"s":4776,"e":4790,"lib":"AffineConstructive.tactics.tauto","name":"intuition_then","kind":"ltac","local":true},{"s":4848,"e":4862,"lib":"AffineConstructive.tactics.tauto","name":"intuition_then","kind":"ltac","local":true}],"gloss":{"summary":"The file supplies `tauto` and `intuition` for the base logic `SProp`. Both are adapted from the Rocq core library's tactics of the same names, which do not work on strict propositions as shipped. `tauto` is a complete decision procedure for intuitionistic propositional logic. It handles and, or, implication, [[AffineConstructive.interfaces.sprop.not]], [[AffineConstructive.interfaces.sprop.iff]], truth and [[AffineConstructive.interfaces.sprop.False]], and recognises any connective defined as a record or inductive type of the right shape. `intuition` runs the same search but hands every goal the search leaves open to a solver, `trivial` by default. The changes from the core library are these: negation and equivalence are this development's own; negation is unfolded by restating it as an implication into [[AffineConstructive.interfaces.sprop.False]]; the classical branch is removed, so only intuitionistic reasoning is used; and two hypothesis-flattening steps are rewritten so that the binders they create get the right relevance for strict propositions. These tactics act only on the base logic. Affine statements are handled by the rewriting system of the neighbouring tactic files.","short":"tauto and intuition: intuitionistic propositional decision procedures for the base logic SProp","items":[{"name":"AffineConstructive.tactics.tauto.not_dep_intros","base":"not_dep_intros","kind":"ltac","start":2,"body":null,"status":"ok","short":{"text":"Introduces the premises of a goal that is a non-dependent implication or a negation","status":"ok"},"long":{"text":"While the goal is an implication whose conclusion does not depend on its premise, or a negation ¬P (restated as P → [[AffineConstructive.interfaces.sprop.False]]), this tactic introduces the premise as a hypothesis. It stops at the first goal of any other shape. The search in [[AffineConstructive.tactics.tauto.simplif]] runs it before and after each of its steps, so that hypotheses always sit in the context and not inside the goal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.axioms","base":"axioms","kind":"ltac","start":3,"body":null,"status":"ok","short":{"text":"Closes a goal that is trivially true, has an empty hypothesis, or is already a hypothesis","status":"ok"},"long":{"text":"This is the closing step of the search, and it has three cases. If the goal is a unit-like proposition, such as truth or an equality, it is proved by its first constructor. If some hypothesis is empty-like, such as [[AffineConstructive.interfaces.sprop.False]], the goal follows by eliminating that hypothesis. If some hypothesis is the goal itself, the goal is closed by that hypothesis. Hypotheses are searched from the oldest to the newest. Which propositions count as unit-like or empty-like depends on the recognition flags passed in, and the entry points pass the most permissive ones.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.simplif","base":"simplif","kind":"ltac","start":4,"body":null,"status":"ok","short":{"text":"Decomposes hypotheses and goal by the invertible rules of intuitionistic propositional logic, until none applies","status":"ok"},"long":{"text":"This is the deterministic part of the search. It repeats the steps below, each followed by [[AffineConstructive.tactics.tauto.not_dep_intros]], until none applies. It splits a conjunction hypothesis into its two parts, and an [[AffineConstructive.interfaces.sprop.iff]] hypothesis into its two implications. It restates a negated hypothesis ¬P as P → [[AffineConstructive.interfaces.sprop.False]]. It splits a disjunction hypothesis into two goals, one for each case. When the context has both A → B and A, it replaces the implication by B (modus ponens). It reduces a hypothesis whose premise is unit-like to its conclusion. It curries a hypothesis (A ∧ B) → C into A → B → C. It turns (A ↔ B) → C into (A → B) → (B → A) → C, and splits (A ∨ B) → C into A → C and B → C. On the goal side, it splits a conjunction or an equivalence into two goals and restates a negation as an implication.\n\nEvery step preserves provability, so the search never has to backtrack over this part. The flattening of a hypothesis whose premise is a conjunction or a disjunction is written out by hand rather than delegated to the core library's built-in routine. That routine marks the binders it creates as ranging over ordinary propositions, which is wrong when the premise is a strict proposition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.tauto_intuit","base":"tauto_intuit","kind":"ltac","start":5,"body":null,"status":"ok","short":{"text":"The proof search shared by tauto and intuition, with a solver for the goals it leaves","status":"ok"},"long":{"text":"The search first runs [[AffineConstructive.tactics.tauto.simplif]] and tries [[AffineConstructive.tactics.tauto.axioms]]. If that does not close the goal, it tries the non-invertible rules, backtracking on failure. For a hypothesis (A → B) → C, it first proves A → B and then continues with C. To prove A → B it replaces the hypothesis by B → C, which is the contraction-free form of the left rule for a nested implication and is what makes the search terminate. A hypothesis ¬A → C is treated in the same way. A disjunctive goal is tried first with the left disjunct, then with the right. When none of these rules applies, the search introduces the premise of an implication goal and continues. Failing that, it applies the given reduction step and hands the goal to the given solver.\n\nThe recognition flags fix which types count as conjunctions, disjunctions, unit-like and empty-like propositions. The solver decides the difference between the two front ends: [[AffineConstructive.tactics.tauto.tauto]] passes one that always fails, so it either proves the goal or fails, and [[AffineConstructive.tactics.tauto.intuition]] passes one that may close what logic alone cannot.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.intuition_gen","base":"intuition_gen","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"Runs the shared search with given recognition flags and solver, after unfolding negation and equivalence","status":"ok"},"long":{"text":"This instantiates [[AffineConstructive.tactics.tauto.tauto_intuit]] with the reduction step that unfolds negation and equivalence before the solver is called. The recognition flags and the solver are left as parameters. Both [[AffineConstructive.tactics.tauto.tauto]] and [[AffineConstructive.tactics.tauto.intuition]] are built on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.tauto_intuitionistic","base":"tauto_intuitionistic","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"Proves the goal by intuitionistic propositional reasoning alone, or fails with “tauto failed”","status":"ok"},"long":{"text":"This runs [[AffineConstructive.tactics.tauto.intuition_gen]] with a solver that always fails, so every branch of the search must be closed by logic alone. On failure it reports “tauto failed”. The core library tries a classical variant here when classical logic is loaded. That variant is removed, because the base logic is intuitionistic.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.tauto_gen","base":"tauto_gen","kind":"ltac","start":8,"body":null,"status":"ok","short":{"text":"The tauto search with given recognition flags; here the intuitionistic search only","status":"ok"},"long":{"text":"In the core library this entry point chooses between the intuitionistic and the classical search. Here it is [[AffineConstructive.tactics.tauto.tauto_intuitionistic]] alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.tauto","base":"tauto","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"Proves a goal that is an intuitionistic propositional tautology in the base logic, or fails","status":"ok"},"long":{"text":"This is the public decision procedure for intuitionistic propositional logic over strict propositions. It treats the goal and its hypotheses as propositional formulas built from and, or, implication, [[AffineConstructive.interfaces.sprop.not]], [[AffineConstructive.interfaces.sprop.iff]], truth and [[AffineConstructive.interfaces.sprop.False]], with all other subterms as atoms. It then decides whether the goal follows, and proves it if so. It runs with the most permissive recognition flags, so a connective defined as a record or inductive type of the right shape counts as a conjunction or a disjunction. This includes the base-logic connectives of this development, which are records and inductives on `SProp`.\n\nA proof uses it for base-logic side conditions that are pure propositional bookkeeping, where writing out the introductions and case analyses would add nothing. It does not act on affine propositions, which are handled by rewriting with the affine laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.intuition_then","base":"intuition_then","kind":"ltac","start":10,"body":null,"status":"ok","short":{"text":"Runs the shared search with the most permissive recognition flags and a given solver","status":"ok"},"long":{"text":"This wraps [[AffineConstructive.tactics.tauto.intuition_gen]] with the most permissive recognition flags. The solver argument is applied to every goal the propositional search cannot close. It backs the two forms of [[AffineConstructive.tactics.tauto.intuition]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.tauto.intuition","base":"intuition","kind":"tacn","start":11,"body":null,"also":[12],"status":"ok","short":{"text":"Decomposes the goal by intuitionistic propositional reasoning and calls a solver, by default trivial, on the leaves","status":"ok"},"long":{"text":"This runs the same search as [[AffineConstructive.tactics.tauto.tauto]]. The difference is in the goals that propositional reasoning cannot close: instead of failing, it hands them to a solver. In the bare form `intuition` the solver is `trivial`. In the form `intuition t` the solver is the tactic t. Goals the solver does not close remain open.\n\nA proof uses it when a base-logic goal is propositional in shape but its atoms need a fact or a computation beyond pure logic. The decomposition exposes those atoms, and the solver deals with them.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.notation":{"page":"../interfaces/notation.html","short":"Reserved notation, binders, pairs, and classes for chosen terms and objects","summary":"This file fixes the notation of the whole development: it reserves the symbols for the affine connectives (⊸, ⧟, ⊠, ⊞), the base-logic connectives, equality, apartness and order, the algebraic operations, inclusion, meet and join, and composition, each at its precedence level, so that later files can give them meanings. It defines the binders ∀ and λ, the base-logic arrow → as a non-dependent ∀, the product of types ∗ with tuple notation and the projections π₁ and π₂, and printing notations that show destructured pairs as patterns. It introduces the class [[The]] of a term chosen by instance resolution, which later files use for canonical maps such as those out of the empty set and into the one-point set, and the classes [[BoldZero]], [[BoldOne]], [[Product]] and [[Tensor]] behind the notations 𝟎, 𝟏, × and ⊗ in cat_scope, with the empty type, the unit type and the product of types as their instances on Type."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."}},"constants":null}</script>

neConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** Extend typeclass resolution to consider all possible _coercions_ of hypotheses in the current context.\n  The standard resolution behavior does consider hypotheses, but not coercions from them.\n  This effectively allows coercions to be used to declare \"forward mode\" typeclass hints.\n*)\n\nRequire Import prelude.\n\nLocal Ltac debug_msg tac := idtac.\n(* Local Ltac debug_msg tac := match goal with |- ?G => tac G end. *)\n\nInductive Dummy : SProp := dummy : Dummy.\n\n(** Linear iteration over hypotheses. From a Jonathan Leivent post to coq-club:\n   https://coq-club.inria.narkive.com/Gog56von/a-trick-for-iterating-over-hypotheses *)\nLtac revert_clearbody_all := repeat lazymatch goal with H:_ |- _ => try clearbody H; revert H end.\nLtac hyp_stack := constr:(ltac:(revert_clearbody_all; intros; exact dummy) : Dummy).\n\nLtac assert_fails' tac :=\n  tryif (once tac) then gfail 0 tac \"succeeds\" else idtac.\nTactic Notation \"assert_fails\" tactic3(tac) :=\n  assert_fails' tac.\n\n(** Filter the \"stack\" of hypotheses, keeping only those for which (tac H) would succeed.\n   Pass the new \"stack\" to the continuation cont. *)\nLtac filtered_hyp_stack tac cont :=\n  let rec step stack out :=\n    lazymatch stack with (?stack' ?H) =>\n        first [\n          assert_fails (let t := type of H in has_evar t);\n          assert_succeeds tac H;\n          let out' := constr:((fun _ => out) H) in\n          step stack' out' || fail 1\n        | let _ := debug_msg ltac:(fun G => idtac \"skipping\" H) in \n          step stack' out ]\n      | _ => cont out\n    end\n  in let stack := hyp_stack in step stack dummy.\n\n(** Try [ tac H ] for every hypothesis H, with back-tracking.\n   Done in two stages; the set of hypotheses is filtered down to those that would\n   succeed, limiting the back-tracking. *)\nTactic Notation \"try_all_hyps\" tactic(tac) :=\n  let _ := debug_msg ltac:(fun G => idtac \"try_all_hyps on\" G) in\n  let use H := let _ := debug_msg ltac:(fun G => idtac \"using\" H \"on\" G) in tac H\n  in let rec step stack :=\n    multimatch stack with\n    | ((fun _ => ?stack') ?H) => use H\n    | ((fun _ => ?stack') ?H) =>\n       let _ := debug_msg ltac:(fun _ => idtac \"using\" H \"failed\") in step stack'\n    end\n  in filtered_hyp_stack tac step.\n\n\n(** Extend typeclass resolution to try [ exact H ] with every hypothesis, but\n   only for (S)Props, since it does not matter (in principle) which instance is chosen.\n*)\n\nLtac use_assumption := try_all_hyps (fun H => simple notypeclasses refine H; fail).\nLtac check_is_prop := lazymatch goal with |- ?G => lazymatch type of G with Prop => idtac | SProp => idtac end end.\n\n(** Solving a goal containing evars from a hypothesis risks instantiating them\n   incorrectly: unification may see through definitional walls (e.g. carrier-identity\n   constructions) and pick a hypothesis that determines the evars wrongly.  So on\n   goals with evars, demote this greedy fallback below all pattern-keyed hints:\n   the correct structured instance wins if one is registered, while coercion-fills\n   with no competing hint still resolve as before, just later. *)\nLtac check_no_evars := lazymatch goal with |- ?G => assert_fails (has_evar G) end.\nLtac check_has_evar := lazymatch goal with |- ?G => has_evar G end.\n\nGlobal Hint Extern 1  => check_is_prop; check_no_evars; use_assumption : typeclass_instances.\nGlobal Hint Extern 99 => check_is_prop; check_has_evar; use_assumption : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":314,"kind":"vernac","status":"ok","ms":16,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8"],"goals":null},{"i":1,"s":316,"e":350,"kind":"vernac","status":"ok","ms":11,"messages":["fdbcc6d5d14d7bf6"],"goals":null},{"i":2,"s":351,"e":463,"kind":"vernac","status":"ok","ms":10,"messages":["6a35d0c327414dfd","517a9c446ff17b23"],"goals":null},{"i":3,"s":465,"e":731,"kind":"vernac","status":"ok","ms":10,"messages":["b8be9f40dd76717c"],"goals":null},{"i":4,"s":732,"e":816,"kind":"vernac","status":"ok","ms":10,"messages":["7b65fb893a27df29"],"goals":null},{"i":5,"s":818,"e":902,"kind":"vernac","status":"ok","ms":10,"messages":["b4c18f99db7a6fdc"],"goals":null},{"i":6,"s":903,"e":970,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":7,"s":972,"e":1590,"kind":"vernac","status":"ok","ms":11,"messages":["823c51aea680d436"],"goals":null},{"i":8,"s":1592,"e":2221,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":9,"s":2224,"e":2477,"kind":"vernac","status":"ok","ms":10,"messages":["4a17be8d2876d86d"],"goals":null},{"i":10,"s":2478,"e":2593,"kind":"vernac","status":"ok","ms":10,"messages":["b3556403b53caec6"],"goals":null},{"i":11,"s":2595,"e":3153,"kind":"vernac","status":"ok","ms":10,"messages":["df1dd9c345a4596c"],"goals":null},{"i":12,"s":3154,"e":3221,"kind":"vernac","status":"ok","ms":10,"messages":["4878925af08148c0"],"goals":null},{"i":13,"s":3223,"e":3316,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":14,"s":3317,"e":3410,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null}],"pp":{"239b2ba114fa4dd8":"[Loading ML file rocq-runtime.plugins.firstorder ... done]","2976e9b8e29b8170":"[Loading ML file rocq-runtime.plugins.ltac ... done]","4878925af08148c0":"check_has_evar is defined","4a17be8d2876d86d":"use_assumption is defined","517a9c446ff17b23":"Dummy_sind is defined","6a35d0c327414dfd":"Dummy is defined","6d9d43051f185782":"[Loading ML file rocq-runtime.plugins.number_string_notation ... done]","7b65fb893a27df29":"hyp_stack is defined","823c51aea680d436":"filtered_hyp_stack is defined","af331431bd614838":"[Loading ML file rocq-runtime.plugins.firstorder_core (implicit dependency) ... done]","b3556403b53caec6":"check_is_prop is defined","b4c18f99db7a6fdc":"assert_fails' is defined","b8be9f40dd76717c":"revert_clearbody_all is defined","df1dd9c345a4596c":"check_no_evars is defined","fdbcc6d5d14d7bf6":"debug_msg is defined"},"defs":[{"s":432,"e":437,"kind":"ind","name":"Dummy"},{"s":449,"e":454,"kind":"constr","name":"dummy"},{"s":432,"e":437,"kind":"scheme","name":"Dummy_sind"},{"kind":"ltac","name":"debug_msg","s":327,"e":336},{"kind":"ltac","name":"revert_clearbody_all","s":638,"e":658},{"kind":"ltac","name":"hyp_stack","s":737,"e":746},{"kind":"ltac","name":"assert_fails'","s":823,"e":836},{"kind":"tacn","name":"assert_fails","s":919,"e":933},{"kind":"ltac","name":"filtered_hyp_stack","s":1120,"e":1138},{"kind":"tacn","name":"try_all_hyps","s":1795,"e":1809},{"kind":"ltac","name":"use_assumption","s":2399,"e":2413},{"kind":"ltac","name":"check_is_prop","s":2483,"e":2496},{"kind":"ltac","name":"check_no_evars","s":3076,"e":3090},{"kind":"ltac","name":"check_has_evar","s":3159,"e":3173}],"refs":[{"s":306,"e":313,"lib":"AffineConstructive.interfaces.prelude","name":"","kind":"lib","local":false,"page":"../interfaces/prelude.html"},{"s":457,"e":462,"lib":"AffineConstructive.tactics.try_all_hyps","name":"Dummy:1","kind":"ind","local":true},{"s":809,"e":814,"lib":"AffineConstructive.tactics.try_all_hyps","name":"Dummy","kind":"ind","local":true},{"s":800,"e":805,"lib":"AffineConstructive.tactics.try_all_hyps","name":"dummy","kind":"constr","local":true},{"s":764,"e":784,"lib":"AffineConstructive.tactics.try_all_hyps","name":"revert_clearbody_all","kind":"ltac","local":true},{"s":952,"e":965,"lib":"AffineConstructive.tactics.try_all_hyps","name":"assert_fails'","kind":"ltac","local":true}],"gloss":{"summary":"This file provides [[AffineConstructive.tactics.try_all_hyps.try_all_hyps]], which tries a tactic on each hypothesis in turn and backtracks across them. It uses a trick from Jonathan Leivent: [[AffineConstructive.tactics.try_all_hyps.revert_clearbody_all]] reverts the whole context, and closing the goal with [[AffineConstructive.tactics.try_all_hyps.dummy]] then yields a term of type [[AffineConstructive.tactics.try_all_hyps.Dummy]] that records the hypotheses as a stack. [[AffineConstructive.tactics.try_all_hyps.filtered_hyp_stack]] first narrows the stack to the hypotheses on which the tactic succeeds, which keeps the backtracking short. On top of this, [[AffineConstructive.tactics.try_all_hyps.use_assumption]] closes a goal with any hypothesis, possibly through a coercion. Two global typeclass hints add it to resolution for propositional goals, at priority 1 when the goal has no existential variables and at priority 99 when it has some. With these hints, coercions from hypotheses act as forward-mode instance declarations throughout the development.","short":"Trying a tactic on every hypothesis, and typeclass resolution through coerced hypotheses","items":[{"name":"AffineConstructive.tactics.try_all_hyps.debug_msg","base":"debug_msg","kind":"ltac","start":1,"body":null,"status":"ok","short":{"text":"A tracing hook for the hypothesis iteration; as compiled it does nothing","status":"ok"},"long":{"text":"A local tracing hook. It takes a tactic expecting the current goal and, in the version compiled, ignores it and succeeds without effect. A commented-out alternative applies the tactic to the goal, so that the iteration in this file can print which hypotheses it skips, which it tries and on which goal. It exists only for debugging the resolution hints; no proof calls it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.Dummy","base":"Dummy","kind":"ind","start":2,"body":null,"status":"ok","short":{"text":"A one-constructor proposition in SProp, the base on which the hypothesis stack is built","status":"ok"},"long":{"text":"Dummy is the trivially true proposition of the base logic, with the single proof dummy. It has no mathematical role. It serves the tactic machinery of this file: to iterate over the hypotheses of a goal, the tactics revert every hypothesis and prove the resulting goal by dummy. Re-introducing the hypotheses and closing with dummy produces a term in which the hypotheses appear in order as nested applications. That term is the \"stack\" that try_all_hyps walks through, one hypothesis at a time.\n\nThe type lives in SProp, so the term built this way is proof-irrelevant and costs nothing to construct. Its only purpose is to record the hypotheses in a form that Ltac can pattern-match on.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.try_all_hyps.Dummy_sind","base":"Dummy_sind","kind":"scheme","short":{"text":"The induction principle of Dummy, eliminating into SProp","status":"ok"}},{"name":"AffineConstructive.tactics.try_all_hyps.dummy","base":"dummy","kind":"constr","short":{"text":"The unique proof of Dummy, the empty hypothesis stack","status":"ok"}}]},{"name":"AffineConstructive.tactics.try_all_hyps.revert_clearbody_all","base":"revert_clearbody_all","kind":"ltac","start":3,"body":null,"status":"ok","short":{"text":"Reverts every hypothesis of the context, first forgetting the body of any local definition","status":"ok"},"long":{"text":"Moves every hypothesis of the context into the goal, starting from the most recent, so that the goal becomes a statement quantified over the whole former context. A hypothesis introduced by a local definition first has its body cleared, so it is reverted as a plain variable and not as a let-binding.\n\nIt serves only to build the stack of hypotheses used by [[AffineConstructive.tactics.try_all_hyps.filtered_hyp_stack]] and [[AffineConstructive.tactics.try_all_hyps.try_all_hyps]]: reverting everything, reintroducing it and closing the goal with [[AffineConstructive.tactics.try_all_hyps.dummy]] produces a term of type [[AffineConstructive.tactics.try_all_hyps.Dummy]] that is the closed proof applied to each hypothesis in turn. That term records the hypotheses in context order, so a tactic can walk through them one at a time by matching on its applications. This is the trick due to Jonathan Leivent for iterating over hypotheses linearly.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.hyp_stack","base":"hyp_stack","kind":"ltac","start":4,"body":null,"status":"ok","short":{"text":"Packs every hypothesis of the context, in order, into a single term of type Dummy","status":"ok"},"long":{"text":"Builds a term of the proof-irrelevant type [[AffineConstructive.tactics.try_all_hyps.Dummy]] that records the hypotheses of the context as a stack. It reverts every hypothesis (first forgetting the body of any local definition, so that it reverts as an ordinary assumption), introduces them all again and closes the goal with [[AffineConstructive.tactics.try_all_hyps.dummy]]. The term produced is the resulting function applied to the hypotheses in order, so its outermost argument is the most recent hypothesis and matching the term as an application peels the hypotheses off one at a time, newest first.\n\nThe point, after a trick of Jonathan Leivent, is linear iteration: walking this term visits each hypothesis exactly once, whereas matching the context directly re-enters the match on backtracking and can revisit hypotheses repeatedly. The goal is left unchanged; the term is only data for the iteration behind `try_all_hyps`.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.assert_fails'","base":"assert_fails'","kind":"ltac","start":5,"body":null,"status":"ok","short":{"text":"Succeeds, leaving the goal unchanged, exactly when the given tactic fails","status":"ok"},"long":{"text":"Runs the given tactic once. If it fails, the result is success with no effect on the goal; if it succeeds, the result is a failure (at level 0, reporting that the tactic succeeds), which discards whatever the tactic did. It is a test, never a step of a proof: the goal is unchanged either way. In this file it checks that a hypothesis or a goal contains no existential variables. It is the body of the notation [[AffineConstructive.tactics.try_all_hyps.assert_fails]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.assert_fails","base":"assert_fails","kind":"tacn","start":6,"body":null,"status":"ok","short":{"text":"Notation for assert_fails': succeed without effect exactly when the given tactic fails","status":"ok"},"long":{"text":"Tactic notation for [[AffineConstructive.tactics.try_all_hyps.assert_fails']], taking its argument at the level of a sequence of tactics so that a compound tactic can be passed without parentheses. It succeeds, leaving the goal untouched, exactly when that tactic fails, and fails when it succeeds. Used as a guard in the hypothesis filter and in the evar test that decides which of the two resolution hints in this file applies.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.filtered_hyp_stack","base":"filtered_hyp_stack","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"Collects the hypotheses H for which a given tactic applied to H succeeds, and passes them to a continuation","status":"ok"},"long":{"text":"Takes a tactic `tac`, which expects a hypothesis, and a continuation `cont`. It builds the stack of all hypotheses, a term of type [[AffineConstructive.tactics.try_all_hyps.Dummy]] that applies a closed proof to each hypothesis in turn (see [[AffineConstructive.tactics.try_all_hyps.revert_clearbody_all]]), and walks through it from the most recent hypothesis back. A hypothesis is kept when its type contains no existential variables and `tac` applied to it succeeds; that test only checks for success and leaves the goal unchanged. The hypotheses kept are collected in a new stack of the same shape, ending in [[AffineConstructive.tactics.try_all_hyps.dummy]], and that stack is passed to `cont`.\n\nThis is the first of the two phases of [[AffineConstructive.tactics.try_all_hyps.try_all_hyps]]. Filtering first means the second phase backtracks only over the hypotheses that can work, not over the whole context. Hypotheses whose types contain existential variables are always skipped, because using them could instantiate those variables.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.try_all_hyps","base":"try_all_hyps","kind":"tacn","start":8,"body":null,"status":"ok","short":{"text":"Tries a tactic on each hypothesis in turn, backtracking to the next hypothesis when later tactics fail","status":"ok"},"long":{"text":"`try_all_hyps tac` applies `tac H` for a hypothesis `H` of the context. If `tac H` fails, or a tactic run after it fails, it backtracks and tries the next hypothesis. It fails only when every hypothesis has been tried. The hypotheses are first narrowed by [[AffineConstructive.tactics.try_all_hyps.filtered_hyp_stack]] to those on which `tac` succeeds and whose types contain no existential variables. The surviving stack is then walked from the oldest hypothesis to the newest, with each step offering a hypothesis as one alternative and the rest of the stack as the other.\n\nThis gives a search over the context that the built-in `assumption`, which tries only exact matches, and a plain `match goal`, which offers no controlled way to backtrack into a later hypothesis, do not give. Its main use in the development is [[AffineConstructive.tactics.try_all_hyps.use_assumption]], which lets typeclass resolution use any hypothesis, including through a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.use_assumption","base":"use_assumption","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"Closes the goal with some hypothesis of the context, possibly after a coercion, trying each in turn","status":"ok"},"long":{"text":"Uses [[AffineConstructive.tactics.try_all_hyps.try_all_hyps]] to fill the goal exactly with a hypothesis `H`. The refinement allows a coercion to be inserted between `H` and the goal and does not start typeclass resolution on any remaining holes. The refinement must leave no subgoals, so a hypothesis counts only when it, possibly through a coercion, is a complete proof of the goal.\n\nIts role is the global typeclass hints declared at the end of the file. Ordinary instance resolution looks at hypotheses but not at their coercions. With these hints, a structure obtained by coercion from a hypothesis in context is found automatically, which lets a coercion serve as a forward-mode instance declaration. The hints apply only when the goal is a proposition (in `Prop` or `SProp`), where it does not matter which proof is found.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.check_is_prop","base":"check_is_prop","kind":"ltac","start":10,"body":null,"status":"ok","short":{"text":"Succeeds exactly when the goal is a proposition, in Prop or SProp","status":"ok"},"long":{"text":"Checks the sort of the goal and succeeds, without effect, when it is Prop or SProp; on any other goal it fails. It guards the resolution hints of this file, which fill a goal with whatever hypothesis fits: for a proposition the choice of proof does not matter, while for a goal in a type, a structure or a carrier, picking an arbitrary hypothesis could choose the wrong instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.check_no_evars","base":"check_no_evars","kind":"ltac","start":11,"body":null,"status":"ok","short":{"text":"Succeeds exactly when the goal contains no existential variables","status":"ok"},"long":{"text":"Fails if the goal contains an existential variable and otherwise does nothing; [[AffineConstructive.tactics.try_all_hyps.check_has_evar]] is its complement. Together they split the global typeclass hint that calls [[AffineConstructive.tactics.try_all_hyps.use_assumption]] into two. On propositional goals without existential variables the hint runs at priority 1, ahead of almost every other hint. On goals with existential variables it runs at priority 99, after every hint keyed on the goal's shape.\n\nThe reason is that closing a goal containing existential variables with whatever hypothesis unifies can fix those variables wrongly: unification may see through a definition and pick a hypothesis that determines them incorrectly. Pushing the fallback back lets a registered structural instance win when there is one, while goals that only a coerced hypothesis can fill are still solved, only later in the search.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.check_has_evar","base":"check_has_evar","kind":"ltac","start":12,"body":null,"status":"ok","short":{"text":"Succeeds exactly when the goal contains an existential variable","status":"ok"},"long":{"text":"Succeeds, without effect, when the goal contains an existential variable still to be determined, and fails otherwise; its counterpart for evar-free goals is the negated test used in the other hint. It selects the late hint of this file: filling a goal with evars from an arbitrary hypothesis lets unification determine those evars, possibly wrongly, by seeing through definitions such as carrier-identity constructions, so on such goals the hypothesis search runs only after every pattern-keyed instance has been tried.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.prelude":{"page":"../interfaces/prelude.html","short":"The prelude: global settings, basic types and term-building notations replacing the standard library","summary":"This file stands in for Rocq's standard library. It declares the type and function scopes and loads the Ltac, number-notation and firstorder plugins. It also turns on the global settings the rest of the development relies on: primitive projections, universe polymorphism with cumulative inductives, and keyed unification. It sets up the `core` and `typeclass_instances` hint databases. It then defines the basic types from scratch: the empty type with [[abort]] and [[dep_abort]], [[unit]] (which also serves as a trivially satisfied class), [[bool]], the product [[tprod]], the dependent sum [[tsig]], the disjoint union [[tsum]], and [[ssig]], whose elements are points paired with a proof-irrelevant property. Last come the identity function, currying and uncurrying, and a few notations that build terms by running a tactic."}},"constants":null}</script>

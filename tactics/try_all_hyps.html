ounterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** Extend typeclass resolution to consider all possible _coercions_ of hypotheses in the current context.\n  The standard resolution behavior does consider hypotheses, but not coercions from them.\n  This effectively allows coercions to be used to declare \"forward mode\" typeclass hints.\n\n  The hypothesis loop is written in Ltac2. It reads the context directly\n  ([Control.hyps]) instead of reverting and reintroducing it, tries each\n  hypothesis once, and is a single step for the Ltac1 debugger. Only the\n  elaboration of a hypothesis against the goal goes through Ltac1\n  ([simple notypeclasses refine h]), because that is where Rocq inserts\n  coercions: Ltac2 cannot pretype a hypothesis chosen at run time against an\n  expected type with coercions (an antiquoted constr is taken as already typed).\n  On a projection-headed goal ([apos P]) only class-typed hypotheses take that\n  path; the others are tried by unification alone, which is much cheaper\n  (see [hyp_closes_goal]).\n*)\n\nRequire Import prelude.\nFrom Ltac2 Require Import Ltac2.\nSet Default Proof Mode \"Classic\".\n\nInductive Dummy : SProp := dummy : Dummy.\n\nLtac assert_fails' tac :=\n  tryif (once tac) then gfail 0 tac \"succeeds\" else idtac.\nTactic Notation \"assert_fails\" tactic3(tac) :=\n  assert_fails' tac.\n\n(** Set to [true] ([Ltac2 Set use_assumption_verbose := true.]) to print the\n    hypothesis that closes a goal, as a complement to [Typeclasses Debug]. *)\nLtac2 mutable use_assumption_verbose := false.\n\nLtac2 fail_msg (s : string) : unit :=\n  Control.zero (Tactic_failure (Some (Message.of_string s))).\n\n(** The goal lives in [Prop] or [SProp], so it does not matter (in principle)\n    which instance is chosen. *)\nLtac2 goal_is_prop_or_sprop () : bool :=\n  let s := Constr.type (Control.goal ()) in\n  Bool.or (Constr.equal s 'SProp) (Constr.equal s 'Prop).\n\nLtac2 goal_has_evar () : bool := Constr.has_evar (Control.goal ()).\n\n(** Try [tac h] on every hypothesis [h], most recent first, with backtracking\n    (like [multimatch]).  Hypotheses whose type contains evars are skipped. *)\nLtac2 try_all_hyps_tac (tac : ident -> unit) : unit :=\n  let rec go hs :=\n    match hs with\n    | [] => fail_msg \"try_all_hyps: no hypothesis works\"\n    | h :: rest =>\n      let (id, _, ty) := h in\n      if Constr.has_evar ty then go rest\n      else Control.plus (fun () => tac id) (fun _ => go rest)\n    end\n  in go (List.rev (Control.hyps ())).\n\n(** [simple notypeclasses refine h; fail] succeeds exactly when [h], possibly\n    through coercions, closes the goal outright. *)\nLtac2 refine_hyp_closes_goal (h : ident) : unit :=\n  let tac := ltac1:(h |- simple notypeclasses refine h; fail) in\n  tac (Ltac1.of_ident h);\n  if use_assumption_verbose\n  then Message.print (Message.concat (Message.of_string \"use_assumption: \") (Message.of_ident h))\n  else ().\n\n(** Whether [c] is headed by a primitive projection, as [apos P] is. *)\nLtac2 rec proj_headed (c : constr) : bool :=\n  match Constr.Unsafe.kind c with\n  | Constr.Unsafe.App f _ => proj_headed f\n  | Constr.Unsafe.Proj _ _ _ => true\n  | _ => false\n  end.\n\nLtac2 is_sprop_or_prop (ty : constr) : bool :=\n  let s := Constr.type ty in\n  Bool.or (Constr.equal s 'SProp) (Constr.equal s 'Prop).\n\n(** [h] closes the goal by unification alone, without coercions. *)\nLtac2 unify_hyp_closes_goal (h : ident) : unit :=\n  let c := Control.hyp h in\n  Unification.unify_with_full_ts (Constr.type c) (Control.goal ());\n  Control.refine (fun () => c);\n  if use_assumption_verbose\n  then Message.print (Message.concat (Message.of_string \"use_assumption: \") (Message.of_ident h))\n  else ().\n\n(** On a projection-headed goal ([apos P]), only a hypothesis whose type is an\n    (S)Prop class can reach the goal through a coercion (a [:>] field of\n    [apos] type); it keeps the elaboration path.  Every other hypothesis (an\n    [apos] fact, or a Type-sorted structure or element) can close the goal\n    only up to conversion, so it is tried by unification alone.  This matters\n    because [refine]'s coercion fallback recomputes the goal's head class by\n    fully reducing the goal on every failing hypothesis; on membership atoms\n    built by [set:(…)] that costs milliseconds per hypothesis, while a failing\n    unification is free. *)\nLtac2 hyp_closes_goal (h : ident) : unit :=\n  if proj_headed (Control.goal ()) then\n    let ty := Constr.type (Control.hyp h) in\n    if Bool.and (is_sprop_or_prop ty) (Bool.neg (proj_headed ty))\n    then refine_hyp_closes_goal h\n    else unify_hyp_closes_goal h\n  else refine_hyp_closes_goal h.\n\nLtac2 use_assumption_tac () : unit := try_all_hyps_tac hyp_closes_goal.\n\n(** Hint bodies, one atomic step each for the Ltac1 debugger.\n\n   Solving a goal containing evars from a hypothesis risks instantiating them\n   incorrectly: unification may see through definitional walls (e.g. carrier-identity\n   constructions) and pick a hypothesis that determines the evars wrongly.  So on\n   goals with evars, demote this greedy fallback below all pattern-keyed hints:\n   the correct structured instance wins if one is registered, while coercion-fills\n   with no competing hint still resolve as before, just later. *)\nLtac2 use_assumption_no_evars_tac () : unit :=\n  if goal_is_prop_or_sprop () then\n    if goal_has_evar () then fail_msg \"use_assumption: goal has evars\"\n    else use_assumption_tac ()\n  else fail_msg \"use_assumption: goal is not a (S)Prop\".\n\nLtac2 use_assumption_has_evar_tac () : unit :=\n  if goal_is_prop_or_sprop () then\n    if goal_has_evar () then use_assumption_tac ()\n    else fail_msg \"use_assumption: goal has no evars\"\n  else fail_msg \"use_assumption: goal is not a (S)Prop\".\n\n(** Ltac1 entry points.\n\n   An [ltac2:(…)] quotation without bound variables is evaluated eagerly when\n   the Ltac1 tactic containing it is passed as an argument (e.g. to\n   [assert_fails]); the leading [idtac;] makes the body a sequence, which is\n   evaluated only when run. A quotation with bound variables is an Ltac1\n   function of those variables and must be applied, hence [let f := … in f tac]. *)\nTactic Notation \"try_all_hyps\" tactic(tac) :=\n  let f := ltac2:(t |- try_all_hyps_tac (fun h => Ltac1.apply t [Ltac1.of_ident h] Ltac1.run)) in f tac.\n\nLtac use_assumption := idtac; ltac2:(use_assumption_tac ()).\nLtac check_is_prop := idtac; ltac2:(if goal_is_prop_or_sprop () then () else fail_msg \"goal is not a (S)Prop\").\nLtac check_no_evars := idtac; ltac2:(if goal_has_evar () then fail_msg \"goal has evars\" else ()).\nLtac check_has_evar := idtac; ltac2:(if goal_has_evar () then () else fail_msg \"goal has no evars\").\n\nLtac use_assumption_no_evars := idtac; ltac2:(use_assumption_no_evars_tac ()).\nLtac use_assumption_has_evar := idtac; ltac2:(use_assumption_has_evar_tac ()).\n\nGlobal Hint Extern 1  => use_assumption_no_evars : typeclass_instances.\nGlobal Hint Extern 99 => use_assumption_has_evar : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":1009,"kind":"vernac","status":"ok","ms":15,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8"],"goals":null},{"i":1,"s":1010,"e":1042,"kind":"vernac","status":"ok","ms":20,"messages":["dce8be94fc52eab6","7f70dd02016b7ca9","63548cfadb7f5b35"],"goals":null},{"i":2,"s":1043,"e":1076,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":3,"s":1078,"e":1119,"kind":"vernac","status":"ok","ms":10,"messages":["6a35d0c327414dfd","517a9c446ff17b23"],"goals":null},{"i":4,"s":1121,"e":1205,"kind":"vernac","status":"ok","ms":11,"messages":["b4c18 op","s":3078,"e":3094},{"kind":"ltac","name":"unify_hyp_closes_goal","s":3281,"e":3302},{"kind":"ltac","name":"hyp_closes_goal","s":4240,"e":4255},{"kind":"ltac","name":"use_assumption_tac","s":4536,"e":4554},{"kind":"ltac","name":"use_assumption_no_evars_tac","s":5147,"e":5174},{"kind":"ltac","name":"use_assumption_has_evar_tac","s":5389,"e":5416},{"kind":"tacn","name":"try_all_hyps","s":6049,"e":6063},{"kind":"ltac","name":"use_assumption","s":6190,"e":6204},{"kind":"ltac","name":"check_is_prop","s":6251,"e":6264},{"kind":"ltac","name":"check_no_evars","s":6363,"e":6377},{"kind":"ltac","name":"check_has_evar","s":6461,"e":6475},{"kind":"ltac","name":"use_assumption_no_evars","s":6563,"e":6586},{"kind":"ltac","name":"use_assumption_has_evar","s":6642,"e":6665}],"refs":[{"s":1001,"e":1008,"lib":"AffineConstructive.interfaces.prelude","name":"","kind":"lib","local":false,"page":"../interfaces/prelude.html"},{"s":1036,"e":1041,"lib":"Ltac2.Ltac2","name":"","kind":"lib","local":false},{"s":1113,"e":1118,"lib":"AffineConstructive.tactics.try_all_hyps","name":"Dummy:1","kind":"ind","local":true},{"s":1255,"e":1268,"lib":"AffineConstructive.tactics.try_all_hyps","name":"assert_fails'","kind":"ltac","local":true},{"s":4568,"e":4584,"lib":"AffineConstructive.tactics.try_all_hyps","name":"try_all_hyps_tac","kind":"ltac","local":true},{"s":4585,"e":4600,"lib":"AffineConstructive.tactics.try_all_hyps","name":"hyp_closes_goal","kind":"ltac","local":true},{"s":5435,"e":5456,"lib":"AffineConstructive.tactics.try_all_hyps","name":"goal_is_prop_or_sprop","kind":"ltac","local":true},{"s":5472,"e":5485,"lib":"AffineConstructive.tactics.try_all_hyps","name":"goal_has_evar","kind":"ltac","local":true},{"s":5494,"e":5512,"lib":"AffineConstructive.tactics.try_all_hyps","name":"use_assumption_tac","kind":"ltac","local":true},{"s":5525,"e":5533,"lib":"AffineConstructive.tactics.try_all_hyps","name":"fail_msg","kind":"ltac","local":true},{"s":5577,"e":5585,"lib":"AffineConstructive.tactics.try_all_hyps","name":"fail_msg","kind":"ltac","local":true},{"s":6222,"e":6240,"lib":"AffineConstructive.tactics.try_all_hyps","name":"use_assumption_tac","kind":"ltac","local":true},{"s":6285,"e":6306,"lib":"AffineConstructive.tactics.try_all_hyps","name":"goal_is_prop_or_sprop","kind":"ltac","local":true},{"s":6323,"e":6331,"lib":"AffineConstructive.tactics.try_all_hyps","name":"fail_msg","kind":"ltac","local":true},{"s":6398,"e":6411,"lib":"AffineConstructive.tactics.try_all_hyps","name":"goal_has_evar","kind":"ltac","local":true},{"s":6420,"e":6428,"lib":"AffineConstructive.tactics.try_all_hyps","name":"fail_msg","kind":"ltac","local":true},{"s":6496,"e":6509,"lib":"AffineConstructive.tactics.try_all_hyps","name":"goal_has_evar","kind":"ltac","local":true},{"s":6526,"e":6534,"lib":"AffineConstructive.tactics.try_all_hyps","name":"fail_msg","kind":"ltac","local":true},{"s":6604,"e":6631,"lib":"AffineConstructive.tactics.try_all_hyps","name":"use_assumption_no_evars_tac","kind":"ltac","local":true},{"s":6683,"e":6710,"lib":"AffineConstructive.tactics.try_all_hyps","name":"use_assumption_has_evar_tac","kind":"ltac","local":true}],"gloss":{"summary":"The file lets typeclass resolution close a propositional goal with any hypothesis in the context, including through the coercions out of that hypothesis. Ordinary resolution looks at hypotheses but not at their coercions. With this file, a coercion out of a class acts as a forward hint: once a hypothesis `Fact X` is in context, every structure it coerces to becomes available. The search is done by [[AffineConstructive.tactics.try_all_hyps.try_all_hyps_tac]], which tries a tactic on each hypothesis in turn, most recent first, with backtracking. [[AffineConstructive.tactics.try_all_hyps.hyp_closes_goal]] then closes the goal from one hypothesis, by elaboration with coercions where a coercion could matter and by unification alone where it could not. Two global hints install this in resolution. At priority 1 it applies to proposition goals without evars. At priority 99, below every pattern-keyed hint, it applies to proposition goals with evars, so that a greedy match cannot instantiate them wrongly. The file also defines the trivial proposition [[AffineConstructive.tactics.try_all_hyps.Dummy]], which [[AffineConstructive.tactics.strip_coercions.StripCoercions]] uses as a placeholder goal.","short":"Typeclass resolution through the coercions of hypotheses in context","items":[{"name":"AffineConstructive.tactics.try_all_hyps.Dummy","base":"Dummy","kind":"ind","start":3,"body":null,"status":"ok","short":{"text":"A trivially true proposition with a single proof, used as a placeholder goal","status":"ok"},"long":{"text":"A proposition in `SProp` with one proof, [[AffineConstructive.tactics.try_all_hyps.dummy]]. It says nothing. Its use is as a goal whose proof costs nothing, so that a proof search can be run for what it computes along the way rather than for the proof itself.\n\n[[AffineConstructive.tactics.strip_coercions.StripCoercions]] builds on it: a dummy goal about a term, whose proof search returns the term with its coercions stripped.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.tactics.try_all_hyps.Dummy_sind","base":"Dummy_sind","kind":"scheme","short":{"text":"The induction principle of Dummy","status":"ok"}},{"name":"AffineConstructive.tactics.try_all_hyps.dummy","base":"dummy","kind":"constr","short":{"text":"The proof of Dummy","status":"ok"}}]},{"name":"AffineConstructive.tactics.try_all_hyps.assert_fails'","base":"assert_fails'","kind":"ltac","start":4,"body":null,"status":"ok","short":{"text":"Succeeds, leaving the goal unchanged, exactly when the given tactic fails","status":"ok"},"long":{"text":"Runs the given tactic once. If it fails, the result is success with no effect on the goal; if it succeeds, the result is a failure (at level 0, reporting that the tactic succeeds), which discards whatever the tactic did. It is a test, never a step of a proof: the goal is unchanged either way. In this file it checks that a hypothesis or a goal contains no existential variables. It is the body of the notation [[AffineConstructive.tactics.try_all_hyps.assert_fails]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.assert_fails","base":"assert_fails","kind":"tacn","start":5,"body":null,"status":"ok","short":{"text":"Notation for assert_fails': succeed without effect exactly when the given tactic fails","status":"ok"},"long":{"text":"Tactic notation for [[AffineConstructive.tactics.try_all_hyps.assert_fails']], taking its argument at the level of a sequence of tactics so that a compound tactic can be passed without parentheses. It succeeds, leaving the goal untouched, exactly when that tactic fails, and fails when it succeeds. Used as a guard in the hypothesis filter and in the evar test that decides which of the two resolution hints in this file applies.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.mutable","base":"mutable","kind":"ltac","start":6,"body":null,"status":"ok","short":{"text":"A flag (use_assumption_verbose) that prints which hypothesis closes each goal when set","status":"ok"},"long":{"text":"A mutable boolean, `use_assumption_verbose`, false by default. When it is set to true, every hypothesis-closing step of this file prints the name of the hypothesis that closed the goal. This complements the trace of `Typeclasses Debug`, which shows that the hint fired but not which hypothesis it used.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.fail_msg","base":"fail_msg","kind":"ltac","start":7,"body":null,"status":"ok","short":{"text":"Fails with a given message, as a failure that backtracking can recover from","status":"ok"},"long":{"text":"Raises a tactic failure carrying the given message. The failure can be backtracked, so an enclosing search, either the hypothesis loop or typeclass resolution, goes on to its next alternative instead of stopping.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.goal_is_prop_or_sprop","base":"goal_is_prop_or_sprop","kind":"ltac","start":8,"body":null,"status":"ok","short":{"text":"Tests whether the goal is a proposition, in `Prop` or `SProp`","status":"ok"},"long":{"text":"Returns true when the type of the goal is the sort `SProp` or `Prop`. The hints of this file apply only to such goals. There, one proof is as good as another, strictly so in `SProp`, and so taking the first hypothesis that fits cannot pick a wrong instance. On a goal in `Type`, the instance chosen is data, so the hints leave it alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.goal_has_evar","base":"goal_has_evar","kind":"ltac","start":9,"body":null,"status":"ok","short":{"text":"Tests whether the goal contains unresolved existential variables","status":"ok"},"long":{"text":"Returns true when the goal contains an existential variable, that is, a part of the goal still to be determined by unification. The hints use it to choose between their two priorities.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.try_all_hyps_tac","base":"try_all_hyps_tac","kind":"ltac","start":10,"body":null,"status":"ok","short":{"text":"Runs a tactic on each hypothesis in turn, most recent first, with backtracking","status":"ok"},"long":{"text":"Given a tactic that takes a hypothesis name, tries it on each hypothesis of the context, starting from the most recent. The search backtracks: if the tactic fails on a hypothesis, or if something later in the proof fails after it succeeded, the next hypothesis is tried, as with a `multimatch` over the context. Hypotheses whose type contains existential variables are skipped. If no hypothesis works, the search fails with a message.\n\nThe context is read directly, without reverting and reintroducing hypotheses. Each hypothesis is tried once, and the Ltac1 debugger sees the whole loop as a single step. Every search over hypotheses in this file goes through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.refine_hyp_closes_goal","base":"refine_hyp_closes_goal","kind":"ltac","start":11,"body":null,"status":"ok","short":{"text":"Closes the goal with a hypothesis, inserting coercions, or fails","status":"ok"},"long":{"text":"Elaborates the hypothesis against the goal, without typeclass resolution, so that Rocq may insert coercions to make its type match. The step succeeds only when this closes the goal outright and leaves no subgoals. When the verbose flag is set, it prints the hypothesis used.\n\nThis is the costly path, and the only one that reaches the goal through coercions. [[AffineConstructive.tactics.try_all_hyps.hyp_closes_goal]] uses it only for hypotheses where a coercion could matter.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.rec","base":"rec","kind":"ltac","start":12,"body":null,"status":"ok","short":{"text":"Tests whether a term is headed by a primitive projection (proj_headed), as `apos P` is","status":"ok"},"long":{"text":"The recursive test `proj_headed`. It looks past applications to the head of a term and returns true when that head is a primitive projection. Goals stating that an affine proposition is proved, `apos P`, have this shape. [[AffineConstructive.tactics.try_all_hyps.hyp_closes_goal]] uses the test to decide how to try each hypothesis on such a goal.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.is_sprop_or_prop","base":"is_sprop_or_prop","kind":"ltac","start":13,"body":null,"status":"ok","short":{"text":"Tests whether a type is a proposition, in `Prop` or `SProp`","status":"ok"},"long":{"text":"Returns true when the sort of the given type is `SProp` or `Prop`. [[AffineConstructive.tactics.try_all_hyps.hyp_closes_goal]] applies it to a hypothesis's type to recognise hypotheses that state a propositional class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.unify_hyp_closes_goal","base":"unify_hyp_closes_goal","kind":"ltac","start":14,"body":null,"status":"ok","short":{"text":"Closes the goal with a hypothesis whose type unifies with it, without coercions","status":"ok"},"long":{"text":"Unifies the hypothesis's type with the goal, with all definitions unfoldable, and closes the goal with the hypothesis. No coercion is inserted. A failing unification costs almost nothing, which makes this the cheap way to try a hypothesis that can match the goal only up to conversion. When the verbose flag is set, it prints the hypothesis used.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.hyp_closes_goal","base":"hyp_closes_goal","kind":"ltac","start":15,"body":null,"status":"ok","short":{"text":"Closes the goal from one hypothesis, by coercion where one could apply, else by unification","status":"ok"},"long":{"text":"Tries to close the goal with a given hypothesis, choosing how by the shape of the goal. On a goal of the form `apos P`, headed by a projection, a coercion can lead to it only from a hypothesis that states a propositional class, through a class field of that type. Such a hypothesis goes through [[AffineConstructive.tactics.try_all_hyps.refine_hyp_closes_goal]]. Every other hypothesis (an `apos` fact, a structure in `Type`, an element) can close the goal only up to conversion, so it is tried by [[AffineConstructive.tactics.try_all_hyps.unify_hyp_closes_goal]]. On any other goal, every hypothesis goes through elaboration.\n\nThe split is for speed. On each failed attempt, elaboration recomputes the goal's head class by reducing the goal fully. On membership statements about sets built by the `set:(…)` constructions, that costs milliseconds per hypothesis, while a failed unification is free.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.use_assumption_tac","base":"use_assumption_tac","kind":"ltac","start":16,"body":null,"status":"ok","short":{"text":"Closes the goal with the first hypothesis that fits, possibly through coercions","status":"ok"},"long":{"text":"Runs [[AffineConstructive.tactics.try_all_hyps.hyp_closes_goal]] on every hypothesis through [[AffineConstructive.tactics.try_all_hyps.try_all_hyps_tac]]. The result closes the goal with a hypothesis, or with a coercion of one, and backtracks over the candidates. It is the common body of the two resolution hints.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.use_assumption_no_evars_tac","base":"use_assumption_no_evars_tac","kind":"ltac","start":17,"body":null,"status":"ok","short":{"text":"Closes a proposition goal without evars from a hypothesis; fails on any other goal","status":"ok"},"long":{"text":"Runs [[AffineConstructive.tactics.try_all_hyps.use_assumption_tac]] when the goal is a proposition and contains no existential variables, and fails with a message otherwise. It is the body of the priority-1 hint. That hint tries hypotheses and their coercions early, before the ordinary instances, on goals where nothing is left to instantiate.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.use_assumption_has_evar_tac","base":"use_assumption_has_evar_tac","kind":"ltac","start":18,"body":null,"status":"ok","short":{"text":"Closes a proposition goal with evars from a hypothesis; fails on any other goal","status":"ok"},"long":{"text":"Runs [[AffineConstructive.tactics.try_all_hyps.use_assumption_tac]] when the goal is a proposition that contains existential variables, and fails with a message otherwise. It is the body of the priority-99 hint. On such goals, unification may see through definitional walls, such as constructions that are the identity on carriers, and accept a hypothesis that fixes the evars wrongly. The low priority lets a pattern-keyed hint, when one is registered, supply the right instance first. A goal that only a coercion can fill still resolves, only later.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.try_all_hyps","base":"try_all_hyps","kind":"tacn","start":19,"body":null,"status":"ok","short":{"text":"Tries a tactic on each hypothesis in turn, with backtracking","status":"ok"},"long":{"text":"The Ltac1 form of [[AffineConstructive.tactics.try_all_hyps.try_all_hyps_tac]]. `try_all_hyps tac` applies `tac` to each hypothesis in turn, most recent first. It moves on to the next hypothesis when `tac` fails, or when the rest of the proof fails after it. Hypotheses whose type contains existential variables are skipped.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.use_assumption","base":"use_assumption","kind":"ltac","start":20,"body":null,"status":"ok","short":{"text":"Closes the goal with a hypothesis or a coercion of one","status":"ok"},"long":{"text":"The Ltac1 entry point to [[AffineConstructive.tactics.try_all_hyps.use_assumption_tac]]. It closes the goal with the first hypothesis that fits, inserting coercions where they could apply, and backtracks over the candidates. Unlike `assumption`, it reaches the goal through coercions out of a hypothesis, not only by conversion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.check_is_prop","base":"check_is_prop","kind":"ltac","start":21,"body":null,"status":"ok","short":{"text":"Succeeds when the goal is a proposition, fails otherwise","status":"ok"},"long":{"text":"A guard. It leaves the goal unchanged if the goal is in `Prop` or `SProp`, and fails otherwise.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.check_no_evars","base":"check_no_evars","kind":"ltac","start":22,"body":null,"status":"ok","short":{"text":"Succeeds when the goal has no existential variables, fails otherwise","status":"ok"},"long":{"text":"A guard. It leaves the goal unchanged if the goal contains no existential variables, and fails otherwise.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.check_has_evar","base":"check_has_evar","kind":"ltac","start":23,"body":null,"status":"ok","short":{"text":"Succeeds when the goal has an existential variable, fails otherwise","status":"ok"},"long":{"text":"A guard. It leaves the goal unchanged if the goal contains an existential variable, and fails otherwise.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.use_assumption_no_evars","base":"use_assumption_no_evars","kind":"ltac","start":24,"body":null,"status":"ok","short":{"text":"Closes a proposition goal without evars from a hypothesis or its coercions","status":"ok"},"long":{"text":"The Ltac1 entry point to [[AffineConstructive.tactics.try_all_hyps.use_assumption_no_evars_tac]], installed as a global typeclass hint at priority 1. With it, resolution closes a propositional goal with no existential variables from any hypothesis or any coercion of one, before trying the ordinary instances.","status":"ok"},"proof":[]},{"name":"AffineConstructive.tactics.try_all_hyps.use_assumption_has_evar","base":"use_assumption_has_evar","kind":"ltac","start":25,"body":null,"status":"ok","short":{"text":"Closes a proposition goal with evars from a hypothesis, as a last resort","status":"ok"},"long":{"text":"The Ltac1 entry point to [[AffineConstructive.tactics.try_all_hyps.use_assumption_has_evar_tac]], installed as a global typeclass hint at priority 99. On a propositional goal with existential variables, resolution tries hypotheses and their coercions only after every pattern-keyed hint has been tried.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.prelude":{"page":"../interfaces/prelude.html","short":"The prelude: global settings, basic types and term-building notations replacing the standard library","summary":"This file stands in for Rocq's standard library. It declares the type and function scopes and loads the Ltac, number-notation and firstorder plugins. It also turns on the global settings the rest of the development relies on: primitive projections, universe polymorphism with cumulative inductives, and keyed unification. It sets up the `core` and `typeclass_instances` hint databases. It then defines the basic types from scratch: the empty type with [[abort]] and [[dep_abort]], [[unit]] (which also serves as a trivially satisfied class), [[bool]], the product [[tprod]], the dependent sum [[tsig]], the disjoint union [[tsum]], and [[ssig]], whose elements are points paired with a proof-irrelevant property. Last come the identity function, currying and uncurrying, and a few notations that build terms by running a tactic."},"Ltac2.Ltac2":{"page":null,"short":null,"summary":null}},"constants":null}</script>

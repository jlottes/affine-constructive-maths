":"abbrev","local":true},{"s":16853,"e":16860,"lib":"AffineConstructive.theory.additive_groups","name":"add_ops","kind":"abbrev","local":true},{"s":16839,"e":16840,"lib":"AffineConstructive.theory.additive_groups","name":"quote.f","kind":"var","local":true},{"s":16905,"e":16910,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":16962,"e":16976,"lib":"AffineConstructive.theory.additive_groups","name":"quote_plus_alt","kind":"thm","local":true},{"s":17016,"e":17021,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":17073,"e":17087,"lib":"AffineConstructive.theory.additive_groups","name":"quote_plus_alt","kind":"thm","local":true},{"s":17128,"e":17133,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":17182,"e":17198,"lib":"AffineConstructive.theory.additive_groups","name":"quote_negate_alt","kind":"thm","local":true},{"s":17236,"e":17241,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":17290,"e":17306,"lib":"AffineConstructive.theory.additive_groups","name":"quote_negate_alt","kind":"thm","local":true},{"s":2304,"e":2307,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6124,"e":6138,"lib":"AffineConstructive.theory.additive_groups","name":"simplify_chain","kind":"ltac","local":true},{"s":6416,"e":6430,"lib":"AffineConstructive.theory.additive_groups","name":"simplify_chain","kind":"ltac","local":true},{"s":9421,"e":9435,"lib":"AffineConstructive.theory.additive_groups","name":"simplify_chain","kind":"ltac","local":true},{"s":9757,"e":9760,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11025,"e":11028,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":14969,"e":14972,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file restates the generic group theory of theory/groups.v in the additive notation that rings use. To do so it views a set with +, 0 and − as a group through [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]]. It gives constructors for the additive semigroup, monoid and group structures, commutative or not, and the coercions among them. It also restates the basic laws under additive names: associativity, commutativity, the identity and inverse laws, the involution and distributivity of negation, [[AffineConstructive.theory.additive_groups.negate_0]], [[AffineConstructive.theory.additive_groups.equal_by_zero_sum]] and [[AffineConstructive.theory.additive_groups.flip_negate]]. For additive semigroup and monoid morphisms it gives preservation of addition, negation and subtraction, together with identities, composites and inverses. [[AffineConstructive.theory.additive_groups.Build_AdditiveGroup_Morphism]] shows that a map between groups that preserves addition is a monoid morphism. The file closes with simplification rules that cancel zeros and inverses, transport of structure along injections, and the quotation rules for + and −.","short":"Groups, monoids and their morphisms in additive notation","items":[{"name":"AffineConstructive.theory.additive_groups.add_ops","base":"add_ops","kind":"abbrev","start":5,"body":null,"status":"ok","short":{"text":"Local shorthand for AdditiveGroupOps: a set viewed as a group in the generic notation","status":"ok"},"long":{"text":"An abbreviation for [[AffineConstructive.interfaces.algebra_notation.AdditiveGroupOps]], which reads + as the generic operation ∙, 0 as the unit and − as the inverse. Throughout the file a generic result from `theory/groups.v` is moved to additive notation by stating it at `add_ops R`.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.Build_AdditiveNonComSemiGroup","base":"Build_AdditiveNonComSemiGroup","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"Builds an additive semigroup, not necessarily commutative, from associativity of +","status":"ok"},"long":{"text":"An additive semigroup that need not be commutative is nothing more than an associative addition, so the associativity law itself serves as the structure. This constructor makes that explicit for use where an [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComSemiGroup]] is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.alt_Build_AdditiveSemiGroup","base":"alt_Build_AdditiveSemiGroup","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"Builds a commutative additive semigroup from associativity and commutativity of +","status":"ok"},"long":{"text":"The additive instance of [[AffineConstructive.theory.groups.alt_Build_CommutativeSemiGroup]]. It assembles an [[AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup]] from the two laws of the addition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.alt_Build_AdditiveNonComMonoid","base":"alt_Build_AdditiveNonComMonoid","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"Builds an additive monoid, not necessarily commutative, from associativity and both identity laws of 0","status":"ok"},"long":{"text":"The additive instance of [[AffineConstructive.theory.groups.alt_Build_Monoid]]. Without commutativity both identity laws, 0 + x = x and x + 0 = x, have to be supplied.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.alt_Build_AdditiveMonoid","base":"alt_Build_AdditiveMonoid","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"Builds a commutative additive monoid from associativity, commutativity and the left identity law","status":"ok"},"long":{"text":"The additive instance of [[AffineConstructive.theory.groups.alt_Build_CommutativeMonoid]]. Commutativity gives the right identity law from the left one, so only 0 + x = x is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.alt_Build_AdditiveNonComGroup","base":"alt_Build_AdditiveNonComGroup","kind":"def","start":16,"body":null,"status":"ok","short":{"text":"Builds an additive group, not necessarily commutative, from associativity and both identity and inverse laws","status":"ok"},"long":{"text":"The additive instance of [[AffineConstructive.theory.groups.alt_Build_Group]]. With no commutativity available, both identity laws and both inverse laws, −x + x = 0 and x − x = 0, are supplied.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.alt_Build_AdditiveGroup","base":"alt_Build_AdditiveGroup","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"Builds an abelian additive group from associativity, commutativity, a left identity and a left inverse law","status":"ok"},"long":{"text":"The additive instance of [[AffineConstructive.theory.groups.alt_Build_AbGroup]]. Commutativity supplies the right-hand laws from the left-hand ones, so four laws are enough to obtain an [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.zero_inhabited","base":"zero_inhabited","kind":"def","start":18,"body":[19,21],"status":"ok","short":{"text":"A set with a zero is inhabited, by 0","status":"ok"},"proof":[{"text":"The element 0 is a witness, so M is inhabited. The proof is transparent: the inhabitant is 0 itself.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.add_nc_mon_inhabited","base":"add_nc_mon_inhabited","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"An additive monoid is inhabited","status":"ok"},"long":{"text":"A coercion that lets an additive monoid hypothesis supply [[AffineConstructive.interfaces.sprop.Inhabited]]. The witness is the zero element, found through [[AffineConstructive.theory.additive_groups.zero_inhabited]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.additive_sg_nc_sg","base":"additive_sg_nc_sg","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"A commutative additive semigroup is an additive semigroup","status":"ok"},"long":{"text":"The coercion that forgets commutativity, [[AffineConstructive.interfaces.abstract_algebra.comsg_sg]] at the additive operations. Lemmas stated for the noncommutative structure then apply to commutative ones.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.additive_nc_mon_sg","base":"additive_nc_mon_sg","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"An additive monoid, not necessarily commutative, is an additive semigroup","status":"ok"},"long":{"text":"The coercion that forgets the zero, [[AffineConstructive.interfaces.abstract_algebra.monoid_semigroup]] at the additive operations.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.additive_monoid_nc_monoid","base":"additive_monoid_nc_monoid","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"A commutative additive monoid is an additive monoid without commutativity","status":"ok"},"long":{"text":"The coercion from [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]] to [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid]], which forgets commutativity. It is one edge of the hierarchy of additive structures.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.additive_monoid_sg","base":"additive_monoid_sg","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"A commutative additive monoid is a commutative additive semigroup","status":"ok"},"long":{"text":"The coercion from [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]] to [[AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup]], which forgets the zero and keeps commutativity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.additive_nc_group_nc_monoid","base":"additive_nc_group_nc_monoid","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"An additive group, not necessarily commutative, is an additive monoid","status":"ok"},"long":{"text":"The coercion from [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]] to [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid]], which forgets negation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.additive_group_monoid","base":"additive_group_monoid","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"An abelian additive group is a commutative additive monoid","status":"ok"},"long":{"text":"The coercion from [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]] to [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]], which forgets negation and keeps commutativity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.additive_group_nc_group","base":"additive_group_nc_group","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"An abelian additive group is an additive group without commutativity","status":"ok"},"long":{"text":"The coercion from [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]] to [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]], which forgets commutativity. Together with the other coercions it makes each additive structure available from any stronger one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.plus_ass","base":"plus_ass","kind":"prf","start":30,"body":[31,33],"status":"ok","short":{"text":"Addition in an additive semigroup is associative","status":"ok"},"proof":[{"text":"An additive semigroup is a semigroup in the sense of the generic theory, with + as its operation. Associativity of + is therefore the associativity law of that semigroup.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.plus_0_l","base":"plus_0_l","kind":"prf","start":34,"body":[35,37],"status":"ok","short":{"text":"In an additive monoid, 0 + x = x","status":"ok"},"proof":[{"text":"Read R as a monoid with operation + and unit 0. The left identity law of that monoid is 0 + x = x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.plus_0_r","base":"plus_0_r","kind":"prf","start":38,"body":[39,41],"status":"ok","short":{"text":"In an additive monoid, x + 0 = x","status":"ok"},"proof":[{"text":"Read R as a monoid with operation + and unit 0. The right identity law of that monoid is x + 0 = x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.plus_com","base":"plus_com","kind":"prf","start":42,"body":[43,45],"status":"ok","short":{"text":"Addition in a commutative additive semigroup is commutative","status":"ok"},"proof":[{"text":"A commutative additive semigroup is a commutative semigroup under +, and the commutativity of + is that semigroup's commutativity law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.plus_negate_l","base":"plus_negate_l","kind":"prf","start":47,"body":[48,50],"status":"ok","short":{"text":"In an additive group, −x + x = 0","status":"ok"},"proof":[{"text":"Read R as a group with operation +, unit 0 and inverse −. The group's left inverse law then reads −x + x = 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.plus_negate_r","base":"plus_negate_r","kind":"prf","start":51,"body":[52,54],"status":"ok","short":{"text":"In an additive group, x − x = 0","status":"ok"},"proof":[{"text":"Read R as a group with operation +, unit 0 and inverse −. The group's right inverse law then reads x − x = 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.negate_involutive","base":"negate_involutive","kind":"prf","start":55,"body":[56,58],"status":"ok","short":{"text":"In an additive group negation is an involution: −−x = x","status":"ok"},"proof":[{"text":"Read R as a group under + with inverse −. Every group is a star monoid ([[AffineConstructive.theory.groups.group_star_mon]]), so its inversion is an involution, which here says −−x = x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.negate_plus_distr","base":"negate_plus_distr","kind":"prf","start":59,"body":[60,62],"status":"ok","short":{"text":"In an abelian additive group, −(x + y) = −x − y","status":"ok"},"proof":[{"text":"Read R as a group under + with inverse −. It is a star monoid by [[AffineConstructive.theory.groups.group_star_mon]], and a commutative one because + is commutative. In a commutative star semigroup inversion distributes over the operation without reversing the order ([[AffineConstructive.theory.groups.inv_distr_ab]]), so −(x + y) = −x − y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.negate_plus_distr_alt","base":"negate_plus_distr_alt","kind":"prf","start":63,"body":[64,66],"status":"ok","short":{"text":"In an additive group, −(x + y) = −y − x, with the order reversed","status":"ok"},"proof":[{"text":"Read R as a group under + with inverse −. It is a star monoid by [[AffineConstructive.theory.groups.group_star_mon]], and in a star semigroup inversion reverses products ([[AffineConstructive.theory.groups.inv_distr]]). This gives −(x + y) = −y − x without assuming that + is commutative.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.negate_mon_mor","base":"negate_mon_mor","kind":"prf","start":67,"body":[68,70],"status":"ok","short":{"text":"In an abelian additive group, negation is an additive monoid morphism","status":"ok"},"proof":[{"text":"This is the multiplicative fact read additively. A group is a star monoid whose involution is inversion. In a commutative star monoid, inversion is a monoid morphism [[AffineConstructive.theory.groups.inv_com_mon_mor]]. Read additively, negation preserves 0 and sums.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.simplify_chain","base":"simplify_chain","kind":"ltac","start":84,"body":null,"status":"ok","short":{"text":"Splits a simplification goal x ⇝ y into a step x ⇝ tm and the rest tm ⇝ y","status":"ok"},"long":{"text":"Given a term tm, the tactic takes a goal stating that x simplifies to y and reduces it, by transitivity of the simplification relation, to two goals: x simplifies to tm, and tm simplifies to y. To make transitivity apply, the goal is first restated as the simplification relation on the pair (x, y). It is local to the file.\n\nThe file uses it to prove the simplification rules for a single cancellation law: 0 + x, x + 0 and − − x simplify to whatever x simplifies to. Each proof chains through x. The second goal, x simplifies to x', is the hypothesis the rule assumes. The first is closed by building a simplification from the equality the law gives, [[AffineConstructive.theory.additive_groups.plus_0_l]], [[AffineConstructive.theory.additive_groups.plus_0_r]] or [[AffineConstructive.theory.additive_groups.negate_involutive]]. A proof reaches for it when one rewriting step has to be followed by whatever further simplification resolution finds for the result.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_plus_zero_l","base":"simplify_plus_zero_l","kind":"prf","start":85,"body":[86,89],"status":"ok","short":{"text":"Simplification rule: 0 + x simplifies to what x simplifies to","status":"ok"},"proof":[{"text":"Simplification is an equivalence relation, so the chain 0 + x to x to x' can be built step by step. The step from x to x' is the hypothesis. It remains to show that 0 + x = x.","status":"ok","from":0,"to":1},{"text":"This is the left identity law [[AffineConstructive.theory.additive_groups.plus_0_l]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.additive_groups.simplify_plus_zero_r","base":"simplify_plus_zero_r","kind":"prf","start":91,"body":[92,95],"status":"ok","short":{"text":"Simplification rule: x + 0 simplifies to what x simplifies to","status":"ok"},"proof":[{"text":"Simplification is an equivalence relation, so the chain x + 0 to x to x' can be built step by step. The step from x to x' is the hypothesis. It remains to show that x + 0 = x.","status":"ok","from":0,"to":1},{"text":"This is the right identity law [[AffineConstructive.theory.additive_groups.plus_0_r]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.additive_groups.simplify_plus_inv_l_3","base":"simplify_plus_inv_l_3","kind":"def","start":99,"body":null,"status":"ok","short":{"text":"Simplification rule: y − x + x simplifies to what y simplifies to","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.groups.simplify_group_inv_l_3]]. It cancels a negated term against the same term added on its right, so the simplifier removes the pair.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_plus_inv_r_3","base":"simplify_plus_inv_r_3","kind":"def","start":100,"body":null,"status":"ok","short":{"text":"Simplification rule: y + x − x simplifies to what y simplifies to","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.groups.simplify_group_inv_r_3]]. The simplifier cancels a term followed immediately by its negation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_plus_assoc_inv_l_3","base":"simplify_plus_assoc_inv_l_3","kind":"def","start":101,"body":null,"status":"ok","short":{"text":"Simplification rule: −x + (x + y) simplifies to what y simplifies to","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.groups.simplify_group_assoc_inv_l_3]]. It handles the right-associated form, in which the cancelling pair is split across a parenthesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_plus_assoc_inv_r_3","base":"simplify_plus_assoc_inv_r_3","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"Simplification rule: x + (−x + y) simplifies to what y simplifies to","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.groups.simplify_group_assoc_inv_r_3]]. It cancels x against −x across a parenthesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_abplus_inv_l_3","base":"simplify_abplus_inv_l_3","kind":"def","start":103,"body":null,"status":"ok","short":{"text":"Simplification rule in an abelian additive group: −x + y + x simplifies to what y simplifies to","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.groups.simplify_abgroup_inv_l_3]]. Commutativity is needed because the cancelling pair is not adjacent, with y between −x and x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_abplus_inv_r_3","base":"simplify_abplus_inv_r_3","kind":"def","start":104,"body":null,"status":"ok","short":{"text":"Simplification rule in an abelian additive group: x + y − x simplifies to what y simplifies to","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.groups.simplify_abgroup_inv_r_3]]. It cancels x against −x with y between them, which requires commutativity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_abplus_assoc_inv_l_3","base":"simplify_abplus_assoc_inv_l_3","kind":"def","start":105,"body":null,"status":"ok","short":{"text":"Simplification rule in an abelian additive group: −x + (y + x) simplifies to what y simplifies to","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.groups.simplify_abgroup_assoc_inv_l_3]]. It is the right-associated variant of the cancellation of non-adjacent x and −x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_abplus_assoc_inv_r_3","base":"simplify_abplus_assoc_inv_r_3","kind":"def","start":106,"body":null,"status":"ok","short":{"text":"Simplification rule in an abelian additive group: x + (y − x) simplifies to what y simplifies to","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.groups.simplify_abgroup_assoc_inv_r_3]]. It cancels x against −x across a parenthesis and over y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.simplify_negate_involutive","base":"simplify_negate_involutive","kind":"prf","start":115,"body":[116,119],"status":"ok","short":{"text":"Simplification rule: −−x simplifies to what x simplifies to","status":"ok"},"proof":[{"text":"Simplification is an equivalence relation, so the chain −−x to x to x' can be built step by step. The step from x to x' is the hypothesis. It remains to show that −−x = x.","status":"ok","from":0,"to":1},{"text":"This is the involution law for negation [[AffineConstructive.theory.additive_groups.negate_involutive]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.additive_groups.alt_Build_AdditiveCancellation","base":"alt_Build_AdditiveCancellation","kind":"prf","start":121,"body":[122,125],"status":"ok","short":{"text":"In a commutative additive semigroup, injectivity of every left translation z + ⋅ gives additive cancellation","status":"ok"},"proof":[{"text":"Assume that every left translation z + ⋅ is injective. Additive cancellation asks for injectivity on both sides. The left side is the assumption, so only right translations remain.","status":"ok","from":0,"to":1},{"text":"Addition is commutative, so each right translation ⋅ + z coincides with the left translation z + ⋅. It is therefore injective [[AffineConstructive.theory.common_props.right_cancel_from_left]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.additive_groups.add_group_cancel","base":"add_group_cancel","kind":"prf","start":126,"body":[127,133],"status":"ok","short":{"text":"Addition in an additive group cancels on both sides","status":"ok"},"proof":[{"text":"Cancellation splits into two parts. Every left translation and every right translation must be injective.","status":"ok","from":0,"to":1},{"text":"Left translation is injective in any group. Read additively, adding z on the left is injective [[AffineConstructive.theory.groups.group_left_op_inj]].","status":"ok","from":2,"to":3},{"text":"In the same way, right translation is injective in any group, so adding z on the right is injective [[AffineConstructive.theory.groups.group_right_op_inj]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.additive_groups.coercion:add_group_cancel","base":"coercion:add_group_cancel","kind":"coercion","start":134,"body":null,"status":"ok","short":{"text":"An additive group supplies two-sided cancellation of addition, through [[AffineConstructive.theory.additive_groups.add_group_cancel]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.negate_0","base":"negate_0","kind":"def","start":135,"body":[136,138],"status":"ok","short":{"text":"In an additive group, −0 = 0","status":"ok"},"proof":[{"text":"A group is a star monoid. In a star monoid, the inverse of the unit is the unit [[AffineConstructive.theory.groups.inv_unit]]. Read additively, this says −0 = 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.negate_swap_r","base":"negate_swap_r","kind":"def","start":139,"body":[140,142],"status":"ok","short":{"text":"In an additive group, x − y = −(y − x)","status":"ok"},"proof":[{"text":"This is the star-semigroup law x ∙ y⁻¹ = (y ∙ x⁻¹)⁻¹ [[AffineConstructive.theory.groups.inv_swap_r]], read additively. It applies because a group is a star monoid.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.negate_swap_l","base":"negate_swap_l","kind":"def","start":143,"body":[144,146],"status":"ok","short":{"text":"In an abelian additive group, −x + y = −(x − y)","status":"ok"},"proof":[{"text":"This is the law x⁻¹ ∙ y = (x ∙ y⁻¹)⁻¹ [[AffineConstructive.theory.groups.inv_swap_l_ab]], read additively. That law holds in a commutative star semigroup, and it applies because the group is abelian.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.equal_by_zero_sum","base":"equal_by_zero_sum","kind":"def","start":147,"body":[148,150],"status":"ok","short":{"text":"In an additive group, x − y = 0 if and only if x = y","status":"ok"},"proof":[{"text":"In a group, x ∙ y⁻¹ = e if and only if x = y [[AffineConstructive.theory.groups.equal_by_inverse]]. Read additively, this is the statement. Since the equivalence is affine, it also carries the dual form: x − y is apart from 0 if and only if x is apart from y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.flip_negate","base":"flip_negate","kind":"def","start":151,"body":[152,154],"status":"ok","short":{"text":"In an additive group, −x = y if and only if x = −y","status":"ok"},"proof":[{"text":"This is the multiplicative law [[AffineConstructive.theory.groups.flip_inv]], read in the additive notation: an additive group is a group under +, 0 and −, and so a star monoid with negation as its involution.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.flip_negate_0","base":"flip_negate_0","kind":"def","start":155,"body":[156,158],"status":"ok","short":{"text":"In an additive group, −x = 0 if and only if x = 0","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.theory.groups.flip_inv_unit]], the law x⁻¹ = e ⧟ x = e of a star monoid, read in the additive notation. The additive group is a star monoid under +, 0 and −. The second point in the statement plays no part.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.plus_2_2","base":"plus_2_2","kind":"prf","start":160,"body":[161,164],"status":"ok","short":{"text":"In an additive semigroup with a one, 2 + 2 = 4","status":"ok"},"proof":[{"text":"Reverse the equation to prove 4 = 2 + 2. Once the numerals are unfolded, the two sides are the two bracketings of the same sum of 1s and 2, so a single instance of [[AffineConstructive.interfaces.common_props.associativity]] of + closes the goal.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.theory.additive_groups.add_monmor_sgmor","base":"add_monmor_sgmor","kind":"def","start":165,"body":null,"status":"ok","short":{"text":"An additive monoid morphism is an additive semigroup morphism","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.interfaces.abstract_algebra.monmor_sgmor]]: a map preserving addition and zero preserves addition. Declared as a coercion, so that every lemma about maps preserving addition, [[AffineConstructive.theory.additive_groups.preserves_plus]] first among them, applies to a map known to be an [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.coercion:add_monmor_sgmor","base":"coercion:add_monmor_sgmor","kind":"coercion","start":166,"body":null,"status":"ok","short":{"text":"An additive monoid morphism serves as an additive semigroup morphism, through [[AffineConstructive.theory.additive_groups.add_monmor_sgmor]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.AdditiveSemiGroup_Morphism_fun","base":"AdditiveSemiGroup_Morphism_fun","kind":"def","start":167,"body":null,"status":"ok","short":{"text":"Being an additive semigroup morphism, as a predicate on the functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup_Morphism]] as a predicate on the functions X ⇾ Y. A function f is in it when f (x + y) = f x + f y for all x and y. It is [[AffineConstructive.theory.groups.SemiGroup_Morphism_fun]] read with + as the operation, packaged as a function into propositions by [[AffineConstructive.theory.set.make_fun_alt]]. The declaration is a canonical structure: when unification needs the class as a function on the set of maps, it finds this one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.AdditiveMonoid_Morphism_fun","base":"AdditiveMonoid_Morphism_fun","kind":"def","start":168,"body":null,"status":"ok","short":{"text":"Being an additive monoid morphism, as a predicate on the functions X ⇾ Y","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] on the set of functions X ⇾ Y, packaged as a function into propositions by way of [[AffineConstructive.theory.groups.Monoid_Morphism_fun]] read in the additive notation. Like [[AffineConstructive.theory.additive_groups.AdditiveSemiGroup_Morphism_fun]], it is registered as a canonical structure so that the class behaves as a predicate respecting equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.preserves_plus","base":"preserves_plus","kind":"def","start":169,"body":null,"status":"ok","short":{"text":"An additive semigroup morphism f satisfies f (x + y) = f x + f y","status":"ok"},"long":{"text":"The defining law of an [[AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup_Morphism]], in additive notation: [[AffineConstructive.interfaces.abstract_algebra.preserves_sg_op]] with + as the operation. The map f is an explicit argument, and the morphism structure is found by resolution. Proofs about the integers use it, both the signed-natural and the binary models, as do the Grothendieck group, the group completion and the action of the integers on a group.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.AdditiveMonoid_Morphism_pointed","base":"AdditiveMonoid_Morphism_pointed","kind":"def","start":171,"body":null,"status":"ok","short":{"text":"An additive monoid morphism preserves zero","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.interfaces.abstract_algebra.monmor_pointed]]: a map preserving addition and zero is a [[AffineConstructive.interfaces.abstract_algebra.Zero_Pointed_Morphism]], f 0 = 0. Declared as a coercion, so that the facts about zero-preserving maps apply to additive monoid morphisms without restatement.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.preserves_negate","base":"preserves_negate","kind":"def","start":172,"body":null,"status":"ok","short":{"text":"A map between additive groups preserving addition satisfies f (−x) = −(f x)","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.interfaces.abstract_algebra.preserves_inv]]. Between groups a map that preserves the operation preserves the inverse as well ([[AffineConstructive.theory.groups.group_mor]]), so the hypothesis is only that f preserves addition. Neither group need be commutative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.preserves_minus","base":"preserves_minus","kind":"def","start":173,"body":null,"status":"ok","short":{"text":"A map between additive groups preserving addition satisfies f (x − y) = f x − f y","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.groups.preserves_op_inv_r]]: since x − y is x + (−y), it combines [[AffineConstructive.theory.additive_groups.preserves_plus]] with [[AffineConstructive.theory.additive_groups.preserves_negate]]. As there, only preservation of addition is assumed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.id_addsg_mor","base":"id_addsg_mor","kind":"def","start":174,"body":null,"status":"ok","short":{"text":"The identity function of an additive semigroup preserves addition","status":"ok"},"long":{"text":"The identity of an additive semigroup is an [[AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup_Morphism]], the additive reading of [[AffineConstructive.theory.groups.id_semigroup_mor]]. A hint makes it the instance found for the identity function.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.id_addmon_mor","base":"id_addmon_mor","kind":"def","start":175,"body":null,"status":"ok","short":{"text":"The identity function of an additive monoid preserves addition and zero","status":"ok"},"long":{"text":"The identity of an additive monoid is an [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]], the additive reading of [[AffineConstructive.theory.groups.id_monoid_mor]]. A hint makes it the instance found for the identity function.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.compose_addsg_mor","base":"compose_addsg_mor","kind":"def","start":178,"body":null,"status":"ok","short":{"text":"The composite of two additive semigroup morphisms is an additive semigroup morphism","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.groups.compose_semigroup_mor]]: if f and g preserve addition, so does g ∘ f. A hint makes it the instance found for a composite.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.compose_addmon_mor","base":"compose_addmon_mor","kind":"def","start":180,"body":null,"status":"ok","short":{"text":"The composite of two additive monoid morphisms is an additive monoid morphism","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.groups.compose_monoid_mor]]: if f and g preserve addition and zero, so does g ∘ f. A hint makes it the instance found for a composite.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.invert_addsg_mor","base":"invert_addsg_mor","kind":"def","start":183,"body":null,"status":"ok","short":{"text":"The inverse of a bijective additive semigroup morphism preserves addition","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.groups.invert_semigroup_mor]]: when f preserves addition and has a designated inverse with respect to which it is [[AffineConstructive.interfaces.set.Bijective]], the inverse f⁻¹ preserves addition too. A hint makes it the instance found for an inverse function.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.invert_addmon_mor","base":"invert_addmon_mor","kind":"def","start":185,"body":null,"status":"ok","short":{"text":"The inverse of a bijective additive monoid morphism preserves addition and zero","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.groups.invert_monoid_mor]]: the designated inverse of a bijective map preserving addition and zero preserves them as well. A hint makes it the instance found for an inverse function.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.alt_Build_AdditiveSemiGroup_Morphism","base":"alt_Build_AdditiveSemiGroup_Morphism","kind":"def","start":187,"body":null,"status":"ok","short":{"text":"Builds an additive semigroup morphism from f (x + y) = f x + f y","status":"ok"},"long":{"text":"A constructor for [[AffineConstructive.interfaces.abstract_algebra.AdditiveSemiGroup_Morphism]] between additive semigroups that asks only for the preservation law, the semigroup structures of source and target being found from context. It is [[AffineConstructive.interfaces.abstract_algebra.Build_SemiGroup_Morphism]] read in the additive notation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.alt_Build_AdditiveMonoid_Morphism","base":"alt_Build_AdditiveMonoid_Morphism","kind":"def","start":188,"body":null,"status":"ok","short":{"text":"Builds an additive monoid morphism from preservation of addition and f 0 = 0","status":"ok"},"long":{"text":"A constructor for [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] between additive monoids from the two laws f (x + y) = f x + f y and f 0 = 0, the monoid structures being found from context. It is [[AffineConstructive.theory.groups.alt_Build_Monoid_Morphism]] read in the additive notation. Between groups the second law is redundant; see [[AffineConstructive.theory.additive_groups.Build_AdditiveGroup_Morphism]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.Build_AdditiveGroup_Morphism","base":"Build_AdditiveGroup_Morphism","kind":"prf","start":189,"body":[190,194],"status":"ok","short":{"text":"Between additive groups, a map preserving addition is an additive monoid morphism","status":"ok"},"proof":[{"text":"Assume that f preserves addition. Reading both additive groups as groups, [[AffineConstructive.theory.groups.group_mor]] says that a semigroup morphism between groups also preserves the unit and inverses. What remains is to show that f is a semigroup morphism.","status":"ok","from":0,"to":2},{"text":"That requires only that f is a map and preserves the operation, and the latter is the hypothesis.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.additive_groups.add_group_mor","base":"add_group_mor","kind":"def","start":195,"body":null,"status":"ok","short":{"text":"Between additive groups, an additive semigroup morphism is an additive monoid morphism","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.groups.group_mor]]: in a group, f 0 + f 0 = f (0 + 0) = f 0 forces f 0 = 0 by cancellation, so preservation of addition alone gives preservation of zero. Unlike [[AffineConstructive.theory.additive_groups.Build_AdditiveGroup_Morphism]], it takes the semigroup morphism as an instance, and a low-priority hint lets resolution use it whenever an [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] between groups is wanted.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.projected_additive_non_com_monoid","base":"projected_additive_non_com_monoid","kind":"def","start":197,"body":null,"status":"ok","short":{"text":"An addition and zero carried by an injection into an additive monoid make X an additive monoid","status":"ok"},"long":{"text":"Transport of structure along an injection: the additive reading of [[AffineConstructive.theory.groups.projected_monoid]]. Take an addition and a zero on X, and an [[AffineConstructive.interfaces.set.Injective]] map f from X into an additive monoid M with f (x + y) = f x + f y and f 0 = 0. Then the monoid laws hold in X: each law's image under f holds in M, and an injective f reflects equality. One proof in theory.rings uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.projected_additive_monoid","base":"projected_additive_monoid","kind":"def","start":198,"body":null,"status":"ok","short":{"text":"Addition and zero carried by an injective map into a commutative additive monoid make X one","status":"ok"},"long":{"text":"The commutative version of [[AffineConstructive.theory.additive_groups.projected_additive_non_com_monoid]], the additive reading of [[AffineConstructive.theory.groups.projected_commutative_monoid]]: commutativity pulls back along the injection together with the monoid laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.projected_additive_non_com_group","base":"projected_additive_non_com_group","kind":"def","start":199,"body":null,"status":"ok","short":{"text":"Addition, zero and negation carried by an injective map into an additive group make X one","status":"ok"},"long":{"text":"Transport of group structure along an injection, the additive reading of [[AffineConstructive.theory.groups.projected_group]]. Besides the preservation of addition and zero it asks that f (−x) = −(f x); the identity and inverse laws of X then follow from those of the target because f is [[AffineConstructive.interfaces.set.Injective]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.projected_additive_group","base":"projected_additive_group","kind":"def","start":200,"body":null,"status":"ok","short":{"text":"Addition, zero and negation carried by an injective map into an abelian additive group make X one","status":"ok"},"long":{"text":"The commutative version of [[AffineConstructive.theory.additive_groups.projected_additive_non_com_group]], the additive reading of [[AffineConstructive.theory.groups.projected_abgroup]]: an injection into an abelian additive group that preserves addition, zero and negation makes X an [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.additive_groups.quote_plus_alt","base":"quote_plus_alt","kind":"prf","start":204,"body":[205,207],"status":"ok","short":{"text":"Under a map preserving addition, quotations of x₁ and x₂ give a quotation of x₁ + x₂","status":"ok"},"proof":[{"text":"Under a semigroup morphism, quotations combine through the operation. This is [[AffineConstructive.theory.groups.quote_sg_op_alt]], applied to f viewed as a semigroup morphism for addition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.additive_groups.quote_negate_alt","base":"quote_negate_alt","kind":"prf","start":208,"body":[209,211],"status":"ok","short":{"text":"Under a map between additive groups preserving addition, a quotation of x gives one of −x","status":"ok"},"proof":[{"text":"Viewed between the groups under addition, f is a semigroup morphism, so by [[AffineConstructive.theory.groups.group_mor]] it is a star-monoid morphism. Under a star-semigroup morphism, [[AffineConstructive.theory.groups.quote_inv_alt]] turns a quotation of x into one of its inverse, which here is −x.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.theory.common_props":{"page":"common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.theory.pointed":{"page":"pointed.html","short":"Identities, composites and inverses of point-preserving maps; quoting distinguished constants","summary":"This file proves that pointed morphisms are closed under the three basic operations on functions. The identity map preserves any point. A composite of pointed morphisms is pointed. The designated inverse of a bijective pointed morphism is pointed. Each result is proved once for [[Pointed_Morphism]] and then restated for the five named constants: the monoid unit, zero, one, top and bottom. Hints register all of them, so instance resolution can discharge preservation goals for identities, composites and inverses. The last part of the file connects these classes to the quoting machinery of [[quote]]. There a pointed morphism f lets the quoting procedure read f applied to a distinguished constant as the corresponding constant of the codomain."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.groups":{"page":"groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.base":{"page":"../tactics/quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

structive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":8190,"e":8193,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":9639,"e":9642,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11230,"e":11233,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":11532,"e":11535,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":13827,"e":13830,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":14509,"e":14512,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":16472,"e":16475,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":17033,"e":17036,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":17740,"e":17743,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":18403,"e":18406,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation.","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","items":[{"name":"AffineConstructive.theory.bundled_groups.semigroup_id","base":"semigroup_id","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"The identity semigroup morphism on a semigroup","status":"ok"},"long":{"text":"The identity function on the carrier of a semigroup X, with its preservation of the operation found by resolution, regarded as an element of the set of semigroup morphisms from X to X. It is declared canonical, so the identity function of a semigroup is recognised as a semigroup morphism wherever one is expected, and it serves as the identity of the category [[AffineConstructive.theory.bundled_groups.𝐒𝐞𝐦𝐢𝐆𝐫𝐩]] and, through reuse, of [[AffineConstructive.theory.bundled_groups.𝐂𝐒𝐞𝐦𝐢𝐆𝐫𝐩]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.make_compose_fun","base":"make_compose_fun","kind":"abbrev","start":10,"body":null,"status":"ok","short":{"text":"Turns a composition operation on morphisms into a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"A local abbreviation that takes a two-argument composition operation c on bundled morphisms and returns it as a function of sets, uncurried, from the tensor product of the hom-sets. Equality of bundled morphisms is the equality of their underlying functions (the hom-sets are projected sets), so preservation of equality comes from [[AffineConstructive.theory.projected_set.projected_is_fun]]: c commutes, by definition, with composition of the underlying functions, and composition of functions already preserves equality.\n\nComposition takes its two arguments from the tensor product, not the cartesian product: composing g₁ with f₁ and g₂ with f₂ gives equal results when g₁ = g₂ ⊠ f₁ = f₂, each equality used once. Every composition in this file is built this way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.semigroup_morphism_compose_op","base":"semigroup_morphism_compose_op","kind":"def","start":11,"body":null,"status":"ok","short":{"text":"The composite g ∘ f of two semigroup morphisms, as a semigroup morphism","status":"ok"},"long":{"text":"The composite of two semigroup morphisms g from Y to Z and f from X to Y: the composite function g ∘ f, a semigroup morphism because each factor preserves the operation, with this found by resolution. It is declared canonical, so a composite of semigroup morphisms is recognised as a semigroup morphism. It is the bare operation underlying [[AffineConstructive.theory.bundled_groups.semigroup_morphism_compose]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.semigroup_morphism_compose","base":"semigroup_morphism_compose","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"Composition of semigroup morphisms, as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"Composition [[AffineConstructive.theory.bundled_groups.semigroup_morphism_compose_op]] packaged by [[AffineConstructive.theory.bundled_groups.make_compose_fun]] as a function from the tensor product of the hom-sets Y ⟶ Z and X ⟶ Y to X ⟶ Z. This is the composition of [[AffineConstructive.theory.bundled_groups.𝐒𝐞𝐦𝐢𝐆𝐫𝐩]], and the commutative-semigroup category reuses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.semigroup_is_cat","base":"semigroup_is_cat","kind":"inst","start":14,"body":[15,17],"status":"ok","short":{"text":"Semigroups with semigroup morphisms, identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"The category laws are the two unit laws and associativity for semigroup morphisms. Each law compares two morphisms whose underlying functions agree pointwise by definition, so each holds by reflexivity of equality in the codomain.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐒𝐞𝐦𝐢𝐆𝐫𝐩","base":"𝐒𝐞𝐦𝐢𝐆𝐫𝐩","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"The category of semigroups and semigroup morphisms","status":"ok"},"long":{"text":"The category whose objects are bundled semigroups and whose hom-sets are the semigroup morphisms, with identity [[AffineConstructive.theory.bundled_groups.semigroup_id]], composition [[AffineConstructive.theory.bundled_groups.semigroup_morphism_compose]] and the laws [[AffineConstructive.theory.bundled_groups.semigroup_is_cat]]. It is declared canonical, so the category of semigroups is found from its data [[AffineConstructive.interfaces.bundled_algebra.semigroup_cat_t]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_semigroup_id","base":"multiplicative_semigroup_id","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"The identity morphism on a multiplicative semigroup","status":"ok"},"long":{"text":"The identity function on a multiplicative semigroup X, as a morphism of multiplicative semigroups from X to X, with preservation of multiplication found by resolution. It is canonical and serves as the identity of [[AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐒𝐞𝐦𝐢𝐆𝐫𝐩]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_semigroup_morphism_compose_op","base":"multiplicative_semigroup_morphism_compose_op","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"The composite g ∘ f of two morphisms of multiplicative semigroups","status":"ok"},"long":{"text":"The composite function g ∘ f of morphisms of multiplicative semigroups g from Y to Z and f from X to Y. It preserves multiplication because each factor does, with this found by resolution. It is declared canonical, and [[AffineConstructive.theory.bundled_groups.multiplicative_semigroup_morphism_compose]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_semigroup_morphism_compose","base":"multiplicative_semigroup_morphism_compose","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"Composition of morphisms of multiplicative semigroups, as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"Composition [[AffineConstructive.theory.bundled_groups.multiplicative_semigroup_morphism_compose_op]], packaged by [[AffineConstructive.theory.bundled_groups.make_compose_fun]] as a function from the tensor product of hom-sets. It is the composition of [[AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐒𝐞𝐦𝐢𝐆𝐫𝐩]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_semigroup_is_cat","base":"multiplicative_semigroup_is_cat","kind":"inst","start":26,"body":[27,29],"status":"ok","short":{"text":"Multiplicative semigroups with their morphisms, identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"Here the unit laws and associativity are about morphisms of multiplicative semigroups. As for plain semigroups, the two sides of each law have underlying functions that agree pointwise by definition, so each law holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐒𝐞𝐦𝐢𝐆𝐫𝐩","base":"𝐌𝐮𝐥𝐒𝐞𝐦𝐢𝐆𝐫𝐩","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"The category of multiplicative semigroups and their morphisms","status":"ok"},"long":{"text":"The category of bundled multiplicative semigroups, with identity [[AffineConstructive.theory.bundled_groups.multiplicative_semigroup_id]], composition [[AffineConstructive.theory.bundled_groups.multiplicative_semigroup_morphism_compose]] and laws [[AffineConstructive.theory.bundled_groups.multiplicative_semigroup_is_cat]]. As a category it is [[AffineConstructive.theory.bundled_groups.𝐒𝐞𝐦𝐢𝐆𝐫𝐩]] with the operation written ·; the canonical structures that follow it in the file convert in both directions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_semigroup_as_semigroup","base":"multiplicative_semigroup_as_semigroup","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"A multiplicative semigroup regarded as a semigroup with operation ·","status":"ok"},"long":{"text":"The same set and multiplication, repackaged as a bundled semigroup whose operation ∙ is the multiplication ·, with the semigroup axioms taken from the multiplicative ones. It is canonical but not a coercion (the coercion is commented out in the source), so the conversion happens by unification when a semigroup is expected, not silently everywhere. With [[AffineConstructive.theory.bundled_groups.semigroup_as_mul_sg]] it shows that multiplicative semigroups and semigroups differ only in notation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_semigroup_morphism_as_sg_mor","base":"multiplicative_semigroup_morphism_as_sg_mor","kind":"def","start":32,"body":[33,37],"status":"ok","short":{"text":"A morphism of multiplicative semigroups is a semigroup morphism between the relabelled semigroups","status":"ok"},"proof":[{"text":"A semigroup morphism is built from an underlying function and a proof that it is a morphism. The function is f itself, since the relabelled semigroups have the same carriers as the multiplicative ones.","status":"ok","from":0,"to":2},{"text":"It remains to show that f preserves the operation. Once the goal is restated as the claim that f is a morphism of multiplicative semigroups, the claim is exactly what f carries, because the relabelling changes only the notation for the operation.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.bundled_groups.semigroup_as_mul_sg","base":"semigroup_as_mul_sg","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"A semigroup regarded as a multiplicative semigroup, with ∙ written as ·","status":"ok"},"long":{"text":"The converse of [[AffineConstructive.theory.bundled_groups.multiplicative_semigroup_as_semigroup]]: the carrier of a semigroup with its operation renamed as a multiplication and the same axioms. It is canonical, so a semigroup can appear wherever a multiplicative semigroup is expected and multiplicative notation applies to it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.semigroup_mor_as_mul_sg_mor","base":"semigroup_mor_as_mul_sg_mor","kind":"def","start":39,"body":[40,44],"status":"ok","short":{"text":"A semigroup morphism is a morphism between the semigroups regarded multiplicatively","status":"ok"},"proof":[{"text":"A morphism of multiplicative semigroups is built from an underlying function and a proof that it is a morphism. The function is f itself, between the same carriers.","status":"ok","from":0,"to":2},{"text":"Since writing the operation as · changes only its notation, the fact that f preserves the semigroup operation is already the required morphism property.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.bundled_groups.commutative_semigroup_is_cat","base":"commutative_semigroup_is_cat","kind":"inst","start":48,"body":[49,51],"status":"ok","short":{"text":"Commutative semigroups with semigroup morphisms satisfy the category laws","status":"ok"},"proof":[{"text":"The identity and composition are those of semigroups, so the unit laws and associativity hold for the same reason as there: in each law the two sides have underlying functions that agree pointwise by definition, and reflexivity proves it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐂𝐒𝐞𝐦𝐢𝐆𝐫𝐩","base":"𝐂𝐒𝐞𝐦𝐢𝐆𝐫𝐩","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"The category of commutative semigroups and semigroup morphisms","status":"ok"},"long":{"text":"The full subcategory of [[AffineConstructive.theory.bundled_groups.𝐒𝐞𝐦𝐢𝐆𝐫𝐩]] on the commutative semigroups. Commutativity places no extra condition on morphisms, so identity and composition are those of semigroups, [[AffineConstructive.theory.bundled_groups.semigroup_id]] and [[AffineConstructive.theory.bundled_groups.semigroup_morphism_compose]], and the laws are [[AffineConstructive.theory.bundled_groups.commutative_semigroup_is_cat]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.monoid_id","base":"monoid_id","kind":"def","start":55,"body":null,"status":"ok","short":{"text":"The identity monoid morphism on a monoid","status":"ok"},"long":{"text":"The identity function on a monoid X as a monoid morphism from X to X, preserving the operation and the unit, with both found by resolution. It is canonical and is the identity of [[AffineConstructive.theory.bundled_groups.𝐌𝐨𝐧]], and also of the commutative-monoid, group and abelian-group categories, which reuse it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.monoid_morphism_compose_op","base":"monoid_morphism_compose_op","kind":"def","start":57,"body":null,"status":"ok","short":{"text":"The composite g ∘ f of two monoid morphisms, as a monoid morphism","status":"ok"},"long":{"text":"The composite function of monoid morphisms g from Y to Z and f from X to Y. It preserves the operation and the unit because each factor does, found by resolution. It is canonical and underlies [[AffineConstructive.theory.bundled_groups.monoid_morphism_compose]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.monoid_morphism_compose","base":"monoid_morphism_compose","kind":"def","start":58,"body":null,"status":"ok","short":{"text":"Composition of monoid morphisms, as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"Composition [[AffineConstructive.theory.bundled_groups.monoid_morphism_compose_op]] packaged by [[AffineConstructive.theory.bundled_groups.make_compose_fun]] as a function on the tensor product of hom-sets. It is the composition of [[AffineConstructive.theory.bundled_groups.𝐌𝐨𝐧]], [[AffineConstructive.theory.bundled_groups.𝐂𝐌𝐨𝐧]], [[AffineConstructive.theory.bundled_groups.𝐆𝐫𝐩]] and [[AffineConstructive.theory.bundled_groups.𝐀𝐛𝐆𝐫𝐩]]: for groups, a monoid morphism automatically preserves inverses, so no separate composition is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.monoid_is_cat","base":"monoid_is_cat","kind":"inst","start":60,"body":[61,63],"status":"ok","short":{"text":"Monoids with monoid morphisms, identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"Each of the unit laws and associativity for monoid morphisms compares two morphisms whose underlying functions agree pointwise by definition. Each law therefore holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐌𝐨𝐧","base":"𝐌𝐨𝐧","kind":"def","start":64,"body":null,"status":"ok","short":{"text":"The category of monoids and monoid morphisms","status":"ok"},"long":{"text":"The category of bundled monoids with identity [[AffineConstructive.theory.bundled_groups.monoid_id]], composition [[AffineConstructive.theory.bundled_groups.monoid_morphism_compose]] and laws [[AffineConstructive.theory.bundled_groups.monoid_is_cat]]. It is the plain-notation member of the three monoid categories; [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧]] and [[AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐌𝐨𝐧]] are relabellings of it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.monoid_as_semigroup","base":"monoid_as_semigroup","kind":"def","start":65,"body":null,"status":"ok","short":{"text":"The underlying semigroup of a monoid","status":"ok"},"long":{"text":"Forgets the unit of a monoid and keeps the carrier with its operation as a semigroup. Unlike the relabellings in the file, this is a genuine forgetful passage and is declared a coercion, so a monoid can be used wherever a semigroup is expected; a hint also lets the coercion-stripping tactic see through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.coercion:monoid_as_semigroup","base":"coercion:monoid_as_semigroup","kind":"coercion","start":66,"body":null,"status":"ok","short":{"text":"A bundled monoid can stand where a semigroup is expected, via [[AffineConstructive.theory.bundled_groups.monoid_as_semigroup]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.monoid_mor_as_sg_mor","base":"monoid_mor_as_sg_mor","kind":"def","start":68,"body":null,"status":"ok","short":{"text":"The underlying semigroup morphism of a monoid morphism","status":"ok"},"long":{"text":"A monoid morphism, with preservation of the unit forgotten, as a morphism of the underlying semigroups. It is a coercion, matching [[AffineConstructive.theory.bundled_groups.monoid_as_semigroup]] on objects, so together they act as the forgetful functor from monoids to semigroups. Semigroup facts, such as the quotation rule for ∙, therefore apply to monoid morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.coercion:monoid_mor_as_sg_mor","base":"coercion:monoid_mor_as_sg_mor","kind":"coercion","start":69,"body":null,"status":"ok","short":{"text":"A bundled monoid morphism can stand where a semigroup morphism is expected, via [[AffineConstructive.theory.bundled_groups.monoid_mor_as_sg_mor]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_non_com_monoid_id","base":"additive_non_com_monoid_id","kind":"def","start":73,"body":null,"status":"ok","short":{"text":"The identity morphism on an additive monoid that need not be commutative","status":"ok"},"long":{"text":"The identity function on an additive monoid X that need not be commutative, as a morphism preserving + and 0. It is canonical and the identity of [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧]], and it is reused for commutative additive monoids and for additive groups.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_compose_op","base":"additive_non_com_monoid_morphism_compose_op","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"The composite g ∘ f of two morphisms of additive monoids that need not be commutative","status":"ok"},"long":{"text":"The composite function of morphisms of additive monoids, preserving + and 0 because each factor does. It is canonical and underlies [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_compose]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_compose","base":"additive_non_com_monoid_morphism_compose","kind":"def","start":76,"body":null,"status":"ok","short":{"text":"Composition of morphisms of additive monoids, as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"Composition [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_compose_op]] packaged by [[AffineConstructive.theory.bundled_groups.make_compose_fun]]. It is the composition of [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧]], and also of [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐌𝐨𝐧]], [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐆𝐫𝐩]] and [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐆𝐫𝐩]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_non_com_monoid_is_cat","base":"additive_non_com_monoid_is_cat","kind":"inst","start":78,"body":[79,81],"status":"ok","short":{"text":"Additive monoids that need not commute, with their morphisms, satisfy the category laws","status":"ok"},"proof":[{"text":"Each of the unit laws and associativity for morphisms of additive monoids compares two morphisms whose underlying functions agree pointwise by definition. Each law therefore holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧","base":"𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧","kind":"def","start":82,"body":null,"status":"ok","short":{"text":"The category of additive monoids, not necessarily commutative, and their morphisms","status":"ok"},"long":{"text":"The category of bundled monoids written additively, with + and 0 and no commutativity assumed, with identity [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_id]], composition [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_compose]] and laws [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_is_cat]]. It is [[AffineConstructive.theory.bundled_groups.𝐌𝐨𝐧]] in additive notation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_monoid_id","base":"multiplicative_monoid_id","kind":"def","start":85,"body":null,"status":"ok","short":{"text":"The identity morphism on a multiplicative monoid","status":"ok"},"long":{"text":"The identity function on a multiplicative monoid, as a morphism preserving · and 1. It is canonical and is the identity of [[AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐌𝐨𝐧]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_monoid_morphism_compose_op","base":"multiplicative_monoid_morphism_compose_op","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"The composite g ∘ f of two morphisms of multiplicative monoids","status":"ok"},"long":{"text":"The composite function of morphisms of multiplicative monoids, preserving · and 1 because each factor does. It is canonical and underlies [[AffineConstructive.theory.bundled_groups.multiplicative_monoid_morphism_compose]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_monoid_morphism_compose","base":"multiplicative_monoid_morphism_compose","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"Composition of morphisms of multiplicative monoids, as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"Composition [[AffineConstructive.theory.bundled_groups.multiplicative_monoid_morphism_compose_op]] packaged by [[AffineConstructive.theory.bundled_groups.make_compose_fun]]. It is the composition of [[AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐌𝐨𝐧]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_monoid_is_cat","base":"multiplicative_monoid_is_cat","kind":"inst","start":90,"body":[91,93],"status":"ok","short":{"text":"Multiplicative monoids with their morphisms, identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"Each of the unit laws and associativity for morphisms of multiplicative monoids compares two morphisms whose underlying functions agree pointwise by definition. Each law therefore holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐌𝐨𝐧","base":"𝐌𝐮𝐥𝐌𝐨𝐧","kind":"def","start":94,"body":null,"status":"ok","short":{"text":"The category of multiplicative monoids and the morphisms preserving · and 1","status":"ok"},"long":{"text":"The category of bundled monoids written multiplicatively, with · and 1. Its morphisms are the functions that preserve multiplication and one. Its identities are [[AffineConstructive.theory.bundled_groups.multiplicative_monoid_id]], its composition is [[AffineConstructive.theory.bundled_groups.multiplicative_monoid_morphism_compose]], and its laws are [[AffineConstructive.theory.bundled_groups.multiplicative_monoid_is_cat]]. The canonical structures of this file identify it with [[AffineConstructive.theory.bundled_groups.𝐌𝐨𝐧]], read in multiplicative notation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_monoid_as_mul_sg","base":"multiplicative_monoid_as_mul_sg","kind":"def","start":95,"body":null,"status":"ok","short":{"text":"The underlying multiplicative semigroup of a multiplicative monoid","status":"ok"},"long":{"text":"Forgets the unit 1 of a multiplicative monoid and keeps its multiplication. Like [[AffineConstructive.theory.bundled_groups.monoid_as_semigroup]] it is a coercion, with a hint for the coercion-stripping tactic, so multiplicative-semigroup facts apply to multiplicative monoids.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.coercion:multiplicative_monoid_as_mul_sg","base":"coercion:multiplicative_monoid_as_mul_sg","kind":"coercion","start":96,"body":null,"status":"ok","short":{"text":"A bundled multiplicative monoid can stand where a multiplicative semigroup is expected, via [[AffineConstructive.theory.bundled_groups.multiplicative_monoid_as_mul_sg]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.mul_monoid_mor_as_mul_sg_mor","base":"mul_monoid_mor_as_mul_sg_mor","kind":"def","start":98,"body":null,"status":"ok","short":{"text":"The underlying morphism of multiplicative semigroups of a morphism of multiplicative monoids","status":"ok"},"long":{"text":"A morphism of multiplicative monoids with preservation of 1 forgotten. It is a coercion, matching [[AffineConstructive.theory.bundled_groups.multiplicative_monoid_as_mul_sg]] on objects, so the quotation rule for · applies to morphisms of multiplicative monoids.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.coercion:mul_monoid_mor_as_mul_sg_mor","base":"coercion:mul_monoid_mor_as_mul_sg_mor","kind":"coercion","start":99,"body":null,"status":"ok","short":{"text":"A bundled multiplicative monoid morphism can stand where a multiplicative semigroup morphism is expected, via [[AffineConstructive.theory.bundled_groups.mul_monoid_mor_as_mul_sg_mor]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_non_com_monoid_as_monoid","base":"additive_non_com_monoid_as_monoid","kind":"def","start":101,"body":null,"status":"ok","short":{"text":"An additive monoid, not necessarily commutative, regarded as a monoid with ∙ = + and unit 0","status":"ok"},"long":{"text":"The carrier of an additive monoid, with + as the monoid operation and 0 as the unit, packaged as a plain monoid, with the axioms taken from the additive ones. It is canonical but not a coercion. With [[AffineConstructive.theory.bundled_groups.monoid_as_additive_non_com_monoid]] it shows that [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧]] and [[AffineConstructive.theory.bundled_groups.𝐌𝐨𝐧]] differ only in notation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_monoid_as_monoid","base":"multiplicative_monoid_as_monoid","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"A multiplicative monoid regarded as a monoid with ∙ = · and unit 1","status":"ok"},"long":{"text":"The carrier of a multiplicative monoid, with · as the operation and 1 as the unit, as a plain monoid. It is canonical; the coercion is left commented out. With [[AffineConstructive.theory.bundled_groups.monoid_as_multiplicative_monoid]] it relates [[AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐌𝐨𝐧]] and [[AffineConstructive.theory.bundled_groups.𝐌𝐨𝐧]] as relabellings.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_as_mon_mor","base":"additive_non_com_monoid_morphism_as_mon_mor","kind":"def","start":103,"body":[104,108],"status":"ok","short":{"text":"A morphism of additive monoids is a monoid morphism between the relabelled monoids","status":"ok"},"proof":[{"text":"A monoid morphism is built from an underlying function and a proof that it is a morphism. The function is f, between the same carriers.","status":"ok","from":0,"to":2},{"text":"It remains to show that f preserves the operation and the unit. Once the goal is restated as the claim that f is a morphism of additive monoids, the claim is what f carries, because + and 0 are the monoid operation and unit under another notation.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.bundled_groups.multiplicative_monoid_morphism_as_mon_mor","base":"multiplicative_monoid_morphism_as_mon_mor","kind":"def","start":109,"body":[110,114],"status":"ok","short":{"text":"A morphism of multiplicative monoids is a monoid morphism between the relabelled monoids","status":"ok"},"proof":[{"text":"A monoid morphism is built from an underlying function and a proof that it is a morphism. The function is f, between the same carriers.","status":"ok","from":0,"to":2},{"text":"It remains to show that f preserves the operation and the unit. Once the goal is restated as the claim that f is a morphism of multiplicative monoids, the claim is what f carries, because · and 1 are the monoid operation and unit under another notation.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.bundled_groups.monoid_as_additive_non_com_monoid","base":"monoid_as_additive_non_com_monoid","kind":"def","start":115,"body":null,"status":"ok","short":{"text":"A monoid read additively: its operation as +, its unit as 0","status":"ok"},"long":{"text":"The monoid M as an additive monoid, not necessarily commutative: the same carrier, with the operation of M as the addition and the unit of M as zero. The monoid axioms of M are the axioms of the additive monoid unchanged, because the additive structure [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComMonoid]] is the monoid structure under another notation.\n\nWith [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_as_monoid]] it is one half of the relabelling between monoids and additive monoids. It is declared canonical, so a statement written with + and 0 can be read on a monoid; it is not a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.monoid_mor_as_add_nc_monoid_mor","base":"monoid_mor_as_add_nc_monoid_mor","kind":"def","start":116,"body":[117,121],"status":"ok","short":{"text":"A monoid morphism is a morphism of the monoids read additively","status":"ok"},"proof":[{"text":"An additive monoid morphism is a function together with the proof that it preserves addition and zero, so both parts have to be supplied.","status":"ok","from":0,"to":1},{"text":"The function is f itself. The proof that it preserves the operations is the one f already carries as a monoid morphism, since reading the monoids additively changes only the notation, not the operations.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.bundled_groups.monoid_as_multiplicative_monoid","base":"monoid_as_multiplicative_monoid","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"A monoid read multiplicatively: its operation as ·, its unit as 1","status":"ok"},"long":{"text":"The monoid M as a multiplicative monoid: the same carrier, with the operation of M as the multiplication and the unit of M as 1. The axioms carry over unchanged, since [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid]] is the monoid structure under the notation · and 1.\n\nWith [[AffineConstructive.theory.bundled_groups.multiplicative_monoid_as_monoid]] it makes multiplicative monoids and monoids relabellings of each other. It is declared canonical, not a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.monoid_mor_as_mul_monoid_mor","base":"monoid_mor_as_mul_monoid_mor","kind":"def","start":123,"body":[124,128],"status":"ok","short":{"text":"A monoid morphism is a morphism of the monoids read multiplicatively","status":"ok"},"proof":[{"text":"A multiplicative monoid morphism is a function together with the proof that it preserves multiplication and the unit, so both parts have to be supplied.","status":"ok","from":0,"to":1},{"text":"The function is f itself. The proof that it preserves the operations is the one f already carries as a monoid morphism, since reading the monoids multiplicatively changes only the notation.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.bundled_groups.commutative_monoid_is_cat","base":"commutative_monoid_is_cat","kind":"inst","start":132,"body":[133,135],"status":"ok","short":{"text":"Commutative monoids with monoid morphisms satisfy the category laws","status":"ok"},"proof":[{"text":"There are three category laws: the left unit law, the right unit law and associativity. Identity and composition are the ones of monoids, which act on the underlying functions, so each law holds by reflexivity, pointwise.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐂𝐌𝐨𝐧","base":"𝐂𝐌𝐨𝐧","kind":"def","start":136,"body":null,"status":"ok","short":{"text":"The category of commutative monoids and monoid morphisms","status":"ok"},"long":{"text":"The category of commutative monoids. Its morphisms are the monoid morphisms between the underlying monoids, so its identities are [[AffineConstructive.theory.bundled_groups.monoid_id]] and its composition is [[AffineConstructive.theory.bundled_groups.monoid_morphism_compose]]: commutativity is a property of the objects and adds nothing to the arrows. The laws are [[AffineConstructive.theory.bundled_groups.commutative_monoid_is_cat]].\n\nIt is the same category as [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐌𝐨𝐧]] under a change of notation, through [[AffineConstructive.theory.bundled_groups.additive_monoid_as_com_monoid]] and [[AffineConstructive.theory.bundled_groups.com_monoid_as_additive_monoid]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_monoid_is_cat","base":"additive_monoid_is_cat","kind":"inst","start":140,"body":[141,143],"status":"ok","short":{"text":"Commutative additive monoids with their morphisms satisfy the category laws","status":"ok"},"proof":[{"text":"There are three category laws: the left unit law, the right unit law and associativity. Identity and composition are the ones of additive monoids that need not commute, which act on the underlying functions, so each law holds by reflexivity, pointwise.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐌𝐨𝐧","base":"𝐀𝐝𝐝𝐌𝐨𝐧","kind":"def","start":144,"body":null,"status":"ok","short":{"text":"The category of commutative additive monoids and maps preserving + and 0","status":"ok"},"long":{"text":"The category of commutative monoids written additively. Its arrows are the morphisms of the underlying additive monoids, so identities and composition are those of [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧]], [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_id]] and [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_compose]]; the laws are [[AffineConstructive.theory.bundled_groups.additive_monoid_is_cat]].\n\nIt is [[AffineConstructive.theory.bundled_groups.𝐂𝐌𝐨𝐧]] under the notation + and 0, the relabelling given by [[AffineConstructive.theory.bundled_groups.additive_monoid_as_com_monoid]] and [[AffineConstructive.theory.bundled_groups.com_monoid_as_additive_monoid]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_monoid_as_com_monoid","base":"additive_monoid_as_com_monoid","kind":"def","start":145,"body":null,"status":"ok","short":{"text":"A commutative additive monoid as a commutative monoid, + as its operation and 0 as unit","status":"ok"},"long":{"text":"The commutative additive monoid M as a commutative monoid in the neutral notation: the same carrier, addition as the operation, zero as the unit. The axioms are those of [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid]], which is the commutative monoid structure written with + and 0.\n\nIt is declared canonical, not a coercion, and with [[AffineConstructive.theory.bundled_groups.com_monoid_as_additive_monoid]] makes [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐌𝐨𝐧]] and [[AffineConstructive.theory.bundled_groups.𝐂𝐌𝐨𝐧]] relabellings of each other on objects; the corresponding translation of morphisms is not defined here.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.com_monoid_as_additive_monoid","base":"com_monoid_as_additive_monoid","kind":"def","start":146,"body":null,"status":"ok","short":{"text":"A commutative monoid read additively: its operation as +, its unit as 0","status":"ok"},"long":{"text":"The commutative monoid M as a commutative additive monoid: the same carrier, the operation of M as addition and its unit as zero, the axioms of M unchanged.\n\nIt is the converse of [[AffineConstructive.theory.bundled_groups.additive_monoid_as_com_monoid]], declared canonical so that additive statements apply to a commutative monoid, and not a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.group_is_cat","base":"group_is_cat","kind":"inst","start":150,"body":[151,153],"status":"ok","short":{"text":"Groups with group morphisms satisfy the category laws","status":"ok"},"proof":[{"text":"There are three category laws: the left unit law, the right unit law and associativity. Identity and composition are the ones of monoids, which act on the underlying functions, so each law holds by reflexivity, pointwise.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐆𝐫𝐩","base":"𝐆𝐫𝐩","kind":"def","start":154,"body":null,"status":"ok","short":{"text":"The category of groups and group morphisms","status":"ok"},"long":{"text":"The category of groups. A group morphism is a monoid morphism between the underlying monoids (preservation of inverses follows), so identities and composition are [[AffineConstructive.theory.bundled_groups.monoid_id]] and [[AffineConstructive.theory.bundled_groups.monoid_morphism_compose]], and the laws are [[AffineConstructive.theory.bundled_groups.group_is_cat]].\n\nIt is [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐆𝐫𝐩]] under a change of notation, through [[AffineConstructive.theory.bundled_groups.additive_non_com_group_as_group]] and [[AffineConstructive.theory.bundled_groups.group_as_additive_non_com_group]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.ab_group_is_cat","base":"ab_group_is_cat","kind":"inst","start":158,"body":[159,161],"status":"ok","short":{"text":"Abelian groups with their morphisms satisfy the category laws","status":"ok"},"proof":[{"text":"There are three category laws: the left unit law, the right unit law and associativity. Identity and composition are the ones of monoids, which act on the underlying functions, so each law holds by reflexivity, pointwise.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐀𝐛𝐆𝐫𝐩","base":"𝐀𝐛𝐆𝐫𝐩","kind":"def","start":162,"body":null,"status":"ok","short":{"text":"The category of abelian groups and group morphisms","status":"ok"},"long":{"text":"The category of abelian groups, written in the neutral notation ∙, unit and inverse. Its arrows are monoid morphisms, with identities [[AffineConstructive.theory.bundled_groups.monoid_id]] and composition [[AffineConstructive.theory.bundled_groups.monoid_morphism_compose]]; the laws are [[AffineConstructive.theory.bundled_groups.ab_group_is_cat]].\n\nIt is [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐆𝐫𝐩]] under the notation +, 0 and −, through the coercions [[AffineConstructive.theory.bundled_groups.additive_group_as_ab_group]] and [[AffineConstructive.theory.bundled_groups.ab_group_as_additive_group]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_non_com_group_is_cat","base":"additive_non_com_group_is_cat","kind":"inst","start":166,"body":[167,169],"status":"ok","short":{"text":"Additive groups, not necessarily abelian, with their morphisms satisfy the category laws","status":"ok"},"proof":[{"text":"There are three category laws: the left unit law, the right unit law and associativity. Identity and composition are the ones of additive monoids that need not commute, which act on the underlying functions, so each law holds by reflexivity, pointwise.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐆𝐫𝐩","base":"𝐀𝐝𝐝𝐍𝐜𝐆𝐫𝐩","kind":"def","start":170,"body":null,"status":"ok","short":{"text":"The category of additive groups, not necessarily abelian, and their morphisms","status":"ok"},"long":{"text":"The category of groups written additively, without commutativity. Its arrows are the morphisms of the underlying additive monoids, with identities [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_id]] and composition [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_compose]]; the laws are [[AffineConstructive.theory.bundled_groups.additive_non_com_group_is_cat]].\n\nIt is [[AffineConstructive.theory.bundled_groups.𝐆𝐫𝐩]] under the notation +, 0 and −, through the coercions [[AffineConstructive.theory.bundled_groups.additive_non_com_group_as_group]] and [[AffineConstructive.theory.bundled_groups.group_as_additive_non_com_group]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_group_is_cat","base":"additive_group_is_cat","kind":"inst","start":174,"body":[175,177],"status":"ok","short":{"text":"Additive abelian groups with their morphisms satisfy the category laws","status":"ok"},"proof":[{"text":"There are three category laws: the left unit law, the right unit law and associativity. Identity and composition are the ones of additive monoids that need not commute, which act on the underlying functions, so each law holds by reflexivity, pointwise.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐆𝐫𝐩","base":"𝐀𝐝𝐝𝐆𝐫𝐩","kind":"def","start":178,"body":null,"status":"ok","short":{"text":"The category of additive abelian groups and maps preserving + and 0","status":"ok"},"long":{"text":"The category of abelian groups written additively. Its arrows are the morphisms of the underlying additive monoids, with identities [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_id]] and composition [[AffineConstructive.theory.bundled_groups.additive_non_com_monoid_morphism_compose]]; the laws are [[AffineConstructive.theory.bundled_groups.additive_group_is_cat]].\n\nIt is [[AffineConstructive.theory.bundled_groups.𝐀𝐛𝐆𝐫𝐩]] under a change of notation, through the coercions [[AffineConstructive.theory.bundled_groups.additive_group_as_ab_group]] and [[AffineConstructive.theory.bundled_groups.ab_group_as_additive_group]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_non_com_group_as_group","base":"additive_non_com_group_as_group","kind":"def","start":179,"body":null,"status":"ok","short":{"text":"An additive group, not necessarily abelian, as a group: + as operation, 0 as unit, − as inverse","status":"ok"},"long":{"text":"The additive group G as a group in the neutral notation: the same carrier, addition as the operation, zero as the unit and negation as the inverse. The axioms are those of [[AffineConstructive.interfaces.abstract_algebra.AdditiveNonComGroup]], the group structure under the notation +, 0 and −.\n\nIt is a coercion as well as canonical, and with [[AffineConstructive.theory.bundled_groups.group_as_additive_non_com_group]] makes [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐆𝐫𝐩]] and [[AffineConstructive.theory.bundled_groups.𝐆𝐫𝐩]] relabellings of each other, so that results about groups apply to additive groups and back.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.coercion:additive_non_com_group_as_group","base":"coercion:additive_non_com_group_as_group","kind":"coercion","start":180,"body":null,"status":"ok","short":{"text":"An additive group, not necessarily abelian, can stand where a group is expected, so group lemmas apply to +, 0 and −, via [[AffineConstructive.theory.bundled_groups.additive_non_com_group_as_group]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.group_as_additive_non_com_group","base":"group_as_additive_non_com_group","kind":"def","start":181,"body":null,"status":"ok","short":{"text":"A group read additively: its operation as +, its unit as 0, its inverse as −","status":"ok"},"long":{"text":"The group G as an additive group, not necessarily abelian: the same carrier, the operation as addition, the unit as zero and the inverse as negation, the group laws of G unchanged.\n\nIt is the converse of [[AffineConstructive.theory.bundled_groups.additive_non_com_group_as_group]], and likewise a coercion and canonical.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.coercion:group_as_additive_non_com_group","base":"coercion:group_as_additive_non_com_group","kind":"coercion","start":182,"body":null,"status":"ok","short":{"text":"A group can stand where an additive group is expected, written with +, 0 and −, via [[AffineConstructive.theory.bundled_groups.group_as_additive_non_com_group]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.additive_group_as_ab_group","base":"additive_group_as_ab_group","kind":"def","start":183,"body":null,"status":"ok","short":{"text":"An additive abelian group as an abelian group in the neutral notation","status":"ok"},"long":{"text":"The additive abelian group G as an abelian group written with ∙, unit and inverse: addition as the operation, zero as the unit, negation as the inverse. The axioms are those of [[AffineConstructive.interfaces.abstract_algebra.AdditiveGroup]].\n\nIt is a coercion and canonical; with [[AffineConstructive.theory.bundled_groups.ab_group_as_additive_group]] it makes [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐆𝐫𝐩]] and [[AffineConstructive.theory.bundled_groups.𝐀𝐛𝐆𝐫𝐩]] relabellings of each other.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.coercion:additive_group_as_ab_group","base":"coercion:additive_group_as_ab_group","kind":"coercion","start":184,"body":null,"status":"ok","short":{"text":"An additive abelian group can stand where an abelian group is expected, so abelian-group lemmas apply to +, 0 and −, via [[AffineConstructive.theory.bundled_groups.additive_group_as_ab_group]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.ab_group_as_additive_group","base":"ab_group_as_additive_group","kind":"def","start":185,"body":null,"status":"ok","short":{"text":"An abelian group read additively: its operation as +, its unit as 0, its inverse as −","status":"ok"},"long":{"text":"The abelian group G as an additive abelian group: the same carrier, the operation as addition, the unit as zero, the inverse as negation, the abelian group laws of G unchanged.\n\nIt is the converse of [[AffineConstructive.theory.bundled_groups.additive_group_as_ab_group]], and likewise a coercion and canonical.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.coercion:ab_group_as_additive_group","base":"coercion:ab_group_as_additive_group","kind":"coercion","start":186,"body":null,"status":"ok","short":{"text":"An abelian group can stand where an additive abelian group is expected, written with +, 0 and −, via [[AffineConstructive.theory.bundled_groups.ab_group_as_additive_group]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.quote_sg_op","base":"quote_sg_op","kind":"def","start":188,"body":null,"status":"ok","short":{"text":"Under a semigroup morphism f, f x₁ = y₁ and f x₂ = y₂ give f (x₁ ∙ x₂) = y₁ ∙ y₂","status":"ok"},"long":{"text":"The rule for the operation in the quotation of terms along a bundled semigroup morphism f: from quotations of x₁ and x₂, that is f x₁ = y₁ and f x₂ = y₂, it builds the quotation f (x₁ ∙ x₂) = y₁ ∙ y₂. It is [[AffineConstructive.theory.groups.quote_sg_op_alt]] stated for a morphism of [[AffineConstructive.theory.bundled_groups.𝐒𝐞𝐦𝐢𝐆𝐫𝐩]].\n\nIt is registered as a hint for the quote tactic, on either side of the quotation, so that the tactic can push a bundled morphism through the operation; the coercions from monoid and group morphisms are stripped first, so it serves those too.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.quote_mon_unit","base":"quote_mon_unit","kind":"def","start":189,"body":null,"status":"ok","short":{"text":"Under a monoid morphism f, f sends the unit to the unit","status":"ok"},"long":{"text":"The rule for the unit in the quotation of terms along a bundled monoid morphism f: the unit of Y quotes the unit of X, f e = e. It is [[AffineConstructive.theory.pointed.quote_mon_unit_alt]] stated for a morphism of [[AffineConstructive.theory.bundled_groups.𝐌𝐨𝐧]], registered as a hint for the quote tactic on either side of the quotation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.quote_inverse","base":"quote_inverse","kind":"def","start":190,"body":null,"status":"ok","short":{"text":"Under a group morphism f, f x = y gives f x⁻¹ = y⁻¹","status":"ok"},"long":{"text":"The rule for the inverse in the quotation of terms along a bundled group morphism f: a quotation f x = y gives the quotation f (x⁻¹) = y⁻¹. It is [[AffineConstructive.theory.groups.quote_inv_alt]] stated for a morphism of [[AffineConstructive.theory.bundled_groups.𝐆𝐫𝐩]], registered as a hint for the quote tactic on either side of the quotation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.quote_mult","base":"quote_mult","kind":"def","start":199,"body":null,"status":"ok","short":{"text":"Under a multiplicative semigroup morphism f, f x₁ = y₁ and f x₂ = y₂ give f (x₁ · x₂) = y₁ · y₂","status":"ok"},"long":{"text":"The rule for multiplication in the quotation of terms along a bundled morphism f of multiplicative semigroups: quotations of x₁ and x₂ combine into one of x₁ · x₂. It is [[AffineConstructive.theory.multiplicative_groups.quote_mult_alt]] stated for a morphism of [[AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐒𝐞𝐦𝐢𝐆𝐫𝐩]], registered as a hint for the quote tactic on either side of the quotation; morphisms of multiplicative monoids reach it through their coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.quote_one","base":"quote_one","kind":"def","start":200,"body":null,"status":"ok","short":{"text":"Under a multiplicative monoid morphism f, f 1 = 1","status":"ok"},"long":{"text":"The rule for 1 in the quotation of terms along a bundled morphism f of multiplicative monoids: 1 quotes 1. It is [[AffineConstructive.theory.pointed.quote_one_alt]] stated for a morphism of [[AffineConstructive.theory.bundled_groups.𝐌𝐮𝐥𝐌𝐨𝐧]], registered as a hint for the quote tactic on either side of the quotation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.quote_plus","base":"quote_plus","kind":"def","start":206,"body":null,"status":"ok","short":{"text":"Under an additive monoid morphism f, f x₁ = y₁ and f x₂ = y₂ give f (x₁ + x₂) = y₁ + y₂","status":"ok"},"long":{"text":"The rule for addition in the quotation of terms along a bundled morphism f of additive monoids, not necessarily commutative: quotations of x₁ and x₂ combine into a quotation of x₁ + x₂. It restates for a morphism of [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧]] the corresponding fact about functions preserving addition, and is registered as a hint for the quote tactic on either side of the quotation. Since the additive categories share their morphisms with [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧]], it serves morphisms of additive groups as well.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.quote_zero","base":"quote_zero","kind":"def","start":207,"body":null,"status":"ok","short":{"text":"Under an additive monoid morphism f, f 0 = 0","status":"ok"},"long":{"text":"The rule for zero in the quotation of terms along a bundled morphism f of additive monoids: 0 quotes 0. It is [[AffineConstructive.theory.pointed.quote_zero_alt]] stated for a morphism of [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐍𝐜𝐌𝐨𝐧]], registered as a hint for the quote tactic on either side of the quotation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_groups.quote_negate","base":"quote_negate","kind":"def","start":208,"body":null,"status":"ok","short":{"text":"Under a morphism f of additive abelian groups, f x = y gives f (−x) = −y","status":"ok"},"long":{"text":"The rule for negation in the quotation of terms along a bundled morphism f of additive abelian groups: a quotation f x = y gives the quotation f (−x) = −y. It restates for a morphism of [[AffineConstructive.theory.bundled_groups.𝐀𝐝𝐝𝐆𝐫𝐩]] the corresponding fact about additive group morphisms, and is registered as a hint for the quote tactic on either side of the quotation.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.cat":{"page":"../interfaces/cat.html","short":"Minimal categories with affine hom-sets, and the category of affine sets","summary":"This file sets up a minimal notion of category in which the objects form a type and the hom-sets are affine sets, so equality of morphisms is an affine equality, carrying apartness as well. It separates the data ([[cat_t]]) from the operations ([[Id]] and [[Compose]]) and from the laws ([[IsCat]]), then packages them in the bundled [[cat]]. Composition is a function out of the tensor of hom-sets, so it is required to be extensional only in the multiplicative sense. The main instance is [[𝐒𝐞𝐭]], with affine sets as objects and the function sets of interfaces/set.v as hom-sets, and [[set_IsCat]] proves its laws."},"AffineConstructive.theory.projected_set":{"page":"projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.theory.groups":{"page":"groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.additive_groups":{"page":"additive_groups.html","short":"Groups, monoids and their morphisms in additive notation","summary":"This file restates the generic group theory of theory/groups.v in the additive notation that rings use. To do so it views a set with +, 0 and − as a group through [[AdditiveGroupOps]]. It gives constructors for the additive semigroup, monoid and group structures, commutative or not, and the coercions among them. It also restates the basic laws under additive names: associativity, commutativity, the identity and inverse laws, the involution and distributivity of negation, [[negate_0]], [[equal_by_zero_sum]] and [[flip_negate]]. For additive semigroup and monoid morphisms it gives preservation of addition, negation and subtraction, together with identities, composites and inverses. [[Build_AdditiveGroup_Morphism]] shows that a map between groups that preserves addition is a monoid morphism. The file closes with simplification rules that cancel zeros and inverses, transport of structure along injections, and the quotation rules for + and −."},"AffineConstructive.theory.multiplicative_groups":{"page":"multiplicative_groups.html","short":"Multiplicative semigroups, monoids and their morphisms, by way of the generic group theory","summary":"This file states the theory of multiplicative semigroups, monoids and commutative monoids, written with · and 1, by reading each result of the generic group theory of theory.groups through the view of a set as a monoid under its multiplication. It gives the laws [[mult_ass]], [[mult_com]], [[mult_1_l]] and [[mult_1_r]] and hints so that resolution finds them, constructors for the structures and their morphisms, and [[preserves_mult]]. Multiplicative semigroup and monoid morphisms are closed under identity, composition and inversion of bijections, the structures pass to the opposite ring, and an injective map that preserves the operations carries each structure back to its domain. Simplification rules remove a factor 1, and [[quote_mult_alt]] lets the quoting framework go through a product."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.quote.base":{"page":"../tactics/quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

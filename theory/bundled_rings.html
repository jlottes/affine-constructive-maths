rfaces.cat","name":"Id","kind":"class","local":false,"page":"../interfaces/cat.html"},{"s":6223,"e":6245,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_cat_t","kind":"canonstruc","local":false,"page":"../interfaces/bundled_algebra.html"},{"s":6257,"e":6268,"lib":"AffineConstructive.theory.bundled_rings","name":"near_rig_id","kind":"canonstruc","local":true},{"s":6314,"e":6321,"lib":"AffineConstructive.interfaces.cat","name":"Compose","kind":"class","local":false,"page":"../interfaces/cat.html"},{"s":6322,"e":6344,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_cat_t","kind":"canonstruc","local":false,"page":"../interfaces/bundled_algebra.html"},{"s":6357,"e":6382,"lib":"AffineConstructive.theory.bundled_rings","name":"near_rig_morphism_compose","kind":"def","local":true},{"s":6451,"e":6456,"lib":"AffineConstructive.interfaces.cat","name":"IsCat","kind":"class","local":false,"page":"../interfaces/cat.html"},{"s":6514,"e":6539,"lib":"AffineConstructive.theory.bundled_rings","name":"near_rig_morphism_compose","kind":"def","local":true},{"s":6492,"e":6503,"lib":"AffineConstructive.theory.bundled_rings","name":"near_rig_id","kind":"canonstruc","local":true},{"s":6457,"e":6479,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_cat_t","kind":"canonstruc","local":false,"page":"../interfaces/bundled_algebra.html"},{"s":6604,"e":6613,"lib":"AffineConstructive.interfaces.cat","name":"Build_cat","kind":"constr","local":false,"page":"../interfaces/cat.html"},{"s":6614,"e":6636,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"commutative_ring_cat_t","kind":"canonstruc","local":false,"page":"../interfaces/bundled_algebra.html"},{"s":1487,"e":1490,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":3403,"e":3406,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":4251,"e":4254,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":4832,"e":4835,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":5689,"e":5692,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6554,"e":6557,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file makes categories of the bundled ring-like structures of `interfaces/bundled_algebra.v`, continuing what `theory/bundled_groups.v` does for monoids and groups. One identity, [[AffineConstructive.theory.bundled_rings.near_rig_id]], and one composition, [[AffineConstructive.theory.bundled_rings.near_rig_morphism_compose]], serve for all six categories, [[AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], [[AffineConstructive.theory.bundled_rings.𝐑𝐢𝐠]], [[AffineConstructive.theory.bundled_rings.𝐂𝐑𝐢𝐠]], [[AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐧𝐠]], [[AffineConstructive.theory.bundled_rings.𝐑𝐢𝐧𝐠]] and [[AffineConstructive.theory.bundled_rings.𝐂𝐑𝐢𝐧𝐠]], because each of these structures has the near-rig morphisms as its morphisms. In every case the category laws hold because the laws hold for the underlying functions, and morphisms are equal when their functions are. The file also gives the forgetful passages from a ring-like structure to its additive monoid or group and to its multiplicative monoid, and from a near-rig morphism to the matching additive and multiplicative monoid morphisms, so that results about groups and monoids apply directly to rings.","short":"Categories of near-rigs, rigs, near-rings and rings, and their forgetful coercions","items":[{"name":"AffineConstructive.theory.bundled_rings.near_rig_id","base":"near_rig_id","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"The identity morphism of a near-rig","status":"ok"},"long":{"text":"The identity function on a near-rig, viewed as a near-rig morphism: it preserves +, 0, · and 1, and [[AffineConstructive.interfaces.bundled_algebra.make_near_rig_morphism]] finds those facts by resolution. It is the identity of the category [[AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐠]]. The same identity is also used in the categories of rigs, commutative rigs, near-rings, rings and commutative rings, since their morphisms are near-rig morphisms too.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.make_compose_fun","base":"make_compose_fun","kind":"abbrev","start":11,"body":null,"status":"ok","short":{"text":"Turns a composition of morphisms into a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"A local shorthand. It takes a composition operation c on morphisms and gives a function of sets from the tensor product of two hom-sets to the third hom-set. That this function preserves equality comes from [[AffineConstructive.theory.projected_set.projected_is_fun]]: the hom-sets carry the equality pulled back from their underlying functions, and c agrees with the composition of those functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_rig_morphism_compose_op","base":"near_rig_morphism_compose_op","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"The composite g ∘ f of two near-rig morphisms, as a near-rig morphism","status":"ok"},"long":{"text":"Composing the underlying functions of two near-rig morphisms gives a function that again preserves +, 0, · and 1. This definition packages that composite as a near-rig morphism. The function of sets [[AffineConstructive.theory.bundled_rings.near_rig_morphism_compose]] is built on top of it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_rig_morphism_compose","base":"near_rig_morphism_compose","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"Composition of near-rig morphisms as a function on the tensor product of hom-sets","status":"ok"},"long":{"text":"The composition of the category of near-rigs, built from [[AffineConstructive.theory.bundled_rings.near_rig_morphism_compose_op]] by [[AffineConstructive.theory.bundled_rings.make_compose_fun]]. Its domain is the tensor product of hom-sets, so the equality on a pair (g, f) is multiplicative: equal inputs give equal composites, with each factor used once. The categories of rigs, commutative rigs, near-rings, rings and commutative rings use this same composition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_rig_is_cat","base":"near_rig_is_cat","kind":"inst","start":15,"body":[16,18],"status":"ok","short":{"text":"Near-rigs with near-rig identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"The category laws split into the two unit laws and associativity. Each one compares near-rig morphisms, which are equal when their underlying functions are. For the identity [[AffineConstructive.theory.bundled_rings.near_rig_id]] and the composition [[AffineConstructive.theory.bundled_rings.near_rig_morphism_compose]], the two sides have the same function, so every law holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐠","base":"𝐍𝐞𝐚𝐫𝐑𝐢𝐠","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The category of near-rigs and near-rig morphisms","status":"ok"},"long":{"text":"The category whose objects are bundled near-rigs and whose morphisms are functions preserving +, 0, · and 1. Its identity is [[AffineConstructive.theory.bundled_rings.near_rig_id]] and its composition is [[AffineConstructive.theory.bundled_rings.near_rig_morphism_compose]]. The laws, [[AffineConstructive.theory.bundled_rings.near_rig_is_cat]], hold because they hold for the underlying functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_rig_as_add_nc_mon","base":"near_rig_as_add_nc_mon","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"The additive monoid of a near-rig, forgetting multiplication","status":"ok"},"long":{"text":"Sends a near-rig to its underlying additive monoid, with + and 0, which need not be commutative. This mirrors the bundled additive monoids of `theory/bundled_groups.v`. Because it is a coercion, a near-rig can be used wherever an additive monoid is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.coercion:near_rig_as_add_nc_mon","base":"coercion:near_rig_as_add_nc_mon","kind":"coercion","start":21,"body":null,"status":"ok","short":{"text":"A bundled near-rig can stand for its additive monoid, via [[AffineConstructive.theory.bundled_rings.near_rig_as_add_nc_mon]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_rig_as_mul_mon","base":"near_rig_as_mul_mon","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"The multiplicative monoid of a near-rig, forgetting addition","status":"ok"},"long":{"text":"Sends a near-rig to its underlying multiplicative monoid, with · and 1. Because it is a coercion, a near-rig can be used wherever a multiplicative monoid is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.coercion:near_rig_as_mul_mon","base":"coercion:near_rig_as_mul_mon","kind":"coercion","start":24,"body":null,"status":"ok","short":{"text":"A bundled near-rig can stand for its multiplicative monoid, via [[AffineConstructive.theory.bundled_rings.near_rig_as_mul_mon]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_rig_morphism_as_addmon_mor","base":"near_rig_morphism_as_addmon_mor","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"A near-rig morphism as a morphism of the underlying additive monoids","status":"ok"},"long":{"text":"A near-rig morphism preserves + and 0, so it is a morphism of the additive monoids that [[AffineConstructive.theory.bundled_rings.near_rig_as_add_nc_mon]] gives. Because this is a coercion, facts about additive monoid morphisms apply to near-rig morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.coercion:near_rig_morphism_as_addmon_mor","base":"coercion:near_rig_morphism_as_addmon_mor","kind":"coercion","start":27,"body":null,"status":"ok","short":{"text":"A near-rig morphism can stand for its morphism of additive monoids, via [[AffineConstructive.theory.bundled_rings.near_rig_morphism_as_addmon_mor]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_rig_morphism_as_mulmon_mor","base":"near_rig_morphism_as_mulmon_mor","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"A near-rig morphism as a morphism of the underlying multiplicative monoids","status":"ok"},"long":{"text":"A near-rig morphism preserves · and 1, so it is a morphism of the multiplicative monoids that [[AffineConstructive.theory.bundled_rings.near_rig_as_mul_mon]] gives. Because this is a coercion, facts about multiplicative monoid morphisms apply to near-rig morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.coercion:near_rig_morphism_as_mulmon_mor","base":"coercion:near_rig_morphism_as_mulmon_mor","kind":"coercion","start":30,"body":null,"status":"ok","short":{"text":"A near-rig morphism can stand for its morphism of multiplicative monoids, via [[AffineConstructive.theory.bundled_rings.near_rig_morphism_as_mulmon_mor]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.rig_is_cat","base":"rig_is_cat","kind":"inst","start":35,"body":[36,38],"status":"ok","short":{"text":"Rigs with the near-rig identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"The proof is the same as for near-rigs. A rig morphism is a near-rig morphism, and morphisms are equal when their functions are. Under [[AffineConstructive.theory.bundled_rings.near_rig_id]] and [[AffineConstructive.theory.bundled_rings.near_rig_morphism_compose]], the two unit laws and associativity have identical functions on both sides, so each holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_rings.𝐑𝐢𝐠","base":"𝐑𝐢𝐠","kind":"def","start":39,"body":null,"status":"ok","short":{"text":"The category of rigs","status":"ok"},"long":{"text":"The category whose objects are bundled rigs and whose morphisms are near-rig morphisms between them. Its identity and composition are those of [[AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], and [[AffineConstructive.theory.bundled_rings.rig_is_cat]] gives its laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.rig_as_add_mon","base":"rig_as_add_mon","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"The commutative additive monoid of a rig","status":"ok"},"long":{"text":"In a rig, addition is commutative. This sends a rig to its underlying commutative additive monoid, with + and 0, so a rig can be used wherever a commutative additive monoid is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.coercion:rig_as_add_mon","base":"coercion:rig_as_add_mon","kind":"coercion","start":41,"body":null,"status":"ok","short":{"text":"A bundled rig can stand for its commutative additive monoid, via [[AffineConstructive.theory.bundled_rings.rig_as_add_mon]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.commutative_rig_is_cat","base":"commutative_rig_is_cat","kind":"inst","start":46,"body":[47,49],"status":"ok","short":{"text":"Commutative rigs with the near-rig identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"Commutative rigs have the near-rig morphisms as their morphisms. Each of the two unit laws and associativity therefore compares two morphisms with the same underlying function, and holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_rings.𝐂𝐑𝐢𝐠","base":"𝐂𝐑𝐢𝐠","kind":"def","start":50,"body":null,"status":"ok","short":{"text":"The category of commutative rigs","status":"ok"},"long":{"text":"The category whose objects are bundled commutative rigs and whose morphisms are near-rig morphisms between them. Its identity and composition are those of [[AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], and [[AffineConstructive.theory.bundled_rings.commutative_rig_is_cat]] gives its laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_ring_is_cat","base":"near_ring_is_cat","kind":"inst","start":54,"body":[55,57],"status":"ok","short":{"text":"Near-rings with the near-rig identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"Near-rings have the near-rig morphisms as their morphisms, with the identity [[AffineConstructive.theory.bundled_rings.near_rig_id]] and the composition [[AffineConstructive.theory.bundled_rings.near_rig_morphism_compose]]. Each of the two unit laws and associativity compares two morphisms with the same underlying function, and holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐧𝐠","base":"𝐍𝐞𝐚𝐫𝐑𝐢𝐧𝐠","kind":"def","start":58,"body":null,"status":"ok","short":{"text":"The category of near-rings","status":"ok"},"long":{"text":"The category whose objects are bundled near-rings and whose morphisms are near-rig morphisms between them. These morphisms are not required to preserve negation. Its identity and composition are those of [[AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], and [[AffineConstructive.theory.bundled_rings.near_ring_is_cat]] gives its laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.near_ring_as_add_nc_grp","base":"near_ring_as_add_nc_grp","kind":"def","start":59,"body":null,"status":"ok","short":{"text":"The additive group of a near-ring, not necessarily abelian","status":"ok"},"long":{"text":"Sends a near-ring to its underlying additive group, with +, 0 and negation, without assuming commutativity. Because it is a coercion, a near-ring can be used wherever an additive group is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.coercion:near_ring_as_add_nc_grp","base":"coercion:near_ring_as_add_nc_grp","kind":"coercion","start":60,"body":null,"status":"ok","short":{"text":"A bundled near-ring can stand for its additive group, not necessarily abelian, via [[AffineConstructive.theory.bundled_rings.near_ring_as_add_nc_grp]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.ring_is_cat","base":"ring_is_cat","kind":"inst","start":65,"body":[66,68],"status":"ok","short":{"text":"Rings with the near-rig identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"Rings have the near-rig morphisms as their morphisms. The two unit laws and associativity each compare two morphisms with the same underlying function, so each holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_rings.𝐑𝐢𝐧𝐠","base":"𝐑𝐢𝐧𝐠","kind":"def","start":69,"body":null,"status":"ok","short":{"text":"The category of rings","status":"ok"},"long":{"text":"The category whose objects are bundled rings and whose morphisms are near-rig morphisms between them. Its identity and composition are those of [[AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], and [[AffineConstructive.theory.bundled_rings.ring_is_cat]] gives its laws.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.ring_as_add_group","base":"ring_as_add_group","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"The additive abelian group of a ring","status":"ok"},"long":{"text":"Sends a ring to its underlying abelian group, with +, 0 and negation, so a ring can be used wherever an additive abelian group is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.coercion:ring_as_add_group","base":"coercion:ring_as_add_group","kind":"coercion","start":71,"body":null,"status":"ok","short":{"text":"A bundled ring can stand for its additive abelian group, via [[AffineConstructive.theory.bundled_rings.ring_as_add_group]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.bundled_rings.commutative_ring_is_cat","base":"commutative_ring_is_cat","kind":"inst","start":76,"body":[77,79],"status":"ok","short":{"text":"Commutative rings with the near-rig identities and composition satisfy the category laws","status":"ok"},"proof":[{"text":"Commutative rings have the near-rig morphisms as their morphisms. The two unit laws and associativity each compare two morphisms with the same underlying function, so each holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.bundled_rings.𝐂𝐑𝐢𝐧𝐠","base":"𝐂𝐑𝐢𝐧𝐠","kind":"def","start":80,"body":null,"status":"ok","short":{"text":"The category of commutative rings","status":"ok"},"long":{"text":"The category whose objects are bundled commutative rings and whose morphisms are near-rig morphisms between them. Its identity and composition are those of [[AffineConstructive.theory.bundled_rings.𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], and [[AffineConstructive.theory.bundled_rings.commutative_ring_is_cat]] gives its laws.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.theory.bundled_groups":{"page":"bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.cat":{"page":"../interfaces/cat.html","short":"Minimal categories with affine hom-sets, and the category of affine sets","summary":"This file sets up a minimal notion of category in which the objects form a type and the hom-sets are affine sets, so equality of morphisms is an affine equality, carrying apartness as well. It separates the data ([[cat_t]]) from the operations ([[Id]] and [[Compose]]) and from the laws ([[IsCat]]), then packages them in the bundled [[cat]]. Composition is a function out of the tensor of hom-sets, so it is required to be extensional only in the multiplicative sense. The main instance is [[𝐒𝐞𝐭]], with affine sets as objects and the function sets of interfaces/set.v as hom-sets, and [[set_IsCat]] proves its laws."},"AffineConstructive.theory.projected_set":{"page":"projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.theory.groups":{"page":"groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.theory.rings":{"page":"rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.additive_groups":{"page":"additive_groups.html","short":"Groups, monoids and their morphisms in additive notation","summary":"This file restates the generic group theory of theory/groups.v in the additive notation that rings use. To do so it views a set with +, 0 and − as a group through [[AdditiveGroupOps]]. It gives constructors for the additive semigroup, monoid and group structures, commutative or not, and the coercions among them. It also restates the basic laws under additive names: associativity, commutativity, the identity and inverse laws, the involution and distributivity of negation, [[negate_0]], [[equal_by_zero_sum]] and [[flip_negate]]. For additive semigroup and monoid morphisms it gives preservation of addition, negation and subtraction, together with identities, composites and inverses. [[Build_AdditiveGroup_Morphism]] shows that a map between groups that preserves addition is a monoid morphism. The file closes with simplification rules that cancel zeros and inverses, transport of structure along injections, and the quotation rules for + and −."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

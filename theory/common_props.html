 Qed.\n\nLemma right_inverse_from_left `{!@Commutative X Y f, !LeftInverse f i u} : RightInverse f i u.\nProof. hnf; intros. rew (commutativity f _ _). exact (left_inverse f _). Qed.\n\nLemma right_distr_from_left `{!@Commutative X X f, !LeftDistribute f g} : RightDistribute f g.\nProof. hnf; intros x y z. rew (commutativity f _ z). exact (distribute_l f g _ _ _). Qed.\n\nLemma left_distr_from_right `{!@Commutative X X f, !RightDistribute f g} : LeftDistribute f g.\nProof. hnf; intros x y z. rew (commutativity f x _). exact (distribute_r f g _ _ _). Qed.\n\nDefinition involutive_alt `(f:X ⇾ X) `{!Involutive f} x : f (f x) = x := involutive f x.\nDefinition idempotent_alt `(f:X ⇾ X) `{!Idempotent f} x : f (f x) = f x := idempotent f x.\n\nLemma involutive_bijective `{Involutive (f:=f)} : Bijective f (inv:=f).\nProof. split; hnf.\n+ intros x y. rew <-(involutive_alt f x) at 2. rew <-(involutive_alt f y) at 2. exact (is_fun f _ _).\n+ exact (involutive f).\nQed.\nCoercion involutive_bijective : Involutive >-> Bijective.\n\nLemma left_or_right_absorb {X:set} (f:X ⊗ X ⇾ X) `{!LeftAbsorb f z, !RightAbsorb f z} (x y : X) : x = z ∨ y = z ⊸ f (x, y) = z.\nProof. apply aor_elim.\n+ rew <-(left_absorb  f (x:=z) y) at 2. exact (is_fun (ap2 f y) _ _).\n+ rew <-(right_absorb f (y:=z) x) at 2. exact (is_fun (ap1 f x) _ _).\nQed.\n\nLemma absorb_ne_left_and_right {X:set} (f:X ⊗ X ⇾ X) `{!LeftAbsorb f z, !RightAbsorb f z} (x y : X) : f (x, y) ≠ z ⊸ x ≠ z ∧ y ≠ z.\nProof. exact (acontra (left_or_right_absorb f x y)). Qed.\n\nLemma left_par_right_absorb {X:set} `{!RefutativeEquality X} (f:X ⊗ X ⇾ X) `{!LeftAbsorb f z, !RightAbsorb f z} (x y : X)\n  : x = z ⊞ y = z ⊸ f (x, y) = z.\nProof. now apply aor_apar_refutative, left_or_right_absorb. Qed.\n\nLemma absorb_ne_left_prod_right {X:set} `{!RefutativeEquality X} (f:X ⊗ X ⇾ X) `{!LeftAbsorb f z, !RightAbsorb f z} (x y : X)\n  : f (x, y) ≠ z ⊸ x ≠ z ⊠ y ≠ z.\nProof. exact (acontra (left_par_right_absorb f x y)). Qed.\n\nSection cancellat  H. Qed.\n  Lemma Distribute_op     `{H:Distribute     (f:=f) (g:=g)} : Distribute     f (g ∘ tensor_swap _ _).  Proof. go H. Qed.\n  Lemma AntiDistribute_op `{H:AntiDistribute (f:=f) (g:=g)} : AntiDistribute f (g ∘ tensor_swap _ _).  Proof. go H. Qed.\nEnd opposite.\nGlobal Hint Extern 2 (Associative      (_ ∘ tensor_swap _ _)    ) => notypeclasses refine Associative_op      : typeclass_instances.\nGlobal Hint Extern 2 (Commutative      (_ ∘ tensor_swap _ _)    ) => notypeclasses refine Commutative_op      : typeclass_instances.\nGlobal Hint Extern 2 (BinaryIdempotent (_ ∘ tensor_swap _ _)    ) => notypeclasses refine BinaryIdempotent_op : typeclass_instances.\nGlobal Hint Extern 2 (RightIdentity    (_ ∘ tensor_swap _ _) _  ) => notypeclasses refine RightIdentity_op    : typeclass_instances.\nGlobal Hint Extern 2 (LeftIdentity     (_ ∘ tensor_swap _ _) _  ) => notypeclasses refine LeftIdentity_op     : typeclass_instances.\nGlobal Hint Extern 2 (RightAbsorb      (_ ∘ tensor_swap _ _) _  ) => notypeclasses refine RightAbsorb_op      : typeclass_instances.\nGlobal Hint Extern 2 (LeftAbsorb       (_ ∘ tensor_swap _ _) _  ) => notypeclasses refine LeftAbsorb_op       : typeclass_instances.\nGlobal Hint Extern 2 (RightInverse     (_ ∘ tensor_swap _ _) _ _) => notypeclasses refine RightInverse_op     : typeclass_instances.\nGlobal Hint Extern 2 (LeftInverse      (_ ∘ tensor_swap _ _) _ _) => notypeclasses refine LeftInverse_op      : typeclass_instances.\nGlobal Hint Extern 2 (RightDistribute  (_ ∘ tensor_swap _ _) _  ) => notypeclasses refine RightDistribute_op  : typeclass_instances.\nGlobal Hint Extern 2 (LeftDistribute   (_ ∘ tensor_swap _ _) _  ) => notypeclasses refine LeftDistribute_op   : typeclass_instances.\nGlobal Hint Extern 2 (Distribute     _ (_ ∘ tensor_swap _ _)    ) => notypeclasses refine Distribute_op       : typeclass_instances.\nGlobal Hint Extern 2 (AntiDistribute _ (_ ∘ tensor_swap _ _)    ) => notypeclasses refine AntiDistribute_op   : typeclass_i 086,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":3192,"e":3194,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":3295,"e":3297,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":3413,"e":3415,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":3530,"e":3532,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":3646,"e":3648,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":3757,"e":3759,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":3867,"e":3869,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":3995,"e":3997,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":4122,"e":4124,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":4245,"e":4247,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":4368,"e":4370,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":4489,"e":4491,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true},{"s":4610,"e":4612,"lib":"AffineConstructive.theory.common_props","name":"go","kind":"ltac","local":true}],"gloss":{"summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[AffineConstructive.theory.set.tensor_swap]], so that resolution finds them there.","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","items":[{"name":"AffineConstructive.theory.common_props.right_id_from_left","base":"right_id_from_left","kind":"prf","start":1,"body":[2,6],"status":"ok","short":{"text":"For a commutative operation, a left identity is also a right identity","status":"ok"},"proof":[{"text":"Unfold what a right identity is and fix x₀; the goal is f(x₀, x) = x₀.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.interfaces.common_props.commutativity]] the left side equals f(x, x₀), which is x₀ because x is a left identity ([[AffineConstructive.interfaces.common_props.left_identity]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.common_props.right_absorb_from_left","base":"right_absorb_from_left","kind":"prf","start":7,"body":[8,12],"status":"ok","short":{"text":"For a commutative operation, a left-absorbing element is also right-absorbing","status":"ok"},"proof":[{"text":"Unfold what a right-absorbing element is and fix x₀; the goal is f(x₀, x) = x.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.interfaces.common_props.commutativity]] the left side equals f(x, x₀), which is x because x absorbs on the left ([[AffineConstructive.interfaces.common_props.left_absorb]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.common_props.right_inverse_from_left","base":"right_inverse_from_left","kind":"prf","start":13,"body":[14,18],"status":"ok","short":{"text":"For a commutative operation, left inverses with a given unit are also right inverses","status":"ok"},"proof":[{"text":"Unfold what a right inverse is and fix x; the goal is f(x, i x) = u.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.interfaces.common_props.commutativity]] the left side equals f(i x, x), which is u because i is a left inverse with unit u ([[AffineConstructive.interfaces.common_props.left_inverse]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.common_props.right_distr_from_left","base":"right_distr_from_left","kind":"prf","start":19,"body":[20,24],"status":"ok","short":{"text":"If a commutative f distributes over g on the left, it also distributes on the right","status":"ok"},"proof":[{"text":"Unfold right distributivity and fix x, y, z; the goal is f(g(x, y), z) = g(f(x, z), f(y, z)).","status":"ok","from":0,"to":1},{"text":"Commutativity of f, applied to the three products with z, moves z to the left in each. What results is the left distributive law at z, x, y ([[AffineConstructive.interfaces.common_props.distribute_l]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.common_props.left_distr_from_right","base":"left_distr_from_right","kind":"prf","start":25,"body":[26,30],"status":"ok","short":{"text":"If a commutative f distributes over g on the right, it also distributes on the left","status":"ok"},"proof":[{"text":"Unfold left distributivity and fix x, y, z; the goal is f(x, g(y, z)) = g(f(x, y), f(x, z)).","status":"ok","from":0,"to":1},{"text":"Commutativity of f, applied to the three products with x, moves x to the right in each. What results is the right distributive law at y, z, x ([[AffineConstructive.interfaces.common_props.distribute_r]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.common_props.involutive_alt","base":"involutive_alt","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"The law of an involution in pointwise form: f(f x) = x","status":"ok"},"long":{"text":"The involution law of [[AffineConstructive.interfaces.common_props.Involutive]], restated pointwise: f(f x) = x for every x. The class states the law as an equality of functions, f ∘ f equal to the identity. This form gives the law at a point, for rewriting a single element, as in the proof of [[AffineConstructive.theory.common_props.involutive_bijective]]. It is the same law as [[AffineConstructive.interfaces.common_props.involutive]], with f given as an explicit argument.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.common_props.idempotent_alt","base":"idempotent_alt","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"The law of an idempotent function in pointwise form: f(f x) = f x","status":"ok"},"long":{"text":"The law of an idempotent endofunction ([[AffineConstructive.interfaces.common_props.Idempotent]]), restated pointwise: f(f x) = f x for every x. It is the companion of [[AffineConstructive.theory.common_props.involutive_alt]]: the same law as [[AffineConstructive.interfaces.common_props.idempotent]], with f given as an explicit argument, so that it can be applied at a particular element.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.common_props.involutive_bijective","base":"involutive_bijective","kind":"prf","start":33,"body":[34,43],"status":"ok","short":{"text":"An involution is bijective, with itself as its inverse","status":"ok"},"proof":[{"text":"Bijectivity with f as its own inverse asks for two things: f is injective, and f composed with its inverse, here f ∘ f, is the identity.","status":"ok","from":0,"to":1},{"text":"For injectivity, fix x and y. Using [[AffineConstructive.theory.common_props.involutive_alt]] twice, rewrite the conclusion x = y as f(f x) = f(f y). This conclusion follows from f x = f y because f preserves equality ([[AffineConstructive.interfaces.set.is_fun]]).","status":"ok","from":2,"to":6},{"text":"The second condition is the law of an involution itself ([[AffineConstructive.interfaces.common_props.involutive]]).","status":"ok","from":7,"to":9}]},{"name":"AffineConstructive.theory.common_props.coercion:involutive_bijective","base":"coercion:involutive_bijective","kind":"coercion","start":44,"body":null,"status":"ok","short":{"text":"An involution serves wherever a bijection is asked for, being its own inverse, through [[AffineConstructive.theory.common_props.involutive_bijective]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.common_props.left_or_right_absorb","base":"left_or_right_absorb","kind":"prf","start":45,"body":[46,54],"status":"ok","short":{"text":"If z absorbs f on both sides, then x = z or y = z implies f(x, y) = z","status":"ok"},"proof":[{"text":"The hypothesis is an additive disjunction, so argue by cases: show that each of x = z and y = z implies f(x, y) = z.","status":"ok","from":0,"to":1},{"text":"If x = z: since z absorbs on the left, z = f(z, y) ([[AffineConstructive.interfaces.common_props.left_absorb]]). The goal becomes f(x, y) = f(z, y), and this follows from x = z because f(–, y) preserves equality.","status":"ok","from":2,"to":4},{"text":"If y = z: since z absorbs on the right, z = f(x, z) ([[AffineConstructive.interfaces.common_props.right_absorb]]). The goal becomes f(x, y) = f(x, z), and this follows from y = z because f(x, –) preserves equality.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.theory.common_props.absorb_ne_left_and_right","base":"absorb_ne_left_and_right","kind":"prf","start":55,"body":[56,58],"status":"ok","short":{"text":"If z absorbs f on both sides, f(x, y) ≠ z implies x ≠ z ∧ y ≠ z","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.theory.common_props.left_or_right_absorb]]. The dual of x = z ∨ y = z is x ≠ z ∧ y ≠ z, and the dual of f(x, y) = z is f(x, y) ≠ z.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.left_par_right_absorb","base":"left_par_right_absorb","kind":"prf","start":59,"body":[60,62],"status":"ok","short":{"text":"With refutative equality and z absorbing f on both sides, x = z ⊞ y = z implies f(x, y) = z","status":"ok"},"proof":[{"text":"Equality on X is refutative, so the conclusion f(x, y) = z is refutative. For a refutative conclusion, an implication from x = z ∨ y = z gives one from x = z ⊞ y = z ([[AffineConstructive.logic.aprop.aor_apar_refutative]]). The implication from the disjunction is [[AffineConstructive.theory.common_props.left_or_right_absorb]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.absorb_ne_left_prod_right","base":"absorb_ne_left_prod_right","kind":"prf","start":63,"body":[64,66],"status":"ok","short":{"text":"With refutative equality and z absorbing f on both sides, f(x, y) ≠ z implies x ≠ z ⊠ y ≠ z","status":"ok"},"proof":[{"text":"This is the contrapositive of [[AffineConstructive.theory.common_props.left_par_right_absorb]]. The dual of a par is the tensor of the duals, so x = z ⊞ y = z becomes x ≠ z ⊠ y ≠ z.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.left_cancellation","base":"left_cancellation","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"Left cancellation: if f(x, −) is injective, then y₁ = y₂ if and only if f(x, y₁) = f(x, y₂)","status":"ok"},"long":{"text":"Left cancellation for a binary operation f : X ⊗ Y ⇾ Z at a fixed first argument x. If the partial application f(x, −) is [[AffineConstructive.interfaces.set.Injective]], then y₁ = y₂ holds if and only if f(x, y₁) = f(x, y₂). The equivalence is affine, so it also carries the contrapositive: y₁ ≠ y₂ if and only if f(x, y₁) ≠ f(x, y₂).\n\nIt is [[AffineConstructive.theory.set.injective_iff]] applied to the partial application [[AffineConstructive.theory.set.ap1]] f x, restated in terms of f and its two arguments. Its mirror image, cancellation of a fixed second argument, is [[AffineConstructive.theory.common_props.right_cancellation]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.common_props.right_cancellation","base":"right_cancellation","kind":"def","start":71,"body":null,"status":"ok","short":{"text":"Right cancellation: if f(−, y) is injective, x₁ = x₂ ⧟ f(x₁, y) = f(x₂, y)","status":"ok"},"long":{"text":"Right cancellation for a binary operation f : X ⊗ Y ⇾ Z at a fixed second argument y. If the partial application f(−, y) is [[AffineConstructive.interfaces.set.Injective]], then x₁ = x₂ holds if and only if f(x₁, y) = f(x₂, y). Like [[AffineConstructive.theory.common_props.left_cancellation]], the affine equivalence also covers apartness. It is [[AffineConstructive.theory.set.injective_iff]] applied to the partial application [[AffineConstructive.theory.set.ap2]] f y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.common_props.right_cancel_from_left","base":"right_cancel_from_left","kind":"prf","start":73,"body":[74,79],"status":"ok","short":{"text":"For a commutative operation, injectivity in every left slot gives injectivity in every right slot","status":"ok"},"proof":[{"text":"Assume f is injective in every left slot, and fix z together with points x and y. It remains to show that f(x, z) = f(y, z) implies x = y.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.interfaces.common_props.commutativity]], rewrite both sides of the hypothesis so that z sits in the left slot: f(z, x) = f(z, y). Injectivity of f in the left slot at z then gives x = y.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.theory.common_props.go","base":"go","kind":"ltac","start":81,"body":null,"status":"ok","short":{"text":"Proves an algebraic law of f ∘ tensor_swap from the corresponding law H of f, with arguments swapped","status":"ok"},"long":{"text":"The tactic proves that the opposite operation, f precomposed with the symmetry [[AffineConstructive.theory.set.tensor_swap]] of the tensor product, satisfies an algebraic law, given as H the corresponding law for f. It unfolds the class in the goal to its defining statement and fixes the elements it quantifies over. It then rewrites every application of the opposite operation to a pair (a, b) as f applied to (b, a), which holds by definition, so that the goal becomes an equation between terms built from f alone. That equation is either an instance of H or an instance of H read backwards, and the tactic tries H directly and then H after symmetry of the equality.\n\nIt serves only the lemmas of this file that transfer associativity, commutativity, idempotence, identities, absorbing elements, inverses and distributivity to the opposite operation, such as [[AffineConstructive.theory.common_props.Associative_op]] and [[AffineConstructive.theory.common_props.RightIdentity_op]]: in each of them the swapped law is literally the original one, possibly with its sides exchanged, so one tactic handles all thirteen.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.common_props.Associative_op","base":"Associative_op","kind":"prf","start":82,"body":[83,85],"status":"ok","short":{"text":"The opposite of an associative operation is associative","status":"ok"},"proof":[{"text":"Unfolded, associativity of the opposite operation says f(f(z, y), x) = f(z, f(y, x)). This is the associativity law of f at z, y, x with its two sides exchanged, so it follows from H by the symmetry of equality.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.Commutative_op","base":"Commutative_op","kind":"prf","start":86,"body":[87,89],"status":"ok","short":{"text":"The opposite of a commutative operation is commutative","status":"ok"},"proof":[{"text":"Unfolded, commutativity of the opposite operation says f(y, x) = f(x, y). This is the commutativity law of f at y and x, and H gives it directly.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.BinaryIdempotent_op","base":"BinaryIdempotent_op","kind":"prf","start":90,"body":[91,93],"status":"ok","short":{"text":"The opposite of an idempotent binary operation is idempotent","status":"ok"},"proof":[{"text":"Swapping the two arguments of the pair (x, x) changes nothing, so idempotency of the opposite operation is the same statement as f(x, x) = x, which H provides.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.RightIdentity_op","base":"RightIdentity_op","kind":"prf","start":94,"body":[95,97],"status":"ok","short":{"text":"A left identity of f is a right identity of the opposite operation","status":"ok"},"proof":[{"text":"Unfolded, x being a right identity of the opposite operation says f(x, y) = y for every y. This is exactly the statement that x is a left identity of f, which is H.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.LeftIdentity_op","base":"LeftIdentity_op","kind":"prf","start":98,"body":[99,101],"status":"ok","short":{"text":"A right identity of f is a left identity of the opposite operation","status":"ok"},"proof":[{"text":"Unfolded, x being a left identity of the opposite operation says f(y, x) = y for every y. This is exactly the statement that x is a right identity of f, which is H.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.RightAbsorb_op","base":"RightAbsorb_op","kind":"prf","start":102,"body":[103,105],"status":"ok","short":{"text":"A left-absorbing element of f is right-absorbing for the opposite operation","status":"ok"},"proof":[{"text":"Unfolded, x being right-absorbing for the opposite operation says f(x, y) = x for every y. This is exactly the statement that x is left-absorbing for f, which is H.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.LeftAbsorb_op","base":"LeftAbsorb_op","kind":"prf","start":106,"body":[107,109],"status":"ok","short":{"text":"A right-absorbing element of f is left-absorbing for the opposite operation","status":"ok"},"proof":[{"text":"Unfolded, x being left-absorbing for the opposite operation says f(y, x) = x for every y. This is exactly the statement that x is right-absorbing for f, which is H.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.RightInverse_op","base":"RightInverse_op","kind":"prf","start":110,"body":[111,113],"status":"ok","short":{"text":"Left inverses for f are right inverses for the opposite operation","status":"ok"},"proof":[{"text":"Unfolded, i being a right inverse for the opposite operation with unit x says f(i y, y) = x for every y. This is exactly the left inverse law of f, which is H.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.LeftInverse_op","base":"LeftInverse_op","kind":"prf","start":114,"body":[115,117],"status":"ok","short":{"text":"Right inverses for f are left inverses for the opposite operation","status":"ok"},"proof":[{"text":"Unfolded, i being a left inverse for the opposite operation with unit x says f(y, i y) = x for every y. This is exactly the right inverse law of f, which is H.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.RightDistribute_op","base":"RightDistribute_op","kind":"prf","start":118,"body":[119,121],"status":"ok","short":{"text":"If f distributes over g on the left, the opposite of f distributes over g on the right","status":"ok"},"proof":[{"text":"The opposite operation sends (x, y) to f(y, x). So the right distributive law it must satisfy, at x, y and z, says that f(z, g(x, y)) equals g(f(z, x), f(z, y)). This is the left distributive law of f over g at the same three points, and the proof closes there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.LeftDistribute_op","base":"LeftDistribute_op","kind":"prf","start":122,"body":[123,125],"status":"ok","short":{"text":"If f distributes over g on the right, the opposite of f distributes over g on the left","status":"ok"},"proof":[{"text":"The opposite operation sends (x, y) to f(y, x). So the left distributive law it must satisfy, at x, y and z, says that f(g(y, z), x) equals g(f(y, x), f(z, x)). This is the right distributive law of f over g at the same three points, and the proof closes there.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.Distribute_op","base":"Distribute_op","kind":"prf","start":126,"body":[127,129],"status":"ok","short":{"text":"If a unary f distributes over g, it also distributes over the opposite of g","status":"ok"},"proof":[{"text":"The opposite of g sends (x, y) to g(y, x). So the goal at x and y asks that f(g(y, x)) equal g(f(y), f(x)). This is the hypothesis that f distributes over g, taken at the swapped pair (y, x).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.common_props.AntiDistribute_op","base":"AntiDistribute_op","kind":"prf","start":130,"body":[131,133],"status":"ok","short":{"text":"If f anti-distributes over g, it also anti-distributes over the opposite of g","status":"ok"},"proof":[{"text":"The opposite of g sends (x, y) to g(y, x). So the goal at x and y asks that f(g(y, x)) equal g(f(x), f(y)), and the right-hand side is the opposite of g applied to f(y) and f(x). This is the hypothesis that f anti-distributes over g, taken at the swapped pair (y, x).","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

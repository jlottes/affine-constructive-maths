al":true},{"s":1545,"e":1560,"lib":"AffineConstructive.theory.default_equality","name":"DefaultEquality","kind":"class","local":true},{"s":1635,"e":1652,"lib":"AffineConstructive.logic.aprop","name":"affirmative_aimpl","kind":"def","local":false,"page":"../logic/aprop.html"},{"s":1664,"e":1680,"lib":"AffineConstructive.theory.default_equality","name":"default_equality","kind":"def","local":true},{"s":1716,"e":1733,"lib":"AffineConstructive.logic.aprop","name":"affirmative_aimpl","kind":"def","local":false,"page":"../logic/aprop.html"},{"s":1794,"e":1809,"lib":"AffineConstructive.theory.default_equality","name":"DefaultEquality","kind":"class","local":true},{"s":1850,"e":1872,"lib":"AffineConstructive.theory.default_equality","name":"DefaultEquality_tensor","kind":"thm","local":true},{"s":430,"e":433,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":686,"e":689,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":690,"e":693,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1079,"e":1082,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1107,"e":1110,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1613,"e":1627,"lib":"AffineConstructive.theory.set","name":"unfold_pair_eq","kind":"ltac","local":false,"page":"set.html"},{"s":1658,"e":1661,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1687,"e":1690,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1735,"e":1738,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file introduces the discrete sets of the development: [[AffineConstructive.theory.default_equality.default_set_make]] equips any type with the affirmed strict equality [[AffineConstructive.interfaces.aprop.leq]] as its set equality, and the class [[AffineConstructive.theory.default_equality.DefaultEquality]] records that a set's equality is of this form. Such a set has affirmative equality ([[AffineConstructive.theory.default_equality.default_equality_affirmative]]), and every map out of it preserves equality ([[AffineConstructive.theory.default_equality.default_equality_is_fun]]), so that [[AffineConstructive.theory.default_equality.default_eq_func]] turns any bare map into a function of sets. The tensor product X ⊗ Y of two such sets again has default equality ([[AffineConstructive.theory.default_equality.DefaultEquality_tensor]]). It is the bridge by which inductive types such as the booleans and the naturals enter the theory of affine sets.","short":"Discrete sets: equality as affirmed strict equality, and maps out of them","items":[{"name":"AffineConstructive.theory.default_equality.default_set_make","base":"default_set_make","kind":"def","start":3,"body":null,"status":"ok","short":{"text":"The set on a type whose equality is strict equality, affirmed","status":"ok"},"long":{"text":"Builds an affine set from an arbitrary type by taking as its equality the relation [[AffineConstructive.interfaces.aprop.leq]]: x = y is the affirmation of the strict equality x ≡ y. That this relation is an affine equivalence is [[AffineConstructive.logic.relations.leq_equiv]], which a hint supplies to [[AffineConstructive.interfaces.set.set_make]] whenever a set is built on this equality.\n\nThis is the discrete set on a type, the one whose equality carries no information beyond the type's own: two elements are equal when they are identical, and apart only when that identity is refuted. It is the way an inductive type such as the booleans or the naturals enters the development as a set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.default_equality.DefaultEquality","base":"DefaultEquality","kind":"ind","start":4,"body":null,"status":"ok","short":{"text":"The class of sets whose equality is equivalent to strict equality, affirmed","status":"ok"},"long":{"text":"A set X has default equality when, for all x and y in X, x = y is equivalent, as affine propositions, to [[AffineConstructive.interfaces.aprop.leq]] (x, y), the affirmation of the strict equality x ≡ y. The equivalence is affine, so it carries both directions and both duals: equality is strict equality, and apartness is exactly its refutation.\n\nThe class records a property of a set rather than a construction, so that results proved for [[AffineConstructive.theory.default_equality.default_set_make]] also hold for any set whose equality happens to be of this form, the tensor product of two such sets among them ([[AffineConstructive.theory.default_equality.DefaultEquality_tensor]]). Its consequences are that equality is affirmative ([[AffineConstructive.theory.default_equality.default_equality_affirmative]]) and that every map out of such a set preserves equality ([[AffineConstructive.theory.default_equality.default_equality_is_fun]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.theory.default_equality.DefaultEquality","base":"DefaultEquality","kind":"rec","short":{"text":"The class of sets whose equality is strict equality, affirmed","status":"ok"}},{"name":"AffineConstructive.theory.default_equality.default_equality","base":"default_equality","kind":"proj","short":{"text":"The equivalence of x = y with the affirmed strict equality of x and y","status":"ok"}}]},{"name":"AffineConstructive.theory.default_equality.default_set_make_prop","base":"default_set_make_prop","kind":"prf","start":5,"body":[6,8],"status":"ok","short":{"text":"The set built on a type by default_set_make has default equality","status":"ok"},"proof":[{"text":"Once the definition is unfolded, it asks for the equality of the set to be equivalent to the affirmed strict equality for every pair of points. In [[AffineConstructive.theory.default_equality.default_set_make]] that is how the equality is defined, so each equivalence holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.default_equality.default_equality_affirmative","base":"default_equality_affirmative","kind":"prf","start":10,"body":[11,14],"status":"ok","short":{"text":"A set with default equality has affirmative equality","status":"ok"},"proof":[{"text":"Take two points x and y of X. It remains to show that the proposition x = y is affirmative.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.default_equality.default_equality]], x = y is equivalent to the affirmed strict equality of x and y. A proposition of the form !P is affirmative ([[AffineConstructive.logic.aprop.Affirmative_of_course]]), and being affirmative carries over along an equivalence.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.default_equality.coercion:default_equality_affirmative","base":"coercion:default_equality_affirmative","kind":"coercion","start":15,"body":null,"status":"ok","short":{"text":"A set with default equality serves wherever affirmative equality is asked for, through [[AffineConstructive.theory.default_equality.default_equality_affirmative]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.default_equality.default_equality_is_fun","base":"default_equality_is_fun","kind":"prf","start":17,"body":[18,23],"status":"ok","short":{"text":"Every map out of a set with default equality preserves equality","status":"ok"},"proof":[{"text":"Fix x and y in X. The goal is to show that x = y implies f x = f y.","status":"ok","from":0,"to":1},{"text":"Equality on X is affirmative ([[AffineConstructive.theory.default_equality.default_equality_affirmative]]), so by [[AffineConstructive.logic.aprop.affirmative_aimpl]] the affine implication follows from a base-logic implication. Contraposition comes along for free.","status":"ok","from":2,"to":2},{"text":"Use [[AffineConstructive.theory.default_equality.default_equality]] to replace the hypothesis x = y with the strict equality of x and y. Given that, x and y are the same point, and f x = f y holds by reflexivity.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.theory.default_equality.default_eq_func","base":"default_eq_func","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The function of sets given by any map out of a set with default equality","status":"ok"},"long":{"text":"Packages a bare map f from a set X with default equality into an arbitrary set Y as a function of sets, the proof that f preserves equality being [[AffineConstructive.theory.default_equality.default_equality_is_fun]]. Since equality on X is strict equality, affirmed, preservation of equality reduces to the fact that f sends identical arguments to identical values, and its dual, strong extensionality, comes with it because the equality is affirmative.\n\nThis is the discrete-domain case of [[AffineConstructive.interfaces.set.func_make]]: functions out of a discrete set need no extensionality argument at all.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.default_equality.DefaultEquality_tensor","base":"DefaultEquality_tensor","kind":"prf","start":29,"body":[30,41],"status":"ok","short":{"text":"The tensor product of two sets with default equality has default equality","status":"ok"},"proof":[{"text":"Take two pairs (x₁, y₁) and (x₂, y₂). Their equality in X ⊗ Y must be equivalent to their strict equality as pairs, and the proof gives the two implications one at a time.","status":"ok","from":0,"to":2},{"text":"First implication: in the tensor product, equality of pairs is x₁ = x₂ ⊠ y₁ = y₂. Each factor is affirmative, and a tensor of affirmative propositions is affirmative. So by [[AffineConstructive.logic.aprop.affirmative_aimpl]] a base-logic implication suffices.","status":"ok","from":3,"to":5},{"text":"Use [[AffineConstructive.theory.default_equality.default_equality]] to rewrite both factors as strict equalities. Once the two components agree, the pairs coincide, and the implication holds.","status":"ok","from":6,"to":7},{"text":"For the converse, the hypothesis is the affirmed strict equality of the pairs. It is affirmative, so again by [[AffineConstructive.logic.aprop.affirmative_aimpl]] a base-logic implication suffices.","status":"ok","from":8,"to":9},{"text":"If the two pairs are strictly equal, they are the same pair, and their equality in X ⊗ Y holds by reflexivity.","status":"ok","from":10,"to":11}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

id_Morphism f)).\n  apply affirmative_aimpl; simpl; intro.\n  now change (AdditiveMonoid_Morphism ((-) ∘ f)).\nQed.\nGlobal Hint Extern 2 (SubNearRing (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRing : typeclass_instances.\nGlobal Hint Extern 2 (SubNearRng (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRing : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSubGroup (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRing : typeclass_instances.\n\n\nLemma Additive_Monoid_EndFun_Ring `{AdditiveGroup X} `{!PointwiseOp (X:=X) (+) X} : Ring (E₊ X).\nProof. now apply alt_Build_Ring. Qed.\nGlobal Hint Extern 1 (Ring (subset_to_set (E₊ _))) => simple notypeclasses refine Additive_Monoid_EndFun_Ring : typeclass_instances.\nGlobal Hint Extern 1 (Rng (subset_to_set (E₊ _))) => simple notypeclasses refine Additive_Monoid_EndFun_Ring : typeclass_instances.\nGlobal Hint Extern 1 (LeftNearRing (subset_to_set (E₊ _))) => simple notypeclasses refine Additive_Monoid_EndFun_Ring : typeclass_instances.\nGlobal Hint Extern 1 (LeftNearRng (subset_to_set (E₊ _))) => simple notypeclasses refine Additive_Monoid_EndFun_Ring : typeclass_instances.\n\n\nSection add_int_act.\n  Universes i.\n  Context (ℤ:integers@{i}).\n  Context `{AdditiveNonComGroup@{i} X} `{!PointwiseOp (X:=X) (+) X} .\n\n  Local Abbreviation ϕ := (integers_to_group (ring_car (ints_ring ℤ)) (EndFun X)).\n\n  Definition add_int_act : ℤ ⊗ X ⇾ X := uncurry ϕ.\n  Local Notation \"x ∙ y\" := (func_op add_int_act (x, y)).\n\n  Lemma add_int_act_strong : StrongOp add_int_act.\n  Proof. exact (dec_strong_op_l _). Qed.\n\n  Lemma add_int_act_0_l : ∏ x, 0 ∙ x = 0 .\n  Proof. exact (preserves_0 ϕ). Qed.\n\n  Lemma add_int_act_1_l : ∏ x, 1 ∙ x = x .\n  Proof. exact (preserves_1 ϕ). Qed.\n\n  Lemma add_int_act_plus_l m n : ∏ x, (m + n) ∙ x = m ∙ x + n ∙ x.\n  Proof. exact (preserves_plus ϕ m n). Qed.\n\n  Lemma add_int_act_negate_l n : ∏ x, (-n) ∙ x = -(n ∙ x).\n  Proof. exact (preserves_negate ϕ n). Qed.\n\n  Lemma add_int_act_minus_l m n : ∏ x, (m - n) ∙ x = m ∙ x - n ∙ x.\n  Proof. exact (preserves_minus ϕ m n). Qed.\n\n  Local Open Scope mult_scope.\n\n  Lemma add_int_act_mult_l m n : ∏ x, (m · n) ∙ x = m ∙ (n ∙ x).\n  Proof. exact (preserves_mult ϕ m n). Qed.\n\n  Lemma add_int_act_add_mon2 {x} : AdditiveMonoid_Morphism (ap2 add_int_act x).\n  Proof. apply alt_Build_AdditiveMonoid_Morphism.\n  + intros m n. apply add_int_act_plus_l.\n  + apply add_int_act_0_l.\n  Qed.\n\n  Local Abbreviation E₀ := (ZeroSymmetricPart (EndFun X)).\n\n  Lemma add_int_act_0_r n : n ∙ 0 = 0 .\n  Proof. change (ϕ n 0 = 0).\n    rew <-exact:( integers_initial (from_subset _ ∘ integers_to_group ℤ E₀) ).\n    change ((?f ∘ ?g) ?x) with (f (g x)).\n    destruct (integers_to_group ℤ E₀ n) as [f Hf]. exact (Hf 0).\n  Qed.\nEnd add_int_act.\nArguments add_int_act_add_mon2 {_ X _ _ _ _ _ x}.\nGlobal Hint Extern 2 (AdditiveMonoid_Morphism (func_op (func_op ap2 (add_int_act _)) _) ) => simple notypeclasses refine add_int_act_add_mon2 : typeclass_instances.\nGlobal Hint Extern 2 (Zero_Pointed_Morphism (func_op (func_op ap2 (add_int_act _)) _) ) => simple notypeclasses refine add_int_act_add_mon2 : typeclass_instances.\n\n\nSection add_int_act.\n  Universes i.\n  Context (ℤ:integers@{i}).\n  Context `{AdditiveGroup@{i} X} `{!PointwiseOp (X:=X) (+) X} .\n\n  Local Notation \"x ∙ y\" := (func_op (add_int_act ℤ (X:=X)) (x, y)).\n  Local Notation \"( n ∙)\" := (func_op2 ap1 (add_int_act ℤ (X:=X)) n).\n  Local Abbreviation ϕ := (integers_to_group (ring_car (ints_ring ℤ)) (EndFun X)).\n  Local Abbreviation ε := (of_course_counit (EndFun X)).\n  Local Abbreviation i := (from_subset _).\n  Local Abbreviation ψ := (integers_to_group ℤ (E₊ X)).\n\n  Lemma add_int_act_add_mon1 {n} : AdditiveMonoid_Morphism (n∙).\n  Proof. change (AdditiveMonoid_Morphism (ϕ n)).\n    rew <-(integers_initial (ε ∘ i ∘ ψ)).\n    change (AdditiveMonoid_Morphism (ε (i (ψ n)))).\n    destruct (ψ n) as [f Hf]. exact Hf.\n  Qed.\n\n  Lemma add_int_act_plus_r n : ∏ x y, n ∙ (x + y) = n ∙ x + n ∙ y.\n  Proof.\n    refine (preserves_plus (n∙)).\n    exact add_int_act_add_mon1.\n  Qed.\nEnd add_int_act.\nGlobal Hint Extern 2 (AdditiveSemiGroup_Morphism (func_op (func_op ap1 (add_int_act _)) _) ) => simple notypeclasses refine add_int_act_add_mon1 : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveMonoid_Morphism (func_op (func_op ap1 (add_int_act _)) _) ) => simple notypeclasses refine add_int_act_add_mon1 : typeclass_instances.\nGlobal Hint Extern 2 (Zero_Pointed_Morphism (func_op (func_op ap1 (add_int_act _)) _) ) => simple notypeclasses refine add_int_act_add_mon1 : typeclass_instances.\n\n\nSection nat_to_int.\n  Universes i.\n  Context {ℕ:naturals@{i}} {ℤ:integers@{i}} (f:ℕ ⇾ ℤ) `{!Rig_Morphism f}.\n  Context `{AdditiveNonComGroup@{i} X} `{!PointwiseOp (X:=X) (+) X} .\n\n  Local Abbreviation ϕ := (naturals_to_mon (near_rig_car (near_rig ℕ)) (EndFun X)).\n  Local Abbreviation ψ := (integers_to_group (ring_car (ints_ring ℤ)) (EndFun X)).\n\n  Lemma int_act_nat_act n x : add_int_act ℤ (f n, x) = add_nat_act ℕ (n, x) .\n  Proof. exact (naturals_initial (ψ ∘ f) n x). Qed.\nEnd nat_to_int.\n\n","sentences":[{"i":0,"s":0,"e":64,"kind":"vernac","status":"ok","ms":31,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":65,"e":125,"kind":"vernac","status":"ok","ms":22,"messages":[],"goals":null},{"i":2,"s":126,"e":153,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":3,"s":154,"e":191,"kind":"vernac","status":"ok","ms":21,"messages":[],"goals":null},{"i":4,"s":192,"e":228,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":5,"s":229,"e":273,"kind":"vernac","status":"ok","ms":29,"messages":[],"goals":null},{"i":6,"s":274,"e":321,"kind":"vernac","status":"ok","ms":32,"messages":[],"goals":null},{"i":7,"s":322,"e":375,"kind":"vernac","status":"ok"," aces/pointwise.html"},{"s":6723,"e":6738,"lib":"AffineConstructive.interfaces.naturals","name":"naturals_to_mon","kind":"def","local":false,"page":"../interfaces/naturals.html"},{"s":6768,"e":6774,"lib":"AffineConstructive.theory.nat_action","name":"EndFun","kind":"def","local":false,"page":"nat_action.html"},{"s":6775,"e":6776,"lib":"AffineConstructive.theory.int_action","name":"nat_to_int.X","kind":"var","local":true},{"s":6740,"e":6752,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"near_rig_car","kind":"proj","local":false,"page":"../interfaces/bundled_algebra.html"},{"s":6754,"e":6762,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"near_rig","kind":"rec","local":false,"page":"../interfaces/bundled_algebra.html"},{"s":6763,"e":6764,"lib":"AffineConstructive.theory.int_action","name":"nat_to_int.ℕ","kind":"var","local":true},{"s":6807,"e":6824,"lib":"AffineConstructive.interfaces.integers","name":"integers_to_group","kind":"def","local":false,"page":"../interfaces/integers.html"},{"s":6851,"e":6857,"lib":"AffineConstructive.theory.nat_action","name":"EndFun","kind":"def","local":false,"page":"nat_action.html"},{"s":6858,"e":6859,"lib":"AffineConstructive.theory.int_action","name":"nat_to_int.X","kind":"var","local":true},{"s":6826,"e":6834,"lib":"AffineConstructive.interfaces.bundled_algebra","name":"ring_car","kind":"proj","local":false,"page":"../interfaces/bundled_algebra.html"},{"s":6836,"e":6845,"lib":"AffineConstructive.interfaces.integers","name":"ints_ring","kind":"proj","local":false,"page":"../interfaces/integers.html"},{"s":6846,"e":6847,"lib":"AffineConstructive.theory.int_action","name":"nat_to_int.ℤ","kind":"var","local":true},{"s":6894,"e":6905,"lib":"AffineConstructive.theory.int_action","name":"add_int_act","kind":"def","local":true},{"s":6909,"e":6910,"lib":"AffineConstructive.theory.int_action","name":"nat_to_int.f","kind":"var","local":true},{"s":6906,"e":6907,"lib":"AffineConstructive.theory.int_action","name":"nat_to_int.ℤ","kind":"var","local":true},{"s":6919,"e":6930,"lib":"AffineConstructive.theory.nat_action","name":"add_nat_act","kind":"def","local":false,"page":"nat_action.html"},{"s":6931,"e":6932,"lib":"AffineConstructive.theory.int_action","name":"nat_to_int.ℕ","kind":"var","local":true},{"s":6958,"e":6974,"lib":"AffineConstructive.interfaces.naturals","name":"naturals_initial","kind":"meth","local":false,"page":"../interfaces/naturals.html"},{"s":6976,"e":6977,"lib":"AffineConstructive.theory.int_action","name":"ψ","kind":"abbrev","local":true},{"s":6980,"e":6981,"lib":"AffineConstructive.theory.int_action","name":"nat_to_int.f","kind":"var","local":true},{"s":1971,"e":1974,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2527,"e":2530,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":4502,"e":4505,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":5714,"e":5717,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file builds the action of the integers on an additive group X, the counterpart of [[AffineConstructive.theory.nat_action.add_nat_act]] from theory/nat_action.v. The endomorphisms [[AffineConstructive.theory.nat_action.EndFun]] X form a near-ring under pointwise addition and composition ([[AffineConstructive.theory.int_action.EndFun_NearRing]]), and the additive monoid endomorphisms E₊ X form a sub-near-ring that is a ring when X is abelian ([[AffineConstructive.theory.int_action.Additive_Monoid_EndFun_Ring]]). The action [[AffineConstructive.theory.int_action.add_int_act]] is the canonical map from the integers into EndFun X, uncurried, and its laws in the integer argument (0 · x = 0, 1 · x = x, additivity, negation, subtraction, (m · n) · x = m · (n · x)) are the properties of that map; it is also strong, and n · 0 = 0 holds without commutativity. For abelian X each n · – is additive ([[AffineConstructive.theory.int_action.add_int_act_plus_r]]). Finally, [[AffineConstructive.theory.int_action.int_act_nat_act]] shows that along a rig morphism from the naturals to the integers, the integer action restricts to the natural-number action.","short":"The action of the integers on additive groups, through the endomorphism near-ring","items":[{"name":"AffineConstructive.theory.int_action.EndFun_NearRing","base":"EndFun_NearRing","kind":"prf","start":15,"body":[16,19],"status":"ok","short":{"text":"The endomorphisms X ⇾ X of an additive group, not necessarily commutative, form a near-ring under pointwise + and composition","status":"ok"},"proof":[{"text":"Build the near-ring with [[AffineConstructive.theory.rings.alt_Build_NearRing]], which asks for an additive group, a multiplicative monoid and right distributivity. Composition with the identity is a monoid by [[AffineConstructive.theory.nat_action.EndFun_mult_mon]], and right distributivity comes from the near-rig of endomorphisms of the underlying additive monoid, [[AffineConstructive.theory.nat_action.EndFun_NearRig]]. What remains is that the endomorphisms form an additive group.","status":"ok","from":0,"to":1},{"text":"Pointwise addition and negation make the functions X ⇾ X a group, not necessarily commutative, by [[AffineConstructive.theory.pointwise.pointwise_add_nc_grp]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.int_action.EndFun_AdditiveGroup","base":"EndFun_AdditiveGroup","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"For an abelian additive group X, the endomorphisms EndFun X form an abelian group under pointwise +, −, 0","status":"ok"},"long":{"text":"For an abelian additive group X, the set [[AffineConstructive.theory.nat_action.EndFun]] X of all functions X ⇾ X carries the abelian group structure computed pointwise: (f + g) x = f x + g x, (−f) x = −(f x), and 0 is the constant zero function. It is the instance [[AffineConstructive.theory.pointwise.pointwise_add_grp]] at the domain X, stated for EndFun X so that resolution finds it there directly.\n\nThe near-ring [[AffineConstructive.theory.int_action.EndFun_NearRing]] records only that the pointwise addition on EndFun X is a group, which is all that holds when X is not commutative; this definition adds commutativity when X has it. In the recorded development it is used in one proof step of this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.int_action.Additive_Monoid_EndFun_SubNearRing","base":"Additive_Monoid_EndFun_SubNearRing","kind":"prf","start":26,"body":[27,34],"status":"ok","short":{"text":"For an abelian group X, the additive endomorphisms E₊ X form a sub-near-ring of the endomorphism near-ring","status":"ok"},"proof":[{"text":"An abelian group is a commutative additive monoid, so E₊ X is already a sub-near-rig of the endomorphisms by [[AffineConstructive.theory.nat_action.Additive_Monoid_EndFun_SubNearRig]].","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.subrings.alt_Build_SubNearRing2]] it suffices to show that E₊ X is closed under +, composition and negation and contains 1. The sub-near-rig provides everything except closure under negation.","status":"ok","from":2,"to":2},{"text":"Fix an endomorphism f. Membership in E₊ X means that f is, of course, an additive monoid morphism, so the goal is that this property of f implies the same property of −f.","status":"ok","from":3,"to":4},{"text":"Because an of-course proposition is affirmative, a base-logic implication is enough ([[AffineConstructive.logic.aprop.affirmative_aimpl]]). So assume f is an additive monoid morphism.","status":"ok","from":5,"to":5},{"text":"The pointwise negative −f is the composite of negation with f. In an abelian group negation is an additive monoid morphism ([[AffineConstructive.theory.additive_groups.negate_mon_mor]]), and a composite of additive monoid morphisms is again one ([[AffineConstructive.theory.additive_groups.compose_addmon_mor]]).","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.theory.int_action.Additive_Monoid_EndFun_Ring","base":"Additive_Monoid_EndFun_Ring","kind":"prf","start":38,"body":[39,41],"status":"ok","short":{"text":"For an abelian group X, the additive monoid endomorphisms E₊ X form a ring","status":"ok"},"proof":[{"text":"Apply [[AffineConstructive.theory.rings.alt_Build_Ring]]. E₊ X is a rig by [[AffineConstructive.theory.nat_action.Additive_Monoid_EndFun_Rig]], which supplies the multiplicative monoid and both distributive laws. As an additive subgroup of the abelian group of endomorphisms, E₊ X is an abelian group ([[AffineConstructive.theory.int_action.EndFun_AdditiveGroup]], [[AffineConstructive.theory.subrings.sub_add_group_abgroup]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.int_action.add_int_act","base":"add_int_act","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"The action ℤ ⊗ X ⇾ X of the integers on an additive group, n · x","status":"ok"},"long":{"text":"The integer multiple n · x of an element x of an additive group X, not necessarily commutative, defined by uncurrying the canonical map ℤ ⇾ [[AffineConstructive.theory.nat_action.EndFun]] X that sends n to the endomorphism x ↦ n · x. The canonical map is the one the integers carry by their universal property, [[AffineConstructive.interfaces.integers.integers_to_group]], into the additive group of endomorphisms with the identity as its distinguished element; that this map is also multiplicative, with composition as multiplication, follows from [[AffineConstructive.theory.int_action.EndFun_NearRing]] and the initiality of ℤ.\n\nThe domain is the tensor product ℤ ⊗ X, the natural one for an uncurried function of sets. Since ℤ has decidable equality the action also preserves the cartesian equality ([[AffineConstructive.theory.int_action.add_int_act_strong]]). The laws in the integer argument are the preservation laws of the canonical map; those in the group argument come from the sub-near-rings of endomorphisms fixing 0 or preserving addition. The action extends the natural-number action [[AffineConstructive.theory.nat_action.add_nat_act]] ([[AffineConstructive.theory.int_action.int_act_nat_act]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.int_action.add_int_act_strong","base":"add_int_act_strong","kind":"prf","start":53,"body":[54,56],"status":"ok","short":{"text":"The integer action is strong: it preserves the cartesian equality of ℤ × X, since ℤ has decidable equality","status":"ok"},"proof":[{"text":"The integers have decidable equality ([[AffineConstructive.theory.integers.integers_dec_eq]]), and a function on a tensor product whose left factor has decidable equality is strong ([[AffineConstructive.theory.set.dec_strong_op_l]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.int_action.add_int_act_0_l","base":"add_int_act_0_l","kind":"prf","start":57,"body":[58,60],"status":"ok","short":{"text":"0 · x = 0 for every x","status":"ok"},"proof":[{"text":"The canonical map ϕ from ℤ into the near-ring of endomorphisms ([[AffineConstructive.theory.int_action.EndFun_NearRing]]) is an additive monoid morphism, so it sends 0 to the zero endomorphism ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]). Evaluated at x, this says 0 · x = 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.int_action.add_int_act_1_l","base":"add_int_act_1_l","kind":"prf","start":61,"body":[62,64],"status":"ok","short":{"text":"1 · x = x for every x","status":"ok"},"proof":[{"text":"The canonical map ϕ from ℤ into the endomorphism near-ring sends 1 to the identity, the unit for composition ([[AffineConstructive.interfaces.abstract_algebra.preserves_1]]). Evaluated at x, this says 1 · x = x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.int_action.add_int_act_plus_l","base":"add_int_act_plus_l","kind":"prf","start":65,"body":[66,68],"status":"ok","short":{"text":"(m + n) · x = m · x + n · x for every x","status":"ok"},"proof":[{"text":"The canonical map ϕ preserves sums ([[AffineConstructive.theory.additive_groups.preserves_plus]]): ϕ(m + n) is the pointwise sum ϕ m + ϕ n. Evaluated at x, this is the stated law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.int_action.add_int_act_negate_l","base":"add_int_act_negate_l","kind":"prf","start":69,"body":[70,72],"status":"ok","short":{"text":"(−n) · x = −(n · x) for every x","status":"ok"},"proof":[{"text":"Because the canonical map ϕ preserves sums between additive groups, it also preserves negation ([[AffineConstructive.theory.additive_groups.preserves_negate]]): ϕ(−n) is the pointwise negative of ϕ n. Evaluated at x, this gives (−n) · x = −(n · x).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.int_action.add_int_act_minus_l","base":"add_int_act_minus_l","kind":"prf","start":73,"body":[74,76],"status":"ok","short":{"text":"(m − n) · x = m · x − n · x for every x","status":"ok"},"proof":[{"text":"In the same way, the canonical map ϕ preserves differences ([[AffineConstructive.theory.additive_groups.preserves_minus]]), so ϕ(m − n) = ϕ m − ϕ n pointwise. Evaluated at x, this is the stated law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.int_action.add_int_act_mult_l","base":"add_int_act_mult_l","kind":"prf","start":78,"body":[79,81],"status":"ok","short":{"text":"(m · n) · x = m · (n · x) for every x","status":"ok"},"proof":[{"text":"The canonical map from the integers into a near-ring is a rig morphism ([[AffineConstructive.theory.integers.integers_to_near_ring_mor]]), so it preserves products ([[AffineConstructive.theory.multiplicative_groups.preserves_mult]]). In the endomorphism near-ring the product is composition, so ϕ(m · n) = ϕ m ∘ ϕ n. Evaluated at x, this gives (m · n) · x = m · (n · x).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.int_action.add_int_act_add_mon2","base":"add_int_act_add_mon2","kind":"prf","start":82,"body":[83,90],"status":"ok","short":{"text":"For fixed x, the map n ↦ n · x is an additive monoid morphism from ℤ to X","status":"ok"},"proof":[{"text":"An additive monoid morphism is built from two facts: that it preserves sums and that it sends 0 to 0. Two goals remain: (m + n) · x = m · x + n · x, and 0 · x = 0.","status":"ok","from":0,"to":1},{"text":"Fix integers m and n. Preservation of sums is the distributive law in the integer argument, [[AffineConstructive.theory.int_action.add_int_act_plus_l]].","status":"ok","from":2,"to":4},{"text":"Preservation of zero is the law 0 · x = 0, [[AffineConstructive.theory.int_action.add_int_act_0_l]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.int_action.E₀","base":"E₀","kind":"abbrev","start":91,"body":null,"status":"ok","short":{"text":"Local abbreviation for the zero-symmetric part of EndFun X: the endomorphisms f with f 0 = 0","status":"ok"},"long":{"text":"A local abbreviation, in the first section on the integer action, for [[AffineConstructive.theory.subrings.ZeroSymmetricPart]] of [[AffineConstructive.theory.nat_action.EndFun]] X: the endomorphisms f with f · 0 = 0. Multiplication in EndFun X is composition and 0 is the constant zero function, so f · 0 is the constant function at f 0, and the condition says f 0 = 0. The zero-symmetric part of a near-ring is a sub-near-ring, so the integers map into it canonically by [[AffineConstructive.interfaces.integers.integers_to_group]]. It is used within this file only.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.int_action.add_int_act_0_r","base":"add_int_act_0_r","kind":"prf","start":92,"body":[93,99],"status":"ok","short":{"text":"n · 0 = 0 for every integer n","status":"ok"},"proof":[{"text":"Unfold n · 0 to the canonical map ϕ from ℤ into the endomorphisms of X, applied at n and evaluated at 0. Because ℤ is initial, ϕ equals the composite of the canonical map into the zero-symmetric part E₀ with the inclusion of E₀ into the endomorphisms. This applies because E₀ is a sub-near-ring ([[AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRng]]), so the inclusion is a morphism.","status":"ok","from":0,"to":2},{"text":"The image of n in E₀ is an endomorphism f together with a proof that f belongs to E₀, which says that f is zero-symmetric: f 0 = 0. That is exactly the goal.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.theory.int_action.ε","base":"ε","kind":"abbrev","start":111,"body":null,"status":"ok","short":{"text":"Local name for the counit from the of-course set of endomorphisms to the endomorphisms","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.theory.set.of_course_counit]] at [[AffineConstructive.theory.nat_action.EndFun]] X, the map !(EndFun X) ⇾ EndFun X that is the identity on elements. Membership in the subset E₊ X of additive endomorphisms is an of-course proposition, so the carrier of E₊ X lives over the of-course set; composing with ε and the inclusion i returns an element of EndFun X itself.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.int_action.i","base":"i","kind":"abbrev","start":112,"body":null,"status":"ok","short":{"text":"Local name for the inclusion of a subset into its ambient set","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.subset.from_subset]], the inclusion U ⇾ X of the members of a subset. Here it is applied to the additive endomorphisms E₊ X, so that the canonical map of the integers into the ring E₊ X, followed by i and the counit ε, can be compared with the canonical map into [[AffineConstructive.theory.nat_action.EndFun]] X by initiality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.int_action.add_int_act_add_mon1","base":"add_int_act_add_mon1","kind":"prf","start":114,"body":[115,121],"status":"ok","short":{"text":"For an abelian group X and fixed n, the map x ↦ n · x is an additive monoid morphism","status":"ok"},"proof":[{"text":"Here the group X is abelian, and the goal is that x ↦ n · x is a morphism of additive monoids. Unfold this map to ϕ n, where ϕ is the canonical map from ℤ into the endomorphisms. Because ℤ is initial, ϕ equals the composite of three maps: the canonical map ψ into the ring E₊ X of additive endomorphisms, the inclusion i of E₊ X into the endomorphisms, and the counit ε. This uses [[AffineConstructive.theory.int_action.Additive_Monoid_EndFun_SubNearRing]] to know that the inclusion is a morphism.","status":"ok","from":0,"to":2},{"text":"The element ψ n of E₊ X is an endomorphism f together with a proof that f belongs to E₊ X. That proof says that f is an additive monoid morphism, which is the goal.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.theory.int_action.add_int_act_plus_r","base":"add_int_act_plus_r","kind":"prf","start":122,"body":[123,126],"status":"ok","short":{"text":"In an abelian group, n · (x + y) = n · x + n · y for all x and y","status":"ok"},"proof":[{"text":"Every additive semigroup morphism preserves sums, so it is enough to show that x ↦ n · x is one. It is, because it is an additive monoid morphism by [[AffineConstructive.theory.int_action.add_int_act_add_mon1]].","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.theory.int_action.ϕ","base":"ϕ","kind":"abbrev","start":135,"body":null,"status":"ok","short":{"text":"Local name for the canonical map from the integers into a group of endomorphisms","status":"ok"},"long":{"text":"A local abbreviation for the canonical map [[AffineConstructive.interfaces.integers.integers_to_group]] from the ring of integers ℤ into [[AffineConstructive.theory.nat_action.EndFun]] X, the endomorphisms of the additive group X with pointwise addition and the identity as distinguished element. It sends n to the function x ↦ x + ⋯ + x (n times, or the negation of that for negative n). Since EndFun X is a near-ring and ϕ is the unique morphism out of ℤ preserving + and 1, ϕ preserves everything the near-ring has, which is how the laws of [[AffineConstructive.theory.int_action.add_int_act]] are proved.\n\nIn the section relating the two actions the same name denotes instead the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from the naturals into EndFun X, the natural-number counterpart.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.int_action.ψ","base":"ψ","kind":"abbrev","start":136,"body":null,"status":"ok","short":{"text":"Local name for the canonical map from the integers into the ring of additive endomorphisms","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.integers.integers_to_group]] from ℤ into E₊ X, the ring of additive monoid endomorphisms of an abelian group X ([[AffineConstructive.theory.int_action.Additive_Monoid_EndFun_Ring]]). Its values are endomorphisms together with the evidence that they preserve + and 0. By the initiality of ℤ its composite into [[AffineConstructive.theory.nat_action.EndFun]] X is the map defining [[AffineConstructive.theory.int_action.add_int_act]], so each n · (−) inherits that evidence ([[AffineConstructive.theory.int_action.add_int_act_add_mon1]]).\n\nIn the section relating the integer and natural actions the same name denotes instead the canonical map from ℤ into EndFun X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.int_action.int_act_nat_act","base":"int_act_nat_act","kind":"prf","start":137,"body":[138,140],"status":"ok","short":{"text":"Along a rig morphism f : ℕ ⇾ ℤ, the integer action at f n agrees with the natural action at n","status":"ok"},"proof":[{"text":"Two rig morphisms from ℕ into the endomorphism near-ring of X agree: the canonical map behind the natural-number action, and the composite of f with the canonical map ψ from ℤ into the endomorphisms. They agree because ℕ is initial. Evaluating both at n and at x gives the equation.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.pointwise":{"page":"../interfaces/pointwise.html","short":"Pointwise lifting of operations to function sets, for strong operations or affirmative domains","summary":"The file lifts operations on affine sets to the functions into them. A unary function f : X ⇾ Y lifts by post-composition ([[pointwise_func]]) with no further hypothesis. A binary operation f : X ⊗ Y ⇾ Z does not lift in general, because the point d at which g and h are evaluated is needed by both arguments of f while the equality d = d' may be used only once; the class [[PointwiseOp]] records that the lift exists, and [[pointwise_op]] then gives the function (g, h) ↦ (d ↦ f(g d, h d)). Two sufficient conditions are proved: f is strong, so that it preserves the cartesian equality and the two argument equalities can be proved additively ([[StrongOp_PointWiseOp]]), or D has affirmative equality, so that d = d' may be duplicated ([[AffEq_PointWiseOp]]). Both are registered for resolution, with the strong case tried first."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.subset":{"page":"../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.theory.bundled_groups":{"page":"bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."},"AffineConstructive.theory.projected_set":{"page":"projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.theory.rings":{"page":"rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.subrings":{"page":"subrings.html","short":"Subrings and sub-near-rings: builders, induced structure, images, preimages, zero-symmetric part","summary":"This file carries the substructure theory of `theory/subgroups.v` over to ring-like structures. It first restates the subsemigroup, submonoid and subgroup results in additive and multiplicative form (builders from closure conditions, the full subset, the induced operations, the inclusion as a morphism, images and preimages), then treats the sub-near-rg, sub-near-rig, sub-near-rng and sub-near-ring predicates: their builders from closure under +, · and −, invariance under equality of subsets, the induced near-ring, ring and commutative ring structures on a substructure, the inclusion as an rg or rig morphism, and the stability of these substructures under images and preimages. It closes with the zero-symmetric part N₀ = { n | n · 0 = 0 } of a right near-ring, shown to be a substructure of whichever kind N is. The results are instances found by resolution, so a subset closed under the ring operations is a ring wherever one is needed."},"AffineConstructive.theory.naturals":{"page":"naturals.html","short":"General theory of the naturals: uniqueness, NNO, commutative rig, cancellation, induction","summary":"This file develops the general theory of the [[Naturals]] interface, which characterises the natural numbers as a near-rig initial among additive monoids with a chosen 1. It shows that any two models are isomorphic through their canonical maps ([[naturals_to_naturals_bijective]]), that a retract of a model is again a model ([[retract_is_nat]]), and that every model is a natural numbers object ([[naturals_nno]]) via the concrete naturals [[Nat]]. On the algebraic side, every model is a commutative rig ([[naturals_is_com_rig]]), its canonical map into any near-rig is a rig morphism ([[naturals_to_mon_rig_mor]]), 1 ≠ 0 holds, addition cancels, there are no zero divisors in the strong sense, and x + y = 0 if and only if x = 0 ⊠ y = 0 ([[zero_sum]]). The file also gives induction principles phrased with 1 + n in place of the successor ([[naturals_ind]], [[naturals_ind_alt]], the tactic [[naturals_induction]]), the distance lemma [[naturals_distance]], and facts about negating the images of naturals in near-rings and rings."},"AffineConstructive.theory.integers":{"page":"integers.html","short":"The integers: initiality, group completion of the naturals, decidability and integral domain","summary":"The file develops the integers from their defining property, initiality among additive groups with a distinguished element 1. Two morphisms out of Z that preserve addition, zero and 1 are equal ([[integers_initial_alt]]), so the canonical map between any two models of the integers is a bijection ([[integers_to_integers_bijective]]). In both directions the integers are the group completion of the naturals: a ring that is the group completion of N along a rig morphism is a model of the integers ([[naturals_completion_integers]]), which makes the Grothendieck group of the naturals one, and conversely the canonical map from N exhibits any model as the group completion of N ([[integers_group_completion]]). From that it follows that the map from N is injective, that every integer is a difference of naturals ([[integers_split_spec]]) and is n or −n for some natural n ([[integers_decompose]]), and that Z has decidable equality, is an integral domain and has strongly no zero divisors. The canonical map into any near-ring preserves multiplication as well ([[integers_to_near_ring_mor]]), and a ring onto which Z retracts by additive morphisms preserving 1 is itself a model of the integers ([[retract_is_int]])."},"AffineConstructive.theory.pointwise":{"page":"pointwise.html","short":"Algebraic laws and structures lifted from X to functions D ⇾ X pointwise","summary":"The file shows that the algebraic laws and structures of a set X carry over to the function set D ⇾ X under the pointwise operations, with constant functions as distinguished elements. The first part lifts single laws: associativity, commutativity, idempotence, absorption, distributivity, identities, absorbing elements and inverses on X give the same laws for [[pointwise_op]], [[pointwise_func]] and [[const]] on D ⇾ X. Each holds because equality of functions is checked point by point, and at each point the law is the law on X. Global hints make these lemmas available to resolution throughout the development. The second part builds on them to lift semigroups, monoids, groups and abelian groups, semilattices and bounded semilattices, lattices and distributive lattices to D ⇾ X, together with their additive, multiplicative, meet and join forms. These are local instances, used under the operations that local hints supply for the file. The interface file `interfaces/pointwise.v` provides the pointwise lifts and the condition [[PointwiseOp]] that they preserve equality."},"AffineConstructive.theory.of_course_set":{"page":"of_course_set.html","short":"Algebraic structures lifted from X to !X; the counit is a morphism","summary":"The file shows that the set !X, whose elements are those of X with the affirmed equality, carries every algebraic structure that X carries. The operations of X are lifted along [[of_course_op]] and [[of_course_map]], and the constants are reused unchanged. First the single laws are transferred one at a time: associativity, commutativity, idempotency, absorption, distributivity, identities, absorbing elements and inverses. From these laws the file builds instances that make !X a semigroup, monoid or group (commutative or not), a semilattice, lattice or distributive lattice, and a near-rg, rg, rig, rng or ring in all the left, right and commutative variants. It also shows that the counit ε : !X ⇾ X preserves units, zero, one, top and bottom, and is a semigroup, monoid, rg and rig morphism. These results are registered for instance resolution, so algebra on X can be used inside the of-course modality without further work."},"AffineConstructive.theory.nat_action":{"page":"nat_action.html","short":"The action of the naturals on an additive monoid, through its endomorphism near-rig","summary":"This file builds the action of the naturals on an additive monoid X, n · x = x + ⋯ + x. The action comes from the canonical map of ℕ into the endomorphisms of X rather than from a recursion. The endomorphisms X ⇾ X form a right near-rig under pointwise addition and composition. The canonical map [[naturals_to_mon]] into it, uncurried, is the action [[add_nat_act]]. Because that map preserves 0, 1, + and ·, the action satisfies 0 · x = 0, 1 · x = x, (m + n) · x = m · x + n · x and (m · n) · x = m · (n · x). The laws in the second argument come from uniqueness of maps out of the naturals ([[naturals_initial]]). The canonical map factors through a sub-near-rig, so every n acts by an endomorphism of that sub-near-rig. The zero-symmetric part gives n · 0 = 0. When X is commutative, the additive monoid endomorphisms E₊ X form a rig ([[Additive_Monoid_EndFun_Rig]]), which gives n · (x + y) = n · x + n · y."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

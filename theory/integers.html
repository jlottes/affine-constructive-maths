e naturals_completion_to_group : IntegersToGroup Z.\n  Proof. intros R; intros. exact (from_group_completion2 i (naturals_to_mon N R)). Defined.\n\n  Lemma naturals_completion_integers : Integers Z.\n  Proof. split; [ exact _ | intros R; intros; unfold integers_to_group, naturals_completion_to_group ..]; try exact _.\n    apply (from_group_completion2_unique _).\n    exact (naturals_initial _).\n  Qed.\nEnd from_group_completion.\n\nGlobal Hint Extern 2 (IntegersToGroup (GrothendieckPairs ?N))\n  => notypeclasses refine (naturals_completion_to_group (to_grothendieck_group N)) : typeclass_instances.\nGlobal Hint Extern 2 (Integers (GrothendieckPairs ?N))\n  => notypeclasses refine (naturals_completion_integers (to_grothendieck_group N)) : typeclass_instances.\n\n\n(** The integers are the group completion of the naturals *)\n\nSection is_group_completion.\n  Universes i.\n  Context `{Integers@{i} Z} `{Naturals@{i} N}.\n  Local Abbreviation i := (naturals_to_mon N Z).\n\n  Instance integers_from_group_completion : FromGroupCompletion i := λ G f Hf, integers_to_group Z G (oG:=f 1).\n\n  Instance integers_group_completion : GroupCompletion i.\n  Proof. split; try exact _. intros G f ?.\n    unfold from_group_completion, integers_from_group_completion.\n    simple refine (let oG : One G := f 1 in _); try exact _.\n    assert (One_Pointed_Morphism f) by now change (f 1 = f 1).\n    assert (One_Pointed_Morphism (integers_to_group Z G (oG:=f 1))) by (exact (preserves_1 _)).\n    split.\n  + exact _.\n  + exact (naturals_initial_alt _ _).\n  + intros h ? E. simple refine (integers_initial h); try exact _.\n    change (h 1 = f 1). now rew [ <-E | <-(preserves_1 i) ].\n  Qed.\n\n  Instance naturals_to_integers_inj : Injective (naturals_to_mon N Z).\n  Proof. exact (to_group_completion_inj _). Qed.\n\n  Definition integers_split : Z → N ⊗ N := group_completion_split i.\n\n  Context (f:N ⇾ Z) `{!AdditiveMonoid_Morphism f, !One_Pointed_Morphism f}.\n\n  Instance naturals_to_integers_inj_alt : Injective f.\n  Proof. now rew (naturals_initial f). Qed.\n\n  Import projection_notation.\n  Lemma integers_split_spec (x:Z) : x = f (π₁ (integers_split x)) - f (π₂ (integers_split x)).\n  Proof. rew (naturals_initial f). unfold integers_split.\n    exact (group_completion_split_spec i x).\n  Qed.\n\n  Lemma integers_decompose (x:Z) : ∐ (n:N), x = f n ∨ x = -(f n).\n  Proof. generalize (integers_split_spec x).\n    destruct (integers_split x) as [a b]; unfold proj1, proj2.\n    intros E; rew E; clear x E.\n    pose proof naturals_distance a b as [n [E|E]]; \n      exists n; [ rew <-E; right | rew E; left ]; rew (preserves_plus f _ _).\n    1: rew (negate_plus_distr _ _).\n    2: rew <-(associativity (+) _ _ _), (commutativity (+) (f n) _).\n    all: rew (associativity (+) _ _ _), (plus_negate_r _); exact (plus_0_l _).\n  Qed.\nEnd is_group_completion.\nGlobal Hint Extern 2 (FromGroupCompletion (naturals_to_mon _ _)) => simple notypeclasses refine integers_from_group_completion : typeclass_instances.\nGlobal Hint Extern 2 (GroupCompletion (naturals_to_mon _ _)) => simple notypeclasses refine integers_group_completion : typeclass_instances.\n\n\n(** Properties that follow from being the group completion of the naturals *)\n\nSection properties.\n  Universes u.\n  Context `{Integers@{u} Z}.\n  Local Abbreviation i := (naturals_to_mon Nat Z).\n\n  Instance integers_dec_eq : DecidableEquality Z.\n  Proof. exact (group_completion_dec_eq i). Qed.\n\n  Lemma integers_int_domain : IntegralDomain Z.\n  Proof. exact (group_completion_int_domain (i:=i)). Qed.\n\n  Let inst : IntegralDomain Z.  Proof. exact integers_int_domain. Qed.\n\n  Lemma integers_strong_no_zero_divisors : StrongNoZeroDivisors Z.\n  Proof. exact dec_strong_no_zero_divisors. Qed.\nEnd properties.\nCoercion integers_dec_eq : Integers >-> DecidableEquality.\nCoercion integers_int_domain : Integers >-> IntegralDomain.\nCoercion integers_strong_no_zero_divisors : Integers >-> StrongNoZeroDivisors.\n\nCoercion integers_as_com_ring (Z:integers) := make_commutative_ring Z.\nGlobal Hint Extern 2 (StripCoercions (integers_as_com_ring ?X)) => strip_coercions_chain X : strip_coercions.\n\nSection properties.\n  Universes u.\n  Context `{Integers@{u} Z} `{NearRing@{u} R}.\n  Local Abbreviation i := (naturals_to_mon Nat Z).  (* i : Nat ⇾ Z *)\n  Local Abbreviation ϕ := (naturals_to_mon Nat R).  (* ϕ : Nat ⇾ R *)\n  Local Abbreviation ψ := (integers_to_group Z R).  (* ψ : Z ⇾ R *)\n  Local Open Scope mult_scope.\n\n  Lemma integers_to_near_ring_mor : Rig_Morphism ψ.\n  Proof. split; try exact _. apply alt_Build_MultiplicativeMonoid_Morphism; [ | exact (preserves_1 _) ].\n    intros x y.\n    pose proof integers_decompose i x as [n[E|E]]; rew E; clear x E.\n    all: pose proof integers_decompose i y as [m[E|E]]; rew E; clear y E.\n    2: rew <-(negate_mult_distr_r _ _).\n    3: rew <-(negate_mult_distr_l _ _).\n    4: rew (negate_mult_negate _ _).\n    2,3,4: rew (preserves_negate ψ _).\n    all: rew <-(preserves_mult i _ _); change (ψ (i ?n)) with ((ψ ∘ i) n); rew (naturals_initial (ψ ∘ i)).\n    + exact (preserves_mult ϕ _ _).\n    + rew (naturals_to_near_ring_negate_mult_r _).\n      rew (preserves_mult ϕ _ _). sym. now apply associativity.\n    + rew (preserves_mult ϕ _ _). exact (negate_mult_distr_l _ _).\n    + rew (naturals_to_near_ring_negate_mult_r n), <-(associativity (·) _ _ _).\n      rew <-(negate_mult _), (involutive_alt (-) _).\n      exact (preserves_mult ϕ _ _).\n  Qed.\nEnd properties.\n\nGlobal Hint Extern 2 (Rig_Morphism (integers_to_group _ _)) => simple notypeclasses refine integers_to_near_ring_mor : typeclass_instances.\nGlobal Hint Extern 2 (Rg_Morphism (integers_to_group _ _)) => simple notypeclasses refine integers_to_near_ring_mor : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeMonoid_Morphism (integers_to_group _ _)) => simple notypeclasses refine integers_to_near_ring_mor : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSemiGroup_Morphism (integers_to_group _ _)) => simple notypeclasses refine integers_to_near_ring_mor : typeclass_instances.\n\n\nSection retract_is_int.\n  Local Open Scope fun_inv_scope.\n  Context `{Integers Z} `{Ring R} (f:Z ⇾ R).\n  Context `{!Surjective f (inv:=f_inv)}.\n  Context `{!AdditiveMonoid_Morphism f, !AdditiveMonoid_Morphism f⁻¹}.\n  Context `{!One_Pointed_Morphism f, !One_Pointed_Morphism f⁻¹}.\n\n  Instance retract_is_int_to_group : IntegersToGroup R.\n  Proof. intros G; intros. exact (integers_to_group Z G ∘ f⁻¹). Defined.\n\n  Lemma retract_is_int : Integers R.\n  Proof. split; [ exact _ | intros G; intros; unfold integers_to_group, retract_is_int_to_group .. ]; try exact _.\n    rew <-(surjective_compose_cancel f _ _).\n    exact (integers_initial_alt _ _).\n  Qed.\nEnd retract_is_int.\n","sentences":[{"i":0,"s":0,"e":35,"kind":"vernac","status":"ok","ms":34,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":36,"e":115,"kind":"vernac","status":"ok","ms":20,"messages":[],"goals":null},{"i":2,"s":116,"e":159,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":3,"s":160,"e":251,"kind":"vernac","status":"ok","ms":42,"messages":[],"goals":null},{"i":4,"s":252,"e":323,"kind":"vernac","status":"ok","ms":24,"messages":[],"goals":null},{"i":5,"s":324,"e":394,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":6,"s":395,"e":448,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":7,"s":451,"e":666,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":{"fg":[{"id":"58","name":null,"hyps":["bb1caf799d2ae7e4","91cc86a94092aba7","f582422e18e144e4","a500a72649e4c89a","d71ea706f51bc971","465ac905cc6a09f4","25a92d7a8d05a485","a5aea12339dd3e54","ce715168f9286300","26a3a1e4bdee64f4","366f2e94da68705d","7540d5549fc52a37","29475119808930fe","4633770dc1afba02","9f77ac146cd8ed1a","c11535771953ada8","49f22db2ddc293e1","2956c cs/rewrite/rewrite.html"},{"s":6625,"e":6628,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6691,"e":6694,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6765,"e":6768,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6816,"e":6819,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6844,"e":6847,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":6849,"e":6852,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6880,"e":6883,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6947,"e":6950,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":7027,"e":7030,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":8299,"e":8302,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file develops the integers from their defining property, initiality among additive groups with a distinguished element 1. Two morphisms out of Z that preserve addition, zero and 1 are equal ([[AffineConstructive.theory.integers.integers_initial_alt]]), so the canonical map between any two models of the integers is a bijection ([[AffineConstructive.theory.integers.integers_to_integers_bijective]]). In both directions the integers are the group completion of the naturals: a ring that is the group completion of N along a rig morphism is a model of the integers ([[AffineConstructive.theory.integers.naturals_completion_integers]]), which makes the Grothendieck group of the naturals one, and conversely the canonical map from N exhibits any model as the group completion of N ([[AffineConstructive.theory.integers.integers_group_completion]]). From that it follows that the map from N is injective, that every integer is a difference of naturals ([[AffineConstructive.theory.integers.integers_split_spec]]) and is n or −n for some natural n ([[AffineConstructive.theory.integers.integers_decompose]]), and that Z has decidable equality, is an integral domain and has strongly no zero divisors. The canonical map into any near-ring preserves multiplication as well ([[AffineConstructive.theory.integers.integers_to_near_ring_mor]]), and a ring onto which Z retracts by additive morphisms preserving 1 is itself a model of the integers ([[AffineConstructive.theory.integers.retract_is_int]]).","short":"The integers: initiality, group completion of the naturals, decidability and integral domain","items":[{"name":"AffineConstructive.theory.integers.integers_initial_alt","base":"integers_initial_alt","kind":"prf","start":7,"body":[8,10],"status":"ok","short":{"text":"Two additive monoid morphisms from the integers into an additive group that preserve 1 are equal","status":"ok"},"proof":[{"text":"Both f and g are additive monoid morphisms that preserve 1, so the uniqueness clause of [[AffineConstructive.interfaces.integers.Integers]] makes each of them equal to the canonical map of Z into G. Then f = g by transitivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.integers.integers_to_integers_bijective","base":"integers_to_integers_bijective","kind":"prf","start":13,"body":[14,16],"status":"ok","short":{"text":"The canonical map between two models of the integers is a bijection, with the reverse canonical map as inverse","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.set.alt_Build_Bijective]] it suffices that the canonical map Z₂ → Z₁ is a two-sided inverse of the canonical map Z₁ → Z₂. Each composite, Z₁ → Z₁ or Z₂ → Z₂, is a 1-preserving additive monoid morphism, and so is the identity. By [[AffineConstructive.theory.integers.integers_initial_alt]] each composite therefore equals the identity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.integers.naturals_completion_to_group","base":"naturals_completion_to_group","kind":"inst","start":25,"body":[26,29],"status":"ok","short":{"text":"A group completion of the naturals has canonical maps into pointed additive groups, by extension along it","status":"ok"},"proof":[{"text":"Fix an additive group R, not necessarily commutative, together with a chosen element 1. A map Z → R is required.","status":"ok","from":0,"to":1},{"text":"Take the canonical additive monoid morphism from the naturals into R, the one that sends 1 to the chosen 1. The map Z → R is its extension along i, which exists because Z is the group completion of the naturals.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.integers.naturals_completion_integers","base":"naturals_completion_integers","kind":"prf","start":30,"body":[31,35],"status":"ok","short":{"text":"A ring that is the group completion of the naturals along a rig morphism is the integers","status":"ok"},"proof":[{"text":"Z is a ring by hypothesis. The canonical maps of [[AffineConstructive.theory.integers.naturals_completion_to_group]] are additive monoid morphisms that preserve 1, and this is found automatically. What remains is uniqueness: fix a pointed additive group R and a 1-preserving additive monoid morphism h : Z → R. It must be shown that h equals the extension along i of the canonical map from the naturals into R.","status":"ok","from":0,"to":1},{"text":"By the uniqueness of extensions along a group completion, [[AffineConstructive.theory.group_completion.from_group_completion2_unique]], it suffices to show that h ∘ i equals the canonical map from the naturals into R.","status":"ok","from":2,"to":2},{"text":"The composite h ∘ i is an additive monoid morphism out of the naturals, and it preserves 1 because both h and i do. By the initiality of the naturals it is the canonical map.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.integers.integers_from_group_completion","base":"integers_from_group_completion","kind":"inst","start":43,"body":null,"status":"ok","short":{"text":"The extension operation of the integers as group completion of the naturals: the canonical map to G","status":"ok"},"long":{"text":"The extension operation ([[AffineConstructive.interfaces.group_completion.FromGroupCompletion]]) that the integers carry as a candidate group completion of the naturals along [[AffineConstructive.interfaces.naturals.naturals_to_mon]]. Given an additive group G and an additive monoid morphism f from the naturals into G, the extension is the canonical map [[AffineConstructive.interfaces.integers.integers_to_group]] into G, with the element f 1 taken as the distinguished one of G.\n\nNo extension needs to be built: a monoid morphism out of the naturals is determined by where it sends 1, and the integers map uniquely into any additive group once a point is chosen for 1. That this operation satisfies the universal property is [[AffineConstructive.theory.integers.integers_group_completion]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.integers_group_completion","base":"integers_group_completion","kind":"inst","start":44,"body":[45,62],"status":"ok","short":{"text":"The canonical map from the naturals exhibits the integers as their group completion","status":"ok"},"proof":[{"text":"The structural parts of a group completion are found automatically: the naturals form an additive monoid, i is a morphism, and the extension operation is the one given by the canonical maps of the integers. What remains is the universal property of that extension.","status":"ok","from":0,"to":1},{"text":"Fix an additive group G and an additive monoid morphism f from the naturals into G. The extension of f is the canonical map of Z into G. That map depends on a choice of 1 in G.","status":"ok","from":2,"to":3},{"text":"Give G the point f 1. With that choice f preserves 1 by definition. The canonical map Z → G also preserves 1, by [[AffineConstructive.interfaces.abstract_algebra.preserves_1]].","status":"ok","from":4,"to":6},{"text":"Three things are to be shown: that the canonical map is an additive monoid morphism, that it extends f, and that it is the only such morphism. The first holds because the canonical map is an additive monoid morphism by construction.","status":"ok","from":7,"to":9},{"text":"The composite of the canonical map with i, and f itself, are both 1-preserving additive monoid morphisms out of the naturals. By [[AffineConstructive.theory.naturals.naturals_initial_alt]] they are equal.","status":"ok","from":10,"to":11},{"text":"For uniqueness, let h : Z → G be an additive monoid morphism with h ∘ i = f. By the initiality of the integers, h equals the canonical map provided h preserves 1, and this is all that remains.","status":"ok","from":12,"to":14},{"text":"The goal is h 1 = f 1. Since i preserves 1, h 1 = h (i 1). By the equality h ∘ i = f this is f 1, by [[AffineConstructive.interfaces.abstract_algebra.preserves_1]].","status":"ok","from":15,"to":17}]},{"name":"AffineConstructive.theory.integers.naturals_to_integers_inj","base":"naturals_to_integers_inj","kind":"inst","start":63,"body":[64,66],"status":"ok","short":{"text":"The canonical map from the naturals into the integers is injective","status":"ok"},"proof":[{"text":"The integers are the group completion of the naturals along this map, and addition of naturals cancels by [[AffineConstructive.theory.naturals.naturals_add_cancel]]. The map into the group completion of a cancellative monoid is injective by [[AffineConstructive.theory.group_completion.to_group_completion_inj]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.integers.integers_split","base":"integers_split","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"Splits an integer into a pair (a, b) of naturals whose difference it is","status":"ok"},"long":{"text":"The splitting of an integer x into a pair (a, b) of naturals with x = a − b, where the naturals are carried into Z by the canonical map. It is [[AffineConstructive.theory.group_completion.group_completion_split]] instantiated at the canonical map from the naturals into the integers, which [[AffineConstructive.theory.integers.integers_group_completion]] shows to be a group completion. The pair is taken in the tensor product N ⊗ N.\n\nThe splitting is a plain function from the elements of Z to pairs, not a morphism of sets: nothing asserts that equal integers receive equal pairs, only that each pair recovers its integer. [[AffineConstructive.theory.integers.integers_split_spec]] states that defining equation, x = f a − f b, for any additive monoid morphism f from the naturals that preserves 1, all of which agree with the canonical map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.naturals_to_integers_inj_alt","base":"naturals_to_integers_inj_alt","kind":"inst","start":69,"body":[70,72],"status":"ok","short":{"text":"Any additive monoid morphism from the naturals into the integers preserving 1 is injective","status":"ok"},"proof":[{"text":"By the initiality of the naturals, f equals the canonical map from the naturals into Z. That map is injective by [[AffineConstructive.theory.integers.naturals_to_integers_inj]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.integers.integers_split_spec","base":"integers_split_spec","kind":"prf","start":74,"body":[75,79],"status":"ok","short":{"text":"Every integer x equals f a − f b for the pair (a, b) that integers_split assigns to it","status":"ok"},"proof":[{"text":"By the initiality of the naturals, f equals the canonical map i. The equation can therefore be stated with i in place of f.","status":"ok","from":0,"to":1},{"text":"The split of an integer is its split in the group completion of the naturals. So the equation is the defining property of that split, [[AffineConstructive.theory.group_completion.group_completion_split_spec]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.integers.integers_decompose","base":"integers_decompose","kind":"prf","start":80,"body":[81,89],"status":"ok","short":{"text":"Every integer is f n or −f n for some natural n","status":"ok"},"proof":[{"text":"Write x as f a − f b, where (a, b) is the split of x given by [[AffineConstructive.theory.integers.integers_split_spec]]. Substitute this for x. It remains to find n with f a − f b = f n or f a − f b = −f n.","status":"ok","from":0,"to":3},{"text":"By [[AffineConstructive.theory.naturals.naturals_distance]] there is an n with a + n = b or a = b + n, and in either case n is the witness. If a + n = b, choose the second disjunct: the goal is f a − (f a + f n) = −f n. If a = b + n, choose the first: the goal is f b + f n − f b = f n. In both cases f is first distributed over the sum by [[AffineConstructive.theory.additive_groups.preserves_plus]].","status":"ok","from":4,"to":4},{"text":"In the first case, distribute the negation by [[AffineConstructive.theory.additive_groups.negate_plus_distr]], which gives f a + (−f a − f n). In the second case, reassociate and commute so that the sum reads f b + (−f b + f n).","status":"ok","from":5,"to":6},{"text":"In both cases, reassociate so that the term cancels against its negative by [[AffineConstructive.theory.additive_groups.plus_negate_r]]. What is left is 0 plus the required term, which equals that term by [[AffineConstructive.theory.additive_groups.plus_0_l]].","status":"ok","from":7,"to":8}]},{"name":"AffineConstructive.theory.integers.integers_dec_eq","base":"integers_dec_eq","kind":"inst","start":97,"body":[98,100],"status":"ok","short":{"text":"The integers have decidable equality","status":"ok"},"proof":[{"text":"The integers are the group completion of the naturals, whose addition cancels and whose equality is decidable. By [[AffineConstructive.theory.group_completion.group_completion_dec_eq]] the group completion of such a monoid has decidable equality.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.integers.integers_int_domain","base":"integers_int_domain","kind":"prf","start":101,"body":[102,104],"status":"ok","short":{"text":"The integers form an integral domain","status":"ok"},"proof":[{"text":"The integers are the group completion of the naturals ([[AffineConstructive.theory.integers.integers_group_completion]]). The naturals are a nontrivial commutative strongly linearly ordered rig with 1 ≠ 0, so their ring completion is an integral domain by [[AffineConstructive.theory.group_completion.group_completion_int_domain]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.integers.properties.let:inst","base":"let:inst","kind":"let","start":105,"body":[106,108],"status":"ok","short":{"text":"The integers Z form an integral domain, by [[AffineConstructive.theory.integers.integers_int_domain]], held as a hypothesis for the section's proofs","status":"ok"},"proof":[{"text":"That Z is an integral domain is the content of [[AffineConstructive.theory.integers.integers_int_domain]], which applies because Z is assumed to be a model of the integers. Stating it here as a section hypothesis lets instance resolution reach everything that follows from an integral domain, such as the ring structure and the cancellation of nonzero factors, without having to search for it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.integers.integers_strong_no_zero_divisors","base":"integers_strong_no_zero_divisors","kind":"prf","start":109,"body":[110,112],"status":"ok","short":{"text":"In the integers, x · y = 0 implies x = 0 or y = 0, with the additive or","status":"ok"},"proof":[{"text":"The integers are an integral domain, so they have no zero divisors in the par sense. Their equality is decidable ([[AffineConstructive.theory.integers.integers_dec_eq]]), and with decidable equality the par form strengthens to the additive or by [[AffineConstructive.theory.rings.dec_strong_no_zero_divisors]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.integers.coercion:integers_dec_eq","base":"coercion:integers_dec_eq","kind":"coercion","start":114,"body":null,"status":"ok","short":{"text":"Any model of the integers has decidable equality, through [[AffineConstructive.theory.integers.integers_dec_eq]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.coercion:integers_int_domain","base":"coercion:integers_int_domain","kind":"coercion","start":115,"body":null,"status":"ok","short":{"text":"Any model of the integers is an integral domain, through [[AffineConstructive.theory.integers.integers_int_domain]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.coercion:integers_strong_no_zero_divisors","base":"coercion:integers_strong_no_zero_divisors","kind":"coercion","start":116,"body":null,"status":"ok","short":{"text":"Any model of the integers has no zero divisors in the strong form, through [[AffineConstructive.theory.integers.integers_strong_no_zero_divisors]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.integers_as_com_ring","base":"integers_as_com_ring","kind":"def","start":117,"body":null,"status":"ok","short":{"text":"A bundled model of the integers viewed as a bundled commutative ring","status":"ok"},"long":{"text":"The coercion from the bundled integers [[AffineConstructive.interfaces.integers.integers]] to bundled commutative rings, built by [[AffineConstructive.interfaces.bundled_algebra.make_commutative_ring]], which finds the operations and laws by resolution. Commutativity of multiplication comes from [[AffineConstructive.theory.integers.integers_int_domain]], itself a consequence of the integers being the group completion of the naturals.\n\nIt lets a model of the integers be used wherever a commutative ring is expected; the accompanying hint tells the coercion-stripping tactic to see through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.i","base":"i","kind":"abbrev","start":122,"body":null,"status":"ok","short":{"text":"Local name for the canonical map from the naturals into the integers","status":"ok"},"long":{"text":"A local abbreviation, inside the sections of the file, for [[AffineConstructive.interfaces.naturals.naturals_to_mon]] at the integers: the map sending n to 1 + ⋯ + 1, from the naturals (a given model N, or the concrete Nat) into Z. It is the map along which Z is shown to be the group completion of the naturals, and through which properties of the naturals are transported to the integers. As an abbreviation it is notation only, not a constant of its own.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.ϕ","base":"ϕ","kind":"abbrev","start":123,"body":null,"status":"ok","short":{"text":"Local name for the canonical map from the naturals into a near-ring R","status":"ok"},"long":{"text":"A local abbreviation, in the section on maps into near-rings, for [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from Nat into the near-ring R. It is the comparison map through which multiplicativity of the canonical map from the integers is reduced to that of the naturals: on the image of the naturals, the map from Z composed with the inclusion of Nat is ϕ, by [[AffineConstructive.interfaces.naturals.naturals_initial]]. Notation only, not a constant of its own.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.ψ","base":"ψ","kind":"abbrev","start":124,"body":null,"status":"ok","short":{"text":"Local name for the canonical map from the integers into a near-ring R","status":"ok"},"long":{"text":"A local abbreviation, in the section on maps into near-rings, for [[AffineConstructive.interfaces.integers.integers_to_group]] from Z into the near-ring R, with the unit of R as distinguished element. The section proves it is a rig morphism, [[AffineConstructive.theory.integers.integers_to_near_ring_mor]]: the canonical additive map also preserves multiplication. Notation only, not a constant of its own.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.integers.integers_to_near_ring_mor","base":"integers_to_near_ring_mor","kind":"prf","start":126,"body":[127,152],"status":"ok","short":{"text":"The canonical map from the integers into any near-ring is a rig morphism","status":"ok"},"proof":[{"text":"The canonical map ψ is already an additive monoid morphism that preserves 1. What remains is that it is a multiplicative monoid morphism.","status":"ok","from":0,"to":1},{"text":"It preserves 1, so it remains to show that it preserves products. Fix integers x and y and show ψ(x · y) = ψ x · ψ y.","status":"ok","from":2,"to":3},{"text":"By [[AffineConstructive.theory.integers.integers_decompose]], x is i n or −i n for some natural n, and y is i m or −i m for some natural m, where i is the canonical map from the naturals. This gives four cases, one for each choice of signs.","status":"ok","from":4,"to":5},{"text":"In the integers, which form a ring, the signs come out of each product: −(i n · i m) in the two mixed cases, and i n · i m in the case where both signs are negative, since (−a)(−b) = ab. Since ψ preserves negation ([[AffineConstructive.theory.additive_groups.preserves_negate]]), the sign then also comes out of ψ.","status":"ok","from":6,"to":9},{"text":"Since i preserves multiplication, i n · i m = i(n · m). The composite ψ ∘ i is a 1-preserving additive monoid morphism out of the naturals, so it equals the canonical map ϕ into R. Each case is now an identity about ϕ in the near-ring R.","status":"ok","from":10,"to":10},{"text":"In the case where both signs are positive, the identity says that ϕ preserves multiplication, which holds because ϕ is a rig morphism ([[AffineConstructive.theory.naturals.naturals_to_mon_rig_mor]]).","status":"ok","from":11,"to":12},{"text":"In the case where only y is negative, a near-ring has only one distributive law, so −ϕ(k) is rewritten as ϕ(k) · −1 on both sides ([[AffineConstructive.theory.naturals.naturals_to_near_ring_negate_mult_r]]). Once ϕ(n · m) is expanded to ϕ n · ϕ m, the two sides agree by associativity.","status":"ok","from":13,"to":17},{"text":"In the case where only x is negative, expanding ϕ(n · m) = ϕ n · ϕ m reduces the identity to −(a · b) = (−a) · b. This law holds in a right near-ring ([[AffineConstructive.theory.rings.negate_mult_distr_l]]).","status":"ok","from":18,"to":20},{"text":"In the case where both signs are negative, write −ϕ n as ϕ n · −1 and reassociate. Then (−1) · (−ϕ m) = −(−ϕ m) = ϕ m by [[AffineConstructive.theory.rings.negate_mult]] and the involutivity of negation. What is left is ϕ(n · m) = ϕ n · ϕ m, which holds because ϕ preserves multiplication.","status":"ok","from":21,"to":25}]},{"name":"AffineConstructive.theory.integers.retract_is_int_to_group","base":"retract_is_int_to_group","kind":"inst","start":164,"body":[165,168],"status":"ok","short":{"text":"Canonical maps out of R, by composing the inverse of f with the canonical maps out of Z","status":"ok"},"proof":[{"text":"Fix an additive group G with a chosen element 1. A map R ⇾ G is required.","status":"ok","from":0,"to":1},{"text":"Take the inverse f⁻¹ followed by the canonical map from the integers into G.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.integers.retract_is_int","base":"retract_is_int","kind":"prf","start":169,"body":[170,174],"status":"ok","short":{"text":"A ring onto which the integers map surjectively, with a pointed additive inverse map, is the integers","status":"ok"},"proof":[{"text":"R is a ring, and the map into a pointed additive group G given by [[AffineConstructive.theory.integers.retract_is_int_to_group]] is a 1-preserving additive morphism, as a composite of such maps. For uniqueness, let h : R ⇾ G be an additive monoid morphism that preserves 1. It remains to show that h equals the canonical map composed with f⁻¹.","status":"ok","from":0,"to":1},{"text":"Since f is surjective, it cancels on the right ([[AffineConstructive.theory.set.surjective_compose_cancel]]). So it suffices to show that h ∘ f equals the canonical map composed with f⁻¹ ∘ f.","status":"ok","from":2,"to":2},{"text":"Both sides are additive monoid morphisms from the integers into G that preserve 1, because composites of such maps are again such maps. Hence they are equal by [[AffineConstructive.theory.integers.integers_initial_alt]].","status":"ok","from":3,"to":4}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.integers":{"page":"../interfaces/integers.html","short":"Interface for the integers as the free group on one generator, and ordered integers","summary":"The file gives the interface for the integers, characterised by a universal property. [[IntegersToGroup]] supplies a canonical map from Z into every additive group with a distinguished element, and [[Integers]] states that Z is a ring for which this map is the unique additive morphism preserving 1, so that Z is the free group on one generator. The bundled record [[integers]] packages a ring with this structure, and [[OrderedIntegers]] adds a strong linear refutative ring order, giving the integers as an ordered ring. The theory of the integers and their concrete models build on these classes."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.naturals":{"page":"../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.interfaces.group_completion":{"page":"../interfaces/group_completion.html","short":"Universal property of the group completion of an additive monoid","summary":"This file states the universal property of the group completion (Grothendieck group) of an additive monoid. A map i : M ⇾ K from an additive monoid to an additive group comes with an extension operation, [[FromGroupCompletion]], that turns each monoid morphism f : M ⇾ A into a map K ⇾ A, where A is any additive group, abelian or not. [[FromGroupCompletionProp]] says that a map g is the unique monoid morphism with g ∘ i = f. [[GroupCompletion]] requires this of the extension for every such f, which makes K the free group on M. The file is an interface only: it proves nothing, and concrete models such as the integers over the naturals provide instances."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.theory.rings":{"page":"rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.bundled_rings":{"page":"bundled_rings.html","short":"Categories of near-rigs, rigs, near-rings and rings, and their forgetful coercions","summary":"The file makes categories of the bundled ring-like structures of `interfaces/bundled_algebra.v`, continuing what `theory/bundled_groups.v` does for monoids and groups. One identity, [[near_rig_id]], and one composition, [[near_rig_morphism_compose]], serve for all six categories, [[𝐍𝐞𝐚𝐫𝐑𝐢𝐠]], [[𝐑𝐢𝐠]], [[𝐂𝐑𝐢𝐠]], [[𝐍𝐞𝐚𝐫𝐑𝐢𝐧𝐠]], [[𝐑𝐢𝐧𝐠]] and [[𝐂𝐑𝐢𝐧𝐠]], because each of these structures has the near-rig morphisms as its morphisms. In every case the category laws hold because the laws hold for the underlying functions, and morphisms are equal when their functions are. The file also gives the forgetful passages from a ring-like structure to its additive monoid or group and to its multiplicative monoid, and from a near-rig morphism to the matching additive and multiplicative monoid morphisms, so that results about groups and monoids apply directly to rings."},"AffineConstructive.orders.rings":{"page":"../orders/rings.html","short":"Ordered rigs and rings: compatibility of multiplication with the order, signs, squares, the nonnegative cone","summary":"This file develops ordered rigs and rings, that is, rigs with a strong, linear, refutative order that addition preserves and that obeys the strict compatibility law [[mult_lt_compat_full]]. Rings are the same but with closure of the positive cone under products. The order passes to the opposite ring, so each result about multiplication on the left gives its right-hand version for free. The non-strict compatibility law [[mult_le_compat_full]] is derived from the strict one through linearity and refutativity. [[strong_linear_refutative_rig_order_from_partial_minus]] builds a rig order from a partial subtraction and closure of the positive elements under products, and it shows that every ring order is a rig order. The consequences follow from these laws: no zero divisors, and cancellation by elements apart from 0. Multiplication by a nonnegative element preserves the order and multiplication by a nonpositive one reverses it. Multiplication by a positive or a negative element is an order embedding, order-preserving or order-reversing according to the sign. A square is nonnegative, and positive when the element is apart from 0, which gives 0 ≤ 1 and 0 ≤ 2, and also 0 < 1, 0 < 2 and 2 ≠ 0 when 1 ≠ 0. The file closes with the swap law [[minus_le_swap]] for differences and with the nonnegative cone R⁺, which is a sub-near-rig and carries the same kind of order."},"AffineConstructive.theory.naturals":{"page":"naturals.html","short":"General theory of the naturals: uniqueness, NNO, commutative rig, cancellation, induction","summary":"This file develops the general theory of the [[Naturals]] interface, which characterises the natural numbers as a near-rig initial among additive monoids with a chosen 1. It shows that any two models are isomorphic through their canonical maps ([[naturals_to_naturals_bijective]]), that a retract of a model is again a model ([[retract_is_nat]]), and that every model is a natural numbers object ([[naturals_nno]]) via the concrete naturals [[Nat]]. On the algebraic side, every model is a commutative rig ([[naturals_is_com_rig]]), its canonical map into any near-rig is a rig morphism ([[naturals_to_mon_rig_mor]]), 1 ≠ 0 holds, addition cancels, there are no zero divisors in the strong sense, and x + y = 0 if and only if x = 0 ⊠ y = 0 ([[zero_sum]]). The file also gives induction principles phrased with 1 + n in place of the successor ([[naturals_ind]], [[naturals_ind_alt]], the tactic [[naturals_induction]]), the distance lemma [[naturals_distance]], and facts about negating the images of naturals in near-rings and rings."},"AffineConstructive.orders.naturals":{"page":"../orders/naturals.html","short":"The order on the naturals: x ≤ y as ∐ z, y = x + z, its properties and embeddings","summary":"The file develops the order theory of the naturals, working in both directions from the characterisation x ≤ y ⧟ ∐ z, y = x + z. Starting from an ordered model of the naturals, it proves that every natural is at least 0, that x ≤ y is equivalent to x < 1 + y ([[naturals_le_plus_1]]) and x < y to 1 + x ≤ y ([[naturals_lt_plus_1]]), and that the order is the one given by the characterisation ([[naturals_le_plus]]). From this it shows that every rig morphism into a strong linear refutative rig order with 1 ≠ 0 is an order embedding ([[naturals_to_rig_ord_embedding]]). In the other direction, [[alt_Build_OrderedNaturals]] starts from an order assumed only to satisfy the characterisation and shows that it is affirmative, decidable, total and translation-invariant, which makes an ordered naturals. Applied to the order defined by that formula, [[naturals_le]], this gives the default order [[naturals_le_order]] and multiplicative cancellation by nonzero elements. Finally, the comparison-with-difference operation of a model gives a correct three-way comparison ([[naturals_trich_correct]])."},"AffineConstructive.theory.group_completion":{"page":"group_completion.html","short":"Group completions: uniqueness, decomposition as differences, transfer of equality, order and ring structure","summary":"This file develops the general theory of a group completion i : M ⇾ K of a commutative monoid, given by the universal property of [[GroupCompletion]] rather than by a construction. It extends monoid morphisms into any additive group ([[from_group_completion2]]), shows that any two completions are isomorphic ([[group_completion_iso]]), and writes every element of K as a difference i p − i n ([[group_completion_decompose]]) by comparison with the Grothendieck group. When M is cancellative, i is injective, and strength and decidable, refutative and affirmative equality pass from M to K. On the order side, an order on K that compares differences as a + d ≤ c + b makes K an ordered group with i an order embedding ([[group_completion_add_grp_order]]), and strong, linear, total, refutative, affirmative and decidable orders transfer. For a rig M completed into a ring, extensions of rig morphisms are rig morphisms, and commutativity, nontriviality, the ordered-ring structure ([[group_completion_ring_order]]) and being an integral domain ([[group_completion_int_domain]]) transfer; each result is also registered for the Grothendieck pairs of [[GrothendieckPairs]]."},"AffineConstructive.implementations.nat":{"page":"../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.implementations.grothendieck_group":{"page":"../implementations/grothendieck_group.html","short":"The Grothendieck group of a commutative monoid, its universal property, order and ring structure","summary":"This file constructs the Grothendieck group of a commutative additive monoid M as the quotient of M ⊗ M by the relation (a, b) ~ (c, d) when there is k with a + d + k = c + b + k. The relation is an equivalence and a congruence for addition, and negation swaps the two components, so the quotient is an abelian group. The map [[to_grothendieck_group]], a ↦ (a, 0), is a monoid morphism. With [[from_grothendieck_group]] as the extension operation, it is the group completion of M ([[grothendieck_group_is_completion]]), with the universal property taken against all additive groups, abelian or not. When addition on M cancels, equality of pairs reduces to a + d = c + b. Under that hypothesis the embedding is injective, and affirmative, refutative or decidable equality, and the strong-set structure, pass from M to its Grothendieck group; affirmative equality passes without cancellation. The file also defines the order induced by an ordered monoid and shows that a strong rig's Grothendieck group is a ring, commutative when the rig is, with the embedding a rig morphism."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

instances.\nGlobal Hint Extern 2 (Lattice AProp_set) => refine AProp_lattice : typeclass_instances.\nGlobal Hint Extern 2 (MeetSemiLattice AProp_set) => refine AProp_lattice : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLattice AProp_set) => refine AProp_lattice : typeclass_instances.\nGlobal Hint Extern 2 (BoundedMeetSemiLattice AProp_set) => refine AProp_lattice : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLattice AProp_set) => refine AProp_lattice : typeclass_instances.\n\nLemma anot_lat_mor : BoundedLattice_Flip_Morphism anot.\nProof. split; try exact _; tautological. Qed.\nGlobal Hint Extern 2 (BoundedLattice_Flip_Morphism anot) => refine anot_lat_mor : typeclass_instances.\nGlobal Hint Extern 2 (BoundedMeetSemiLattice_Flip_Morphism anot) => refine anot_lat_mor : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLattice_Flip_Morphism anot) => refine anot_lat_mor : typeclass_instances.\nGlobal Hint Extern 2 (Lattice_Flip_Morphism anot) => refine anot_lat_mor : typeclass_instances.\nGlobal Hint Extern 2 (MeetSemiLattice_Flip_Morphism anot) => refine anot_lat_mor : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLattice_Flip_Morphism anot) => refine anot_lat_mor : typeclass_instances.\n\n\nDefinition alt_Build_MeetSemiLattice : ∀ `{Meet L},\n   @Associative L (⊓)\n → Commutative (X:=L) (⊓)\n → @BinaryIdempotent L (⊓)\n → MeetSemiLattice L\n:= @alt_Build_SemiLattice.\n\nDefinition alt_Build_JoinSemiLattice : ∀ `{Join L},\n   @Associative L (⊔)\n → Commutative (X:=L) (⊔)\n → @BinaryIdempotent L (⊔)\n → JoinSemiLattice L\n:= @alt_Build_SemiLattice.\n\nDefinition meet_ass `{MeetSemiLattice L} : Associative (X:=L) (⊓) := _.\nDefinition join_ass `{JoinSemiLattice L} : Associative (X:=L) (⊔) := _.\nDefinition meet_com `{MeetSemiLattice L} : Commutative (X:=L) (⊓) := _.\nDefinition join_com `{JoinSemiLattice L} : Commutative (X:=L) (⊔) := _.\nDefinition meet_idm `{MeetSemiLattice L} : BinaryIdempotent (X:=L) (⊓) := _.\nDefinition join_idm `{JoinSemiLattice L} : BinaryIdempotent (X:=L) (⊔) := _.\nGlobal Hint Extern 2 (Associative (⊓)) => simple notypeclasses refine meet_ass : typeclass_instances.\nGlobal Hint Extern 2 (Associative (⊔)) => simple notypeclasses refine join_ass : typeclass_instances.\nGlobal Hint Extern 2 (Commutative (⊓)) => simple notypeclasses refine meet_com : typeclass_instances.\nGlobal Hint Extern 2 (Commutative (⊔)) => simple notypeclasses refine join_com : typeclass_instances.\nGlobal Hint Extern 2 (BinaryIdempotent (⊓)) => simple notypeclasses refine meet_idm : typeclass_instances.\nGlobal Hint Extern 2 (BinaryIdempotent (⊔)) => simple notypeclasses refine join_idm : typeclass_instances.\n\nDefinition alt_Build_BoundedMeetSemiLattice : ∀ `{Meet L} `{Top L},\n   @Associative L (⊓)\n → Commutative (X:=L) (⊓)\n → @BinaryIdempotent L (⊓)\n → LeftIdentity  (X:=L) (⊓) ⊤\n → BoundedMeetSemiLattice L\n:= @alt_Build_BoundedSemiLattice.\n\nDefinition alt_Build_BoundedJoinSemiLattice : ∀ `{Join L} `{Bottom L},\n   @Associative L (⊔)\n → Commutative (X:=L) (⊔)\n → @BinaryIdempotent L (⊔)\n → LeftIdentity  (X:=L) (⊔) ⊥\n → BoundedJoinSemiLattice L\n:= @alt_Build_BoundedSemiLattice.\n\nDefinition meet_top_l `{BoundedMeetSemiLattice L} : LeftIdentity (X:=L) (⊓) ⊤ := _.\nDefinition meet_top_r `{BoundedMeetSemiLattice L} : RightIdentity (X:=L) (⊓) ⊤ := _.\nDefinition join_bot_l `{BoundedJoinSemiLattice L} : LeftIdentity (X:=L) (⊔) ⊥ := _.\nDefinition join_bot_r `{BoundedJoinSemiLattice L} : RightIdentity (X:=L) (⊔) ⊥ := _.\nGlobal Hint Extern 2 (LeftIdentity  (⊓) _) => simple notypeclasses refine meet_top_l : typeclass_instances.\nGlobal Hint Extern 2 (RightIdentity (⊓) _) => simple notypeclasses refine meet_top_r : typeclass_instances.\nGlobal Hint Extern 2 (LeftIdentity  (⊔) _) => simple notypeclasses refine join_bot_l : typeclass_instances.\nGlobal Hint Extern 2 (RightIdentity (⊔) _) => simple notypeclasses refine join_bot_r : typeclass_instances.\n\nDefinition bounded_meet_sl_is_sl `{BoundedMeetSemiLattice L} : MeetSemiLattice L := _.\nDefinition bounded_join_sl_is_sl `{BoundedJoinSemiLattice L} : JoinSemiLattice L := _.\nCoercion bounded_meet_sl_is_sl : BoundedMeetSemiLattice >-> MeetSemiLattice.\nCoercion bounded_join_sl_is_sl : BoundedJoinSemiLattice >-> JoinSemiLattice.\n\nCoercion top_inhabited `{Top M} : Inhabited M.  Proof. now exists ⊤. Defined.\nCoercion bounded_meet_sl_inhabited `{BoundedMeetSemiLattice M} : Inhabited M := _.\nCoercion bottom_inhabited `{Bottom M} : Inhabited M.  Proof. now exists ⊥. Defined.\nCoercion bounded_join_sl_inhabited `{BoundedMeetSemiLattice M} : Inhabited M := _.\n\nDefinition join_meet_distr_r `{DistributiveLattice L} : RightDistribute (X:=L) (⊔) (⊓) := right_distr_from_left.\nDefinition meet_join_distr_r `{DistributiveLattice L} : RightDistribute (X:=L) (⊓) (⊔) := right_distr_from_left.\nGlobal Hint Extern 2 (RightDistribute (⊔) (⊓)) => simple notypeclasses refine join_meet_distr_r : typeclass_instances.\nGlobal Hint Extern 2 (RightDistribute (⊓) (⊔)) => simple notypeclasses refine meet_join_distr_r : typeclass_instances.\n\nLocal Notation \"X 'ᵒᵖ'\" := (Order_op X) (at level 1, format \"X 'ᵒᵖ'\").\nDefinition MeetSemiLattice_op `{H:JoinSemiLattice L} : MeetSemiLattice (L ᵒᵖ) := H.\nDefinition JoinSemiLattice_op `{H:MeetSemiLattice L} : JoinSemiLattice (L ᵒᵖ) := H.\nGlobal Hint Extern 2 (MeetSemiLattice (_ ᵒᵖ)) => simple notypeclasses refine MeetSemiLattice_op : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLattice (_ ᵒᵖ)) => simple notypeclasses refine JoinSemiLattice_op : typeclass_instances.\nDefinition BoundedMeetSemiLattice_op `{H:BoundedJoinSemiLattice L} : BoundedMeetSemiLattice (L ᵒᵖ) := H.\nDefinition BoundedJoinSemiLattice_op `{H:BoundedMeetSemiLattice L} : BoundedJoinSemiLattice (L ᵒᵖ) := H.\nGlobal Hint Extern 2 (BoundedMeetSemiLattice (_ ᵒᵖ)) => simple notypeclasses refine BoundedMeetSemiLattice_op : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLattice (_ ᵒᵖ)) => simple notypeclasses refine BoundedJoinSemiLattice_op : typeclass_instances.\nLemma Lattice_op `{H : Lattice L} : Lattice (L ᵒᵖ).  Proof. destruct H. now split. Qed.\nGlobal Hint Extern 2 (Lattice (_ ᵒᵖ)) => simple notypeclasses refine Lattice_op : typeclass_instances.\nLemma DistributiveLattice_op `{H : DistributiveLattice L} : DistributiveLattice (L ᵒᵖ).  Proof. destruct H. now split. Qed.\nGlobal Hint Extern 2 (DistributiveLattice (_ ᵒᵖ)) => simple notypeclasses refine DistributiveLattice_op : typeclass_instances.\n\nLemma BoundedLattice_op `{H : BoundedLattice L} : BoundedLattice (L ᵒᵖ).  Proof. destruct H. now split. Qed.\nGlobal Hint Extern 2 (BoundedLattice (_ ᵒᵖ)) => simple notypeclasses refine BoundedLattice_op : typeclass_instances.\nLemma BoundedDistributiveLattice_op `{H : BoundedDistributiveLattice L} : BoundedDistributiveLattice (L ᵒᵖ).  Proof. destruct H. now split. Qed.\nGlobal Hint Extern 2 (BoundedDistributiveLattice (_ ᵒᵖ)) => simple notypeclasses refine BoundedDistributiveLattice_op : typeclass_instances.\n\nLemma alt_Build_BoundedLattice `{Lattice L} `{Top L} `{Bottom L} :\n  LeftIdentity (X:=L) (⊓) ⊤ → LeftIdentity (X:=L) (⊔) ⊥ → BoundedLattice L.\nProof. intros. split; try exact _; [ now apply alt_Build_BoundedMeetSemiLattice | now apply alt_Build_BoundedJoinSemiLattice ]. Qed.\n\nLemma alt_Build_DistributiveLattice `{Lattice L} :\n  LeftDistribute (X:=L) (⊔) (⊓) → DistributiveLattice L.\nProof. intro. pose proof right_distr_from_left : RightDistribute (X:=L) (⊔) (⊓).\n  split; trivial; hnf; intros x y z.\n  rew (distribute_l _ _ _ x z).\n  rew (distribute_r _ _ x y x).\n  rew (binary_idempotency _ x).\n  rew (commutativity (⊔) y x).\n  rew (meet_join_absorption _ _).\n  rew <-(meet_join_absorption x z) at 1.\n  rew <-(associativity _ _ _ _).\n  now rew <-(distribute_r _ _ _ _ _).\nQed.\n\nLemma alt_Build_BoundedDistributiveLattice `{BoundedLattice L} :\n  LeftDistribute (X:=L) (⊔) (⊓) → BoundedDistributiveLattice L.\nProof. intro. split; [now apply alt_Build_DistributiveLattice | exact _]. Qed.\n\nLemma distribute_alt `{DistributiveLattice L} (x y z : L) :\n  (x ⊓ y) ⊔ (x ⊓ z) ⊔ (y ⊓ z) = (x ⊔ y) ⊓ (x ⊔ z) ⊓ (y ⊔ z).\nProof.\n  rew (distribute_r _ _ x y (x ⊓ z)), (join_meet_absorption _ _).\n  rew (distribute_r _ _ _ _ (y ⊓ z)).\n  rew (distribute_l _ _ x y z).\n  rew (commutativity _ y (x ⊓ z)), <-(associativity _ _ y _).\n  rew (join_meet_absorption _ _).\n  rew (distribute_r _ _ x z y).\n  rew (commutativity (⊔) z y).\n  rew (commutativity _ (x ⊔ y) (x ⊔ z)).\n  rew (associativity _ _ _ _).\n  rew <-(associativity _ (x ⊔ z) _ _) at 1.\n  now rew (binary_idempotency _ _).\nQed.\n\n\nCanonical Structure MeetSemiLattice_Morphism_fun {X Y mX mY}\n  := make_fun_alt (@MeetSemiLattice_Morphism X Y mX mY) (@SemiGroup_Morphism_fun X Y mX mY).\n\nCanonical Structure JoinSemiLattice_Morphism_fun {X Y jX jY}\n  := make_fun_alt (@JoinSemiLattice_Morphism X Y jX jY) (@SemiGroup_Morphism_fun X Y jX jY).\n\nCanonical Structure BoundedMeetSemiLattice_Morphism_fun {X Y mX tX mY tY}\n  := make_fun_alt (@BoundedMeetSemiLattice_Morphism X Y mX tX mY tY) (@Monoid_Morphism_fun X Y mX tX mY tY).\n\nCanonical Structure BoundedJoinSemiLattice_Morphism_fun {X Y jX bX jY bY}\n  := make_fun_alt (@BoundedJoinSemiLattice_Morphism X Y jX bX jY bY) (@Monoid_Morphism_fun X Y jX bX jY bY).\n\nLemma Lattice_Morphism_proper_impl {X Y mX jX mY jY} (f g : X ⇾ Y)\n  : f = g → impl (@Lattice_Morphism X Y mX jX mY jY f, Lattice_Morphism g).\nProof. intros E H; split; try exact _; now rew <-E. Qed.\nCanonical Structure Lattice_Morphism_fun {X Y mX jX mY jY} :=\n  make_weak_spred (@Lattice_Morphism X Y mX jX mY jY) Lattice_Morphism_proper_impl.\n\nLemma BoundedLattice_Morphism_proper_impl {X Y mX jX tX bX mY jY tY bY} (f g : X ⇾ Y)\n  : f = g → impl (@BoundedLattice_Morphism X Y mX jX tX bX mY jY tY bY f, BoundedLattice_Morphism g).\nProof. intros E H; split; try exact _; now rew <-E. Qed.\nCanonical Structure BoundedLattice_Morphism_fun {X Y mX jX tX bX mY jY tY bY} :=\n  make_weak_spred (@BoundedLattice_Morphism X Y mX jX tX bX mY jY tY bY) BoundedLattice_Morphism_proper_impl.\n\n\nCoercion bounded_msl_mor_msl_mor `{H:@BoundedMeetSemiLattice_Morphism X Y mX tX mY tY f} : MeetSemiLattice_Morphism f := H.\nCoercion bounded_jsl_mor_jsl_mor `{H:@BoundedJoinSemiLattice_Morphism X Y jX bX jY bY f} : JoinSemiLattice_Morphism f := H.\nCoercion bounded_latmor_latmor `{H:@BoundedLattice_Morphism X Y mX jX tX bX mY jY tY bY f} : Lattice_Morphism f.\nProof. split; try exact _. exact (bounded_latmor_b _ H). Qed.\n\nCoercion bounded_msl_flip_mor_msl_flip_mor `{H:@BoundedMeetSemiLattice_Flip_Morphism X Y mX tX jY bY f} : MeetSemiLattice_Flip_Morphism f := H.\nCoercion bounded_jsl_flip_mor_jsl_flip_mor `{H:@BoundedJoinSemiLattice_Flip_Morphism X Y jX bX mY tY f} : JoinSemiLattice_Flip_Morphism f := H.\nCoercion bounded_latmor_flip_latmor_flip `{H:@BoundedLattice_Flip_Morphism X Y mX jX tX bX mY jY tY bY f} : Lattice_Flip_Morphism f.\nProof. split; try exact _. exact (bounded_latmor_b _ H). Qed.\n\nDefinition preserves_meet `{@MeetSemiLattice_Morphism X Y mX mY f} : ∀ x y, f (x ⊓ y) = f x ⊓ f y := preserves_sg_op (f:MeetSemigroupOps _ ⇾ MeetSemigroupOps _).\nDefinition preserves_join `{@JoinSemiLattice_Morphism X Y jX jY f} : ∀ x y, f (x ⊔ y) = f x ⊔ f y := preserves_sg_op (f:JoinSemigroupOps _ ⇾ JoinSemigroupOps _).\nArguments preserves_meet {_ _ _ _} f {_} x y.\nArguments preserves_join {_ _ _ _} f {_} x y.\n\nDefinition preserves_meet_flip `{@MeetSemiLattice_Flip_Morphism X Y mX jY f} : ∀ x y, f (x ⊓ y) = f x ⊔ f y := preserves_sg_op (f:MeetSemigroupOps _ ⇾ JoinSemigroupOps _).\nDefinition preserves_join_flip `{@JoinSemiLattice_Flip_Morphism X Y jX mY f} : ∀ x y, f (x ⊔ y) = f x ⊓ f y := preserves_sg_op (f:JoinSemigroupOps _ ⇾ MeetSemigroupOps _).\nArguments preserves_meet_flip {_ _ _ _} f {_} x y.\nArguments preserves_join_flip {_ _ _ _} f {_} x y.\n\nCoercion BoundedMeetSemiLattice_Morphism_pointed `{@BoundedMeetSemiLattice_ = f x ⊓ f y)\n → (∀ x y : X, f (x ⊔ y) = f x ⊔ f y)\n → f ⊤ = ⊤\n → f ⊥ = ⊥\n → BoundedLattice_Morphism f.\nProof. intros. split; try exact _.\n+ now apply alt_Build_BoundedMeetSemiLattice_Morphism.\n+ now apply alt_Build_BoundedJoinSemiLattice_Morphism.\nQed.\n\nLemma Build_BoundedLattice_Flip_Morphism@{u} {X Y:set@{u}}\n  `{BoundedLattice X} `{BoundedLattice Y} {f : X ⇾ Y} :\n   (∀ x y : X, f (x ⊓ y) = f x ⊔ f y)\n → (∀ x y : X, f (x ⊔ y) = f x ⊓ f y)\n → f ⊤ = ⊥\n → f ⊥ = ⊤\n → BoundedLattice_Flip_Morphism f.\nProof. intros. split; try exact _.\n+ now apply alt_Build_BoundedMeetSemiLattice_Morphism.\n+ now apply alt_Build_BoundedJoinSemiLattice_Morphism.\nQed.\n\n\nDefinition projected_meet_sl@{u} :\n  ∀ {X L:set@{u}} `{MeetSemiLattice L} `(f:X ⇾ L) `{!Injective f} `{Meet X},\n   (∀ x y, f (x ⊓ y) = f x ⊓ f y)\n   → MeetSemiLattice X\n  := @projected_semilattice.\n\nDefinition projected_join_sl@{u} :\n  ∀ {X L:set@{u}} `{JoinSemiLattice L} `(f:X ⇾ L) `{!Injective f} `{Join X},\n   (∀ x y, f (x ⊔ y) = f x ⊔ f y)\n   → JoinSemiLattice X\n  := @projected_semilattice.\n\nLemma projected_lattice@{u} {X L:set@{u}} `{Lattice L} `(f:X ⇾ L) `{!Injective f} `{Meet X} `{Join X} :\n   (∀ x y, f (x ⊓ y) = f x ⊓ f y)\n   → (∀ x y, f (x ⊔ y) = f x ⊔ f y)\n   → Lattice X.\nProof. intros Em Ej. pose proof projected_meet_sl f _. pose proof projected_join_sl f _.\n  split; trivial.\n+ intros x y. rew <-(injective f _ _), (Ej _ _), (Em _ _). now apply absorption.\n+ intros x y. rew <-(injective f _ _), (Em _ _), (Ej _ _). now apply absorption.\nQed.\n\nLemma projected_distr_lattice@{u} {X L:set@{u}} `{DistributiveLattice L} `(f:X ⇾ L) `{!Injective f} `{Meet X} `{Join X} :\n   (∀ x y, f (x ⊓ y) = f x ⊓ f y)\n   → (∀ x y, f (x ⊔ y) = f x ⊔ f y)\n   → DistributiveLattice X.\nProof. intros Em Ej. pose proof projected_lattice f _ _. split; trivial.\n+ intros x y z. rew <-(injective f _ _).\n  rew [ (Ej _ _) | (Em _ _) ]. rew [ (Em _ _) | (Ej _ _) ].\n  now apply distribute_l.\n+ intros x actics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":32445,"e":32448,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":32476,"e":32479,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":33413,"e":33416,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":33826,"e":33829,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[AffineConstructive.theory.lattices.alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[AffineConstructive.theory.lattices.distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔.","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","items":[{"name":"AffineConstructive.theory.lattices.AProp_lattice","base":"AProp_lattice","kind":"prf","start":7,"body":[8,10],"status":"ok","short":{"text":"Ω is a bounded distributive lattice under ∧ and ∨, with 𝐓 as top and 𝐅 as bottom","status":"ok"},"proof":[{"text":"Each law of a bounded distributive lattice, read in Ω with ∧ as meet, ∨ as join, 𝐓 as top and 𝐅 as bottom, is an identity of affine propositional logic. The decision procedure for that logic proves all of them at once.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.anot_lat_mor","base":"anot_lat_mor","kind":"prf","start":19,"body":[20,22],"status":"ok","short":{"text":"Negation exchanges ∧ with ∨ and 𝐓 with 𝐅: a bounded lattice flip morphism of Ω","status":"ok"},"proof":[{"text":"A bounded lattice flip morphism consists of four parts. Instance search fills the lattice structure on Ω, from [[AffineConstructive.theory.lattices.AProp_lattice]]. The other three are the laws that negation turns ∧ into ∨, ∨ into ∧ and 𝐓 into 𝐅: De Morgan identities of affine propositional logic, which the decision procedure proves.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.alt_Build_MeetSemiLattice","base":"alt_Build_MeetSemiLattice","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"Builds a meet semilattice from associativity, commutativity and idempotence of ⊓","status":"ok"},"long":{"text":"Given a set L with a meet ⊓, this builds a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]] on L from three laws: ⊓ is associative, commutative and idempotent. A meet semilattice is a semilattice in the generic notation with ⊓ as its operation, and the constructor is [[AffineConstructive.theory.groups.alt_Build_SemiLattice]] at that operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.alt_Build_JoinSemiLattice","base":"alt_Build_JoinSemiLattice","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"Builds a join semilattice from associativity, commutativity and idempotence of ⊔","status":"ok"},"long":{"text":"The join-semilattice reading of [[AffineConstructive.theory.groups.alt_Build_SemiLattice]]: a set L with a join ⊔ is a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice]] as soon as ⊔ is associative, commutative and idempotent. It is the generic semilattice constructor at the instance that reads ⊔ as the operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.meet_ass","base":"meet_ass","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"The associativity of meet in a meet semilattice","status":"ok"},"long":{"text":"Extracts associativity of ⊓ from a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]]. The generic law lives on the semigroup structure, stated in the notation ∙; this accessor restates it for ⊓, and a hint lets resolution find it whenever a rewrite asks for associativity of a meet.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.join_ass","base":"join_ass","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"The associativity of join in a join semilattice","status":"ok"},"long":{"text":"Extracts associativity of ⊔ from a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice]], restating the semigroup law in the lattice notation so that rewriting with [[AffineConstructive.interfaces.common_props.associativity]] at ⊔ finds it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.meet_com","base":"meet_com","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"The commutativity of meet in a meet semilattice","status":"ok"},"long":{"text":"Extracts commutativity of ⊓ from a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]], restating the semilattice law in the lattice notation so that [[AffineConstructive.interfaces.common_props.commutativity]] at ⊓ is found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.join_com","base":"join_com","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"The commutativity of join in a join semilattice","status":"ok"},"long":{"text":"Extracts commutativity of ⊔ from a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice]], restating the semilattice law in the lattice notation so that [[AffineConstructive.interfaces.common_props.commutativity]] at ⊔ is found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.meet_idm","base":"meet_idm","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"The idempotence x ⊓ x = x in a meet semilattice","status":"ok"},"long":{"text":"Extracts idempotence of ⊓ from a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]], restated in the lattice notation so that [[AffineConstructive.interfaces.common_props.binary_idempotency]] at ⊓ is found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.join_idm","base":"join_idm","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"The idempotence x ⊔ x = x in a join semilattice","status":"ok"},"long":{"text":"Extracts idempotence of ⊔ from a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice]], restated in the lattice notation so that [[AffineConstructive.interfaces.common_props.binary_idempotency]] at ⊔ is found by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.alt_Build_BoundedMeetSemiLattice","base":"alt_Build_BoundedMeetSemiLattice","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"Builds a bounded meet semilattice from the semilattice laws of ⊓ and ⊤ a left identity","status":"ok"},"long":{"text":"The bounded meet-semilattice reading of [[AffineConstructive.theory.groups.alt_Build_BoundedSemiLattice]]: associativity, commutativity and idempotence of ⊓ together with ⊤ ⊓ x = x make L a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]]. Only the left identity law is asked for; commutativity supplies the right one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice","base":"alt_Build_BoundedJoinSemiLattice","kind":"def","start":44,"body":null,"status":"ok","short":{"text":"Builds a bounded join semilattice from the semilattice laws of ⊔ and ⊥ a left identity","status":"ok"},"long":{"text":"The bounded join-semilattice reading of [[AffineConstructive.theory.groups.alt_Build_BoundedSemiLattice]]: associativity, commutativity and idempotence of ⊔ together with ⊥ ⊔ x = x make L a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice]]; the right identity law follows by commutativity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.meet_top_l","base":"meet_top_l","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"In a bounded meet semilattice, ⊤ is a left identity for ⊓: ⊤ ⊓ x = x","status":"ok"},"long":{"text":"The left identity law of ⊤ for ⊓, extracted from a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]] and stated in the lattice notation as a [[AffineConstructive.interfaces.common_props.LeftIdentity]] of ⊓ with ⊤.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.meet_top_r","base":"meet_top_r","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"In a bounded meet semilattice, x ⊓ ⊤ = x","status":"ok"},"long":{"text":"The right identity law of ⊤ for ⊓ in a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]], restated from the monoid structure in the lattice notation and made available to resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.join_bot_l","base":"join_bot_l","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"In a bounded join semilattice, ⊥ ⊔ x = x","status":"ok"},"long":{"text":"The left identity law of ⊥ for ⊔, extracted from a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice]] and restated in the lattice notation for use by resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.join_bot_r","base":"join_bot_r","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"In a bounded join semilattice, x ⊔ ⊥ = x","status":"ok"},"long":{"text":"The right identity law of ⊥ for ⊔ in a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice]], restated from the monoid structure in the lattice notation and made available to resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_meet_sl_is_sl","base":"bounded_meet_sl_is_sl","kind":"def","start":53,"body":null,"status":"ok","short":{"text":"A bounded meet semilattice is a meet semilattice","status":"ok"},"long":{"text":"Forgets the top of a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]]. Declared as a coercion, so that every result about meet semilattices applies to bounded ones without further ado.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_join_sl_is_sl","base":"bounded_join_sl_is_sl","kind":"def","start":54,"body":null,"status":"ok","short":{"text":"A bounded join semilattice is a join semilattice","status":"ok"},"long":{"text":"Forgets the bottom of a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice]]. Declared as a coercion, so that results about join semilattices apply to bounded ones.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.coercion:bounded_meet_sl_is_sl","base":"coercion:bounded_meet_sl_is_sl","kind":"coercion","start":55,"body":null,"status":"ok","short":{"text":"A bounded meet semilattice serves as a meet semilattice, through [[AffineConstructive.theory.lattices.bounded_meet_sl_is_sl]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.coercion:bounded_join_sl_is_sl","base":"coercion:bounded_join_sl_is_sl","kind":"coercion","start":56,"body":null,"status":"ok","short":{"text":"A bounded join semilattice serves as a join semilattice, through [[AffineConstructive.theory.lattices.bounded_join_sl_is_sl]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.top_inhabited","base":"top_inhabited","kind":"def","start":57,"body":[58,60],"status":"ok","short":{"text":"A set with a top element is inhabited, by ⊤","status":"ok"},"proof":[{"text":"The top element ⊤ witnesses that M is inhabited.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.bounded_meet_sl_inhabited","base":"bounded_meet_sl_inhabited","kind":"def","start":61,"body":null,"status":"ok","short":{"text":"A bounded meet semilattice is inhabited, by its top","status":"ok"},"long":{"text":"A [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]] has a top element ⊤, so its carrier is [[AffineConstructive.interfaces.sprop.Inhabited]]; the witness is the one given by [[AffineConstructive.theory.lattices.top_inhabited]]. The definition is declared as a coercion from bounded meet semilattices to inhabitedness.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bottom_inhabited","base":"bottom_inhabited","kind":"def","start":62,"body":[63,65],"status":"ok","short":{"text":"A set with a bottom element is inhabited, by ⊥","status":"ok"},"proof":[{"text":"The bottom element ⊥ witnesses that M is inhabited.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.bounded_join_sl_inhabited","base":"bounded_join_sl_inhabited","kind":"def","start":66,"body":null,"status":"ok","short":{"text":"A bounded meet semilattice is inhabited (despite the name, stated for meet)","status":"ok"},"long":{"text":"Intended as the join counterpart of [[AffineConstructive.theory.lattices.bounded_meet_sl_inhabited]], but as written its hypothesis is a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]], so it duplicates that coercion rather than deriving inhabitation from a bottom. A bounded join semilattice is inhabited through [[AffineConstructive.theory.lattices.bottom_inhabited]] instead.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.join_meet_distr_r","base":"join_meet_distr_r","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"In a distributive lattice, join distributes over meet on the right","status":"ok"},"long":{"text":"A [[AffineConstructive.interfaces.abstract_algebra.DistributiveLattice]] is defined by the two left distributive laws; the right law (x ⊓ y) ⊔ z = (x ⊔ z) ⊓ (y ⊔ z) follows from the left one by commutativity of ⊔, through [[AffineConstructive.theory.common_props.right_distr_from_left]]. Registered for resolution so that [[AffineConstructive.interfaces.common_props.distribute_r]] at ⊔ over ⊓ is available in any distributive lattice.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.meet_join_distr_r","base":"meet_join_distr_r","kind":"def","start":68,"body":null,"status":"ok","short":{"text":"In a distributive lattice, meet distributes over join on the right","status":"ok"},"long":{"text":"The right law (x ⊔ y) ⊓ z = (x ⊓ z) ⊔ (y ⊓ z), obtained from the left distributive law of ⊓ over ⊔ by commutativity of ⊓ through [[AffineConstructive.theory.common_props.right_distr_from_left]], and registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.MeetSemiLattice_op","base":"MeetSemiLattice_op","kind":"def","start":72,"body":null,"status":"ok","short":{"text":"A join semilattice on L is a meet semilattice on the opposite L ᵒᵖ","status":"ok"},"long":{"text":"In the opposite [[AffineConstructive.interfaces.algebra_notation.Order_op]] the elements and equality are those of L and meet and join are exchanged, so the meet of L ᵒᵖ is the join of L. A [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice]] on L is therefore, without change, a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]] on L ᵒᵖ, and this definition records that identification.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.JoinSemiLattice_op","base":"JoinSemiLattice_op","kind":"def","start":73,"body":null,"status":"ok","short":{"text":"The meet semilattice structure of L, read as a join semilattice on L ᵒᵖ","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.theory.lattices.MeetSemiLattice_op]]: the join of L ᵒᵖ is the meet of L, so a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]] on L is a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice]] on L ᵒᵖ, by the same proof.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.BoundedMeetSemiLattice_op","base":"BoundedMeetSemiLattice_op","kind":"def","start":76,"body":null,"status":"ok","short":{"text":"A bounded join semilattice on L is a bounded meet semilattice on L ᵒᵖ","status":"ok"},"long":{"text":"In L ᵒᵖ meet is the join of L and top is the bottom of L, so a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice]] on L is, unchanged, a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]] on the opposite.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.BoundedJoinSemiLattice_op","base":"BoundedJoinSemiLattice_op","kind":"def","start":77,"body":null,"status":"ok","short":{"text":"A bounded meet semilattice on L is a bounded join semilattice on L ᵒᵖ","status":"ok"},"long":{"text":"In L ᵒᵖ join is the meet of L and bottom is the top of L, so a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice]] on L is, unchanged, a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice]] on the opposite.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.Lattice_op","base":"Lattice_op","kind":"prf","start":80,"body":[81,84],"status":"ok","short":{"text":"The opposite of a lattice is a lattice, with meet and join exchanged","status":"ok"},"proof":[{"text":"Unfold the lattice structure on L into its parts: a join semilattice, a meet semilattice, and the two absorption laws.","status":"ok","from":0,"to":1},{"text":"In L ᵒᵖ meet and join trade places. The meet semilattice of L becomes the join semilattice of the opposite, the join semilattice becomes its meet semilattice, and each absorption law becomes the other one. That gives every field of a lattice on L ᵒᵖ.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.lattices.DistributiveLattice_op","base":"DistributiveLattice_op","kind":"prf","start":86,"body":[87,90],"status":"ok","short":{"text":"The opposite of a distributive lattice is a distributive lattice","status":"ok"},"proof":[{"text":"Unfold the distributive lattice into its underlying lattice and its two left distributive laws: join over meet and meet over join.","status":"ok","from":0,"to":1},{"text":"The opposite is a lattice by [[AffineConstructive.theory.lattices.Lattice_op]]. Exchanging meet and join turns each distributive law into the other, so L ᵒᵖ has both.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.lattices.BoundedLattice_op","base":"BoundedLattice_op","kind":"prf","start":92,"body":[93,96],"status":"ok","short":{"text":"The opposite of a bounded lattice is a bounded lattice, top and bottom exchanged","status":"ok"},"proof":[{"text":"Unfold the bounded lattice into its lattice, its bounded meet semilattice and its bounded join semilattice.","status":"ok","from":0,"to":1},{"text":"The opposite is a lattice by [[AffineConstructive.theory.lattices.Lattice_op]]. The bounded join semilattice of L, with bottom ⊥, becomes the bounded meet semilattice of L ᵒᵖ, and the bounded meet semilattice, with top ⊤, becomes its bounded join semilattice.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.lattices.BoundedDistributiveLattice_op","base":"BoundedDistributiveLattice_op","kind":"prf","start":98,"body":[99,102],"status":"ok","short":{"text":"The opposite of a bounded distributive lattice is a bounded distributive lattice","status":"ok"},"proof":[{"text":"Unfold the structure into a distributive lattice and a bounded lattice on L.","status":"ok","from":0,"to":1},{"text":"Each part carries over to the opposite: distributivity by [[AffineConstructive.theory.lattices.DistributiveLattice_op]] and boundedness by [[AffineConstructive.theory.lattices.BoundedLattice_op]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.lattices.alt_Build_BoundedLattice","base":"alt_Build_BoundedLattice","kind":"prf","start":104,"body":[105,108],"status":"ok","short":{"text":"A lattice with ⊤ a left identity for ⊓ and ⊥ a left identity for ⊔ is bounded","status":"ok"},"proof":[{"text":"Assume that ⊤ is a left identity for ⊓ and that ⊥ is a left identity for ⊔.","status":"ok","from":0,"to":1},{"text":"A bounded lattice needs a lattice, a bounded meet semilattice and a bounded join semilattice. The lattice is given. The other two come from the semilattice laws of the lattice together with the assumed left identities, by [[AffineConstructive.theory.lattices.alt_Build_BoundedMeetSemiLattice]] and [[AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.lattices.alt_Build_DistributiveLattice","base":"alt_Build_DistributiveLattice","kind":"prf","start":109,"body":[110,122],"status":"ok","short":{"text":"A lattice in which join distributes over meet on the left is distributive","status":"ok"},"proof":[{"text":"Assume that join distributes over meet on the left. Join is commutative ([[AffineConstructive.theory.lattices.join_com]]), so it also distributes over meet on the right, by [[AffineConstructive.theory.common_props.right_distr_from_left]].","status":"ok","from":0,"to":2},{"text":"The lattice and the distributivity of join over meet are given. What remains is the other law, x ⊓ (y ⊔ z) = (x ⊓ y) ⊔ (x ⊓ z), for arbitrary x, y, z.","status":"ok","from":3,"to":3},{"text":"Work on the right-hand side. Distributing the join of x ⊓ y over x ⊓ z gives (x ⊓ y ⊔ x) ⊓ (x ⊓ y ⊔ z). Distributing again on the right turns the first factor into (x ⊔ x) ⊓ (y ⊔ x). By idempotence and commutativity of join this is x ⊓ (x ⊔ y), which absorption reduces to x. The right-hand side is now x ⊓ (x ⊓ y ⊔ z).","status":"ok","from":4,"to":8},{"text":"On the left, absorption rewrites x as x ⊓ (x ⊔ z), and reassociating the meet gives x ⊓ ((x ⊔ z) ⊓ (y ⊔ z)). By right distributivity of join over meet, (x ⊔ z) ⊓ (y ⊔ z) is (x ⊓ y) ⊔ z, so the two sides agree.","status":"ok","from":9,"to":12}]},{"name":"AffineConstructive.theory.lattices.alt_Build_BoundedDistributiveLattice","base":"alt_Build_BoundedDistributiveLattice","kind":"prf","start":123,"body":[124,127],"status":"ok","short":{"text":"A bounded lattice in which join distributes over meet is a bounded distributive lattice","status":"ok"},"proof":[{"text":"Assume that join distributes over meet on the left.","status":"ok","from":0,"to":1},{"text":"A bounded distributive lattice is a distributive lattice that is also bounded. The lattice is distributive by [[AffineConstructive.theory.lattices.alt_Build_DistributiveLattice]], since in a lattice one distributive law suffices. The bounds come from the bounded lattice already given.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.lattices.distribute_alt","base":"distribute_alt","kind":"prf","start":128,"body":[129,141],"status":"ok","short":{"text":"In a distributive lattice, (x⊓y) ⊔ (x⊓z) ⊔ (y⊓z) = (x⊔y) ⊓ (x⊔z) ⊓ (y⊔z)","status":"ok"},"proof":[{"text":"On the left, distribute the join of x ⊓ y and x ⊓ z over the meet in x ⊓ y. Absorption x ⊔ (x ⊓ z) = x then collapses the first factor, leaving x ⊓ (y ⊔ x ⊓ z) ⊔ y ⊓ z.","status":"ok","from":0,"to":1},{"text":"Distribute the outer join with y ⊓ z over this meet. The first factor x ⊔ y ⊓ z then distributes to (x ⊔ y) ⊓ (x ⊔ z), which already matches the first two factors of the right-hand side.","status":"ok","from":2,"to":3},{"text":"In the remaining factor, reorder the joins so that y ⊔ y ⊓ z appears, and absorb it to y. What remains is x ⊓ z ⊔ y.","status":"ok","from":4,"to":5},{"text":"Distributing on the right gives (x ⊔ y) ⊓ (y ⊔ z) for this factor, after commuting z ⊔ y.","status":"ok","from":6,"to":7},{"text":"Both sides are now meets of the same three joins, except that x ⊔ y appears twice on the left. Commute and reassociate the meets so that the two copies are adjacent. Idempotence of meet removes the duplicate.","status":"ok","from":8,"to":12}]},{"name":"AffineConstructive.theory.lattices.MeetSemiLattice_Morphism_fun","base":"MeetSemiLattice_Morphism_fun","kind":"def","start":142,"body":null,"status":"ok","short":{"text":"Being a meet-semilattice morphism, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"Packages [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism]] as a predicate on the set of functions X ⇾ Y, so that it is known to respect equality of functions. A meet-semilattice morphism is a semigroup morphism for ⊓, so the predicate is [[AffineConstructive.theory.groups.SemiGroup_Morphism_fun]] read at the meet, repackaged by [[AffineConstructive.theory.set.make_fun_alt]]. Declared canonical, so that rewriting a function inside the class by an equality f = g is automatic.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.JoinSemiLattice_Morphism_fun","base":"JoinSemiLattice_Morphism_fun","kind":"def","start":143,"body":null,"status":"ok","short":{"text":"Being a join-semilattice morphism, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"Packages [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Morphism]] as an equality-respecting predicate on functions X ⇾ Y: the semigroup-morphism predicate [[AffineConstructive.theory.groups.SemiGroup_Morphism_fun]] read at ⊔. Canonical, so that the class transports along equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.BoundedMeetSemiLattice_Morphism_fun","base":"BoundedMeetSemiLattice_Morphism_fun","kind":"def","start":144,"body":null,"status":"ok","short":{"text":"Being a bounded meet-semilattice morphism, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"Packages [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Morphism]] (preserving ⊓ and ⊤) as an equality-respecting predicate on functions, as the monoid-morphism predicate [[AffineConstructive.theory.groups.Monoid_Morphism_fun]] read at the meet and top. Canonical, so that the class transports along equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.BoundedJoinSemiLattice_Morphism_fun","base":"BoundedJoinSemiLattice_Morphism_fun","kind":"def","start":145,"body":null,"status":"ok","short":{"text":"Being a bounded join-semilattice morphism, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"Packages [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Morphism]] (preserving ⊔ and ⊥) as an equality-respecting predicate on functions, as [[AffineConstructive.theory.groups.Monoid_Morphism_fun]] read at the join and bottom. Canonical, so that the class transports along equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.Lattice_Morphism_proper_impl","base":"Lattice_Morphism_proper_impl","kind":"prf","start":146,"body":[147,149],"status":"ok","short":{"text":"Being a lattice morphism is invariant under equality of functions: f = g and f a lattice morphism give g one","status":"ok"},"proof":[{"text":"Assume f = g and that f is a lattice morphism. Being a lattice morphism means four things: the domain and the codomain are lattices, and the map preserves meets and joins. The two lattice structures carry over unchanged. Each preservation law for g follows from the corresponding law for f by rewriting g as f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.Lattice_Morphism_fun","base":"Lattice_Morphism_fun","kind":"def","start":150,"body":null,"status":"ok","short":{"text":"Being a lattice morphism, as a predicate on the functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.Lattice_Morphism]] packaged as a function from the functions X ⇾ Y, taken with of course, to strict propositions. It is built with [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.theory.lattices.Lattice_Morphism_proper_impl]], which says the predicate respects equality of functions.\n\nDeclared as a canonical structure, it lets the rewriting system carry a goal or hypothesis that f is a lattice morphism along an equality f = g, as [[AffineConstructive.theory.groups.SemiGroup_Morphism_fun]] and [[AffineConstructive.theory.groups.Monoid_Morphism_fun]] do for the semilattice classes, which are reused there for meets and joins.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.BoundedLattice_Morphism_proper_impl","base":"BoundedLattice_Morphism_proper_impl","kind":"prf","start":151,"body":[152,154],"status":"ok","short":{"text":"Being a bounded lattice morphism is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g and that f is a bounded lattice morphism. Being one means four things: the domain and the codomain are bounded lattices, and the map is a bounded meet-semilattice morphism and a bounded join-semilattice morphism. The two bounded lattice structures carry over unchanged. Each preservation property for g follows from the one for f by rewriting g as f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.BoundedLattice_Morphism_fun","base":"BoundedLattice_Morphism_fun","kind":"def","start":155,"body":null,"status":"ok","short":{"text":"Being a bounded lattice morphism, as a predicate on the functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Morphism]] as a predicate on the functions X ⇾ Y (under of course), built with [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.theory.lattices.BoundedLattice_Morphism_proper_impl]]. As a canonical structure it allows the statement that f preserves meet, join, top and bottom to be rewritten along an equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_msl_mor_msl_mor","base":"bounded_msl_mor_msl_mor","kind":"def","start":156,"body":null,"status":"ok","short":{"text":"A bounded meet-semilattice morphism preserves meets","status":"ok"},"long":{"text":"Forgets preservation of top: a map preserving meets and ⊤ is in particular a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism]]. The two classes are the monoid and semigroup morphism classes at the meet structure, so the coercion is the inclusion of the one in the other; declared as a coercion, it makes every bounded meet-semilattice morphism usable where only meets matter.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_jsl_mor_jsl_mor","base":"bounded_jsl_mor_jsl_mor","kind":"def","start":157,"body":null,"status":"ok","short":{"text":"A bounded join-semilattice morphism preserves joins","status":"ok"},"long":{"text":"The join counterpart of [[AffineConstructive.theory.lattices.bounded_msl_mor_msl_mor]]: a map preserving joins and ⊥ is a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Morphism]], obtained by forgetting preservation of the bottom. A coercion, so the weaker class is found from the stronger.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_latmor_latmor","base":"bounded_latmor_latmor","kind":"def","start":158,"body":[159,162],"status":"ok","short":{"text":"A bounded lattice morphism is a lattice morphism","status":"ok"},"proof":[{"text":"A lattice morphism requires that domain and codomain be lattices and that the map preserve meets and joins. Preservation of meets and of joins follows from the bounded semilattice morphisms that f already is, and the domain is a lattice. What is left is that the codomain is a lattice.","status":"ok","from":0,"to":1},{"text":"The codomain is a bounded lattice, as part of f being a bounded lattice morphism. Hence it is a lattice.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.lattices.bounded_msl_flip_mor_msl_flip_mor","base":"bounded_msl_flip_mor_msl_flip_mor","kind":"def","start":163,"body":null,"status":"ok","short":{"text":"A map taking meets to joins and ⊤ to ⊥ takes meets to joins","status":"ok"},"long":{"text":"Forgets the bottom condition of a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Flip_Morphism]], leaving a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Flip_Morphism]]. The flip classes are the straight classes into the opposite order, so this is [[AffineConstructive.theory.lattices.bounded_msl_mor_msl_mor]] read there; declared as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_jsl_flip_mor_jsl_flip_mor","base":"bounded_jsl_flip_mor_jsl_flip_mor","kind":"def","start":164,"body":null,"status":"ok","short":{"text":"A map taking joins to meets and ⊥ to ⊤ takes joins to meets","status":"ok"},"long":{"text":"Forgets the top condition of a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Flip_Morphism]], leaving a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Flip_Morphism]]: the flip reading of [[AffineConstructive.theory.lattices.bounded_jsl_mor_jsl_mor]], declared as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_latmor_flip_latmor_flip","base":"bounded_latmor_flip_latmor_flip","kind":"def","start":165,"body":[166,169],"status":"ok","short":{"text":"A bounded order-reversing lattice morphism is an order-reversing lattice morphism","status":"ok"},"proof":[{"text":"An order-reversing lattice morphism is a lattice morphism into the opposite lattice Y ᵒᵖ. Preservation of meets and of joins follows from the bounded semilattice morphisms that f already is, and the domain is a lattice. What is left is that Y ᵒᵖ is a lattice.","status":"ok","from":0,"to":1},{"text":"Y ᵒᵖ is a bounded lattice, as part of f being a bounded order-reversing lattice morphism. Hence it is a lattice.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.lattices.preserves_meet","base":"preserves_meet","kind":"def","start":170,"body":null,"status":"ok","short":{"text":"A meet-semilattice morphism f satisfies f (x ⊓ y) = f x ⊓ f y","status":"ok"},"long":{"text":"The defining law of a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism]], stated in the lattice notation. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_sg_op]] at the meet structure seen as a semigroup ([[AffineConstructive.interfaces.algebra_notation.MeetSemigroupOps]]), restated so that rewriting finds the meet symbol rather than the generic operation. The function is an explicit argument, so the law is cited as preserves_meet f.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.preserves_join","base":"preserves_join","kind":"def","start":171,"body":null,"status":"ok","short":{"text":"A join-semilattice morphism f satisfies f (x ⊔ y) = f x ⊔ f y","status":"ok"},"long":{"text":"The defining law of a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Morphism]] in the lattice notation: [[AffineConstructive.interfaces.abstract_algebra.preserves_sg_op]] at the join structure ([[AffineConstructive.interfaces.algebra_notation.JoinSemigroupOps]]), restated with ⊔ for rewriting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.preserves_meet_flip","base":"preserves_meet_flip","kind":"def","start":174,"body":null,"status":"ok","short":{"text":"A map taking meets to joins satisfies f (x ⊓ y) = f x ⊔ f y","status":"ok"},"long":{"text":"The defining law of a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Flip_Morphism]]: f turns meets in X into joins in Y. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_sg_op]] for f regarded as a semigroup morphism from the meet structure of X to the join structure of Y, restated in the lattice notation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.preserves_join_flip","base":"preserves_join_flip","kind":"def","start":175,"body":null,"status":"ok","short":{"text":"A map taking joins to meets satisfies f (x ⊔ y) = f x ⊓ f y","status":"ok"},"long":{"text":"The defining law of a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Flip_Morphism]]: f turns joins in X into meets in Y. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_sg_op]] for f regarded as a semigroup morphism from the join structure of X to the meet structure of Y, restated in the lattice notation. One proof step in the file on interiors of a topology uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.BoundedMeetSemiLattice_Morphism_pointed","base":"BoundedMeetSemiLattice_Morphism_pointed","kind":"def","start":178,"body":null,"status":"ok","short":{"text":"A bounded meet-semilattice morphism preserves top: f ⊤ = ⊤","status":"ok"},"long":{"text":"Extracts preservation of ⊤ from a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Morphism]] as a [[AffineConstructive.interfaces.abstract_algebra.Top_Pointed_Morphism]]. It is [[AffineConstructive.interfaces.abstract_algebra.monmor_pointed]], the unit law of a monoid morphism, at the meet monoid with ⊤ as unit. Declared as a coercion so the top law is available wherever the bounded class is.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.BoundedJoinSemiLattice_Morphism_pointed","base":"BoundedJoinSemiLattice_Morphism_pointed","kind":"def","start":179,"body":null,"status":"ok","short":{"text":"A bounded join-semilattice morphism preserves bottom: f ⊥ = ⊥","status":"ok"},"long":{"text":"Extracts preservation of ⊥ from a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Morphism]] as a [[AffineConstructive.interfaces.abstract_algebra.Bottom_Pointed_Morphism]], by [[AffineConstructive.interfaces.abstract_algebra.monmor_pointed]] at the join monoid with ⊥ as unit. A coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.latmor_meet_sl_mor_flip","base":"latmor_meet_sl_mor_flip","kind":"def","start":180,"body":null,"status":"ok","short":{"text":"An order-reversing lattice morphism takes meets to joins","status":"ok"},"long":{"text":"The meet half of a [[AffineConstructive.interfaces.abstract_algebra.Lattice_Flip_Morphism]], as a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Flip_Morphism]]. A flip lattice morphism is a lattice morphism into the opposite order, so this is [[AffineConstructive.interfaces.abstract_algebra.latmor_meet_sl_mor]] read there, where the meet of the opposite order is the join. Declared as a coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.latmor_join_sl_mor_flip","base":"latmor_join_sl_mor_flip","kind":"def","start":181,"body":null,"status":"ok","short":{"text":"An order-reversing lattice morphism takes joins to meets","status":"ok"},"long":{"text":"The join half of a [[AffineConstructive.interfaces.abstract_algebra.Lattice_Flip_Morphism]], as a [[AffineConstructive.interfaces.abstract_algebra.JoinSemiLattice_Flip_Morphism]]: [[AffineConstructive.interfaces.abstract_algebra.latmor_join_sl_mor]] read at the opposite order of the codomain. A coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_latmor_meet_flip","base":"bounded_latmor_meet_flip","kind":"def","start":182,"body":null,"status":"ok","short":{"text":"A bounded order-reversing lattice morphism takes meets to joins and ⊤ to ⊥","status":"ok"},"long":{"text":"The meet-and-top half of a [[AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Flip_Morphism]], as a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Flip_Morphism]]: [[AffineConstructive.interfaces.abstract_algebra.bounded_latmor_meet]] read at the opposite order of the codomain, where top is bottom. A coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.bounded_latmor_join_flip","base":"bounded_latmor_join_flip","kind":"def","start":183,"body":null,"status":"ok","short":{"text":"A bounded order-reversing lattice morphism takes joins to meets and ⊥ to ⊤","status":"ok"},"long":{"text":"The join-and-bottom half of a [[AffineConstructive.interfaces.abstract_algebra.BoundedLattice_Flip_Morphism]], as a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Flip_Morphism]]: [[AffineConstructive.interfaces.abstract_algebra.bounded_latmor_join]] read at the opposite order of the codomain. A coercion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.id_meetsl_mor","base":"id_meetsl_mor","kind":"def","start":184,"body":null,"status":"ok","short":{"text":"The identity of a meet semilattice is a meet-semilattice morphism","status":"ok"},"long":{"text":"The identity function preserves meets: [[AffineConstructive.theory.groups.id_semigroup_mor]] at the meet structure seen as a semigroup. Registered for resolution, so the identity is recognised as a meet-semilattice morphism whenever one is asked for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.id_joinsl_mor","base":"id_joinsl_mor","kind":"def","start":185,"body":null,"status":"ok","short":{"text":"The identity of a join semilattice is a join-semilattice morphism","status":"ok"},"long":{"text":"The identity function preserves joins: [[AffineConstructive.theory.groups.id_semigroup_mor]] at the join structure. Registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.id_bounded_meetsl_mor","base":"id_bounded_meetsl_mor","kind":"def","start":188,"body":null,"status":"ok","short":{"text":"The identity of a bounded meet semilattice preserves meets and top","status":"ok"},"long":{"text":"The identity is a [[AffineConstructive.interfaces.abstract_algebra.BoundedMeetSemiLattice_Morphism]]: [[AffineConstructive.theory.groups.id_monoid_mor]] at the meet monoid with ⊤ as unit. Registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.id_bounded_joinsl_mor","base":"id_bounded_joinsl_mor","kind":"def","start":189,"body":null,"status":"ok","short":{"text":"The identity of a bounded join semilattice preserves joins and bottom","status":"ok"},"long":{"text":"The identity is a [[AffineConstructive.interfaces.abstract_algebra.BoundedJoinSemiLattice_Morphism]]: [[AffineConstructive.theory.groups.id_monoid_mor]] at the join monoid with ⊥ as unit. Registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.id_lattice_mor","base":"id_lattice_mor","kind":"prf","start":192,"body":[193,195],"status":"ok","short":{"text":"The identity of a lattice is a lattice morphism","status":"ok"},"proof":[{"text":"The identity preserves meets and joins, being a morphism of each semilattice ([[AffineConstructive.theory.lattices.id_meetsl_mor]], [[AffineConstructive.theory.lattices.id_joinsl_mor]]). Together these make it a lattice morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.id_bounded_lattice_mor","base":"id_bounded_lattice_mor","kind":"prf","start":197,"body":[198,200],"status":"ok","short":{"text":"The identity of a bounded lattice is a bounded lattice morphism","status":"ok"},"proof":[{"text":"The identity is a bounded meet-semilattice morphism and a bounded join-semilattice morphism ([[AffineConstructive.theory.lattices.id_bounded_meetsl_mor]], [[AffineConstructive.theory.lattices.id_bounded_joinsl_mor]]). Together these make it a bounded lattice morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.compose_meetsl_mor","base":"compose_meetsl_mor","kind":"def","start":202,"body":null,"status":"ok","short":{"text":"The composite of two meet-semilattice morphisms is a meet-semilattice morphism","status":"ok"},"long":{"text":"If f and g preserve meets, so does g ∘ f: [[AffineConstructive.theory.groups.compose_semigroup_mor]] at the meet structures. Registered for resolution on composites, so a chain of meet-preserving maps is recognised as one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_joinsl_mor","base":"compose_joinsl_mor","kind":"def","start":204,"body":null,"status":"ok","short":{"text":"The composite of two join-semilattice morphisms is a join-semilattice morphism","status":"ok"},"long":{"text":"If f and g preserve joins, so does g ∘ f: [[AffineConstructive.theory.groups.compose_semigroup_mor]] at the join structures. Registered for resolution on composites.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_bounded_meetsl_mor","base":"compose_bounded_meetsl_mor","kind":"def","start":206,"body":null,"status":"ok","short":{"text":"The composite of two bounded meet-semilattice morphisms is one","status":"ok"},"long":{"text":"If f and g preserve meets and top, so does g ∘ f: [[AffineConstructive.theory.groups.compose_monoid_mor]] at the meet monoids. Registered for resolution on composites.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_bounded_joinsl_mor","base":"compose_bounded_joinsl_mor","kind":"def","start":208,"body":null,"status":"ok","short":{"text":"The composite of two bounded join-semilattice morphisms is one","status":"ok"},"long":{"text":"If f and g preserve joins and bottom, so does g ∘ f: [[AffineConstructive.theory.groups.compose_monoid_mor]] at the join monoids. Registered for resolution on composites.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_lattice_mor","base":"compose_lattice_mor","kind":"prf","start":210,"body":[211,213],"status":"ok","short":{"text":"The composite of two lattice morphisms is a lattice morphism","status":"ok"},"proof":[{"text":"Composites of meet-semilattice morphisms and of join-semilattice morphisms are again such morphisms ([[AffineConstructive.theory.lattices.compose_meetsl_mor]], [[AffineConstructive.theory.lattices.compose_joinsl_mor]]). So g ∘ f preserves both meets and joins, which makes it a lattice morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.compose_bounded_lattice_mor","base":"compose_bounded_lattice_mor","kind":"prf","start":215,"body":[216,218],"status":"ok","short":{"text":"The composite of two bounded lattice morphisms is a bounded lattice morphism","status":"ok"},"proof":[{"text":"Composites of bounded meet-semilattice morphisms and of bounded join-semilattice morphisms are again such morphisms ([[AffineConstructive.theory.lattices.compose_bounded_meetsl_mor]], [[AffineConstructive.theory.lattices.compose_bounded_joinsl_mor]]). So g ∘ f is both, which makes it a bounded lattice morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.compose_meetsl_mor_flip","base":"compose_meetsl_mor_flip","kind":"def","start":220,"body":null,"status":"ok","short":{"text":"If f takes meets to joins and g joins to meets, g ∘ f preserves meets","status":"ok"},"long":{"text":"Two reversals compose to a preservation: if f takes meets of X to joins of Y and g takes joins of Y to meets of Z, then g ∘ f is a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Morphism]]. The flip classes are semigroup morphisms between a meet structure on one side and a join structure on the other, so this is [[AffineConstructive.theory.groups.compose_semigroup_mor]] read at those structures. It is registered for resolution at a lower priority than [[AffineConstructive.theory.lattices.compose_meetsl_mor]], which handles two preserving maps. In this file [[AffineConstructive.theory.lattices.compose_lattice_mor_flip]] uses it for the meet half of a composite of two lattice flip morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_joinsl_mor_flip","base":"compose_joinsl_mor_flip","kind":"def","start":221,"body":null,"status":"ok","short":{"text":"Joins to meets followed by meets to joins gives a join-preserving composite","status":"ok"},"long":{"text":"If f takes joins of X to meets of Y and g takes meets of Y to joins of Z, then g ∘ f preserves joins: [[AffineConstructive.theory.groups.compose_semigroup_mor]] at the join structures of X and Z and the meet structure of Y. The dual of [[AffineConstructive.theory.lattices.compose_meetsl_mor_flip]], registered for resolution after the straight [[AffineConstructive.theory.lattices.compose_joinsl_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_meetsl_flip_mor_l","base":"compose_meetsl_flip_mor_l","kind":"def","start":222,"body":null,"status":"ok","short":{"text":"A meet-preserving map followed by a meet-to-join map takes meets to joins","status":"ok"},"long":{"text":"If f preserves meets and g takes meets to joins, then g ∘ f takes meets to joins: one reversal, after a preservation, is a reversal. [[AffineConstructive.theory.groups.compose_semigroup_mor]] at the meet structures of X and Y and the join structure of Z; registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_meetsl_flip_mor_r","base":"compose_meetsl_flip_mor_r","kind":"def","start":223,"body":null,"status":"ok","short":{"text":"A meet-to-join map followed by a join-preserving map takes meets to joins","status":"ok"},"long":{"text":"If f takes meets to joins and g preserves joins, then g ∘ f takes meets to joins: [[AffineConstructive.theory.groups.compose_semigroup_mor]] from the meet structure of X through the join structures of Y and Z. With [[AffineConstructive.theory.lattices.compose_meetsl_flip_mor_l]] it covers a reversal on either side of a composite; registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_joinsl_flip_mor_l","base":"compose_joinsl_flip_mor_l","kind":"def","start":224,"body":null,"status":"ok","short":{"text":"A join-preserving map followed by a join-to-meet map takes joins to meets","status":"ok"},"long":{"text":"If f preserves joins and g takes joins to meets, then g ∘ f takes joins to meets: [[AffineConstructive.theory.groups.compose_semigroup_mor]] at the join structures of X and Y and the meet structure of Z. Registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_joinsl_flip_mor_r","base":"compose_joinsl_flip_mor_r","kind":"def","start":225,"body":null,"status":"ok","short":{"text":"A join-to-meet map followed by a meet-preserving map takes joins to meets","status":"ok"},"long":{"text":"If f takes joins to meets and g preserves meets, then g ∘ f takes joins to meets: [[AffineConstructive.theory.groups.compose_semigroup_mor]] from the join structure of X through the meet structures of Y and Z. The other side of [[AffineConstructive.theory.lattices.compose_joinsl_flip_mor_l]]; registered for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_bounded_meetsl_mor_flip","base":"compose_bounded_meetsl_mor_flip","kind":"def","start":226,"body":null,"status":"ok","short":{"text":"Composing a meet-and-top reversal with a join-and-bottom reversal gives a bounded meet-semilattice morphism","status":"ok"},"long":{"text":"If f takes meets to joins and ⊤ to ⊥, and g takes joins to meets and ⊥ to ⊤, then g ∘ f preserves meets and top. The bounded version of [[AffineConstructive.theory.lattices.compose_meetsl_mor_flip]]: [[AffineConstructive.theory.groups.compose_monoid_mor]] at the meet monoid of X, the join monoid of Y and the meet monoid of Z. Registered for resolution after the straight [[AffineConstructive.theory.lattices.compose_bounded_meetsl_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_bounded_joinsl_mor_flip","base":"compose_bounded_joinsl_mor_flip","kind":"def","start":227,"body":null,"status":"ok","short":{"text":"Composing a join-and-bottom reversal with a meet-and-top reversal gives a bounded join-semilattice morphism","status":"ok"},"long":{"text":"If f takes joins to meets and ⊥ to ⊤, and g takes meets to joins and ⊤ to ⊥, then g ∘ f preserves joins and bottom: [[AffineConstructive.theory.groups.compose_monoid_mor]] at the join monoid of X, the meet monoid of Y and the join monoid of Z. The dual of [[AffineConstructive.theory.lattices.compose_bounded_meetsl_mor_flip]], registered for resolution after [[AffineConstructive.theory.lattices.compose_bounded_joinsl_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_bounded_meetsl_flip_mor_l","base":"compose_bounded_meetsl_flip_mor_l","kind":"def","start":228,"body":null,"status":"ok","short":{"text":"A bounded meet-semilattice morphism followed by a map taking meets to joins and ⊤ to ⊥ is such a map","status":"ok"},"long":{"text":"Suppose f preserves finite meets and g turns finite meets into finite joins (meets to joins and ⊤ to ⊥). Then g ∘ f also turns finite meets into finite joins. A flip morphism is a straight morphism into the opposite order. So this is the composition of monoid morphisms, [[AffineConstructive.theory.groups.compose_monoid_mor]], applied with g's codomain given the opposite structure. It is one entry of the composition table for flip morphisms, the lattice counterpart of the order-reversing maps of the order theory.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_bounded_meetsl_flip_mor_r","base":"compose_bounded_meetsl_flip_mor_r","kind":"def","start":229,"body":null,"status":"ok","short":{"text":"A map taking finite meets to finite joins, followed by a bounded join-semilattice morphism, is such a map","status":"ok"},"long":{"text":"Suppose f turns finite meets into finite joins (f (x ⊓ y) = f x ⊔ f y, f ⊤ = ⊥) and g preserves finite joins. Then g ∘ f turns finite meets into finite joins. The proof is the composition of monoid morphisms, [[AffineConstructive.theory.groups.compose_monoid_mor]]: Y is read as a monoid under ⊔ with unit ⊥, which is how both f and g see it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_bounded_joinsl_flip_mor_l","base":"compose_bounded_joinsl_flip_mor_l","kind":"def","start":230,"body":null,"status":"ok","short":{"text":"A bounded join-semilattice morphism followed by a map taking finite joins to finite meets is such a map","status":"ok"},"long":{"text":"Suppose f preserves finite joins and g turns finite joins into finite meets (joins to meets and ⊥ to ⊤). Then g ∘ f turns finite joins into finite meets. This is the dual of [[AffineConstructive.theory.lattices.compose_bounded_meetsl_flip_mor_l]] and, like it, an instance of [[AffineConstructive.theory.groups.compose_monoid_mor]] in which the flip is read as a straight morphism into the opposite order.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_bounded_joinsl_flip_mor_r","base":"compose_bounded_joinsl_flip_mor_r","kind":"def","start":231,"body":null,"status":"ok","short":{"text":"A map taking finite joins to finite meets, followed by a bounded meet-semilattice morphism, is such a map","status":"ok"},"long":{"text":"Suppose f turns finite joins into finite meets and g preserves finite meets. Then g ∘ f turns finite joins into finite meets. This is the dual of [[AffineConstructive.theory.lattices.compose_bounded_meetsl_flip_mor_r]] and an instance of [[AffineConstructive.theory.groups.compose_monoid_mor]], with Y read as a monoid under ⊓ with unit ⊤.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.compose_lattice_mor_flip","base":"compose_lattice_mor_flip","kind":"prf","start":232,"body":[233,244],"status":"ok","short":{"text":"The composite of two lattice flip morphisms is a lattice morphism","status":"ok"},"proof":[{"text":"Let f and g be lattice flip morphisms. A lattice morphism g ∘ f requires four things: that X and Z are lattices, that the composite preserves meets, and that it preserves joins.","status":"ok","from":0,"to":2},{"text":"X is a lattice because it is the domain of the flip morphism f.","status":"ok","from":3,"to":4},{"text":"As a flip morphism, g has a lattice as codomain only up to order reversal: Z ᵒᵖ is a lattice. Reversing the order once more makes Z a lattice, by [[AffineConstructive.theory.lattices.Lattice_op]].","status":"ok","from":5,"to":6},{"text":"f takes meets to joins and g takes joins to meets, so g ∘ f preserves meets, by [[AffineConstructive.theory.lattices.compose_meetsl_mor_flip]].","status":"ok","from":7,"to":8},{"text":"In the same way, f takes joins to meets and g takes meets back to joins, so the composite preserves joins, by [[AffineConstructive.theory.lattices.compose_joinsl_mor_flip]].","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.theory.lattices.compose_lattice_flip_mor_l","base":"compose_lattice_flip_mor_l","kind":"prf","start":245,"body":[246,257],"status":"ok","short":{"text":"A lattice morphism followed by a lattice flip morphism is a lattice flip morphism","status":"ok"},"proof":[{"text":"Let f be a lattice morphism and g a lattice flip morphism. Four things are needed for g ∘ f: X is a lattice, Z ᵒᵖ is a lattice, meets go to joins, and joins go to meets.","status":"ok","from":0,"to":2},{"text":"X is a lattice because it is the domain of the lattice morphism f.","status":"ok","from":3,"to":4},{"text":"Z ᵒᵖ is a lattice because it is the codomain of the flip morphism g.","status":"ok","from":5,"to":6},{"text":"f preserves meets and g turns meets into joins, so the composite turns meets into joins, by [[AffineConstructive.theory.lattices.compose_meetsl_flip_mor_l]].","status":"ok","from":7,"to":8},{"text":"In the same way, f preserves joins and g turns joins into meets, so the composite turns joins into meets, by [[AffineConstructive.theory.lattices.compose_joinsl_flip_mor_l]].","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.theory.lattices.compose_lattice_flip_mor_r","base":"compose_lattice_flip_mor_r","kind":"prf","start":258,"body":[259,270],"status":"ok","short":{"text":"A lattice flip morphism followed by a lattice morphism is a lattice flip morphism","status":"ok"},"proof":[{"text":"Let f be a lattice flip morphism and g a lattice morphism. Four things are needed for g ∘ f: X is a lattice, Z ᵒᵖ is a lattice, meets go to joins, and joins go to meets.","status":"ok","from":0,"to":2},{"text":"X is a lattice because it is the domain of f.","status":"ok","from":3,"to":4},{"text":"Z is a lattice because it is the codomain of the lattice morphism g. Its opposite is therefore a lattice, by [[AffineConstructive.theory.lattices.Lattice_op]].","status":"ok","from":5,"to":6},{"text":"f turns meets into joins and g preserves joins, so the composite turns meets into joins, by [[AffineConstructive.theory.lattices.compose_meetsl_flip_mor_r]].","status":"ok","from":7,"to":8},{"text":"In the same way, f turns joins into meets and g preserves meets, so the composite turns joins into meets, by [[AffineConstructive.theory.lattices.compose_joinsl_flip_mor_r]].","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.theory.lattices.compose_bounded_lattice_mor_flip","base":"compose_bounded_lattice_mor_flip","kind":"prf","start":271,"body":[272,283],"status":"ok","short":{"text":"The composite of two bounded lattice flip morphisms is a bounded lattice morphism","status":"ok"},"proof":[{"text":"Let f and g be bounded lattice flip morphisms. A bounded lattice morphism g ∘ f requires four things: that X and Z are bounded lattices, that the composite preserves meets and ⊤, and that it preserves joins and ⊥.","status":"ok","from":0,"to":2},{"text":"X is a bounded lattice because it is the domain of f.","status":"ok","from":3,"to":4},{"text":"As the codomain of the flip morphism g, Z ᵒᵖ is a bounded lattice. Reversing the order again makes Z one, by [[AffineConstructive.theory.lattices.BoundedLattice_op]].","status":"ok","from":5,"to":6},{"text":"f takes meets to joins and ⊤ to ⊥, and g takes these back to meets and ⊤. So the composite preserves meets and ⊤, by [[AffineConstructive.theory.lattices.compose_bounded_meetsl_mor_flip]].","status":"ok","from":7,"to":8},{"text":"Dually, the composite preserves joins and ⊥, by [[AffineConstructive.theory.lattices.compose_bounded_joinsl_mor_flip]].","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.theory.lattices.compose_bounded_lattice_flip_mor_l","base":"compose_bounded_lattice_flip_mor_l","kind":"prf","start":284,"body":[285,296],"status":"ok","short":{"text":"A bounded lattice morphism followed by a bounded lattice flip morphism is a bounded lattice flip morphism","status":"ok"},"proof":[{"text":"Let f be a bounded lattice morphism and g a bounded lattice flip morphism. Four things are needed for g ∘ f: X is a bounded lattice, Z ᵒᵖ is a bounded lattice, the composite reverses meets and ⊤, and it reverses joins and ⊥.","status":"ok","from":0,"to":2},{"text":"X is a bounded lattice because it is the domain of f.","status":"ok","from":3,"to":4},{"text":"Z ᵒᵖ is a bounded lattice because it is the codomain of the flip morphism g.","status":"ok","from":5,"to":6},{"text":"f preserves meets and ⊤, and g sends them to joins and ⊥. This gives the meet half, by [[AffineConstructive.theory.lattices.compose_bounded_meetsl_flip_mor_l]].","status":"ok","from":7,"to":8},{"text":"Dually, f preserves joins and ⊥, and g sends them to meets and ⊤, by [[AffineConstructive.theory.lattices.compose_bounded_joinsl_flip_mor_l]].","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.theory.lattices.compose_bounded_lattice_flip_mor_r","base":"compose_bounded_lattice_flip_mor_r","kind":"prf","start":297,"body":[298,309],"status":"ok","short":{"text":"A bounded lattice flip morphism followed by a bounded lattice morphism is a bounded lattice flip morphism","status":"ok"},"proof":[{"text":"Let f be a bounded lattice flip morphism and g a bounded lattice morphism. Four things are needed for g ∘ f: X is a bounded lattice, Z ᵒᵖ is a bounded lattice, the composite reverses meets and ⊤, and it reverses joins and ⊥.","status":"ok","from":0,"to":2},{"text":"X is a bounded lattice because it is the domain of f.","status":"ok","from":3,"to":4},{"text":"Z is a bounded lattice because it is the codomain of g. Its opposite is therefore one, by [[AffineConstructive.theory.lattices.BoundedLattice_op]].","status":"ok","from":5,"to":6},{"text":"f sends meets and ⊤ to joins and ⊥, and g preserves these. This gives the meet half, by [[AffineConstructive.theory.lattices.compose_bounded_meetsl_flip_mor_r]].","status":"ok","from":7,"to":8},{"text":"Dually, f sends joins and ⊥ to meets and ⊤, and g preserves these, by [[AffineConstructive.theory.lattices.compose_bounded_joinsl_flip_mor_r]].","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.theory.lattices.invert_meetsl_mor","base":"invert_meetsl_mor","kind":"def","start":328,"body":null,"status":"ok","short":{"text":"The inverse of a bijective meet-semilattice morphism preserves meets","status":"ok"},"long":{"text":"Suppose f preserves meets and is bijective, with a designated inverse. Then the inverse also preserves meets: f⁻¹ (x ⊓ y) = f⁻¹ x ⊓ f⁻¹ y. This is [[AffineConstructive.theory.groups.invert_semigroup_mor]] for the semigroup ⊓, and the instance means that a lattice isomorphism needs to be checked in one direction only.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.invert_joinsl_mor","base":"invert_joinsl_mor","kind":"def","start":329,"body":null,"status":"ok","short":{"text":"The inverse of a bijective join-semilattice morphism preserves joins","status":"ok"},"long":{"text":"This is the join counterpart of [[AffineConstructive.theory.lattices.invert_meetsl_mor]]: if f preserves joins and has a designated inverse that makes it bijective, the inverse preserves joins too. It is [[AffineConstructive.theory.groups.invert_semigroup_mor]] for the semigroup ⊔.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.invert_bounded_meetsl_mor","base":"invert_bounded_meetsl_mor","kind":"def","start":332,"body":null,"status":"ok","short":{"text":"The inverse of a bijective bounded meet-semilattice morphism preserves meets and top","status":"ok"},"long":{"text":"Suppose f preserves meets and ⊤ and is bijective. Then its inverse preserves both. This is [[AffineConstructive.theory.groups.invert_monoid_mor]] for the monoid of ⊓ with unit ⊤.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.invert_bounded_joinsl_mor","base":"invert_bounded_joinsl_mor","kind":"def","start":333,"body":null,"status":"ok","short":{"text":"The inverse of a bijective bounded join-semilattice morphism preserves joins and bottom","status":"ok"},"long":{"text":"Suppose f preserves joins and ⊥ and is bijective. Then its inverse preserves both. This is [[AffineConstructive.theory.groups.invert_monoid_mor]] for the monoid of ⊔ with unit ⊥, the dual of [[AffineConstructive.theory.lattices.invert_bounded_meetsl_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.invert_lattice_mor","base":"invert_lattice_mor","kind":"prf","start":336,"body":[337,339],"status":"ok","short":{"text":"The inverse of a bijective lattice morphism is a lattice morphism","status":"ok"},"proof":[{"text":"A lattice morphism is a morphism of meet semilattices together with a morphism of join semilattices. The inverse of f is each of these, by [[AffineConstructive

.theory.lattices.invert_meetsl_mor]] and [[AffineConstructive.theory.lattices.invert_joinsl_mor]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.invert_bounded_lattice_mor","base":"invert_bounded_lattice_mor","kind":"prf","start":341,"body":[342,344],"status":"ok","short":{"text":"The inverse of a bijective bounded lattice morphism is a bounded lattice morphism","status":"ok"},"proof":[{"text":"A bounded lattice morphism is a pair: a bounded meet-semilattice morphism and a bounded join-semilattice morphism. The inverse of f is each of these, by [[AffineConstructive.theory.lattices.invert_bounded_meetsl_mor]] and [[AffineConstructive.theory.lattices.invert_bounded_joinsl_mor]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.Build_MeetSemiLattice_Morphism","base":"Build_MeetSemiLattice_Morphism","kind":"def","start":346,"body":null,"status":"ok","short":{"text":"Builds a meet-semilattice morphism between meet semilattices from f (x ⊓ y) = f x ⊓ f y","status":"ok"},"long":{"text":"This is the constructor to use for maps that preserve meets: given meet semilattices X and Y and a function f : X ⇾ Y, the equation f (x ⊓ y) = f x ⊓ f y for all x and y makes f a meet-semilattice morphism. It is [[AffineConstructive.interfaces.abstract_algebra.Build_SemiGroup_Morphism]] read at the semigroup of ⊓ on each side. It states the hypothesis in lattice notation, so the reader never sees the generic semigroup operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.Build_JoinSemiLattice_Morphism","base":"Build_JoinSemiLattice_Morphism","kind":"def","start":347,"body":null,"status":"ok","short":{"text":"Builds a join-semilattice morphism between join semilattices from f (x ⊔ y) = f x ⊔ f y","status":"ok"},"long":{"text":"This is the join counterpart of [[AffineConstructive.theory.lattices.Build_MeetSemiLattice_Morphism]]: for join semilattices X and Y, a function f that preserves binary joins is a join-semilattice morphism. It is [[AffineConstructive.interfaces.abstract_algebra.Build_SemiGroup_Morphism]] at the semigroup of ⊔.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.alt_Build_BoundedMeetSemiLattice_Morphism","base":"alt_Build_BoundedMeetSemiLattice_Morphism","kind":"def","start":348,"body":null,"status":"ok","short":{"text":"Builds a bounded meet-semilattice morphism from preservation of binary meets and of ⊤","status":"ok"},"long":{"text":"For bounded meet semilattices X and Y, a function f with f (x ⊓ y) = f x ⊓ f y and f ⊤ = ⊤ preserves all finite meets, so it is a bounded meet-semilattice morphism. It is [[AffineConstructive.theory.groups.alt_Build_Monoid_Morphism]] for the monoid of ⊓ with unit ⊤. It is called alternative because it asks for the two equations instead of the nested structure of the class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice_Morphism","base":"alt_Build_BoundedJoinSemiLattice_Morphism","kind":"def","start":349,"body":null,"status":"ok","short":{"text":"Builds a bounded join-semilattice morphism from preservation of binary joins and of ⊥","status":"ok"},"long":{"text":"For bounded join semilattices X and Y, a function f with f (x ⊔ y) = f x ⊔ f y and f ⊥ = ⊥ preserves all finite joins. This is the dual of [[AffineConstructive.theory.lattices.alt_Build_BoundedMeetSemiLattice_Morphism]] and an instance of [[AffineConstructive.theory.groups.alt_Build_Monoid_Morphism]] for the monoid of ⊔ with unit ⊥.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.Build_MeetSemiLattice_Flip_Morphism","base":"Build_MeetSemiLattice_Flip_Morphism","kind":"def","start":350,"body":null,"status":"ok","short":{"text":"Builds a meet-to-join morphism from f (x ⊓ y) = f x ⊔ f y","status":"ok"},"long":{"text":"For a meet semilattice X and a join semilattice Y, a function f with f (x ⊓ y) = f x ⊔ f y for all x and y is a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice_Flip_Morphism]]. The constructor is [[AffineConstructive.interfaces.abstract_algebra.Build_SemiGroup_Morphism]] from the semigroup of ⊓ on X to the semigroup of ⊔ on Y. In this file [[AffineConstructive.theory.lattices.Build_Lattice_Flip_Morphism]] uses it for the meet half of a lattice flip morphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.Build_JoinSemiLattice_Flip_Morphism","base":"Build_JoinSemiLattice_Flip_Morphism","kind":"def","start":351,"body":null,"status":"ok","short":{"text":"Builds a map turning joins into meets from f (x ⊔ y) = f x ⊓ f y","status":"ok"},"long":{"text":"This is the dual of [[AffineConstructive.theory.lattices.Build_MeetSemiLattice_Flip_Morphism]]: for a join semilattice X and a meet semilattice Y, a function with f (x ⊔ y) = f x ⊓ f y is a join-semilattice morphism into the opposite of Y. It is built by [[AffineConstructive.interfaces.abstract_algebra.Build_SemiGroup_Morphism]] from the semigroup of ⊔ to the semigroup of ⊓.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.alt_Build_Lattice_Morphism","base":"alt_Build_Lattice_Morphism","kind":"prf","start":352,"body":[353,360],"status":"ok","short":{"text":"A map between lattices preserving binary meets and joins is a lattice morphism","status":"ok"},"proof":[{"text":"Assume the two preservation equations. That X and Y are lattices is already assumed, so what remains is that f is a morphism of meet semilattices and a morphism of join semilattices.","status":"ok","from":0,"to":2},{"text":"The meet equation makes f a meet-semilattice morphism, by [[AffineConstructive.theory.lattices.Build_MeetSemiLattice_Morphism]].","status":"ok","from":3,"to":4},{"text":"The join equation makes f a join-semilattice morphism, by [[AffineConstructive.theory.lattices.Build_JoinSemiLattice_Morphism]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.lattices.Build_Lattice_Flip_Morphism","base":"Build_Lattice_Flip_Morphism","kind":"prf","start":361,"body":[362,369],"status":"ok","short":{"text":"A map between lattices turning meets into joins and joins into meets is a lattice flip morphism","status":"ok"},"proof":[{"text":"Assume the two equations that exchange meets and joins. X is a lattice by assumption, and Y ᵒᵖ is a lattice by [[AffineConstructive.theory.lattices.Lattice_op]]. What remains is that f, read into the opposite order, preserves meets and preserves joins.","status":"ok","from":0,"to":2},{"text":"The equation f (x ⊓ y) = f x ⊔ f y says that f turns meets into joins, by [[AffineConstructive.theory.lattices.Build_MeetSemiLattice_Flip_Morphism]].","status":"ok","from":3,"to":4},{"text":"The equation f (x ⊔ y) = f x ⊓ f y says that f turns joins into meets, by [[AffineConstructive.theory.lattices.Build_JoinSemiLattice_Flip_Morphism]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.lattices.alt_Build_BoundedLattice_Morphism","base":"alt_Build_BoundedLattice_Morphism","kind":"prf","start":370,"body":[371,378],"status":"ok","short":{"text":"A map between bounded lattices preserving ⊓, ⊔, ⊤ and ⊥ is a bounded lattice morphism","status":"ok"},"proof":[{"text":"Take the four preservation laws as hypotheses. A bounded lattice morphism is a bounded meet-semilattice morphism and a bounded join-semilattice morphism together; the remaining components are found automatically, and those two are left to show.","status":"ok","from":0,"to":2},{"text":"Preservation of binary meets and of ⊤ gives the bounded meet-semilattice morphism, by [[AffineConstructive.theory.lattices.alt_Build_BoundedMeetSemiLattice_Morphism]].","status":"ok","from":3,"to":4},{"text":"Preservation of binary joins and of ⊥ gives the bounded join-semilattice morphism, by [[AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice_Morphism]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.lattices.Build_BoundedLattice_Flip_Morphism","base":"Build_BoundedLattice_Flip_Morphism","kind":"prf","start":379,"body":[380,387],"status":"ok","short":{"text":"A map between bounded lattices exchanging ⊓ with ⊔ and ⊤ with ⊥ is a bounded lattice flip morphism","status":"ok"},"proof":[{"text":"Take the four exchange laws as hypotheses. A flip morphism is a bounded lattice morphism into the opposite of Y, where meet and join, top and bottom, are exchanged; it splits into a bounded meet-semilattice morphism and a bounded join-semilattice morphism into Y ᵒᵖ, and those two are left to show.","status":"ok","from":0,"to":2},{"text":"Meets of Y ᵒᵖ are joins of Y and its top is ⊥ of Y, so f(x ⊓ y) = f x ⊔ f y and f ⊤ = ⊥ say that f preserves meets and top into Y ᵒᵖ; [[AffineConstructive.theory.lattices.alt_Build_BoundedMeetSemiLattice_Morphism]] gives the meet half.","status":"ok","from":3,"to":4},{"text":"Dually, f(x ⊔ y) = f x ⊓ f y and f ⊥ = ⊤ say that f preserves joins and bottom into Y ᵒᵖ, and [[AffineConstructive.theory.lattices.alt_Build_BoundedJoinSemiLattice_Morphism]] gives the join half.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.lattices.projected_meet_sl","base":"projected_meet_sl","kind":"def","start":388,"body":null,"status":"ok","short":{"text":"A meet carried by an injective map into a meet semilattice makes X a meet semilattice","status":"ok"},"long":{"text":"Suppose X has a meet operation and f : X ⇾ L is an injective map into a meet semilattice with f (x ⊓ y) = f x ⊓ f y. Then X is a [[AffineConstructive.interfaces.abstract_algebra.MeetSemiLattice]]: associativity, commutativity and idempotence hold in L, transfer through f, and come back to X by injectivity. This is [[AffineConstructive.theory.groups.projected_semilattice]] at ⊓. In this file [[AffineConstructive.theory.lattices.projected_lattice]] builds on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.projected_join_sl","base":"projected_join_sl","kind":"def","start":389,"body":null,"status":"ok","short":{"text":"A join on X that an injective map into a join semilattice preserves makes X a join semilattice","status":"ok"},"long":{"text":"This is the join counterpart of [[AffineConstructive.theory.lattices.projected_meet_sl]]: a join on X that an injective f : X ⇾ L into a join semilattice preserves satisfies the semilattice laws, which are pulled back along f. It is [[AffineConstructive.theory.groups.projected_semilattice]] at ⊔.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.projected_lattice","base":"projected_lattice","kind":"prf","start":390,"body":[391,404],"status":"ok","short":{"text":"A meet and join on X that an injective map into a lattice preserves make X a lattice","status":"ok"},"proof":[{"text":"Take the preservation of meets and of joins as hypotheses. With each one separately, [[AffineConstructive.theory.lattices.projected_meet_sl]] and [[AffineConstructive.theory.lattices.projected_join_sl]] make X a meet semilattice and a join semilattice. A lattice is these two together with the two absorption laws, which are what is left.","status":"ok","from":0,"to":4},{"text":"For x ⊔ (x ⊓ y) = x, fix x and y. Since f is injective it suffices to prove the equality after applying f, and preservation of joins and then of meets turns the left side into f x ⊔ (f x ⊓ f y). That is f x by the absorption law of L, [[AffineConstructive.interfaces.common_props.absorption]].","status":"ok","from":5,"to":8},{"text":"The other law, x ⊓ (x ⊔ y) = x, is the same argument with meet and join exchanged: apply f, push it inside by the two preservation laws, and use absorption in L.","status":"ok","from":9,"to":13}]},{"name":"AffineConstructive.theory.lattices.projected_distr_lattice","base":"projected_distr_lattice","kind":"prf","start":405,"body":[406,422],"status":"ok","short":{"text":"A meet and join on X that an injective map into a distributive lattice preserves make X distributive","status":"ok"},"proof":[{"text":"Take the preservation of meets and of joins as hypotheses. With them, [[AffineConstructive.theory.lattices.projected_lattice]] makes X a lattice, and the two distributive laws are left to show.","status":"ok","from":0,"to":3},{"text":"For x ⊔ (y ⊓ z) = (x ⊔ y) ⊓ (x ⊔ z), fix x, y and z. By injectivity of f it suffices to prove the equality of the images. Preservation of joins and of meets, applied at the outer level on each side and then inside, turns this into the same equation for f x, f y and f z, which is the distributive law of L, [[AffineConstructive.interfaces.common_props.distribute_l]].","status":"ok","from":4,"to":9},{"text":"The law x ⊓ (y ⊔ z) = (x ⊓ y) ⊔ (x ⊓ z) goes the same way, with meet and join exchanged: apply f, push it inside, and use distributivity in L.","status":"ok","from":10,"to":16}]},{"name":"AffineConstructive.theory.lattices.projected_bounded_meet_sl","base":"projected_bounded_meet_sl","kind":"def","start":423,"body":null,"status":"ok","short":{"text":"A meet and top on X that an injective map into a bounded meet semilattice preserves make X one","status":"ok"},"long":{"text":"Suppose X has a meet and a top and f : X ⇾ L is an injective map into a bounded meet semilattice with f (x ⊓ y) = f x ⊓ f y and f ⊤ = ⊤. Then X is a bounded meet semilattice. As in [[AffineConstructive.theory.lattices.projected_meet_sl]], the laws are checked in L and pulled back along f by injectivity. This is [[AffineConstructive.theory.groups.projected_bounded_semilattice]] at the monoid of ⊓ with unit ⊤.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.projected_bounded_join_sl","base":"projected_bounded_join_sl","kind":"def","start":424,"body":null,"status":"ok","short":{"text":"A join and bottom on X that an injective map into a bounded join semilattice preserves make X one","status":"ok"},"long":{"text":"This is the dual of [[AffineConstructive.theory.lattices.projected_bounded_meet_sl]]: a join and a bottom on X that an injective map into a bounded join semilattice preserves satisfy the laws of a bounded join semilattice. It is [[AffineConstructive.theory.groups.projected_bounded_semilattice]] at the monoid of ⊔ with unit ⊥.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.lattices.projected_bounded_lattice","base":"projected_bounded_lattice","kind":"prf","start":425,"body":[426,432],"status":"ok","short":{"text":"Meet, join, top and bottom on X that an injective map into a bounded lattice preserves make X one","status":"ok"},"proof":[{"text":"Take the four preservation laws as hypotheses. From them, [[AffineConstructive.theory.lattices.projected_lattice]] makes X a lattice, [[AffineConstructive.theory.lattices.projected_bounded_meet_sl]] makes it a bounded meet semilattice, and [[AffineConstructive.theory.lattices.projected_bounded_join_sl]] makes it a bounded join semilattice.","status":"ok","from":0,"to":4},{"text":"A bounded lattice is these three structures together, so the proof is complete.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.theory.lattices.projected_bounded_distr_lattice","base":"projected_bounded_distr_lattice","kind":"prf","start":433,"body":[434,439],"status":"ok","short":{"text":"Meet, join, top and bottom preserved by an injection into a bounded distributive lattice make X one","status":"ok"},"proof":[{"text":"Take the four preservation laws as hypotheses. From them, [[AffineConstructive.theory.lattices.projected_bounded_lattice]] makes X a bounded lattice. [[AffineConstructive.theory.lattices.projected_distr_lattice]] applied to preservation of meets gives distributivity once preservation of joins is supplied as well.","status":"ok","from":0,"to":3},{"text":"A bounded distributive lattice is a bounded lattice that is distributive, so the two facts together complete the proof.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.theory.lattices.quote_meet_alt","base":"quote_meet_alt","kind":"prf","start":440,"body":[441,443],"status":"ok","short":{"text":"Under a meet-preserving f, quotations of x₁ and x₂ give a quotation y₁ ⊓ y₂ of x₁ ⊓ x₂","status":"ok"},"proof":[{"text":"A meet-semilattice morphism is in particular a morphism of semigroups for ⊓. Viewed that way, the statement is the semigroup case, [[AffineConstructive.theory.groups.quote_sg_op_alt]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.lattices.quote_join_alt","base":"quote_join_alt","kind":"prf","start":444,"body":[445,447],"status":"ok","short":{"text":"Under a join-preserving f, quotations of x₁ and x₂ give a quotation y₁ ⊔ y₂ of x₁ ⊔ x₂","status":"ok"},"proof":[{"text":"A join-semilattice morphism is in particular a morphism of semigroups for ⊔. Viewed that way, the statement is the semigroup case, [[AffineConstructive.theory.groups.quote_sg_op_alt]].","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.common_props":{"page":"common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.theory.groups":{"page":"groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.base":{"page":"../tactics/quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."}},"constants":null}</script>

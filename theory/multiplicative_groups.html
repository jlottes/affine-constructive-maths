monoid_left_id  (X:=mul_ops R)). Qed.\nLemma mult_1_r    `{MultiplicativeMonoid    R} : RightIdentity (X:=R) (·) 1. Proof. exact (monoid_right_id (X:=mul_ops R)). Qed.\n\nGlobal Hint Extern 2 (Associative   (·)    ) => simple notypeclasses refine mult_ass   : typeclass_instances.\nGlobal Hint Extern 2 (Commutative   (·)    ) => simple notypeclasses refine mult_com   : typeclass_instances.\nGlobal Hint Extern 2 (LeftIdentity  (·) _  ) => notypeclasses refine mult_1_l          : typeclass_instances.\nGlobal Hint Extern 2 (RightIdentity (·) _  ) => notypeclasses refine mult_1_r          : typeclass_instances.\n\n(** Simplification *)\nLocal Ltac simplify_chain tm := match goal with |- SimplifiesTo ?x ?y => change (SimplifiesToR (x,y)); trans tm end.\n\nLemma simplify_mult_1_l `{MultiplicativeMonoid M} {x x':M} `{!SimplifiesTo x x'} : SimplifiesTo (1 · x) x'.\nProof. simplify_chain x; trivial; split. exact (mult_1_l _). Qed.\nGlobal Hint Extern 2 (SimplifiesTo (1 · _) _) => notypeclasses refine simplify_mult_1_l : typeclass_instances.\n\nLemma simplify_mult_1_r `{MultiplicativeMonoid M} {x x':M} `{!SimplifiesTo x x'} : SimplifiesTo (x · 1) x'.\nProof. simplify_chain x; trivial; split. exact (mult_1_r _). Qed.\nGlobal Hint Extern 2 (SimplifiesTo (_ · 1) _) => notypeclasses refine simplify_mult_1_r : typeclass_instances.\n\n\nLemma MultiplicativeSemiGroup_op `{MultiplicativeSemiGroup G} : MultiplicativeSemiGroup (G ᵒᵖ).  Proof. exact (_ : SemiGroup (semigroup_op (mul_ops G))). Qed.\nLemma MultiplicativeMonoid_op    `{MultiplicativeMonoid G}    : MultiplicativeMonoid    (G ᵒᵖ).  Proof. exact (_ : Monoid (semigroup_op (mul_ops G))). Qed.\nLemma MultiplicativeComMonoid_op `{MultiplicativeComMonoid G} : MultiplicativeComMonoid (G ᵒᵖ).  Proof. exact (_ : CommutativeMonoid (semigroup_op (mul_ops G))). Qed.\nGlobal Hint Extern 2 (MultiplicativeSemiGroup (_ ᵒᵖ)) => simple notypeclasses refine MultiplicativeSemiGroup_op : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeM ps","kind":"abbrev","local":true},{"s":8292,"e":8299,"lib":"AffineConstructive.theory.multiplicative_groups","name":"mul_ops","kind":"abbrev","local":true},{"s":8333,"e":8338,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":8390,"e":8404,"lib":"AffineConstructive.theory.multiplicative_groups","name":"quote_mult_alt","kind":"thm","local":true},{"s":8444,"e":8449,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":8501,"e":8515,"lib":"AffineConstructive.theory.multiplicative_groups","name":"quote_mult_alt","kind":"thm","local":true},{"s":930,"e":933,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2608,"e":2622,"lib":"AffineConstructive.theory.multiplicative_groups","name":"simplify_chain","kind":"ltac","local":true},{"s":2894,"e":2908,"lib":"AffineConstructive.theory.multiplicative_groups","name":"simplify_chain","kind":"ltac","local":true}],"gloss":{"summary":"This file states the theory of multiplicative semigroups, monoids and commutative monoids, written with · and 1, by reading each result of the generic group theory of theory.groups through the view of a set as a monoid under its multiplication. It gives the laws [[AffineConstructive.theory.multiplicative_groups.mult_ass]], [[AffineConstructive.theory.multiplicative_groups.mult_com]], [[AffineConstructive.theory.multiplicative_groups.mult_1_l]] and [[AffineConstructive.theory.multiplicative_groups.mult_1_r]] and hints so that resolution finds them, constructors for the structures and their morphisms, and [[AffineConstructive.theory.multiplicative_groups.preserves_mult]]. Multiplicative semigroup and monoid morphisms are closed under identity, composition and inversion of bijections, the structures pass to the opposite ring, and an injective map that preserves the operations carries each structure back to its domain. Simplification rules remove a factor 1, and [[AffineConstructive.theory.multiplicative_groups.quote_mult_alt]] lets the quoting framework go through a product.","short":"Multiplicative semigroups, monoids and their morphisms, by way of the generic group theory","items":[{"name":"AffineConstructive.theory.multiplicative_groups.mul_ops","base":"mul_ops","kind":"abbrev","start":5,"body":null,"status":"ok","short":{"text":"Local shorthand for a set viewed as a monoid under · and 1","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.algebra_notation.MultiplicativeGroupOps]]: the set X with its multiplication read as the generic operation ∙ and its one as the generic unit. Through it every result stated for generic semigroups and monoids applies to the multiplicative structure, and the file uses it to state each multiplicative result as an instance of its generic counterpart.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.alt_Build_MultiplicativeSemiGroup","base":"alt_Build_MultiplicativeSemiGroup","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"Builds a multiplicative semigroup structure on M from the associativity of its multiplication","status":"ok"},"long":{"text":"A multiplicative semigroup is an associative multiplication: [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup]] M asks nothing of the multiplication · on M beyond the associativity law. This constructor takes that law and returns the semigroup structure.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.alt_Build_MultiplicativeMonoid","base":"alt_Build_MultiplicativeMonoid","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"Builds a multiplicative monoid from associativity and the left and right laws for 1","status":"ok"},"long":{"text":"Builds a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid]] on M from three laws: · is associative, 1 is a left identity and 1 is a right identity. It is [[AffineConstructive.theory.groups.alt_Build_Monoid]] read through the multiplicative view of M.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.alt_Build_MultiplicativeComMonoid","base":"alt_Build_MultiplicativeComMonoid","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"Builds a commutative multiplicative monoid from associativity, commutativity and a left identity law","status":"ok"},"long":{"text":"Builds a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeComMonoid]] on M from associativity, commutativity and the left identity law for 1. Commutativity yields the right identity law, so only one identity law is asked for. It is [[AffineConstructive.theory.groups.alt_Build_CommutativeMonoid]] read multiplicatively.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.one_inhabited","base":"one_inhabited","kind":"def","start":11,"body":[12,14],"status":"ok","short":{"text":"A set with a one is inhabited","status":"ok"},"proof":[{"text":"The element 1 is a witness: a set with a one is inhabited by it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.multiplicative_groups.mult_mon_inhabited","base":"mult_mon_inhabited","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"A multiplicative monoid is inhabited","status":"ok"},"long":{"text":"A multiplicative monoid is inhabited, because it has the element 1. The coercion lets a monoid hypothesis supply [[AffineConstructive.interfaces.sprop.Inhabited]] wherever an inhabited set is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.mult_monoid_semigroup","base":"mult_monoid_semigroup","kind":"def","start":16,"body":null,"status":"ok","short":{"text":"A multiplicative monoid is a multiplicative semigroup","status":"ok"},"long":{"text":"Forgets the unit: the multiplication of a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid]] is associative, so the set is a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup]]. The structure is obtained through the generic monoid-to-semigroup step on the multiplicative view. As a coercion, it lets a monoid hypothesis serve wherever a semigroup is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.mult_commonoid_monoid","base":"mult_commonoid_monoid","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"A commutative multiplicative monoid is a multiplicative monoid","status":"ok"},"long":{"text":"Forgets commutativity: a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeComMonoid]] is in particular a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid]]. Declared as a coercion so that the commutative structure gives the plain one wherever that is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.coercion:mult_monoid_semigroup","base":"coercion:mult_monoid_semigroup","kind":"coercion","start":18,"body":null,"status":"ok","short":{"text":"A multiplicative monoid serves as a multiplicative semigroup, through [[AffineConstructive.theory.multiplicative_groups.mult_monoid_semigroup]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.coercion:mult_commonoid_monoid","base":"coercion:mult_commonoid_monoid","kind":"coercion","start":19,"body":null,"status":"ok","short":{"text":"A commutative multiplicative monoid serves as a multiplicative monoid, through [[AffineConstructive.theory.multiplicative_groups.mult_commonoid_monoid]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.mult_ass","base":"mult_ass","kind":"prf","start":20,"body":[21,23],"status":"ok","short":{"text":"Multiplication in a multiplicative semigroup is associative","status":"ok"},"proof":[{"text":"Seen through its multiplicative operations, the set is a semigroup in the generic notation. Associativity of · is therefore the associativity law of that semigroup, read back for ·.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.multiplicative_groups.mult_com","base":"mult_com","kind":"prf","start":24,"body":[25,27],"status":"ok","short":{"text":"Multiplication in a commutative multiplicative monoid is commutative","status":"ok"},"proof":[{"text":"Seen through its multiplicative operations, the set is a commutative monoid, and so a commutative semigroup by [[AffineConstructive.theory.groups.commonoid_comsg]]. Commutativity of · is that semigroup's commutativity law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.multiplicative_groups.mult_1_l","base":"mult_1_l","kind":"prf","start":28,"body":[29,31],"status":"ok","short":{"text":"In a multiplicative monoid, 1 · x = x","status":"ok"},"proof":[{"text":"This is the left identity law of the generic monoid that the multiplicative operations make of the set, read for · and 1.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.multiplicative_groups.mult_1_r","base":"mult_1_r","kind":"prf","start":32,"body":[33,35],"status":"ok","short":{"text":"In a multiplicative monoid, x · 1 = x","status":"ok"},"proof":[{"text":"This is the right identity law of the generic monoid that the multiplicative operations make of the set, read for · and 1.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.multiplicative_groups.simplify_chain","base":"simplify_chain","kind":"ltac","start":40,"body":null,"status":"ok","short":{"text":"Splits a simplification goal x ⤳ y into x ⤳ tm and tm ⤳ y, through a given intermediate term tm","status":"ok"},"long":{"text":"The tactic applies to a goal `SimplifiesTo x y`, which says that the term x simplifies to y. It restates the goal as the simplification relation [[AffineConstructive.tactics.simplify.base.SimplifiesToR]] on the pair (x, y), so that it can be treated as a transitive relation. It then splits the goal by transitivity at the term tm it is given. Two goals remain: x simplifies to tm, and tm simplifies to y.\n\nThe file uses it to prove simplification rules of the form \"1 · x simplifies to x′ whenever x simplifies to x′\". The proof chains through x. The second goal, that x simplifies to x′, is the hypothesis. The first goal, that 1 · x simplifies to x, is an equality, and the identity law [[AffineConstructive.theory.multiplicative_groups.mult_1_l]] or [[AffineConstructive.theory.multiplicative_groups.mult_1_r]] proves it. The tactic is local to the file. It saves restating the goal by hand before each such transitivity step.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.simplify_mult_1_l","base":"simplify_mult_1_l","kind":"prf","start":41,"body":[42,45],"status":"ok","short":{"text":"Simplification removes a left factor 1: if x simplifies to x′, so does 1 · x","status":"ok"},"proof":[{"text":"Simplification is an equivalence relation, so the proof chains through x: x simplifies to x′ by hypothesis, so what remains is that 1 · x simplifies to x. That holds once the equality 1 · x = x is proved.","status":"ok","from":0,"to":1},{"text":"That equality is the left identity law [[AffineConstructive.theory.multiplicative_groups.mult_1_l]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.multiplicative_groups.simplify_mult_1_r","base":"simplify_mult_1_r","kind":"prf","start":47,"body":[48,51],"status":"ok","short":{"text":"Simplification removes a right factor 1: if x simplifies to x′, so does x · 1","status":"ok"},"proof":[{"text":"Simplification is an equivalence relation, so the proof chains through x: x simplifies to x′ by hypothesis, so what remains is that x · 1 simplifies to x. That holds once the equality x · 1 = x is proved.","status":"ok","from":0,"to":1},{"text":"That equality is the right identity law [[AffineConstructive.theory.multiplicative_groups.mult_1_r]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.multiplicative_groups.MultiplicativeSemiGroup_op","base":"MultiplicativeSemiGroup_op","kind":"prf","start":53,"body":[54,56],"status":"ok","short":{"text":"The opposite multiplication of a multiplicative semigroup is again a semigroup","status":"ok"},"proof":[{"text":"The opposite multiplication on G is the opposite of the generic semigroup that the multiplicative operations make of G. By [[AffineConstructive.theory.groups.SemiGroup_op]] that opposite is again a semigroup.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.multiplicative_groups.MultiplicativeMonoid_op","base":"MultiplicativeMonoid_op","kind":"prf","start":57,"body":[58,60],"status":"ok","short":{"text":"The opposite of a multiplicative monoid is a multiplicative monoid","status":"ok"},"proof":[{"text":"The opposite multiplication on G, with the same 1, is the opposite of the generic monoid that the multiplicative operations make of G. By [[AffineConstructive.theory.groups.Monoid_op]] that opposite is again a monoid.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.multiplicative_groups.MultiplicativeComMonoid_op","base":"MultiplicativeComMonoid_op","kind":"prf","start":61,"body":[62,64],"status":"ok","short":{"text":"The opposite of a commutative multiplicative monoid is a commutative multiplicative monoid","status":"ok"},"proof":[{"text":"The opposite multiplication on G, with the same 1, is the opposite of the generic commutative monoid that the multiplicative operations make of G. By [[AffineConstructive.theory.groups.CommutativeMonoid_op]] that opposite is again a commutative monoid.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.multiplicative_groups.MultiplicativeSemiGroup_Morphism_fun","base":"MultiplicativeSemiGroup_Morphism_fun","kind":"def","start":68,"body":null,"status":"ok","short":{"text":"Being a multiplicative semigroup morphism, as a predicate on the functions X ⇾ Y","status":"ok"},"long":{"text":"Being a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup_Morphism]], packaged as a function from the functions X ⇾ Y to propositions. It is the generic [[AffineConstructive.theory.groups.SemiGroup_Morphism_fun]] on the multiplicative views, rebuilt with [[AffineConstructive.theory.set.make_fun_alt]] so that it carries the multiplicative name. Declaring it canonical lets Rocq recognise the predicate where a function-valued property is expected.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.MultiplicativeMonoid_Morphism_fun","base":"MultiplicativeMonoid_Morphism_fun","kind":"def","start":69,"body":null,"status":"ok","short":{"text":"Being a multiplicative monoid morphism, as a predicate on the functions X ⇾ Y","status":"ok"},"long":{"text":"Being a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid_Morphism]], packaged as a function from the functions X ⇾ Y to propositions. It is [[AffineConstructive.theory.groups.Monoid_Morphism_fun]] read multiplicatively and is declared canonical, like [[AffineConstructive.theory.multiplicative_groups.MultiplicativeSemiGroup_Morphism_fun]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.multmon_mor_multsg_mor","base":"multmon_mor_multsg_mor","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"A multiplicative monoid morphism is a multiplicative semigroup morphism","status":"ok"},"long":{"text":"Forgets that 1 is preserved: a map that preserves multiplication and one preserves multiplication. As a coercion, it lets a monoid morphism be used wherever a semigroup morphism is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.coercion:multmon_mor_multsg_mor","base":"coercion:multmon_mor_multsg_mor","kind":"coercion","start":71,"body":null,"status":"ok","short":{"text":"A multiplicative monoid morphism is also a multiplicative semigroup morphism, so semigroup-morphism lemmas apply to it, via [[AffineConstructive.theory.multiplicative_groups.multmon_mor_multsg_mor]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.preserves_mult","base":"preserves_mult","kind":"def","start":72,"body":null,"status":"ok","short":{"text":"A multiplicative semigroup morphism satisfies f (x · y) = f x · f y","status":"ok"},"long":{"text":"The defining law of a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup_Morphism]], f (x · y) = f x · f y for all x and y. It is [[AffineConstructive.interfaces.abstract_algebra.preserves_sg_op]] applied to f on the multiplicative views, with f given explicitly so that a rewrite can name the map whose law it applies.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.MultiplicativeMonoid_Morphism_pointed","base":"MultiplicativeMonoid_Morphism_pointed","kind":"def","start":74,"body":null,"status":"ok","short":{"text":"A multiplicative monoid morphism preserves one: f 1 = 1","status":"ok"},"long":{"text":"A multiplicative monoid morphism preserves the unit, so it is a [[AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism]]. This is [[AffineConstructive.interfaces.abstract_algebra.monmor_pointed]] read multiplicatively. As a coercion, it makes f 1 = 1 available from a monoid morphism hypothesis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.id_mulsg_mor","base":"id_mulsg_mor","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"The identity of a multiplicative semigroup is a multiplicative semigroup morphism","status":"ok"},"long":{"text":"The identity function of a multiplicative semigroup preserves multiplication. This is [[AffineConstructive.theory.groups.id_semigroup_mor]] on the multiplicative view, made available as an instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.id_mulmon_mor","base":"id_mulmon_mor","kind":"def","start":77,"body":null,"status":"ok","short":{"text":"The identity of a multiplicative monoid is a multiplicative monoid morphism","status":"ok"},"long":{"text":"The identity function of a multiplicative monoid preserves multiplication and one. This is [[AffineConstructive.theory.groups.id_monoid_mor]] on the multiplicative view, made available as an instance.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.compose_mulsg_mor","base":"compose_mulsg_mor","kind":"def","start":79,"body":null,"status":"ok","short":{"text":"The composite of multiplicative semigroup morphisms is a multiplicative semigroup morphism","status":"ok"},"long":{"text":"If f : X ⇾ Y and g : Y ⇾ Z preserve multiplication, so does g ∘ f. This is [[AffineConstructive.theory.groups.compose_semigroup_mor]] read multiplicatively, and it is the instance that makes composites of multiplicative morphisms morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.compose_mulmon_mor","base":"compose_mulmon_mor","kind":"def","start":81,"body":null,"status":"ok","short":{"text":"The composite of multiplicative monoid morphisms is a multiplicative monoid morphism","status":"ok"},"long":{"text":"If f and g preserve multiplication and one, so does g ∘ f. This is [[AffineConstructive.theory.groups.compose_monoid_mor]] read multiplicatively, made available as an instance for composites.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.invert_mulsg_mor","base":"invert_mulsg_mor","kind":"def","start":83,"body":null,"status":"ok","short":{"text":"The inverse of a bijective multiplicative semigroup morphism is a multiplicative semigroup morphism","status":"ok"},"long":{"text":"If f preserves multiplication and is bijective with a designated inverse, the inverse also preserves multiplication. This is [[AffineConstructive.theory.groups.invert_semigroup_mor]] on the multiplicative views.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.invert_mulmon_mor","base":"invert_mulmon_mor","kind":"def","start":85,"body":null,"status":"ok","short":{"text":"The inverse of a bijective multiplicative monoid morphism is a multiplicative monoid morphism","status":"ok"},"long":{"text":"If f preserves multiplication and one and is bijective with a designated inverse, its inverse preserves both. This is [[AffineConstructive.theory.groups.invert_monoid_mor]] on the multiplicative views.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.Build_MultiplicativeSemiGroup_Morphism","base":"Build_MultiplicativeSemiGroup_Morphism","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"Builds a multiplicative semigroup morphism from f (x · y) = f x · f y","status":"ok"},"long":{"text":"Given multiplicative semigroups X and Y and a function f : X ⇾ Y, the law f (x · y) = f x · f y for all x and y makes f a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeSemiGroup_Morphism]]. This is [[AffineConstructive.interfaces.abstract_algebra.Build_SemiGroup_Morphism]] on the multiplicative views.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.alt_Build_MultiplicativeMonoid_Morphism","base":"alt_Build_MultiplicativeMonoid_Morphism","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"Builds a multiplicative monoid morphism from preservation of · and of 1","status":"ok"},"long":{"text":"Given multiplicative monoids X and Y, a function f : X ⇾ Y with f (x · y) = f x · f y and f 1 = 1 is a [[AffineConstructive.interfaces.abstract_algebra.MultiplicativeMonoid_Morphism]]. This is [[AffineConstructive.theory.groups.alt_Build_Monoid_Morphism]] read multiplicatively.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.projected_multiplicative_semigroup","base":"projected_multiplicative_semigroup","kind":"def","start":89,"body":null,"status":"ok","short":{"text":"A multiplication carried by an injective map into a multiplicative semigroup is associative","status":"ok"},"long":{"text":"Transfer of structure along an injection. Let f : X ⇾ S be injective, S a multiplicative semigroup, and X equipped with a multiplication that f carries to the multiplication of S, f (x · y) = f x · f y. Then X is a multiplicative semigroup: f takes both bracketings of a product in X to the two bracketings of the image product in S, which are equal by associativity in S, and injectivity brings the equality back to X. This is [[AffineConstructive.theory.groups.projected_semigroup]] read multiplicatively.\n\nIn the recorded development it is used once, in a proof in theory.rings.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.projected_multiplicative_monoid","base":"projected_multiplicative_monoid","kind":"def","start":90,"body":null,"status":"ok","short":{"text":"A multiplication and one carried by an injective map into a multiplicative monoid make X one","status":"ok"},"long":{"text":"Suppose f : X ⇾ M is injective into a multiplicative monoid M, preserves multiplication, and sends the one of X to 1. Then X is a multiplicative monoid: each monoid law in X follows, by injectivity, from the same law in M. This is [[AffineConstructive.theory.groups.projected_monoid]] read multiplicatively.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.projected_multiplicative_com_monoid","base":"projected_multiplicative_com_monoid","kind":"def","start":91,"body":null,"status":"ok","short":{"text":"A multiplication and one carried by an injective map into a commutative multiplicative monoid make X one","status":"ok"},"long":{"text":"The commutative case of [[AffineConstructive.theory.multiplicative_groups.projected_multiplicative_monoid]]: an injection into a commutative multiplicative monoid that preserves multiplication and one transfers commutativity as well. It is [[AffineConstructive.theory.groups.projected_commutative_monoid]] read multiplicatively.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.multiplicative_groups.quote_mult_alt","base":"quote_mult_alt","kind":"prf","start":92,"body":[93,95],"status":"ok","short":{"text":"Under a multiplicative morphism, quotations of x₁ and x₂ combine into one of x₁ · x₂","status":"ok"},"proof":[{"text":"Viewed through the multiplicative operations, f is a semigroup morphism for · read as the generic semigroup operation. The statement is then the generic one, [[AffineConstructive.theory.groups.quote_sg_op_alt]], at that operation.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.theory.common_props":{"page":"common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.theory.pointed":{"page":"pointed.html","short":"Identities, composites and inverses of point-preserving maps; quoting distinguished constants","summary":"This file proves that pointed morphisms are closed under the three basic operations on functions. The identity map preserves any point. A composite of pointed morphisms is pointed. The designated inverse of a bijective pointed morphism is pointed. Each result is proved once for [[Pointed_Morphism]] and then restated for the five named constants: the monoid unit, zero, one, top and bottom. Hints register all of them, so instance resolution can discharge preservation goals for identities, composites and inverses. The last part of the file connects these classes to the quoting machinery of [[quote]]. There a pointed morphism f lets the quoting procedure read f applied to a distinguished constant as the corresponding constant of the codomain."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.groups":{"page":"groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.base":{"page":"../tactics/quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

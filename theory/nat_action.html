rite rewrite_preserves.\nRequire Import set_lambda.\n\n\nDefinition EndFun (X:set) : set := X ⇾ X.\n\nGlobal Hint Extern 1 (One (EndFun ?X)) => refine (id_fun X) : typeclass_instances.\nGlobal Hint Extern 1 (Mult (EndFun ?X)) => refine (@scompose_fun X X X) : typeclass_instances.\n\nGlobal Hint Extern 1 (Zero (EndFun _)) => refine (const 0) : typeclass_instances.\nGlobal Hint Extern 1 (Plus (EndFun ?X)) => notypeclasses refine (pointwise_op (+) X) : typeclass_instances.\n\n\nLocal Open Scope mult_scope.\n\nLemma EndFun_mult_mon {X:set} : MultiplicativeMonoid (EndFun X).\nProof. apply alt_Build_MultiplicativeMonoid; hnf; now intros. Qed.\nGlobal Hint Extern 2 (MultiplicativeMonoid    (EndFun _)) => simple notypeclasses refine EndFun_mult_mon : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSemiGroup (EndFun _)) => simple notypeclasses refine EndFun_mult_mon : typeclass_instances.\n\n\nLemma EndFun_NearRig `{AdditiveNonComMonoid X} `{!PointwiseOp (X:=X) (+) X} : NearRig (EndFun X).\nProof. apply alt_Build_NearRig.\n+ exact (pointwise_add_nc_mon _).\n+ exact EndFun_mult_mon.\n+ now intros f g h.\n+ now intros f.\nQed.\nGlobal Hint Extern 2 (NearRig    (EndFun _)) => simple notypeclasses refine EndFun_NearRig : typeclass_instances.\nGlobal Hint Extern 2 (NearRg     (EndFun _)) => simple notypeclasses refine EndFun_NearRig : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveNonComMonoid (EndFun _)) => simple notypeclasses refine EndFun_NearRig : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveNonComSemiGroup (EndFun _)) => simple notypeclasses refine EndFun_NearRig : typeclass_instances.\n\nDefinition EndFun_AdditiveMonoid `{AdditiveMonoid X} `{!PointwiseOp (X:=X) (+) X} : AdditiveMonoid (EndFun X) := pointwise_add_mon _.\nGlobal Hint Extern 2 (AdditiveMonoid (EndFun _)) => simple notypeclasses refine EndFun_AdditiveMonoid : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSemiGroup (EndFun _)) => simple notypeclasses refine EndFun_AdditiveMonoid : typeclass_instances.\n\n\nImport of_course_set_notation.\nDefinition Additive_Monoid_EndFun `{AdditiveMonoid X} `{!PointwiseOp (X:=X) (+) X} := { f: !(EndFun X) | of_course (AdditiveMonoid_Morphism f) } .\nArguments Additive_Monoid_EndFun X {_ _ _ _}.\nLocal Notation \"E₊\" := Additive_Monoid_EndFun.\n\nLemma Additive_Monoid_EndFun_SubNearRig `{AdditiveMonoid X} `{!PointwiseOp (X:=X) (+) X} : SubNearRig (E₊ X).\nProof. apply alt_Build_SubNearRig2.\n  1, 2 : intros f g; change (set_T (X ⇾ X)) in f, g.\n  all: change (?f ∊ E₊ X) with (of_course (AdditiveMonoid_Morphism f)).\n  1, 2 : apply affirmative_aimpl.\n  all: simpl.\n  1, 2: intros [Hf Hg].\n  2: now change (AdditiveMonoid_Morphism (f ∘ g)).\n  all: apply alt_Build_AdditiveMonoid_Morphism; intros; simpl; unfold id;\n    try rewrite_preserves g; try rewrite_preserves f.\n  4,5,6: refl.\n  + rew (associativity (+) _ _ _). apply (is_fun (+ g y) _ _).\n    rew <-(associativity (+) _ _ _). apply (is_fun (f x +) _ _).\n    exact (commutativity (+) _ _).\n  + exact (plus_0_l _).\n  + sym. exact (plus_0_l _).\nQed.\n\nGlobal Hint Extern 2 (SubNearRig (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRig : typeclass_instances.\nGlobal Hint Extern 2 (SubNearRg (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRig : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSubMonoid (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRig : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSubSemiGroup (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRig : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubMonoid (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRig : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubSemiGroup (E₊ _)) => simple notypeclasses refine Additive_Monoid_EndFun_SubNearRig : typeclass_instances.\n\nLemma Additive_Monoid_EndFun_Rig `{AdditiveMonoid X} `{!PointwiseOp (X:=X) (+) X} : Rig (E₊ X).\nProof. apply alt_Build_Rig; try exact _.\n+ (* LeftDistribute (·) (+) *)\n  intros [f elf] [g elg] [h elh]; revert elf elg elh; simpl; intros ???; change (set_T (X ⇾ X)) in f,g,h.\n  intros x. now rewrite_preserves f.\n+ (* RightAbsorb (·) 0 *)\n  intros [f elf]; revert elf; simpl; intros ?; change (set_T (X ⇾ X)) in f.\n  intros x. exact (preserves_0 f).\nQed.\nGlobal Hint Extern 1 (Rig (subset_to_set (E₊ _))) => simple notypeclasses refine Additive_Monoid_EndFun_Rig : typeclass_instances.\nGlobal Hint Extern 1 (Rg (subset_to_set (E₊ _))) => simple notypeclasses refine Additive_Monoid_EndFun_Rig : typeclass_instances.\nGlobal Hint Extern 1 (LeftNearRg (subset_to_set (E₊ _))) => simple notypeclasses refine Additive_Monoid_EndFun_Rig : typeclass_instances.\nGlobal Hint Extern 1 (LeftNearRig (subset_to_set (E₊ _))) => simple notypeclasses refine Additive_Monoid_EndFun_Rig : typeclass_instances.\n\nSection add_nat_act.\n  Universes u.\n  Context (ℕ:naturals@{u}).\n  Context `{AdditiveNonComMonoid@{u} X} `{!PointwiseOp (X:=X) (+) X} .\n\n  Local Abbreviation ϕ := (naturals_to_mon (near_rig_car (nats_near_rig ℕ)) (EndFun X)).\n\n  Definition add_nat_act : ℕ ⊗ X ⇾ X := uncurry ϕ.\n  Local Notation \"x ∙ y\" := (func_op add_nat_act (x, y)).\n\n  Lemma add_nat_act_strong : StrongOp add_nat_act.\n  Proof. exact (dec_strong_op_l _). Qed.\n\n  Lemma add_nat_act_0_l : ∏ x, 0 ∙ x = 0 .\n  Proof. exact (preserves_0 ϕ). Qed.\n\n  Lemma add_nat_act_1_l : ∏ x, 1 ∙ x = x .\n  Proof. exact (preserves_1 ϕ). Qed.\n\n  Lemma add_nat_act_plus_l m n : ∏ x, (m + n) ∙ x = m ∙ x + n ∙ x.\n  Proof. exact (preserves_plus ϕ m n). Qed.\n\n  Local Open Scope mult_scope.\n\n  Lemma add_nat_act_mult_l m n : ∏ x, (m · n) ∙ x = m ∙ (n ∙ x).\n  Proof. exact (preserves_mult ϕ m n). Qed.\n\n  Lemma add_nat_act_add_mon2 {x} : AdditiveMonoid_Morphism (ap2 add_nat_act x).\n  Proof. apply alt_Build_AdditiveMonoid_Morphism.\n  + intros m n. apply add_nat_act_plus_l.\n  + apply add_nat_act_0_l.\n  Qed.\n\n  Local Abbreviation E₀ := (ZeroSymmetricPart (EndFun X)).\n\n  Lemma add_nat_act_0_r n : n ∙ 0 = 0 .\n  Proof. change (ϕ n 0 = 0).\n    rew <-exact:( naturals_initial (from_subset _ ∘ naturals_to_mon ℕ E₀) ).\n    change ((?f ∘ ?g) ?x) with (f (g x)).\n    destruct (naturals_to_mon ℕ E₀ n) as [f Hf]. exact (Hf 0).\n  Qed.\nEnd add_nat_act.\nArguments add_nat_act_add_mon2 {_ X _ _ _ _ _}.\nGlobal Hint Extern 2 (AdditiveMonoid_Morphism (func_op (func_op ap2 (add_nat_act _)) _) ) => simple notypeclasses refine add_nat_act_add_mon2 : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSemiGroup_Morphism (func_op (func_op ap2 (add_nat_act _)) _) ) => simple notypeclasses refine add_nat_act_add_mon2 : typeclass_instances.\nGlobal Hint Extern 2 (Zero_Pointed_Morphism (func_op (func_op ap2 (add_nat_act _)) _) ) => simple notypeclasses refine add_nat_act_add_mon2 : typeclass_instances.\n\nSection add_nat_act.\n  Universes u.\n  Context {ℕ:naturals@{u}}.\n  Context `{AdditiveMonoid X} `{!PointwiseOp (X:=X) (+) X} .\n  Local Notation \"x ∙ y\" := (func_op (add_nat_act ℕ (X:=X)) (x, y)).\n  Local Notation \"( n ∙)\" := (func_op2 ap1 (add_nat_act ℕ (X:=X)) n).\n  Local Abbreviation ϕ := (naturals_to_mon (near_rig_car (nats_near_rig ℕ)) (EndFun X)).\n  Local Abbreviation ε := (of_course_counit (EndFun X)).\n  Local Abbreviation i := (from_subset _).\n  Local Abbreviation ψ := (naturals_to_mon ℕ (E₊ X)).\n\n  Lemma add_nat_act_add_mon1 {n} : AdditiveMonoid_Morphism (n∙).\n  Proof. change (AdditiveMonoid_Morphism (ϕ n)).\n    rew <-(naturals_initial (ε ∘ i ∘ ψ)).\n    change (AdditiveMonoid_Morphism (ε (i (ψ n)))).\n    destruct (ψ n) as [f Hf]. exact Hf.\n  Qed.\n\n  Lemma add_nat_act_plus_r n : ∏ x y, n ∙ (x + y) = n ∙ x + n ∙ y.\n  Proof.\n    refine (preserves_plus (n∙)).\n    exact add_nat_act_add_mon1.\n  Qed.\nEnd add_nat_act.\nGlobal Hint Extern 2 (AdditiveSemiGroup_Morphism (func_op (func_op ap1 (add_nat_act _)) _) ) => simple notypeclasses refine add_nat_act_add_mon1 : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveMonoid_Morphism (func_op (func_op ap1 (add_nat_act _)) _) ) => simple notypeclasses refine add_nat_act_add_mon1 : typeclass_instances.\nGlobal Hint Extern 2 (Zero_Pointed_Morphism (func_op (func_op ap1 (add_nat_act _)) _) ) => simple notypeclasses refine add_nat_act_add_mon1 : typeclass_instances.\n\n\n","sentences":[{"i":0,"s":0,"e":64,"kind":"vernac","status":"ok","ms":31,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":65,"e":125,"kind":"vernac","status":"ok","ms":22,"messages":[],"goals":null},{"i":2,"s":126,"e":153,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":3,"s":154,"e":191,"kind":"vernac","status":"ok","ms":18,"messages":[],"goals":null},{"i":4,"s":192,"e":228,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":5,"s":229,"e":273,"kind":"vernac","status":"ok","ms":26,"messages":[],"goals":null},{"i":6,"s":274,"e":305,"kind":"vernac","status":"ok","ms":22,"messages":[],"goals":null},{"i":7,"s":306,"e":359,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":360,"e":406,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":9,"s":407,"e":433,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":10,"s":436,"e":477,"kind":"vernac","status":"ok","ms":10,"messages":["5e154b3fd293fdc9"],"goals":null},{"i":11,"s":479,"e":561,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":12,"s":562,"e":656,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":13,"s":658,"e":739,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":14,"s":740,"e":847,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":15,"s":850,"e":878,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":16,"s":880,"e":944,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":{"fg":[{ action","name":"add_nat_act_add_mon1","kind":"thm","local":true},{"s":8264,"e":8287,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"AdditiveMonoid_Morphism","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":8289,"e":8296,"lib":"AffineConstructive.interfaces.set","name":"func_op","kind":"proj","local":false,"page":"../interfaces/set.html"},{"s":8298,"e":8305,"lib":"AffineConstructive.interfaces.set","name":"func_op","kind":"proj","local":false,"page":"../interfaces/set.html"},{"s":8306,"e":8309,"lib":"AffineConstructive.theory.set","name":"ap1","kind":"def","local":false,"page":"set.html"},{"s":8311,"e":8322,"lib":"AffineConstructive.theory.nat_action","name":"add_nat_act","kind":"def","local":true},{"s":8363,"e":8383,"lib":"AffineConstructive.theory.nat_action","name":"add_nat_act_add_mon1","kind":"thm","local":true},{"s":8429,"e":8450,"lib":"AffineConstructive.interfaces.abstract_algebra","name":"Zero_Pointed_Morphism","kind":"class","local":false,"page":"../interfaces/abstract_algebra.html"},{"s":8452,"e":8459,"lib":"AffineConstructive.interfaces.set","name":"func_op","kind":"proj","local":false,"page":"../interfaces/set.html"},{"s":8461,"e":8468,"lib":"AffineConstructive.interfaces.set","name":"func_op","kind":"proj","local":false,"page":"../interfaces/set.html"},{"s":8469,"e":8472,"lib":"AffineConstructive.theory.set","name":"ap1","kind":"def","local":false,"page":"set.html"},{"s":8474,"e":8485,"lib":"AffineConstructive.theory.nat_action","name":"add_nat_act","kind":"def","local":true},{"s":8526,"e":8546,"lib":"AffineConstructive.theory.nat_action","name":"add_nat_act_add_mon1","kind":"thm","local":true},{"s":995,"e":998,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1461,"e":1464,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1481,"e":1484,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2989,"e":2992,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":3117,"e":3134,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":3142,"e":3159,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":3172,"e":3176,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":3182,"e":3185,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3245,"e":3248,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3369,"e":3372,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":4506,"e":4509,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":4510,"e":4527,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":6397,"e":6400,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":7770,"e":7773,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file builds the action of the naturals on an additive monoid X, n · x = x + ⋯ + x. The action comes from the canonical map of ℕ into the endomorphisms of X rather than from a recursion. The endomorphisms X ⇾ X form a right near-rig under pointwise addition and composition. The canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] into it, uncurried, is the action [[AffineConstructive.theory.nat_action.add_nat_act]]. Because that map preserves 0, 1, + and ·, the action satisfies 0 · x = 0, 1 · x = x, (m + n) · x = m · x + n · x and (m · n) · x = m · (n · x). The laws in the second argument come from uniqueness of maps out of the naturals ([[AffineConstructive.interfaces.naturals.naturals_initial]]). The canonical map factors through a sub-near-rig, so every n acts by an endomorphism of that sub-near-rig. The zero-symmetric part gives n · 0 = 0. When X is commutative, the additive monoid endomorphisms E₊ X form a rig ([[AffineConstructive.theory.nat_action.Additive_Monoid_EndFun_Rig]]), which gives n · (x + y) = n · x + n · y.","short":"The action of the naturals on an additive monoid, through its endomorphism near-rig","items":[{"name":"AffineConstructive.theory.nat_action.EndFun","base":"EndFun","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"The set X ⇾ X of endomorphisms of a set X","status":"ok"},"long":{"text":"The set of functions from X to itself, under a name of its own so that resolution can give it algebraic structure that the general function set X ⇾ Y does not carry. Its unit is the identity and its multiplication is composition, f · g = f ∘ g. Its zero is the constant function 0 and its addition is the pointwise sum, when X has them.\n\nWith these operations EndFun X is the endomorphism near-rig End(X) of an additive monoid. The naturals act on X through the canonical map into this near-rig.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.EndFun_mult_mon","base":"EndFun_mult_mon","kind":"prf","start":16,"body":[17,19],"status":"ok","short":{"text":"The endomorphisms of a set form a monoid under composition, with the identity as unit","status":"ok"},"proof":[{"text":"A monoid is built from associativity of composition and the two unit laws for the identity, as in [[AffineConstructive.theory.multiplicative_groups.alt_Build_MultiplicativeMonoid]]. Each of the three laws holds pointwise by definition, so each is an instance of reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nat_action.EndFun_NearRig","base":"EndFun_NearRig","kind":"prf","start":22,"body":[23,33],"status":"ok","short":{"text":"For an additive monoid X with pointwise sums, the endomorphisms of X form a right near-rig","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.rings.alt_Build_NearRig]], four things must be shown. Pointwise addition makes the endomorphisms an additive monoid, and composition makes them a multiplicative monoid. Composition distributes over addition from the right, and composing the zero map with anything gives zero.","status":"ok","from":0,"to":1},{"text":"The additive monoid is the pointwise one on maps into X, [[AffineConstructive.theory.pointwise.pointwise_add_nc_mon]].","status":"ok","from":2,"to":3},{"text":"The multiplicative monoid is composition with the identity, [[AffineConstructive.theory.nat_action.EndFun_mult_mon]].","status":"ok","from":4,"to":5},{"text":"For endomorphisms f, g and h, (f + g) ∘ h and f ∘ h + g ∘ h both send x to f (h x) + g (h x), so right distributivity holds by definition. The left law f ∘ (g + h) = f ∘ g + f ∘ h would need f to preserve addition, which is why the structure is only a right near-rig.","status":"ok","from":6,"to":7},{"text":"The zero map composed with any f is the zero map, again by definition.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.theory.nat_action.EndFun_AdditiveMonoid","base":"EndFun_AdditiveMonoid","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"For a commutative additive monoid X, the endomorphisms of X form one under pointwise addition","status":"ok"},"long":{"text":"When the addition of X is commutative, so is the pointwise addition of endomorphisms. This definition records that EndFun X is then a commutative additive monoid, the instance [[AffineConstructive.theory.pointwise.pointwise_add_mon]] at the endomorphism set. It is the additive structure in which E₊ X, the additive monoid endomorphisms, sits as a commutative submonoid.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.Additive_Monoid_EndFun","base":"Additive_Monoid_EndFun","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"E₊ X, the subset of endomorphisms of an additive monoid X that are additive monoid morphisms","status":"ok"},"long":{"text":"The endomorphisms f of X that preserve addition and zero. Being an [[AffineConstructive.interfaces.abstract_algebra.AdditiveMonoid_Morphism]] is a strict proposition of the base logic, and it does not respect the affine equality of functions. So the subset is taken of the of-course set !(EndFun X), and membership is the affirmed proposition [[AffineConstructive.interfaces.aprop.of_course]] (f is an additive monoid morphism).\n\nE₊ X is closed under composition, pointwise sums, the identity and the zero map. Unlike the whole near-rig EndFun X, it distributes on both sides, since f ∘ (g + h) = f ∘ g + f ∘ h when f is additive. So E₊ X is a rig. It is used to show that each natural number acts on X by an additive map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.Additive_Monoid_EndFun_SubNearRig","base":"Additive_Monoid_EndFun_SubNearRig","kind":"prf","start":45,"body":[46,67],"status":"ok","short":{"text":"For a commutative additive monoid X, E₊ X is a sub-near-rig of the endomorphisms","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.subrings.alt_Build_SubNearRig2]], it suffices to show that the additive monoid endomorphisms are closed under pointwise sum and under composition, and that they contain the zero map and the identity.","status":"ok","from":0,"to":1},{"text":"Fix endomorphisms f and g. Membership in E₊ X is the affirmed proposition that a map is an additive monoid morphism; the goals are restated in those terms.","status":"ok","from":2,"to":3},{"text":"The hypotheses are affirmative, so each affine implication can be proved as a plain implication ([[AffineConstructive.logic.aprop.affirmative_aimpl]]). Hence it suffices to assume that f and g are additive monoid morphisms and to prove the conclusion outright.","status":"ok","from":4,"to":6},{"text":"The composite f ∘ g of two additive monoid morphisms is again one, by [[AffineConstructive.theory.additive_groups.compose_addmon_mor]].","status":"ok","from":7,"to":7},{"text":"In each remaining case the map is shown to preserve addition and zero ([[AffineConstructive.theory.additive_groups.alt_Build_AdditiveMonoid_Morphism]]). Unfolding, and using that f and g preserve both, leaves three equations: f x + f y + (g x + g y) = f x + g x + (f y + g y) for the sum f + g, 0 + 0 = 0 for the sum at zero, and 0 = 0 + 0 for the zero map. The equations for the identity, and the one saying the zero map sends 0 to 0, hold by reflexivity.","status":"ok","from":8,"to":9},{"text":"The interchange equation is the one place where commutativity of X is used. After reassociating, the common last summand g y is cancelled by congruence. Reassociating the other way and cancelling the common first summand f x leaves f y + g x = g x + f y, which is commutativity.","status":"ok","from":10,"to":15},{"text":"The sum f + g sends 0 to 0 + 0, which is 0 by [[AffineConstructive.theory.additive_groups.plus_0_l]].","status":"ok","from":16,"to":17},{"text":"The zero map preserves addition because 0 = 0 + 0, again by [[AffineConstructive.theory.additive_groups.plus_0_l]] read backwards.","status":"ok","from":18,"to":21}]},{"name":"AffineConstructive.theory.nat_action.Additive_Monoid_EndFun_Rig","base":"Additive_Monoid_EndFun_Rig","kind":"prf","start":74,"body":[75,85],"status":"ok","short":{"text":"For a commutative additive monoid X, the additive endomorphisms E₊ X form a rig","status":"ok"},"proof":[{"text":"A rig is built with [[AffineConstructive.theory.rings.alt_Build_Rig]]. Several parts carry over from the ambient near-rig through the sub-near-rig [[AffineConstructive.theory.nat_action.Additive_Monoid_EndFun_SubNearRig]]: the commutative additive monoid, the multiplicative monoid, right distributivity and left absorption. What remains are the two laws that the full endomorphism near-rig lacks, left distributivity and right absorption.","status":"ok","from":0,"to":1},{"text":"Take f, g and h in E₊ X, so each is an additive monoid morphism. Left distributivity asks that, for each x, f (g x + h x) = f (g x) + f (h x), and this holds because f preserves addition.","status":"ok","from":2,"to":5},{"text":"Right absorption asks that f ∘ 0 = 0, that is, f 0 = 0 at every point. This holds because f preserves zero ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]).","status":"ok","from":6,"to":10}]},{"name":"AffineConstructive.theory.nat_action.add_nat_act","base":"add_nat_act","kind":"def","start":95,"body":null,"status":"ok","short":{"text":"The action ℕ ⊗ X ⇾ X of the naturals on an additive monoid, n · x = x + ⋯ + x","status":"ok"},"long":{"text":"The natural-number multiple of an element of an additive monoid, defined as the uncurried canonical map of ℕ into the endomorphisms of X: n · x is (n-fold sum of id) applied to x. It is defined on the tensor product ℕ ⊗ X, the natural domain of an uncurried function. Since equality on ℕ is decidable, the action also respects the cartesian equality ([[AffineConstructive.theory.nat_action.add_nat_act_strong]]).\n\nIt is defined this way, not by recursion on n, so that the laws in the first argument follow at once from the canonical map being a near-rig morphism. Those laws are 0 · x = 0, 1 · x = x, (m + n) · x = m · x + n · x and (m · n) · x = m · (n · x). The laws in the second argument come from uniqueness of maps out of the naturals.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_strong","base":"add_nat_act_strong","kind":"prf","start":97,"body":[98,100],"status":"ok","short":{"text":"The action of the naturals is a strong operation, since ℕ has decidable equality","status":"ok"},"proof":[{"text":"A function of two arguments is strong when its first argument ranges over a set with decidable equality ([[AffineConstructive.theory.set.dec_strong_op_l]]). The naturals have decidable equality, as a natural numbers object ([[AffineConstructive.theory.nno.nno_dec_eq]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_0_l","base":"add_nat_act_0_l","kind":"prf","start":101,"body":[102,104],"status":"ok","short":{"text":"0 · x = 0 for every x","status":"ok"},"proof":[{"text":"The action at 0 is the endomorphism that the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] assigns to 0. That map preserves zero ([[AffineConstructive.interfaces.abstract_algebra.preserves_0]]), so this endomorphism is the zero map, which sends every x to 0.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_1_l","base":"add_nat_act_1_l","kind":"prf","start":105,"body":[106,108],"status":"ok","short":{"text":"1 · x = x for every x","status":"ok"},"proof":[{"text":"The canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] preserves 1 ([[AffineConstructive.interfaces.abstract_algebra.preserves_1]]), so it sends 1 to the identity endomorphism, and 1 · x = x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_plus_l","base":"add_nat_act_plus_l","kind":"prf","start":109,"body":[110,112],"status":"ok","short":{"text":"(m + n) · x = m · x + n · x for every x","status":"ok"},"proof":[{"text":"The canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] preserves addition ([[AffineConstructive.theory.additive_groups.preserves_plus]]). So m + n is sent to the pointwise sum of the endomorphisms for m and n, which evaluated at x is m · x + n · x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_mult_l","base":"add_nat_act_mult_l","kind":"prf","start":114,"body":[115,117],"status":"ok","short":{"text":"(m · n) · x = m · (n · x) for every x","status":"ok"},"proof":[{"text":"The canonical map into the near-rig of endomorphisms is a rig morphism ([[AffineConstructive.theory.naturals.naturals_to_mon_rig_mor]]), so it preserves multiplication ([[AffineConstructive.theory.multiplicative_groups.preserves_mult]]). Thus m · n is sent to the composite of the endomorphisms for m and n, which evaluated at x is m · (n · x).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_add_mon2","base":"add_nat_act_add_mon2","kind":"prf","start":118,"body":[119,126],"status":"ok","short":{"text":"For fixed x, n ↦ n · x is an additive monoid morphism from ℕ to X","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.additive_groups.alt_Build_AdditiveMonoid_Morphism]], it suffices to show that n ↦ n · x preserves addition and sends 0 to 0.","status":"ok","from":0,"to":1},{"text":"For naturals m and n, the equation (m + n) · x = m · x + n · x is [[AffineConstructive.theory.nat_action.add_nat_act_plus_l]].","status":"ok","from":2,"to":4},{"text":"The equation 0 · x = 0 is [[AffineConstructive.theory.nat_action.add_nat_act_0_l]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.nat_action.E₀","base":"E₀","kind":"abbrev","start":127,"body":null,"status":"ok","short":{"text":"The zero-symmetric part of EndFun X: the endomorphisms f with f 0 = 0","status":"ok"},"long":{"text":"A local abbreviation for the [[AffineConstructive.theory.subrings.ZeroSymmetricPart]] of the near-rig EndFun X. In a right near-rig this is the set of elements f with f · 0 = 0. For endomorphisms this means f ∘ const 0 = const 0, that is, f 0 = 0. It is a sub-near-rig, so the canonical map of ℕ factors through it. This is how [[AffineConstructive.theory.nat_action.add_nat_act_0_r]] gets n · 0 = 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_0_r","base":"add_nat_act_0_r","kind":"prf","start":128,"body":[129,135],"status":"ok","short":{"text":"n · 0 = 0 for every natural n","status":"ok"},"proof":[{"text":"By definition n · 0 is the endomorphism ϕ n, the image of n under the canonical map into the endomorphisms of X, applied to 0. So the goal is ϕ n 0 = 0.","status":"ok","from":0,"to":1},{"text":"The zero-symmetric part E₀, the endomorphisms that fix 0, is a sub-near-rig ([[AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRig]]), so the inclusion of E₀ composed with the canonical map of ℕ into E₀ is also a near-rig morphism out of the naturals. Maps out of the naturals are unique, so this composite is ϕ. The goal becomes: the image of n in E₀, viewed as an endomorphism of X, sends 0 to 0.","status":"ok","from":2,"to":3},{"text":"The image of n in E₀ is an endomorphism f together with a proof that f lies in E₀. Being in E₀ means fixing 0, so f 0 = 0.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.nat_action.ϕ","base":"ϕ","kind":"abbrev","start":147,"body":null,"status":"ok","short":{"text":"The canonical map ℕ ⇾ EndFun X, sending n to the n-fold sum of the identity","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from the naturals into the endomorphism near-rig EndFun X. It sends n to id + ⋯ + id, the map x ↦ x + ⋯ + x. It preserves 0, 1, + and ·, so it is the rig morphism ℕ → End(X), and the action of the naturals on X is this map uncurried.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.ε","base":"ε","kind":"abbrev","start":148,"body":null,"status":"ok","short":{"text":"The counit !(EndFun X) ⇾ EndFun X of the of-course set","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.theory.set.of_course_counit]] at the endomorphism set. It is the identity on elements and forgets the affirmed equality. It carries an element of E₊ X, a subset of !(EndFun X), back to an endomorphism of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.i","base":"i","kind":"abbrev","start":149,"body":null,"status":"ok","short":{"text":"The inclusion of a subset into its ambient set","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.subset.from_subset]]. Here it is the inclusion of E₊ X into !(EndFun X). Composed with ε, it takes an additive endomorphism to the underlying endomorphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.ψ","base":"ψ","kind":"abbrev","start":150,"body":null,"status":"ok","short":{"text":"The canonical map ℕ ⇾ E₊ X into the rig of additive endomorphisms","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from the naturals into the rig E₊ X of additive monoid endomorphisms. By uniqueness of such maps ([[AffineConstructive.interfaces.naturals.naturals_initial]]), ε ∘ i ∘ ψ equals the canonical map ϕ into EndFun X. So each ϕ n is the endomorphism underlying an element of E₊ X, and is therefore additive.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_add_mon1","base":"add_nat_act_add_mon1","kind":"prf","start":151,"body":[152,158],"status":"ok","short":{"text":"For a commutative additive monoid and fixed n, x ↦ n · x is an additive monoid morphism","status":"ok"},"proof":[{"text":"The map x ↦ n · x is the endomorphism ϕ n. Uniqueness of maps out of the naturals identifies ϕ with a composite of three near-rig morphisms: the canonical map ψ of ℕ into the additive monoid endomorphisms E₊ X, the inclusion of E₊ X, and the counit ε. So it is enough to show that ε(i(ψ n)) is an additive monoid morphism.","status":"ok","from":0,"to":3},{"text":"Because X is commutative, E₊ X is a sub-near-rig of the endomorphisms ([[AffineConstructive.theory.nat_action.Additive_Monoid_EndFun_SubNearRig]]). The image ψ n is therefore an endomorphism f together with a proof that f lies in E₊ X, which says exactly that f is an additive monoid morphism.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.nat_action.add_nat_act_plus_r","base":"add_nat_act_plus_r","kind":"prf","start":159,"body":[160,163],"status":"ok","short":{"text":"In a commutative additive monoid, n · (x + y) = n · x + n · y","status":"ok"},"proof":[{"text":"An additive semigroup morphism preserves sums ([[AffineConstructive.theory.additive_groups.preserves_plus]]). So it is enough to show that x ↦ n · x is an additive semigroup morphism.","status":"ok","from":0,"to":1},{"text":"This holds because x ↦ n · x is an additive monoid morphism ([[AffineConstructive.theory.nat_action.add_nat_act_add_mon1]]), and every additive monoid morphism is an additive semigroup morphism.","status":"ok","from":2,"to":3}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.pointwise":{"page":"../interfaces/pointwise.html","short":"Pointwise lifting of operations to function sets, for strong operations or affirmative domains","summary":"The file lifts operations on affine sets to the functions into them. A unary function f : X ⇾ Y lifts by post-composition ([[pointwise_func]]) with no further hypothesis. A binary operation f : X ⊗ Y ⇾ Z does not lift in general, because the point d at which g and h are evaluated is needed by both arguments of f while the equality d = d' may be used only once; the class [[PointwiseOp]] records that the lift exists, and [[pointwise_op]] then gives the function (g, h) ↦ (d ↦ f(g d, h d)). Two sufficient conditions are proved: f is strong, so that it preserves the cartesian equality and the two argument equalities can be proved additively ([[StrongOp_PointWiseOp]]), or D has affirmative equality, so that d = d' may be duplicated ([[AffEq_PointWiseOp]]). Both are registered for resolution, with the strong case tried first."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.subset":{"page":"../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.theory.bundled_groups":{"page":"bundled_groups.html","short":"Categories of bundled semigroups, monoids and groups, and the notational identifications between them","summary":"The file builds categories of bundled algebraic structures, from semigroups up to groups, on the interfaces of the bundled algebra. For each kind of structure it gives an identity morphism, a composition that respects equality of morphisms, and the category laws. The kinds are semigroups, multiplicative and commutative semigroups, monoids, additive non-commutative, multiplicative, commutative and additive monoids, groups, abelian groups and additive groups. Commutative and group-level structures reuse the identities and composition of the monoid or additive monoid categories they sit in. Canonical structures in both directions identify the categories that differ only in notation: multiplicative semigroups with semigroups; additive, multiplicative and plain monoids with each other; additive monoids with commutative monoids; additive groups with groups and with abelian groups. Hints let the quote tactic pass a bundled morphism through ∙, the unit, inverse, ·, 1, +, 0 and negation."},"AffineConstructive.theory.projected_set":{"page":"projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.theory.rings":{"page":"rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.subrings":{"page":"subrings.html","short":"Subrings and sub-near-rings: builders, induced structure, images, preimages, zero-symmetric part","summary":"This file carries the substructure theory of `theory/subgroups.v` over to ring-like structures. It first restates the subsemigroup, submonoid and subgroup results in additive and multiplicative form (builders from closure conditions, the full subset, the induced operations, the inclusion as a morphism, images and preimages), then treats the sub-near-rg, sub-near-rig, sub-near-rng and sub-near-ring predicates: their builders from closure under +, · and −, invariance under equality of subsets, the induced near-ring, ring and commutative ring structures on a substructure, the inclusion as an rg or rig morphism, and the stability of these substructures under images and preimages. It closes with the zero-symmetric part N₀ = { n | n · 0 = 0 } of a right near-ring, shown to be a substructure of whichever kind N is. The results are instances found by resolution, so a subset closed under the ring operations is a ring wherever one is needed."},"AffineConstructive.theory.naturals":{"page":"naturals.html","short":"General theory of the naturals: uniqueness, NNO, commutative rig, cancellation, induction","summary":"This file develops the general theory of the [[Naturals]] interface, which characterises the natural numbers as a near-rig initial among additive monoids with a chosen 1. It shows that any two models are isomorphic through their canonical maps ([[naturals_to_naturals_bijective]]), that a retract of a model is again a model ([[retract_is_nat]]), and that every model is a natural numbers object ([[naturals_nno]]) via the concrete naturals [[Nat]]. On the algebraic side, every model is a commutative rig ([[naturals_is_com_rig]]), its canonical map into any near-rig is a rig morphism ([[naturals_to_mon_rig_mor]]), 1 ≠ 0 holds, addition cancels, there are no zero divisors in the strong sense, and x + y = 0 if and only if x = 0 ⊠ y = 0 ([[zero_sum]]). The file also gives induction principles phrased with 1 + n in place of the successor ([[naturals_ind]], [[naturals_ind_alt]], the tactic [[naturals_induction]]), the distance lemma [[naturals_distance]], and facts about negating the images of naturals in near-rings and rings."},"AffineConstructive.theory.pointwise":{"page":"pointwise.html","short":"Algebraic laws and structures lifted from X to functions D ⇾ X pointwise","summary":"The file shows that the algebraic laws and structures of a set X carry over to the function set D ⇾ X under the pointwise operations, with constant functions as distinguished elements. The first part lifts single laws: associativity, commutativity, idempotence, absorption, distributivity, identities, absorbing elements and inverses on X give the same laws for [[pointwise_op]], [[pointwise_func]] and [[const]] on D ⇾ X. Each holds because equality of functions is checked point by point, and at each point the law is the law on X. Global hints make these lemmas available to resolution throughout the development. The second part builds on them to lift semigroups, monoids, groups and abelian groups, semilattices and bounded semilattices, lattices and distributive lattices to D ⇾ X, together with their additive, multiplicative, meet and join forms. These are local instances, used under the operations that local hints supply for the file. The interface file `interfaces/pointwise.v` provides the pointwise lifts and the condition [[PointwiseOp]] that they preserve equality."},"AffineConstructive.theory.of_course_set":{"page":"of_course_set.html","short":"Algebraic structures lifted from X to !X; the counit is a morphism","summary":"The file shows that the set !X, whose elements are those of X with the affirmed equality, carries every algebraic structure that X carries. The operations of X are lifted along [[of_course_op]] and [[of_course_map]], and the constants are reused unchanged. First the single laws are transferred one at a time: associativity, commutativity, idempotency, absorption, distributivity, identities, absorbing elements and inverses. From these laws the file builds instances that make !X a semigroup, monoid or group (commutative or not), a semilattice, lattice or distributive lattice, and a near-rg, rg, rig, rng or ring in all the left, right and commutative variants. It also shows that the counit ε : !X ⇾ X preserves units, zero, one, top and bottom, and is a semigroup, monoid, rg and rig morphism. These results are registered for instance resolution, so algebra on X can be used inside the of-course modality without further work."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

ive.topology.uniform.basis":"topology/uniform/basis.html","AffineConstructive.topology.uniform.dense_collar":"topology/uniform/dense_collar.html","AffineConstructive.topology.uniform.final":"topology/uniform/final.html","AffineConstructive.topology.uniform.product":"topology/uniform/product.html","AffineConstructive.topology.uniform.cylinder":"topology/uniform/cylinder.html","AffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import abstract_algebra.\nRequire Export interfaces.naturals interfaces.bundled_algebra.\nRequire Import interfaces.sprop logic.aprop logic.relations theory.rings.\nRequire Import implementations.nat.\nRequire Export theory.nno.\nRequire Import theory.projected_set.\nRequire Import easy rewrite rewrite_preserves tactics.misc change_quantifiers simplify.\nRequire Import strip_coercions.\n\nLemma naturals_initial_alt@{u} {N M:set@{u}} `{Naturals N} `{AdditiveNonComMonoid M} {oM:One M}\n  (f g : N ⇾ M) `{!AdditiveMonoid_Morphism f, !AdditiveMonoid_Morphism g}\n  `{!One_Pointed_Morphism f, !One_Pointed_Morphism g}\n  : f = g.\nProof. now rew [ (naturals_initial f) | (naturals_initial g) ]. Qed.\n\nLocal Open Scope fun_inv_scope.\n\nGlobal Hint Extern 5 (Inverse (naturals_to_mon ?N₁ ?N₂)) => refine (naturals_to_mon N₂ N₁) : typeclass_instances.\nLemma naturals_to_naturals_bijective `{Naturals N₁} `{Naturals N₂}\n  : Bijective (naturals_to_mon N₁ N₂).\nProof. apply alt_Build_Bijective; unfold inverse; now apply naturals_initial_alt. Qed.\nGlobal Hint Extern 5 (Bijective (naturals_to_mon _ _)) => simple notypeclasses refine naturals_to_naturals_bijective : typeclass_instances.\nGlobal Hint Extern 10 (Injective (naturals_to_mon _ _)) => simple notypeclasses refine naturals_to_naturals_bijective : typeclass_instances.\nGlobal Hint Extern 5 (Surjective (naturals_to_mon _ _)) => simple notypeclasses refine naturals_to_naturals_bijective : typeclass_instances.\n\nSection retract_is_nat.\n  Universes u.\n  Local Open Scope fun_inv_scope.\n  Context `{Naturals@{u} N} `{NearRig@{u} R} (f:N ⇾ R).\n  Context `{!Surjective f (inv:=f_inv)}.\n  Context `{!AdditiveMonoid_Morphism f, !AdditiveMonoid_Morphism f⁻¹}.\n  Context `{!One_Pointed_Morphism f, !One_Pointed_Morphism f⁻¹}.\n\n  Instance retract_is_nat_to_mon : NaturalsToMon R\n    := λ M pM zM oM, naturals_to_mon N M ∘ f⁻¹.\n  Lemma retract_is_nat : Naturals R.\n  Proof. split; [ exact _ | intros M; intros; unfold naturals_to_mon, retract_is_nat_to_mon .. ]; try exact _.\n    rew <-(surjective_compose_cancel f _ _).\n    exact (naturals_initial_alt _ _).\n  Qed.\nEnd retract_is_nat.\n\nSection is_nno.\n  Universes u.\n  Context `{Naturals@{u} N}.\n  Local Abbreviation ψ := (naturals_to_mon@{u} N Nat).\n  Instance naturals_to_nno : FromNNO N := λ X _ _, nno_to_set@{u} Nat X ∘ ψ.\n\n  Instance: MaybeAlgebra_Morphism ψ.\n  Proof. split; [ exact _ |].\n    intro n. change (suc ?x) with (1+x).\n    now rewrite_preserves ψ.\n  Qed.\n\n  Lemma naturals_nno : NaturalNumbersObject N.\n  Proof. split; unfold nno_to_set at 1, naturals_to_nno; intros X ??.\n  + exact _.\n  + intros f ?.\n    apply (surjective_compose_cancel ψ⁻¹ _ _).\n    change (?f ∘ ?g ∘ ?h) with (f ∘ (g ∘ h)).\n    simplify.\n    exact (nno_initial _).\n  Qed.\n\n  Lemma naturals_add_mon : AdditiveMonoid@{u} N.\n  Proof. apply alt_Build_AdditiveMonoid; try exact _.\n    intros x y. quote_injective constr:(ψ).\n    now apply commutativity.\n  Qed.\n\n  Lemma naturals_distance_alt `{Naturals N} (x y : N) : x = y ∨ ∐ z, z ≠ 0 ⊠ (x + z = y ∨ x = y + z).\n  Proof. generalize ( nat_subtract_spec (ψ x) (ψ y) ).\n    destruct (nat_subtract (ψ x, ψ y)) as [ z' | | z' ].\n  + intros [??]. right. exists (naturals_to_mon Nat N z').\n    split; [|left]; quote_injective constr:(ψ); change (ψ (?f z')) with ((ψ ∘ f) z');\n    now rew (naturals_initial_alt (ψ ∘ naturals_to_mon Nat N) id).\n  + intros E. left. now quote_injective constr:(ψ).\n  + intros [??]. right. exists (naturals_to_mon Nat N z').\n    split; [|right]; quote_injective constr:(ψ); change (ψ (?f z')) with ((ψ ∘ f) z');\n    now rew (naturals_initial_alt (ψ ∘ naturals_to_mon Nat N) id).\n  Qed.\n\n  Lemma naturals_distance `{Naturals N} (x y : N) : ∐ z, x + z = y ∨ x = y + z.\n  Proof. destruct (naturals_distance_alt x y) as [E | [z [_ [E|E]]]].\n  + exists 0. left. rew <-E. now simplify.\n  + exists z. now left.\n  + exists z. now right.\n  Qed.\nEnd is_nno.\nCoercion naturals_nno : Naturals >-> NaturalNumbersObject.\nCoercion naturals_add_mon : Naturals >-> AdditiveMonoid.\nGlobal Hint Extern 10 (FromNNO _) => notypeclasses refine naturals_to_nno : typeclass_instances.\nGlobal Hint Extern 10 (NaturalNumbersObject _) => notypeclasses refine naturals_nno : typeclass_instances.\n\nCoercion naturals_one_nonzero `{Naturals (N:=N)} : OneNonZero N.\nProof. red. rew <-(plus_0_r 1). exact (nno_suc_nonzero 0). Qed.\n\nGlobal Hint Extern 2 (OneNonZero Nat) => simple notypeclasses refine naturals_one_nonzero : typeclass_instances.\n\nLocal Open Scope mult_scope.\n\nSection preserves_mult.\n  Universes u.\n  Context `{Naturals@{u} N}.\n  Context `{NearRig@{u} R}.\n\n  Abbreviation ϕ := (naturals_to_mon N R).\n\n  Local Hint Extern 2 (SimplifiesTo (func_op ϕ 0) _) => solve_simplify (preserves_0 ϕ) : typeclass_instances.\n\n  Lemma naturals_to_mon_rig_mor : Rig_Morphism ϕ.\n  Proof. split; try exact _. apply alt_Build_MultiplicativeMonoid_Morphism; [| exact (preserves_1 ϕ) ].\n    nno_induction.\n  + intros y. now simplify.\n  + intros n IHn y. change (suc ?n) with (1+n).\n    rew (plus_mult_distr_r _ _ _). simplify.\n    rewrite_preserves ϕ.\n    rew (IHn y), (plus_mult_distr_r _ _ _). now simplify.\n  Qed.\nEnd preserves_mult.\nGlobal Hint Extern 2 (Rig_Morphism (naturals_to_mon _ _)) => simple notypeclasses refine naturals_to_mon_rig_mor : typeclass_instances.\nGlobal Hint Extern 2 (Rg_Morphism (naturals_to_mon _ _)) => simple notypeclasses refine naturals_to_mon_rig_mor : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeMonoid_Morphism (naturals_to_mon _ _)) => simple notypeclasses refine naturals_to_mon_rig_mor : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSemiGroup_Morphism (naturals_to_mon _ _)) => simple notypeclasses refine naturals_to_mon_rig_mor : typeclass_instances.\n\nLemma naturals_is_com_rig `{Naturals N} : CommutativeRig N.\nProof. enough (Commutative (X:=N) (·)).\n+ apply alt_Build_CommutativeRig2; try exact _.\n  apply left_distr_from_right.\n+ intros x y. quote_injective (naturals_to_mon N Nat). refine (commutativity _ _ _).\nQed.\nCoercion naturals_is_com_rig : Naturals >-> CommutativeRig.\n\n\nCoercion naturals_as_com_rig (N:naturals) := make_commutative_rig N.\nGlobal Hint Extern 2 (StripCoercions (naturals_as_com_rig ?X)) => strip_coercions_chain X : strip_coercions.\n\nCoercion naturals_as_strong_rig (N:naturals) := make_strong_rig N.\nGlobal Hint Extern 2 (StripCoercions (naturals_as_strong_rig ?X)) => strip_coercions_chain X : strip_coercions.\n\n\nDefinition naturals_ind `{Naturals N} (P:N ⇾ Ω) :\n    (∏ n, P n ⊸ P (1 + n)) → (P 0 ⊸ all P)\n  := nno_ind P.\n\nDefinition naturals_ind_alt `{Naturals N} (P:N → Ω) : (∀ n m, n = m → P n → P m)\n    → P 0 → (∀ n, P n → P (1 + n)) → all P\n  := nno_ind_alt P.\n\nLtac naturals_induction :=\n    hnf; try change_quantifiers;\n    apply naturals_ind_alt; [\n      intros ??; let E := fresh \"E\" in intro E; now rew E\n    |..].\n\nCoercion naturals_add_cancel `{Naturals N} : AdditiveCancellation N.\nProof. apply alt_Build_AdditiveCancellation.\n  change (∏ z x y : N, z + x = z + y ⊸ x = y).\n  naturals_induction.\n  + intros x y. now simplify.\n  + intros n IHn x y.\n    rew <-(associativity (+) _ _ _).\n    rew <-(IHn x y).\n    exact (injective (X:=N) suc _ _).\nQed.\n\nLemma zero_sum `{Naturals N} : ∀ (x y : N), x + y = 0 ⧟ x = 0 ⊠ y = 0.\nProof. intros x y; split.\n* revert x y. naturals_induction.\n  + intros n. now simplify.\n  + intros n _ m. apply aimpl_by_contradiction.\n    rew <-(associativity (+) _ _ _).\n    exact (nno_suc_nonzero _).\n* apply affirmative_aimpl. intros [Ex Ey]. rew [Ex | Ey]. now simplify.\nQed.\n\nCoercion naturals_strong_no_zero_divisors `{Naturals N} : StrongNoZeroDivisors N.\nProof. intros x y. pose proof nno_zero_or_suc x as [E|[n E]].\n+ now rew (aor_is_true_l E).\n+ change (suc n) with (1+n) in E; rew E; clear E x.\n  rew <-(aorr _ _).\n  rew (plus_mult_distr_r _ _ _). simplify.\n  now rew (zero_sum _ _).\nQed.\n\nGlobal Hint Extern 2 (StrongNoZeroDivisors Nat) => simple notypeclasses refine naturals_strong_no_zero_divisors : typeclass_instances.\nGlobal Hint Extern 2 (NoZeroDivisors Nat) => simple notypeclasses refine naturals_strong_no_zero_divisors : typeclass_instances.\n\nGlobal Hint Extern 2 (apos (anot (1 + ?a = 0 :> nat))) => refine (nno_suc_nonzero a) : typeclass_instances.\nGlobal Hint Extern 2 (apos (anot (1 + ?a = 0 :> set_T Nat))) => refine (nno_suc_nonzero a) : typeclass_instances.\nGlobal Hint Extern 2 (apos (anot (1 + ?a = 0 :> set_T (near_rig_car (nats_near_rig _))))) => refine (nno_suc_nonzero a) : typeclass_instances.\n\nSection with_a_near_ring.\n  Universes u.\n  Context `{Naturals@{u} N}.\n  Context `{NearRing@{u} R}.\n\n  Abbreviation ϕ := (naturals_to_mon N R).\n\n  Lemma naturals_to_near_ring_negate_mult_r : ∀ n, -(ϕ n) = ϕ n · (-1).\n  Proof. enough (∀ n, -(ϕ n) = ϕ n · (-1) ∧ ϕ n · -1 - 1 = -1 + ϕ n · -1 : Ω) as P by (intro; now apply P).\n    naturals_induction; [| intros n [IH1 IH2]]; rewrite_preserves ϕ.\n  + now simplify.\n  + split.\n    * rew (negate_plus_distr_alt _ _), IH1.\n      now rew (plus_mult_distr_r 1 (ϕ n) _), (mult_1_l _).\n    * rew (plus_mult_distr_r 1 (ϕ n) _), <-(associativity (+) _ _ _), (mult_1_l _).\n      now apply (is_fun (-1 +) _ _).\n  Qed.\nEnd with_a_near_ring.\n\n\nSection with_a_ring.\n  Universes u.\n  Context `{Naturals@{u} N} `{Ring@{u} R} (f:N ⇾ R) `{!Rig_Morphism f, !Injective f}.\n\n  Lemma to_ring_zero_sum x y : -(f x) = f y ⧟ x = 0 ⊠ y = 0.\n  Proof.\n    rew <-(zero_sum x y), (injective_iff f _ _).\n    rewrite_preserves f.\n    rew (injective_iff_simp (f x +) (-f x) (f y)).\n    now apply symmetry_iff.\n  Qed.\n\n  Lemma to_ring_zero_sum_alt x y : -(f x) = f y ⧟ x = 0 ∧ y = 0.\n  Proof. rew (to_ring_zero_sum _ _). sym. exact (aand_aprod_dec_l _ _). Qed.\n\n  Lemma negate_to_ring x y : -(f x) = f y ⊸ f x = f y.\n  Proof. rew (to_ring_zero_sum _ _). apply decidable_aimpl.\n    intros [E1 E2]. now rew [E1|E2].\n  Qed.\nEnd with_a_ring.\n\n\nDefinition nat_subtract_alt `{sub:NatSubtract N} `{z:Zero N} : N ⊗ N ⇾ sum_set N N\n  := from_sum _ _ _ (const (inl 0), id_fun _) ∘ projected_set_project (natsubtract.T N) ∘ nat_subtract .\nLemma nat_subtract_alt_spec `{Naturals N} `{NatSubtract N} `{!NatSubtractSpec N} (x y : N) :\n  match nat_subtract_alt (x, y) with\n  | inl z => x + z = y\n  | inr z => x = y + z\n  end.\nProof.\n  change (nat_subtract_alt (x, y)) with\n    ( (from_sum _ _ _ (const (inl 0), id_fun _) ∘ projected_set_project (natsubtract.T N) ) (nat_subtract (x, y)) ).\n  generalize (nat_subtract_spec x y); destruct (nat_subtract (x, y)) as [z| |z].\n  * change (x + z = y ⊠ z ≠ 0 → x + z = y). now intros [??].\n  * change (x = y → x + 0 = y). intro E; now rew E, (plus_0_r _).\n  * change (x = y + z ⊠ z ≠ 0 → x = y + z). now intros [??].\nQed.\n\n","sentences":[{"i":0,"s":0,"e":32,"kind":"vernac","status":"ok","ms":30,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":33,"e":95,"kind":"vernac","status":"ok","ms":24,"messages":[],"goals":null},{"i":2,"s":96,"e":169,"kind":"vernac","status":"ok","ms":25,"messages":[],"goals":null},{"i":3,"s":170,"e":205,"kind":"vernac","status":"ok","ms":20,"messages":[],"goals":null},{"i":4,"s":206,"e":232,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":5,"s":233,"e":269,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":6,"s":270,"e":357,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":7,"s":358,"e":389,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals": 9349,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":9395,"e":9412,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":9420,"e":9423,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":9471,"e":9474,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":9577,"e":9580,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":9605,"e":9608,"lib":"AffineConstructive.tactics.easy","name":"sym","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":9710,"e":9713,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":9781,"e":9784,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":9785,"e":9788,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10484,"e":10487,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10542,"e":10545,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10546,"e":10549,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":10611,"e":10614,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file develops the general theory of the [[AffineConstructive.interfaces.naturals.Naturals]] interface, which characterises the natural numbers as a near-rig initial among additive monoids with a chosen 1. It shows that any two models are isomorphic through their canonical maps ([[AffineConstructive.theory.naturals.naturals_to_naturals_bijective]]), that a retract of a model is again a model ([[AffineConstructive.theory.naturals.retract_is_nat]]), and that every model is a natural numbers object ([[AffineConstructive.theory.naturals.naturals_nno]]) via the concrete naturals [[AffineConstructive.implementations.nat.nno.Nat]]. On the algebraic side, every model is a commutative rig ([[AffineConstructive.theory.naturals.naturals_is_com_rig]]), its canonical map into any near-rig is a rig morphism ([[AffineConstructive.theory.naturals.naturals_to_mon_rig_mor]]), 1 ≠ 0 holds, addition cancels, there are no zero divisors in the strong sense, and x + y = 0 if and only if x = 0 ⊠ y = 0 ([[AffineConstructive.theory.naturals.zero_sum]]). The file also gives induction principles phrased with 1 + n in place of the successor ([[AffineConstructive.theory.naturals.naturals_ind]], [[AffineConstructive.theory.naturals.naturals_ind_alt]], the tactic [[AffineConstructive.theory.naturals.naturals_induction]]), the distance lemma [[AffineConstructive.theory.naturals.naturals_distance]], and facts about negating the images of naturals in near-rings and rings.","short":"General theory of the naturals: uniqueness, NNO, commutative rig, cancellation, induction","items":[{"name":"AffineConstructive.theory.naturals.naturals_initial_alt","base":"naturals_initial_alt","kind":"prf","start":8,"body":[9,11],"status":"ok","short":{"text":"Two additive monoid morphisms out of the naturals that preserve one are equal","status":"ok"},"proof":[{"text":"By initiality, f and g are each equal to the canonical map from N into M, since both are additive monoid morphisms that preserve one. Rewriting both sides of the goal by these two equalities leaves the canonical map compared with itself.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.naturals.naturals_to_naturals_bijective","base":"naturals_to_naturals_bijective","kind":"prf","start":14,"body":[15,17],"status":"ok","short":{"text":"The canonical map between two models of the naturals is a bijection, with the reverse canonical map as inverse","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.set.alt_Build_Bijective]] it suffices that the canonical map back from N₂ to N₁ is a two-sided inverse. Each of the two composites maps a model of the naturals to itself, preserves addition, zero and one, and so does the identity. [[AffineConstructive.theory.naturals.naturals_initial_alt]] therefore makes each composite equal to the identity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.naturals.retract_is_nat_to_mon","base":"retract_is_nat_to_mon","kind":"inst","start":28,"body":null,"status":"ok","short":{"text":"The canonical maps out of a retract R of the naturals: through the inverse f⁻¹, then out of N","status":"ok"},"long":{"text":"Given a model N of the naturals and a near-rig R with a surjection f : N ⇾ R whose designated inverse f⁻¹ is a section, the map from R into a set M with +, 0 and 1 is the composite of f⁻¹ with the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from N into M.\n\nThis gives R the operation that the naturals interface asks for. When f and f⁻¹ both preserve addition, zero and one, [[AffineConstructive.theory.naturals.retract_is_nat]] shows that with this operation R satisfies the interface.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.retract_is_nat","base":"retract_is_nat","kind":"prf","start":29,"body":[30,34],"status":"ok","short":{"text":"A near-rig retract of the naturals, by maps preserving +, 0 and 1 both ways, is a model of the naturals","status":"ok"},"proof":[{"text":"The near-rig structure of R is given. For initiality, the canonical map out of R is the canonical map out of N composed with f⁻¹ ([[AffineConstructive.theory.naturals.retract_is_nat_to_mon]]). As a composite, it preserves addition, zero and one. It remains to show that any map h from R into a monoid M with a one, preserving addition, zero and one, equals this composite.","status":"ok","from":0,"to":1},{"text":"Since f is surjective, it cancels on the right ([[AffineConstructive.theory.set.surjective_compose_cancel]]). So it suffices to show that h ∘ f equals the composite followed by f.","status":"ok","from":2,"to":2},{"text":"Both sides are maps out of N that preserve addition, zero and one, so they are equal by [[AffineConstructive.theory.naturals.naturals_initial_alt]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.naturals.ψ","base":"ψ","kind":"abbrev","start":39,"body":null,"status":"ok","short":{"text":"Section-local name for the canonical map from N to the concrete naturals Nat","status":"ok"},"long":{"text":"Inside the section on natural numbers objects, ψ abbreviates [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from a model N of [[AffineConstructive.interfaces.naturals.Naturals]] to [[AffineConstructive.implementations.nat.nno.Nat]], the concrete natural numbers of the development. It is the map that sends n to 1 + ⋯ + 1 in Nat.\n\nThe section uses ψ to show that N is a natural numbers object by passing through Nat. The instance [[AffineConstructive.theory.naturals.naturals_to_nno]] defines the map from N into any set with zero and successor as ψ followed by the canonical map out of Nat. The instance [[AffineConstructive.theory.naturals.MaybeAlgebra_Morphism_instance_0]] shows that ψ preserves zero and commutes with successor, where successor in N is n ↦ 1 + n. Together these are what [[AffineConstructive.theory.naturals.naturals_nno]] needs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_to_nno","base":"naturals_to_nno","kind":"inst","start":40,"body":null,"status":"ok","short":{"text":"The map out of N into a set with zero and successor, factored through the concrete naturals Nat","status":"ok"},"long":{"text":"Equips any `Naturals` object N with the operation `FromNNO`: for each set X with a zero and a successor, a map N ⇾ X. The map is the composite of the canonical map from N into the concrete naturals `Nat`, which sends n to 1 + ⋯ + 1, with [[AffineConstructive.interfaces.naturals.nno_to_set]] from `Nat` into X, the map `Nat` has as a natural numbers object.\n\nGoing through `Nat` puts the recursion where it is already available: `Nat` is known to be a natural numbers object, and the canonical map N ⇾ `Nat` is a bijection, by [[AffineConstructive.theory.naturals.naturals_to_naturals_bijective]]. This is the map with respect to which [[AffineConstructive.theory.naturals.naturals_nno]] shows that N is initial among sets with zero and successor, so that every `Naturals` object is a natural numbers object and inherits induction ([[AffineConstructive.theory.naturals.naturals_ind]], [[AffineConstructive.theory.naturals.naturals_ind_alt]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.MaybeAlgebra_Morphism_instance_0","base":"MaybeAlgebra_Morphism_instance_0","kind":"inst","start":41,"body":[42,47],"status":"ok","short":{"text":"The canonical map from N to the concrete naturals Nat preserves zero and successor","status":"ok"},"proof":[{"text":"The canonical map into Nat preserves zero because it is an additive monoid morphism. What remains is that it preserves the successor.","status":"ok","from":0,"to":1},{"text":"Fix n. In both N and Nat the successor is n ↦ 1 + n, so the goal asks that the map send 1 + n to 1 plus the image of n.","status":"ok","from":2,"to":3},{"text":"This holds because the canonical map preserves addition and one.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.theory.naturals.naturals_nno","base":"naturals_nno","kind":"prf","start":48,"body":[49,59],"status":"ok","short":{"text":"Every model of the naturals is a natural numbers object, with successor n ↦ 1 + n","status":"ok"},"proof":[{"text":"The map from N into a set X with a zero and a successor is the canonical map into Nat followed by the map that Nat, a natural numbers object, provides ([[AffineConstructive.theory.naturals.naturals_to_nno]]). Two things are left to show: this composite preserves zero and successor, and it is the only map out of N that does.","status":"ok","from":0,"to":1},{"text":"Existence: the canonical map into Nat preserves zero and successor ([[AffineConstructive.theory.naturals.MaybeAlgebra_Morphism_instance_0]]), and so does the map out of Nat. Their composite therefore preserves both ([[AffineConstructive.theory.nno.compose_maybe_algebra_morphism]]).","status":"ok","from":2,"to":3},{"text":"Uniqueness: let f be a map from N to X that preserves zero and successor.","status":"ok","from":4,"to":5},{"text":"Write ψ for the canonical map into Nat. It is a bijection ([[AffineConstructive.theory.naturals.naturals_to_naturals_bijective]]), so its inverse is surjective and cancels on the right ([[AffineConstructive.theory.set.surjective_compose_cancel]]). It therefore suffices to compare f ∘ ψ⁻¹ with the composite followed by ψ⁻¹.","status":"ok","from":6,"to":6},{"text":"Reassociating, ψ ∘ ψ⁻¹ is the identity. The right side reduces to the map from Nat into X.","status":"ok","from":7,"to":8},{"text":"The map f ∘ ψ⁻¹ goes from Nat to X and preserves zero and successor: ψ⁻¹ does so as the inverse of such a bijection ([[AffineConstructive.theory.nno.invert_maybe_algebra_morphism]]), and f does so by assumption. By the initiality of Nat, it equals the map out of Nat.","status":"ok","from":9,"to":10}]},{"name":"AffineConstructive.theory.naturals.naturals_add_mon","base":"naturals_add_mon","kind":"prf","start":60,"body":[61,66],"status":"ok","short":{"text":"Addition on a model of the naturals is commutative, so it is an additive monoid","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.additive_groups.alt_Build_AdditiveMonoid]], it suffices to have associativity, the left identity law and commutativity. The first two come from the monoid structure of N, which leaves commutativity.","status":"ok","from":0,"to":1},{"text":"Fix x and y. The canonical map into Nat is injective ([[AffineConstructive.theory.naturals.naturals_to_naturals_bijective]]) and preserves addition. So x + y = y + x holds exactly when the images satisfy the same equation in Nat.","status":"ok","from":2,"to":3},{"text":"In Nat this is the commutativity of addition.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.theory.naturals.naturals_distance_alt","base":"naturals_distance_alt","kind":"prf","start":67,"body":[68,85],"status":"ok","short":{"text":"Either x = y, or there is a nonzero z with x + z = y or x = y + z","status":"ok"},"proof":[{"text":"Compare the images of x and y in Nat under the canonical map ψ, using [[AffineConstructive.interfaces.naturals.nat_subtract_spec]]. One of three cases holds: ψ x + z′ = ψ y with z′ ≠ 0, or ψ x = ψ y, or ψ x = ψ y + z′ with z′ ≠ 0.","status":"ok","from":0,"to":2},{"text":"In the first case, take the right disjunct, with the image of z′ in N as the witness. Each part of the goal (the inequality and the left equation) transfers along the injective map ψ to Nat. There it becomes one of the two facts in hand, each used once, because ψ followed by the canonical map back is the identity of Nat ([[AffineConstructive.theory.naturals.naturals_initial_alt]]).","status":"ok","from":3,"to":7},{"text":"In the second case, take the left disjunct. Then x = y follows from ψ x = ψ y by injectivity.","status":"ok","from":8,"to":11},{"text":"The third case is symmetric to the first: the witness is again the image of z′ in N, now with the equation x = y + z. Both parts transfer to Nat in the same way.","status":"ok","from":12,"to":17}]},{"name":"AffineConstructive.theory.naturals.naturals_distance","base":"naturals_distance","kind":"prf","start":86,"body":[87,100],"status":"ok","short":{"text":"For x and y there is a z with x + z = y or x = y + z","status":"ok"},"proof":[{"text":"Argue by the three cases of [[AffineConstructive.theory.naturals.naturals_distance_alt]], discarding the fact that the difference is nonzero.","status":"ok","from":0,"to":1},{"text":"If x = y, take 0 as the witness. Then x + 0 = y, by the equality and the right identity law.","status":"ok","from":2,"to":6},{"text":"If x + z = y, take z as the witness and the left disjunct.","status":"ok","from":7,"to":9},{"text":"If x = y + z, take z as the witness and the right disjunct.","status":"ok","from":10,"to":13}]},{"name":"AffineConstructive.theory.naturals.coercion:naturals_nno","base":"coercion:naturals_nno","kind":"coercion","start":102,"body":null,"status":"ok","short":{"text":"A model of the naturals can be used as a natural numbers object, so its recursion and induction principles apply directly","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.coercion:naturals_add_mon","base":"coercion:naturals_add_mon","kind":"coercion","start":103,"body":null,"status":"ok","short":{"text":"A model of the naturals can be used as an additive monoid, so monoid laws for addition apply to it directly","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_one_nonzero","base":"naturals_one_nonzero","kind":"def","start":106,"body":[107,111],"status":"ok","short":{"text":"In a model of the naturals, 1 ≠ 0","status":"ok"},"proof":[{"text":"The goal is 1 ≠ 0.","status":"ok","from":0,"to":1},{"text":"Rewrite 1 as 1 + 0 ([[AffineConstructive.theory.additive_groups.plus_0_r]]). This is the successor of 0 in the natural numbers object structure of N ([[AffineConstructive.theory.naturals.naturals_nno]]).","status":"ok","from":2,"to":2},{"text":"A successor is never zero ([[AffineConstructive.theory.nno.nno_suc_nonzero]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.naturals.naturals_to_mon_rig_mor","base":"naturals_to_mon_rig_mor","kind":"prf","start":120,"body":[121,136],"status":"ok","short":{"text":"The canonical map from the naturals into any near-rig is a rig morphism","status":"ok"},"proof":[{"text":"The canonical map ϕ already preserves addition and zero, which leaves the multiplicative part.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.multiplicative_groups.alt_Build_MultiplicativeMonoid_Morphism]] it suffices that ϕ preserves products, since it preserves one ([[AffineConstructive.interfaces.abstract_algebra.preserves_1]]).","status":"ok","from":2,"to":2},{"text":"Argue by induction on the first factor, keeping the claim universal in the second ([[AffineConstructive.theory.nno.nno_ind_alt]]).","status":"ok","from":3,"to":3},{"text":"Base case: fix y. Both sides reduce to 0, because 0 · y = 0 and ϕ preserves zero.","status":"ok","from":4,"to":6},{"text":"Inductive step: take n with the claim for all y, and fix y. The successor of n is 1 + n.","status":"ok","from":7,"to":9},{"text":"Distribute on the right, (1 + n) · y = 1 · y + n · y, and simplify 1 · y to y.","status":"ok","from":10,"to":11},{"text":"Since ϕ preserves addition and one, the left side becomes ϕ y + ϕ (n · y) and the right side becomes (1 + ϕ n) · ϕ y.","status":"ok","from":12,"to":12},{"text":"The induction hypothesis at y turns ϕ (n · y) into ϕ n · ϕ y. Distributing the right side in R and removing the factor 1 makes the two sides agree.","status":"ok","from":13,"to":15}]},{"name":"AffineConstructive.theory.naturals.naturals_is_com_rig","base":"naturals_is_com_rig","kind":"prf","start":142,"body":[143,152],"status":"ok","short":{"text":"Every model of the naturals is a commutative rig","status":"ok"},"proof":[{"text":"The work is in commutativity of multiplication, so assume it first and prove it afterwards.","status":"ok","from":0,"to":1},{"text":"Given commutativity, a commutative rig is assembled from the monoid laws, commutativity of ·, left distributivity and 0 · x = 0 by [[AffineConstructive.theory.rings.alt_Build_CommutativeRig2]]; all but left distributivity are already known for a model of the naturals. Left distributivity follows from right distributivity because multiplication is commutative ([[AffineConstructive.theory.common_props.left_distr_from_right]]).","status":"ok","from":2,"to":4},{"text":"It remains to prove commutativity. Fix x and y. The canonical map to the concrete naturals Nat is a bijection ([[AffineConstructive.theory.naturals.naturals_to_naturals_bijective]]) and preserves multiplication, so x · y = y · x holds once the images of the two products are equal in Nat.","status":"ok","from":5,"to":7},{"text":"Those images are equal by commutativity of multiplication in Nat.","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.theory.naturals.coercion:naturals_is_com_rig","base":"coercion:naturals_is_com_rig","kind":"coercion","start":153,"body":null,"status":"ok","short":{"text":"A model of the naturals can be used as a commutative rig, so rig algebra for + and · applies directly","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_as_com_rig","base":"naturals_as_com_rig","kind":"def","start":154,"body":null,"status":"ok","short":{"text":"A bundled model of the naturals regarded as a bundled commutative rig","status":"ok"},"long":{"text":"Packs the carrier of a bundled model of the naturals with its commutative rig structure, using [[AffineConstructive.interfaces.bundled_algebra.make_commutative_rig]], where the structure comes from [[AffineConstructive.theory.naturals.naturals_is_com_rig]]. It is declared as a coercion, so a model of the naturals can be used wherever a bundled commutative rig is expected. A hint lets the coercion-stripping tactic see through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_as_strong_rig","base":"naturals_as_strong_rig","kind":"def","start":156,"body":null,"status":"ok","short":{"text":"A bundled model of the naturals regarded as a bundled strong rig","status":"ok"},"long":{"text":"Packs the carrier of a bundled model of the naturals with its rig structure and the strength of its operations, using [[AffineConstructive.interfaces.bundled_algebra.make_strong_rig]]. Like [[AffineConstructive.theory.naturals.naturals_as_com_rig]], it is a coercion, so the naturals can be used where a strong rig is expected, and a hint lets the coercion-stripping tactic see through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_ind","base":"naturals_ind","kind":"def","start":158,"body":null,"status":"ok","short":{"text":"Affine induction on the naturals: if P n implies P (1 + n) for every n, then P 0 implies P for all n","status":"ok"},"long":{"text":"This is [[AffineConstructive.theory.nno.nno_ind]] for the natural numbers object a model of the naturals carries, with the successor written as 1 + n. The family P is a function into Ω, so it respects equality. The step is a base-logic family of affine implications, and the conclusion is the affine implication P 0 ⊸ ∏ n, P n. Because the base case is consumed once by the conclusion, the induction respects the accounting of hypotheses.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_ind_alt","base":"naturals_ind_alt","kind":"def","start":159,"body":null,"status":"ok","short":{"text":"Induction on the naturals in the base logic, for an extensional family, with step n to 1 + n","status":"ok"},"long":{"text":"This is [[AffineConstructive.theory.nno.nno_ind_alt]] restated with 1 + n for the successor. The family P is an arbitrary map into Ω, so the principle takes as its first premise that P respects equality. The base case P 0 and the step P n → P (1 + n) are given in the base logic, and the conclusion is ∏ n, P n.\n\nThe file's naturals_induction tactic applies this principle and discharges the extensionality premise by rewriting, leaving the base case and the step. Most proofs by induction in the file use it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_induction","base":"naturals_induction","kind":"ltac","start":160,"body":null,"status":"ok","short":{"text":"Proves a statement for all n of a naturals object by induction, leaving the base case 0 and the step n to 1 + n","status":"ok"},"long":{"text":"The tactic proves a goal that holds for every n of a set N satisfying [[AffineConstructive.interfaces.naturals.Naturals]]. It first puts the goal in head normal form and, where the goal quantifies over N in the base logic, restates it as the affine universal ∏ n, P n. It then applies [[AffineConstructive.theory.naturals.naturals_ind_alt]], which asks for three things: that the family P respects the equality of N, a proof of P 0, and, for each n, a base-logic implication from P n to P (1 + n). The first is discharged at once by rewriting P n along the equality n = m, so the proof is left with the base case and the inductive step, in that order.\n\nThe step is phrased with 1 + n rather than the successor, which is the form in which the algebra of a naturals object is stated, and the step is a base-logic implication, so the induction hypothesis is used as an ordinary assumption with no accounting of its uses. A proof reaches for this tactic in place of a direct application of [[AffineConstructive.theory.nno.nno_ind]] when the statement is a family over N whose extensionality would otherwise have to be shown by hand: in this file, additive cancellation [[AffineConstructive.theory.naturals.naturals_add_cancel]], the direction x + y = 0 implies x = 0 ⊠ y = 0 of [[AffineConstructive.theory.naturals.zero_sum]], and [[AffineConstructive.theory.naturals.naturals_to_near_ring_negate_mult_r]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_add_cancel","base":"naturals_add_cancel","kind":"def","start":161,"body":[162,174],"status":"ok","short":{"text":"Addition on a model of the naturals cancels: z + x = z + y implies x = y","status":"ok"},"proof":[{"text":"Addition is commutative, so cancellation reduces to injectivity of each left translation z + ·, by [[AffineConstructive.theory.additive_groups.alt_Build_AdditiveCancellation]]. Spelled out: for all z, x, y, z + x = z + y implies x = y.","status":"ok","from":0,"to":2},{"text":"The proof is by induction on z. In the base case, fix x and y: 0 + x = 0 + y simplifies to x = y, so there is nothing to prove.","status":"ok","from":3,"to":6},{"text":"In the inductive step, fix n, the hypothesis that n + · is injective, and x and y. Reassociating turns (1 + n) + x into 1 + (n + x), and likewise for y.","status":"ok","from":7,"to":9},{"text":"By the induction hypothesis it suffices to obtain n + x = n + y from 1 + (n + x) = 1 + (n + y). This is injectivity of the successor n ↦ 1 + n of the natural numbers object ([[AffineConstructive.theory.nno.nno_suc_inj]]).","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.theory.naturals.zero_sum","base":"zero_sum","kind":"prf","start":175,"body":[176,194],"status":"ok","short":{"text":"In the naturals, x + y = 0 if and only if x = 0 ⊠ y = 0","status":"ok"},"proof":[{"text":"Fix x and y and prove the two implications separately.","status":"ok","from":0,"to":1},{"text":"For the forward direction, generalise over x and y again and induct on x.","status":"ok","from":2,"to":4},{"text":"In the base case, 0 + y = 0 simplifies to y = 0, and the required 0 = 0 ⊠ y = 0 simplifies to y = 0 as well.","status":"ok","from":5,"to":7},{"text":"In the inductive step, with m in place of y, the induction hypothesis is not needed. The proof shows that the antecedent (1 + n) + m = 0 is refuted, so it implies anything; what is left to prove is (1 + n) + m ≠ 0.","status":"ok","from":8,"to":10},{"text":"After reassociating, the sum is 1 + (n + m), the successor of n + m, and a successor is never zero ([[AffineConstructive.theory.nno.nno_suc_nonzero]]).","status":"ok","from":11,"to":12},{"text":"For the converse, equality in N is decidable and so affirmative, and the tensor of two affirmative propositions is affirmative. So it suffices to prove x + y = 0 in the base logic from x = 0 and y = 0 ([[AffineConstructive.logic.aprop.affirmative_aimpl]]).","status":"ok","from":13,"to":15},{"text":"Substituting both equalities leaves 0 + 0 = 0, which simplifies away.","status":"ok","from":16,"to":18}]},{"name":"AffineConstructive.theory.naturals.naturals_strong_no_zero_divisors","base":"naturals_strong_no_zero_divisors","kind":"def","start":195,"body":[196,207],"status":"ok","short":{"text":"In the naturals, x · y = 0 implies x = 0 or y = 0 (additive or)","status":"ok"},"proof":[{"text":"Fix x and y. Either x is 0, or x is the successor of some n ([[AffineConstructive.theory.nno.nno_zero_or_suc]]); consider the two cases.","status":"ok","from":0,"to":2},{"text":"If x = 0, the left disjunct holds, so the disjunction is true and the implication holds trivially.","status":"ok","from":3,"to":4},{"text":"Otherwise x = 1 + n; substitute this for x. In this case the proof aims for the right disjunct: it shows that (1 + n) · y = 0 implies y = 0.","status":"ok","from":5,"to":7},{"text":"Distribute on the right and simplify 1 · y, which turns the product into y + n · y.","status":"ok","from":8,"to":9},{"text":"By [[AffineConstructive.theory.naturals.zero_sum]], y + n · y = 0 gives y = 0 ⊠ n · y = 0, and keeping the first factor gives y = 0.","status":"ok","from":10,"to":11}]},{"name":"AffineConstructive.theory.naturals.ϕ","base":"ϕ","kind":"abbrev","start":217,"body":null,"status":"ok","short":{"text":"Local name for the canonical map from the naturals N into a near-rig or near-ring R","status":"ok"},"long":{"text":"In the sections on maps into a near-rig and into a near-ring, ϕ abbreviates the canonical map [[AffineConstructive.interfaces.naturals.naturals_to_mon]] from N to R, which sends n to 1 + ⋯ + 1. Preservation of addition, zero and one comes with the naturals interface. The sections prove that ϕ also preserves multiplication ([[AffineConstructive.theory.naturals.naturals_to_mon_rig_mor]]), and that negating ϕ n is the same as multiplying it by −1 on the right ([[AffineConstructive.theory.naturals.naturals_to_near_ring_negate_mult_r]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.naturals_to_near_ring_negate_mult_r","base":"naturals_to_near_ring_negate_mult_r","kind":"prf","start":218,"body":[219,232],"status":"ok","short":{"text":"In a near-ring, the negative of the image of n equals that image times −1","status":"ok"},"proof":[{"text":"A near-ring need not have commutative addition, so the claim is strengthened for the induction. The proof shows, for every n, both −ϕ n = ϕ n · (−1) and that ϕ n · (−1) commutes with −1 under addition, then keeps the first conjunct.","status":"ok","from":0,"to":1},{"text":"The proof inducts on n and pushes ϕ through 0, 1 and addition. In the base case both conjuncts reduce to identities about 0 and simplify away.","status":"ok","from":2,"to":4},{"text":"In the inductive step the two induction hypotheses are available, and the two conjuncts at 1 + ϕ n are proved separately.","status":"ok","from":5,"to":7},{"text":"For the first conjunct, −(1 + ϕ n) is −ϕ n − 1 ([[AffineConstructive.theory.additive_groups.negate_plus_distr_alt]]), which by the first induction hypothesis is ϕ n · (−1) − 1. On the other side, distributing (1 + ϕ n) · (−1) and using 1 · (−1) = −1 gives −1 + ϕ n · (−1). The second induction hypothesis says these two are equal.","status":"ok","from":8,"to":9},{"text":"For the second conjunct, distribute (1 + ϕ n) · (−1) as −1 + ϕ n · (−1) on both sides and reassociate the left-hand side. This makes both sides sums beginning with −1.","status":"ok","from":10,"to":11},{"text":"After −1 the two sides are equal by the second induction hypothesis, and adding −1 on the left preserves that equality.","status":"ok","from":12,"to":13}]},{"name":"AffineConstructive.theory.naturals.to_ring_zero_sum","base":"to_ring_zero_sum","kind":"prf","start":237,"body":[238,243],"status":"ok","short":{"text":"For an injective rig morphism f into a ring, −f x = f y if and only if x = 0 ⊠ y = 0","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.naturals.zero_sum]], x = 0 ⊠ y = 0 is equivalent to x + y = 0. Since f is injective, that is equivalent to f (x + y) = f 0 ([[AffineConstructive.theory.set.injective_iff]]).","status":"ok","from":0,"to":1},{"text":"As a rig morphism, f preserves addition and zero, so the right side becomes f x + f y = 0.","status":"ok","from":2,"to":2},{"text":"On the left, adding f x to both sides is injective in a group ([[AffineConstructive.theory.set.injective_iff_simp]]). This turns −f x = f y into 0 = f x + f y, and by symmetry of equality the two sides agree.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.theory.naturals.to_ring_zero_sum_alt","base":"to_ring_zero_sum_alt","kind":"prf","start":244,"body":[245,249],"status":"ok","short":{"text":"For an injective rig morphism f into a ring, −f x = f y if and only if x = 0 and y = 0 (additive)","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.naturals.to_ring_zero_sum]], the left side is equivalent to x = 0 ⊠ y = 0, so it remains to compare the tensor with the additive conjunction.","status":"ok","from":0,"to":2},{"text":"Equality in N is decidable, and for a decidable proposition the additive and multiplicative conjunctions agree ([[AffineConstructive.logic.aprop.aand_aprod_dec_l]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.naturals.negate_to_ring","base":"negate_to_ring","kind":"prf","start":250,"body":[251,256],"status":"ok","short":{"text":"For an injective rig morphism f into a ring, −f x = f y implies f x = f y","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.naturals.to_ring_zero_sum]], the antecedent is equivalent to x = 0 ⊠ y = 0.","status":"ok","from":0,"to":1},{"text":"That tensor is decidable, so a base-logic implication suffices ([[AffineConstructive.logic.aprop.decidable_aimpl]]). Assume x = 0 and y = 0.","status":"ok","from":2,"to":3},{"text":"Substituting both equalities makes the two sides f 0, so they are equal.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.theory.naturals.nat_subtract_alt","base":"nat_subtract_alt","kind":"def","start":258,"body":null,"status":"ok","short":{"text":"Comparison with difference as a two-way map N ⊗ N ⇾ N + N, sending equality to the left with 0","status":"ok"},"long":{"text":"The comparison [[AffineConstructive.interfaces.naturals.nat_subtract]] has three outcomes: y exceeds x by a nonzero z, x equals y, or x exceeds y by a nonzero z. This definition folds the middle outcome into the first with difference 0. The result is a map into the disjoint sum N + N whose left summand holds a z with x + z = y and whose right summand holds a z with x = y + z.\n\nIt is built by projecting onto the underlying sum and then copairing, using the constant inl 0 on the equality outcome and the identity on the rest. The two-way form suits definitions by cases on the order of x and y, where the nonzero difference is not needed. [[AffineConstructive.theory.naturals.nat_subtract_alt_spec]] records the equation each outcome satisfies.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.naturals.nat_subtract_alt_spec","base":"nat_subtract_alt_spec","kind":"prf","start":259,"body":[260,272],"status":"ok","short":{"text":"The outcome of the two-way comparison satisfies x + z = y on the left, x = y + z on the right","status":"ok"},"proof":[{"text":"Unfold the two-way comparison into the three-way comparison followed by its collapse, which sends equality to the left with difference 0. Then take the specification of the three-way comparison of x and y ([[AffineConstructive.interfaces.naturals.nat_subtract_spec]]) and consider its three outcomes.","status":"ok","from":0,"to":2},{"text":"If x is less than y by z, the goal is x + z = y, which is the first factor of the specification.","status":"ok","from":3,"to":5},{"text":"If x = y, the outcome is the left one with difference 0, so the goal is x + 0 = y. This follows from x = y and x + 0 = x.","status":"ok","from":6,"to":8},{"text":"If x is greater than y by z, the goal is x = y + z, again the first factor of the specification.","status":"ok","from":9,"to":12}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.naturals":{"page":"../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.interfaces.bundled_algebra":{"page":"../interfaces/bundled_algebra.html","short":"Bundled algebraic structures, from semigroups to commutative rings, with their morphisms and categories","summary":"The file bundles each algebraic structure of the development into a record: a carrier set together with its operations and the proof of its laws. Each record comes with a `make_…` constructor that finds the operations and laws by resolution, and with a set of morphisms (the structure-preserving functions, compared by their underlying functions). These form the category data for semigroups, monoids, groups, their additive and multiplicative variants, near-rigs, rigs, strong rigs, near-rings, rings and their commutative forms. Coercions arrange the records in a hierarchy, so that a ring is also a rig and a near-ring. Hints let resolution see through these coercions, so a bundled object has the algebraic classes and morphism classes of its unbundled form. The file also makes strong sets into the category [[𝐒𝐭𝐫𝐒𝐞𝐭]]."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.theory.rings":{"page":"rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.implementations.nat":{"page":"../implementations/nat.html","short":"Natural numbers model: its natural numbers object, rig structure and subtraction in one import","summary":"This file defines nothing itself; it gathers the natural numbers into one import. It re-exports three files. `nat.nno` defines the inductive type of natural numbers and makes it a natural numbers object. `nat.rig` gives the rig (semiring) structure and the instance stating that this type satisfies the naturals interface. `nat.subtract` defines three-way subtraction on the naturals. A file that needs a concrete model of the natural numbers imports this one."},"AffineConstructive.theory.nno":{"page":"nno.html","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[nno_to_nno_bijective]]). By transport along the comparison with [[Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[nno_ind]], with a base-logic variant [[nno_ind_alt]] and the tactic [[nno_induction]]. It also defines primitive recursion [[nno_rec]] with its base and step equations, and bundles it as a function of its step function [[nno_rec_fun]] when X is a strong set."},"AffineConstructive.theory.projected_set":{"page":"projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.change_quantifiers":{"page":"../tactics/change_quantifiers.html","short":"A tactic converting base ∀/∃ goals into affine ∏/∐ propositions","summary":"This file provides a tactic that turns a goal written with the base quantifiers ∀ and ∃ over the proof component of an affine proposition into the proof of one affine proposition, made with the affine quantifiers ∏ and ∐. [[rewrite_quantifiers]] works through the nested quantifiers and builds the affine proposition, keeping the bound variables in place. [[change_quantifiers]] uses it to restate the goal. The conversion relies only on the fact that the proof components of [[all]] and [[aex]] are, by definition, the base quantifiers of the proof components. So the new goal is definitionally equal to the old one, and after the change the affine laws of the connectives can rewrite it."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.strip_coercions":{"page":"../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."}},"constants":null}</script>

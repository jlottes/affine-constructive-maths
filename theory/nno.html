f. unfold quote. intros E. now rew (preserves_suc f _), E. Qed.\nEnd quote.\n\nGlobal Hint Extern 4 (quote _ (func_op suc _) _) => quote_hint_strip (fun f => refine (quote_suc f _)) : quote.\nGlobal Hint Extern 4 (quote _ _ (func_op suc _)) => quote_hint_strip (fun f => refine (quote_suc f _)) : quote.\n\nLemma alt_Build_MaybeAlgebra_Morphism@{u} {X Y:set@{u}} `{Zero X} `{Successor X} `{Zero Y} `{Successor Y} (f:X ⇾ Y) :\n  f 0 = 0 → (∀ x, f (suc x) = suc (f x)) → MaybeAlgebra_Morphism f.\nProof. now split. Qed.\n\nLemma id_maybe_algebra_morphism `{Zero X} `{Successor X} : MaybeAlgebra_Morphism (id_fun X).\nProof. now apply alt_Build_MaybeAlgebra_Morphism. Qed.\nGlobal Hint Extern 2 (MaybeAlgebra_Morphism (id_fun _)) => simple notypeclasses refine id_maybe_algebra_morphism : typeclass_instances.\n\nLemma compose_maybe_algebra_morphism@{u} {X₁ X₂ X₃:set@{u}}\n  `{Zero X₁} `{Successor X₁}\n  `{Zero X₂} `{Successor X₂}\n  `{Zero X₃} `{Successor X₃}\n  {f:X₁ ⇾ X₂} {g:X₂ ⇾ X₃}\n : MaybeAlgebra_Morphism f → MaybeAlgebra_Morphism g → MaybeAlgebra_Morphism (g ∘ f).\nProof. intros. apply alt_Build_MaybeAlgebra_Morphism; change (func_op (g ∘ f) ?x) with (g (f x)).\n+ rewrite_preserves f. exact (preserves_0 g).\n+ intro. rewrite_preserves f. exact (preserves_suc _ _).\nQed.\nGlobal Hint Extern 2 (MaybeAlgebra_Morphism (_ ∘ _)) => simple notypeclasses refine (compose_maybe_algebra_morphism _ _) : typeclass_instances.\n\nLocal Open Scope fun_inv_scope.\n\nLemma invert_maybe_algebra_morphism `{MaybeAlgebra_Morphism (f:=f)} `{!Inverse f, !Bijective f}\n  : MaybeAlgebra_Morphism f⁻¹.\nProof. apply alt_Build_MaybeAlgebra_Morphism.\n+ quote_injective f. exact (surjective_applied f _).\n+ intro y. quote_injective f. now rew (surjective_applied f _).\nQed.\nGlobal Hint Extern 2 (MaybeAlgebra_Morphism (_⁻¹)) => simple notypeclasses refine invert_maybe_algebra_morphism : typeclass_instances.\n\nLemma nno_initial_alt@{u} `{NaturalNumbersObject@{u} N}\n  {X:set@{u}} `{Zero X} `{Successor X} (f g : N ⇾ X)\n  `{!MaybeAlgebra_Morphism f, !MaybeAlgebra_Morphism g}\n  : f = g.\nProof. now rew [ (nno_initial f) | (nno_initial g) ]. Qed.\n\n\nGlobal Hint Extern 5 (Inverse (nno_to_set ?N₁ ?N₂)) => refine (nno_to_set N₂ N₁) : typeclass_instances.\nLemma nno_to_nno_bijective `{NaturalNumbersObject N₁} `{NaturalNumbersObject N₂}\n  : Bijective (nno_to_set N₁ N₂).\nProof. apply alt_Build_Bijective; unfold inverse; now apply nno_initial_alt. Qed.\nGlobal Hint Extern 5 (Bijective (nno_to_set _ _)) => simple notypeclasses refine nno_to_nno_bijective : typeclass_instances.\nGlobal Hint Extern 10 (Injective (nno_to_set _ _)) => simple notypeclasses refine nno_to_nno_bijective : typeclass_instances.\nGlobal Hint Extern 5 (Surjective (nno_to_set _ _)) => simple notypeclasses refine nno_to_nno_bijective : typeclass_instances.\n\nRequire Import set_lambda.\n\nSection contents.\n  Universes u.\n  Context `{NaturalNumbersObject@{u} ℕ}.\n\n  Let ψ := (nno_to_set@{u} ℕ Nat).\n  Local Hint Extern 2 => progress unfold ψ : typeclass_instances.\n\n  Let inst : MaybeAlgebra_Morphism ψ.  Proof. exact _. Qed.\n  Let inst2 : Bijective ψ.  Proof. exact _. Qed.\n  Let inst3 : MaybeAlgebra_Morphism ψ⁻¹.  Proof. exact _. Qed.\n\n  Instance nno_suc_inj : Injective (X:=ℕ) suc.\n  Proof. intros x y. rew (injective_iff ψ _ _). rewrite_preserves ψ.\n    exact (injective suc _ _).\n  Qed.\n\n  Lemma nno_suc_nonzero (n:ℕ) : suc n ≠ 0.\n  Proof. quote_ne ψ. exact (Nat_S_nonzero _). Qed.\n\n  Instance nno_dec_eq : DecidableEquality ℕ.\n  Proof. intros [x y]. now rew (injective_iff ψ _ _). Qed.\n  Let inst4 : DecidableEquality ℕ.  Proof. exact nno_dec_eq. Qed.\n\n  Lemma nno_zero_or_suc (n:ℕ) : n = 0 ∨ ∐ m, n = suc m.\n  Proof. generalize (bijective_applied ψ n). destruct (ψ n) as [| m'].\n  + change (ψ⁻¹ nat_0) with (ψ⁻¹ 0).\n    rewrite_preserves ψ⁻¹. intro E. now left.\n  + change (ψ⁻¹ (nat_S m')) with (ψ⁻¹ (suc m')).\n    rewrite_preserves ψ⁻¹. intro E. right. now exists (ψ⁻¹ m').\n  Qed.\n\n  Section induction.\n    Context (P:ℕ ⇾ AProp_set).\n\n    Lemma nno_ind : (∀ n, P n ⊸ P (suc n)) → (P 0 ⊸ all P).\n    Proof. intros Ps.\n      enough (P (ψ⁻¹ 0) ⊸ (∏ n, P (ψ⁻¹ n))) as HP'.\n      + rew <-all_adj. intros y. now rew HP', (all_lb _ (ψ y)), (bijective_applied ψ y).\n      + apply ( Nat_ind (λ n, P (ψ⁻¹ n)) ).\n        intros n. rew (Ps (ψ⁻¹ n)). now rewrite_preserves (ψ⁻¹).\n    Qed.\n  End induction.\n\n  Lemma nno_ind_alt (P:ℕ → Ω) : (∀ n m, n = m → P n → P m)\n    → P 0 → (∀ n, P n → P (suc n)) → all P.\n  Proof. intros Pp P0 Ps.\n    simple notypeclasses refine (let P' := func_make (λ n, ! (P n)) in _).\n    + intros n m. apply affirmative_aimpl. intros E. change (! (P n) ⧟ ! (P m)).\n      apply affirmative_aiff. change (P n ↔ P m). split; now apply Pp.\n    + apply ( nno_ind P' ); trivial. intros n. change (! (P n) ⊸ ! (P (suc n))).\n      apply affirmative_aimpl, Ps.\n  Qed.\n\n  Context {X:set@{u}}.\n\n  Abbreviation ϕ f x := (@nno_to_set@{u} ℕ _ X x f).\n  Let base (f:X ⇾ X) (x:X) : ϕ f x 0 = x.  Proof. exact (maybe_alg_preserves_zero (ϕ f x) (zY:=x) (sY:=f)). Qed.\n  Let step (f:X ⇾ X) (x:X) : ∀ n, ϕ f x (suc n) = f (ϕ f x n).  Proof. exact (preserves_suc (ϕ f x) (zY:=x) (sY:=f)). Qed.\n\n  Local Instance nno_rec_is_fun (f : X ⇾ X) : IsFun (λ (x:X), ϕ f x).\n  Proof.\n    intros x₁ x₂. rew <-(base f x₁) at 1. rew <-(base f x₂) at 1.\n    simple refine (let P := func_make (λ n, ϕ f x₁ n = ϕ f x₂ n) in nno_ind P _).\n    + intros n m. apply affirmative_aimpl. intro E. change ((ϕ f x₁ n = ϕ f x₂ n) ⧟ (ϕ f x₁ m = ϕ f x₂ m)). now rew E.\n    + intros n. change (ϕ f x₁ n = ϕ f x₂ n ⊸ ϕ f x₁ (suc n) = ϕ f x₂ (suc n)); clear P.\n      rew [ (step f x₁ n) | (step f x₂ n) ]. exact (is_fun f _ _).\n  Qed.\n\n  Definition nno_rec (f:X ⇾ X) : X × ℕ ⇾ X.\n  Proof. simple notypeclasses refine (strong_op (uncurry _)).\n  + exact (func_make (λ x : X, ϕ f x)).\n  + refine (dec_strong_op_r _).\n  Defined.\n\n  Definition nno_rec_base f x : nno_rec f (x, 0) = x := base f x.\n  Definition nno_rec_step f x n : nno_rec f (x, suc n) = f (nno_rec f (x, n)) := step f x n.\n\n  Context `{!StrongSet X}.\n\n  Local Instance nno_rec_strong_is_fun@{} : IsFun nno_rec.\n  Proof. intros f g.\n    change ((∏ x, f x = g x) ⊸ (∏ p, nno_rec f p = nno_rec g p)).\n    rew <-all_adj. intros [y n]. revert y. rew all_adj.\n    change ((∏ x, f x = g x) ⊸ ∏ (x:X), ϕ f x n = ϕ g x n).\n    revert n. apply nno_ind_alt.\n    + intros n m E. now rew E.\n    + rew <-all_adj. intros x. rew [ (base f x) | (base g x) ]; now simplify.\n    + intros n IH. rew <-all_adj. intros x.\n      rew [ (step f x n) | (step g x n) ].\n      rew <-( strong_transitivity (=) (f (ϕ f x n)) (g (ϕ f x n)) (g (ϕ g x n)) ).\n      apply aand_intro.\n      * now rew (all_lb _ (ϕ f x n)).\n      * rew [ IH | <-(is_fun g _ _) ]. now rew (all_lb _ x).\n  Qed.\n\n  Definition nno_rec_fun := func_make nno_rec.\n  Definition nno_rec_fun_base f x : nno_rec_fun f (x, 0) = x := base f x.\n  Definition nno_rec_fun_step f x n : nno_rec_fun f (x, suc n) = f (nno_rec f (x, n)) := step f x n.\nEnd contents.\nCoercion nno_suc_inj : NaturalNumbersObject >-> Injective.\nCoercion nno_dec_eq : NaturalNumbersObject >-> DecidableEquality.\nArguments nno_rec ℕ {_ _ _ _ X} f.\nArguments nno_rec_base {_ _ _ _ _ X f x}.\nArguments nno_rec_step {_ _ _ _ _ X f x} n.\nCanonical Structure nno_rec_fun.\nArguments nno_rec_fun ℕ {_ _ _ _ X _}.\nArguments nno_rec_fun_base {_ _ _ _ _ X _ f x}.\nArguments nno_rec_fun_step {_ _ _ _ _ X _ f x} n.\n\n\nLtac nno_induction :=\n    hnf; try change_quantifiers;\n    apply nno_ind_alt; [\n      intros ??; let E := fresh \"E\" in intro E; now rew E\n    |..].\n","sentences":[{"i":0,"s":0,"e":52,"kind":"vernac","status":"ok","ms":37,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":53,"e":108,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":2,"s":109,"e":148,"kind": ./tactics/rewrite/rewrite.html"},{"s":6808,"e":6811,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6833,"e":6836,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6866,"e":6869,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":6870,"e":6878,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../tactics/simplify/base.html"},{"s":6899,"e":6902,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6930,"e":6933,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6973,"e":6976,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":7082,"e":7085,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":7086,"e":7089,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":7120,"e":7123,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":7151,"e":7154,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":7155,"e":7158,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":7870,"e":7888,"lib":"AffineConstructive.tactics.change_quantifiers","name":"change_quantifiers","kind":"ltac","local":false,"page":"../tactics/change_quantifiers.html"},{"s":7963,"e":7966,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":7967,"e":7970,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file develops natural numbers objects: sets ℕ with zero and successor that are initial among such sets. It shows that morphisms preserving zero and successor are closed under identity, composition and inversion, that two such morphisms out of a natural numbers object agree ([[AffineConstructive.theory.nno.nno_initial_alt]]), and that any two natural numbers objects are isomorphic ([[AffineConstructive.theory.nno.nno_to_nno_bijective]]). By transport along the comparison with [[AffineConstructive.implementations.nat.nno.Nat]], successor on ℕ is injective and never zero, ℕ has decidable equality, and every element is zero or a successor. It proves the affine induction principle [[AffineConstructive.theory.nno.nno_ind]], with a base-logic variant [[AffineConstructive.theory.nno.nno_ind_alt]] and the tactic [[AffineConstructive.theory.nno.nno_induction]]. It also defines primitive recursion [[AffineConstructive.theory.nno.nno_rec]] with its base and step equations, and bundles it as a function of its step function [[AffineConstructive.theory.nno.nno_rec_fun]] when X is a strong set.","short":"Natural numbers objects: uniqueness, induction, decidable equality and primitive recursion","items":[{"name":"AffineConstructive.theory.nno.quote_suc","base":"quote_suc","kind":"prf","start":9,"body":[10,14],"status":"ok","short":{"text":"Quotation passes through successor: if f x = y then f (suc x) = suc y, for f preserving successor","status":"ok"},"proof":[{"text":"A quotation of x as y under f is the equality f x = y; assume it, so that f (suc x) = suc y remains to be shown.","status":"ok","from":0,"to":2},{"text":"Since f preserves successor, f (suc x) = suc (f x), and the assumed equality f x = y turns this into suc y.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.nno.alt_Build_MaybeAlgebra_Morphism","base":"alt_Build_MaybeAlgebra_Morphism","kind":"prf","start":18,"body":[19,21],"status":"ok","short":{"text":"A function with f 0 = 0 and f (suc x) = suc (f x) for all x preserves zero and successor","status":"ok"},"proof":[{"text":"Preserving zero and successor consists of exactly these two equations, so the structure is built directly from the two hypotheses.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.id_maybe_algebra_morphism","base":"id_maybe_algebra_morphism","kind":"prf","start":22,"body":[23,25],"status":"ok","short":{"text":"The identity function preserves zero and successor","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.nno.alt_Build_MaybeAlgebra_Morphism]] it suffices that id 0 = 0 and id (suc x) = suc (id x), and both hold by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.compose_maybe_algebra_morphism","base":"compose_maybe_algebra_morphism","kind":"prf","start":27,"body":[28,38],"status":"ok","short":{"text":"The composite of two maps preserving zero and successor preserves them","status":"ok"},"proof":[{"text":"Assume that f and g preserve zero and successor. By [[AffineConstructive.theory.nno.alt_Build_MaybeAlgebra_Morphism]] it suffices to show g (f 0) = 0 and g (f (suc x)) = suc (g (f x)) for every x, with the composite written out as g applied to f.","status":"ok","from":0,"to":2},{"text":"For zero: f 0 = 0 reduces the goal to g 0 = 0, which holds because g preserves zero.","status":"ok","from":3,"to":5},{"text":"For successor, fix x. Since f preserves successor, f (suc x) = suc (f x), which leaves g (suc (f x)) = suc (g (f x)); this holds because g preserves successor.","status":"ok","from":6,"to":10}]},{"name":"AffineConstructive.theory.nno.invert_maybe_algebra_morphism","base":"invert_maybe_algebra_morphism","kind":"prf","start":41,"body":[42,51],"status":"ok","short":{"text":"The inverse of a bijection preserving zero and successor preserves them","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.nno.alt_Build_MaybeAlgebra_Morphism]] it suffices to show f⁻¹ 0 = 0 and f⁻¹ (suc y) = suc (f⁻¹ y) for every y.","status":"ok","from":0,"to":1},{"text":"For zero: f is injective and f 0 = 0, so the equation follows from its image under f, f (f⁻¹ 0) = 0. That holds because f⁻¹ is a right inverse ([[AffineConstructive.theory.set.surjective_applied]]).","status":"ok","from":2,"to":4},{"text":"For successor, fix y. Again it suffices to compare images under f. Since f preserves successor, the image of suc (f⁻¹ y) is suc (f (f⁻¹ y)), so the goal becomes f (f⁻¹ (suc y)) = suc (f (f⁻¹ y)). Cancelling f against f⁻¹ on both sides by [[AffineConstructive.theory.set.surjective_applied]] leaves suc y = suc y.","status":"ok","from":5,"to":9}]},{"name":"AffineConstructive.theory.nno.nno_initial_alt","base":"nno_initial_alt","kind":"prf","start":53,"body":[54,56],"status":"ok","short":{"text":"Two maps out of a natural numbers object that preserve zero and successor are equal","status":"ok"},"proof":[{"text":"By initiality, every map out of N preserving zero and successor is equal to the canonical map into X. This holds for f and for g, and the two equations combine by transitivity to give f = g.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.nno_to_nno_bijective","base":"nno_to_nno_bijective","kind":"prf","start":58,"body":[59,61],"status":"ok","short":{"text":"The canonical map between two natural numbers objects is a bijection, its inverse the canonical map back","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.set.alt_Build_Bijective]] it suffices that the canonical map back is a two-sided inverse. Each composite is a map from a natural numbers object to itself preserving zero and successor, being a composite of such maps, and so is the identity. In each case this is an application of [[AffineConstructive.theory.nno.nno_initial_alt]]: two such maps are equal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.contents.let:ψ","base":"let:ψ","kind":"let","start":69,"body":null,"status":"ok","short":{"text":"ψ, the canonical map from the natural numbers object ℕ into the concrete naturals [[AffineConstructive.implementations.nat.nno.Nat]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.contents.let:inst","base":"let:inst","kind":"let","start":71,"body":[72,74],"status":"ok","short":{"text":"That ψ preserves zero and successor, as a hypothesis, so the section's proofs can use its preservation of 0","status":"ok"},"proof":[{"text":"Resolution finds this directly: ψ is the canonical map out of the natural numbers object ℕ into Nat, and so preserves zero and successor. Stating it here makes the fact available as a hypothesis in the section's proofs.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.contents.let:inst2","base":"let:inst2","kind":"let","start":75,"body":[76,78],"status":"ok","short":{"text":"That ψ is bijective, as a hypothesis, so the section's proofs reach its inverse ψ⁻¹ and its injectivity and surjectivity","status":"ok"},"proof":[{"text":"Nat is a natural numbers object, so ψ is the canonical map between two natural numbers objects. By [[AffineConstructive.theory.nno.nno_to_nno_bijective]] it is a bijection, and its inverse is the canonical map back.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.contents.let:inst3","base":"let:inst3","kind":"let","start":79,"body":[80,82],"status":"ok","short":{"text":"That ψ⁻¹ preserves zero and successor, as a hypothesis for the section's proofs","status":"ok"},"proof":[{"text":"ψ is a bijection that preserves zero and successor, so by [[AffineConstructive.theory.nno.invert_maybe_algebra_morphism]] its inverse preserves them too.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.nno_suc_inj","base":"nno_suc_inj","kind":"inst","start":83,"body":[84,89],"status":"ok","short":{"text":"The successor of a natural numbers object is injective","status":"ok"},"proof":[{"text":"Fix x and y; suc x = suc y must imply x = y. The canonical bijection ψ from ℕ to the concrete naturals is injective, so both equalities may be replaced by their images under ψ ([[AffineConstructive.theory.set.injective_iff]]).","status":"ok","from":0,"to":2},{"text":"Since ψ preserves successor, the hypothesis becomes suc (ψ x) = suc (ψ y). The required implication is then injectivity of the concrete successor, [[AffineConstructive.implementations.nat.nno.Nat_S_inj]].","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.theory.nno.nno_suc_nonzero","base":"nno_suc_nonzero","kind":"prf","start":90,"body":[91,94],"status":"ok","short":{"text":"In a natural numbers object, suc n ≠ 0 for every n","status":"ok"},"proof":[{"text":"An inequality of images under ψ gives an inequality of the arguments. Since ψ preserves zero and successor, it suffices that suc (ψ n) ≠ 0 in the concrete naturals.","status":"ok","from":0,"to":1},{"text":"This is [[AffineConstructive.implementations.nat.nno.Nat_S_nonzero]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.nno.nno_dec_eq","base":"nno_dec_eq","kind":"inst","start":95,"body":[96,99],"status":"ok","short":{"text":"A natural numbers object has decidable equality","status":"ok"},"proof":[{"text":"Fix x and y; the equality x = y must be shown decidable.","status":"ok","from":0,"to":1},{"text":"Since ψ is injective, x = y is equivalent to ψ x = ψ y ([[AffineConstructive.theory.set.injective_iff]]). Decidability transfers along this equivalence, and the concrete naturals have decidable equality ([[AffineConstructive.implementations.nat.nno.Nat_decidable]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.nno.contents.let:inst4","base":"let:inst4","kind":"let","start":100,"body":[101,103],"status":"ok","short":{"text":"ℕ has decidable equality, from [[AffineConstructive.theory.nno.nno_dec_eq]], as a hypothesis for the section's proofs","status":"ok"},"proof":[{"text":"Every natural numbers object has decidable equality, by [[AffineConstructive.theory.nno.nno_dec_eq]]. That covers ℕ.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.nno_zero_or_suc","base":"nno_zero_or_suc","kind":"prf","start":104,"body":[105,119],"status":"ok","short":{"text":"Every n of a natural numbers object is 0 or the successor of some m","status":"ok"},"proof":[{"text":"Transport n to the concrete naturals along the bijection ψ. Since ψ⁻¹(ψ n) = n, it is enough to look at ψ n, which is either zero or a successor S m'.","status":"ok","from":0,"to":2},{"text":"If ψ n is zero, then ψ⁻¹ preserves zero, so the recovered equation reads 0 = n. By symmetry, the left disjunct n = 0 holds.","status":"ok","from":3,"to":7},{"text":"If ψ n is S m', then ψ⁻¹ preserves successor, so the recovered equation becomes suc (ψ⁻¹ m') = n.","status":"ok","from":8,"to":10},{"text":"Then n is a successor: take ψ⁻¹ m' as the witness for the right disjunct, and n = suc (ψ⁻¹ m') follows by symmetry.","status":"ok","from":11,"to":14}]},{"name":"AffineConstructive.theory.nno.nno_ind","base":"nno_ind","kind":"prf","start":122,"body":[123,135],"status":"ok","short":{"text":"Affine induction: if P n implies P (suc n) for every n, then P 0 implies P n for all n","status":"ok"},"proof":[{"text":"Assume the step P n ⊸ P (suc n) for every n. The proof goes through the concrete naturals: it suffices to prove induction there for the family n ↦ P (ψ⁻¹ n), namely that P (ψ⁻¹ 0) implies P (ψ⁻¹ n) for every concrete n.","status":"ok","from":0,"to":2},{"text":"This suffices. Fix y in ℕ. Since ψ⁻¹ preserves zero, P 0 is P (ψ⁻¹ 0), and the transported statement applies. Specialise it at ψ y; then ψ⁻¹(ψ y) = y gives P y.","status":"ok","from":3,"to":6},{"text":"For the transported statement, apply induction on the concrete naturals to the family n ↦ P (ψ⁻¹ n). What remains is the step: fix a concrete n.","status":"ok","from":7,"to":9},{"text":"The given step at ψ⁻¹ n turns P (ψ⁻¹ n) into P (suc (ψ⁻¹ n)). Because ψ⁻¹ preserves successor, this is P (ψ⁻¹ (suc n)).","status":"ok","from":10,"to":12}]},{"name":"AffineConstructive.theory.nno.nno_ind_alt","base":"nno_ind_alt","kind":"prf","start":137,"body":[138,154],"status":"ok","short":{"text":"Induction for an extensional family of affine propositions, with base case and step given in the base logic","status":"ok"},"proof":[{"text":"Assume three things: P respects equality, P 0 holds, and P n gives P (suc n), all in the base logic.","status":"ok","from":0,"to":1},{"text":"Form the family n ↦ !P n of affirmed propositions. It must be a function ℕ ⇾ Ω, that is, n = m must imply that !P n and !P m are equal. Equality on ℕ is decidable and so affirmative ([[AffineConstructive.theory.set.dec_eq_aff_eq]]). Hence a base-logic implication from n = m is enough ([[AffineConstructive.logic.aprop.affirmative_aimpl]]).","status":"ok","from":2,"to":6},{"text":"Both !P n and !P m are affirmative, so their affine equivalence reduces to a logical equivalence ([[AffineConstructive.logic.aprop.affirmative_aiff]]). Each direction is an instance of the hypothesis that P respects equality, the converse direction using n = m read backwards.","status":"ok","from":7,"to":10},{"text":"Apply affine induction [[AffineConstructive.theory.nno.nno_ind]] to this family. Its base case is the hypothesis P 0, and the step is what remains.","status":"ok","from":11,"to":12},{"text":"Fix n. The step asks that !P n imply !P (suc n). Since !P n is affirmative, the base-logic step P n → P (suc n) is enough ([[AffineConstructive.logic.aprop.affirmative_aimpl]]).","status":"ok","from":13,"to":16}]},{"name":"AffineConstructive.theory.nno.ϕ","base":"ϕ","kind":"abbrev","start":156,"body":null,"status":"ok","short":{"text":"The iteration n ↦ fⁿ(x): the canonical map from ℕ to X with x as zero and f as successor","status":"ok"},"long":{"text":"For a function f : X ⇾ X and a point x of X, ϕ f x is the canonical map [[AffineConstructive.interfaces.naturals.nno_to_set]] from the natural numbers object ℕ into X, where X is made a set with zero and successor by taking x as its zero and f as its successor. Since that map preserves zero and commutes with successor, it sends 0 to x and suc n to f applied to its value at n: it is the n-fold iterate of f at x, the map that the universal property of ℕ provides.\n\nThe abbreviation is a notation local to the section that builds primitive recursion. The section's facts `base` and `step` restate the two preservation laws for ϕ f x, and [[AffineConstructive.theory.nno.nno_rec]] packages ϕ, as a function of the starting point x and of n together, into a function X × ℕ ⇾ X; [[AffineConstructive.theory.nno.nno_rec_is_fun]] shows that ϕ f x depends on x only up to equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.contents.let:base","base":"let:base","kind":"let","start":157,"body":[158,160],"status":"ok","short":{"text":"Iterating f from x zero times gives x","status":"ok"},"proof":[{"text":"Make X a structure with zero x and successor f. Then the iteration ϕ f x is the canonical map out of ℕ into X, and as such it preserves zero, so it sends 0 to x.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.contents.let:step","base":"let:step","kind":"let","start":161,"body":[162,164],"status":"ok","short":{"text":"Iterating f from x n + 1 times applies f once more to the n-th iterate","status":"ok"},"proof":[{"text":"As in the base case, take x as the zero of X and f as its successor, so that ϕ f x is the canonical map out of ℕ. It preserves successor, which gives the recursion equation for every n.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.nno.nno_rec_is_fun","base":"nno_rec_is_fun","kind":"inst","start":165,"body":[166,182],"status":"ok","short":{"text":"The iteration of f from x depends on x extensionally: equal starting points give equal iterations","status":"ok"},"proof":[{"text":"Fix starting points x₁ and x₂. The goal is that x₁ = x₂ implies that the two iterations of f, as functions on ℕ, are equal.","status":"ok","from":0,"to":1},{"text":"By the base equations, each starting point is the value of its iteration at 0. The hypothesis then reads ϕ f x₁ 0 = ϕ f x₂ 0, the base case of an induction.","status":"ok","from":2,"to":3},{"text":"Apply affine induction [[AffineConstructive.theory.nno.nno_ind]] to the family n ↦ (ϕ f x₁ n = ϕ f x₂ n). This family is a function on ℕ: equality on ℕ is affirmative, so a base-logic implication is enough ([[AffineConstructive.logic.aprop.affirmative_aimpl]]). Given n = m, rewriting gives the equivalence of the two equations.","status":"ok","from":4,"to":10},{"text":"For the step, fix n. By the step equations, both iterates at suc n are f applied to the iterates at n. Since f preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), the equation at n gives the equation at suc n.","status":"ok","from":11,"to":16}]},{"name":"AffineConstructive.theory.nno.nno_rec","base":"nno_rec","kind":"def","start":183,"body":[184,190],"status":"ok","short":{"text":"Primitive recursion: the function X × ℕ ⇾ X sending (x, n) to f applied n times to x","status":"ok"},"proof":[{"text":"Define recursion as the uncurried form of x ↦ ϕ f x, iteration from x. This is a function X ⇾ (ℕ ⇾ X) by [[AffineConstructive.theory.nno.nno_rec_is_fun]].","status":"ok","from":0,"to":3},{"text":"Uncurrying into a function on X × ℕ requires the two-argument map to be strong. This holds because ℕ has decidable equality ([[AffineConstructive.theory.nno.nno_dec_eq]], [[AffineConstructive.theory.set.dec_strong_op_r]]).","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.nno.nno_rec_base","base":"nno_rec_base","kind":"def","start":191,"body":null,"status":"ok","short":{"text":"The base equation of recursion: nno_rec f (x, 0) = x","status":"ok"},"long":{"text":"The first computation rule of [[AffineConstructive.theory.nno.nno_rec]]: recursion from x stopped at zero returns x. It is the statement that the canonical map out of ℕ into X, equipped with x as zero and f as successor, preserves zero, restated in terms of [[AffineConstructive.theory.nno.nno_rec]] so that rewriting by it needs no knowledge of how the recursion operator is built.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.nno_rec_step","base":"nno_rec_step","kind":"def","start":192,"body":null,"status":"ok","short":{"text":"The step equation of recursion: nno_rec f (x, suc n) = f (nno_rec f (x, n))","status":"ok"},"long":{"text":"The second computation rule of [[AffineConstructive.theory.nno.nno_rec]]: one more step of recursion applies f once more. It is the statement that the canonical map out of ℕ into X, with zero x and successor f, commutes with successor ([[AffineConstructive.interfaces.naturals.preserves_suc]]), restated for [[AffineConstructive.theory.nno.nno_rec]]. Together with [[AffineConstructive.theory.nno.nno_rec_base]] it characterises the recursion operator, by the initiality of ℕ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.nno_rec_strong_is_fun","base":"nno_rec_strong_is_fun","kind":"inst","start":194,"body":[195,224],"status":"ok","short":{"text":"For strong X, recursion is extensional in f: equal functions give equal recursions","status":"ok"},"proof":[{"text":"Fix f and g. Equality of functions is pointwise: from f x = g x for all x, the goal is nno_rec f p = nno_rec g p for every p in X × ℕ.","status":"ok","from":0,"to":2},{"text":"Fix p = (y, n). Then generalise again over the starting point y, so that the claim is about all starting points at once. Generalise also over n, so that, for each n, the equality of f and g implies ϕ f x n = ϕ g x n for every x.","status":"ok","from":3,"to":8},{"text":"Prove this by induction in the form [[AffineConstructive.theory.nno.nno_ind_alt]]. Three things are left to show: that the claim respects equality in n, its base case and its step.","status":"ok","from":9,"to":9},{"text":"The claim respects equality: rewrite along n = m.","status":"ok","from":10,"to":12},{"text":"For the base case, fix x. By the base equations both iterates at 0 are x, and the equation x = x holds.","status":"ok","from":13,"to":16},{"text":"For the step, assume the claim at n and fix x. By the step equations, the goal is f (ϕ f x n) = g (ϕ g x n).","status":"ok","from":17,"to":21},{"text":"Pass through g (ϕ f x n) by strong transitivity ([[AffineConstructive.interfaces.aprop.strong_transitivity]]), which needs X to be strong. Strong transitivity joins the two equalities by the additive conjunction. Each leg may therefore use the whole hypothesis f = g, and the two legs are proved separately.","status":"ok","from":22,"to":23},{"text":"The first leg is the hypothesis f = g, specialised at ϕ f x n.","status":"ok","from":24,"to":25},{"text":"For the second leg, g preserves equality ([[AffineConstructive.interfaces.set.is_fun]]), so it suffices that ϕ f x n = ϕ g x n. The induction hypothesis consumes f = g and gives this equation for every starting point. Specialise it at x.","status":"ok","from":26,"to":29}]},{"name":"AffineConstructive.theory.nno.nno_rec_fun","base":"nno_rec_fun","kind":"def","start":225,"body":null,"status":"ok","short":{"text":"Primitive recursion (X ⇾ X) ⇾ (X × ℕ ⇾ X) as a function of sets, for strong X","status":"ok"},"long":{"text":"The recursion operator [[AffineConstructive.theory.nno.nno_rec]] bundled as a function of sets. Its argument f now ranges over the function set X ⇾ X, so equal step functions give equal recursions. That f ↦ nno_rec f preserves equality is [[AffineConstructive.theory.nno.nno_rec_strong_is_fun]], which needs X to be strong. The proof compares f and g along two different iterations and joins the comparisons by strong transitivity, so the equality of X must be an apartness.\n\nIts computation rules are [[AffineConstructive.theory.nno.nno_rec_fun_base]] and [[AffineConstructive.theory.nno.nno_rec_fun_step]]. A canonical-structure declaration lets unification recognise nno_rec as this function of sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.nno_rec_fun_base","base":"nno_rec_fun_base","kind":"def","start":226,"body":null,"status":"ok","short":{"text":"The base equation for the bundled recursion: nno_rec_fun f (x, 0) = x","status":"ok"},"long":{"text":"The computation rule [[AffineConstructive.theory.nno.nno_rec_base]] restated for the bundled operator [[AffineConstructive.theory.nno.nno_rec_fun]]: recursion from x stops at x when the count is zero.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.nno_rec_fun_step","base":"nno_rec_fun_step","kind":"def","start":227,"body":null,"status":"ok","short":{"text":"The step equation for the bundled recursion: nno_rec_fun f (x, suc n) = f (nno_rec f (x, n))","status":"ok"},"long":{"text":"The computation rule [[AffineConstructive.theory.nno.nno_rec_step]] restated for the bundled operator [[AffineConstructive.theory.nno.nno_rec_fun]]: one more step of recursion applies f once more. The right-hand side keeps the recursion in its unbundled form, [[AffineConstructive.theory.nno.nno_rec]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.coercion:nno_suc_inj","base":"coercion:nno_suc_inj","kind":"coercion","start":229,"body":null,"status":"ok","short":{"text":"A natural numbers object reaches the injectivity of its successor","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.coercion:nno_dec_eq","base":"coercion:nno_dec_eq","kind":"coercion","start":230,"body":null,"status":"ok","short":{"text":"A natural numbers object reaches the decidability of its equality","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.canonical:nno_rec_fun","base":"canonical:nno_rec_fun","kind":"canonical","start":234,"body":null,"status":"ok","short":{"text":"Unification finds primitive recursion (X ⇾ X) ⇾ (X × ℕ ⇾ X), for a strong set X, as a function of sets","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.nno.nno_induction","base":"nno_induction","kind":"ltac","start":238,"body":null,"status":"ok","short":{"text":"Begins a proof by induction over a natural numbers object, leaving the base case and the step","status":"ok"},"long":{"text":"The tactic proves a goal stating that a property holds of every element of a natural numbers object by the base-logic induction principle [[AffineConstructive.theory.nno.nno_ind_alt]]. It first puts the goal in head normal form and, where it can, restates the quantifier so that the goal reads as the affine universal ∏ n, P n over the natural numbers object. Then it applies [[AffineConstructive.theory.nno.nno_ind_alt]], which asks for three things: that P respects the equality of ℕ, that P 0 holds, and that P n gives P (suc n) for every n.\n\nThe first obligation is discharged automatically: given n = m, the tactic rewrites P n into P m by that equality, which succeeds whenever P is built from operations that preserve equality. The base case and the step remain as goals, in that order. A proof reaches for this tactic instead of applying [[AffineConstructive.theory.nno.nno_ind_alt]] directly to avoid stating the property P by hand and proving its compatibility with equality each time; [[AffineConstructive.theory.nno.nno_ind]] remains the tool when the induction is to be carried out in affine logic, with the step an affine implication P n ⊸ P (suc n).","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.naturals":{"page":"../interfaces/naturals.html","short":"Interfaces for the naturals: natural numbers object, initial near-rig, subtraction and order","summary":"This file gives the interfaces for the natural numbers, in two characterisations. The first is Lawvere's natural numbers object: [[NaturalNumbersObject]] says that N, with a zero and a [[Successor]], is initial among such sets, with morphisms given by [[MaybeAlgebra_Morphism]]. The second, [[Naturals]], is the one the algebraic hierarchy uses. It says that N is a right near-rig initial among additive monoids, not necessarily commutative, with a chosen element 1, and the canonical map sends n to 1 + ⋯ + 1. The bundled record [[naturals]] packs this structure. The file also gives an interface, [[NatSubtract]] with specification [[NatSubtractSpec]], for comparing two naturals and returning their difference, a substitute for subtraction. Finally, [[OrderedNaturals]] adds a strong linear refutative rig order. The theory of naturals and the concrete models build on these classes."},"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.implementations.nat.nno":{"page":"../implementations/nat/nno.html","short":"The natural numbers as an inductive type: natural numbers object, induction, decidable equality","summary":"The file builds the natural numbers as an inductive type with a zero and a successor, makes it the set [[Nat]] with strict equality affirmed, and proves that it is a natural numbers object ([[Nat_NNO]]), with the maps out of it ([[Nat_rec]]) given by primitive recursion. It derives induction for affine predicates ([[Nat_ind]]) and a variant for predicates proved outright ([[Nat_sind]]), and defines case analysis on a natural as a function of sets ([[Nat_destruct]]). An encode–decode argument through [[eq_code]] shows that the successor is injective ([[Nat_S_inj]]) and never zero ([[Nat_S_nonzero]]). A boolean test then decides equality ([[Nat_eq_is_dec]]), which makes Nat a set with decidable equality and therefore affirmative, refutative and strong equality."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.quote.base":{"page":"../tactics/quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.tactics.change_quantifiers":{"page":"../tactics/change_quantifiers.html","short":"A tactic converting base ∀/∃ goals into affine ∏/∐ propositions","summary":"This file provides a tactic that turns a goal written with the base quantifiers ∀ and ∃ over the proof component of an affine proposition into the proof of one affine proposition, made with the affine quantifiers ∏ and ∐. [[rewrite_quantifiers]] works through the nested quantifiers and builds the affine proposition, keeping the bound variables in place. [[change_quantifiers]] uses it to restate the goal. The conversion relies only on the fact that the proof components of [[all]] and [[aex]] are, by definition, the base quantifiers of the proof components. So the new goal is definitionally equal to the old one, and after the change the affine laws of the connectives can rewrite it."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

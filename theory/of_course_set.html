ineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":12007,"e":12012,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":12164,"e":12169,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":12321,"e":12326,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":12478,"e":12483,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":12635,"e":12640,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":12792,"e":12797,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":12949,"e":12954,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":13106,"e":13111,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":13263,"e":13268,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":13420,"e":13425,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":13577,"e":13582,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":13735,"e":13740,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":13892,"e":13897,"lib":"AffineConstructive.theory.of_course_set","name":"doit3","kind":"ltac","local":true},{"s":15672,"e":15675,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":16418,"e":16421,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":16520,"e":16523,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":17206,"e":17209,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":17344,"e":17347,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file shows that the set !X, whose elements are those of X with the affirmed equality, carries every algebraic structure that X carries. The operations of X are lifted along [[AffineConstructive.theory.set.of_course_op]] and [[AffineConstructive.theory.set.of_course_map]], and the constants are reused unchanged. First the single laws are transferred one at a time: associativity, commutativity, idempotency, absorption, distributivity, identities, absorbing elements and inverses. From these laws the file builds instances that make !X a semigroup, monoid or group (commutative or not), a semilattice, lattice or distributive lattice, and a near-rg, rg, rig, rng or ring in all the left, right and commutative variants. It also shows that the counit ε : !X ⇾ X preserves units, zero, one, top and bottom, and is a semigroup, monoid, rg and rig morphism. These results are registered for instance resolution, so algebra on X can be used inside the of-course modality without further work.","short":"Algebraic structures lifted from X to !X; the counit is a morphism","items":[{"name":"AffineConstructive.theory.of_course_set.doit","base":"doit","kind":"ltac","start":4,"body":null,"status":"ok","short":{"text":"Proves an algebraic law for an operation lifted to !X from the same law on X","status":"ok"},"long":{"text":"The tactic proves the lemmas that transfer a single law (associativity, commutativity, an identity, an inverse, distributivity, absorption) from an operation on X to its lift [[AffineConstructive.theory.set.of_course_op]] (or [[AffineConstructive.theory.set.of_course_map]]) on !X. It introduces the hypothesis that the law holds on X, unfolds the law on !X to a statement about arbitrary elements, fixes those elements, and closes the goal with the hypothesis at the same elements.\n\nThis works because !X has the elements of X and the lifted operation computes as the original one, so once the class is unfolded the law on !X is an instance of the law on X. No reasoning about the of-course modality itself is needed, which is why one short tactic serves for every law in the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_associative","base":"of_course_set_associative","kind":"prf","start":5,"body":[6,8],"status":"ok","short":{"text":"If f is associative on X, its lift to !X is associative","status":"ok"},"proof":[{"text":"The set !X has the same elements as X, and [[AffineConstructive.theory.set.of_course_op]] f acts on them as f does. So for any three elements, associativity of the lift is associativity of f at the same elements, and unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_commutative","base":"of_course_set_commutative","kind":"prf","start":9,"body":[10,12],"status":"ok","short":{"text":"If f is commutative, its lift to !X ⊗ !X ⇾ !Y is commutative","status":"ok"},"proof":[{"text":"Elements of !X are elements of X, and the lift computes as f does. So the commutativity equation for the lift at x and y is the commutativity of f at x and y, and unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_binary_idempotent","base":"of_course_set_binary_idempotent","kind":"prf","start":13,"body":[14,16],"status":"ok","short":{"text":"If f(x, x) = x on X, the same holds for the lift of f to !X","status":"ok"},"proof":[{"text":"For x in !X, the lift applied to (x, x) is f(x, x), and the required equality with x is the idempotency of f at x. Unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_absorption","base":"of_course_set_absorption","kind":"prf","start":17,"body":[18,20],"status":"ok","short":{"text":"If f absorbs g, the lift of f absorbs the lift of g","status":"ok"},"proof":[{"text":"The lifts of f and g compute as f and g on the same elements, so the absorption law for the lifts at x and y is the absorption law of f over g at x and y. Unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_left_distribute","base":"of_course_set_left_distribute","kind":"prf","start":21,"body":[22,24],"status":"ok","short":{"text":"If f distributes over g on the left, so do their lifts to !X","status":"ok"},"proof":[{"text":"Both sides of the left distributive law for the lifts are the corresponding sides for f and g at the same three elements, so the law on !X is the law on X. Unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_right_distribute","base":"of_course_set_right_distribute","kind":"prf","start":25,"body":[26,28],"status":"ok","short":{"text":"If f distributes over g on the right, so do their lifts to !X","status":"ok"},"proof":[{"text":"As on the left: each side of the right distributive law for the lifts is the corresponding side for f and g, so the law on !X is the law on X. Unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_left_identity","base":"of_course_set_left_identity","kind":"prf","start":29,"body":[30,32],"status":"ok","short":{"text":"A left identity for f is a left identity for the lift of f","status":"ok"},"proof":[{"text":"For y in !Y, the lift applied to (x, y) is f(x, y), which equals y because x is a left identity for f. Unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_right_identity","base":"of_course_set_right_identity","kind":"prf","start":33,"body":[34,36],"status":"ok","short":{"text":"A right identity for f is a right identity for the lift of f","status":"ok"},"proof":[{"text":"For x in !X, the lift applied to (x, y) is f(x, y), which equals x because y is a right identity for f. Unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_left_absorb","base":"of_course_set_left_absorb","kind":"prf","start":37,"body":[38,40],"status":"ok","short":{"text":"A left absorbing element for f is left absorbing for the lift of f","status":"ok"},"proof":[{"text":"For y in !Y, the lift applied to (x, y) is f(x, y), which equals x because x is left absorbing for f. Unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_right_absorb","base":"of_course_set_right_absorb","kind":"prf","start":41,"body":[42,44],"status":"ok","short":{"text":"A right absorbing element for f is right absorbing for the lift of f","status":"ok"},"proof":[{"text":"For x in !X, the lift applied to (x, y) is f(x, y), which equals y because y is right absorbing for f. Unfolding the definitions closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_left_inverse","base":"of_course_set_left_inverse","kind":"prf","start":45,"body":[46,48],"status":"ok","short":{"text":"If g gives left inverses for f, the lift of g gives left inverses for the lift of f","status":"ok"},"proof":[{"text":"The elements of !X, !Y and !Z are those of X, Y and Z, and [[AffineConstructive.theory.set.of_course_op]] and [[AffineConstructive.theory.set.of_course_map]] compute as f and g do. So the left-inverse law for the lifted maps is the law for f and g, and the hypothesis proves it once the definitions are unfolded.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_right_inverse","base":"of_course_set_right_inverse","kind":"prf","start":49,"body":[50,52],"status":"ok","short":{"text":"If g gives right inverses for f, the lift of g gives right inverses for the lift of f","status":"ok"},"proof":[{"text":"As for left inverses: the lifted maps compute as f and g do on the same elements, so after unfolding, the right-inverse law on the of-course sets is the hypothesis itself.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.doit2","base":"doit2","kind":"ltac","start":77,"body":null,"status":"ok","short":{"text":"Closes one field of a lifted structure by instance resolution, exposing the lifted operation first","status":"ok"},"long":{"text":"The tactic handles a single field of an algebraic structure on !X, such as the associativity of the semigroup operation or the left identity of the unit. It first tries instance resolution outright. If that fails, it restates the goal so that the operation of !X, which appears wrapped in an operation projection, becomes a bare [[AffineConstructive.theory.set.of_course_op]] f or [[AffineConstructive.theory.set.of_course_map]] f. It then tries resolution again.\n\nThe restatement is needed because the lemmas of the file that transfer single laws are registered for resolution under goals whose operation has the form of_course_op f. A goal that still shows the projection does not match them. Once the operation is exposed, the field is found from the corresponding law on X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.doit3","base":"doit3","kind":"ltac","start":78,"body":null,"status":"ok","short":{"text":"Proves that !X carries a structure from the same structure on X, field by field","status":"ok"},"long":{"text":"The tactic proves each instance of the file that lifts a whole structure (semigroup, monoid, group, lattice, the rig and ring variants) from X to !X. It introduces the hypothesis that X has the structure. It then splits the goal into the fields of the structure, or unfolds the goal when the structure is a single field, and closes each field with [[AffineConstructive.theory.of_course_set.doit2]]. The sub-structures and laws of each field are found by resolution from the hypothesis on X, through the instances and lifting lemmas registered earlier in the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_semigroup","base":"of_course_set_semigroup","kind":"inst","start":79,"body":[80,82],"status":"ok","short":{"text":"If X is a semigroup, so is !X under the lifted operation","status":"ok"},"proof":[{"text":"A semigroup is a set with an associative operation. Since !X has the elements of X, associativity of the lifted operation on !X is associativity on X. This and the fact that the lifted operation is a morphism of !X ⊗ !X are discharged automatically.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_com_semigroup","base":"of_course_set_com_semigroup","kind":"inst","start":83,"body":[84,86],"status":"ok","short":{"text":"If X is a commutative semigroup, so is !X","status":"ok"},"proof":[{"text":"The semigroup part comes from [[AffineConstructive.theory.of_course_set.of_course_set_semigroup]]. What remains is commutativity of the lifted operation, which is commutativity on X read on the same elements.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_semilattice","base":"of_course_set_semilattice","kind":"inst","start":87,"body":[88,90],"status":"ok","short":{"text":"If X is a semilattice, so is !X","status":"ok"},"proof":[{"text":"[[AffineConstructive.theory.of_course_set.of_course_set_com_semigroup]] makes !X a commutative semigroup. The only remaining field is idempotency of the lifted operation, which holds because the operation is idempotent on X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_monoid","base":"of_course_set_monoid","kind":"inst","start":91,"body":[92,94],"status":"ok","short":{"text":"If X is a monoid, so is !X, with the same unit","status":"ok"},"proof":[{"text":"[[AffineConstructive.theory.of_course_set.of_course_set_semigroup]] gives the semigroup part. The unit of !X is the unit of X, so the left and right identity laws on !X are the identity laws on X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_com_monoid","base":"of_course_set_com_monoid","kind":"inst","start":95,"body":[96,98],"status":"ok","short":{"text":"If X is a commutative monoid, so is !X","status":"ok"},"proof":[{"text":"[[AffineConstructive.theory.of_course_set.of_course_set_monoid]] gives the monoid part, and commutativity of the lifted operation is commutativity on X. Nothing else is required.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_bounded_sl","base":"of_course_set_bounded_sl","kind":"inst","start":99,"body":[100,102],"status":"ok","short":{"text":"If X is a bounded semilattice, so is !X","status":"ok"},"proof":[{"text":"A bounded semilattice is a semilattice that is also a commutative monoid. The two parts come from [[AffineConstructive.theory.of_course_set.of_course_set_semilattice]] and [[AffineConstructive.theory.of_course_set.of_course_set_com_monoid]], so the structure on !X is assembled with no further work.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_group","base":"of_course_set_group","kind":"inst","start":103,"body":[104,106],"status":"ok","short":{"text":"If X is a group, so is !X, with the lifted inversion","status":"ok"},"proof":[{"text":"[[AffineConstructive.theory.of_course_set.of_course_set_monoid]] gives the monoid part. The lifted inversion has to be a morphism and satisfy the inverse laws, and both follow from the corresponding facts on X because the elements are the same.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_abgroup","base":"of_course_set_abgroup","kind":"inst","start":107,"body":[108,110],"status":"ok","short":{"text":"If X is an abelian group, so is !X","status":"ok"},"proof":[{"text":"[[AffineConstructive.theory.of_course_set.of_course_set_group]] gives the group part, and commutativity of the lifted operation on !X is commutativity on X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_meet_sl","base":"of_course_set_meet_sl","kind":"inst","start":119,"body":null,"status":"ok","short":{"text":"If X is a meet semilattice, so is !X under the lifted meet","status":"ok"},"long":{"text":"The meet semilattice structure on !X: the meet of !X is the lift of ⊓ by [[AffineConstructive.theory.set.of_course_op]], and a meet semilattice is a semilattice under ⊓, so the instance is [[AffineConstructive.theory.of_course_set.of_course_set_semilattice]] read at the meet. It exists so that resolution finds the structure when it is asked for under its lattice-theoretic name.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_bounded_meet_sl","base":"of_course_set_bounded_meet_sl","kind":"inst","start":120,"body":null,"status":"ok","short":{"text":"If X is a bounded meet semilattice, so is !X, with the same top","status":"ok"},"long":{"text":"The bounded meet semilattice structure on !X, with the lifted meet and the top of X as its identity. It is [[AffineConstructive.theory.of_course_set.of_course_set_bounded_sl]] read at ⊓ and ⊤.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_join_sl","base":"of_course_set_join_sl","kind":"inst","start":121,"body":null,"status":"ok","short":{"text":"If X is a join semilattice, so is !X under the lifted join","status":"ok"},"long":{"text":"The join semilattice structure on !X, the dual of [[AffineConstructive.theory.of_course_set.of_course_set_meet_sl]]: the join of !X is the lift of ⊔, and the instance is [[AffineConstructive.theory.of_course_set.of_course_set_semilattice]] read at the join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_bounded_join_sl","base":"of_course_set_bounded_join_sl","kind":"inst","start":122,"body":null,"status":"ok","short":{"text":"If X is a bounded join semilattice, so is !X, with the same bottom","status":"ok"},"long":{"text":"The bounded join semilattice structure on !X, with the lifted join and the bottom of X as its identity. It is [[AffineConstructive.theory.of_course_set.of_course_set_bounded_sl]] read at ⊔ and ⊥.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_lattice","base":"of_course_set_lattice","kind":"inst","start":123,"body":[124,126],"status":"ok","short":{"text":"If X is a lattice, so is !X under the lifted meet and join","status":"ok"},"proof":[{"text":"A lattice is a meet semilattice and a join semilattice whose operations absorb each other. Each of these parts carries over to !X: the two semilattice structures by [[AffineConstructive.theory.of_course_set.of_course_set_meet_sl]] and [[AffineConstructive.theory.of_course_set.of_course_set_join_sl]], and the absorption laws by [[AffineConstructive.theory.of_course_set.of_course_set_absorption]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_distr_lattice","base":"of_course_set_distr_lattice","kind":"inst","start":127,"body":[128,130],"status":"ok","short":{"text":"If X is a distributive lattice, so is !X","status":"ok"},"proof":[{"text":"!X is a lattice by [[AffineConstructive.theory.of_course_set.of_course_set_lattice]]. The lifted meet distributes over the lifted join by [[AffineConstructive.theory.of_course_set.of_course_set_left_distribute]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_add_nc_sg","base":"of_course_set_add_nc_sg","kind":"inst","start":137,"body":null,"status":"ok","short":{"text":"If X is a semigroup under +, so is !X under the lifted addition","status":"ok"},"long":{"text":"The additive semigroup structure on !X, not necessarily commutative: the addition of !X is the lift of + by [[AffineConstructive.theory.set.of_course_op]], and the instance is [[AffineConstructive.theory.of_course_set.of_course_set_semigroup]] read at +.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_add_sg","base":"of_course_set_add_sg","kind":"inst","start":138,"body":null,"status":"ok","short":{"text":"If X is a commutative semigroup under +, so is !X","status":"ok"},"long":{"text":"The commutative additive semigroup structure on !X, the instance [[AffineConstructive.theory.of_course_set.of_course_set_com_semigroup]] read at the lifted addition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_add_nc_mon","base":"of_course_set_add_nc_mon","kind":"inst","start":139,"body":null,"status":"ok","short":{"text":"If X is a monoid under + and 0, so is !X","status":"ok"},"long":{"text":"The additive monoid structure on !X, not necessarily commutative, with the lifted addition and the zero of X. It is [[AffineConstructive.theory.of_course_set.of_course_set_monoid]] read at + and 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_add_mon","base":"of_course_set_add_mon","kind":"inst","start":140,"body":null,"status":"ok","short":{"text":"If X is a commutative monoid under + and 0, so is !X","status":"ok"},"long":{"text":"The commutative additive monoid structure on !X, the instance [[AffineConstructive.theory.of_course_set.of_course_set_com_monoid]] read at the lifted addition and 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_add_nc_grp","base":"of_course_set_add_nc_grp","kind":"inst","start":141,"body":null,"status":"ok","short":{"text":"If X is a group under +, 0 and −, so is !X","status":"ok"},"long":{"text":"The additive group structure on !X, not necessarily abelian: the addition is lifted by [[AffineConstructive.theory.set.of_course_op]], the negation by [[AffineConstructive.theory.set.of_course_map]], and the zero is that of X. It is [[AffineConstructive.theory.of_course_set.of_course_set_group]] read at +, 0 and −.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_add_grp","base":"of_course_set_add_grp","kind":"inst","start":142,"body":null,"status":"ok","short":{"text":"If X is an abelian group under +, 0 and −, so is !X","status":"ok"},"long":{"text":"The abelian additive group structure on !X, the instance [[AffineConstructive.theory.of_course_set.of_course_set_abgroup]] read at the lifted addition and negation and the zero of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_mult_sg","base":"of_course_set_mult_sg","kind":"inst","start":143,"body":null,"status":"ok","short":{"text":"If X is a semigroup under ·, so is !X under the lifted multiplication","status":"ok"},"long":{"text":"The multiplicative semigroup structure on !X: the multiplication of !X is the lift of · by [[AffineConstructive.theory.set.of_course_op]], and the instance is [[AffineConstructive.theory.of_course_set.of_course_set_semigroup]] read at ·.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_mult_mon","base":"of_course_set_mult_mon","kind":"inst","start":144,"body":null,"status":"ok","short":{"text":"If X is a monoid under · and 1, so is !X","status":"ok"},"long":{"text":"The multiplicative monoid structure on !X, with the lifted multiplication and the one of X. It is [[AffineConstructive.theory.of_course_set.of_course_set_monoid]] read at · and 1.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_mult_com_mon","base":"of_course_set_mult_com_mon","kind":"inst","start":145,"body":null,"status":"ok","short":{"text":"If X is a commutative monoid under · and 1, so is !X","status":"ok"},"long":{"text":"The commutative multiplicative monoid structure on !X, the instance [[AffineConstructive.theory.of_course_set.of_course_set_com_monoid]] read at the lifted multiplication and 1.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_near_rg","base":"of_course_set_near_rg","kind":"inst","start":155,"body":[156,158],"status":"ok","short":{"text":"If X is a right near-rg, so is !X","status":"ok"},"proof":[{"text":"The structure is assembled from its parts on !X. Addition and zero form a monoid by [[AffineConstructive.theory.of_course_set.of_course_set_add_nc_mon]], and multiplication forms a semigroup by [[AffineConstructive.theory.of_course_set.of_course_set_mult_sg]]. Multiplication distributes over addition on the right by [[AffineConstructive.theory.of_course_set.of_course_set_right_distribute]], and zero absorbs on the left by [[AffineConstructive.theory.of_course_set.of_course_set_left_absorb]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_left_near_rg","base":"of_course_set_left_near_rg","kind":"inst","start":159,"body":[160,162],"status":"ok","short":{"text":"If X is a left near-rg, so is !X","status":"ok"},"proof":[{"text":"This is the mirror image of the right-handed case. On !X, addition and zero form a monoid by [[AffineConstructive.theory.of_course_set.of_course_set_add_nc_mon]] and multiplication forms a semigroup by [[AffineConstructive.theory.of_course_set.of_course_set_mult_sg]]. Multiplication distributes over addition on the left by [[AffineConstructive.theory.of_course_set.of_course_set_left_distribute]], and zero absorbs on the right by [[AffineConstructive.theory.of_course_set.of_course_set_right_absorb]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_rg","base":"of_course_set_rg","kind":"inst","start":163,"body":[164,166],"status":"ok","short":{"text":"If X is an rg, so is !X","status":"ok"},"proof":[{"text":"An rg is both a left and a right near-rg whose addition is commutative. !X is both kinds of near-rg by [[AffineConstructive.theory.of_course_set.of_course_set_left_near_rg]] and [[AffineConstructive.theory.of_course_set.of_course_set_near_rg]]. Its addition forms a commutative monoid by [[AffineConstructive.theory.of_course_set.of_course_set_add_mon]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_near_rig","base":"of_course_set_near_rig","kind":"inst","start":167,"body":[168,170],"status":"ok","short":{"text":"If X is a right near-rig, so is !X","status":"ok"},"proof":[{"text":"!X is a right near-rg by [[AffineConstructive.theory.of_course_set.of_course_set_near_rg]]. Multiplication and one form a monoid on !X by [[AffineConstructive.theory.of_course_set.of_course_set_mult_mon]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_left_near_rig","base":"of_course_set_left_near_rig","kind":"inst","start":171,"body":[172,174],"status":"ok","short":{"text":"If X is a left near-rig, so is !X","status":"ok"},"proof":[{"text":"!X is a left near-rg by [[AffineConstructive.theory.of_course_set.of_course_set_left_near_rg]]. Multiplication and one form a monoid on !X by [[AffineConstructive.theory.of_course_set.of_course_set_mult_mon]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_rig","base":"of_course_set_rig","kind":"inst","start":175,"body":[176,178],"status":"ok","short":{"text":"If X is a rig, so is !X","status":"ok"},"proof":[{"text":"!X is an rg by [[AffineConstructive.theory.of_course_set.of_course_set_rg]]. Multiplication and one form a monoid on !X by [[AffineConstructive.theory.of_course_set.of_course_set_mult_mon]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_near_rng","base":"of_course_set_near_rng","kind":"inst","start":179,"body":[180,182],"status":"ok","short":{"text":"If X is a right near-rng, so is !X","status":"ok"},"proof":[{"text":"!X is a right near-rg by [[AffineConstructive.theory.of_course_set.of_course_set_near_rg]]. Addition, zero and negation form a group on !X by [[AffineConstructive.theory.of_course_set.of_course_set_add_nc_grp]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_left_near_rng","base":"of_course_set_left_near_rng","kind":"inst","start":183,"body":[184,186],"status":"ok","short":{"text":"If X is a left near-rng, so is !X","status":"ok"},"proof":[{"text":"!X is a left near-rg by [[AffineConstructive.theory.of_course_set.of_course_set_left_near_rg]]. Addition, zero and negation form a group on !X by [[AffineConstructive.theory.of_course_set.of_course_set_add_nc_grp]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_rng","base":"of_course_set_rng","kind":"inst","start":187,"body":[188,190],"status":"ok","short":{"text":"If X is a rng, so is !X","status":"ok"},"proof":[{"text":"A rng is an abelian group under addition that is also an rg. Both parts already transfer to !X, by [[AffineConstructive.theory.of_course_set.of_course_set_add_grp]] and [[AffineConstructive.theory.of_course_set.of_course_set_rg]], so the rng structure on !X is assembled from them.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_near_ring","base":"of_course_set_near_ring","kind":"inst","start":191,"body":[192,194],"status":"ok","short":{"text":"If X is a near-ring, so is !X","status":"ok"},"proof":[{"text":"A near-ring is a near-rng with a unit that is also a near-rig. Both parts transfer to !X, by [[AffineConstructive.theory.of_course_set.of_course_set_near_rng]] and [[AffineConstructive.theory.of_course_set.of_course_set_near_rig]], and together they give the near-ring structure on !X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_left_near_ring","base":"of_course_set_left_near_ring","kind":"inst","start":195,"body":[196,198],"status":"ok","short":{"text":"If X is a left near-ring, so is !X","status":"ok"},"proof":[{"text":"A left near-ring combines a left near-rng with a left near-rig. Both transfer to !X, by [[AffineConstructive.theory.of_course_set.of_course_set_left_near_rng]] and [[AffineConstructive.theory.of_course_set.of_course_set_left_near_rig]], and together they give the left near-ring structure on !X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_ring","base":"of_course_set_ring","kind":"inst","start":199,"body":[200,202],"status":"ok","short":{"text":"If X is a ring, so is !X","status":"ok"},"proof":[{"text":"A ring is a rng that is also a rig. Both structures transfer to !X, by [[AffineConstructive.theory.of_course_set.of_course_set_rng]] and [[AffineConstructive.theory.of_course_set.of_course_set_rig]], and together they make !X a ring.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_com_rig","base":"of_course_set_com_rig","kind":"inst","start":203,"body":[204,206],"status":"ok","short":{"text":"If X is a commutative rig, so is !X","status":"ok"},"proof":[{"text":"A commutative rig is a rig whose multiplication makes it a commutative monoid. Both parts transfer to !X, by [[AffineConstructive.theory.of_course_set.of_course_set_rig]] and [[AffineConstructive.theory.of_course_set.of_course_set_mult_com_mon]], and together they make !X a commutative rig.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_set_com_ring","base":"of_course_set_com_ring","kind":"inst","start":207,"body":[208,210],"status":"ok","short":{"text":"If X is a commutative ring, so is !X","status":"ok"},"proof":[{"text":"A commutative ring is a ring that is also a commutative rig. Both transfer to !X, by [[AffineConstructive.theory.of_course_set.of_course_set_ring]] and [[AffineConstructive.theory.of_course_set.of_course_set_com_rig]], and together they make !X a commutative ring.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.ε","base":"ε","kind":"abbrev","start":225,"body":null,"status":"ok","short":{"text":"Local name ε for the counit !X ⇾ X of the of-course modality","status":"ok"},"long":{"text":"Within this file, ε abbreviates [[AffineConstructive.theory.set.of_course_counit]], the counit ε : !X ⇾ X of the of-course comonad on sets. It is the identity on elements and forgets that equality on !X is affirmed. The abbreviation keeps the statements about the counit's preservation properties short.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_pointed","base":"of_course_counit_pointed","kind":"inst","start":226,"body":[227,229],"status":"ok","short":{"text":"The counit ε : !X ⇾ X sends any point x to x","status":"ok"},"proof":[{"text":"The counit acts as the identity on elements, so the claim that ε sends x to x amounts to the equality x = x in X. Reflexivity proves it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_unit_pointed","base":"of_course_counit_unit_pointed","kind":"inst","start":230,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves the monoid unit","status":"ok"},"long":{"text":"The counit ε : !X ⇾ X preserves the monoid unit. The unit of !X is the unit of X, and ε is the identity on elements, so this is the general fact [[AffineConstructive.theory.of_course_set.of_course_counit_pointed]] at the unit. It exists as a named instance so that resolution finds it when a monoid morphism is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_top_pointed","base":"of_course_counit_top_pointed","kind":"inst","start":231,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves top","status":"ok"},"long":{"text":"The counit ε : !X ⇾ X sends the top element ⊤ of !X, which is the top element of X, to ⊤. It is [[AffineConstructive.theory.of_course_set.of_course_counit_pointed]] at ⊤, given a name so that resolution finds it at the order-theoretic structure.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_bottom_pointed","base":"of_course_counit_bottom_pointed","kind":"inst","start":232,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves bottom","status":"ok"},"long":{"text":"The counit ε : !X ⇾ X sends the bottom element ⊥ of !X, which is the bottom element of X, to ⊥. It is [[AffineConstructive.theory.of_course_set.of_course_counit_pointed]] at ⊥, given a name so that resolution finds it at the order-theoretic structure.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_zero_pointed","base":"of_course_counit_zero_pointed","kind":"inst","start":233,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves zero","status":"ok"},"long":{"text":"The counit ε : !X ⇾ X sends 0 to 0. The zero of !X is the zero of X, so this is [[AffineConstructive.theory.of_course_set.of_course_counit_pointed]] at 0. It is the zero-preservation part of the additive monoid and rg morphism structures of ε.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_one_pointed","base":"of_course_counit_one_pointed","kind":"inst","start":234,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves one","status":"ok"},"long":{"text":"The counit ε : !X ⇾ X sends 1 to 1. The one of !X is the one of X, so this is [[AffineConstructive.theory.of_course_set.of_course_counit_pointed]] at 1. It is the unit-preservation part of the multiplicative monoid and rig morphism structures of ε.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_sg_mor","base":"of_course_counit_sg_mor","kind":"inst","start":235,"body":[236,239],"status":"ok","short":{"text":"The counit ε : !X ⇾ X is a semigroup morphism when X is a semigroup","status":"ok"},"proof":[{"text":"A semigroup morphism consists of semigroup structures on its domain and codomain, which are already available ([[AffineConstructive.theory.of_course_set.of_course_set_semigroup]] provides the one on !X), and the law that it preserves the operation. Only that law is left to prove.","status":"ok","from":0,"to":1},{"text":"Fix x and y in !X. The operation on !X is the operation on X, and ε is the identity on elements, so the two sides of the equation are the same element of X. Reflexivity closes the goal.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_mon_mor","base":"of_course_counit_mon_mor","kind":"inst","start":240,"body":[241,243],"status":"ok","short":{"text":"The counit ε : !X ⇾ X is a monoid morphism when X is a monoid","status":"ok"},"proof":[{"text":"A monoid morphism is a semigroup morphism that preserves the unit. Here the first is [[AffineConstructive.theory.of_course_set.of_course_counit_sg_mor]] and the second is [[AffineConstructive.theory.of_course_set.of_course_counit_unit_pointed]], with !X a monoid by [[AffineConstructive.theory.of_course_set.of_course_set_monoid]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_add_sg_mor","base":"of_course_counit_add_sg_mor","kind":"inst","start":244,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves addition","status":"ok"},"long":{"text":"When X is a (not necessarily commutative) additive semigroup, the counit ε : !X ⇾ X is an additive semigroup morphism: ε(x + y) = ε x + ε y. It is [[AffineConstructive.theory.of_course_set.of_course_counit_sg_mor]] with + as the semigroup operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_add_mon_mor","base":"of_course_counit_add_mon_mor","kind":"inst","start":245,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves addition and zero","status":"ok"},"long":{"text":"When X is a (not necessarily commutative) additive monoid, the counit ε : !X ⇾ X is an additive monoid morphism. It is [[AffineConstructive.theory.of_course_set.of_course_counit_mon_mor]] with + and 0 as the monoid structure. It supplies the additive half of [[AffineConstructive.theory.of_course_set.of_course_counit_rg_mor]] and [[AffineConstructive.theory.of_course_set.of_course_counit_rig_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_mul_sg_mor","base":"of_course_counit_mul_sg_mor","kind":"inst","start":246,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves multiplication","status":"ok"},"long":{"text":"When X is a multiplicative semigroup, the counit ε : !X ⇾ X is a multiplicative semigroup morphism: ε(x · y) = ε x · ε y. It is [[AffineConstructive.theory.of_course_set.of_course_counit_sg_mor]] with · as the semigroup operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_mul_mon_mor","base":"of_course_counit_mul_mon_mor","kind":"inst","start":247,"body":null,"status":"ok","short":{"text":"The counit ε : !X ⇾ X preserves multiplication and one","status":"ok"},"long":{"text":"When X is a multiplicative monoid, the counit ε : !X ⇾ X is a multiplicative monoid morphism. It is [[AffineConstructive.theory.of_course_set.of_course_counit_mon_mor]] with · and 1 as the monoid structure. It supplies the multiplicative half of [[AffineConstructive.theory.of_course_set.of_course_counit_rig_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_rg_mor","base":"of_course_counit_rg_mor","kind":"inst","start":248,"body":[249,251],"status":"ok","short":{"text":"The counit ε : !X ⇾ X is an rg morphism: it preserves addition, zero and multiplication","status":"ok"},"proof":[{"text":"An rg morphism preserves addition and zero, and it preserves multiplication. The first is [[AffineConstructive.theory.of_course_set.of_course_counit_add_mon_mor]] and the second is [[AffineConstructive.theory.of_course_set.of_course_counit_mul_sg_mor]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.of_course_set.of_course_counit_rig_mor","base":"of_course_counit_rig_mor","kind":"inst","start":252,"body":[253,255],"status":"ok","short":{"text":"The counit ε : !X ⇾ X is a rig morphism: it preserves addition, zero, multiplication and one","status":"ok"},"proof":[{"text":"A rig morphism is a morphism of the additive monoids that is also a morphism of the multiplicative monoids, so the goal splits into these two parts. Each was proved earlier: the counit preserves addition and zero ([[AffineConstructive.theory.of_course_set.of_course_counit_add_mon_mor]]), and it preserves multiplication and one ([[AffineConstructive.theory.of_course_set.of_course_counit_mul_mon_mor]]).","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.common_props":{"page":"../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."}},"constants":null}</script>

d":"def","local":false,"page":"../tactics/quote/base.html"},{"s":6924,"e":6940,"lib":"AffineConstructive.theory.pointed","name":"quote_bottom_alt","kind":"thm","local":true},{"s":6977,"e":6982,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":7028,"e":7042,"lib":"AffineConstructive.theory.pointed","name":"quote_zero_alt","kind":"thm","local":true},{"s":7078,"e":7083,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":7129,"e":7143,"lib":"AffineConstructive.theory.pointed","name":"quote_zero_alt","kind":"thm","local":true},{"s":7180,"e":7185,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":7231,"e":7244,"lib":"AffineConstructive.theory.pointed","name":"quote_one_alt","kind":"thm","local":true},{"s":7280,"e":7285,"lib":"AffineConstructive.tactics.quote.base","name":"quote","kind":"def","local":false,"page":"../tactics/quote/base.html"},{"s":7331,"e":7344,"lib":"AffineConstructive.theory.pointed","name":"quote_one_alt","kind":"thm","local":true},{"s":242,"e":245,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1740,"e":1743,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":3886,"e":3889,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":3890,"e":3893,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file proves that pointed morphisms are closed under the three basic operations on functions. The identity map preserves any point. A composite of pointed morphisms is pointed. The designated inverse of a bijective pointed morphism is pointed. Each result is proved once for [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] and then restated for the five named constants: the monoid unit, zero, one, top and bottom. Hints register all of them, so instance resolution can discharge preservation goals for identities, composites and inverses. The last part of the file connects these classes to the quoting machinery of [[AffineConstructive.tactics.quote.base.quote]]. There a pointed morphism f lets the quoting procedure read f applied to a distinguished constant as the corresponding constant of the codomain.","short":"Identities, composites and inverses of point-preserving maps; quoting distinguished constants","items":[{"name":"AffineConstructive.theory.pointed.id_pointed","base":"id_pointed","kind":"prf","start":5,"body":[6,8],"status":"ok","short":{"text":"The identity of a set is a pointed morphism from (X, x) to itself, for any point x","status":"ok"},"proof":[{"text":"Unfolded, the claim is id x = x, which is x = x, and reflexivity of equality on X proves it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointed.id_unit_pointed","base":"id_unit_pointed","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"The identity of a set with a monoid unit preserves the unit","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.id_pointed]] for the monoid unit. A [[AffineConstructive.interfaces.abstract_algebra.MonUnit_Pointed_Morphism]] is a [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at the units of domain and codomain, so the general fact about the identity applies directly. The definition gives that fact a name at this class, and a hint offers it to instance resolution, so a goal asking for the identity to preserve the unit is discharged automatically.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.id_top_pointed","base":"id_top_pointed","kind":"def","start":11,"body":null,"status":"ok","short":{"text":"The identity of a set with a top element preserves top","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.id_pointed]] for a top element. A [[AffineConstructive.interfaces.abstract_algebra.Top_Pointed_Morphism]] is a [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at ⊤ in domain and codomain. Because the definition is registered as a hint, resolution finds it whenever the identity has to preserve ⊤.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.id_bottom_pointed","base":"id_bottom_pointed","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"The identity of a set with a bottom element preserves bottom","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.id_pointed]] for a bottom element. A [[AffineConstructive.interfaces.abstract_algebra.Bottom_Pointed_Morphism]] is a [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at ⊥ in domain and codomain. Because the definition is registered as a hint, resolution finds it whenever the identity has to preserve ⊥.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.id_zero_pointed","base":"id_zero_pointed","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The identity of a set with a zero preserves zero","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.id_pointed]] for a zero element. A [[AffineConstructive.interfaces.abstract_algebra.Zero_Pointed_Morphism]] is a [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at 0 in domain and codomain. Because the definition is registered as a hint, resolution finds it whenever the identity has to preserve 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.id_one_pointed","base":"id_one_pointed","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"The identity of a set with a one preserves one","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.id_pointed]] for a unit element 1. A [[AffineConstructive.interfaces.abstract_algebra.One_Pointed_Morphism]] is a [[AffineConstructive.interfaces.abstract_algebra.Pointed_Morphism]] at 1 in domain and codomain. Because the definition is registered as a hint, resolution finds it whenever the identity has to preserve 1.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.compose_pointed","base":"compose_pointed","kind":"prf","start":20,"body":[21,26],"status":"ok","short":{"text":"If f takes x to y and g takes y to z, then g ∘ f takes x to z","status":"ok"},"proof":[{"text":"Assume f takes x to y and g takes y to z. Unfolded, the goal asks for g (f x) = z.","status":"ok","from":0,"to":2},{"text":"Since g preserves equality, the equation f x = y given by [[AffineConstructive.interfaces.abstract_algebra.preserves_point]] for f turns the goal into g y = z. That is the point-preservation of g.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.theory.pointed.compose_unit_pointed","base":"compose_unit_pointed","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"A composite of unit-preserving maps preserves the unit","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.compose_pointed]] for the monoid unit. If f(e) = e and g(e) = e, the general lemma about composites gives g(f(e)) = e. A hint makes the result available to resolution, so the unit-preservation of a composite reduces to the unit-preservation of its factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.compose_top_pointed","base":"compose_top_pointed","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"A composite of top-preserving maps preserves top","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.compose_pointed]] for top elements. If f and g each send ⊤ to ⊤, so does g ∘ f. A hint registers the definition with resolution, so the goal for a composite reduces to the goals for its factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.compose_bottom_pointed","base":"compose_bottom_pointed","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"A composite of bottom-preserving maps preserves bottom","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.compose_pointed]] for bottom elements. If f and g each send ⊥ to ⊥, so does g ∘ f. A hint registers the definition with resolution, so the goal for a composite reduces to the goals for its factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.compose_zero_pointed","base":"compose_zero_pointed","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"A composite of zero-preserving maps preserves zero","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.compose_pointed]] for zero elements. If f and g each send 0 to 0, so does g ∘ f. A hint registers the definition with resolution, so the goal for a composite reduces to the goals for its factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.compose_one_pointed","base":"compose_one_pointed","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"A composite of one-preserving maps preserves one","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.compose_pointed]] for unit elements 1. If f and g each send 1 to 1, so does g ∘ f. A hint registers the definition with resolution, so the goal for a composite reduces to the goals for its factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.invert_pointed","base":"invert_pointed","kind":"prf","start":43,"body":[44,47],"status":"ok","short":{"text":"The inverse of a bijective pointed morphism from (X, x) to (Y, y) is pointed from (Y, y) to (X, x)","status":"ok"},"proof":[{"text":"Unfolded, the goal asks for f⁻¹ y = x.","status":"ok","from":0,"to":1},{"text":"Because f is injective, [[AffineConstructive.theory.set.injective_iff]] lets the goal be proved after applying f to both sides, as f (f⁻¹ y) = f x. Because f is surjective, [[AffineConstructive.theory.set.surjective_applied]] reduces the left side to y. What remains, y = f x, is the symmetric form of f x = y, which holds because f is pointed.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.pointed.invert_unit_pointed","base":"invert_unit_pointed","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"The inverse of a bijective unit-preserving map preserves the unit","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.invert_pointed]] for the monoid unit. Let f be a bijection with a designated inverse f⁻¹ and with f(e) = e. Then f⁻¹(e) = e. With the hint, resolution can derive unit-preservation of an inverse from that of the map itself.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.invert_top_pointed","base":"invert_top_pointed","kind":"def","start":53,"body":null,"status":"ok","short":{"text":"The inverse of a bijective top-preserving map preserves top","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.invert_pointed]] for top elements. If a bijection f sends ⊤ to ⊤, then its designated inverse also sends ⊤ to ⊤. The definition is registered as a hint for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.invert_bottom_pointed","base":"invert_bottom_pointed","kind":"def","start":54,"body":null,"status":"ok","short":{"text":"The inverse of a bijective bottom-preserving map preserves bottom","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.invert_pointed]] for bottom elements. If a bijection f sends ⊥ to ⊥, then its designated inverse also sends ⊥ to ⊥. The definition is registered as a hint for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.invert_zero_pointed","base":"invert_zero_pointed","kind":"def","start":55,"body":null,"status":"ok","short":{"text":"The inverse of a bijective zero-preserving map preserves zero","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.invert_pointed]] for zero elements. If a bijection f sends 0 to 0, then its designated inverse also sends 0 to 0. The definition is registered as a hint for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.invert_one_pointed","base":"invert_one_pointed","kind":"def","start":56,"body":null,"status":"ok","short":{"text":"The inverse of a bijective one-preserving map preserves one","status":"ok"},"long":{"text":"This is the instance of [[AffineConstructive.theory.pointed.invert_pointed]] for unit elements 1. If a bijection f sends 1 to 1, then its designated inverse also sends 1 to 1. The definition is registered as a hint for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointed.quote_mon_unit_alt","base":"quote_mon_unit_alt","kind":"prf","start":63,"body":[64,66],"status":"ok","short":{"text":"Under a unit-preserving f, the unit of Y quotes the unit of X: f e = e","status":"ok"},"proof":[{"text":"Quoting the unit of X as the unit of Y requires exactly f e = e, which is the unit-preservation of f, [[AffineConstructive.interfaces.abstract_algebra.preserves_unit]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointed.quote_top_alt","base":"quote_top_alt","kind":"prf","start":67,"body":[68,70],"status":"ok","short":{"text":"Under a top-preserving f, top quotes top: f ⊤ = ⊤","status":"ok"},"proof":[{"text":"Quoting ⊤ as ⊤ requires exactly f ⊤ = ⊤, which is the top-preservation of f, [[AffineConstructive.interfaces.abstract_algebra.preserves_top]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointed.quote_bottom_alt","base":"quote_bottom_alt","kind":"prf","start":71,"body":[72,74],"status":"ok","short":{"text":"Under a bottom-preserving f, bottom quotes bottom: f ⊥ = ⊥","status":"ok"},"proof":[{"text":"Quoting ⊥ as ⊥ requires exactly f ⊥ = ⊥, which is the bottom-preservation of f, [[AffineConstructive.interfaces.abstract_algebra.preserves_bottom]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointed.quote_zero_alt","base":"quote_zero_alt","kind":"prf","start":75,"body":[76,78],"status":"ok","short":{"text":"Under a zero-preserving f, zero quotes zero: f 0 = 0","status":"ok"},"proof":[{"text":"Quoting 0 as 0 requires exactly f 0 = 0, which is the zero-preservation of f, [[AffineConstructive.interfaces.abstract_algebra.preserves_0]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointed.quote_one_alt","base":"quote_one_alt","kind":"prf","start":79,"body":[80,82],"status":"ok","short":{"text":"Under a one-preserving f, one quotes one: f 1 = 1","status":"ok"},"proof":[{"text":"Quoting 1 as 1 requires exactly f 1 = 1, which is the one-preservation of f, [[AffineConstructive.interfaces.abstract_algebra.preserves_1]].","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.theory.common_props":{"page":"common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.tactics.quote.base":{"page":"../tactics/quote/base.html","short":"Quoting along a function: tracking f x = y by proof search, and its tactics","summary":"The file sets up the base of a quoting framework for a function f : X ⇾ Y. The predicate [[quote]] f x y says f x = y, and a `quote` hint database builds such facts by proof search, with [[quote_refl]] as the fallback. The lemmas [[quote_equation]] and [[quote_ne]] carry an equation in X forward to its image and an apartness in Y back to its preimage. For injective f, [[quote_injective]] and [[quote_injective_ne]] make each of these an equivalence. The tactics [[ltac:quote_wrap]], [[quote_source]] and [[quote_target]] run this search to compute one side of a quoted statement from the other, and [[ltac:quote_injective]] and [[ltac:quote_ne]] reduce a goal about f-images to the corresponding goal in the source. The quote files built on this one supply the hints for particular structure-preserving maps."}},"constants":null}</script>

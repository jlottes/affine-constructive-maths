.pointwise","name":"doit","kind":"ltac","local":true},{"s":1990,"e":1994,"lib":"AffineConstructive.theory.pointwise","name":"doit","kind":"ltac","local":true},{"s":2176,"e":2180,"lib":"AffineConstructive.theory.pointwise","name":"doit","kind":"ltac","local":true},{"s":2362,"e":2366,"lib":"AffineConstructive.theory.pointwise","name":"doit","kind":"ltac","local":true},{"s":2574,"e":2578,"lib":"AffineConstructive.theory.pointwise","name":"doit","kind":"ltac","local":true},{"s":2783,"e":2787,"lib":"AffineConstructive.theory.pointwise","name":"doit","kind":"ltac","local":true},{"s":5996,"e":6001,"lib":"AffineConstructive.theory.pointwise","name":"doit2","kind":"ltac","local":true},{"s":6237,"e":6242,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":6419,"e":6424,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":6601,"e":6606,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":6783,"e":6788,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":6965,"e":6970,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":7147,"e":7152,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":7329,"e":7334,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":7511,"e":7516,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":8501,"e":8506,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true},{"s":8695,"e":8700,"lib":"AffineConstructive.theory.pointwise","name":"doit3","kind":"ltac","local":true}],"gloss":{"summary":"The file shows that the algebraic laws and structures of a set X carry over to the function set D ⇾ X under the pointwise operations, with constant functions as distinguished elements. The first part lifts single laws: associativity, commutativity, idempotence, absorption, distributivity, identities, absorbing elements and inverses on X give the same laws for [[AffineConstructive.interfaces.pointwise.pointwise_op]], [[AffineConstructive.interfaces.pointwise.pointwise_func]] and [[AffineConstructive.theory.set.const]] on D ⇾ X. Each holds because equality of functions is checked point by point, and at each point the law is the law on X. Global hints make these lemmas available to resolution throughout the development. The second part builds on them to lift semigroups, monoids, groups and abelian groups, semilattices and bounded semilattices, lattices and distributive lattices to D ⇾ X, together with their additive, multiplicative, meet and join forms. These are local instances, used under the operations that local hints supply for the file. The interface file `interfaces/pointwise.v` provides the pointwise lifts and the condition [[AffineConstructive.interfaces.pointwise.PointwiseOp]] that they preserve equality.","short":"Algebraic laws and structures lifted from X to functions D ⇾ X pointwise","items":[{"name":"AffineConstructive.theory.pointwise.doit","base":"doit","kind":"ltac","start":3,"body":null,"status":"ok","short":{"text":"Proves a pointwise algebraic law on D ⇾ X by applying the same law on X at each point","status":"ok"},"long":{"text":"The tactic proves a goal of the form \"law on X implies the same law for the pointwise operations on D ⇾ X\", the shape of every lemma in the first section of the file. It introduces the law on X as a hypothesis and unfolds the goal's class to the universal statement it abbreviates. Since each of these classes is the affirmation of an affine law, the statement can then be introduced in the base logic: the functions it quantifies over, and then the point d of D at which the equality of functions is checked. What remains is the law on X at the values of those functions at d, which the hypothesis gives directly.\n\nAll twelve property lemmas, from [[AffineConstructive.theory.pointwise.pointwise_associative]] to [[AffineConstructive.theory.pointwise.pointwise_right_inverse]], are proved by this one tactic: the pointwise operations compute to the operation on X at each point, so no rewriting is needed. A plain tactic script would have to repeat the same introductions for each class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointwise.pointwise_associative","base":"pointwise_associative","kind":"prf","start":7,"body":[8,10],"status":"ok","short":{"text":"If f is associative on X, its pointwise lift to D ⇾ X is associative","status":"ok"},"proof":[{"text":"Equality in D ⇾ X is equality at every point, so the statement is a statement about values. Fix three functions and a point d of D. Under [[AffineConstructive.interfaces.pointwise.pointwise_op]], both bracketings evaluate at d to the corresponding bracketings of f on the three values at d, and associativity of f at those values makes them equal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_commutative","base":"pointwise_commutative","kind":"prf","start":11,"body":[12,14],"status":"ok","short":{"text":"If f is commutative, its pointwise lift over D is commutative","status":"ok"},"proof":[{"text":"Fix two functions and a point d of D. Both orders of the lifted operation evaluate at d to f applied to the two values at d, taken in the two orders, and commutativity of f at those values makes them equal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_binary_idempotent","base":"pointwise_binary_idempotent","kind":"prf","start":15,"body":[16,18],"status":"ok","short":{"text":"If f(x, x) = x for all x, the pointwise lift of f is idempotent too","status":"ok"},"proof":[{"text":"Fix a function and a point d of D. At d, the lifted operation applied to the function and itself is f applied to its value at d twice. Idempotence of f at that value makes this equal to the value itself.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_absorption","base":"pointwise_absorption","kind":"prf","start":19,"body":[20,22],"status":"ok","short":{"text":"If f absorbs g, the pointwise lift of f absorbs the pointwise lift of g","status":"ok"},"proof":[{"text":"Fix the two functions and a point d of D. At d, the lifted expression is f applied to the first value and to g of the two values, all taken at d. The absorption law for f and g at those values reduces this to the first value.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_left_distribute","base":"pointwise_left_distribute","kind":"prf","start":23,"body":[24,26],"status":"ok","short":{"text":"If f distributes over g on the left, so do their pointwise lifts","status":"ok"},"proof":[{"text":"Fix three functions and a point d of D. At d, the two sides of the lifted distributive law become the two sides of the law for f and g at the values at d, and left distributivity of f over g makes them equal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_right_distribute","base":"pointwise_right_distribute","kind":"prf","start":27,"body":[28,30],"status":"ok","short":{"text":"If f distributes over g on the right, so do their pointwise lifts","status":"ok"},"proof":[{"text":"Fix three functions and a point d of D. At d, the two sides of the lifted distributive law become the two sides of the law for f and g at the values at d, and right distributivity of f over g makes them equal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_left_identity","base":"pointwise_left_identity","kind":"prf","start":31,"body":[32,34],"status":"ok","short":{"text":"If x is a left identity for f, the constant function x is one for its pointwise lift","status":"ok"},"proof":[{"text":"Fix a function and a point d of D. At d, the constant function [[AffineConstructive.theory.set.const]] x has the value x, so the lifted product at d is f of x and the function's value at d. Because x is a left identity for f, this equals the function's value at d.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_right_identity","base":"pointwise_right_identity","kind":"prf","start":35,"body":[36,38],"status":"ok","short":{"text":"If y is a right identity for f, the constant function y is one for its pointwise lift","status":"ok"},"proof":[{"text":"Fix a function and a point d of D. At d, the constant function [[AffineConstructive.theory.set.const]] y has the value y, so the lifted product at d is f of the function's value at d and y. Because y is a right identity for f, this equals the function's value at d.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_left_absorb","base":"pointwise_left_absorb","kind":"prf","start":39,"body":[40,42],"status":"ok","short":{"text":"If x is left absorbing for f, the constant function x is left absorbing for its pointwise lift","status":"ok"},"proof":[{"text":"Fix a function and a point d of D. At d, the lifted product of [[AffineConstructive.theory.set.const]] x and the function is f of x and the function's value at d. Because x is left absorbing for f, this equals x, which is the value of the constant function at d.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_right_absorb","base":"pointwise_right_absorb","kind":"prf","start":43,"body":[44,46],"status":"ok","short":{"text":"If y is right absorbing for f, the constant function y is right absorbing for its pointwise lift","status":"ok"},"proof":[{"text":"Fix a function and a point d of D. At d, the lifted product of the function and [[AffineConstructive.theory.set.const]] y is f of the function's value at d and y. Because y is right absorbing for f, this equals y, which is the value of the constant function at d.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_left_inverse","base":"pointwise_left_inverse","kind":"prf","start":47,"body":[48,50],"status":"ok","short":{"text":"Left inverses for f with unit x lift pointwise, with the constant function x as unit","status":"ok"},"proof":[{"text":"Fix a function h : D ⇾ Y and a point d of D. At d, the pointwise lift of f applied to g ∘ h and h is f applied to g(h d) and h d. The left-inverse law for f at h d makes this equal to x, and x is the value of the constant function [[AffineConstructive.theory.set.const]] x at d.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_right_inverse","base":"pointwise_right_inverse","kind":"prf","start":51,"body":[52,54],"status":"ok","short":{"text":"Right inverses for f with unit x lift pointwise, with the constant function x as unit","status":"ok"},"proof":[{"text":"Fix a function h : D ⇾ X and a point d of D. At d, the pointwise lift of f applied to h and g ∘ h is f applied to h d and g(h d). The right-inverse law for f at h d makes this equal to x, the value of [[AffineConstructive.theory.set.const]] x at d.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.doit2","base":"doit2","kind":"ltac","start":80,"body":null,"status":"ok","short":{"text":"Closes a field of a pointwise algebraic structure by resolution, after restating its operations as pointwise lifts","status":"ok"},"long":{"text":"The tactic discharges one field of an algebraic structure on D ⇾ X, such as associativity of ∙ or the identity law for the unit. It first tries resolution outright. If that fails, it restates the goal: the operation, inversion and distinguished element of the structure on D ⇾ X were supplied by the file's local hints as [[AffineConstructive.interfaces.pointwise.pointwise_op]], [[AffineConstructive.interfaces.pointwise.pointwise_func]] and [[AffineConstructive.theory.set.const]], but they appear in the goal wrapped in the projection of the corresponding operation structure (∙, ⁻¹, the unit, and so on). The tactic unfolds this projection, so the goal mentions the pointwise lift directly, and then tries resolution again.\n\nAfter the restatement the goal has the shape the global hints of the file recognise, and resolution finds the matching property lemma, [[AffineConstructive.theory.pointwise.pointwise_associative]] or another, together with the law on X that it needs. Without the restatement the hints would not match.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointwise.doit3","base":"doit3","kind":"ltac","start":81,"body":null,"status":"ok","short":{"text":"Proves that a structure on X lifts to D ⇾ X, field by field","status":"ok"},"long":{"text":"The tactic proves the instances of the second section of the file, which say that an algebraic structure on X (a semigroup, a monoid, a group, a lattice, …) gives the same structure on D ⇾ X. It introduces the structure on X as a hypothesis. It then breaks the goal into its fields when the structure is a record of several (a monoid is a semigroup together with the two identity laws), or unfolds it when it is a single law, and hands each resulting goal to [[AffineConstructive.theory.pointwise.doit2]]. That tactic finds the pointwise property lemma for the field, and resolution draws the law on X from the introduced hypothesis.\n\nThe instances that merely rename a structure, the additive and multiplicative monoids and groups and the meet and join semilattices, are not proved with this tactic. Each of them is the general instance applied to the named operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.pointwise.pointwise_semigroup","base":"pointwise_semigroup","kind":"inst","start":85,"body":[86,88],"status":"ok","short":{"text":"A semigroup X makes D ⇾ X a semigroup under the pointwise operation","status":"ok"},"proof":[{"text":"A semigroup is an associative operation. The pointwise operation is a function on D ⇾ X because of the [[AffineConstructive.interfaces.pointwise.PointwiseOp]] hypothesis, and it is associative by [[AffineConstructive.theory.pointwise.pointwise_associative]], applied to the associativity of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_com_semigroup","base":"pointwise_com_semigroup","kind":"inst","start":89,"body":[90,92],"status":"ok","short":{"text":"A commutative semigroup X makes D ⇾ X a commutative semigroup, pointwise","status":"ok"},"proof":[{"text":"D ⇾ X is a semigroup by [[AffineConstructive.theory.pointwise.pointwise_semigroup]], and the pointwise operation is commutative by [[AffineConstructive.theory.pointwise.pointwise_commutative]], applied to the commutativity of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_semilattice","base":"pointwise_semilattice","kind":"inst","start":93,"body":[94,96],"status":"ok","short":{"text":"A semilattice X makes D ⇾ X a semilattice under the pointwise operation","status":"ok"},"proof":[{"text":"A semilattice is a commutative semigroup whose operation is idempotent. D ⇾ X is a commutative semigroup by [[AffineConstructive.theory.pointwise.pointwise_com_semigroup]], and idempotence carries over from X by [[AffineConstructive.theory.pointwise.pointwise_binary_idempotent]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_monoid","base":"pointwise_monoid","kind":"inst","start":97,"body":[98,100],"status":"ok","short":{"text":"A monoid X makes D ⇾ X a monoid, pointwise, with the constant unit as identity","status":"ok"},"proof":[{"text":"D ⇾ X is a semigroup by [[AffineConstructive.theory.pointwise.pointwise_semigroup]]. The constant function at the unit of X is a left identity by [[AffineConstructive.theory.pointwise.pointwise_left_identity]] and a right identity by [[AffineConstructive.theory.pointwise.pointwise_right_identity]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_com_monoid","base":"pointwise_com_monoid","kind":"inst","start":101,"body":[102,104],"status":"ok","short":{"text":"A commutative monoid X makes D ⇾ X a commutative monoid, pointwise","status":"ok"},"proof":[{"text":"D ⇾ X is a monoid by [[AffineConstructive.theory.pointwise.pointwise_monoid]], and the pointwise operation is commutative by [[AffineConstructive.theory.pointwise.pointwise_commutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_bounded_sl","base":"pointwise_bounded_sl","kind":"inst","start":105,"body":[106,108],"status":"ok","short":{"text":"A bounded semilattice X makes D ⇾ X a bounded semilattice, with the constant unit","status":"ok"},"proof":[{"text":"A bounded semilattice is a commutative monoid that is also a semilattice. D ⇾ X is a commutative monoid by [[AffineConstructive.theory.pointwise.pointwise_com_monoid]] and a semilattice by [[AffineConstructive.theory.pointwise.pointwise_semilattice]]; the constant function at the unit is the bound.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_group","base":"pointwise_group","kind":"inst","start":109,"body":[110,112],"status":"ok","short":{"text":"A group X makes D ⇾ X a group under pointwise operation and inversion","status":"ok"},"proof":[{"text":"D ⇾ X is a monoid by [[AffineConstructive.theory.pointwise.pointwise_monoid]]. Pointwise inversion, with the constant unit, satisfies the left-inverse law by [[AffineConstructive.theory.pointwise.pointwise_left_inverse]] and the right-inverse law by [[AffineConstructive.theory.pointwise.pointwise_right_inverse]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_abgroup","base":"pointwise_abgroup","kind":"inst","start":113,"body":[114,116],"status":"ok","short":{"text":"An abelian group X makes D ⇾ X an abelian group, pointwise","status":"ok"},"proof":[{"text":"D ⇾ X is a group by [[AffineConstructive.theory.pointwise.pointwise_group]], and the pointwise operation is commutative by [[AffineConstructive.theory.pointwise.pointwise_commutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_meet_sl","base":"pointwise_meet_sl","kind":"inst","start":117,"body":[118,120],"status":"ok","short":{"text":"A meet semilattice X makes D ⇾ X a meet semilattice under pointwise ⊓","status":"ok"},"proof":[{"text":"A meet semilattice is a semilattice under ⊓. This is the general case [[AffineConstructive.theory.pointwise.pointwise_semilattice]] applied to the meet.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_bounded_meet_sl","base":"pointwise_bounded_meet_sl","kind":"inst","start":121,"body":[122,124],"status":"ok","short":{"text":"A bounded meet semilattice X makes D ⇾ X one, with the constant function ⊤ as top","status":"ok"},"proof":[{"text":"A bounded meet semilattice is a bounded semilattice under ⊓ with unit ⊤. The general case [[AffineConstructive.theory.pointwise.pointwise_bounded_sl]] applies, and the constant function ⊤ is the top.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_join_sl","base":"pointwise_join_sl","kind":"inst","start":125,"body":[126,128],"status":"ok","short":{"text":"A join semilattice X makes D ⇾ X a join semilattice under pointwise ⊔","status":"ok"},"proof":[{"text":"A join semilattice is a semilattice under ⊔. This is the general case [[AffineConstructive.theory.pointwise.pointwise_semilattice]] applied to the join.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_bounded_join_sl","base":"pointwise_bounded_join_sl","kind":"inst","start":129,"body":[130,132],"status":"ok","short":{"text":"A bounded join semilattice X makes D ⇾ X one, with the constant function ⊥ as bottom","status":"ok"},"proof":[{"text":"A bounded join semilattice is a bounded semilattice under ⊔ with unit ⊥. The general case [[AffineConstructive.theory.pointwise.pointwise_bounded_sl]] applies, and the constant function ⊥ is the bottom.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_lattice","base":"pointwise_lattice","kind":"inst","start":133,"body":[134,136],"status":"ok","short":{"text":"A lattice X makes D ⇾ X a lattice under pointwise ⊓ and ⊔","status":"ok"},"proof":[{"text":"A lattice is a meet semilattice and a join semilattice whose operations absorb each other. The two semilattice structures on D ⇾ X come from [[AffineConstructive.theory.pointwise.pointwise_meet_sl]] and [[AffineConstructive.theory.pointwise.pointwise_join_sl]], and the absorption laws transfer from X by [[AffineConstructive.theory.pointwise.pointwise_absorption]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_distr_lattice","base":"pointwise_distr_lattice","kind":"inst","start":137,"body":[138,140],"status":"ok","short":{"text":"A distributive lattice X makes D ⇾ X a distributive lattice, pointwise","status":"ok"},"proof":[{"text":"The lattice structure on D ⇾ X comes from [[AffineConstructive.theory.pointwise.pointwise_lattice]]. The distributive law holds pointwise because it holds in X, by [[AffineConstructive.theory.pointwise.pointwise_left_distribute]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_add_nc_mon","base":"pointwise_add_nc_mon","kind":"inst","start":141,"body":[142,144],"status":"ok","short":{"text":"An additive monoid X, not necessarily commutative, makes D ⇾ X one under pointwise + and constant 0","status":"ok"},"proof":[{"text":"An additive monoid is a monoid under + with identity 0, so the general case [[AffineConstructive.theory.pointwise.pointwise_monoid]] applies. The constant function 0 is the identity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_add_mon","base":"pointwise_add_mon","kind":"inst","start":145,"body":[146,148],"status":"ok","short":{"text":"A commutative additive monoid X makes D ⇾ X one under pointwise + and constant 0","status":"ok"},"proof":[{"text":"A commutative additive monoid is a commutative monoid under + with identity 0, so the general case [[AffineConstructive.theory.pointwise.pointwise_com_monoid]] applies.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_add_nc_grp","base":"pointwise_add_nc_grp","kind":"inst","start":149,"body":[150,152],"status":"ok","short":{"text":"An additive group X, not necessarily commutative, makes D ⇾ X one under pointwise + and −","status":"ok"},"proof":[{"text":"An additive group is a group under + with identity 0 and inverse −, so the general case [[AffineConstructive.theory.pointwise.pointwise_group]] applies.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_add_grp","base":"pointwise_add_grp","kind":"inst","start":153,"body":[154,156],"status":"ok","short":{"text":"An abelian additive group X makes D ⇾ X one under pointwise +, − and constant 0","status":"ok"},"proof":[{"text":"An abelian additive group is an abelian group under +, 0 and −, so the general case [[AffineConstructive.theory.pointwise.pointwise_abgroup]] applies.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_mult_sg","base":"pointwise_mult_sg","kind":"inst","start":157,"body":[158,160],"status":"ok","short":{"text":"A multiplicative semigroup X makes D ⇾ X one under pointwise ·","status":"ok"},"proof":[{"text":"A multiplicative semigroup is a semigroup whose operation is written ·, so this is the general case [[AffineConstructive.theory.pointwise.pointwise_semigroup]] at the operation mult.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_mult_mon","base":"pointwise_mult_mon","kind":"inst","start":161,"body":[162,164],"status":"ok","short":{"text":"A multiplicative monoid X makes D ⇾ X one under pointwise · with constant 1","status":"ok"},"proof":[{"text":"A multiplicative monoid is a monoid with operation · and unit 1, so this is the general case [[AffineConstructive.theory.pointwise.pointwise_monoid]]: D ⇾ X is a monoid under pointwise ·, and its identity is the constant function at 1.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.pointwise.pointwise_mult_com_mon","base":"pointwise_mult_com_mon","kind":"inst","start":165,"body":[166,168],"status":"ok","short":{"text":"A commutative multiplicative monoid X makes D ⇾ X one under pointwise · with constant 1","status":"ok"},"proof":[{"text":"A commutative multiplicative monoid is a commutative monoid with operation · and unit 1, so this is the general case [[AffineConstructive.theory.pointwise.pointwise_com_monoid]] at mult and 1.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.pointwise":{"page":"../interfaces/pointwise.html","short":"Pointwise lifting of operations to function sets, for strong operations or affirmative domains","summary":"The file lifts operations on affine sets to the functions into them. A unary function f : X ⇾ Y lifts by post-composition ([[pointwise_func]]) with no further hypothesis. A binary operation f : X ⊗ Y ⇾ Z does not lift in general, because the point d at which g and h are evaluated is needed by both arguments of f while the equality d = d' may be used only once; the class [[PointwiseOp]] records that the lift exists, and [[pointwise_op]] then gives the function (g, h) ↦ (d ↦ f(g d, h d)). Two sufficient conditions are proved: f is strong, so that it preserves the cartesian equality and the two argument equalities can be proved additively ([[StrongOp_PointWiseOp]]), or D has affirmative equality, so that d = d' may be duplicated ([[AffEq_PointWiseOp]]). Both are registered for resolution, with the strong case tried first."},"AffineConstructive.interfaces.common_props":{"page":"../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."}},"constants":null}</script>

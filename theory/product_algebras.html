short":{"text":"The first projection X ⊗ Y ⇾ X preserves addition and zero","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.tensor_proj1_mon_mor]]: for monoids X and Y under + and 0, the first projection out of X ⊗ Y is a monoid morphism for the coordinatewise addition and the zero (0, 0).","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_add_mon_mor","base":"tensor_proj2_add_mon_mor","kind":"inst","start":546,"body":null,"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y preserves addition and zero","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.tensor_proj2_mon_mor]]: for monoids X and Y under + and 0, the second projection out of X ⊗ Y is a monoid morphism for the coordinatewise addition and the zero (0, 0).","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.mon_inl","base":"mon_inl","kind":"def","start":571,"body":null,"status":"ok","short":{"text":"The left injection X ⇾ X ⊗ Y, x ↦ (x, e), with e the unit of Y","status":"ok"},"long":{"text":"The left injection of a monoid into a product: x goes to the pair whose second coordinate is the unit of Y. Its target is the tensor product X ⊗ Y, the product whose equality is the multiplicative one (equality in each coordinate, combined by ⊠). The map lands in the tensor product, and through [[AffineConstructive.theory.set.tensor_to_prod]] in the cartesian product as well.\n\nThe definition needs only a unit on Y. That the map preserves the operation and the unit is proved separately, in [[AffineConstructive.theory.product_algebras.mon_inl_sg_mor]] and [[AffineConstructive.theory.product_algebras.mon_inl_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.mon_inr","base":"mon_inr","kind":"def","start":572,"body":null,"status":"ok","short":{"text":"The right injection Y ⇾ X ⊗ Y, y ↦ (e, y), with e the unit of X","status":"ok"},"long":{"text":"The right injection of a monoid into a product: y goes to the pair whose first coordinate is the unit of X. It is the mirror image of [[AffineConstructive.theory.product_algebras.mon_inl]] and lands in the tensor product X ⊗ Y. That it is a morphism is proved in [[AffineConstructive.theory.product_algebras.mon_inr_sg_mor]] and [[AffineConstructive.theory.product_algebras.mon_inr_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.mon_inl_pointed","base":"mon_inl_pointed","kind":"def","start":573,"body":null,"status":"ok","short":{"text":"The left injection X ⇾ X ⊗ Y sends the unit to the unit","status":"ok"},"long":{"text":"The left injection [[AffineConstructive.theory.product_algebras.mon_inl]] sends the unit of X to (e, e), which by definition is the unit of X ⊗ Y. The two sides agree on the nose, so reflexivity of equality proves it. This is the unit half of the monoid-morphism property, stated alone so that it holds with no monoid laws on either side.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.mon_inr_pointed","base":"mon_inr_pointed","kind":"def","start":574,"body":null,"status":"ok","short":{"text":"The right injection Y ⇾ X ⊗ Y sends the unit to the unit","status":"ok"},"long":{"text":"The mirror image of [[AffineConstructive.theory.product_algebras.mon_inl_pointed]]: [[AffineConstructive.theory.product_algebras.mon_inr]] sends the unit of Y to (e, e), the unit of X ⊗ Y, and reflexivity proves it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.mon_inl_sg_mor","base":"mon_inl_sg_mor","kind":"inst","start":581,"body":[582,587],"status":"ok","short":{"text":"For a semigroup X and a monoid Y, the left injection x ↦ (x, e) preserves the operation","status":"ok"},"proof":[{"text":"A semigroup morphism is a map between semigroups that preserves the operation. That X ⊗ Y is a semigroup, and that the injection respects equality, come from the instances already built. What is left is the preservation law itself.","status":"ok","from":0,"to":1},{"text":"Fix x and y in X. The injection sends xy to (xy, e) and the pair x, y to (x, e)(y, e) = (xy, ee). So the goal is the equality xy = xy in the first coordinate together with e = ee in the second, joined by ⊠.","status":"ok","from":2,"to":3},{"text":"Prove each factor separately. The first is reflexivity. The second is e = ee, which holds because e is a left identity of Y ([[AffineConstructive.interfaces.common_props.left_identity]]).","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.theory.product_algebras.mon_inr_sg_mor","base":"mon_inr_sg_mor","kind":"inst","start":588,"body":[589,594],"status":"ok","short":{"text":"For a monoid X and a semigroup Y, the right injection y ↦ (e, y) preserves the operation","status":"ok"},"proof":[{"text":"As with the left injection, resolution supplies the semigroup structure on X ⊗ Y and the fact that the injection respects equality. What remains is that the injection preserves the operation.","status":"ok","from":0,"to":1},{"text":"Fix x and y in Y. Coordinatewise, the goal is e = ee in X together with xy = xy in Y, joined by ⊠.","status":"ok","from":2,"to":3},{"text":"Prove each factor separately. The first is e = ee, which holds because e is a left identity of X ([[AffineConstructive.interfaces.common_props.left_identity]]). The second is reflexivity.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.theory.product_algebras.mon_inl_mon_mor","base":"mon_inl_mon_mor","kind":"inst","start":595,"body":[596,598],"status":"ok","short":{"text":"For monoids X and Y, the left injection X ⇾ X ⊗ Y is a monoid morphism","status":"ok"},"proof":[{"text":"A monoid morphism is a semigroup morphism that sends the unit to the unit. The left injection preserves the operation by [[AffineConstructive.theory.product_algebras.mon_inl_sg_mor]] and sends e to (e, e) by [[AffineConstructive.theory.product_algebras.mon_inl_pointed]]. The tensor product is a monoid by [[AffineConstructive.theory.product_algebras.tensor_monoid]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.mon_inr_mon_mor","base":"mon_inr_mon_mor","kind":"inst","start":599,"body":[600,602],"status":"ok","short":{"text":"For monoids X and Y, the right injection Y ⇾ X ⊗ Y is a monoid morphism","status":"ok"},"proof":[{"text":"The right injection preserves the operation by [[AffineConstructive.theory.product_algebras.mon_inr_sg_mor]] and sends e to (e, e) by [[AffineConstructive.theory.product_algebras.mon_inr_pointed]]. The tensor product is a monoid by [[AffineConstructive.theory.product_algebras.tensor_monoid]]. Together these make the right injection a monoid morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.add_mon_inl","base":"add_mon_inl","kind":"def","start":611,"body":null,"status":"ok","short":{"text":"The left injection X ⇾ X ⊗ Y, x ↦ (x, 0)","status":"ok"},"long":{"text":"The additive counterpart of [[AffineConstructive.theory.product_algebras.mon_inl]]: x goes to the pair whose second coordinate is the zero of Y. It is defined separately so that the additive classes, which take 0 as the unit, recognise it. With the zero as unit it is [[AffineConstructive.theory.product_algebras.mon_inl]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.add_mon_inr","base":"add_mon_inr","kind":"def","start":612,"body":null,"status":"ok","short":{"text":"The right injection Y ⇾ X ⊗ Y, y ↦ (0, y)","status":"ok"},"long":{"text":"The additive counterpart of [[AffineConstructive.theory.product_algebras.mon_inr]]: y goes to the pair whose first coordinate is the zero of X. With the zero as unit it is [[AffineConstructive.theory.product_algebras.mon_inr]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.add_mon_inl_pointed","base":"add_mon_inl_pointed","kind":"inst","start":617,"body":null,"status":"ok","short":{"text":"The left injection x ↦ (x, 0) sends 0 to 0","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.mon_inl_pointed]]: [[AffineConstructive.theory.product_algebras.add_mon_inl]] sends the zero of X to (0, 0), the zero of X ⊗ Y. Since the additive injection is the monoid one with zero as unit, the monoid instance is this one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.add_mon_inr_pointed","base":"add_mon_inr_pointed","kind":"inst","start":618,"body":null,"status":"ok","short":{"text":"The right injection y ↦ (0, y) sends 0 to 0","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.mon_inr_pointed]]: [[AffineConstructive.theory.product_algebras.add_mon_inr]] sends the zero of Y to (0, 0), the zero of X ⊗ Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.add_mon_inl_sg_mor","base":"add_mon_inl_sg_mor","kind":"inst","start":619,"body":null,"status":"ok","short":{"text":"The left injection x ↦ (x, 0) preserves addition","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.mon_inl_sg_mor]]: if X is a semigroup under + and Y a monoid under + and 0, then (x + x', 0) = (x, 0) + (x', 0). The second coordinate is the identity 0 = 0 + 0. The proof is the multiplicative one, with + as the operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.add_mon_inr_sg_mor","base":"add_mon_inr_sg_mor","kind":"inst","start":620,"body":null,"status":"ok","short":{"text":"The right injection y ↦ (0, y) preserves addition","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.mon_inr_sg_mor]]: if X is a monoid under + and 0 and Y a semigroup under +, then (0, y + y') = (0, y) + (0, y'). The first coordinate rests on 0 = 0 + 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.add_mon_inl_mon_mor","base":"add_mon_inl_mon_mor","kind":"inst","start":621,"body":null,"status":"ok","short":{"text":"For additive monoids X and Y, the left injection x ↦ (x, 0) is a monoid morphism","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.mon_inl_mon_mor]]: [[AffineConstructive.theory.product_algebras.add_mon_inl]] preserves addition and zero, so it is a morphism of additive monoids X ⇾ X ⊗ Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.add_mon_inr_mon_mor","base":"add_mon_inr_mon_mor","kind":"inst","start":622,"body":null,"status":"ok","short":{"text":"For additive monoids X and Y, the right injection y ↦ (0, y) is a monoid morphism","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.mon_inr_mon_mor]]: [[AffineConstructive.theory.product_algebras.add_mon_inr]] preserves addition and zero, so it is a morphism of additive monoids Y ⇾ X ⊗ Y.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.common_props":{"page":"../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.theory.groups":{"page":"groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.interfaces.set_lambda":{"page":"../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

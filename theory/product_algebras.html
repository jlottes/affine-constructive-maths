,"page":"../tactics/easy.html"},{"s":29566,"e":29569,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":33157,"e":33160,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":33322,"e":33325,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":33459,"e":33462,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":33591,"e":33594,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":38857,"e":38860,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":39064,"e":39067,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":39263,"e":39266,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":39462,"e":39465,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":44156,"e":44160,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":44163,"e":44166,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":44167,"e":44170,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":44462,"e":44465,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":44466,"e":44469,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":44496,"e":44500,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":44621,"e":44624,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":44747,"e":44750,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file carries algebraic structure to products of sets, both the tensor product X ⊗ Y, whose equality is multiplicative, and the cartesian product X × Y, whose equality is additive. For each product it shows that operations combined coordinatewise ([[AffineConstructive.theory.set.tensor_map2]], [[AffineConstructive.theory.set.prod_map2]]) keep the laws of their components (associativity, commutativity, idempotence, absorption, distributivity, identities, absorbing elements and inverses), and from these it equips the product of two semigroups, monoids, groups, semilattices, lattices, and their additive and multiplicative variants with the same structure, with units, zeros, tops and bottoms taken as pairs. It then shows that the canonical maps respect this structure: the comparison [[AffineConstructive.theory.set.tensor_to_prod]] from the tensor to the cartesian product, the tensor f ⊗ g of two maps, and the projections out of either product preserve the distinguished points and are semigroup and monoid morphisms, as are the injections [[AffineConstructive.theory.product_algebras.mon_inl]], [[AffineConstructive.theory.product_algebras.mon_inr]], [[AffineConstructive.theory.product_algebras.add_mon_inl]] and [[AffineConstructive.theory.product_algebras.add_mon_inr]] of a factor into the tensor product beside the unit or zero of the other.","short":"Algebraic structures on tensor and cartesian products, and the canonical maps as morphisms","items":[{"name":"AffineConstructive.theory.product_algebras.doit","base":"doit","kind":"ltac","start":9,"body":null,"also":[202],"status":"ok","short":{"text":"Proves an algebraic law for a coordinatewise operation from the same law in each coordinate","status":"ok"},"long":{"text":"The goal is a law, such as associativity, commutativity, an identity, an inverse, an absorption or a distribution law, for an operation on a product built coordinatewise from two operations, by [[AffineConstructive.theory.set.tensor_map2]] on X₁ ⊗ X₂ or by [[AffineConstructive.theory.set.prod_map2]] on X₁ × X₂. The tactic takes the two hypotheses, the same law for the operation on each factor, unfolds the law into its pointwise equation, and breaks every argument of the product into its pair of coordinates. Equality on a product is the equality of first coordinates together with the equality of second coordinates (joined by ⊠ on the tensor product, by ∧ on the cartesian product), so the goal splits into one equation per coordinate, and each is the law of that factor, applied at the coordinates.\n\nThe same tactic, defined once for each of the two products, proves all the coordinatewise laws of the file; nothing in it depends on which law it is.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_associative","base":"tensor_map2_associative","kind":"prf","start":10,"body":[11,13],"status":"ok","short":{"text":"Two associative operations combine coordinatewise into an associative operation on the tensor product","status":"ok"},"proof":[{"text":"One automated step unfolds associativity, takes the three elements as pairs and computes [[AffineConstructive.theory.set.tensor_map2]] coordinatewise on both sides. An equality in X₁ ⊗ X₂ is the pair of its coordinate equalities: f₁ is associative in the first coordinate and f₂ in the second, which finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_commutative","base":"tensor_map2_commutative","kind":"prf","start":14,"body":[15,17],"status":"ok","short":{"text":"Two commutative operations combine coordinatewise into a commutative operation on the tensor product","status":"ok"},"proof":[{"text":"One automated step unfolds commutativity, takes the two elements as pairs and computes the coordinatewise operation in each order. The equality of the results is the pair of coordinate equalities, which are commutativity of f₁ and of f₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_binary_idempotent","base":"tensor_map2_binary_idempotent","kind":"prf","start":18,"body":[19,21],"status":"ok","short":{"text":"Two idempotent operations combine coordinatewise into an idempotent operation on the tensor product","status":"ok"},"proof":[{"text":"One automated step takes an element as a pair and computes the operation on it and itself coordinatewise. That the result equals the pair comes down to two equalities, f₁ (x, x) = x in the first coordinate and f₂ (y, y) = y in the second, and these are the idempotence hypotheses.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_absorption","base":"tensor_map2_absorption","kind":"prf","start":22,"body":[23,25],"status":"ok","short":{"text":"If f₁ absorbs g₁ and f₂ absorbs g₂, the coordinatewise f absorbs the coordinatewise g on tensors","status":"ok"},"proof":[{"text":"One automated step takes the two elements as pairs and computes both coordinatewise operations, the inner one g and the outer one f. Each coordinate is an instance of absorption: the first for f₁ and g₁, the second for f₂ and g₂. Together they give the equality of pairs.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_left_distribute","base":"tensor_map2_left_distribute","kind":"prf","start":26,"body":[27,29],"status":"ok","short":{"text":"Left distributivity in each factor gives left distributivity of the coordinatewise operations on the tensor product","status":"ok"},"proof":[{"text":"One automated step takes the three elements as pairs and computes both sides of the distributive law coordinatewise. The first coordinate is left distributivity of f₁ over g₁ and the second is left distributivity of f₂ over g₂. Together they give the equality in the tensor product.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_right_distribute","base":"tensor_map2_right_distribute","kind":"prf","start":30,"body":[31,33],"status":"ok","short":{"text":"Right distributivity in each factor gives right distributivity of the coordinatewise operations on the tensor product","status":"ok"},"proof":[{"text":"One automated step takes the three elements as pairs and computes both sides of the distributive law coordinatewise. The first coordinate is right distributivity of f₁ over g₁ and the second is right distributivity of f₂ over g₂. Together they give the equality in the tensor product.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_left_identity","base":"tensor_map2_left_identity","kind":"prf","start":34,"body":[35,37],"status":"ok","short":{"text":"If x₁ and x₂ are left identities, (x₁, x₂) is a left identity for the coordinatewise operation on tensors","status":"ok"},"proof":[{"text":"One automated step takes an element of Y₁ ⊗ Y₂ as a pair and computes the operation on (x₁, x₂) and that pair coordinatewise. The resulting equality is the pair of coordinate equalities, which are the left-identity laws for x₁ and for x₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_right_identity","base":"tensor_map2_right_identity","kind":"prf","start":38,"body":[39,41],"status":"ok","short":{"text":"If y₁ and y₂ are right identities, (y₁, y₂) is a right identity for the coordinatewise operation on tensors","status":"ok"},"proof":[{"text":"One automated step takes an element of X₁ ⊗ X₂ as a pair and computes the operation on that pair and (y₁, y₂) coordinatewise. The resulting equality is the pair of coordinate equalities, which are the right-identity laws for y₁ and for y₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_left_absorb","base":"tensor_map2_left_absorb","kind":"prf","start":42,"body":[43,45],"status":"ok","short":{"text":"If x₁ and x₂ are left absorbing, so is (x₁, x₂) for the coordinatewise operation on tensors","status":"ok"},"proof":[{"text":"One automated step takes an element of Y₁ ⊗ Y₂ as a pair and computes the operation on (x₁, x₂) and that pair coordinatewise. That the result equals (x₁, x₂) comes down to the two coordinate equalities, which say that x₁ absorbs on the left for f₁ and x₂ for f₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_right_absorb","base":"tensor_map2_right_absorb","kind":"prf","start":46,"body":[47,49],"status":"ok","short":{"text":"If y₁ and y₂ are right absorbing, so is (y₁, y₂) for the coordinatewise operation on tensors","status":"ok"},"proof":[{"text":"One automated step takes an element of X₁ ⊗ X₂ as a pair and computes the operation on that pair and (y₁, y₂) coordinatewise. That the result equals (y₁, y₂) comes down to the two coordinate equalities, which say that y₁ absorbs on the right for f₁ and y₂ for f₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_left_inverse","base":"tensor_map2_left_inverse","kind":"prf","start":50,"body":[51,53],"status":"ok","short":{"text":"Left inverses in each factor give left inverses, via g₁ ⊗ g₂, for the coordinatewise operation on tensors","status":"ok"},"proof":[{"text":"Automation checks the claim one coordinate at a time. Applied to (x, y), the operation f₁ × f₂ works on each coordinate separately. So f₁(g₁ x₁, x₁) = x₁ and f₂(g₂ x₂, x₂) = x₂ in the two factors give the identity on the pair. The tensor product's equality is the ⊠ of the two coordinate equalities, so the two factor laws together are exactly what is needed.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map2_right_inverse","base":"tensor_map2_right_inverse","kind":"prf","start":54,"body":[55,57],"status":"ok","short":{"text":"Right inverses in each factor give right inverses, via g₁ ⊗ g₂, for the coordinatewise operation on tensors","status":"ok"},"proof":[{"text":"This is the mirror image of the left-inverse case and is also settled by automation coordinate by coordinate. Each factor's right-inverse law is one coordinate of the claim. The equality on X ⊗ Y is the ⊠ of the coordinate equalities, so the two laws together give it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.doit2","base":"doit2","kind":"ltac","start":86,"body":null,"also":[279],"status":"ok","short":{"text":"Finds an algebraic structure on a product by resolution, after exposing the coordinatewise operations","status":"ok"},"long":{"text":"The goal is a structure (a semigroup, monoid, group, lattice and so on) on X ⊗ Y or X × Y, or one of the fields of such a structure. The tactic first tries to find it by instance resolution. When that fails because the operation appears through the structure's own operation (the semigroup operation, the addition, the meet, the inversion of the product) rather than as the coordinatewise operation it is, the tactic restates the goal with that operation shown as the [[AffineConstructive.theory.set.tensor_map2]] or [[AffineConstructive.theory.set.tensor_map]] it unfolds to, on the tensor product, or as the [[AffineConstructive.theory.set.prod_map2]] or [[AffineConstructive.theory.set.prod_map]], on the cartesian product, and tries resolution again; the coordinatewise laws proved earlier in the file are then found from the corresponding laws of the factors.\n\nThe tensor and the cartesian sections each define their own variant, differing only in which coordinatewise operations they expose.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_semigroup","base":"tensor_semigroup","kind":"inst","start":87,"body":[88,91],"status":"ok","short":{"text":"The tensor product X ⊗ Y of two semigroups is a semigroup under the coordinatewise operation","status":"ok"},"proof":[{"text":"Unfolded, a semigroup structure is just associativity of the operation. Here the operation is the coordinatewise one, which is associative because both factors are, by [[AffineConstructive.theory.product_algebras.tensor_map2_associative]].","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.theory.product_algebras.tensor_com_semigroup","base":"tensor_com_semigroup","kind":"inst","start":92,"body":[93,95],"status":"ok","short":{"text":"The tensor product of two commutative semigroups is a commutative semigroup","status":"ok"},"proof":[{"text":"A commutative semigroup is a semigroup whose operation is commutative, so there are two things to show. The semigroup part is [[AffineConstructive.theory.product_algebras.tensor_semigroup]]. Commutativity holds coordinatewise, by [[AffineConstructive.theory.product_algebras.tensor_map2_commutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_semilattice","base":"tensor_semilattice","kind":"inst","start":96,"body":[97,99],"status":"ok","short":{"text":"The tensor product of two semilattices is a semilattice","status":"ok"},"proof":[{"text":"A semilattice is a commutative semigroup whose operation is idempotent, so there are two things to show. The commutative semigroup part is [[AffineConstructive.theory.product_algebras.tensor_com_semigroup]]. Idempotence holds coordinatewise, by [[AffineConstructive.theory.product_algebras.tensor_map2_binary_idempotent]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_monoid","base":"tensor_monoid","kind":"inst","start":100,"body":[101,103],"status":"ok","short":{"text":"The tensor product of two monoids is a monoid with unit (e, e)","status":"ok"},"proof":[{"text":"A monoid has three requirements: a semigroup structure, a left identity and a right identity. The semigroup part is [[AffineConstructive.theory.product_algebras.tensor_semigroup]]. The pair of units (e, e) is a left identity by [[AffineConstructive.theory.product_algebras.tensor_map2_left_identity]] and a right identity by [[AffineConstructive.theory.product_algebras.tensor_map2_right_identity]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_com_monoid","base":"tensor_com_monoid","kind":"inst","start":104,"body":[105,107],"status":"ok","short":{"text":"The tensor product of two commutative monoids is a commutative monoid","status":"ok"},"proof":[{"text":"A commutative monoid is a monoid whose operation is commutative. The monoid part is [[AffineConstructive.theory.product_algebras.tensor_monoid]], and commutativity holds coordinatewise by [[AffineConstructive.theory.product_algebras.tensor_map2_commutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_bounded_sl","base":"tensor_bounded_sl","kind":"inst","start":108,"body":[109,111],"status":"ok","short":{"text":"The tensor product of two bounded semilattices is a bounded semilattice","status":"ok"},"proof":[{"text":"A bounded semilattice is a semilattice that is also a commutative monoid. Both structures are already available on the tensor product: the semilattice from [[AffineConstructive.theory.product_algebras.tensor_semilattice]] and the commutative monoid from [[AffineConstructive.theory.product_algebras.tensor_com_monoid]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_group","base":"tensor_group","kind":"inst","start":112,"body":[113,115],"status":"ok","short":{"text":"The tensor product of two groups is a group, with inversion x⁻¹ taken coordinatewise","status":"ok"},"proof":[{"text":"A group has three requirements: a monoid structure, a left inverse law and a right inverse law. The monoid part is [[AffineConstructive.theory.product_algebras.tensor_monoid]]. Inversion is taken coordinatewise, and the two inverse laws hold coordinatewise by [[AffineConstructive.theory.product_algebras.tensor_map2_left_inverse]] and [[AffineConstructive.theory.product_algebras.tensor_map2_right_inverse]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_abgroup","base":"tensor_abgroup","kind":"inst","start":116,"body":[117,119],"status":"ok","short":{"text":"The tensor product of two abelian groups is an abelian group","status":"ok"},"proof":[{"text":"An abelian group is a group whose operation is commutative. The group part is [[AffineConstructive.theory.product_algebras.tensor_group]], and commutativity holds coordinatewise by [[AffineConstructive.theory.product_algebras.tensor_map2_commutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_meet_sl","base":"tensor_meet_sl","kind":"inst","start":120,"body":[121,123],"status":"ok","short":{"text":"The tensor product of two meet semilattices is a meet semilattice under the coordinatewise ⊓","status":"ok"},"proof":[{"text":"A meet semilattice is a semilattice for ⊓, so this is the general fact [[AffineConstructive.theory.product_algebras.tensor_semilattice]] applied to the coordinatewise meet.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_join_sl","base":"tensor_join_sl","kind":"inst","start":124,"body":[125,127],"status":"ok","short":{"text":"The tensor product of two join semilattices is a join semilattice under the coordinatewise ⊔","status":"ok"},"proof":[{"text":"A join semilattice is a semilattice for ⊔, so this is the general fact [[AffineConstructive.theory.product_algebras.tensor_semilattice]] applied to the coordinatewise join.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_bounded_meet_sl","base":"tensor_bounded_meet_sl","kind":"inst","start":128,"body":[129,131],"status":"ok","short":{"text":"The tensor product of two bounded meet semilattices is one, with top (⊤, ⊤)","status":"ok"},"proof":[{"text":"A bounded meet semilattice is a bounded semilattice for ⊓ with identity ⊤, so [[AffineConstructive.theory.product_algebras.tensor_bounded_sl]] gives the structure on X ⊗ Y, with identity (⊤, ⊤).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_bounded_join_sl","base":"tensor_bounded_join_sl","kind":"inst","start":132,"body":[133,135],"status":"ok","short":{"text":"The tensor product of two bounded join semilattices is one, with bottom (⊥, ⊥)","status":"ok"},"proof":[{"text":"A bounded join semilattice is a bounded semilattice for ⊔ with identity ⊥, so [[AffineConstructive.theory.product_algebras.tensor_bounded_sl]] gives the structure on X ⊗ Y, with identity (⊥, ⊥).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_lattice","base":"tensor_lattice","kind":"inst","start":136,"body":[137,139],"status":"ok","short":{"text":"The tensor product of two lattices is a lattice under coordinatewise meet and join","status":"ok"},"proof":[{"text":"A lattice consists of a meet semilattice, a join semilattice and the two absorption laws. The semilattices on X ⊗ Y are the instances [[AffineConstructive.theory.product_algebras.tensor_meet_sl]] and [[AffineConstructive.theory.product_algebras.tensor_join_sl]], and each absorption law holds coordinatewise because it holds in X and in Y, by [[AffineConstructive.theory.product_algebras.tensor_map2_absorption]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_distr_lattice","base":"tensor_distr_lattice","kind":"inst","start":140,"body":[141,143],"status":"ok","short":{"text":"The tensor product of two distributive lattices is a distributive lattice","status":"ok"},"proof":[{"text":"A distributive lattice is a lattice together with distributive laws. The lattice on X ⊗ Y is [[AffineConstructive.theory.product_algebras.tensor_lattice]], and each distributive law holds for the coordinatewise operations because it holds in each factor, by [[AffineConstructive.theory.product_algebras.tensor_map2_left_distribute]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_add_nc_sg","base":"tensor_add_nc_sg","kind":"inst","start":144,"body":[145,147],"status":"ok","short":{"text":"The tensor product of two additive semigroups is an additive semigroup under coordinatewise +","status":"ok"},"proof":[{"text":"An additive semigroup is a semigroup for +, so the general fact [[AffineConstructive.theory.product_algebras.tensor_semigroup]] gives the structure, with + taken coordinatewise.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_add_nc_mon","base":"tensor_add_nc_mon","kind":"inst","start":148,"body":[149,151],"status":"ok","short":{"text":"The tensor product of two additive monoids, not necessarily commutative, is one, with zero (0, 0)","status":"ok"},"proof":[{"text":"An additive monoid is a monoid for + with unit 0, so [[AffineConstructive.theory.product_algebras.tensor_monoid]] gives the structure on X ⊗ Y, with unit (0, 0).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_add_mon","base":"tensor_add_mon","kind":"inst","start":152,"body":[153,155],"status":"ok","short":{"text":"The tensor product of two commutative additive monoids is a commutative additive monoid","status":"ok"},"proof":[{"text":"A commutative additive monoid is a commutative monoid for + and 0, so [[AffineConstructive.theory.product_algebras.tensor_com_monoid]] gives the structure on X ⊗ Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_add_nc_grp","base":"tensor_add_nc_grp","kind":"inst","start":156,"body":[157,159],"status":"ok","short":{"text":"The tensor product of two additive groups, not necessarily commutative, is an additive group","status":"ok"},"proof":[{"text":"An additive group is a group for +, 0 and negation, so [[AffineConstructive.theory.product_algebras.tensor_group]] gives the structure on X ⊗ Y, with negation taken coordinatewise.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_add_grp","base":"tensor_add_grp","kind":"inst","start":160,"body":[161,163],"status":"ok","short":{"text":"The tensor product of two abelian additive groups is an abelian additive group","status":"ok"},"proof":[{"text":"An additive group is an abelian group whose operation is written +, with unit 0 and inverse −. The instance is therefore the general fact [[AffineConstructive.theory.product_algebras.tensor_abgroup]] for these operations: componentwise +, the unit (0, 0) and componentwise negation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_mult_sg","base":"tensor_mult_sg","kind":"inst","start":164,"body":[165,167],"status":"ok","short":{"text":"The tensor product of two multiplicative semigroups is a multiplicative semigroup under coordinatewise ·","status":"ok"},"proof":[{"text":"A multiplicative semigroup is a semigroup whose operation is written ·. The instance is therefore [[AffineConstructive.theory.product_algebras.tensor_semigroup]] for coordinatewise multiplication.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_mult_mon","base":"tensor_mult_mon","kind":"inst","start":168,"body":[169,171],"status":"ok","short":{"text":"The tensor product of two multiplicative monoids is a multiplicative monoid with unit (1, 1)","status":"ok"},"proof":[{"text":"A multiplicative monoid is a monoid written with · and 1. The instance is therefore [[AffineConstructive.theory.product_algebras.tensor_monoid]] for coordinatewise multiplication, with unit (1, 1).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_mult_com_mon","base":"tensor_mult_com_mon","kind":"inst","start":172,"body":[173,175],"status":"ok","short":{"text":"The tensor product of two commutative multiplicative monoids is a commutative multiplicative monoid","status":"ok"},"proof":[{"text":"A commutative multiplicative monoid is a commutative monoid written with · and 1. The instance is therefore [[AffineConstructive.theory.product_algebras.tensor_com_monoid]] for coordinatewise multiplication.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_associative","base":"prod_map2_associative","kind":"prf","start":203,"body":[204,206],"status":"ok","short":{"text":"Two associative operations combine coordinatewise into an associative operation on the cartesian product","status":"ok"},"proof":[{"text":"Unfold the coordinatewise operation. Associativity at a triple of pairs becomes two equations, one in each coordinate, joined by the additive conjunction that is equality on X₁ × X₂. Each equation is the associativity of f₁ or of f₂ at the corresponding coordinates.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_commutative","base":"prod_map2_commutative","kind":"prf","start":207,"body":[208,210],"status":"ok","short":{"text":"Two commutative operations combine coordinatewise into a commutative operation on the cartesian product","status":"ok"},"proof":[{"text":"Unfold the coordinatewise operation. Commutativity at two pairs becomes one equation in each coordinate, joined by the additive conjunction that is equality on the cartesian product. The first is the commutativity of f₁ and the second the commutativity of f₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_binary_idempotent","base":"prod_map2_binary_idempotent","kind":"prf","start":211,"body":[212,214],"status":"ok","short":{"text":"Two idempotent operations combine coordinatewise into an idempotent operation on the cartesian product","status":"ok"},"proof":[{"text":"Unfold the coordinatewise operation. Applied to a pair and itself, it gives (f₁(x, x), f₂(y, y)). Its equality with (x, y) is then the two idempotence laws, one in each coordinate.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_absorption","base":"prod_map2_absorption","kind":"prf","start":215,"body":[216,218],"status":"ok","short":{"text":"If f₁ absorbs g₁ and f₂ absorbs g₂, the coordinatewise f absorbs the coordinatewise g on X × Y","status":"ok"},"proof":[{"text":"Unfold both coordinatewise operations. The absorption law at a pair of pairs splits into one equation per coordinate, and these are the absorption laws for f₁, g₁ and for f₂, g₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_left_distribute","base":"prod_map2_left_distribute","kind":"prf","start":219,"body":[220,222],"status":"ok","short":{"text":"Left distributivity in each factor gives left distributivity of the coordinatewise operations on the cartesian product","status":"ok"},"proof":[{"text":"Unfold the coordinatewise operations. Left distributivity at three pairs splits into an equation in X₁ and an equation in X₂. These are the left distributivity of f₁ over g₁ and of f₂ over g₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_right_distribute","base":"prod_map2_right_distribute","kind":"prf","start":223,"body":[224,226],"status":"ok","short":{"text":"Right distributivity in each factor gives right distributivity of the coordinatewise operations on the cartesian product","status":"ok"},"proof":[{"text":"Unfold the coordinatewise operations. Right distributivity at three pairs splits into an equation in each coordinate, and each is the right distributivity law in its own factor.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_left_identity","base":"prod_map2_left_identity","kind":"prf","start":227,"body":[228,230],"status":"ok","short":{"text":"If x₁ and x₂ are left identities for f₁ and f₂, then (x₁, x₂) is one for their cartesian product","status":"ok"},"proof":[{"text":"Fix a point of the cartesian product. Since equality on X₂ × Y₂ is the additive conjunction of the coordinate equalities, the law asks for f₁(x₁, y) = y in the first coordinate and f₂(x₂, y) = y in the second, and these are the two hypotheses.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_right_identity","base":"prod_map2_right_identity","kind":"prf","start":231,"body":[232,234],"status":"ok","short":{"text":"If y₁ and y₂ are right identities for f₁ and f₂, then (y₁, y₂) is one for their cartesian product","status":"ok"},"proof":[{"text":"Fix a point of the cartesian product. Since equality on the product is the additive conjunction of the coordinate equalities, the law splits into one equation for each coordinate, and each is the right identity law of f₁ or of f₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_left_absorb","base":"prod_map2_left_absorb","kind":"prf","start":235,"body":[236,238],"status":"ok","short":{"text":"If x₁ and x₂ are left absorbing for f₁ and f₂, then (x₁, x₂) is left absorbing for their cartesian product","status":"ok"},"proof":[{"text":"Fix a point of the cartesian product. Equality on the product is the additive conjunction of the coordinate equalities, so the law splits into one equation per coordinate, and each is the left absorption law of f₁ or of f₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_right_absorb","base":"prod_map2_right_absorb","kind":"prf","start":239,"body":[240,242],"status":"ok","short":{"text":"If y₁ and y₂ are right absorbing for f₁ and f₂, then (y₁, y₂) is right absorbing for their cartesian product","status":"ok"},"proof":[{"text":"Fix a point of the cartesian product. Equality on the product is the additive conjunction of the coordinate equalities, so the law splits into one equation per coordinate, and each is the right absorption law of f₁ or of f₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_left_inverse","base":"prod_map2_left_inverse","kind":"prf","start":243,"body":[244,246],"status":"ok","short":{"text":"Left inverses for f₁ and f₂ give, coordinatewise, left inverses for their cartesian product","status":"ok"},"proof":[{"text":"Fix a point (y₁, y₂). Both [[AffineConstructive.theory.set.prod_map2]] and the product of g₁ and g₂ act coordinatewise, and equality on Z₁ × Z₂ is the additive conjunction of the coordinate equalities, so the law asks for f₁(g₁ y₁, y₁) = x₁ and f₂(g₂ y₂, y₂) = x₂. These are the two hypotheses.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_map2_right_inverse","base":"prod_map2_right_inverse","kind":"prf","start":247,"body":[248,250],"status":"ok","short":{"text":"Right inverses for f₁ and f₂ give, coordinatewise, right inverses for their cartesian product","status":"ok"},"proof":[{"text":"Fix a point (x, x'). The operation and the map act coordinatewise, and equality on Z₁ × Z₂ is the additive conjunction of the coordinate equalities, so the law splits into the right inverse law of f₁ with g₁ in the first coordinate and that of f₂ with g₂ in the second.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_semigroup","base":"prod_semigroup","kind":"inst","start":280,"body":[281,284],"status":"ok","short":{"text":"The cartesian product X × Y of two semigroups is a semigroup under the coordinatewise operation","status":"ok"},"proof":[{"text":"A semigroup structure on X × Y is the associativity of its operation, which is the coordinatewise operation built from the operations of X and Y.","status":"ok","from":0,"to":1},{"text":"Associativity holds coordinatewise by [[AffineConstructive.theory.product_algebras.prod_map2_associative]], applied to the associativity of X and of Y.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.product_algebras.prod_com_semigroup","base":"prod_com_semigroup","kind":"inst","start":285,"body":[286,288],"status":"ok","short":{"text":"The cartesian product of two commutative semigroups is a commutative semigroup","status":"ok"},"proof":[{"text":"The structure has two parts. X × Y is a semigroup by [[AffineConstructive.theory.product_algebras.prod_semigroup]], and the coordinatewise operation is commutative by [[AffineConstructive.theory.product_algebras.prod_map2_commutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_semilattice","base":"prod_semilattice","kind":"inst","start":289,"body":[290,292],"status":"ok","short":{"text":"The cartesian product of two semilattices is a semilattice","status":"ok"},"proof":[{"text":"A semilattice is a commutative semigroup with an idempotent operation. X × Y is a commutative semigroup by [[AffineConstructive.theory.product_algebras.prod_com_semigroup]], and the coordinatewise operation is idempotent by [[AffineConstructive.theory.product_algebras.prod_map2_binary_idempotent]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_monoid","base":"prod_monoid","kind":"inst","start":293,"body":[294,296],"status":"ok","short":{"text":"The cartesian product of two monoids is a monoid, with unit the pair of units","status":"ok"},"proof":[{"text":"Three things must be shown. X × Y is a semigroup by [[AffineConstructive.theory.product_algebras.prod_semigroup]], and the pair of units is a left and a right identity for the coordinatewise operation by [[AffineConstructive.theory.product_algebras.prod_map2_left_identity]] and [[AffineConstructive.theory.product_algebras.prod_map2_right_identity]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_com_monoid","base":"prod_com_monoid","kind":"inst","start":297,"body":[298,300],"status":"ok","short":{"text":"The cartesian product of two commutative monoids is a commutative monoid","status":"ok"},"proof":[{"text":"A commutative monoid is a monoid whose operation is commutative, so there are two things to check. The monoid structure on X × Y comes from [[AffineConstructive.theory.product_algebras.prod_monoid]]. Commutativity holds because the coordinatewise operation of two commutative operations is commutative, by [[AffineConstructive.theory.product_algebras.prod_map2_commutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_bounded_sl","base":"prod_bounded_sl","kind":"inst","start":301,"body":[302,304],"status":"ok","short":{"text":"The cartesian product of two bounded semilattices is a bounded semilattice","status":"ok"},"proof":[{"text":"A bounded semilattice is a commutative monoid that is also a semilattice. The coordinatewise operation is a semilattice by [[AffineConstructive.theory.product_algebras.prod_semilattice]]. With the pair of units it is a commutative monoid by [[AffineConstructive.theory.product_algebras.prod_com_monoid]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_group","base":"prod_group","kind":"inst","start":305,"body":[306,308],"status":"ok","short":{"text":"The cartesian product of two groups is a group, with inversion taken coordinatewise","status":"ok"},"proof":[{"text":"A group has three parts: a monoid, left inverses and right inverses. The monoid structure on X × Y comes from [[AffineConstructive.theory.product_algebras.prod_monoid]]. Coordinatewise inversion is a left inverse by [[AffineConstructive.theory.product_algebras.prod_map2_left_inverse]] and a right inverse by [[AffineConstructive.theory.product_algebras.prod_map2_right_inverse]], since in each coordinate the inverse of the factor is a left and a right inverse.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_abgroup","base":"prod_abgroup","kind":"inst","start":309,"body":[310,312],"status":"ok","short":{"text":"The cartesian product of two abelian groups is an abelian group","status":"ok"},"proof":[{"text":"An abelian group is a group whose operation is commutative. The group structure on X × Y comes from [[AffineConstructive.theory.product_algebras.prod_group]]. Commutativity of the coordinatewise operation comes from [[AffineConstructive.theory.product_algebras.prod_map2_commutative]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_meet_sl","base":"prod_meet_sl","kind":"inst","start":313,"body":[314,316],"status":"ok","short":{"text":"The cartesian product of two meet semilattices is a meet semilattice under the coordinatewise meet","status":"ok"},"proof":[{"text":"A meet semilattice is a semilattice whose operation is the meet. So the instance is [[AffineConstructive.theory.product_algebras.prod_semilattice]] applied to the coordinatewise meet.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_join_sl","base":"prod_join_sl","kind":"inst","start":317,"body":[318,320],"status":"ok","short":{"text":"The cartesian product of two join semilattices is a join semilattice under the coordinatewise join","status":"ok"},"proof":[{"text":"A join semilattice is a semilattice whose operation is the join. So the instance is [[AffineConstructive.theory.product_algebras.prod_semilattice]] applied to the coordinatewise join.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_bounded_meet_sl","base":"prod_bounded_meet_sl","kind":"inst","start":321,"body":[322,324],"status":"ok","short":{"text":"The cartesian product of two bounded meet semilattices is one, with top (⊤, ⊤)","status":"ok"},"proof":[{"text":"A bounded meet semilattice is a bounded semilattice with the meet as its operation and top as its unit. So the instance is [[AffineConstructive.theory.product_algebras.prod_bounded_sl]] applied to the coordinatewise meet with unit (⊤, ⊤).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_bounded_join_sl","base":"prod_bounded_join_sl","kind":"inst","start":325,"body":[326,328],"status":"ok","short":{"text":"The cartesian product of two bounded join semilattices is one, with bottom (⊥, ⊥)","status":"ok"},"proof":[{"text":"A bounded join semilattice is a bounded semilattice with the join as its operation and bottom as its unit. So the instance is [[AffineConstructive.theory.product_algebras.prod_bounded_sl]] applied to the coordinatewise join with unit (⊥, ⊥).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_lattice","base":"prod_lattice","kind":"inst","start":329,"body":[330,332],"status":"ok","short":{"text":"The cartesian product of two lattices is a lattice under coordinatewise meet and join","status":"ok"},"proof":[{"text":"A lattice consists of a meet semilattice, a join semilattice and the two absorption laws. The coordinatewise meet and join give the two semilattices, by [[AffineConstructive.theory.product_algebras.prod_meet_sl]] and [[AffineConstructive.theory.product_algebras.prod_join_sl]]. Each absorption law holds on X × Y because it holds in each coordinate, by [[AffineConstructive.theory.product_algebras.prod_map2_absorption]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_distr_lattice","base":"prod_distr_lattice","kind":"inst","start":333,"body":[334,336],"status":"ok","short":{"text":"The cartesian product of two distributive lattices is a distributive lattice","status":"ok"},"proof":[{"text":"A distributive lattice is a lattice in which both operations distribute. The lattice structure on X × Y comes from [[AffineConstructive.theory.product_algebras.prod_lattice]]. Distributivity of meet over join and of join over meet holds because it holds in each coordinate, by [[AffineConstructive.theory.product_algebras.prod_map2_left_distribute]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_add_nc_mon","base":"prod_add_nc_mon","kind":"inst","start":337,"body":[338,340],"status":"ok","short":{"text":"The cartesian product of two additive monoids, not necessarily commutative, is one, with zero (0, 0)","status":"ok"},"proof":[{"text":"An additive monoid is a monoid written with + and 0, so the general result for monoids, [[AffineConstructive.theory.product_algebras.prod_monoid]], applies to X × Y as it stands.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_add_mon","base":"prod_add_mon","kind":"inst","start":341,"body":[342,344],"status":"ok","short":{"text":"The cartesian product of two commutative additive monoids is a commutative additive monoid","status":"ok"},"proof":[{"text":"A commutative additive monoid is a commutative monoid written with + and 0, so this is [[AffineConstructive.theory.product_algebras.prod_com_monoid]] applied to X × Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_add_nc_grp","base":"prod_add_nc_grp","kind":"inst","start":345,"body":[346,348],"status":"ok","short":{"text":"The cartesian product of two additive groups, not necessarily commutative, is one, with negation coordinatewise","status":"ok"},"proof":[{"text":"An additive group is a group written with +, 0 and negation, so this is the general result for groups, [[AffineConstructive.theory.product_algebras.prod_group]], applied to X × Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_add_grp","base":"prod_add_grp","kind":"inst","start":349,"body":[350,352],"status":"ok","short":{"text":"The cartesian product of two abelian additive groups is an abelian additive group","status":"ok"},"proof":[{"text":"An abelian additive group is an abelian group written additively, so this is [[AffineConstructive.theory.product_algebras.prod_abgroup]] applied to X × Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_mult_sg","base":"prod_mult_sg","kind":"inst","start":353,"body":[354,356],"status":"ok","short":{"text":"The cartesian product of two multiplicative semigroups is a multiplicative semigroup","status":"ok"},"proof":[{"text":"A multiplicative semigroup is a semigroup written with multiplication, so this is [[AffineConstructive.theory.product_algebras.prod_semigroup]] applied to X × Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_mult_mon","base":"prod_mult_mon","kind":"inst","start":357,"body":[358,360],"status":"ok","short":{"text":"The cartesian product of two multiplicative monoids is one, with unit (1, 1)","status":"ok"},"proof":[{"text":"A multiplicative monoid is a monoid written with multiplication and 1, so this is [[AffineConstructive.theory.product_algebras.prod_monoid]] applied to X × Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_mult_com_mon","base":"prod_mult_com_mon","kind":"inst","start":361,"body":[362,364],"status":"ok","short":{"text":"The cartesian product of two commutative multiplicative monoids is a commutative multiplicative monoid","status":"ok"},"proof":[{"text":"A commutative multiplicative monoid is a commutative monoid written multiplicatively, so this is [[AffineConstructive.theory.product_algebras.prod_com_monoid]] applied to X × Y.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_pointed","base":"tensor_to_prod_pointed","kind":"def","start":390,"body":null,"status":"ok","short":{"text":"The comparison X ⊗ Y ⇾ X × Y sends any pair (x, y) to (x, y)","status":"ok"},"long":{"text":"The canonical map [[AffineConstructive.theory.set.tensor_to_prod]] from the tensor product to the cartesian product carries each pair to itself; only the equality on the two sides differs, multiplicative on X ⊗ Y and additive on X × Y. So for every choice of points x and y it is a pointed map from (X ⊗ Y, (x, y)) to (X × Y, (x, y)), and the proof is reflexivity of the equality of X × Y.\n\nThis single statement serves every choice of distinguished element: the unit, zero, one, top and bottom of a product are all formed as pairs, and the specialised facts below are this one at those pairs.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_mon_unit_pointed","base":"tensor_to_prod_mon_unit_pointed","kind":"def","start":391,"body":null,"status":"ok","short":{"text":"The comparison X ⊗ Y ⇾ X × Y preserves the monoid unit","status":"ok"},"long":{"text":"The monoid unit of both X ⊗ Y and X × Y is the pair of units, so [[AffineConstructive.theory.product_algebras.tensor_to_prod_pointed]] at that pair says that [[AffineConstructive.theory.set.tensor_to_prod]] sends the unit to the unit. Together with [[AffineConstructive.theory.product_algebras.tensor_to_prod_sg_mor]] it makes the comparison a monoid morphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_top_pointed","base":"tensor_to_prod_top_pointed","kind":"def","start":392,"body":null,"status":"ok","short":{"text":"The comparison X ⊗ Y ⇾ X × Y preserves the top element","status":"ok"},"long":{"text":"The top of each product is the pair (⊤, ⊤), so [[AffineConstructive.theory.product_algebras.tensor_to_prod_pointed]] at that pair says that [[AffineConstructive.theory.set.tensor_to_prod]] preserves ⊤.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_bottom_pointed","base":"tensor_to_prod_bottom_pointed","kind":"def","start":393,"body":null,"status":"ok","short":{"text":"The comparison X ⊗ Y ⇾ X × Y preserves the bottom element","status":"ok"},"long":{"text":"The bottom of each product is the pair (⊥, ⊥), so [[AffineConstructive.theory.product_algebras.tensor_to_prod_pointed]] at that pair says that [[AffineConstructive.theory.set.tensor_to_prod]] preserves ⊥.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_zero_pointed","base":"tensor_to_prod_zero_pointed","kind":"def","start":394,"body":null,"status":"ok","short":{"text":"The comparison X ⊗ Y ⇾ X × Y preserves zero","status":"ok"},"long":{"text":"The zero of each product is the pair (0, 0), so [[AffineConstructive.theory.product_algebras.tensor_to_prod_pointed]] at that pair says that [[AffineConstructive.theory.set.tensor_to_prod]] preserves 0. With [[AffineConstructive.theory.product_algebras.tensor_to_prod_add_sg_mor]] it makes the comparison a morphism of additive monoids.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_one_pointed","base":"tensor_to_prod_one_pointed","kind":"def","start":395,"body":null,"status":"ok","short":{"text":"The comparison X ⊗ Y ⇾ X × Y preserves one","status":"ok"},"long":{"text":"The one of each product is the pair (1, 1), so [[AffineConstructive.theory.product_algebras.tensor_to_prod_pointed]] at that pair says that [[AffineConstructive.theory.set.tensor_to_prod]] preserves 1.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_sg_mor","base":"tensor_to_prod_sg_mor","kind":"prf","start":396,"body":[397,400],"status":"ok","short":{"text":"For semigroups X and Y, the comparison X ⊗ Y ⇾ X × Y is a semigroup morphism","status":"ok"},"proof":[{"text":"A semigroup morphism consists of semigroup structures on its domain and codomain and the preservation of the operation. The two structures are those of [[AffineConstructive.theory.product_algebras.tensor_semigroup]] and [[AffineConstructive.theory.product_algebras.prod_semigroup]]. What is left is to show that the comparison carries a product to a product.","status":"ok","from":0,"to":1},{"text":"Fix x and y in X ⊗ Y. Both sides of the equation are the pair of coordinatewise products, so they agree by reflexivity.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_mon_mor","base":"tensor_to_prod_mon_mor","kind":"prf","start":401,"body":[402,404],"status":"ok","short":{"text":"For monoids X and Y, the comparison X ⊗ Y ⇾ X × Y is a monoid morphism","status":"ok"},"proof":[{"text":"A monoid morphism consists of the monoid structures on both sides, given by [[AffineConstructive.theory.product_algebras.tensor_monoid]] and [[AffineConstructive.theory.product_algebras.prod_monoid]], together with the preservation of the unit and of the operation. Each of these is immediate: the comparison sends the unit (e, e) to (e, e), and it sends a coordinatewise product to the same coordinatewise product.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_add_sg_mor","base":"tensor_to_prod_add_sg_mor","kind":"def","start":405,"body":null,"status":"ok","short":{"text":"For additive semigroups X and Y, the comparison X ⊗ Y ⇾ X × Y preserves addition","status":"ok"},"long":{"text":"An additive semigroup is a semigroup whose operation is +, and a morphism of additive semigroups is a semigroup morphism for +. The statement is therefore [[AffineConstructive.theory.product_algebras.tensor_to_prod_sg_mor]] read additively, and is defined as that proof.\n\nIt says that the comparison from the tensor product, where two pairs are equal when both coordinates are (multiplicatively), to the cartesian product, where the coordinate equalities are joined additively, respects coordinatewise addition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_to_prod_add_mon_mor","base":"tensor_to_prod_add_mon_mor","kind":"def","start":406,"body":null,"status":"ok","short":{"text":"For additive monoids X and Y, the comparison X ⊗ Y ⇾ X × Y preserves addition and zero","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.tensor_to_prod_mon_mor]]: a morphism of additive monoids is a monoid morphism for + and 0, so the monoid statement, at the additive structure, is this one. It combines [[AffineConstructive.theory.product_algebras.tensor_to_prod_add_sg_mor]] with [[AffineConstructive.theory.product_algebras.tensor_to_prod_zero_pointed]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_pointed","base":"tensor_map_pointed","kind":"inst","start":421,"body":[422,424],"status":"ok","short":{"text":"If f₁ and f₂ are pointed maps, so is f₁ ⊗ f₂, between the pairs of base points","status":"ok"},"proof":[{"text":"The map f₁ ⊗ f₂ sends (x₁, x₂) to (f₁ x₁, f₂ x₂). This pair equals (y₁, y₂) when each coordinate is equal, and those two equalities are f₁ x₁ = y₁ and f₂ x₂ = y₂, which hold because f₁ and f₂ are pointed.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_mon_unit_pointed","base":"tensor_map_mon_unit_pointed","kind":"inst","start":426,"body":null,"status":"ok","short":{"text":"If f and g preserve the monoid unit, so does their tensor f ⊗ g on X₁ ⊗ X₂","status":"ok"},"long":{"text":"The monoid unit of a tensor product X₁ ⊗ X₂ is the pair of the units of the factors, so a map f : X₁ ⇾ Y₁ and a map g : X₂ ⇾ Y₂ that each send the unit to the unit give a map f ⊗ g that sends the unit of X₁ ⊗ X₂ to the unit of Y₁ ⊗ Y₂. The instance is [[AffineConstructive.theory.product_algebras.tensor_map_pointed]] read at the units: preservation of a chosen point by each factor gives preservation of the pair of points.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_top_pointed","base":"tensor_map_top_pointed","kind":"inst","start":427,"body":null,"status":"ok","short":{"text":"If f and g preserve the top element, so does f ⊗ g","status":"ok"},"long":{"text":"The top of a tensor product is the pair (⊤, ⊤), so maps preserving ⊤ in each factor give a map [[AffineConstructive.theory.set.tensor_map]] f g preserving ⊤ on X₁ ⊗ X₂. The statement is [[AffineConstructive.theory.product_algebras.tensor_map_pointed]] at the tops.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_bottom_pointed","base":"tensor_map_bottom_pointed","kind":"inst","start":428,"body":null,"status":"ok","short":{"text":"The tensor f ⊗ g of two maps that preserve bottom also preserves bottom","status":"ok"},"long":{"text":"An instance: if f and g each send bottom to bottom, then so does f ⊗ g, where the bottom of a tensor product X ⊗ Y is the pair (⊥, ⊥). It is [[AffineConstructive.theory.product_algebras.tensor_map_pointed]] applied at the bottom elements. Resolution uses it to see that a map built coordinatewise from bottom-preserving maps preserves bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_zero_pointed","base":"tensor_map_zero_pointed","kind":"inst","start":429,"body":null,"status":"ok","short":{"text":"The tensor f ⊗ g of two maps that preserve zero also preserves zero","status":"ok"},"long":{"text":"An instance: if f and g each send 0 to 0, then so does f ⊗ g, where the zero of a tensor product is the pair (0, 0). It is [[AffineConstructive.theory.product_algebras.tensor_map_pointed]] applied at the zeros, and it is the pointed half of the additive monoid morphism [[AffineConstructive.theory.product_algebras.tensor_map_add_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_one_pointed","base":"tensor_map_one_pointed","kind":"inst","start":430,"body":null,"status":"ok","short":{"text":"The tensor f ⊗ g of two maps that preserve one also preserves one","status":"ok"},"long":{"text":"An instance: if f and g each send 1 to 1, then so does f ⊗ g, where the one of a tensor product is the pair (1, 1). It is [[AffineConstructive.theory.product_algebras.tensor_map_pointed]] applied at the units of the multiplications.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_sg_mor","base":"tensor_map_sg_mor","kind":"inst","start":431,"body":[432,436],"status":"ok","short":{"text":"The tensor f ⊗ g of two semigroup morphisms is a semigroup morphism","status":"ok"},"proof":[{"text":"A semigroup morphism is a map between semigroups that preserves the operation. Here both sides are semigroups under the coordinatewise operation ([[AffineConstructive.theory.product_algebras.tensor_semigroup]]), so what remains is the preservation law for f ⊗ g.","status":"ok","from":0,"to":1},{"text":"Write the two elements of X₁ ⊗ X₂ as pairs (a, b) and (c, d). The required equality in Y₁ ⊗ Y₂ is the tensor of an equality in each coordinate. The first, f(a·c) = f(a)·f(c), holds because f is a semigroup morphism, and the second, g(b·d) = g(b)·g(d), because g is.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_mon_mor","base":"tensor_map_mon_mor","kind":"inst","start":437,"body":[438,440],"status":"ok","short":{"text":"The tensor f ⊗ g of two monoid morphisms is a monoid morphism","status":"ok"},"proof":[{"text":"A monoid morphism is a semigroup morphism that preserves the unit. f ⊗ g is a semigroup morphism by [[AffineConstructive.theory.product_algebras.tensor_map_sg_mor]], and it sends the unit (e, e) to (e, e) by [[AffineConstructive.theory.product_algebras.tensor_map_mon_unit_pointed]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_add_sg_mor","base":"tensor_map_add_sg_mor","kind":"inst","start":441,"body":null,"status":"ok","short":{"text":"The tensor f ⊗ g of two maps that preserve addition also preserves addition","status":"ok"},"long":{"text":"An instance: the additive form of [[AffineConstructive.theory.product_algebras.tensor_map_sg_mor]]. A map that preserves addition is a semigroup morphism for +, and the addition of X ⊗ Y is the coordinatewise one, so the semigroup statement applies as it stands and no new proof is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_map_add_mon_mor","base":"tensor_map_add_mon_mor","kind":"inst","start":442,"body":null,"status":"ok","short":{"text":"The tensor f ⊗ g of two additive monoid morphisms is an additive monoid morphism","status":"ok"},"long":{"text":"An instance: the additive form of [[AffineConstructive.theory.product_algebras.tensor_map_mon_mor]]. If f and g preserve + and 0, then so does f ⊗ g for the coordinatewise addition and the zero (0, 0) of the tensor product. The monoid statement is reused, read at + and 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_pointed","base":"prod_proj1_pointed","kind":"inst","start":457,"body":null,"status":"ok","short":{"text":"The first projection X × Y ⇾ X sends (x, y) to x, as a map of pointed sets","status":"ok"},"long":{"text":"An instance: [[AffineConstructive.theory.set.prod_proj1]] is a pointed map from (X × Y, (x, y)) to (X, x) for any points x and y. The projection of the pair is x by computation, so the required equality holds by reflexivity. The instances for the monoid unit, top, bottom, zero and one are this one, read at those points.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_pointed","base":"prod_proj2_pointed","kind":"inst","start":458,"body":null,"status":"ok","short":{"text":"The second projection X × Y ⇾ Y sends (x, y) to y, as a map of pointed sets","status":"ok"},"long":{"text":"An instance: [[AffineConstructive.theory.set.prod_proj2]] is a pointed map from (X × Y, (x, y)) to (Y, y) for any points x and y. The equality holds by reflexivity, since the projection computes. The instances for particular constants are this one, read at those constants.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_mon_unit_pointed","base":"prod_proj1_mon_unit_pointed","kind":"inst","start":459,"body":null,"status":"ok","short":{"text":"The first projection X × Y ⇾ X preserves the monoid unit","status":"ok"},"long":{"text":"An instance: the unit of X × Y is the pair (e, e), and the first projection sends it to e. It is [[AffineConstructive.theory.product_algebras.prod_proj1_pointed]] at the units, and the pointed half of [[AffineConstructive.theory.product_algebras.prod_proj1_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_top_pointed","base":"prod_proj1_top_pointed","kind":"inst","start":460,"body":null,"status":"ok","short":{"text":"The first projection X × Y ⇾ X preserves top","status":"ok"},"long":{"text":"An instance: the top of X × Y is (⊤, ⊤), and the first projection sends it to ⊤. It is [[AffineConstructive.theory.product_algebras.prod_proj1_pointed]] at the top elements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_bottom_pointed","base":"prod_proj1_bottom_pointed","kind":"inst","start":461,"body":null,"status":"ok","short":{"text":"The first projection X × Y ⇾ X preserves bottom","status":"ok"},"long":{"text":"An instance: the bottom of X × Y is (⊥, ⊥), and the first projection sends it to ⊥. It is [[AffineConstructive.theory.product_algebras.prod_proj1_pointed]] at the bottom elements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_zero_pointed","base":"prod_proj1_zero_pointed","kind":"inst","start":462,"body":null,"status":"ok","short":{"text":"The first projection X × Y ⇾ X preserves zero","status":"ok"},"long":{"text":"An instance: the zero of X × Y is (0, 0), and the first projection sends it to 0. It is [[AffineConstructive.theory.product_algebras.prod_proj1_pointed]] at the zeros, and the pointed half of [[AffineConstructive.theory.product_algebras.prod_proj1_add_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_one_pointed","base":"prod_proj1_one_pointed","kind":"inst","start":463,"body":null,"status":"ok","short":{"text":"The first projection X × Y ⇾ X preserves one","status":"ok"},"long":{"text":"An instance: the one of X × Y is (1, 1), and the first projection sends it to 1. It is [[AffineConstructive.theory.product_algebras.prod_proj1_pointed]] at the units of the multiplications.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_mon_unit_pointed","base":"prod_proj2_mon_unit_pointed","kind":"inst","start":464,"body":null,"status":"ok","short":{"text":"The second projection X × Y ⇾ Y preserves the monoid unit","status":"ok"},"long":{"text":"An instance: the second projection sends the unit (e, e) of X × Y to e. It is [[AffineConstructive.theory.product_algebras.prod_proj2_pointed]] at the units, and the pointed half of [[AffineConstructive.theory.product_algebras.prod_proj2_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_top_pointed","base":"prod_proj2_top_pointed","kind":"inst","start":465,"body":null,"status":"ok","short":{"text":"The second projection X × Y ⇾ Y preserves top","status":"ok"},"long":{"text":"An instance: the second projection sends the top (⊤, ⊤) of X × Y to ⊤. It is [[AffineConstructive.theory.product_algebras.prod_proj2_pointed]] at the top elements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_bottom_pointed","base":"prod_proj2_bottom_pointed","kind":"inst","start":466,"body":null,"status":"ok","short":{"text":"The second projection X × Y ⇾ Y preserves bottom","status":"ok"},"long":{"text":"An instance: the second projection sends the bottom (⊥, ⊥) of X × Y to ⊥. It is [[AffineConstructive.theory.product_algebras.prod_proj2_pointed]] at the bottom elements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_zero_pointed","base":"prod_proj2_zero_pointed","kind":"inst","start":467,"body":null,"status":"ok","short":{"text":"The second projection X × Y ⇾ Y preserves zero","status":"ok"},"long":{"text":"An instance: the second projection sends the zero (0, 0) of X × Y to 0. It is [[AffineConstructive.theory.product_algebras.prod_proj2_pointed]] at the zeros, and the pointed half of [[AffineConstructive.theory.product_algebras.prod_proj2_add_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_one_pointed","base":"prod_proj2_one_pointed","kind":"inst","start":468,"body":null,"status":"ok","short":{"text":"The second projection X × Y ⇾ Y preserves one","status":"ok"},"long":{"text":"An instance: the second projection sends the one (1, 1) of X × Y to 1. It is [[AffineConstructive.theory.product_algebras.prod_proj2_pointed]] at the units of the multiplications.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_sg_mor","base":"prod_proj1_sg_mor","kind":"inst","start":469,"body":[470,473],"status":"ok","short":{"text":"The first projection X × Y ⇾ X is a semigroup morphism","status":"ok"},"proof":[{"text":"X × Y is a semigroup under the coordinatewise operation ([[AffineConstructive.theory.product_algebras.prod_semigroup]]). What remains is that the first projection preserves the operation.","status":"ok","from":0,"to":1},{"text":"Fix x and y. The first coordinate of the product x·y is by definition the product of their first coordinates, so the equality holds by reflexivity.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_sg_mor","base":"prod_proj2_sg_mor","kind":"inst","start":474,"body":[475,478],"status":"ok","short":{"text":"The second projection X × Y ⇾ Y is a semigroup morphism","status":"ok"},"proof":[{"text":"X × Y is a semigroup under the coordinatewise operation ([[AffineConstructive.theory.product_algebras.prod_semigroup]]). What remains is that the second projection preserves the operation.","status":"ok","from":0,"to":1},{"text":"Fix x and y. The second coordinate of the product x·y is by definition the product of their second coordinates, so the equality holds by reflexivity.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_mon_mor","base":"prod_proj1_mon_mor","kind":"inst","start":479,"body":[480,482],"status":"ok","short":{"text":"The first projection X × Y ⇾ X is a monoid morphism","status":"ok"},"proof":[{"text":"The first projection preserves the operation by [[AffineConstructive.theory.product_algebras.prod_proj1_sg_mor]], and it preserves the unit by [[AffineConstructive.theory.product_algebras.prod_proj1_mon_unit_pointed]]. Together these make it a monoid morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_mon_mor","base":"prod_proj2_mon_mor","kind":"inst","start":483,"body":[484,486],"status":"ok","short":{"text":"The second projection X × Y ⇾ Y is a monoid morphism","status":"ok"},"proof":[{"text":"The second projection preserves the operation by [[AffineConstructive.theory.product_algebras.prod_proj2_sg_mor]], and it preserves the unit by [[AffineConstructive.theory.product_algebras.prod_proj2_mon_unit_pointed]]. Together these make it a monoid morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_add_sg_mor","base":"prod_proj1_add_sg_mor","kind":"inst","start":487,"body":null,"status":"ok","short":{"text":"The first projection X × Y ⇾ X preserves addition","status":"ok"},"long":{"text":"An instance: the additive form of [[AffineConstructive.theory.product_algebras.prod_proj1_sg_mor]]. The addition of X × Y is the coordinatewise one, and a map that preserves addition is a semigroup morphism for +, so the semigroup statement is reused unchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_add_sg_mor","base":"prod_proj2_add_sg_mor","kind":"inst","start":488,"body":null,"status":"ok","short":{"text":"The second projection X × Y ⇾ Y preserves addition","status":"ok"},"long":{"text":"An instance: the additive form of [[AffineConstructive.theory.product_algebras.prod_proj2_sg_mor]], the semigroup statement read at the coordinatewise addition of X × Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj1_add_mon_mor","base":"prod_proj1_add_mon_mor","kind":"inst","start":489,"body":null,"status":"ok","short":{"text":"The first projection X × Y ⇾ X is an additive monoid morphism","status":"ok"},"long":{"text":"An instance: the additive form of [[AffineConstructive.theory.product_algebras.prod_proj1_mon_mor]]. The first projection preserves the coordinatewise addition and the zero (0, 0) of X × Y, and the monoid statement is reused, read at + and 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.prod_proj2_add_mon_mor","base":"prod_proj2_add_mon_mor","kind":"inst","start":490,"body":null,"status":"ok","short":{"text":"The second projection X × Y ⇾ Y is an additive monoid morphism","status":"ok"},"long":{"text":"An instance: the additive form of [[AffineConstructive.theory.product_algebras.prod_proj2_mon_mor]]. The second projection preserves the coordinatewise addition and the zero of X × Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_pointed","base":"tensor_proj1_pointed","kind":"inst","start":515,"body":null,"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X sends (x, y) to x, as a map of pointed sets","status":"ok"},"long":{"text":"An instance: [[AffineConstructive.theory.set.tensor_proj1]] is a pointed map from (X ⊗ Y, (x, y)) to (X, x) for any points x and y. The projection computes, so the equality holds by reflexivity. The instances for the monoid unit, top, bottom, zero and one are this one, read at those constants.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_pointed","base":"tensor_proj2_pointed","kind":"inst","start":516,"body":null,"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y sends (x, y) to y, as a map of pointed sets","status":"ok"},"long":{"text":"An instance: [[AffineConstructive.theory.set.tensor_proj2]] is a pointed map from (X ⊗ Y, (x, y)) to (Y, y) for any points x and y. The equality holds by reflexivity, since the projection computes.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_mon_unit_pointed","base":"tensor_proj1_mon_unit_pointed","kind":"inst","start":517,"body":null,"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X preserves the monoid unit","status":"ok"},"long":{"text":"An instance: the first projection sends the unit (e, e) of X ⊗ Y to e. It is [[AffineConstructive.theory.product_algebras.tensor_proj1_pointed]] at the units, and the pointed half of [[AffineConstructive.theory.product_algebras.tensor_proj1_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_top_pointed","base":"tensor_proj1_top_pointed","kind":"inst","start":518,"body":null,"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X preserves top","status":"ok"},"long":{"text":"An instance: the first projection sends the top (⊤, ⊤) of X ⊗ Y to ⊤. It is [[AffineConstructive.theory.product_algebras.tensor_proj1_pointed]] at the top elements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_bottom_pointed","base":"tensor_proj1_bottom_pointed","kind":"inst","start":519,"body":null,"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X preserves bottom","status":"ok"},"long":{"text":"An instance: the first projection sends the bottom (⊥, ⊥) of X ⊗ Y to ⊥. It is [[AffineConstructive.theory.product_algebras.tensor_proj1_pointed]] at the bottom elements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_zero_pointed","base":"tensor_proj1_zero_pointed","kind":"inst","start":520,"body":null,"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X preserves zero","status":"ok"},"long":{"text":"An instance: the first projection sends the zero (0, 0) of X ⊗ Y to 0. It is [[AffineConstructive.theory.product_algebras.tensor_proj1_pointed]] at the zeros, and the pointed half of [[AffineConstructive.theory.product_algebras.tensor_proj1_add_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_one_pointed","base":"tensor_proj1_one_pointed","kind":"inst","start":521,"body":null,"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X preserves one","status":"ok"},"long":{"text":"An instance: the first projection sends the one (1, 1) of X ⊗ Y to 1. It is [[AffineConstructive.theory.product_algebras.tensor_proj1_pointed]] at the units of the multiplications.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_mon_unit_pointed","base":"tensor_proj2_mon_unit_pointed","kind":"inst","start":522,"body":null,"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y preserves the monoid unit","status":"ok"},"long":{"text":"An instance: the second projection sends the unit (e, e) of X ⊗ Y to e. It is [[AffineConstructive.theory.product_algebras.tensor_proj2_pointed]] at the units, and the pointed half of [[AffineConstructive.theory.product_algebras.tensor_proj2_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_top_pointed","base":"tensor_proj2_top_pointed","kind":"inst","start":523,"body":null,"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y preserves top","status":"ok"},"long":{"text":"An instance: the second projection sends the top (⊤, ⊤) of X ⊗ Y to ⊤. It is [[AffineConstructive.theory.product_algebras.tensor_proj2_pointed]] at the top elements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_bottom_pointed","base":"tensor_proj2_bottom_pointed","kind":"inst","start":524,"body":null,"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y preserves bottom","status":"ok"},"long":{"text":"An instance: the second projection sends the bottom (⊥, ⊥) of X ⊗ Y to ⊥. It is [[AffineConstructive.theory.product_algebras.tensor_proj2_pointed]] at the bottom elements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_zero_pointed","base":"tensor_proj2_zero_pointed","kind":"inst","start":525,"body":null,"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y preserves zero","status":"ok"},"long":{"text":"An instance: the second projection sends the zero (0, 0) of X ⊗ Y to 0. It is [[AffineConstructive.theory.product_algebras.tensor_proj2_pointed]] at the zeros, and the pointed half of [[AffineConstructive.theory.product_algebras.tensor_proj2_add_mon_mor]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_one_pointed","base":"tensor_proj2_one_pointed","kind":"inst","start":526,"body":null,"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y preserves one","status":"ok"},"long":{"text":"An instance: the second projection sends the one (1, 1) of X ⊗ Y to 1. It is [[AffineConstructive.theory.product_algebras.tensor_proj2_pointed]] at the units of the multiplications.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_sg_mor","base":"tensor_proj1_sg_mor","kind":"inst","start":527,"body":[528,530],"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X is a semigroup morphism","status":"ok"},"proof":[{"text":"The first projection out of X ⊗ Y factors through the comparison with the cartesian product: it is the first projection of X × Y composed with [[AffineConstructive.theory.set.tensor_to_prod]]. Both factors are semigroup morphisms ([[AffineConstructive.theory.product_algebras.tensor_to_prod_sg_mor]], [[AffineConstructive.theory.product_algebras.prod_proj1_sg_mor]]), and so is their composite ([[AffineConstructive.theory.groups.compose_semigroup_mor]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_sg_mor","base":"tensor_proj2_sg_mor","kind":"inst","start":531,"body":[532,534],"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y is a semigroup morphism","status":"ok"},"proof":[{"text":"The restatement in this step names the first projection, so it leaves the goal for the second projection unchanged. The goal is then proved directly. On X ⊗ Y the operation is coordinatewise ([[AffineConstructive.theory.product_algebras.tensor_semigroup]]), so the second coordinate of a product is by definition the product of the second coordinates, and the preservation law holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_mon_mor","base":"tensor_proj1_mon_mor","kind":"inst","start":535,"body":[536,538],"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X is a monoid morphism","status":"ok"},"proof":[{"text":"As in the semigroup case, the first projection out of X ⊗ Y is the first projection of X × Y composed with the comparison [[AffineConstructive.theory.set.tensor_to_prod]]. Both factors are monoid morphisms ([[AffineConstructive.theory.product_algebras.prod_proj1_mon_mor]], [[AffineConstructive.theory.product_algebras.tensor_to_prod_mon_mor]]), and so is their composite ([[AffineConstructive.theory.groups.compose_monoid_mor]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_mon_mor","base":"tensor_proj2_mon_mor","kind":"inst","start":539,"body":[540,542],"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y is a monoid morphism","status":"ok"},"proof":[{"text":"The restatement in this step names the first projection, so it leaves the goal for the second projection unchanged. The goal is then proved directly. The second projection preserves the operation by [[AffineConstructive.theory.product_algebras.tensor_proj2_sg_mor]], and it preserves the unit by [[AffineConstructive.theory.product_algebras.tensor_proj2_mon_unit_pointed]]. Together these make it a monoid morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_add_sg_mor","base":"tensor_proj1_add_sg_mor","kind":"inst","start":543,"body":null,"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X preserves addition","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.tensor_proj1_sg_mor]]: when X and Y are semigroups under +, the coordinatewise addition on X ⊗ Y makes the first projection a morphism for +. No new proof is needed. The additive classes are the multiplicative ones with + as the operation, so the semigroup instance already is this one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj2_add_sg_mor","base":"tensor_proj2_add_sg_mor","kind":"inst","start":544,"body":null,"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y preserves addition","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.product_algebras.tensor_proj2_sg_mor]]: for semigroups X and Y under +, the second projection out of the tensor product preserves the coordinatewise addition. The semigroup instance, with + as the operation, is this one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.product_algebras.tensor_proj1_add_mon_mor","base":"tensor_proj1_add_mon_mor","kind":"inst","start":545,"body":null,"status":"ok","

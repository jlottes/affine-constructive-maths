:= λ '(x, y), f x = f y.\n  Lemma projected_set_IsProjectedSet {A:Type@{u}} {Y:set@{u}} {f:A → set_T Y} : IsProjectedSet A (Ae:=projected_set_eq f) (f:=f).\n  Proof. easy. Qed.\n\n  Lemma projected_set_is_set {A:Type@{u}} `{IsProjectedSet A (f:=f) } : IsSet A. \n  Proof. split; hnf; intros; rew ?(is_projected_set (A:=A) _ _).\n  + refl.\n  + now apply symmetry.\n  + now apply transitivity.\n  Qed.\n  Coercion projected_set_is_set : IsProjectedSet >-> IsSet.\n\n  Definition projected_set_make (A:Type@{u}) `{H:IsProjectedSet A} := set_make A.\n  Definition projected_set {A:Type@{u}} {Y:set@{u}} (f:A → Y)\n    := projected_set_make A (H:=projected_set_IsProjectedSet (f:=f)).\n\n  Hint Extern 1 (IsProjectedSet (set_T (projected_set _))) => notypeclasses refine projected_set_IsProjectedSet : typeclass_instances.\n  Hint Extern 1 (IsProjectedSet (set_T (projected_set_make _ (H:=?H)))) => notypeclasses refine H : typeclass_instances.\n\n  Lemma projected_set_project_is_fun {X Y : set@{u}} {f:X → Y} {H:@IsProjectedSet X _ Y f} : IsFun f.\n  Proof. intros ??. now rew (is_projected_set (A:=X) _ _). Qed.\n\n  Definition projected_set_project (X:set@{u}) {Y : set@{u}} {f:X → Y} {H:@IsProjectedSet X _ Y f}\n    : X ⇾ Y := @func_make _ _ _ projected_set_project_is_fun.\n\n  Lemma projected_set_project_injective (X:set@{u}) {Y : set@{u}} {f:X → Y} {H:@IsProjectedSet X _ Y f}\n    : Injective (projected_set_project X).\n  Proof. intros x y. change (f x = f y ⊸ x = y). apply is_projected_set. Qed.\n\n  Context {X:set@{u}} `{H:IsProjectedSet X (Ae:=_) (Y:=Y) (f:=f)}.\n\n  Lemma projected_set_strong `{!StrongSet Y} : StrongSet X.\n  Proof. intros x y z. rew ?(is_projected_set (A:=X) _ _). now apply strong_transitivity. Qed.\n\n  Lemma projected_set_dec_eq `{!DecidableEquality Y} : DecidableEquality X.\n  Proof. intros [x y]. now rew ?(is_projected_set (A:=X) _ _). Qed.\n\n  Lemma projected_set_aff_eq `{!AffirmativeEquality Y} : AffirmativeEquality X.\n  Proof. intros [x y]. now rew ?(is_projected_set (A:=X) _ _). Qed.\n\n  Lemma projected_set_ref_eq `{!RefutativeEquality Y} : RefutativeEquality X.\n  Proof. intros [x y]. now rew ?(is_projected_set (A:=X) _ _). Qed.\nEnd projected_set.\n\nGlobal Hint Extern 1 (IsProjectedSet _ (Ae:=projected_set_eq _)) => simple notypeclasses refine projected_set_IsProjectedSet : typeclass_instances.\nGlobal Hint Extern 1 (IsSet _ (e:=projected_set_eq _)) => simple notypeclasses refine projected_set_IsProjectedSet : typeclass_instances.\nGlobal Hint Extern 1 (IsProjectedSet (set_T (projected_set _))) => notypeclasses refine projected_set_IsProjectedSet : typeclass_instances.\nGlobal Hint Extern 1 (IsProjectedSet (set_T (projected_set_make _ (H:=?H)))) => notypeclasses refine H : typeclass_instances.\nGlobal Hint Extern 2 (Injective (projected_set_project _)) => notypeclasses refine (projected_set_project_injective _) : typeclass_instances.\nGlobal Hint Extern 4 (StrongSet (projected_set_make _)) => simple notypeclasses refine projected_set_strong : typeclass_instances.\nGlobal Hint Extern 4 (StrongSet (projected_set      _)) => simple notypeclasses refine projected_set_strong : typeclass_instances.\nGlobal Hint Extern 4 (DecidableEquality   (projected_set_make _)) => simple notypeclasses refine projected_set_dec_eq : typeclass_instances.\nGlobal Hint Extern 4 (DecidableEquality   (projected_set      _)) => simple notypeclasses refine projected_set_dec_eq : typeclass_instances.\nGlobal Hint Extern 4 (AffirmativeEquality (projected_set_make _)) => simple notypeclasses refine projected_set_aff_eq : typeclass_instances.\nGlobal Hint Extern 4 (AffirmativeEquality (projected_set      _)) => simple notypeclasses refine projected_set_aff_eq : typeclass_instances.\nGlobal Hint Extern 4 (RefutativeEquality  (projected_set_make _)) => simple notypeclasses refine projected_set_ref_eq : typeclass_instances.\nGlobal Hint Extern 4 (RefutativeEquality  (projected_set      _)) => simple notypeclasses refine projected_set_ref_eq : typeclass_instances.\n\nDefinition projected_quotient_map `(f:X ⇾ Y) : _ ⇾ _ := @func_make X (projected_set f) id (is_fun f).\n\nLemma project_quotient_cancel@{u} {X Y Z:set@{u}} (f:X ⇾ Y) (g₁ g₂ : projected_set f ⇾ Z)\n  : g₁ ∘ projected_quotient_map f = g₂ ∘ projected_quotient_map f ⊸ g₁ = g₂.\nProof. refl. Qed.\n\nImport projection_notation.\n\nSection products.\n  Universes u.\n  Lemma IsProjectedSet_tensor {X Y : set@{u}} `{HX:IsProjectedSet X (Ae:=_) (Y:=X') (f:=f)} `{HY:IsProjectedSet Y (Ae:=_) (Y:=Y') (f:=g)}\n  : IsProjectedSet (X ⊗ Y) (f := λ p, tensor_pair (f (π₁ p)) (g (π₂ p))).\n  Proof. intros [x₁ y₁][x₂ y₂]. change (x₁ = x₂ ⊠ y₁ = y₂ ⧟ f x₁ = f x₂ ⊠ g y₁ = g y₂).\n    refine (aprod_proper_aiff _ _); exact (is_projected_set _ _).\n  Qed.\n\n  Lemma IsProjectedSet_prod {X Y : set@{u}} `{HX:IsProjectedSet X (Ae:=_) (Y:=X') (f:=f)} `{HY:IsProjectedSet Y (Ae:=_) (Y:=Y') (f:=g)}\n  : IsProjectedSet (X × Y) (f := λ p, prod_pair (f (π₁ p)) (g (π₂ p))).\n  Proof. intros [x₁ y₁][x₂ y₂]. change (x₁ = x₂ ∧ y₁ = y₂ ⧟ f x₁ = f x₂ ∧ g y₁ = g y₂).\n    refine (aand_proper_aiff _ _); exact (is_projected_set _ _).\n  Qed.\nEnd products.\n\nGlobal Hint Extern 2 (IsProjectedSet (set_T (_ ⊗ _))) => notypeclasses refine IsProjectedSet_tensor : typeclass_instances.\nGlobal Hint Extern 2 (IsProjectedSet (set_T (_ × _))) => notypeclasses refine IsProjectedSet_prod : typeclass_instances.\n\nSection functions.\n  Universes u.\n  Lemma projected_is_fun {X Y : set@{u}} `{HX:IsProjectedSet X (Ae:=_) (Y:=X') (f:=p)} `{HY:IsProjectedSet Y (Ae:=_) (Y:=Y') (f:=q)}\n    (f:X → Y) (g:X' ⇾ Y') : (∀ x, q (f x) = g (p x)) → IsFun f.\n  Proof. intros H x y.\n    rew [ (is_projected_set (A:=X) _ _) | (is_projected_set (A:=Y) _ _) ].\n    rew [ (H x) | (H y) ].\n    exact (is_fun g _ _).\n  Qed.\nEnd functions.\n\n(** Corestriction through a projection: an operation [mk] into a projected\n    set whose projection agrees (pointwise) with a morphism [f] into the\n    base is itself a morphism, and factors [f] through the projection.\n    Record-headed subcarriers plug in with [mk := λ x, Build_… (f x) (H x)]\n    and [mk_beta := λ x, refl] — the projection identity is definitional. *)\nSection corestrict.\n  Universes u.\n  Context {T Y : set@{u}} `{HT:IsProjectedSet T (Ae:=_) (Y:=Y) (f:=p)}.\n  Context {X : set@{u}} (f : X ⇾ Y).\n  Context (mk : X → T) (mk_beta : ∀ x, p (mk x) = f x).\n\n  Lemma subcarrier_corestrict_is_fun : IsFun mk.\n  Proof. intros x y.\n    rew (is_projected_set (A:=T) _ _).\n    rew [ (mk_beta x) | (mk_beta y) ].\n    exact (is_fun f _ _).\n  Qed.\n\n  Definition subcarrier_corestrict : X ⇾ T := @func_make _ _ mk subcarrier_corestrict_is_fun.\n\n  Lemma subcarrier_corestrict_factor : projected_set_project T ∘ subcarrier_corestrict = f.\n  Proof. intros x. exact (mk_beta x). Qed.\nEnd corestrict.\n\n","sentences":[{"i":0,"s":0,"e":38,"kind":"vernac","status":"ok","ms":24,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":39,"e":67,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":69,"e":91,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":3,"s":94,"e":106,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":4,"s":109,"e":237,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":5,"s":241,"e":338,"kind":"vernac","status":"ok","ms":11,"messages":["51c4c2eecda86d05"],"goals":null},{"i":6,"s":341,"e":468,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":{"fg":[{"id":"14","name":null,"hyps":["0efec766d2e23be3","4f15630b3b04708e","9036083550ad973d"],"ccl":"d4b1775abb2f33b8"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":7,"s":471,"e":477,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":{"fg":[{"id":"14","name":null,"hyps":["0efec766d2e23be3","4f15630b3b04708e","9036083550ad973d"],"ccl":"d4b1775abb2f33b8"}],"bg":[],"shelved":[],"given_up":[]},"uses" :1361,"e":1364,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":1365,"e":1368,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1945,"e":1948,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":1981,"e":1984,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2117,"e":2120,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2121,"e":2124,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2266,"e":2269,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2270,"e":2273,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":2413,"e":2416,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":2417,"e":2420,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":4558,"e":4562,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../tactics/easy.html"},{"s":5892,"e":5895,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":5967,"e":5970,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6686,"e":6689,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":6725,"e":6728,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[AffineConstructive.theory.projected_set.IsProjectedSet]] says this holds; [[AffineConstructive.theory.projected_set.projected_set]] builds such a set from any map; and [[AffineConstructive.theory.projected_set.projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[AffineConstructive.theory.projected_set.projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[AffineConstructive.theory.projected_set.projected_is_fun]] for a map that commutes with the projections, and [[AffineConstructive.theory.projected_set.subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients.","short":"Sets whose equality is pulled back along a map into another set","items":[{"name":"AffineConstructive.theory.projected_set.IsProjectedSet","base":"IsProjectedSet","kind":"ind","start":4,"body":null,"status":"ok","short":{"text":"A type's equality is that of its image under f: x = y ⧟ f x = f y","status":"ok"},"long":{"text":"For a type A with an affine equality and a map f : A → Y into a set, IsProjectedSet says that the equality of A is the one pulled back along f: two elements are equal exactly when their images are. Since the comparison is an affine equivalence ⧟, it also carries the dual statement: x and y are distinct exactly when f x and f y are, so inequality (apartness, when Y is strong) is pulled back too.\n\nThe class does not fix the equality on A. It records that a given equality agrees with the pulled-back one. This lets a subcarrier or a record type keep its own definition of equality and still use the lemmas of this file. The canonical instance is [[AffineConstructive.theory.projected_set.projected_set_eq]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.theory.projected_set.IsProjectedSet","base":"IsProjectedSet","kind":"rec","short":{"text":"The class saying the equality of A is pulled back along f","status":"ok"}},{"name":"AffineConstructive.theory.projected_set.is_projected_set","base":"is_projected_set","kind":"proj","short":{"text":"In a projected set, x = y if and only if f x = f y","status":"ok"}}]},{"name":"AffineConstructive.theory.projected_set.projected_set_eq","base":"projected_set_eq","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"The equality on A pulled back along f : A → Y, x = y meaning f x = f y","status":"ok"},"long":{"text":"Given any map f from a type A into a set Y, this is the affine equality on A that declares x and y equal when f x = f y in Y. It is the kernel of f, read as an equality. With it, A becomes a projected set by [[AffineConstructive.theory.projected_set.projected_set_IsProjectedSet]], and the result is the set [[AffineConstructive.theory.projected_set.projected_set]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.projected_set.projected_set_IsProjectedSet","base":"projected_set_IsProjectedSet","kind":"prf","start":6,"body":[7,9],"status":"ok","short":{"text":"The pulled-back equality projected_set_eq f makes A a projected set along f","status":"ok"},"proof":[{"text":"With the pulled-back equality [[AffineConstructive.theory.projected_set.projected_set_eq]], x = y in A is by definition f x = f y, so the required equivalence holds by reflexivity of ⧟.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.projected_set.projected_set_is_set","base":"projected_set_is_set","kind":"prf","start":10,"body":[11,19],"status":"ok","short":{"text":"A projected set's equality is an equivalence relation","status":"ok"},"proof":[{"text":"An equivalence relation needs reflexivity, symmetry and transitivity. In each, every equality in A is rewritten by [[AffineConstructive.theory.projected_set.is_projected_set]] into the equality of the images in Y, leaving the three laws for the equality of Y at the points f x, f y, f z.","status":"ok","from":0,"to":1},{"text":"Reflexivity: f x = f x holds in Y.","status":"ok","from":2,"to":3},{"text":"Symmetry: f x = f y implies f y = f x by symmetry of the equality of Y.","status":"ok","from":4,"to":5},{"text":"Transitivity: f x = f y ⊠ f y = f z gives f x = f z by transitivity in Y.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.theory.projected_set.projected_set.coercion:projected_set_is_set","base":"coercion:projected_set_is_set","kind":"coercion","start":20,"body":null,"status":"ok","short":{"text":"A projected set's equality serves as a set's equivalence relation, so the carrier is a set, through [[AffineConstructive.theory.projected_set.projected_set_is_set]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.projected_set.projected_set_make","base":"projected_set_make","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"The set built from a type whose equality is pulled back along a map","status":"ok"},"long":{"text":"Packages a type A, whose equality is pulled back along some map into a set, as a set. The equivalence-relation laws come from [[AffineConstructive.theory.projected_set.projected_set_is_set]]. Resolution can still recover the projected structure from the bundled set, so the transfer lemmas of this file apply to the result.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.projected_set.projected_set","base":"projected_set","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"The set on A whose equality is pulled back along f : A → Y","status":"ok"},"long":{"text":"For a map f from a type A into a set Y, this is the set with carrier A and equality x = y given by f x = f y, that is, [[AffineConstructive.theory.projected_set.projected_set_eq]]. When A is the carrier of a set X and f is a function X ⇾ Y, the result is X with its equality coarsened to the kernel of f: the coimage of f, which f maps injectively into Y. The identity map from X onto it is [[AffineConstructive.theory.projected_set.projected_quotient_map]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.projected_set.projected_set_project_is_fun","base":"projected_set_project_is_fun","kind":"prf","start":25,"body":[26,29],"status":"ok","short":{"text":"The projection of a projected set preserves equality","status":"ok"},"proof":[{"text":"Fix x₁ and x₂; it is to show that x₁ = x₂ implies f x₁ = f x₂.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.projected_set.is_projected_set]] the equality x₁ = x₂ is equivalent to f x₁ = f x₂, so its forward direction is the implication required.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.projected_set.projected_set_project","base":"projected_set_project","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"The projection of a projected set into its target, as a function","status":"ok"},"long":{"text":"The map f along which a projected set X has its equality, packaged as a function X ⇾ Y. It preserves equality by one direction of the defining equivalence. The other direction makes it injective ([[AffineConstructive.theory.projected_set.projected_set_project_injective]]). So a projected set is a set together with an injection into another set, which determines its equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.projected_set.projected_set_project_injective","base":"projected_set_project_injective","kind":"prf","start":31,"body":[32,36],"status":"ok","short":{"text":"The projection of a projected set is injective","status":"ok"},"proof":[{"text":"Fix x and y. The projection is f, so injectivity asks that f x = f y imply x = y.","status":"ok","from":0,"to":2},{"text":"This is the backward direction of the equivalence [[AffineConstructive.theory.projected_set.is_projected_set]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.projected_set.projected_set_strong","base":"projected_set_strong","kind":"prf","start":38,"body":[39,43],"status":"ok","short":{"text":"A set projected into a strong set is strong","status":"ok"},"proof":[{"text":"Fix x, y, z; strength asks that the additive conjunction x = y ∧ y = z imply x = z.","status":"ok","from":0,"to":1},{"text":"Rewriting each equality by [[AffineConstructive.theory.projected_set.is_projected_set]] turns this into the same statement for f x, f y, f z in Y, which is the strong transitivity of Y.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.projected_set.projected_set_dec_eq","base":"projected_set_dec_eq","kind":"prf","start":44,"body":[45,48],"status":"ok","short":{"text":"A set projected into a set with decidable equality has decidable equality","status":"ok"},"proof":[{"text":"Fix x and y; it is to show that x = y is decidable.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.projected_set.is_projected_set]] the equality x = y is equivalent to f x = f y, which is decidable because Y has decidable equality, and decidability passes along an equivalence.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.projected_set.projected_set_aff_eq","base":"projected_set_aff_eq","kind":"prf","start":49,"body":[50,53],"status":"ok","short":{"text":"A set projected into a set with affirmative equality has affirmative equality","status":"ok"},"proof":[{"text":"Fix x and y; it is to show that x = y is affirmative.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.projected_set.is_projected_set]] the equality x = y is equivalent to f x = f y, which is affirmative because Y has affirmative equality, and being affirmative passes along an equivalence.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.projected_set.projected_set_ref_eq","base":"projected_set_ref_eq","kind":"prf","start":54,"body":[55,58],"status":"ok","short":{"text":"A set projected into a set with refutative equality has refutative equality","status":"ok"},"proof":[{"text":"Fix x and y; it is to show that x = y is refutative.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.projected_set.is_projected_set]] the equality x = y is equivalent to f x = f y, which is refutative because Y has refutative equality, and being refutative passes along an equivalence.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.projected_set.projected_quotient_map","base":"projected_quotient_map","kind":"def","start":73,"body":null,"status":"ok","short":{"text":"The quotient map from X onto its coimage under f, the identity on elements","status":"ok"},"long":{"text":"For a function f : X ⇾ Y, the identity on elements, seen as a function from X to [[AffineConstructive.theory.projected_set.projected_set]] f, the same carrier with equality coarsened to f x = f y. It preserves equality because f does. It is the quotient of X by the kernel of f. Its elements are the elements of X, and only the equality changes. This is why it cancels on the right ([[AffineConstructive.theory.projected_set.project_quotient_cancel]]): two functions out of the quotient agree once they agree after this map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.projected_set.project_quotient_cancel","base":"project_quotient_cancel","kind":"prf","start":74,"body":[75,77],"status":"ok","short":{"text":"Functions out of the coimage of f that agree after the quotient map are equal","status":"ok"},"proof":[{"text":"The quotient map [[AffineConstructive.theory.projected_set.projected_quotient_map]] is the identity on the underlying points, so g₁ ∘ projected_quotient_map f = g₂ ∘ projected_quotient_map f is the same statement as g₁ = g₂, and the implication holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.projected_set.IsProjectedSet_tensor","base":"IsProjectedSet_tensor","kind":"prf","start":81,"body":[82,86],"status":"ok","short":{"text":"The tensor product of projected sets is projected along the paired projections","status":"ok"},"proof":[{"text":"Fix pairs (x₁, y₁) and (x₂, y₂). Equality in X ⊗ Y is the tensor of the two component equalities, and likewise in X' ⊗ Y', so the goal is x₁ = x₂ ⊠ y₁ = y₂ ⧟ f x₁ = f x₂ ⊠ g y₁ = g y₂.","status":"ok","from":0,"to":2},{"text":"The tensor respects equivalence in each factor, and [[AffineConstructive.theory.projected_set.is_projected_set]] gives each factor's equivalence, one for X along f and one for Y along g.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.projected_set.IsProjectedSet_prod","base":"IsProjectedSet_prod","kind":"prf","start":87,"body":[88,92],"status":"ok","short":{"text":"The cartesian product of projected sets is projected along the paired projections","status":"ok"},"proof":[{"text":"Take two pairs (x₁, y₁) and (x₂, y₂). Their equality in the cartesian product is the additive conjunction of the componentwise equalities, and the equality of their images is the additive conjunction x₁'s and x₂'s images agree and y₁'s and y₂'s images agree; it remains to show these two conjunctions are equivalent.","status":"ok","from":0,"to":2},{"text":"Additive conjunction respects equivalence in each argument, so it suffices to show each conjunct equivalent to its counterpart, and this is [[AffineConstructive.theory.projected_set.is_projected_set]] for X along f and for Y along g.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.projected_set.projected_is_fun","base":"projected_is_fun","kind":"prf","start":98,"body":[99,104],"status":"ok","short":{"text":"A map between projected sets that commutes with a function between the targets preserves equality","status":"ok"},"proof":[{"text":"Assume q (f x) = g (p x) for every x, and fix x and y in X; it remains to show that x = y implies f x = f y.","status":"ok","from":0,"to":1},{"text":"Both equalities are pulled back along the projections by [[AffineConstructive.theory.projected_set.is_projected_set]]: x = y becomes p x = p y in X', and f x = f y becomes q (f x) = q (f y) in Y'.","status":"ok","from":2,"to":2},{"text":"The hypothesis at x and at y replaces q (f x) by g (p x) and q (f y) by g (p y), by transitivity of equality in Y'. What remains, p x = p y implies g (p x) = g (p y), is that g preserves equality, [[AffineConstructive.interfaces.set.is_fun]].","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.theory.projected_set.subcarrier_corestrict_is_fun","base":"subcarrier_corestrict_is_fun","kind":"prf","start":111,"body":[112,117],"status":"ok","short":{"text":"A map into a projected set lifting a function into the base preserves equality","status":"ok"},"proof":[{"text":"Fix x and y in X. By [[AffineConstructive.theory.projected_set.is_projected_set]], mk x = mk y in T is equivalent to p (mk x) = p (mk y) in Y, so it suffices that x = y implies the latter.","status":"ok","from":0,"to":2},{"text":"Since p (mk x) = f x and p (mk y) = f y, transitivity in Y reduces the goal to x = y implying f x = f y, which holds because f is a function, [[AffineConstructive.interfaces.set.is_fun]].","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.theory.projected_set.subcarrier_corestrict","base":"subcarrier_corestrict","kind":"def","start":118,"body":null,"status":"ok","short":{"text":"The corestriction of f : X ⇾ Y to a projected set T, given a pointwise lift","status":"ok"},"long":{"text":"Let T be a projected set over Y with projection p, and let f : X ⇾ Y be a function. Suppose mk : X → T is a map whose projection agrees with f pointwise: p (mk x) = f x. Then mk is a function X ⇾ T. It preserves equality because T's equality is that of Y, and there it reduces to f's preservation of equality ([[AffineConstructive.theory.projected_set.subcarrier_corestrict_is_fun]]). By [[AffineConstructive.theory.projected_set.subcarrier_corestrict_factor]] it factors f through the projection.\n\nThe intended use is a subcarrier: a record whose elements are an element of Y together with a proof of membership. There mk pairs f x with a proof that it lies in the subset, and the agreement holds by reflexivity.\n\n```tikzcd\nX \\arrow[r, \"mk\"] \\arrow[dr, \"f\"'] & T \\arrow[d, \"p\"] \\\\\n & Y\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.projected_set.subcarrier_corestrict_factor","base":"subcarrier_corestrict_factor","kind":"prf","start":119,"body":[120,123],"status":"ok","short":{"text":"The corestriction followed by the projection is the original function f","status":"ok"},"proof":[{"text":"Equality of functions is pointwise: fix x. The composite sends x to p (mk x), which equals f x by the defining property of mk.","status":"ok","from":0,"to":3}]}],"diagrams":{"svg":{"\nX \\arrow[r, \"mk\"] \\arrow[dr, \"f\"'] & T \\arrow[d, \"p\"] \\\\\n & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='62.384pt' height='51.478pt' viewBox='0 0 62.384 51.478'>\n<defs>\n<path id='g1-1' d='M2.83679-2.75315H3.51985C3.65925-2.75315 3.74986-2.75315 3.74986-2.90649C3.74986-3.00407 3.65925-3.00407 3.53379-3.00407H2.88558C3.04589-3.88926 3.10165-4.20988 3.15741-4.41201C3.19226-4.56535 3.3456-4.71172 3.51288-4.71172C3.51985-4.71172 3.70804-4.71172 3.84047-4.62808C3.5547-4.53747 3.53379-4.28655 3.53379-4.24473C3.53379-4.09139 3.65228-3.98684 3.81259-3.98684C4.00078-3.98684 4.20988-4.14715 4.20988-4.41201C4.20988-4.73263 3.86835-4.90688 3.51288-4.90688C3.2062-4.90688 2. 12 3.39636-2.739 3.47604-2.82864L5.94612-5.66724Z'/>\n<\/defs>\n<g id='page1'>\n<g transform='matrix(.999739 0 0 .999739 0 51.478)'>\n<use x='6.279361' y='-37.654171' xlink:href='#g0-2'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 0 51.478)'>\n<use x='48.181423' y='-37.654171' xlink:href='#g0-1'/>\n<use x='47.785526' y='-5.636529' xlink:href='#g0-3'/>\n<\/g>\n<path d='M19.80378 11.32278H43.30762' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M40.90344 8.734521C41.37908 10.287501 42.43899 11.020821 43.50686 11.322781C42.43899 11.624741 41.37908 12.358061 40.90344 13.911041' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 .000002 51.478)'>\n<use x='26.004822' y='-42.474843' xlink:href='#g1-3'/>\n<use x='33.072399' y='-42.474843' xlink:href='#g1-2'/>\n<\/g>\n<path d='M18.90537 17.65794L42.99601 36.47717' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M42.69478 32.957554C42.113579 34.474137 42.497378 35.704489 43.152994 36.59982C42.125605 36.18039 40.838942 36.10578 39.508114 37.036755' stroke='currentColor' fill='none' stroke-width='.398468' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 51.477998)'>\n<use x='24.084869' y='-17.091682' xlink:href='#g1-1'/>\n<\/g>\n<path d='M51.79667 17.65794V34.78956' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M54.38493 32.38539C52.83195 32.86103 52.09863 33.92094 51.79667 34.98881C51.49471 33.92094 50.76139 32.86103 49.20841 32.38539' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 51.478)'>\n<use x='54.110499' y='-24.218796' xlink:href='#g1-4'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

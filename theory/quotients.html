e.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import logic.aprop easy.\nRequire Import theory.set interfaces.subset.\nRequire Import theory.product_algebras.\nRequire Import theory.subgroups.\nRequire Import theory.additive_groups.\nRequire Import rewrite.\n\nDefinition quotient_set (X:set) (R:𝒫 (X ⊗ X)) `{!Equivalence  R}: set := @set_make X R _.\n\nModule quotient_set_notation.\n  Notation \"X / R\" := (quotient_set X R) (at level 40) : set_scope.\nEnd quotient_set_notation.\nImport quotient_set_notation.\n\nSection to_quotient.\n  Context {X:set} (R:𝒫 (X ⊗ X)) `{!Equivalence R}.\n\n  Lemma quotient_subrel : Subrelation (@equiv X _) (@equiv (X/R) _).\n  Proof. intros [x y]. change (x = y ⊸ (x, y) ∊ R).\n    rew <-(equal_element R (x, x) (x, y)).\n    rew (aprod_true_r (reflexivity R x : (x, x) ∊ R)).\n    change (x = y ⊸ x = x ⊠ x = y).\n    now rew (aprod_true_l (reflexivity (=) x)).\n  Qed.\n\n  Lemma to_quotient_is_fun : @IsFun X (X/R) id.\n  Proof. intros x y. apply quotient_subrel. Qed.\n  Definition to_quotient := @func_make _ _ _ to_quotient_is_fun.\nEnd to_quotient.\n\nGlobal Hint Extern 2 (Subrelation (@equiv (set_T ?X) _) (@equiv (set_T (?X / _)) _)) => simple notypeclasses refine (quotient_subrel _) : typeclass_instances.\n\nSection lift_op.\n  Universes u.\n  Context {X:set@{u}} {R:𝒫 (X ⊗ X)} `{!Equivalence R}.\n  Context {Y:set@{u}} {S:𝒫 (Y ⊗ Y)} `{!Equivalence S}.\n  Context (f:X ⇾ Y) `{!MapsTo (tensor_map f f) R S}.\n\n  Definition quotient_lift_op_is_fun : @IsFun (X/R) (Y/S) f\n  := λ x₁ x₂, maps_to (tensor_map f f) R S (x₁, x₂).\n\n  Definition quotient_lift_op := @func_make _ _ _ quotient_lift_op_is_fun.\nEnd lift_op.\n\nSection lift_op2.\n  Universes u.\n  Context {X:set@{u}} {R:𝒫 (X ⊗ X)} `{!Equivalence R}.\n  Context {Y:set@{u}} {S:𝒫 (Y ⊗ Y)} `{!Equivalence S}.\n  Context {Z:set@{u}} {T:𝒫 (Z ⊗ Z)} `{!Equivalence T}.\n  Context (f:X ⊗ Y ⇾ Z) `{!MapsTo (tensor_map2 (f, f)) (R ⊗ S) T}.\n\n  Lemma quotient_lift_op2_is_fun : @IsFun ((X/R)⊗(Y/S)) (Z/T) f.\n  Proof. intros [x₁ y₁][x₂ y₂]. exact (maps_to (tensor_map2 (f, f)) (R ⊗ S) T ((x₁, x₂), (y₁, y₂))). Qed.\n\n  Definition quotient_lift_op2 := @func_make _ _ _ quotient_lift_op2_is_fun.\nEnd lift_op2.\n\nSection props.\n  Universes u.\n  Context {X:set@{u}} {R:𝒫 (X ⊗ X)} `{!Equivalence R}.\n  Context {Y:set@{u}} {S:𝒫 (Y ⊗ Y)} `{!Equivalence S}.\n  Context {Z:set@{u}} {T:𝒫 (Z ⊗ Z)} `{!Equivalence T}.\n\n  Local Ltac doit := intros H; hnf; intros; apply (quotient_subrel _ _), H.\n\n  Lemma quotient_associative       {f}     `{!MapsTo (tensor_map2 (f, f)) (R ⊗ R) R}                                           : @Associative      X     f   → Associative      (quotient_lift_op2 f).  Proof. doit. Qed.\n  Lemma quotient_commutative       {f}     `{!MapsTo (tensor_map2 (f, f)) (R ⊗ R) S}                                           : @Commutative      X Y   f   → Commutative      (quotient_lift_op2 f).  Proof. doit. Qed.\n  Lemma quotient_binary_idempotent {f}     `{!MapsTo (tensor_map2 (f, f)) (R ⊗ R) R}                                           : @BinaryIdempotent X     f   → BinaryIdempotent (quotient_lift_op2 f).  Proof. doit. Qed.\n  (*Lemma quotient_involutive        {f}     `{!MapsTo (tensor_map   f f  )  R      R}                                           : @Involutive       X     f   → Involutive       (quotient_lift_op  f).  Proof. doit. Qed.*)\n  Lemma quotient_absorption        {f g}   `{!MapsTo (tensor_map2 (f, f)) (R ⊗ T) R, !MapsTo (tensor_map2 (g, g)) (R ⊗ S) T} : @Absorption       X Y Z f g → Absorption       (quotient_lift_op2 f) (quotient_lift_op2 g).  Proof. doit. Qed.\n  Lemma quotient_left_distribute   {f g}   `{!MapsTo (tensor_map2 (f, f)) (R ⊗ R) R, !MapsTo (tensor_map2 (g, g)) (R ⊗ R) R} : @LeftDistribute   X     f g → LeftDistribute   (quotient_lift_op2 f) (quotient_lift_op2 g).  Proof. doit. Qed.\n  Lemma quotient_right_distribute  {f g}   `{!MapsTo (tensor_map2 (f, f)) (R ⊗ R) R, !MapsTo (tensor_map2 (g, g)) (R ⊗ R) R} : @RightDistribute  X     f g → RightDistribute  (quotient_lift_op2 f) (quotient_lift_op2 g).  Proof. doit. Qed.\n\n  Lemma quotient_left_identity     {f   x} `{!MapsTo (tensor_map2 (f, f)) (R ⊗ S) S}                                           : @LeftIdentity     X Y   f x → LeftIdentity     (quotient_lift_op2 f) (to_quotient R x).  Proof. doit. Qed.\n  Lemma quotient_right_identity    {f   y} `{!MapsTo (tensor_map2 (f, f)) (R ⊗ S) R}                                           : @RightIdentity    X Y   f y → RightIdentity    (quotient_lift_op2 f) (to_quotient S y).  Proof. doit. Qed.\n  Lemma quotient_left_absorb       {f   x} `{!MapsTo (tensor_map2 (f, f)) (R ⊗ S) R}                                           : @LeftAbsorb       X Y   f x → LeftAbsorb       (quotient_lift_op2 f) (to_quotient R x).  Proof. doit. Qed.\n  Lemma quotient_right_absorb      {f   y} `{!MapsTo (tensor_map2 (f, f)) (R ⊗ S) S}                                           : @RightAbsorb      X Y   f y → RightAbsorb      (quotient_lift_op2 f) (to_quotient S y).  Proof. doit. Qed.\n\n  Lemma quotient_left_inverse      {f g z} `{!MapsTo (tensor_map2 (f, f)) (R ⊗ S) T, !MapsTo (tensor_map  g g   )  S      R} : @LeftInverse      X Y Z f g z → LeftInverse    (quotient_lift_op2 f) (quotient_lift_op g) (to_quotient T z).  Proof. doit. Qed.\n  Lemma quotient_right_inverse     {f g z} `{!MapsTo (tensor_map2 (f, f)) (R ⊗ S) T, !MapsTo (tensor_map  g g   )  R      S} : @RightInverse     X Y Z f g z → RightInverse   (quotient_lift_op2 f) (quotient_lift_op g) (to_quotient T z).  Proof. doit. Qed.\nEnd props.\n\nLocal Instance quotient_sg_op_closed `{H1:SemiGroup (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:SubSemiGroup R}\n  : MapsTo (tensor_map2 (sg_op, sg_op)) (R ⊗ R) R.\nProof. intros [p q]. exact (sub_sg_closed R p q). Qed.\n\nLocal Instance quotient_inv_closed `{H1:Group (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:SubGroup R}\n  : MapsTo (tensor_map inv inv) R R.\nProof. exact (sub_inv_closed R). Qed.\n\nLocal Instance quotient_plus_closed@{u}: ∀ {X:set@{u}} `{H1:AdditiveNonComSemiGroup (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:AdditiveSubSemiGroup R},\n  MapsTo (tensor_map2 (plus, plus)) (R ⊗ R) R := @quotient_sg_op_closed.\n\nLocal Instance quotient_mult_closed@{u}: ∀ {X:set@{u}} `{H1:MultiplicativeSemiGroup (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:MultiplicativeSubSemiGroup R},\n  MapsTo (tensor_map2 (mult, mult)) (R ⊗ R) R := @quotient_sg_op_closed.\n\nLocal Instance quotient_negate_closed@{u}: ∀ {X:set@{u}} `{H1:AdditiveNonComGroup (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:AdditiveSubGroup R},\n  MapsTo (tensor_map negate negate) R R := @quotient_inv_closed.\n\nDefinition quotient_sg_op `{H1:SemiGroup (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:SubSemiGroup R} : SgOp (X / R) := quotient_lift_op2 sg_op.\nDefinition quotient_inv   `{H1:Group (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:SubGroup R} : Inv (X / R) := quotient_lift_op inv.\n\nDefinition quotient_plus   `{H1:AdditiveNonComSemiGroup (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:AdditiveSubSemiGroup R} : Plus (X / R) := quotient_lift_op2 plus.\nDefinition quotient_mult   `{H1:MultiplicativeSemiGroup (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:MultiplicativeSubSemiGroup R} : Mult (X / R) := quotient_lift_op2 mult.\nDefinition quotient_negate `{H1:AdditiveNonComGroup (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {H:AdditiveSubGroup R} : Negate (X / R) := quotient_lift_op negate.\n\nGlobal Hint Extern 2 (SgOp   (_ / _)) => simple notypeclasses refine quotient_sg_op  : typeclass_instances.\nGlobal Hint Extern 2 (Inv    (_ / _)) => simple notypeclasses refine quotient_inv    : typeclass_instances.\nGlobal Hint Extern 2 (Plus   (_ / _)) => simple notypeclasses refine quotient_plus   : typeclass_instances.\nGlobal Hint Extern 2 (Mult   (_ / _)) => simple notypeclasses refine quotient_mult   : typeclass_instances.\nGlobal Hint Extern 2 (Negate (_ / _)) => simple notypeclasses refine quotient_negate : typeclass_instances.\n\nGlobal Hint Extern 2 (MonUnit (?X / _)) => change (MonUnit X) : typeclass_instances.\nGlobal Hint Extern 2 (Zero    (?X / _)) => change (Zero X) : typeclass_instances.\nGlobal Hint Extern 2 (One     (?X / _)) => change (One X) : typeclass_instances.\n\n\nLemma quotient_semigroup `{SemiGroup (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubSemiGroup R} : SemiGroup (X / R).\nProof. red. now apply quotient_associative. Qed.\nGlobal Hint Extern 2 (SemiGroup (_ / _)) => simple notypeclasses refine quotient_semigroup : typeclass_instances.\n\nLemma quotient_com_semigroup `{CommutativeSemiGroup (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubSemiGroup R} : CommutativeSemiGroup (X / R).\nProof. split; try exact _. now apply quotient_commutative. Qed.\nGlobal Hint Extern 2 (CommutativeSemiGroup (_ / _)) => simple notypeclasses refine quotient_com_semigroup : typeclass_instances.\n\nLemma quotient_semilattice `{SemiLattice (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubSemiGroup R} : SemiLattice (X / R).\nProof. split; try exact _. now apply quotient_binary_idempotent. Qed.\nGlobal Hint Extern 2 (SemiLattice (_ / _)) => simple notypeclasses refine quotient_semilattice : typeclass_instances.\n\nLemma quotient_monoid `{Monoid (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubSemiGroup R} : Monoid (X / R).\nProof. split; try exact _.\n* now apply quotient_left_identity.\n* now apply quotient_right_identity.\nQed.\nGlobal Hint Extern 2 (Monoid (_ / _)) => simple notypeclasses refine quotient_monoid : typeclass_instances.\n\nLemma quotient_com_monoid `{CommutativeMonoid (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubSemiGroup R} : CommutativeMonoid (X / R).\nProof. split; try exact _. now apply quotient_commutative. Qed.\nGlobal Hint Extern 2 (CommutativeMonoid (_ / _)) => simple notypeclasses refine quotient_com_monoid : typeclass_instances.\n\nLocal Instance quotient_bounded_sl `{BoundedSemiLattice (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubSemiGroup R} : BoundedSemiLattice (X / R).\nProof. now split. Qed.\nGlobal Hint Extern 2 (BoundedSemiLattice (_ / _)) => simple notypeclasses refine quotient_bounded_sl : typeclass_instances.\n\nLemma quotient_group `{Group (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubGroup R} : Group (X / R).\nProof. split; try exact _.\n* now apply quotient_left_inverse.\n* now apply quotient_right_inverse.\nQed.\nGlobal Hint Extern 2 (Group (_ / _)) => simple notypeclasses refine quotient_group : typeclass_instances.\n\nLemma quotient_abgroup `{AbGroup (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubGroup R} : AbGroup (X / R).\nProof. split; try exact _. now apply quotient_commutative. Qed.\nGlobal Hint Extern 2 (AbGroup (_ / _)) => simple notypeclasses refine quotient_abgroup : typeclass_instances.\n\n\nDefinition quotient_add_nc_sg  `{AdditiveNonComSemiGroup (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !AdditiveSubSemiGroup R} : AdditiveNonComSemiGroup (X / R) := quotient_semigroup.\nDefinition quotient_add_nc_mon `{AdditiveNonComMonoid    (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !AdditiveSubSemiGroup R} : AdditiveNonComMonoid    (X / R) := quotient_monoid.\nDefinition quotient_add_mon    `{AdditiveMonoid          (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !AdditiveSubSemiGroup R} : AdditiveMonoid          (X / R) := quotient_com_monoid.\nDefinition quotient_add_nc_grp `{AdditiveNonComGroup     (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !AdditiveSubGroup     R} : AdditiveNonComGroup     (X / R) := quotient_group.\nDefinition quotient_add_grp    `{AdditiveGroup           (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !AdditiveSubGroup     R} : AdditiveGroup           (X / R) := quotient_abgroup.\n\nDefinition quotient_mult_sg     `{MultiplicativeSemiGroup (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !MultiplicativeSubSemiGroup R} : MultiplicativeSemiGroup (X / R) := quotient_semigroup.\nDefinition quotient_mult_mon    `{MultiplicativeMonoid    (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !MultiplicativeSubSemiGroup R} : MultiplicativeMonoid    (X / R) := quotient_monoid.\nDefinition quotient_mult_com_mon`{MultiplicativeComMonoid (R:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !MultiplicativeSubSemiGroup R} : MultiplicativeComMonoid (X / R) := quotient_com_monoid.\n\nGlobal Hint Extern 2 (AdditiveNonComSemiGroup (_ / _)) => simple notypeclasses refine quotient_add_nc_sg : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveNonComMonoid    (_ / _)) => simple notypeclasses refine quotient_add_nc_mon : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveMonoid          (_ / _)) => simple notypeclasses refine quotient_add_mon : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveNonComGroup     (_ / _)) => simple notypeclasses refine quotient_add_nc_grp : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveGroup           (_ / _)) => simple notypeclasses refine quotient_add_grp : typeclass_instances.\n\nGlobal Hint Extern 2 (MultiplicativeSemiGroup (_ / _)) => simple notypeclasses refine quotient_mult_sg : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeMonoid    (_ / _)) => simple notypeclasses refine quotient_mult_mon : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeComMonoid (_ / _)) => simple notypeclasses refine quotient_mult_com_mon : typeclass_instances.\n\n\nLemma to_quotient_pointed {X:set} {R:𝒫 (X ⊗ X)} `{!Equivalence R} {x:X} : Pointed_Morphism x (to_quotient R x) (to_quotient R).\nProof. exact (reflexivity (=) (to_quotient R x)). Qed.\nGlobal Hint Extern 2 (Pointed_Morphism _ _ (to_quotient _)) => simple notypeclasses refine to_quotient_pointed : typeclass_instances.\n\nDefinition to_quotient_mon_unit_pointed {X:set} {R:𝒫 (X ⊗ X)} `{!Equivalence R} `{MonUnit X} : MonUnit_Pointed_Morphism (to_quotient R) := to_quotient_pointed.\nDefinition to_quotient_top_pointed {X:set} {R:𝒫 (X ⊗ X)} `{!Equivalence R} `{Top X} : Top_Pointed_Morphism (to_quotient R) := to_quotient_pointed.\nDefinition to_quotient_bottom_pointed {X:set} {R:𝒫 (X ⊗ X)} `{!Equivalence R} `{Bottom X} : Bottom_Pointed_Morphism (to_quotient R) := to_quotient_pointed.\nDefinition to_quotient_zero_pointed {X:set} {R:𝒫 (X ⊗ X)} `{!Equivalence R} `{Zero X} : Zero_Pointed_Morphism (to_quotient R) := to_quotient_pointed.\nDefinition to_quotient_one_pointed {X:set} {R:𝒫 (X ⊗ X)} `{!Equivalence R} `{One X} : One_Pointed_Morphism (to_quotient R) := to_quotient_pointed.\nGlobal Hint Extern 2 (MonUnit_Pointed_Morphism (to_quotient _)) => simple notypeclasses refine to_quotient_mon_unit_pointed : typeclass_instances.\nGlobal Hint Extern 2 (Top_Pointed_Morphism (to_quotient _)) => simple notypeclasses refine to_quotient_top_pointed : typeclass_instances.\nGlobal Hint Extern 2 (Bottom_Pointed_Morphism (to_quotient _)) => simple notypeclasses refine to_quotient_bottom_pointed : typeclass_instances.\nGlobal Hint Extern 2 (Zero_Pointed_Morphism (to_quotient _)) => simple notypeclasses refine to_quotient_zero_pointed : typeclass_instances.\nGlobal Hint Extern 2 (One_Pointed_Morphism (to_quotient _)) => simple notypeclasses refine to_quotient_one_pointed : typeclass_instances.\n\nLemma to_quotient_sg_mor `{SemiGroup (X:=X)} {R:𝒫 (X ⊗ X)} `{!Equivalence R, !SubSemiGroup R} : SemiGroup_Morphism (to ocal":false,"page":"../tactics/easy.html"},{"s":9814,"e":9817,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10084,"e":10087,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10119,"e":10122,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":10398,"e":10401,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":14977,"e":14980,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":15265,"e":15268,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":19056,"e":19059,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file builds the quotient X / R of a set X by an equivalence relation R ⊆ X ⊗ X. It keeps the carrier of X and takes R as the new equality. Since R contains the equality of X ([[AffineConstructive.theory.quotients.quotient_subrel]]), the identity map is a function [[AffineConstructive.theory.quotients.to_quotient]] from X to X / R. A function, or a binary operation on a tensor product, descends to quotients when it maps the relevant relations into each other ([[AffineConstructive.theory.quotients.quotient_lift_op]], [[AffineConstructive.theory.quotients.quotient_lift_op2]]). Each algebraic law then holds on the quotient once it holds on X: associativity, commutativity, idempotency, absorption, distributivity, identities, absorbing elements and inverses. From these laws the file gets the quotient semigroup, monoid, semilattice, group and abelian group, along with their additive and multiplicative readings, whenever R is a subsemigroup or subgroup of X ⊗ X. Finally, [[AffineConstructive.theory.quotients.to_quotient]] and lifted maps are shown to be pointed maps, semigroup morphisms and monoid morphisms.","short":"Quotient sets by equivalence relations, lifted operations, and quotient semigroups, monoids and groups","items":[{"name":"AffineConstructive.theory.quotients.quotient_set","base":"quotient_set","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"The quotient X / R: the carrier of X with the equivalence relation R as its equality","status":"ok"},"long":{"text":"Given a set X and an equivalence relation R, a subset of the tensor product X ⊗ X, the quotient X / R is the set with the same elements as X and with R as its equality: in X / R, x = y means (x, y) ∊ R. No equivalence classes are formed. The quotient changes only what counts as equal.\n\nTaking R in 𝒫 (X ⊗ X) rather than in 𝒫 (X × X) means that membership in R respects the equality of X multiplicatively: x = x' ⊠ y = y' ⊠ (x, y) ∊ R implies (x', y') ∊ R. This is the form a set's equality takes, so with [[AffineConstructive.interfaces.aprop.Equivalence]] R the quotient is a set built by [[AffineConstructive.interfaces.set.set_make]]. Because R is an affine relation, the quotient also gets an inequality, the refutation of R. Two elements are apart in X / R exactly when R refutes their relation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_subrel","base":"quotient_subrel","kind":"prf","start":13,"body":[14,21],"status":"ok","short":{"text":"Equality in X implies equality in X / R: the equality of X is contained in R","status":"ok"},"proof":[{"text":"Fix a pair (x, y) of elements of X. Equality in X/R is relatedness under R, so the goal is that x = y implies (x, y) ∊ R.","status":"ok","from":0,"to":2},{"text":"Membership respects equality ([[AffineConstructive.interfaces.subset.equal_element]]), so it suffices to show (x, x) = (x, y) together with (x, x) ∊ R. R is reflexive, so the second factor holds and drops out, leaving (x, x) = (x, y) to show from x = y.","status":"ok","from":3,"to":4},{"text":"Equality of pairs in X ⊗ X is the tensor x = x ⊠ x = y of the componentwise equalities. The first factor holds by reflexivity of the equality of X and drops out, and what remains is the hypothesis x = y.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.quotients.to_quotient_is_fun","base":"to_quotient_is_fun","kind":"prf","start":22,"body":[23,26],"status":"ok","short":{"text":"The identity on elements preserves equality from X to X / R","status":"ok"},"proof":[{"text":"Fix x and y in X. The identity carries x = y in X to x = y in X/R, which is [[AffineConstructive.theory.quotients.quotient_subrel]].","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.theory.quotients.to_quotient","base":"to_quotient","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"The quotient map X ⇾ X / R, the identity on elements","status":"ok"},"long":{"text":"The quotient map sends each element of X to itself, now read in X / R. It is a function of sets because equality in X implies equality in the quotient ([[AffineConstructive.theory.quotients.quotient_subrel]]). By the contrapositive that every affine implication carries, it is strongly extensional: elements apart in the quotient are apart in X.\n\nIts main use is to name elements of the quotient as images of elements of X, such as the identity, the zero or a chosen constant, when stating that a lifted operation has an identity or an absorbing element.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op_is_fun","base":"quotient_lift_op_is_fun","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"A map f : X ⇾ Y taking R into S preserves equality from X / R to Y / S","status":"ok"},"long":{"text":"This is the proof that a map f : X ⇾ Y also defines a function X / R ⇾ Y / S. The hypothesis is that f ⊗ f maps R into S, which means (x₁, x₂) ∊ R implies (f x₁, f x₂) ∊ S. That is exactly the statement that f preserves the quotient equalities, so the proof is that hypothesis applied to the pair. As an affine implication it also says that f reflects apartness, from S back to R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op","base":"quotient_lift_op","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"The map X / R ⇾ Y / S induced by f : X ⇾ Y when f ⊗ f maps R into S","status":"ok"},"long":{"text":"A map f : X ⇾ Y descends to the quotients when it sends R-related pairs to S-related pairs, that is, when f ⊗ f maps R into S. The induced function has the same action on elements as f. Only the equalities of its domain and codomain change, and [[AffineConstructive.theory.quotients.quotient_lift_op_is_fun]] shows that it respects them.\n\nThe file uses this for unary operations, such as the inverse of a group or the negation of an additive group, and for morphisms between algebras whose congruences correspond.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op2_is_fun","base":"quotient_lift_op2_is_fun","kind":"prf","start":44,"body":[45,48],"status":"ok","short":{"text":"A binary f taking R ⊗ S into T preserves equality from (X / R) ⊗ (Y / S) to Z / T","status":"ok"},"proof":[{"text":"Fix two pairs (x₁, y₁) and (x₂, y₂) in (X/R) ⊗ (Y/S). Their equality is the tensor of x₁ and x₂ being R-related and y₁ and y₂ being S-related, that is, membership of ((x₁, x₂), (y₁, y₂)) in R ⊗ S.","status":"ok","from":0,"to":1},{"text":"The hypothesis that f, applied in each coordinate, maps R ⊗ S into T then gives (f (x₁, y₁), f (x₂, y₂)) ∊ T, and this is the required equality in Z/T.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op2","base":"quotient_lift_op2","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"The binary operation on quotients induced by f : X ⊗ Y ⇾ Z when f respects R, S and T","status":"ok"},"long":{"text":"A binary operation f : X ⊗ Y ⇾ Z descends to (X / R) ⊗ (Y / S) ⇾ Z / T when it sends a pair of related arguments to related results: (x₁, x₂) ∊ R ⊠ (y₁, y₂) ∊ S implies (f(x₁, y₁), f(x₂, y₂)) ∊ T. This is the condition that f applied coordinatewise maps R ⊗ S into T.\n\nThe tensor is the right connective. Equality on the tensor product (X / R) ⊗ (Y / S) is the multiplicative conjunction of the two coordinate equalities, so the condition is exactly that f preserves equality there. For an operation on a single set with R = S = T, the condition says that R is a congruence. In the algebraic case this is the hypothesis that R is a subsemigroup of X ⊗ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.doit","base":"doit","kind":"ltac","start":56,"body":null,"status":"ok","short":{"text":"Moves an algebraic law of an operation on X to its lift on the quotient","status":"ok"},"long":{"text":"The goal is an implication: a law holds for an operation on the underlying sets, so it holds for the lifted operation on the quotients. Associativity, commutativity, idempotency, absorption, distributivity, identities, absorbing elements and inverses are all handled this way. The tactic takes the law on the underlying sets as a hypothesis and unfolds the law on the quotient to its statement for arbitrary elements, then fixes those elements. What remains is an equation in a quotient Z/T. The lifted operation computes as the original one on representatives, so the two sides are the same expressions as in the law on Z. The tactic reduces the equation to an equality of Z by [[AffineConstructive.theory.quotients.quotient_subrel]], since equality in Z implies relatedness under T, and closes the goal with the hypothesis at the fixed elements.\n\nThe lemmas of the section all have this one-line proof. They differ only in which law they state and which closure conditions make the lifts well defined. The tactic is local to the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_associative","base":"quotient_associative","kind":"prf","start":57,"body":[58,60],"status":"ok","short":{"text":"If f is associative on X, its lift to X / R is associative","status":"ok"},"proof":[{"text":"The lift of f to X/R agrees with f on elements, so each instance of associativity in X/R is an instance of associativity in X. An equality in X implies the same equality in X/R ([[AffineConstructive.theory.quotients.quotient_subrel]]), so the law transfers.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_commutative","base":"quotient_commutative","kind":"prf","start":61,"body":[62,64],"status":"ok","short":{"text":"If f : X ⊗ X ⇾ Y is commutative, so is its lift to the quotients","status":"ok"},"proof":[{"text":"The lift of f to the quotients agrees with f on elements, so each instance of commutativity in Y/S is an instance of commutativity in Y. An equality in Y implies the same equality in Y/S ([[AffineConstructive.theory.quotients.quotient_subrel]]), so the law transfers.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_binary_idempotent","base":"quotient_binary_idempotent","kind":"prf","start":65,"body":[66,68],"status":"ok","short":{"text":"If f is idempotent on X, its lift to X / R is idempotent","status":"ok"},"proof":[{"text":"The lift of f to X/R agrees with f on elements, so the idempotency f (x, x) = x in X/R is the same equation in X. An equality in X implies the same equality in X/R ([[AffineConstructive.theory.quotients.quotient_subrel]]), so the law transfers.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_absorption","base":"quotient_absorption","kind":"prf","start":69,"body":[70,72],"status":"ok","short":{"text":"If f absorbs g, the lifts of f and g to the quotients satisfy the same absorption law","status":"ok"},"proof":[{"text":"The lifts of f and g agree with f and g on elements, so each instance of the absorption law in the quotients is an instance of the law in X. An equality in X implies the same equality in X/R ([[AffineConstructive.theory.quotients.quotient_subrel]]), so the law transfers.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_left_distribute","base":"quotient_left_distribute","kind":"prf","start":73,"body":[74,76],"status":"ok","short":{"text":"If f distributes over g on the left, so do their lifts to X / R","status":"ok"},"proof":[{"text":"The lifts of f and g agree with f and g on elements, so each instance of left distributivity in X/R is an instance of the law in X. An equality in X implies the same equality in X/R ([[AffineConstructive.theory.quotients.quotient_subrel]]), so the law transfers.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_right_distribute","base":"quotient_right_distribute","kind":"prf","start":77,"body":[78,80],"status":"ok","short":{"text":"If f distributes over g on the right, so do their lifts to X / R","status":"ok"},"proof":[{"text":"The lifts of f and g agree with f and g on elements, so each instance of right distributivity in X/R is an instance of the law in X. An equality in X implies the same equality in X/R ([[AffineConstructive.theory.quotients.quotient_subrel]]), so the law transfers.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_left_identity","base":"quotient_left_identity","kind":"prf","start":81,"body":[82,84],"status":"ok","short":{"text":"A left identity x for f gives the left identity x in the quotient for the lift of f","status":"ok"},"proof":[{"text":"The lift of f agrees with f on elements, and x has the same image in the quotient, so for each y the equation f (x, y) = y in Y/S is the same equation in Y. An equality in Y implies the same equality in Y/S ([[AffineConstructive.theory.quotients.quotient_subrel]]), so the identity law transfers.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_right_identity","base":"quotient_right_identity","kind":"prf","start":85,"body":[86,88],"status":"ok","short":{"text":"A right identity y for f gives the right identity y in the quotient for the lift of f","status":"ok"},"proof":[{"text":"In the quotient, the right identity law asks for each x that f(x, y) be R-related to x. The identity law in X gives the equality f(x, y) = x. Equality in X implies relatedness under R ([[AffineConstructive.theory.quotients.quotient_subrel]]), which proves the law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_left_absorb","base":"quotient_left_absorb","kind":"prf","start":89,"body":[90,92],"status":"ok","short":{"text":"A left absorbing element x for f stays left absorbing for the lift of f","status":"ok"},"proof":[{"text":"In the quotient, the absorption law asks for each y that f(x, y) be R-related to x. Absorption in X gives this as an equality of X. Equality in X implies relatedness under R ([[AffineConstructive.theory.quotients.quotient_subrel]]), which proves the law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_right_absorb","base":"quotient_right_absorb","kind":"prf","start":93,"body":[94,96],"status":"ok","short":{"text":"A right absorbing element y for f stays right absorbing for the lift of f","status":"ok"},"proof":[{"text":"In the quotient, the absorption law asks for each x that f(x, y) be S-related to y. Absorption in Y gives this as an equality of Y. Equality in Y implies relatedness under S ([[AffineConstructive.theory.quotients.quotient_subrel]]), which proves the law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_left_inverse","base":"quotient_left_inverse","kind":"prf","start":97,"body":[98,100],"status":"ok","short":{"text":"If g gives left inverses for f with respect to z, the lifts of g and f do too","status":"ok"},"proof":[{"text":"In the quotients, the inverse law asks that each value of f on an element paired with its g-inverse be T-related to z. The law in the original sets gives this as an equality in Z. Equality in Z implies relatedness under T ([[AffineConstructive.theory.quotients.quotient_subrel]]), which proves the law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_right_inverse","base":"quotient_right_inverse","kind":"prf","start":101,"body":[102,104],"status":"ok","short":{"text":"If g gives right inverses for f with respect to z, the lifts of g and f do too","status":"ok"},"proof":[{"text":"In the quotients, the inverse law asks that each value of f on an element paired with its g-inverse be T-related to z. The law in the original sets gives this as an equality in Z. Equality in Z implies relatedness under T ([[AffineConstructive.theory.quotients.quotient_subrel]]), which proves the law.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_sg_op_closed","base":"quotient_sg_op_closed","kind":"inst","start":106,"body":[107,110],"status":"ok","short":{"text":"A subsemigroup R of X ⊗ X is a congruence: the operation applied coordinatewise maps R ⊗ R into R","status":"ok"},"proof":[{"text":"Take two elements p and q of X ⊗ X. It remains to show that if p and q are both in R, then their coordinatewise product is in R too.","status":"ok","from":0,"to":1},{"text":"The coordinatewise product is the operation of the semigroup X ⊗ X, so this is the closure of the subsemigroup R under that operation.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.quotients.quotient_inv_closed","base":"quotient_inv_closed","kind":"inst","start":111,"body":[112,114],"status":"ok","short":{"text":"For a subgroup R of X ⊗ X, inversion maps R into R","status":"ok"},"proof":[{"text":"Inversion applied in each coordinate is the inversion of the group X ⊗ X. The subgroup R is closed under it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_plus_closed","base":"quotient_plus_closed","kind":"inst","start":115,"body":null,"status":"ok","short":{"text":"An additive subsemigroup R of X ⊗ X is a congruence for addition","status":"ok"},"long":{"text":"This is the additive reading of [[AffineConstructive.theory.quotients.quotient_sg_op_closed]]. If R is closed under addition in X ⊗ X, then addition applied coordinatewise maps R ⊗ R into R. In other words, (x₁, x₂) ∊ R and (y₁, y₂) ∊ R give (x₁ + y₁, x₂ + y₂) ∊ R. This is the condition under which addition descends to X / R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_mult_closed","base":"quotient_mult_closed","kind":"inst","start":116,"body":null,"status":"ok","short":{"text":"A multiplicative subsemigroup R of X ⊗ X is a congruence for multiplication","status":"ok"},"long":{"text":"This is the multiplicative reading of [[AffineConstructive.theory.quotients.quotient_sg_op_closed]]. If R is closed under multiplication in X ⊗ X, then (x₁, x₂) ∊ R and (y₁, y₂) ∊ R give (x₁ · y₁, x₂ · y₂) ∊ R. This is the condition under which multiplication descends to X / R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_negate_closed","base":"quotient_negate_closed","kind":"inst","start":117,"body":null,"status":"ok","short":{"text":"For an additive subgroup R of X ⊗ X, negation maps R into R","status":"ok"},"long":{"text":"This is the additive reading of [[AffineConstructive.theory.quotients.quotient_inv_closed]]. If R is an additive subgroup of X ⊗ X, then (x₁, x₂) ∊ R gives (−x₁, −x₂) ∊ R. So negation respects the equivalence and descends to X / R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_sg_op","base":"quotient_sg_op","kind":"def","start":118,"body":null,"status":"ok","short":{"text":"The semigroup operation on X / R, for R a subsemigroup of X ⊗ X","status":"ok"},"long":{"text":"This is the operation of X lifted to the quotient by [[AffineConstructive.theory.quotients.quotient_lift_op2]], with [[AffineConstructive.theory.quotients.quotient_sg_op_closed]] as the well-definedness condition. An equivalence relation R ⊆ X ⊗ X that is also a subsemigroup of the product semigroup is exactly a congruence: closure under the coordinatewise operation says that related arguments give related products. This holds for any congruence, not only those that come from a normal subgroup.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_inv","base":"quotient_inv","kind":"def","start":119,"body":null,"status":"ok","short":{"text":"The inversion on X / R, for R a subgroup of X ⊗ X","status":"ok"},"long":{"text":"This is the inversion of a group X lifted to the quotient by [[AffineConstructive.theory.quotients.quotient_lift_op]]. Well-definedness is [[AffineConstructive.theory.quotients.quotient_inv_closed]]: a subgroup of X ⊗ X is closed under inversion coordinatewise, so related elements have related inverses.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_plus","base":"quotient_plus","kind":"def","start":120,"body":null,"status":"ok","short":{"text":"The addition on X / R, for R an additive subsemigroup of X ⊗ X","status":"ok"},"long":{"text":"This is the addition of X lifted to the quotient, which is [[AffineConstructive.theory.quotients.quotient_sg_op]] in additive notation. R must be an equivalence relation closed under addition in X ⊗ X, so that related summands have related sums.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_mult","base":"quotient_mult","kind":"def","start":121,"body":null,"status":"ok","short":{"text":"The multiplication on X / R, for R a multiplicative subsemigroup of X ⊗ X","status":"ok"},"long":{"text":"This is the multiplication of X lifted to the quotient, which is [[AffineConstructive.theory.quotients.quotient_sg_op]] in multiplicative notation. R must be an equivalence relation closed under multiplication in X ⊗ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_negate","base":"quotient_negate","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"The negation on X / R, for R an additive subgroup of X ⊗ X","status":"ok"},"long":{"text":"This is the negation of an additive group X lifted to the quotient, which is [[AffineConstructive.theory.quotients.quotient_inv]] in additive notation. Related elements have related negatives because R is an additive subgroup of X ⊗ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_semigroup","base":"quotient_semigroup","kind":"prf","start":131,"body":[132,135],"status":"ok","short":{"text":"The quotient of a semigroup by a congruence is a semigroup","status":"ok"},"proof":[{"text":"A semigroup structure is an associative operation, and the operation on X / R is the lift of the operation of X ([[AffineConstructive.theory.quotients.quotient_sg_op]]). It remains to show that the lift is associative.","status":"ok","from":0,"to":1},{"text":"Associativity carries over to the lift by [[AffineConstructive.theory.quotients.quotient_associative]]. This applies because R is a congruence ([[AffineConstructive.theory.quotients.quotient_sg_op_closed]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.quotients.quotient_com_semigroup","base":"quotient_com_semigroup","kind":"prf","start":137,"body":[138,141],"status":"ok","short":{"text":"The quotient of a commutative semigroup by a congruence is a commutative semigroup","status":"ok"},"proof":[{"text":"[[AffineConstructive.theory.quotients.quotient_semigroup]] makes X / R a semigroup. It remains to show that the lifted operation is commutative.","status":"ok","from":0,"to":1},{"text":"Commutativity carries over to the lift by [[AffineConstructive.theory.quotients.quotient_commutative]], because R is a congruence ([[AffineConstructive.theory.quotients.quotient_sg_op_closed]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.quotients.quotient_semilattice","base":"quotient_semilattice","kind":"prf","start":143,"body":[144,147],"status":"ok","short":{"text":"The quotient of a semilattice by a congruence is a semilattice","status":"ok"},"proof":[{"text":"[[AffineConstructive.theory.quotients.quotient_com_semigroup]] makes X / R a commutative semigroup. It remains to show that the lifted operation is idempotent.","status":"ok","from":0,"to":1},{"text":"Idempotency carries over to the lift by [[AffineConstructive.theory.quotients.quotient_binary_idempotent]], because R is a congruence ([[AffineConstructive.theory.quotients.quotient_sg_op_closed]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.quotients.quotient_monoid","base":"quotient_monoid","kind":"prf","start":149,"body":[150,156],"status":"ok","short":{"text":"The quotient of a monoid by a congruence is a monoid with the same unit","status":"ok"},"proof":[{"text":"The quotient is already a semigroup under the lifted operation ([[AffineConstructive.theory.quotients.quotient_semigroup]]), and its unit is the unit of X. What remains are the two identity laws.","status":"ok","from":0,"to":1},{"text":"The unit is a left identity in X, and R is a congruence for the operation, so the unit remains a left identity in the quotient by [[AffineConstructive.theory.quotients.quotient_left_identity]].","status":"ok","from":2,"to":3},{"text":"In the same way, the right identity law in X carries over to the quotient by [[AffineConstructive.theory.quotients.quotient_right_identity]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.quotients.quotient_com_monoid","base":"quotient_com_monoid","kind":"prf","start":158,"body":[159,162],"status":"ok","short":{"text":"The quotient of a commutative monoid by a congruence is a commutative monoid","status":"ok"},"proof":[{"text":"The quotient is a monoid by [[AffineConstructive.theory.quotients.quotient_monoid]]. What remains is commutativity of the lifted operation.","status":"ok","from":0,"to":1},{"text":"The operation of X is commutative and R is a congruence for it, so its lift is commutative by [[AffineConstructive.theory.quotients.quotient_commutative]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.quotients.quotient_bounded_sl","base":"quotient_bounded_sl","kind":"inst","start":164,"body":[165,167],"status":"ok","short":{"text":"The quotient of a bounded semilattice by a congruence is a bounded semilattice","status":"ok"},"proof":[{"text":"A bounded semilattice is a semilattice that is also a commutative monoid. The quotient is a semilattice by [[AffineConstructive.theory.quotients.quotient_semilattice]] and a commutative monoid by [[AffineConstructive.theory.quotients.quotient_com_monoid]], both under the same lifted operation and unit.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_group","base":"quotient_group","kind":"prf","start":169,"body":[170,176],"status":"ok","short":{"text":"The quotient of a group by a subgroup R of X ⊗ X that is an equivalence is a group","status":"ok"},"proof":[{"text":"The quotient is a monoid by [[AffineConstructive.theory.quotients.quotient_monoid]], and it carries the lifted inversion [[AffineConstructive.theory.quotients.quotient_inv]]. What remains are the left and right inverse laws.","status":"ok","from":0,"to":1},{"text":"R is closed under the operation and under inversion, so the left inverse law of X carries over to the lifts by [[AffineConstructive.theory.quotients.quotient_left_inverse]].","status":"ok","from":2,"to":3},{"text":"In the same way, the right inverse law carries over by [[AffineConstructive.theory.quotients.quotient_right_inverse]].","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.quotients.quotient_abgroup","base":"quotient_abgroup","kind":"prf","start":178,"body":[179,182],"status":"ok","short":{"text":"The quotient of an abelian group by a congruence subgroup of X ⊗ X is an abelian group","status":"ok"},"proof":[{"text":"The quotient is a group by [[AffineConstructive.theory.quotients.quotient_group]]. What remains is commutativity of the lifted operation.","status":"ok","from":0,"to":1},{"text":"The operation of X is commutative and R is a congruence for it, so its lift is commutative by [[AffineConstructive.theory.quotients.quotient_commutative]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.quotients.quotient_add_nc_sg","base":"quotient_add_nc_sg","kind":"def","start":184,"body":null,"status":"ok","short":{"text":"A quotient of an additive semigroup by an equivalence closed under addition is an additive semigroup","status":"ok"},"long":{"text":"This is [[AffineConstructive.theory.quotients.quotient_semigroup]] read in additive notation. Take an additive semigroup X and an equivalence relation R on X that is closed under addition as a subset of X ⊗ X: if (x₁, x₂) and (y₁, y₂) are in R, then so is (x₁ + y₁, x₂ + y₂). Then the addition of X lifts to X / R, and the lifted addition is associative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_add_nc_mon","base":"quotient_add_nc_mon","kind":"def","start":185,"body":null,"status":"ok","short":{"text":"The quotient of an additive monoid by an additive congruence is an additive monoid with zero","status":"ok"},"long":{"text":"This is [[AffineConstructive.theory.quotients.quotient_monoid]] read in additive notation. The zero of X, read in the quotient, is a two-sided identity for the lifted addition. Commutativity is not assumed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_add_mon","base":"quotient_add_mon","kind":"def","start":186,"body":null,"status":"ok","short":{"text":"The quotient of a commutative additive monoid by an additive congruence is a commutative additive monoid","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.quotients.quotient_com_monoid]]. Take an additive commutative monoid X and an equivalence relation R ⊆ X ⊗ X that is closed under addition in the product X ⊗ X, meaning that x₁ R x₂ and y₁ R y₂ give x₁ + y₁ R x₂ + y₂. Then X / R is again a commutative monoid under the addition lifted by [[AffineConstructive.theory.quotients.quotient_lift_op2]]. Its zero is the zero of X, since the two sets share their elements. Nothing new is proved: this is the same structure under the names + and 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_add_nc_grp","base":"quotient_add_nc_grp","kind":"def","start":187,"body":null,"status":"ok","short":{"text":"The quotient of an additive group by an additive subgroup relation is an additive group, not necessarily commutative","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.quotients.quotient_group]]. Here R is an equivalence relation on X that is an additive subgroup of X ⊗ X. Being closed under addition, R is a congruence for +. Being closed under negation, it relates −x₁ to −x₂ whenever it relates x₁ to x₂, so negation descends as well. The quotient X / R is then a group under the lifted addition and negation, with the zero of X as its identity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_add_grp","base":"quotient_add_grp","kind":"def","start":188,"body":null,"status":"ok","short":{"text":"A quotient of an abelian group under + by an equivalence that is an additive subgroup is an abelian group","status":"ok"},"long":{"text":"This is [[AffineConstructive.theory.quotients.quotient_abgroup]] read in additive notation. Take X, an abelian group under + with identity 0 and negation −, and an equivalence relation R on X that is an additive subgroup of X ⊗ X: closed under addition and negation and containing (0, 0). Then X / R is an abelian group under the lifted addition and negation, with the class of 0 as identity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_mult_sg","base":"quotient_mult_sg","kind":"def","start":189,"body":null,"status":"ok","short":{"text":"The quotient of a multiplicative semigroup by a multiplicative congruence is a multiplicative semigroup","status":"ok"},"long":{"text":"The multiplicative reading of [[AffineConstructive.theory.quotients.quotient_semigroup]]. If X is a semigroup under · and R is an equivalence relation on X closed under multiplication in X ⊗ X, then multiplication descends to X / R and stays associative there.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_mult_mon","base":"quotient_mult_mon","kind":"def","start":190,"body":null,"status":"ok","short":{"text":"The quotient of a multiplicative monoid by a multiplicative congruence is a multiplicative monoid","status":"ok"},"long":{"text":"The multiplicative reading of [[AffineConstructive.theory.quotients.quotient_monoid]]. If X is a monoid under · with identity 1 and R is an equivalence relation on X closed under multiplication in X ⊗ X, then X / R is a monoid under the lifted multiplication. Its identity is the 1 of X, read in the quotient.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_mult_com_mon","base":"quotient_mult_com_mon","kind":"def","start":191,"body":null,"status":"ok","short":{"text":"A quotient of a commutative monoid under · by an equivalence closed under multiplication is a commutative monoid","status":"ok"},"long":{"text":"This is [[AffineConstructive.theory.quotients.quotient_com_monoid]] read in multiplicative notation. Take X, a commutative monoid under · with identity 1, and an equivalence relation R on X closed under multiplication as a subset of X ⊗ X. Then X / R is a commutative monoid under the lifted multiplication, with the class of 1 as identity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_pointed","base":"to_quotient_pointed","kind":"prf","start":200,"body":[201,203],"status":"ok","short":{"text":"The quotient map sends x to the class of x: it is a map of pointed sets","status":"ok"},"proof":[{"text":"The goal asks that the quotient map send x to the class of x. The two sides are the same element of X / R, so they are equal by reflexivity of the quotient's equality R.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.to_quotient_mon_unit_pointed","base":"to_quotient_mon_unit_pointed","kind":"def","start":205,"body":null,"status":"ok","short":{"text":"The quotient map preserves the monoid unit","status":"ok"},"long":{"text":"The case of [[AffineConstructive.theory.quotients.to_quotient_pointed]] where the base point is the unit of X. The unit of X / R is that same element, so the quotient map sends unit to unit. In the definition of a monoid morphism, this is the clause about the unit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_top_pointed","base":"to_quotient_top_pointed","kind":"def","start":206,"body":null,"status":"ok","short":{"text":"The quotient map preserves the top element","status":"ok"},"long":{"text":"The case of [[AffineConstructive.theory.quotients.to_quotient_pointed]] where the base point is the top element ⊤ of X. The quotient X / R has ⊤ as its top element, so the quotient map preserves it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_bottom_pointed","base":"to_quotient_bottom_pointed","kind":"def","start":207,"body":null,"status":"ok","short":{"text":"The quotient map preserves the bottom element","status":"ok"},"long":{"text":"The case of [[AffineConstructive.theory.quotients.to_quotient_pointed]] where the base point is the bottom element ⊥ of X. The quotient X / R has ⊥ as its bottom element, so the quotient map preserves it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_zero_pointed","base":"to_quotient_zero_pointed","kind":"def","start":208,"body":null,"status":"ok","short":{"text":"The quotient map preserves zero","status":"ok"},"long":{"text":"The case of [[AffineConstructive.theory.quotients.to_quotient_pointed]] where the base point is the zero of X. The quotient X / R has that zero as its own, so the quotient map sends 0 to 0. In the definition of an additive monoid morphism, this is the clause about zero.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_one_pointed","base":"to_quotient_one_pointed","kind":"def","start":209,"body":null,"status":"ok","short":{"text":"The quotient map preserves one","status":"ok"},"long":{"text":"The case of [[AffineConstructive.theory.quotients.to_quotient_pointed]] where the base point is the 1 of X. The quotient X / R has that 1 as its own, so the quotient map sends 1 to 1. In the definition of a multiplicative monoid morphism, this is the clause about one.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_sg_mor","base":"to_quotient_sg_mor","kind":"prf","start":215,"body":[216,219],"status":"ok","short":{"text":"For a congruence R on a semigroup, the quotient map X ⇾ X / R is a semigroup morphism","status":"ok"},"proof":[{"text":"The quotient is a semigroup by [[AffineConstructive.theory.quotients.quotient_semigroup]], and the quotient map is a function. What remains is that it preserves the operation.","status":"ok","from":0,"to":1},{"text":"Fix x and y. The lifted operation acts on elements as the operation of X does, so both sides are the element x·y, and they are equal by reflexivity.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.quotients.to_quotient_mon_mor","base":"to_quotient_mon_mor","kind":"prf","start":221,"body":[222,224],"status":"ok","short":{"text":"For a congruence R on a monoid, the quotient map X ⇾ X / R is a monoid morphism","status":"ok"},"proof":[{"text":"A monoid morphism is a semigroup morphism that preserves the unit. The quotient map is a semigroup morphism by [[AffineConstructive.theory.quotients.to_quotient_sg_mor]], and it preserves the unit by [[AffineConstructive.theory.quotients.to_quotient_mon_unit_pointed]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.to_quotient_add_sg_mor","base":"to_quotient_add_sg_mor","kind":"def","start":226,"body":null,"status":"ok","short":{"text":"For an additive congruence, the quotient map preserves addition","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.quotients.to_quotient_sg_mor]]. If R is an equivalence relation on an additive semigroup X and is closed under addition in X ⊗ X, the quotient map X ⇾ X / R sends x + y to the sum of the classes of x and y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_add_mon_mor","base":"to_quotient_add_mon_mor","kind":"def","start":227,"body":null,"status":"ok","short":{"text":"For an additive congruence on an additive monoid, the quotient map preserves addition and zero","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.quotients.to_quotient_mon_mor]]. If R is an additive congruence on an additive monoid X, the quotient map X ⇾ X / R is a morphism of additive monoids: it preserves + and 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_mult_sg_mor","base":"to_quotient_mult_sg_mor","kind":"def","start":230,"body":null,"status":"ok","short":{"text":"For a multiplicative congruence, the quotient map preserves multiplication","status":"ok"},"long":{"text":"The multiplicative reading of [[AffineConstructive.theory.quotients.to_quotient_sg_mor]]. If R is an equivalence relation on a multiplicative semigroup X and is closed under multiplication in X ⊗ X, the quotient map X ⇾ X / R sends x · y to the product of the classes of x and y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.to_quotient_mult_mon_mor","base":"to_quotient_mult_mon_mor","kind":"def","start":231,"body":null,"status":"ok","short":{"text":"For a multiplicative congruence on a multiplicative monoid, the quotient map preserves multiplication and one","status":"ok"},"long":{"text":"The multiplicative reading of [[AffineConstructive.theory.quotients.to_quotient_mon_mor]]. If R is a multiplicative congruence on a multiplicative monoid X, the quotient map X ⇾ X / R is a morphism of multiplicative monoids: it preserves · and 1.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op_pointed","base":"quotient_lift_op_pointed","kind":"prf","start":234,"body":[235,239],"status":"ok","short":{"text":"If f x = y, the lift of f to the quotients sends the class of x to the class of y","status":"ok"},"proof":[{"text":"Unfolded, the goal asks that the lift of f send the class of x to the class of y, as an equality in Y / S.","status":"ok","from":0,"to":1},{"text":"Equality in Y implies equality in Y / S ([[AffineConstructive.theory.quotients.quotient_subrel]]), so it is enough to have f x = y in Y. That is the hypothesis that f maps x to y.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op_mon_unit_pointed","base":"quotient_lift_op_mon_unit_pointed","kind":"def","start":241,"body":null,"status":"ok","short":{"text":"If f preserves the monoid unit, so does its lift to the quotients","status":"ok"},"long":{"text":"The case of [[AffineConstructive.theory.quotients.quotient_lift_op_pointed]] where both base points are monoid units. Let f : X ⇾ Y map R-related elements to S-related ones and send the unit of X to the unit of Y. Then the induced map X / R ⇾ Y / S also sends unit to unit, because each quotient has the unit of its underlying set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op_zero_pointed","base":"quotient_lift_op_zero_pointed","kind":"def","start":243,"body":null,"status":"ok","short":{"text":"If f preserves zero, so does its lift to the quotients","status":"ok"},"long":{"text":"The case of [[AffineConstructive.theory.quotients.quotient_lift_op_pointed]] where both base points are zeros. If f : X ⇾ Y respects the relations R and S and sends 0 to 0, then the induced map X / R ⇾ Y / S also sends 0 to 0.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op_sg_mor","base":"quotient_lift_op_sg_mor","kind":"prf","start":245,"body":[246,251],"status":"ok","short":{"text":"The lift of a semigroup morphism to quotients by congruences is a semigroup morphism","status":"ok"},"proof":[{"text":"Both quotients are semigroups by [[AffineConstructive.theory.quotients.quotient_semigroup]], and the lift of f is a function. What remains is that the lift preserves the operation.","status":"ok","from":0,"to":1},{"text":"Fix x and y in X / R. Equality in Y implies equality in Y / S ([[AffineConstructive.theory.quotients.quotient_subrel]]), so it is enough to prove the equation in Y.","status":"ok","from":2,"to":3},{"text":"On elements, the lift acts as f, and the lifted operations act as the operations of X and Y. So the equation in Y is f(x·y) = f x · f y, which holds because f is a semigroup morphism.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op_mon_mor","base":"quotient_lift_op_mon_mor","kind":"prf","start":253,"body":[254,256],"status":"ok","short":{"text":"The lift of a monoid morphism to quotients by congruences is a monoid morphism","status":"ok"},"proof":[{"text":"A monoid morphism is a semigroup morphism that also preserves the unit, and the two parts are shown separately. The lift is a semigroup morphism by [[AffineConstructive.theory.quotients.quotient_lift_op_sg_mor]]. It preserves the unit by [[AffineConstructive.theory.quotients.quotient_lift_op_mon_unit_pointed]], because the unit of each quotient monoid is the unit of the original monoid ([[AffineConstructive.theory.quotients.quotient_monoid]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op_add_sg_mor","base":"quotient_lift_op_add_sg_mor","kind":"def","start":258,"body":null,"status":"ok","short":{"text":"The lift of an addition-preserving map to quotients by additive congruences preserves addition","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.quotients.quotient_lift_op_sg_mor]]. Let f : X ⇾ Y preserve addition, and let it map R-related elements to S-related ones, where R and S are additive congruences. Then the induced map X / R ⇾ Y / S preserves the lifted additions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.quotients.quotient_lift_op_add_mon_mor","base":"quotient_lift_op_add_mon_mor","kind":"def","start":260,"body":null,"status":"ok","short":{"text":"The lift of an additive monoid morphism to quotients by additive congruences is an additive monoid morphism","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.quotients.quotient_lift_op_mon_mor]]. Let f : X ⇾ Y preserve + and 0, and let it map R-related elements to S-related ones, where R and S are additive congruences. Then the induced map X / R ⇾ Y / S preserves + and 0 as well.","status":"ok"},"proof":[]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.interfaces.subset":{"page":"../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.theory.product_algebras":{"page":"product_algebras.html","short":"Algebraic structures on tensor and cartesian products, and the canonical maps as morphisms","summary":"This file carries algebraic structure to products of sets, both the tensor product X ⊗ Y, whose equality is multiplicative, and the cartesian product X × Y, whose equality is additive. For each product it shows that operations combined coordinatewise ([[tensor_map2]], [[prod_map2]]) keep the laws of their components (associativity, commutativity, idempotence, absorption, distributivity, identities, absorbing elements and inverses), and from these it equips the product of two semigroups, monoids, groups, semilattices, lattices, and their additive and multiplicative variants with the same structure, with units, zeros, tops and bottoms taken as pairs. It then shows that the canonical maps respect this structure: the comparison [[tensor_to_prod]] from the tensor to the cartesian product, the tensor f ⊗ g of two maps, and the projections out of either product preserve the distinguished points and are semigroup and monoid morphisms, as are the injections [[mon_inl]], [[mon_inr]], [[add_mon_inl]] and [[add_mon_inr]] of a factor into the tensor product beside the unit or zero of the other."},"AffineConstructive.theory.subgroups":{"page":"subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.theory.additive_groups":{"page":"additive_groups.html","short":"Groups, monoids and their morphisms in additive notation","summary":"This file restates the generic group theory of theory/groups.v in the additive notation that rings use. To do so it views a set with +, 0 and − as a group through [[AdditiveGroupOps]]. It gives constructors for the additive semigroup, monoid and group structures, commutative or not, and the coercions among them. It also restates the basic laws under additive names: associativity, commutativity, the identity and inverse laws, the involution and distributivity of negation, [[negate_0]], [[equal_by_zero_sum]] and [[flip_negate]]. For additive semigroup and monoid morphisms it gives preservation of addition, negation and subtraction, together with identities, composites and inverses. [[Build_AdditiveGroup_Morphism]] shows that a map between groups that preserves addition is a monoid morphism. The file closes with simplification rules that cancel zeros and inverses, transport of structure along injections, and the quotation rules for + and −."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

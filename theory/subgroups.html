eConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export interfaces.subalgebra theory.groups.\nRequire Import sprop.\nRequire Import interfaces.set theory.set theory.projected_set.\nRequire Import orders.orders orders.subset.\nRequire Import logic.aprop.\nRequire Import easy replc rewrite_preserves simplify.\n\nLocal Open Scope sg_op_scope.\nLocal Open Scope grp_scope.\nLocal Abbreviation e := mon_unit.\n\nDefinition alt_Build_SubSemiGroup `{SemiGroup X} {Y:𝒫 X} :\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x ∙ y ∊ Y) → SubSemiGroup Y\n:= tautology.\n\nDefinition alt_Build_SubMonoid `{Monoid X} {Y:𝒫 X} :\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x ∙ y ∊ Y)\n → e ∊ Y\n → SubMonoid Y\n:= tautology.\n\nDefinition alt_Build_SubStarSemiGroup `{StarSemiGroup X} {Y:𝒫 X} :\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x ∙ y ∊ Y)\n → (∀ x, x ∊ Y ⊸ x⁻¹ ∊ Y)\n → SubStarSemiGroup Y\n:= tautology.\n\nDefinition alt_Build_SubStarMonoid `{StarMonoid X} {Y:𝒫 X} :\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x ∙ y ∊ Y)\n → e ∊ Y\n → (∀ x, x ∊ Y ⊸ x⁻¹ ∊ Y)\n → SubStarMonoid Y\n:= tautology.\n\nDefinition alt_Build_SubGroup `{Group X} {Y:𝒫 X} :\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x ∙ y ∊ Y)\n → e ∊ Y\n → (∀ x, x ∊ Y ⊸ x⁻¹ ∊ Y)\n → SubGroup Y.\nProof. intros. split; trivial. now apply alt_Build_SubStarMonoid. Qed.\n\nGlobal Hint Extern 4 (apos (_ ∙ _ ∊ _)) => simple notypeclasses refine  (andl (sub_sg_closed _ _ _) (_ : _ ⊠ _)) : typeclass_instances.\nGlobal Hint Extern 4 (apos (e ∊ _)) => simple notypeclasses refine  (sub_mon_unit_closed _) : typeclass_instances.\nGlobal Hint Extern 4 (apos (_⁻¹ ∊ _)) => simple notypeclasses refine  (andl (sub_inv_closed _ _) (_ : _ ∊ _)) : typeclass_instances.\n\nDefinition full_sub_sg  `{SemiGroup G} : SubSemiGroup (full_subset G) := tautology.\nDefinition full_sub_mon `{Monoid    M} : SubMonoid    (full_subset M) := tautology.\nDefinition full_sub_star_sg  `{StarSemiGroup G} : SubStarSemiGroup (full_subset G) := tautology.\nDefinition full_sub_star_mon `{StarMonoid    M} : SubStarMonoid    (full_subset M) := tautology. \nDefinition full_sub_grp `{Group G} : SubGroup (full_subset G). Proof. split; [ exact _ | exact full_sub_star_mon ]. Qed.\nDefinition full_normal_sub_grp `{Group G} : NormalSubGroup (full_subset G).\nProof. split; [ exact full_sub_grp |]. intros x; exact tautology. Qed.\n\nGlobal Hint Extern 2 (SubSemiGroup     (full_subset _)) => simple notypeclasses refine full_sub_sg       : typeclass_instances.\nGlobal Hint Extern 2 (SubMonoid        (full_subset _)) => simple notypeclasses refine full_sub_mon      : typeclass_instances.\nGlobal Hint Extern 2 (SubStarSemiGroup (full_subset _)) => simple notypeclasses refine full_sub_star_sg  : typeclass_instances.\nGlobal Hint Extern 2 (SubStarMonoid    (full_subset _)) => simple notypeclasses refine full_sub_star_mon : typeclass_instances.\nGlobal Hint Extern 2 (SubGroup         (full_subset _)) => simple notypeclasses refine full_sub_grp      : typeclass_instances.\nGlobal Hint Extern 2 (NormalSubGroup   (full_subset _)) => simple notypeclasses refine full_normal_sub_grp : typeclass_instances.\n\n\n(** Substructure predicates respect equality of subsets. *)\n\nLemma SubSemiGroup_proper_impl {G op} H₁ H₂\n  : H₁ = H₂ → impl (@SubSemiGroup G op H₁, SubSemiGroup H₂).\nProof. intros E P; split; try exact _. rew <-E. apply P. Qed.\nCanonical Structure SubSemiGroup_fun {G op} :=\n  make_weak_spred (@SubSemiGroup G op) SubSemiGroup_proper_impl.\n\nLemma SubMonoid_proper_impl {M op unit} N₁ N₂\n  : N₁ = N₂ → impl (@SubMonoid M op unit N₁, SubMonoid N₂).\nProof. intros E P; split; try exact _; rew <-E; apply P. Qed.\nCanonical Structure SubMonoid_fun {M op unit} :=\n  make_weak_spred (@SubMonoid M op unit) SubMonoid_proper_impl.\n\nLemma SubStarSemiGroup_proper_impl {G op inv} H₁ H₂\n  : H₁ = H₂ → impl (@SubStarSemiGroup G op inv H₁, SubStarSemiGroup H₂).\nProof. intros E P; split; try exact _; rew <-E; apply P. Qed.\nCanonical Structure SubStarSemiGroup_fun {G op inv} :=\n  make_weak_spred (@SubStarSemiGroup G op inv) SubStarSemiGroup_proper_impl.\n\nLemma SubStarMonoid_proper_impl {M op unit inv} N₁ N₂\n  : N₁ = N₂ → impl (@SubStarMonoid M op unit inv N₁, SubStarMonoid N₂).\nProof. intros E P; split; try exact _; rew <-E; apply P. Qed.\nCanonical Structure SubStarMonoid_fun {M op unit inv} :=\n  make_weak_spred (@SubStarMonoid M op unit inv) SubStarMonoid_proper_impl.\n\nLemma SubGroup_proper_impl {G op unit inv} H₁ H₂\n  : H₁ = H₂ → impl (@SubGroup G op unit inv H₁, SubGroup H₂).\nProof. intros E P; split; try exact _; rew <-E; apply P. Qed. \nCanonical Structure SubGroup_fun {G op unit inv} :=\n  make_weak_spred (@SubGroup G op unit inv) SubGroup_proper_impl.\n\nRequire Import srelations.\nRequire Import tactics.misc.\n\nLemma NormalSubGroup_proper_impl {G op unit inv} H₁ H₂\n  : H₁ = H₂ → impl (@NormalSubGroup G op unit inv H₁, NormalSubGroup H₂).\nProof. intros E P; split; try exact _; rew <-E; apply P. Qed.\nCanonical Structure NormalSubGroup_fun {G op unit inv} :=\n  make_weak_spred (@NormalSubGroup G op unit inv) NormalSubGroup_proper_impl.\n\n(** Induced operations on subsets when viewed as sets. *)\n\nDefinition sub_semigroup_op `{@SubSemiGroup G op H} : SgOp H.\nProof. unshelve esplit.\n+ intros [x y]. exact (to_subset ((x:G) ∙ (y:G))).\n+ now refine (projected_is_fun _ sg_op _).\nDefined.\nArguments sub_semigroup_op {G op} H {_}.\n\nDefinition sub_monoid_unit `{@SubMonoid M op u N} : MonUnit N := to_subset e.\nArguments sub_monoid_unit {M op u} N {_}.\n\nDefinition sub_star_semigroup_inv `{@SubStarSemiGroup G op i H} : Inv H.\nProof. unshelve esplit.\n+ exact (λ x, to_subset (subset_pt x)⁻¹).\n+ now refine (projected_is_fun _ inv _).\nDefined.\nArguments sub_star_semigroup_inv {G op i} H {_}.\n\nGlobal Hint Extern 2 (SgOp (subset_to_set ?H)) => refine (sub_semigroup_op H) : typeclass_instances.\nGlobal Hint Extern 2 (MonUnit (subset_to_set ?H)) => refine (sub_monoid_unit H) : typeclass_instances.\nGlobal Hint Extern 2 (Inv (subset_to_set ?H)) => refine (sub_star_semigroup_inv H) : typeclass_instances.\n\n(** Sub structures are instances of structures when viewed as sets. *)\n\nLemma sub_semigroup_semigroup `{@SubSemiGroup G op H} : SemiGroup H.\nProof. intros x y z. exact (associativity (∙) (x:G) (y:G) (z:G)). Qed.\nGlobal Hint Extern 2 (SemiGroup (subset_to_set _)) => simple notypeclasses refine sub_semigroup_semigroup : typeclass_instances.\n\nLemma sub_semigroup_com_semigroup `{P:CommutativeSemiGroup G} {H:𝒫 G} `{!SubSemiGroup H} : CommutativeSemiGroup H.\nProof. split; try exact _. intros x y. exact (commutativity (∙) (x:G) (y:G)). Qed.\nGlobal Hint Extern 2 (CommutativeSemiGroup (subset_to_set _)) => simple notypeclasses refine sub_semigroup_com_semigroup : typeclass_instances.\n\nLemma sub_semigroup_sl `{P:SemiLattice G} {H:𝒫 G} `{!SubSemiGroup H} : SemiLattice H.\nProof. split; try exact _. intros x. exact (binary_idempotency (∙) (x:G)). Qed.\nGlobal Hint Extern 2 (SemiLattice (subset_to_set _)) => simple notypeclasses refine sub_semigroup_sl : typeclass_instances.\n\nLemma sub_monoid_monoid `{@SubMonoid M op u N} : Monoid N.\nProof. split.\n+ exact _.\n+ intros x. exact (left_identity (∙) (x:M)).\n+ intros x. exact (right_identity (∙) (x:M)).\nQed.\nGlobal Hint Extern 2 (Monoid (subset_to_set _)) => simple notypeclasses refine sub_monoid_monoid : typeclass_instances.\n\nLemma sub_monoid_com_monoid `{P:CommutativeMonoid M} {N:𝒫 M} `{!SubMonoid N} : CommutativeMonoid N.\nProof. split; try exact _. intros x y. exact (commutativity (∙) (x:M) (y:M)). Qed.\nGlobal Hint Extern 2 (CommutativeMonoid (subset_to_set _)) => simple notypeclasses refine sub_monoid_com_monoid : typeclass_instances.\n\nLemma sub_monoid_bounded_sl `{P:BoundedSemiLattice M} {N:𝒫 M} `{!SubMonoid N} : BoundedSemiLattice N.\nProof. now split. Qed.\nGlobal Hint Extern 2 (BoundedSemiLattice (subset_to_set _)) => simple notypeclasses refine sub_monoid_bounded_sl : typeclass_instances.\n\nLemma sub_star_semigroup_star_semigroup `{@SubStarSemiGroup G op i H} : StarSemiGroup H.\nProof. split.\n+ exact _.\n+ intros x. exact (involutive_alt inv (x:G)).\n+ intros x y. exact (anti_distribute inv (∙) (x:G) (y:G)).\nQed.\nGlobal Hint Extern 2 (StarSemiGroup (subset_to_set _)) => simple notypeclasses refine sub_star_semigroup_star_semigroup : typeclass_instances.\n\nLemma sub_star_monoid_star_monoid `{@SubStarMonoid M op u i N} : StarMonoid N.\nProof. now split. Qed.\nGlobal Hint Extern 2 (StarMonoid (subset_to_set _)) => simple notypeclasses refine sub_star_monoid_star_monoid : typeclass_instances.\n\nLemma sub_group_group `{@SubGroup G op u i H} : Group H.\nProof. split.\n+ exact _.\n+ intros x. exact (left_inverse (∙) (x:G)).\n+ intros x. exact (right_inverse (∙) (x:G)).\nQed.\nGlobal Hint Extern 2 (Group (subset_to_set _)) => simple notypeclasses refine sub_group_group : typeclass_instances.\n\nLemma sub_group_abgroup `{P:AbGroup G} {H:𝒫 G} `{!SubGroup H} : AbGroup H.\nProof. split; try exact _. intros x y. exact (commutativity (∙) (x:G) (y:G)). Qed.\nGlobal Hint Extern 2 (AbGroup (subset_to_set _)) => simple notypeclasses refine sub_group_abgroup : typeclass_instances.\n\nLemma sub_abgroup_normal `{P:AbGroup G} {H:𝒫 G} `{!SubGroup H} : NormalSubGroup H.\nProof. split; try exact _.\n  intros x. rew <-all_adj. intros y.\n  rew (commutativity (∙) y x).\n  now group_simplify.\nQed.\nGlobal Hint Extern 8 (NormalSubGroup _) => simple notypeclasses refine sub_abgroup_normal : typeclass_instances.\n\n(** Inclusion of the substructure is structure preserving *)\n\nLemma from_sub_semigroup `{@SubSemiGroup G op H} : SemiGroup_Morphism (from_subset H).\nProof. split; try exact _; now intros. Qed.\nGlobal Hint Extern 2 (SemiGroup_Morphism (from_subset _)) => simple notypeclasses refine from_sub_semigroup : typeclass_instances.\n\nLemma from_sub_monoid `{@SubMonoid M op u N} : Monoid_Morphism (from_subset N).\nProof. apply alt_Build_Monoid_Morphism; now intros. Qed.\nGlobal Hint Extern 2 (Monoid_Morphism (from_subset _)) => simple notypeclasses refine from_sub_monoid : typeclass_instances.\nGlobal Hint Extern 2 (MonUnit_Pointed_Morphism (from_subset _)) => simple notypeclasses refine from_sub_monoid : typeclass_instances.\n\nLemma from_sub_star_semigroup `{@SubStarSemiGroup G op i H} : StarSemiGroup_Morphism (from_subset H).\nProof. split; try exact _; now intros. Qed.\nGlobal Hint Extern 2 (StarSemiGroup_Morphism (from_subset _)) => simple notypeclasses refine from_sub_star_semigroup : typeclass_instances.\n\nLemma from_sub_star_monoid `{@SubStarMonoid M op u i N} : StarMonoid_Morphism (from_subset N).\nProof. now split. Qed.\nGlobal Hint Extern 2 (StarMonoid_Morphism (from_subset _)) => simple notypeclasses refine from_sub_star_monoid : typeclass_instances.\n\n(** Image and preimage *)\nImport image_notation.\n\nLemma image_sub_sg `{@SemiGroup_Morphism X Y Xop Yop f} {U:𝒫 X} `{!SubSemiGroup U} : SubSemiGroup (f⁎ U).\nProof. split; [ exact _ |]. intros y₁ y₂. unfold_image.\n  rew <-aex_adj2. intros x₁ x₂. rew <-(aex_ub _ (x₁ ∙ x₂)).\n  let t := constr:(tautology : ∀ P Q R S : Ω, (P ⊠ Q) ⊠ (R ⊠ S) ⊸ (P ⊠ R) ⊠ (Q ⊠ S)) in rew (t _ _ _ _).\n  refine (aprod_proper_aimpl _ _).\n  * rewrite_preserves f. exact (is_fun (∙) (_, _) (_, _)).\n  * now apply sub_sg_closed.\nQed.\nGlobal Hint Extern 2 (SubSemiGroup (func_op _⁎ _)) => simple notypeclasses refine image_sub_sg : typeclass_instances.\n\nLemma preimage_sub_sg `{@SemiGroup_Morphism X Y Xop Yop f} {U:𝒫 Y} `{!SubSemiGroup U} : SubSemiGroup (f* U).\nProof. split; [ exact _ |]. intros x₁ x₂. unfold_image.\n  rewrite_preserves f. now apply sub_sg_closed.\nQed.\nGlobal Hint Extern 2 (SubSemiGroup (func_op _* _)) => simple notypeclasses refine preimage_sub_sg : typeclass_instances.\n\n\nLemma image_sub_mon `{@Monoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 X} `{!SubMonoid U} : SubMonoid (f⁎ U).\nProof. split; [ exact _ .. |]. unfold_image. exists e; split; [ exact (preserves_unit f) | exact _ ]. Qed.\nGlobal Hint Extern 2 (SubMonoid (func_op _⁎ _)) => simple notypeclasses refine image_sub_mon : typeclass_instances.\n\nLemma preimage_sub_mon `{@Monoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 Y} `{!SubMonoid U} : SubMonoid (f* U).\nProof. split; [ exact _ .. |]. unfold_image. now rewrite_preserves f. Qed.\nGlobal Hint Extern 2 (SubMonoid (func_op _* _)) => simple notypeclasses refine preimage_sub_mon : typeclass_instances.\n\nLemma image_sub_star_sg `{@StarSemiGroup_Morphism X Y Xop Yop Xinv Yinv f} {U:𝒫 X} `{!SubStarSemiGroup U} : SubStarSemiGroup (f⁎ U).\nProof. split; [ exact _ ..|]. intros y. unfold_image.\n  rew <-aex_adj. intros x. rew <-(aex_ub _ x⁻¹).\n  refine (aprod_proper_aimpl _ _).\n  * rewrite_preserves f. exact (is_fun inv _ _).\n  * now apply sub_inv_closed.\nQed.\nGlobal Hint Extern 2 (SubStarSemiGroup (func_op _⁎ _)) => simple notypeclasses refine image_sub_star_sg : typeclass_instances.\n\nLemma preimage_sub_star_sg `{@StarSemiGroup_Morphism X Y Xop Yop Xinv Yinv f} {U:𝒫 Y} `{!SubStarSemiGroup U} : SubStarSemiGroup (f* U).\nProof. split; [ exact _ ..|]. intros x. unfold_image.\n  rewrite_preserves f. now apply sub_inv_closed.\nQed.\nGlobal Hint Extern 2 (SubStarSemiGroup (func_op _* _)) => simple notypeclasses refine preimage_sub_star_sg : typeclass_instances.\n\nLemma image_sub_star_mon `{@StarMonoid_Morphism X Y Xop Yop Xunit Yunit Xinv Yinv f} {U:𝒫 X} `{!SubStarMonoid U} : SubStarMonoid (f⁎ U).\nProof. now split. Qed.\nGlobal Hint Extern 2 (SubStarMonoid (func_op _⁎ _)) => simple notypeclasses refine image_sub_star_mon : typeclass_instances.\n\nLemma preimage_sub_star_mon `{@StarMonoid_Morphism X Y Xop Yop Xunit Yunit Xinv Yinv f} {U:𝒫 Y} `{!SubStarMonoid U} : SubStarMonoid (f* U).\nProof. now split. Qed.\nGlobal Hint Extern 2 (SubStarMonoid (func_op _* _)) => simple notypeclasses refine preimage_sub_star_mon : typeclass_instances.\n\n\nLemma image_sub_grp@{u} {X Y:set@{u}} `{Group X} `{Group Y} {f:X ⇾ Y} `{!SemiGroup_Morphism f} {U:𝒫 X} `{!SubGroup U} : SubGroup (f⁎ U).\nProof. now split. Qed.\nGlobal Hint Extern 2 (SubGroup (func_op _⁎ _)) => simple notypeclasses refine image_sub_grp : typeclass_instances.\n\nLemma preimage_sub_grp@{u} {X Y:set@{u}} `{Group X} `{Group Y} {f:X ⇾ Y} `{!SemiGroup_Morphism f} {U:𝒫 Y} `{!SubGroup U} : SubGroup (f* U).\nProof. now split. Qed.\nGlobal Hint Extern 2 (SubGroup (func_op _* _)) => simple notypeclasses refine preimage_sub_grp : typeclass_instances.\n\n\nLemma image_preserves_sub_sg_com `{@SemiGroup_Morphism X Y Xop Yop f} {U:𝒫 X} `{!SubSemiGroup U}\n  `{!Commutative (X:=U) (∙)} : Commutative (X:=f⁎ U : 𝒫 _) (∙).\nProof. intros [y₁ ely₁][y₂ ely₂]. change (y₁ ∙ y₂ = y₂ ∙ y₁). revert ely₁ ely₂. unfold_image.\n  intros [x₁[E1 ?]][x₂[E2 ?]]; rew [ <-E1 | <-E2 ]; clear y₁ y₂ E1 E2.\n  rew <-(preserves_sg_op f _ _).\n  apply (is_fun f _ _).\n  exact ( commutativity (∙) (to_subset x₁ : U) (to_subset x₂ : U) ).\nQed.\nGlobal Hint Extern 2 (@Commutative (subset_to_set (func_op _⁎ _)) _ (∙)) => simple notypeclasses refine image_preserves_sub_sg_com : typeclass_instances.\n\nLemma preimage_preserves_sub_sg_com `{@SemiGroup_Morphism X Y Xop Yop f} {U:𝒫 Y} `{!SubSemiGroup U, !Injective f}\n  : Commutative (X:=U) (∙) → Commutative (X:=f* U : 𝒫 _) (∙).\nProof. intro. intros [x₁ elx₁][x₂ elx₂]. change (x₁ ∙ x₂ = x₂ ∙ x₁). revert elx₁ elx₂. unfold_image.\n  intros ??. quote_injective f.\n  exact ( commutativity (∙) (to_subset (f x₁) : U) (to_subset (f x₂) : U) ).\nQed.\n\nLemma image_com_sg `{@SemiGroup_Morphism X Y Xop Yop f} {U:𝒫 X} `{!SubSemiGroup U, !CommutativeSemiGroup U}\n  : CommutativeSemiGroup (subset_to_set (f⁎ U )).\nProof. now split. Qed.\n\nLemma image_com_mon `{@Monoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 X} `{!SubMonoid U, !CommutativeMonoid U}\n  : CommutativeMonoid (subset_to_set (f⁎ U)).\nProof. now split. Qed.\n\nLemma image_abgrp@{u} {X Y:set@{u}} `{Group X} `{Group Y} (f:X ⇾ Y) `{!SemiGroup_Morphism f} {U:𝒫 X} `{!SubGroup U, !AbGroup U}\n  : AbGroup (subset_to_set (f⁎ U)).\nProof. now split. Qed.\n\nGlobal Hint Extern 2 (CommutativeSemiGroup (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_com_sg : typeclass_instances.\nGlobal Hint Extern 2 (CommutativeMonoid (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_com_mon : typeclass_instances.\nGlobal Hint Extern 2 (AbGroup (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_abgrp : typeclass_instances.\n\n\n(** Quotient Group *)\n(*\nRequire Import product_algebras.\n\nSection foo.\n  Context G {op u i} H {P:@NormalSubGroup G op u i H}.\n\n  Definition quotient_group_rel : 𝒫 (G ⊗ G) := { '(x, y) : G ⊗ G | x ∙ y⁻¹ ∊ H }.\n  Local Notation R := quotient_group_rel.\n\n  Lemma quotient_group_rel_equivalence : Equivalence R.\n  Proof. split.\n  + intros x. change (x ∙ x⁻¹ ∊ H). now group_simplify.\n  + intros x y. change (x ∙ y⁻¹ ∊ H ⊸ y ∙ x⁻¹ ∊ H).\n    rew (inverse_swap_r y x). exact (sub_grp_inv_closed _ _).\n  + intros x y z. change (x ∙ y⁻¹ ∊ H ⊠ y ∙ z⁻¹ ∊ H ⊸ x ∙ z⁻¹ ∊ H).\n    replc (x ∙ z⁻¹) with ( (x ∙ y⁻¹) ∙ (y ∙ z⁻¹) ) by now group_simplify.\n    exact (sub_sg_closed _ _ _).\n  Qed.\n\n  Lemma quotient_group_congruence : SubGroup R.\n  Proof. apply alt_Build_SubGroup.\n  + intros [x₁ x₂][y₁ y₂]. change (x₁ ∙ x₂⁻¹ ∊ H ⊠ y₁ ∙ y₂⁻¹ ∊ H ⊸ (x₁ ∙ y₁) ∙ (x₂ ∙ y₂)⁻¹ ∊ H).\n    replc ( (x₁ ∙ y₁) ∙ (x₂ ∙ y₂)⁻¹ ) with ( (x₁ ∙ x₂⁻¹) ∙  (x₂ ∙ (y₁ ∙ y₂⁻¹) ∙ x₂⁻¹) ) by now group_simplify.\n    rew (normality H (y₁ ∙ y₂⁻¹)), (all_lb _ x₂).\n    exact (sub_sg_closed _ _ _).\n  + change (e ∙ e⁻¹ ∊ H). now group_simplify.\n  + intros [x y]. change (x ∙ y⁻¹ ∊ H ⊸ x⁻¹ ∙ (y⁻¹)⁻¹ ∊ H).\n    replc ( x⁻¹ ∙ (y⁻¹)⁻¹ ) with ( y⁻¹ ∙ (x ∙ y⁻¹)⁻¹ ∙ (y⁻¹)⁻¹ ) by now group_simplify.\n    rew (sub_grp_inv_closed H (x ∙ y⁻¹)), (normality H (x ∙ y⁻¹)⁻¹).\n    exact (all_lb _ _).\n  Qed.\nEnd foo.\n*)\n\n(** Quotient Group *)\n(*\nDefinition QuotientGroup G {op u i} H {P:@NormalSubGroup G op u i H} := set_T G.\nLocal Notation \"G / H\" := (QuotientGroup G H) (at level 40) : type_scope.\n\nDefinition QuotientGroup_equiv `{P:NormalSubGroup (G:=G) H}  : Equiv (G/H)\n  := λ x y, x ∙ y⁻¹ ∊ H.\nGlobal Hint Extern 1 (Equiv (_ / _)) => refine QuotientGroup_equiv : typeclass_instances.\n\nLemma QuotientGroup_equiv_subrel `{P:NormalSubGroup (G:=G) H} : Subrelation (@equiv G _) (@equiv (G/H) _).\nProof. intros x y. change (x = y ⊸ x ∙ y⁻¹ ∊ H).\n  rew exact:(simplify_thm ( is_fun (∙ y⁻¹) x y )).\n  rew <-(equal_element H e _), (aprod_true_r (_ : e ∊ H)).\n  now apply symmetry.\nQed.\n\nLemma QuotientGroup_is_set `{P:NormalSubGroup (G:=G) H} : IsSet (G/H).\nProof. split.\n+ intros x. change (x ∙ x⁻¹ ∊ H). now group_simplify.\n+ intros x y. change (x ∙ y⁻¹ ∊ H ⊸ y ∙ x⁻¹ ∊ H).\n  rew (inverse_swap_r y x). exact (sub_grp_inv_closed _ _).\n+ intros x y z. change (x ∙ y⁻¹ ∊ H ⊠ y ∙ z⁻¹ ∊ H ⊸ x ∙ z⁻¹ ∊ H).\n  replc (x ∙ z⁻¹) with ( (x ∙ y⁻¹) ∙ (y ∙ z⁻¹) ) by now group_simplify.\n  exact (sub_sg_closed _ _ _).\nQed.\nGlobal Hint Extern 1 (IsSet (_ / _)) => simple notypeclasses refine QuotientGroup_is_set : typeclass_instances.\n\nCanonical Structure QuotientGroup_set G {op u i} H {P:@NormalSubGroup G op u i H}  := set_make (G/H).\nLocal Notation \"G / H\" := (QuotientGroup_set G H) (at level 40, only printing).\n\nGlobal Hint Extern 1 (MonUnit (QuotientGroup_set _ (u:=?u) _)) => refine u : typeclass_instances.\n\nLemma QuotientGroup_op_is_fun `{P:NormalSubGroup (G:=G) H}  : @IsFun ((G/H) ⊗ (G/H)) (G/H) (@sg_op G _).\nProof. intros [x₁ y₁][x₂ y₂]. change (set_T G) in x₁, y₁, x₂, y₂.\n  change (x₁ ∙ x₂⁻¹ ∊ H ⊠ y₁ ∙ y₂⁻¹ ∊ H ⊸ (x₁ ∙ y₁) ∙ (x₂ ∙ y₂)⁻¹ ∊ H).\n  replc ( (x₁ ∙ y₁) ∙ (x₂ ∙ y₂)⁻¹ ) with ( (x₁ ∙ x₂⁻¹) ∙  (x₂ ∙ (y₁ ∙ y₂⁻¹) ∙ x₂⁻¹) ) by now group_simplify.\n  rew (normality H (y₁ ∙ y₂⁻¹)), (all_lb _ x₂).\n  exact (sub_sg_clo ":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":12404,"e":12407,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12740,"e":12752,"lib":"AffineConstructive.interfaces.subset","name":"unfold_image","kind":"ltac","local":false,"page":"../interfaces/subset.html"},{"s":12756,"e":12773,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":12777,"e":12780,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":13084,"e":13087,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":13374,"e":13377,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":13665,"e":13668,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":13945,"e":13948,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":14324,"e":14336,"lib":"AffineConstructive.interfaces.subset","name":"unfold_image","kind":"ltac","local":false,"page":"../interfaces/subset.html"},{"s":14369,"e":14372,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":14411,"e":14414,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":14960,"e":14972,"lib":"AffineConstructive.interfaces.subset","name":"unfold_image","kind":"ltac","local":false,"page":"../interfaces/subset.html"},{"s":14987,"e":15002,"lib":"AffineConstructive.tactics.quote.base","name":"ltac:quote_injective","kind":"ltac","local":false,"page":"../tactics/quote/base.html"},{"s":15255,"e":15258,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":15432,"e":15435,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":15621,"e":15624,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[AffineConstructive.theory.subgroups.alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[AffineConstructive.theory.subgroups.sub_semigroup_op]], [[AffineConstructive.theory.subgroups.sub_monoid_unit]], [[AffineConstructive.theory.subgroups.sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[AffineConstructive.theory.subgroups.sub_monoid_monoid]], [[AffineConstructive.theory.subgroups.sub_group_group]], [[AffineConstructive.theory.subgroups.sub_group_abgroup]]), and the inclusion [[AffineConstructive.interfaces.subset.from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[AffineConstructive.theory.subgroups.sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[AffineConstructive.theory.subgroups.image_sub_grp]], [[AffineConstructive.theory.subgroups.preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled.","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","items":[{"name":"AffineConstructive.theory.subgroups.e","base":"e","kind":"abbrev","start":8,"body":null,"status":"ok","short":{"text":"Local abbreviation e for the monoid unit","status":"ok"},"long":{"text":"Within this file `e` names the unit of a monoid, [[AffineConstructive.interfaces.algebra_notation.mon_unit]], so that the conditions of a submonoid or subgroup read as in algebra: e ∊ Y. It is an abbreviation only and adds nothing to the unit itself.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.alt_Build_SubSemiGroup","base":"alt_Build_SubSemiGroup","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"Builds a subsemigroup of X from closure of Y under the operation","status":"ok"},"long":{"text":"A subset Y of a semigroup X is a subsemigroup when x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y for all x and y. The hypothesis uses the tensor: the two memberships are separate resources, each used once in producing the third, and because the implication is affine it carries its contrapositive: if x ∙ y is outside Y then x or y is (in the par sense).\n\nThis builder takes the closure law as a single argument and leaves the rest of [[AffineConstructive.interfaces.subalgebra.SubSemiGroup]] to resolution, so a reader can state a subsemigroup by its one mathematical condition. The two descriptions coincide, and the proof is a [[AffineConstructive.logic.aprop.tautology]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.alt_Build_SubMonoid","base":"alt_Build_SubMonoid","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"Builds a submonoid from closure under the operation and membership of the unit","status":"ok"},"long":{"text":"A submonoid of a monoid X is a subset Y closed under the operation, in the tensor form x ∊ Y ⊠ y ∊ Y ⊸ x ∙ y ∊ Y, that contains the unit e. This builder takes exactly these two conditions and assembles [[AffineConstructive.interfaces.subalgebra.SubMonoid]] from them. As with [[AffineConstructive.theory.subgroups.alt_Build_SubSemiGroup]], the closure law is affine and so also says that a product outside Y has a factor outside Y. The construction is a [[AffineConstructive.logic.aprop.tautology]]: the two descriptions are the same.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.alt_Build_SubStarSemiGroup","base":"alt_Build_SubStarSemiGroup","kind":"def","start":11,"body":null,"status":"ok","short":{"text":"Builds a sub-star-semigroup from closure under the operation and under the involution","status":"ok"},"long":{"text":"In a star semigroup X a subset Y is a sub-star-semigroup when it is closed under ∙, in the form x ∊ Y ⊠ y ∊ Y ⊸ x ∙ y ∊ Y, and under the involution, x ∊ Y ⊸ x⁻¹ ∊ Y. This builder takes the two closure laws and produces [[AffineConstructive.interfaces.subalgebra.SubStarSemiGroup]]. Closure under the involution is affine, so it also says that x lies outside Y when x⁻¹ does; since the involution is its own inverse, Y is then exactly invariant under it. The construction is a [[AffineConstructive.logic.aprop.tautology]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.alt_Build_SubStarMonoid","base":"alt_Build_SubStarMonoid","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"Builds a sub-star-monoid from closure under ∙ and the involution and membership of e","status":"ok"},"long":{"text":"A sub-star-monoid of a star monoid X is a subset closed under the operation and the involution and containing the unit. This builder takes these three conditions, the closure laws written with ⊠ and ⊸ as in [[AffineConstructive.theory.subgroups.alt_Build_SubStarSemiGroup]], and assembles [[AffineConstructive.interfaces.subalgebra.SubStarMonoid]] from them, which is a submonoid and a sub-star-semigroup at once. The construction is a [[AffineConstructive.logic.aprop.tautology]]. It is the step through which [[AffineConstructive.theory.subgroups.alt_Build_SubGroup]] is proved.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.alt_Build_SubGroup","base":"alt_Build_SubGroup","kind":"def","start":13,"body":[14,18],"status":"ok","short":{"text":"Builds a subgroup from closure under ∙ and inverses and membership of the unit","status":"ok"},"proof":[{"text":"Assume the three closure conditions: Y is closed under products, contains e, and is closed under inverses.","status":"ok","from":0,"to":1},{"text":"A subgroup is a sub-star-monoid of a group, and the group structure is already at hand. What remains is that Y is a sub-star-monoid.","status":"ok","from":2,"to":2},{"text":"A group is a star monoid with inversion as its involution ([[AffineConstructive.theory.groups.group_star_mon]]). So [[AffineConstructive.theory.subgroups.alt_Build_SubStarMonoid]] applies to the three assumptions and gives the sub-star-monoid.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.subgroups.full_sub_sg","base":"full_sub_sg","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"The full subset of a semigroup is a subsemigroup","status":"ok"},"long":{"text":"The full subset ⌈G⌉, whose membership is truth, is closed under the operation of any semigroup G: the closure law becomes 𝐓 ⊠ 𝐓 ⊸ 𝐓, a [[AffineConstructive.logic.aprop.tautology]]. A hint makes this the instance found for the full subset, so that G viewed as a subset of itself inherits the structures of the next sections.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.full_sub_mon","base":"full_sub_mon","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"The full subset of a monoid is a submonoid","status":"ok"},"long":{"text":"The full subset ⌈M⌉ of a monoid M is closed under the operation and contains the unit, since every membership condition is truth; the proof is a [[AffineConstructive.logic.aprop.tautology]]. It is registered as the instance resolution finds for the full subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.full_sub_star_sg","base":"full_sub_star_sg","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"The full subset of a star semigroup is a sub-star-semigroup","status":"ok"},"long":{"text":"The full subset ⌈G⌉ of a star semigroup is closed under the operation and the involution, every membership being truth; the proof is a [[AffineConstructive.logic.aprop.tautology]]. It is registered as the instance resolution finds for the full subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.full_sub_star_mon","base":"full_sub_star_mon","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The full subset of a star monoid is a sub-star-monoid","status":"ok"},"long":{"text":"The full subset ⌈M⌉ of a star monoid is closed under the operation and the involution and contains the unit, every membership being truth; the proof is a [[AffineConstructive.logic.aprop.tautology]]. It is the instance found for the full subset, and [[AffineConstructive.theory.subgroups.full_sub_grp]] is built from it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.full_sub_grp","base":"full_sub_grp","kind":"def","start":26,"body":[27,29],"status":"ok","short":{"text":"The full subset of a group is a subgroup","status":"ok"},"proof":[{"text":"The group structure is given. The full subset is a sub-star-monoid of the group, regarded as a star monoid, by [[AffineConstructive.theory.subgroups.full_sub_star_mon]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.full_normal_sub_grp","base":"full_normal_sub_grp","kind":"def","start":30,"body":[31,34],"status":"ok","short":{"text":"The full subset of a group is a normal subgroup","status":"ok"},"proof":[{"text":"The full subset is a subgroup by [[AffineConstructive.theory.subgroups.full_sub_grp]]. Normality remains: membership of x implies that every conjugate y ∙ x ∙ y⁻¹ is a member.","status":"ok","from":0,"to":1},{"text":"Fix x. Every element belongs to the full subset, so the conclusion is true outright, and the implication holds without using its hypothesis.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.subgroups.SubSemiGroup_proper_impl","base":"SubSemiGroup_proper_impl","kind":"prf","start":41,"body":[42,46],"status":"ok","short":{"text":"Equal subsets: if one is a subsemigroup, so is the other","status":"ok"},"proof":[{"text":"Assume H₁ = H₂ and that H₁ is a subsemigroup. The structural part of the claim for H₂ is immediate, so closure of H₂ under products remains.","status":"ok","from":0,"to":1},{"text":"Rewriting along the equality H₁ = H₂ replaces each membership in H₂ by membership in H₁. The goal is then closure of H₁, which is part of the hypothesis.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.subgroups.SubSemiGroup_fun","base":"SubSemiGroup_fun","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"Being a subsemigroup, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"Being a subsemigroup, packaged as a function from !𝒫 G to strict propositions by [[AffineConstructive.theory.set.make_weak_spred]], with [[AffineConstructive.theory.subgroups.SubSemiGroup_proper_impl]] as the proof that it respects equality of subsets. Declaring it canonical lets the rewriting system carry the hypothesis that H is a subsemigroup across an equality of subsets H₁ = H₂. The domain is the of-course set because the predicate is a base-logic proposition, which may use an equality of subsets as often as it likes.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.SubMonoid_proper_impl","base":"SubMonoid_proper_impl","kind":"prf","start":48,"body":[49,51],"status":"ok","short":{"text":"Equal subsets: if one is a submonoid, so is the other","status":"ok"},"proof":[{"text":"Assume N₁ = N₂ and that N₁ is a submonoid. Each condition for N₂ (closure under products, membership of the unit) becomes the corresponding condition for N₁ after rewriting along the equality, and the hypothesis supplies it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.SubMonoid_fun","base":"SubMonoid_fun","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"Being a submonoid, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"Being a submonoid, packaged by [[AffineConstructive.theory.set.make_weak_spred]] as a function from !𝒫 M to strict propositions, with [[AffineConstructive.theory.subgroups.SubMonoid_proper_impl]] as its invariance under equality of subsets. As a canonical structure it lets rewriting move the submonoid property along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.SubStarSemiGroup_proper_impl","base":"SubStarSemiGroup_proper_impl","kind":"prf","start":53,"body":[54,56],"status":"ok","short":{"text":"Equal subsets: if one is a sub-star-semigroup, so is the other","status":"ok"},"proof":[{"text":"Assume H₁ = H₂ and that H₁ is a sub-star-semigroup. Each condition for H₂ (closure under products and under the involution) becomes the corresponding condition for H₁ after rewriting along the equality, and the hypothesis supplies it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.SubStarSemiGroup_fun","base":"SubStarSemiGroup_fun","kind":"def","start":57,"body":null,"status":"ok","short":{"text":"Being a sub-star-semigroup, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"Being a sub-star-semigroup, packaged by [[AffineConstructive.theory.set.make_weak_spred]] as a function from !𝒫 G to strict propositions, with [[AffineConstructive.theory.subgroups.SubStarSemiGroup_proper_impl]] as its invariance under equality of subsets. As a canonical structure it lets rewriting move the property along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.SubStarMonoid_proper_impl","base":"SubStarMonoid_proper_impl","kind":"prf","start":58,"body":[59,61],"status":"ok","short":{"text":"Equal subsets: if one is a sub-star-monoid, so is the other","status":"ok"},"proof":[{"text":"Assume N₁ = N₂ and that N₁ is a sub-star-monoid. Each component for N₂ (its submonoid and sub-star-semigroup parts) becomes the corresponding component for N₁ after rewriting along the equality, and the hypothesis supplies it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.SubStarMonoid_fun","base":"SubStarMonoid_fun","kind":"def","start":62,"body":null,"status":"ok","short":{"text":"Being a sub-star-monoid, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"Being a sub-star-monoid, packaged by [[AffineConstructive.theory.set.make_weak_spred]] as a function from !𝒫 M to strict propositions, with [[AffineConstructive.theory.subgroups.SubStarMonoid_proper_impl]] as its invariance under equality of subsets. As a canonical structure it lets rewriting move the property along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.SubGroup_proper_impl","base":"SubGroup_proper_impl","kind":"prf","start":63,"body":[64,66],"status":"ok","short":{"text":"Equal subsets: if one is a subgroup, so is the other","status":"ok"},"proof":[{"text":"Assume H₁ = H₂ and that H₁ is a subgroup. The group structure carries over unchanged. Rewriting along the equality reduces the sub-star-monoid condition for H₂ to the one for H₁, which the hypothesis supplies.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.SubGroup_fun","base":"SubGroup_fun","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"Being a subgroup, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"Being a subgroup, packaged by [[AffineConstructive.theory.set.make_weak_spred]] as a function from !𝒫 G to strict propositions, with [[AffineConstructive.theory.subgroups.SubGroup_proper_impl]] as its invariance under equality of subsets. As a canonical structure it lets rewriting move the subgroup property along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.NormalSubGroup_proper_impl","base":"NormalSubGroup_proper_impl","kind":"prf","start":70,"body":[71,73],"status":"ok","short":{"text":"Equal subsets: if one is a normal subgroup, so is the other","status":"ok"},"proof":[{"text":"Assume H₁ = H₂ and that H₁ is a normal subgroup. Rewriting along the equality reduces both the subgroup condition and closure under conjugation for H₂ to the same conditions for H₁. The rewriting reaches the membership inside the universal quantifier over the conjugating element, and the hypothesis supplies both conditions.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.NormalSubGroup_fun","base":"NormalSubGroup_fun","kind":"def","start":74,"body":null,"status":"ok","short":{"text":"Being a normal subgroup, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"Being a normal subgroup, packaged by [[AffineConstructive.theory.set.make_weak_spred]] as a function from !𝒫 G to strict propositions, with [[AffineConstructive.theory.subgroups.NormalSubGroup_proper_impl]] as its invariance under equality of subsets. As a canonical structure it lets rewriting move normality along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.sub_semigroup_op","base":"sub_semigroup_op","kind":"def","start":75,"body":[76,83],"status":"ok","short":{"text":"The operation of a subsemigroup H: the product of G restricted to H","status":"ok"},"proof":[{"text":"An operation on H is a function from the tensor square H ⊗ H to H together with the fact that it preserves equality. Each is supplied in turn.","status":"ok","from":0,"to":1},{"text":"For a pair x, y of elements of H, take the product of x and y computed in G. It lies in H because H is a subsemigroup, so it is an element of H.","status":"ok","from":2,"to":4},{"text":"The map preserves equality because the inclusion of H into G carries it to the operation of G on the tensor product, which preserves equality. Equality on H is the equality of G pulled back along the inclusion, so [[AffineConstructive.theory.projected_set.projected_is_fun]] applies.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.subgroups.sub_monoid_unit","base":"sub_monoid_unit","kind":"def","start":85,"body":null,"status":"ok","short":{"text":"The unit of a submonoid N: the unit e of M, as a member of N","status":"ok"},"long":{"text":"A submonoid N contains the unit e of M, and this is that unit regarded as a member of N, built by [[AffineConstructive.interfaces.subset.to_subset]] from e and the proof that e ∊ N. With [[AffineConstructive.theory.subgroups.sub_semigroup_op]] it gives N, viewed as a set, the data of a monoid, which [[AffineConstructive.theory.subgroups.sub_monoid_monoid]] shows satisfy the monoid laws. A hint makes it the unit found for any subset viewed as a set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subgroups.sub_star_semigroup_inv","base":"sub_star_semigroup_inv","kind":"def","start":87,"body":[88,94],"status":"ok","short":{"text":"The involution of a sub-star-semigroup H: the inverse of G restricted to H","status":"ok"},"proof":[{"text":"An involution on H is a function on its points together with the proof that it preserves equality. As the function, send a point x of H to x⁻¹ computed in G, which lies in H because H is closed under the inverse.","status":"ok","from":0,"to":3},{"text":"It remains to show that this map preserves equality. Equality on H is the equality of G restricted to H, and the map commutes with the inverse of G, which preserves equality; [[AffineConstructive.theory.projected_set.projected_is_fun]] gives the conclusion.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.subgroups.sub_semigroup_semigroup","base":"sub_semigroup_semigroup","kind":"prf","start":99,"body":[100,103],"status":"ok","short":{"text":"A subsemigroup, as a set with the restricted operation, is a semigroup","status":"ok"},"proof":[{"text":"Fix three points x, y, z of H. Associativity asks that x ∙ (y ∙ z) = x ∙ y ∙ z in H.","status":"ok","from":0,"to":1},{"text":"The product in H is the product in G and equality in H is the equality of G, so the equation is associativity of G at x, y, z ([[AffineConstructive.interfaces.common_props.associativity]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.subgroups.sub_semigroup_com_semigroup","base":"sub_semigroup_com_semigroup","kind":"prf","start":105,"body":[106,110],"status":"ok","short":{"text":"A subsemigroup of a commutative semigroup is a commutative semigroup","status":"ok"},"proof":[{"text":"The semigroup laws of H come from [[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]], so only commutativity is left to prove.","status":"ok","from":0,"to":1},{"text":"Fix x and y in H. Since the operation and the equality of H are those of G, x ∙ y = y ∙ x is commutativity of G at x and y ([[AffineConstructive.interfaces.common_props.commutativity]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.subgroups.sub_semigroup_sl","base":"sub_semigroup_sl","kind":"prf","start":112,"body":[113,117],"status":"ok","short":{"text":"A subsemigroup of a semilattice is a semilattice","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.subgroups.sub_semigroup_com_semigroup]], H is a commutative semigroup, so only idempotency is left to prove.","status":"ok","from":0,"to":1},{"text":"Fix x in H. The equation x ∙ x = x is idempotency of G at x ([[AffineConstructive.interfaces.common_props.binary_idempotency]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.subgroups.sub_monoid_monoid","base":"sub_monoid_monoid","kind":"prf","start":119,"body":[120,130],"status":"ok","short":{"text":"A submonoid, with the restricted operation and unit, is a monoid","status":"ok"},"proof":[{"text":"A monoid is a semigroup with a left and a right identity. The semigroup part is [[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]], which leaves the two identity laws for the unit e of M, viewed as a member of N.","status":"ok","from":0,"to":3},{"text":"Fix x in N. The equation e ∙ x = x holds in N because it holds in M ([[AffineConstructive.interfaces.common_props.left_identity]]).","status":"ok","from":4,"to":6},{"text":"In the same way, for x in N, x ∙ e = x is the right identity law of M ([[AffineConstructive.interfaces.common_props.right_identity]]).","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.theory.subgroups.sub_monoid_com_monoid","base":"sub_monoid_com_monoid","kind":"prf","start":132,"body":[133,137],"status":"ok","short":{"text":"A submonoid of a commutative monoid is a commutative monoid","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.subgroups.sub_monoid_monoid]], N is a monoid, so only commutativity is left to prove.","status":"ok","from":0,"to":1},{"text":"Fix x and y in N. The equation x ∙ y = y ∙ x is commutativity of M at x and y ([[AffineConstructive.interfaces.common_props.commutativity]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.subgroups.sub_monoid_bounded_sl","base":"sub_monoid_bounded_sl","kind":"prf","start":139,"body":[140,142],"status":"ok","short":{"text":"A submonoid of a bounded semilattice is a bounded semilattice","status":"ok"},"proof":[{"text":"A bounded semilattice is a commutative monoid whose operation is a semilattice. Both parts are already known for N: the first from [[AffineConstructive.theory.subgroups.sub_monoid_com_monoid]], the second from [[AffineConstructive.theory.subgroups.sub_semigroup_sl]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.sub_star_semigroup_star_semigroup","base":"sub_star_semigroup_star_semigroup","kind":"prf","start":144,"body":[145,155],"status":"ok","short":{"text":"A sub-star-semigroup, with the restricted operation and involution, is a star semigroup","status":"ok"},"proof":[{"text":"A star semigroup is a semigroup with an involution that reverses products. The semigroup part is [[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]], which leaves those two laws for the restricted inverse [[AffineConstructive.theory.subgroups.sub_star_semigroup_inv]].","status":"ok","from":0,"to":3},{"text":"Fix x in H. Applying the inverse twice returns x, because the inverse of G is involutive ([[AffineConstructive.theory.common_props.involutive_alt]]).","status":"ok","from":4,"to":6},{"text":"Fix x and y in H. The equation (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ is the anti-distributivity law of G at x and y ([[AffineConstructive.interfaces.common_props.anti_distribute]]).","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.theory.subgroups.sub_star_monoid_star_monoid","base":"sub_star_monoid_star_monoid","kind":"prf","start":157,"body":[158,160],"status":"ok","short":{"text":"A sub-star-monoid, with the restricted structure, is a star monoid","status":"ok"},"proof":[{"text":"A star monoid is a monoid that is also a star semigroup. Both parts are already known for N: the first from [[AffineConstructive.theory.subgroups.sub_monoid_monoid]], the second from [[AffineConstructive.theory.subgroups.sub_star_semigroup_star_semigroup]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.sub_group_group","base":"sub_group_group","kind":"prf","start":162,"body":[163,173],"status":"ok","short":{"text":"A subgroup, with the restricted operation, unit and inverse, is a group","status":"ok"},"proof":[{"text":"A group is a monoid with left and right inverses. The monoid part is [[AffineConstructive.theory.subgroups.sub_monoid_monoid]], which leaves the two inverse laws for the restricted inverse.","status":"ok","from":0,"to":3},{"text":"Fix x in H. The equation x⁻¹ ∙ x = e is the left inverse law of G at x ([[AffineConstructive.interfaces.common_props.left_inverse]]).","status":"ok","from":4,"to":6},{"text":"In the same way, for x in H, x ∙ x⁻¹ = e is the right inverse law of G ([[AffineConstructive.interfaces.common_props.right_inverse]]).","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.theory.subgroups.sub_group_abgroup","base":"sub_group_abgroup","kind":"prf","start":175,"body":[176,180],"status":"ok","short":{"text":"A subgroup of an abelian group is an abelian group","status":"ok"},"proof":[{"text":"The group axioms for H come from [[AffineConstructive.theory.subgroups.sub_group_group]]; what remains is that the restricted operation is commutative.","status":"ok","from":0,"to":1},{"text":"Fix x and y in H. Their product in H is their product in G, so x ∙ y = y ∙ x is the commutativity of G applied to x and y viewed as elements of G.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.theory.subgroups.sub_abgroup_normal","base":"sub_abgroup_normal","kind":"prf","start":182,"body":[183,190],"status":"ok","short":{"text":"Every subgroup of an abelian group is normal","status":"ok"},"proof":[{"text":"H is already a subgroup; what remains for normality is that it is closed under conjugation: x ∊ H implies y ∙ x ∙ y⁻¹ ∊ H for every y.","status":"ok","from":0,"to":1},{"text":"Fix x, and then fix the conjugating element y.","status":"ok","from":2,"to":4},{"text":"By commutativity y ∙ x = x ∙ y, so the conjugate is x ∙ y ∙ y⁻¹, which cancels to x; membership of x in H is then the hypothesis itself.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.theory.subgroups.from_sub_semigroup","base":"from_sub_semigroup","kind":"prf","start":192,"body":[193,195],"status":"ok","short":{"text":"The inclusion of a subsemigroup into its semigroup is a semigroup morphism","status":"ok"},"proof":[{"text":"Both sides are semigroups, H by [[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]], and the operation of H is the operation of G restricted, so the inclusion takes x ∙ y to x ∙ y on the nose and preserves the operation by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.from_sub_monoid","base":"from_sub_monoid","kind":"prf","start":197,"body":[198,200],"status":"ok","short":{"text":"The inclusion of a submonoid into its monoid is a monoid morphism","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.groups.alt_Build_Monoid_Morphism]] it suffices that the inclusion preserves the operation and the unit. Both hold by reflexivity, since the operation and the unit of N are those of M.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.from_sub_star_semigroup","base":"from_sub_star_semigroup","kind":"prf","start":203,"body":[204,206],"status":"ok","short":{"text":"The inclusion of a sub-star-semigroup into its star semigroup is a star-semigroup morphism","status":"ok"},"proof":[{"text":"The inclusion is already a semigroup morphism by [[AffineConstructive.theory.subgroups.from_sub_semigroup]], and H is a star semigroup by [[AffineConstructive.theory.subgroups.sub_star_semigroup_star_semigroup]]. It preserves the involution by reflexivity, because the involution of H is the inverse of G restricted to H.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.from_sub_star_monoid","base":"from_sub_star_monoid","kind":"prf","start":208,"body":[209,211],"status":"ok","short":{"text":"The inclusion of a sub-star-monoid into its star monoid is a star-monoid morphism","status":"ok"},"proof":[{"text":"A star-monoid morphism is one that is both a monoid morphism and a star-semigroup morphism. The inclusion is both, by [[AffineConstructive.theory.subgroups.from_sub_monoid]] and [[AffineConstructive.theory.subgroups.from_sub_star_semigroup]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.image_sub_sg","base":"image_sub_sg","kind":"prf","start":214,"body":[215,229],"status":"ok","short":{"text":"The image of a subsemigroup under a semigroup morphism is a subsemigroup","status":"ok"},"proof":[{"text":"The image f⁎ U is a subset of Y, so only closure under the operation remains. Fix y₁ and y₂ in Y. Unfolding the image, each membership yᵢ ∊ f⁎ U says there is an x in U with f x = yᵢ.","status":"ok","from":0,"to":3},{"text":"Take the points x₁ and x₂ that the two existential hypotheses provide.","status":"ok","from":4,"to":5},{"text":"Take x₁ ∙ x₂ as the witness. Each hypothesis is a tensor of an equation and a membership. Regrouping the four factors gives the two equations f xᵢ = yᵢ on one side and the two memberships xᵢ ∊ U on the other, so each pair can prove its own conjunct: f (x₁ ∙ x₂) = y₁ ∙ y₂ from the equations, and x₁ ∙ x₂ ∊ U from the memberships.","status":"ok","from":6,"to":8},{"text":"Since f preserves the operation, f (x₁ ∙ x₂) = f x₁ ∙ f x₂. The two equations then give f x₁ ∙ f x₂ = y₁ ∙ y₂, because the operation of Y is a function on pairs and so preserves equality.","status":"ok","from":9,"to":11},{"text":"The two memberships give x₁ ∙ x₂ ∊ U because U is closed under the operation.","status":"ok","from":12,"to":14}]},{"name":"AffineConstructive.theory.subgroups.preimage_sub_sg","base":"preimage_sub_sg","kind":"prf","start":231,"body":[232,238],"status":"ok","short":{"text":"The preimage of a subsemigroup under a semigroup morphism is a subsemigroup","status":"ok"},"proof":[{"text":"Only closure under the operation remains. Fix x₁ and x₂ in X. Membership in the preimage f* U means membership of the value of f in U, so the goal is that f x₁ ∊ U and f x₂ ∊ U imply f (x₁ ∙ x₂) ∊ U.","status":"ok","from":0,"to":3},{"text":"Since f preserves the operation, f (x₁ ∙ x₂) = f x₁ ∙ f x₂. The membership of this product in U is closure of U under the operation.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.subgroups.image_sub_mon","base":"image_sub_mon","kind":"prf","start":240,"body":[241,245],"status":"ok","short":{"text":"The image of a submonoid under a monoid morphism is a submonoid","status":"ok"},"proof":[{"text":"The image is a subsemigroup by [[AffineConstructive.theory.subgroups.image_sub_sg]], so what remains is that the unit e of Y lies in f⁎ U, that is, that some x ∊ U has f x = e.","status":"ok","from":0,"to":2},{"text":"Take the unit of X as the witness. It is sent to e because f preserves the unit ([[AffineConstructive.interfaces.abstract_algebra.preserves_unit]]), and it lies in U because U is a submonoid.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.subgroups.preimage_sub_mon","base":"preimage_sub_mon","kind":"prf","start":247,"body":[248,252],"status":"ok","short":{"text":"The preimage of a submonoid under a monoid morphism is a submonoid","status":"ok"},"proof":[{"text":"The preimage is a subsemigroup by [[AffineConstructive.theory.subgroups.preimage_sub_sg]], so what remains is that the unit of X lies in f* U, that is, f e ∊ U.","status":"ok","from":0,"to":2},{"text":"Since f preserves the unit, f e = e, and the unit of Y lies in the submonoid U.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.subgroups.image_sub_star_sg","base":"image_sub_star_sg","kind":"prf","start":254,"body":[255,268],"status":"ok","short":{"text":"The image of a sub-star-semigroup under a star-semigroup morphism is a sub-star-semigroup","status":"ok"},"proof":[{"text":"The image f⁎ U is already a subsemigroup by [[AffineConstructive.theory.subgroups.image_sub_sg]]. That leaves closure under the involution: y ∊ f⁎ U implies y⁻¹ ∊ f⁎ U for every y.","status":"ok","from":0,"to":1},{"text":"Fix y and unfold the image: y lies in f⁎ U when some x with f x = y lies in U. Let x be such a point; the hypothesis f x = y ⊠ x ∊ U remains.","status":"ok","from":2,"to":5},{"text":"Take x⁻¹ as the witness. The tensor splits factor by factor, so the equality f x = y must give f x⁻¹ = y⁻¹, and the membership x ∊ U must give x⁻¹ ∊ U.","status":"ok","from":6,"to":7},{"text":"Since f preserves the involution, f x⁻¹ = (f x)⁻¹. What is left is (f x)⁻¹ = y⁻¹, which follows from f x = y because inversion is a function.","status":"ok","from":8,"to":10},{"text":"The second factor is the closure of U under inversion, which holds because U is a sub-star-semigroup.","status":"ok","from":11,"to":13}]},{"name":"AffineConstructive.theory.subgroups.preimage_sub_star_sg","base":"preimage_sub_star_sg","kind":"prf","start":270,"body":[271,277],"status":"ok","short":{"text":"The preimage of a sub-star-semigroup under a star-semigroup morphism is a sub-star-semigroup","status":"ok"},"proof":[{"text":"The preimage f* U is already a subsemigroup by [[AffineConstructive.theory.subgroups.preimage_sub_sg]]. That leaves closure under the involution.","status":"ok","from":0,"to":1},{"text":"Fix x. Membership in the preimage means f x ∊ U, so the goal is that f x ∊ U implies f x⁻¹ ∊ U. Since f preserves the involution, f x⁻¹ is replaced by (f x)⁻¹.","status":"ok","from":2,"to":4},{"text":"That f x ∊ U implies (f x)⁻¹ ∊ U is the closure of U under inversion.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.theory.subgroups.image_sub_star_mon","base":"image_sub_star_mon","kind":"prf","start":279,"body":[280,282],"status":"ok","short":{"text":"The image of a sub-star-monoid under a star-monoid morphism is a sub-star-monoid","status":"ok"},"proof":[{"text":"A sub-star-monoid is a submonoid that is also closed under the involution. The image is a submonoid by [[AffineConstructive.theory.subgroups.image_sub_mon]] and is closed under the involution by [[AffineConstructive.theory.subgroups.image_sub_star_sg]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.preimage_sub_star_mon","base":"preimage_sub_star_mon","kind":"prf","start":284,"body":[285,287],"status":"ok","short":{"text":"The preimage of a sub-star-monoid under a star-monoid morphism is a sub-star-monoid","status":"ok"},"proof":[{"text":"The two parts are the preimage results already proved. The preimage is a submonoid by [[AffineConstructive.theory.subgroups.preimage_sub_mon]] and is closed under the involution by [[AffineConstructive.theory.subgroups.preimage_sub_star_sg]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.image_sub_grp","base":"image_sub_grp","kind":"prf","start":289,"body":[290,292],"status":"ok","short":{"text":"The image of a subgroup under a semigroup morphism between groups is a subgroup","status":"ok"},"proof":[{"text":"A semigroup morphism between groups preserves the unit and inverses, so by [[AffineConstructive.theory.groups.group_mor]] it is a star-monoid morphism. The image of the subgroup is then a sub-star-monoid by [[AffineConstructive.theory.subgroups.image_sub_star_mon]], and that is what a subgroup is.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.preimage_sub_grp","base":"preimage_sub_grp","kind":"prf","start":294,"body":[295,297],"status":"ok","short":{"text":"The preimage of a subgroup under a semigroup morphism between groups is a subgroup","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.groups.group_mor]], f is a star-monoid morphism. The preimage is then a sub-star-monoid by [[AffineConstructive.theory.subgroups.preimage_sub_star_mon]], and so it is a subgroup.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.image_preserves_sub_sg_com","base":"image_preserves_sub_sg_com","kind":"prf","start":299,"body":[300,309],"status":"ok","short":{"text":"If a subsemigroup U is commutative, so is its image f⁎ U under a semigroup morphism","status":"ok"},"proof":[{"text":"Take two elements y₁, y₂ of the image. The induced operation is the operation of Y, so the goal is y₁ ∙ y₂ = y₂ ∙ y₁.","status":"ok","from":0,"to":2},{"text":"Unfolding membership in the image gives x₁, x₂ ∈ U with f x₁ = y₁ and f x₂ = y₂. Rewriting by these equalities removes y₁ and y₂, leaving f x₁ ∙ f x₂ = f x₂ ∙ f x₁.","status":"ok","from":3,"to":5},{"text":"Because f preserves the operation, the goal becomes f (x₁ ∙ x₂) = f (x₂ ∙ x₁). Since f is a function, x₁ ∙ x₂ = x₂ ∙ x₁ suffices.","status":"ok","from":6,"to":7},{"text":"This is the commutativity of U, applied to x₁ and x₂ taken as elements of U.","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.theory.subgroups.preimage_preserves_sub_sg_com","base":"preimage_preserves_sub_sg_com","kind":"prf","start":311,"body":[312,321],"status":"ok","short":{"text":"Under an injective semigroup morphism f, a commutative subsemigroup U has commutative preimage f* U","status":"ok"},"proof":[{"text":"Assume U is commutative, and take two elements x₁, x₂ of the preimage. The goal is x₁ ∙ x₂ = x₂ ∙ x₁ in X.","status":"ok","from":0,"to":3},{"text":"Membership in the preimage means f x₁ ∊ U and f x₂ ∊ U.","status":"ok","from":4,"to":6},{"text":"Since f is injective and preserves the operation, it suffices to prove the equality after applying f, which is f x₁ ∙ f x₂ = f x₂ ∙ f x₁ in Y.","status":"ok","from":7,"to":7},{"text":"This is the commutativity of U, applied to f x₁ and f x₂ taken as elements of U.","status":"ok","from":8,"to":9}]},{"name":"AffineConstructive.theory.subgroups.image_com_sg","base":"image_com_sg","kind":"prf","start":322,"body":[323,325],"status":"ok","short":{"text":"The image of a commutative subsemigroup under a semigroup morphism is a commutative semigroup","status":"ok"},"proof":[{"text":"The image is a subsemigroup by [[AffineConstructive.theory.subgroups.image_sub_sg]], so with the restricted operation it is a semigroup ([[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]]). Its operation is commutative by [[AffineConstructive.theory.subgroups.image_preserves_sub_sg_com]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.image_com_mon","base":"image_com_mon","kind":"prf","start":326,"body":[327,329],"status":"ok","short":{"text":"The image of a commutative submonoid under a monoid morphism is a commutative monoid","status":"ok"},"proof":[{"text":"The image is a submonoid by [[AffineConstructive.theory.subgroups.image_sub_mon]], so it is a monoid ([[AffineConstructive.theory.subgroups.sub_monoid_monoid]]). Its operation is commutative by [[AffineConstructive.theory.subgroups.image_preserves_sub_sg_com]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subgroups.image_abgrp","base":"image_abgrp","kind":"prf","start":330,"body":[331,333],"status":"ok","short":{"text":"The image of an abelian subgroup under a semigroup morphism between groups is an abelian group","status":"ok"},"proof":[{"text":"An abelian group is a group whose operation is commutative, so there are two things to check. The image f⁎ U is a subgroup by [[AffineConstructive.theory.subgroups.image_sub_grp]], so with the restricted structure it is a group by [[AffineConstructive.theory.subgroups.sub_group_group]]. Commutativity transfers from U: the image of the abelian group U keeps commutativity, which closes the proof.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.subalgebra":{"page":"../interfaces/subalgebra.html","short":"Subsemigroups, submonoids, subgroups, sub-near-rings and sublattices as closure predicates on subsets","summary":"This file defines substructures as predicates on subsets U : 𝒫 G, each packaging the ambient structure with closure conditions on U: [[SubSemiGroup]] (closed under ∙), [[SubMonoid]] (also containing the unit), [[SubStarSemiGroup]] and [[SubStarMonoid]] (closed under the involution), [[SubGroup]], and [[NormalSubGroup]] (closed under conjugation y ∙ x ∙ y⁻¹). Binary closure is stated with the tensor, x ∊ U ⊠ y ∊ U ⊸ x ∙ y ∊ U, so each membership is used once and the contrapositive comes with it. The generic notions are renamed for addition and multiplication, with accessors such as [[sub_add_sg_closed]] and [[sub_mul_one_closed]] in the ring notation, and combined into [[SubNearRg]], [[SubNearRig]], [[SubNearRng]] and [[SubNearRing]] over the near-ring structures of abstract_algebra. In the same way the meet and join semilattice versions are the semigroup and monoid notions for ⊓ and ⊔, and [[SubLattice]] joins the two."},"AffineConstructive.theory.groups":{"page":"groups.html","short":"Groups, monoids and their morphisms: basic laws, opposites, transfer along injections","summary":"The file develops the elementary theory of semigroups, monoids, star semigroups and groups on affine sets. It gives alternative constructors for each structure, with commutativity standing in for one of each pair of left and right laws. It shows that every structure carries over to the opposite semigroup, which lets left-handed lemmas give their right-handed versions. For groups it proves the standard laws: the unit is unique, a group is a star monoid, (x ∙ y)⁻¹ = y⁻¹ ∙ x⁻¹ and e⁻¹ = e, multiplication on either side is injective, and x ∙ y⁻¹ = e if and only if x = y. A group whose operation is strong has strong equality. For morphisms it proves that identities, composites and inverses of bijective morphisms are morphisms, that inversion is a morphism into the opposite semigroup, and that a semigroup morphism between groups preserves the unit and the inverse ([[group_mor]]). The projected_… lemmas pull each structure back along an injective map that preserves the operations. Last come the simplification rules behind the [[group_simplify]] tactic and the quote rules that let rewriting pass through products and inverses along a morphism."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.interfaces.set":{"page":"../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.projected_set":{"page":"projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.orders.orders":{"page":"../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.subset":{"page":"../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.replc":{"page":"../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.tactics.simplify.simplify":{"page":"../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.logic.srelations":{"page":"../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

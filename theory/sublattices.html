tive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export interfaces.subalgebra theory.lattices theory.subgroups.\nRequire Import sprop.\nRequire Import interfaces.set theory.set theory.projected_set.\nRequire Import logic.aprop.\nRequire Import easy replc rewrite_preserves.\n\nDefinition alt_Build_MeetSubSemiLattice : ∀ `{MeetSemiLattice L} {U:𝒫 L},\n  (∀ x y, x ∊ U ⊠ y ∊ U ⊸ x ⊓ y ∊ U) → MeetSubSemiLattice U\n:= @alt_Build_SubSemiGroup.\n\nDefinition alt_Build_JoinSubSemiLattice : ∀ `{JoinSemiLattice L} {U:𝒫 L},\n  (∀ x y, x ∊ U ⊠ y ∊ U ⊸ x ⊔ y ∊ U) → JoinSubSemiLattice U\n:= @alt_Build_SubSemiGroup.\n\nDefinition alt_Build_MeetSubBoundedSemiLattice : ∀ `{BoundedMeetSemiLattice L} {U:𝒫 L},\n  (∀ x y, x ∊ U ⊠ y ∊ U ⊸ x ⊓ y ∊ U)\n → ⊤ ∊ U\n → MeetSubBoundedSemiLattice U\n:= @alt_Build_SubMonoid.\n\nDefinition alt_Build_JoinSubBoundedSemiLattice : ∀ `{BoundedJoinSemiLattice L} {U:𝒫 L},\n  (∀ x y, x ∊ U ⊠ y ∊ U ⊸ x ⊔ y ∊ U)\n → ⊥ ∊ U\n → JoinSubBoundedSemiLattice U\n:= @alt_Build_SubMonoid.\n\n\nGlobal Hint Extern 4 (apos (_ ⊓ _ ∊ _)) => simple notypeclasses refine (andl (sub_meet_closed _ _) _) : typeclass_instances.\nGlobal Hint Extern 4 (apos (_ ⊔ _ ∊ _)) => simple notypeclasses refine (andl (sub_join_closed _ _) _) : typeclass_instances.\nGlobal Hint Extern 4 (apos (⊤ ∊ _)) => simple notypeclasses refine sub_top_closed : typeclass_instances.\nGlobal Hint Extern 4 (apos (⊥ ∊ _)) => simple notypeclasses refine sub_bot_closed : typeclass_instances.\n\nDefinition full_meet_sub_sl  : ∀ `{MeetSemiLattice L}, MeetSubSemiLattice (full_subset L) := @full_sub_sg.\nDefinition full_meet_sub_bsl : ∀ `{BoundedMeetSemiLattice L}, MeetSubBoundedSemiLattice (full_subset L) := @full_sub_mon.\nDefinition full_join_sub_sl  : ∀ `{JoinSemiLattice L}, JoinSubSemiLattice (full_subset L) := @full_sub_sg.\nDefinition full_join_sub_bsl : ∀ `{BoundedJoinSemiLattice L}, JoinSubBoundedSemiLattice (full_subset L) := @full_sub_mon.\n\nGlobal Hint Extern 2 (MeetSubSemiLattice (full_subset _)) => simple notypeclasses refine full_meet_sub_sl : typeclass_instances.\nGlobal Hint Extern 2 (MeetSubBoundedSemiLattice (full_subset _)) => simple notypeclasses refine full_meet_sub_bsl : typeclass_instances.\nGlobal Hint Extern 2 (JoinSubSemiLattice (full_subset _)) => simple notypeclasses refine full_join_sub_sl : typeclass_instances.\nGlobal Hint Extern 2 (JoinSubBoundedSemiLattice (full_subset _)) => simple notypeclasses refine full_join_sub_bsl : typeclass_instances.\n\n\n(** Substructure predicates respect equality of subsets. *)\n\nCanonical Structure MeetSubSemiLattice_fun {L m} :=\n  make_fun_alt (@MeetSubSemiLattice L m) (@SubSemiGroup_fun L m).\n\nCanonical Structure MeetSubBoundedSemiLattice_fun {L m t} :=\n  make_fun_alt (@MeetSubBoundedSemiLattice L m t) (@SubMonoid_fun L m t).\n\nCanonical Structure JoinSubSemiLattice_fun {L j} :=\n  make_fun_alt (@JoinSubSemiLattice L j) (@SubSemiGroup_fun L j).\n\nCanonical Structure JoinSubBoundedSemiLattice_fun {L j b} :=\n  make_fun_alt (@JoinSubBoundedSemiLattice L j b) (@SubMonoid_fun L j b).\n\n(** Induced operations on subsets when viewed as sets. *)\n\nDefinition sub_meet_sl_meet@{u} : ∀ `{@MeetSubSemiLattice@{u} L m U}, Meet U := @sub_semigroup_op.\nDefinition sub_join_sl_join@{u} : ∀ `{@JoinSubSemiLattice@{u} L j U}, Join U := @sub_semigroup_op.\n\nDefinition sub_meet_bsl_top@{u} : ∀ `{@MeetSubBoundedSemiLattice@{u} L m t U}, Top U := @sub_monoid_unit.\nDefinition sub_join_bsl_bot@{u} : ∀ `{@JoinSubBoundedSemiLattice@{u} L j b U}, Bottom U := @sub_monoid_unit.\n\nArguments sub_meet_sl_meet {L m} U {_}.\nArguments sub_join_sl_join {L j} U {_}.\nArguments sub_meet_bsl_top {L m t} U {_}.\nArguments sub_join_bsl_bot {L j b} U {_}.\n\nGlobal Hint Extern 2 (Meet (subset_to_set ?U)) => refine (sub_meet_sl_meet U) : typeclass_instances.\nGlobal Hint Extern 2 (Join (subset_to_set ?U)) => refine (sub_join_sl_join U) : typeclass_instances.\nGlobal Hint Extern 2 (Top    (subset_to_set ?U)) => refine (sub_meet_bsl_top U) : typeclass_instances.\nGlobal Hint Extern 2 (Bottom (subset_to_set ?U)) => refine (sub_join_bsl_bot U) : typeclass_instances.\n\n(** Sub structures are instances of structures when viewed as sets. *)\n\nDefinition sub_meet_sl@{u} : ∀ {L:set@{u}} `{P:MeetSemiLattice L} {U:𝒫 L} `{!MeetSubSemiLattice U}, MeetSemiLattice U := @sub_semigroup_sl.\nDefinition sub_meet_bsl@{u} : ∀ {L:set@{u}} `{P:BoundedMeetSemiLattice L} {U:𝒫 L} `{!MeetSubBoundedSemiLattice U}, BoundedMeetSemiLattice U := @sub_monoid_bounded_sl.\nDefinition sub_join_sl@{u} : ∀ {L:set@{u}} `{P:JoinSemiLattice L} {U:𝒫 L} `{!JoinSubSemiLattice U}, JoinSemiLattice U := @sub_semigroup_sl.\nDefinition sub_join_bsl@{u} : ∀ {L:set@{u}} `{P:BoundedJoinSemiLattice L} {U:𝒫 L} `{!JoinSubBoundedSemiLattice U}, BoundedJoinSemiLattice U := @sub_monoid_bounded_sl.\n\nGlobal Hint Extern 2 (MeetSemiLattice (subset_to_set _)) => simple notypeclasses refine sub_meet_sl : typeclass_instances.\nGlobal Hint Extern 2 (BoundedMeetSemiLattice (subset_to_set _)) => simple notypeclasses refine sub_meet_bsl : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLattice (subset_to_set _)) => simple notypeclasses refine sub_join_sl : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLattice (subset_to_set _)) => simple notypeclasses refine sub_join_bsl : typeclass_instances.\n\n(** Inclusion of the substructure is structure preserving *)\n\nDefinition from_meet_sub_sl : ∀ `{@MeetSubSemiLattice L m U}, MeetSemiLattice_Morphism (from_subset U) := @from_sub_semigroup.\nDefinition from_join_sub_sl : ∀ `{@JoinSubSemiLattice L j U}, JoinSemiLattice_Morphism (from_subset U) := @from_sub_semigroup.\nGlobal Hint Extern 2 (MeetSemiLattice_Morphism (from_subset _)) => simple notypeclasses refine from_meet_sub_sl : typeclass_instances.\nGlobal Hint Extern 2 (JoinSemiLattice_Morphism (from_subset _)) => simple notypeclasses refine from_join_sub_sl : typeclass_instances.\n\nDefinition from_meet_sub_bsl : ∀ `{@MeetSubBoundedSemiLattice L m t U}, BoundedMeetSemiLattice_Morphism (from_subset U) := @from_sub_monoid.\nDefinition from_join_sub_bsl : ∀ `{@JoinSubBoundedSemiLattice L j b U}, BoundedJoinSemiLattice_Morphism (from_subset U) := @from_sub_monoid.\nGlobal Hint Extern 2 (BoundedMeetSemiLattice_Morphism (from_subset _)) => simple notypeclasses refine from_meet_sub_bsl : typeclass_instances.\nGlobal Hint Extern 2 (BoundedJoinSemiLattice_Morphism (from_subset _)) => simple notypeclasses refine from_join_sub_bsl : typeclass_instances.\n\n(** Sublattices *)\n\nLemma alt_Build_SubLattice `{P:@Lattice L m j} (U : 𝒫 L) : MeetSubSemiLattice U → JoinSubSemiLattice U → SubLattice U.\nProof. intros; now split. Qed.\n\nLemma alt_Build_SubLattice2 `{P:@Lattice L m j} (U : 𝒫 L) :\n  (∀ x y, x ∊ U ⊠ y ∊ U ⊸ x ⊓ y ∊ U)\n → (∀ x y, x ∊ U ⊠ y ∊ U ⊸ x ⊔ y ∊ U)\n → SubLattice U.\nProof. intros; apply alt_Build_SubLattice; [ now apply alt_Build_MeetSubSemiLattice | now apply alt_Build_JoinSubSemiLattice ]. Qed.\n\nDefinition full_sub_lattice : ∀ `{Lattice L}, SubLattice (full_subset L).  Proof. intros; now split. Qed.\nGlobal Hint Extern 2 (SubLattice (full_subset _)) => simple notypeclasses refine full_sub_lattice : typeclass_instances.\n\n(** Substructure predicates respect equality of subsets. *)\n\nLemma SubLattice_proper_impl {L m j} U₁ U₂\n  : U₁ = U₂ → impl (@SubLattice L m j U₁, SubLattice U₂).\nProof. intros E P; split; try exact _; now rew <-E. Qed.\nCanonical Structure SubLattice_fun {L m j} :=\n  make_weak_spred (@SubLattice L m j) SubLattice_proper_impl.\n\n(** Sub structures are instances of structures when viewed as sets. *)\nLemma sub_lattice_lattice `{@SubLattice L m j U} : Lattice U.\nProof. split; try exact _.\n+ intros x y. exact (join_meet_absorption (x:L) (y:L)).\n+ intros x y. exact (meet_join_absorption (x:L) (y:L)).\nQed.\nGlobal Hint Extern 2 (Lattice (subset_to_set _)) => simple notypeclasses refine sub_lattice_lattice : typeclass_instances.\n\nLemma sub_lattice_distr_lattice `{@DistributiveLattice L m j} {U:𝒫 L} `{!SubLattice U} : DistributiveLattice U.\nProof. split; try exact _.\n+ intros x y z. exact (join_meet_distr_l (x:L) (y:L) (z:L)).\n+ intros x y z. exact (meet_join_distr_l (x:L) (y:L) (z:L)).\nQed.\nGlobal Hint Extern 2 (DistributiveLattice (subset_to_set _)) => simple notypeclasses refine sub_lattice_distr_lattice : typeclass_instances.\n\n(** Inclusion of the substructure is structure preserving *)\n\nLemma from_sub_lattice `{@SubLattice L m j U} : Lattice_Morphism (from_subset U).\nProof. now split. Qed.\nGlobal Hint Extern 2 (Lattice_Morphism (from_subset _)) => simple notypeclasses refine from_sub_lattice : typeclass_instances.\n\n(** Image and preimage *)\nImport image_notation.\n\nDefinition image_meet_sub_sl@{u} : ∀ {X Y:set@{u}} `{@MeetSemiLattice_Morphism X Y mX mY f} {U:𝒫 X} `{!MeetSubSemiLattice U}, MeetSubSemiLattice (f⁎ U) := @image_sub_sg.\nDefinition image_join_sub_sl@{u} : ∀ {X Y:set@{u}} `{@JoinSemiLattice_Morphism X Y jX jY f} {U:𝒫 X} `{!JoinSubSemiLattice U}, JoinSubSemiLattice (f⁎ U) := @image_sub_sg.\nGlobal Hint Extern 2 (MeetSubSemiLattice (func_op _⁎ _)) => simple notypeclasses refine image_meet_sub_sl : typeclass_instances.\nGlobal Hint Extern 2 (JoinSubSemiLattice (func_op _⁎ _)) => simple notypeclasses refine image_join_sub_sl : typeclass_instances.\n\nDefinition preimage_meet_sub_sl@{u} : ∀ {X Y:set@{u}} `{@MeetSemiLattice_Morphism X Y mX mY f} {U:𝒫 Y} `{!MeetSubSemiLattice U}, MeetSubSemiLattice (f* U) := @preimage_sub_sg.\nDefinition preimage_join_sub_sl@{u} : ∀ {X Y:set@{u}} `{@JoinSemiLattice_Morphism X Y jX jY f} {U:𝒫 Y} `{!JoinSubSemiLattice U}, JoinSubSemiLattice (f* U) := @preimage_sub_sg.\nGlobal Hint Extern 2 (MeetSubSemiLattice (func_op _* _)) => simple notypeclasses refine preimage_meet_sub_sl : typeclass_instances.\nGlobal Hint Extern 2 (JoinSubSemiLattice (func_op _* _)) => simple notypeclasses refine preimage_join_sub_sl : typeclass_instances.\n\nDefinition image_meet_sub_bsl@{u} : ∀ {X Y:set@{u}} `{@BoundedMeetSemiLattice_Morphism X Y mX tX mY tY f} {U:𝒫 X} `{!MeetSubBoundedSemiLattice U}, MeetSubBoundedSemiLattice (f⁎ U) := @image_sub_mon.\nDefinition image_join_sub_bsl@{u} : ∀ {X Y:set@{u}} `{@BoundedJoinSemiLattice_Morphism X Y jX bX jY bY f} {U:𝒫 X} `{!JoinSubBoundedSemiLattice U}, JoinSubBoundedSemiLattice (f⁎ U) := @image_sub_mon.\nGlobal Hint Extern 2 (MeetSubBoundedSemiLattice (func_op _⁎ _)) => simple notypeclasses refine image_meet_sub_bsl : typeclass_instances.\nGlobal Hint Extern 2 (JoinSubBoundedSemiLattice (func_op _⁎ _)) => simple notypeclasses refine image_join_sub_bsl : typeclass_instances.\n\nDefinition preimage_meet_sub_bsl@{u} : ∀ {X Y:set@{u}} `{@BoundedMeetSemiLattice_Morphism X Y mX tX mY tY f} {U:𝒫 Y} `{!MeetSubBoundedSemiLattice U}, MeetSubBoundedSemiLattice (f* U) := @preimage_sub_mon.\nDefinition preimage_join_sub_bsl@{u} : ∀ {X Y:set@{u}} `{@BoundedJoinSemiLattice_Morphism X Y jX bX jY bY f} {U:𝒫 Y} `{!JoinSubBoundedSemiLattice U}, JoinSubBoundedSemiLattice (f* U) := @preimage_sub_mon.\nGlobal Hint Extern 2 (MeetSubBoundedSemiLattice (func_op _* _)) => simple notypeclasses refine preimage_meet_sub_bsl : typeclass_instances.\nGlobal Hint Extern 2 (JoinSubBoundedSemiLattice (func_op _* _)) => simple notypeclasses refine preimage_join_sub_bsl : typeclass_instances.\n\nLemma image_sub_lattice `{@Lattice_Morphism X Y mX jX mY jY f} {U:𝒫 X} `{!SubLattice U, !Lattice Y} : SubLattice (f⁎ U).  Proof. now split. Qed.\nLemma preimage_sub_lattice `{@Lattice_Morphism X Y mX jX mY jY f} {U:𝒫 Y} `{!SubLattice U, !Lattice X} : SubLattice (f* U).  Proof. now split. Qed.\nGlobal Hint Extern 2 (SubLattice (func_op _⁎ _)) => simple notypeclasses refine image_sub_lattice : typeclass_instances.\nGlobal Hint Extern 2 (SubLattice (func_op _* _)) => simple notypeclasses refine preimage_sub_lattice : typeclass_instances.\n\nLemma image_sub_lattice_lattice@{u} {X Y:set@{u}} `{@SubLattice X mX jX U} `{!Lattice U} `{@Lattice Y mY jY} {f:X ⇾ Y} `{!Lattice_Morphism f} : Lattice (subset_to_set (f⁎ U)).\nProof. now split. Qed.\nGlobal Hint Extern 2 (Lattice (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_sub_lattice_lattice : typeclass_instances.\n\nLemma image_sub_lattice_distr_lattice@{u} {X Y:set@{u}} `{@SubLattice X mX jX U} `{!DistributiveLattice U} `{@Lattice Y mY jY} {f:X ⇾ Y} `{!Lattice_Morphism f} : DistributiveLattice (subset_to_set (f⁎ U)).\nProof. split; try exact _.\n+ intros [x elx][y ely][z elz]. change (x ⊔ (y ⊓ z) = (x ⊔ y) ⊓ (x ⊔ z)). revert elx ely elz. unfold_image.\n  intros [a[Ex ela]][b[Ey elb]][c[Ez elc]]. rew [ <-Ex | <-Ey | <-Ez ]; clear x y z Ex Ey Ez.\n  enough (f (a ⊔ (b ⊓ c)) = f ((a ⊔ b) ⊓ (a ⊔ c))) as P by (revert P; now rewrite_preserves f).\n  apply (is_fun f _ _).\n  exact (join_meet_distr_l (to_subset a:U) (to_subset b:U) (to_subset c:U)).\n+ intros [x elx][y ely][z elz]. change (x ⊓ (y ⊔ z) = (x ⊓ y) ⊔ (x ⊓ z)). revert elx ely elz. unfold_image.\n  intros [a[Ex ela]][b[Ey elb]][c[Ez elc]]. rew [ <-Ex | <-Ey | <-Ez ]; clear x y z Ex Ey Ez.\n  enough (f (a ⊓ (b ⊔ c)) = f ((a ⊓ b) ⊔ (a ⊓ c))) as P by (revert P; now rewrite_preserves f).\n  apply (is_fun f _ _).\n  exact (meet_join_distr_l (to_subset a:U) (to_subset b:U) (to_subset c:U)).\nQed.\nGlobal Hint Extern 2 (DistributiveLattice (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_sub_lattice_distr_lattice : typeclass_instances.\n\n","sentences":[{"i":0,"s":0,"e":70,"kind":"vernac","status":"ok","ms":44,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":71,"e":92,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":93,"e":155,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":3,"s":156,"e":183,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals" ame":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12340,"e":12352,"lib":"AffineConstructive.interfaces.subset","name":"unfold_image","kind":"ltac","local":false,"page":"../interfaces/subset.html"},{"s":12398,"e":12401,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12518,"e":12521,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12522,"e":12539,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"},{"s":12739,"e":12751,"lib":"AffineConstructive.interfaces.subset","name":"unfold_image","kind":"ltac","local":false,"page":"../interfaces/subset.html"},{"s":12797,"e":12800,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":12917,"e":12920,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":12921,"e":12938,"lib":"AffineConstructive.tactics.quote.rewrite_preserves","name":"rewrite_preserves","kind":"tacn","local":false,"page":"../tactics/quote/rewrite_preserves.html"}],"gloss":{"summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive.","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","items":[{"name":"AffineConstructive.theory.sublattices.alt_Build_MeetSubSemiLattice","base":"alt_Build_MeetSubSemiLattice","kind":"def","start":5,"body":null,"status":"ok","short":{"text":"Builds a meet sub-semilattice from closure of U under binary meets","status":"ok"},"long":{"text":"A meet sub-semilattice is a subsemigroup for ⊓, so this is [[AffineConstructive.theory.subgroups.alt_Build_SubSemiGroup]] read at the meet: to show that U is a [[AffineConstructive.interfaces.subalgebra.MeetSubSemiLattice]] it suffices to show, for all x and y, that x ∊ U ⊠ y ∊ U implies x ⊓ y ∊ U. The hypothesis joins the two memberships by the tensor, so each is used once, and as an affine implication it carries its contrapositive: if x ⊓ y is apart from U, then x is apart from U par y is apart from U.\n\nIt is used in [[AffineConstructive.theory.sublattices.alt_Build_SubLattice2]], which builds a sublattice from closure under meets and joins, and in one proof in the theory of filters.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.alt_Build_JoinSubSemiLattice","base":"alt_Build_JoinSubSemiLattice","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"Builds a join sub-semilattice from closure of U under binary joins","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.theory.sublattices.alt_Build_MeetSubSemiLattice]]: a join sub-semilattice is a subsemigroup for ⊔, and [[AffineConstructive.theory.subgroups.alt_Build_SubSemiGroup]] at the join builds one from the statement that x ∊ U ⊠ y ∊ U implies x ⊔ y ∊ U for all x and y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.alt_Build_MeetSubBoundedSemiLattice","base":"alt_Build_MeetSubBoundedSemiLattice","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"Builds a bounded meet sub-semilattice from closure under meets and ⊤ ∊ U","status":"ok"},"long":{"text":"A bounded meet sub-semilattice is a submonoid for ⊓ with unit ⊤, so [[AffineConstructive.theory.subgroups.alt_Build_SubMonoid]] builds one from two facts: closure under binary meets, stated with the tensor of the two memberships, and membership of the top element.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.alt_Build_JoinSubBoundedSemiLattice","base":"alt_Build_JoinSubBoundedSemiLattice","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"Builds a bounded join sub-semilattice from closure under joins and ⊥ ∊ U","status":"ok"},"long":{"text":"The dual of [[AffineConstructive.theory.sublattices.alt_Build_MeetSubBoundedSemiLattice]]: a submonoid for ⊔ with unit ⊥, built by [[AffineConstructive.theory.subgroups.alt_Build_SubMonoid]] from closure under binary joins and membership of the bottom element.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.full_meet_sub_sl","base":"full_meet_sub_sl","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The full subset of a meet semilattice is a meet sub-semilattice","status":"ok"},"long":{"text":"The whole of L, as the subset ⌈L⌉ whose membership is truth, is closed under meets. It is [[AffineConstructive.theory.subgroups.full_sub_sg]] at the meet, made available to instance resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.full_meet_sub_bsl","base":"full_meet_sub_bsl","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"The full subset of a bounded meet semilattice is a bounded meet sub-semilattice","status":"ok"},"long":{"text":"The full subset ⌈L⌉ contains ⊤ and is closed under meets; this is [[AffineConstructive.theory.subgroups.full_sub_mon]] at the meet and top.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.full_join_sub_sl","base":"full_join_sub_sl","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"The full subset of a join semilattice is a join sub-semilattice","status":"ok"},"long":{"text":"The full subset ⌈L⌉ is closed under joins; this is [[AffineConstructive.theory.subgroups.full_sub_sg]] at the join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.full_join_sub_bsl","base":"full_join_sub_bsl","kind":"def","start":16,"body":null,"status":"ok","short":{"text":"The full subset of a bounded join semilattice is a bounded join sub-semilattice","status":"ok"},"long":{"text":"The full subset ⌈L⌉ contains ⊥ and is closed under joins; this is [[AffineConstructive.theory.subgroups.full_sub_mon]] at the join and bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.MeetSubSemiLattice_fun","base":"MeetSubSemiLattice_fun","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"Being a meet sub-semilattice, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate MeetSubSemiLattice on 𝒫 L packaged as a function from !𝒫 L to strict propositions, so that it may be rewritten along an equality of subsets. It reuses [[AffineConstructive.theory.subgroups.SubSemiGroup_fun]], since a meet sub-semilattice is a subsemigroup for ⊓; the domain carries ! because the equality of subsets is used freely in transporting the structure.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.MeetSubBoundedSemiLattice_fun","base":"MeetSubBoundedSemiLattice_fun","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"Being a bounded meet sub-semilattice, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate MeetSubBoundedSemiLattice on 𝒫 L as a function from !𝒫 L to strict propositions, so that it transports along equality of subsets; it reuses [[AffineConstructive.theory.subgroups.SubMonoid_fun]] at the meet and top.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.JoinSubSemiLattice_fun","base":"JoinSubSemiLattice_fun","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"Being a join sub-semilattice, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate JoinSubSemiLattice on 𝒫 L as a function from !𝒫 L to strict propositions, reusing [[AffineConstructive.theory.subgroups.SubSemiGroup_fun]] at the join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.JoinSubBoundedSemiLattice_fun","base":"JoinSubBoundedSemiLattice_fun","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"Being a bounded join sub-semilattice, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate JoinSubBoundedSemiLattice on 𝒫 L as a function from !𝒫 L to strict propositions, reusing [[AffineConstructive.theory.subgroups.SubMonoid_fun]] at the join and bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_meet_sl_meet","base":"sub_meet_sl_meet","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The meet of a meet sub-semilattice U: the meet of L restricted to U","status":"ok"},"long":{"text":"A subset U closed under meets, regarded as a set, inherits a meet: the meet of two members of U is their meet in L, which lies in U by closure. It is [[AffineConstructive.theory.subgroups.sub_semigroup_op]] at the meet, and a hint makes it the meet found on U as a set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_join_sl_join","base":"sub_join_sl_join","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"The join of a join sub-semilattice U: the join of L restricted to U","status":"ok"},"long":{"text":"The join on a subset closed under joins, regarded as a set: the join in L of two members, which lies in U by closure. It is [[AffineConstructive.theory.subgroups.sub_semigroup_op]] at the join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_meet_bsl_top","base":"sub_meet_bsl_top","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"The top of a bounded meet sub-semilattice U: the top of L, as a member of U","status":"ok"},"long":{"text":"A bounded meet sub-semilattice contains ⊤, so ⊤ is an element of U regarded as a set; this is [[AffineConstructive.theory.subgroups.sub_monoid_unit]] at the top.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_join_bsl_bot","base":"sub_join_bsl_bot","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"The bottom of a bounded join sub-semilattice U: the bottom of L, as a member of U","status":"ok"},"long":{"text":"A bounded join sub-semilattice contains ⊥, so ⊥ is an element of U regarded as a set; this is [[AffineConstructive.theory.subgroups.sub_monoid_unit]] at the bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_meet_sl","base":"sub_meet_sl","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"A meet sub-semilattice, regarded as a set, is a meet semilattice","status":"ok"},"long":{"text":"With the restricted meet [[AffineConstructive.theory.sublattices.sub_meet_sl_meet]], a meet sub-semilattice U of L is itself a meet semilattice: the semilattice laws hold in U because they hold in L and the equality of U is that of L. It is [[AffineConstructive.theory.subgroups.sub_semigroup_sl]] at the meet.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_meet_bsl","base":"sub_meet_bsl","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"A bounded meet sub-semilattice, regarded as a set, is a bounded meet semilattice","status":"ok"},"long":{"text":"With the restricted meet and the top [[AffineConstructive.theory.sublattices.sub_meet_bsl_top]], a bounded meet sub-semilattice is a bounded meet semilattice; this is [[AffineConstructive.theory.subgroups.sub_monoid_bounded_sl]] at the meet and top.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_join_sl","base":"sub_join_sl","kind":"def","start":39,"body":null,"status":"ok","short":{"text":"A join sub-semilattice, regarded as a set, is a join semilattice","status":"ok"},"long":{"text":"With the restricted join [[AffineConstructive.theory.sublattices.sub_join_sl_join]], a join sub-semilattice is a join semilattice; this is [[AffineConstructive.theory.subgroups.sub_semigroup_sl]] at the join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_join_bsl","base":"sub_join_bsl","kind":"def","start":40,"body":null,"status":"ok","short":{"text":"A bounded join sub-semilattice, regarded as a set, is a bounded join semilattice","status":"ok"},"long":{"text":"With the restricted join and the bottom [[AffineConstructive.theory.sublattices.sub_join_bsl_bot]], a bounded join sub-semilattice is a bounded join semilattice; this is [[AffineConstructive.theory.subgroups.sub_monoid_bounded_sl]] at the join and bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.from_meet_sub_sl","base":"from_meet_sub_sl","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"The inclusion of a meet sub-semilattice into L preserves meets","status":"ok"},"long":{"text":"The inclusion U ⇾ L of a meet sub-semilattice is a meet-semilattice morphism, since the meet on U is by definition the meet of L. It is [[AffineConstructive.theory.subgroups.from_sub_semigroup]] at the meet.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.from_join_sub_sl","base":"from_join_sub_sl","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"The inclusion of a join sub-semilattice into L preserves joins","status":"ok"},"long":{"text":"The inclusion U ⇾ L of a join sub-semilattice is a join-semilattice morphism; this is [[AffineConstructive.theory.subgroups.from_sub_semigroup]] at the join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.from_meet_sub_bsl","base":"from_meet_sub_bsl","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"The inclusion of a bounded meet sub-semilattice preserves meets and top","status":"ok"},"long":{"text":"The inclusion U ⇾ L of a bounded meet sub-semilattice is a bounded meet-semilattice morphism; this is [[AffineConstructive.theory.subgroups.from_sub_monoid]] at the meet and top.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.from_join_sub_bsl","base":"from_join_sub_bsl","kind":"def","start":50,"body":null,"status":"ok","short":{"text":"The inclusion of a bounded join sub-semilattice preserves joins and bottom","status":"ok"},"long":{"text":"The inclusion U ⇾ L of a bounded join sub-semilattice is a bounded join-semilattice morphism; this is [[AffineConstructive.theory.subgroups.from_sub_monoid]] at the join and bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.alt_Build_SubLattice","base":"alt_Build_SubLattice","kind":"prf","start":53,"body":[54,56],"status":"ok","short":{"text":"A subset that is both a meet and a join sub-semilattice is a sublattice","status":"ok"},"proof":[{"text":"A sublattice is by definition a subset that is both a meet and a join sub-semilattice of a lattice. The two hypotheses supply these components and the lattice structure of L supplies the rest.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.sublattices.alt_Build_SubLattice2","base":"alt_Build_SubLattice2","kind":"prf","start":57,"body":[58,60],"status":"ok","short":{"text":"A subset closed under binary meets and binary joins is a sublattice","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.sublattices.alt_Build_SubLattice]] it suffices to show that U is a meet sub-semilattice and a join sub-semilattice. Closure under binary meets gives the first by [[AffineConstructive.theory.sublattices.alt_Build_MeetSubSemiLattice]], and closure under binary joins gives the second by [[AffineConstructive.theory.sublattices.alt_Build_JoinSubSemiLattice]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.sublattices.full_sub_lattice","base":"full_sub_lattice","kind":"def","start":61,"body":[62,64],"status":"ok","short":{"text":"The full subset of a lattice is a sublattice","status":"ok"},"proof":[{"text":"The full subset of L is a meet sub-semilattice by [[AffineConstructive.theory.sublattices.full_meet_sub_sl]] and a join sub-semilattice by [[AffineConstructive.theory.sublattices.full_join_sub_sl]]. With the lattice structure of L, these components make it a sublattice.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.sublattices.SubLattice_proper_impl","base":"SubLattice_proper_impl","kind":"prf","start":66,"body":[67,69],"status":"ok","short":{"text":"If U₁ = U₂ and U₁ is a sublattice, then so is U₂","status":"ok"},"proof":[{"text":"Assume U₁ = U₂ and that U₁ is a sublattice, and split the conclusion into its components. The lattice structure of L does not mention the subset, so it carries over unchanged. For the meet and the join sub-semilattice conditions on U₂, rewriting backwards along U₁ = U₂ turns each into the corresponding condition on U₁, which holds by assumption.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.sublattices.SubLattice_fun","base":"SubLattice_fun","kind":"def","start":70,"body":null,"status":"ok","short":{"text":"Being a sublattice, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate SubLattice on 𝒫 L packaged as a function from !𝒫 L to strict propositions by [[AffineConstructive.theory.set.make_weak_spred]], from the transport lemma [[AffineConstructive.theory.sublattices.SubLattice_proper_impl]]. With it the property of being a sublattice can be rewritten along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.sub_lattice_lattice","base":"sub_lattice_lattice","kind":"prf","start":71,"body":[72,80],"status":"ok","short":{"text":"A sublattice, regarded as a set, is a lattice","status":"ok"},"proof":[{"text":"Split the lattice structure on U into its components. The meet and join semilattice structures come from [[AffineConstructive.theory.sublattices.sub_meet_sl]] and [[AffineConstructive.theory.sublattices.sub_join_sl]], where meets and joins in U are those of L. The two absorption laws are left.","status":"ok","from":0,"to":1},{"text":"Fix x and y in U. Since meet and join in U are computed in L, the law x ⊔ (x ⊓ y) = x is absorption in L, applied to x and y as elements of L.","status":"ok","from":2,"to":4},{"text":"In the same way, for x and y in U, x ⊓ (x ⊔ y) = x is the other absorption law of L.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.theory.sublattices.sub_lattice_distr_lattice","base":"sub_lattice_distr_lattice","kind":"prf","start":82,"body":[83,91],"status":"ok","short":{"text":"A sublattice of a distributive lattice is a distributive lattice","status":"ok"},"proof":[{"text":"Split the distributive lattice structure on U into its components. The lattice structure is [[AffineConstructive.theory.sublattices.sub_lattice_lattice]], which leaves the two distributive laws.","status":"ok","from":0,"to":1},{"text":"Fix x, y, z in U. Because the operations of U are those of L, x ⊔ (y ⊓ z) = (x ⊔ y) ⊓ (x ⊔ z) is the distributive law of L applied to x, y and z as elements of L.","status":"ok","from":2,"to":4},{"text":"Similarly, x ⊓ (y ⊔ z) = (x ⊓ y) ⊔ (x ⊓ z) for x, y, z in U is the other distributive law of L.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.theory.sublattices.from_sub_lattice","base":"from_sub_lattice","kind":"prf","start":93,"body":[94,96],"status":"ok","short":{"text":"The inclusion of a sublattice into its lattice is a lattice morphism","status":"ok"},"proof":[{"text":"A lattice morphism is a map between lattices that preserves meets and joins. U is a lattice by [[AffineConstructive.theory.sublattices.sub_lattice_lattice]]. The inclusion preserves meets by [[AffineConstructive.theory.sublattices.from_meet_sub_sl]] and joins by [[AffineConstructive.theory.sublattices.from_join_sub_sl]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.sublattices.image_meet_sub_sl","base":"image_meet_sub_sl","kind":"def","start":99,"body":null,"status":"ok","short":{"text":"The image of a meet sub-semilattice under a meet-preserving map is a meet sub-semilattice","status":"ok"},"long":{"text":"If f preserves meets and U is closed under meets, then f⁎ U is closed under meets: f x ⊓ f y = f (x ⊓ y). It is [[AffineConstructive.theory.subgroups.image_sub_sg]] at the meet.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.image_join_sub_sl","base":"image_join_sub_sl","kind":"def","start":100,"body":null,"status":"ok","short":{"text":"The image of a join sub-semilattice under a join-preserving map is a join sub-semilattice","status":"ok"},"long":{"text":"If f preserves joins and U is closed under joins, then so is f⁎ U; this is [[AffineConstructive.theory.subgroups.image_sub_sg]] at the join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.preimage_meet_sub_sl","base":"preimage_meet_sub_sl","kind":"def","start":103,"body":null,"status":"ok","short":{"text":"The preimage of a meet sub-semilattice under a meet-preserving map is a meet sub-semilattice","status":"ok"},"long":{"text":"If f preserves meets and U ⊆ Y is closed under meets, then f* U is closed under meets, since f (x ⊓ y) = f x ⊓ f y; this is [[AffineConstructive.theory.subgroups.preimage_sub_sg]] at the meet.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.preimage_join_sub_sl","base":"preimage_join_sub_sl","kind":"def","start":104,"body":null,"status":"ok","short":{"text":"The preimage of a join sub-semilattice under a join-preserving map is a join sub-semilattice","status":"ok"},"long":{"text":"If f preserves joins and U is closed under joins, then so is f* U; this is [[AffineConstructive.theory.subgroups.preimage_sub_sg]] at the join.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.image_meet_sub_bsl","base":"image_meet_sub_bsl","kind":"def","start":107,"body":null,"status":"ok","short":{"text":"The image of a bounded meet sub-semilattice under a bounded meet morphism is one","status":"ok"},"long":{"text":"If f preserves meets and top and U is a bounded meet sub-semilattice, then f⁎ U is closed under meets and contains ⊤ = f ⊤; this is [[AffineConstructive.theory.subgroups.image_sub_mon]] at the meet and top.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.image_join_sub_bsl","base":"image_join_sub_bsl","kind":"def","start":108,"body":null,"status":"ok","short":{"text":"The image of a bounded join sub-semilattice under a bounded join morphism is one","status":"ok"},"long":{"text":"If f preserves joins and bottom, the image of a bounded join sub-semilattice is closed under joins and contains ⊥; this is [[AffineConstructive.theory.subgroups.image_sub_mon]] at the join and bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.preimage_meet_sub_bsl","base":"preimage_meet_sub_bsl","kind":"def","start":111,"body":null,"status":"ok","short":{"text":"The preimage of a bounded meet sub-semilattice under a bounded meet morphism is one","status":"ok"},"long":{"text":"If f preserves meets and top, the preimage of a bounded meet sub-semilattice is closed under meets and contains ⊤, since f ⊤ = ⊤; this is [[AffineConstructive.theory.subgroups.preimage_sub_mon]] at the meet and top.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.preimage_join_sub_bsl","base":"preimage_join_sub_bsl","kind":"def","start":112,"body":null,"status":"ok","short":{"text":"The preimage of a bounded join sub-semilattice under a bounded join morphism is one","status":"ok"},"long":{"text":"If f preserves joins and bottom, the preimage of a bounded join sub-semilattice is closed under joins and contains ⊥; this is [[AffineConstructive.theory.subgroups.preimage_sub_mon]] at the join and bottom.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.sublattices.image_sub_lattice","base":"image_sub_lattice","kind":"prf","start":115,"body":[116,118],"status":"ok","short":{"text":"The image of a sublattice under a lattice morphism is a sublattice","status":"ok"},"proof":[{"text":"The image f⁎ U is a meet sub-semilattice of Y by [[AffineConstructive.theory.sublattices.image_meet_sub_sl]] and a join sub-semilattice by [[AffineConstructive.theory.sublattices.image_join_sub_sl]]. Together with the lattice structure of Y, these make it a sublattice.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.sublattices.preimage_sub_lattice","base":"preimage_sub_lattice","kind":"prf","start":119,"body":[120,122],"status":"ok","short":{"text":"The preimage of a sublattice under a lattice morphism is a sublattice","status":"ok"},"proof":[{"text":"The preimage f* U is a meet sub-semilattice of X by [[AffineConstructive.theory.sublattices.preimage_meet_sub_sl]] and a join sub-semilattice by [[AffineConstructive.theory.sublattices.preimage_join_sub_sl]]. Together with the lattice structure of X, these make it a sublattice.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.sublattices.image_sub_lattice_lattice","base":"image_sub_lattice_lattice","kind":"prf","start":125,"body":[126,128],"status":"ok","short":{"text":"The image of a sublattice under a lattice morphism, regarded as a set, is a lattice","status":"ok"},"proof":[{"text":"The image f⁎ U is a sublattice of Y by [[AffineConstructive.theory.sublattices.image_sub_lattice]]. Regarded as a set, it is therefore a meet and a join semilattice under the operations of Y, by [[AffineConstructive.theory.sublattices.sub_meet_sl]] and [[AffineConstructive.theory.sublattices.sub_join_sl]]. The absorption laws are those of Y, so f⁎ U is a lattice.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.sublattices.image_sub_lattice_distr_lattice","base":"image_sub_lattice_distr_lattice","kind":"prf","start":130,"body":[131,153],"status":"ok","short":{"text":"The image of a distributive sublattice under a lattice morphism is a distributive lattice","status":"ok"},"proof":[{"text":"The image f⁎ U is already a lattice by [[AffineConstructive.theory.sublattices.image_sub_lattice_lattice]], so of the fields of a distributive lattice only the two distributive laws remain: ⊔ over ⊓, and ⊓ over ⊔.","status":"ok","from":0,"to":1},{"text":"For the first law, take three elements x, y, z of the image together with their memberships. The operations on the image are those of Y restricted, so the goal is x ⊔ (y ⊓ z) = (x ⊔ y) ⊓ (x ⊔ z) in Y.","status":"ok","from":2,"to":4},{"text":"Each membership in the image provides a point of U mapping to the given element: a, b, c ∊ U with f a = x, f b = y, f c = z. Rewriting by these equalities restates the goal as the distributive law for f a, f b, f c.","status":"ok","from":5,"to":8},{"text":"Since f preserves meets and joins, both sides are values of f: the goal follows from f (a ⊔ (b ⊓ c)) = f ((a ⊔ b) ⊓ (a ⊔ c)).","status":"ok","from":9,"to":9},{"text":"As f preserves equality, it suffices that a ⊔ (b ⊓ c) = (a ⊔ b) ⊓ (a ⊔ c) in X. This is the distributive law in U, which is a distributive lattice, applied to a, b, c as elements of U.","status":"ok","from":10,"to":11},{"text":"For the second law, take x, y, z in the image in the same way; the goal is x ⊓ (y ⊔ z) = (x ⊓ y) ⊔ (x ⊓ z) in Y.","status":"ok","from":12,"to":14},{"text":"The memberships give a, b, c ∊ U with f a = x, f b = y, f c = z, and rewriting by these equalities restates the goal at f a, f b, f c.","status":"ok","from":15,"to":18},{"text":"Because f preserves meets and joins, the goal follows from f (a ⊓ (b ⊔ c)) = f ((a ⊓ b) ⊔ (a ⊓ c)).","status":"ok","from":19,"to":19},{"text":"Since f preserves equality, it suffices that the distributive law of ⊓ over ⊔ holds for a, b, c in X. It does, because U is distributive.","status":"ok","from":20,"to":22}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.subalgebra":{"page":"../interfaces/subalgebra.html","short":"Subsemigroups, submonoids, subgroups, sub-near-rings and sublattices as closure predicates on subsets","summary":"This file defines substructures as predicates on subsets U : 𝒫 G, each packaging the ambient structure with closure conditions on U: [[SubSemiGroup]] (closed under ∙), [[SubMonoid]] (also containing the unit), [[SubStarSemiGroup]] and [[SubStarMonoid]] (closed under the involution), [[SubGroup]], and [[NormalSubGroup]] (closed under conjugation y ∙ x ∙ y⁻¹). Binary closure is stated with the tensor, x ∊ U ⊠ y ∊ U ⊸ x ∙ y ∊ U, so each membership is used once and the contrapositive comes with it. The generic notions are renamed for addition and multiplication, with accessors such as [[sub_add_sg_closed]] and [[sub_mul_one_closed]] in the ring notation, and combined into [[SubNearRg]], [[SubNearRig]], [[SubNearRng]] and [[SubNearRing]] over the near-ring structures of abstract_algebra. In the same way the meet and join semilattice versions are the semigroup and monoid notions for ⊓ and ⊔, and [[SubLattice]] joins the two."},"AffineConstructive.theory.lattices":{"page":"lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.subgroups":{"page":"subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.interfaces.set":{"page":"../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.projected_set":{"page":"projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.replc":{"page":"../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."}},"constants":null}</script>

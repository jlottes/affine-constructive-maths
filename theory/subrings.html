duced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export interfaces.subalgebra theory.rings theory.subgroups.\nRequire Import sprop.\nRequire Import interfaces.set theory.set theory.projected_set.\nRequire Import logic.aprop.\nRequire Import easy replc rewrite_preserves.\n\nLocal Open Scope mult_scope.\n\nDefinition alt_Build_AdditiveSubSemiGroup@{u} : ∀ `{AdditiveNonComSemiGroup@{u} X} {Y:𝒫 X},\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x + y ∊ Y) → AdditiveSubSemiGroup Y\n:= @alt_Build_SubSemiGroup.\n\nDefinition alt_Build_MultiplicativeSubSemiGroup@{u} : ∀ `{MultiplicativeSemiGroup@{u} X} {Y:𝒫 X},\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x · y ∊ Y) → MultiplicativeSubSemiGroup Y\n:= @alt_Build_SubSemiGroup.\n\nDefinition alt_Build_AdditiveSubMonoid@{u} : ∀ `{AdditiveNonComMonoid@{u} X} {Y:𝒫 X},\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x + y ∊ Y)\n → 0 ∊ Y\n → AdditiveSubMonoid Y\n:= @alt_Build_SubMonoid.\n\nDefinition alt_Build_MultiplicativeSubMonoid@{u} : ∀ `{MultiplicativeMonoid@{u} X} {Y:𝒫 X},\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x · y ∊ Y)\n → 1 ∊ Y\n → MultiplicativeSubMonoid Y\n:= @alt_Build_SubMonoid.\n\nDefinition alt_Build_AdditiveSubGroup@{u} : ∀ `{AdditiveNonComGroup@{u} X} {Y:𝒫 X},\n  (∀ x y, x ∊ Y ⊠ y ∊ Y ⊸ x + y ∊ Y)\n → 0 ∊ Y\n → (∀ x, x ∊ Y ⊸ -x ∊ Y)\n → AdditiveSubGroup Y\n:= @alt_Build_SubGroup.\n\n\nGlobal Hint Extern 4 (apos (_ + _ ∊ _)) => simple notypeclasses refine  (andl (sub_add_sg_closed _ _) _) : typeclass_instances.\nGlobal Hint Extern 4 (apos (_ · _ ∊ _)) => simple notypeclasses refine  (andl (sub_mul_sg_closed _ _) _) : typeclass_instances.\nGlobal Hint Extern 4 (apos (0 ∊ _)) => simple notypeclasses refine sub_add_zero_closed : typeclass_instances.\nGlobal Hint Extern 4 (apos (1 ∊ _)) => simple notypeclasses refine sub_mul_one_closed : typeclass_instances.\nGlobal Hint Extern 4 (apos (-_ ∊ _)) => simple notypeclasses refine (andl (sub_add_neg_closed _) _) : typeclass_instances.\n\nDefinition full_add_sub_sg@{u}  : ∀ `{AdditiveNonComSemiGroup@{u} G}, AdditiveSubSemiGroup (full_subset G) := @full_sub_sg.\nDefinition full_add_sub_mon@{u} : ∀ `{AdditiveNonComMonoid@{u} M}, AdditiveSubMonoid (full_subset M) := @full_sub_mon.\nDefinition full_add_sub_grp@{u} : ∀ `{AdditiveNonComGroup@{u}  G}, AdditiveSubGroup  (full_subset G) := @full_sub_grp.\nDefinition full_add_normal_sub_grp@{u} : ∀ `{AdditiveNonComGroup@{u} G}, AdditiveNormalSubGroup (full_subset G) := @full_normal_sub_grp.\n\nDefinition full_mul_sub_sg@{u}  : ∀ `{MultiplicativeSemiGroup@{u} G}, MultiplicativeSubSemiGroup (full_subset G) := @full_sub_sg.\nDefinition full_mul_sub_mon@{u} : ∀ `{MultiplicativeMonoid@{u}    M}, MultiplicativeSubMonoid    (full_subset M) := @full_sub_mon.\n\nGlobal Hint Extern 2 (AdditiveSubSemiGroup (full_subset _)) => simple notypeclasses refine full_add_sub_sg  : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSubMonoid    (full_subset _)) => simple notypeclasses refine full_add_sub_mon : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSubGroup     (full_subset _)) => simple notypeclasses refine full_add_sub_grp : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveNormalSubGroup (full_subset _)) => simple notypeclasses refine full_add_normal_sub_grp : typeclass_instances.\n\nGlobal Hint Extern 2 (MultiplicativeSubSemiGroup (full_subset _)) => simple notypeclasses refine full_mul_sub_sg  : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubMonoid    (full_subset _)) => simple notypeclasses refine full_mul_sub_mon : typeclass_instances.\n\n\n(** Substructure predicates respect equality of subsets. *)\n\nCanonical Structure MultiplicativeSubSemiGroup_fun {G op} :=\n  make_fun_alt (@MultiplicativeSubSemiGroup G op) (@SubSemiGroup_fun G op).\n\nCanonical Structure MultiplicativeSubMonoid_fun {G op unit} :=\n  make_fun_alt (@MultiplicativeSubMonoid G op unit) (@SubMonoid_fun G op unit).\n\nCanonical Structure AdditiveSubMonoid_fun {G op unit} :=\n  make_fun_alt (@AdditiveSubMonoid G op unit) (@SubMonoid_fun G op unit).\n\nCanonical Structure AdditiveSubGroup_fun {G op unit i} :=\n  make_fun_alt (@AdditiveSubGroup G op unit i) (@SubGroup_fun G op unit i).\n\nCanonical Structure AdditiveNormalSubGroup_fun {G op unit i} :=\n  make_fun_alt (@AdditiveNormalSubGroup G op unit i) (@NormalSubGroup_fun G op unit i).\n\n(** Induced operations on subsets when viewed as sets. *)\n\nDefinition sub_add_sg_plus@{u} : ∀ `{@AdditiveSubSemiGroup@{u} G Gplus H}, Plus H := @sub_semigroup_op.\nDefinition sub_mul_sg_mult@{u} : ∀ `{@MultiplicativeSubSemiGroup@{u} G Gmult H}, Mult H := @sub_semigroup_op.\n\nDefinition sub_add_zero@{u} : ∀ `{@AdditiveSubMonoid@{u} M Mplus Mzero N}, Zero N := @sub_monoid_unit.\nDefinition sub_mul_one@{u}  : ∀ `{@MultiplicativeSubMonoid@{u} M Mmult Mone N}, One N := @sub_monoid_unit.\n\nDefinition sub_add_negate@{u} `{@AdditiveSubGroup@{u} G Gplus Gzero Gnegate H} : Negate H := sub_star_semigroup_inv H.\n\nGlobal Hint Extern 2 (Plus (subset_to_set ?H)) => refine (sub_add_sg_plus (H:=H)) : typeclass_instances.\nGlobal Hint Extern 2 (Mult (subset_to_set ?H)) => refine (sub_mul_sg_mult (H:=H)) : typeclass_instances.\nGlobal Hint Extern 2 (Zero (subset_to_set ?H)) => refine (sub_add_zero (N:=H)) : typeclass_instances.\nGlobal Hint Extern 2 (One  (subset_to_set ?H)) => refine (sub_mul_one (N:=H)) : typeclass_instances.\nGlobal Hint Extern 2 (Negate (subset_to_set ?H)) => refine (sub_add_negate (H:=H)) : typeclass_instances.\n\n(** Sub structures are instances of structures when viewed as sets. *)\n\nDefinition sub_add_semigroup_semigroup@{u} : ∀ `{@AdditiveSubSemiGroup@{u} G Gplus H}, AdditiveNonComSemiGroup H := @sub_semigroup_semigroup.\nDefinition sub_add_semigroup_com_semigroup@{u} : ∀ `{P:AdditiveSemiGroup@{u} G} {H:𝒫 G} `{!AdditiveSubSemiGroup H}, AdditiveSemiGroup H := @sub_semigroup_com_semigroup.\nDefinition sub_add_monoid_monoid@{u} : ∀ `{@AdditiveSubMonoid@{u} M Mplus Mzero N}, AdditiveNonComMonoid N := @sub_monoid_monoid.\nDefinition sub_add_monoid_com_monoid@{u} : ∀ `{P:AdditiveMonoid@{u} M} {N:𝒫 M} `{!AdditiveSubMonoid N}, AdditiveMonoid N := @sub_monoid_com_monoid.\nDefinition sub_add_group_group@{u} : ∀ `{@AdditiveSubGroup@{u} G Gplus Gzero Gnegate H}, AdditiveNonComGroup H := @sub_group_group.\nDefinition sub_add_group_abgroup@{u} : ∀ `{P:AdditiveGroup@{u} G} {H:𝒫 G} `{!AdditiveSubGroup H}, AdditiveGroup H := @sub_group_abgroup.\n\nGlobal Hint Extern 2 (AdditiveNonComSemiGroup (subset_to_set _)) => simple notypeclasses refine sub_add_semigroup_semigroup : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveSemiGroup (subset_to_set _)) => simple notypeclasses refine sub_add_semigroup_com_semigroup : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveNonComMonoid (subset_to_set _)) => simple notypeclasses refine sub_add_monoid_monoid : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveMonoid (subset_to_set _)) => simple notypeclasses refine sub_add_monoid_com_monoid : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveNonComGroup (subset_to_set _)) => simple notypeclasses refine sub_add_group_group : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveGroup (subset_to_set _)) => simple notypeclasses refine sub_add_group_abgroup : typeclass_instances.\n\nDefinition sub_mul_semigroup_semigroup@{u} : ∀ `{@MultiplicativeSubSemiGroup@{u} G Gmult H}, MultiplicativeSemiGroup H := @sub_semigroup_semigroup.\nDefinition sub_mul_monoid_monoid@{u} : ∀ `{@MultiplicativeSubMonoid@{u} M Mmult Mone N}, MultiplicativeMonoid N := @sub_monoid_monoid.\nDefinition sub_mul_monoid_com_monoid@{u} : ∀ `{P:MultiplicativeComMonoid@{u} M} {N:𝒫 M} `{!MultiplicativeSubMonoid N}, MultiplicativeComMonoid N := @sub_monoid_com_monoid.\n\nGlobal Hint Extern 2 (MultiplicativeSemiGroup (subset_to_set _)) => simple notypeclasses refine sub_mul_semigroup_semigroup : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeMonoid (subset_to_set _)) => simple notypeclasses refine sub_mul_monoid_monoid : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeComMonoid (subset_to_set _)) => simple notypeclasses refine sub_mul_monoid_com_monoid : typeclass_instances.\n\nDefinition sub_add_abgroup_normal@{u} : ∀ `{P:AdditiveGroup@{u} G} {H:𝒫 G} `{!AdditiveSubGroup H}, AdditiveNormalSubGroup H := @sub_abgroup_normal.\nGlobal Hint Extern 4 (AdditiveNormalSubGroup _) => simple notypeclasses refine sub_add_abgroup_normal : typeclass_instances.\n\n(** Inclusion of the substructure is structure preserving *)\n\nDefinition from_add_sub_semigroup@{u} : ∀ `{@AdditiveSubSemiGroup@{u} G Gplus H}, AdditiveSemiGroup_Morphism (from_subset H) := @from_sub_semigroup.\nDefinition from_mul_sub_semigroup@{u} : ∀ `{@MultiplicativeSubSemiGroup@{u} G Gmult H}, MultiplicativeSemiGroup_Morphism (from_subset H) := @from_sub_semigroup.\nGlobal Hint Extern 2 (AdditiveSemiGroup_Morphism (from_subset _)) => simple notypeclasses refine from_add_sub_semigroup : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSemiGroup_Morphism (from_subset _)) => simple notypeclasses refine from_mul_sub_semigroup : typeclass_instances.\n\nDefinition from_add_sub_monoid@{u} : ∀ `{@AdditiveSubMonoid@{u} G Gplus Gzero H}, AdditiveMonoid_Morphism (from_subset H) := @from_sub_monoid.\nDefinition from_mul_sub_monoid@{u} : ∀ `{@MultiplicativeSubMonoid@{u} G Gmult Gone H}, MultiplicativeMonoid_Morphism (from_subset H) := @from_sub_monoid.\nGlobal Hint Extern 2 (AdditiveMonoid_Morphism (from_subset _)) => simple notypeclasses refine from_add_sub_monoid : typeclass_instances.\nGlobal Hint Extern 2 (Zero_Pointed_Morphism (from_subset _)) => simple notypeclasses refine from_add_sub_monoid : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeMonoid_Morphism (from_subset _)) => simple notypeclasses refine from_mul_sub_monoid : typeclass_instances.\nGlobal Hint Extern 2 (One_Pointed_Morphism (from_subset _)) => simple notypeclasses refine from_mul_sub_monoid : typeclass_instances.\n\n(** Image and preimage *)\nImport image_notation.\n\nDefinition image_add_sub_sg@{u} : ∀ {X Y : set@{u}} `{@AdditiveSemiGroup_Morphism X Y Xop Yop f} {U:𝒫 X} `{!AdditiveSubSemiGroup U}, AdditiveSubSemiGroup (f⁎ U) := @image_sub_sg.\nDefinition image_mul_sub_sg@{u} : ∀ {X Y : set@{u}} `{@MultiplicativeSemiGroup_Morphism X Y Xop Yop f} {U:𝒫 X} `{!MultiplicativeSubSemiGroup U}, MultiplicativeSubSemiGroup (f⁎ U) := @image_sub_sg.\nGlobal Hint Extern 2 (AdditiveSubSemiGroup (func_op _⁎ _)) => simple notypeclasses refine image_add_sub_sg : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubSemiGroup (func_op _⁎ _)) => simple notypeclasses refine image_mul_sub_sg : typeclass_instances.\n\nDefinition preimage_add_sub_sg@{u} : ∀ {X Y : set@{u}} `{@AdditiveSemiGroup_Morphism X Y Xop Yop f} {U:𝒫 Y} `{!AdditiveSubSemiGroup U}, AdditiveSubSemiGroup (f* U) := @preimage_sub_sg.\nDefinition preimage_mul_sub_sg@{u} : ∀ {X Y : set@{u}} `{@MultiplicativeSemiGroup_Morphism X Y Xop Yop f} {U:𝒫 Y} `{!MultiplicativeSubSemiGroup U}, MultiplicativeSubSemiGroup (f* U) := @preimage_sub_sg.\nGlobal Hint Extern 2 (AdditiveSubSemiGroup (func_op _* _)) => simple notypeclasses refine preimage_add_sub_sg : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubSemiGroup (func_op _* _)) => simple notypeclasses refine preimage_mul_sub_sg : typeclass_instances.\n\nDefinition image_add_sub_mon@{u} : ∀ {X Y : set@{u}} `{@AdditiveMonoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 X} `{!AdditiveSubMonoid U}, AdditiveSubMonoid (f⁎ U) := @image_sub_mon.\nDefinition image_mul_sub_mon@{u} : ∀ {X Y : set@{u}} `{@MultiplicativeMonoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 X} `{!MultiplicativeSubMonoid U}, MultiplicativeSubMonoid (f⁎ U) := @image_sub_mon.\nGlobal Hint Extern 2 (AdditiveSubMonoid (func_op _⁎ _)) => simple notypeclasses refine image_add_sub_mon : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubMonoid (func_op _⁎ _)) => simple notypeclasses refine image_mul_sub_mon : typeclass_instances.\n\nDefinition preimage_add_sub_mon@{u} : ∀ {X Y : set@{u}} `{@AdditiveMonoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 Y} `{!AdditiveSubMonoid U}, AdditiveSubMonoid (f* U) := @preimage_sub_mon.\nDefinition preimage_mul_sub_mon@{u} : ∀ {X Y : set@{u}} `{@MultiplicativeMonoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 Y} `{!MultiplicativeSubMonoid U}, MultiplicativeSubMonoid (f* U) := @preimage_sub_mon.\nGlobal Hint Extern 2 (AdditiveSubMonoid (func_op _* _)) => simple notypeclasses refine preimage_add_sub_mon : typeclass_instances.\nGlobal Hint Extern 2 (MultiplicativeSubMonoid (func_op _* _)) => simple notypeclasses refine preimage_mul_sub_mon : typeclass_instances.\n\nDefinition image_add_sub_grp@{u} : ∀ {X Y:set@{u}} `{AdditiveNonComGroup X} `{AdditiveNonComGroup Y} {f:X ⇾ Y} `{!AdditiveSemiGroup_Morphism f} {U:𝒫 X} `{!AdditiveSubGroup U}, AdditiveSubGroup (f⁎ U) := @image_sub_grp.\nGlobal Hint Extern 2 (AdditiveSubGroup (func_op _⁎ _)) => simple notypeclasses refine image_add_sub_grp : typeclass_instances.\n\nDefinition preimage_add_sub_grp@{u} : ∀ {X Y:set@{u}} `{AdditiveNonComGroup X} `{AdditiveNonComGroup Y} {f:X ⇾ Y} `{!AdditiveSemiGroup_Morphism f} {U:𝒫 Y} `{!AdditiveSubGroup U}, AdditiveSubGroup (f* U) := @preimage_sub_grp.\nGlobal Hint Extern 2 (AdditiveSubGroup (func_op _* _)) => simple notypeclasses refine preimage_add_sub_grp : typeclass_instances.\n\nDefinition image_add_com_sg : ∀ `{@AdditiveSemiGroup_Morphism X Y Xop Yop f} {U:𝒫 X} `{!AdditiveSubSemiGroup U, !AdditiveSemiGroup U},\n   AdditiveSemiGroup (subset_to_set (f⁎ U )) := @image_com_sg.\nDefinition image_add_com_mon : ∀ `{@Monoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 X} `{!AdditiveSubMonoid U, !AdditiveMonoid U},\n  AdditiveMonoid (subset_to_set (f⁎ U)) := @image_com_mon.\nGlobal Hint Extern 2 (AdditiveSemiGroup (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_add_com_sg : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveMonoid (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_add_com_mon : typeclass_instances.\n\nDefinition image_add_abgrp@{u} : ∀ {X Y:set@{u}} `{AdditiveNonComGroup X} `{AdditiveNonComGroup Y}\n  {f:X ⇾ Y} `{!AdditiveSemiGroup_Morphism f} {U:𝒫 X} `{!AdditiveSubGroup U, !AdditiveGroup U},\n  AdditiveGroup (subset_to_set (f⁎ U)) := @image_abgrp.\n\nGlobal Hint Extern 2 (AdditiveSemiGroup (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_add_com_sg : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveMonoid (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_add_com_mon : typeclass_instances.\nGlobal Hint Extern 2 (AdditiveGroup (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_add_abgrp : typeclass_instances.\n\nDefinition image_mul_com_mon : ∀ `{@MultiplicativeMonoid_Morphism X Y Xop Xe Yop Ye f} {U:𝒫 X} `{!MultiplicativeSubMonoid U, !MultiplicativeComMonoid U},\n  MultiplicativeComMonoid (subset_to_set (f⁎ U)) := @image_com_mon.\nGlobal Hint Extern 2 (MultiplicativeComMonoid (subset_to_set (func_op _⁎ _))) => simple notypeclasses refine image_mul_com_mon : typeclass_instances.\n\n\n(** Rings *)\n\nCoercion SubNearRig_SubNearRg   `{H:@SubNearRig  R p m z o   S} : SubNearRg  S.  Proof. now split. Qed.\nCoercion SubNearRng_SubNearRg   `{H:@SubNearRng  R p m z   n S} : SubNearRg  S.  Proof. now split. Qed.\nCoercion SubNearRing_SubNearRig `{H:@SubNearRing R p m z o n S} : SubNearRig S.  Proof. now split. Qed.\nCoercion SubNearRing_SubNearRng `{H:@SubNearRing R p m z o n S} : SubNearRng S.  Proof. now split. Qed.\n\nLemma alt_Build_SubNearRg   `{P:@NearRg   R p m z    } (S: 𝒫 R) : AdditiveSubMonoid S → MultiplicativeSubSemiGroup S → SubNearRg   S.  Proof. intros; now split. Qed.\nLemma alt_Build_SubNearRig  `{P:@NearRig  R p m z o  } (S: 𝒫 R) : AdditiveSubMonoid S → MultiplicativeSubMonoid    S → SubNearRig  S.  Proof. intros; now split. Qed.\nLemma alt_Build_SubNearRng  `{P:@NearRng  R p m z   n} (S: 𝒫 R) : AdditiveSubGroup  S → MultiplicativeSubSemiGroup S → SubNearRng  S.  Proof. intros; now split. Qed.\nLemma alt_Build_SubNearRing `{P:@NearRing R p m z o n} (S: 𝒫 R) : AdditiveSubGroup  S → MultiplicativeSubMonoid    S → SubNearRing S.  Proof. intros; now split. Qed.\n\nLemma alt_Build_SubNearRg2   `{P:@NearRg   R p m z    } (S: 𝒫 R) :\n   (∀ x y, x ∊ S ⊠ y ∊ S ⊸ x + y ∊ S)\n → (∀ x y, x ∊ S ⊠ y ∊ S ⊸ x · y "kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26233,"e":26236,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26560,"e":26563,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":26904,"e":26907,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":27272,"e":27275,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"},{"s":27790,"e":27793,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27821,"e":27824,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27882,"e":27885,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27930,"e":27933,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":27991,"e":27994,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":29220,"e":29223,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":29253,"e":29256,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../tactics/rewrite/rewrite.html"},{"s":29636,"e":29639,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../tactics/easy.html"}],"gloss":{"summary":"This file carries the substructure theory of `theory/subgroups.v` over to ring-like structures. It first restates the subsemigroup, submonoid and subgroup results in additive and multiplicative form (builders from closure conditions, the full subset, the induced operations, the inclusion as a morphism, images and preimages), then treats the sub-near-rg, sub-near-rig, sub-near-rng and sub-near-ring predicates: their builders from closure under +, · and −, invariance under equality of subsets, the induced near-ring, ring and commutative ring structures on a substructure, the inclusion as an rg or rig morphism, and the stability of these substructures under images and preimages. It closes with the zero-symmetric part N₀ = { n | n · 0 = 0 } of a right near-ring, shown to be a substructure of whichever kind N is. The results are instances found by resolution, so a subset closed under the ring operations is a ring wherever one is needed.","short":"Subrings and sub-near-rings: builders, induced structure, images, preimages, zero-symmetric part","items":[{"name":"AffineConstructive.theory.subrings.alt_Build_AdditiveSubSemiGroup","base":"alt_Build_AdditiveSubSemiGroup","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"Builds an additive subsemigroup from closure of Y under +","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.subgroups.alt_Build_SubSemiGroup]]: to show that a subset Y of an additive semigroup is a subsemigroup for +, it suffices to show that x ∊ Y ⊠ y ∊ Y implies x + y ∊ Y. The hypothesis uses the tensor because the sum consumes one membership for each summand, and as an affine implication it also carries its contrapositive. The definition only specialises the generic builder, so that later proofs can state the closure condition with + and not the abstract semigroup operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.alt_Build_MultiplicativeSubSemiGroup","base":"alt_Build_MultiplicativeSubSemiGroup","kind":"def","start":7,"body":null,"status":"ok","short":{"text":"Builds a multiplicative subsemigroup from closure of Y under ·","status":"ok"},"long":{"text":"The multiplicative form of [[AffineConstructive.theory.subgroups.alt_Build_SubSemiGroup]]: a subset Y of a multiplicative semigroup is a subsemigroup for · as soon as x ∊ Y ⊠ y ∊ Y implies x · y ∊ Y. It is the same generic builder, written with the multiplication.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.alt_Build_AdditiveSubMonoid","base":"alt_Build_AdditiveSubMonoid","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"Builds an additive submonoid from closure under + and 0 ∊ Y","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.subgroups.alt_Build_SubMonoid]]: a subset of an additive monoid is a submonoid for + and 0 when it is closed under addition, x ∊ Y ⊠ y ∊ Y implying x + y ∊ Y, and contains 0. The builders for sub-near-rgs and sub-near-rigs below rely on it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.alt_Build_MultiplicativeSubMonoid","base":"alt_Build_MultiplicativeSubMonoid","kind":"def","start":9,"body":null,"status":"ok","short":{"text":"Builds a multiplicative submonoid from closure under · and 1 ∊ Y","status":"ok"},"long":{"text":"The multiplicative form of [[AffineConstructive.theory.subgroups.alt_Build_SubMonoid]]: a subset of a multiplicative monoid that is closed under multiplication and contains 1 is a submonoid for · and 1.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.alt_Build_AdditiveSubGroup","base":"alt_Build_AdditiveSubGroup","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"Builds an additive subgroup from closure under + and negation and 0 ∊ Y","status":"ok"},"long":{"text":"The additive form of [[AffineConstructive.theory.subgroups.alt_Build_SubGroup]]: a subset of an additive group, not necessarily abelian, is a subgroup when it is closed under addition, contains 0, and x ∊ Y implies −x ∊ Y. Each closure condition is an affine implication, so it also states the dual: if x + y lies outside Y, then x or y does (in the sense of par), and if −x lies outside Y, so does x.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.full_add_sub_sg","base":"full_add_sub_sg","kind":"def","start":16,"body":null,"status":"ok","short":{"text":"The full subset of an additive semigroup is an additive subsemigroup","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.full_sub_sg]] in additive form. Every element belongs to the full subset ⌈G⌉, so it is closed under +. A hint lets resolution find this instance whenever ⌈G⌉ is asked to be an additive subsemigroup.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.full_add_sub_mon","base":"full_add_sub_mon","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"The full subset of an additive monoid is an additive submonoid","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.full_sub_mon]] in additive form: ⌈M⌉ contains 0 and is closed under +. Resolution finds it through a hint.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.full_add_sub_grp","base":"full_add_sub_grp","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"The full subset of an additive group is an additive subgroup","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.full_sub_grp]] in additive form: ⌈G⌉ is closed under +, under negation, and contains 0. Resolution finds it through a hint.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.full_add_normal_sub_grp","base":"full_add_normal_sub_grp","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The full subset of an additive group is a normal additive subgroup","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.full_normal_sub_grp]] in additive form: ⌈G⌉ is closed under the conjugations y + x − y, as is every subset that contains all of G. Resolution finds it through a hint.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.full_mul_sub_sg","base":"full_mul_sub_sg","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"The full subset of a multiplicative semigroup is a multiplicative subsemigroup","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.full_sub_sg]] in multiplicative form: ⌈G⌉ is closed under ·. Resolution finds it through a hint.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.full_mul_sub_mon","base":"full_mul_sub_mon","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"The full subset of a multiplicative monoid is a multiplicative submonoid","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.full_sub_mon]] in multiplicative form: ⌈M⌉ contains 1 and is closed under ·. Resolution finds it through a hint.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.MultiplicativeSubSemiGroup_fun","base":"MultiplicativeSubSemiGroup_fun","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"Being a multiplicative subsemigroup, as a predicate on subsets respecting equality","status":"ok"},"long":{"text":"The predicate MultiplicativeSubSemiGroup, regarded as a function from !𝒫 G to strict propositions, so that it respects equality of subsets. It is [[AffineConstructive.theory.subgroups.SubSemiGroup_fun]] repackaged by [[AffineConstructive.theory.set.make_fun_alt]] at the multiplicative name. Declaring it canonical lets the rewriting system rewrite a subset U to an equal V inside a goal or hypothesis that says U is a multiplicative subsemigroup.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.MultiplicativeSubMonoid_fun","base":"MultiplicativeSubMonoid_fun","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"Being a multiplicative submonoid, as a predicate on subsets respecting equality","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.SubMonoid_fun]] at the multiplicative name: being a submonoid for · and 1, as a function from !𝒫 G to strict propositions. As a canonical structure it lets rewriting by an equality of subsets pass through this predicate.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.AdditiveSubMonoid_fun","base":"AdditiveSubMonoid_fun","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"Being an additive submonoid, as a predicate on subsets respecting equality","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.SubMonoid_fun]] at the additive name: being a submonoid for + and 0, as a function from !𝒫 G to strict propositions, declared canonical so that rewriting by an equality of subsets passes through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.AdditiveSubGroup_fun","base":"AdditiveSubGroup_fun","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"Being an additive subgroup, as a predicate on subsets respecting equality","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.SubGroup_fun]] at the additive name: being a subgroup for +, 0 and −, as a function from !𝒫 G to strict propositions, declared canonical so that rewriting by an equality of subsets passes through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.AdditiveNormalSubGroup_fun","base":"AdditiveNormalSubGroup_fun","kind":"def","start":32,"body":null,"status":"ok","short":{"text":"Being a normal additive subgroup, as a predicate on subsets respecting equality","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.NormalSubGroup_fun]] at the additive name: being a normal subgroup for +, as a function from !𝒫 G to strict propositions, declared canonical so that rewriting by an equality of subsets passes through it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_sg_plus","base":"sub_add_sg_plus","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"The addition of an additive subsemigroup H: the addition of G restricted to H","status":"ok"},"long":{"text":"When H is an additive subsemigroup of G, the set of members of H gets an addition by adding in G and using closure to stay in H. This is [[AffineConstructive.theory.subgroups.sub_semigroup_op]] for +. A hint provides it whenever an addition is wanted on a subset viewed as a set, so the induced structures below are stated with the familiar operation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_mul_sg_mult","base":"sub_mul_sg_mult","kind":"def","start":34,"body":null,"status":"ok","short":{"text":"The multiplication of a multiplicative subsemigroup H: that of G restricted to H","status":"ok"},"long":{"text":"When H is a multiplicative subsemigroup of G, its members multiply as in G, and closure keeps the product in H. This is [[AffineConstructive.theory.subgroups.sub_semigroup_op]] for ·, provided by a hint on subsets viewed as sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_zero","base":"sub_add_zero","kind":"def","start":35,"body":null,"status":"ok","short":{"text":"The zero of an additive submonoid N: the zero of M, as a member of N","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_monoid_unit]] for +: an additive submonoid contains 0, so 0 is a point of N viewed as a set. A hint makes it the zero of every such subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_mul_one","base":"sub_mul_one","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"The one of a multiplicative submonoid N: the one of M, as a member of N","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_monoid_unit]] for ·: a multiplicative submonoid contains 1, so 1 is a point of N viewed as a set. A hint makes it the one of every such subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_negate","base":"sub_add_negate","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"The negation of an additive subgroup H: negation in G restricted to H","status":"ok"},"long":{"text":"An additive subgroup H is closed under negation, so x ↦ −x restricts to a map from H to H. This is the involution [[AffineConstructive.theory.subgroups.sub_star_semigroup_inv]] of H, provided by a hint as the negation on H viewed as a set.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_semigroup_semigroup","base":"sub_add_semigroup_semigroup","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"An additive subsemigroup, with the restricted addition, is an additive semigroup","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]] for +: the members of H, with the addition [[AffineConstructive.theory.subrings.sub_add_sg_plus]], satisfy the semigroup laws because they hold in G. A hint lets resolution use this whenever a subset viewed as a set is asked to be an additive semigroup, not necessarily commutative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_semigroup_com_semigroup","base":"sub_add_semigroup_com_semigroup","kind":"def","start":44,"body":null,"status":"ok","short":{"text":"An additive subsemigroup of a commutative additive semigroup is commutative","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_semigroup_com_semigroup]] for +: commutativity of + on G restricts to H, so H viewed as a set is a commutative additive semigroup.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_monoid_monoid","base":"sub_add_monoid_monoid","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"An additive submonoid, with the restricted + and 0, is an additive monoid","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_monoid_monoid]] for + and 0: the members of N, with the restricted addition and the zero [[AffineConstructive.theory.subrings.sub_add_zero]], form a monoid, not necessarily commutative.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_monoid_com_monoid","base":"sub_add_monoid_com_monoid","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"An additive submonoid of a commutative additive monoid is a commutative monoid","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_monoid_com_monoid]] for +: if M is a commutative additive monoid, every additive submonoid N, viewed as a set, is one as well.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_group_group","base":"sub_add_group_group","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"An additive subgroup, with the restricted +, 0 and −, is an additive group","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_group_group]] for +: the members of H, with the restricted addition, zero and negation, form a group, not necessarily abelian.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_group_abgroup","base":"sub_add_group_abgroup","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"An additive subgroup of an abelian group is an abelian group","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_group_abgroup]] for +: an additive subgroup H of an abelian group, viewed as a set, is abelian.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_mul_semigroup_semigroup","base":"sub_mul_semigroup_semigroup","kind":"def","start":55,"body":null,"status":"ok","short":{"text":"A multiplicative subsemigroup, with the restricted ·, is a multiplicative semigroup","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_semigroup_semigroup]] for ·: the members of H, with the multiplication [[AffineConstructive.theory.subrings.sub_mul_sg_mult]], form a semigroup.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_mul_monoid_monoid","base":"sub_mul_monoid_monoid","kind":"def","start":56,"body":null,"status":"ok","short":{"text":"A multiplicative submonoid, with the restricted · and 1, is a multiplicative monoid","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_monoid_monoid]] for · and 1: the members of N, with the restricted multiplication and the one [[AffineConstructive.theory.subrings.sub_mul_one]], form a monoid.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_mul_monoid_com_monoid","base":"sub_mul_monoid_com_monoid","kind":"def","start":57,"body":null,"status":"ok","short":{"text":"A multiplicative submonoid of a commutative monoid is a commutative monoid","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_monoid_com_monoid]] for ·: commutativity of the multiplication of M restricts to N.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_add_abgroup_normal","base":"sub_add_abgroup_normal","kind":"def","start":61,"body":null,"status":"ok","short":{"text":"Every additive subgroup of an abelian group is normal","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.sub_abgroup_normal]] for +: in an abelian group y + x − y = x, so every additive subgroup is closed under conjugation. A hint makes every additive subgroup of an abelian group a normal subgroup for resolution.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.from_add_sub_semigroup","base":"from_add_sub_semigroup","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"The inclusion of an additive subsemigroup into G preserves addition","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.from_sub_semigroup]] for +: the inclusion [[AffineConstructive.interfaces.subset.from_subset]] of H into G is an additive semigroup morphism. This holds by construction, since H adds as G does.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.from_mul_sub_semigroup","base":"from_mul_sub_semigroup","kind":"def","start":64,"body":null,"status":"ok","short":{"text":"The inclusion of a multiplicative subsemigroup into G preserves multiplication","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.from_sub_semigroup]] for ·: the inclusion of H into G is a multiplicative semigroup morphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.from_add_sub_monoid","base":"from_add_sub_monoid","kind":"def","start":67,"body":null,"status":"ok","short":{"text":"The inclusion of an additive submonoid into G preserves addition and zero","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.from_sub_monoid]] for + and 0: the inclusion of H into G is an additive monoid morphism. Hints also provide it when only preservation of zero is asked for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.from_mul_sub_monoid","base":"from_mul_sub_monoid","kind":"def","start":68,"body":null,"status":"ok","short":{"text":"The inclusion of a multiplicative submonoid into G preserves multiplication and one","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.from_sub_monoid]] for · and 1: the inclusion of H into G is a multiplicative monoid morphism. Hints also provide it when only preservation of one is asked for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_add_sub_sg","base":"image_add_sub_sg","kind":"def","start":74,"body":null,"status":"ok","short":{"text":"The image of an additive subsemigroup under an additive morphism is one","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.image_sub_sg]] for +: if f preserves addition and U is closed under +, then so is f⁎ U, because f x + f y = f (x + y). A hint lets resolution find it for any image.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_mul_sub_sg","base":"image_mul_sub_sg","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"The image of a multiplicative subsemigroup under a multiplicative morphism is one","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.image_sub_sg]] for ·: if f preserves multiplication and U is closed under ·, then so is f⁎ U. A hint lets resolution find it for any image.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.preimage_add_sub_sg","base":"preimage_add_sub_sg","kind":"def","start":78,"body":null,"status":"ok","short":{"text":"The preimage of an additive subsemigroup under an additive morphism is one","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.preimage_sub_sg]] for +: if f preserves addition and U ⊆ Y is closed under +, then f* U is too, since f (x + y) = f x + f y lies in U whenever f x and f y do.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.preimage_mul_sub_sg","base":"preimage_mul_sub_sg","kind":"def","start":79,"body":null,"status":"ok","short":{"text":"The preimage of a multiplicative subsemigroup under a multiplicative morphism is one","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.preimage_sub_sg]] for ·: if f preserves multiplication and U is closed under ·, then f* U is closed under · as well.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_add_sub_mon","base":"image_add_sub_mon","kind":"def","start":82,"body":null,"status":"ok","short":{"text":"The image of an additive submonoid under an additive monoid morphism is one","status":"ok"},"long":{"text":"[[AffineConstructive.theory.subgroups.image_sub_mon]] for + and 0: the image f⁎ U of an additive submonoid is closed under + and contains f 0 = 0. A hint lets resolution find it for any image.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_mul_sub_mon","base":"image_mul_sub_mon","kind":"def","start":83,"body":null,"status":"ok","short":{"text":"The image of a multiplicative submonoid under a multiplicative monoid morphism is a multiplicative submonoid","status":"ok"},"long":{"text":"The multiplicative reading of [[AffineConstructive.theory.subgroups.image_sub_mon]]: if f preserves · and 1 and U is closed under multiplication and contains 1, then f⁎ U is closed under multiplication and contains 1. It is the general monoid fact at the operation · with unit 1, renamed so that resolution finds it for goals stated with the multiplicative classes, which is what a hint registers it for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.preimage_add_sub_mon","base":"preimage_add_sub_mon","kind":"def","start":86,"body":null,"status":"ok","short":{"text":"The preimage of an additive submonoid under an additive monoid morphism is an additive submonoid","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.subgroups.preimage_sub_mon]]: if f preserves + and 0 and U ⊆ Y is closed under addition and contains 0, then so is f* U. The statement is the monoid fact at the operation + with unit 0; the restatement lets resolution find it for goals phrased with the additive classes.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.preimage_mul_sub_mon","base":"preimage_mul_sub_mon","kind":"def","start":87,"body":null,"status":"ok","short":{"text":"The preimage of a multiplicative submonoid under a multiplicative monoid morphism is a multiplicative submonoid","status":"ok"},"long":{"text":"The multiplicative reading of [[AffineConstructive.theory.subgroups.preimage_sub_mon]]: if f preserves · and 1 and U ⊆ Y is closed under multiplication and contains 1, then so is f* U. It restates the monoid fact at · and 1 so that resolution finds it for the multiplicative classes.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_add_sub_grp","base":"image_add_sub_grp","kind":"def","start":90,"body":null,"status":"ok","short":{"text":"The image of an additive subgroup under an additive morphism between additive groups is an additive subgroup","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.subgroups.image_sub_grp]]. Only preservation of + is asked of f: between groups a map preserving the operation also preserves 0 and negation, so f⁎ U is closed under addition and negation and contains 0 whenever U is.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.preimage_add_sub_grp","base":"preimage_add_sub_grp","kind":"def","start":92,"body":null,"status":"ok","short":{"text":"The preimage of an additive subgroup under an additive morphism between additive groups is an additive subgroup","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.subgroups.preimage_sub_grp]]. As for images, preservation of + is enough between groups: f then preserves 0 and negation, and f* U inherits closure under addition and negation and membership of 0 from U.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_add_com_sg","base":"image_add_com_sg","kind":"def","start":94,"body":null,"status":"ok","short":{"text":"The image of a commutative additive subsemigroup under an additive morphism is a commutative semigroup","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.subgroups.image_com_sg]]: if the members of U commute under +, then so do the members of f⁎ U, with the operation inherited from Y. Commutativity is asked of U, regarded as a set, and not of X, so this applies to commutative pieces of a non-commutative semigroup.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_add_com_mon","base":"image_add_com_mon","kind":"def","start":95,"body":null,"status":"ok","short":{"text":"The image of a commutative additive submonoid under a monoid morphism is a commutative additive monoid","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.subgroups.image_com_mon]]: when U is an additive submonoid that is commutative as a monoid in its own right, its image under a morphism preserving + and 0 is a commutative monoid under the operations of Y. As with [[AffineConstructive.theory.subrings.image_add_com_sg]], commutativity is asked of U alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_add_abgrp","base":"image_add_abgrp","kind":"def","start":98,"body":null,"status":"ok","short":{"text":"The image of an abelian additive subgroup under an additive morphism between groups is an abelian group","status":"ok"},"long":{"text":"The additive reading of [[AffineConstructive.theory.subgroups.image_abgrp]]: an additive subgroup U that is abelian in its own right has an abelian image f⁎ U whenever f preserves + between additive groups. Together with [[AffineConstructive.theory.subrings.image_add_sub_grp]] this makes f⁎ U an abelian additive group with the operations of Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.image_mul_com_mon","base":"image_mul_com_mon","kind":"def","start":102,"body":null,"status":"ok","short":{"text":"The image of a commutative multiplicative submonoid under a multiplicative monoid morphism is a commutative monoid","status":"ok"},"long":{"text":"The multiplicative reading of [[AffineConstructive.theory.subgroups.image_com_mon]]: if the members of the submonoid U commute under ·, so do the members of f⁎ U, which is then a commutative monoid under the multiplication and unit of Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.SubNearRig_SubNearRg","base":"SubNearRig_SubNearRg","kind":"def","start":104,"body":[105,107],"status":"ok","short":{"text":"Every sub-near-rig is a sub-near-rg","status":"ok"},"proof":[{"text":"A sub-near-rg asks for an additive submonoid that is closed under multiplication. A sub-near-rig supplies the additive submonoid directly. It also supplies a multiplicative submonoid, which is in particular a multiplicative subsemigroup.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.SubNearRng_SubNearRg","base":"SubNearRng_SubNearRg","kind":"def","start":108,"body":[109,111],"status":"ok","short":{"text":"Every sub-near-rng is a sub-near-rg","status":"ok"},"proof":[{"text":"The multiplicative subsemigroup carries over unchanged. The additive subgroup of a sub-near-rng is in particular an additive submonoid, which gives the additive part of a sub-near-rg.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.SubNearRing_SubNearRig","base":"SubNearRing_SubNearRig","kind":"def","start":112,"body":[113,115],"status":"ok","short":{"text":"Every sub-near-ring is a sub-near-rig","status":"ok"},"proof":[{"text":"The multiplicative submonoid of a sub-near-ring carries over unchanged. Its additive subgroup is in particular an additive submonoid, so the subset is a sub-near-rig.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.SubNearRing_SubNearRng","base":"SubNearRing_SubNearRng","kind":"def","start":116,"body":[117,119],"status":"ok","short":{"text":"Every sub-near-ring is a sub-near-rng","status":"ok"},"proof":[{"text":"The additive subgroup of a sub-near-ring carries over unchanged. Its multiplicative submonoid is in particular a multiplicative subsemigroup, so the subset is a sub-near-rng.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.alt_Build_SubNearRg","base":"alt_Build_SubNearRg","kind":"prf","start":120,"body":[121,123],"status":"ok","short":{"text":"An additive submonoid that is a multiplicative subsemigroup of a near-rg is a sub-near-rg","status":"ok"},"proof":[{"text":"A sub-near-rg is exactly a subset that is both an additive submonoid and a multiplicative subsemigroup. The two hypotheses therefore supply its two components.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.alt_Build_SubNearRig","base":"alt_Build_SubNearRig","kind":"prf","start":124,"body":[125,127],"status":"ok","short":{"text":"An additive submonoid that is a multiplicative submonoid of a near-rig is a sub-near-rig","status":"ok"},"proof":[{"text":"A sub-near-rig is exactly a subset that is both an additive submonoid and a multiplicative submonoid. The two hypotheses therefore supply its two components.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.alt_Build_SubNearRng","base":"alt_Build_SubNearRng","kind":"prf","start":128,"body":[129,131],"status":"ok","short":{"text":"An additive subgroup that is a multiplicative subsemigroup of a near-rng is a sub-near-rng","status":"ok"},"proof":[{"text":"A sub-near-rng is exactly a subset that is both an additive subgroup and a multiplicative subsemigroup. The two hypotheses therefore supply its two components.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.alt_Build_SubNearRing","base":"alt_Build_SubNearRing","kind":"prf","start":132,"body":[133,135],"status":"ok","short":{"text":"An additive subgroup that is a multiplicative submonoid of a near-ring is a sub-near-ring","status":"ok"},"proof":[{"text":"A sub-near-ring is exactly a subset that is both an additive subgroup and a multiplicative submonoid. The two hypotheses therefore supply its two components.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.alt_Build_SubNearRg2","base":"alt_Build_SubNearRg2","kind":"prf","start":136,"body":[137,141],"status":"ok","short":{"text":"A subset of a near-rg closed under + and · and containing 0 is a sub-near-rg","status":"ok"},"proof":[{"text":"Assume that S is closed under + and under · and that 0 ∊ S. By [[AffineConstructive.theory.subrings.alt_Build_SubNearRg]], it is enough to show that S is an additive submonoid and a multiplicative subsemigroup.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.subrings.alt_Build_AdditiveSubMonoid]], closure under + together with 0 ∊ S makes S an additive submonoid.","status":"ok","from":2,"to":2},{"text":"By [[AffineConstructive.theory.subrings.alt_Build_MultiplicativeSubSemiGroup]], closure under · makes S a multiplicative subsemigroup.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.subrings.alt_Build_SubNearRig2","base":"alt_Build_SubNearRig2","kind":"prf","start":142,"body":[143,147],"status":"ok","short":{"text":"A subset of a near-rig closed under + and · and containing 0 and 1 is a sub-near-rig","status":"ok"},"proof":[{"text":"Assume that S is closed under + and under · and that 0 ∊ S and 1 ∊ S. By [[AffineConstructive.theory.subrings.alt_Build_SubNearRig]], it is enough to show that S is an additive submonoid and a multiplicative submonoid.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.subrings.alt_Build_AdditiveSubMonoid]], closure under + together with 0 ∊ S makes S an additive submonoid.","status":"ok","from":2,"to":2},{"text":"By [[AffineConstructive.theory.subrings.alt_Build_MultiplicativeSubMonoid]], closure under · together with 1 ∊ S makes S a multiplicative submonoid.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.subrings.alt_Build_SubNearRng2","base":"alt_Build_SubNearRng2","kind":"prf","start":148,"body":[149,153],"status":"ok","short":{"text":"A subset of a near-rng closed under +, · and negation and containing 0 is a sub-near-rng","status":"ok"},"proof":[{"text":"Assume the four closure conditions. By [[AffineConstructive.theory.subrings.alt_Build_SubNearRng]] it suffices to show that S is an additive subgroup and a multiplicative subsemigroup.","status":"ok","from":0,"to":1},{"text":"Closure under + and negation together with 0 ∊ S make S an additive subgroup, by [[AffineConstructive.theory.subrings.alt_Build_AdditiveSubGroup]].","status":"ok","from":2,"to":2},{"text":"Closure under · makes S a multiplicative subsemigroup, by [[AffineConstructive.theory.subrings.alt_Build_MultiplicativeSubSemiGroup]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.theory.subrings.alt_Build_SubNearRing2","base":"alt_Build_SubNearRing2","kind":"prf","start":157,"body":[158,164],"status":"ok","short":{"text":"A subset of a near-ring closed under +, · and negation and containing 1 is a sub-near-ring","status":"ok"},"proof":[{"text":"Assume the closure conditions and 1 ∊ S. By [[AffineConstructive.theory.subrings.alt_Build_SubNearRing]] it suffices to show that S is an additive subgroup and a multiplicative submonoid; the latter follows from closure under · and 1 ∊ S by [[AffineConstructive.theory.subrings.alt_Build_MultiplicativeSubMonoid]].","status":"ok","from":0,"to":1},{"text":"For the additive subgroup, [[AffineConstructive.theory.subrings.alt_Build_AdditiveSubGroup]] takes closure under + and negation from the hypotheses, and leaves 0 ∊ S, which is not assumed.","status":"ok","from":2,"to":2},{"text":"Since 0 = 1 − 1 by [[AffineConstructive.theory.additive_groups.plus_negate_r]], it suffices to show 1 − 1 ∊ S.","status":"ok","from":3,"to":3},{"text":"By closure under +, this reduces to 1 ∊ S, which is assumed, and −1 ∊ S. The second follows from 1 ∊ S by closure under negation.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.theory.subrings.full_sub_near_rg","base":"full_sub_near_rg","kind":"prf","start":165,"body":[166,168],"status":"ok","short":{"text":"The full subset of a near-rg is a sub-near-rg","status":"ok"},"proof":[{"text":"A sub-near-rg is an additive submonoid that is also a multiplicative subsemigroup. The full subset is both, by [[AffineConstructive.theory.subrings.full_add_sub_mon]] and [[AffineConstructive.theory.subrings.full_mul_sub_sg]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.full_sub_near_rig","base":"full_sub_near_rig","kind":"prf","start":169,"body":[170,172],"status":"ok","short":{"text":"The full subset of a near-rig is a sub-near-rig","status":"ok"},"proof":[{"text":"A sub-near-rig is an additive submonoid that is also a multiplicative submonoid. The full subset is both, by [[AffineConstructive.theory.subrings.full_add_sub_mon]] and [[AffineConstructive.theory.subrings.full_mul_sub_mon]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.full_sub_near_rng","base":"full_sub_near_rng","kind":"prf","start":173,"body":[174,176],"status":"ok","short":{"text":"The full subset of a near-rng is a sub-near-rng","status":"ok"},"proof":[{"text":"A sub-near-rng is an additive subgroup that is also a multiplicative subsemigroup. The full subset is both, by [[AffineConstructive.theory.subrings.full_add_sub_grp]] and [[AffineConstructive.theory.subrings.full_mul_sub_sg]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.full_sub_near_ring","base":"full_sub_near_ring","kind":"prf","start":177,"body":[178,180],"status":"ok","short":{"text":"The full subset of a near-ring is a sub-near-ring","status":"ok"},"proof":[{"text":"A sub-near-ring is an additive subgroup that is also a multiplicative submonoid. The full subset is both, by [[AffineConstructive.theory.subrings.full_add_sub_grp]] and [[AffineConstructive.theory.subrings.full_mul_sub_mon]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.SubNearRg_proper_impl","base":"SubNearRg_proper_impl","kind":"prf","start":185,"body":[186,188],"status":"ok","short":{"text":"If S₁ = S₂ as subsets and S₁ is a sub-near-rg, then so is S₂","status":"ok"},"proof":[{"text":"Assume S₁ = S₂ and that S₁ is a sub-near-rg. The structure on the ambient near-rg does not depend on the subset, and each substructure condition on S₂ follows from the same condition on S₁ by rewriting along the equality S₁ = S₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.SubNearRg_fun","base":"SubNearRg_fun","kind":"def","start":189,"body":null,"status":"ok","short":{"text":"Being a sub-near-rg, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.subalgebra.SubNearRg]] packaged as a function from !(𝒫 R) to strict propositions, built by [[AffineConstructive.theory.set.make_weak_spred]] from the transport lemma [[AffineConstructive.theory.subrings.SubNearRg_proper_impl]]. Its domain is the of-course set because the predicate is an SProp, used freely: equal subsets must yield the same verdict however often the equality is used. Declared canonical, it lets the rewriting system rewrite a goal SubNearRg S along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.SubNearRig_proper_impl","base":"SubNearRig_proper_impl","kind":"prf","start":190,"body":[191,193],"status":"ok","short":{"text":"If S₁ = S₂ as subsets and S₁ is a sub-near-rig, then so is S₂","status":"ok"},"proof":[{"text":"Assume S₁ = S₂ and that S₁ is a sub-near-rig. The structure on the ambient near-rig does not depend on the subset, and each substructure condition on S₂ follows from the same condition on S₁ by rewriting along the equality S₁ = S₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.SubNearRig_fun","base":"SubNearRig_fun","kind":"def","start":194,"body":null,"status":"ok","short":{"text":"Being a sub-near-rig, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.subalgebra.SubNearRig]] as a function from !(𝒫 R) to strict propositions, built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.theory.subrings.SubNearRig_proper_impl]]. As a canonical structure it makes the predicate a valid target for rewriting by an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.SubNearRng_proper_impl","base":"SubNearRng_proper_impl","kind":"prf","start":195,"body":[196,198],"status":"ok","short":{"text":"If S₁ = S₂ as subsets and S₁ is a sub-near-rng, then so is S₂","status":"ok"},"proof":[{"text":"Assume S₁ = S₂ and that S₁ is a sub-near-rng. The structure on the ambient near-rng does not depend on the subset, and each substructure condition on S₂ follows from the same condition on S₁ by rewriting along the equality S₁ = S₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.SubNearRng_fun","base":"SubNearRng_fun","kind":"def","start":199,"body":null,"status":"ok","short":{"text":"Being a sub-near-rng, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.subalgebra.SubNearRng]] as a function from !(𝒫 R) to strict propositions, built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.theory.subrings.SubNearRng_proper_impl]]. Its canonical declaration lets a goal SubNearRng S be rewritten along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.SubNearRing_proper_impl","base":"SubNearRing_proper_impl","kind":"prf","start":200,"body":[201,203],"status":"ok","short":{"text":"If S₁ = S₂ as subsets and S₁ is a sub-near-ring, then so is S₂","status":"ok"},"proof":[{"text":"Assume S₁ = S₂ and that S₁ is a sub-near-ring. The structure on the ambient near-ring does not depend on the subset, and each substructure condition on S₂ follows from the same condition on S₁ by rewriting along the equality S₁ = S₂.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.SubNearRing_fun","base":"SubNearRing_fun","kind":"def","start":204,"body":null,"status":"ok","short":{"text":"Being a sub-near-ring, as a predicate on subsets that respects equality","status":"ok"},"long":{"text":"The predicate [[AffineConstructive.interfaces.subalgebra.SubNearRing]] as a function from !(𝒫 R) to strict propositions, built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.theory.subrings.SubNearRing_proper_impl]]. Its canonical declaration lets a goal SubNearRing S be rewritten along an equality of subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.sub_near_rg_near_rg","base":"sub_near_rg_near_rg","kind":"prf","start":205,"body":[206,214],"status":"ok","short":{"text":"A sub-near-rg, regarded as a set with the restricted operations, is a near-rg","status":"ok"},"proof":[{"text":"A near-rg is a multiplicative semigroup and an additive monoid satisfying right distributivity and left absorption by 0. The semigroup and monoid parts on S come from the substructure instances [[AffineConstructive.theory.subrings.sub_mul_semigroup_semigroup]] and [[AffineConstructive.theory.subrings.sub_add_monoid_monoid]]. That leaves the two laws relating the operations.","status":"ok","from":0,"to":1},{"text":"For right distributivity, fix x, y and a third element of S. The operations of S are those of R restricted to S, so the equation is right distributivity in R applied to the underlying elements.","status":"ok","from":2,"to":4},{"text":"For left absorption, fix x in S. The equation 0 · x = 0 is the same equation in R, which holds there.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.theory.subrings.sub_near_rig_near_rig","base":"sub_near_rig_near_rig","kind":"prf","start":216,"body":[217,219],"status":"ok","short":{"text":"A sub-near-rig, regarded as a set with the restricted operations, is a near-rig","status":"ok"},"proof":[{"text":"A near-rig is a near-rg whose multiplication is also a monoid. Both parts are already instances on S: the near-rg from [[AffineConstructive.theory.subrings.sub_near_rg_near_rg]] and the multiplicative monoid from [[AffineConstructive.theory.subrings.sub_mul_monoid_monoid]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.sub_near_rng_near_rng","base":"sub_near_rng_near_rng","kind":"prf","start":221,"body":[222,224],"status":"ok","short":{"text":"A sub-near-rng, regarded as a set with the restricted operations, is a near-rng","status":"ok"},"proof":[{"text":"A near-rng is a near-rg whose addition is a group. On S, the near-rg structure comes from [[AffineConstructive.theory.subrings.sub_near_rg_near_rg]] and the additive group from [[AffineConstructive.theory.subrings.sub_add_group_group]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.sub_near_ring_near_ring","base":"sub_near_ring_near_ring","kind":"prf","start":226,"body":[227,229],"status":"ok","short":{"text":"A sub-near-ring, regarded as a set with the restricted operations, is a near-ring","status":"ok"},"proof":[{"text":"A near-ring is a near-rig that is also a near-rng. Both already hold on S, by [[AffineConstructive.theory.subrings.sub_near_rig_near_rig]] and [[AffineConstructive.theory.subrings.sub_near_rng_near_rng]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.sub_near_rg_rg","base":"sub_near_rg_rg","kind":"prf","start":231,"body":[232,241],"status":"ok","short":{"text":"A sub-near-rg of an rg is an rg","status":"ok"},"proof":[{"text":"An rg is a near-rg with commutative addition that is also a left near-rg. The near-rg structure comes from [[AffineConstructive.theory.subrings.sub_near_rg_near_rg]], and commutativity of the addition comes from [[AffineConstructive.theory.subrings.sub_add_monoid_com_monoid]]. That leaves the left near-rg.","status":"ok","from":0,"to":1},{"text":"The semigroup and monoid parts of the left near-rg are found as before. That leaves left distributivity and right absorption by 0.","status":"ok","from":2,"to":2},{"text":"For left distributivity, fix a, b, c in S. Since the operations are restricted from R, the equation a · (b + c) = a · b + a · c is left distributivity in R.","status":"ok","from":3,"to":5},{"text":"For right absorption, fix x in S. Then x · 0 = 0 holds because it holds in R.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.theory.subrings.sub_near_rig_rig","base":"sub_near_rig_rig","kind":"prf","start":243,"body":[244,246],"status":"ok","short":{"text":"A sub-near-rig of a rig is a rig","status":"ok"},"proof":[{"text":"A rig is an rg with a multiplicative monoid. The rg comes from [[AffineConstructive.theory.subrings.sub_near_rg_rg]], since every sub-near-rig is a sub-near-rg. The monoid comes from [[AffineConstructive.theory.subrings.sub_mul_monoid_monoid]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.sub_near_rng_rng","base":"sub_near_rng_rng","kind":"prf","start":248,"body":[249,251],"status":"ok","short":{"text":"A sub-near-rng of a rng is a rng","status":"ok"},"proof":[{"text":"A rng is an rg whose addition is an abelian group. The rg comes from [[AffineConstructive.theory.subrings.sub_near_rg_rg]], and the abelian group comes from [[AffineConstructive.theory.subrings.sub_add_group_abgroup]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.sub_near_ring_ring","base":"sub_near_ring_ring","kind":"prf","start":253,"body":[254,256],"status":"ok","short":{"text":"A sub-near-ring of a ring, with the restricted operations, is a ring","status":"ok"},"proof":[{"text":"A ring is a rig that is also a rng. Both already hold on S, by [[AffineConstructive.theory.subrings.sub_near_rig_rig]] and [[AffineConstructive.theory.subrings.sub_near_rng_rng]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.sub_near_rig_com_rig","base":"sub_near_rig_com_rig","kind":"prf","start":258,"body":[259,261],"status":"ok","short":{"text":"A sub-near-rig of a commutative rig, with the restricted operations, is a commutative rig","status":"ok"},"proof":[{"text":"A commutative rig is a rig whose multiplicative monoid is commutative. The rig comes from [[AffineConstructive.theory.subrings.sub_near_rig_rig]], and commutativity of the restricted multiplication comes from [[AffineConstructive.theory.subrings.sub_mul_monoid_com_monoid]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.sub_near_ring_com_ring","base":"sub_near_ring_com_ring","kind":"prf","start":263,"body":[264,266],"status":"ok","short":{"text":"A sub-near-ring of a commutative ring, with the restricted operations, is a commutative ring","status":"ok"},"proof":[{"text":"A commutative ring is a ring that is also a commutative rig. Both already hold on S, by [[AffineConstructive.theory.subrings.sub_near_ring_ring]] and [[AffineConstructive.theory.subrings.sub_near_rig_com_rig]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.from_sub_near_rg","base":"from_sub_near_rg","kind":"prf","start":268,"body":[269,271],"status":"ok","short":{"text":"The inclusion of a sub-near-rg into its near-rg preserves addition, zero and multiplication","status":"ok"},"proof":[{"text":"An rg morphism is a map that is at once an additive monoid morphism and a multiplicative semigroup morphism, so the claim splits into these two. For the inclusion of S, the additive part is [[AffineConstructive.theory.subrings.from_add_sub_monoid]] and the multiplicative part is [[AffineConstructive.theory.subrings.from_mul_sub_semigroup]]: the operations on S are those of R restricted to S, and S has the zero of R.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.from_sub_near_rig","base":"from_sub_near_rig","kind":"prf","start":273,"body":[274,276],"status":"ok","short":{"text":"The inclusion of a sub-near-rig into its near-rig preserves addition, zero, multiplication and one","status":"ok"},"proof":[{"text":"A rig morphism is a map that is at once an additive monoid morphism and a multiplicative monoid morphism, so the claim splits into these two. For the inclusion of S, the additive part is [[AffineConstructive.theory.subrings.from_add_sub_monoid]] and the multiplicative part is [[AffineConstructive.theory.subrings.from_mul_sub_monoid]]: the operations on S are those of R restricted to S, and S has the zero and the one of R.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_near_rg","base":"image_sub_near_rg","kind":"prf","start":278,"body":[279,281],"status":"ok","short":{"text":"The image of a sub-near-rg under an rg morphism into a near-rg is a sub-near-rg","status":"ok"},"proof":[{"text":"A sub-near-rg is a subset that is both an additive submonoid and a multiplicative subsemigroup, so the claim splits into these two closure properties of f⁎ U. Since f preserves addition and zero, [[AffineConstructive.theory.subrings.image_add_sub_mon]] gives the first; since f preserves multiplication, [[AffineConstructive.theory.subrings.image_mul_sub_sg]] gives the second.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.preimage_sub_near_rg","base":"preimage_sub_near_rg","kind":"prf","start":282,"body":[283,285],"status":"ok","short":{"text":"The preimage of a sub-near-rg under an rg morphism from a near-rg is a sub-near-rg","status":"ok"},"proof":[{"text":"A sub-near-rg is a subset that is both an additive submonoid and a multiplicative subsemigroup, so the claim splits into these two closure properties of f* U. Since f preserves addition and zero, [[AffineConstructive.theory.subrings.preimage_add_sub_mon]] gives the first; since f preserves multiplication, [[AffineConstructive.theory.subrings.preimage_mul_sub_sg]] gives the second.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_near_rig","base":"image_sub_near_rig","kind":"prf","start":288,"body":[289,291],"status":"ok","short":{"text":"The image of a sub-near-rig under a rig morphism into a near-rig is a sub-near-rig","status":"ok"},"proof":[{"text":"A sub-near-rig is a subset that is both an additive submonoid and a multiplicative submonoid, so the claim splits into these two closure properties of f⁎ U. Since f preserves addition and zero, [[AffineConstructive.theory.subrings.image_add_sub_mon]] gives the first; since f preserves multiplication and one, [[AffineConstructive.theory.subrings.image_mul_sub_mon]] gives the second.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.preimage_sub_near_rig","base":"preimage_sub_near_rig","kind":"prf","start":292,"body":[293,295],"status":"ok","short":{"text":"The preimage of a sub-near-rig under a rig morphism from a near-rig is a sub-near-rig","status":"ok"},"proof":[{"text":"A sub-near-rig is a subset that is both an additive submonoid and a multiplicative submonoid, so the claim splits into these two closure properties of f* U. Since f preserves addition and zero, [[AffineConstructive.theory.subrings.preimage_add_sub_mon]] gives the first; since f preserves multiplication and one, [[AffineConstructive.theory.subrings.preimage_mul_sub_mon]] gives the second.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_near_rng","base":"image_sub_near_rng","kind":"prf","start":298,"body":[299,301],"status":"ok","short":{"text":"The image of a sub-near-rng under an rg morphism into a near-rng is a sub-near-rng","status":"ok"},"proof":[{"text":"A sub-near-rng is a subset that is both an additive subgroup and a multiplicative subsemigroup, so the claim splits into these two closure properties of f⁎ U. The additive part is [[AffineConstructive.theory.subrings.image_add_sub_grp]], which needs only that f preserves addition; this follows from f being an additive monoid morphism. The multiplicative part is [[AffineConstructive.theory.subrings.image_mul_sub_sg]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.preimage_sub_near_rng","base":"preimage_sub_near_rng","kind":"prf","start":302,"body":[303,305],"status":"ok","short":{"text":"The preimage of a sub-near-rng under an rg morphism from a near-rng is a sub-near-rng","status":"ok"},"proof":[{"text":"A sub-near-rng is a subset that is both an additive subgroup and a multiplicative subsemigroup, so the claim splits into these two closure properties of f* U. The additive part is [[AffineConstructive.theory.subrings.preimage_add_sub_grp]], which needs only that f preserves addition; this follows from f being an additive monoid morphism. The multiplicative part is [[AffineConstructive.theory.subrings.preimage_mul_sub_sg]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_near_ring","base":"image_sub_near_ring","kind":"prf","start":308,"body":[309,311],"status":"ok","short":{"text":"The image of a sub-near-ring under a rig morphism into a near-ring is a sub-near-ring","status":"ok"},"proof":[{"text":"A sub-near-ring is a subset that is both an additive subgroup and a multiplicative submonoid, so the claim splits into these two closure properties of f⁎ U. The additive part is [[AffineConstructive.theory.subrings.image_add_sub_grp]], which needs only that f preserves addition; this follows from f being an additive monoid morphism. Since f preserves multiplication and one, [[AffineConstructive.theory.subrings.image_mul_sub_mon]] gives the multiplicative part.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.preimage_sub_near_ring","base":"preimage_sub_near_ring","kind":"prf","start":312,"body":[313,315],"status":"ok","short":{"text":"The preimage of a sub-near-ring under a rig morphism from a near-ring is a sub-near-ring","status":"ok"},"proof":[{"text":"A sub-near-ring is a subset that is both an additive subgroup and a multiplicative submonoid, so the claim splits into these two closure properties of f* U. The additive part is [[AffineConstructive.theory.subrings.preimage_add_sub_grp]], which needs only that f preserves addition; this follows from f being an additive monoid morphism. Since f preserves multiplication and one, [[AffineConstructive.theory.subrings.preimage_mul_sub_mon]] gives the multiplicative part.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_rg","base":"image_sub_rg","kind":"prf","start":318,"body":[319,342],"status":"ok","short":{"text":"The image of a sub-near-rg that is an rg, under an rg morphism, is an rg","status":"ok"},"proof":[{"text":"Unfold what an rg is. Resolution supplies most of the structure on the image: the additive commutative monoid, the multiplicative semigroup and the near-rg laws. Two laws remain to prove: left distributivity, and right absorption x · 0 = 0.","status":"ok","from":0,"to":2},{"text":"For left distributivity, take three members x, y, z of the image. The operations on the image are those of Y, so the goal is x · (y + z) = x · y + x · z in Y.","status":"ok","from":3,"to":5},{"text":"Membership in the image provides points a, b, c of U with f a = x, f b = y and f c = z. Rewriting along these equalities turns the goal into the same identity for f a, f b and f c.","status":"ok","from":6,"to":9},{"text":"Since f preserves addition and multiplication, both sides are values of f, so it suffices to show f (a · (b + c)) = f (a · b + a · c). Since f preserves equality, it suffices in turn to show a · (b + c) = a · b + a · c in X.","status":"ok","from":10,"to":11},{"text":"This identity is left distributivity in U, which is an rg, applied to a, b and c regarded as members of U.","status":"ok","from":12,"to":12},{"text":"For right absorption, take a member x of the image. The goal is x · 0 = 0 in Y.","status":"ok","from":13,"to":15},{"text":"Membership in the image provides a in U with f a = x, so the goal becomes f a · 0 = 0.","status":"ok","from":16,"to":19},{"text":"Since f preserves multiplication and zero, it suffices to show f (a · 0) = f 0, and since f preserves equality, it suffices to show a · 0 = 0 in X.","status":"ok","from":20,"to":21},{"text":"This is right absorption in the rg U, applied to a as a member of U.","status":"ok","from":22,"to":23}]},{"name":"AffineConstructive.theory.subrings.image_sub_rig","base":"image_sub_rig","kind":"prf","start":344,"body":[345,347],"status":"ok","short":{"text":"The image of a sub-near-rig that is a rig, under a rig morphism, is a rig","status":"ok"},"proof":[{"text":"A rig is an rg with a multiplicative monoid. A rig morphism is an rg morphism, so the image is an rg by [[AffineConstructive.theory.subrings.image_sub_rg]]. The image is also a multiplicative submonoid by [[AffineConstructive.theory.subrings.image_mul_sub_mon]], so it carries a multiplicative monoid structure.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_rng","base":"image_sub_rng","kind":"prf","start":349,"body":[350,352],"status":"ok","short":{"text":"The image of a sub-near-rng that is a rng, under an rg morphism, is a rng","status":"ok"},"proof":[{"text":"A rng is an rg whose addition is an abelian group. The image is an rg by [[AffineConstructive.theory.subrings.image_sub_rg]], and its addition is an abelian group by [[AffineConstructive.theory.subrings.image_add_abgrp]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_ring","base":"image_sub_ring","kind":"prf","start":354,"body":[355,357],"status":"ok","short":{"text":"The image of a sub-near-ring that is a ring, under a rig morphism, is a ring","status":"ok"},"proof":[{"text":"A ring is at once a rng and a rig. The image is a rng by [[AffineConstructive.theory.subrings.image_sub_rng]], since a rig morphism is an rg morphism. It is a rig by [[AffineConstructive.theory.subrings.image_sub_rig]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_com_rig","base":"image_sub_com_rig","kind":"prf","start":359,"body":[360,362],"status":"ok","short":{"text":"The image of a commutative sub-near-rig under a rig morphism is a commutative rig","status":"ok"},"proof":[{"text":"A commutative rig is a rig whose multiplication is commutative. The image is a rig by [[AffineConstructive.theory.subrings.image_sub_rig]], and its multiplicative monoid is commutative by [[AffineConstructive.theor

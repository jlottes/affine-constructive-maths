y.subrings.image_mul_com_mon]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.image_sub_com_ring","base":"image_sub_com_ring","kind":"prf","start":364,"body":[365,367],"status":"ok","short":{"text":"The image of a commutative sub-near-ring under a rig morphism is a commutative ring","status":"ok"},"proof":[{"text":"A commutative ring is a ring that is also a commutative rig. Both facts hold for the image: it is a ring by [[AffineConstructive.theory.subrings.image_sub_ring]] and a commutative rig by [[AffineConstructive.theory.subrings.image_sub_com_rig]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.theory.subrings.ZeroSymmetricPart","base":"ZeroSymmetricPart","kind":"def","start":369,"body":null,"status":"ok","short":{"text":"The zero-symmetric part N₀ of N: the elements n with n · 0 = 0","status":"ok"},"long":{"text":"The zero-symmetric part N₀ of a set N with a multiplication and a zero is the subset of those n with n · 0 = 0. Membership is the equality of N, an affine proposition, so N₀ is a complemented subset: n is apart from N₀ exactly when n · 0 is apart from 0.\n\nIn a right near-ring the law 0 · x = 0 is an axiom but x · 0 = 0 is not; the elements satisfying the second law form the zero-symmetric part, the standard notion of near-ring theory. A near-ring is zero-symmetric when N₀ is all of N, as in a ring. The lemmas that follow show that N₀ is closed under every operation present, so that it is a sub-near-rg, sub-near-rig, sub-near-rng or sub-near-ring of N as the structure of N allows ([[AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRg]] through [[AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRing]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRg","base":"ZeroSymmetricPart_SubNearRg","kind":"prf","start":371,"body":[372,386],"status":"ok","short":{"text":"The zero-symmetric part of a near-rg is a sub-near-rg","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.subrings.alt_Build_SubNearRg2]], it suffices to show three things: N₀ is closed under addition, N₀ is closed under multiplication, and N₀ contains 0. Membership n ∊ N₀ reads n · 0 = 0, so for x and y the closure conditions ask that x · 0 = 0 and y · 0 = 0 together imply (x + y) · 0 = 0 and x · y · 0 = 0.","status":"ok","from":0,"to":1},{"text":"For sums, right distributivity rewrites (x + y) · 0 as x · 0 + y · 0, and the right-hand 0 is rewritten as 0 + 0. The two hypotheses are equalities of the summands, one each, so they give the equality of the sums, since addition preserves equality.","status":"ok","from":2,"to":5},{"text":"For products, by transitivity through x · 0 it suffices to prove x · y · 0 = x · 0 and x · 0 = 0. Each conclusion is matched to its own hypothesis, used once: x · 0 = 0 is a hypothesis, and what remains is that y · 0 = 0 implies x · y · 0 = x · 0.","status":"ok","from":6,"to":9},{"text":"By associativity, x · y · 0 is x · (y · 0). Multiplying the equality y · 0 = 0 on the left by x gives x · (y · 0) = x · 0.","status":"ok","from":10,"to":11},{"text":"Finally, 0 · 0 = 0 because 0 · n = 0 holds for every n in a near-rg.","status":"ok","from":12,"to":14}]},{"name":"AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRig","base":"ZeroSymmetricPart_SubNearRig","kind":"prf","start":391,"body":[392,395],"status":"ok","short":{"text":"The zero-symmetric part of a near-rig is a sub-near-rig","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.subrings.alt_Build_SubNearRig2]], it suffices to show closure under + and ·, that 0 ∊ N₀ and that 1 ∊ N₀. All but the last hold because N₀ is a sub-near-rg, by [[AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRg]].","status":"ok","from":0,"to":1},{"text":"The remaining goal is 1 · 0 = 0, an instance of [[AffineConstructive.theory.multiplicative_groups.mult_1_l]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRng","base":"ZeroSymmetricPart_SubNearRng","kind":"prf","start":398,"body":[399,406],"status":"ok","short":{"text":"The zero-symmetric part of a near-rng is a sub-near-rng","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.subrings.alt_Build_SubNearRng2]], it suffices to show closure under +, · and negation, together with 0 ∊ N₀. All but closure under negation hold because N₀ is a sub-near-rg, by [[AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRg]].","status":"ok","from":0,"to":1},{"text":"Fix x. The goal is that x · 0 = 0 implies (−x) · 0 = 0.","status":"ok","from":2,"to":3},{"text":"By [[AffineConstructive.theory.rings.negate_mult_distr_l]], (−x) · 0 is −(x · 0), and the right-hand 0 is rewritten as −0. Since negation preserves equality, x · 0 = 0 gives −(x · 0) = −0.","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRing","base":"ZeroSymmetricPart_SubNearRing","kind":"prf","start":409,"body":[410,412],"status":"ok","short":{"text":"The zero-symmetric part of a near-ring is a sub-near-ring","status":"ok"},"proof":[{"text":"A sub-near-ring is at once a sub-near-rng and a sub-near-rig. N₀ is both: a sub-near-rng by [[AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRng]] and a sub-near-rig by [[AffineConstructive.theory.subrings.ZeroSymmetricPart_SubNearRig]].","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.subalgebra":{"page":"../interfaces/subalgebra.html","short":"Subsemigroups, submonoids, subgroups, sub-near-rings and sublattices as closure predicates on subsets","summary":"This file defines substructures as predicates on subsets U : 𝒫 G, each packaging the ambient structure with closure conditions on U: [[SubSemiGroup]] (closed under ∙), [[SubMonoid]] (also containing the unit), [[SubStarSemiGroup]] and [[SubStarMonoid]] (closed under the involution), [[SubGroup]], and [[NormalSubGroup]] (closed under conjugation y ∙ x ∙ y⁻¹). Binary closure is stated with the tensor, x ∊ U ⊠ y ∊ U ⊸ x ∙ y ∊ U, so each membership is used once and the contrapositive comes with it. The generic notions are renamed for addition and multiplication, with accessors such as [[sub_add_sg_closed]] and [[sub_mul_one_closed]] in the ring notation, and combined into [[SubNearRg]], [[SubNearRig]], [[SubNearRng]] and [[SubNearRing]] over the near-ring structures of abstract_algebra. In the same way the meet and join semilattice versions are the semigroup and monoid notions for ⊓ and ⊔, and [[SubLattice]] joins the two."},"AffineConstructive.theory.rings":{"page":"rings.html","short":"Near-rings, rigs and rings: constructors, opposites, sign and zero-divisor laws, morphisms, transfer","summary":"The file develops the ring-like hierarchy, from right and left near-rgs through rigs and rngs to rings, commutative rings and integral domains, together with alternative constructors for each structure. Some constructors take the separate axioms. Others take the additive and multiplicative structures and build only the ring layer on top; [[alt_Build_NearRng]] derives 0 · y = 0 from distributivity by cancellation in the additive group. Every structure has an opposite of the mirrored kind, with multiplication reversed, so each left law is obtained from the right one by instantiation at R ᵒᵖ, as in [[negate_mult_distr_r]] and [[mult_minus_distr_r]]. The file then proves the sign rules [[negate_mult_distr_l]] and [[negate_mult_negate]] and the zero-product laws in their additive and multiplicative forms. The par and tensor forms, [[zero_product_par_iff]] and [[nonzero_product_prod_iff]], need refutative equality. It relates having no zero divisors to cancellation by elements apart from 0 ([[no_zero_divisors_mult_cancel]], [[mult_cancel_no_zero_divisors]]). Rg and rig morphisms are closed under identity, composition and inversion, and any ring-like structure transfers to a set along an injective map that preserves the operations."},"AffineConstructive.theory.subgroups":{"page":"subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.interfaces.sprop":{"page":"../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.interfaces.set":{"page":"../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.theory.set":{"page":"set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.projected_set":{"page":"projected_set.html","short":"Sets whose equality is pulled back along a map into another set","summary":"This file covers sets whose equality is pulled back along a map: a type A with a map f into a set Y, where x = y in A exactly when f x = f y in Y. The class [[IsProjectedSet]] says this holds; [[projected_set]] builds such a set from any map; and [[projected_set_project]] is the projection, an injection into Y. Being strong, and having decidable, affirmative or refutative equality, all pass from Y to the projected set. Products ⊗ and × of projected sets are again projected. For a function f : X ⇾ Y, [[projected_quotient_map]] is the identity viewed as the quotient of X by the kernel of f, and it cancels on the right. Two criteria give functions into projected sets: [[projected_is_fun]] for a map that commutes with the projections, and [[subcarrier_corestrict]] for a map into a subcarrier that lifts a function into the base. Later files use these to build subcarriers and quotients."},"AffineConstructive.logic.aprop":{"page":"../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.tactics.easy":{"page":"../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.replc":{"page":"../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.quote.rewrite_preserves":{"page":"../tactics/quote/rewrite_preserves.html","short":"The rewrite_preserves tactic: pushing a structure-preserving map through terms by quotation","summary":"This file builds the rewrite_preserves tactic on the quotation framework of the quote library. Given a map f, the tactic finds every subterm f x of the goal or of a hypothesis, quotes x under f to obtain an equality f x = y in which the operations f preserves have been pushed inside, and rewrites each such occurrence from f x to y through the affine rewriting system. Two helper tactics do the work: [[quote_tag_tac]] tags the occurrences and hands them to the generic rewriter, and [[quote_replace_tags]] replaces each tag by its quotation equation, skipping the trivial ones. The definitions [[quote_tag]] and [[unfold_quote]] are the marker for an occurrence and the passage from a quotation to its equality."},"AffineConstructive.tactics.misc":{"page":"../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.orders.subset":{"page":"../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.orders":{"page":"../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."}},"constants":null}</script>

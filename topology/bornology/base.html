.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.bornology interfaces.reflection_pair.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices theory.subgroups orders.lattices theory.sublattices orders.sublattices.\nRequire Import reflection_pair.base.\nRequire Import easy rewrite replc simplify tactics.misc.\n\nLocal Abbreviation id := (id_fun _).\n\nCoercion bornology_sub_lattice `{@BornologicalSpace X 𝒜} : SubLattice 𝒜.\nProof. exact ideal_sub_lattice. Qed.\n\nCoercion bornology_join_sub_bsl `{@BornologicalSpace X 𝒜} : JoinSubBoundedSemiLattice 𝒜.\nProof. exact ideal_bounded_join_sub_sl. Qed.\n\n#[global] Hint Extern 4 (SubLattice ?𝒜) => match type of 𝒜 with Bornology _ => simple notypeclasses refine (@bornology_sub_lattice _ 𝒜 _) end : typeclass_instances.\n#[global] Hint Extern 4 (JoinSubSemiLattice ?𝒜) => match type of 𝒜 with Bornology _ => simple notypeclasses refine (@bornology_sub_lattice _ 𝒜 _) end : typeclass_instances.\n#[global] Hint Extern 4 (MeetSubSemiLattice ?𝒜) => match type of 𝒜 with Bornology _ => simple notypeclasses refine (@bornology_sub_lattice _ 𝒜 _) end : typeclass_instances.\n\n#[global] Hint Extern 4 (JoinSubBoundedSemiLattice ?𝒜) => match type of 𝒜 with Bornology _ => simple notypeclasses refine (@bornology_join_sub_bsl _ 𝒜 _) end : typeclass_instances.\n\n(** Morphism classes respect function equality. *)\n\nImport of_course_set_notation.\nImport image_notation.\n\nLemma Bornological_proper_impl@{u} {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y} (f g : X ⇾ Y)\n  : f = g → impl (Bornological f, Bornological g).\nProof. intros E [SX SY B]; split; try exact _.\n  intros U. rew <-E. exact (B U).\nQed.\nCanonical Structure Bornological_fun {X Y} {𝒜:Bornology X} {ℬ:Bornology Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@Bornological X Y 𝒜 ℬ) Bornological_proper_impl.\n\nLemma BornologyReflecting_proper_impl@{u} {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y} (f g : X ⇾ Y)\n  : f = g → impl (BornologyReflecting f, BornologyReflecting g).\nProof. intros E [SX SY R]; split; try exact _.\n  intros U. rew <-E. exact (R U).\nQed.\nCanonical Structure BornologyReflecting_fun {X Y} {𝒜:Bornology X} {ℬ:Bornology Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@BornologyReflecting X Y 𝒜 ℬ) BornologyReflecting_proper_impl.\n\nLemma BornologyInitial_proper_impl@{u} {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y} (f g : X ⇾ Y)\n  : f = g → impl (BornologyInitial f, BornologyInitial g).\nProof. intros E [BB BR]; split; now rew <-E. Qed.\nCanonical Structure BornologyInitial_fun {X Y} {𝒜:Bornology X} {ℬ:Bornology Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@BornologyInitial X Y 𝒜 ℬ) BornologyInitial_proper_impl.\n\nLemma BornologyEmbedding_proper_impl@{u} {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y} (f g : X ⇾ Y)\n  : f = g → impl (BornologyEmbedding f, BornologyEmbedding g).\nProof. intros E ?; split; now rew <-E. Qed.\nCanonical Structure BornologyEmbedding_fun {X Y} {𝒜:Bornology X} {ℬ:Bornology Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@BornologyEmbedding X Y 𝒜 ℬ) BornologyEmbedding_proper_impl.\n\n(** Category structure: identity and composition. *)\n\nLemma id_bornology_initial `{@BornologicalSpace X 𝒜} : BornologyInitial (𝒜:=𝒜) (ℬ:=𝒜) (id_fun X).\nProof. do 2 (split; try exact _).\n+ intros B. now rew (image_id_alt _).\n+ intros B. now rew (preimage_id_alt _).\nQed.\n#[global] Hint Extern 2 (BornologyInitial (id_fun _)) => simple notypeclasses refine id_bornology_initial : typeclass_instances.\n#[global] Hint Extern 2 (Bornological (id_fun _)) => simple notypeclasses refine id_bornology_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting (id_fun _)) => simple notypeclasses refine id_bornology_initial : typeclass_instances.\n\nLocal Instance born_image_mapsto@{u} `{@Bornological@{u} X Y 𝒜 ℬ f} : WeakMapsTo f⁎ 𝒜 ℬ.\nProof. intros A ?. exact (bornological f (to_subset A)). Qed.\n\nLocal Instance born_preimage_mapsto@{u} `{@BornologyReflecting@{u} X Y 𝒜 ℬ f} : WeakMapsTo f* ℬ 𝒜.\nProof. intros B ?. exact (bornology_reflecting f (to_subset B)). Qed.\n\nLemma bornological_alt@{u} `{@Bornological@{u} X Y 𝒜 ℬ f} (A:𝒫 X) `{A ∊ 𝒜} : f⁎ A ∊ ℬ.\nProof. now apply born_image_mapsto. Qed.\nArguments bornological_alt {_ _ _ _} f {_} A {_}.\n\nLemma bornological_reflecting_alt@{u} `{@BornologyReflecting@{u} X Y 𝒜 ℬ f} (B:𝒫 Y) `{B ∊ ℬ} : f* B ∊ 𝒜.\nProof. now apply born_preimage_mapsto. Qed.\nArguments bornological_reflecting_alt {_ _ _ _} f {_} B {_}.\n\nDefinition born_image@{u}    `{@Bornological@{u}        X Y 𝒜 ℬ f} := restrict f⁎ 𝒜 ℬ.\nDefinition born_preimage@{u} `{@BornologyReflecting@{u} X Y 𝒜 ℬ f} := restrict f* ℬ 𝒜.\nArguments born_image    {_ _ _ _} f {_}.\nArguments born_preimage {_ _ _ _} f {_}.\n\nLemma compose_bornological@{u} `{@Bornological@{u} X Y 𝒜 ℬ f} `{@Bornological@{u} Y Z ℬ 𝒞 g}\n  : Bornological (g ∘ f).\nProof. split; try exact _.\n  intros A. rew (image_compose_alt _ _ _).\n  apply (born_image g (born_image f A)).\nQed.\n#[global] Hint Extern 2 (Bornological (_ ∘ _)) => simple notypeclasses refine compose_bornological : typeclass_instances.\n\nLemma compose_bornology_reflecting@{u} `{@BornologyReflecting@{u} X Y 𝒜 ℬ f} `{@BornologyReflecting@{u} Y Z ℬ 𝒞 g}\n  : BornologyReflecting (g ∘ f).\nProof. split; try exact _. intros C. apply (born_preimage f (born_preimage g C)). Qed.\n#[global] Hint Extern 2 (BornologyReflecting (_ ∘ _)) => simple notypeclasses refine compose_bornology_reflecting : typeclass_instances.\n\nLemma born_refl_factor@{u} {X Y Z:set@{u}}\n  {𝒜:Bornology X} {ℬ:Bornology Y} {𝒞:Bornology Z} (f: X ⇾ Y) (g: Y ⇾ Z) `{!Bornological g}\n  : BornologyReflecting (g ∘ f) → BornologyReflecting f.\nProof. intros Hgf. split; try exact _. intros B.\n  rew (preimage_image_unit g B). change ( (g ∘ f)* (g⁎ B) ∊ 𝒜).\n  pose proof bornological g B.\n  exact (bornological_reflecting_alt (g ∘ f) _).\nQed.\n\nLemma bornological_factor@{u} {X Y Z:set@{u}}\n  {𝒜:Bornology X} {ℬ:Bornology Y} {𝒞:Bornology Z} (f: X ⇾ Y) (g: Y ⇾ Z) `{!BornologyReflecting g}\n  : Bornological (g ∘ f) → Bornological f.\nProof. intros Hgf. split; try exact _. intros A.\n  rew (preimage_image_unit g (f⁎ A)), <-(image_compose_alt f g A).\n  pose proof bornological (g ∘ f) A.\n  exact (bornological_reflecting_alt g _).\nQed.\n\nLemma compose_bornology_initial@{u} `{@BornologyInitial@{u} X Y 𝒜 ℬ f} `{@BornologyInitial@{u} Y Z ℬ 𝒞 g}\n  : BornologyInitial (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (BornologyInitial (_ ∘ _)) => simple notypeclasses refine compose_bornology_initial : typeclass_instances.\n\nLemma compose_bornology_emb@{u} `{@BornologyEmbedding@{u} X Y 𝒜 ℬ f} `{@BornologyEmbedding@{u} Y Z ℬ 𝒞 g}\n  : BornologyEmbedding (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (BornologyEmbedding (_ ∘ _)) => simple notypeclasses refine compose_bornology_emb : typeclass_instances.\n\n(** Abstract reflection pair instance *)\n\nInductive 𝐁𝐨𝐫𝐧 :=.\n#[global] Hint Extern 0 (Fiber 𝐁𝐨𝐫𝐧) => exact Bornology : typeclass_instances.\n#[global] Hint Extern 0 (ObjClass 𝐁𝐨𝐫𝐧) => exact @BornologicalSpace : typeclass_instances.\n#[global] Hint Extern 0 (HomClass 𝐁𝐨𝐫𝐧) => exact @Bornological_fun : typeclass_instances.\n#[global] Hint Extern 0 (RflClass 𝐁𝐨𝐫𝐧) => exact @BornologyReflecting_fun : typeclass_instances.\n#[global] Hint Extern 0 (IniClass 𝐁𝐨𝐫𝐧) => exact @BornologyInitial_fun : typeclass_instances.\n#[global] Hint Extern 0 (EmbClass 𝐁𝐨𝐫𝐧) => exact @BornologyEmbedding_fun : typeclass_instances.\n#[global] Hint Extern 2 (Fib 𝐁𝐨𝐫𝐧 ?X) => change (Bornology X) : typeclass_instances.\n\nDefinition born_classes@{u} : ReflectionPairClasses@{u} 𝐁𝐨𝐫𝐧.  Proof. now esplit. Defined.\n#[global] Hint Extern 2 (ReflectionPairClasses 𝐁𝐨𝐫𝐧) => exact born_classes : typeclass_instances.\n\nLemma born_construct: Construct 𝐁𝐨𝐫𝐧.\nProof. split.\n+ now change (∀ `{@BornologicalSpace X 𝒜}, Bornological (id_fun X)).\n+ now change (∀ `{@Bornological X Y 𝒜 ℬ f}, BornologicalSpace X).\n+ now change (∀ `{@Bornological X Y 𝒜 ℬ f}, BornologicalSpace Y).\n+ now change (∀ X Y Z 𝒜 ℬ 𝒞 f g, @Bornological X Y 𝒜 ℬ f → @Bornological Y Z ℬ 𝒞 g\n                                → Bornological (g ∘ f)).\nQed.\n#[global] Hint Extern 0 (Construct 𝐁𝐨𝐫𝐧) => exact born_construct : typeclass_instances.\n\nLemma born_rfl_construct: RflConstruct 𝐁𝐨𝐫𝐧.\nProof. split.\n+ now change (∀ `{@BornologicalSpace X 𝒜}, BornologyReflecting (id_fun X)).\n+ now change (∀ `{@BornologyReflecting X Y 𝒜 ℬ f}, BornologicalSpace X).\n+ now change (∀ `{@BornologyReflecting X Y 𝒜 ℬ f}, BornologicalSpace Y).\n+ now change (∀ X Y Z 𝒜 ℬ 𝒞 f g, @BornologyReflecting X Y 𝒜 ℬ f → @BornologyReflecting Y Z ℬ 𝒞 g\n                                → BornologyReflecting (g ∘ f)).\nQed.\n#[global] Hint Extern 0 (RflConstruct 𝐁𝐨𝐫𝐧) => exact born_rfl_construct : typeclass_instances.\n\nLemma born_ini_spec : IniClassSpec 𝐁𝐨𝐫𝐧.\nProof. hnf; intros; split; intros [??]; now split. Qed.\n#[global] Hint Extern 0 (IniClassSpec 𝐁𝐨𝐫𝐧) => exact born_ini_spec : typeclass_instances.\n\nLemma born_emb_spec : EmbClassSpec 𝐁𝐨𝐫𝐧.\nProof. hnf; intros; split; intros [??]; now split. Qed.\n#[global] Hint Extern 0 (EmbClassSpec 𝐁𝐨𝐫𝐧) => exact born_emb_spec : typeclass_instances.\n\nLemma born_rfl_pair : ReflectionPair 𝐁𝐨𝐫𝐧.\nProof. esplit; try exact _.\n+ change (∀ X Y Z 𝒜 ℬ 𝒞 f g, @BornologyReflecting Y Z ℬ 𝒞 g → @Bornological X Z 𝒜 𝒞 (g ∘ f)\n                            → @Bornological X Y 𝒜 ℬ f).\n  intros. now apply (bornological_factor f g).\n+ change (∀ X Y Z 𝒜 ℬ 𝒞 f g, @Bornological Y Z ℬ 𝒞 g → @BornologyReflecting X Z 𝒜 𝒞 (g ∘ f)\n                            → @BornologyReflecting X Y 𝒜 ℬ f).\n  intros. now apply (born_refl_factor f g).\nQed.\n#[global] Hint Extern 0 (ReflectionPair 𝐁𝐨𝐫𝐧) => exact born_rfl_pair : typeclass_instances.\n\n\n(** Inverses flip classes *)\n\nLocal Open Scope fun_inv_scope.\nLemma invert_bornological@{u} `{@Bornological@{u} X Y 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : BornologyReflecting f⁻¹.\nProof. exact (invert_hom (C:=𝐁𝐨𝐫𝐧) (f:=f)). Qed.\n#[global] Hint Extern 4 (BornologyReflecting _⁻¹) => simple notypeclasses refine invert_bornological : typeclass_instances.\n\nLemma invert_bornology_reflecting@{u} `{@BornologyReflecting@{u} X Y 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : Bornological f⁻¹.\nProof. exact (invert_rfl (C:=𝐁𝐨𝐫𝐧) (f:=f)). Qed.\n#[global] Hint Extern 4 (Bornological _⁻¹) => simple notypeclasses refine invert_bornology_reflecting : typeclass_instances.\n\nLemma invert_bornology_initial@{u} `{@BornologyInitial@{u} X Y 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : BornologyEmbedding f⁻¹.\nProof. exact (invert_ini (C:=𝐁𝐨𝐫𝐧) (f:=f)). Qed.\n#[global] Hint Extern 4 (BornologyInitial _⁻¹) => simple notypeclasses refine invert_bornology_initial : typeclass_instances.\n#[global] Hint Extern 4 (BornologyEmbedding _⁻¹) => simple notypeclasses refine invert_bornology_initial : typeclass_instances.\nLocal Close Scope fun_inv_scope.\n\n(** Miscellaneous *)\nDefinition born_singleton_alt `{@BornologicalSpace X 𝒜} (x:X) : 𝒜\n  := @to_subset _ 𝒜 (singleton x) (bornology_singleton x).\nArguments born_singleton_alt {X} 𝒜 {_} x.\n\nDefinition born_pt `{@BornologicalSpace X 𝒜} : X ⇾ 𝒜\n  := @func_make _ _ (born_singleton_alt 𝒜) (is_fun singleton).\n\n\n(** Regularity: the pointwise form of the decision, cf. [uniform_regularity_alt]. *)\nLemma bornology_regularity_alt `{@BornologyRegularity X 𝒜} (K:𝒜)\n  : ∐ (K':𝒜), K ⊆ K' ⊠ ∏ (x:X), x ∊ K' ∨ x ∊̸ K.\nProof.\n  pose proof bornology_regularity K as [K' [EK HK]]. exists K'. split; trivial.\n  intros x. generalize (I:x ∊ ⊤). now rew <-HK.\nQed.\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":26,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":5,"s":242,"e":305,"kind":"vernac","status":"ok","ms":28,"messages":[],"goals":null},{"i":6,"s":306,"e":402,"kind":"vernac","status":"ok","ms":32,"messages":[],"goals":null},{"i":7,"s":403,"e":439,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":440,"e":542,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":9,"s":543,"e":579,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":10,"s":580,"e":636,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":11,"s":638,"e":674,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":12,"s":676,"e":750,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":{"fg":[{"id":"39","name":null,"hyps":["8f69a0958382ddcb","fe5e4d3f940834d6","abe1c65d6cb06d79"],"ccl":"204634dfab586079"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":13,"s":751,"e":757,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":{"fg":[{"id":"39","name":null,"hyps":["8f69a0958382ddcb","fe5e4d3f940834d6","abe1c65d6cb06d79"],"ccl":"204634dfab586079"}],"bg":[],"shelved":[],"given_up":[]},"uses":[]},{"i":14,"s":758,"e":782,"kind":"tactic","status":"ok","ms":13,"messages":[],"goals":{"fg":[],"bg /tactics/easy.html"},{"s":9731,"e":9734,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9939,"e":9942,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11846,"e":11849,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11850,"e":11853,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[AffineConstructive.topology.bornology.base.bornological_factor]] and [[AffineConstructive.topology.bornology.base.born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[AffineConstructive.topology.bornology.base.born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[AffineConstructive.topology.bornology.base.born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[AffineConstructive.topology.bornology.base.bornology_regularity_alt]].","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","items":[{"name":"AffineConstructive.topology.bornology.base.id","base":"id","kind":"abbrev","start":11,"body":null,"status":"ok","short":{"text":"Local abbreviation for the identity function, its set inferred","status":"ok"},"long":{"text":"An abbreviation, local to this file, for the identity function [[AffineConstructive.interfaces.set.id_fun]] with its set left to be inferred.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.bornology_sub_lattice","base":"bornology_sub_lattice","kind":"def","start":12,"body":[13,15],"status":"ok","short":{"text":"The bounded subsets of a bornological space form a sublattice of 𝒫 X","status":"ok"},"proof":[{"text":"A bornology is an ideal of (𝒫 X, ⊆), and 𝒫 X is a lattice under inclusion; an ideal of a lattice is a sublattice by [[AffineConstructive.orders.filters.ideal_sub_lattice]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.bornology_join_sub_bsl","base":"bornology_join_sub_bsl","kind":"def","start":16,"body":[17,19],"status":"ok","short":{"text":"The bounded subsets contain ∅ and are closed under binary joins","status":"ok"},"proof":[{"text":"𝒫 X is a bounded lattice with ∅ as bottom, and a bornology is an ideal in it; an ideal of a bounded join semilattice contains the bottom and is closed under binary joins by [[AffineConstructive.orders.filters.ideal_bounded_join_sub_sl]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.Bornological_proper_impl","base":"Bornological_proper_impl","kind":"prf","start":26,"body":[27,32],"status":"ok","short":{"text":"Equal functions are bornological together: if f = g and f is bornological, so is g","status":"ok"},"proof":[{"text":"Assume f = g and that f is bornological. The two spaces stay bornological, so what remains is that g sends bounded sets to bounded sets.","status":"ok","from":0,"to":1},{"text":"Fix a bounded U ⊆ X. Since f = g, the image g⁎ U equals f⁎ U, and f⁎ U is bounded because f is bornological.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.topology.bornology.base.Bornological_fun","base":"Bornological_fun","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"Being bornological, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.bornology.Bornological]], of maps under which the image of every bounded subset is bounded, packaged as a strict predicate on the affirmed set !(X ⇾ Y) of functions. It is built with [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.topology.bornology.base.Bornological_proper_impl]], the fact that a function equal to a bornological one is bornological.\n\nIt is declared canonical, so unification recognises `Bornological f` as this predicate applied to f. A proof that holds Bornological f and an equality f = g can then rewrite one into the other.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.BornologyReflecting_proper_impl","base":"BornologyReflecting_proper_impl","kind":"prf","start":34,"body":[35,40],"status":"ok","short":{"text":"Equal functions reflect bounded sets together: if f = g and f is reflecting, so is g","status":"ok"},"proof":[{"text":"Assume f = g and that f reflects bounded sets. The two spaces stay bornological, so what remains is that preimages under g of bounded sets are bounded.","status":"ok","from":0,"to":1},{"text":"Fix a bounded U ⊆ Y. Since f = g, the preimage g* U equals f* U, which is bounded because f reflects bounded sets.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.topology.bornology.base.BornologyReflecting_fun","base":"BornologyReflecting_fun","kind":"def","start":41,"body":null,"status":"ok","short":{"text":"Being bornology-reflecting, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.bornology.BornologyReflecting]], of maps under which the preimage of every bounded subset is bounded, packaged as a strict predicate on the affirmed set !(X ⇾ Y) of functions. It is transported along equality of functions by [[AffineConstructive.topology.bornology.base.BornologyReflecting_proper_impl]].\n\nIt is declared canonical, so unification recognises `BornologyReflecting f` as this predicate applied to f. Proofs can then rewrite the property along an equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.BornologyInitial_proper_impl","base":"BornologyInitial_proper_impl","kind":"prf","start":42,"body":[43,45],"status":"ok","short":{"text":"Equal functions are bornologically initial together","status":"ok"},"proof":[{"text":"An initial map is one that is both bornological and reflecting. Assume f = g and that f is initial. Each of the two properties passes from f to g by rewriting with the equality f = g.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.BornologyInitial_fun","base":"BornologyInitial_fun","kind":"def","start":46,"body":null,"status":"ok","short":{"text":"Being bornologically initial, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.bornology.BornologyInitial]], of maps that are both bornological and bornology-reflecting, packaged as a strict predicate on the affirmed set !(X ⇾ Y) of functions. It is transported along equality of functions by [[AffineConstructive.topology.bornology.base.BornologyInitial_proper_impl]].\n\nIt is declared canonical, so the property can be rewritten along an equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.BornologyEmbedding_proper_impl","base":"BornologyEmbedding_proper_impl","kind":"prf","start":47,"body":[48,50],"status":"ok","short":{"text":"Equal functions are bornological embeddings together","status":"ok"},"proof":[{"text":"Assume f = g and that f is an embedding. Each of the two parts of the definition, being initial and being injective, passes from f to g by rewriting with the equality f = g.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.BornologyEmbedding_fun","base":"BornologyEmbedding_fun","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"Being a bornological embedding, as a predicate on functions respecting their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.bornology.BornologyEmbedding]], of injective bornologically initial maps, packaged as a strict predicate on the affirmed set !(X ⇾ Y) of functions. It is transported along equality of functions by [[AffineConstructive.topology.bornology.base.BornologyEmbedding_proper_impl]].\n\nIt is declared canonical, so the property can be rewritten along an equality of functions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.id_bornology_initial","base":"id_bornology_initial","kind":"prf","start":52,"body":[53,61],"status":"ok","short":{"text":"The identity of a bornological space is bornologically initial","status":"ok"},"proof":[{"text":"Unfolding initiality leaves two things to show: the identity sends bounded sets to bounded sets, and it pulls bounded sets back to bounded sets.","status":"ok","from":0,"to":1},{"text":"For a bounded B, the image of B under the identity is B itself by [[AffineConstructive.orders.subset_images.image_id_alt]], so it is bounded.","status":"ok","from":2,"to":4},{"text":"For a bounded B, the preimage of B under the identity is B itself by [[AffineConstructive.orders.subset_images.preimage_id_alt]], so it is bounded.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.bornology.base.born_image_mapsto","base":"born_image_mapsto","kind":"inst","start":65,"body":[66,69],"status":"ok","short":{"text":"A bornological map's image operation f⁎ sends bounded subsets of X to bounded subsets of Y","status":"ok"},"proof":[{"text":"Let A be a subset of X that belongs to 𝒜. Read as a bounded set, A is one that the bornological map f carries to a bounded image f⁎ A.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.bornology.base.born_preimage_mapsto","base":"born_preimage_mapsto","kind":"inst","start":70,"body":[71,74],"status":"ok","short":{"text":"A reflecting map's preimage operation f* sends bounded subsets of Y to bounded subsets of X","status":"ok"},"proof":[{"text":"Let B be a subset of Y that belongs to ℬ. Read as a bounded set, B has a bounded preimage f* B because f reflects bounded sets.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.bornology.base.bornological_alt","base":"bornological_alt","kind":"prf","start":75,"body":[76,78],"status":"ok","short":{"text":"Under a bornological map f, the image f⁎ A of a bounded subset A is bounded","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.bornology.base.born_image_mapsto]] applied to A: the image operation of a bornological map sends the bounded set A to a bounded set.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.bornological_reflecting_alt","base":"bornological_reflecting_alt","kind":"prf","start":80,"body":[81,83],"status":"ok","short":{"text":"Under a bornology-reflecting map f, the preimage f* B of a bounded subset B is bounded","status":"ok"},"proof":[{"text":"This restates the defining property of a reflecting map for a bounded subset B given as a subset of Y with a proof of its boundedness. The preimage operation f* sends bounded subsets to bounded subsets ([[AffineConstructive.topology.bornology.base.born_preimage_mapsto]]), and applying that to B gives the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.born_image","base":"born_image","kind":"def","start":85,"body":null,"status":"ok","short":{"text":"The image under a bornological map, as a function from bounded sets to bounded sets","status":"ok"},"long":{"text":"For a bornological map f : X ⇾ Y, the image operation f⁎ restricted ([[AffineConstructive.interfaces.subset.restrict]]) to a function from the bounded subsets of X to the bounded subsets of Y. That it lands in the bounded subsets is [[AffineConstructive.topology.bornology.base.born_image_mapsto]].\n\nApplying it to a bounded subset yields a bounded subset in one step, without a separate proof of boundedness. Proofs in this file and in the files on products of bornological spaces, on locally uniformly continuous maps and on the trapped completion use it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.born_preimage","base":"born_preimage","kind":"def","start":86,"body":null,"status":"ok","short":{"text":"The preimage under a bornology-reflecting map, as a function from bounded sets to bounded sets","status":"ok"},"long":{"text":"For a bornology-reflecting map f : X ⇾ Y, the preimage operation f* restricted ([[AffineConstructive.interfaces.subset.restrict]]) to a function from the bounded subsets of Y to the bounded subsets of X. That it lands in the bounded subsets is [[AffineConstructive.topology.bornology.base.born_preimage_mapsto]]. It is the counterpart of [[AffineConstructive.topology.bornology.base.born_image]] for the reflecting class.\n\nProofs in this file and in the files on products of bornological spaces, on the trapped completion and on locally uniformly continuous maps use it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.compose_bornological","base":"compose_bornological","kind":"prf","start":89,"body":[90,95],"status":"ok","short":{"text":"The composite of two bornological maps is bornological","status":"ok"},"proof":[{"text":"Being bornological means having bornological spaces at both ends and carrying bounded sets to bounded sets. The two ends come from f and g, so only the condition on bounded sets remains.","status":"ok","from":0,"to":1},{"text":"Fix a bounded subset A of X. The image of A under g ∘ f is the image under g of the image under f ([[AffineConstructive.orders.subset_images.image_compose_alt]]), so it suffices to show that g⁎(f⁎ A) is bounded.","status":"ok","from":2,"to":3},{"text":"f⁎ A is bounded because f is bornological, and so its image under g is bounded because g is.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.bornology.base.compose_bornology_reflecting","base":"compose_bornology_reflecting","kind":"prf","start":97,"body":[98,102],"status":"ok","short":{"text":"The composite of two bornology-reflecting maps is bornology-reflecting","status":"ok"},"proof":[{"text":"The two ends come from f and g, so only the reflecting condition remains: the preimage of a bounded subset is bounded.","status":"ok","from":0,"to":1},{"text":"Fix a bounded subset C of Z. The preimage of C under g ∘ f is the preimage under f of g* C, which is the same subset by definition. g* C is bounded because g reflects bounded sets, and so its preimage under f is bounded because f does.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.base.born_refl_factor","base":"born_refl_factor","kind":"prf","start":104,"body":[105,113],"status":"ok","short":{"text":"If g is bornological and g ∘ f is bornology-reflecting, then f is bornology-reflecting","status":"ok"},"proof":[{"text":"Assume g ∘ f is bornology-reflecting. Both ends of f are bornological spaces, so it remains to show that f* B is bounded for every bounded B in Y.","status":"ok","from":0,"to":2},{"text":"Fix a bounded B. B lies in the preimage under g of its own image, g* (g⁎ B) ([[AffineConstructive.orders.subset_images.preimage_image_unit]]), so f* B is contained in f* (g* (g⁎ B)). A bornology is closed under subsets, so it suffices to show that the larger set is bounded. That set is the preimage of g⁎ B under g ∘ f.","status":"ok","from":3,"to":5},{"text":"g⁎ B is bounded because g is bornological. The composite g ∘ f reflects bounded sets ([[AffineConstructive.topology.bornology.base.bornological_reflecting_alt]]), so the preimage of g⁎ B under g ∘ f is bounded.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.bornology.base.bornological_factor","base":"bornological_factor","kind":"prf","start":114,"body":[115,122],"status":"ok","short":{"text":"If g is bornology-reflecting and g ∘ f is bornological, then f is bornological","status":"ok"},"proof":[{"text":"Assume g ∘ f is bornological. Both ends of f are bornological spaces, so it remains to show that f⁎ A is bounded for every bounded A in X.","status":"ok","from":0,"to":2},{"text":"Fix a bounded A. f⁎ A lies in g* (g⁎ (f⁎ A)) ([[AffineConstructive.orders.subset_images.preimage_image_unit]]), and g⁎ (f⁎ A) is the image of A under g ∘ f ([[AffineConstructive.orders.subset_images.image_compose_alt]]). Since bounded sets are closed under subsets, it suffices to show that g* ((g ∘ f)⁎ A) is bounded.","status":"ok","from":3,"to":4},{"text":"(g ∘ f)⁎ A is bounded because g ∘ f is bornological. g reflects bounded sets ([[AffineConstructive.topology.bornology.base.bornological_reflecting_alt]]), so its preimage under g is bounded.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.bornology.base.compose_bornology_initial","base":"compose_bornology_initial","kind":"prf","start":123,"body":[124,126],"status":"ok","short":{"text":"The composite of two bornologically initial maps is bornologically initial","status":"ok"},"proof":[{"text":"An initial map is both bornological and bornology-reflecting. The composite is bornological by [[AffineConstructive.topology.bornology.base.compose_bornological]] and bornology-reflecting by [[AffineConstructive.topology.bornology.base.compose_bornology_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.compose_bornology_emb","base":"compose_bornology_emb","kind":"prf","start":128,"body":[129,131],"status":"ok","short":{"text":"The composite of two bornological embeddings is a bornological embedding","status":"ok"},"proof":[{"text":"An embedding is an initial map that is injective. The composite is initial by [[AffineConstructive.topology.bornology.base.compose_bornology_initial]], and a composite of injective functions is injective by [[AffineConstructive.theory.set.compose_injective]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧","base":"𝐁𝐨𝐫𝐧","kind":"ind","start":133,"body":null,"status":"ok","short":{"text":"The label naming the reflection pair of bornological spaces","status":"ok"},"long":{"text":"An empty type used only as a name. The reflection-pair interface is indexed by such a label, and the hints following its declaration tell instance resolution what the pair for 𝐁𝐨𝐫𝐧 is. The structures on a set are its bornologies and the objects are the bornological spaces. The forward maps are the bornological ones, and the reflecting maps are the bornology-reflecting ones. The initial maps and the embeddings are the bornologically initial maps and the bornological embeddings.\n\n[[AffineConstructive.topology.bornology.base.born_rfl_pair]] makes 𝐁𝐨𝐫𝐧 a reflection pair, so the general theory of reflection pairs applies to bornologies. Its first consequences are the inverse lemmas of this file. In `topology/bornology/subspace.v`, [[AffineConstructive.topology.bornology.subspace.born_cloven_pair]] builds on this and makes 𝐁𝐨𝐫𝐧 a cloven reflection pair, with the pullback bornology as the cleavage.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧_rect","base":"𝐁𝐨𝐫𝐧_rect","kind":"scheme","short":{"text":"Elimination from the empty label into any type family, vacuous","status":"ok"}},{"name":"AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧_ind","base":"𝐁𝐨𝐫𝐧_ind","kind":"scheme","short":{"text":"Elimination from the empty label into any Prop family, vacuous","status":"ok"}},{"name":"AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧_rec","base":"𝐁𝐨𝐫𝐧_rec","kind":"scheme","short":{"text":"Elimination from the empty label into any Set family, vacuous","status":"ok"}},{"name":"AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧_sind","base":"𝐁𝐨𝐫𝐧_sind","kind":"scheme","short":{"text":"Elimination from the empty label into any SProp family, vacuous","status":"ok"}}]},{"name":"AffineConstructive.topology.bornology.base.born_classes","base":"born_classes","kind":"def","start":141,"body":[142,144],"status":"ok","short":{"text":"The data of the bornological reflection pair: bornologies, spaces, and the four classes of maps","status":"ok"},"proof":[{"text":"Each field of the structure is filled by the corresponding bornological notion: bornologies on a set, bornological spaces, and the four classes of maps. Nothing beyond those definitions is needed.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.born_construct","base":"born_construct","kind":"prf","start":146,"body":[147,157],"status":"ok","short":{"text":"Bornological maps include identities, compose, and have bornological spaces at both ends","status":"ok"},"proof":[{"text":"The claim splits into four parts. Identities are bornological, the domain and codomain of a bornological map are bornological spaces, and bornological maps compose.","status":"ok","from":0,"to":1},{"text":"The identity of a bornological space is bornologically initial ([[AffineConstructive.topology.bornology.base.id_bornology_initial]]), so in particular it is bornological.","status":"ok","from":2,"to":3},{"text":"Being bornological includes that both ends are bornological spaces, so the second and third parts come from the hypothesis on f.","status":"ok","from":4,"to":7},{"text":"Composition is [[AffineConstructive.topology.bornology.base.compose_bornological]].","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.topology.bornology.base.born_rfl_construct","base":"born_rfl_construct","kind":"prf","start":159,"body":[160,170],"status":"ok","short":{"text":"Bornology-reflecting maps include identities, compose, and have bornological spaces at both ends","status":"ok"},"proof":[{"text":"The same four parts as for bornological maps, now for bornology-reflecting maps: identities, the two ends, and composition.","status":"ok","from":0,"to":1},{"text":"The identity of a bornological space is bornologically initial ([[AffineConstructive.topology.bornology.base.id_bornology_initial]]), so in particular it is bornology-reflecting.","status":"ok","from":2,"to":3},{"text":"A bornology-reflecting map includes in its definition that both ends are bornological spaces, so the second and third parts come from the hypothesis on f.","status":"ok","from":4,"to":7},{"text":"Composition is [[AffineConstructive.topology.bornology.base.compose_bornology_reflecting]].","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.topology.bornology.base.born_ini_spec","base":"born_ini_spec","kind":"prf","start":172,"body":[173,175],"status":"ok","short":{"text":"Bornologically initial maps are exactly those both bornological and bornology-reflecting","status":"ok"},"proof":[{"text":"Unfolded, the specification asks that a map be bornologically initial exactly when it is both bornological and bornology-reflecting. Initiality is defined as that pair of properties, so each direction takes the two facts apart and puts them back together.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.born_emb_spec","base":"born_emb_spec","kind":"prf","start":177,"body":[178,180],"status":"ok","short":{"text":"Bornological embeddings are exactly the injective bornologically initial maps","status":"ok"},"proof":[{"text":"Unfolded, the specification asks that a map be a bornological embedding exactly when it is injective and bornologically initial. An embedding is defined as these two facts, so each direction takes the pair apart and puts it back together.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.born_rfl_pair","base":"born_rfl_pair","kind":"prf","start":182,"body":[183,193],"status":"ok","short":{"text":"Bornological and bornology-reflecting maps form a reflection pair, with both cancellation laws","status":"ok"},"proof":[{"text":"Most of the components of a reflection pair are already established. Both classes contain the identities and are closed under composition, and initial maps and embeddings have their specifications ([[AffineConstructive.topology.bornology.base.born_ini_spec]], [[AffineConstructive.topology.bornology.base.born_emb_spec]]). The two cancellation laws remain.","status":"ok","from":0,"to":1},{"text":"The first law, stated in terms of bornologies: if g reflects bounded sets and g ∘ f is bornological, then f is bornological. This is [[AffineConstructive.topology.bornology.base.bornological_factor]].","status":"ok","from":2,"to":5},{"text":"The second law, the dual: if g is bornological and g ∘ f reflects bounded sets, then f reflects bounded sets. This is [[AffineConstructive.topology.bornology.base.born_refl_factor]].","status":"ok","from":6,"to":10}]},{"name":"AffineConstructive.topology.bornology.base.invert_bornological","base":"invert_bornological","kind":"prf","start":196,"body":[197,199],"status":"ok","short":{"text":"The inverse of a bornological bijection is bornology-reflecting","status":"ok"},"proof":[{"text":"Bornological spaces form a reflection pair, so the general fact applies: the inverse of a bijection in the forward class is in the reflecting class ([[AffineConstructive.topology.reflection_pair.base.invert_hom]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.invert_bornology_reflecting","base":"invert_bornology_reflecting","kind":"prf","start":201,"body":[202,204],"status":"ok","short":{"text":"The inverse of a bornology-reflecting bijection is bornological","status":"ok"},"proof":[{"text":"Bornological spaces form a reflection pair, so the general fact applies: the inverse of a bijection in the reflecting class is in the forward class ([[AffineConstructive.topology.reflection_pair.base.invert_rfl]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.invert_bornology_initial","base":"invert_bornology_initial","kind":"prf","start":206,"body":[207,209],"status":"ok","short":{"text":"The inverse of a bornologically initial bijection is a bornological embedding","status":"ok"},"proof":[{"text":"Bornological spaces form a reflection pair, so the general fact applies: the inverse of an initial bijection is an embedding ([[AffineConstructive.topology.reflection_pair.base.invert_ini]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.base.born_singleton_alt","base":"born_singleton_alt","kind":"def","start":213,"body":null,"status":"ok","short":{"text":"The singleton {x}, as a bounded subset of a bornological space","status":"ok"},"long":{"text":"In a bornological space every singleton is bounded ([[AffineConstructive.topology.interfaces.bornology.bornology_singleton]]); this definition packages the singleton {x} together with that proof as a member of the bornology.\n\nIt is the pointwise map underlying [[AffineConstructive.topology.bornology.base.born_pt]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.born_pt","base":"born_pt","kind":"def","start":215,"body":null,"status":"ok","short":{"text":"The function sending each point x of a bornological space to its bounded singleton {x}","status":"ok"},"long":{"text":"The map X ⇾ 𝒜 sending x to the bounded subset {x} ([[AffineConstructive.topology.bornology.base.born_singleton_alt]]). It is a function of sets because [[AffineConstructive.interfaces.subset.singleton]] preserves equality: equal points have equal singletons.\n\nIt embeds the points of a bornological space among its bounded subsets, so that a statement about bounded subsets can be specialised to points.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.base.bornology_regularity_alt","base":"bornology_regularity_alt","kind":"prf","start":216,"body":[217,224],"status":"ok","short":{"text":"Under regularity, each bounded K lies in a bounded K' with every x in K' or outside K","status":"ok"},"proof":[{"text":"Regularity of the bornology ([[AffineConstructive.topology.interfaces.bornology.bornology_regularity]]) gives a bounded K' that contains K and whose join with the complement of K is the whole of X.","status":"ok","from":0,"to":1},{"text":"Take K' as the witness. The inclusion K ⊆ K' is the one regularity provides. What remains is the pointwise statement.","status":"ok","from":2,"to":3},{"text":"Fix x. Every point belongs to ⊤, and ⊤ is K' ⊔ Kᗮ. Membership in this join is the additive disjunction: either x ∊ K' or x lies outside K.","status":"ok","from":4,"to":7}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.bornology":{"page":"../interfaces/bornology.html","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Interface for constructs and reflection pairs: fibres, forward and reflecting classes, cancellation laws","summary":"The file sets up the abstract interface for reflection pairs. A construct is a concrete category over affine sets: each set carries a fibre of candidate structures, some of which are objects, and the forward maps are the functions that respect the structures. The fibre over a set is ordered by comparing structures through the identity, and with equality as two-sided comparison it becomes a poset. Alongside the forward class come a reflecting class, the initial maps (forward and reflecting) and the embeddings (initial and injective). A reflection pair asks for the two classes to form constructs and to satisfy the two cancellation laws. Saturated pairs and cloven pairs refine this, pair morphisms compare two pairs over the same sets, the opposite of a pair swaps the forward and reflecting classes, and binary products are defined in a pair. The theory built on this interface is developed in the files under topology/reflection_pair."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.subgroups":{"page":"../../theory/subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

gy.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.bornology.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices theory.subgroups orders.lattices theory.sublattices orders.sublattices.\nRequire Import bornology.base.\nRequire Import easy rewrite replc simplify tactics.misc.\n\nLocal Abbreviation id := (id_fun _).\n\nImport image_notation.\n\nDefinition presented_bornology@{u} {Λ:Type@{u}} {X:set@{u}} (basis:Λ → 𝒫 X) : Bornology X\n  := presented_ideal basis.\n\nLemma presented_bornology_prop@{u} {Λ:Type@{u}} {X:set@{u}} {basis:Λ → 𝒫 X}\n  : BornologyPresentation X (𝒜:=presented_bornology basis) basis.\nProof. now unfold BornologyPresentation, presented_bornology. Qed.\n#[global] Hint Extern 2 (BornologyPresentation _ (𝒜:=presented_bornology _) _)\n  => simple notypeclasses refine presented_bornology_prop : typeclass_instances.\n\nLemma presented_bornology_elt@{u} {Λ:Type@{u}} {X:set@{u}} {basis:Λ → 𝒫 X} {i}\n  : basis i ∊ presented_bornology basis.\nProof. exact (ideal_presentation_basis_elt (H:=presented_bornology_prop)). Qed.\n#[global] Hint Extern 2 (apos (?b _ ∊ presented_bornology ?b)) => simple notypeclasses refine presented_bornology_elt : typeclass_instances.\n\nCoercion BornologyPresentationBasis `{@BornologyPresentation X 𝒜 Λ β}\n  : @BornologyBasis X 𝒜 Λ (ideal_presentation_basis 𝒜 β)\n:= ideal_presentation_basis_correct.\n\nDefinition bornology_basis@{u} `{H:@BornologyBasis@{u} X 𝒜 Λ β}\n  := @ideal_basis _ _ _ _ H.\n\nLemma bornology_basis_self `{𝒜:Bornology X} : @BornologyBasis X 𝒜 𝒜 id.\nProof. exact ideal_basis_self. Qed.\n#[global] Hint Extern 100 (BornologyBasis _) => notypeclasses refine bornology_basis_self : typeclass_instances.\n\nSection presented_bornological_space.\n  Universes u.\n  Context {Λ X:set@{u}} {Λle:Le Λ} {β:Λ ⇾ 𝒫 X} {𝒜:Bornology X}.\n  Context `{!BornologyPresentation X β, !OrderPreserving β, !UpDirected Λ}.\n  Context (cover: ∀ x:X, ∐ i, x ∊ β i).\n\n  Local Instance presented_bornology_ideal : Ideal 𝒜.\n  Proof. exact presented_ideal_ideal. Qed.\n\n  Lemma presented_bornological_space : BornologicalSpace X.\n  Proof. apply Build_BornologicalSpace. exact _.\n    intros x. rew (ideal_presentation 𝒜 β _).\n    pose proof cover x as [i Hi]. rew <-(aex_ub _ i).\n    now rew (singleton_subset _ _).\n  Qed.\nEnd presented_bornological_space.\n\nSection bornology_basis_converse.\n  Universes u.\n  Context `{H:@BornologyBasis@{u} X 𝒜 Λ β}.\n\n  Lemma bornology_basis_cover `{!BornologicalSpace X} (x:X) : ∐ i, x ∊ β i.\n  Proof. pose proof bornology_singleton x as Hsx.\n    pose proof ideal_basis β (to_subset (singleton x)) as [i Hi].\n    exists i. rew <-(singleton_subset _ _). exact Hi.\n  Qed.\n\n  Context `{!BornologicalSpace X}.\n\n  Lemma bornology_basis_inhabited : Inhabited Λ.\n  Proof. pose proof (_ : Inhabited 𝒜) as [A _].\n    pose proof ideal_basis β A as [i _]. now exists i.\n  Qed.\n\n  Lemma bornology_basis_up_directed i₁ i₂ : ∐ i₃, β i₁ ⊆ β i₃ ⊠ β i₂ ⊆ β i₃.\n  Proof. pose proof up_directed (β i₁) (β i₂) as [U [H1 H2]].\n    pose proof ideal_basis β U as [i₃ P]. exists i₃. now rew <-P.\n  Qed.\nEnd bornology_basis_converse.\n\nLemma born_by_basis@{u}\n  `{HA:@BornologyBasis@{u} X 𝒜 Λ₁ α} `{!BornologicalSpace X}\n  `{HB:@BornologyBasis@{u} Y ℬ Λ₂ β} `{!BornologicalSpace Y} (f:X ⇾ Y) :\n  (∀ i, ∐ j, f⁎ (α i) ⊆ β j) → Bornological f.\nProof. intros P. split; try exact _.\n  intros A. pose proof ideal_basis α A as [i Hi]. pose proof (P i) as [j Hj].\n  apply (down_closed ℬ (f⁎ A) (β j)).\n  + rew <-Hj. apply (order_preserving f⁎). exact Hi.\n  + exact (subset_pt_is_el _).\nQed.\n\nLemma bornology_refl_by_basis@{u}\n  `{HA:@BornologyBasis@{u} X 𝒜 Λ₁ α} `{!BornologicalSpace X}\n  `{HB:@BornologyBasis@{u} Y ℬ Λ₂ β} `{!BornologicalSpace Y} (f:X ⇾ Y) :\n  (∀ j, ∐ i, f* (β j) ⊆ α i) → BornologyReflecting f.\nProof. intros P. split; try exact _.\n  intros B. pose proof ideal_basis β B as [j Hj]. pose proof (P j) as [i Hi].\n  apply (down_closed 𝒜 (f* B) (α i)).\n  + rew <-Hi. apply (order_preserving f*). exact Hj.\n  + exact (subset_pt_is_el _).\nQed.\n\n(** Trivial bornology — all subsets bounded *)\n\nDefinition trivial_bornology@{u} (X:set@{u}) : Bornology@{u} X\n  := presented_bornology set:(λ _:unit, full_subset X).\n\nLemma trivial_bornology_correct@{u} {X:set@{u}} : TrivialBornology (trivial_bornology X).\nProof. now unfold TrivialBornology, trivial_bornology. Qed.\n#[global] Hint Extern 0 (TrivialBornology (trivial_bornology _)) => simple notypeclasses refine trivial_bornology_correct : typeclass_instances.\n#[global] Hint Extern 2 (BornologyPresentation _ (𝒜:=trivial_bornology _) _) => simple notypeclasses refine trivial_bornology_correct : typeclass_instances.\n\nSection trivial_bornology.\n  Universes u.\n  Context `{H:@TrivialBornology@{u} X 𝒜}.\n\n  Lemma trivial_bornology_bounded (A:𝒫 X) : A ∊ 𝒜.\n  Proof. rew (ideal_presentation 𝒜 _ A). exists tt. exact (below_top _). Qed.\n\n  Local Instance trivial_bornological_space : BornologicalSpace X.\n  Proof. refine (presented_bornological_space _); try exact _.\n    intros x. now exists tt.\n  Qed.\n\n  Lemma into_trivial_bornological `{@BornologicalSpace Y ℬ} (f:Y ⇾ X) : Bornological f.\n  Proof. split; try exact _. intros A. exact (trivial_bornology_bounded _). Qed.\n\n  Lemma from_trivial_bornology_reflecting `{@BornologicalSpace Y ℬ} (f:X ⇾ Y) : BornologyReflecting f.\n  Proof. split; try exact _. intros B. exact (trivial_bornology_bounded _). Qed.\nEnd trivial_bornology.\n\n#[global] Hint Extern 2 (@BornologicalSpace _ (trivial_bornology _)) => simple notypeclasses refine trivial_bornological_space : typeclass_instances.\n#[global] Hint Extern 2 (@Bornological _ _ _ (trivial_bornology _) _) => simple notypeclasses refine into_trivial_bornological : typeclass_instances.\n#[global] Hint Extern 2 (@Bornological _ _ (trivial_bornology _) _ _) => simple notypeclasses refine from_trivial_bornology_reflecting : typeclass_instances.\n\n(** The empty subset is bounded in any bornological space. *)\n\nLemma bottom_bounded `{@BornologicalSpace X 𝒜} : ⊥ ∊ 𝒜.\nProof. exact ideal_bottom. Qed.\n\n(** Initial and terminal objects *)\n\n#[global] Hint Extern 20 (Bornology 𝟎) => notypeclasses refine (trivial_bornology _) : typeclass_instances.\n#[global] Hint Extern 20 (Bornology 𝟏) => notypeclasses refine (trivial_bornology _) : typeclass_instances.\n\nLemma from_empty_bornological@{u} `{@BornologicalSpace 𝟎 𝒜} `{@BornologicalSpace@{u} Y ℬ}\n  : Bornological (from_Empty Y).\nProof. split; try exact _. intros A.\n  refine (aimpl_impl_pos (aimpl_impl_pos (down_closed ℬ _ ⊥ ) _) bottom_bounded). exact _.\n  intros y. full_tautological. \nQed.\n#[global] Hint Extern 2 (Bornological (from_Empty _)) => simple notypeclasses refine from_empty_bornological : typeclass_instances.\n\nLemma unit_subset_singleton (A : 𝒫 𝟏) : A ⊆ singleton tt.\nProof. intros y. full_tautological. Qed.\n\nSection unit.\n  Universes u.\n  Context `{@BornologicalSpace 𝟏 ℬ}.\n\n  Local Instance unit_bornology_trivial : TrivialBornology ℬ.\n  Proof. apply Build_IdealPresentation. exact _. intros A. split.\n  + rew <-(aex_ub _ tt). rew (aiff_is_true (below_top A)). now simplify.\n  + rew <-aex_adj; intros ?.\n    pose proof (aimpl_impl_pos (aimpl_impl_pos (down_closed ℬ A (singleton tt)) (unit_subset_singleton A)) (bornology_singleton tt)) as p.\n    rew (aiff_is_true p). now simplify.\n  Qed.\n\n  Lemma to_unit_bornological `{@BornologicalSpace X 𝒜} : Bornological (to_Unit X).\n  Proof. split; try exact _. intros A. exact (trivial_bornology_bounded _). Qed.\nEnd unit.\n\n#[global] Hint Extern 2 (@TrivialBornology 𝟏 _) => simple notypeclasses refine unit_bornology_trivial : typeclass_instances.\n#[global] Hint Extern 2 (@BornologyBasis 𝟏 _ _ _) => simple notypeclasses refine unit_bornology_trivial : typeclass_instances.\n#[global] Hint Extern 2 (Bornological (to_Unit _)) => simple notypeclasses refine to_unit_bornological : typeclass_instances.\n\n(** Constant maps — in particular global points [𝟏 ⇾ X] — are bornological. *)\n\nLemma const_bornological@{u} `{@BornologicalSpace@{u} X 𝒜} `{@BornologicalSpace@{u} Y ℬ} {y:Y}\n  : Bornological (const (X:=X) y).\nProof. split; try exact _. intros A.\n  refine (aimpl_impl_pos (aimpl_impl_pos (down_closed ℬ _ (singleton y)) _) (bornology_singleton y)). exact _.\n  intros z. full_tautological.\nQed.\n#[global] Hint Extern 2 (Bornological (func_op const _)) => simple notypeclasses refine const_bornological : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":5,"s":242,"e":278,"kind":"vernac","status":"ok","ms":14,"messages":[],"goals":null},{"i":6,"s":279,"e":375,"kind":"vernac","status":"ok","ms":25,"messages":[],"goals":null},{"i":7,"s":376,"e":412,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":413,"e":515,"kind":"vernac","status":"ok","ms":24,"messages":[],"goals":null},{"i":9,"s":516,"e":546,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":10,"s":547,"e":603,"kind":"v e.html"},{"s":4233,"e":4236,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4584,"e":4587,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5089,"e":5092,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5304,"e":5307,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":6839,"e":6856,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../../interfaces/aprop.html"},{"s":7074,"e":7091,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../../interfaces/aprop.html"},{"s":7299,"e":7302,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":7320,"e":7323,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":7354,"e":7357,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7358,"e":7366,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":7372,"e":7375,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":7540,"e":7543,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":7562,"e":7565,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7566,"e":7574,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":8513,"e":8530,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../../interfaces/aprop.html"}],"gloss":{"summary":"This file builds bornologies from bases and gives criteria stated in terms of bases. [[AffineConstructive.topology.bornology.basis.presented_bornology]] turns any family of subsets into the bornology it generates downward. [[AffineConstructive.topology.bornology.basis.presented_bornological_space]] shows that this bornology satisfies the axioms of a bornological space when the family is order-preserving on an up-directed index set and covers every point. Conversely, a basis of a bornological space covers the points, has an inhabited index set and is up-directed. [[AffineConstructive.topology.bornology.basis.born_by_basis]] and [[AffineConstructive.topology.bornology.basis.bornology_refl_by_basis]] check that a map is bornological, or bornology-reflecting, by checking basis sets only. The file then treats the trivial bornology, in which every subset is bounded, and shows that maps out of the empty set, maps into the one-point set and constant maps are bornological; every bornology on the one-point set is trivial.","short":"Bornologies presented by bases, basis criteria for maps, the trivial bornology","items":[{"name":"AffineConstructive.topology.bornology.basis.id","base":"id","kind":"abbrev","start":11,"body":null,"status":"ok","short":{"text":"Local abbreviation for the identity function on a set","status":"ok"},"long":{"text":"Inside this file, id stands for the identity function [[AffineConstructive.interfaces.set.id_fun]], with the set left for inference. The abbreviation is used to state that the bounded subsets index themselves as a basis ([[AffineConstructive.topology.bornology.basis.bornology_basis_self]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.basis.presented_bornology","base":"presented_bornology","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The bornology generated by a family of subsets: subsets contained in some basic set","status":"ok"},"long":{"text":"Given a family basis i of subsets of X, indexed by an arbitrary type Λ, this is the bornology whose bounded subsets are those contained in some basis i. Boundedness of A is therefore an existential over the index: there is i with A ⊆ basis i. It is the ideal presented by the family in the order (𝒫 X, ⊆) ([[AffineConstructive.orders.filters.presented_ideal]]), viewed as a bornology.\n\nThis definition only names the family of bounded subsets. That the result satisfies the bornology axioms depends on conditions on the family, and [[AffineConstructive.topology.bornology.basis.presented_bornological_space]] states them. The trivial bornology ([[AffineConstructive.topology.bornology.basis.trivial_bornology]]) is the instance whose family is the full subset alone.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.basis.presented_bornology_prop","base":"presented_bornology_prop","kind":"prf","start":14,"body":[15,17],"status":"ok","short":{"text":"The bornology presented by a family is generated downward by that family","status":"ok"},"proof":[{"text":"Once [[AffineConstructive.topology.bornology.basis.presented_bornology]] is unfolded, the presentation condition holds by definition: a subset is bounded exactly when some basic set contains it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.basis.presented_bornology_elt","base":"presented_bornology_elt","kind":"prf","start":19,"body":[20,22],"status":"ok","short":{"text":"Each basic set of a presented bornology is bounded","status":"ok"},"proof":[{"text":"Each generator of an ideal presentation belongs to the ideal it presents ([[AffineConstructive.orders.filters.ideal_presentation_basis_elt]]). The presented bornology is presented by the family ([[AffineConstructive.topology.bornology.basis.presented_bornology_prop]]), so this applies to it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.basis.BornologyPresentationBasis","base":"BornologyPresentationBasis","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"The generators of a bornology presentation form a basis of the bornology","status":"ok"},"long":{"text":"A presentation says that a subset is bounded exactly when it lies inside some generator β i. A basis is a family of bounded subsets such that every bounded subset lies inside one of them. This coercion turns a presentation into a basis: it regards the generators as members of the bornology and supplies the basis property ([[AffineConstructive.orders.filters.ideal_presentation_basis_correct]]). As a result, the lemmas stated for a [[AffineConstructive.topology.interfaces.bornology.BornologyBasis]] (the covering, directedness and map criteria in this file) also apply to any presentation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.basis.bornology_basis","base":"bornology_basis","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The basis property: every bounded subset lies inside some basic set","status":"ok"},"long":{"text":"This accessor restates the defining property of a [[AffineConstructive.topology.interfaces.bornology.BornologyBasis]] β in bornological language: for each bounded A there is an index i with A ⊆ β i. It is the general [[AffineConstructive.interfaces.orders.ideal_basis]] specialised to the ideal of bounded subsets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.basis.bornology_basis_self","base":"bornology_basis_self","kind":"prf","start":26,"body":[27,29],"status":"ok","short":{"text":"The bounded subsets, indexed by themselves, form a basis of the bornology","status":"ok"},"proof":[{"text":"A bornology is an ideal of subsets, and the identity of any ideal is a basis of it ([[AffineConstructive.orders.filters.ideal_basis_self]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.basis.presented_bornology_ideal","base":"presented_bornology_ideal","kind":"inst","start":36,"body":[37,39],"status":"ok","short":{"text":"A presentation by an order-preserving family on an up-directed index set gives an ideal","status":"ok"},"proof":[{"text":"A subset presented by an order-preserving family on an up-directed index set is an ideal ([[AffineConstructive.orders.filters.presented_ideal_ideal]]). Applied to the bornology and its presentation β, this gives the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.basis.presented_bornological_space","base":"presented_bornological_space","kind":"prf","start":40,"body":[41,49],"status":"ok","short":{"text":"An order-preserving, up-directed family covering every point presents a bornological space","status":"ok"},"proof":[{"text":"A bornological space asks for two things: that the bounded subsets form an ideal, and that every singleton is bounded. The first is [[AffineConstructive.topology.bornology.basis.presented_bornology_ideal]].","status":"ok","from":0,"to":2},{"text":"Fix x. By the presentation ([[AffineConstructive.interfaces.orders.ideal_presentation]]), {x} is bounded exactly when some basic set β i contains it, so an index with that property is wanted.","status":"ok","from":3,"to":4},{"text":"The covering hypothesis gives an index i with x ∊ β i. Take i as the witness.","status":"ok","from":5,"to":6},{"text":"{x} ⊆ β i is equivalent to x ∊ β i ([[AffineConstructive.orders.subset.singleton_subset]]), and that was given.","status":"ok","from":7,"to":8}]},{"name":"AffineConstructive.topology.bornology.basis.bornology_basis_cover","base":"bornology_basis_cover","kind":"prf","start":54,"body":[55,61],"status":"ok","short":{"text":"In a bornological space, every point lies in some set of a basis","status":"ok"},"proof":[{"text":"In a bornological space the singleton {x} is bounded.","status":"ok","from":0,"to":1},{"text":"Since it is bounded, some basic set contains it ([[AffineConstructive.interfaces.orders.ideal_basis]]): {x} ⊆ β i for some i. Take i as the witness.","status":"ok","from":2,"to":3},{"text":"x ∊ β i is equivalent to {x} ⊆ β i ([[AffineConstructive.orders.subset.singleton_subset]]), which is what the basis gave.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.bornology.basis.bornology_basis_inhabited","base":"bornology_basis_inhabited","kind":"prf","start":63,"body":[64,68],"status":"ok","short":{"text":"The index set of a basis of a bornological space is inhabited","status":"ok"},"proof":[{"text":"In a bornological space the bounded subsets form an ideal. An ideal is inhabited, which gives a bounded subset A.","status":"ok","from":0,"to":1},{"text":"The basis gives an index i with A ⊆ β i ([[AffineConstructive.interfaces.orders.ideal_basis]]). This index inhabits Λ.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.basis.bornology_basis_up_directed","base":"bornology_basis_up_directed","kind":"prf","start":69,"body":[70,75],"status":"ok","short":{"text":"Any two sets of a basis of a bornological space lie in a common basic set","status":"ok"},"proof":[{"text":"The bounded subsets form an ideal, which is up-directed. So there is a bounded U that contains both β i₁ and β i₂.","status":"ok","from":0,"to":1},{"text":"The basis gives i₃ with U ⊆ β i₃ ([[AffineConstructive.interfaces.orders.ideal_basis]]). Take i₃ as the witness.","status":"ok","from":2,"to":3},{"text":"Each factor follows by composing with the inclusion U ⊆ β i₃: β i₁ ⊆ U gives one, β i₂ ⊆ U the other. That inclusion is a fact of the base logic, so it may serve both factors.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.bornology.basis.born_by_basis","base":"born_by_basis","kind":"prf","start":77,"body":[78,91],"status":"ok","short":{"text":"A map is bornological if the image of each basic set lies in some basic set","status":"ok"},"proof":[{"text":"Assume that the image of each basic set α i lies in some β j. The other conditions for a bornological map are already met, so it remains to show that f maps each bounded subset to a bounded subset.","status":"ok","from":0,"to":2},{"text":"Fix a bounded A. The basis α gives i with A ⊆ α i ([[AffineConstructive.interfaces.orders.ideal_basis]]), and the hypothesis at i gives j with f⁎ (α i) ⊆ β j.","status":"ok","from":3,"to":5},{"text":"Bounded sets are downward closed ([[AffineConstructive.interfaces.orders.down_closed]]), so it suffices to show f⁎ A ⊆ β j and that β j is bounded.","status":"ok","from":6,"to":7},{"text":"By transitivity through f⁎ (α i) it suffices to show f⁎ A ⊆ f⁎ (α i). This follows from A ⊆ α i because the image preserves inclusion ([[AffineConstructive.orders.subset_images.image_order_preserving]]).","status":"ok","from":8,"to":10},{"text":"β j is bounded, being a set of the basis.","status":"ok","from":11,"to":13}]},{"name":"AffineConstructive.topology.bornology.basis.bornology_refl_by_basis","base":"bornology_refl_by_basis","kind":"prf","start":92,"body":[93,106],"status":"ok","short":{"text":"A map reflects bornology if the preimage of each basic set lies in some basic set","status":"ok"},"proof":[{"text":"Assume that the preimage of each basic set β j lies in some α i. The other conditions are already met, so it remains to show that the preimage of each bounded subset of Y is bounded.","status":"ok","from":0,"to":2},{"text":"Fix a bounded B. The basis β gives j with B ⊆ β j ([[AffineConstructive.interfaces.orders.ideal_basis]]), and the hypothesis at j gives i with f* (β j) ⊆ α i.","status":"ok","from":3,"to":5},{"text":"Bounded sets are downward closed ([[AffineConstructive.interfaces.orders.down_closed]]), so it suffices to show f* B ⊆ α i and that α i is bounded.","status":"ok","from":6,"to":7},{"text":"By transitivity through f* (β j) it suffices to show f* B ⊆ f* (β j). This follows from B ⊆ β j because the preimage preserves inclusion ([[AffineConstructive.orders.subset_images.preimage_order_preserving]]).","status":"ok","from":8,"to":10},{"text":"α i is bounded, being a set of the basis.","status":"ok","from":11,"to":13}]},{"name":"AffineConstructive.topology.bornology.basis.trivial_bornology","base":"trivial_bornology","kind":"def","start":107,"body":null,"status":"ok","short":{"text":"The trivial bornology on X: presented by the full subset alone, so every subset is bounded","status":"ok"},"long":{"text":"The trivial bornology on X is the bornology presented by a one-element family whose only member is the full subset of X: a subset is bounded when it is contained in some member of the family, which every subset is. It is the largest bornology on X.\n\n[[AffineConstructive.topology.bornology.basis.trivial_bornology_correct]] records that this bornology is trivial in the sense of [[AffineConstructive.topology.interfaces.bornology.TrivialBornology]], the property that the remaining lemmas about trivial bornologies assume: every subset is bounded ([[AffineConstructive.topology.bornology.basis.trivial_bornology_bounded]]), and the bornology is a bornological space ([[AffineConstructive.topology.bornology.basis.trivial_bornological_space]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.basis.trivial_bornology_correct","base":"trivial_bornology_correct","kind":"prf","start":108,"body":[109,111],"status":"ok","short":{"text":"The trivial bornology is presented by the full subset alone","status":"ok"},"proof":[{"text":"Unfolding [[AffineConstructive.topology.interfaces.bornology.TrivialBornology]] and [[AffineConstructive.topology.bornology.basis.trivial_bornology]], the claim is that the bornology presented by the family consisting of the full subset alone is generated downward by that family. This is what [[AffineConstructive.topology.bornology.basis.presented_bornology_prop]] says of any presented bornology.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.basis.trivial_bornology_bounded","base":"trivial_bornology_bounded","kind":"prf","start":117,"body":[118,122],"status":"ok","short":{"text":"In a trivial bornology every subset is bounded","status":"ok"},"proof":[{"text":"The bornology is trivial, so it is presented by the full subset. By [[AffineConstructive.interfaces.orders.ideal_presentation]], A is bounded exactly when it lies inside that subset for some index of the one-point set.","status":"ok","from":0,"to":1},{"text":"Take the single index as the witness. Every subset is contained in the full subset, which is the top of 𝒫 X.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.basis.trivial_bornological_space","base":"trivial_bornological_space","kind":"inst","start":123,"body":[124,128],"status":"ok","short":{"text":"A trivial bornology makes its set a bornological space","status":"ok"},"proof":[{"text":"Apply [[AffineConstructive.topology.bornology.basis.presented_bornological_space]] to the presentation by the full subset. Its index set, the one-point set, is up-directed by [[AffineConstructive.orders.directed_sets.unit_up_directed]], and a family indexed by the one-point set is order-preserving by [[AffineConstructive.orders.orders.from_unit_order_embed]]. What is left is to show that the family covers every point.","status":"ok","from":0,"to":1},{"text":"Fix x. With the single index as the witness, x lies in the full subset.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.basis.into_trivial_bornological","base":"into_trivial_bornological","kind":"prf","start":129,"body":[130,134],"status":"ok","short":{"text":"Every map into a set with the trivial bornology is bornological","status":"ok"},"proof":[{"text":"Both sides are bornological spaces, X because its bornology is trivial. What is left is to show that f maps every bounded subset of Y to a bounded subset of X.","status":"ok","from":0,"to":1},{"text":"Fix a bounded A. Its image under f is a subset of X, and in a trivial bornology every subset is bounded ([[AffineConstructive.topology.bornology.basis.trivial_bornology_bounded]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.basis.from_trivial_bornology_reflecting","base":"from_trivial_bornology_reflecting","kind":"prf","start":135,"body":[136,140],"status":"ok","short":{"text":"Every map out of a set with the trivial bornology reflects bornology","status":"ok"},"proof":[{"text":"Both sides are bornological spaces, X because its bornology is trivial. What is left is to show that the preimage under f of every bounded subset of Y is bounded in X.","status":"ok","from":0,"to":1},{"text":"Fix a bounded B. Its preimage is a subset of X, and in a trivial bornology every subset is bounded ([[AffineConstructive.topology.bornology.basis.trivial_bornology_bounded]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.basis.bottom_bounded","base":"bottom_bounded","kind":"prf","start":145,"body":[146,148],"status":"ok","short":{"text":"In a bornological space the empty subset is bounded","status":"ok"},"proof":[{"text":"The bornology is an ideal in 𝒫 X ordered by inclusion, and ∅ is the bottom of that lattice. By [[AffineConstructive.orders.filters.ideal_bottom]], an ideal in a bounded join semilattice contains the bottom.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.basis.from_empty_bornological","base":"from_empty_bornological","kind":"prf","start":151,"body":[152,159],"status":"ok","short":{"text":"The map out of the empty set into any bornological space is bornological","status":"ok"},"proof":[{"text":"Both sides are bornological spaces by assumption. What is left is to fix a bounded subset A of the empty set and show that its image in Y is bounded.","status":"ok","from":0,"to":2},{"text":"The empty subset of Y is bounded ([[AffineConstructive.topology.bornology.basis.bottom_bounded]]), and a bornology is downward closed ([[AffineConstructive.interfaces.orders.down_closed]]). It therefore suffices to show that the image of A is contained in ∅.","status":"ok","from":3,"to":4},{"text":"Fix y. A witness that y lies in the image would be a point of the empty set, so the inclusion holds by a tautology.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.bornology.basis.unit_subset_singleton","base":"unit_subset_singleton","kind":"prf","start":161,"body":[162,165],"status":"ok","short":{"text":"Every subset of the one-point set is contained in the singleton {tt}","status":"ok"},"proof":[{"text":"Fix y in the one-point set. Then y is tt, so membership of y in A implies membership of y in {tt}. This is a tautology.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.bornology.basis.unit_bornology_trivial","base":"unit_bornology_trivial","kind":"inst","start":169,"body":[170,184],"status":"ok","short":{"text":"Every bornological space structure on the one-point set has the trivial bornology","status":"ok"},"proof":[{"text":"Show that ℬ is presented by the full subset. The weak poset structure on 𝒫 𝟏 comes from inclusion. Fix a subset A; it remains to show that A is bounded if and only if A is contained in the full subset for some index.","status":"ok","from":0,"to":3},{"text":"Forward direction: take the single index as the witness. Containment in the full subset holds outright, since the full subset is the top of 𝒫 𝟏, so the implication holds.","status":"ok","from":4,"to":8},{"text":"Backward direction: let x be the index that the hypothesis provides.","status":"ok","from":9,"to":10},{"text":"A is bounded no matter what the hypothesis says. The singleton {tt} is bounded in a bornological space, A ⊆ {tt} by [[AffineConstructive.topology.bornology.basis.unit_subset_singleton]], and the bornology is downward closed ([[AffineConstructive.interfaces.orders.down_closed]]). So the conclusion is true, and the implication holds.","status":"ok","from":11,"to":14}]},{"name":"AffineConstructive.topology.bornology.basis.to_unit_bornological","base":"to_unit_bornological","kind":"prf","start":185,"body":[186,190],"status":"ok","short":{"text":"The map from any bornological space to the one-point set is bornological","status":"ok"},"proof":[{"text":"Both sides are bornological spaces by assumption. What is left is to show that the map to the one-point set sends bounded subsets to bounded subsets.","status":"ok","from":0,"to":1},{"text":"Fix a bounded A. Every bornology on the one-point set is trivial ([[AffineConstructive.topology.bornology.basis.unit_bornology_trivial]]), so the image of A is bounded by [[AffineConstructive.topology.bornology.basis.trivial_bornology_bounded]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.basis.const_bornological","base":"const_bornological","kind":"prf","start":195,"body":[196,203],"status":"ok","short":{"text":"A constant map between bornological spaces is bornological","status":"ok"},"proof":[{"text":"Being bornological asks that the map send bounded sets to bounded sets. The other requirements are found automatically, so it remains to show that for each bounded A ⊆ X, the image of A under the constant map is bounded in Y.","status":"ok","from":0,"to":2},{"text":"The singleton {y} is bounded, and the bounded sets are closed downward ([[AffineConstructive.interfaces.orders.down_closed]], since a bornology is an ideal). So it suffices to show that the image of A is contained in {y}.","status":"ok","from":3,"to":4},{"text":"Fix z in Y. A point in the image of A under the constant map is equal to y, so z belongs to {y}, and the inclusion follows by propositional reasoning.","status":"ok","from":5,"to":7}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.bornology":{"page":"../interfaces/bornology.html","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.subgroups":{"page":"../../theory/subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.bornology.base":{"page":"base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

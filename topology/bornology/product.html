d":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":12346,"e":12358,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":13571,"e":13574,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":13663,"e":13666,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":13667,"e":13670,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14084,"e":14087,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15097,"e":15100,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":15217,"e":15220,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15221,"e":15224,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":15394,"e":15397,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":15514,"e":15517,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15518,"e":15521,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":15648,"e":15651,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15794,"e":15797,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":17039,"e":17042,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":17435,"e":17438,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":17879,"e":17882,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file equips the tensor product X ⊗ Y and the cartesian product X × Y of two bornological spaces with their canonical product bornologies, [[AffineConstructive.topology.bornology.product.tensor_product_bornology]] and [[AffineConstructive.topology.bornology.product.cartesian_product_bornology]], each the bornology presented by the rectangles of bounded sets, and shows that bases of the factors give bases of the products. For the cartesian product it proves that the projections are bornological and that a map into X × Y is bornological as soon as its two components are ([[AffineConstructive.topology.bornology.product.cartesian_product_bornology_initial]]), so pairing and the product of maps preserve bornological, reflecting and initial maps. For the tensor product it proves the same for the tensor of maps, and that the unitors, the symmetry and the associators are bornologically initial; the tensor projections and the comparison X ⊗ Y ⇾ X × Y are then bornological, being composites of these. It builds on the presentations and basis criteria of the bornology base and basis files.","short":"Tensor and cartesian product bornologies, their bases, and the bornological structure maps","items":[{"name":"AffineConstructive.topology.bornology.product.tsr_pres","base":"tsr_pres","kind":"abbrev","start":14,"body":null,"status":"ok","short":{"text":"Local shorthand for the tensor-rectangle presentation of the bornology on X ⊗ Y","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.bornology.tensor_product_bornology_presentation]]: the family, indexed by pairs of bounded sets A ⊆ X and B ⊆ Y, of the tensor rectangles A ⊗ B in X ⊗ Y. The tensor product bornology is the bornology this family presents, and the file uses the abbreviation wherever it works with that presentation directly.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.cart_pres","base":"cart_pres","kind":"abbrev","start":15,"body":null,"status":"ok","short":{"text":"Local shorthand for the cartesian-rectangle presentation of the bornology on X × Y","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.bornology.cartesian_product_bornology_presentation]]: the family, indexed by pairs of bounded sets A ⊆ X and B ⊆ Y, of the cartesian rectangles A × B in X × Y, whose members are the pairs with a ∊ A and b ∊ B in the additive sense. The cartesian product bornology is the bornology this family presents.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.tensor_product_bornology","base":"tensor_product_bornology","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The canonical bornology on X ⊗ Y, presented by the tensor rectangles of bounded sets","status":"ok"},"long":{"text":"The bornology on the tensor product X ⊗ Y generated by the rectangles A ⊗ B with A bounded in X and B bounded in Y: a subset is bounded when it is contained in some such rectangle. It is built as the [[AffineConstructive.topology.bornology.basis.presented_bornology]] of the presentation [[AffineConstructive.topology.interfaces.bornology.tensor_product_bornology_presentation]], and membership in a rectangle is multiplicative, x ∊ A ⊠ y ∊ B, matching the multiplicative equality of X ⊗ Y.\n\nIt is the default bornology found for a tensor product of sets, at low priority, so that any other bornology satisfying [[AffineConstructive.topology.interfaces.bornology.TensorProductBornology]] may stand in its place; the theorems of this file and its users are stated for an arbitrary such bornology, and [[AffineConstructive.topology.bornology.product.tensor_product_bornology_correct]] shows this one qualifies.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.cartesian_product_bornology","base":"cartesian_product_bornology","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"The canonical bornology on X × Y, presented by the cartesian rectangles of bounded sets","status":"ok"},"long":{"text":"The bornology on the cartesian product X × Y generated by the rectangles A × B with A bounded in X and B bounded in Y: a subset is bounded when it is contained in some such rectangle. It is the [[AffineConstructive.topology.bornology.basis.presented_bornology]] of [[AffineConstructive.topology.interfaces.bornology.cartesian_product_bornology_presentation]]; membership in a rectangle is the additive conjunction of the two memberships, matching the additive equality of X × Y. This is the traditional product bornology.\n\nIt is the default bornology found for a cartesian product of sets, at low priority; theorems are stated for any bornology satisfying [[AffineConstructive.topology.interfaces.bornology.CartesianProductBornology]], and [[AffineConstructive.topology.bornology.product.cartesian_product_bornology_correct]] shows this one does.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.tensor_product_bornology_correct","base":"tensor_product_bornology_correct","kind":"prf","start":21,"body":[22,24],"status":"ok","short":{"text":"The canonical bornology on X ⊗ Y is a tensor product bornology","status":"ok"},"proof":[{"text":"The canonical bornology is by definition the bornology presented by the tensor rectangles A ⊗ B of bounded sets. Being a tensor product bornology asks for exactly this presentation, and [[AffineConstructive.topology.bornology.basis.presented_bornology_prop]] says the presented bornology has it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.cartesian_product_bornology_correct","base":"cartesian_product_bornology_correct","kind":"prf","start":25,"body":[26,28],"status":"ok","short":{"text":"The canonical bornology on X × Y is a cartesian product bornology","status":"ok"},"proof":[{"text":"The canonical bornology is by definition the bornology presented by the cartesian rectangles A × B of bounded sets. Being a cartesian product bornology asks for exactly this presentation, and [[AffineConstructive.topology.bornology.basis.presented_bornology_prop]] says the presented bornology has it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.tensor_product_bornology_presentation_monotone","base":"tensor_product_bornology_presentation_monotone","kind":"prf","start":37,"body":[38,40],"status":"ok","short":{"text":"The tensor rectangle A ⊗ B grows with A and B","status":"ok"},"proof":[{"text":"The presentation sends a pair (A, B) of bounded sets to A ⊗ B. It is the composite of two maps: the inclusion of the bounded sets among all subsets, on each factor, and then the tensor pairing of subsets. Both inclusions are monotone, the pairing is monotone in each argument ([[AffineConstructive.orders.subset_relations.tensor_subset_order_preserving]]), and so the composite is monotone.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.cartesian_product_bornology_presentation_monotone","base":"cartesian_product_bornology_presentation_monotone","kind":"prf","start":41,"body":[42,44],"status":"ok","short":{"text":"The cartesian rectangle A × B grows with A and B","status":"ok"},"proof":[{"text":"The rectangle A × B is the meet of the preimages of A and B under the two projections. The presentation is therefore a composite of three maps: the inclusion of the bounded sets among all subsets on each factor, the two preimages, and the meet. Each is monotone (the meet by [[AffineConstructive.orders.lattices.meet_order_preserving]]), and so the composite is monotone.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.tensor_product_bornology_basis","base":"tensor_product_bornology_basis","kind":"def","start":51,"body":null,"status":"ok","short":{"text":"The family of rectangles α i ⊗ β j, as bounded subsets of a tensor product bornology on X ⊗ Y","status":"ok"},"long":{"text":"Given a family α indexed by Λ₁ of bounded subsets of X and a family β indexed by Λ₂ of bounded subsets of Y, this is the family indexed by pairs (i, j) whose member is the rectangle α i ⊗ β j, taken as a bounded subset of a tensor product bornology 𝒞 on X ⊗ Y: it is the generator of the presentation of 𝒞 at the pair (α i, β j).\n\nWhen α and β are bases of their bornologies this family is a basis of 𝒞, by [[AffineConstructive.topology.bornology.product.tensor_product_bornology_basis_correct]], so a basis of the product is assembled from bases of the factors, indexed by pairs of indices. The file's local shorthand [[AffineConstructive.topology.bornology.product.tsr_basis]] names it, and resolution supplies it as the basis of X ⊗ Y in eight proofs of this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.cartesian_product_bornology_basis","base":"cartesian_product_bornology_basis","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"The family of rectangles α i × β j, as bounded subsets of a cartesian product bornology on X × Y","status":"ok"},"long":{"text":"Given a family α indexed by Λ₁ of bounded subsets of X and a family β indexed by Λ₂ of bounded subsets of Y, this is the family indexed by pairs (i, j) whose member is the cartesian rectangle α i × β j, taken as a bounded subset of a cartesian product bornology 𝒞 on X × Y: the generator of the presentation of 𝒞 at the pair (α i, β j).\n\nWhen α and β are bases, so is this family, by [[AffineConstructive.topology.bornology.product.cartesian_product_bornology_basis_correct]]. The file's local shorthand [[AffineConstructive.topology.bornology.product.cart_basis]] names it, and resolution supplies it as the basis of X × Y in five proofs of this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.tsr_basis","base":"tsr_basis","kind":"abbrev","start":54,"body":null,"status":"ok","short":{"text":"Local shorthand for the basis of rectangles α i ⊗ β j on X ⊗ Y","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.bornology.product.tensor_product_bornology_basis]], the family of tensor rectangles built from bases of the two factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.cart_basis","base":"cart_basis","kind":"abbrev","start":55,"body":null,"status":"ok","short":{"text":"Local shorthand for the basis of rectangles α i × β j on X × Y","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.bornology.product.cartesian_product_bornology_basis]], the family of cartesian rectangles built from bases of the two factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.tensor_product_bornology_basis_correct","base":"tensor_product_bornology_basis_correct","kind":"prf","start":59,"body":[60,71],"status":"ok","short":{"text":"Rectangles α i ⊗ β j of bases of the factors form a basis of the tensor product bornology","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.Build_IdealBasis]], it suffices to show that every bounded set W of the product lies in some rectangle α i ⊗ β j. Let W be bounded.","status":"ok","from":0,"to":2},{"text":"The bornology is presented by the tensor rectangles of bounded sets, and the generators of a presentation form a basis ([[AffineConstructive.orders.filters.ideal_presentation_basis_correct]]). So W ⊆ A ⊗ B for some bounded A and B.","status":"ok","from":3,"to":3},{"text":"Since α and β are bases, there are an i with A ⊆ α i and a j with B ⊆ β j.","status":"ok","from":4,"to":5},{"text":"Take (i, j) as the witness. Going through A ⊗ B by transitivity, it remains to show A ⊗ B ⊆ α i ⊗ β j. Rectangles grow with their sides ([[AffineConstructive.topology.bornology.product.tensor_product_bornology_presentation_monotone]]), so this reduces to the two inclusions A ⊆ α i and B ⊆ β j, both already in hand.","status":"ok","from":6,"to":11}]},{"name":"AffineConstructive.topology.bornology.product.cartesian_product_bornology_basis_correct","base":"cartesian_product_bornology_basis_correct","kind":"prf","start":72,"body":[73,84],"status":"ok","short":{"text":"Rectangles α i × β j of bases of the factors form a basis of the cartesian product bornology","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.filters.Build_IdealBasis]], it suffices to show that every bounded set W of the product lies in some rectangle α i × β j. Let W be bounded.","status":"ok","from":0,"to":2},{"text":"The bornology is presented by the cartesian rectangles of bounded sets, and the generators of a presentation form a basis ([[AffineConstructive.orders.filters.ideal_presentation_basis_correct]]). So W ⊆ A × B for some bounded A and B.","status":"ok","from":3,"to":3},{"text":"Since α and β are bases, there are an i with A ⊆ α i and a j with B ⊆ β j.","status":"ok","from":4,"to":5},{"text":"Take (i, j) as the witness. Going through A × B by transitivity, it remains to show A × B ⊆ α i × β j. Rectangles grow with their sides ([[AffineConstructive.topology.bornology.product.cartesian_product_bornology_presentation_monotone]]), so this reduces to the two inclusions A ⊆ α i and B ⊆ β j, both already in hand.","status":"ok","from":6,"to":11}]},{"name":"AffineConstructive.topology.bornology.product.cartesian_product_bornological_space","base":"cartesian_product_bornological_space","kind":"prf","start":88,"body":[89,95],"status":"ok","short":{"text":"The cartesian product of two bornological spaces is a bornological space","status":"ok"},"proof":[{"text":"The rectangles are monotone in their sides, and the pairs of bounded sets form an up-directed family. So by [[AffineConstructive.topology.bornology.basis.presented_bornological_space]], it remains to show that every point of X × Y lies in some rectangle.","status":"ok","from":0,"to":1},{"text":"Fix a point (x, y). Take as the witness the pair of bounded singletons {x} and {y}. Membership of (x, y) in {x} × {y} means that x ∊ {x} and y ∊ {y}, and both hold by reflexivity.","status":"ok","from":2,"to":6}]},{"name":"AffineConstructive.topology.bornology.product.prod_proj1_bornological","base":"prod_proj1_bornological","kind":"prf","start":101,"body":[102,109],"status":"ok","short":{"text":"The first projection X × Y ⇾ X is bornological","status":"ok"},"proof":[{"text":"Use [[AffineConstructive.topology.bornology.basis.born_by_basis]], with the rectangles of bounded sets as the basis of X × Y ([[AffineConstructive.topology.bornology.product.cartesian_product_bornology_basis_correct]]) and all bounded sets as the basis of X. It suffices to show that the image of each rectangle lies in some bounded set of X.","status":"ok","from":0,"to":1},{"text":"Fix bounded sets A and B, and take A as the witness.","status":"ok","from":2,"to":3},{"text":"Since image is left adjoint to preimage, it suffices to show A × B ⊆ π₁* A. Pointwise this says: for each (a, b), a ∊ A ∧ b ∊ B implies a ∊ A. This is the first projection of the additive conjunction.","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.topology.bornology.product.prod_proj2_bornological","base":"prod_proj2_bornological","kind":"prf","start":110,"body":[111,118],"status":"ok","short":{"text":"The second projection X × Y ⇾ Y is bornological","status":"ok"},"proof":[{"text":"Use [[AffineConstructive.topology.bornology.basis.born_by_basis]], with the rectangles of bounded sets as the basis of X × Y ([[AffineConstructive.topology.bornology.product.cartesian_product_bornology_basis_correct]]) and all bounded sets as the basis of Y. It suffices to show that the image of each rectangle lies in some bounded set of Y.","status":"ok","from":0,"to":1},{"text":"Fix bounded sets A and B, and take B as the witness.","status":"ok","from":2,"to":3},{"text":"Since image is left adjoint to preimage, it suffices to show A × B ⊆ π₂* B. Pointwise this says: for each (a, b), a ∊ A ∧ b ∊ B implies b ∊ B. This is the second projection of the additive conjunction.","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.topology.bornology.product.cartesian_product_bornology_initial","base":"cartesian_product_bornology_initial","kind":"prf","start":120,"body":[121,132],"status":"ok","short":{"text":"A map into X × Y is bornological when both its components are","status":"ok"},"proof":[{"text":"Write f₁ and f₂ for the two components of f, and assume both are bornological.","status":"ok","from":0,"to":3},{"text":"Use [[AffineConstructive.topology.bornology.basis.born_by_basis]], with all bounded sets as the basis of Z and the rectangles as the basis of X × Y ([[AffineConstructive.topology.bornology.product.cartesian_product_bornology_basis_correct]]). It suffices to show that for each bounded C in Z, the image f⁎ C lies in some rectangle. Let C be bounded.","status":"ok","from":4,"to":5},{"text":"Take the rectangle f₁⁎ C × f₂⁎ C. Its sides are bounded because f₁ and f₂ are bornological. It remains to show f⁎ C ⊆ f₁⁎ C × f₂⁎ C.","status":"ok","from":6,"to":7},{"text":"Images compose ([[AffineConstructive.orders.subset_images.image_compose]]), so the two sides are the images of f⁎ C under the two projections. Every subset of X × Y is contained in the rectangle formed by its two projected images ([[AffineConstructive.orders.subset_images.sub_proj_image_prod]]).","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.topology.bornology.product.to_prod_bornological","base":"to_prod_bornological","kind":"prf","start":136,"body":[137,139],"status":"ok","short":{"text":"The pairing of two bornological maps f, g into a cartesian product is bornological","status":"ok"},"proof":[{"text":"By the universal property of the cartesian product bornology, [[AffineConstructive.topology.bornology.product.cartesian_product_bornology_initial]], a map into Y₁ × Y₂ is bornological as soon as its two components are. The components of the pairing are f and g, which are bornological by hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.prod_map_bornological","base":"prod_map_bornological","kind":"prf","start":141,"body":[142,144],"status":"ok","short":{"text":"The cartesian product f × g of bornological maps is bornological","status":"ok"},"proof":[{"text":"The product map f × g is the pairing of f composed with the first projection and g composed with the second. The projections are bornological, composites of bornological maps are bornological, and a pairing of bornological maps is bornological, so f × g is bornological.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.prod_map_bornology_reflecting","base":"prod_map_bornology_reflecting","kind":"prf","start":146,"body":[147,151],"status":"ok","short":{"text":"The cartesian product f × g of bornology-reflecting maps reflects bornology","status":"ok"},"proof":[{"text":"Rectangles of bounded sets form a basis of each cartesian product bornology, so by [[AffineConstructive.topology.bornology.basis.bornology_refl_by_basis]] it suffices that the preimage under f × g of each rectangle B₁ × B₂ of bounded sets lies in some rectangle of bounded sets of X₁ × X₂.","status":"ok","from":0,"to":1},{"text":"Fix bounded B₁ ⊆ Y₁ and B₂ ⊆ Y₂. Since f and g reflect bornology, the preimages f* B₁ and g* B₂ are bounded; take their rectangle as the witness. The preimage of B₁ × B₂ under f × g is exactly this rectangle.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.product.prod_map_bornology_initial","base":"prod_map_bornology_initial","kind":"prf","start":153,"body":[154,156],"status":"ok","short":{"text":"The cartesian product f × g of bornologically initial maps is initial","status":"ok"},"proof":[{"text":"Being initial is being bornological and reflecting at once. The map f × g is bornological by [[AffineConstructive.topology.bornology.product.prod_map_bornological]] and reflects bornology by [[AffineConstructive.topology.bornology.product.prod_map_bornology_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.tensor_product_bornological_space","base":"tensor_product_bornological_space","kind":"prf","start":158,"body":[159,165],"status":"ok","short":{"text":"The tensor product of two bornological spaces is a bornological space","status":"ok"},"proof":[{"text":"The tensor product bornology is presented by the rectangles A ⊗ B of bounded sets, a family that grows with A and B and is indexed by an up-directed set. By [[AffineConstructive.topology.bornology.basis.presented_bornological_space]] it remains to show that every point of X ⊗ Y lies in some rectangle.","status":"ok","from":0,"to":1},{"text":"Fix a point (x, y). Singletons are bounded in a bornological space, so take the rectangle {x} ⊗ {y} as the witness. Membership in it is x ∊ {x} ⊠ y ∊ {y}, and each factor holds by reflexivity of equality.","status":"ok","from":2,"to":6}]},{"name":"AffineConstructive.topology.bornology.product.tensor_map_bornological","base":"tensor_map_bornological","kind":"prf","start":169,"body":[170,176],"status":"ok","short":{"text":"The tensor product f ⊗ g of bornological maps is bornological","status":"ok"},"proof":[{"text":"Tensor rectangles of bounded sets form a basis of each tensor product bornology, so by [[AffineConstructive.topology.bornology.basis.born_by_basis]] it suffices that the image under f ⊗ g of each rectangle A₁ ⊗ A₂ of bounded sets lies in some rectangle of bounded sets of Y₁ ⊗ Y₂.","status":"ok","from":0,"to":1},{"text":"Fix bounded A₁ ⊆ X₁ and A₂ ⊆ X₂. Since f and g are bornological, the images f⁎ A₁ and g⁎ A₂ are bounded; take their rectangle as the witness. It remains to show that the image of A₁ ⊗ A₂ under f ⊗ g lies in f⁎ A₁ ⊗ g⁎ A₂.","status":"ok","from":2,"to":4},{"text":"By [[AffineConstructive.orders.subset_images.image_tensor_map]] that image is exactly f⁎ A₁ ⊗ g⁎ A₂, so the inclusion holds.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.topology.bornology.product.tensor_map_bornology_reflecting","base":"tensor_map_bornology_reflecting","kind":"prf","start":179,"body":[180,184],"status":"ok","short":{"text":"The tensor product f ⊗ g of bornology-reflecting maps reflects bornology","status":"ok"},"proof":[{"text":"Tensor rectangles of bounded sets form a basis of each tensor product bornology, so by [[AffineConstructive.topology.bornology.basis.bornology_refl_by_basis]] it suffices that the preimage under f ⊗ g of each rectangle B₁ ⊗ B₂ of bounded sets lies in some rectangle of bounded sets of X₁ ⊗ X₂.","status":"ok","from":0,"to":1},{"text":"Fix bounded B₁ ⊆ Y₁ and B₂ ⊆ Y₂. Since f and g reflect bornology, the preimages f* B₁ and g* B₂ are bounded; take their rectangle as the witness. The preimage of B₁ ⊗ B₂ under f ⊗ g is exactly this rectangle.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.bornology.product.tensor_map_bornology_initial","base":"tensor_map_bornology_initial","kind":"prf","start":187,"body":[188,190],"status":"ok","short":{"text":"The tensor product f ⊗ g of bornologically initial maps is initial","status":"ok"},"proof":[{"text":"Being initial is being bornological and reflecting at once. The map f ⊗ g is bornological by [[AffineConstructive.topology.bornology.product.tensor_map_bornological]] and reflects bornology by [[AffineConstructive.topology.bornology.product.tensor_map_bornology_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.uₗ","base":"uₗ","kind":"abbrev","start":196,"body":null,"status":"ok","short":{"text":"Local shorthand for the left unitor 𝟏 ⊗ X ⇾ X","status":"ok"},"long":{"text":"A local abbreviation, inside the section on unitors, for [[AffineConstructive.theory.set.tensor_unit_l]] at X: the map 𝟏 ⊗ X ⇾ X dropping the unit component.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.uᵣ","base":"uᵣ","kind":"abbrev","start":197,"body":null,"status":"ok","short":{"text":"Local shorthand for the right unitor X ⊗ 𝟏 ⇾ X","status":"ok"},"long":{"text":"A local abbreviation, inside the section on unitors, for [[AffineConstructive.theory.set.tensor_unit_r]] at X: the map X ⊗ 𝟏 ⇾ X dropping the unit component.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.tensor_unit_l_bornology_initial","base":"tensor_unit_l_bornology_initial","kind":"prf","start":198,"body":[199,216],"status":"ok","short":{"text":"The left unitor 𝟏 ⊗ X ⇾ X is bornologically initial","status":"ok"},"proof":[{"text":"The left unitor must be shown both bornological and reflecting.","status":"ok","from":0,"to":1},{"text":"For the forward direction, the tensor rectangles form a basis of the bornology on 𝟏 ⊗ X, where the factor 𝟏 carries the trivial bornology, presented by the whole of 𝟏. By [[AffineConstructive.topology.bornology.basis.born_by_basis]] it suffices that the image of each rectangle lies in some bounded subset of X.","status":"ok","from":2,"to":3},{"text":"Since the bornology on 𝟏 is trivial, a rectangle is given by a bounded A ⊆ X alone, and it is 𝟏 ⊗ A. Take A itself as the witness. By the adjunction between image and preimage, it remains to show that 𝟏 ⊗ A lies in the preimage of A under the unitor.","status":"ok","from":4,"to":6},{"text":"Fix a point (tt, a). Membership on the left is 𝐓 ⊠ a ∊ A and on the right a ∊ A, so the implication is immediate.","status":"ok","from":7,"to":9},{"text":"For the reflecting direction, by [[AffineConstructive.topology.bornology.basis.bornology_refl_by_basis]] it suffices that the preimage under the unitor of each bounded A ⊆ X lies in some rectangle.","status":"ok","from":10,"to":11},{"text":"Fix a bounded A and take the rectangle 𝟏 ⊗ A as the witness. At a point (tt, a) the inclusion asks for a ∊ A to imply 𝐓 ⊠ a ∊ A, which is immediate.","status":"ok","from":12,"to":17}]},{"name":"AffineConstructive.topology.bornology.product.tensor_unit_r_bornology_initial","base":"tensor_unit_r_bornology_initial","kind":"prf","start":217,"body":[218,235],"status":"ok","short":{"text":"The right unitor X ⊗ 𝟏 ⇾ X is bornologically initial","status":"ok"},"proof":[{"text":"The right unitor must be shown both bornological and reflecting.","status":"ok","from":0,"to":1},{"text":"For the forward direction, the tensor rectangles form a basis of the bornology on X ⊗ 𝟏, where the factor 𝟏 carries the trivial bornology, presented by the whole of 𝟏. By [[AffineConstructive.topology.bornology.basis.born_by_basis]] it suffices that the image of each rectangle lies in some bounded subset of X.","status":"ok","from":2,"to":3},{"text":"Since the bornology on 𝟏 is trivial, a rectangle is given by a bounded A ⊆ X alone, and it is A ⊗ 𝟏. Take A itself as the witness. By the adjunction between image and preimage, it remains to show that A ⊗ 𝟏 lies in the preimage of A under the unitor.","status":"ok","from":4,"to":6},{"text":"Fix a point (a, tt). Membership on the left is a ∊ A ⊠ 𝐓 and on the right a ∊ A, so the implication is immediate.","status":"ok","from":7,"to":9},{"text":"For the reflecting direction, by [[AffineConstructive.topology.bornology.basis.bornology_refl_by_basis]] it suffices that the preimage under the unitor of each bounded A ⊆ X lies in some rectangle.","status":"ok","from":10,"to":11},{"text":"Fix a bounded A and take the rectangle A ⊗ 𝟏 as the witness. At a point (a, tt) the inclusion asks for a ∊ A to imply a ∊ A ⊠ 𝐓, which is immediate.","status":"ok","from":12,"to":17}]},{"name":"AffineConstructive.topology.bornology.product.tensor_swap_bornological","base":"tensor_swap_bornological","kind":"prf","start":243,"body":[244,252],"status":"ok","short":{"text":"The symmetry X ⊗ Y ⇾ Y ⊗ X is bornological","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.bornology.basis.born_by_basis]], with the rectangles A ⊗ B of bounded sets as a basis on either side, it suffices to send each basic rectangle into some basic rectangle. Fix bounded A ⊆ X and B ⊆ Y; the image of A ⊗ B should lie in B ⊗ A, so take (B, A) as the witness.","status":"ok","from":0,"to":3},{"text":"Image and preimage are adjoint, so the goal becomes that A ⊗ B lies in the preimage of B ⊗ A under the swap. Fix a point (x, y): membership on the left says x ∊ A ⊠ y ∊ B, on the right y ∊ B ⊠ x ∊ A, and these agree because the tensor is commutative.","status":"ok","from":4,"to":8}]},{"name":"AffineConstructive.topology.bornology.product.tensor_swap_bornology_initial","base":"tensor_swap_bornology_initial","kind":"prf","start":254,"body":[255,258],"status":"ok","short":{"text":"The symmetry X ⊗ Y ⇾ Y ⊗ X is bornologically initial","status":"ok"},"proof":[{"text":"An initial map is one that is both bornological and reflecting. The swap is bornological by [[AffineConstructive.topology.bornology.product.tensor_swap_bornological]], so it remains to show that it reflects bornology.","status":"ok","from":0,"to":1},{"text":"The swap X ⊗ Y ⇾ Y ⊗ X is the inverse of the swap back Y ⊗ X ⇾ X ⊗ Y, which is a bornological bijection. By [[AffineConstructive.topology.bornology.base.invert_bornological]], the inverse of a bornological bijection reflects bornology.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.bornology.product.αₗ","base":"αₗ","kind":"abbrev","start":268,"body":null,"status":"ok","short":{"text":"Local shorthand for the associator (X ⊗ Y) ⊗ Z ⇾ X ⊗ (Y ⊗ Z)","status":"ok"},"long":{"text":"A local abbreviation, inside the section on associators, for [[AffineConstructive.theory.set.tensor_assoc_l]] at X, Y, Z.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.αᵣ","base":"αᵣ","kind":"abbrev","start":269,"body":null,"status":"ok","short":{"text":"Local shorthand for the associator X ⊗ (Y ⊗ Z) ⇾ (X ⊗ Y) ⊗ Z","status":"ok"},"long":{"text":"A local abbreviation, inside the section on associators, for [[AffineConstructive.theory.set.tensor_assoc_r]] at X, Y, Z; it is the inverse of the other associator.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.tensor_assoc_l_bornological","base":"tensor_assoc_l_bornological","kind":"inst","start":270,"body":[271,279],"status":"ok","short":{"text":"The associator (X ⊗ Y) ⊗ Z ⇾ X ⊗ (Y ⊗ Z) is bornological","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.bornology.basis.born_by_basis]], with the rectangles of bounded sets as bases, it suffices to send each basic set (A ⊗ B) ⊗ C into some basic set. Fix bounded A, B, C and take A ⊗ (B ⊗ C) as the witness.","status":"ok","from":0,"to":3},{"text":"Image and preimage are adjoint, so the goal becomes that (A ⊗ B) ⊗ C lies in the preimage of A ⊗ (B ⊗ C) under the associator. Fix a point ((a, b), c): membership on the two sides is (a ∊ A ⊠ b ∊ B) ⊠ c ∊ C and a ∊ A ⊠ (b ∊ B ⊠ c ∊ C), which agree because the tensor is associative.","status":"ok","from":4,"to":8}]},{"name":"AffineConstructive.topology.bornology.product.tensor_assoc_r_bornological","base":"tensor_assoc_r_bornological","kind":"inst","start":280,"body":[281,289],"status":"ok","short":{"text":"The associator X ⊗ (Y ⊗ Z) ⇾ (X ⊗ Y) ⊗ Z is bornological","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.bornology.basis.born_by_basis]], with the rectangles of bounded sets as bases, it suffices to send each basic set A ⊗ (B ⊗ C) into some basic set. Fix bounded A, B, C and take (A ⊗ B) ⊗ C as the witness.","status":"ok","from":0,"to":3},{"text":"Image and preimage are adjoint, so the goal becomes that A ⊗ (B ⊗ C) lies in the preimage of (A ⊗ B) ⊗ C under the associator. Fix a point (a, (b, c)): the two memberships differ only in the bracketing of a threefold tensor, and associativity of the tensor, read right to left, turns one into the other.","status":"ok","from":4,"to":8}]},{"name":"AffineConstructive.topology.bornology.product.tensor_assoc_l_bornology_initial","base":"tensor_assoc_l_bornology_initial","kind":"prf","start":290,"body":[291,294],"status":"ok","short":{"text":"The associator (X ⊗ Y) ⊗ Z ⇾ X ⊗ (Y ⊗ Z) is bornologically initial","status":"ok"},"proof":[{"text":"An initial map is one that is both bornological and reflecting. The associator is bornological by [[AffineConstructive.topology.bornology.product.tensor_assoc_l_bornological]], so it remains to show that it reflects bornology.","status":"ok","from":0,"to":1},{"text":"This associator is the inverse of the other associator X ⊗ (Y ⊗ Z) ⇾ (X ⊗ Y) ⊗ Z, a bornological bijection by [[AffineConstructive.topology.bornology.product.tensor_assoc_r_bornological]]. By [[AffineConstructive.topology.bornology.base.invert_bornological]], that inverse reflects bornology.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.bornology.product.tensor_assoc_r_bornology_initial","base":"tensor_assoc_r_bornology_initial","kind":"prf","start":295,"body":[296,299],"status":"ok","short":{"text":"The associator X ⊗ (Y ⊗ Z) ⇾ (X ⊗ Y) ⊗ Z is bornologically initial","status":"ok"},"proof":[{"text":"An initial map is one that is both bornological and reflecting. The associator is bornological by [[AffineConstructive.topology.bornology.product.tensor_assoc_r_bornological]], so it remains to show that it reflects bornology.","status":"ok","from":0,"to":1},{"text":"This associator is the inverse of the other associator (X ⊗ Y) ⊗ Z ⇾ X ⊗ (Y ⊗ Z), a bornological bijection by [[AffineConstructive.topology.bornology.product.tensor_assoc_l_bornological]]. By [[AffineConstructive.topology.bornology.base.invert_bornological]], that inverse reflects bornology.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.bornology.product.id","base":"id","kind":"abbrev","start":307,"body":null,"status":"ok","short":{"text":"Local shorthand for the identity function, its set inferred","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.set.id_fun]], the identity function on a set, with the set left to be inferred from the context in which it appears. It is used in two proofs of this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.product.tensor_proj1_bornological","base":"tensor_proj1_bornological","kind":"prf","start":308,"body":[309,311],"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X out of the tensor product is bornological","status":"ok"},"proof":[{"text":"The first projection factors as the tensor of the identity on X with the map Y ⇾ 𝟏, followed by the right unitor X ⊗ 𝟏 ⇾ X. Here the one-point set 𝟏 carries the [[AffineConstructive.topology.bornology.basis.trivial_bornology]]. Each factor is bornological: the tensor of bornological maps is bornological, and the unitor is initial by [[AffineConstructive.topology.bornology.product.tensor_unit_r_bornology_initial]]. So the composite is bornological.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.tensor_proj2_bornological","base":"tensor_proj2_bornological","kind":"prf","start":313,"body":[314,316],"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y out of the tensor product of bornological spaces is bornological","status":"ok"},"proof":[{"text":"The second projection factors as the tensor of the map X ⇾ 𝟏 with the identity on Y, followed by the left unitor 𝟏 ⊗ Y ⇾ Y. Here the one-point set 𝟏 carries the [[AffineConstructive.topology.bornology.basis.trivial_bornology]]. Each factor is bornological: the tensor of bornological maps is bornological, and the unitor is initial by [[AffineConstructive.topology.bornology.product.tensor_unit_l_bornology_initial]]. So the composite is bornological.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.product.tensor_to_prod_bornological","base":"tensor_to_prod_bornological","kind":"prf","start":318,"body":[319,321],"status":"ok","short":{"text":"The comparison X ⊗ Y ⇾ X × Y from the tensor to the cartesian product bornology is bornological","status":"ok"},"proof":[{"text":"The comparison X ⊗ Y ⇾ X × Y is the pairing of the two tensor projections. Each projection is bornological by [[AffineConstructive.topology.bornology.product.tensor_proj1_bornological]] and [[AffineConstructive.topology.bornology.product.tensor_proj2_bornological]], and by [[AffineConstructive.topology.bornology.product.to_prod_bornological]] a pairing of bornological maps into the cartesian product is bornological.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.bornology":{"page":"../interfaces/bornology.html","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.subgroups":{"page":"../../theory/subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.bornology.base":{"page":"base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.bornology.basis":{"page":"basis.html","short":"Bornologies presented by bases, basis criteria for maps, the trivial bornology","summary":"This file builds bornologies from bases and gives criteria stated in terms of bases. [[presented_bornology]] turns any family of subsets into the bornology it generates downward. [[presented_bornological_space]] shows that this bornology satisfies the axioms of a bornological space when the family is order-preserving on an up-directed index set and covers every point. Conversely, a basis of a bornological space covers the points, has an inhabited index set and is up-directed. [[born_by_basis]] and [[bornology_refl_by_basis]] check that a map is bornological, or bornology-reflecting, by checking basis sets only. The file then treats the trivial bornology, in which every subset is bounded, and shows that maps out of the empty set, maps into the one-point set and constant maps are bornological; every bornology on the one-point set is trivial."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

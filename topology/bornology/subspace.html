neConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.bornology interfaces.reflection_pair.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices orders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.bornology.base.\nRequire Import reflection_pair.base.\nRequire Import easy rewrite replc simplify tactics.misc.\n\nImport image_notation.\n\n(** Initial (pullback) bornology: the largest bornology on [X] making [f]\n    bounded — the sets whose image is bounded.  The Joy-of-Cats initial lift.\n    \"Pullback\" refers to the base-change direction — the structure is carried\n    from codomain to domain along [f] — not to a preimage formula: Born's\n    fiber order runs opposite to Top's and Unif's, so the initial lift is\n    computed with the image [f⁎] rather than the preimage.\n    (The bornological analogue of [uniform/subspace.v]'s [pullback_uniformity].) *)\nDefinition pullback_bornology@{u} {X:set@{u}} `{ℬ:Bornology@{u} Y} (f:X ⇾ Y) : Bornology X\n  := { K : 𝒫 X | f⁎ K ∊ ℬ }.\n\nSection pullback_bornology.\n  Universes u.\n  Context {X:set@{u}} `{ℬ:Bornology@{u} Y} {f:X ⇾ Y} `{!BornologicalSpace Y}.\n  Local Abbreviation 𝒜 := (@pullback_bornology X Y ℬ f).\n  #[local] Hint Extern 0 (Bornology X) => exact 𝒜 : typeclass_instances.\n\n  Local Ltac unfold_A := change (?K ∊ 𝒜) with (f⁎ K ∊ ℬ).\n\n  Local Instance pullback_bornological_space : BornologicalSpace X.\n  Proof. apply Build_BornologicalSpace.\n  + apply Build_Ideal.\n    * apply Build_DownSet. intros K K'. unfold_A. rew (order_preserving f⁎ K K'). exact (down_closed ℬ (f⁎ K) (f⁎ K')).\n    * split; try exact _.\n      - exists ⊥. unfold_A. rew (preserves_bottom f⁎). exact sub_bot_closed.\n      - intros K K'. rew <-(aex_ub _ (K ⊔ K')). unfold_A. rew (preserves_join f⁎ K K').\n        rew (aprod_true_r (join_ub_r K K')), (aprod_true_r (join_ub_l K K')).\n        exact (sub_join_closed (f⁎ K) (f⁎ K')).\n  + intros x. unfold_A. rew (image_singleton_alt f x). exact (bornology_singleton (f x)).\n  Qed.\n\n  Local Instance pullback_born_bornological : Bornological f.\n  Proof. split; try exact _. intros A. exact (subset_pt_is_el A). Qed.\n\n  Local Instance pullback_born_initial : BornologyInitial f.\n  Proof. split; try exact _. split; try exact _. intros B. unfold_A.\n    now rew (image_preimage_counit f _).\n  Qed.\nEnd pullback_bornology.\n#[global] Hint Extern 2 (@BornologicalSpace _ (pullback_bornology _)) => simple notypeclasses refine pullback_bornological_space : typeclass_instances.\n\n\n#[global] Hint Extern 0 (Cleavage 𝐁𝐨𝐫𝐧) => exact @pullback_bornology : typeclass_instances.\n\nLemma born_cloven_pair : ClovenPair 𝐁𝐨𝐫𝐧.\nProof. unshelve esplit. intros. exact pullback_born_initial. Qed.\n#[global] Hint Extern 0 (ClovenPair 𝐁𝐨𝐫𝐧) => exact born_cloven_pair : typeclass_instances.\n#[global] Hint Extern 0 (SaturatedPair 𝐁𝐨𝐫𝐧) => exact born_cloven_pair : typeclass_instances.\n\n\nLemma bornology_initial_alt@{u} `{@BornologicalSpace@{u} X 𝒜, @BornologicalSpace@{u} Y ℬ} (f:X ⇾ Y)\n  : BornologyInitial f ↔\n    (∀ (Z:set@{u}) (𝒞:Bornology Z), BornologicalSpace Z → ∀ (g:Z ⇾ X),\n       Bornological (f ∘ g) ↔ Bornological g).\nProof. exact (ini_lift_alt (C:=𝐁𝐨𝐫𝐧) f). Qed.\n\nLemma bornology_initial_alt2@{u} `{@Bornological@{u} X Y 𝒜 ℬ f}\n  : BornologyInitial f ↔\n    (∀ (Z:set@{u}) (𝒞:Bornology Z), BornologicalSpace Z → ∀ (g:Z ⇾ X),\n       Bornological (f ∘ g) → Bornological g).\nProof. exact (ini_lift_alt2 (C:=𝐁𝐨𝐫𝐧) f). Qed.\n\n(** Subspaces A ∊ 𝒫 X are the instance f = from_subset A\n    (mirroring [uniform/subspace.v]). *)\n\n#[global] Hint Extern 2 (Bornology (subset_to_set ?A)) =>\n  notypeclasses refine (pullback_bornology (from_subset A)) : typeclass_instances.\n#[global] Hint Extern 4 (BornologicalSpace (subset_to_set ?A)) =>\n  notypeclasses refine pullback_bornological_space : typeclass_instances.\n\nLemma from_subset_born_emb `{@BornologicalSpace X 𝒜} {A:𝒫 X} : BornologyEmbedding (from_subset A).\nProof. split; [ exact pullback_born_initial | exact _ ]. Qed.\n#[global] Hint Extern 2 (BornologyEmbedding  (from_subset _)) => simple notypeclasses refine from_subset_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial    (from_subset _)) => simple notypeclasses refine from_subset_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (Bornological        (from_subset _)) => simple notypeclasses refine from_subset_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting (from_subset _)) => simple notypeclasses refine from_subset_born_emb : typeclass_instances.\n\n(** For bounded K ∊ 𝒜 the subspace bornology is trivial: down-closure makes\n    every subset of K bounded in X.  So the bounded subspaces are exactly the\n    subspaces whose subspace bornology collapses. *)\nLemma bounded_pullback_bornology_trivial `{@BornologicalSpace X 𝒜} (K:𝒜)\n  : TrivialBornology (pullback_bornology (from_subset (powerset_pt K))).\nProof. apply Build_IdealPresentation; [ exact _ | intros A ].\n  assert (A ∊ pullback_bornology (from_subset (powerset_pt K))) as p.\n  { change ((from_subset (powerset_pt K))⁎ A ∊ 𝒜).\n    apply (down_closed 𝒜 ((from_subset (powerset_pt K))⁎ A) K); [| exact _ ].\n    rew (below_top A), <-(range_image (from_subset (powerset_pt K))).\n    exact (of_course_subset_subset _). }\n  assert (∐ i:𝟏, A ⊆ (λₛ _:𝟏, full_subset (subset_to_set (powerset_pt K))) i) as q by (exists tt; exact (below_top _)).\n  rew (aiff_is_true p), (aiff_is_true q). refl.\nQed.\n#[global] Hint Extern 2 (TrivialBornology (pullback_bornology (from_subset (powerset_pt ?K)))) =>\n  simple notypeclasses refine (bounded_pullback_bornology_trivial K) : typeclass_instances.\n\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":26,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":5,"s":242,"e":305,"kind":"vernac","status":"ok","ms":19,"message me":"powerset_pt","kind":"def","local":false,"page":"../../interfaces/subset.html"},{"s":5887,"e":5921,"lib":"AffineConstructive.topology.bornology.subspace","name":"bounded_pullback_bornology_trivial","kind":"thm","local":true},{"s":1813,"e":1821,"lib":"AffineConstructive.topology.bornology.subspace","name":"unfold_A","kind":"ltac","local":true},{"s":1823,"e":1826,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1937,"e":1945,"lib":"AffineConstructive.topology.bornology.subspace","name":"unfold_A","kind":"ltac","local":true},{"s":1947,"e":1950,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2017,"e":2020,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2044,"e":2052,"lib":"AffineConstructive.topology.bornology.subspace","name":"unfold_A","kind":"ltac","local":true},{"s":2054,"e":2057,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2092,"e":2095,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2224,"e":2232,"lib":"AffineConstructive.topology.bornology.subspace","name":"unfold_A","kind":"ltac","local":true},{"s":2234,"e":2237,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2562,"e":2570,"lib":"AffineConstructive.topology.bornology.subspace","name":"unfold_A","kind":"ltac","local":true},{"s":2576,"e":2579,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2580,"e":2583,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5476,"e":5479,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5707,"e":5710,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5747,"e":5751,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file builds the initial bornology along a map f : X ⇾ Y: the subsets of X whose image under f is bounded. It proves that this is a bornology, that f is bornological and bornologically initial for it, and installs it as the cleavage of the reflection pair of bornological spaces, which makes that pair cloven and saturated ([[AffineConstructive.topology.bornology.subspace.born_cloven_pair]]). From the general theory of reflection pairs it obtains the characterisations of initial maps by cancellation against arbitrary maps g ([[AffineConstructive.topology.bornology.subspace.bornology_initial_alt]], [[AffineConstructive.topology.bornology.subspace.bornology_initial_alt2]]). Subspaces are the case of a subset's inclusion: that inclusion is a bornological embedding ([[AffineConstructive.topology.bornology.subspace.from_subset_born_emb]]), and a bounded subset carries the trivial subspace bornology ([[AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial]]). This parallels the subspace construction for uniform spaces.","short":"Initial (pullback) bornologies along a map, subspace bornologies, and bornologies as a cloven reflection pair","items":[{"name":"AffineConstructive.topology.bornology.subspace.pullback_bornology","base":"pullback_bornology","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The bornology on X pulled back along f : X ⇾ Y: the subsets whose image under f is bounded","status":"ok"},"long":{"text":"Given a bornology ℬ on Y and a map f : X ⇾ Y, the pullback bornology on X consists of the subsets K of X whose image f⁎ K is bounded in ℬ. Traditionally this is the initial bornology induced by f: the largest bornology on X for which f is bornological, that is, sends bounded sets to bounded sets. When ℬ satisfies the bornology axioms so does the pullback ([[AffineConstructive.topology.bornology.subspace.pullback_bornological_space]]), and f is then bornologically initial for it ([[AffineConstructive.topology.bornology.subspace.pullback_born_initial]]).\n\nThe image appears here, not the preimage that defines the analogous initial structures on topological and uniform spaces, because the forward condition on a bornological map is about images. The structure is still carried from the codomain back to the domain along f, which is why it is called a pullback.\n\nInside the section that proves its axioms it goes by the local name [[AffineConstructive.topology.bornology.subspace.𝒜]]. With f the inclusion of a subset it is the subspace bornology, and [[AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial]] shows that on a bounded subset K this subspace bornology is trivial: every subset of K is bounded.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.subspace.𝒜","base":"𝒜","kind":"abbrev","start":17,"body":null,"status":"ok","short":{"text":"Local name for the pullback bornology along f, inside the section on it","status":"ok"},"long":{"text":"Within the section that proves the properties of [[AffineConstructive.topology.bornology.subspace.pullback_bornology]], 𝒜 abbreviates the pullback bornology on X along the fixed map f : X ⇾ Y. A local hint lets resolution use it as the bornology on X, so that the statements of the section concern X with this bornology. The abbreviation does not survive the section.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.subspace.unfold_A","base":"unfold_A","kind":"ltac","start":19,"body":null,"status":"ok","short":{"text":"Rewrites membership K ∊ 𝒜 in the pullback bornology as boundedness of f⁎ K in Y","status":"ok"},"long":{"text":"Wherever the goal says that a subset K belongs to the pullback bornology 𝒜, this tactic restates it as f⁎ K ∊ ℬ, which holds by definition. Nothing is rewritten up to equivalence; the tactic only changes the form of the goal, so that lemmas about bounded subsets of Y and about images apply. The proofs in the section on [[AffineConstructive.topology.bornology.subspace.pullback_bornology]] use it when checking the bornology axioms and the reflecting property, at the point where membership in 𝒜 has to be read as a fact about Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.subspace.pullback_bornological_space","base":"pullback_bornological_space","kind":"inst","start":20,"body":[21,50],"status":"ok","short":{"text":"The pullback bornology along f into a bornological space satisfies the bornology axioms","status":"ok"},"proof":[{"text":"A bornological space has two requirements: its bounded subsets form an ideal of 𝒫 X, and every singleton is bounded. Here the bounded subsets of X are those whose image under f is bounded in Y.","status":"ok","from":0,"to":1},{"text":"An ideal is a down-set that is up-directed ([[AffineConstructive.orders.filters.Build_Ideal]]). Down-closure comes first: for subsets K and K' of X, K ⊆ K' should imply that boundedness of K' gives boundedness of K.","status":"ok","from":2,"to":5},{"text":"Fix K and K'. Once membership is unfolded, the claim is about the images f⁎ K and f⁎ K' in Y. Taking images preserves inclusion, so K ⊆ K' gives f⁎ K ⊆ f⁎ K'. The bounded subsets of Y are downward closed, so f⁎ K is bounded if f⁎ K' is.","status":"ok","from":6,"to":9},{"text":"Next, up-directedness. Once the parts resolution supplies are discharged, two things remain: some bounded subset exists, and any two bounded subsets lie in a common bounded subset.","status":"ok","from":10,"to":11},{"text":"For the first, take the empty subset as the witness. The image of ∅ is ∅, because taking images preserves the bottom element, and ∅ is bounded in Y ([[AffineConstructive.interfaces.subalgebra.sub_bot_closed]]).","status":"ok","from":12,"to":16},{"text":"For the second, fix K and K' and take their join K ⊔ K' as the witness. From the boundedness of K and of K', this leaves three things to show: K ⊔ K' is bounded, it contains K, and it contains K'.","status":"ok","from":17,"to":19},{"text":"Taking images preserves joins, so f⁎ (K ⊔ K') is f⁎ K ⊔ f⁎ K'. The two inclusions hold outright, since K and K' both lie below their join, so they drop out of the conclusion. Each of the two boundedness hypotheses is used once, and together they give the boundedness of f⁎ K ⊔ f⁎ K', because bounded subsets are closed under binary joins ([[AffineConstructive.interfaces.subalgebra.sub_join_closed]]).","status":"ok","from":20,"to":23},{"text":"Last, the singletons. Fix x in X. The image of {x} under f is the singleton {f x} ([[AffineConstructive.orders.subset_images.image_singleton_alt]]), and that singleton is bounded in Y by the bornology axiom for singletons.","status":"ok","from":24,"to":29}]},{"name":"AffineConstructive.topology.bornology.subspace.pullback_born_bornological","base":"pullback_born_bornological","kind":"inst","start":51,"body":[52,56],"status":"ok","short":{"text":"A map f is bornological for the pullback bornology on its domain","status":"ok"},"proof":[{"text":"The structural parts are found automatically, and what remains is that the image of each bounded A in X is bounded in Y. By the definition of the pullback bornology, that A is bounded says exactly this.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.topology.bornology.subspace.pullback_born_initial","base":"pullback_born_initial","kind":"inst","start":57,"body":[58,64],"status":"ok","short":{"text":"A map f is bornologically initial for the pullback bornology on its domain","status":"ok"},"proof":[{"text":"f is already bornological ([[AffineConstructive.topology.bornology.subspace.pullback_born_bornological]]), so it remains to show that f reflects bounded sets: the preimage of every bounded B in Y is bounded in X.","status":"ok","from":0,"to":2},{"text":"Fix B. By definition the claim is that f⁎ (f* B) is bounded. This holds because f⁎ (f* B) ⊆ B ([[AffineConstructive.orders.subset_images.image_preimage_counit]]) and bounded sets are downward closed.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.topology.bornology.subspace.born_cloven_pair","base":"born_cloven_pair","kind":"prf","start":68,"body":[69,73],"status":"ok","short":{"text":"Bornological spaces form a cloven reflection pair, with the pullback bornology as cleavage","status":"ok"},"proof":[{"text":"A cleavage assigns to each map u : S ⇾ Z into a bornological space a structure on S that makes u initial. The pullback bornology provides this structure, and with it u is initial by [[AffineConstructive.topology.bornology.subspace.pullback_born_initial]].","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.topology.bornology.subspace.bornology_initial_alt","base":"bornology_initial_alt","kind":"prf","start":76,"body":[77,79],"status":"ok","short":{"text":"f is bornologically initial iff, for every g into its domain, f ∘ g is bornological iff g is","status":"ok"},"proof":[{"text":"This is the general characterisation of initial maps in a cloven reflection pair ([[AffineConstructive.topology.reflection_pair.base.ini_lift_alt]]), applied to bornological spaces, which form such a pair by [[AffineConstructive.topology.bornology.subspace.born_cloven_pair]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.subspace.bornology_initial_alt2","base":"bornology_initial_alt2","kind":"prf","start":80,"body":[81,83],"status":"ok","short":{"text":"A bornological f is initial iff every g into its domain with f ∘ g bornological is bornological","status":"ok"},"proof":[{"text":"This is the characterisation [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt2]] for a forward map in a cloven reflection pair, applied to bornological spaces through [[AffineConstructive.topology.bornology.subspace.born_cloven_pair]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.subspace.from_subset_born_emb","base":"from_subset_born_emb","kind":"prf","start":86,"body":[87,89],"status":"ok","short":{"text":"The inclusion of a subset, with the subspace bornology, is a bornological embedding","status":"ok"},"proof":[{"text":"An embedding is an initial injective map. The inclusion is initial for the pullback bornology ([[AffineConstructive.topology.bornology.subspace.pullback_born_initial]]), and it is injective ([[AffineConstructive.interfaces.subset.from_subset_injective]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial","base":"bounded_pullback_bornology_trivial","kind":"prf","start":94,"body":[95,107],"status":"ok","short":{"text":"On a bounded subset K the subspace bornology is trivial: every subset of K is bounded","status":"ok"},"proof":[{"text":"The bornology is trivial when the whole of K generates it as an ideal. So for each subset A of K it must be shown that A is bounded if and only if A lies below the full subset of K.","status":"ok","from":0,"to":1},{"text":"First, A is bounded: its image in X lies inside K, since the image of A is contained in the range of the inclusion, and that range lies in K. K is bounded and bounded sets are downward closed.","status":"ok","from":2,"to":8},{"text":"Second, A lies below the full subset, which is the top. Both sides of the equivalence are therefore proved, so each is equivalent to truth and the equivalence holds.","status":"ok","from":9,"to":12}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.bornology":{"page":"../interfaces/bornology.html","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Interface for constructs and reflection pairs: fibres, forward and reflecting classes, cancellation laws","summary":"The file sets up the abstract interface for reflection pairs. A construct is a concrete category over affine sets: each set carries a fibre of candidate structures, some of which are objects, and the forward maps are the functions that respect the structures. The fibre over a set is ordered by comparing structures through the identity, and with equality as two-sided comparison it becomes a poset. Alongside the forward class come a reflecting class, the initial maps (forward and reflecting) and the embeddings (initial and injective). A reflection pair asks for the two classes to form constructs and to satisfy the two cancellation laws. Saturated pairs and cloven pairs refine this, pair morphisms compare two pairs over the same sets, the opposite of a pair swaps the forward and reflecting classes, and binary products are defined in a pair. The theory built on this interface is developed in the files under topology/reflection_pair."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.bornology.base":{"page":"base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

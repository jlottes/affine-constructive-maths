rders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.bornology.base.\nRequire Import reflection_pair.base.\nRequire Import easy rewrite replc simplify tactics.misc.\n\nImport image_notation.\n\n(** Initial (pullback) bornology: the largest bornology on [X] making [f]\n    bounded — the sets whose image is bounded.  The Joy-of-Cats initial lift.\n    \"Pullback\" refers to the base-change direction — the structure is carried\n    from codomain to domain along [f] — not to a preimage formula: Born's\n    fiber order runs opposite to Top's and Unif's, so the initial lift is\n    computed with the image [f⁎] rather than the preimage.\n    (The bornological analogue of [uniform/subspace.v]'s [pullback_uniformity].) *)\nDefinition pullback_bornology@{u} {X:set@{u}} `{ℬ:Bornology@{u} Y} (f:X ⇾ Y) : Bornology X\n  := { K : 𝒫 X | f⁎ K ∊ ℬ }.\n\nSection pullback_bornology.\n  Universes u.\n  Context {X:set@{u}} `{ℬ:Bornology@{u} Y} {f:X ⇾ Y} `{!BornologicalSpace Y}.\n  Local Abbreviation 𝒜 := (@pullback_bornology X Y ℬ f).\n  #[local] Hint Extern 0 (Bornology X) => exact 𝒜 : typeclass_instances.\n\n  Local Ltac unfold_A := change (?K ∊ 𝒜) with (f⁎ K ∊ ℬ).\n\n  Local Instance pullback_bornological_space : BornologicalSpace X.\n  Proof. apply Build_BornologicalSpace.\n  + apply Build_Ideal.\n    * apply Build_DownSet. intros K K'. unfold_A. rew (order_preserving f⁎ K K'). exact (down_closed ℬ (f⁎ K) (f⁎ K')).\n    * apply Build_UpDirectedSubset; try exact _.\n      - exists ⊥. unfold_A. rew (preserves_bottom f⁎). exact sub_bot_closed.\n      - intros K K'. rew <-(aex_ub _ (K ⊔ K')). unfold_A. rew (preserves_join f⁎ K K').\n        rew (aprod_true_r (join_ub_r K K')), (aprod_true_r (join_ub_l K K')).\n        exact (sub_join_closed (f⁎ K) (f⁎ K')).\n  + intros x. unfold_A. rew (image_singleton_alt f x). exact (bornology_singleton (f x)).\n  Qed.\n\n  Local Instance pullback_born_bornological : Bornological f.\n  Proof. split; try exact _. intros A. exact (subset_pt_is_el A). Qed.\n\n  Local Instance pullback_born_initial : BornologyInitial f.\n  Proof. split; try exact _. split; try exact _. intros B. unfold_A.\n    now rew (image_preimage_counit f _).\n  Qed.\nEnd pullback_bornology.\n#[global] Hint Extern 2 (@BornologicalSpace _ (pullback_bornology _)) => simple notypeclasses refine pullback_bornological_space : typeclass_instances.\n\n\n#[global] Hint Extern 0 (Cleavage 𝐁𝐨𝐫𝐧) => exact @pullback_bornology : typeclass_instances.\n\nLemma born_cloven_pair : ClovenPair 𝐁𝐨𝐫𝐧.\nProof. unshelve esplit. intros. exact pullback_born_initial. Qed.\n#[global] Hint Extern 0 (ClovenPair 𝐁𝐨𝐫𝐧) => exact born_cloven_pair : typeclass_instances.\n#[global] Hint Extern 0 (SaturatedPair 𝐁𝐨𝐫𝐧) => exact born_cloven_pair : typeclass_instances.\n\n\nLemma bornology_initial_alt@{u} `{@BornologicalSpace@{u} X 𝒜, @BornologicalSpace@{u} Y ℬ} (f:X ⇾ Y)\n  : BornologyInitial f ↔\n    (∀ (Z:set@{u}) (𝒞:Bornology Z), BornologicalSpace Z → ∀ (g:Z ⇾ X),\n       Bornological (f ∘ g) ↔ Bornological g).\nProof. exact (ini_lift_alt (C:=𝐁𝐨𝐫𝐧) f). Qed.\n\nLemma bornology_initial_alt2@{u} `{@Bornological@{u} X Y 𝒜 ℬ f}\n  : BornologyInitial f ↔\n    (∀ (Z:set@{u}) (𝒞:Bornology Z), BornologicalSpace Z → ∀ (g:Z ⇾ X),\n       Bornological (f ∘ g) → Bornological g).\nProof. exact (ini_lift_alt2 (C:=𝐁𝐨𝐫𝐧) f). Qed.\n\n(** Subspaces A ∊ 𝒫 X are the instance f = from_subset A\n    (mirroring [uniform/subspace.v]). *)\n\n#[global] Hint Extern 2 (Bornology (subset_to_set ?A)) =>\n  notypeclasses refine (pullback_bornology (from_subset A)) : typeclass_instances.\n#[global] Hint Extern 4 (BornologicalSpace (subset_to_set ?A)) =>\n  notypeclasses refine pullback_bornological_space : typeclass_instances.\n\nLemma from_subset_born_emb `{@BornologicalSpace X 𝒜} {A:𝒫 X} : BornologyEmbedding (from_subset A).\nProof. split; [ exact pullback_born_initial | exact _ ]. Qed.\n#[global] Hint Extern 2 (BornologyEmbedding  (from_subset _)) => simple notypeclasses refine from_subset_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial    (from_subset _)) => simple notypeclasses refine from_subset_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (Bornological        (from_subset _)) => simple notypeclasses refine from_subset_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting (from_subset _)) => simple notypeclasses refine from_subset_born_emb : typeclass_instances.\n\n(** For bounded K ∊ 𝒜 the subspace bornology is trivial: down-closure makes\n    every subset of K bounded in X.  So the bounded subspaces are exactly the\n    subspaces whose subspace bornology collapses. *)\nLemma bounded_pullback_bornology_trivial `{@BornologicalSpace X 𝒜} (K:𝒜)\n  : TrivialBornology (pullback_bornology (from_subset (powerset_pt K))).\nProof. apply Build_IdealPresentation; [ exact _ | intros A ].\n  assert (A ∊ pullback_bornology (from_subset (powerset_pt K))) as p.\n  { change ((from_subset (powerset_pt K))⁎ A ∊ 𝒜).\n    apply (down_closed 𝒜 ((from_subset (powerset_pt K))⁎ A) K); [| exact _ ].\n    rew (below_top A), <-(range_image (from_subset (powerset_pt K))).\n    exact (of_course_subset_subset _). }\n  assert (∐ i:𝟏, A ⊆ (λₛ _:𝟏, full_subset (subset_to_set (powerset_pt K))) i) as q by (exists tt; exact (below_top _)).\n  rew (aiff_is_true p), (aiff_is_true q). refl.\nQed.\n#[global] Hint Extern 2 (TrivialBornology (pullback_bornology (from_subset (powerset_pt ?K)))) =>\n  simple notypeclasses refine (bounded_pullback_bornology_trivial K) : typeclass_instances.\n\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":26,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":12,"messag :2593,"lib":"AffineConstructive.topology.bornology.subspace","name":"unfold_A","kind":"ltac","local":true},{"s":2599,"e":2602,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2603,"e":2606,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5499,"e":5502,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5730,"e":5733,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5770,"e":5774,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file builds the initial bornology along a map f : X ⇾ Y: the subsets of X whose image under f is bounded. It proves that this is a bornology, that f is bornological and bornologically initial for it, and installs it as the cleavage of the reflection pair of bornological spaces, which makes that pair cloven and saturated ([[AffineConstructive.topology.bornology.subspace.born_cloven_pair]]). From the general theory of reflection pairs it obtains the characterisations of initial maps by cancellation against arbitrary maps g ([[AffineConstructive.topology.bornology.subspace.bornology_initial_alt]], [[AffineConstructive.topology.bornology.subspace.bornology_initial_alt2]]). Subspaces are the case of a subset's inclusion: that inclusion is a bornological embedding ([[AffineConstructive.topology.bornology.subspace.from_subset_born_emb]]), and a bounded subset carries the trivial subspace bornology ([[AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial]]). This parallels the subspace construction for uniform spaces.","short":"Initial (pullback) bornologies along a map, subspace bornologies, and bornologies as a cloven reflection pair","items":[{"name":"AffineConstructive.topology.bornology.subspace.pullback_bornology","base":"pullback_bornology","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The bornology on X pulled back along f : X ⇾ Y: the subsets whose image under f is bounded","status":"ok"},"long":{"text":"Given a bornology ℬ on Y and a map f : X ⇾ Y, the pullback bornology on X consists of the subsets K of X whose image f⁎ K is bounded in ℬ. Traditionally this is the initial bornology induced by f: the largest bornology on X for which f is bornological, that is, sends bounded sets to bounded sets. When ℬ satisfies the bornology axioms so does the pullback ([[AffineConstructive.topology.bornology.subspace.pullback_bornological_space]]), and f is then bornologically initial for it ([[AffineConstructive.topology.bornology.subspace.pullback_born_initial]]).\n\nThe image appears here, not the preimage that defines the analogous initial structures on topological and uniform spaces, because the forward condition on a bornological map is about images. The structure is still carried from the codomain back to the domain along f, which is why it is called a pullback.\n\nInside the section that proves its axioms it goes by the local name [[AffineConstructive.topology.bornology.subspace.𝒜]]. With f the inclusion of a subset it is the subspace bornology, and [[AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial]] shows that on a bounded subset K this subspace bornology is trivial: every subset of K is bounded.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.subspace.𝒜","base":"𝒜","kind":"abbrev","start":17,"body":null,"status":"ok","short":{"text":"Local name for the pullback bornology along f, inside the section on it","status":"ok"},"long":{"text":"Within the section that proves the properties of [[AffineConstructive.topology.bornology.subspace.pullback_bornology]], 𝒜 abbreviates the pullback bornology on X along the fixed map f : X ⇾ Y. A local hint lets resolution use it as the bornology on X, so that the statements of the section concern X with this bornology. The abbreviation does not survive the section.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.subspace.unfold_A","base":"unfold_A","kind":"ltac","start":19,"body":null,"status":"ok","short":{"text":"Rewrites membership K ∊ 𝒜 in the pullback bornology as boundedness of f⁎ K in Y","status":"ok"},"long":{"text":"Wherever the goal says that a subset K belongs to the pullback bornology 𝒜, this tactic restates it as f⁎ K ∊ ℬ, which holds by definition. Nothing is rewritten up to equivalence; the tactic only changes the form of the goal, so that lemmas about bounded subsets of Y and about images apply. The proofs in the section on [[AffineConstructive.topology.bornology.subspace.pullback_bornology]] use it when checking the bornology axioms and the reflecting property, at the point where membership in 𝒜 has to be read as a fact about Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.bornology.subspace.pullback_bornological_space","base":"pullback_bornological_space","kind":"inst","start":20,"body":[21,50],"status":"ok","short":{"text":"The pullback bornology along f into a bornological space satisfies the bornology axioms","status":"ok"},"proof":[{"text":"A bornology is an ideal of subsets containing every singleton, and an ideal is a down-set that is up-directed. The first obligation is downward closure: for K ⊆ K', if K' is bounded then so is K.","status":"ok","from":0,"to":5},{"text":"Fix K and K'. By definition the claim is that boundedness of f⁎ K' gives boundedness of f⁎ K. Image preserves inclusion ([[AffineConstructive.orders.subset_images.image_order_preserving]]), so K ⊆ K' gives f⁎ K ⊆ f⁎ K', and the bounded subsets of Y are downward closed.","status":"ok","from":6,"to":9},{"text":"Up-directedness asks first for some bounded subset; take ∅ as the witness. Its image is ∅, since image preserves the bottom, and ∅ is bounded in Y.","status":"ok","from":10,"to":16},{"text":"Then two bounded subsets K and K' must have a common bounded upper bound; take K ⊔ K' as the witness. Image preserves joins, so its image is f⁎ K ⊔ f⁎ K'.","status":"ok","from":17,"to":21},{"text":"The two inclusions K ⊆ K ⊔ K' and K' ⊆ K ⊔ K' hold outright and drop from the conclusion. What is left is that the bounded subsets of Y are closed under binary joins, which uses the boundedness of f⁎ K and of f⁎ K', each once.","status":"ok","from":22,"to":23},{"text":"Last, the singletons. For x in X the image of {x} is {f x} ([[AffineConstructive.orders.subset_images.image_singleton_alt]]), which is bounded in Y.","status":"ok","from":24,"to":29}]},{"name":"AffineConstructive.topology.bornology.subspace.pullback_born_bornological","base":"pullback_born_bornological","kind":"inst","start":51,"body":[52,56],"status":"ok","short":{"text":"A map f is bornological for the pullback bornology on its domain","status":"ok"},"proof":[{"text":"The structural parts are found automatically, and what remains is that the image of each bounded A in X is bounded in Y. By the definition of the pullback bornology, that A is bounded says exactly this.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.topology.bornology.subspace.pullback_born_initial","base":"pullback_born_initial","kind":"inst","start":57,"body":[58,64],"status":"ok","short":{"text":"A map f is bornologically initial for the pullback bornology on its domain","status":"ok"},"proof":[{"text":"f is already bornological ([[AffineConstructive.topology.bornology.subspace.pullback_born_bornological]]), so it remains to show that f reflects bounded sets: the preimage of every bounded B in Y is bounded in X.","status":"ok","from":0,"to":2},{"text":"Fix B. By definition the claim is that f⁎ (f* B) is bounded. This holds because f⁎ (f* B) ⊆ B ([[AffineConstructive.orders.subset_images.image_preimage_counit]]) and bounded sets are downward closed.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.topology.bornology.subspace.born_cloven_pair","base":"born_cloven_pair","kind":"prf","start":68,"body":[69,73],"status":"ok","short":{"text":"Bornological spaces form a cloven reflection pair, with the pullback bornology as cleavage","status":"ok"},"proof":[{"text":"A cleavage assigns to each map u : S ⇾ Z into a bornological space a structure on S that makes u initial. The pullback bornology provides this structure, and with it u is initial by [[AffineConstructive.topology.bornology.subspace.pullback_born_initial]].","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.topology.bornology.subspace.bornology_initial_alt","base":"bornology_initial_alt","kind":"prf","start":76,"body":[77,79],"status":"ok","short":{"text":"f is bornologically initial iff, for every g into its domain, f ∘ g is bornological iff g is","status":"ok"},"proof":[{"text":"This is the general characterisation of initial maps in a cloven reflection pair ([[AffineConstructive.topology.reflection_pair.base.ini_lift_alt]]), applied to bornological spaces, which form such a pair by [[AffineConstructive.topology.bornology.subspace.born_cloven_pair]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.subspace.bornology_initial_alt2","base":"bornology_initial_alt2","kind":"prf","start":80,"body":[81,83],"status":"ok","short":{"text":"A bornological f is initial iff every g into its domain with f ∘ g bornological is bornological","status":"ok"},"proof":[{"text":"This is the characterisation [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt2]] for a forward map in a cloven reflection pair, applied to bornological spaces through [[AffineConstructive.topology.bornology.subspace.born_cloven_pair]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.subspace.from_subset_born_emb","base":"from_subset_born_emb","kind":"prf","start":86,"body":[87,89],"status":"ok","short":{"text":"The inclusion of a subset, with the subspace bornology, is a bornological embedding","status":"ok"},"proof":[{"text":"An embedding is an initial injective map. The inclusion is initial for the pullback bornology ([[AffineConstructive.topology.bornology.subspace.pullback_born_initial]]), and it is injective ([[AffineConstructive.interfaces.subset.from_subset_injective]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial","base":"bounded_pullback_bornology_trivial","kind":"prf","start":94,"body":[95,107],"status":"ok","short":{"text":"On a bounded subset K the subspace bornology is trivial: every subset of K is bounded","status":"ok"},"proof":[{"text":"The bornology is trivial when the whole of K generates it as an ideal. So for each subset A of K it must be shown that A is bounded if and only if A lies below the full subset of K.","status":"ok","from":0,"to":1},{"text":"First, A is bounded: its image in X lies inside K, since the image of A is contained in the range of the inclusion, and that range lies in K. K is bounded and bounded sets are downward closed.","status":"ok","from":2,"to":8},{"text":"Second, A lies below the full subset, which is the top. Both sides of the equivalence are therefore proved, so each is equivalent to truth and the equivalence holds.","status":"ok","from":9,"to":12}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.bornology":{"page":"../interfaces/bornology.html","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Reflection pairs: forward and reflecting classes of maps over sets, and their variants","summary":"This file sets up the abstract framework of reflection pairs. It begins with constructs: concrete categories over sets, given by fibres of candidate structures, a class of objects and a class of morphisms closed under identities and composition. For each set X, the structures on X form a poset whose order is comparison through the identity. On this base it defines the reflecting, initial and embedding classes, with their specifications: an initial map is forward and reflecting, and an embedding is an injective initial map. It then defines reflection pairs with their two cancellation laws, together with saturated pairs, cloven pairs (with a pullback of structures along any map), morphisms of pairs, the opposite pair that exchanges the two classes, and products for the forward class. The theory built on these interfaces is in the reflection_pair files, and the topological, uniform and bornological structures of the development are instances."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.bornology.base":{"page":"base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

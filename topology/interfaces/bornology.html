e subset_scope.\n\nClass BornologyRegularity X {𝒜:Bornology X} : SProp :=\n  bornology_regularity (K:𝒜) : ∐ (K':𝒜), K ⊆ K' ⊠ powerset_pt K' ⊔ K ᗮ = ⊤.\n\nLocal Close Scope subset_scope.\n\nRecord RegularBornologicalSpace X {𝒜:Bornology X} : SProp :=\n{ #[canonical=no, reversible=no] regular_born_space_born :> BornologicalSpace X\n; #[canonical=no, reversible=no] regular_born_space_regular :> BornologyRegularity X\n}.\nExisting Class RegularBornologicalSpace.\n\nSection product_bornology.\n  Universes u.\n  Context {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y}.\n\n  Definition tensor_product_bornology_presentation : 𝒜 ⊗ ℬ ⇾ 𝒫 (X ⊗ Y) :=\n    set:(λ '(A, B) : 𝒜 ⊗ ℬ, (subset_pt A ⊗ subset_pt B)%subset).\n  Definition cartesian_product_bornology_presentation : 𝒜 ⊗ ℬ ⇾ 𝒫 (X × Y) :=\n    set:(λ '(A, B) : 𝒜 ⊗ ℬ, (subset_pt A × subset_pt B)%subset).\n\n  Definition TensorProductBornology    (𝒞:Bornology (X ⊗ Y)) := BornologyPresentation (X ⊗ Y) tensor_product_bornology_presentation.\n  Definition CartesianProductBornology (𝒞:Bornology (X × Y)) := BornologyPresentation (X × Y) cartesian_product_bornology_presentation.\nEnd product_bornology.\nArguments tensor_product_bornology_presentation    {X Y} 𝒜 ℬ.\nArguments cartesian_product_bornology_presentation {X Y} 𝒜 ℬ.\nArguments TensorProductBornology    {X Y} 𝒜 ℬ 𝒞.\nArguments CartesianProductBornology {X Y} 𝒜 ℬ 𝒞.\nExisting Class TensorProductBornology.\nExisting Class CartesianProductBornology.\n\nRecord Bornological@{u} {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] born_X :> BornologicalSpace X\n; born_Y : BornologicalSpace Y\n; bornological (A:𝒜) : f⁎ A ∊ ℬ\n}.\nExisting Class Bornological.\nArguments bornological {_ _ _ _} f {_} A.\n\nRecord BornologyReflecting@{u} {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] born_refl_X :> BornologicalSpace X\n; born_refl_Y : BornologicalSpace Y\n; bornology_reflecting (B:ℬ) : f* B ∊ 𝒜\n}.\nExisting Class BornologyReflecting.\nArguments bornology_reflecting {_ _ _ _} f {_} B.\n\nRecord BornologyInitial@{u} {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] born_init_born :> Bornological f\n; #[canonical=no, reversible=no] born_init_refl :> BornologyReflecting f\n}.\nExisting Class BornologyInitial.\n\nRecord BornologyEmbedding@{u} {X Y:set@{u}} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] born_emb_init :> BornologyInitial f\n; #[canonical=no, reversible=no] born_emb_inj :> Injective f\n}.\nExisting Class BornologyEmbedding.\n\n\n#[global] Hint Extern 10 (BornologicalSpace ?Y) =>\n  match goal with\n  | H : Bornological (Y:=Y) _ |- _ => exact (born_Y _ H)\n  | H : BornologyInitial (Y:=Y) _ |- _ => exact (born_Y _ H)\n  | H : BornologyEmbedding (Y:=Y) _ |- _ => exact (born_Y _ H)\n  | H : BornologyReflecting (Y:=Y) _ |- _ => exact (born_refl_Y _ H)\n  end : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":27,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":85,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":86,"e":112,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":3,"s":113,"e":164,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":4,"s":166,"e":188,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":5,"s":190,"e":243,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":6,"s":245,"e":277,"kind":"vernac","status":"ok","ms":10,"messages":["4b2807a256d468c2"],"goals":null},{"i":7,"s":278,"e":303,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":8,"s":304,"e":376,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":9,"s":377,"e":431,"kind":"tactic","status":"ok","ms":10,"message .interfaces.bornology","name":"BornologyEmbedding","kind":"class","local":true},{"s":4381,"e":4400,"lib":"AffineConstructive.topology.interfaces.bornology","name":"BornologyReflecting","kind":"class","local":true},{"s":4425,"e":4436,"lib":"AffineConstructive.topology.interfaces.bornology","name":"born_refl_Y","kind":"proj","local":true},{"s":4361,"e":4367,"lib":"AffineConstructive.topology.interfaces.bornology","name":"born_Y","kind":"proj","local":true},{"s":4298,"e":4304,"lib":"AffineConstructive.topology.interfaces.bornology","name":"born_Y","kind":"proj","local":true},{"s":4237,"e":4243,"lib":"AffineConstructive.topology.interfaces.bornology","name":"born_Y","kind":"proj","local":true}],"gloss":{"summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization.","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","items":[{"name":"AffineConstructive.topology.interfaces.bornology.Bornology","base":"Bornology","kind":"def","start":6,"body":null,"status":"ok","short":{"text":"A bornology on X: a family of subsets of X, its members the bounded subsets","status":"ok"},"long":{"text":"A bornology on a set X is a family of subsets, an element of 𝒫² X, whose members are read as the bounded subsets of X. The definition carries no axioms. It only gives the family a name of its own, so that resolution can find the bornology of X the way it finds a uniformity or a neighbourhood relation, and so that a bounded subset can be written K : 𝒜. The axioms are stated separately in [[AffineConstructive.topology.interfaces.bornology.BornologicalSpace]]. This keeps the carrier family apart from the laws, as the development does for its other structures, and lets presentations such as [[AffineConstructive.topology.interfaces.bornology.BornologyPresentation]] and [[AffineConstructive.topology.interfaces.bornology.TensorProductBornology]] describe the family without restating the axioms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.BornologicalSpace","base":"BornologicalSpace","kind":"rec","start":11,"body":null,"status":"ok","short":{"text":"The bornology axioms: the bounded subsets form an ideal of subsets containing every singleton","status":"ok"},"long":{"text":"X is a bornological space when its family of bounded subsets is an [[AffineConstructive.interfaces.orders.Ideal]] of (𝒫 X, ⊆) and every singleton is bounded. Being an ideal means three things: a subset of a bounded set is bounded, there is a bounded set, and any two bounded sets lie inside a common bounded set. This is the order-theoretic dual of a filter of entourages or of neighbourhoods. The singleton axiom makes the bounded sets cover X, so every point lies in some bounded set.\n\nThe ideal is stated on the subsets of X, which in the affine reading are complemented subsets. Closure under subsets is therefore an affine implication: a set that is not bounded has no bounded superset. This structure is what the reflecting classes of maps and the well-containment spaces build on.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.bornology.bornology_ideal","base":"bornology_ideal","kind":"proj","short":{"text":"The bounded subsets of a bornological space form an ideal of subsets","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.bornology_singleton","base":"bornology_singleton","kind":"proj","short":{"text":"In a bornological space every singleton {x} is bounded","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.Build_BornologicalSpace","base":"Build_BornologicalSpace","kind":"constr","short":{"text":"Builds a bornological space from the ideal property and boundedness of singletons","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.bornology.coercion:bornology_ideal","base":"coercion:bornology_ideal","kind":"coercion","start":12,"body":null,"status":"ok","short":{"text":"A bornological space supplies its bounded subsets as an ideal of subsets, so ideal theory applies, through [[AffineConstructive.topology.interfaces.bornology.bornology_ideal]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.BornologyPresentation","base":"BornologyPresentation","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"The bornology is generated downward by a family of subsets: bounded means contained in a basic set","status":"ok"},"long":{"text":"A family of subsets basis : Λ → 𝒫 X presents the bornology 𝒜 when a subset is bounded exactly when it lies inside some basis i. This is [[AffineConstructive.interfaces.orders.IdealPresentation]] for the bornology, seen as a family of subsets ordered by inclusion. The bornology is then pinned down completely by the family, so it can be specified by a generating family. The product bornologies [[AffineConstructive.topology.interfaces.bornology.TensorProductBornology]] and [[AffineConstructive.topology.interfaces.bornology.CartesianProductBornology]] and the [[AffineConstructive.topology.interfaces.bornology.TrivialBornology]] are all defined this way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.BornologyBasis","base":"BornologyBasis","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"A family of bounded sets is a basis: every bounded set lies inside one of them","status":"ok"},"long":{"text":"A family β of members of the bornology 𝒜, indexed by Λ, is a basis of 𝒜 when it is cofinal: every bounded set is contained in some β i. It is [[AffineConstructive.interfaces.orders.IdealBasis]], read for the bornology as an ideal of subsets. [[AffineConstructive.topology.interfaces.bornology.BornologyPresentation]] says which subsets a family of arbitrary subsets generates. A basis is different: its members are bounded to begin with, and the only thing asserted is cofinality. The traditional notion is a base of a bornology.\n\nBases come from two concrete sources. The generators of any presentation of a bornology form a basis ([[AffineConstructive.topology.bornology.basis.BornologyPresentationBasis]]), and the bounded sets, indexed by themselves, form the tautological basis ([[AffineConstructive.topology.bornology.basis.bornology_basis_self]]). The basis property is restated as [[AffineConstructive.topology.bornology.basis.bornology_basis]]. A basis lets a condition on all bounded sets be checked on the basic ones only. A map is bornological as soon as the image of each basic set lies in a basic set ([[AffineConstructive.topology.bornology.basis.born_by_basis]]), and dually it reflects bornology when the preimage of each basic set lies in a basic set ([[AffineConstructive.topology.bornology.basis.bornology_refl_by_basis]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.TrivialBornology","base":"TrivialBornology","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"The bornology is trivial: presented by the full subset alone, so every subset is bounded","status":"ok"},"long":{"text":"The bornology 𝒜 on X is trivial when it is presented, in the sense of [[AffineConstructive.topology.interfaces.bornology.BornologyPresentation]], by a family with a single member, the [[AffineConstructive.interfaces.subset.full_subset]] of X, indexed by [[AffineConstructive.interfaces.prelude.unit]]. A subset is then bounded exactly when it lies inside X, so every subset is bounded.\n\nThree concrete bornologies satisfy it. The first is the trivial bornology itself, presented by the full subset alone ([[AffineConstructive.topology.bornology.basis.trivial_bornology_correct]]). The second is any bornological structure on the one-point set ([[AffineConstructive.topology.bornology.basis.unit_bornology_trivial]]). The third is the subspace bornology on a bounded subset K, where every subset of K is bounded ([[AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial]]). The localization theory assumes it to show that over a trivial bornology the local notions reduce to the global ones. Local uniform continuity becomes uniform continuity ([[AffineConstructive.topology.unif_born.localization.local_uc_trivial]]), local uniform reflection becomes uniform reflection ([[AffineConstructive.topology.unif_born.localization.local_ur_trivial]]), and the unit X ⇾ ℒ X becomes uniformly continuous ([[AffineConstructive.topology.unif_born.localization.to_localization_trivial_uc]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.BornologyRegularity","base":"BornologyRegularity","kind":"ind","start":20,"body":null,"status":"ok","short":{"text":"Regularity: every bounded K lies in a bounded K' with each point in K' or refutably outside K","status":"ok"},"long":{"text":"A bornology is regular when for every bounded K there is a bounded K' containing K such that K' ⊔ Kᗮ is the whole of X. In other words, for every point it is decided, as an affine disjunction, that the point lies in the bigger set K' or refutably outside the smaller set K. This is the cover form of \"K is well inside K'\".\n\nThe condition mirrors the regularity of a uniformity, with the variance of an ideal in place of a filter. A uniformity picks an inner witness V ⊆ U, and a bornology picks an outer witness K ⊆ K'. In both cases the decision reads \"in the bigger, or refutably outside the smaller\". The witness is bound with the affine existential, and its containment and covering clauses are joined by tensor, since both are used. This cover form is distinct from the thickening form of well-containment used in the well-containment uniform spaces.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.bornology.BornologyRegularity","base":"BornologyRegularity","kind":"rec","short":{"text":"The regularity condition on a bornology, as a one-field class","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.bornology_regularity","base":"bornology_regularity","kind":"proj","short":{"text":"For bounded K there is bounded K' ⊇ K whose union with the complement of K is everything","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.bornology.RegularBornologicalSpace","base":"RegularBornologicalSpace","kind":"rec","start":22,"body":null,"status":"ok","short":{"text":"A bornological space whose bornology is regular","status":"ok"},"long":{"text":"A regular bornological space is a [[AffineConstructive.topology.interfaces.bornology.BornologicalSpace]] that also satisfies [[AffineConstructive.topology.interfaces.bornology.BornologyRegularity]]. The two fields are coercions, so a regular space can be used wherever either of its parts is expected.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.bornology.regular_born_space_born","base":"regular_born_space_born","kind":"proj","short":{"text":"The underlying bornological space of a regular bornological space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.regular_born_space_regular","base":"regular_born_space_regular","kind":"proj","short":{"text":"The regularity of the bornology of a regular bornological space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.Build_RegularBornologicalSpace","base":"Build_RegularBornologicalSpace","kind":"constr","short":{"text":"Builds a regular bornological space from a bornological space and the regularity condition","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.bornology.tensor_product_bornology_presentation","base":"tensor_product_bornology_presentation","kind":"def","start":27,"body":null,"status":"ok","short":{"text":"The family of tensor rectangles A ⊗ B of bounded A ⊆ X and B ⊆ Y, in X ⊗ Y","status":"ok"},"long":{"text":"This is the generating family of the tensor product bornology. It is indexed by the pairs (A, B) of a bounded subset of X and a bounded subset of Y, and sends each pair to its tensor pairing A ⊗ B, a subset of X ⊗ Y. The index set is the tensor product 𝒜 ⊗ ℬ, so that the family is a function of sets on pairs compared by multiplicative equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.cartesian_product_bornology_presentation","base":"cartesian_product_bornology_presentation","kind":"def","start":28,"body":null,"status":"ok","short":{"text":"The family of cartesian rectangles A × B of bounded A ⊆ X and B ⊆ Y, in X × Y","status":"ok"},"long":{"text":"This is the generating family of the cartesian product bornology. It sends a pair (A, B) of bounded subsets to the cartesian pairing A × B, a subset of the cartesian product X × Y with its additive equality. Its index set is 𝒜 ⊗ ℬ, the same as for the tensor family [[AffineConstructive.topology.interfaces.bornology.tensor_product_bornology_presentation]]. Only the pairing of subsets and the ambient product differ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.TensorProductBornology","base":"TensorProductBornology","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"𝒞 is the tensor product bornology on X ⊗ Y, generated by the rectangles A ⊗ B","status":"ok"},"long":{"text":"A bornology 𝒞 on X ⊗ Y is the tensor product of 𝒜 and ℬ when it is presented by [[AffineConstructive.topology.interfaces.bornology.tensor_product_bornology_presentation]]. A subset of X ⊗ Y is bounded exactly when it lies inside A ⊗ B for some bounded A and B. This is the usual product bornology, stated on the product with multiplicative equality. It is a predicate on a given bornology rather than a construction, so that any bornology carried by X ⊗ Y can be recognised as the product.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.CartesianProductBornology","base":"CartesianProductBornology","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"𝒞 is the cartesian product bornology on X × Y, generated by the rectangles A × B","status":"ok"},"long":{"text":"A bornology 𝒞 on X × Y is the cartesian product of 𝒜 and ℬ when it is presented by [[AffineConstructive.topology.interfaces.bornology.cartesian_product_bornology_presentation]]. A subset is bounded exactly when it lies inside A × B for some bounded A and B. It is the counterpart of [[AffineConstructive.topology.interfaces.bornology.TensorProductBornology]] for the product with additive equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.bornology.Bornological","base":"Bornological","kind":"rec","start":38,"body":null,"status":"ok","short":{"text":"A bornological map: the image of every bounded subset is bounded","status":"ok"},"long":{"text":"A map f : X ⇾ Y between bornological spaces is bornological when it carries bounded sets to bounded sets: for every bounded A, the image f⁎ A is bounded. This is the forward class for bornologies, alongside continuous and uniformly continuous maps. The record also carries the bornological-space structure of both ends, so that the axioms of X and Y are at hand wherever a bornological map is. That of X is a coercion, and that of Y is found by a hint.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.bornology.born_X","base":"born_X","kind":"proj","short":{"text":"The domain of a bornological map is a bornological space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.born_Y","base":"born_Y","kind":"proj","short":{"text":"The codomain of a bornological map is a bornological space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.bornological","base":"bornological","kind":"proj","short":{"text":"A bornological map sends each bounded A to a bounded image f⁎ A","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.Build_Bornological","base":"Build_Bornological","kind":"constr","short":{"text":"Builds a bornological map from the two spaces and boundedness of images of bounded sets","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.bornology.BornologyReflecting","base":"BornologyReflecting","kind":"rec","start":41,"body":null,"status":"ok","short":{"text":"A bornology-reflecting map: the preimage of every bounded subset is bounded","status":"ok"},"long":{"text":"A map f : X ⇾ Y reflects bornology when the preimage f* B of every bounded B ⊆ Y is bounded in X. This is the reflecting class that pairs with [[AffineConstructive.topology.interfaces.bornology.Bornological]], making the comparison of bornologies run the other way, from Y back to X. It is the bornological form of properness: bounded sets of Y pull back to bounded sets. As with the forward class, the record carries the structure of both spaces.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.bornology.born_refl_X","base":"born_refl_X","kind":"proj","short":{"text":"The domain of a bornology-reflecting map is a bornological space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.born_refl_Y","base":"born_refl_Y","kind":"proj","short":{"text":"The codomain of a bornology-reflecting map is a bornological space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.bornology_reflecting","base":"bornology_reflecting","kind":"proj","short":{"text":"A bornology-reflecting map has a bounded preimage f* B of each bounded B","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.Build_BornologyReflecting","base":"Build_BornologyReflecting","kind":"constr","short":{"text":"Builds a bornology-reflecting map from the two spaces and boundedness of preimages","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.bornology.BornologyInitial","base":"BornologyInitial","kind":"rec","start":44,"body":null,"status":"ok","short":{"text":"A bornologically initial map: both bornological and bornology-reflecting","status":"ok"},"long":{"text":"A map is bornologically initial when it is at once [[AffineConstructive.topology.interfaces.bornology.Bornological]] and [[AffineConstructive.topology.interfaces.bornology.BornologyReflecting]]. Images of bounded sets are bounded and preimages of bounded sets are bounded. When f is also injective, the bornology of X is then the one induced from Y. This is the bornological case of the …Initial classes, the forward and reflecting halves of a reflection pair taken together.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.bornology.born_init_born","base":"born_init_born","kind":"proj","short":{"text":"A bornologically initial map is bornological","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.born_init_refl","base":"born_init_refl","kind":"proj","short":{"text":"A bornologically initial map reflects bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.Build_BornologyInitial","base":"Build_BornologyInitial","kind":"constr","short":{"text":"Builds a bornologically initial map from its bornological and reflecting halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.bornology.BornologyEmbedding","base":"BornologyEmbedding","kind":"rec","start":46,"body":null,"status":"ok","short":{"text":"A bornological embedding: an injective bornologically initial map","status":"ok"},"long":{"text":"A bornological embedding is a map that is [[AffineConstructive.topology.interfaces.bornology.BornologyInitial]] and [[AffineConstructive.interfaces.set.Injective]]. Since the equality of a set is affine, injectivity also carries its contrapositive: distinct points have apart images. Such a map identifies X with a subset of Y carrying the induced bornology. It is the bornological counterpart of the topological and uniform embeddings.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.bornology.born_emb_init","base":"born_emb_init","kind":"proj","short":{"text":"A bornological embedding is bornologically initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.born_emb_inj","base":"born_emb_inj","kind":"proj","short":{"text":"A bornological embedding is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.bornology.Build_BornologyEmbedding","base":"Build_BornologyEmbedding","kind":"constr","short":{"text":"Builds a bornological embedding from an initial map and its injectivity","status":"ok"}}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."}},"constants":null}</script>

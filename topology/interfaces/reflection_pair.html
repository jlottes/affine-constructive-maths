s compare two pairs over the same sets, the opposite of a pair swaps the forward and reflecting classes, and binary products are defined in a pair. The theory built on this interface is developed in the files under topology/reflection_pair.","short":"Interface for constructs and reflection pairs: fibres, forward and reflecting classes, cancellation laws","items":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.Cat","base":"Cat","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"The label naming a kind of structure, indexing [[AffineConstructive.topology.interfaces.reflection_pair.Fiber]], [[AffineConstructive.topology.interfaces.reflection_pair.ReflectionPairClasses]], [[AffineConstructive.topology.interfaces.reflection_pair.FiberMap]] and [[AffineConstructive.topology.interfaces.reflection_pair.fiber_op]]","status":"ok"},"long":{"text":"A label C has no content of its own. Its role is to index the data that make up a kind of structure on sets. These are the fibre assignment [[AffineConstructive.topology.interfaces.reflection_pair.Fiber]] and the bundle of classes [[AffineConstructive.topology.interfaces.reflection_pair.ReflectionPairClasses]]. Two labels together index a fibre map [[AffineConstructive.topology.interfaces.reflection_pair.FiberMap]] between kinds. Since every structure is found by resolution from its label, a distinct label is a distinct kind of structure.\n\nThe opposite [[AffineConstructive.topology.interfaces.reflection_pair.fiber_op]] is a second label for the same fibres, under which the forward and reflecting classes change places. The base theory also uses labels for composites of fibre maps ([[AffineConstructive.topology.reflection_pair.base.fmap_compose]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Fiber","base":"Fiber","kind":"ind","start":9,"body":null,"status":"ok","short":{"text":"A fibre assignment: for each set X, the type of candidate structures of kind C on X","status":"ok"},"long":{"text":"For a label C, a fibre assignment gives each affine set X a type `Fib C X` of candidate structures of kind C on X. Whether a candidate satisfies the axioms of the kind is not part of this type; that is the separate predicate [[AffineConstructive.topology.interfaces.reflection_pair.Obj]]. A structured set is a set X together with an element of its fibre, and every notion in the file is stated for functions between sets equipped in this way.\n\nForgetting the structure is a functor to sets, and `Fib C X` is its fibre over X. Carrier and structure are kept apart so that one function X ⇾ Y can be judged against different structures on its two ends. The rest of the interface is built over a fibre assignment: the objects ([[AffineConstructive.topology.interfaces.reflection_pair.ObjClass]]), the classes of maps ([[AffineConstructive.topology.interfaces.reflection_pair.HomClass]]), the cleavage that pulls a structure back along a function ([[AffineConstructive.topology.interfaces.reflection_pair.Cleavage]]), and the maps between fibres of two kinds ([[AffineConstructive.topology.interfaces.reflection_pair.FiberMap]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.Fiber","base":"Fiber","kind":"rec","short":{"text":"The class of fibre assignments for a label C","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Fib","base":"Fib","kind":"proj","short":{"text":"The fibre over a set X: the type of candidate C-structures on X","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ObjClass","base":"ObjClass","kind":"ind","start":12,"body":null,"status":"ok","short":{"text":"The class of objects of C: which candidate structures on a set are genuine C-structures","status":"ok"},"long":{"text":"An object class for C says, for a set X and a candidate structure in the fibre over X, whether that candidate is a genuine C-structure. The answer is a strict proposition, so being an object is a property and never data. Keeping it apart from the fibre lets maps and comparisons be stated between arbitrary candidates. The object property is supplied only where a proof needs it.\n\nEvery map in one of the classes has objects at both ends. For the forward class this is an axiom of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]]. For the reflecting class it is restated as [[AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_hom_X]] and [[AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_hom_Y]], and resolution uses these to find an object from a map in context. The fibre [[AffineConstructive.topology.interfaces.reflection_pair.fib]] builds on it: an element of the fibre is a candidate together with its object certificate.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.ObjClass","base":"ObjClass","kind":"rec","short":{"text":"The class of objects of C: which candidate structures on a set are genuine C-structures","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Obj","base":"Obj","kind":"proj","short":{"text":"X with the structure FX is an object of C","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.HomClass","base":"HomClass","kind":"ind","start":15,"body":null,"status":"ok","short":{"text":"The class of a class of maps between structured sets of kind C","status":"ok"},"long":{"text":"A hom class picks out, for structured sets X and Y, the functions X ⇾ Y that belong to the class. The predicate is a function of sets on !(X ⇾ Y), so it respects equality of functions, and membership in the class can be rewritten along an equation between maps. Its membership predicate is [[AffineConstructive.topology.interfaces.reflection_pair.Hom]].\n\nThe same data serve for every class of maps in a reflection pair. The aliases [[AffineConstructive.topology.interfaces.reflection_pair.RflClass]], [[AffineConstructive.topology.interfaces.reflection_pair.IniClass]] and [[AffineConstructive.topology.interfaces.reflection_pair.EmbClass]] reuse this type, and resolution handles each alias separately, so a kind of structure can carry four classes side by side. The axioms of a category for the class are [[AffineConstructive.topology.interfaces.reflection_pair.Construct]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.HomClass","base":"HomClass","kind":"rec","short":{"text":"The class of hom classes for a label C","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Hom_fun","base":"Hom_fun","kind":"proj","short":{"text":"The membership predicate of a hom class, as a function of sets on functions X ⇾ Y","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Hom","base":"Hom","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"f : X ⇾ Y is a morphism of C for the given structures on X and Y","status":"ok"},"long":{"text":"`Hom C f` says that the function f belongs to the hom class of C, relative to the chosen structures on X and Y. It is the predicate [[AffineConstructive.topology.interfaces.reflection_pair.Hom_fun]] evaluated at f. Since that predicate is a function on the set of maps, membership respects equality of functions, so it can be rewritten along an equality f = g.\n\nIn a reflection pair, `Hom` names the forward class Kf. The same predicate, read through [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]], [[AffineConstructive.topology.interfaces.reflection_pair.Ini]] and [[AffineConstructive.topology.interfaces.reflection_pair.Emb]], gives the reflecting, initial and embedding classes. For example, an initial map is forward ([[AffineConstructive.topology.interfaces.reflection_pair.initial_hom]]). The comparison of structures [[AffineConstructive.topology.interfaces.reflection_pair.fib_sle]] builds on it: Φ is below Ψ when the identity of X is forward from Φ to Ψ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Construct","base":"Construct","kind":"rec","start":21,"body":null,"status":"ok","short":{"text":"A construct: a concrete category over sets, given by a class of objects and a class of morphisms","status":"ok"},"long":{"text":"A construct, in the terminology of Adámek, Herrlich and Strecker, is a concrete category over sets: a category with a faithful functor to sets. Here it is presented by its fibres instead of as an abstract category. An object is a set X carrying a structure from the fibre over X that satisfies the object predicate. A morphism is a function X ⇾ Y of the underlying sets that satisfies the hom predicate. Because a morphism is a function of sets, faithfulness holds by construction. There are four axioms: the identity on an object is a morphism, morphisms compose, and both the domain and the codomain of a morphism are objects. The last two axioms let a morphism hypothesis supply the object facts about its ends.\n\nThe axioms are base-logic statements in `SProp`, not affine ones, because being a morphism is a property of a function, not a proposition with a refutation. The same structure serves for every class of maps in a reflection pair. Applied to the hom class it is the forward construct. Applied to the reflecting class it is [[AffineConstructive.topology.interfaces.reflection_pair.RflConstruct]]. Applied to the initial and embedding classes it is [[AffineConstructive.topology.interfaces.reflection_pair.IniConstruct]] and [[AffineConstructive.topology.interfaces.reflection_pair.EmbConstruct]]. A [[AffineConstructive.topology.interfaces.reflection_pair.ReflectionPair]] asks for the forward and reflecting constructs together, along with cancellation laws relating them. On a single carrier, the identity function orders the structures of the fibre, which gives the poset [[AffineConstructive.topology.interfaces.reflection_pair.fib_set]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.construct_id","base":"construct_id","kind":"proj","short":{"text":"The identity on an object is a morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.construct_hom_X","base":"construct_hom_X","kind":"proj","short":{"text":"The domain of a morphism is an object","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.construct_hom_Y","base":"construct_hom_Y","kind":"proj","short":{"text":"The codomain of a morphism is an object","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.construct_compose","base":"construct_compose","kind":"proj","short":{"text":"The composite g ∘ f of two morphisms is a morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Build_Construct","base":"Build_Construct","kind":"constr","short":{"text":"Builds a construct from identities, composition, and the two object conditions on the ends of morphisms","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib","base":"fib","kind":"rec","start":24,"body":null,"status":"ok","short":{"text":"The fibre over X: C-structures on X certified to be objects","status":"ok"},"long":{"text":"An element of `fib C X` is a candidate structure on the fixed carrier X, together with a proof that it is an object. In other words it is a genuine C-structure on X. Both projections are coercions, so an element can be used wherever a structure on X or its object certificate is expected. Elements are produced by packaging a certified structure ([[AffineConstructive.topology.reflection_pair.base.to_fib]]).\n\nThe fibre is preordered by comparison through the identity map ([[AffineConstructive.topology.interfaces.reflection_pair.fib_sle]]): Φ is below Ψ when the identity of X is forward from Φ to Ψ. With mutual comparison as equality it becomes the poset [[AffineConstructive.topology.interfaces.reflection_pair.fib_set]], whose order is affirmative. Pullback along a function is the main operation studied on this poset ([[AffineConstructive.topology.reflection_pair.base.pull_fib]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_Fib","base":"fib_Fib","kind":"proj","short":{"text":"The underlying candidate structure of an element of the fibre","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_Obj","base":"fib_Obj","kind":"proj","short":{"text":"The certificate that an element of the fibre is an object","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Build_fib","base":"Build_fib","kind":"constr","short":{"text":"Builds an element of the fibre over X from a structure and a proof that it is an object","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_sle","base":"fib_sle","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"The comparison of two structures on X: the identity of X is a forward map from one to the other","status":"ok"},"long":{"text":"Two structures Φ and Ψ on the same set X are compared through the identity: Φ ≤ Ψ when the identity function, read from X with Φ to X with Ψ, is a forward map. This is the usual order on a fibre of a concrete category, with the finer structure below. It is a relation of the base logic. Reflexivity is the identity law of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] ([[AffineConstructive.topology.interfaces.reflection_pair.fib_sle_refl]]), and transitivity is its composition law applied to two identities ([[AffineConstructive.topology.interfaces.reflection_pair.fib_sle_trans]]).\n\nThe comparison is what monotonicity statements about fibres are stated with: that pulling a structure back along a function is monotone ([[AffineConstructive.topology.reflection_pair.base.pull_fib_mono]]) and that a fibre map is monotone ([[AffineConstructive.topology.reflection_pair.base.fib_map_mono]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_sle_refl","base":"fib_sle_refl","kind":"inst","start":32,"body":[33,36],"status":"ok","short":{"text":"The comparison of structures on a fibre is reflexive, by the identity law","status":"ok"},"proof":[{"text":"Fix a structure Φ on X. The goal asks for Φ ≤ Φ, which means the identity map of X is forward from Φ to Φ.","status":"ok","from":0,"to":1},{"text":"Once the comparison is unfolded, this is the identity law of the class of forward maps, an instance of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_sle_trans","base":"fib_sle_trans","kind":"inst","start":37,"body":[38,41],"status":"ok","short":{"text":"The comparison of structures on a fibre is transitive, by composing identities","status":"ok"},"proof":[{"text":"Fix structures Φ, Ψ, Ξ on X and assume Φ ≤ Ψ and Ψ ≤ Ξ. That is, the identity is forward from Φ to Ψ and from Ψ to Ξ.","status":"ok","from":0,"to":1},{"text":"The forward maps are closed under composition ([[AffineConstructive.topology.interfaces.reflection_pair.construct_compose]]). The composite of the two identities is the identity itself, so it is forward from Φ to Ξ.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_preorder","base":"fib_preorder","kind":"inst","start":43,"body":[44,46],"status":"ok","short":{"text":"The fibre over X, ordered by comparison through the identity, is a preorder","status":"ok"},"proof":[{"text":"The order on the fibre applies of course to the comparison [[AffineConstructive.topology.interfaces.reflection_pair.fib_sle]]. A preorder needs reflexivity and transitivity, and each follows from the matching property of the comparison: [[AffineConstructive.topology.interfaces.reflection_pair.fib_sle_refl]] and [[AffineConstructive.topology.interfaces.reflection_pair.fib_sle_trans]], carried through of course.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_eq","base":"fib_eq","kind":"inst","start":47,"body":null,"status":"ok","short":{"text":"Equality on the fibre: two structures are equal when each is below the other","status":"ok"},"long":{"text":"Structures on X are identified when they are comparable both ways, that is, when the identity is a forward map in both directions. Equality is the additive conjunction of the two comparisons, the usual equality of the poset induced by a preorder. This is what makes the fibre a set, [[AffineConstructive.topology.interfaces.reflection_pair.fib_set]], rather than a bare type, and it ignores how a structure happens to be presented.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_eq_correct","base":"fib_eq_correct","kind":"prf","start":48,"body":[49,51],"status":"ok","short":{"text":"Two structures in a fibre are equal if and only if each is below the other","status":"ok"},"proof":[{"text":"Fix Φ and Ψ. Equality on the fibre is defined as Φ ≤ Ψ ∧ Ψ ≤ Φ ([[AffineConstructive.topology.interfaces.reflection_pair.fib_eq]]), so the biconditional holds by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_set","base":"fib_set","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"The fibre over X as a set: structures are equal when each is below the other","status":"ok"},"long":{"text":"The fibre `fib C X` made into an affine set by the induced-poset construction. Two structures are equal when each is below the other ([[AffineConstructive.topology.interfaces.reflection_pair.fib_eq]], [[AffineConstructive.topology.interfaces.reflection_pair.fib_eq_correct]]). Antisymmetry is therefore built into the equality, and the order is [[AffineConstructive.topology.interfaces.reflection_pair.fib_sle]]. The poset structure is [[AffineConstructive.topology.interfaces.reflection_pair.fib_poset]], and the order is affirmative ([[AffineConstructive.topology.interfaces.reflection_pair.fib_aff_order]]).\n\nThe base theory uses this set as the domain and codomain of functions between fibres. A pair morphism induces the function [[AffineConstructive.topology.reflection_pair.base.fib_map]] from the fibre of C over X to the fibre of D over X, and [[AffineConstructive.topology.reflection_pair.base.fib_map_is_fun]] shows that it preserves equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_poset","base":"fib_poset","kind":"inst","start":54,"body":null,"status":"ok","short":{"text":"The fibre over X is a poset under comparison through the identity","status":"ok"},"long":{"text":"The partial order on [[AffineConstructive.topology.interfaces.reflection_pair.fib_set]] that the induced-poset construction provides. The order is the comparison [[AffineConstructive.topology.interfaces.reflection_pair.fib_sle]], and equality is mutual comparison, so antisymmetry holds by definition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fib_aff_order","base":"fib_aff_order","kind":"prf","start":55,"body":[56,60],"status":"ok","short":{"text":"The order on a fibre is affirmative","status":"ok"},"proof":[{"text":"An affirmative order is a poset whose order is affirmative. The poset part is [[AffineConstructive.topology.interfaces.reflection_pair.fib_poset]], so it remains to show that the order is affirmative.","status":"ok","from":0,"to":1},{"text":"The order is of course applied to a base-logic relation, and every relation of that form is affirmative.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.canonical:fib_set","base":"canonical:fib_set","kind":"canonical","start":62,"body":null,"status":"ok","short":{"text":"Unification finds the fibre over X as a set, with structures equal when each compares to the other","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.RflClass","base":"RflClass","kind":"def","start":74,"body":null,"status":"ok","short":{"text":"A reflecting class of maps: a hom class read as the reflecting half of a pair","status":"ok"},"long":{"text":"The same data as [[AffineConstructive.topology.interfaces.reflection_pair.HomClass]] under another name. A second class of maps can then sit beside the forward one and be resolved independently. In a reflection pair this is the reflecting class, the maps that compare structure in the direction opposite to the forward ones. Its membership predicate is [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]].\n\nThe closure axioms for the reflecting class are [[AffineConstructive.topology.interfaces.reflection_pair.RflConstruct]]. Preservation of the class by a fibre map is [[AffineConstructive.topology.interfaces.reflection_pair.RflMap]]. With the forward class it determines the initial maps through [[AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec]]. Under the opposite [[AffineConstructive.topology.interfaces.reflection_pair.fiber_op]], the forward and reflecting classes change places.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.IniClass","base":"IniClass","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"The class of initial maps, as a separately resolved hom class","status":"ok"},"long":{"text":"The same data as [[AffineConstructive.topology.interfaces.reflection_pair.HomClass]], named for the initial maps. It is a class of its own and not a conjunction, so it is resolved independently of the forward and reflecting classes. The specification [[AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec]] requires it to agree with the maps that are both forward and reflecting. It is one of the classes bundled in [[AffineConstructive.topology.interfaces.reflection_pair.ReflectionPairClasses]], and its membership predicate is [[AffineConstructive.topology.interfaces.reflection_pair.Ini]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.EmbClass","base":"EmbClass","kind":"def","start":76,"body":null,"status":"ok","short":{"text":"The class of embeddings, as a separately resolved hom class","status":"ok"},"long":{"text":"The same data as [[AffineConstructive.topology.interfaces.reflection_pair.HomClass]], named for embeddings: initial maps that are injective. As with [[AffineConstructive.topology.interfaces.reflection_pair.IniClass]], it is a class in its own right, with a specification [[AffineConstructive.topology.interfaces.reflection_pair.EmbClassSpec]] tying it to initiality and injectivity, so that each kind of structure can give its own characterisation. Its membership predicate is [[AffineConstructive.topology.interfaces.reflection_pair.Emb]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Rfl","base":"Rfl","kind":"def","start":83,"body":null,"status":"ok","short":{"text":"The map f : X ⇾ Y belongs to the reflecting class of C","status":"ok"},"long":{"text":"`Rfl C f` says that f reflects the structure: it is in the reflecting class, the second half of a reflection pair. It is the predicate of the reflecting class [[AffineConstructive.topology.interfaces.reflection_pair.RflClass]] applied to f. Like [[AffineConstructive.topology.interfaces.reflection_pair.Hom]], it is a class found by resolution and respects equality of functions. In a reflection pair it is related to the forward class by the cancellation laws: if g is reflecting and g ∘ f is forward then f is forward, and if g is forward and g ∘ f is reflecting then f is reflecting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec","base":"IniClassSpec","kind":"ind","start":89,"body":null,"status":"ok","short":{"text":"The law that a map is initial exactly when it is both forward and reflecting","status":"ok"},"long":{"text":"The law connecting the initial class to the other two: for every map f between structured sets, f is initial if and only if it is forward ([[AffineConstructive.topology.interfaces.reflection_pair.Hom]]) and reflecting ([[AffineConstructive.topology.interfaces.reflection_pair.Rfl]]). A forward map compares the structure of its domain with that of its codomain in one direction, a reflecting map in the other; a map that does both carries on its domain exactly the structure induced from the codomain, which is what initial means.\n\nThe initial class is kept as a class of its own, with this law relating it to the others, so that instances may supply a direct characterisation of initial maps and resolution can find it. The equivalence and the conjunction are those of the base logic, since all three classes are strict propositions; [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]] restates it, and [[AffineConstructive.topology.interfaces.reflection_pair.initial_hom]], [[AffineConstructive.topology.interfaces.reflection_pair.initial_rfl]] are its two halves used as coercions.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec","base":"IniClassSpec","kind":"rec","short":{"text":"The class asserting that initial maps are exactly the forward reflecting ones","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ini_class_spec","base":"ini_class_spec","kind":"proj","short":{"text":"A map is initial if and only if it is forward and reflecting","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Ini","base":"Ini","kind":"def","start":90,"body":null,"status":"ok","short":{"text":"f : X ⇾ Y is an initial map of C, that is, forward and reflecting","status":"ok"},"long":{"text":"The predicate of the initial class [[AffineConstructive.topology.interfaces.reflection_pair.IniClass]]. It is available once [[AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec]] holds, and that specification makes it equivalent to being forward and reflecting ([[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]]). The coercions [[AffineConstructive.topology.interfaces.reflection_pair.initial_hom]] and [[AffineConstructive.topology.interfaces.reflection_pair.initial_rfl]] give the two halves, so an initial map can be used wherever a forward or a reflecting map is asked for. Traditionally such a map is called initial: X carries exactly the structure induced from Y along f.\n\nThe initial class is kept as a separate predicate, rather than defined as the conjunction, so that each concrete pair can name its own notion of initial map and prove the specification. [[AffineConstructive.topology.interfaces.reflection_pair.EmbClassSpec]] builds on it, where embeddings are the injective initial maps. So does [[AffineConstructive.topology.interfaces.reflection_pair.ClovenPair]], where every map is initial for the structure pulled back along it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff","base":"initial_split_iff","kind":"prf","start":92,"body":[93,95],"status":"ok","short":{"text":"A map is initial if and only if it is forward and reflecting","status":"ok"},"proof":[{"text":"This equivalence is the specification of the initial class, [[AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec]], applied to f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.initial_hom","base":"initial_hom","kind":"def","start":96,"body":[97,100],"status":"ok","short":{"text":"An initial map is forward","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]], an initial map is the same as a map that is both forward and reflecting. Keeping the first conjunct shows that f is forward.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.initial_rfl","base":"initial_rfl","kind":"def","start":101,"body":[102,105],"status":"ok","short":{"text":"An initial map is reflecting","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]], an initial map is the same as a map that is both forward and reflecting. Keeping the second conjunct shows that f is reflecting.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.EmbClassSpec","base":"EmbClassSpec","kind":"ind","start":108,"body":null,"status":"ok","short":{"text":"The law that a map is an embedding exactly when it is initial and injective","status":"ok"},"long":{"text":"The law connecting embeddings to initial maps: a map f between structured sets is an embedding if and only if it is initial ([[AffineConstructive.topology.interfaces.reflection_pair.Ini]]) and injective. Injectivity is the affine notion, an implication from f x = f y to x = y, and so carries its contrapositive: points apart in the domain have images apart in the codomain. An embedding thus identifies its domain, structure and points alike, with its image.\n\nAs with [[AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec]], the embedding class is a class of its own tied to the others by this law, so that instances may characterise embeddings directly. The equivalence is in the base logic; [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]] restates it, and [[AffineConstructive.topology.interfaces.reflection_pair.emb_ini]], [[AffineConstructive.topology.interfaces.reflection_pair.emb_inj]] are its two halves used as coercions.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.EmbClassSpec","base":"EmbClassSpec","kind":"rec","short":{"text":"The class asserting that embeddings are exactly the injective initial maps","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.emb_class_spec","base":"emb_class_spec","kind":"proj","short":{"text":"A map is an embedding if and only if it is initial and injective","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Emb","base":"Emb","kind":"def","start":109,"body":null,"status":"ok","short":{"text":"The map f is an embedding: initial and injective","status":"ok"},"long":{"text":"The predicate of the embedding class [[AffineConstructive.topology.interfaces.reflection_pair.EmbClass]], available once [[AffineConstructive.topology.interfaces.reflection_pair.EmbClassSpec]] holds. An embedding identifies its domain with a substructure of its codomain. The coercions [[AffineConstructive.topology.interfaces.reflection_pair.emb_ini]] and [[AffineConstructive.topology.interfaces.reflection_pair.emb_inj]] give initiality and injectivity, and through [[AffineConstructive.topology.interfaces.reflection_pair.initial_hom]] and [[AffineConstructive.topology.interfaces.reflection_pair.initial_rfl]] an embedding is both forward and reflecting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff","base":"embed_split_iff","kind":"prf","start":111,"body":[112,114],"status":"ok","short":{"text":"A map is an embedding if and only if it is initial and injective","status":"ok"},"proof":[{"text":"This equivalence is the specification of the class of embeddings, [[AffineConstructive.topology.interfaces.reflection_pair.EmbClassSpec]], applied to f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.emb_ini","base":"emb_ini","kind":"def","start":115,"body":[116,119],"status":"ok","short":{"text":"An embedding is initial","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]], an embedding is the same as a map that is initial and injective. Keeping the first conjunct shows that f is initial.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.emb_inj","base":"emb_inj","kind":"def","start":120,"body":[121,124],"status":"ok","short":{"text":"An embedding is injective","status":"ok"},"proof":[{"text":"An embedding is by characterisation an initial map that is injective, [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]]; rewriting the hypothesis that f is an embedding by this equivalence yields injectivity of f as one of its two parts.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.RflConstruct","base":"RflConstruct","kind":"def","start":127,"body":null,"status":"ok","short":{"text":"The class axioms of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] for the reflecting class","status":"ok"},"long":{"text":"The reflecting class satisfies the same axioms as the forward one: identities of objects reflect, reflecting maps compose, and reflecting maps have objects at both ends. The record [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] is reused with the reflecting class in place of the forward one. The separate name lets resolution keep the two apart, and the accessors [[AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_id]], [[AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_compose]], [[AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_hom_X]] and [[AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_hom_Y]] restate the fields in terms of [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]]. Under the fibrewise opposite it becomes the forward axioms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_id","base":"rfl_construct_id","kind":"def","start":129,"body":null,"status":"ok","short":{"text":"The identity of an object is reflecting","status":"ok"},"long":{"text":"The identity field of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] for the reflecting class, restated with [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]], so that resolution can show identities are reflecting.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_compose","base":"rfl_construct_compose","kind":"def","start":130,"body":null,"status":"ok","short":{"text":"A composite of reflecting maps is reflecting","status":"ok"},"long":{"text":"The composition field of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] for the reflecting class, restated with [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]]. Resolution uses it to establish that a composite is reflecting from its two factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_hom_X","base":"rfl_construct_hom_X","kind":"def","start":133,"body":null,"status":"ok","short":{"text":"The domain of a reflecting map is an object","status":"ok"},"long":{"text":"The domain field of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] for the reflecting class, restated with [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]]. With it, resolution can conclude that the domain of a reflecting map in context is an object.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_hom_Y","base":"rfl_construct_hom_Y","kind":"def","start":134,"body":null,"status":"ok","short":{"text":"The codomain of a reflecting map is an object","status":"ok"},"long":{"text":"The codomain field of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] for the reflecting class, restated with [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]]. With it, resolution can conclude that the codomain of a reflecting map in context is an object.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.IniConstruct","base":"IniConstruct","kind":"def","start":135,"body":null,"status":"ok","short":{"text":"The class axioms of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] for the initial class","status":"ok"},"long":{"text":"The class axioms of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] for the initial class: identities are initial, initial maps compose, and initial maps have objects at both ends. These laws follow from the forward and reflecting axioms through [[AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec]], but they are recorded as their own class so that resolution can use them directly. The lemmas [[AffineConstructive.topology.interfaces.reflection_pair.ini_construct_id]], [[AffineConstructive.topology.interfaces.reflection_pair.ini_construct_compose]], [[AffineConstructive.topology.interfaces.reflection_pair.ini_construct_hom_X]] and [[AffineConstructive.topology.interfaces.reflection_pair.ini_construct_hom_Y]] restate the fields in terms of [[AffineConstructive.topology.interfaces.reflection_pair.Ini]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ini_construct_id","base":"ini_construct_id","kind":"prf","start":140,"body":[141,143],"status":"ok","short":{"text":"The identity of an object is initial","status":"ok"},"proof":[{"text":"That initial maps are closed under identities is one of the laws of [[AffineConstructive.topology.interfaces.reflection_pair.IniConstruct]]; applied to the object X it gives that the identity of X is initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ini_construct_hom_X","base":"ini_construct_hom_X","kind":"prf","start":144,"body":[145,147],"status":"ok","short":{"text":"The domain of an initial map is an object","status":"ok"},"proof":[{"text":"The structure [[AffineConstructive.topology.interfaces.reflection_pair.IniConstruct]] requires the domain of every initial map to be an object; this law applied to f is the statement.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ini_construct_hom_Y","base":"ini_construct_hom_Y","kind":"prf","start":148,"body":[149,151],"status":"ok","short":{"text":"The codomain of an initial map is an object","status":"ok"},"proof":[{"text":"The structure [[AffineConstructive.topology.interfaces.reflection_pair.IniConstruct]] requires the codomain of every initial map to be an object; this law applied to f is the statement.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ini_construct_compose","base":"ini_construct_compose","kind":"prf","start":152,"body":[153,156],"status":"ok","short":{"text":"A composite of initial maps is initial","status":"ok"},"proof":[{"text":"Restate the claim as: if f is initial and g is initial, then g ∘ f is initial. This is the composition law of [[AffineConstructive.topology.interfaces.reflection_pair.IniConstruct]].","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.EmbConstruct","base":"EmbConstruct","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"Embeddings contain the identities of objects, compose, and have objects at both ends","status":"ok"},"long":{"text":"The closure laws of [[AffineConstructive.topology.interfaces.reflection_pair.Construct]], asserted of the embedding class rather than the forward class: the identity of an object is an embedding, a composite of embeddings is an embedding, and the domain and codomain of an embedding are objects. Since an embedding is by [[AffineConstructive.topology.interfaces.reflection_pair.EmbClassSpec]] a map that is initial and injective, this is the familiar fact that initial injections compose, made available as a structure.\n\nIt is [[AffineConstructive.topology.interfaces.reflection_pair.Construct]] instantiated at the embedding class, so the one record serves for the forward, reflecting, initial and embedding classes alike. The lemmas [[AffineConstructive.topology.interfaces.reflection_pair.emb_construct_id]], [[AffineConstructive.topology.interfaces.reflection_pair.emb_construct_compose]], [[AffineConstructive.topology.interfaces.reflection_pair.emb_construct_hom_X]] and [[AffineConstructive.topology.interfaces.reflection_pair.emb_construct_hom_Y]] restate its fields in terms of [[AffineConstructive.topology.interfaces.reflection_pair.Emb]], so that resolution can find them for goals phrased that way.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.emb_construct_id","base":"emb_construct_id","kind":"prf","start":165,"body":[166,168],"status":"ok","short":{"text":"The identity of an object is an embedding","status":"ok"},"proof":[{"text":"That embeddings are closed under identities is one of the laws of [[AffineConstructive.topology.interfaces.reflection_pair.EmbConstruct]]; applied to the object X it gives that the identity of X is an embedding.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.emb_construct_hom_X","base":"emb_construct_hom_X","kind":"prf","start":169,"body":[170,172],"status":"ok","short":{"text":"The domain of an embedding is an object","status":"ok"},"proof":[{"text":"The structure [[AffineConstructive.topology.interfaces.reflection_pair.EmbConstruct]] requires the domain of every embedding to be an object; this law applied to f is the statement.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.emb_construct_hom_Y","base":"emb_construct_hom_Y","kind":"prf","start":173,"body":[174,176],"status":"ok","short":{"text":"The codomain of an embedding is an object","status":"ok"},"proof":[{"text":"The structure [[AffineConstructive.topology.interfaces.reflection_pair.EmbConstruct]] requires the codomain of every embedding to be an object; this law applied to f is the statement.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.emb_construct_compose","base":"emb_construct_compose","kind":"prf","start":177,"body":[178,181],"status":"ok","short":{"text":"The composite of two embeddings is an embedding","status":"ok"},"proof":[{"text":"Restate the claim as: if f is an embedding and g is an embedding, then g ∘ f is an embedding. This is the composition law of [[AffineConstructive.topology.interfaces.reflection_pair.EmbConstruct]].","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ReflectionPairClasses","base":"ReflectionPairClasses","kind":"rec","start":186,"body":null,"status":"ok","short":{"text":"The data of a reflection pair: fibres, objects, and the forward, reflecting, initial and embedding classes","status":"ok"},"long":{"text":"A reflection pair lives over a tag C naming a kind of structure on sets (topologies, uniformities, bornologies). Its data are the fibre over each set X, the type of C-structures on X; the predicate singling out the admissible structures, the objects; and four classes of maps between sets carrying structures: the forward class Kf (continuous, uniformly continuous, bornological maps), the reflecting class Kr, the initial class and the embedding class. This record collects the six pieces so that a single hypothesis on C supplies all of them.\n\nThe four classes of maps have the same shape, a predicate on maps X ⇾ Y given structures on X and Y; they are kept apart by name ([[AffineConstructive.topology.interfaces.reflection_pair.HomClass]], [[AffineConstructive.topology.interfaces.reflection_pair.RflClass]], [[AffineConstructive.topology.interfaces.reflection_pair.IniClass]], [[AffineConstructive.topology.interfaces.reflection_pair.EmbClass]]) so that each can be found separately. The record carries no laws; those are [[AffineConstructive.topology.interfaces.reflection_pair.ReflectionPair]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_pair_fiber","base":"rfl_pair_fiber","kind":"proj","short":{"text":"The fibres of a reflection pair: the structures of its kind on each set","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_pair_obj","base":"rfl_pair_obj","kind":"proj","short":{"text":"The object predicate of a reflection pair: which structures are admissible","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_pair_hom","base":"rfl_pair_hom","kind":"proj","short":{"text":"The forward class of a reflection pair","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_pair_rfl","base":"rfl_pair_rfl","kind":"proj","short":{"text":"The reflecting class of a reflection pair","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_pair_ini","base":"rfl_pair_ini","kind":"proj","short":{"text":"The initial class of a reflection pair","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_pair_emb","base":"rfl_pair_emb","kind":"proj","short":{"text":"The embedding class of a reflection pair","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Build_ReflectionPairClasses","base":"Build_ReflectionPairClasses","kind":"constr","short":{"text":"Builds the data of a reflection pair from fibres, objects and the four classes of maps","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ReflectionPair","base":"ReflectionPair","kind":"rec","start":200,"body":null,"status":"ok","short":{"text":"A reflection pair: forward and reflecting classes closed under composition, with two cancellation laws","status":"ok"},"long":{"text":"A reflection pair (Kf, Kr) on the data of [[AffineConstructive.topology.interfaces.reflection_pair.ReflectionPairClasses]]. The forward class and the reflecting class are each closed under identities of objects and under composition, and every map in either class has objects at both ends ([[AffineConstructive.topology.interfaces.reflection_pair.Construct]], [[AffineConstructive.topology.interfaces.reflection_pair.RflConstruct]]). A map is initial exactly when it is both forward and reflecting ([[AffineConstructive.topology.interfaces.reflection_pair.IniClassSpec]]). It is an embedding exactly when it is initial and injective ([[AffineConstructive.topology.interfaces.reflection_pair.EmbClassSpec]]). The record is a strict proposition: being a reflection pair is a property of the classes, not further structure.\n\nThe two classes are tied together by the cancellation laws. If g ∘ f is forward and g is reflecting, then f is forward, so a reflecting map detects forward maps under precomposition. Dually, if g ∘ f is reflecting and g is forward, then f is reflecting. Exchanging the classes exchanges the two laws, so the opposite is again a reflection pair.\n\nTopological spaces with continuous and continuously reflecting maps form one ([[AffineConstructive.topology.topology.maps.atop_rfl_pair]]), as do uniform spaces with uniformly continuous and uniformly reflecting maps ([[AffineConstructive.topology.uniform.base.unif_rfl_pair]]). [[AffineConstructive.topology.interfaces.reflection_pair.SaturatedPair]] and [[AffineConstructive.topology.interfaces.reflection_pair.ClovenPair]] build on the record.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.rp_fwd_constr","base":"rp_fwd_constr","kind":"proj","short":{"text":"The forward maps of a reflection pair form a construct","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rp_rfl_constr","base":"rp_rfl_constr","kind":"proj","short":{"text":"The reflecting maps of a reflection pair form a construct","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rp_ini_spec","base":"rp_ini_spec","kind":"proj","short":{"text":"In a reflection pair, the initial maps are exactly the forward reflecting ones","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rp_emb_spec","base":"rp_emb_spec","kind":"proj","short":{"text":"In a reflection pair, the embeddings are exactly the injective initial maps","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rp_cancel_fwd","base":"rp_cancel_fwd","kind":"proj","short":{"text":"If g is reflecting and g ∘ f is forward, then f is forward","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rp_cancel_rfl","base":"rp_cancel_rfl","kind":"proj","short":{"text":"If g is forward and g ∘ f is reflecting, then f is reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Build_ReflectionPair","base":"Build_ReflectionPair","kind":"constr","short":{"text":"Builds a reflection pair from the two constructs, the two specifications and the cancellation laws","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.SaturatedPair","base":"SaturatedPair","kind":"rec","start":204,"body":null,"status":"ok","short":{"text":"A reflection pair in which each class is exactly the maps satisfying cancellation against the other","status":"ok"},"long":{"text":"A reflection pair is saturated when each class is the largest one satisfying its cancellation law against the other. A map m between objects is reflecting as soon as it detects forward maps under precomposition, that is, whenever every g for which m ∘ g is forward is itself forward; and m is forward as soon as it detects reflecting maps in the same way. The cancellation laws of [[AffineConstructive.topology.interfaces.reflection_pair.ReflectionPair]] are the converse halves, so in a saturated pair each class is determined by the other.\n\nThe test maps g range over all sets S with any structure in the fibre, admissible or not. Almost all of the theory proceeds without saturation; products are its first use. Every cloven pair ([[AffineConstructive.topology.interfaces.reflection_pair.ClovenPair]]) is saturated: to test whether m is reflecting, take g to be the identity of X with the structure pulled back along m.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.saturated_pair","base":"saturated_pair","kind":"proj","short":{"text":"The reflection pair underlying a saturated pair","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rp_rfl_detect","base":"rp_rfl_detect","kind":"proj","short":{"text":"A map between objects that detects forward maps under precomposition is reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rp_hom_detect","base":"rp_hom_detect","kind":"proj","short":{"text":"A map between objects that detects reflecting maps under precomposition is forward","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Build_SaturatedPair","base":"Build_SaturatedPair","kind":"constr","short":{"text":"Builds a saturated pair from a reflection pair and the two detection laws","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Cleavage","base":"Cleavage","kind":"ind","start":208,"body":null,"status":"ok","short":{"text":"The class of cleavages: a structure on S pulled back along each function S ⇾ Z","status":"ok"},"long":{"text":"A cleavage assigns a structure on S to every function u : S ⇾ Z and every structure on Z: the structure pulled back along u. The cleavage is bare data. The requirement that u be initial for the pulled-back structure is [[AffineConstructive.topology.interfaces.reflection_pair.ClovenPair]].\n\nThe base theory uses it to pull back elements of a fibre ([[AffineConstructive.topology.reflection_pair.base.pull_fib]]). It shows that the pulled-back structure has the cartesian property for both classes: f ∘ g is forward, or reflecting, exactly when g is forward, or reflecting, into the structure pulled back along f ([[AffineConstructive.topology.reflection_pair.base.pull_cart_hom]], [[AffineConstructive.topology.reflection_pair.base.pull_cart_rfl]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.Cleavage","base":"Cleavage","kind":"rec","short":{"text":"The class of cleavages for a label C","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.pull","base":"pull","kind":"proj","short":{"text":"The structure on S pulled back along f : S ⇾ Z from a structure on Z","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.ClovenPair","base":"ClovenPair","kind":"rec","start":210,"body":null,"status":"ok","short":{"text":"A reflection pair whose cleavage makes every map initial for the pulled-back structure","status":"ok"},"long":{"text":"A reflection pair together with a cleavage that does what it should: for every map u : S ⇾ Z into an object, u is initial, forward and reflecting at once, when S carries the structure [[AffineConstructive.topology.interfaces.reflection_pair.pull]] gives it. This is the existence of initial lifts along single maps, the fibrational half of a topological construct.\n\nA cleavage makes the reflecting class computable from the forward class and conversely, and from this it follows that every cloven pair is saturated ([[AffineConstructive.topology.interfaces.reflection_pair.SaturatedPair]]). Resolution is taught that the map along which a structure was pulled is initial, forward and reflecting for it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.cloven_pair","base":"cloven_pair","kind":"proj","short":{"text":"The reflection pair underlying a cloven pair","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.cloven_cert","base":"cloven_cert","kind":"proj","short":{"text":"A map into an object is initial for the structure pulled back along it","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Build_ClovenPair","base":"Build_ClovenPair","kind":"constr","short":{"text":"Builds a cloven pair from a reflection pair and the initiality of pulled-back structures","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.FiberMap","base":"FiberMap","kind":"ind","start":216,"body":null,"status":"ok","short":{"text":"The class of fibre maps: a translation of C-structures on each set X into D-structures on X","status":"ok"},"long":{"text":"The data of a morphism of reflection pairs: for every set X, a function from the C-structures on X to the D-structures on X. The carrier does not change, and neither do the functions between carriers. Only the structure is translated. The laws for a fibre map to be a morphism are [[AffineConstructive.topology.interfaces.reflection_pair.HomMap]] and [[AffineConstructive.topology.interfaces.reflection_pair.RflMap]], collected in [[AffineConstructive.topology.interfaces.reflection_pair.PairMorphism]].\n\nThe base theory builds the identity fibre map [[AffineConstructive.topology.reflection_pair.base.fmap_id]] and the composite [[AffineConstructive.topology.reflection_pair.base.fmap_compose]] of two fibre maps.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.FiberMap","base":"FiberMap","kind":"rec","short":{"text":"The class of fibre maps from kind C to kind D","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fmap","base":"fmap","kind":"proj","short":{"text":"The D-structure on X that a fibre map assigns to a C-structure on X","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.HomMap","base":"HomMap","kind":"ind","start":218,"body":null,"status":"ok","short":{"text":"A fibre map preserves forward maps: a forward map of C stays forward for the translated structures","status":"ok"},"long":{"text":"The forward half of a morphism of reflection pairs. Whenever f : X ⇾ Y is forward for C, the same function is forward for D once the structures on X and Y are translated by the fibre map. The underlying function is unchanged, so this is a condition on the classes only.\n\nThe same type, applied to the reflecting classes, is [[AffineConstructive.topology.interfaces.reflection_pair.RflMap]], with accessor [[AffineConstructive.topology.interfaces.reflection_pair.rfl_map]]. Together the two conditions form a [[AffineConstructive.topology.interfaces.reflection_pair.PairMorphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.HomMap","base":"HomMap","kind":"rec","short":{"text":"The class asserting that a fibre map preserves forward maps","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.hom_map","base":"hom_map","kind":"proj","short":{"text":"A forward map of C is forward for D after translating the structures on its ends","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.RflMap","base":"RflMap","kind":"def","start":220,"body":null,"status":"ok","short":{"text":"A fibre map preserves the reflecting class","status":"ok"},"long":{"text":"The reflecting half of a morphism of reflection pairs: reflecting maps for C are reflecting for D after translating structures. It is [[AffineConstructive.topology.interfaces.reflection_pair.HomMap]] instantiated at the reflecting classes, so it is the forward condition for the opposite pairs, in keeping with the duality [[AffineConstructive.topology.interfaces.reflection_pair.fiber_op]]; the accessor [[AffineConstructive.topology.interfaces.reflection_pair.rfl_map]] restates it in terms of [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.rfl_map","base":"rfl_map","kind":"def","start":222,"body":null,"status":"ok","short":{"text":"Under a fibre map preserving reflection, a reflecting map stays reflecting for the translated structures","status":"ok"},"long":{"text":"The field of [[AffineConstructive.topology.interfaces.reflection_pair.RflMap]] stated in terms of the reflecting class: if f is reflecting for C, it is reflecting for D with the structures on its domain and codomain translated by the fibre map. It is [[AffineConstructive.topology.interfaces.reflection_pair.hom_map]] read at the reflecting classes, given its own name so that the statement is phrased with [[AffineConstructive.topology.interfaces.reflection_pair.Rfl]] where it is used.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.PairMorphism","base":"PairMorphism","kind":"rec","start":223,"body":null,"status":"ok","short":{"text":"A morphism of reflection pairs: a fibre map preserving both the forward and reflecting classes","status":"ok"},"long":{"text":"A morphism from the reflection pair over C to the one over D. It is the identity on carriers and on underlying maps, so its only data is a fibre map ([[AffineConstructive.topology.interfaces.reflection_pair.FiberMap]]) translating C-structures into D-structures; its laws are that both pairs are reflection pairs and that forward maps and reflecting maps are preserved ([[AffineConstructive.topology.interfaces.reflection_pair.HomMap]], [[AffineConstructive.topology.interfaces.reflection_pair.RflMap]]).\n\nPreservation of objects, of initial maps and embeddings, and the comparison with pulled-back structures when both pairs are cloven are not fields: they follow from these. Resolution is taught to obtain the laws of the target pair from a morphism into it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.pair_mor_C","base":"pair_mor_C","kind":"proj","short":{"text":"The source of a pair morphism is a reflection pair","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.pair_mor_D","base":"pair_mor_D","kind":"proj","short":{"text":"The target of a pair morphism is a reflection pair","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.pair_mor_hom","base":"pair_mor_hom","kind":"proj","short":{"text":"A pair morphism preserves forward maps","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.pair_mor_rfl","base":"pair_mor_rfl","kind":"proj","short":{"text":"A pair morphism preserves reflecting maps","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Build_PairMorphism","base":"Build_PairMorphism","kind":"constr","short":{"text":"Builds a pair morphism from two reflection pairs and preservation of both classes","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.fiber_op","base":"fiber_op","kind":"def","start":230,"body":null,"status":"ok","short":{"text":"The opposite reflection pair: the same structures, with forward and reflecting classes exchanged","status":"ok"},"long":{"text":"The duality of reflection pairs. The opposite of C has the same fibres, objects, initial and embedding classes and cleavage, but its forward class is the reflecting class of C and its reflecting class the forward class of C. Since the axioms of [[AffineConstructive.topology.interfaces.reflection_pair.ReflectionPair]] are symmetric under this exchange (the two closure laws swap, the two cancellation laws swap, and initial maps, being both, are unchanged), the opposite of a reflection pair is again one, and every theorem about forward maps yields its dual about reflecting maps. Fibre maps and the preservation classes [[AffineConstructive.topology.interfaces.reflection_pair.HomMap]] and [[AffineConstructive.topology.interfaces.reflection_pair.RflMap]] swap in the same way.\n\nThe tag is a copy of C kept opaque to resolution, so that the exchange happens only through the hints that implement it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.reflection_pair.PairProduct","base":"PairProduct","kind":"rec","start":250,"body":null,"status":"ok","short":{"text":"A structure on X × Y making it the product of X and Y for the forward class","status":"ok"},"long":{"text":"A structure on the cartesian product X × Y is a product in the forward class when both projections are forward and the pairing of two forward maps f : Z ⇾ X and g : Z ⇾ Y, the map [[AffineConstructive.theory.set.to_prod]] (f, g), is forward. Since the underlying functions are the set-level ones, uniqueness and the factorisation equations are already given; only membership in the forward class needs saying.\n\n```tikzcd\n & Z \\arrow[dl, \"f\"'] \\arrow[d, \"{(f,g)}\"] \\arrow[dr, \"g\"] & \\\\\nX & X \\times Y \\arrow[l, \"\\pi_1\"] \\arrow[r, \"\\pi_2\"'] & Y\n```\n\nThe record also carries the reflection pair laws for C so that a single hypothesis suffices where products are used; in a saturated pair the product structure is the one making the projections jointly reflecting.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.reflection_pair.pair_product_refl","base":"pair_product_refl","kind":"proj","short":{"text":"The reflection pair in which a product structure is taken","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.pair_product_proj1","base":"pair_product_proj1","kind":"proj","short":{"text":"The first projection of a product structure is forward","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.pair_product_proj2","base":"pair_product_proj2","kind":"proj","short":{"text":"The second projection of a product structure is forward","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.pair_product_pairing","base":"pair_product_pairing","kind":"proj","short":{"text":"The pairing of two forward maps into a product structure is forward","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.reflection_pair.Build_PairProduct","base":"Build_PairProduct","kind":"constr","short":{"text":"Builds a product structure from forward projections and forward pairings","status":"ok"}}]}],"diagrams":{"svg":{"\n & Z \\arrow[dl, \"f\"'] \\arrow[d, \"{(f,g)}\"] \\arrow[dr, \"g\"] & \\\\\nX & X \\times Y \\arrow[l, \"\\pi_1\"] \\arrow[r, \"\\pi_2\"'] & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='123.768pt' height='52.46pt' viewBox='0 0 123.768 52.46'>\n<defs>\n<path id='g4-1' d='M1.98204-3.16728C1.98204-3.31668 1.9671-3.31668 1.80276-3.31668C1.44918-2.99796 .8964-2.99796 .7968-2.99796H.71214V-2.77884H.7968C.91134-2.77884 1.23504-2.79378 1.52388-2.91828V-.42828C1.52388-.2739 1.52388-.21912 .996-.21912H.747V0C1.0209-.01992 1.46412-.01992 1.75296-.01992S2.48502-.01992 2.75892 0V-.21912H2.50992C1.98204-.21912 1.98204-.2739 1.98204-.42828V-3.16728Z'/>\n<path id='g4-2' d='M2.93322-.96114H2.72406C2.70912-.86652 2.65932-.55776 2.57964-.50796C2.5398-.47808 2.12148-.47808 2.04678-.47808H1.0707C1.39938-.7221 1.7679-1.00098 2.0667-1.20018C2.5149-1.50894 2.93322-1.79778 2.93322-2.32566C2.93322-2.9631 2.33064-3.31668 1.6185-3.31668C.9462-3.31668 .45318-2.92824 .45318-2.4402C.45318-2.18124 .6723-2.13642 .74202-2.13642C.87648-2.13642 1.03584-2.22606 1.03584-2.43024C1.03584-2.60952 .90636-2.70912 .75198-2.72406C.89142-2.94816 1.18026-3.09756 1.51392-3.09756C1.99698-3.09756 2.40036-2.80872 2.40036-2.32068C2.40036-1.90236 2.11152-1.58364 1.72806-1.25994L.51294-.22908C.46314-.18426 .45816-.18426 .45318-.1494V0H2.76

 := { U : 𝒫 X | closure U = ⊤ }.\n\nDefinition NeighborhoodBasis@{u} `{XN:Neighborhood@{u} X} {Λ:Type@{u}} (β:Λ → 𝒫 X) : SProp :=\n  ∀ x N, x ⪽ N ⧟ ∐ i, x ∊ β i ⊠ β i ⊆ N.\nExisting Class NeighborhoodBasis.\n\nRecord Continuous@{u} {X Y:set@{u}} {XN:Neighborhood X} {YN:Neighborhood Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] cont_top_X :> Topology X\n; cont_top_Y : Topology Y\n; continuity x N : f x ⪽ N ⊸ x ⪽ f* N\n}.\nExisting Class Continuous.\nArguments continuity {X Y _ _} f {_} x N.\n\nClass ContinuousReflection@{u} {X Y:set@{u}} {XN:Neighborhood X} {YN:Neighborhood Y} (f:X ⇾ Y) : SProp :=\n  cont_reflection x U : x ⪽ U ⊸ ∐ V, f x ⪽ V ⊠ f* V ⊆ U.\nArguments cont_reflection {X Y _ _} f {_} x U.\n\nRecord ContinuouslyReflecting@{u} {X Y:set@{u}} {XN:Neighborhood X} {YN:Neighborhood Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] cont_reflecting_X :> Topology X\n; cont_reflecting_Y : Topology Y\n; #[canonical=no, reversible=no] cont_reflecting :> ContinuousReflection f\n}.\nExisting Class ContinuouslyReflecting.\n\nRecord ContinuouslyInitial@{u} {X Y:set@{u}} {XN:Neighborhood X} {YN:Neighborhood Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] cont_initial_cont :> Continuous f\n; #[canonical=no, reversible=no] cont_initial_refl :> ContinuouslyReflecting f\n}.\nExisting Class ContinuouslyInitial.\n\nRecord ContinuouslyEmbedding@{u} {X Y:set@{u}} {XN:Neighborhood X} {YN:Neighborhood Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] cont_embedding_initial :> ContinuouslyInitial f\n; #[canonical=no, reversible=no] cont_embedding_inj :> Injective f\n}.\nExisting Class ContinuouslyEmbedding.\n\nClass Dense@{u} {A:Type@{u}} {Y:set@{u}} {YN:Neighborhood Y} (f:A → Y) : SProp :=\n{ #[canonical=no, reversible=no] Dense_Y :> Topology Y\n; dense_range : dense (range f)\n}.\n\n(** Discrete and indiscrete topologies.  A neighborhood structure is discrete\n    when neighborhood is membership (the finest topology, by [top_refl]), and\n    indiscrete when every point neighbors only the full subsets (the coarsest). *)\nClass Discrete@{u} {X:set@{u}} (XN:Neighborhood@{u} X) : SProp\n  := is_discrete_nbrhood : @nbrhood _ XN = element.\n\nDefinition indiscrete_nbrhood {X:set} : X ⊗ 𝒫 X ⇾ Ω\n  := set:(λ '(x, U) : X ⊗ 𝒫 X, ∏ y, y ∊ U).\n\nClass Indiscrete@{u} {X:set@{u}} (XN:Neighborhood@{u} X) : SProp\n  := is_indiscrete_nbrhood : @nbrhood _ XN = indiscrete_nbrhood.\n\n(** Initial/Terminal objects: the default neighborhood structure on 𝟏 is discrete. *)\n#[global] Hint Extern 20 (Neighborhood 𝟏) => refine element : typeclass_instances.\n\n(** Product topology *)\nSection product_neighborhoods.\n  Universes u.\n  Context {X Y:set@{u}} {NX:Neighborhood@{u} X} {NY:Neighborhood@{u} Y}.\n\n  Definition tensor_product_neighborhood_basis\n    := set:(λ '(N, M):𝒫 X ⊗ 𝒫 Y, { '(x, y) : X ⊗ Y | x ⪽ N ⊠ y ⪽ M}).\n\n  SubClass TensorProductNeighborhood    (XYN:Neighborhood@{u} (X ⊗ Y)) :=\n    NeighborhoodBasis tensor_product_neighborhood_basis.\n\n  Record CartesianProductTopology (XYN:Neighborhood@{u} (X × Y)) : SProp :=\n  { prod_proj1_cont :> Continuous (prod_proj1 X Y)\n  ; prod_proj2_cont :> Continuous (prod_proj2 X Y)\n  ; cart_prod_initial `{@Topology@{u} Z NZ} (f:Z ⇾ X × Y)\n     : Continuous (prod_proj1 _ _ ∘ f) → Continuous (prod_proj2 _ _ ∘ f) →\n       Continuous f\n  }.\nEnd product_neighborhoods.\nArguments tensor_product_neighborhood_basis    {X Y} NX NY.\nArguments TensorProductNeighborhood    {X Y} NX NY XYN.\nExisting Class TensorProductNeighborhood.\nExisting Class CartesianProductTopology.\n\n(** Continuity of the projections out of a cartesian product. *)\n#[global] Hint Extern 2 (Continuous (prod_proj1 _ _)) => simple notypeclasses refine (prod_proj1_cont _ _) : typeclass_instances.\n#[global] Hint Extern 2 (Continuous (prod_proj2 _ _)) => simple notypeclasses refine (prod_proj2_cont _ _) : typeclass_instances.\n\n(** [CartesianProductTopology] coerces to [Topology (X × Y)] (the product\n    itsel 9,"e":4739,"lib":"AffineConstructive.topology.interfaces.topology","name":"Continuous","kind":"class","local":true},{"s":4741,"e":4751,"lib":"AffineConstructive.theory.set","name":"prod_proj2","kind":"def","local":false,"page":"../../theory/set.html"},{"s":4770,"e":4780,"lib":"AffineConstructive.topology.interfaces.topology","name":"Continuous","kind":"class","local":true},{"s":4825,"e":4858,"lib":"AffineConstructive.topology.interfaces.topology","name":"tensor_product_neighborhood_basis","kind":"def","local":true},{"s":4885,"e":4910,"lib":"AffineConstructive.topology.interfaces.topology","name":"TensorProductNeighborhood","kind":"subclass","local":true},{"s":4946,"e":4971,"lib":"AffineConstructive.topology.interfaces.topology","name":"TensorProductNeighborhood","kind":"subclass","local":true},{"s":4988,"e":5012,"lib":"AffineConstructive.topology.interfaces.topology","name":"CartesianProductTopology","kind":"rec","local":true},{"s":5105,"e":5115,"lib":"AffineConstructive.topology.interfaces.topology","name":"Continuous","kind":"class","local":true},{"s":5117,"e":5127,"lib":"AffineConstructive.theory.set","name":"prod_proj1","kind":"def","local":false,"page":"../../theory/set.html"},{"s":5166,"e":5181,"lib":"AffineConstructive.topology.interfaces.topology","name":"prod_proj1_cont","kind":"proj","local":true},{"s":5235,"e":5245,"lib":"AffineConstructive.topology.interfaces.topology","name":"Continuous","kind":"class","local":true},{"s":5247,"e":5257,"lib":"AffineConstructive.theory.set","name":"prod_proj2","kind":"def","local":false,"page":"../../theory/set.html"},{"s":5296,"e":5311,"lib":"AffineConstructive.topology.interfaces.topology","name":"prod_proj2_cont","kind":"proj","local":true},{"s":5616,"e":5624,"lib":"AffineConstructive.topology.interfaces.topology","name":"Topology","kind":"class","local":true},{"s":5658,"e":5668,"lib":"AffineConstructive.topology.interfaces.topology","name":"Continuous","kind":"class","local":true},{"s":5717,"e":5736,"lib":"AffineConstructive.topology.interfaces.topology","name":"ContinuouslyInitial","kind":"class","local":true},{"s":5785,"e":5806,"lib":"AffineConstructive.topology.interfaces.topology","name":"ContinuouslyEmbedding","kind":"class","local":true},{"s":5855,"e":5877,"lib":"AffineConstructive.topology.interfaces.topology","name":"ContinuouslyReflecting","kind":"class","local":true},{"s":5933,"e":5957,"lib":"AffineConstructive.topology.interfaces.topology","name":"CartesianProductTopology","kind":"class","local":true},{"s":6026,"e":6050,"lib":"AffineConstructive.topology.interfaces.topology","name":"CartesianProductTopology","kind":"class","local":true},{"s":6075,"e":6085,"lib":"AffineConstructive.topology.interfaces.topology","name":"cont_top_Y","kind":"proj","local":true},{"s":6089,"e":6104,"lib":"AffineConstructive.topology.interfaces.topology","name":"prod_proj2_cont","kind":"proj","local":true},{"s":5982,"e":5992,"lib":"AffineConstructive.topology.interfaces.topology","name":"cont_top_Y","kind":"proj","local":true},{"s":5996,"e":6011,"lib":"AffineConstructive.topology.interfaces.topology","name":"prod_proj1_cont","kind":"proj","local":true},{"s":5902,"e":5919,"lib":"AffineConstructive.topology.interfaces.topology","name":"cont_reflecting_Y","kind":"proj","local":true},{"s":5831,"e":5841,"lib":"AffineConstructive.topology.interfaces.topology","name":"cont_top_Y","kind":"proj","local":true},{"s":5761,"e":5771,"lib":"AffineConstructive.topology.interfaces.topology","name":"cont_top_Y","kind":"proj","local":true},{"s":5693,"e":5703,"lib":"AffineConstructive.topology.interfaces.topology","name":"cont_top_Y","kind":"proj","local":true}],"gloss":{"summary":"This file sets up the interface for topological spaces, in terms of a neighbourhood relation x ⪽ U between points and subsets. A [[AffineConstructive.topology.interfaces.topology.Topology]] requires that every neighbourhood contains its point, that neighbourhoods are closed upward and under finite meets, and that a neighbourhood of x is also a neighbourhood of every point near x. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the T₀ and Hausdorff separation axioms. It defines the classes of maps (continuous, continuously reflecting, initial, embedding, dense), the discrete and indiscrete structures, and the tensor and cartesian product topologies. The theory of these notions is developed in the files under topology/topology.","short":"Topological spaces by neighbourhood relations: axioms, continuity classes, separation, products","items":[{"name":"AffineConstructive.topology.interfaces.topology.Neighborhood","base":"Neighborhood","kind":"ind","start":9,"body":null,"status":"ok","short":{"text":"A neighbourhood relation on a set X: when U is a neighbourhood of x","status":"ok"},"long":{"text":"A neighbourhood structure on an affine set X is a function `nbrhood` from X ⊗ 𝒫 X to affine propositions, written x ⪽ U and read \"U is a neighbourhood of x\". Topology in the development is presented through this relation rather than through a family of open sets: the open sets, the interior and the closure are all derived from it ([[AffineConstructive.topology.interfaces.topology.interior]], [[AffineConstructive.topology.interfaces.topology.open]], [[AffineConstructive.topology.interfaces.topology.closure]]).\n\nThe domain is the tensor product X ⊗ 𝒫 X, whose equality is multiplicative, so being a function says that x ⪽ U is transported along x = x' ⊠ U = U'. Read contrapositively, if U is a neighbourhood of x and U' is not a neighbourhood of x', then x is apart from x' or U is apart from U'. The bare relation carries no axioms; those are the class [[AffineConstructive.topology.interfaces.topology.Topology]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.Neighborhood","base":"Neighborhood","kind":"rec","short":{"text":"The neighbourhood structures on a set X","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.nbrhood","base":"nbrhood","kind":"proj","short":{"text":"The neighbourhood relation x ⪽ U of a neighbourhood structure","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.Topology","base":"Topology","kind":"rec","start":13,"body":null,"status":"ok","short":{"text":"The topology axioms on a neighbourhood relation","status":"ok"},"long":{"text":"A neighbourhood relation is a topology when it satisfies the usual axioms for neighbourhood systems, each stated as an affine implication. A neighbourhood of x contains x. A subset containing a neighbourhood of x is itself a neighbourhood of x. The full subset is a neighbourhood of every point. The meet of two neighbourhoods of x is a neighbourhood of x. And if U is a neighbourhood of x, then so is the set of points of which U is a neighbourhood, that is, the interior of U.\n\nThe hypotheses of isotony and binary additivity are joined by the tensor ⊠, so each is used once. This makes the contrapositives informative: if V is not a neighbourhood of x, then either U is not a neighbourhood of x or U is not included in V; and if U ⊓ V is not a neighbourhood of x, then U being a neighbourhood of x forces V not to be one. Every implication also carries its dual reading. Reflexivity, for example, also says that a point outside U does not have U as a neighbourhood.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.top_refl","base":"top_refl","kind":"proj","short":{"text":"A neighbourhood of x contains x","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.top_isotony","base":"top_isotony","kind":"proj","short":{"text":"A subset containing a neighbourhood of x is a neighbourhood of x","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.top_nullary_additivity","base":"top_nullary_additivity","kind":"proj","short":{"text":"The full subset is a neighbourhood of every point","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.top_binary_additivity","base":"top_binary_additivity","kind":"proj","short":{"text":"The meet of two neighbourhoods of x is a neighbourhood of x","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.top_trans","base":"top_trans","kind":"proj","short":{"text":"If U is a neighbourhood of x, so is the set of points U is a neighbourhood of","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.Build_Topology","base":"Build_Topology","kind":"constr","short":{"text":"Builds a topology from the five neighbourhood axioms","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.Separation_T₀","base":"Separation_T₀","kind":"ind","start":14,"body":null,"status":"ok","short":{"text":"The T₀ separation axiom: points with the same neighbourhoods are equal","status":"ok"},"long":{"text":"A neighbourhood relation is T₀ when two points that have exactly the same neighbourhoods are equal. Here \"the same\" is the affine statement ∏ U, x ⪽ U ⧟ y ⪽ U.\n\nThe dual reading is the constructive content. If x and y are apart, then there is a subset U that distinguishes them, in the sense that x ⪽ U ⧟ y ⪽ U is refuted: one of the two points has U as a neighbourhood and the other does not. So inequality, which in a strong set is apartness, is witnessed by a neighbourhood.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.Separation_T₀","base":"Separation_T₀","kind":"rec","short":{"text":"The class of T₀ neighbourhood relations","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.separation_T₀","base":"separation_T₀","kind":"proj","short":{"text":"Points with the same neighbourhoods are equal","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.Hausdorff","base":"Hausdorff","kind":"ind","start":15,"body":null,"status":"ok","short":{"text":"The Hausdorff axiom: points whose neighbourhoods all meet are equal","status":"ok"},"long":{"text":"A neighbourhood relation is Hausdorff when x = y follows from the following condition: for all subsets U and V, if U is a neighbourhood of x and V is a neighbourhood of y, then U and V share a point (there is z with z ∊ U ⊠ z ∊ V).\n\nThe antecedent \"U and V are neighbourhoods of x and y\" sits under of course, so it is affirmed outright rather than as an affine proposition with a refutation of its own. This choice shapes the dual reading, which is the classical form of the axiom: if x and y are apart, then there are U and V that are neighbourhoods of x and of y, and they are disjoint, meaning every point fails to lie in both. Without the of course, the refutation of the implication would ask for less than an actual pair of neighbourhoods.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.Hausdorff","base":"Hausdorff","kind":"rec","short":{"text":"The class of Hausdorff neighbourhood relations","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.hausdorff","base":"hausdorff","kind":"proj","short":{"text":"Points all of whose neighbourhoods meet are equal","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.interior","base":"interior","kind":"def","start":16,"body":null,"status":"ok","short":{"text":"The interior of U: the points of which U is a neighbourhood","status":"ok"},"long":{"text":"The interior operator sends a subset U to { x | x ⪽ U }, the points of which U is a neighbourhood. It is the neighbourhood relation curried in its second argument. It is a function 𝒫 X ⇾ 𝒫 X of sets, so it preserves equality of subsets, and dually, subsets with interiors that are apart are themselves apart.\n\nIn terms of the interior, the axioms of a [[AffineConstructive.topology.interfaces.topology.Topology]] say the following. The interior is contained in U ([[AffineConstructive.topology.interfaces.topology.top_refl]]). It is monotone ([[AffineConstructive.topology.interfaces.topology.top_isotony]]). It preserves the full subset and binary meets ([[AffineConstructive.topology.interfaces.topology.top_nullary_additivity]], [[AffineConstructive.topology.interfaces.topology.top_binary_additivity]]). And U being a neighbourhood of x implies that the interior of U is one too ([[AffineConstructive.topology.interfaces.topology.top_trans]]), which makes the interior idempotent.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.closure","base":"closure","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"The closure of U: the complement of the interior of its complement","status":"ok"},"long":{"text":"The closure is defined by duality from the [[AffineConstructive.topology.interfaces.topology.interior]]: closure U is the complement of interior (Uᗮ). A point is in the closure of U when it is refuted that Uᗮ is a neighbourhood of it.\n\nSubsets here are complemented subsets, and the complement swaps membership with non-membership. So this definition gives both sides of closure at once. A point lies in the closure when Uᗮ is not a neighbourhood of it, and lies outside the closure when Uᗮ is a neighbourhood of it. No separate definition through meeting every neighbourhood is needed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.open","base":"open","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"U is open: its interior equals U","status":"ok"},"long":{"text":"A subset is open when it equals its interior. This is an equality of subsets in 𝒫 X and so an affine proposition. Its refutation says that U and its interior are apart, which amounts to a point of U of which U is not a neighbourhood. Since the interior is always contained in U, being open says that U is a neighbourhood of each of its points.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.closed","base":"closed","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"U is closed: its closure equals U","status":"ok"},"long":{"text":"A subset is closed when it equals its [[AffineConstructive.topology.interfaces.topology.closure]], as an affine equality of subsets. Because the closure is the complement of the interior of the complement, U is closed exactly when Uᗮ is [[AffineConstructive.topology.interfaces.topology.open]]. That correspondence is a consequence of the definitions, not part of them.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.dense","base":"dense","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"The dense subsets: those whose closure is the full subset","status":"ok"},"long":{"text":"The dense subsets of X form a set of subsets: those U whose [[AffineConstructive.topology.interfaces.topology.closure]] equals the top element ⊤ of 𝒫 X, the full subset. Unwinding the closure, U is dense when no point has Uᗮ as a neighbourhood. Dually, U fails to be dense when some point has a neighbourhood that is disjoint from U.\n\nThis is the predicate behind the class [[AffineConstructive.topology.interfaces.topology.Dense]] of maps with dense range.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.NeighborhoodBasis","base":"NeighborhoodBasis","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"A family β is a neighbourhood basis: neighbourhoods of x are the sets containing some β i ∋ x","status":"ok"},"long":{"text":"A family β of subsets indexed by a type Λ is a basis for a neighbourhood relation when, for every x and N, N is a neighbourhood of x if and only if there is an index i with x ∊ β i ⊠ β i ⊆ N. The equivalence is the affine ⧟, so it also identifies the refutations. N fails to be a neighbourhood of x exactly when every basic set either misses x or is not included in N.\n\nThe outer quantifiers are those of the base logic, since the condition is a property of the structure rather than an affine proposition about points. Its main use in the file is [[AffineConstructive.topology.interfaces.topology.TensorProductNeighborhood]], which specifies the topology on a tensor product through a basis.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.Continuous","base":"Continuous","kind":"rec","start":23,"body":null,"status":"ok","short":{"text":"A continuous map: preimages of neighbourhoods of f x are neighbourhoods of x","status":"ok"},"long":{"text":"A map f : X ⇾ Y between sets with neighbourhood relations is continuous when, for every x and every neighbourhood N of f x, the preimage f* N is a neighbourhood of x. The record also carries the [[AffineConstructive.topology.interfaces.topology.Topology]] axioms on both sides, so a continuity hypothesis brings its spaces into context with it.\n\nThis is the forward class of the topological reflection pair. As an affine implication it also says something dual: if f* N is not a neighbourhood of x, then N is not a neighbourhood of f x. The comparison in the other direction is [[AffineConstructive.topology.interfaces.topology.ContinuousReflection]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.cont_top_X","base":"cont_top_X","kind":"proj","short":{"text":"The topology on the domain of a continuous map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.cont_top_Y","base":"cont_top_Y","kind":"proj","short":{"text":"The topology on the codomain of a continuous map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.continuity","base":"continuity","kind":"proj","short":{"text":"If N is a neighbourhood of f x, then f* N is a neighbourhood of x","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.Build_Continuous","base":"Build_Continuous","kind":"constr","short":{"text":"Builds a continuous map from the two topologies and the continuity condition","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.ContinuousReflection","base":"ContinuousReflection","kind":"ind","start":26,"body":null,"status":"ok","short":{"text":"Every neighbourhood of x contains the preimage of a neighbourhood of f x","status":"ok"},"long":{"text":"A map f reflects neighbourhoods when, for every neighbourhood U of x, there is a neighbourhood V of f x whose preimage f* V is contained in U. This is the comparison opposite to [[AffineConstructive.topology.interfaces.topology.Continuous]]: it says that the topology of X is no finer than the one induced from Y along f. Together with continuity, it says that X carries exactly the induced topology.\n\nThe condition is kept separate from the topology axioms so that it can be stated and used on its own. [[AffineConstructive.topology.interfaces.topology.ContinuouslyReflecting]] adds the axioms. Its dual reading: if every neighbourhood V of f x has a preimage that is not included in U, then U is not a neighbourhood of x.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.ContinuousReflection","base":"ContinuousReflection","kind":"rec","short":{"text":"The class of maps that reflect neighbourhoods","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.cont_reflection","base":"cont_reflection","kind":"proj","short":{"text":"Each neighbourhood U of x contains f* V for some neighbourhood V of f x","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.ContinuouslyReflecting","base":"ContinuouslyReflecting","kind":"rec","start":28,"body":null,"status":"ok","short":{"text":"A neighbourhood-reflecting map between topological spaces","status":"ok"},"long":{"text":"The reflecting class of the topological reflection pair: a map that satisfies [[AffineConstructive.topology.interfaces.topology.ContinuousReflection]] between two sets carrying [[AffineConstructive.topology.interfaces.topology.Topology]] structures. It is to the bare reflection condition what [[AffineConstructive.topology.interfaces.topology.Continuous]] is to the bare continuity condition. With continuity it makes up [[AffineConstructive.topology.interfaces.topology.ContinuouslyInitial]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.cont_reflecting_X","base":"cont_reflecting_X","kind":"proj","short":{"text":"The topology on the domain of a reflecting map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.cont_reflecting_Y","base":"cont_reflecting_Y","kind":"proj","short":{"text":"The topology on the codomain of a reflecting map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.cont_reflecting","base":"cont_reflecting","kind":"proj","short":{"text":"The reflection condition of a reflecting map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.Build_ContinuouslyReflecting","base":"Build_ContinuouslyReflecting","kind":"constr","short":{"text":"Builds a reflecting map from two topologies and the reflection condition","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.ContinuouslyInitial","base":"ContinuouslyInitial","kind":"rec","start":30,"body":null,"status":"ok","short":{"text":"An initial map: continuous and reflecting, so the domain carries the induced topology","status":"ok"},"long":{"text":"A map is initial when it is both [[AffineConstructive.topology.interfaces.topology.Continuous]] and [[AffineConstructive.topology.interfaces.topology.ContinuouslyReflecting]]. Then U is a neighbourhood of x exactly when U contains f* V for some neighbourhood V of f x, so the topology of X is the one induced from Y along f. In the reflection pair it is the conjunction of the forward and the reflecting class.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.cont_initial_cont","base":"cont_initial_cont","kind":"proj","short":{"text":"An initial map is continuous","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.cont_initial_refl","base":"cont_initial_refl","kind":"proj","short":{"text":"An initial map is reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.Build_ContinuouslyInitial","base":"Build_ContinuouslyInitial","kind":"constr","short":{"text":"Builds an initial map from continuity and reflection","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.ContinuouslyEmbedding","base":"ContinuouslyEmbedding","kind":"rec","start":32,"body":null,"status":"ok","short":{"text":"A topological embedding: an initial injective map","status":"ok"},"long":{"text":"A topological embedding is a map that is [[AffineConstructive.topology.interfaces.topology.ContinuouslyInitial]] and injective. It identifies X with a subspace of Y carrying the induced topology. Injectivity is meant in the affine sense: f x = f y implies x = y, and dually, apart points have apart images.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.cont_embedding_initial","base":"cont_embedding_initial","kind":"proj","short":{"text":"An embedding is initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.cont_embedding_inj","base":"cont_embedding_inj","kind":"proj","short":{"text":"An embedding is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.Build_ContinuouslyEmbedding","base":"Build_ContinuouslyEmbedding","kind":"constr","short":{"text":"Builds an embedding from an initial map and its injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.Dense","base":"Dense","kind":"rec","start":34,"body":null,"status":"ok","short":{"text":"A map into a topological space whose range is dense","status":"ok"},"long":{"text":"A map f from a type A into a set Y with a [[AffineConstructive.topology.interfaces.topology.Topology]] is dense when its range is [[AffineConstructive.topology.interfaces.topology.dense]]: no point of Y has a neighbourhood that misses every f a. The domain is a bare type, not a set, so the notion applies to any family of points in Y. Examples are the unit of a completion and the image of a dense subset.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.Dense_Y","base":"Dense_Y","kind":"proj","short":{"text":"The topology on the codomain of a dense map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.dense_range","base":"dense_range","kind":"proj","short":{"text":"The range of a dense map is dense","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.Build_Dense","base":"Build_Dense","kind":"constr","short":{"text":"Builds a dense map from a topology on Y and density of the range","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.Discrete","base":"Discrete","kind":"ind","start":35,"body":null,"status":"ok","short":{"text":"A neighbourhood structure is discrete: U is a neighbourhood of x exactly when x ∊ U","status":"ok"},"long":{"text":"A neighbourhood structure on X is discrete when the neighbourhood relation is membership itself: x ⪽ U holds exactly when x ∊ U. Under the axioms of a topology every neighbourhood of x contains x ([[AffineConstructive.topology.interfaces.topology.top_refl]]), so membership is the largest neighbourhood relation a topology can have, and the discrete one is the finest topology on X. Because the relation is a pair of a proof and a refutation, the equality also fixes the dual reading: x fails to have U as a neighbourhood exactly when x is refuted to lie in U.\n\nThe condition is stated as an equality of functions X ⊗ 𝒫 X ⇾ Ω, between the neighbourhood relation and membership ([[AffineConstructive.interfaces.subset.element]]), so that proofs use it by rewriting one into the other. [[AffineConstructive.topology.topology.base.element_discrete]] shows that membership is a discrete neighbourhood relation, and [[AffineConstructive.topology.uniform.basis.discrete_uniformity_nbrhood]] that a discrete uniformity induces a discrete topology.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.Discrete","base":"Discrete","kind":"rec","short":{"text":"The class of discrete neighbourhood structures","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.is_discrete_nbrhood","base":"is_discrete_nbrhood","kind":"proj","short":{"text":"In a discrete structure the neighbourhood relation equals membership","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.indiscrete_nbrhood","base":"indiscrete_nbrhood","kind":"def","start":36,"body":null,"status":"ok","short":{"text":"The indiscrete neighbourhood relation: U is a neighbourhood of x when U is full","status":"ok"},"long":{"text":"The indiscrete neighbourhood relation makes U a neighbourhood of a point x exactly when every y lies in U, regardless of x. Every point then has only the full subset as a neighbourhood, so this is the coarsest topology. It is used as the reference relation in [[AffineConstructive.topology.interfaces.topology.Indiscrete]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.Indiscrete","base":"Indiscrete","kind":"ind","start":37,"body":null,"status":"ok","short":{"text":"A neighbourhood structure is indiscrete: its only neighbourhoods are full subsets","status":"ok"},"long":{"text":"A neighbourhood structure is indiscrete when its relation equals [[AffineConstructive.topology.interfaces.topology.indiscrete_nbrhood]], so that the only neighbourhoods of any point are the full subsets. It is the coarsest topology, the counterpart of [[AffineConstructive.topology.interfaces.topology.Discrete]], and like it is stated as an equality of functions so that it can be used by rewriting.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.Indiscrete","base":"Indiscrete","kind":"rec","short":{"text":"The class of indiscrete neighbourhood structures","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.is_indiscrete_nbrhood","base":"is_indiscrete_nbrhood","kind":"proj","short":{"text":"In an indiscrete structure, the neighbourhood relation is the indiscrete one","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.topology.tensor_product_neighborhood_basis","base":"tensor_product_neighborhood_basis","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"The basic sets of the tensor product topology: interior N ⊗ interior M","status":"ok"},"long":{"text":"The basic sets of the topology on X ⊗ Y are, for a pair of subsets N of X and M of Y, the set of pairs (x, y) with x ⪽ N ⊠ y ⪽ M. That is the tensor of the interiors of N and M. The pair (N, M) ranges over 𝒫 X ⊗ 𝒫 Y, and the assignment is a function on it, so it respects equality of subsets.\n\nThe tensor ⊠, rather than ∧, matches the multiplicative equality of X ⊗ Y. Refuting membership of (x, y) in the basic set means that x ⪽ N implies that M is not a neighbourhood of y. This is the form needed for the basic set to be well defined on the tensor product.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.TensorProductNeighborhood","base":"TensorProductNeighborhood","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"A neighbourhood relation on X ⊗ Y has the tensor product topology","status":"ok"},"long":{"text":"A neighbourhood relation on X ⊗ Y is the tensor product topology when [[AffineConstructive.topology.interfaces.topology.tensor_product_neighborhood_basis]] is a [[AffineConstructive.topology.interfaces.topology.NeighborhoodBasis]] for it. Then a subset W is a neighbourhood of (x, y) exactly when there are N and M such that x ⪽ N ⊠ y ⪽ M and every pair (x', y') with x' ⪽ N ⊠ y' ⪽ M lies in W. The topology is specified by its basis rather than by a universal property. This is because the tensor product, whose equality is multiplicative, is not the categorical product of sets. That role belongs to the cartesian product ([[AffineConstructive.topology.interfaces.topology.CartesianProductTopology]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.topology.CartesianProductTopology","base":"CartesianProductTopology","kind":"rec","start":44,"body":null,"status":"ok","short":{"text":"A neighbourhood relation on X × Y is the product topology, by its universal property","status":"ok"},"long":{"text":"A neighbourhood relation on the cartesian product X × Y is the product topology when both projections are [[AffineConstructive.topology.interfaces.topology.Continuous]], and a map f : Z ⇾ X × Y out of any topological space is continuous as soon as its two components are. This is the universal property of the product in topological spaces. Uniqueness of the factorisation is inherited from sets, so the record asks only that the induced map be continuous.\n\n```tikzcd\n& Z \\arrow[dl, \"\\pi_1 f\"'] \\arrow[d, \"f\"] \\arrow[dr, \"\\pi_2 f\"] & \\\\\nX & X \\times Y \\arrow[l, \"\\pi_1\"] \\arrow[r, \"\\pi_2\"'] & Y\n```\n\nThe product is characterised this way and not by a basis, in contrast to [[AffineConstructive.topology.interfaces.topology.TensorProductNeighborhood]]. The cartesian product carries the additive equality, and with it the projections are functions of sets and the product is categorical. The topologies of X, of Y and of X × Y can all be recovered from the continuity of the projections.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.topology.prod_proj1_cont","base":"prod_proj1_cont","kind":"proj","short":{"text":"The first projection out of the product is continuous","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.prod_proj2_cont","base":"prod_proj2_cont","kind":"proj","short":{"text":"The second projection out of the product is continuous","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.cart_prod_initial","base":"cart_prod_initial","kind":"proj","short":{"text":"A map into the product is continuous when both its components are","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.topology.Build_CartesianProductTopology","base":"Build_CartesianProductTopology","kind":"constr","short":{"text":"Builds the product topology from continuous projections and the universal property","status":"ok"}}]}],"diagrams":{"svg":{"\n& Z \\arrow[dl, \"\\pi_1 f\"'] \\arrow[d, \"f\"] \\arrow[dr, \"\\pi_2 f\"] & \\\\\nX & X \\times Y \\arrow[l, \"\\pi_1\"] \\arrow[r, \"\\pi_2\"'] & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='123.768pt' height='52.46pt' viewBox='0 0 123.768 52.46'>\n<defs>\n<path id='g3-1' d='M1.98204-3.16728C1.98204-3.31668 1.9671-3.31668 1.80276-3.31668C1.44918-2.99796 .8964-2.99796 .7968-2.99796H.71214V-2.77884H.7968C.91134-2.77884 1.23504-2.79378 1.52388-2.91828V-.42828C1.52388-.2739 1.52388-.21912 .996-.21912H.747V0C1.0209-.01992 1.46412-.01992 1.75296-.01992S2.48502-.01992 2.75892 0V-.21912H2.50992C1.98204-.21912 1.98204-.2739 1.98204-.42828V-3.16728Z'/>\n<path id='g3-2' d='M2.93322-.96114H2.72406C2.70912-.86652 2.65932-.55776 2.57964-.50796C2.5398-.47808 2.12148-.47808 2.04678-.47808H1.0707C1.39938-.7221 1.7679-1.00098 2.0667-1.20018C2.5149-1.50894 2.93322-1.79778 2.93322-2.32566C2.93322-2.9631 2.33064-3.31668 1.6185-3.31668C.9462-3.31668 .45318-2.92824 .45318-2.4402C.45318-2.18124 .6723-2.13642 .74202-2.13642C.87648-2.13642 1.03584-2.22606 1.03584-2.43024C1.03584-2.60952 .90636-2.70912 .75198-2.72406C.89142-2.94816 1.18026-3.09756 1.51392-3.09756C1.99698-3.09756 2.40036-2.80872 2.40036-2.32068C2.40036-1.90236 2.11152-1.58364 1.72806-1.25994L.51294-.22908C.46314-.18426 .45816-.18426 .45318-.1494V0H2.76888L2.93322- xlink:href='#g2-1'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 0 52.46)'>\n<use x='26.076193' y='-29.424321' xlink:href='#g3-1'/>\n<\/g>\n<g transform='matrix(.999455 0 0 .999455 0 52.46)'>\n<use x='29.954669' y='-30.412419' xlink:href='#g2-2'/>\n<\/g>\n<path d='M62.40288 16.28984V33.42146' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M64.991139 31.017278C63.438159 31.492918 62.704839 32.552828 62.402879 33.620698C62.100919 32.552828 61.367599 31.492918 59.814619 31.017278' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 52.46)'>\n<use x='64.71072' y='-25.648017' xlink:href='#g2-2'/>\n<\/g>\n<path d='M70.6474 15.12094L104.66435 36.44984' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M104.0024 32.979924C103.580424 34.548284 104.088851 35.732584 104.83316 36.55566C103.768049 36.244231 102.480543 36.302483 101.252633 37.365523' stroke='currentColor' fill='none' stroke-width='.398468' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 52.46)'>\n<use x='90.118868' y='-30.252507' xlink:href='#g2-1'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 0 52.46)'>\n<use x='94.802251' y='-29.264361' xlink:href='#g3-2'/>\n<\/g>\n<g transform='matrix(.999455 0 0 .999455 0 52.46)'>\n<use x='98.661211' y='-30.252507' xlink:href='#g2-2'/>\n<\/g>\n<path d='M43.31007 41.9816H20.20231' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M22.606499 44.569859C22.130859 43.016879 21.070949 42.283559 20.003079 41.981599C21.070949 41.679639 22.130859 40.946319 22.606499 39.393339' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 52.46)'>\n<use x='27.  develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."}},"constants":null}</script>

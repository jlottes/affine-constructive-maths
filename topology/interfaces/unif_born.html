ctive.implementations.finite_sequences":"implementations/finite_sequences.html","AffineConstructive.implementations.free.com_monoids":"implementations/free/com_monoids.html","AffineConstructive.implementations.free.ab_groups":"implementations/free/ab_groups.html","AffineConstructive.implementations.grothendieck_group":"implementations/grothendieck_group.html","AffineConstructive.implementations.signed_naturals_integers":"implementations/signed_naturals_integers.html","AffineConstructive.implementations.bin_int":"implementations/bin_int.html","AffineConstructive.topology.topology.base":"topology/topology/base.html","AffineConstructive.topology.topology.basis":"topology/topology/basis.html","AffineConstructive.topology.topology.interior":"topology/topology/interior.html","AffineConstructive.topology.topology.maps":"topology/topology/maps.html","AffineConstructive.topology.topology.product":"topology/topology/product.html","AffineConstructive.topology.reflection_pair.products":"topology/reflection_pair/products.html","AffineConstructive.topology.reflection_pair.completion":"topology/reflection_pair/completion.html","AffineConstructive.topology.topology":"topology/topology.html","AffineConstructive.topology.topology.induced":"topology/topology/induced.html","AffineConstructive.topology.topology.subspace":"topology/topology/subspace.html","AffineConstructive.topology.unif_born.local_completion":"topology/unif_born/local_completion.html","AffineConstructive.topology.uniform.base":"topology/uniform/base.html","AffineConstructive.topology.uniform.completion":"topology/uniform/completion.html","AffineConstructive.topology.uniform.uniformly_below":"topology/uniform/uniformly_below.html","AffineConstructive.topology.uniform.basis":"topology/uniform/basis.html","AffineConstructive.topology.uniform.dense_collar":"topology/uniform/dense_collar.html","AffineConstructive.topology.uniform.final":"topology/uniform/final.html","AffineConstructive.topology.uniform.product":"topology/un /subspace.html"},"source":"Require Import sprop srelations rewrite orders.filters easy orders.subset.\nRequire Export topology.interfaces.uniform topology.interfaces.bornology.\n\n(** Uniform spaces carrying a bornology, with no axioms connecting the two\n    structures — the fiber product Unif ×_Set PreBorn over the carrier.\n    The WCUnif and BUnif flavors refine this chassis with connecting axioms\n    (see doc/wcunif.md and the sketches in interfaces/bornology.v). *)\n\nRecord UnifBornSpace X {Φ:Uniformity X} {𝒜:Bornology X} : SProp :=\n{ #[canonical=no, reversible=no] unif_born_unif    :> UniformSpace X\n; #[canonical=no, reversible=no] unif_born_born :> BornologicalSpace X\n}.\nExisting Class UnifBornSpace.\n\n#[global] Hint Extern 10 (UnifBornSpace _) => simple notypeclasses refine (Build_UnifBornSpace _ _ _) : typeclass_instances.\n\n\n(** Axioms connecting the uniformity and bornology structures *)\nImport thicken_notation.\nImport tensor_map_notation.\nImport image_notation.\nLocal Open Scope topology_scope.\n\n(*\n(** THESE ARE BUGGED. *)\n\nClass BornologicallyDeterminedUniformity X {Φ:Uniformity X} {𝒜:Bornology X} : SProp :=\n  bunif_i (U:𝒫 (X ⊗ X)) : (∀ (M:𝒜), ∐ (V:Φ), powerset_pt V ⊓ (M ⊗ M) ⊆ U) → U ∊ Φ.\n\nClass UniformlyClosedBornology X {Φ:Uniformity X} {𝒜:Bornology X} : SProp :=\n  bunif_ii (M:𝒫 X) : (∀ (U:Φ), ∐ (M':𝒜), M ⊆ U.[powerset_pt M']) → M ∊ 𝒜.\n*)\n\nClass UniformlyOpenBornology X {Φ:Uniformity X} {𝒜:Bornology X} : SProp :=\n  wcunif_thicken (A:𝒜) : ∐ (U:Φ), U.[powerset_pt A] ∊ 𝒜.\nArguments wcunif_thicken X {_ _ _} A.\n\nRecord WCUnifSpace  X {Φ:Uniformity X} {𝒜:Bornology X} : SProp :=\n{ #[canonical=no, reversible=no] wcunif_unif_born :> UnifBornSpace X\n; #[canonical=no, reversible=no] wcunif_unif_open_born :> UniformlyOpenBornology X\n}.\nExisting Class WCUnifSpace.\n\n(** Regular WCUnif spaces: WCUnif plus the two cover-form decision axioms —\n    [UniformRegularity] (inner witness, filter variance) and\n    [BornologyRegularity] (outer witness, ideal variance).  Bundled through\n    the [Regular*Space] records so all coercion paths come for free. *)\nRecord RegularWCUnifSpace X {Φ:Uniformity X} {𝒜:Bornology X} : SProp :=\n{ #[canonical=no, reversible=no] regular_wcunif_wc           :> WCUnifSpace X\n; #[canonical=no, reversible=no] regular_wcunif_regular_unif :> RegularUniformSpace X\n; #[canonical=no, reversible=no] regular_wcunif_regular_born :> RegularBornologicalSpace X\n}.\nExisting Class RegularWCUnifSpace.\n\n(** The well-containment relation (classical [⊂⊂]): bounded, and uniformly\n    below.  [K ∊ 𝒜] is the compactness leg (precompactness, at the precompact\n    bornology); [K ◁ S] is the uniform-neighborhood leg. *)\nDefinition well_contained `{Φ:Uniformity X} {𝒜:Bornology X}\n  := { '(K, S) : 𝒜 ⊗ 𝒫 X | powerset_pt K ◁ S }.\nNotation \"K ⋐ S\" := (func_op well_contained (K, S)) (at level 70, no associativity) : topology_scope.\n\n(** Product UnifBorn certificates: a uniformity and a bornology on the product\n    carrier that jointly realize the canonical product UnifBorn structure.  Each\n    bundles the uniform-side and bornology-side product certificates; the Build\n    hint splits resolution into the two halves, found by their own _correct\n    hints (as UnifBornSpace splits into UniformSpace + BornologicalSpace). *)\n\nRecord TensorProductUnifBorn@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}\n    (Ξ:Uniformity (X ⊗ Y)) (𝒞:Bornology (X ⊗ Y)) : SProp :=\n{ #[canonical=no, reversible=no] tensor_product_unif_born_unif :> TensorProductUniformity Φ Ψ Ξ\n; #[canonical=no, reversible=no] tensor_product_unif_born_born :> TensorProductBornology 𝒜 ℬ 𝒞\n}.\nExisting Class TensorProductUnifBorn.\n\n#[global] Hint Extern 10 (TensorProductUnifBorn _ _) => simple notypeclasses refine (Build_TensorProductUnifBorn _ _ _ _) : typeclass_instances.\n\nRecord CartesianProductUnifBorn@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}\n    (Ξ:Uniformity (X × Y)) (𝒞:Bornology (X × Y)) : SProp :=\n{ #[canonical=no, reversible=no] cartesian_product_unif_born_unif :> CartesianProductUniformity Φ Ψ Ξ\n; #[canonical=no, reversible=no] cartesian_product_unif_born_born :> CartesianProductBornology 𝒜 ℬ 𝒞\n}.\nExisting Class CartesianProductUnifBorn.\n\n#[global] Hint Extern 10 (CartesianProductUnifBorn _ _) => simple notypeclasses refine (Build_CartesianProductUnifBorn _ _ _ _) : typeclass_instances.\n\n(** Morphism flavors. Each leg keeps its own record so that mixed variants\n    (e.g. uniformly initial but only forward-bornological, as for open\n    immersions) remain expressible; these bundles are the common diagonals. *)\n\nRecord UnifBornMorphism@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] unif_born_mor_cont :> UniformlyContinuous f\n; #[canonical=no, reversible=no] unif_born_mor_born :> Bornological f\n}.\nExisting Class UnifBornMorphism.\n\nRecord UnifBornReflecting@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] unif_born_refl_ufm  :> UniformlyReflecting f\n; #[canonical=no, reversible=no] unif_born_refl_born :> BornologyReflecting f\n}.\nExisting Class UnifBornReflecting.\n\nRecord UnifBornInitial@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] unif_born_init_mor  :> UnifBornMorphism f\n; #[canonical=no, reversible=no] unif_born_init_refl :> UnifBornReflecting f\n}.\nExisting Class UnifBornInitial.\n\nRecord UnifBornEmbedding@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] unif_born_emb_initial :> UnifBornInitial f\n; #[canonical=no, reversible=no] unif_born_emb_inj     :> Injective f\n}.\nExisting Class UnifBornEmbedding.\n\n\n(** Locally uniformly continuous / reflecting. *)\n\nLocal Abbreviation π₁ := (tensor_proj1 _ _).\n\n(** Local uniform continuity: [f] is uniformly continuous *near* bounded\n    sets. For a bounded [K] and an entourage [W] of [Y] there is an\n    entourage [U] of [X] such that every [U]-close pair whose first point\n    lies in [K] is sent to a [W]-close pair; the second point ranges over\n    the [U]-thickening of [K], not over [K] itself. This is stronger than\n    uniform continuity *on* each bounded set (of the restriction of [f] to\n    [K]); the two agree only for a regular well-containment uniform space\n    ([RegularWCUnifSpace]: the thickening axiom together with regularity),\n    see [bounded_restrictions_local_uc]. Read contrapositively: if the\n    images [f x] and [f y] are [W]-apart, then either [x] and [y] are\n    [U]-apart or, additively, the first point [x] escapes [K] (is apart\n    from it). *)\nClass LocalUniformContinuity@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} (f:X ⇾ Y) : SProp :=\n  local_uniform_continuity (K:𝒜) (W:Ψ) : ∐ U:Φ, π₁* K ⊓ powerset_pt U ⊆ ⟨f,f⟩* W.\nArguments local_uniform_continuity {_ _ _ _ _} f {_} K W.\n\n(** The reflecting counterpart: [f] reflects the uniformity *near* bounded\n    sets of [Y]. For a bounded [L] of [Y] and an entourage [U] of [X] there\n    is an entourage [W] of [Y] such that [x] and [y] are [U]-close whenever\n    [f x] lies in [L] and [f x], [f y] are [W]-close. Again stronger than\n    reflecting on each bounded set; the two agree only for a regular\n    well-containment uniform space ([RegularWCUnifSpace]: the thickening\n    axiom together with regularity), see [bounded_restrictions_local_ur].\n    Read contrapositively: if [x] and [y] are [U]-apart, then either [f x]\n    and [f y] are [W]-apart or, additively, [f x] escapes [L]. *)\nClass LocalUniformReflection@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n  local_uniform_reflection (L:ℬ) (U:Φ) : ∐ W:Ψ, ⟨f,f⟩* (π₁* L ⊓ powerset_pt W) ⊆ U.\nArguments local_uniform_reflection {_ _ _ _ _} f {_} L U.\n\nRecord LocallyUniformlyContinuous@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] locally_uc_X :> UnifBornSpace X\n; #[canonical=no] locally_uc_Y : UniformSpace Y\n; #[canonical=no, reversible=no] locally_uc_prop :> LocalUniformContinuity f\n}.\nExisting Class LocallyUniformlyContinuous.\n\nRecord LocallyUniformlyReflecting@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {ℬ:Bornology Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] locally_ur_X :> UniformSpace X\n; #[canonical=no] locally_ur_Y : UnifBornSpace Y\n; #[canonical=no, reversible=no] locally_ur_prop :> LocalUniformReflection f\n}.\nExisting Class LocallyUniformlyReflecting.\n\nSection locally_unif_born.\n  Universes u.\n  Context {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f:X ⇾ Y).\n\n  Record LocallyUnifBorn : SProp :=\n  { #[canonical=no, reversible=no] locally_ub_uc :> LocallyUniformlyContinuous f\n  ; #[canonical=no, reversible=no] locally_ub_born :> Bornological f\n  }.\n  Existing Class LocallyUnifBorn.\n\n  Record LocallyUnifBornReflecting : SProp :=\n  { #[canonical=no, reversible=no] locally_ubr_ur :> LocallyUniformlyReflecting f\n  ; #[canonical=no, reversible=no] locally_ubr_born :> BornologyReflecting f\n  }.\n  Existing Class LocallyUnifBornReflecting.\n  \n  Record LocallyUnifBornInitial : SProp :=\n  { #[canonical=no, reversible=no] locally_ubi_ubc :> LocallyUnifBorn\n  ; #[canonical=no, reversible=no] locally_ubi_ubr :> LocallyUnifBornReflecting\n  }.\n  Existing Class LocallyUnifBornInitial.\n\n  Record LocallyUnifBornEmbedding : SProp :=\n  { #[canonical=no, reversible=no] locally_ube_ubi :> LocallyUnifBornInitial\n  ; #[canonical=no, reversible=no] locally_ube_inj :> Injective f\n  }.\n  Existing Class LocallyUnifBornEmbedding.\n  \n  (** Restriction to WCUnifSpace domains *)\n  Record WCUnifMorphism : SProp :=\n  { #[canonical=no, reversible=no] wcunif_mor_X :> WCUnifSpace X\n  ; wcunif_mor_Y : WCUnifSpace Y\n  ; #[canonical=no, reversible=no] wcunif_mor_lub :> LocallyUnifBorn\n  }.\n  Existing Class WCUnifMorphism.\n\n  Record WCUnifReflecting : SProp :=\n  { #[canonical=no, reversible=no] wcunif_rfl_X :> WCUnifSpace X\n  ; #[canonical=no] wcunif_rfl_Y : WCUnifSpace Y\n  ; #[canonical=no, reversible=no] wcunif_rfl_lubr :> LocallyUnifBornReflecting\n  }.\n  Existing Class WCUnifReflecting.\n  \n  Record WCUnifInitial : SProp :=\n  { #[canonical=no, reversible=no] wcunif_ini_mor :> WCUnifMorphism\n  ; #[canonical=no, reversible=no] wcunif_ini_rfl :> WCUnifReflecting\n  }.\n  Existing Class WCUnifInitial.\n\n  Record WCUnifEmbedding : SProp :=\n  { #[canonical=no, reversible=no] wcunif_emb_ini :> WCUnifInitial\n  ; #[canonical=no, reversible=no] wcunif_emb_inj :> Injective f\n  }.\n  Existing Class WCUnifEmbedding.  \nEnd locally_unif_born.\n\nLemma locally_ub_Y `{H:@LocallyUnifBorn X Y Φ Ψ 𝒜 ℬ f} : UnifBornSpace Y.\nProof. split; apply H. Qed.\n\nCoercion locally_unif_born_initial_born_initial `{@LocallyUnifBornInitial X Y Φ Ψ 𝒜 ℬ f} : BornologyInitial f.\nProof. now split. Qed.\n\nCoercion wcunif_ini_lub_ini  `{@WCUnifInitial X Y Φ Ψ 𝒜 ℬ f} : LocallyUnifBornInitial f.\nProof. now split. Qed.\n\nCoercion wcunif_emb_lub_emb  `{@WCUnifEmbedding X Y Φ Ψ 𝒜 ℬ f} : LocallyUnifBornEmbedding f.\nProof. now split. Qed.\n\n(** Local completeness *)\nClass LocalCompletionReflect@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}\n  (ι:X ⇾ Y) := local_completion_reflect_initial `{@WCUnifInitial X Z Φ Ξ 𝒜 𝒵 f, !Dense f} : Z ⇾ Y.\nArguments local_completion_reflect_initial {X Y Φ Ψ 𝒜 ℬ} ι {_ Z Ξ 𝒵} f {_ _}.\n\nDefinition LocalCompleteInverse@{u} (X:set@{u}) {Φ:Uniformity X} {𝒜:Bornology X} := LocalCompletionReflect (id_fun X).\nExisting Class LocalCompleteInverse.\nIdentity Coercio ctive.topology.interfaces.unif_born","name":"wcunif_mor_Y","kind":"proj","local":true},{"s":17792,"e":17804,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_mor_Y","kind":"proj","local":true},{"s":17728,"e":17740,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_rfl_Y","kind":"proj","local":true},{"s":17661,"e":17673,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_mor_Y","kind":"proj","local":true},{"s":17596,"e":17608,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"locally_ur_Y","kind":"proj","local":true},{"s":17521,"e":17533,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"locally_ur_Y","kind":"proj","local":true},{"s":17448,"e":17460,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"locally_ur_Y","kind":"proj","local":true},{"s":17372,"e":17384,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"locally_ur_Y","kind":"proj","local":true},{"s":17292,"e":17304,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"locally_ub_Y","kind":"thm","local":true},{"s":17932,"e":17943,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"WCUnifSpace","kind":"class","local":true},{"s":17977,"e":17991,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"WCUnifMorphism","kind":"class","local":true},{"s":18042,"e":18058,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"WCUnifReflecting","kind":"class","local":true},{"s":18109,"e":18122,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"WCUnifInitial","kind":"class","local":true},{"s":18173,"e":18188,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"WCUnifEmbedding","kind":"class","local":true},{"s":18239,"e":18254,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"LocalCompletion","kind":"class","local":true},{"s":18279,"e":18291,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_mor_Y","kind":"proj","local":true},{"s":18213,"e":18225,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_mor_Y","kind":"proj","local":true},{"s":18147,"e":18159,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_mor_Y","kind":"proj","local":true},{"s":18083,"e":18095,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_rfl_Y","kind":"proj","local":true},{"s":18016,"e":18028,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_mor_Y","kind":"proj","local":true},{"s":11034,"e":11037,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11148,"e":11151,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11266,"e":11269,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file sets up uniform spaces that also carry a bornology. It starts from the bare pairing [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], with no axiom relating the two structures, adds the thickening axiom [[AffineConstructive.topology.interfaces.unif_born.UniformlyOpenBornology]] to obtain the well-containment uniform spaces [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]] and their regular variant [[AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace]], and defines the well-containment relation K ⋐ S. It then gives product certificates and the morphism classes, forward, reflecting, initial and embedding, both in the global form (uniform and bornological at once) and in the local form, where uniform continuity or reflection is asked only near bounded sets ([[AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity]], [[AffineConstructive.topology.interfaces.unif_born.LocalUniformReflection]]). It ends with the interface of a local completion, [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]], and of a locally complete space, which the localization and the trapped completion later realise.","short":"Uniform spaces with a bornology: well-containment spaces, local morphisms, local completions","items":[{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornSpace","base":"UnifBornSpace","kind":"rec","start":2,"body":null,"status":"ok","short":{"text":"A set with a uniformity and a bornology, each satisfying its own axioms, with nothing linking them","status":"ok"},"long":{"text":"A set X with a uniformity Φ and a bornology 𝒜, each satisfying its own axioms: X is a [[AffineConstructive.topology.interfaces.uniform.UniformSpace]] and a [[AffineConstructive.topology.interfaces.bornology.BornologicalSpace]], and nothing else is assumed. It is the fibre product of uniform spaces and bornological spaces over the underlying set.\n\nThe classes that matter refine it with axioms relating the entourages to the bounded subsets. The main one is [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]], the well-containment uniform spaces, which adds that every bounded subset has a bounded entourage thickening. Keeping the bare pairing as its own class lets the morphism classes of this file, such as [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyContinuous]] and [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyReflecting]], require of their domain or codomain only that it carry both structures.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_unif","base":"unif_born_unif","kind":"proj","short":{"text":"The uniform space structure of a set with a uniformity and a bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_born","base":"unif_born_born","kind":"proj","short":{"text":"The bornological space structure of a set with a uniformity and a bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornSpace","base":"Build_UnifBornSpace","kind":"constr","short":{"text":"Builds a uniform bornological space from a uniform space and a bornological space on the same set","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UniformlyOpenBornology","base":"UniformlyOpenBornology","kind":"ind","start":9,"body":null,"status":"ok","short":{"text":"The bornology is uniformly open: every bounded subset has a bounded entourage thickening","status":"ok"},"long":{"text":"The axiom that ties a bornology to a uniformity on the same set. For every bounded subset A there is an entourage U whose thickening U.[A] is again bounded. U.[A] is the set of points U-close to some point of A. A ranges over the members of the bornology with the base-logic quantifier. The witness U is given by the affine existential, so the axiom also has a dual reading: it is not the case that every entourage thickens A to a set apart from the bounded ones.\n\nTogether with the separate axioms of a uniform space and of a bornological space, this condition defines a well-containment uniform space, [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]]; it is the only axiom there that involves both structures. A bounded set can always be enlarged by some entourage and stay bounded. The proofs that use [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]] depend on this. [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_unif_open_born]] proves that the trapped completion satisfies it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.UniformlyOpenBornology","base":"UniformlyOpenBornology","kind":"rec","short":{"text":"The class asserting that each bounded subset has a bounded entourage thickening","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_thicken","base":"wcunif_thicken","kind":"proj","short":{"text":"For a bounded A, there is an entourage U with U.[A] bounded","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifSpace","base":"WCUnifSpace","kind":"rec","start":11,"body":null,"status":"ok","short":{"text":"A well-containment uniform space: uniformity and bornology, every bounded set having a bounded uniform thickening","status":"ok"},"long":{"text":"A well-containment uniform space. X carries a uniformity and a bornology, each satisfying its own axioms, so that X is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]]. One axiom joins the two structures, [[AffineConstructive.topology.interfaces.unif_born.UniformlyOpenBornology]]: for every bounded subset A there is an entourage U whose thickening U.[A], the set of points U-close to a point of A, is again bounded. Bounded sets can therefore be enlarged by a uniform margin without leaving the bornology, which is what makes the well-containment relation K ⋐ S of [[AffineConstructive.topology.interfaces.unif_born.well_contained]] (K bounded and uniformly below S) a workable substitute for compact containment.\n\nThese are the spaces in which the local theory is set. The local morphisms [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]], locally uniformly continuous and bornological, ask for well-containment spaces at both ends, and [[AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace]] strengthens the class by asking the uniformity and the bornology to be regular. An example is the pullback of a well-containment uniform space along any map, [[AffineConstructive.topology.unif_born.subspace.pullback_wc_unif_space]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_unif_born","base":"wcunif_unif_born","kind":"proj","short":{"text":"The uniform space with bornology underlying a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_unif_open_born","base":"wcunif_unif_open_born","kind":"proj","short":{"text":"The thickening axiom of a well-containment uniform space: bounded sets have bounded uniform thickenings","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifSpace","base":"Build_WCUnifSpace","kind":"constr","short":{"text":"Builds a well-containment uniform space from a uniform space with bornology and the thickening axiom","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace","base":"RegularWCUnifSpace","kind":"rec","start":13,"body":null,"status":"ok","short":{"text":"A well-containment uniform space whose uniformity and bornology are both regular","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]] that is also a [[AffineConstructive.topology.interfaces.uniform.RegularUniformSpace]] and a [[AffineConstructive.topology.interfaces.bornology.RegularBornologicalSpace]]. Regularity is stated in cover form, once for each structure. For the uniformity the witness is an inner entourage and the variance is that of a filter. For the bornology the witness is an outer bounded set and the variance is that of an ideal. The three conditions form one record, so a regular well-containment space reaches each weaker structure through its coercions.\n\nThis is the hypothesis under which local uniform behaviour can be read off from the bounded subsets. On a regular well-containment space, a map that is uniformly continuous on each bounded subset is locally uniformly continuous ([[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_uc]]). Into one, a map that reflects the uniformity over each bounded subset is locally uniformly reflecting ([[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_ur]]). Without regularity, the condition on bounded subsets is weaker than the local one.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.regular_wcunif_wc","base":"regular_wcunif_wc","kind":"proj","short":{"text":"The underlying well-containment uniform space of a regular one","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.regular_wcunif_regular_unif","base":"regular_wcunif_regular_unif","kind":"proj","short":{"text":"The regularity of the uniformity of a regular well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.regular_wcunif_regular_born","base":"regular_wcunif_regular_born","kind":"proj","short":{"text":"The regularity of the bornology of a regular well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_RegularWCUnifSpace","base":"Build_RegularWCUnifSpace","kind":"constr","short":{"text":"Builds a regular well-containment space from a well-containment space and both regularities","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.well_contained","base":"well_contained","kind":"def","start":15,"body":null,"status":"ok","short":{"text":"The well-containment relation K ⋐ S: K bounded and S a uniform neighbourhood of K","status":"ok"},"long":{"text":"The relation K ⋐ S, this development's counterpart of the classical compact containment K ⊂⊂ S. It relates a bounded subset K to a subset S of X, and holds when K ◁ S: S contains the thickening of K by some entourage, so that S is a uniform neighbourhood of K. It has two legs. The bounded leg is built into the type of K, which ranges over the bornology. The uniform leg is the condition that defines the relation. When the bornology is that of precompact subsets, the bounded leg is precompactness and the relation is the classical one.\n\nThe relation is a subset of 𝒜 ⊗ 𝒫 X, the tensor product of the bounded subsets with the powerset. It is therefore an affine relation, read at once as a proof of containment and as a refutation. The notation K ⋐ S applies it to the pair (K, S).\n\nThe file [[AffineConstructive.topology.interfaces.unif_born.well_contained]] proves its basic instances. The empty bounded subset is well contained in every subset ([[AffineConstructive.topology.unif_born.well_contained.wc_empty]]). Every bounded subset is well contained in the whole set ([[AffineConstructive.topology.unif_born.well_contained.wc_top]]). If K ⋐ S, then K is well contained in the interior of S ([[AffineConstructive.topology.unif_born.well_contained.wc_int_r]]). The same file shows that shrinking K or enlarging S preserves the relation ([[AffineConstructive.topology.unif_born.well_contained.wc_le_l]], [[AffineConstructive.topology.unif_born.well_contained.wc_le_r]]). It is closed under joins on the left ([[AffineConstructive.topology.unif_born.well_contained.wc_join]]) and under meets on the right ([[AffineConstructive.topology.unif_born.well_contained.wc_meet]]). The relation is also used in the treatment of open immersions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.TensorProductUnifBorn","base":"TensorProductUnifBorn","kind":"rec","start":17,"body":null,"status":"ok","short":{"text":"Ξ and 𝒞 are the tensor product uniformity and bornology on X ⊗ Y","status":"ok"},"long":{"text":"A certificate that a uniformity Ξ and a bornology 𝒞 on the tensor product X ⊗ Y form the product structure of the two factors. It consists of a [[AffineConstructive.topology.interfaces.uniform.TensorProductUniformity]] certificate for Ξ and a [[AffineConstructive.topology.interfaces.bornology.TensorProductBornology]] certificate for 𝒞. Neither half constrains the other, in the same way that [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]] pairs its two structures.\n\nInstance resolution builds the certificate from its halves. Each half is found by the hints of its own interface file.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.tensor_product_unif_born_unif","base":"tensor_product_unif_born_unif","kind":"proj","short":{"text":"The uniformity half: Ξ is the tensor product uniformity","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.tensor_product_unif_born_born","base":"tensor_product_unif_born_born","kind":"proj","short":{"text":"The bornology half: 𝒞 is the tensor product bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_TensorProductUnifBorn","base":"Build_TensorProductUnifBorn","kind":"constr","short":{"text":"Builds the tensor product certificate from its uniform and bornological halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.CartesianProductUnifBorn","base":"CartesianProductUnifBorn","kind":"rec","start":20,"body":null,"status":"ok","short":{"text":"Ξ and 𝒞 are the cartesian product uniformity and bornology on X × Y","status":"ok"},"long":{"text":"The cartesian counterpart of [[AffineConstructive.topology.interfaces.unif_born.TensorProductUnifBorn]]. Here the product carrier X × Y carries the additive equality. The certificate consists of a [[AffineConstructive.topology.interfaces.uniform.CartesianProductUniformity]] certificate for Ξ and a [[AffineConstructive.topology.interfaces.bornology.CartesianProductBornology]] certificate for 𝒞, and instance resolution builds it from these two halves.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.cartesian_product_unif_born_unif","base":"cartesian_product_unif_born_unif","kind":"proj","short":{"text":"The uniformity half: Ξ is the cartesian product uniformity","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.cartesian_product_unif_born_born","base":"cartesian_product_unif_born_born","kind":"proj","short":{"text":"The bornology half: 𝒞 is the cartesian product bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_CartesianProductUnifBorn","base":"Build_CartesianProductUnifBorn","kind":"constr","short":{"text":"Builds the cartesian product certificate from its uniform and bornological halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism","base":"UnifBornMorphism","kind":"rec","start":23,"body":null,"status":"ok","short":{"text":"A map that is uniformly continuous and bornological","status":"ok"},"long":{"text":"The forward class of maps between uniform spaces with bornologies. The map is [[AffineConstructive.topology.interfaces.uniform.UniformlyContinuous]], and it is [[AffineConstructive.topology.interfaces.bornology.Bornological]], meaning that it sends bounded sets to bounded sets. It is the diagonal of the two forward classes.\n\nEach condition remains a record of its own, so mixed variants can still be stated. An open immersion is one example: it is uniformly initial but only forward-bornological.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_mor_cont","base":"unif_born_mor_cont","kind":"proj","short":{"text":"A morphism of uniform spaces with bornologies is uniformly continuous","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_mor_born","base":"unif_born_mor_born","kind":"proj","short":{"text":"A morphism of uniform spaces with bornologies is bornological","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornMorphism","base":"Build_UnifBornMorphism","kind":"constr","short":{"text":"Builds a morphism from uniform continuity and bornologicity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting","base":"UnifBornReflecting","kind":"rec","start":25,"body":null,"status":"ok","short":{"text":"A map that is uniformly reflecting and bornology-reflecting","status":"ok"},"long":{"text":"The reflecting class: the comparison runs from the codomain back to the domain. The map is [[AffineConstructive.topology.interfaces.uniform.UniformlyReflecting]], so every entourage of the domain contains the pullback of some entourage of the codomain. It is also [[AffineConstructive.topology.interfaces.bornology.BornologyReflecting]], so the preimage of a bounded set is bounded.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_refl_ufm","base":"unif_born_refl_ufm","kind":"proj","short":{"text":"A reflecting map is uniformly reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_refl_born","base":"unif_born_refl_born","kind":"proj","short":{"text":"A reflecting map is bornology-reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornReflecting","base":"Build_UnifBornReflecting","kind":"constr","short":{"text":"Builds a reflecting map from its uniform and bornological reflection","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornInitial","base":"UnifBornInitial","kind":"rec","start":27,"body":null,"status":"ok","short":{"text":"A map that is both a morphism and reflecting, for uniformity and bornology","status":"ok"},"long":{"text":"An initial map: it is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]] and also [[AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting]]. The uniformity and the bornology of the domain are then exactly those induced from the codomain along the map. This is the forward and reflecting halves of the reflection pair taken together.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_init_mor","base":"unif_born_init_mor","kind":"proj","short":{"text":"An initial map is a morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_init_refl","base":"unif_born_init_refl","kind":"proj","short":{"text":"An initial map is reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornInitial","base":"Build_UnifBornInitial","kind":"constr","short":{"text":"Builds an initial map from its forward and reflecting halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornEmbedding","base":"UnifBornEmbedding","kind":"rec","start":29,"body":null,"status":"ok","short":{"text":"An embedding of uniform spaces with bornologies: initial and injective","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.UnifBornInitial]] map that is also [[AffineConstructive.interfaces.set.Injective]]. Up to the induced structure, it identifies its domain with a subspace of its codomain. Injectivity is the affine notion: the map preserves equality and reflects it, so it also preserves apartness.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_emb_initial","base":"unif_born_emb_initial","kind":"proj","short":{"text":"An embedding is initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_emb_inj","base":"unif_born_emb_inj","kind":"proj","short":{"text":"An embedding is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornEmbedding","base":"Build_UnifBornEmbedding","kind":"constr","short":{"text":"Builds an embedding from an initial map and injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.π₁","base":"π₁","kind":"abbrev","start":31,"body":null,"status":"ok","short":{"text":"Local shorthand for the first projection of the tensor product X ⊗ X","status":"ok"},"long":{"text":"An abbreviation used inside this file. It stands for the first projection out of the tensor square. The local conditions use it to restrict an entourage to the pairs whose first point lies in a given bounded set: the restriction of U to K is π₁* K ⊓ U.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity","base":"LocalUniformContinuity","kind":"ind","start":32,"body":null,"status":"ok","short":{"text":"f is uniformly continuous near bounded sets: close pairs starting in a bounded K have close images","status":"ok"},"long":{"text":"A map f from a set X with a uniformity and a bornology to a set Y with a uniformity is locally uniformly continuous when, for every bounded K of X and every entourage W of Y, there is an entourage U of X such that every U-close pair whose first point lies in K is sent by f to a W-close pair. The pairs are restricted by a meet, the additive conjunction, of the preimage of K under the first projection with U. Only the first point is required to lie in K. The second point ranges over the U-thickening of K, so the condition controls f *near* K and not only on K. The entourage U depends on both K and W. This is the uniform part of the morphisms of well-containment uniform spaces.\n\nThe condition is stronger than uniform continuity of the restriction of f to each bounded set. The two agree for a regular well-containment uniform space ([[AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace]]: the thickening axiom together with regularity), by [[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_uc]]. Because the inclusion is affine, it carries its contrapositive: if f x and f y are W-apart, then either x and y are U-apart or x is apart from K. The choice between the two is the additive one given by the meet.\n\nThe class carries the bare condition and asks for no axioms on X or Y. [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyContinuous]] bundles it with the requirement that X is a uniform space with a bornology and that Y is a uniform space, and [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]] adds that f is bornological.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity","base":"LocalUniformContinuity","kind":"rec","short":{"text":"The class of maps uniformly continuous near every bounded subset of the domain","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_uniform_continuity","base":"local_uniform_continuity","kind":"proj","short":{"text":"For bounded K and entourage W, an entourage U whose pairs starting in K have W-close images","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalUniformReflection","base":"LocalUniformReflection","kind":"ind","start":34,"body":null,"status":"ok","short":{"text":"f reflects the uniformity near bounded sets of Y: closeness of images starting in L gives closeness","status":"ok"},"long":{"text":"The reflecting counterpart of [[AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity]]. Here the bornology is on the codomain. A map f from X to Y, both with uniformities and Y with a bornology, reflects the uniformity locally when, for every bounded L of Y and every entourage U of X, there is an entourage W of Y such that x and y are U-close whenever f x lies in L and f x, f y are W-close. As in the forward class, the restriction is a meet, the additive conjunction, with the preimage of L under the first projection. Only the first image point must lie in L, so the control holds near L and not only on it.\n\nThe condition is stronger than reflecting the uniformity on each bounded set. The two agree for a regular well-containment uniform space ([[AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace]]), by [[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_ur]]. Read contrapositively: if x and y are U-apart, then either f x and f y are W-apart or f x is apart from L.\n\nThe class carries the bare condition. [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyReflecting]] bundles it with the requirement that X is a uniform space and Y a uniform space with a bornology. [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting]] adds that f reflects the bornology. Together with the forward classes these make up the initial maps and embeddings of well-containment uniform spaces.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.LocalUniformReflection","base":"LocalUniformReflection","kind":"rec","short":{"text":"The class of maps reflecting the uniformity near every bounded subset of the codomain","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_uniform_reflection","base":"local_uniform_reflection","kind":"proj","short":{"text":"For bounded L and entourage U, an entourage W such that W-close images starting in L come from U-close pairs","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyContinuous","base":"LocallyUniformlyContinuous","kind":"rec","start":36,"body":null,"status":"ok","short":{"text":"A locally uniformly continuous map: uniformly continuous near bounded sets of the domain","status":"ok"},"long":{"text":"The class of locally uniformly continuous maps. The domain is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], a uniform space carrying a bornology, the codomain is a uniform space, and the map satisfies [[AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity]]: it is uniformly continuous near bounded sets, meaning that close pairs with their first point in a bounded set are sent to close pairs, with the closeness of the domain chosen according to the bounded set and the entourage of the codomain.\n\nIt is the local analogue of [[AffineConstructive.topology.interfaces.uniform.UniformlyContinuous]], and the uniform leg of the local forward classes [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]] and [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]]. The codomain's uniform structure is kept as a field so that it can be recovered from the map; it is not a coercion, and resolution finds it from a hypothesis that the map is locally uniformly continuous.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_uc_X","base":"locally_uc_X","kind":"proj","short":{"text":"The domain of a locally uniformly continuous map is a uniform space with a bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_uc_Y","base":"locally_uc_Y","kind":"proj","short":{"text":"The codomain of a locally uniformly continuous map is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_uc_prop","base":"locally_uc_prop","kind":"proj","short":{"text":"The local uniform continuity of a locally uniformly continuous map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUniformlyContinuous","base":"Build_LocallyUniformlyContinuous","kind":"constr","short":{"text":"Builds a locally uniformly continuous map from the two space structures and local uniform continuity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyReflecting","base":"LocallyUniformlyReflecting","kind":"rec","start":38,"body":null,"status":"ok","short":{"text":"A locally uniformly reflecting map from a uniform space to one with a bornology","status":"ok"},"long":{"text":"The packaged reflecting class. The domain is a [[AffineConstructive.topology.interfaces.uniform.UniformSpace]], the codomain is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], and the map satisfies [[AffineConstructive.topology.interfaces.unif_born.LocalUniformReflection]]. Here it is the codomain that needs a bornology, since the reflection localises at its bounded sets.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ur_X","base":"locally_ur_X","kind":"proj","short":{"text":"The domain of a locally uniformly reflecting map is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ur_Y","base":"locally_ur_Y","kind":"proj","short":{"text":"The codomain of a locally uniformly reflecting map is a uniform space with bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ur_prop","base":"locally_ur_prop","kind":"proj","short":{"text":"A locally uniformly reflecting map reflects the uniformity over bounded sets","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUniformlyReflecting","base":"Build_LocallyUniformlyReflecting","kind":"constr","short":{"text":"Builds a locally uniformly reflecting map from the two space structures and the local condition","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn","base":"LocallyUnifBorn","kind":"rec","start":43,"body":null,"status":"ok","short":{"text":"A map that is locally uniformly continuous and bornological","status":"ok"},"long":{"text":"The local forward class for uniform spaces with a bornology: the map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyContinuous]], that is, uniformly continuous near bounded sets, and [[AffineConstructive.topology.interfaces.bornology.Bornological]], sending bounded sets to bounded sets. It is the local analogue of [[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]], with uniform continuity weakened to uniform continuity near bounded sets.\n\nBecause the map is bornological, its codomain carries a bornology as well as a uniformity and is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], as [[AffineConstructive.topology.interfaces.unif_born.locally_ub_Y]] records. Together with [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting]] it makes up the local initial maps [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornInitial]], and over well-containment uniform spaces it is the map part of [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ub_uc","base":"locally_ub_uc","kind":"proj","short":{"text":"The local uniform continuity of a locally uniformly continuous bornological map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ub_born","base":"locally_ub_born","kind":"proj","short":{"text":"A locally uniformly continuous bornological map is bornological","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUnifBorn","base":"Build_LocallyUnifBorn","kind":"constr","short":{"text":"Builds a locally uniformly continuous bornological map from its two legs","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting","base":"LocallyUnifBornReflecting","kind":"rec","start":45,"body":null,"status":"ok","short":{"text":"A map that is locally uniformly reflecting and bornology-reflecting","status":"ok"},"long":{"text":"The local reflecting class. The map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyReflecting]] and [[AffineConstructive.topology.interfaces.bornology.BornologyReflecting]]. It is the local analogue of [[AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ubr_ur","base":"locally_ubr_ur","kind":"proj","short":{"text":"A locally reflecting map is locally uniformly reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ubr_born","base":"locally_ubr_born","kind":"proj","short":{"text":"A locally reflecting map is bornology-reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUnifBornReflecting","base":"Build_LocallyUnifBornReflecting","kind":"constr","short":{"text":"Builds a locally reflecting map from local uniform reflection and bornology reflection","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornInitial","base":"LocallyUnifBornInitial","kind":"rec","start":47,"body":null,"status":"ok","short":{"text":"A locally initial map: a local morphism that is also locally reflecting","status":"ok"},"long":{"text":"The local initial class. The map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]] and also [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting]]. On each bounded region the uniformity of the domain is the one induced from the codomain, and the bornology of the domain is exactly the one induced from the codomain.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ubi_ubc","base":"locally_ubi_ubc","kind":"proj","short":{"text":"A locally initial map is a local morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ubi_ubr","base":"locally_ubi_ubr","kind":"proj","short":{"text":"A locally initial map is locally reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUnifBornInitial","base":"Build_LocallyUnifBornInitial","kind":"constr","short":{"text":"Builds a locally initial map from its forward and reflecting halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornEmbedding","base":"LocallyUnifBornEmbedding","kind":"rec","start":49,"body":null,"status":"ok","short":{"text":"A local embedding: locally initial and injective","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornInitial]] map that is also [[AffineConstructive.interfaces.set.Injective]]. It is the local analogue of [[AffineConstructive.topology.interfaces.unif_born.UnifBornEmbedding]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ube_ubi","base":"locally_ube_ubi","kind":"proj","short":{"text":"A local embedding is locally initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ube_inj","base":"locally_ube_inj","kind":"proj","short":{"text":"A local embedding is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUnifBornEmbedding","base":"Build_LocallyUnifBornEmbedding","kind":"constr","short":{"text":"Builds a local embedding from a locally initial map and injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism","base":"WCUnifMorphism","kind":"rec","start":51,"body":null,"status":"ok","short":{"text":"A morphism of well-containment uniform spaces: locally uniformly continuous and bornological","status":"ok"},"long":{"text":"The morphisms of well-containment uniform spaces. The domain and the codomain are both [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]]s, uniform spaces with a bornology whose bounded sets have bounded uniform thickenings, and the map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]]: it is bornological and uniformly continuous near bounded sets, so that for each bounded K and each entourage of the codomain an entourage of the domain controls every close pair with its first point in K.\n\nThe codomain's structure is a field but not a coercion; resolution recovers it from the map. These are the maps of which [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] and [[AffineConstructive.topology.interfaces.unif_born.WCUnifEmbedding]] are the initial and injective refinements, and the maps in terms of which [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]] is stated.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_mor_X","base":"wcunif_mor_X","kind":"proj","short":{"text":"The domain of a well-containment morphism is a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_mor_Y","base":"wcunif_mor_Y","kind":"proj","short":{"text":"The codomain of a well-containment morphism is a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_mor_lub","base":"wcunif_mor_lub","kind":"proj","short":{"text":"A well-containment morphism is locally uniformly continuous and bornological","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifMorphism","base":"Build_WCUnifMorphism","kind":"constr","short":{"text":"Builds a well-containment morphism from the two spaces and the local forward property of the map","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifReflecting","base":"WCUnifReflecting","kind":"rec","start":53,"body":null,"status":"ok","short":{"text":"A locally reflecting map between well-containment uniform spaces","status":"ok"},"long":{"text":"The reflecting class between well-containment uniform spaces. Both ends are [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]]s, and the map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_rfl_X","base":"wcunif_rfl_X","kind":"proj","short":{"text":"The domain of a reflecting map of well-containment spaces is one","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_rfl_Y","base":"wcunif_rfl_Y","kind":"proj","short":{"text":"The codomain of a reflecting map of well-containment spaces is one","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_rfl_lubr","base":"wcunif_rfl_lubr","kind":"proj","short":{"text":"A reflecting map of well-containment spaces is locally reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifReflecting","base":"Build_WCUnifReflecting","kind":"constr","short":{"text":"Builds a reflecting map of well-containment spaces from the two spaces and local reflection","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifInitial","base":"WCUnifInitial","kind":"rec","start":55,"body":null,"status":"ok","short":{"text":"An initial map of well-containment uniform spaces: morphism and reflecting","status":"ok"},"long":{"text":"A map between well-containment uniform spaces that is both a [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]] and [[AffineConstructive.topology.interfaces.unif_born.WCUnifReflecting]]. The structure of the domain is then induced locally from the codomain. Together with density, these maps are the extensions that a local completion classifies: [[AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial]] is defined for the initial dense maps.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_ini_mor","base":"wcunif_ini_mor","kind":"proj","short":{"text":"An initial map of well-containment spaces is a morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_ini_rfl","base":"wcunif_ini_rfl","kind":"proj","short":{"text":"An initial map of well-containment spaces is reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifInitial","base":"Build_WCUnifInitial","kind":"constr","short":{"text":"Builds an initial map of well-containment spaces from its forward and reflecting halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifEmbedding","base":"WCUnifEmbedding","kind":"rec","start":57,"body":null,"status":"ok","short":{"text":"An embedding of well-containment uniform spaces: initial and injective","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] map that is [[AffineConstructive.interfaces.set.Injective]]. It identifies a well-containment uniform space with a subspace of another one, with the uniformity and bornology of the subspace induced locally.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_emb_ini","base":"wcunif_emb_ini","kind":"proj","short":{"text":"An embedding of well-containment spaces is initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_emb_inj","base":"wcunif_emb_inj","kind":"proj","short":{"text":"An embedding of well-containment spaces is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifEmbedding","base":"Build_WCUnifEmbedding","kind":"constr","short":{"text":"Builds an embedding of well-containment spaces from an initial map and injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ub_Y","base":"locally_ub_Y","kind":"prf","start":60,"body":[61,63],"status":"ok","short":{"text":"The codomain of a local morphism is a uniform space with a bornology","status":"ok"},"proof":[{"text":"A uniform space with a bornology is a pair of a uniformity and a bornology on Y. The hypothesis that f is a local morphism already includes both of them, so each component comes from it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_unif_born_initial_born_initial","base":"locally_unif_born_initial_born_initial","kind":"def","start":64,"body":[65,67],"status":"ok","short":{"text":"A locally initial map is bornologically initial","status":"ok"},"proof":[{"text":"A locally initial map is bornological and bornologically reflecting. Those two conditions together are what [[AffineConstructive.topology.interfaces.bornology.BornologyInitial]] requires, so the goal splits into them and each comes directly from the hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_ini_lub_ini","base":"wcunif_ini_lub_ini","kind":"def","start":68,"body":[69,71],"status":"ok","short":{"text":"An initial map of well-containment spaces is locally initial","status":"ok"},"proof":[{"text":"Split being locally initial into its components, the local forward condition and the local reflecting condition. Each one follows from the corresponding global condition in the hypothesis that f is initial. A map that controls every close pair also controls the close pairs with one point in a bounded set, so a uniformly continuous or reflecting map is in particular one near bounded sets.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_emb_lub_emb","base":"wcunif_emb_lub_emb","kind":"def","start":72,"body":[73,75],"status":"ok","short":{"text":"An embedding of well-containment spaces is a local embedding","status":"ok"},"proof":[{"text":"A local embedding is a locally initial map that is also injective. Split the goal into these two parts. The first follows from [[AffineConstructive.topology.interfaces.unif_born.wcunif_ini_lub_ini]] applied to the initial map underlying the embedding, and the injectivity of f comes directly from the hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect","base":"LocalCompletionReflect","kind":"ind","start":76,"body":null,"status":"ok","short":{"text":"The data of a local completion: a map into Y from each dense initial extension of X","status":"ok"},"long":{"text":"The operation part of the universal property of a local completion ι : X → Y. Suppose f : X → Z is a [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] map with [[AffineConstructive.topology.interfaces.topology.Dense]] range. Then the operation supplies a map from Z to Y. The class lives in Type rather than SProp, because it carries a function, not only a proof.\n\nIntuitively, Y is a maximal dense extension of X: every other dense initial extension maps into it. The laws that make this a universal property, namely that the map is a morphism and lies over X, are stated in [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]].\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, dashed] \\\\\n & Y\n```","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect","base":"LocalCompletionReflect","kind":"rec","short":{"text":"The class of the local-completion operation on a map ι from X to Y","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial","base":"local_completion_reflect_initial","kind":"proj","short":{"text":"The map into Y induced by a dense initial map out of X","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse","base":"LocalCompleteInverse","kind":"def","start":78,"body":null,"status":"ok","short":{"text":"The local-completion operation for the identity of X: retractions of dense initial extensions","status":"ok"},"long":{"text":"The case of [[AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect]] in which ι is the identity of X. For every dense [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] map f : X → Z, it supplies a map from Z back to X. When the laws hold, this map is a retraction of f. It is the data underlying [[AffineConstructive.topology.interfaces.unif_born.LocallyComplete]], and instance resolution recognises an instance for the identity as an instance of this class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse_Reflect","base":"LocalCompleteInverse_Reflect","kind":"inst","start":80,"body":null,"status":"ok","short":{"text":"A local-completeness inverse on X is local-completion data for the identity of X","status":"ok"},"long":{"text":"[[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] X is, by definition, [[AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect]] at the identity of X. This means it gives a map Z ⇾ X back from every dense initial well-containment extension f of X. This coercion lets the general statements about [[AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect]] and [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]] apply to it, which is how local completeness ([[AffineConstructive.topology.interfaces.unif_born.LocallyComplete]]) becomes the case ι = identity of a local completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompletion","base":"LocalCompletion","kind":"rec","start":82,"body":null,"status":"ok","short":{"text":"ι : X ⇾ Y is a local completion: every dense well-containment initial extension of X maps to Y","status":"ok"},"long":{"text":"The universal property of the local completion. The data, from [[AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect]], is a map r : Z ⇾ Y for every [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] and [[AffineConstructive.topology.interfaces.topology.Dense]] map f : X ⇾ Z. The property requires that Y be a [[AffineConstructive.topology.interfaces.uniform.SeparatedUniformSpace]], that ι itself be well-containment initial and dense, and that each r be a [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]] with r ∘ f = ι.\n\nThis is the local analogue of the Cauchy completion. It is not stated as an extension property for maps out of X; instead every dense initial extension of X maps into Y over X, so Y is the largest such extension. The maps r are only required to be bornological and uniformly continuous near bounded sets, so completeness is asked for near bounded sets and not at infinity. When ι is the identity the property is local completeness, [[AffineConstructive.topology.interfaces.unif_born.LocallyComplete]].\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"r\"] \\\\\n & Y\n```","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_separated","base":"local_completion_separated","kind":"proj","short":{"text":"The codomain of a local completion is a separated uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_initial","base":"local_completion_initial","kind":"proj","short":{"text":"A local completion is well-containment initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_dense","base":"local_completion_dense","kind":"proj","short":{"text":"A local completion has dense range","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial_mor","base":"local_completion_reflect_initial_mor","kind":"proj","short":{"text":"The comparison map from a dense initial extension is a well-containment morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial_spec","base":"local_completion_reflect_initial_spec","kind":"proj","short":{"text":"The comparison map r from a dense initial extension f satisfies r ∘ f = ι","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocalCompletion","base":"Build_LocalCompletion","kind":"constr","short":{"text":"Builds a local completion from separation, initiality, density and the comparison maps' properties","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.coercion:local_completion_separated","base":"coercion:local_completion_separated","kind":"coercion","start":85,"body":null,"status":"ok","short":{"text":"A local completion reaches the fact that its codomain is a separated uniform space","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.coercion:local_completion_initial","base":"coercion:local_completion_initial","kind":"coercion","start":86,"body":null,"status":"ok","short":{"text":"A local completion counts as well-containment initial, so the facts about such maps apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.coercion:local_completion_dense","base":"coercion:local_completion_dense","kind":"coercion","start":87,"body":null,"status":"ok","short":{"text":"A local completion counts as dense, so the facts about dense maps apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyComplete","base":"LocallyComplete","kind":"def","start":93,"body":null,"status":"ok","short":{"text":"X is locally complete: the identity of X is a local completion","status":"ok"},"long":{"text":"A well-containment uniform space is locally complete when its identity map is a [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]]. Concretely, three things hold. X is separated. For every dense initial map f : X → Z, the map Z → X given by [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] is a morphism of well-containment spaces. Composed with f, that map is the identity. So every dense initial extension of X retracts onto X, and X has no proper dense local extensions. This is the local analogue of completeness.","status":"ok"},"proof":[]}],"diagrams":{"svg":{"\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, dashed] \\\\\n & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='62.077pt' height='52.834pt' viewBox='0 0 62.077 52.834'>\n<defs>\n<path id='g1-1' d='M.80852-1.44976C.73882-1.22672 .51578-.71791 .51578-.52275C.51578-.24395 .73185 .0697 1.19884 .0697C1.51249 .0697 1.86796-.05576 2.15373-.28577C2.54405-.60639 2.60678-.9 74139C52.83195 34.21703 52.09863 35.27694 51.79667 36.34481C51.49471 35.27694 50.76139 34.21703 49.20841 33.74139' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 52.834)'>\n<use x='54.110499' y='-23.541166' xlink:href='#g1-3'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.topology.interfaces.uniform":{"page":"uniform.html","short":"Uniform spaces: entourages, axioms, uniform maps, Cauchy filters, completions","summary":"The file sets up the interface of uniform spaces. A uniformity is a set of relations on X ⊗ X, the entourages; the file reads an entourage as closeness ([[near]]), forms thickenings of subsets and the relation \\\"K ◁ S\\\" (S is a uniform neighbourhood of K), and states the axioms in layers: the pre-uniform axioms, uniform spaces as filters of entourages, and the strong, separated and regular variants with their combinations. It derives the neighbourhood relation of the uniform topology ([[UniformNeighborhood]]), names presentations and bases of uniformities, the tensor and cartesian product, discrete and indiscrete uniformities, and defines the classes of maps: uniformly continuous, uniformly reflecting, uniformly initial and uniform embeddings. It closes with Cauchy filters and the universal property of a completion: a separated space receiving X by a dense, uniformly initial map, with a uniformly continuous comparison map from every other such extension of X, which also defines complete uniform spaces. The theory of these notions is developed in the files under topology/uniform and topology/unif_born."},"AffineConstructive.topology.interfaces.bornology":{"page":"bornology.html","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization."}},"constants":null}</script>

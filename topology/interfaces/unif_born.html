"e":8213,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":13391,"e":13394,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":13505,"e":13508,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":13623,"e":13626,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":20508,"e":20511,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":20615,"e":20618,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The interface for sets carrying both a uniformity and a bornology. It sets up the chassis [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], with no axiom linking the two structures, and then the linking axioms: [[AffineConstructive.topology.interfaces.unif_born.UniformlyOpenBornology]] (bounded sets have bounded uniform thickenings), which defines the well-containment uniform spaces [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]] and their regular form [[AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace]], [[AffineConstructive.topology.interfaces.unif_born.ClosedBornology]], and the well-containment relation [[AffineConstructive.topology.interfaces.unif_born.well_contained]]. It defines the morphism classes in two flavours. The global ones ([[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]], [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifInitial]], …) are uniformly continuous and bornological everywhere. The local ones are built on [[AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity]] and [[AffineConstructive.topology.interfaces.unif_born.LocalUniformReflection]], uniform control near bounded sets, and run up to [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]] and [[AffineConstructive.topology.interfaces.unif_born.WCUnifEmbedding]]. The file closes with the universal property of a local completion, [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]] and [[AffineConstructive.topology.interfaces.unif_born.LocallyComplete]], and with the resolution hints that recover the codomain's structure from a morphism. The underlying structures come from the uniform and bornology interfaces; the theory, the trapped completion and localization are developed in the topology/unif_born files.","short":"Uniform spaces with a bornology: well-containment axioms, global and local morphisms, local completions","items":[{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornSpace","base":"UnifBornSpace","kind":"rec","start":2,"body":null,"status":"ok","short":{"text":"A set with a uniformity and a bornology, each satisfying its own axioms, with nothing linking them","status":"ok"},"long":{"text":"A set X with a uniformity Φ and a bornology 𝒜, each satisfying its own axioms: X is a [[AffineConstructive.topology.interfaces.uniform.UniformSpace]] and a [[AffineConstructive.topology.interfaces.bornology.BornologicalSpace]], and nothing else is assumed. It is the fibre product of uniform spaces and bornological spaces over the underlying set.\n\nThe classes that matter refine it with axioms relating the entourages to the bounded subsets. The main one is [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]], the well-containment uniform spaces, which adds that every bounded subset has a bounded entourage thickening. Keeping the bare pairing as its own class lets the morphism classes of this file, such as [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyContinuous]] and [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyReflecting]], require of their domain or codomain only that it carry both structures.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_unif","base":"unif_born_unif","kind":"proj","short":{"text":"The uniform space structure of a set with a uniformity and a bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_born","base":"unif_born_born","kind":"proj","short":{"text":"The bornological space structure of a set with a uniformity and a bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornSpace","base":"Build_UnifBornSpace","kind":"constr","short":{"text":"Builds a uniform bornological space from a uniform space and a bornological space on the same set","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UniformlyOpenBornology","base":"UniformlyOpenBornology","kind":"ind","start":9,"body":null,"status":"ok","short":{"text":"Every bounded subset has some uniform thickening that is again bounded","status":"ok"},"long":{"text":"The axiom tying a bornology to a uniformity on the same set: for every bounded subset A there is an entourage U whose thickening U.[A], the set of points U-close to some point of A, is again bounded. Each bounded set therefore sits inside a bounded uniform neighbourhood of itself, and the bornology admits no bounded set lying at the edge of the bounded ones at every scale.\n\nIt is the one axiom of a well-containment uniform space, [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]], that involves both structures; the others are the axioms of a uniform space and of a bornological space, taken separately. [[AffineConstructive.topology.unif_born.base.unif_open_closed_born]] derives from it that the bornology is closed, every bounded set having a bounded closure.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.UniformlyOpenBornology","base":"UniformlyOpenBornology","kind":"rec","short":{"text":"The class of bornologies in which each bounded set has a bounded uniform thickening","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_thicken","base":"wcunif_thicken","kind":"proj","short":{"text":"For a bounded A, there is an entourage U with U.[A] bounded","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.ClosedBornology","base":"ClosedBornology","kind":"ind","start":11,"body":null,"status":"ok","short":{"text":"A closed bornology: the closure of every bounded subset is bounded","status":"ok"},"long":{"text":"The class says that for every bounded subset A of X, the closure of A, taken in the neighbourhood structure of X, is again bounded. Equivalently, the bornology has a base of closed sets: every bounded set lies in a bounded closed one, namely its closure. The condition is topological. It asks only for a neighbourhood relation beside the bornology, not a uniformity, so it applies to any space whose topology comes from somewhere, in particular to the topology of a uniform space. The class is valued in `SProp`: it is a base-logic statement that holds or fails.\n\nInstances show that it holds for well-containment uniform spaces ([[AffineConstructive.topology.unif_born.base.wcunif_closed_born]]) and for the trapped completion ([[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_closed_born]]). On it the development builds the closure as a map on bounded sets, [[AffineConstructive.topology.unif_born.base.born_closure]], and the lemma [[AffineConstructive.topology.unif_born.base.closed_born_basis]] assumes it to pass to the base of closed bounded sets. A hint lets resolution discharge a goal stating that the closure of a bounded set is bounded directly from the class.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.ClosedBornology","base":"ClosedBornology","kind":"rec","short":{"text":"The class of bornologies closed under closure: bounded sets have bounded closures","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.born_closure_bounded","base":"born_closure_bounded","kind":"proj","short":{"text":"The closure of a bounded subset is bounded","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifSpace","base":"WCUnifSpace","kind":"rec","start":14,"body":null,"status":"ok","short":{"text":"A well-containment uniform space: a uniform space with a bornology whose bounded sets have bounded uniform thickenings","status":"ok"},"long":{"text":"A well-containment uniform space. X carries a uniformity and a bornology that each satisfy their own axioms, so X is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]]. One further axiom joins the two structures, [[AffineConstructive.topology.interfaces.unif_born.UniformlyOpenBornology]]. For every bounded subset A it gives an entourage U whose thickening U.[A] is again bounded, where U.[A] is the set of points U-close to a point of A. A bounded set can therefore be enlarged by some uniform margin and stay bounded.\n\nThe local theory is set in these spaces. The morphisms [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]] are locally uniformly continuous and bornological, and they ask for well-containment spaces at both ends. [[AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace]] narrows the class by asking that the uniformity and the bornology both be regular. Constructions stay inside the class. For instance, the localization of a well-containment uniform space is again one ([[AffineConstructive.topology.unif_born.localization.localized_wcunif]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_unif_born","base":"wcunif_unif_born","kind":"proj","short":{"text":"The underlying uniform space with bornology of a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_unif_open_born","base":"wcunif_unif_open_born","kind":"proj","short":{"text":"The thickening axiom of a well-containment uniform space: bounded sets have bounded uniform thickenings","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifSpace","base":"Build_WCUnifSpace","kind":"constr","short":{"text":"Builds a well-containment uniform space from a uniform space with bornology and the thickening axiom","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace","base":"RegularWCUnifSpace","kind":"rec","start":16,"body":null,"status":"ok","short":{"text":"A well-containment uniform space whose uniformity and bornology are both regular","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]] that is also a [[AffineConstructive.topology.interfaces.uniform.RegularUniformSpace]] and a [[AffineConstructive.topology.interfaces.bornology.RegularBornologicalSpace]]. Regularity is stated in cover form, once for each structure. For the uniformity the witness is an inner entourage and the variance is that of a filter. For the bornology the witness is an outer bounded set and the variance is that of an ideal. The three conditions form one record, so a regular well-containment space reaches each weaker structure through its coercions.\n\nThis is the hypothesis under which local uniform behaviour can be read off from the bounded subsets. On a regular well-containment space, a map that is uniformly continuous on each bounded subset is locally uniformly continuous ([[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_uc]]). Into one, a map that reflects the uniformity over each bounded subset is locally uniformly reflecting ([[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_ur]]). Without regularity, the condition on bounded subsets is weaker than the local one.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.regular_wcunif_wc","base":"regular_wcunif_wc","kind":"proj","short":{"text":"The underlying well-containment uniform space of a regular one","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.regular_wcunif_regular_unif","base":"regular_wcunif_regular_unif","kind":"proj","short":{"text":"The regularity of the uniformity of a regular well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.regular_wcunif_regular_born","base":"regular_wcunif_regular_born","kind":"proj","short":{"text":"The regularity of the bornology of a regular well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_RegularWCUnifSpace","base":"Build_RegularWCUnifSpace","kind":"constr","short":{"text":"Builds a regular well-containment space from a well-containment space and both regularities","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.well_contained","base":"well_contained","kind":"def","start":18,"body":null,"status":"ok","short":{"text":"The well-containment relation K ⋐ S: K is bounded and S contains a uniform thickening of K","status":"ok"},"long":{"text":"The relation K ⋐ S between a bounded subset K of X and an arbitrary subset S. It holds when K ◁ S, that is, when K lies uniformly below S: some entourage thickens K into S. The relation has two legs. The bounded leg is built into the type of K, which ranges over the bornology. The uniform leg is the condition the relation imposes. The notation K ⋐ S applies the relation to the pair (K, S).\n\nThe relation is a subset of 𝒜 ⊗ 𝒫 X, the tensor product of the bounded subsets with the powerset. Like every affine relation, it is read at once as a way of proving the containment and a way of refuting it.\n\nIts order properties are proved in [[AffineConstructive.topology.interfaces.unif_born.well_contained]]. Shrinking the bounded side preserves the relation ([[AffineConstructive.topology.unif_born.well_contained.wc_le_l]]). On the left it is closed under joins ([[AffineConstructive.topology.unif_born.well_contained.wc_join]]), and on the right under meets ([[AffineConstructive.topology.unif_born.well_contained.wc_meet]]). The relation is also used in the treatment of open immersions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.TensorProductUnifBorn","base":"TensorProductUnifBorn","kind":"rec","start":20,"body":null,"status":"ok","short":{"text":"Ξ and 𝒞 are the tensor product uniformity and bornology on X ⊗ Y","status":"ok"},"long":{"text":"A certificate that a uniformity Ξ and a bornology 𝒞 on the tensor product X ⊗ Y form the product structure of the two factors. It consists of a [[AffineConstructive.topology.interfaces.uniform.TensorProductUniformity]] certificate for Ξ and a [[AffineConstructive.topology.interfaces.bornology.TensorProductBornology]] certificate for 𝒞. Neither half constrains the other, in the same way that [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]] pairs its two structures.\n\nInstance resolution builds the certificate from its halves. Each half is found by the hints of its own interface file.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.tensor_product_unif_born_unif","base":"tensor_product_unif_born_unif","kind":"proj","short":{"text":"The uniformity half: Ξ is the tensor product uniformity","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.tensor_product_unif_born_born","base":"tensor_product_unif_born_born","kind":"proj","short":{"text":"The bornology half: 𝒞 is the tensor product bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_TensorProductUnifBorn","base":"Build_TensorProductUnifBorn","kind":"constr","short":{"text":"Builds the tensor product certificate from its uniform and bornological halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.CartesianProductUnifBorn","base":"CartesianProductUnifBorn","kind":"rec","start":23,"body":null,"status":"ok","short":{"text":"Ξ and 𝒞 are the cartesian product uniformity and bornology on X × Y","status":"ok"},"long":{"text":"The cartesian counterpart of [[AffineConstructive.topology.interfaces.unif_born.TensorProductUnifBorn]]. Here the product carrier X × Y carries the additive equality. The certificate consists of a [[AffineConstructive.topology.interfaces.uniform.CartesianProductUniformity]] certificate for Ξ and a [[AffineConstructive.topology.interfaces.bornology.CartesianProductBornology]] certificate for 𝒞, and instance resolution builds it from these two halves.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.cartesian_product_unif_born_unif","base":"cartesian_product_unif_born_unif","kind":"proj","short":{"text":"The uniformity half: Ξ is the cartesian product uniformity","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.cartesian_product_unif_born_born","base":"cartesian_product_unif_born_born","kind":"proj","short":{"text":"The bornology half: 𝒞 is the cartesian product bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_CartesianProductUnifBorn","base":"Build_CartesianProductUnifBorn","kind":"constr","short":{"text":"Builds the cartesian product certificate from its uniform and bornological halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism","base":"UnifBornMorphism","kind":"rec","start":26,"body":null,"status":"ok","short":{"text":"A uniformly continuous and bornological map between uniform spaces with bornologies","status":"ok"},"long":{"text":"The forward class of maps between uniform spaces with bornologies. The map is [[AffineConstructive.topology.interfaces.uniform.UniformlyContinuous]], and it is [[AffineConstructive.topology.interfaces.bornology.Bornological]]: it sends bounded sets to bounded sets. The class is the diagonal of these two forward classes. Each condition remains a record of its own, so a map can still carry one without the other.\n\nConstant maps are examples ([[AffineConstructive.topology.unif_born.base.const_unif_born_mor]]), and so are the projections out of a product, such as [[AffineConstructive.topology.unif_born.product.prod_proj1_unif_born_mor]]. The class is closed under composition ([[AffineConstructive.topology.unif_born.base.compose_unif_born_mor]]). [[AffineConstructive.topology.interfaces.unif_born.UnifBornInitial]] builds on it by adding the reflecting conditions.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_mor_cont","base":"unif_born_mor_cont","kind":"proj","short":{"text":"The uniform continuity of a uniformly continuous bornological map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_mor_born","base":"unif_born_mor_born","kind":"proj","short":{"text":"The boundedness of a uniformly continuous bornological map: images of bounded sets are bounded","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornMorphism","base":"Build_UnifBornMorphism","kind":"constr","short":{"text":"Builds a uniform-bornological morphism from uniform continuity and boundedness","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting","base":"UnifBornReflecting","kind":"rec","start":28,"body":null,"status":"ok","short":{"text":"A map that is uniformly reflecting and bornology-reflecting","status":"ok"},"long":{"text":"The reflecting class: the comparison runs from the codomain back to the domain. The map is [[AffineConstructive.topology.interfaces.uniform.UniformlyReflecting]], so every entourage of the domain contains the pullback of some entourage of the codomain. It is also [[AffineConstructive.topology.interfaces.bornology.BornologyReflecting]], so the preimage of a bounded set is bounded.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_refl_ufm","base":"unif_born_refl_ufm","kind":"proj","short":{"text":"A reflecting map is uniformly reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_refl_born","base":"unif_born_refl_born","kind":"proj","short":{"text":"A reflecting map is bornology-reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornReflecting","base":"Build_UnifBornReflecting","kind":"constr","short":{"text":"Builds a reflecting map from its uniform and bornological reflection","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornInitial","base":"UnifBornInitial","kind":"rec","start":30,"body":null,"status":"ok","short":{"text":"A map that is both a morphism and reflecting, for uniformity and bornology","status":"ok"},"long":{"text":"An initial map: it is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]] and also [[AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting]]. The uniformity and the bornology of the domain are then exactly those induced from the codomain along the map. This is the forward and reflecting halves of the reflection pair taken together.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_init_mor","base":"unif_born_init_mor","kind":"proj","short":{"text":"An initial map is a morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_init_refl","base":"unif_born_init_refl","kind":"proj","short":{"text":"An initial map is reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornInitial","base":"Build_UnifBornInitial","kind":"constr","short":{"text":"Builds an initial map from its forward and reflecting halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.UnifBornEmbedding","base":"UnifBornEmbedding","kind":"rec","start":32,"body":null,"status":"ok","short":{"text":"An embedding of uniform spaces with bornologies: initial and injective","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.UnifBornInitial]] map that is also [[AffineConstructive.interfaces.set.Injective]]. Up to the induced structure, it identifies its domain with a subspace of its codomain. Injectivity is the affine notion: the map preserves equality and reflects it, so it also preserves apartness.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_emb_initial","base":"unif_born_emb_initial","kind":"proj","short":{"text":"An embedding is initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_emb_inj","base":"unif_born_emb_inj","kind":"proj","short":{"text":"An embedding is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_UnifBornEmbedding","base":"Build_UnifBornEmbedding","kind":"constr","short":{"text":"Builds an embedding from an initial map and injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_X","base":"unif_born_X","kind":"def","start":34,"body":[35,37],"status":"ok","short":{"text":"The domain of a uniformly continuous bornological map is a uniform space with a bornology","status":"ok"},"proof":[{"text":"A uniform space with a bornology is the uniform structure and the bornology on X, with no axiom linking them. Splitting the goal into these two parts, each comes from the hypothesis that f is a uniformly continuous bornological map, which carries the structure of its domain.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_refl_X","base":"unif_born_refl_X","kind":"def","start":38,"body":[39,41],"status":"ok","short":{"text":"The domain of a uniformly and bornologically reflecting map is a uniform space with a bornology","status":"ok"},"proof":[{"text":"Splitting the goal into the uniform structure and the bornology on X, each comes from the hypothesis that f is uniformly and bornologically reflecting, which carries the structure of its domain.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifMorphism","base":"GlobalWCUnifMorphism","kind":"rec","start":42,"body":null,"status":"ok","short":{"text":"A map of well-containment uniform spaces that is uniformly continuous and bornological everywhere","status":"ok"},"long":{"text":"A map f : X ⇾ Y between well-containment uniform spaces (both satisfying the thickening axiom) that is uniformly continuous on the whole of X and sends bounded sets to bounded sets. The word \"global\" sets it apart from [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]], which asks for uniform continuity only near bounded sets. A global morphism therefore satisfies a stronger condition, and [[AffineConstructive.topology.unif_born.local_maps.gbl_wcunif_mor_local]] relates the two notions.\n\nThe domain's structure and the [[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]] are coercions out of the record. The codomain's structure is a plain field, which the file's hints reach from a hypothesis on f. Examples are the localization maps [[AffineConstructive.topology.unif_born.localization.wcunif_localize_mor]] and [[AffineConstructive.topology.unif_born.localization.from_localization_gbl_mor]]. Global morphisms compose ([[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_morphism]]), and [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifInitial]] pairs this class with its reflecting counterpart.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_mor_X","base":"gbl_wcunif_mor_X","kind":"proj","short":{"text":"The domain of a global morphism is a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_mor_Y","base":"gbl_wcunif_mor_Y","kind":"proj","short":{"text":"The codomain of a global morphism is a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_mor_ub","base":"gbl_wcunif_mor_ub","kind":"proj","short":{"text":"A global morphism is uniformly continuous and bornological","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_GlobalWCUnifMorphism","base":"Build_GlobalWCUnifMorphism","kind":"constr","short":{"text":"Builds a global morphism from the two spaces' axioms and a uniformly continuous bornological map","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifReflecting","base":"GlobalWCUnifReflecting","kind":"rec","start":44,"body":null,"status":"ok","short":{"text":"A map of well-containment uniform spaces that reflects the uniformity and the bornology everywhere","status":"ok"},"long":{"text":"A map f : X ⇾ Y between well-containment uniform spaces that is uniformly reflecting on the whole space and reflects bounded sets: the preimage of a bounded set is bounded. It is the reflecting counterpart of [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifMorphism]] and is laid out the same way. The domain's structure is a coercion, the codomain's a plain field, and the [[AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting]] part a coercion.\n\nExamples are the maps into a localization, [[AffineConstructive.topology.unif_born.localization.to_localization_gbl_refl]] and [[AffineConstructive.topology.unif_born.localization.wcunif_localize_refl]]. The class is closed under composition ([[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_reflecting]]), and together with the forward class it makes up [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifInitial]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_rfl_X","base":"gbl_wcunif_rfl_X","kind":"proj","short":{"text":"The domain of a globally reflecting map is a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_rfl_Y","base":"gbl_wcunif_rfl_Y","kind":"proj","short":{"text":"The codomain of a globally reflecting map is a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_rfl_ubr","base":"gbl_wcunif_rfl_ubr","kind":"proj","short":{"text":"A globally reflecting map reflects the uniformity and the bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_GlobalWCUnifReflecting","base":"Build_GlobalWCUnifReflecting","kind":"constr","short":{"text":"Builds a globally reflecting map from the two spaces' axioms and the reflection of both structures","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifInitial","base":"GlobalWCUnifInitial","kind":"rec","start":46,"body":null,"status":"ok","short":{"text":"A map of well-containment uniform spaces that is globally both a morphism and reflecting","status":"ok"},"long":{"text":"A map f between well-containment uniform spaces that is at once a [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifMorphism]] and [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifReflecting]]: uniformly continuous and uniformly reflecting, bornological and bornology-reflecting, over the whole of X and not only near bounded sets. The uniformity and the bornology of X are then exactly those induced from Y along f; it is the global counterpart of [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]], whose uniform conditions hold near bounded sets, and [[AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_ini_ub_ini]] forgets it to an initial map for the uniformity and the bornology.\n\nThe unit into the trapped completion is an example, [[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped_wc_initial]], as is the map of [[AffineConstructive.topology.unif_born.localization.wcunif_localize_initial]]. Such maps compose ([[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_initial]]), and adding injectivity gives [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifEmbedding]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_ini_mor","base":"gbl_wcunif_ini_mor","kind":"proj","short":{"text":"The forward half of a globally initial map: a global morphism of well-containment spaces","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_ini_rfl","base":"gbl_wcunif_ini_rfl","kind":"proj","short":{"text":"The reflecting half of a globally initial map: globally uniformly and bornologically reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_GlobalWCUnifInitial","base":"Build_GlobalWCUnifInitial","kind":"constr","short":{"text":"Builds a globally initial map from a global morphism that is also globally reflecting","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifEmbedding","base":"GlobalWCUnifEmbedding","kind":"rec","start":48,"body":null,"status":"ok","short":{"text":"An injective, globally initial map of well-containment uniform spaces","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifInitial]] map that is also injective. Being globally initial, the map is uniformly continuous and bornological, and it reflects both structures, everywhere and not only near bounded sets. The uniformity and the bornology of X are therefore the ones induced from Y. Injectivity then identifies X with its image.\n\nThe identity of a well-containment uniform space is an example ([[AffineConstructive.topology.unif_born.base.id_gbl_wcunif_emb]]). So is the composite η Y ∘ f ∘ ε X for a dense embedding f of well-containment spaces ([[AffineConstructive.topology.unif_born.localization.wcunif_localize_emb]]), where ε X : ℒ X ⇾ X is the counit of the localization and η Y is the unit at Y. Global embeddings compose ([[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_embedding]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_emb_ini","base":"gbl_wcunif_emb_ini","kind":"proj","short":{"text":"A global embedding of well-containment uniform spaces is globally initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_emb_inj","base":"gbl_wcunif_emb_inj","kind":"proj","short":{"text":"A global embedding of well-containment uniform spaces is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_GlobalWCUnifEmbedding","base":"Build_GlobalWCUnifEmbedding","kind":"constr","short":{"text":"Builds a global embedding from a globally initial map and its injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_ini_ub_ini","base":"gbl_wcunif_ini_ub_ini","kind":"def","start":50,"body":[51,53],"status":"ok","short":{"text":"A globally initial map of well-containment spaces is initial for the uniformity and the bornology","status":"ok"},"proof":[{"text":"Being initial for the uniformity and the bornology means being forward and reflecting for both. Splitting the goal into these parts, each is part of the hypothesis that f is a globally initial map of well-containment spaces.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_emb_ub_emb","base":"gbl_wcunif_emb_ub_emb","kind":"def","start":54,"body":[55,57],"status":"ok","short":{"text":"A global embedding of well-containment spaces is an embedding of uniform spaces with bornology","status":"ok"},"proof":[{"text":"An embedding is an initial map that is also injective. Split the goal into these two parts. Initiality for the uniformity and the bornology follows from global initiality by [[AffineConstructive.topology.interfaces.unif_born.gbl_wcunif_ini_ub_ini]], and injectivity is part of the hypothesis that f is a global embedding.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.π₁","base":"π₁","kind":"abbrev","start":58,"body":null,"status":"ok","short":{"text":"Local shorthand for the first projection of the tensor product X ⊗ X","status":"ok"},"long":{"text":"An abbreviation used inside this file. It stands for the first projection out of the tensor square. The local conditions use it to restrict an entourage to the pairs whose first point lies in a given bounded set: the restriction of U to K is π₁* K ⊓ U.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity","base":"LocalUniformContinuity","kind":"ind","start":59,"body":null,"status":"ok","short":{"text":"f is uniformly continuous near bounded sets: close pairs starting in a bounded K have close images","status":"ok"},"long":{"text":"A map f from a set X with a uniformity and a bornology to a set Y with a uniformity is locally uniformly continuous when, for every bounded K of X and every entourage W of Y, there is an entourage U of X such that every U-close pair whose first point lies in K is sent by f to a W-close pair. The pairs are restricted by a meet, the additive conjunction, of the preimage of K under the first projection with U. Only the first point is required to lie in K. The second point ranges over the U-thickening of K, so the condition controls f *near* K and not only on K. The entourage U depends on both K and W. This is the uniform part of the morphisms of well-containment uniform spaces.\n\nThe condition is stronger than uniform continuity of the restriction of f to each bounded set. The two agree for a regular well-containment uniform space ([[AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace]]: the thickening axiom together with regularity), by [[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_uc]]. Because the inclusion is affine, it carries its contrapositive: if f x and f y are W-apart, then either x and y are U-apart or x is apart from K. The choice between the two is the additive one given by the meet.\n\nThe class carries the bare condition and asks for no axioms on X or Y. [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyContinuous]] bundles it with the requirement that X is a uniform space with a bornology and that Y is a uniform space, and [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]] adds that f is bornological.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity","base":"LocalUniformContinuity","kind":"rec","short":{"text":"The class of maps uniformly continuous near every bounded subset of the domain","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_uniform_continuity","base":"local_uniform_continuity","kind":"proj","short":{"text":"For bounded K and entourage W, an entourage U whose pairs starting in K have W-close images","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalUniformReflection","base":"LocalUniformReflection","kind":"ind","start":61,"body":null,"status":"ok","short":{"text":"f reflects the uniformity near bounded sets of Y: closeness of images starting in L gives closeness","status":"ok"},"long":{"text":"The reflecting counterpart of [[AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity]]. Here the bornology is on the codomain. A map f from X to Y, both with uniformities and Y with a bornology, reflects the uniformity locally when, for every bounded L of Y and every entourage U of X, there is an entourage W of Y such that x and y are U-close whenever f x lies in L and f x, f y are W-close. As in the forward class, the restriction is a meet, the additive conjunction, with the preimage of L under the first projection. Only the first image point must lie in L, so the control holds near L and not only on it.\n\nThe condition is stronger than reflecting the uniformity on each bounded set. The two agree for a regular well-containment uniform space ([[AffineConstructive.topology.interfaces.unif_born.RegularWCUnifSpace]]), by [[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_ur]]. Read contrapositively: if x and y are U-apart, then either f x and f y are W-apart or f x is apart from L.\n\nThe class carries the bare condition. [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyReflecting]] bundles it with the requirement that X is a uniform space and Y a uniform space with a bornology. [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting]] adds that f reflects the bornology. Together with the forward classes these make up the initial maps and embeddings of well-containment uniform spaces.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.LocalUniformReflection","base":"LocalUniformReflection","kind":"rec","short":{"text":"The class of maps reflecting the uniformity near every bounded subset of the codomain","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_uniform_reflection","base":"local_uniform_reflection","kind":"proj","short":{"text":"For bounded L and entourage U, an entourage W such that W-close images starting in L come from U-close pairs","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyContinuous","base":"LocallyUniformlyContinuous","kind":"rec","start":63,"body":null,"status":"ok","short":{"text":"A locally uniformly continuous map: uniformly continuous near bounded sets of the domain","status":"ok"},"long":{"text":"The class of locally uniformly continuous maps. The domain is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], a uniform space carrying a bornology, the codomain is a uniform space, and the map satisfies [[AffineConstructive.topology.interfaces.unif_born.LocalUniformContinuity]]: it is uniformly continuous near bounded sets, meaning that close pairs with their first point in a bounded set are sent to close pairs, with the closeness of the domain chosen according to the bounded set and the entourage of the codomain.\n\nIt is the local analogue of [[AffineConstructive.topology.interfaces.uniform.UniformlyContinuous]], and the uniform leg of the local forward classes [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]] and [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]]. The codomain's uniform structure is kept as a field so that it can be recovered from the map; it is not a coercion, and resolution finds it from a hypothesis that the map is locally uniformly continuous.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_uc_X","base":"locally_uc_X","kind":"proj","short":{"text":"The domain of a locally uniformly continuous map is a uniform space with a bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_uc_Y","base":"locally_uc_Y","kind":"proj","short":{"text":"The codomain of a locally uniformly continuous map is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_uc_prop","base":"locally_uc_prop","kind":"proj","short":{"text":"The local uniform continuity of a locally uniformly continuous map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUniformlyContinuous","base":"Build_LocallyUniformlyContinuous","kind":"constr","short":{"text":"Builds a locally uniformly continuous map from the two space structures and local uniform continuity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyReflecting","base":"LocallyUniformlyReflecting","kind":"rec","start":65,"body":null,"status":"ok","short":{"text":"A locally uniformly reflecting map from a uniform space to one with a bornology","status":"ok"},"long":{"text":"The packaged reflecting class. The domain is a [[AffineConstructive.topology.interfaces.uniform.UniformSpace]], the codomain is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], and the map satisfies [[AffineConstructive.topology.interfaces.unif_born.LocalUniformReflection]]. Here it is the codomain that needs a bornology, since the reflection localises at its bounded sets.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ur_X","base":"locally_ur_X","kind":"proj","short":{"text":"The domain of a locally uniformly reflecting map is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ur_Y","base":"locally_ur_Y","kind":"proj","short":{"text":"The codomain of a locally uniformly reflecting map is a uniform space with bornology","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ur_prop","base":"locally_ur_prop","kind":"proj","short":{"text":"A locally uniformly reflecting map reflects the uniformity over bounded sets","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUniformlyReflecting","base":"Build_LocallyUniformlyReflecting","kind":"constr","short":{"text":"Builds a locally uniformly reflecting map from the two space structures and the local condition","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn","base":"LocallyUnifBorn","kind":"rec","start":70,"body":null,"status":"ok","short":{"text":"A map that is locally uniformly continuous and bornological","status":"ok"},"long":{"text":"The local forward class for uniform spaces with a bornology: the map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyContinuous]], that is, uniformly continuous near bounded sets, and [[AffineConstructive.topology.interfaces.bornology.Bornological]], sending bounded sets to bounded sets. It is the local analogue of [[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]], with uniform continuity weakened to uniform continuity near bounded sets.\n\nBecause the map is bornological, its codomain carries a bornology as well as a uniformity and is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], as [[AffineConstructive.topology.interfaces.unif_born.locally_ub_Y]] records. Together with [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting]] it makes up the local initial maps [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornInitial]], and over well-containment uniform spaces it is the map part of [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ub_uc","base":"locally_ub_uc","kind":"proj","short":{"text":"The local uniform continuity of a locally uniformly continuous bornological map","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ub_born","base":"locally_ub_born","kind":"proj","short":{"text":"A locally uniformly continuous bornological map is bornological","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUnifBorn","base":"Build_LocallyUnifBorn","kind":"constr","short":{"text":"Builds a locally uniformly continuous bornological map from its two legs","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting","base":"LocallyUnifBornReflecting","kind":"rec","start":72,"body":null,"status":"ok","short":{"text":"A map that is locally uniformly reflecting and bornology-reflecting","status":"ok"},"long":{"text":"The local reflecting class. The map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUniformlyReflecting]] and [[AffineConstructive.topology.interfaces.bornology.BornologyReflecting]]. It is the local analogue of [[AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ubr_ur","base":"locally_ubr_ur","kind":"proj","short":{"text":"A locally reflecting map is locally uniformly reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ubr_born","base":"locally_ubr_born","kind":"proj","short":{"text":"A locally reflecting map is bornology-reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUnifBornReflecting","base":"Build_LocallyUnifBornReflecting","kind":"constr","short":{"text":"Builds a locally reflecting map from local uniform reflection and bornology reflection","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornInitial","base":"LocallyUnifBornInitial","kind":"rec","start":74,"body":null,"status":"ok","short":{"text":"A locally initial map: a local morphism that is also locally reflecting","status":"ok"},"long":{"text":"The local initial class. The map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]] and also [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting]]. On each bounded region the uniformity of the domain is the one induced from the codomain, and the bornology of the domain is exactly the one induced from the codomain.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ubi_ubc","base":"locally_ubi_ubc","kind":"proj","short":{"text":"A locally initial map is a local morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ubi_ubr","base":"locally_ubi_ubr","kind":"proj","short":{"text":"A locally initial map is locally reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUnifBornInitial","base":"Build_LocallyUnifBornInitial","kind":"constr","short":{"text":"Builds a locally initial map from its forward and reflecting halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornEmbedding","base":"LocallyUnifBornEmbedding","kind":"rec","start":76,"body":null,"status":"ok","short":{"text":"A local embedding: locally initial and injective","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornInitial]] map that is also [[AffineConstructive.interfaces.set.Injective]]. It is the local analogue of [[AffineConstructive.topology.interfaces.unif_born.UnifBornEmbedding]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ube_ubi","base":"locally_ube_ubi","kind":"proj","short":{"text":"A local embedding is locally initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ube_inj","base":"locally_ube_inj","kind":"proj","short":{"text":"A local embedding is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocallyUnifBornEmbedding","base":"Build_LocallyUnifBornEmbedding","kind":"constr","short":{"text":"Builds a local embedding from a locally initial map and injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism","base":"WCUnifMorphism","kind":"rec","start":78,"body":null,"status":"ok","short":{"text":"A morphism of well-containment uniform spaces: locally uniformly continuous and bornological","status":"ok"},"long":{"text":"A map f : X ⇾ Y between well-containment uniform spaces (both satisfying the thickening axiom) that is bornological and locally uniformly continuous ([[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]]). Local uniform continuity controls close pairs near bounded sets: for bounded K and an entourage W of Y there is an entourage U of X such that every U-close pair whose first point lies in K is sent to a W-close pair. This is weaker than the uniform continuity on the whole space that [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifMorphism]] asks for, and it is the notion of map under which the development treats well-containment spaces.\n\nThe domain's structure and the [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBorn]] part are coercions out of the record. The codomain's structure is a plain field, which the file's hints reach from a hypothesis on f. Examples are the inclusion of an open subset ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_wcunif_mor]]) and the map induced on trapped completions ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor]]). [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] pairs this class with its reflecting counterpart. [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]] requires its extension maps to be morphisms of this kind.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_mor_X","base":"wcunif_mor_X","kind":"proj","short":{"text":"The domain of a well-containment morphism is a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_mor_Y","base":"wcunif_mor_Y","kind":"proj","short":{"text":"The codomain of a well-containment morphism is a well-containment uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_mor_lub","base":"wcunif_mor_lub","kind":"proj","short":{"text":"A well-containment morphism is locally uniformly continuous and bornological","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifMorphism","base":"Build_WCUnifMorphism","kind":"constr","short":{"text":"Builds a well-containment morphism from the two spaces' axioms and a locally uniformly continuous bornological map","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifReflecting","base":"WCUnifReflecting","kind":"rec","start":80,"body":null,"status":"ok","short":{"text":"A locally reflecting map between well-containment uniform spaces","status":"ok"},"long":{"text":"The reflecting class between well-containment uniform spaces. Both ends are [[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]]s, and the map is [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornReflecting]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_rfl_X","base":"wcunif_rfl_X","kind":"proj","short":{"text":"The domain of a reflecting map of well-containment spaces is one","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_rfl_Y","base":"wcunif_rfl_Y","kind":"proj","short":{"text":"The codomain of a reflecting map of well-containment spaces is one","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_rfl_lubr","base":"wcunif_rfl_lubr","kind":"proj","short":{"text":"A reflecting map of well-containment spaces is locally reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifReflecting","base":"Build_WCUnifReflecting","kind":"constr","short":{"text":"Builds a reflecting map of well-containment spaces from the two spaces and local reflection","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifInitial","base":"WCUnifInitial","kind":"rec","start":82,"body":null,"status":"ok","short":{"text":"An initial map of well-containment uniform spaces: morphism and reflecting","status":"ok"},"long":{"text":"A map between well-containment uniform spaces that is both a [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]] and [[AffineConstructive.topology.interfaces.unif_born.WCUnifReflecting]]. The structure of the domain is then induced locally from the codomain. Together with density, these maps are the extensions that a local completion classifies: [[AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial]] is defined for the initial dense maps.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_ini_mor","base":"wcunif_ini_mor","kind":"proj","short":{"text":"An initial map of well-containment spaces is a morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_ini_rfl","base":"wcunif_ini_rfl","kind":"proj","short":{"text":"An initial map of well-containment spaces is reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifInitial","base":"Build_WCUnifInitial","kind":"constr","short":{"text":"Builds an initial map of well-containment spaces from its forward and reflecting halves","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.WCUnifEmbedding","base":"WCUnifEmbedding","kind":"rec","start":84,"body":null,"status":"ok","short":{"text":"An embedding of well-containment uniform spaces: initial and injective","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] map that is [[AffineConstructive.interfaces.set.Injective]]. It identifies a well-containment uniform space with a subspace of another one, with the uniformity and bornology of the subspace induced locally.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_emb_ini","base":"wcunif_emb_ini","kind":"proj","short":{"text":"An embedding of well-containment spaces is initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_emb_inj","base":"wcunif_emb_inj","kind":"proj","short":{"text":"An embedding of well-containment spaces is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_WCUnifEmbedding","base":"Build_WCUnifEmbedding","kind":"constr","short":{"text":"Builds an embedding of well-containment spaces from an initial map and injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_ub_Y","base":"locally_ub_Y","kind":"prf","start":87,"body":[88,90],"status":"ok","short":{"text":"The codomain of a local morphism is a uniform space with a bornology","status":"ok"},"proof":[{"text":"A uniform space with a bornology is a pair of a uniformity and a bornology on Y. The hypothesis that f is a local morphism already includes both of them, so each component comes from it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.locally_unif_born_initial_born_initial","base":"locally_unif_born_initial_born_initial","kind":"def","start":91,"body":[92,94],"status":"ok","short":{"text":"A locally initial map is bornologically initial","status":"ok"},"proof":[{"text":"A locally initial map is bornological and bornologically reflecting. Those two conditions together are what [[AffineConstructive.topology.interfaces.bornology.BornologyInitial]] requires, so the goal splits into them and each comes directly from the hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_ini_lub_ini","base":"wcunif_ini_lub_ini","kind":"def","start":95,"body":[96,98],"status":"ok","short":{"text":"An initial map of well-containment spaces is locally initial","status":"ok"},"proof":[{"text":"Split being locally initial into its components, the local forward condition and the local reflecting condition. Each one follows from the corresponding global condition in the hypothesis that f is initial. A map that controls every close pair also controls the close pairs with one point in a bounded set, so a uniformly continuous or reflecting map is in particular one near bounded sets.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.wcunif_emb_lub_emb","base":"wcunif_emb_lub_emb","kind":"def","start":99,"body":[100,102],"status":"ok","short":{"text":"An embedding of well-containment spaces is a local embedding","status":"ok"},"proof":[{"text":"A local embedding is a locally initial map that is also injective. Split the goal into these two parts. The first follows from [[AffineConstructive.topology.interfaces.unif_born.wcunif_ini_lub_ini]] applied to the initial map underlying the embedding, and the injectivity of f comes directly from the hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect","base":"LocalCompletionReflect","kind":"ind","start":103,"body":null,"status":"ok","short":{"text":"The data of a local completion: a map into Y from each dense initial extension of X","status":"ok"},"long":{"text":"The operation part of the universal property of a local completion ι : X → Y. Suppose f : X → Z is a [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] map with [[AffineConstructive.topology.interfaces.topology.Dense]] range. Then the operation supplies a map from Z to Y. The class lives in Type rather than SProp, because it carries a function, not only a proof.\n\nIntuitively, Y is a maximal dense extension of X: every other dense initial extension maps into it. The laws that make this a universal property, namely that the map is a morphism and lies over X, are stated in [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]].\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, dashed] \\\\\n & Y\n```","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect","base":"LocalCompletionReflect","kind":"rec","short":{"text":"The class of the local-completion operation on a map ι from X to Y","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial","base":"local_completion_reflect_initial","kind":"proj","short":{"text":"The map into Y induced by a dense initial map out of X","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse","base":"LocalCompleteInverse","kind":"def","start":105,"body":null,"status":"ok","short":{"text":"The local-completion operation for the identity of X: retractions of dense initial extensions","status":"ok"},"long":{"text":"The case of [[AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect]] in which ι is the identity of X. For every dense [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] map f : X → Z, it supplies a map from Z back to X. When the laws hold, this map is a retraction of f. It is the data underlying [[AffineConstructive.topology.interfaces.unif_born.LocallyComplete]], and instance resolution recognises an instance for the identity as an instance of this class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse_Reflect","base":"LocalCompleteInverse_Reflect","kind":"inst","start":107,"body":null,"status":"ok","short":{"text":"A local-completeness inverse on X is local-completion data for the identity of X","status":"ok"},"long":{"text":"[[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] X is, by definition, [[AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect]] at the identity of X. This means it gives a map Z ⇾ X back from every dense initial well-containment extension f of X. This coercion lets the general statements about [[AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect]] and [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]] apply to it, which is how local completeness ([[AffineConstructive.topology.interfaces.unif_born.LocallyComplete]]) becomes the case ι = identity of a local completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocalCompletion","base":"LocalCompletion","kind":"rec","start":109,"body":null,"status":"ok","short":{"text":"ι : X ⇾ Y is a local completion: every dense well-containment initial extension of X maps to Y","status":"ok"},"long":{"text":"The universal property of the local completion. The data, from [[AffineConstructive.topology.interfaces.unif_born.LocalCompletionReflect]], is a map r : Z ⇾ Y for every [[AffineConstructive.topology.interfaces.unif_born.WCUnifInitial]] and [[AffineConstructive.topology.interfaces.topology.Dense]] map f : X ⇾ Z. The property requires that Y be a [[AffineConstructive.topology.interfaces.uniform.SeparatedUniformSpace]], that ι itself be well-containment initial and dense, and that each r be a [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]] with r ∘ f = ι.\n\nThis is the local analogue of the Cauchy completion. It is not stated as an extension property for maps out of X; instead every dense initial extension of X maps into Y over X, so Y is the largest such extension. The maps r are only required to be bornological and uniformly continuous near bounded sets, so completeness is asked for near bounded sets and not at infinity. When ι is the identity the property is local completeness, [[AffineConstructive.topology.interfaces.unif_born.LocallyComplete]].\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"r\"] \\\\\n & Y\n```","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_separated","base":"local_completion_separated","kind":"proj","short":{"text":"The codomain of a local completion is a separated uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_initial","base":"local_completion_initial","kind":"proj","short":{"text":"A local completion is well-containment initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_dense","base":"local_completion_dense","kind":"proj","short":{"text":"A local completion has dense range","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial_mor","base":"local_completion_reflect_initial_mor","kind":"proj","short":{"text":"The comparison map from a dense initial extension is a well-containment morphism","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial_spec","base":"local_completion_reflect_initial_spec","kind":"proj","short":{"text":"The comparison map r from a dense initial extension f satisfies r ∘ f = ι","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.unif_born.Build_LocalCompletion","base":"Build_LocalCompletion","kind":"constr","short":{"text":"Builds a local completion from separation, initiality, density and the comparison maps' properties","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.unif_born.coercion:local_completion_separated","base":"coercion:local_completion_separated","kind":"coercion","start":112,"body":null,"status":"ok","short":{"text":"A local completion reaches the fact that its codomain is a separated uniform space","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.coercion:local_completion_initial","base":"coercion:local_completion_initial","kind":"coercion","start":113,"body":null,"status":"ok","short":{"text":"A local completion counts as well-containment initial, so the facts about such maps apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.coercion:local_completion_dense","base":"coercion:local_completion_dense","kind":"coercion","start":114,"body":null,"status":"ok","short":{"text":"A local completion counts as dense, so the facts about dense maps apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.LocallyComplete","base":"LocallyComplete","kind":"def","start":120,"body":null,"status":"ok","short":{"text":"X is locally complete: the identity of X is a local completion","status":"ok"},"long":{"text":"A well-containment uniform space is locally complete when its identity map is a [[AffineConstructive.topology.interfaces.unif_born.LocalCompletion]]. Concretely, three things hold. X is separated. For every dense initial map f : X → Z, the map Z → X given by [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] is a morphism of well-containment spaces. Composed with f, that map is the identity. So every dense initial extension of X retracts onto X, and X has no proper dense local extensions. This is the local analogue of completeness.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_Y","base":"unif_born_Y","kind":"prf","start":126,"body":[127,129],"status":"ok","short":{"text":"The codomain of a uniformly continuous bornological map is a uniform space with a bornology","status":"ok"},"proof":[{"text":"Splitting the goal into the uniform structure and the bornology on Y, each comes from the hypothesis that f is a uniformly continuous bornological map, which carries the structure of its codomain.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.interfaces.unif_born.unif_born_refl_Y","base":"unif_born_refl_Y","kind":"prf","start":130,"body":[131,133],"status":"ok","short":{"text":"The codomain of a uniformly and bornologically reflecting map is a uniform space with a bornology","status":"ok"},"proof":[{"text":"Splitting the goal into the uniform structure and the bornology on Y, each comes from the hypothesis that f is uniformly and bornologically reflecting, which carries the structure of its codomain.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{"\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, dashed] \\\\\n & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='62.077pt' height='52.834pt' viewBox='0 0 62.077 52.834'>\n<defs>\n<path id='g1-1' d='M.80852-1.44976C.73882-1.22672 .51578-.71791 .51578-.52275C.51578-.24395 .73185 .0697 1.19884 .0697C1.51249 .0697 1.86796-.05576 2.15373-.28577C2.54405-.60639 2.60678-.98277 2.60678-.99671C2.60678-1.08732 2.51617-1.08732 2.49526-1.08732C2.40465-1.08732 2.39071-1.05944 2.36283-.95489C2.18858-.44608 1.63795-.12546 1.21278-.12546C1.1152-.12546 1.02459-.14637 1.02459-.36941C1.02459-.4182 1.02459-.52275 1.10823-.73185C1.48461-1.73553 1.73553-2.82285 1.73553-2.85073C1.73553-2.97619 1.63795-3.07377 1.49855-3.07377C1.36612-3.07377 1.24763-2.97619 1.20581-2.89255C1.15702-2.76012 1.09429-2.42556 1.05247-2.29313C1.01065-2.18161 .93398-1.8819 .89913-1.77038L.80852-1.44976Z'/>\n<path id='g1-2' d='M2.83679-2.75315H3.51985C3.65925-2.75315 3.74986-2.75315 3.74986-2.90649C3.74986-3.00407 3.65925-3.00407 3.53379-3.00407H2.88558C3.04589-3.88926 3.10165-4.20988 3.15741-4.41201C3.19226-4.56535 3.3456-4.71172 3.51288-4.71172C3.51985-4.71172 3.70804-4.71172 3.84047-4.62808C3.5547-4.53747 3.53379-4.28655 3.53379-4.24473C3.53379-4.09139 3.65228-3.98684 3.81259-3.98684C4.00078-3.98684 4.20988-4.14715 4.20988-4.41201C4.20988-4.73263 3.86835-4.90688 3.51288-4.90688C3.2062-4.90688 2.86467-4.73263 2.67648-4.38413C2.53708-4.12624 2.48132-3.81259 2.33495-3.00407H1.78432C1.64492-3.00407 1.55431-3.00407 1.55431-2.85073C1.55431-2.75315 1.64492-2.75315 1.77038-2.75315H2.28616C2.27919-2.71133 1.84008-.20213 1.6728 .54366C1.63795 .697 1.51946 1.22672 1.1849 1.22672C1.17793 1.22672 1.01065 1.22672 .87822 1.14308C1.16399 1.05247 1.1849 .80155 1.1849 .75973C1.1849 .60639 1.06641 .50184 .9061 .50184C.71791 .50184 .50881 .66215 .5088

es/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Export topology.interfaces.topology.\nRequire Import logic.aprop relations orders.subset.\nRequire Import rewrite easy.\nRequire Import set_lambda.\n\nImport image_notation.\nImport tensor_map_notation.\n\nLocal Open Scope topology_scope.\n\n(** Uniform spaces *)\n\nSet Typeclasses Unique Instances.\n\nDefinition Uniformity X := 𝒫² (X ⊗ X).\nExisting Class Uniformity.\nIdentity Coercion Uniformity_double_subset : Uniformity >-> double_subset.\n#[global] Hint Mode Uniformity + : typeclass_instances.\n\nUnset Typeclasses Unique Instances.\n\nDefinition near `{Φ:Uniformity X} : Φ ⇾ X ⇾ 𝒫 X := set:(λ (U:Φ) x, {y:X | (x, y) ∊ U}).\nDefinition thicken `{Φ:Uniformity X}\n  := set:(λ '(U, A) : Φ ⊗ 𝒫 X, { y:X | ∐ x, x ∊ A ⊠ (x, y) ∊ U}).\n\nModule thicken_notation.\n  Notation \"U .[ A ]\" := (func_op thicken (U, A))\n    (at level 1, A at level 200, format \"U .[ A ]\") : topology_scope.\nEnd thicken_notation.\n\n(** The \"uniformly below\" relation of pointfree topology (Picado-Pultr):\n    [K ◁ S] when [S] is a uniform neighborhood of [K].  This is the uniform\n    leg of the WCUnif well-containment relation [⋐]; the bornological leg\n    [K ∊ 𝒜] is conjoined where a bornology is present. *)\nSection uniformly_below.\n  Import thicken_notation.\n  Definition uniformly_below `{Φ:Uniformity X}\n    := { '(K, S) : 𝒫 X ⊗ 𝒫 X | ∐ U:Φ, U.[K] ⊆ S }.\nEnd uniformly_below.\nNotation \"K ◁ S\" := (func_op uniformly_below (K, S)) (at level 70, no associativity) : topology_scope.\n\nLocal Open Scope grp_scope.\nClass PreUniformSpace X {Φ:Uniformity X} : SProp :=\n{ uniform_refl U : U ∊ Φ ⊸ id_rel X ⊆ U\n; uniform_sym U : U ∊ Φ ⊸ U⁻¹ ∊ Φ\n; uniform_split (U:Φ) : ∐ (V:Φ), V ⋄ V ⊆ U\n}.\n\nRecord UniformSpace X {Φ:Uniformity X} : SProp :=\n{ #[canonical=no, reversible=no] uniform_filter :> Filter Φ\n; #[canonical=no, reversible=no] uniform_pre :> PreUniformSpace X\n}.\nExisting Class UniformSpace.\n\nClass StrongUniformSplit X {Φ:Uniformity X} : SProp :=\n  strong_uniform_split (U:Φ) : ∐ (V:Φ), ∏ x y z, near V x y ∧ near V y z ⊸ near U x z .\nRecord StrongUniformSpace X {Φ:Uniformity X} : SProp :=\n{ #[canonical=no, reversible=no] strong_uniform_space_uniform :> UniformSpace X\n; #[canonical=no, reversible=no] strong_uniform_space_split :> StrongUniformSplit X\n}.\nExisting Class StrongUniformSpace.\n\nRecord SeparatedUniformSpace X {Φ:Uniformity X} : SProp :=\n{ #[canonical=no, reversible=no] separated_uniform_space_uniform :> UniformSpace X\n; uniform_separated x y : (∏ (U:Φ), near U x y) ⊸ x = y\n}.\nExisting Class SeparatedUniformSpace.\nArguments uniform_separated {X _ _} x y.\n\nRecord SeparatedStrongUniformSpace X {Φ:Uniformity X} : SProp :=\n{ #[canonical=no, reversible=no] separated_strong_ufm_space_separated :> SeparatedUniformSpace X\n; #[canonical=no, reversible=no] separated_strong_ufm_space_strong :> StrongUniformSpace X\n}.\nExisting Class SeparatedStrongUniformSpace.\n\nLocal Open Scope subset_scope.\n\nClass UniformRegularity X {Φ:Uniformity X} : SProp :=\n  uniform_regularity (U:Φ) : ∐ (V:Φ), V ⊆ U ⊠ powerset_pt U ⊔ V ᗮ = ⊤.\n\nLocal Close Scope subset_scope.\n\nRecord RegularUniformSpace X {Φ:Uniformity X} : SProp :=\n{ #[canonical=no, reversible=no] regular_uniform_space_uniform :> UniformSpace X\n; #[canonical=no, reversible=no] regular_uniform_space_regular :> UniformRegularity X\n}.\nExisting Class RegularUniformSpace.\n\nRecord SeparatedRegularUniformSpace X {Φ:Uniformity X} : SProp :=\n{ #[canonical=no, reversible=no] sep_regular_uniform_space_reg :> RegularUniformSpace X\n; #[canonical=no, reversible=no] sep_regular_uniform_space_sep :> SeparatedUniformSpace X\n}.\nExisting Class SeparatedRegularUniformSpace.\n\n\nCoercion UniformNeighborhood `{Φ:Uniformity X} : Neighborhood X :=\n  set:(λ '(x, N), ∐ U, ∏ (y: X), @near X Φ U x y ⊸ y ∊ N).\nGlobal Hint Extern 40 (Neighborhood ?X) => simple notypeclasses refine UniformNeighborhood : typeclass_instances.\n\nSubClass UniformityPresentation@{u} X {Φ:Uniformity@{u} X} {Λ:Type@{u}} (β:Λ → 𝒫 (X ⊗ X))\n  := FilterPresentation Φ β.\nSubClass UniformityBasis@{u} `{Φ:Uniformity@{u} X} {Λ:Type@{u}} (β:Λ → Φ) := FilterBasis β.\nExisting Class UniformityPresentation.\nExisting Class UniformityBasis.\n\nClass UniformContinuity@{u}  {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} (f:X → Y) : SProp :=\n  ufm_continuity (V:Ψ) : ∐ (U:Φ), ∏ x y, near U x y ⊸ near V (f x) (f y).\nArguments ufm_continuity {X Y _ _} f {_} V.\n\nRecord UniformlyContinuous@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] ufm_cont_X :> UniformSpace X\n; ufm_cont_Y : UniformSpace Y\n; #[canonical=no, reversible=no] ufm_cont :> UniformContinuity f\n}.\nExisting Class UniformlyContinuous.\n\nClass UniformReflection@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} (f:X → Y) : SProp :=\n  ufm_reflection (U:Φ) : ∐ (V:Ψ), ∏ x y, near V (f x) (f y) ⊸ near U x y.\nArguments ufm_reflection {X Y _ _} f {_} U.\n\nRecord UniformlyReflecting@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] ufm_reflecting_X :> UniformSpace X\n; ufm_reflecting_Y : UniformSpace Y\n; #[canonical=no, reversible=no] ufm_reflecting :> UniformReflection f\n}.\nExisting Class UniformlyReflecting.\n\nRecord UniformlyInitial@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} (f:X ⇾ Y) : SProp :=\n{ #[canonical=no, reversible=no] ufm_initial_cont :> UniformlyContinuous f\n; #[canonical=no, reversible=no] ufm_initial_refl :> UniformlyReflecting f\n}.\nExisting Class UniformlyInitial.\n\nRecord UniformlyEmbedding@{u} {X Y:set@{u} l":true},{"s":9640,"e":9650,"lib":"AffineConstructive.topology.interfaces.uniform","name":"ufm_cont_Y","kind":"proj","local":true},{"s":9978,"e":9990,"lib":"AffineConstructive.topology.interfaces.uniform","name":"UniformSpace","kind":"class","local":true},{"s":10024,"e":10043,"lib":"AffineConstructive.topology.interfaces.uniform","name":"UniformlyContinuous","kind":"class","local":true},{"s":10092,"e":10108,"lib":"AffineConstructive.topology.interfaces.uniform","name":"UniformlyInitial","kind":"class","local":true},{"s":10157,"e":10175,"lib":"AffineConstructive.topology.interfaces.uniform","name":"UniformlyEmbedding","kind":"class","local":true},{"s":10224,"e":10243,"lib":"AffineConstructive.topology.interfaces.uniform","name":"UniformlyReflecting","kind":"class","local":true},{"s":10298,"e":10308,"lib":"AffineConstructive.topology.interfaces.uniform","name":"Completion","kind":"class","local":true},{"s":10334,"e":10344,"lib":"AffineConstructive.topology.interfaces.uniform","name":"ufm_cont_X","kind":"proj","local":true},{"s":10268,"e":10284,"lib":"AffineConstructive.topology.interfaces.uniform","name":"ufm_reflecting_Y","kind":"proj","local":true},{"s":10200,"e":10210,"lib":"AffineConstructive.topology.interfaces.uniform","name":"ufm_cont_Y","kind":"proj","local":true},{"s":10133,"e":10143,"lib":"AffineConstructive.topology.interfaces.uniform","name":"ufm_cont_Y","kind":"proj","local":true},{"s":10068,"e":10078,"lib":"AffineConstructive.topology.interfaces.uniform","name":"ufm_cont_Y","kind":"proj","local":true}],"gloss":{"summary":"The file sets up the basic notions of uniform spaces. A uniformity on X is a set of entourages, which are subsets of X ⊗ X. Points x and y are U-close when (x, y) ∊ U. A uniform space is a uniformity that is a filter and satisfies three axioms: reflexivity, symmetry, and splitting (each entourage contains some V ⋄ V). Stronger variants are a splitting with the additive conjunction, separation, and regularity. The uniformity induces a neighbourhood relation. The file then defines the following maps: uniformly continuous and uniformly reflecting maps, uniformly initial maps (both at once), and uniform embeddings. It also defines presentations of the tensor and cartesian product uniformities and of the discrete and indiscrete uniformities, the thickening U.[A] with the relation K ◁ S, and Cauchy filters. Finally it states the universal property of a completion: a separated space Y with a uniformly initial dense map ι from X, such that any uniformly initial dense f : X → Z has a uniformly continuous extension Z → Y with composite ι. The Cauchy completion and the bornological files build on these interfaces.","short":"Uniform spaces: entourages, uniformly continuous and reflecting maps, Cauchy filters, completions","items":[{"name":"AffineConstructive.topology.interfaces.uniform.Uniformity","base":"Uniformity","kind":"def","start":8,"body":null,"status":"ok","short":{"text":"A uniformity on X: a set of relations on X, the entourages, before any axioms","status":"ok"},"long":{"text":"A uniformity on a set X is a set Φ of subsets of X ⊗ X, that is, a set of binary relations on X; its members are the entourages. The definition fixes only the carrier of the structure. The conditions that make Φ a uniformity in the traditional sense (a filter of relations, each containing the diagonal, closed under inverse, with the splitting property) are stated separately, in [[AffineConstructive.topology.interfaces.uniform.PreUniformSpace]] and [[AffineConstructive.topology.interfaces.uniform.UniformSpace]], so that a uniformity can be named and worked with before its axioms are proved. The relations live on the tensor square X ⊗ X, whose equality of pairs is multiplicative; being an affine relation, an entourage is at once a degree of closeness and a degree of apartness. Uniformity is declared a class, so the uniformity of a set is found by resolution.\n\nThe concrete uniformities are mostly presented by a family of generating relations, the relations containing some generator ([[AffineConstructive.topology.uniform.basis.presented_uniformity]]); the discrete uniformity, presented by the diagonal alone, is one ([[AffineConstructive.topology.uniform.basis.discrete_uniformity]]). On this carrier the file builds the vocabulary of uniform spaces, starting with [[AffineConstructive.topology.interfaces.uniform.near]], which reads an entourage U as the relation \"x and y are U-close\".","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.Uniformity_double_subset","base":"Uniformity_double_subset","kind":"def","start":10,"body":null,"status":"ok","short":{"text":"Lets a uniformity on X be used wherever a set of relations on X is expected","status":"ok"},"long":{"text":"A uniformity on X, `Uniformity X`, is by definition a set of subsets of X ⊗ X, the relations it counts as entourages; it is declared a class of its own so that resolution can find the uniformity of a set. This coercion is the identity from that class back to the set of relations `𝒫² (X ⊗ X)`. It lets a uniformity be used wherever a set of relations is expected, without any conversion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.near","base":"near","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"near U x y: the points x and y are U-close, (x, y) ∊ U","status":"ok"},"long":{"text":"For an entourage U of a uniformity Φ and a point x, near U x is the subset of points y with (x, y) ∊ U, the U-ball around x. It is packaged as a function of sets Φ ⇾ X ⇾ 𝒫 X, so it respects equality in both the entourage and the centre; near U x y is then the affine proposition that x and y are U-close, whose refutation says that they are U-apart. Almost every uniform notion of the development (continuity, Cauchy filters, separation, the uniform topology) is phrased through near.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.thicken","base":"thicken","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"The thickening U[A]: the points U-close to some point of A","status":"ok"},"long":{"text":"For an entourage U and a subset A, the thickening U[A] (notation U.[A]) consists of the points y for which there is x with x ∊ A tensor (x, y) ∊ U. It is the relational image of A under U, the uniform neighbourhood of A of size U. The existential is affine (∐), and the two conditions are joined multiplicatively, so that the refutation of y ∊ U[A] says: every x in A is U-apart from y, and every x U-close to y lies outside A.\n\nThickening is the basic operation for comparing subsets uniformly; it defines the relation [[AffineConstructive.topology.interfaces.uniform.uniformly_below]] and through it the well-containment of the well-containment uniform spaces.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.uniformly_below","base":"uniformly_below","kind":"def","start":20,"body":null,"status":"ok","short":{"text":"K ◁ S: some thickening U[K] is contained in S, so S is a uniform neighbourhood of K","status":"ok"},"long":{"text":"The relation K ◁ S holds when there is an entourage U with U[K] ⊆ S: the subset S contains a uniform neighbourhood of K. This is the \"uniformly below\" relation of pointfree uniform topology (Picado and Pultr). It is defined as a subset of 𝒫 X ⊗ 𝒫 X, so it respects equality of subsets, and its existential is affine, so a refutation of K ◁ S says that for every entourage U the thickening U[K] escapes S.\n\nIn the development, ◁ is the uniform leg of the well-containment relation ⋐ of a well-containment uniform space: K ⋐ S is K ◁ S together with boundedness of K in the bornology.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.PreUniformSpace","base":"PreUniformSpace","kind":"rec","start":24,"body":null,"status":"ok","short":{"text":"The axioms of a uniformity apart from the filter laws: reflexivity, symmetry, splitting","status":"ok"},"long":{"text":"A pre-uniform space is a set X with a uniformity Φ whose entourages contain the diagonal, whose inverses U⁻¹ are again entourages, and which split: for every entourage U there is an entourage V whose composite V ⋄ V is contained in U. Together with the filter laws ([[AffineConstructive.topology.interfaces.uniform.UniformSpace]]) these are the usual axioms of a uniform space in the entourage formulation.\n\nThe reflexivity and symmetry axioms are stated affinely, U ∊ Φ implies …, so each carries its contrapositive: a relation not containing the diagonal, or whose inverse is no entourage, is refuted as an entourage. The splitting axiom ranges over the members of Φ and produces V by the affine existential. The composite ⋄ uses the tensor, so the triangle law it encodes uses each closeness hypothesis once; the stronger additive version is [[AffineConstructive.topology.interfaces.uniform.StrongUniformSplit]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.uniform_refl","base":"uniform_refl","kind":"proj","short":{"text":"Every entourage contains the diagonal","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.uniform_sym","base":"uniform_sym","kind":"proj","short":{"text":"The inverse of an entourage is an entourage","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.uniform_split","base":"uniform_split","kind":"proj","short":{"text":"Every entourage U contains V ⋄ V for some entourage V","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_PreUniformSpace","base":"Build_PreUniformSpace","kind":"constr","short":{"text":"Builds a pre-uniform space from reflexivity, symmetry and splitting","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformSpace","base":"UniformSpace","kind":"rec","start":25,"body":null,"status":"ok","short":{"text":"A uniform space: a uniformity that is a filter of relations and a pre-uniform space","status":"ok"},"long":{"text":"A uniform space is a set X with a uniformity Φ that is a filter in (𝒫 (X ⊗ X), ⊆), upward closed and closed under finite meets with the full relation as a member, and that satisfies the axioms of [[AffineConstructive.topology.interfaces.uniform.PreUniformSpace]]. This is the classical entourage definition, read in affine logic: entourages are complemented relations, so the structure carries at once a closeness and an apartness between points, and the axioms hold of both readings.\n\nIt is the basic class of the uniform half of the development; its two components are reached by coercion, so a uniform space is used directly as a filter or as a pre-uniform space.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.uniform_filter","base":"uniform_filter","kind":"proj","short":{"text":"The uniformity of a uniform space is a filter","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.uniform_pre","base":"uniform_pre","kind":"proj","short":{"text":"A uniform space is a pre-uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_UniformSpace","base":"Build_UniformSpace","kind":"constr","short":{"text":"Builds a uniform space from the filter laws and the pre-uniform axioms","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.StrongUniformSplit","base":"StrongUniformSplit","kind":"ind","start":27,"body":null,"status":"ok","short":{"text":"Strong splitting: each U has V with V-closeness of x, y and of y, z, additively, implying U-closeness of x, z","status":"ok"},"long":{"text":"The strong splitting property asks, for every entourage U, for an entourage V such that near V x y and near V y z implies near U x z, with the additive and in the premise. Since a tensor implies the corresponding additive conjunction, this is stronger than the splitting of [[AffineConstructive.topology.interfaces.uniform.PreUniformSpace]]. Read contrapositively it is a cotransitivity: if x and z are U-apart, then x and y are V-apart or y and z are V-apart, for every y. It is the uniform counterpart of an apartness, as a strong set is to a set.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.StrongUniformSplit","base":"StrongUniformSplit","kind":"rec","short":{"text":"The class of uniformities with the strong splitting property","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.strong_uniform_split","base":"strong_uniform_split","kind":"proj","short":{"text":"Each entourage U has V with V-closeness additively transitive into U-closeness","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.StrongUniformSpace","base":"StrongUniformSpace","kind":"rec","start":28,"body":null,"status":"ok","short":{"text":"A uniform space with the strong (additive) splitting property","status":"ok"},"long":{"text":"A strong uniform space is a [[AffineConstructive.topology.interfaces.uniform.UniformSpace]] whose uniformity also satisfies [[AffineConstructive.topology.interfaces.uniform.StrongUniformSplit]]: the triangle law holds with the additive conjunction, so that U-apartness of two points is witnessed, at a smaller scale, by apartness from every third point on one side or the other. It is the uniform analogue of a strong set, whose inequality is cotransitive.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.strong_uniform_space_uniform","base":"strong_uniform_space_uniform","kind":"proj","short":{"text":"A strong uniform space is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.strong_uniform_space_split","base":"strong_uniform_space_split","kind":"proj","short":{"text":"A strong uniform space has the strong splitting property","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_StrongUniformSpace","base":"Build_StrongUniformSpace","kind":"constr","short":{"text":"Builds a strong uniform space from a uniform space and strong splitting","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.SeparatedUniformSpace","base":"SeparatedUniformSpace","kind":"rec","start":30,"body":null,"status":"ok","short":{"text":"A separated uniform space: points close at every scale are equal","status":"ok"},"long":{"text":"A uniform space is separated when two points that are U-close for every entourage U are equal. The universal quantifier is affine and the statement is an affine implication, so it carries its contrapositive: two unequal points are U-apart for some entourage U. Under the antithesis translation, separation therefore says at once that the uniformity is Hausdorff and that the inequality of the set is witnessed uniformly. Completions are required to be separated ([[AffineConstructive.topology.interfaces.uniform.Completion]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.separated_uniform_space_uniform","base":"separated_uniform_space_uniform","kind":"proj","short":{"text":"A separated uniform space is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.uniform_separated","base":"uniform_separated","kind":"proj","short":{"text":"Points U-close for every entourage U are equal","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_SeparatedUniformSpace","base":"Build_SeparatedUniformSpace","kind":"constr","short":{"text":"Builds a separated uniform space from a uniform space and the separation law","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.SeparatedStrongUniformSpace","base":"SeparatedStrongUniformSpace","kind":"rec","start":33,"body":null,"status":"ok","short":{"text":"A uniform space that is both separated and strong","status":"ok"},"long":{"text":"The conjunction of [[AffineConstructive.topology.interfaces.uniform.SeparatedUniformSpace]] and [[AffineConstructive.topology.interfaces.uniform.StrongUniformSpace]]: a uniform space whose points are separated by entourages and whose splitting holds additively. Both parts are reached by coercion.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.separated_strong_ufm_space_separated","base":"separated_strong_ufm_space_separated","kind":"proj","short":{"text":"A separated strong uniform space is separated","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.separated_strong_ufm_space_strong","base":"separated_strong_ufm_space_strong","kind":"proj","short":{"text":"A separated strong uniform space is strong","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_SeparatedStrongUniformSpace","base":"Build_SeparatedStrongUniformSpace","kind":"constr","short":{"text":"Builds a separated strong uniform space from its two parts","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformRegularity","base":"UniformRegularity","kind":"ind","start":36,"body":null,"status":"ok","short":{"text":"Regularity of a uniformity: each U has an entourage V ⊆ U with every pair in U or outside V","status":"ok"},"long":{"text":"A uniformity is regular when every entourage U has an entourage V with V ⊆ U ⊠ U ⊔ Vᗮ = ⊤: V is finer than U, and every pair of points is either U-close or V-apart. Classically the condition holds with V = U; in affine logic it is a genuine condition, asking that closeness at U be decidable against apartness at the finer V.\n\nIt is the regularity half of [[AffineConstructive.topology.interfaces.uniform.RegularUniformSpace]], which pairs it with the uniform space axioms. [[AffineConstructive.topology.uniform.base.uniform_regularity_alt]] restates it pointwise: in a regular uniformity each U has an entourage V ⊆ U such that every pair is U-close or V-apart.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.UniformRegularity","base":"UniformRegularity","kind":"rec","short":{"text":"The class of regular uniformities","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.uniform_regularity","base":"uniform_regularity","kind":"proj","short":{"text":"Each entourage U has an entourage V ⊆ U whose complement together with U covers everything","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.RegularUniformSpace","base":"RegularUniformSpace","kind":"rec","start":38,"body":null,"status":"ok","short":{"text":"A uniform space whose uniformity is regular","status":"ok"},"long":{"text":"A regular uniform space is a [[AffineConstructive.topology.interfaces.uniform.UniformSpace]] satisfying [[AffineConstructive.topology.interfaces.uniform.UniformRegularity]]: each entourage U contains a finer entourage V such that every pair of points is U-close or V-apart. Classically every uniform space is regular; constructively the condition is a genuine locatedness hypothesis.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.regular_uniform_space_uniform","base":"regular_uniform_space_uniform","kind":"proj","short":{"text":"A regular uniform space is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.regular_uniform_space_regular","base":"regular_uniform_space_regular","kind":"proj","short":{"text":"A regular uniform space has a regular uniformity","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_RegularUniformSpace","base":"Build_RegularUniformSpace","kind":"constr","short":{"text":"Builds a regular uniform space from a uniform space and regularity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.SeparatedRegularUniformSpace","base":"SeparatedRegularUniformSpace","kind":"rec","start":40,"body":null,"status":"ok","short":{"text":"A uniform space that is both separated and regular","status":"ok"},"long":{"text":"The conjunction of [[AffineConstructive.topology.interfaces.uniform.RegularUniformSpace]] and [[AffineConstructive.topology.interfaces.uniform.SeparatedUniformSpace]], with both parts reached by coercion.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.sep_regular_uniform_space_reg","base":"sep_regular_uniform_space_reg","kind":"proj","short":{"text":"A separated regular uniform space is regular","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.sep_regular_uniform_space_sep","base":"sep_regular_uniform_space_sep","kind":"proj","short":{"text":"A separated regular uniform space is separated","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_SeparatedRegularUniformSpace","base":"Build_SeparatedRegularUniformSpace","kind":"constr","short":{"text":"Builds a separated regular uniform space from its two parts","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformNeighborhood","base":"UniformNeighborhood","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"The uniform topology: N is a neighbourhood of x when some ball near U x lies in N","status":"ok"},"long":{"text":"The neighbourhood relation induced by a uniformity: N is a neighbourhood of x when there is an entourage U such that every y that is U-close to x lies in N. This is the uniform topology, given in the neighbourhood form of Shulman's affine topology; its refutation says that every ball around x meets the complement of N. It is declared a coercion and found by resolution, so every uniform space is treated as a topological space without further mention, and continuity, density and closure for uniform spaces refer to it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformityPresentation","base":"UniformityPresentation","kind":"def","start":44,"body":null,"status":"ok","short":{"text":"β presents the uniformity Φ: a relation is an entourage if and only if it contains some β i","status":"ok"},"long":{"text":"A family β of relations on X, indexed by any type Λ, presents the uniformity Φ when a relation U is an entourage of Φ exactly when some generator β i is contained in U. The generators need not be entourages beforehand, so a presentation determines Φ. This is the filter presentation [[AffineConstructive.interfaces.orders.FilterPresentation]] of Φ, restated for a uniformity so that resolution can tell the two situations apart.\n\nThe constructions of uniformities are stated this way. The pulled-back uniformity is presented by the preimages of the entourages of the target ([[AffineConstructive.topology.uniform.subspace.pullback_uniformity_presented]]), and [[AffineConstructive.topology.uniform.basis.presented_uniformity_prop]] shows that a family presents the uniformity it generates. The product uniformities [[AffineConstructive.topology.interfaces.uniform.TensorProductUniformity]] and [[AffineConstructive.topology.interfaces.uniform.CartesianProductUniformity]], and the discrete and indiscrete uniformities [[AffineConstructive.topology.interfaces.uniform.DiscreteUniformity]] and [[AffineConstructive.topology.interfaces.uniform.IndiscreteUniformity]], are defined as presentations.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.Id_UniformityPresentation_FilterPresentation","base":"Id_UniformityPresentation_FilterPresentation","kind":"inst","short":{"text":"A presentation of a uniformity is a filter presentation of its set of entourages","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformityBasis","base":"UniformityBasis","kind":"def","start":45,"body":null,"status":"ok","short":{"text":"β is a basis of the uniformity Φ: every entourage contains some entourage β i","status":"ok"},"long":{"text":"A family β of entourages of Φ, indexed by any type Λ, is a basis when every entourage contains some member β i. In other words, β is coinitial in the entourages ordered by inclusion, which is the filter basis [[AffineConstructive.interfaces.orders.FilterBasis]] of Φ, restated for a uniformity. A basis differs from a [[AffineConstructive.topology.interfaces.uniform.UniformityPresentation]] because its members are entourages from the start: a basis describes a uniformity that is already given, and a presentation defines one.\n\nA uniformity is a basis of itself ([[AffineConstructive.topology.uniform.basis.uniform_basis_self]]), and bases of two uniformities give, in pairs, a basis of their tensor product ([[AffineConstructive.topology.uniform.product.tensor_product_uniform_basis_correct]]). Bases are what allow uniform notions to be checked on basic entourages alone, as in [[AffineConstructive.topology.uniform.basis.ufm_cont_by_basis]] for uniform continuity.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.Id_UniformityBasis_FilterBasis","base":"Id_UniformityBasis_FilterBasis","kind":"inst","short":{"text":"A basis of a uniformity is a filter basis of its set of entourages","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformContinuity","base":"UniformContinuity","kind":"ind","start":48,"body":null,"status":"ok","short":{"text":"The uniform continuity condition on a function: each V has U with U-closeness implying V-closeness of images","status":"ok"},"long":{"text":"A function f between sets with uniformities Φ and Ψ satisfies the uniform continuity condition when every entourage V of Ψ has an entourage U of Φ such that, for all x and y, x U-close to y implies f x V-close to f y. The implication is affine, so the condition also reads backwards: if the images are V-apart, then the points are U-apart. The condition is stated for a bare function, without the uniform space axioms; [[AffineConstructive.topology.interfaces.uniform.UniformlyContinuous]] adds those.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.UniformContinuity","base":"UniformContinuity","kind":"rec","short":{"text":"The class of functions satisfying the uniform continuity condition","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.ufm_continuity","base":"ufm_continuity","kind":"proj","short":{"text":"Each entourage V of the target has U with U-closeness implying V-closeness of images","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformlyContinuous","base":"UniformlyContinuous","kind":"rec","start":50,"body":null,"status":"ok","short":{"text":"A uniformly continuous function between uniform spaces","status":"ok"},"long":{"text":"A morphism of sets f : X ⇾ Y is uniformly continuous when X and Y are uniform spaces and f satisfies [[AffineConstructive.topology.interfaces.uniform.UniformContinuity]]. Carrying the space axioms of both ends inside the class lets a hypothesis of uniform continuity supply them to later resolution. This is the forward class of maps for uniform spaces; it is paired with the reflecting class [[AffineConstructive.topology.interfaces.uniform.UniformlyReflecting]], and the two together give [[AffineConstructive.topology.interfaces.uniform.UniformlyInitial]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.ufm_cont_X","base":"ufm_cont_X","kind":"proj","short":{"text":"The domain of a uniformly continuous map is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.ufm_cont_Y","base":"ufm_cont_Y","kind":"proj","short":{"text":"The codomain of a uniformly continuous map is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.ufm_cont","base":"ufm_cont","kind":"proj","short":{"text":"A uniformly continuous map satisfies the uniform continuity condition","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_UniformlyContinuous","base":"Build_UniformlyContinuous","kind":"constr","short":{"text":"Builds uniform continuity from the two uniform spaces and the continuity condition","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformReflection","base":"UniformReflection","kind":"ind","start":52,"body":null,"status":"ok","short":{"text":"The uniform reflection condition: each U has V with V-closeness of images implying U-closeness","status":"ok"},"long":{"text":"A function f satisfies the uniform reflection condition when every entourage U of the domain has an entourage V of the codomain such that f x V-close to f y implies x U-close to y. It is the comparison of uniformities in the direction opposite to [[AffineConstructive.topology.interfaces.uniform.UniformContinuity]]: the domain's uniformity is no finer than the one pulled back along f. Contrapositively, points that are U-apart have V-apart images.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.UniformReflection","base":"UniformReflection","kind":"rec","short":{"text":"The class of functions satisfying the uniform reflection condition","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.ufm_reflection","base":"ufm_reflection","kind":"proj","short":{"text":"Each entourage U of the domain has V with V-closeness of images implying U-closeness","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformlyReflecting","base":"UniformlyReflecting","kind":"rec","start":54,"body":null,"status":"ok","short":{"text":"A uniformly reflecting map between uniform spaces","status":"ok"},"long":{"text":"A morphism f : X ⇾ Y is uniformly reflecting when X and Y are uniform spaces and f satisfies [[AffineConstructive.topology.interfaces.uniform.UniformReflection]]: closeness of images at some scale forces closeness of the points at any prescribed scale. It is the reflecting class matching [[AffineConstructive.topology.interfaces.uniform.UniformlyContinuous]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.ufm_reflecting_X","base":"ufm_reflecting_X","kind":"proj","short":{"text":"The domain of a uniformly reflecting map is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.ufm_reflecting_Y","base":"ufm_reflecting_Y","kind":"proj","short":{"text":"The codomain of a uniformly reflecting map is a uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.ufm_reflecting","base":"ufm_reflecting","kind":"proj","short":{"text":"A uniformly reflecting map satisfies the uniform reflection condition","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_UniformlyReflecting","base":"Build_UniformlyReflecting","kind":"constr","short":{"text":"Builds a uniformly reflecting map from the two spaces and the reflection condition","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformlyInitial","base":"UniformlyInitial","kind":"rec","start":56,"body":null,"status":"ok","short":{"text":"A uniformly initial map: uniformly continuous and uniformly reflecting","status":"ok"},"long":{"text":"A morphism is uniformly initial when it is both [[AffineConstructive.topology.interfaces.uniform.UniformlyContinuous]] and [[AffineConstructive.topology.interfaces.uniform.UniformlyReflecting]]: the uniformity of the domain is exactly the one pulled back from the codomain along f. These are the initial morphisms of the category of uniform spaces; injectivity is not required (that is [[AffineConstructive.topology.interfaces.uniform.UniformlyEmbedding]]).","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.ufm_initial_cont","base":"ufm_initial_cont","kind":"proj","short":{"text":"A uniformly initial map is uniformly continuous","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.ufm_initial_refl","base":"ufm_initial_refl","kind":"proj","short":{"text":"A uniformly initial map is uniformly reflecting","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_UniformlyInitial","base":"Build_UniformlyInitial","kind":"constr","short":{"text":"Builds a uniformly initial map from continuity and reflection","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.UniformlyEmbedding","base":"UniformlyEmbedding","kind":"rec","start":58,"body":null,"status":"ok","short":{"text":"A uniform embedding: a uniformly initial injective map","status":"ok"},"long":{"text":"A uniform embedding is a [[AffineConstructive.topology.interfaces.uniform.UniformlyInitial]] map that is moreover injective, so that it identifies the domain, with its uniformity, with a subspace of the codomain. Injectivity is affine, so an embedding also preserves inequality.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.ufm_embedding_initial","base":"ufm_embedding_initial","kind":"proj","short":{"text":"A uniform embedding is uniformly initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.ufm_embedding_inj","base":"ufm_embedding_inj","kind":"proj","short":{"text":"A uniform embedding is injective","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_UniformlyEmbedding","base":"Build_UniformlyEmbedding","kind":"constr","short":{"text":"Builds a uniform embedding from initiality and injectivity","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.tensor_product_uniform_presentation","base":"tensor_product_uniform_presentation","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"The basic entourages of X ⊗ Y: U-closeness of first coordinates tensor V-closeness of second","status":"ok"},"long":{"text":"To a pair of entourages (U, V) of X and Y it assigns the relation on X ⊗ Y relating (x₁, y₁) and (x₂, y₂) when x₁ is U-close to x₂ tensor y₁ is V-close to y₂. The multiplicative conjunction matches the multiplicative equality of the tensor product, so pairs are apart at this scale when closeness in one coordinate forces apartness in the other. These relations present the tensor product uniformity ([[AffineConstructive.topology.interfaces.uniform.TensorProductUniformity]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.cartesian_product_uniform_presentation","base":"cartesian_product_uniform_presentation","kind":"def","start":64,"body":null,"status":"ok","short":{"text":"The basic entourages of X × Y: U-closeness of first coordinates and V-closeness of second, additively","status":"ok"},"long":{"text":"To a pair of entourages (U, V) it assigns the relation on X × Y relating (x₁, y₁) and (x₂, y₂) when x₁ is U-close to x₂ and y₁ is V-close to y₂, with the additive conjunction, matching the additive equality of the cartesian product. Pairs are apart at this scale when they are apart in one coordinate or the other. These relations present the cartesian product uniformity ([[AffineConstructive.topology.interfaces.uniform.CartesianProductUniformity]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.TensorProductUniformity","base":"TensorProductUniformity","kind":"def","start":65,"body":null,"status":"ok","short":{"text":"Ξ is the tensor product of Φ and Ψ: it is presented by the tensor product entourages","status":"ok"},"long":{"text":"A uniformity Ξ on X ⊗ Y is the tensor product of Φ and Ψ when it is presented by [[AffineConstructive.topology.interfaces.uniform.tensor_product_uniform_presentation]]. The product is characterised by a class rather than built as a single instance, so that lemmas about products can be stated for any uniformity with this presentation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.CartesianProductUniformity","base":"CartesianProductUniformity","kind":"def","start":66,"body":null,"status":"ok","short":{"text":"Ξ is the cartesian product of Φ and Ψ: it is presented by the cartesian product entourages","status":"ok"},"long":{"text":"A uniformity Ξ on X × Y is the cartesian product of Φ and Ψ when it is presented by [[AffineConstructive.topology.interfaces.uniform.cartesian_product_uniform_presentation]], the relations in which both coordinates are close, joined additively. As with [[AffineConstructive.topology.interfaces.uniform.TensorProductUniformity]], the product is a characterisation class, so results apply to any uniformity with this presentation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.DiscreteUniformity","base":"DiscreteUniformity","kind":"def","start":75,"body":null,"status":"ok","short":{"text":"Φ is discrete: presented by the diagonal alone, so every relation containing it is an entourage","status":"ok"},"long":{"text":"The uniformity Φ is discrete when it is presented by a single generator, the identity relation of X, indexed by the unit type. A relation is then an entourage exactly when it contains the diagonal. This is the finest uniformity on X, under which close points are equal.\n\nThe discrete uniformity is shown to satisfy this class in [[AffineConstructive.topology.uniform.basis.discrete_uniformity_correct]], and [[AffineConstructive.topology.uniform.basis.discrete_uniform_space]] makes X a uniform space with it.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.Id_DiscreteUniformity_UniformityPresentation","base":"Id_DiscreteUniformity_UniformityPresentation","kind":"inst","short":{"text":"A discrete uniformity is presented by the diagonal","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.IndiscreteUniformity","base":"IndiscreteUniformity","kind":"def","start":76,"body":null,"status":"ok","short":{"text":"Φ is indiscrete: presented by the full relation alone, the coarsest uniformity","status":"ok"},"long":{"text":"The uniformity Φ is indiscrete when it is presented by a single generator, the full relation on X, indexed by the unit type. The only entourages are then the relations that contain the full relation, so any two points are close at every entourage. This is the coarsest uniformity on X.\n\nThe indiscrete uniformity is shown to satisfy this class in [[AffineConstructive.topology.uniform.basis.indiscrete_uniformity_correct]], and [[AffineConstructive.topology.uniform.basis.indiscrete_uniform_space]] makes X a uniform space with it. By [[AffineConstructive.topology.uniform.basis.unit_uniform_indiscrete]], every uniform space structure on the one-point set is indiscrete.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.Id_IndiscreteUniformity_UniformityPresentation","base":"Id_IndiscreteUniformity_UniformityPresentation","kind":"inst","short":{"text":"An indiscrete uniformity is presented by the full relation","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.CauchyFilter","base":"CauchyFilter","kind":"rec","start":82,"body":null,"status":"ok","short":{"text":"A Cauchy filter: a proper filter with a U-small member for every entourage U","status":"ok"},"long":{"text":"A filter F of subsets of X is Cauchy when it is proper and has, for every entourage U, a member A that is U-small. Proper means the empty subset is not a member of F. U-small means that for all x and y, x ∊ A ⊠ y ∊ A implies that x and y are U-close. Each membership is used once. The contrapositive reads: if x and y are U-apart, then x ∉ A par y ∉ A. So given one of the two points in A, the other lies outside A. The member A is given by an affine existential over the members of F, so it is supplied together with its smallness.\n\nThis is the uniform notion of a filter whose members become arbitrarily small. Cauchy filters are the points of the Cauchy completion 𝒞 X. There they are bundled with their proof as [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_filter]]. Two basic examples are [[AffineConstructive.topology.uniform.cauchy_completion.principal_subset_filter_cauchy]], where the principal filter of a point of a uniform space is Cauchy, and [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map_filter_cauchy]], where the image of a Cauchy filter under a uniformly continuous map is Cauchy.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.cauchy_filter_filter","base":"cauchy_filter_filter","kind":"proj","short":{"text":"The filter underlying a Cauchy filter","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.cauchy_proper","base":"cauchy_proper","kind":"proj","short":{"text":"A Cauchy filter is proper: the empty subset is not a member","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.cauchy","base":"cauchy","kind":"proj","short":{"text":"For each entourage U, a Cauchy filter has a member whose points are pairwise U-close","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_CauchyFilter","base":"Build_CauchyFilter","kind":"constr","short":{"text":"Builds a Cauchy filter from a filter, its properness and a U-small member for each U","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.CompletionReflect","base":"CompletionReflect","kind":"ind","start":86,"body":null,"status":"ok","short":{"text":"The data of a completion: from each dense uniformly initial f : X ⇾ Z, a map Z ⇾ Y","status":"ok"},"long":{"text":"For a map ι : X ⇾ Y, the data CompletionReflect ι assigns to every dense, uniformly initial map f : X ⇾ Z a morphism of sets r_f : Z ⇾ Y. It is data rather than a proposition, since the map has to be computed; its properties are imposed by [[AffineConstructive.topology.interfaces.uniform.Completion]]. Separating the data from the axioms allows the completion's comparison maps to be named and to compute, while the conditions on them remain proof-irrelevant.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.CompletionReflect","base":"CompletionReflect","kind":"rec","short":{"text":"The type of completion data for a map ι","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.completion_reflect_initial","base":"completion_reflect_initial","kind":"proj","short":{"text":"The comparison map Z ⇾ Y attached to a dense uniformly initial f : X ⇾ Z","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.CompleteInverse","base":"CompleteInverse","kind":"def","start":88,"body":null,"status":"ok","short":{"text":"Completion data for the identity: a map back to X from every dense initial extension of X","status":"ok"},"long":{"text":"The completion data of the identity of X: for every dense uniformly initial f : X ⇾ Z, a map Z ⇾ X. It is the data part of [[AffineConstructive.topology.interfaces.uniform.CompleteUniformSpace]], the way of computing the retraction of each dense initial extension of a complete space back onto it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.CompleteInverse_Reflect","base":"CompleteInverse_Reflect","kind":"inst","start":90,"body":null,"status":"ok","short":{"text":"Lets a complete-inverse structure on X serve as the completion map data of the identity on X","status":"ok"},"long":{"text":"A [[AffineConstructive.topology.interfaces.uniform.CompleteInverse]] on X is by definition a [[AffineConstructive.topology.interfaces.uniform.CompletionReflect]] structure for the identity function of X. It assigns to every uniformly initial dense map f : X ⇾ Z a map Z ⇾ X in the reverse direction. This coercion is the identity between the two classes, so a complete-inverse structure is accepted wherever completion data for the identity is asked for. A complete uniform space, [[AffineConstructive.topology.interfaces.uniform.CompleteUniformSpace]], is one for which this data makes the identity a completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.Completion","base":"Completion","kind":"rec","start":92,"body":null,"status":"ok","short":{"text":"ι : X ⇾ Y is a completion: Y separated, ι dense and initial, and terminal among such extensions","status":"ok"},"long":{"text":"Given completion data for ι : X ⇾ Y, ι is a completion when Y is a separated uniform space, ι is dense and uniformly initial, and for every dense uniformly initial f : X ⇾ Z the comparison map r_f : Z ⇾ Y of [[AffineConstructive.topology.interfaces.uniform.CompletionReflect]] is uniformly continuous and satisfies r_f ∘ f = ι. So ι is a terminal dense initial extension of X: every other one maps onto it over X.\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"r_f\"] \\\\\n& Y\n```\n\nThis is the form of the completion as a firm reflection in the sense of Brümmer and Giuli: the class states terminality, and the reflection property (extension of uniformly continuous maps into complete spaces) is proved from it elsewhere. Uniqueness of the comparison maps is not a field; it follows from density and separation. The Cauchy completion 𝒞 X and its unit η are the principal instance.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.interfaces.uniform.completion_separated","base":"completion_separated","kind":"proj","short":{"text":"The target of a completion is a separated uniform space","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.completion_initial","base":"completion_initial","kind":"proj","short":{"text":"A completion map is uniformly initial","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.completion_dense","base":"completion_dense","kind":"proj","short":{"text":"A completion map is dense","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.completion_reflect_initial_ufm_cont","base":"completion_reflect_initial_ufm_cont","kind":"proj","short":{"text":"The comparison map from a dense initial extension to the completion is uniformly continuous","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.completion_reflect_initial_spec","base":"completion_reflect_initial_spec","kind":"proj","short":{"text":"The comparison map r_f satisfies r_f ∘ f = ι","status":"ok"}},{"name":"AffineConstructive.topology.interfaces.uniform.Build_Completion","base":"Build_Completion","kind":"constr","short":{"text":"Builds a completion from separation, initiality, density and the comparison maps' properties","status":"ok"}}]},{"name":"AffineConstructive.topology.interfaces.uniform.coercion:completion_separated","base":"coercion:completion_separated","kind":"coercion","start":95,"body":null,"status":"ok","short":{"text":"A completion reaches the fact that its target is a separated uniform space","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.coercion:completion_initial","base":"coercion:completion_initial","kind":"coercion","start":96,"body":null,"status":"ok","short":{"text":"A completion map counts as uniformly initial, so the facts about initial maps apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.coercion:completion_dense","base":"coercion:completion_dense","kind":"coercion","start":97,"body":null,"status":"ok","short":{"text":"A completion map counts as dense, so the facts about dense maps apply to it","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.interfaces.uniform.CompleteUniformSpace","base":"CompleteUniformSpace","kind":"def","start":100,"body":null,"status":"ok","short":{"text":"A complete uniform space: the identity of X is its own completion","status":"ok"},"long":{"text":"A uniform space X, with completion data for its identity ([[AffineConstructive.topology.interfaces.uniform.CompleteInverse]]), is complete when the identity is a [[AffineConstructive.topology.interfaces.uniform.Completion]]. Unwound, X is separated and every dense uniformly initial map f : X ⇾ Z has a uniformly continuous retraction r : Z ⇾ X with r ∘ f the identity. A complete space thus admits no proper dense initial extension, which is completeness in the form used by the Brümmer–Giuli theory of firm reflections, without reference to Cauchy filters.","status":"ok"},"proof":[]}],"diagrams":{"svg":{"\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"r_f\"] \\\\\n& Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='66.47pt' height='52.834pt' viewBox='0 0 66.47 52.834'>\n<defs>\n<path id='g2-1' d='M2.37048-1.92228H2.92824C3.03282-1.92228 3.0378-1.92726 3.0627-1.94718S3.10254-2.03184 3.10254-2.06172C3.10254-2.14638 3.02784-2.14638 2.94318-2.14638H2.41032C2.47008-2.5149 2.56968-3.14736 2.63442-3.22206C2.70912-3.30174 2.7888-3.34158 2.87346-3.34158C2.90334-3.34158 3.0129-3.34158 3.11748-3.2868C2.91828-3.20214 2.91828-3.02286 2.91828-3.00294C2.91828-2.87844 3.0129-2.79876 3.1374-2.79876C3.26688-2.79876 3.44616-2.90832 3.44616-3.12744C3.44616-3.41628 3.11748-3.5109 2.87844-3.5109C2.24598-3.5109 2.12148-2.90832 2.07666-2.69418S2.06172-2.6145 1.97706-2.14638H1.52388C1.42926-2.14638 1.34958-2.14638 1.34958-2.00694C1.34958-1.92228 1.42428-1.92228 1.50894-1.92228H1.9422C1.84758-1.43424 1.63842-.0498 1.49898 .47808C1.4691 .5976 1.34958 .85158 1.15536 .85158C1.12548 .85158 1.01592 .8466 .92628 .80178C1.06074 .74202 1.12548 .61752 1.12548 .51294C1.12548 .38844 1.03086 .30876 .90636 .30876C.77688 .30876 .5976 .41832 .5976 .63744C.5976 .94122 .95616 1.0209 1.15038 1.0209C1.43922 1.0209 1.65834 .79182 1.77288 .63744C1.97208 .35856 2.08662-.30378 2.0916-.31872L2.37048-1.92228Z'/>\n<path id='g1-1' d='M.80852-1.44976C.73882-1.22672 .51578-.71791 .51578-.52275C.51578-.24395 .73185 .0697 1.19884 .0697C1.51249 .0697 1.86796-.05576 2.15373-.28577C2.54405-.60639 2.60678-.98277 2.60678-.99671C2.60678-1.08732 2.51617-1.08732 rentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M54.38493 33.74139C52.83195 34.21703 52.09863 35.27694 51.79667 36.34481C51.49471 35.27694 50.76139 34.21703 49.20841 33.74139' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 52.834)'>\n<use x='54.110499' y='-24.552614' xlink:href='#g1-3'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 0 52.834)'>\n<use x='57.823905' y='-23.502865' xlink:href='#g2-1'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.topology.interfaces.topology":{"page":"topology.html","short":"Neighbourhood topologies: axioms, interior and closure, separation, continuous, reflecting and dense maps, products","summary":"The interface for topological spaces, given by a neighbourhood relation. A [[Neighborhood]] on a set X is a function x ⪽ U from X ⊗ 𝒫 X to affine propositions, and [[Topology]] states the neighbourhood axioms for it: a neighbourhood contains its point, the relation is upward closed, the full subset is a neighbourhood, binary meets of neighbourhoods are neighbourhoods, and a neighbourhood U is a neighbourhood of the set of points of which U is a neighbourhood. From the relation the file defines [[interior]], [[closure]], open, closed and dense subsets, neighbourhood bases, and the separation axioms [[Separation_T₀]] and [[Hausdorff]]. It sets out the classes of maps used throughout the topology files: [[Continuous]], the reflecting class [[ContinuouslyReflecting]], the two together as [[ContinuouslyInitial]], [[ContinuouslyEmbedding]] and [[Dense]]. It also gives the discrete and indiscrete structures and the two product topologies, the tensor product by a neighbourhood basis and the cartesian product by its universal property. The topological lemmas live in the files under topology/topology, and the uniform and bornological interfaces build on these classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."}},"constants":null}</script>

dasharray='.39848 1.99255'/>\n<path d='M17.767379 42.70634C16.214399 43.18198 15.481079 44.24189 15.179119 45.30976C14.877159 44.24189 14.143839 43.18198 12.590859 42.70634' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 .000002 61.851)'>\n<use x='9.131022' y='-27.944765' xlink:href='#g2-2'/>\n<\/g>\n<path d='M26.60246 45.509013L61.20511 20.630333' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M63.700529 18.83584L60.256519 19.140614L61.285963 20.572173L62.315407 22.003731Z'/>\n<path d='M63.700529 18.83584L60.256519 19.140614L61.285963 20.572173L62.315407 22.003731Z' stroke='currentColor' fill='none' stroke-width='.398461' stroke-miterlimit='10'/>\n<g transform='matrix(.999455 0 0 .999455 0 61.850999)'>\n<use x='47.631032' y='-24.435678' xlink:href='#g2-3'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Reflection pairs: forward and reflecting classes of maps over sets, and their variants","summary":"This file sets up the abstract framework of reflection pairs. It begins with constructs: concrete categories over sets, given by fibres of candidate structures, a class of objects and a class of morphisms closed under identities and composition. For each set X, the structures on X form a poset whose order is comparison through the identity. On this base it defines the reflecting, initial and embedding classes, with their specifications: an initial map is forward and reflecting, and an embedding is an injective initial map. It then defines reflection pairs with their two cancellation laws, together with saturated pairs, cloven pairs (with a pullback of structures along any map), morphisms of pairs, the opposite pair that exchanges the two classes, and products for the forward class. The theory built on these interfaces is in the reflection_pair files, and the topological, uniform and bornological structures of the development are instances."}},"constants":null}</script>

ve.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import sprop srelations.\nRequire Import logic.aprop relations.\nRequire Import set_lambda.\nRequire Import orders.orders orders.maps.\nRequire Import easy rewrite.\nRequire Export interfaces.reflection_pair.\n\nImport of_course_set_notation.\n\nLocal Open Scope sprop_scope.\nLocal Notation \"C 'ᵒ'\" := (fiber_op C) (at level 1, format \"C 'ᵒ'\").\n\nLemma IniClassSpec_op `{HI:@IniClassSpec C F H R J} : IniClassSpec C ᵒ.\nProof. intros ???? f. change (Ini C f ↔ Rfl C f ∧ Hom C f). now rew (initial_split_iff _). Qed.\n#[global] Hint Extern 2 (IniClassSpec _ ᵒ) => simple notypeclasses refine IniClassSpec_op : typeclass_instances.\n\nLemma EmbClassSpec_op `{HE:@EmbClassSpec C F H R J HJ E} : EmbClassSpec C ᵒ.\nProof. intros ???? f. change (Emb C f ↔ Ini C f ∧ Injective f). now rew (embed_split_iff _). Qed.\n#[global] Hint Extern 2 (EmbClassSpec _ ᵒ) => simple notypeclasses refine EmbClassSpec_op : typeclass_instances.\n\nDefinition ReflectionPairClasses_op C {CD:ReflectionPairClasses C} : ReflectionPairClasses C ᵒ.\nProof. now esplit. Defined.\n#[global] Hint Extern 2 (ReflectionPairClasses ?C ᵒ) => simple notypeclasses refine (ReflectionPairClasses_op C) : typeclass_instances.\n\nLemma ReflectionPair_op `{HC:@ReflectionPair C CD} : ReflectionPair C ᵒ.\nProof. unshelve esplit; try exact _; apply HC. Qed.\n#[global] Hint Extern 2 (ReflectionPair _ ᵒ) => simple notypeclasses refine ReflectionPair_op : typeclass_instances.\n\nLemma ClovenPair_op `{HC:@ClovenPair C CD CC} : ClovenPair C ᵒ.\nProof. unshelve esplit. intros. exact (cloven_cert _ (c:=HC) u). Qed.\n#[global] Hint Extern 2 (ClovenPair _ ᵒ) => simple notypeclasses refine ClovenPair_op : typeclass_instances.\n\nLemma SaturatedPair_op `{HS:@SaturatedPair C CD} : SaturatedPair C ᵒ.\nProof. unshelve esplit; try exact _.\n+ intros X Y FX FY HX HY m P. exact (rp_hom_detect m P).\n+ intros X Y FX FY HX HY m P. exact (rp_rfl_detect m P).\nQed.\n#[global] Hint Extern 2 (SaturatedPair _ ᵒ) => simple notypeclasses refine SaturatedPair_op : typeclass_instances.\n\n(** The two clauses of saturation, each joined with its cancellation law. *)\nLemma rfl_detect_iff `{HS:@SaturatedPair C CD} {X Y:set} {FX:Fib C X} {FY:Fib C Y} `{!Obj C X, !Obj C Y} (m:X ⇾ Y)\n  : Rfl C m ↔ ∀ (S:set) (FS:Fib C S) (g:S ⇾ X), Hom C (m ∘ g) → Hom C g.\nProof. split; [| exact (rp_rfl_detect m) ]. intros Hm S FS g. exact (rp_cancel_fwd m). Qed.\n\nLemma hom_detect_iff `{HS:@SaturatedPair C CD} {X Y:set} {FX:Fib C X} {FY:Fib C Y} `{!Obj C X, !Obj C Y} (m:X ⇾ Y)\n  : Hom C m ↔ ∀ (S:set) (FS:Fib C S) (g:S ⇾ X), Rfl C (m ∘ g) → Rfl C g.\nProof. exact (rfl_detect_iff (C:=C ᵒ) m). Qed.\n\n\nCoercion ini_construct `{@ReflectionPair C CD} : IniConstruct C.\nProof. split; change (Hom C ?f) with (Ini C f).\n+ intros. rew (initial_split_iff _). now split.\n+ intros ???? f. rew (initial_split_iff _). now intros [Hf _].\n+ intros ???? f. rew (initial_split_iff _). now intros [Hf _].\n+ intros ?????? f g. rew (initial_split_iff _). intros [Hf1 Hf2] [Hg1 Hg2]. now split.\nQed.\n#[global] Hint Extern 2 (IniConstruct _) => simple notypeclasses refine ini_construct : typeclass_instances.\n\nCoercion emb_construct `{@ReflectionPair C CD} : EmbConstruct C.\nProof. split; change (Hom C ?f) with (Emb C f).\n+ intros. rew (embed_split_iff _). now split.\n+ intros ???? f. rew (embed_split_iff _). now intros [Hf _].\n+ intros ???? f. rew (embed_split_iff _). now intros [Hf _].\n+ intros ?????? f g. rew (embed_split_iff _). intros [Hf1 Hf2] [Hg1 Hg2]. now split.\nQed.\n#[global] Hint Extern 2 (EmbConstruct _) => simple notypeclasses refine emb_construct : typeclass_instances.\n\n\nLocal Open Scope fun_inv_scope.\n\nLemma invert_hom `{@ReflectionPair C CD} {X Y:set} {FX:Fib C X} {FY:Fib C Y}\n  {f:X ⇾ Y} `{!Hom C f} `{!Inverse f, !Bijective f} : Rfl C f⁻¹.\nProof. apply (rp_cancel_rfl f); try exact _. now rew (surjective f). Qed.\n#[global] Hint Extern 2 (Rfl _ _⁻¹) => simple notypeclasses refine invert_hom : typeclass_instances.\n\n#[global] Hint Extern 1 (@Fib ?C ᵒ ?F ?X) => change (@Fib C F X) : typeclass_instances.\n\n\nLemma invert_rfl `{@ReflectionPair C CD} {X Y:set} {FX:Fib C X} {FY:Fib C Y}\n  {f:X ⇾ Y} `{!Rfl C f} `{!Inverse f, !Bijective f} : Hom C f⁻¹.\nProof. exact (invert_hom (C:=C ᵒ)). Qed.\n#[global] Hint Extern 2 (Hom _ _⁻¹) => simple notypeclasses refine invert_rfl : typeclass_instances.\n\nLemma invert_ini `{@ReflectionPair C CD} {X Y:set} {FX:Fib C X} {FY:Fib C Y}\n  {f:X ⇾ Y} `{!Ini C f} `{!Inverse f, !Bijective f} : Emb C f⁻¹.\nProof. rew (embed_split_iff _), (initial_split_iff _). repeat (split; try exact _). Qed.\n#[global] Hint Extern 2 (Emb _ _⁻¹) => simple notypeclasses refine invert_ini : typeclass_instances.\n#[global] Hint Extern 2 (Ini _ _⁻¹) => simple notypeclasses refine invert_ini : typeclass_instances.\n\n(** Cloven pairs are a fibration and its fiberwise opposite *)\n\nDefinition to_fib C `{HC:@Construct C F O H} {X:set} (FX:Fib C X) `{!Obj C X} : fib C X\n  := {| fib_Fib := FX ; fib_Obj := _ |}.\n\nDefinition obj `(Φ:@fib C F O H HC X) := X.\nDefinition vert `(Φ:@fib C F O H HC X) (Ψ:fib C X) : obj Φ ⇾ obj Ψ := id_fun X.\n#[global] Typeclasses Opaque obj.\n#[global] Hint Extern 0 (Fib _ (obj ?Φ)) => refine (fib_Fib Φ) : typeclass_instances.\n#[global] Hint Extern 0 (Obj _ (obj ?Φ)) => refine (fib_Obj Φ) : typeclass_instances.\n\n#[global] Hint Extern 0 (Inverse (@vert ?C ?F ?O ?H ?HC ?X ?Φ ?Ψ)) => refine (@vert C F O H HC X Ψ Φ) : typeclass_instances.\n#[global] Hint Extern 0 (Bijective (vert _ _)) => unfold vert : typeclass_instances.\n#[global] Hint Extern 0 (Injective (vert _ _)) => unfold vert : typeclass_instances.\n#[global] Hint Extern 0 (Surjective (vert _ _)) => unfold vert : typeclass_instances.\n\n\nLemma detect_hom@{u} `{@ReflectionPair@{u} C CD} {X Y Z:set@{u}} {FX:Fib C X} {FY:Fib C Y} {FZ:Fib C Z}\n  (g:X ⇾ Y) (m:Y ⇾ Z) `{!Hom C m} `{!Rfl C m} : Hom C (m ∘ g) ↔ Hom C g.\nProof. split; intros; [ now apply (rp_cancel_fwd m) | exact _ ]. Qed.\n\nLemma detect_rfl@{u} `{@ReflectionPair@{u} C CD} {X Y Z:set@{u}} {FX:Fib C X} {FY:Fib C Y} {FZ:Fib C Z}\n  (g:X ⇾ Y) (m:Y ⇾ Z) `{!Hom C m} `{!Rfl C m} : Rfl C (m ∘ g) ↔ Rfl C g.\nProof. exact (detect_hom (C:=C ᵒ) g m). Qed.\n\nLemma pull_cart_hom@{u} `{@ClovenPair@{u} C CD CC} {S X Z:set@{u}} {FS:Fib C S} {FZ:Fib C Z}\n  (g:S ⇾ X) (f:X ⇾ Z) `{!Obj C Z} : Hom C (f ∘ g) ↔ Hom C (FY:=pull C f) g.\nProof. exact (detect_hom g f). Qed.\n\nLemma pull_cart_rfl@{u} `{@ClovenPair@{u} C CD CC} {S X Z:set@{u}} {FS:Fib C S} {FZ:Fib C Z}\n  (g:S ⇾ X) (f:X ⇾ Z) `{!Obj C Z} : Rfl C (f ∘ g) ↔ Rfl C (FY:=pull C f) g.\nProof. exact (pull_cart_hom (C:=C ᵒ) g f). Qed.\n\n\nDefinition pull_fib C `{HC:@ClovenPair C CD CC} {X Y:set} (f:X ⇾ Y) (Ψ:fib C Y) : fib C X\n  := {| fib_Fib := pull C f ; fib_Obj := ini_construct_hom_X (cloven_cert C f) |}.\n#[global] Hint Extern 2 (Ini ?C (FX:=fib_Fib (pull_fib ?C ?f _)) ?g) => match f with g => simple notypeclasses refine (cloven_cert C f) end : typeclass_instances.\n#[global] Hint Extern 2 (Hom ?C (FX:=fib_Fib (pull_fib ?C ?f _)) ?g) => match f with g => simple notypeclasses refine (initial_hom (Hf:=cloven_cert C f)) end : typeclass_instances.\n#[global] Hint Extern 2 (Rfl ?C (FX:=fib_Fib (pull_fib ?C ?f _)) ?g) => match f with g => simple notypeclasses refine (initial_rfl (Hf:=cloven_cert C f)) end : typeclass_instances.\n\nSection two_fibrations.\n  Local Notation \"f *\" := (pull_fib _ f) (at level 1, left associativity, format \"f *\").\n  Local Coercion obj : fib >-> set.\n\n  Universes u.\n  Context `{HC:@ClovenPair@{u} C CD CC}.\n  \n  Lemma rfl_fiber_op {X:set@{u}} {Φ:fib C X} {Ψ:fib C X}\n    : Φ ≤ Ψ ↔ Rfl C (vert Ψ Φ).\n  Proof. split.\n  + change (Hom C (vert Φ Ψ) → Rfl C (vert Φ Ψ)⁻¹). now intro.\n  + change (Rfl C (vert Ψ Φ) → Hom C (vert Ψ Φ)⁻¹). now intro.\n  Qed.\n  \n  Section cleavage_order.\n    Context {X Y:set@{u}} {Φ:fib C X} {Ψ:fib C Y} (f:X ⇾ Y).\n  \n    Lemma hom_pull_alt : Hom C f ↔ Φ ≤ f* Ψ.\n    Proof. exact (pull_cart_hom (id_fun _) f). Qed.\n  \n    Lemma rfl_pull_alt : Rfl C f ↔ f* Ψ ≤ Φ.\n    Proof. rew rfl_fiber_op. exact (pull_cart_rfl (id_fun _) f). Qed.\n    \n    Lemma ini_pull_alt : Ini C f ↔ f* Ψ = Φ.\n    Proof. rew [(symmetry_iff (=) _ _)|(initial_split_iff f)].\n      now rew [hom_pull_alt|rfl_pull_alt].\n    Qed.\n  \n    Lemma hom_pull_alt2 : of_course (Hom C f) ⧟ Φ ≤ f* Ψ.\n    Proof. apply affirmative_aiff. exact hom_pull_alt. Qed.\n  \n    Lemma rfl_pull_alt2 : of_course (Rfl C f) ⧟ f* Ψ ≤ Φ.\n    Proof. apply affirmative_aiff. exact rfl_pull_alt. Qed.\n  End cleavage_order.\n  \n  Lemma pull_fib_mono {X Y:set@{u}} (f:X ⇾ Y) (Ψ₁ Ψ₂ : fib C Y)\n    : Ψ₁ ≤ Ψ₂ ⊸ f* Ψ₁ ≤ f* Ψ₂.\n  Proof. apply affirmative_aimpl. intro.\n    rew <-(hom_pull_alt f). now change (Hom C (vert Ψ₁ Ψ₂ ∘ (f:f* Ψ₁ ⇾ Ψ₁))).\n  Qed.\nEnd two_fibrations.\n\nSection fib_pull.\n  Universes u.\n  Context `{HC:@ClovenPair@{u} C CD CC} {S Z:set@{u}}.\n  \n  Lemma fib_pull_is_fun_aux (u v : S ⇾ Z) (Ψ:fib C Z) : u = v → Hom C (FX:=pull C u) (FY:=pull C v) (id_fun S).\n  Proof. intros Eu.  unshelve refine (rp_cancel_fwd (FY:=pull C v) v _); try exact _.\n    change (v ∘ id_fun _) with v. now rew <-Eu.\n  Qed.\n\n  Local Instance fib_pull_is_fun : @IsFun (!(S ⇾ Z) ⊗ fib C Z) (fib C S) (λ '(f, Ψ), pull_fib C f Ψ).\n  Proof. apply coordinatewise_is_fun.\n  + intros u v Ψ. apply affirmative_aimpl. intros Eu. split.\n    * exact (fib_pull_is_fun_aux u v _ Eu).\n    * refine (fib_pull_is_fun_aux v u _ _). now apply symmetry.\n  + intros u; change (set_T (S ⇾ Z)) in u. intros Ψ₁ Ψ₂. apply aand_intro.\n    * rew (eq_le _ _). exact (pull_fib_mono _ _ _).\n    * rew (eq_le_flip _ _). exact (pull_fib_mono _ _ _).\n  Qed.\n  \n  Definition fib_pull := curry (@func_make _ _ _ fib_pull_is_fun).\n  Local Notation \"f *\" := (func_op fib_pull f) (at level 1, left associativity, format \"f *\").\n\n  Local Instance fib_pull_order_preserving (f:S ⇾ Z) : OrderPreserving f*.\n  Proof. apply alt_Build_OrderPreserving. exact (pull_fib_mono f). Qed.\nEnd fib_pull.\n\nLocal Notation \"f *\" := (func_op fib_pull f) (at level 1, left associativity, format \"f *\").\n#[global] Hint Extern 2 (OrderPreserving _*) => simple notypeclasses refine fib_pull_order_preserving : typeclass_instances.\n\n#[global] Hint Extern 2 (Ini ?C (FX:=fib_Fib (func_op ?f * _)) ?g) => match f with g => simple notypeclasses refine (cloven_cert C f) end : typeclass_instances.\n#[global] Hint Extern 2 (Hom ?C (FX:=fib_Fib (func_op ?f * _)) ?g) => match f with g => simple notypeclasses refine (initial_hom (Hf:=cloven_cert C f)) end : typeclass_instances.\n#[global] Hint Extern 2 (Rfl ?C (FX:=fib_Fib (func_op ?f * _)) ?g) => match f with g => simple notypeclasses refine (initial_rfl (Hf:=cloven_cert C f)) end : typeclass_instances.\n\nLemma fib_pull_id@{u} `{HC:@ClovenPair@{u} C CD CC} {X:set@{u}} {Φ:fib C X} : (id_fun X)* Φ = Φ.\nProof. now apply ini_pull_alt. Qed.\n\nLocal Coercion obj : fib >-> set.\n\nLemma fib_pull_compose@{u} `{HC:@ClovenPair@{u} C CD CC} {X Y Z:set@{u}}\n  (f:X ⇾ Y) (g:Y ⇾ Z) (Ξ:fib C Z) : (g ∘ f)* Ξ = f* (g* Ξ).\nProof. apply ini_pull_alt. now change (Ini C ((g:g* Ξ ⇾ Z) ∘ (f:f* (g* Ξ) ⇾ g* Ξ))). Qed.\n\n(** Cloven pairs are saturated: the identity at the pullback lift is the\n    universal test, for both clauses. *)\nLemma cloven_rfl_detect `{HC:@ClovenPair C CD CC} {X Y:set} {FX:Fib C X} {FY:Fib C Y} `{!Obj C X, !Obj C Y} (m:X ⇾ Y)\n  : (∀ (S:set) (FS:Fib C S) (g:S ⇾ X), Hom C (m ∘ g) → Hom C g) → Rfl C m.\nProof. intro P. apply (rfl_pull_alt (Φ:=to_fib C FX) (Ψ:=to_fib C FY) m).\n  change (Hom C (FX:=pull C m) (FY:=FX) (id_fun X)).\n  apply (P X (pull C m) (id_fun X)). now change (Hom C (FX:=pull C m) m).\nQed.\n\nCoercion cloven_saturated `{HC:@ClovenPair C CD CC} : SaturatedPair C.\nProof. unshelve esplit; try exact _.\n+ intros X Y FX FY HX HY m. exact (cloven_rfl_detect m).\n+ intros X Y FX FY HX HY m. exact (cloven_rfl_detect (C:=C ᵒ) m).\nQed.\n\n\n(** The lifting-UP face of 𝓜: the Joy-of-Cats initial-morphism UP, abstract in\n    any cloven pair.  Forward is detection (pair-only); the converse tests the\n    identity at the pullback lift. *)\nLemma ini_lift_alt `{HC:@ClovenPair C CD CC} {X Z:set} {FX:Fib C X} {FZ:Fib C Z}\n  (f:X ⇾ Z) `{!Obj C X} `{!Obj C Z}\n  : Ini C f ↔ (∀ (S:set) (FS:Fib C S), Obj C S → ∀ (g:S ⇾ X), (Hom C (f ∘ g) ↔ Hom C g)).\nProof. split.\n+ intros Hf S FS HS g. exact (detect_hom g f).\n+ intro P. rew (initial_split_iff f). split.\n  * pose proof P X FX _ (id_fun X) as [_ Hb]. exact (Hb _).\n  * pose (Φ := to_fib C FX). pose (Ψ := to_fib C FZ).\n    apply (rfl_pull_alt (Φ:=Φ) (Ψ:=Ψ) f); change (Hom C (vert (f* Ψ) Φ)).\n    apply (P X (f* Ψ) _ (vert (f* Ψ) Φ)).\n    now change (Hom C (f:f* Ψ ⇾ Ψ) ).\nQed.\n\nLemma ini_lift_alt2 `{HC:@ClovenPair C CD CC} {X Z:set} {FX:Fib C X} {FZ:Fib C Z}\n  (f:X ⇾ Z) `{!Hom C f}\n  : Ini C f ↔ (∀ (S:set) (FS:Fib C S), Obj C S → ∀ (g:S ⇾ X), (Hom C (f ∘ g) → Hom C g)).\nProof. rew (ini_lift_alt f). split; intros P S FS HS g.\n+ now apply P.\n+ split; [ now apply P | now intro ].\nQed.\n\n(** Restriction to a full subcategory (doc §2.1/§2.3 item 4), key-free: over a\n    fiber predicate closed under the cleavage, 𝓜-membership is detected by the\n    restricted tests alone.  Forward is detection (no closure needed); the\n    converse tests the identity at the pullback lift, legitimately in the\n    subcategory by [Hpull]. *)\nLemma ini_lift_alt_restrict `{HC:@ClovenPair C CD CC}\n  (Good : ∀ X:set, Fib C X → SProp)\n  (Hpull : ∀ (S Z:set) (u:S ⇾ Z) (FZ:Fib C Z), Obj C Z → Good Z FZ → Good S (pull C u))\n  {X Z:set} {FX:Fib C X} {FZ:Fib C Z}\n  (f:X ⇾ Z) `{!Obj C X} `{!Obj C Z} (GX : Good X FX) (GZ : Good Z FZ)\n  : Ini C f ↔ (∀ (S:set) (FS:Fib C S), Obj C S → Good S FS → ∀ (g:S ⇾ X), (Hom C (f ∘ g) ↔ Hom C g)).\nProof. split.\n+ intros Hf S FS HS GS g. exact (detect_hom g f).\n+ intro P. rew (initial_split_iff f). split.\n  * pose proof P X FX _ GX (id_fun X) as [_ Hb]. exact (Hb _).\n  * pose (Φ := to_fib C FX). pose (Ψ := to_fib C FZ).\n    apply (rfl_pull_alt (Φ:=Φ) (Ψ:=Ψ) f); change (Hom C (vert (f* Ψ) Φ)).\n    apply (P X (f* Ψ) _ (Hpull X Z f FZ _ GZ) (vert (f* Ψ) Φ)).\n    now change (Hom C (f:f* Ψ ⇾ Ψ) ).\nQed.\n\n(** * Pair morphisms: derived theory.\n    The class swap is the identity on pair morphisms; Obj/𝓜/Emb-preservation and\n    the cloven-fibred-functor comparison are theorems, not data. *)\n\nLemma PairMorphism_op `{HM:PairMorphism C D} : PairMorphism C ᵒ D ᵒ.\nProof. now split. Qed.\n#[global] Hint Extern 2 (PairMorphism _ ᵒ _ ᵒ) => simple notypeclasses refine PairMorphism_op : typeclass_instances.\n\nLemma pmap_obj `{HM:PairMorphism C D}\n  {X:set} {FX:Fib C X} : Obj C X → Obj D X (FX:=fmap C D FX).\nProof. intro. now pose proof (hom_map C D (id_fun X)). Qed.\n\nLemma ini_map C D `{HM:PairMorphism C D}\n  {X Y:set} {FX:Fib C X} {FY:Fib C Y} (f:X ⇾ Y)\n  `{!Ini C f} : Ini D (FX:=fmap C D FX) (FY:=fmap C D FY) f.\nProof.  apply (initial_split_iff f). split.\n+ exact (hom_map C D f).\n+ exact (rfl_map C D f).\nQed.\n\nLemma emb_map C D `{HM:PairMorphism C D}\n  {X Y:set} {FX:Fib C X} {FY:Fib C Y} (f:X ⇾ Y)\n  `{!Emb C f} : Emb D (FX:=fmap C D FX) (FY:=fmap C D FY) f.\nProof. apply (embed_split_iff f). split.\n+ exact (ini_map C D f).\n+ exact _.\nQed.\n\nDefinition fib_map_opn C D `{HM:PairMorphism C D} {X:set} (Φ:fib C X) : fib D X\n:= {| fib_Fib := fmap C D (fib_Fib Φ) ; fib_Obj := pmap_obj (fib_Obj Φ) |}.\n\nLemma fib_map_mono C D `{HM:PairMorphism C D} {X:set} (Φ Ψ:fib C X) : Φ ≤ Ψ ⊸ fib_map_opn C D Φ ≤ fib_map_opn C D Ψ.\nProof. apply affirmative_aimpl. intro E. exact (hom_map C D (id_fun X)). Qed.\n\nLemma fib_map_is_fun C D `{HM:PairMorphism C D}\n  {X:set} : @IsFun (fib_set C X) (fib_set D X) (fib_map_opn C D).\nProof. intros Φ Ψ. apply aand_intro.\n+ rew (eq_le _ _). exact (fib_map_mono C D _ _).\n+ rew (eq_le_flip _ _). exact (fib_map_mono C D _ _).\nQed.\n\nDefinition fib_map C D `{HM:PairMorphism C D}\n  {X:set} : fib_set C X ⇾ fib_set D X := @func_make _ _ _ (fib_map_is_fun C D).\n\nLemma fib_map_order_preserving C D `{HM:PairMorphism C D}\n  {X:set} : OrderPreserving (fib_map C D (X:=X)).\nProof. apply alt_Build_OrderPreserving. exact (fib_map_mono C D). Qed.\n\n(** Between cloven pairs, every pair morphism is a cloven fibred functor:\n    it commutes with the cleavage up to the fiber equality. *)\nLemma fib_map_pull C D `{HC:ClovenPair C, HD:ClovenPair D} `{HM:!PairMorphism C D (U:=U)} {X Y:set} (f:X ⇾ Y) (Ψ:fib C Y)\n  : f* (fib_map C D Ψ) = fib_map C D (f* Ψ).\nProof. apply ini_pull_alt. exact (ini_map C D f). Qed.\n\nDefinition fmap_id C {FC:Fiber C} : FiberMap C C := λ X FX, FX.\n#[global] Hint Extern 2 (FiberMap ?C ?C) => exact (fmap_id C) : typeclass_instances.\n\nLemma PairMorphism_id C `{ReflectionPair C} : PairMorphism C C.\nProof. split; try exact _; now intros. Qed.\n\nDefinition fmap_compose@{u} {C D K:Cat} {FC FD FK} (U:@FiberMap@{u} C D FC FD) (V:@FiberMap@{u} D K FD FK)\n  : @FiberMap C K FC FK := λ X FX, V X (U X FX).\n\nLemma PairMorphism_compose@{u} C D K\n  `{HM1:@PairMorphism@{u} C D CD DD U}\n  `{HM2:@PairMorphism@{u} D K DD KD V}\n  : PairMorphism C K (U:=fmap_compose U V).\nProof. split; try exact _; intros X Y FX FY f Hf.\n+ pose proof (hom_map C D f).\n  change (Hom K (FX:=fmap D K (fmap C D FX)) (FY:=fmap D K (fmap C D FY)) f).\n  exact (hom_map D K f).\n+ pose proof (rfl_map C D f).\n  change (Rfl K (FX:=fmap D K (fmap C D FX)) (FY:=fmap D K (fmap C D FY)) f).\n  exact (rfl_map D K f).\nQed. \n\n\n","sentences":[{"i":0,"s":0,"e":32,"kind":"vernac","status":"ok","ms":18,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":33,"e":70 kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12759,"e":12762,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":12783,"e":12786,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":12797,"e":12800,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":13618,"e":13621,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":13911,"e":13914,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14216,"e":14219,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14464,"e":14467,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15500,"e":15503,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":15549,"e":15552,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":16515,"e":16518,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities.","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","items":[{"name":"AffineConstructive.topology.reflection_pair.base.IniClassSpec_op","base":"IniClassSpec_op","kind":"prf","start":9,"body":[10,14],"status":"ok","short":{"text":"In the opposite pair, initial maps are still exactly the forward reflecting maps","status":"ok"},"proof":[{"text":"Fix sets X and Y with structures and a map f between them. The goal asks that f be initial in the opposite pair exactly when it is forward and reflecting there.","status":"ok","from":0,"to":1},{"text":"In the opposite pair the forward maps are the reflecting maps of the original and the reverse, while the initial maps are the same. So the goal says that f is initial exactly when it is reflecting and forward, which is [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]] with the two conjuncts swapped.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.reflection_pair.base.EmbClassSpec_op","base":"EmbClassSpec_op","kind":"prf","start":16,"body":[17,21],"status":"ok","short":{"text":"In the opposite pair, embeddings are still exactly the injective initial maps","status":"ok"},"proof":[{"text":"Fix sets X and Y with structures and a map f between them. The goal asks that f be an embedding of the opposite pair exactly when it is initial there and injective.","status":"ok","from":0,"to":1},{"text":"Embeddings and initial maps are the same in the opposite pair as in the original, so the statement is [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]] for the original pair.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.reflection_pair.base.ReflectionPairClasses_op","base":"ReflectionPairClasses_op","kind":"def","start":23,"body":[24,26],"status":"ok","short":{"text":"The data of the opposite reflection pair, with forward and reflecting classes exchanged","status":"ok"},"proof":[{"text":"The data are assembled field by field from those of the original pair. The original reflecting class serves as the forward class and the original forward class as the reflecting class, and objects, initial maps and embeddings are kept.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.ReflectionPair_op","base":"ReflectionPair_op","kind":"prf","start":28,"body":[29,31],"status":"ok","short":{"text":"The opposite of a reflection pair is a reflection pair","status":"ok"},"proof":[{"text":"Each axiom of a reflection pair for the opposite is either found by resolution, as the specification of initial maps is by [[AffineConstructive.topology.reflection_pair.base.IniClassSpec_op]], or is an axiom of the original pair with the roles of the two classes exchanged. The two cancellation laws are of the second kind and are taken from the original pair.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.ClovenPair_op","base":"ClovenPair_op","kind":"prf","start":33,"body":[34,38],"status":"ok","short":{"text":"The opposite of a cloven pair is cloven, by the same cleavage","status":"ok"},"proof":[{"text":"The underlying reflection pair is the opposite one, by [[AffineConstructive.topology.reflection_pair.base.ReflectionPair_op]], and the cleavage is unchanged. What remains is the certificate: for every map u into an object Z, the map u is initial in the opposite pair when its domain carries the structure pulled back from Z.","status":"ok","from":0,"to":2},{"text":"Initial maps are the same in both pairs, so this is the certificate of the original cleavage.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.reflection_pair.base.SaturatedPair_op","base":"SaturatedPair_op","kind":"prf","start":40,"body":[41,49],"status":"ok","short":{"text":"The opposite of a saturated pair is saturated","status":"ok"},"proof":[{"text":"The underlying reflection pair is the opposite one. Two saturation clauses are left, each stated in the opposite pair.","status":"ok","from":0,"to":1},{"text":"The first clause asks that a map m between objects be reflecting in the opposite pair, given that precomposing with m detects maps that are forward there. Read in the original pair, this says that m is forward given that precomposition detects reflecting maps, which is the original clause that forward maps are detected.","status":"ok","from":2,"to":4},{"text":"The second clause is the dual. A map m for which precomposition detects maps reflecting in the opposite pair, that is, forward in the original, is reflecting in the original pair by the clause that reflecting maps are detected. This makes m forward in the opposite pair.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.reflection_pair.base.rfl_detect_iff","base":"rfl_detect_iff","kind":"prf","start":51,"body":[52,56],"status":"ok","short":{"text":"In a saturated pair, m is reflecting iff g is forward whenever m ∘ g is","status":"ok"},"proof":[{"text":"The converse direction is a clause of saturation: if precomposing with m detects forward maps, then m is reflecting. What remains is the forward direction.","status":"ok","from":0,"to":1},{"text":"Suppose m is reflecting, and fix a structured set S and a map g into X. If m ∘ g is forward then so is g, by the cancellation law of the pair for forward maps against a reflecting m.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.reflection_pair.base.hom_detect_iff","base":"hom_detect_iff","kind":"prf","start":57,"body":[58,60],"status":"ok","short":{"text":"In a saturated pair, m is forward iff g is reflecting whenever m ∘ g is","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.base.rfl_detect_iff]] applied to the opposite pair, which is saturated by [[AffineConstructive.topology.reflection_pair.base.SaturatedPair_op]]. In the opposite pair, reflecting maps are the forward maps of the original and forward maps are the reflecting ones.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.ini_construct","base":"ini_construct","kind":"def","start":61,"body":[62,81],"status":"ok","short":{"text":"The initial maps of a reflection pair contain identities, compose, and have objects at both ends","status":"ok"},"proof":[{"text":"There are four things to show about the initial maps: identities of objects are initial, the domain and the codomain of an initial map are objects, and initial maps compose.","status":"ok","from":0,"to":1},{"text":"Let X be an object. By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]] it suffices that the identity of X be both forward and reflecting, and both are axioms of the pair, the second being [[AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_id]].","status":"ok","from":2,"to":5},{"text":"Let f be initial. By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]] it is in particular forward, and the domain of a forward map is an object.","status":"ok","from":6,"to":9},{"text":"In the same way the codomain of the initial map f is an object, because f is forward.","status":"ok","from":10,"to":13},{"text":"Let f and g be initial and composable. By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]] each is forward and reflecting, so g ∘ f is forward because forward maps compose, and reflecting by [[AffineConstructive.topology.interfaces.reflection_pair.rfl_construct_compose]]. Hence g ∘ f is initial.","status":"ok","from":14,"to":19}]},{"name":"AffineConstructive.topology.reflection_pair.base.emb_construct","base":"emb_construct","kind":"def","start":83,"body":[84,103],"status":"ok","short":{"text":"The embeddings of a reflection pair contain identities, compose, and have objects at both ends","status":"ok"},"proof":[{"text":"There are the same four things to show about the embeddings: identities of objects are embeddings, the domain and the codomain of an embedding are objects, and embeddings compose.","status":"ok","from":0,"to":1},{"text":"Let X be an object. By [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]] it suffices that the identity of X be initial and injective. It is initial by [[AffineConstructive.topology.interfaces.reflection_pair.ini_construct_id]] and injective by [[AffineConstructive.theory.set.id_bijective]].","status":"ok","from":2,"to":5},{"text":"Let f be an embedding. By [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]] it is initial, so its domain is an object by [[AffineConstructive.topology.interfaces.reflection_pair.ini_construct_hom_X]].","status":"ok","from":6,"to":9},{"text":"In the same way the codomain of f is an object, by [[AffineConstructive.topology.interfaces.reflection_pair.ini_construct_hom_Y]].","status":"ok","from":10,"to":13},{"text":"Let f and g be composable embeddings. By [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]] each is initial and injective. The composite g ∘ f is initial by [[AffineConstructive.topology.interfaces.reflection_pair.ini_construct_compose]] and injective by [[AffineConstructive.theory.set.compose_injective]], so it is an embedding.","status":"ok","from":14,"to":19}]},{"name":"AffineConstructive.topology.reflection_pair.base.invert_hom","base":"invert_hom","kind":"prf","start":106,"body":[107,110],"status":"ok","short":{"text":"The inverse of a forward bijection is reflecting","status":"ok"},"proof":[{"text":"Cancellation in a reflection pair: since f is forward, f⁻¹ is reflecting as soon as the composite f ∘ f⁻¹ is reflecting. That composite is what remains to show.","status":"ok","from":0,"to":1},{"text":"Since f is surjective, f ∘ f⁻¹ is the identity of Y ([[AffineConstructive.interfaces.set.surjective]]), and the identity is reflecting.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.invert_rfl","base":"invert_rfl","kind":"prf","start":113,"body":[114,116],"status":"ok","short":{"text":"The inverse of a reflecting bijection is forward","status":"ok"},"proof":[{"text":"This is the dual of [[AffineConstructive.topology.reflection_pair.base.invert_hom]]: in the opposite reflection pair the forward and reflecting classes are exchanged, so f is forward there and its inverse is reflecting there, which is to say forward here.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.invert_ini","base":"invert_ini","kind":"prf","start":118,"body":[119,122],"status":"ok","short":{"text":"The inverse of an initial bijection is an embedding, hence initial","status":"ok"},"proof":[{"text":"An embedding is an injective initial map, and an initial map is one that is both forward and reflecting. So it is enough to show that f⁻¹ is forward, that it is reflecting, and that it is injective.","status":"ok","from":0,"to":1},{"text":"Since f is initial it is forward and reflecting. Then f⁻¹ is reflecting by [[AffineConstructive.topology.reflection_pair.base.invert_hom]] and forward by [[AffineConstructive.topology.reflection_pair.base.invert_rfl]], and it is injective because the inverse of a bijection is a bijection.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.to_fib","base":"to_fib","kind":"def","start":125,"body":null,"status":"ok","short":{"text":"Packages a structure on X, certified to be an object, as an element of the fibre over X","status":"ok"},"long":{"text":"An element of the fibre [[AffineConstructive.topology.interfaces.reflection_pair.fib]] over X is a candidate structure together with the certificate that it is an object. Given a structure FX on X found in context and the certificate, this builds that element. It lets the order on the fibre, and the pullback lemmas stated for it, be applied to the structures a statement is about.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.obj","base":"obj","kind":"def","start":126,"body":null,"status":"ok","short":{"text":"The underlying set of an element of a fibre, carrying that structure","status":"ok"},"long":{"text":"For Φ in the fibre over X, obj Φ is X itself, made opaque to resolution so that it carries the structure Φ: resolution finds the structure and the object certificate on obj Φ from Φ. Declared as a coercion, it lets an element of a fibre stand for the structured set, so that the same set X under two structures Φ and Ψ appears as two sets between which maps can be compared.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.vert","base":"vert","kind":"def","start":127,"body":null,"status":"ok","short":{"text":"The identity of X, viewed as a map from X with structure Φ to X with structure Ψ","status":"ok"},"long":{"text":"The vertical map between two elements Φ and Ψ of the fibre over X: the identity function on X, typed from Φ to Ψ. The order on the fibre is that Φ ≤ Ψ when this map is forward. Resolution knows that vert Ψ Φ is its inverse and that it is bijective, so the inversion lemmas [[AffineConstructive.topology.reflection_pair.base.invert_hom]] and [[AffineConstructive.topology.reflection_pair.base.invert_rfl]] apply to it; that is how [[AffineConstructive.topology.reflection_pair.base.rfl_fiber_op]] expresses the order through the reflecting class.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.detect_hom","base":"detect_hom","kind":"prf","start":135,"body":[136,138],"status":"ok","short":{"text":"For m forward and reflecting, m ∘ g is forward if and only if g is forward","status":"ok"},"proof":[{"text":"Take the two directions separately. If m ∘ g is forward, then g is forward by the cancellation law of the pair, because m is reflecting. Conversely, if g is forward, then m ∘ g is a composite of forward maps, so it is forward.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.detect_rfl","base":"detect_rfl","kind":"prf","start":139,"body":[140,142],"status":"ok","short":{"text":"For m forward and reflecting, m ∘ g is reflecting if and only if g is reflecting","status":"ok"},"proof":[{"text":"This is the dual of [[AffineConstructive.topology.reflection_pair.base.detect_hom]]. Passing to the opposite pair exchanges the two classes and leaves m both forward and reflecting, so the statement about forward maps there is this statement about reflecting maps.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.pull_cart_hom","base":"pull_cart_hom","kind":"prf","start":143,"body":[144,146],"status":"ok","short":{"text":"f ∘ g is forward if and only if g is forward into the structure pulled back along f","status":"ok"},"proof":[{"text":"With the structure on X pulled back along f, the map f is initial, so it is forward and reflecting. The claim is then the case m = f of [[AffineConstructive.topology.reflection_pair.base.detect_hom]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.pull_cart_rfl","base":"pull_cart_rfl","kind":"prf","start":147,"body":[148,150],"status":"ok","short":{"text":"f ∘ g is reflecting if and only if g is reflecting into the structure pulled back along f","status":"ok"},"proof":[{"text":"This is the dual of [[AffineConstructive.topology.reflection_pair.base.pull_cart_hom]]. The opposite of a cloven pair is cloven by the same cleavage and has the classes exchanged, so the forward statement there is the reflecting statement here.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.pull_fib","base":"pull_fib","kind":"def","start":151,"body":null,"status":"ok","short":{"text":"The pullback along f : X ⇾ Y of an element of the fibre over Y, in the fibre over X","status":"ok"},"long":{"text":"In a cloven pair every map f : X ⇾ Y and structure Ψ on Y give a structure on X, the pullback of Ψ along f, for which f is initial ([[AffineConstructive.topology.interfaces.reflection_pair.cloven_cert]]). Since the domain of an initial map is an object, the pulled-back structure is an element of the fibre over X; that element is pull_fib C f Ψ, written f* Ψ. It is the cartesian lift of a cloven fibration, the traditional initial structure induced by a single map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.two_fibrations.coercion:obj","base":"coercion:obj","kind":"coercion","start":157,"body":null,"status":"ok","short":{"text":"In this section an element of a fibre stands for its underlying set, which carries that structure","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.rfl_fiber_op","base":"rfl_fiber_op","kind":"prf","start":160,"body":[161,169],"status":"ok","short":{"text":"Φ ≤ Ψ in a fibre if and only if the identity from Ψ to Φ is reflecting","status":"ok"},"proof":[{"text":"Take the two directions separately. First suppose Φ ≤ Ψ.","status":"ok","from":0,"to":2},{"text":"By definition, Φ ≤ Ψ says that the identity from Φ to Ψ is forward, and the identity from Ψ to Φ is its inverse. The identity is a bijection, so this inverse is reflecting by [[AffineConstructive.topology.reflection_pair.base.invert_hom]].","status":"ok","from":3,"to":4},{"text":"Conversely, suppose the identity from Ψ to Φ is reflecting.","status":"ok","from":5,"to":5},{"text":"What has to be shown is that its inverse, the identity from Φ to Ψ, is forward. This follows from [[AffineConstructive.topology.reflection_pair.base.invert_rfl]].","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.reflection_pair.base.hom_pull_alt","base":"hom_pull_alt","kind":"prf","start":172,"body":[173,175],"status":"ok","short":{"text":"f is forward from Φ to Ψ if and only if Φ ≤ f* Ψ","status":"ok"},"proof":[{"text":"Take g to be the identity of X, going from Φ to X with its structure pulled back from Ψ along f. Then [[AffineConstructive.topology.reflection_pair.base.pull_cart_hom]] says that f is forward exactly when this identity is forward, which by definition is Φ ≤ f* Ψ.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.rfl_pull_alt","base":"rfl_pull_alt","kind":"prf","start":176,"body":[177,180],"status":"ok","short":{"text":"f is reflecting from Φ to Ψ if and only if f* Ψ ≤ Φ","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.reflection_pair.base.rfl_fiber_op]], the inequality f* Ψ ≤ Φ says that the identity from Φ to f* Ψ is reflecting.","status":"ok","from":0,"to":1},{"text":"Take that identity as g in [[AffineConstructive.topology.reflection_pair.base.pull_cart_rfl]]: f is reflecting exactly when it is.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.ini_pull_alt","base":"ini_pull_alt","kind":"prf","start":181,"body":[182,185],"status":"ok","short":{"text":"f is initial from Φ to Ψ if and only if f* Ψ = Φ","status":"ok"},"proof":[{"text":"An initial map is one that is both forward and reflecting ([[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]]). Turn the equation around to Φ = f* Ψ. Equality in the fibre means each structure lies below the other, so the goal becomes a conjunction of two inequalities.","status":"ok","from":0,"to":1},{"text":"The two parts match term by term: f is forward exactly when Φ ≤ f* Ψ ([[AffineConstructive.topology.reflection_pair.base.hom_pull_alt]]), and reflecting exactly when f* Ψ ≤ Φ ([[AffineConstructive.topology.reflection_pair.base.rfl_pull_alt]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.hom_pull_alt2","base":"hom_pull_alt2","kind":"prf","start":186,"body":[187,190],"status":"ok","short":{"text":"Of course f is forward, if and only if Φ ≤ f* Ψ, as an affine equivalence","status":"ok"},"proof":[{"text":"Both sides are affirmative: \"of course\" always yields an affirmative proposition, and the order on a fibre is affirmative. So the affine equivalence reduces to the equivalence of their proofs.","status":"ok","from":0,"to":1},{"text":"That equivalence is [[AffineConstructive.topology.reflection_pair.base.hom_pull_alt]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.rfl_pull_alt2","base":"rfl_pull_alt2","kind":"prf","start":191,"body":[192,195],"status":"ok","short":{"text":"Of course f is reflecting, if and only if f* Ψ ≤ Φ, as an affine equivalence","status":"ok"},"proof":[{"text":"Both sides are affirmative: \"of course\" always yields an affirmative proposition, and the order on a fibre is affirmative. So the affine equivalence reduces to the equivalence of their proofs.","status":"ok","from":0,"to":1},{"text":"That equivalence is [[AffineConstructive.topology.reflection_pair.base.rfl_pull_alt]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.pull_fib_mono","base":"pull_fib_mono","kind":"prf","start":197,"body":[198,203],"status":"ok","short":{"text":"Pullback along f is monotone: Ψ₁ ≤ Ψ₂ implies f* Ψ₁ ≤ f* Ψ₂","status":"ok"},"proof":[{"text":"The order on the fibre is affirmative, so a base-logic implication suffices. Assume Ψ₁ ≤ Ψ₂.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.topology.reflection_pair.base.hom_pull_alt]], the inequality f* Ψ₁ ≤ f* Ψ₂ holds when f is forward from f* Ψ₁ to Ψ₂. Factor f as the pullback lift from f* Ψ₁ to Ψ₁, followed by the identity from Ψ₁ to Ψ₂. The lift is initial, hence forward; the identity is forward because Ψ₁ ≤ Ψ₂. So the composite is forward.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_pull_is_fun_aux","base":"fib_pull_is_fun_aux","kind":"prf","start":208,"body":[209,214],"status":"ok","short":{"text":"For u = v, the identity of S is forward from the pullback along u to the pullback along v","status":"ok"},"proof":[{"text":"Assume u = v.","status":"ok","from":0,"to":1},{"text":"The pullback lift v is initial, so it is reflecting. By the cancellation law for reflecting maps ([[AffineConstructive.topology.interfaces.reflection_pair.rp_cancel_fwd]]), the identity is forward once v ∘ id is forward. That composite is v itself, taken from the structure pulled back along u to Ψ.","status":"ok","from":2,"to":3},{"text":"Replace v by u using u = v. Then u is the pullback lift along u, which is initial and so forward.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_pull_is_fun","base":"fib_pull_is_fun","kind":"inst","start":215,"body":[216,238],"status":"ok","short":{"text":"Pullback, as a map of pairs (f, Ψ), preserves equality","status":"ok"},"proof":[{"text":"It suffices to check that pullback preserves equality in each argument separately.","status":"ok","from":0,"to":1},{"text":"First the map. Fix u, v and Ψ. Equality on !(S ⇾ Z) is affirmative, so it suffices to assume u = v outright.","status":"ok","from":2,"to":5},{"text":"Equality in the fibre is a pair of inequalities. The pullback along u lies below the pullback along v by [[AffineConstructive.topology.reflection_pair.base.fib_pull_is_fun_aux]].","status":"ok","from":6,"to":8},{"text":"The reverse inequality is [[AffineConstructive.topology.reflection_pair.base.fib_pull_is_fun_aux]] again, applied to the equality v = u that symmetry gives.","status":"ok","from":9,"to":11},{"text":"Next the structure. Fix the map u and two structures Ψ₁, Ψ₂ on Z.","status":"ok","from":12,"to":14},{"text":"Show each of the two inequalities from the equality Ψ₁ = Ψ₂. For the first, the equality gives Ψ₁ ≤ Ψ₂, and pullback is monotone ([[AffineConstructive.topology.reflection_pair.base.pull_fib_mono]]).","status":"ok","from":15,"to":18},{"text":"For the second, the equality gives Ψ₂ ≤ Ψ₁, and monotonicity of pullback ([[AffineConstructive.topology.reflection_pair.base.pull_fib_mono]]) finishes the proof.","status":"ok","from":19,"to":22}]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_pull","base":"fib_pull","kind":"def","start":239,"body":null,"status":"ok","short":{"text":"Pullback as a function from !(S ⇾ Z) to functions from the fibre over Z to that over S","status":"ok"},"long":{"text":"The pullback [[AffineConstructive.topology.reflection_pair.base.pull_fib]] packaged as a function of sets: a function f : S ⇾ Z goes to the function f* between the fibres, which are sets under mutual comparison ([[AffineConstructive.topology.interfaces.reflection_pair.fib_set]]). It is built on the tensor product of the two arguments and then curried.\n\nThe argument f is taken in !(S ⇾ Z), with its equality affirmed. An equality u = v of functions is used twice, once for the comparison of the pullbacks in each direction, so it must be available freely; equality in the fibre argument is used in the ordinary way, through monotonicity [[AffineConstructive.topology.reflection_pair.base.pull_fib_mono]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_pull_order_preserving","base":"fib_pull_order_preserving","kind":"inst","start":241,"body":[242,245],"status":"ok","short":{"text":"Pullback along f is order preserving between the fibres","status":"ok"},"proof":[{"text":"Between posets, a map is order preserving as soon as x ≤ y implies f* x ≤ f* y for all x and y.","status":"ok","from":0,"to":1},{"text":"That implication is monotonicity of pullback ([[AffineConstructive.topology.reflection_pair.base.pull_fib_mono]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_pull_id","base":"fib_pull_id","kind":"prf","start":252,"body":[253,255],"status":"ok","short":{"text":"Pullback along the identity is the identity: (id_fun X)* Φ = Φ","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.reflection_pair.base.ini_pull_alt]], it suffices that the identity is initial from Φ to Φ, and identities are initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.coercion:obj","base":"coercion:obj","kind":"coercion","start":256,"body":null,"status":"ok","short":{"text":"In this file an element of a fibre stands for its underlying set, which carries that structure","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_pull_compose","base":"fib_pull_compose","kind":"prf","start":257,"body":[258,261],"status":"ok","short":{"text":"Pullback along a composite is the composite of pullbacks: (g ∘ f)* Ξ = f* (g* Ξ)","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.reflection_pair.base.ini_pull_alt]], it suffices that g ∘ f is initial from f* (g* Ξ) to Ξ.","status":"ok","from":0,"to":1},{"text":"This composite is the pullback lift along f followed by the pullback lift along g. Both lifts are initial, and initial maps compose.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.cloven_rfl_detect","base":"cloven_rfl_detect","kind":"prf","start":262,"body":[263,269],"status":"ok","diagrams":[{"source":"paper","opts":"[column sep=large, row sep=large]","tikz":"X \\arrow[r, dotted, \"f\"] \\arrow[d, dotted, \"j\"'] & Z \\\\\nu^{*}Z \\arrow[ur, ini, \"u\"'] &"}],"short":{"text":"In a cloven pair, a map m such that m ∘ g forward forces g forward is reflecting","status":"ok"},"proof":[{"text":"Assume that m detects forward maps: whenever m ∘ g is forward, g is forward.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.topology.reflection_pair.base.rfl_pull_alt]], m is reflecting once the structure pulled back along m lies below the structure on X. In other words, the identity of X must be forward from the pulled-back structure to the given one.","status":"ok","from":2,"to":3},{"text":"Apply the hypothesis to the test object X, carrying the structure pulled back along m, with g the identity. It remains to show that m ∘ id is forward from the pulled-back structure. This map is the pullback lift m, which is initial and so forward.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.reflection_pair.base.cloven_saturated","base":"cloven_saturated","kind":"def","start":270,"body":[271,279],"status":"ok","diagrams":[{"source":"paper","opts":"[column sep=large, row sep=large]","tikz":"X \\arrow[r, dotted, \"f\"] \\arrow[d, dotted, \"j\"'] & Z \\\\\nu^{*}Z \\arrow[ur, ini, \"u\"'] &"}],"short":{"text":"Every cloven pair is saturated","status":"ok"},"proof":[{"text":"The data of a saturated pair are already there in the cloven pair. What remains are its two detection laws: a map m between objects is reflecting if, whenever m ∘ g is forward, g is forward; and dually, m is forward if, whenever m ∘ g is reflecting, g is reflecting.","status":"ok","from":0,"to":1},{"text":"Fix the objects X, Y and the map m. The first law is the detection of reflecting maps that every cloven pair has, [[AffineConstructive.topology.reflection_pair.base.cloven_rfl_detect]].","status":"ok","from":2,"to":4},{"text":"Fix X, Y and m again. The second law is the same detection result applied in the opposite pair, which is cloven by the same cleavage ([[AffineConstructive.topology.reflection_pair.base.ClovenPair_op]]). There the forward and reflecting classes are exchanged, so detecting reflecting maps in the opposite pair means detecting forward maps in the original.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.reflection_pair.base.ini_lift_alt","base":"ini_lift_alt","kind":"prf","start":280,"body":[281,299],"status":"ok","diagrams":[{"source":"paper","opts":"[column sep=large, row sep=large]","tikz":"X \\arrow[r, dotted, \"f\"] \\arrow[d, dotted, \"j\"'] & Z \\\\\nu^{*}Z \\arrow[ur, ini, \"u\"'] &"}],"short":{"text":"In a cloven pair, f is initial iff, for every g from an object, f ∘ g is forward iff g is","status":"ok"},"proof":[{"text":"The proof treats the two directions of the equivalence separately.","status":"ok","from":0,"to":1},{"text":"Suppose f is initial, and fix an object S and a map g : S ⇾ X. An initial map is both forward and reflecting, so by [[AffineConstructive.topology.reflection_pair.base.detect_hom]] f ∘ g is forward exactly when g is.","status":"ok","from":2,"to":4},{"text":"Conversely, suppose the test holds for every g from an object. By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]], showing f initial means showing it forward and showing it reflecting.","status":"ok","from":5,"to":8},{"text":"To see that f is forward, apply the test to the identity of X. The identity is forward, so f ∘ id, which is f, is forward too.","status":"ok","from":9,"to":11},{"text":"Call the structures on X and on Z Φ and Ψ. By [[AffineConstructive.topology.reflection_pair.base.rfl_pull_alt]], f is reflecting exactly when f* Ψ ≤ Φ, that is, when the identity of X is forward from the pulled-back structure f* Ψ to Φ.","status":"ok","from":12,"to":15},{"text":"Apply the test with S = X carrying f* Ψ, and with g that identity. It is then enough that f is forward from f* Ψ to Ψ, and it is, because the map out of a pullback structure is initial and therefore forward.","status":"ok","from":16,"to":18}]},{"name":"AffineConstructive.topology.reflection_pair.base.ini_lift_alt2","base":"ini_lift_alt2","kind":"prf","start":300,"body":[301,308],"status":"ok","short":{"text":"For f forward in a cloven pair, f is initial iff g is forward whenever f ∘ g is","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt]], f is initial exactly when, for every g from an object, f ∘ g is forward if and only if g is. It remains to show that, since f is forward, this two-way condition is equivalent to the one-way condition.","status":"ok","from":0,"to":1},{"text":"Treat the two directions and fix an object S and a map g : S ⇾ X in each. The two-way condition contains the one-way condition.","status":"ok","from":2,"to":4},{"text":"Conversely, the one-way condition gives one half of the equivalence. The other half holds without it: if g is forward, then f ∘ g is forward as a composite of two forward maps.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.reflection_pair.base.ini_lift_alt_restrict","base":"ini_lift_alt_restrict","kind":"prf","start":309,"body":[310,328],"status":"ok","short":{"text":"The initiality test for f restricted to structures from a class closed under pullback","status":"ok"},"proof":[{"text":"The proof treats the two directions of the equivalence separately.","status":"ok","from":0,"to":1},{"text":"Suppose f is initial, and fix a good object S and a map g : S ⇾ X. An initial map is forward and reflecting, so by [[AffineConstructive.topology.reflection_pair.base.detect_hom]] f ∘ g is forward exactly when g is. This direction does not use goodness.","status":"ok","from":2,"to":4},{"text":"Conversely, suppose the test holds for every g from a good object. By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]], showing f initial means showing it forward and showing it reflecting.","status":"ok","from":5,"to":8},{"text":"To see that f is forward, apply the test to the identity of X. The structure on X is good by assumption, and the identity is forward, so f ∘ id, which is f, is forward.","status":"ok","from":9,"to":11},{"text":"Call the structures on X and on Z Φ and Ψ. By [[AffineConstructive.topology.reflection_pair.base.rfl_pull_alt]], f is reflecting exactly when the identity of X is forward from the pulled-back structure f* Ψ to Φ.","status":"ok","from":12,"to":15},{"text":"Apply the test with S = X carrying f* Ψ, and with g that identity. This test is allowed because the good structures are closed under pullback and Ψ is good, so f* Ψ is good. It is then enough that f is forward from f* Ψ to Ψ, and it is, because the map out of a pullback structure is initial.","status":"ok","from":16,"to":18}]},{"name":"AffineConstructive.topology.reflection_pair.base.PairMorphism_op","base":"PairMorphism_op","kind":"prf","start":329,"body":[330,332],"status":"ok","short":{"text":"A morphism of reflection pairs is also a morphism between the opposite pairs","status":"ok"},"proof":[{"text":"The opposites of the two pairs are reflection pairs ([[AffineConstructive.topology.reflection_pair.base.ReflectionPair_op]]). For the opposites, the conditions on a pair morphism are the original conditions with the forward and reflecting classes exchanged, and the given morphism already provides those.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.pmap_obj","base":"pmap_obj","kind":"prf","start":334,"body":[335,338],"status":"ok","short":{"text":"A pair morphism sends an object structure on X to an object structure on X","status":"ok"},"proof":[{"text":"Assume X with its structure is an object of the first kind.","status":"ok","from":0,"to":1},{"text":"The identity of X is then forward. By [[AffineConstructive.topology.interfaces.reflection_pair.hom_map]] it stays forward for the translated structure, and this makes X an object of the second kind.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.ini_map","base":"ini_map","kind":"prf","start":339,"body":[340,347],"status":"ok","short":{"text":"A pair morphism carries initial maps to initial maps for the translated structures","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]], it is enough to show that f is forward and reflecting for the translated structures.","status":"ok","from":0,"to":2},{"text":"The initial map f is forward, and by [[AffineConstructive.topology.interfaces.reflection_pair.hom_map]] it stays forward after translation.","status":"ok","from":3,"to":4},{"text":"The initial map f is also reflecting, and by [[AffineConstructive.topology.interfaces.reflection_pair.rfl_map]] it stays reflecting after translation.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.reflection_pair.base.emb_map","base":"emb_map","kind":"prf","start":348,"body":[349,356],"status":"ok","short":{"text":"A pair morphism carries embeddings to embeddings for the translated structures","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]], it is enough to show that f is initial for the translated structures and that f is injective.","status":"ok","from":0,"to":2},{"text":"An embedding is initial, and by [[AffineConstructive.topology.reflection_pair.base.ini_map]] the pair morphism carries initial maps to initial maps.","status":"ok","from":3,"to":4},{"text":"Injectivity is a property of f as a map of sets and does not change under translation. The embedding f has it.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_map_opn","base":"fib_map_opn","kind":"def","start":357,"body":null,"status":"ok","short":{"text":"The map on fibres over X induced by a pair morphism, before it is shown a function","status":"ok"},"long":{"text":"Given a morphism of reflection pairs from C to D, an element of the fibre of C over X (a C-structure on X that is an object) is sent to the D-structure that the fibre map assigns to it, which is an object again by [[AffineConstructive.topology.reflection_pair.base.pmap_obj]]. The carrier X does not change; only the kind of structure on it does.\n\nThis is the raw operation underlying [[AffineConstructive.topology.reflection_pair.base.fib_map]]; [[AffineConstructive.topology.reflection_pair.base.fib_map_is_fun]] shows it respects the equality of fibres, which is mutual comparison, so that it becomes a function between the fibre sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_map_mono","base":"fib_map_mono","kind":"prf","start":358,"body":[359,363],"status":"ok","short":{"text":"The fibre map of a pair morphism is monotone: Φ ≤ Ψ implies their images compare likewise","status":"ok"},"proof":[{"text":"The order on a fibre is affirmative. So by [[AffineConstructive.logic.aprop.affirmative_aimpl]], a base-logic implication from Φ ≤ Ψ to the comparison of the images is enough to give the affine implication.","status":"ok","from":0,"to":1},{"text":"Assume Φ ≤ Ψ, which says that the identity of X is forward from Φ to Ψ. By [[AffineConstructive.topology.interfaces.reflection_pair.hom_map]] the identity stays forward between the translated structures, and this is the comparison the goal asks for.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_map_is_fun","base":"fib_map_is_fun","kind":"prf","start":364,"body":[365,374],"status":"ok","short":{"text":"The fibre map of a pair morphism preserves the equality of fibres","status":"ok"},"proof":[{"text":"Fix structures Φ and Ψ in the fibre. Equality in the fibre consists of the two inequalities, so from Φ = Ψ it is enough to derive the comparison of the images in each direction.","status":"ok","from":0,"to":2},{"text":"The equality Φ = Ψ gives Φ ≤ Ψ, and monotonicity of the fibre map, [[AffineConstructive.topology.reflection_pair.base.fib_map_mono]], carries this to the images.","status":"ok","from":3,"to":5},{"text":"The same equality also gives Ψ ≤ Φ, and monotonicity carries this to the images in the other direction.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_map","base":"fib_map","kind":"def","start":375,"body":null,"status":"ok","short":{"text":"The function from the fibre of C over X to the fibre of D induced by a pair morphism","status":"ok"},"long":{"text":"A morphism of reflection pairs from C to D translates C-structures into D-structures on the same set. On the fibre over X, taken as a set whose elements are the object structures on X and whose equality is mutual comparison by the forward identity, this translation is the function [[AffineConstructive.topology.reflection_pair.base.fib_map]], built from [[AffineConstructive.topology.reflection_pair.base.fib_map_opn]] with the proof [[AffineConstructive.topology.reflection_pair.base.fib_map_is_fun]] that it preserves equality.\n\nIt is order preserving ([[AffineConstructive.topology.reflection_pair.base.fib_map_order_preserving]]), and between cloven pairs it commutes with pulling back along any map ([[AffineConstructive.topology.reflection_pair.base.fib_map_pull]]): a pair morphism is a cloven fibred functor, a fact derived rather than assumed.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_map_order_preserving","base":"fib_map_order_preserving","kind":"prf","start":376,"body":[377,380],"status":"ok","short":{"text":"The fibre map of a pair morphism is order preserving","status":"ok"},"proof":[{"text":"The fibre over X is a poset, so by [[AffineConstructive.orders.maps.alt_Build_OrderPreserving]] it suffices to show that Φ ≤ Ψ implies that the translated structures compare likewise.","status":"ok","from":0,"to":1},{"text":"This is the monotonicity of the fibre map, [[AffineConstructive.topology.reflection_pair.base.fib_map_mono]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.fib_map_pull","base":"fib_map_pull","kind":"prf","start":381,"body":[382,385],"status":"ok","short":{"text":"Between cloven pairs, a pair morphism commutes with pullback along any map, up to fibre equality","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.reflection_pair.base.ini_pull_alt]] in D, the pullback of the translated Ψ along f equals the translation of f* Ψ exactly when f is initial from the latter structure to the former. So it suffices to show that f is initial for the translated structures.","status":"ok","from":0,"to":1},{"text":"In C, f is initial from f* Ψ to Ψ, and a pair morphism carries initial maps to initial maps, [[AffineConstructive.topology.reflection_pair.base.ini_map]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.base.fmap_id","base":"fmap_id","kind":"def","start":386,"body":null,"status":"ok","short":{"text":"The identity fibre map, assigning each structure to itself","status":"ok"},"long":{"text":"The fibre map from a kind of structure C to itself that leaves every structure unchanged. It is the fibre map of the identity morphism of reflection pairs, [[AffineConstructive.topology.reflection_pair.base.PairMorphism_id]], and is registered so that resolution finds it whenever a fibre map from C to C is required.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.PairMorphism_id","base":"PairMorphism_id","kind":"prf","start":388,"body":[389,391],"status":"ok","short":{"text":"The identity fibre map is a morphism from a reflection pair to itself","status":"ok"},"proof":[{"text":"Every condition is immediate for the identity fibre map [[AffineConstructive.topology.reflection_pair.base.fmap_id]]. It assigns each structure to itself, so a forward map stays forward and a reflecting map stays reflecting.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.base.fmap_compose","base":"fmap_compose","kind":"def","start":392,"body":null,"status":"ok","short":{"text":"The composite of two fibre maps, translating C-structures to D and then to K","status":"ok"},"long":{"text":"Given a fibre map U from C to D and a fibre map V from D to K, the composite sends a C-structure on X to the K-structure V assigns to the D-structure U assigns to it. Together with [[AffineConstructive.topology.reflection_pair.base.fmap_id]] it makes reflection pairs and their morphisms into a category; [[AffineConstructive.topology.reflection_pair.base.PairMorphism_compose]] shows that composites of pair morphisms are pair morphisms.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.base.PairMorphism_compose","base":"PairMorphism_compose","kind":"prf","start":393,"body":[394,404],"status":"ok","short":{"text":"The composite of two pair morphisms is a pair morphism","status":"ok"},"proof":[{"text":"The structural conditions on the composite fibre map [[AffineConstructive.topology.reflection_pair.base.fmap_compose]] are inherited from its two factors. What remains is to show that the composite preserves both classes. Fix sets X and Y with C-structures and a map f between them that is forward in C, and in the second case reflecting.","status":"ok","from":0,"to":1},{"text":"For forward maps, the first morphism makes f forward between the D-structures assigned to the C-structures, by [[AffineConstructive.topology.interfaces.reflection_pair.hom_map]]. The K-structures assigned by the composite are the ones the second morphism assigns to those D-structures, and [[AffineConstructive.topology.interfaces.reflection_pair.hom_map]] for the second morphism makes f forward between them.","status":"ok","from":2,"to":5},{"text":"For reflecting maps the argument is the same with [[AffineConstructive.topology.interfaces.reflection_pair.rfl_map]] in place of [[AffineConstructive.topology.interfaces.reflection_pair.hom_map]]. The first morphism makes f reflecting for the D-structures, and then the second makes it reflecting for the K-structures.","status":"ok","from":6,"to":10}]}],"diagrams":{"svg":{"column sep=large, row sep=large\nX \\arrow[r, dotted, \"f\"] \\arrow[d, dotted, \"j\"'] & Z \\\\\nu^{*}Z \\arrow[ur, ini, \"u\"'] &":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='82.306pt' height='61.851pt' viewBox='0 0 82.306 61.851'>\n<defs>\n<path id='g2-1' d='M2.83679-2.75315H3.51985C3.65925-2.75315 3.74986-2.75315 3.74986-2.90649C3.74986-3.00407 3.65925-3.00407 3.53379-3.00407H2.88558C3.04589-3.88926 3.10165-4.20988 3.15741-4.41201C3.19226-4.56535 3.3456-4.71172 3.51288-4.71172C3.51985-4.71172 3.70804-4.71172 3.84047-4.62808C3.5547-4.53747 3.53379-4.28655 3.53379-4.24473C3.53379-4.09139 3.65228-3.98684 3.81259-3.98684C4.00078-3.98684 4.20988-4.14715 4.20988-4.41201C4.20988-4.73263 3.86835-4.90688 3.51288-4.90688C3.2062-4.90688 2.86467-4.73263 2.67648-4.38413C2.53708-4.12624 2.48132-3.81259 2.33495-3.00407H1.78432C1.64492-3.00407 1.55431-3.00407 1.55431-2.85073C1.55431-2.75315 1.64492-2.75315 1.77038-2.75315H2.28616C2.27919-2.71133 1.84008-.20213 1.6728 .54366C1.63795 .697 1.51946 1.22672 1.1849 1.22672C1.17793 1.22672 1.01065 1.22672 .87822 1.14308C1.16399 1.05247 1.1849 .80155 1.1849 .75973C1.1849 .60639 1.06641 .50184 .9061 .50184C.71791 .50184 .50881 .66215 .50881 .92701C.50881 1.24066 .8364 1.42188 1.1849 1.42188C1.63098 1.42188 1.93766 .96186 2.0213 .80852C2.27222 .34153 2.43253-.51578 2.44647-.59942L2.83679-2.75315Z'/>\n<path id='g2-2' d='M3.05983-4.35625C3.05983-4.47474 2.96922-4.62111 2.78103-4.62111C2.5789-4.62111 2.39071-4.42595 2.39071-4.23776C2.39071-4.12624 2.47435-3.9729 2.66951-3.9729C2.8577-3.9729 3.05983-4.15412 3.05983-4.35625ZM1.58219 .34153C1.4637 .82246 1.09429 1.22672 .68306 1.22672C.59245 1.22672 .50881 1.21278 .43214 1.1849C.61336 1.10126 .66912 .93398 .66912 .82943C.66912 .66215 .53669 .57154 .39729 .57154C.18122 .57154 0 .75973 0 .98277C0 1.24763 .27183 1.42188 .69003 1.42188S1

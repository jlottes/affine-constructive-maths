ll_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** * Products in a reflection pair.\n\n    A binary product in the forward construct, concretely over the product of\n    sets: a fiber on [X × Y] making the projections forward and the pairing of\n    forward morphisms forward.  Nothing is asked of the reflecting construct.\n    In a fibered pair the forward product is the join of the two pullback\n    structures, and a product in the reflecting construct would be their meet,\n    which degenerates in the instances (for uniformities it is the indiscrete\n    uniformity).  The reflecting class contributes only the one-way rule that\n    [f × g] reflects when [f] and [g] do, and in a saturated pair that is a\n    theorem ([pair_prod_map_rfl]): the maps detecting forward maps under\n    precomposition are closed under products by the universal property alone,\n    and saturation identifies them with the reflecting maps. *)\nRequire Import sprop srelations.\nRequire Import logic.aprop relations.\nRequire Import set_lambda.\nRequire Import interfaces.topology.\nRequire Import topology.base topology.interior topology.maps.\nRequire Import reflection_pair.base.\nRequire Import easy rewrite.\n\nLocal Open Scope sprop_scope.\n\nLocal Abbreviation π₁ := (prod_proj1 _ _).\nLocal Abbreviation π₂ := (prod_proj2 _ _).\n\nLemma pair_product_obj@{u} `{HP:@PairProduct@{u} C CD X Y FX FY FP} : Obj C (X × Y).\nProof. exact (construct_hom_X pair_product_proj1). Qed.\n#[global] Hint Extern 10 (@Obj ?C _ _ (?X × ?Y) ?FP) =>\n  match goal with H : PairProduct C X Y FP |- _ => simple notypeclasses refine (pair_product_obj (HP:=H)) end : typeclass_instances.\n\n(** Products of morphisms.  Forward is the universal property; reflecting is\n    detection through the projections; initial and embedding split. *)\nSection prod_map.\n  Universes u.\n  Context C `{HS:@SaturatedPair@{u} C CD}.\n  Context {X₁ X₂ Y₁ Y₂:set@{u}} {FX₁:Fib C X₁} {FX₂:Fib C X₂} {FY₁:Fib C Y₁} {FY₂:Fib C Y₂}.\n  Context {FP:Fib C (X₁ × X₂)} {HP:PairProduct C X₁ X₂ FP}.\n  Context {FQ:Fib C (Y₁ × Y₂)} {HQ:PairProduct C Y₁ Y₂ FQ}.\n  Context (f:X₁ ⇾ Y₁) (g:X₂ ⇾ Y₂).\n\n  Lemma pair_prod_map_hom `{!Hom C f, !Hom C g} : Hom C (FX:=FP) (FY:=FQ) (prod_map (f, g)).\n  Proof. change (prod_map (f, g)) with (to_prod (f ∘ π₁, g ∘ π₂)).\n    now apply pair_product_pairing.\n  Qed.\n\n  Lemma pair_prod_map_rfl `{!Rfl C f, !Rfl C g} : Rfl C (FX:=FP) (FY:=FQ) (prod_map (f, g)).\n  Proof. apply rp_rfl_detect. intros S FS h Hh.\n    change (Hom C (to_prod (π₁ ∘ h, π₂ ∘ h))).\n    apply pair_product_pairing.\n    + apply (rp_cancel_fwd f). now change (Hom C (π₁ ∘ (prod_map (f, g) ∘ h))).\n    + apply (rp_cancel_fwd g). now change (Hom C (π₂ ∘ (prod_map (f, g) ∘ h))).\n  Qed.\n\n  Lemma pair_prod_map_ini `{!Ini C f, !Ini C 09,"e":3212,"lib":"AffineConstructive.topology.interfaces.reflection_pair","name":"Rfl","kind":"class","local":false,"page":"../interfaces/reflection_pair.html"},{"s":3217,"e":3224,"lib":"AffineConstructive.interfaces.set","name":"func_op","kind":"proj","local":false,"page":"../../interfaces/set.html"},{"s":3225,"e":3233,"lib":"AffineConstructive.theory.set","name":"prod_map","kind":"def","local":false,"page":"../../theory/set.html"},{"s":3277,"e":3294,"lib":"AffineConstructive.topology.reflection_pair.products","name":"pair_prod_map_rfl","kind":"thm","local":true},{"s":3350,"e":3353,"lib":"AffineConstructive.topology.interfaces.reflection_pair","name":"Ini","kind":"class","local":false,"page":"../interfaces/reflection_pair.html"},{"s":3358,"e":3365,"lib":"AffineConstructive.interfaces.set","name":"func_op","kind":"proj","local":false,"page":"../../interfaces/set.html"},{"s":3366,"e":3374,"lib":"AffineConstructive.theory.set","name":"prod_map","kind":"def","local":false,"page":"../../theory/set.html"},{"s":3418,"e":3435,"lib":"AffineConstructive.topology.reflection_pair.products","name":"pair_prod_map_ini","kind":"thm","local":true},{"s":3491,"e":3494,"lib":"AffineConstructive.topology.interfaces.reflection_pair","name":"Emb","kind":"class","local":false,"page":"../interfaces/reflection_pair.html"},{"s":3499,"e":3506,"lib":"AffineConstructive.interfaces.set","name":"func_op","kind":"proj","local":false,"page":"../../interfaces/set.html"},{"s":3507,"e":3515,"lib":"AffineConstructive.theory.set","name":"prod_map","kind":"def","local":false,"page":"../../theory/set.html"},{"s":3559,"e":3576,"lib":"AffineConstructive.topology.reflection_pair.products","name":"pair_prod_map_emb","kind":"thm","local":true},{"s":2222,"e":2225,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2513,"e":2516,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2593,"e":2596,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file works with binary products in the forward construct of a reflection pair, given by a [[AffineConstructive.topology.interfaces.reflection_pair.PairProduct]] structure on the cartesian product X × Y. Such a structure is a genuine object ([[AffineConstructive.topology.reflection_pair.products.pair_product_obj]]). The product f × g of two maps is formed with [[AffineConstructive.theory.set.prod_map]]. If f and g are forward, so is f × g, by the universal property of the product ([[AffineConstructive.topology.reflection_pair.products.pair_prod_map_hom]]). Nothing about products is asked of the reflecting class. Even so, in a saturated pair f × g reflects whenever f and g do ([[AffineConstructive.topology.reflection_pair.products.pair_prod_map_rfl]]): a map h into the domain of f × g is forward as soon as its composite with f × g is, because each component of h then cancels against f or g. Initial maps and embeddings are each split into their parts, so their products follow ([[AffineConstructive.topology.reflection_pair.products.pair_prod_map_ini]], [[AffineConstructive.topology.reflection_pair.products.pair_prod_map_emb]]). Hints register all four results for instance resolution.","short":"Products in a reflection pair, and products of forward, reflecting, initial maps and embeddings","items":[{"name":"AffineConstructive.topology.reflection_pair.products.π₁","base":"π₁","kind":"abbrev","start":8,"body":null,"status":"ok","short":{"text":"Local shorthand for the first projection X × Y ⇾ X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.theory.set.prod_proj1]], the first projection of the cartesian product, with its two sets left to be inferred. It lets the proofs in this file write the components of a map into a product, such as π₁ ∘ h, without naming the factors.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.products.π₂","base":"π₂","kind":"abbrev","start":9,"body":null,"status":"ok","short":{"text":"Local shorthand for the second projection X × Y ⇾ Y","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.theory.set.prod_proj2]], the second projection of the cartesian product, with its two sets left to be inferred. Like π₁, it shortens the proofs in this file, which split maps into a product into their two components.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.reflection_pair.products.pair_product_obj","base":"pair_product_obj","kind":"prf","start":10,"body":[11,13],"status":"ok","short":{"text":"A product structure on X × Y is a genuine object of the construct","status":"ok"},"proof":[{"text":"A product structure on X × Y comes with a forward first projection to X. A forward map has a domain that is an object of the construct, so X × Y is an object.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.reflection_pair.products.pair_prod_map_hom","base":"pair_prod_map_hom","kind":"prf","start":22,"body":[23,26],"status":"ok","short":{"text":"The product f × g of two forward maps is forward between product structures","status":"ok"},"proof":[{"text":"Write f × g as the pairing of its two components, f ∘ π₁ and g ∘ π₂.","status":"ok","from":0,"to":1},{"text":"By the universal property of the product structure on Y₁ × Y₂, a pairing is forward when both its components are. Each component is a composite of forward maps: a projection of the product structure on X₁ × X₂, followed by f or by g.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.products.pair_prod_map_rfl","base":"pair_prod_map_rfl","kind":"prf","start":27,"body":[28,39],"status":"ok","short":{"text":"In a saturated pair, the product f × g of two reflecting maps is reflecting","status":"ok"},"proof":[{"text":"In a saturated pair, a map out of an object is reflecting when it detects forward maps. The domain X₁ × X₂ is an object by [[AffineConstructive.topology.reflection_pair.products.pair_product_obj]]. So let h be a map from some S into X₁ × X₂ such that (f × g) ∘ h is forward; it remains to show that h is forward.","status":"ok","from":0,"to":2},{"text":"Write h as the pairing of π₁ ∘ h and π₂ ∘ h. By the universal property of the product structure on X₁ × X₂, it suffices that each component is forward.","status":"ok","from":3,"to":4},{"text":"Since f is reflecting, π₁ ∘ h is forward when f ∘ π₁ ∘ h is, which cancels f. That map is π₁ ∘ (f × g) ∘ h, the first projection composed with the forward map (f × g) ∘ h, so it is forward.","status":"ok","from":5,"to":7},{"text":"The second component is treated the same way. Cancel g, which is reflecting, and observe that g ∘ π₂ ∘ h is π₂ ∘ (f × g) ∘ h, which is forward.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.topology.reflection_pair.products.pair_prod_map_ini","base":"pair_prod_map_ini","kind":"prf","start":40,"body":[41,44],"status":"ok","short":{"text":"In a saturated pair, the product f × g of two initial maps is initial","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.interfaces.reflection_pair.initial_split_iff]], a map is initial when it is both forward and reflecting, so it suffices to prove both of f × g.","status":"ok","from":0,"to":1},{"text":"Since f and g are initial, both are forward and both are reflecting. Then f × g is forward by [[AffineConstructive.topology.reflection_pair.products.pair_prod_map_hom]] and reflecting by [[AffineConstructive.topology.reflection_pair.products.pair_prod_map_rfl]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.reflection_pair.products.pair_prod_map_emb","base":"pair_prod_map_emb","kind":"prf","start":45,"body":[46,49],"status":"ok","short":{"text":"In a saturated pair, the product f × g of two embeddings is an embedding","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.interfaces.reflection_pair.embed_split_iff]], a map is an embedding when it is both initial and injective, so it suffices to prove both of f × g.","status":"ok","from":0,"to":1},{"text":"Since f and g are embeddings, both are initial and both are injective. Then f × g is initial by [[AffineConstructive.topology.reflection_pair.products.pair_prod_map_ini]] and injective by [[AffineConstructive.theory.set.prod_map_injective]].","status":"ok","from":2,"to":3}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.srelations":{"page":"../../logic/srelations.html","short":"Base-logic relations: converse, complement, equality, implication, and congruence of the connectives","summary":"The file proves the basic facts about relations of the base logic, the predicates on pairs valued in `SProp` that `interfaces/sprop.v` introduces, and makes them available to instance resolution. Taking the converse ([[sflip]]) preserves reflexivity, irreflexivity, symmetry, transitivity, antisymmetry, subrelations, partial equivalences and equivalences. Taking the complement ([[scomplement]]) turns irreflexive relations into reflexive ones and reflexive relations into irreflexive ones, preserves symmetry, and reverses inclusion. Strict equality is an equivalence relation contained in every reflexive relation. Implication is a reflexive and transitive relation, antisymmetric with respect to logical equivalence, and logical equivalence is an equivalence relation. The rest are congruence lemmas: a transitive relation, or a partial equivalence relation, respects related arguments ([[sTransitive_rel_proper_impl]], [[sPER_rel_proper_iff]]); implication, equivalence, negation, disjunction and conjunction respect implication and equivalence of their arguments; and the four tactics do the same for the quantifiers. All of these are registered in the `proper` hint database, which the rewriting system of `tactics/` uses whenever a rewrite reaches into a base-logic statement."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Topological spaces by neighbourhood relations: axioms, continuity classes, separation, products","summary":"This file sets up the interface for topological spaces, in terms of a neighbourhood relation x ⪽ U between points and subsets. A [[Topology]] requires that every neighbourhood contains its point, that neighbourhoods are closed upward and under finite meets, and that a neighbourhood of x is also a neighbourhood of every point near x. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the T₀ and Hausdorff separation axioms. It defines the classes of maps (continuous, continuously reflecting, initial, embedding, dense), the discrete and indiscrete structures, and the tensor and cartesian product topologies. The theory of these notions is developed in the files under topology/topology."},"AffineConstructive.topology.topology.base":{"page":"../topology/base.html","short":"Basic topology: classes of maps under composition, separation, discrete and indiscrete spaces","summary":"The first results about topological spaces given by a neighbourhood relation. The classes of maps (continuous, reflecting, initial, embedding, dense) become predicates that respect equality of maps, and each is closed under identity and composition. On separation: a Hausdorff space is T₀, and in a Hausdorff space two points are equal exactly when all their neighbourhoods meet. An initial map out of a T₀ space is an embedding, and a continuous injection into a Hausdorff space makes its domain Hausdorff. The file also sets up the empty space as initial object, the discrete and indiscrete topologies (the finest and the coarsest), the one-point space as terminal object, and shows that constant maps are continuous. Later topology files build on these results."},"AffineConstructive.topology.topology.interior":{"page":"../topology/interior.html","short":"Interior and closure in a topological space: basic laws, open and closed subsets, density","summary":"This file develops the basic algebra of the interior and closure operators that a topology determines from its neighbourhood relation. The interior is contained in its argument, is monotone and idempotent, and preserves the full subset and the empty subset. It also sends the multiplicative intersection of two interiors into the interior of their meet. As a consequence, interiors are open, and an open subset is a neighbourhood of each of its points. The closure, defined as the complement of the interior of the complement, has the dual properties, which follow by complementation: it contains its argument, is idempotent, and sends a join into the multiplicative union of the closures. A subset is open exactly when its complement is closed, and conversely. The file ends with the neighbourhood characterisation of the closure, that x is in the closure of U if and only if every neighbourhood of x meets U, and its consequences for dense subsets. These results are used by the files on continuity, uniform spaces and completions."},"AffineConstructive.topology.topology.maps":{"page":"../topology/maps.html","short":"Continuous, reflecting, initial and dense maps of topological spaces; the topological reflection pair","summary":"The file characterises the classes of maps between topological spaces in several equivalent ways. A map is continuous when preimages of open sets are open, or of closed sets closed, or by an inclusion between interiors or closures under preimage or image. A map is continuously reflecting when every open (or closed) set is the preimage of an open (or closed) set, or when the interior of A is computed through the universal image. A map is initial when interiors and closures are pulled back from the codomain ([[continuously_initial_interior]], [[continuously_initial_closure]]). The two cancellation laws [[cont_factor]] and [[cont_refl_factor]] make topological spaces a reflection pair under the label [[𝐀𝐓𝐨𝐩]], which gives the inverse lemmas for bijections. Last come dense maps: closure of density under composition and its factor laws, and the result that continuous maps into a Hausdorff space are determined on a dense subset ([[cont_equal_on_dense]], [[cont_dense_epi]])."},"AffineConstructive.topology.reflection_pair.base":{"page":"base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</

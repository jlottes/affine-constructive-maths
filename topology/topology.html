continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`.","short":"Gathers the basic theory of topological spaces into a single import","items":[],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.topology.topology.base":{"page":"topology/base.html","short":"Basic topology: classes of maps under composition, separation, discrete and indiscrete spaces","summary":"The first results about topological spaces given by a neighbourhood relation. The classes of maps (continuous, reflecting, initial, embedding, dense) become predicates that respect equality of maps, and each is closed under identity and composition. On separation: a Hausdorff space is T₀, and in a Hausdorff space two points are equal exactly when all their neighbourhoods meet. An initial map out of a T₀ space is an embedding, and a continuous injection into a Hausdorff space makes its domain Hausdorff. The file also sets up the empty space as initial object, the discrete and indiscrete topologies (the finest and the coarsest), the one-point space as terminal object, and shows that constant maps are continuous. Later topology files build on these results."},"AffineConstructive.topology.topology.basis":{"page":"topology/basis.html","short":"Neighbourhood bases: criteria for continuity, reflection, density, and topologies generated by a basis","summary":"The file works with neighbourhood bases: families β of subsets such that N is a neighbourhood of x exactly when some β i containing x lies in N. It derives the basic consequences: each basis element is a neighbourhood of each of its points, and neighbourhoods are closed under enlargement. It reduces continuity, continuous reflection, initiality and density to checks on basis elements, at the domain, at the codomain or at both. It also defines the neighbourhood relation generated by any family, shows that the interiors of a topology form a basis, and proves the topology axioms from a basis that covers every point and refines binary meets of its elements. Later files, such as the topology on a tensor product, build on these results."},"AffineConstructive.topology.topology.interior":{"page":"topology/interior.html","short":"Interior and closure in a topological space: basic laws, open and closed subsets, density","summary":"This file develops the basic algebra of the interior and closure operators that a topology determines from its neighbourhood relation. The interior is contained in its argument, is monotone and idempotent, and preserves the full subset and the empty subset. It also sends the multiplicative intersection of two interiors into the interior of their meet. As a consequence, interiors are open, and an open subset is a neighbourhood of each of its points. The closure, defined as the complement of the interior of the complement, has the dual properties, which follow by complementation: it contains its argument, is idempotent, and sends a join into the multiplicative union of the closures. A subset is open exactly when its complement is closed, and conversely. The file ends with the neighbourhood characterisation of the closure, that x is in the closure of U if and only if every neighbourhood of x meets U, and its consequences for dense subsets. These results are used by the files on continuity, uniform spaces and completions."},"AffineConstructive.topology.topology.maps":{"page":"topology/maps.html","short":"Continuous, reflecting, initial and dense maps of topological spaces; the topological reflection pair","summary":"The file characterises the classes of maps between topological spaces in several equivalent ways. A map is continuous when preimages of open sets are open, or of closed sets closed, or by an inclusion between interiors or closures under preimage or image. A map is continuously reflecting when every open (or closed) set is the preimage of an open (or closed) set, or when the interior of A is computed through the universal image. A map is initial when interiors and closures are pulled back from the codomain ([[continuously_initial_interior]], [[continuously_initial_closure]]). The two cancellation laws [[cont_factor]] and [[cont_refl_factor]] make topological spaces a reflection pair under the label [[𝐀𝐓𝐨𝐩]], which gives the inverse lemmas for bijections. Last come dense maps: closure of density under composition and its factor laws, and the result that continuous maps into a Hausdorff space are determined on a dense subset ([[cont_equal_on_dense]], [[cont_dense_epi]])."},"AffineConstructive.topology.topology.product":{"page":"topology/product.html","short":"The tensor product topology, its structure maps, and the cartesian comparison","summary":"This file builds the tensor product topology on X ⊗ Y. Its basic sets are the pairings of interiors, and its neighbourhood relation is generated by them ([[tensor_product_neighborhood]]). It proves that this relation satisfies the topology axioms ([[tensor_product_topology]]), and that tensoring neighbourhood bases of the factors gives a basis of the product ([[tensor_product_neighborhood_basis_alt_correct]]). The structure maps of the tensor are then shown well behaved. The unitors, the symmetry and the associators are embeddings, the projections are continuous, and the tensor of two maps keeps continuity, reflection, initiality, embedding and density. Where a cartesian product topology is given by its universal property, the comparison X ⊗ Y ⇾ X × Y is continuous and dense; pairing, the diagonal and the product of maps are continuous; and a cartesian product of Hausdorff spaces is Hausdorff. The file ends with laws for relations: interior and closure commute with the converse, a closure inequality for composites thickened by a neighbourhood of the diagonal ([[closure_compose_thicken]]), and its interior counterpart ([[int_compose_both]])."}},"constants":null}</script>

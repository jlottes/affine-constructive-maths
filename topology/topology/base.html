notation.\nLocal Open Scope topology_scope.\n\n\n#[global] Hint Extern 2 (apos (_ ⪽ full_subset _)) => simple notypeclasses refine (top_nullary_additivity _) : typeclass_instances.\n\nLemma nbrhood_proper_le_aimpl `{@Topology X XN} {x y:X} {U V : 𝒫 X} :\n  x = y → U ⊆ V → (x ⪽ U ⊸ y ⪽ V).\nProof. intros E HUV. trans (x ⪽ V).\n+ rew <-(top_isotony x U V), (aprod_true_r HUV). easy.\n+ apply (is_fun nbrhood (x,V) (y,V)). now split.\nQed.\n\n(** Order rewriting in the subset position of [⪽] (isotony): fires only when\n    a tag carrying an order relation is syntactically present in the subset\n    terms, so equality rewrites never spawn the [Topology] search. *)\nLtac nbrhood_le_proper U V :=\n  lazymatch constr:((U, V)) with\n  | context [ @arewrite_tag_l _ (@le _ _) _ _ _ ] => idtac\n  | context [ @arewrite_tag_r _ (@le _ _) _ _ _ ] => idtac\n  end;\n  sapply_2 nbrhood_proper_le_aimpl.\n\n#[global] Hint Extern 1 (apos (aimpl (_ ⪽ ?U, _ ⪽ ?V))) => nbrhood_le_proper U V : proper.\n\n(*\nSection test_nbrhood_le_rewrite.\n  Context `{@Topology X XN} (x y : X) (A B : 𝒫 X) (HAB : A ⊆ B).\n\n  Example test_goal (m : x ⪽ A) : x ⪽ B.\n  Proof. rew <-HAB. exact m. Qed.\n\n  Example test_hyp (m : x ⪽ A) : x ⪽ B.\n  Proof. rew HAB in m. exact m. Qed.\n\n  Example test_aimpl : x ⪽ A ⊸ x ⪽ B.\n  Proof. now rew HAB. Qed.\n\n  Example test_aimpl_rev : x ⪽ A ⊸ x ⪽ B.\n  Proof. now rew <-HAB. Qed.\n\n  Example test_eq_regression (E : x = y) (m : x ⪽ A) : y ⪽ A.\n  Proof. rew <-E. exact m. Qed.\nEnd test_nbrhood_le_rewrite.\n\nSection test_nbrhood_le_rewrite_nested.\n  Context `{@Topology Y YN} {X:set} (f : X ⇾ Y) (y : Y) (A B : 𝒫 X) (HAB : A ⊆ B).\n\n  Example test_nested (m : y ⪽ ∀.[f] A) : y ⪽ ∀.[f] B.\n  Proof. rew <-HAB. exact m. Qed.\n\n  Example test_counit (m : y ⪽ ∀.[f] (f* (∀.[f] A))) : y ⪽ ∀.[f] A.\n  Proof. rew (universal_image_counit f A) in m. exact m. Qed.\nEnd test_nbrhood_le_rewrite_nested.\n*)\n\n\nImport of_course_set_notation.\n\nLemma Continuous_proper_impl@{u} {X Y:set@{u}} {NX:Neighborhood X} {NY:Neighborhood Y} (f g : X ⇾ Y)\n  : f = g → impl (Continuous f, Continuous g).\nProof. intros E [???]; split; try exact _. now rew <-E. Qed.\nCanonical Structure Continuous_fun {X Y} {NX:Neighborhood X} {NY:Neighborhood Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@Continuous X Y NX NY) Continuous_proper_impl.\n\nLemma ContinuouslyReflecting_proper_impl@{u} {X Y:set@{u}} {NX:Neighborhood X} {NY:Neighborhood Y} (f g : X ⇾ Y)\n  : f = g → impl (ContinuouslyReflecting f, ContinuouslyReflecting g).\nProof. intros E [???]; split; try exact _. red. now rew <-E. Qed.\nCanonical Structure ContinuouslyReflecting_fun {X Y} {NX:Neighborhood X} {NY:Neighborhood Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@ContinuouslyReflecting X Y NX NY) ContinuouslyReflecting_proper_impl.\n\nLemma ContinuouslyInitial_proper_impl@{u} {X Y:set@{u}} {NX:Neighborhood X} {NY:Neighborhood Y} (f g : X ⇾ Y)\n  : f = g → impl (ContinuouslyInitial f, ContinuouslyInitial g).\nProof. intros E [??]; split; now rew <-E. Qed.\nCanonical Structure ContinuouslyInitial_fun {X Y} {NX:Neighborhood X} {NY:Neighborhood Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@ContinuouslyInitial X Y NX NY) ContinuouslyInitial_proper_impl.\n\nLemma ContinuouslyEmbedding_proper_impl@{u} {X Y:set@{u}} {NX:Neighborhood X} {NY:Neighborhood Y} (f g : X ⇾ Y)\n  : f = g → impl (ContinuouslyEmbedding f, ContinuouslyEmbedding g).\nProof. intros E ?; split; now rew <-E. Qed.\nCanonical Structure ContinuouslyEmbedding_fun {X Y} {NX:Neighborhood X} {NY:Neighborhood Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@ContinuouslyEmbedding X Y NX NY) ContinuouslyEmbedding_proper_impl.\n\n\nLemma Dense_proper_impl@{u} {A:Type@{u}} {Y:set@{u}} {NY:Neighborhood Y} (f g : A → Y)\n  : f = g → impl (Dense f, Dense g).\nProof. intros E [??]; split; try exact _; now rew <-E. Qed.\nCanonical Structure Dense_fun {A Y} {NY:Neighborhood Y} : !(A → Y) ⇾ SProp\n  := make_weak_spred (@Dense A Y NY) Dense_proper_impl.\n\n\nLemma id_emb `{@Topology X XN} : ContinuouslyEmbedding (id_fun X).\nProof. do 3 (split; try exact _).\n+ intros x N. now change (x ⪽ N ⊸ x ⪽ N).\n+ intros x N. now rew (universal_image_id_alt _).\nQed.\n#[global] Hint Extern 2 (ContinuouslyEmbedding (id_fun _)) => simple notypeclasses refine id_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial (id_fun _)) => simple notypeclasses refine id_emb : typeclass_instances.\n#[global] Hint Extern 2 (Continuous (id_fun _)) => simple notypeclasses refine id_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting (id_fun _)) => simple notypeclasses refine id_emb : typeclass_instances.\n\n\nLemma compose_cont@{u} {X Y Z:set@{u}} `{@Continuous X Y NX NY f} `{@Continuous Y Z NY NZ g} : Continuous (g ∘ f).\nProof. split; try exact _.\n  intros x N. change (g (f x) ⪽ N ⊸ x ⪽ f* (g* N)).\n  rew (continuity g _ _). exact (continuity f _ _).\nQed.\n#[global] Hint Extern 2 (Continuous (_ ∘ _)) => simple notypeclasses refine compose_cont : typeclass_instances.\n\nLemma compose_cont_reflect@{u} {X Y Z:set@{u}}\n  `{@ContinuousReflection X Y NX NY f} `{@ContinuousReflection Y Z NY NZ g}\n  : ContinuousReflection (g ∘ f).\nProof. intros x U. rew (universal_image_compose_alt _ _ _).\n  change ((g ∘ f) x) with (g (f x)). rew <-(cont_reflection g _ _).\n  exact (cont_reflection f _ _).\nQed.\n#[global] Hint Extern 2 (ContinuousReflection (_ ∘ _)) => simple notypeclasses refine compose_cont_reflect : typeclass_instances.\n\nLemma compose_cont_reflecting@{u} {X Y Z:set@{u}}\n  `{@ContinuouslyReflecting X Y NX NY f} `{@ContinuouslyReflecting Y Z NY NZ g}\n  : ContinuouslyReflecting (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (ContinuouslyReflecting (_ ∘ _)) => simple notypeclasses refine compose_cont_reflecting : typeclass_instances.\n\nLemma compose_cont_initial@{u} {X Y Z:set@{u}}\n  `{@ContinuouslyInitial X Y NX NY f} `{@ContinuouslyInitial Y Z NY NZ g}\n  : ContinuouslyInitial (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (ContinuouslyInitial (_ ∘ _)) => simple notypeclasses refine compose_cont_initial : typeclass_instances.\n\nLemma compose_cont_embedding@{u} {X Y Z:set@{u}}\n  `{@ContinuouslyEmbedding X Y NX NY f} `{@ContinuouslyEmbedding Y Z NY NZ g}\n  : ContinuouslyEmbedding (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (ContinuouslyEmbedding (_ ∘ _)) => simple notypeclasses refine compose_cont_embedding : typeclass_instances.\n\nLemma Dense_alt@{u} {A:Type@{u}} `{@Topology@{u} X XN} (f:A → X)\n  : Dense f ↔ dense (range f).\nProof. split; [ now intros [??] | intros; now split ]. Qed.\n\nLemma Hausdorff_T₀ `{@Topology X XN} : Hausdorff X → Separation_T₀ X.\nProof.\n  intros HH x y. rew <-(hausdorff x y).\n  rew <-all_adj; intros U. rew <-all_adj; intros V.\n  rew <-(aex_ub _ x). rew (all_lb _ V).\n  rew <-(aprod_adj _ _ _).\n  rew <-(top_refl x U), <-(top_refl x V).\n  tautological.\nQed.\n\nLemma hausdorff_iff  `{@Topology X XN} `{!Hausdorff X} (x y : X) :\n   (∏ U V, of_course (x ⪽ U ⊠ y ⪽ V) ⊸ ∐ z, z ∊ U ⊠ z ∊ V) ⧟ x = y.\nProof. split.\n+ exact (hausdorff _ _).\n+ rew <-all_adj; intros U; rew <-all_adj; intros V. rew <-(aex_ub _ y).\n  rew [(top_refl x U) | (top_refl y V)].\n  change (x = y ⊸ of_course (x ∊ U ⊠ y ∊ V) ⊸ y ∊ U ⊠ y ∊ V).\n  rew <-(equal_element U x y). tautological.\nQed.\n\n\nLemma cont_refl_injective `{@ContinuouslyReflecting X Y NX NY f}\n  `{!Separation_T₀ X} : Injective f.\nProof. intros x y. rew <-(separation_T₀ x y).\n  enough (∀ x y (U : 𝒫 X), f x = f y ⊸ x ⪽ U ⊸ y ⪽ U) as P.\n  + rew <-all_adj; intros U. apply aand_intro; [ apply P |].\n    rew (symmetry_iff (=) _ _). apply P.\n  + clear x y; intros x y U.\n    rew (top_trans x U), (cont_reflection f x _).\n    rew (is_fun (set:(λ a:Y, a ⪽ ∀.[f] { z | z ⪽ U })) (f x) (f y)).\n    change ((f x ⪽ ∀.[f] { z | z ⪽ U } ⧟ f y ⪽ ∀.[f] { z | z ⪽ U }) ⊸ f x ⪽ ∀.[f] { z | z ⪽ U } ⊸ y ⪽ U).\n    enough (f y ⪽ ∀.[f] { z | z ⪽ U } ⊸ y ⪽ U) as E by (rew <-E; tautological).\n    rew (top_refl (f y) _).\n    change (y ∊ f* (∀.[f] { z | z ⪽ U }) ⊸ y ∊ { z | z ⪽ U }).\n    exact (universal_image_counit f _ y).\nQed.\n\nLemma cont_initial_embedding `{@ContinuouslyInitial X Y NX NY f}\n  `{!Separation_T₀ X} : ContinuouslyEmbedding f.\nProof. split; trivial. exact cont_refl_injective. Qed.\n\n\n(** A continuous map into a Hausdorff space identifies points whose\n    neighborhoods meet.  Hausdorff is reflected by any point-separating family\n    of continuous maps; the two cases used are an injective map\n    ([reflects_hausdorff]) and the projections of a cartesian product\n    ([cartesian_product_hausdorff]). *)\nLemma cont_hausdorff_meet `{@Continuous X Y NX NY f} `{!Hausdorff Y} (x y : X)\n  : (∏ U V, of_course (x ⪽ U ⊠ y ⪽ V) ⊸ ∐ z, z ∊ U ⊠ z ∊ V) ⊸ f x = f y.\nProof. rew <-(hausdorff_iff (f x) (f y)).\n  rew <-all_adj; intros U; rew <-all_adj; intros V.\n  rew (continuity f _ _). rew (all_lb _ (f* U)), (all_lb _ (f* V)).\n  refine ((tautology : ∀ P Q R, (Q ⊸ R) → (P ⊸ Q) ⊸ P ⊸ R) _ _ _ _).\n  rew <-aex_adj; intros z. now rew <-(aex_ub _ (f z)).\nQed.\nArguments cont_hausdorff_meet {_ _ _ _} f {_ _} x y.\n\n\nLemma reflects_hausdorff `{@Continuous X Y NX NY f} `{!Injective f} `{!Hausdorff Y} : Hausdorff X.\nProof. intros x y. rew (injective_iff f x y). exact (cont_hausdorff_meet f x y). Qed.\nArguments reflects_hausdorff {_ _ _ _} f {_ _ _}.\n\n(** Initial object *)\n\nSection empty.\n  Universes u.\n  Context {NE:Neighborhood@{u} 𝟎}.\n  \n  Local Instance empty_topology : @Topology@{u} _ NE.\n  Proof. tautological. Qed.\n\n  Lemma from_empty_cont `{@Topology X NX} : @Continuous  _ X NE NX (from_Empty X).\n  Proof. split; try exact _. intros []. Qed.\nEnd empty.\n#[global] Hint Extern 2 (Topology 𝟎) => simple notypeclasses refine empty_topology : typeclass_instances.\n#[global] Hint Extern 2 (Continuous (from_Empty _)) => simple notypeclasses refine from_empty_cont : typeclass_instances.\n\n(** Discrete topologies: neighborhood is membership.  This is the finest\n    topology; every map out of a discrete space is continuous. *)\n\nLemma element_discrete@{u} {X:set@{u}} : Discrete@{u} (X:=X) element.\nProof. now red. Qed.\n#[global] Hint Extern 2 (Discrete element) => simple notypeclasses refine element_discrete : typeclass_instances.\n\nLemma const_nbrhood@{u} `{@Topology@{u} X NX} {x:X} {P:Ω}\n  : x ⪽ { y:X | P } ⧟ P.\nProof. split.\n+ now rew (top_refl x _).\n+ rew <-(top_isotony x ⊤ _).\n  rew (aprod_true_l (top_nullary_additivity x)).\n  change (P ⊸ ∏ (x:X), 𝐓 ⊸ P). full_tautological.\nQed.\n\nSection discrete.\n  Universes u.\n  Context {X:set@{u}} {NX} {DX:Discrete@{u} (X:=X) NX}.\n\n  Local Instance discrete_topology : @Topology@{u} _ NX.\n  Proof. split; rew is_discrete_nbrhood.\n  + tautological.\n  + intros. apply subset_apply.\n  + tautological.\n  + tautological.\n  + intros x U. change (x ∊ U ⊸ x ⪽ U). now rew is_discrete_nbrhood.\n  Qed.\n\n  (** Every map out of a discrete space is continuous. *)\n  Lemma discrete_cont `{@Topology@{u} Y NY} (f:X ⇾ Y) : Continuous f.\n  Proof. split; try exact _. intros x N. rew is_discrete_nbrhood.\n    change (f x ⪽ N ⊸ f x ∊ N). apply top_refl.\n  Qed.\nEnd discrete.\n\n(** Indiscrete topologies: every point neighbors only the full subsets.  This\n    is the coarsest topology; every map into an indiscrete space is continuous. *)\n\nLemma indiscrete_nbrhood_correct@{u} {X:set@{u}} : Indiscrete@{u} (X:=X) indiscrete_nbrhood.\nProof. now red. Qed.\n#[global] Hint Extern 2 (Indiscrete indiscrete_nbrhood) => simple notypeclasses refine indiscrete_nbrhood_correct : typeclass_instances.\n\nSection indiscrete.\n  Universes u.\n  Context {X:set@{u}} {NX} {IX:Indiscrete@{u} (X:=X) NX}.\n\n  Local Instance indiscrete_topology : @Topology@{u} _ NX.\n  Proof. split; rew is_indiscrete_nbrhood.\n  + tautological.\n  + tautological.\n  + tautological.\n  + tautological.\n  + intros x U. change (indiscrete_nbrhood (x, U) ⊸ ∏ z:X, z ⪽ U).\n    rew <-all_adj; intros z. rew is_indiscrete_nbrhood. full_tautological.\n  Qed.\n\n  (** Every map into an indiscrete space is continuous. *)\n  Lemma indiscrete_cont `{@Topology@{u} W NW} (f:W ⇾ X) : Continuous f.\n  Proof. split; try exact _. intros x N. rew is_indiscrete_nbrhood.\n    rew <-(top_isotony x ⊤ _).\n    rew (aprod_true_l (top_nullary_additivity x)).\n    change ((∏ y, y ∊ N) ⊸ ∏ w:W, w ∊ ⊤ ⊸ w ∊ f* N).\n    rew <-all_adj; intros w; rew (all_lb _ (f w)). now simplify.\n  Qed.\nEnd indiscrete.\n\n(** The canonical structures, and the default structure on 𝟏, are topologies. *)\n#[global] Hint Extern 2 (Topology 𝟏) => simple notypeclasses refine discrete_topology : typeclass_instances.\n#[global] Hint Extern 2 (@Topology _ element) => simple notypeclasses refine discrete_topology : typeclass_instances.\n#[global] Hint Extern 2 (@Topology _ indiscrete_nbrhood) => simple notypeclasses refine indiscrete_topology : typeclass_instances.\n\n(** Terminal object *)\n\nSection unit.\n  Universes u.\n  Context {NU : Neighborhood@{u} 𝟏} {UN:Discrete@{u} NU}.\n\n  Lemma to_unit_cont `{@Topology X NX} : @Continuous  X _ NX NU (to_Unit X).\n  Proof. split; try exact _. rew is_discrete_nbrhood. intros x N.\n    change (to_Unit X x) with tt.\n    change (N tt ⊸ x ⪽ { y:X | N tt }).\n    now rew const_nbrhood.\n  Qed.\nEnd unit.\n#[global] Hint Extern 2 (Continuous (to_Unit _)) => simple notypeclasses refine to_unit_cont : typeclass_instances.\n\n\n\n(** Constant maps — in particular global points [𝟏 ⇾ X] — are continuous. *)\n\nLemma const_cont@{u} `{@Topology@{u} X NX, @Topology@{u} Y NY} (y:Y)\n  : Continuous (const (X:=X) y).\nProof. split; try exact _. intros x N.\n  change ( y ⪽ N ⊸ x ⪽ { x' : X | y ∊ N } ).\n  rew const_nbrhood. exact (top_refl y N).\nQed.\n#[global] Hint Extern 2 (Continuous (func_op const _)) => simple notypeclasses refine const_cont : typeclass_instances.\n\n\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":35,"messages":["2976e9b8 rewrite.html"},{"s":10675,"e":10678,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":10754,"e":10771,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../../interfaces/aprop.html"},{"s":10942,"e":10945,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":10971,"e":10983,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":11021,"e":11033,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":11039,"e":11051,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":11093,"e":11096,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11097,"e":11100,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":11299,"e":11302,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":11656,"e":11659,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11977,"e":11980,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12008,"e":12020,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":12026,"e":12038,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":12044,"e":12056,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":12062,"e":12074,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":12147,"e":12150,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12172,"e":12175,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12199,"e":12216,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../../interfaces/aprop.html"},{"s":12398,"e":12401,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12429,"e":12432,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12460,"e":12463,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12564,"e":12567,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12589,"e":12592,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12611,"e":12614,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":12615,"e":12623,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":13310,"e":13313,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":13425,"e":13428,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":13429,"e":13432,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":13851,"e":13854,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file collects the first facts about topological spaces given by a neighbourhood relation. It lets the rewriting system rewrite by inclusions inside the neighbourhood relation, using isotony. It also shows that being continuous, reflecting, initial, an embedding or dense is preserved when a map is replaced by an equal one. The identity is a topological embedding, and each of these classes of maps is closed under composition. On separation: a Hausdorff space is T₀, and in a Hausdorff space two points are equal exactly when all their neighbourhoods meet. A reflecting map out of a T₀ space is injective, so an initial map out of a T₀ space is an embedding ([[AffineConstructive.topology.topology.base.cont_initial_embedding]]). A continuous injective map into a Hausdorff space reflects the Hausdorff property ([[AffineConstructive.topology.topology.base.reflects_hausdorff]]). Finally, the empty space is initial and the one-point space is terminal. The file builds the discrete topology, out of which every map is continuous, and the indiscrete topology, into which every map is continuous. Constant maps are continuous. The subspace and product files build on these facts.","short":"Basic topology: isotony rewriting, composition of continuous maps, separation, discrete and indiscrete spaces","items":[{"name":"AffineConstructive.topology.topology.base.nbrhood_proper_le_aimpl","base":"nbrhood_proper_le_aimpl","kind":"prf","start":11,"body":[12,21],"status":"ok","short":{"text":"If x = y and U ⊆ V, then U being a neighbourhood of x implies V is a neighbourhood of y","status":"ok"},"proof":[{"text":"Assume x = y and U ⊆ V. The implication goes through x ⪽ V in two steps: first enlarge the neighbourhood at the fixed point x, then move the point with V fixed.","status":"ok","from":0,"to":2},{"text":"Isotony of the neighbourhood relation says that a neighbourhood U of x together with U ⊆ V makes V a neighbourhood of x. The inclusion is proved, so that factor drops out, and what is left is x ⪽ U implies itself.","status":"ok","from":3,"to":5},{"text":"The neighbourhood relation is a function on pairs of a point and a subset, so equal pairs give equivalent propositions ([[AffineConstructive.interfaces.set.is_fun]]). The pairs (x, V) and (y, V) are equal because their first components are equal by x = y and their second components are both V.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.topology.topology.base.nbrhood_le_proper","base":"nbrhood_le_proper","kind":"ltac","start":22,"body":null,"status":"ok","short":{"text":"Lets the rewriting tactic rewrite by an inclusion in the subset position of a neighbourhood relation","status":"ok"},"long":{"text":"In a topological space, the neighbourhood relation x ⪽ U is isotone in U: a subset containing a neighbourhood of x is itself a neighbourhood of x. This tactic gives that fact to the rewriting system. It applies to a goal asking that x ⪽ U imply y ⪽ V, the shape the rewriting tactic `rew` produces when it rewrites inside a neighbourhood relation. It reduces the goal by [[AffineConstructive.topology.topology.base.nbrhood_proper_le_aimpl]] to x = y and U ⊆ V, and the rewriting system then discharges those two goals. With it, an inclusion A ⊆ B can rewrite A to B, or B to A, wherever A or B sits in the subset position of ⪽, even inside an image or another subset construction.\n\nThe tactic fires only when one of the two subsets carries the marker the rewriting system puts on the side of an order relation it is rewriting by. A rewrite by an equality therefore never reaches this tactic, and never starts a search for a [[AffineConstructive.topology.interfaces.topology.Topology]] structure that an equality rewrite does not need. The tactic is registered as a hint for properness goals. Proofs never call it by name; `rew` reaches it whenever it rewrites by an inclusion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.base.Continuous_proper_impl","base":"Continuous_proper_impl","kind":"prf","start":25,"body":[26,29],"status":"ok","short":{"text":"Continuity passes from a map to any map equal to it","status":"ok"},"proof":[{"text":"Assume f = g and that f is continuous. The two topologies carry over unchanged, so what remains is the continuity condition for g: whenever g x ⪽ N, also x ⪽ g* N.","status":"ok","from":0,"to":1},{"text":"The equality f = g replaces g by f, both at the point and in the preimage. The condition then becomes the continuity of f, which is the hypothesis.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.topology.base.Continuous_fun","base":"Continuous_fun","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"Continuity, as a predicate on maps X ⇾ Y that respects their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.topology.Continuous]] packaged as a function from the set of maps X ⇾ Y, taken with its affirmed equality, to strict propositions. It is built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.topology.topology.base.Continuous_proper_impl]], which says that a map equal to a continuous map is continuous.\n\nDeclared canonical, it lets an equality of maps f = g be rewritten inside a statement that f is continuous, in the same way as any other function of sets; it serves no other purpose.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.base.ContinuouslyReflecting_proper_impl","base":"ContinuouslyReflecting_proper_impl","kind":"prf","start":31,"body":[32,36],"status":"ok","short":{"text":"A map equal to a neighbourhood-reflecting map reflects neighbourhoods","status":"ok"},"proof":[{"text":"Assume f = g and that f reflects neighbourhoods. That hypothesis provides topologies on X and Y, which settle the corresponding fields for g, and the reflection property of f. What remains is the reflection property for g.","status":"ok","from":0,"to":1},{"text":"Unfolded, the goal asks that for each x and each neighbourhood U of x, the universal image ∀.[g] U is a neighbourhood of g x. Rewriting by the equality f = g replaces g by f at g x and in the universal image. The result is the reflection property of f, which is already in hand.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.topology.base.ContinuouslyReflecting_fun","base":"ContinuouslyReflecting_fun","kind":"def","start":37,"body":null,"status":"ok","short":{"text":"Reflecting neighbourhoods, as a predicate on maps X ⇾ Y that respects their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.topology.ContinuouslyReflecting]] packaged as a function from the set of maps X ⇾ Y, taken with its affirmed equality, to strict propositions, built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.topology.topology.base.ContinuouslyReflecting_proper_impl]].\n\nDeclared canonical, it lets an equality of maps be rewritten inside a statement that a map reflects neighbourhoods.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.base.ContinuouslyInitial_proper_impl","base":"ContinuouslyInitial_proper_impl","kind":"prf","start":38,"body":[39,41],"status":"ok","short":{"text":"A map equal to an initial map is initial","status":"ok"},"proof":[{"text":"Assume f = g and that f is initial, that is, both continuous and continuously reflecting. Each of the two properties passes from f to g by rewriting with the equality f = g.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.ContinuouslyInitial_fun","base":"ContinuouslyInitial_fun","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"Being initial, as a predicate on maps X ⇾ Y that respects their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.topology.ContinuouslyInitial]], continuous and reflecting at once, packaged as a function from the set of maps X ⇾ Y, taken with its affirmed equality, to strict propositions, built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.topology.topology.base.ContinuouslyInitial_proper_impl]].\n\nDeclared canonical, it lets an equality of maps be rewritten inside a statement that a map is initial.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.base.ContinuouslyEmbedding_proper_impl","base":"ContinuouslyEmbedding_proper_impl","kind":"prf","start":43,"body":[44,46],"status":"ok","short":{"text":"A map equal to a topological embedding is an embedding","status":"ok"},"proof":[{"text":"Assume f = g and that f is an embedding, that is, initial and injective. Each of the two properties passes from f to g by rewriting with the equality f = g.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.ContinuouslyEmbedding_fun","base":"ContinuouslyEmbedding_fun","kind":"def","start":47,"body":null,"status":"ok","short":{"text":"Being an embedding, as a predicate on maps X ⇾ Y that respects their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.topology.ContinuouslyEmbedding]], initial and injective, packaged as a function from the set of maps X ⇾ Y, taken with its affirmed equality, to strict propositions, built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.topology.topology.base.ContinuouslyEmbedding_proper_impl]].\n\nDeclared canonical, it lets an equality of maps be rewritten inside a statement that a map is an embedding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.base.Dense_proper_impl","base":"Dense_proper_impl","kind":"prf","start":48,"body":[49,51],"status":"ok","short":{"text":"A map equal to a dense map is dense","status":"ok"},"proof":[{"text":"Assume f = g, here pointwise equality of maps from A into Y, and that f is dense. The topology on Y carries over, and the density condition for g becomes the condition for f once f = g is used to rewrite g into f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.Dense_fun","base":"Dense_fun","kind":"def","start":52,"body":null,"status":"ok","short":{"text":"Density, as a predicate on maps A → Y that respects their equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.topology.Dense]] packaged as a function from the maps A → Y into a space, taken with their affirmed equality, to strict propositions, built by [[AffineConstructive.theory.set.make_weak_spred]] from [[AffineConstructive.topology.topology.base.Dense_proper_impl]]. The domain A is a bare type, not a set, since density concerns only the range.\n\nDeclared canonical, it lets an equality of maps be rewritten inside a statement that a map is dense.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.base.id_emb","base":"id_emb","kind":"prf","start":53,"body":[54,62],"status":"ok","short":{"text":"The identity of a topological space is a topological embedding","status":"ok"},"proof":[{"text":"A topological embedding is an injective map that is both continuous and reflecting. Resolution finds that the identity is injective, since it is a bijection. Continuity and reflection remain to be shown.","status":"ok","from":0,"to":1},{"text":"Continuity: fix x and N. The identity sends x to x, and the preimage of N under the identity is N itself, so the goal is x ⪽ N implies x ⪽ N.","status":"ok","from":2,"to":4},{"text":"Reflection: fix x and N. The universal image of N under the identity is N ([[AffineConstructive.orders.subset_images.universal_image_id_alt]]), so here too the goal reduces to x ⪽ N implies itself.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.topology.base.compose_cont","base":"compose_cont","kind":"prf","start":67,"body":[68,74],"status":"ok","short":{"text":"The composite of continuous maps is continuous","status":"ok"},"proof":[{"text":"The topologies are given. Fix x and N, and write the composite out: it remains to show that g (f x) ⪽ N implies x ⪽ f* (g* N), since the preimage under g ∘ f is the preimage under f of the preimage under g.","status":"ok","from":0,"to":3},{"text":"Continuity of g at f x turns the hypothesis into f x ⪽ g* N, and continuity of f at x then gives x ⪽ f* (g* N).","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.topology.base.compose_cont_reflect","base":"compose_cont_reflect","kind":"prf","start":76,"body":[77,83],"status":"ok","short":{"text":"The composite of neighbourhood-reflecting maps reflects neighbourhoods","status":"ok"},"proof":[{"text":"Fix x and a subset U. The goal asks that a neighbourhood U of x make the universal image of U under g ∘ f a neighbourhood of (g ∘ f) x.","status":"ok","from":0,"to":1},{"text":"The universal image under g ∘ f is the universal image under g of the universal image under f ([[AffineConstructive.orders.subset_images.universal_image_compose_alt]]). The point (g ∘ f) x is g (f x).","status":"ok","from":2,"to":3},{"text":"Since g reflects neighbourhoods, applying it at the point f x to the subset ∀.[f] U reduces the goal to f x ⪽ ∀.[f] U. That is the reflection property of f at x and U ([[AffineConstructive.topology.interfaces.topology.cont_reflection]]).","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.topology.base.compose_cont_reflecting","base":"compose_cont_reflecting","kind":"prf","start":85,"body":[86,88],"status":"ok","short":{"text":"The composite of continuously reflecting maps is continuously reflecting","status":"ok"},"proof":[{"text":"The topologies are given, and the composite reflects neighbourhoods by [[AffineConstructive.topology.topology.base.compose_cont_reflect]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.compose_cont_initial","base":"compose_cont_initial","kind":"prf","start":90,"body":[91,93],"status":"ok","short":{"text":"The composite of initial maps is initial","status":"ok"},"proof":[{"text":"An initial map is continuous and continuously reflecting. The composite is continuous by [[AffineConstructive.topology.topology.base.compose_cont]] and continuously reflecting by [[AffineConstructive.topology.topology.base.compose_cont_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.compose_cont_embedding","base":"compose_cont_embedding","kind":"prf","start":95,"body":[96,98],"status":"ok","short":{"text":"The composite of topological embeddings is an embedding","status":"ok"},"proof":[{"text":"An embedding is an initial map that is injective, and both properties pass to composites: [[AffineConstructive.topology.topology.base.compose_cont_initial]] for initiality and [[AffineConstructive.theory.set.compose_injective]] for injectivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.Dense_alt","base":"Dense_alt","kind":"prf","start":100,"body":[101,103],"status":"ok","short":{"text":"A map is dense if and only if its range is a dense subset","status":"ok"},"proof":[{"text":"A dense map is one whose range is a dense subset, so each direction unpacks one statement into the other.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.Hausdorff_T₀","base":"Hausdorff_T₀","kind":"prf","start":104,"body":[105,115],"status":"ok","short":{"text":"A Hausdorff space is T₀","status":"ok"},"proof":[{"text":"Assume X is Hausdorff and fix points x and y that have the same neighbourhoods. By [[AffineConstructive.topology.interfaces.topology.hausdorff]], to conclude x = y it suffices to show that every neighbourhood of x meets every neighbourhood of y.","status":"ok","from":0,"to":2},{"text":"Fix U and V, with U a neighbourhood of x and V one of y. Take x itself as the common point, so it remains to show x ∊ U and x ∊ V.","status":"ok","from":3,"to":5},{"text":"Specialise the hypothesis that x and y have the same neighbourhoods at V. Then combine it with the hypothesis that x ⪽ U and y ⪽ V.","status":"ok","from":6,"to":7},{"text":"A neighbourhood of a point contains the point, so it suffices to show that U and V are neighbourhoods of x. The first is given. For the second, y ⪽ V together with the equivalence at V gives x ⪽ V, and each hypothesis is used once.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.topology.topology.base.hausdorff_iff","base":"hausdorff_iff","kind":"prf","start":116,"body":[117,128],"status":"ok","short":{"text":"In a Hausdorff space, x = y if and only if every neighbourhood of x meets every neighbourhood of y","status":"ok"},"proof":[{"text":"Prove the two implications separately. That x = y follows when all neighbourhoods of x meet all neighbourhoods of y is the Hausdorff axiom [[AffineConstructive.topology.interfaces.topology.hausdorff]].","status":"ok","from":0,"to":3},{"text":"For the converse, assume x = y and fix a neighbourhood U of x and a neighbourhood V of y. Take y as the common point.","status":"ok","from":4,"to":6},{"text":"A neighbourhood contains its point, so U contains x and V contains y. It remains to move x ∊ U to y ∊ U along the equality x = y, which is [[AffineConstructive.interfaces.subset.equal_element]]. After that the factors match.","status":"ok","from":7,"to":11}]},{"name":"AffineConstructive.topology.topology.base.cont_refl_injective","base":"cont_refl_injective","kind":"prf","start":129,"body":[130,148],"status":"ok","short":{"text":"A neighbourhood-reflecting map out of a T₀ space is injective","status":"ok"},"proof":[{"text":"Fix x and y. Since X is T₀, two points with the same neighbourhoods are equal ([[AffineConstructive.topology.interfaces.topology.separation_T₀]]). It therefore suffices to show that f x = f y implies, for every U, that U is a neighbourhood of x if and only if it is a neighbourhood of y.","status":"ok","from":0,"to":2},{"text":"The proof first reduces to a one-directional claim, stated for all points: for any x, y and U, f x = f y implies that x ⪽ U implies y ⪽ U.","status":"ok","from":3,"to":3},{"text":"Assuming the claim, fix U. The biconditional is an additive conjunction of two implications, so each is proved separately from f x = f y. The forward direction is the claim. The backward direction is the claim with the points exchanged, after turning f x = f y into f y = f x by symmetry.","status":"ok","from":4,"to":8},{"text":"It remains to prove the claim for arbitrary x, y and U.","status":"ok","from":9,"to":10},{"text":"A neighbourhood U of x makes the set of points of which U is a neighbourhood, {z | z ⪽ U}, a neighbourhood of x. Because f reflects neighbourhoods ([[AffineConstructive.topology.interfaces.topology.cont_reflection]]), the universal image of that set under f is a neighbourhood of f x. The hypothesis x ⪽ U is used up in this step.","status":"ok","from":11,"to":11},{"text":"The equality f x = f y, passed through the function on Y that sends a to the proposition a ⪽ ∀.[f]{z | z ⪽ U}, gives that f x and f y are equally neighbourhoods of this universal image.","status":"ok","from":12,"to":13},{"text":"The equivalence, used from left to right on the neighbourhood of f x, gives a neighbourhood of f y. So it suffices to show that ∀.[f]{z | z ⪽ U} being a neighbourhood of f y implies y ⪽ U.","status":"ok","from":14,"to":14},{"text":"A neighbourhood contains its point, so f y belongs to ∀.[f]{z | z ⪽ U}. Equivalently, y belongs to the preimage under f of that universal image. That preimage is contained in {z | z ⪽ U} ([[AffineConstructive.orders.subset_images.universal_image_counit]]), so y ⪽ U.","status":"ok","from":15,"to":18}]},{"name":"AffineConstructive.topology.topology.base.cont_initial_embedding","base":"cont_initial_embedding","kind":"prf","start":149,"body":[150,153],"status":"ok","short":{"text":"An initial map out of a T₀ space is a topological embedding","status":"ok"},"proof":[{"text":"A topological embedding is an initial map that is injective. Initiality is the hypothesis, so only injectivity remains.","status":"ok","from":0,"to":1},{"text":"An initial map is in particular reflecting, and a reflecting map out of a T₀ space is injective ([[AffineConstructive.topology.topology.base.cont_refl_injective]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.topology.base.cont_hausdorff_meet","base":"cont_hausdorff_meet","kind":"prf","start":154,"body":[155,163],"status":"ok","short":{"text":"A continuous map into a Hausdorff space identifies points whose neighbourhoods all meet","status":"ok"},"proof":[{"text":"Since Y is Hausdorff, [[AffineConstructive.topology.topology.base.hausdorff_iff]] reduces f x = f y to showing that every neighbourhood of f x meets every neighbourhood of f y. Fix such neighbourhoods U and V in Y.","status":"ok","from":0,"to":2},{"text":"By continuity, the preimages f* U and f* V are neighbourhoods of x and y. Specialise the hypothesis at these preimages, which gives a point lying in both.","status":"ok","from":3,"to":4},{"text":"It remains to show that a common point of f* U and f* V yields a common point of U and V. Take such a point z of X. Its image f z is the witness.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.topology.base.reflects_hausdorff","base":"reflects_hausdorff","kind":"prf","start":165,"body":[166,170],"status":"ok","short":{"text":"A space with a continuous injection into a Hausdorff space is Hausdorff","status":"ok"},"proof":[{"text":"Fix x and y whose neighbourhoods all meet. Since f is injective, x = y is equivalent to f x = f y ([[AffineConstructive.theory.set.injective_iff]]), and [[AffineConstructive.topology.topology.base.cont_hausdorff_meet]] gives f x = f y for a continuous map into a Hausdorff space.","status":"ok","from":0,"to":4}]},{"name":"AffineConstructive.topology.topology.base.empty_topology","base":"empty_topology","kind":"inst","start":175,"body":[176,178],"status":"ok","short":{"text":"Any neighbourhood relation on the empty set is a topology","status":"ok"},"proof":[{"text":"Every axiom of a topology quantifies over points of the empty set, so each holds vacuously.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.from_empty_cont","base":"from_empty_cont","kind":"prf","start":179,"body":[180,183],"status":"ok","short":{"text":"The map from the empty space into any topological space is continuous","status":"ok"},"proof":[{"text":"The requirements that domain and codomain be topologies are met by [[AffineConstructive.topology.topology.base.empty_topology]] and the hypothesis on X. What remains is the continuity condition at each point of the domain.","status":"ok","from":0,"to":1},{"text":"The empty set has no points, so this condition holds vacuously.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.topology.base.element_discrete","base":"element_discrete","kind":"prf","start":187,"body":[188,190],"status":"ok","short":{"text":"Membership is a discrete neighbourhood relation","status":"ok"},"proof":[{"text":"Discreteness asks that the neighbourhood relation be membership. Here it is membership by definition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.const_nbrhood","base":"const_nbrhood","kind":"prf","start":192,"body":[193,202],"status":"ok","short":{"text":"The subset defined by a fixed proposition P is a neighbourhood of a point if and only if P","status":"ok"},"proof":[{"text":"The equivalence splits into its two implications.","status":"ok","from":0,"to":1},{"text":"A neighbourhood of x contains x. So x belongs to the subset defined by P, and that membership is P itself.","status":"ok","from":2,"to":3},{"text":"For the converse, isotony reduces the goal to showing that the full subset ⊤ is a neighbourhood of x and that ⊤ is contained in the subset defined by P. The full subset is a neighbourhood of every point, so that factor drops out, and only the inclusion is left to prove from P.","status":"ok","from":4,"to":6},{"text":"Unfolded, the inclusion says that for every point, truth implies P. Given P, this holds by the laws of the connectives alone.","status":"ok","from":7,"to":9}]},{"name":"AffineConstructive.topology.topology.base.discrete_topology","base":"discrete_topology","kind":"inst","start":206,"body":[207,222],"status":"ok","short":{"text":"A discrete neighbourhood relation, U a neighbourhood of x when x ∊ U, is a topology","status":"ok"},"proof":[{"text":"There are five topology axioms to check. In a discrete structure being a neighbourhood is the same as membership ([[AffineConstructive.topology.interfaces.topology.is_discrete_nbrhood]]), so each axiom becomes a statement about membership.","status":"ok","from":0,"to":1},{"text":"The first axiom, that a neighbourhood contains its point, becomes x ∊ U implies x ∊ U.","status":"ok","from":2,"to":3},{"text":"Isotony: fix x, U and V. Membership passes along the inclusion U ⊆ V ([[AffineConstructive.interfaces.subset.subset_apply]]).","status":"ok","from":4,"to":6},{"text":"Every point belongs to the full subset.","status":"ok","from":7,"to":8},{"text":"A point that belongs to both U and V belongs to their meet, by the definition of the meet.","status":"ok","from":9,"to":10},{"text":"For the last axiom, fix x and U. Here x must belong to the set of points of which U is a neighbourhood, which means that U is a neighbourhood of x. In the discrete structure that is x ∊ U again, which is the hypothesis.","status":"ok","from":11,"to":15}]},{"name":"AffineConstructive.topology.topology.base.discrete_cont","base":"discrete_cont","kind":"prf","start":223,"body":[224,230],"status":"ok","short":{"text":"Every map out of a discrete space into a topological space is continuous","status":"ok"},"proof":[{"text":"The domain and codomain are topological spaces, the domain by [[AffineConstructive.topology.topology.base.discrete_topology]]. What is left of continuity is the neighbourhood condition: if N is a neighbourhood of f x, then f* N is a neighbourhood of x.","status":"ok","from":0,"to":1},{"text":"Fix x and N. In the discrete domain, being a neighbourhood of x means containing x, so the goal is f x ∊ N.","status":"ok","from":2,"to":4},{"text":"This holds because a neighbourhood of f x contains f x.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.topology.topology.base.indiscrete_nbrhood_correct","base":"indiscrete_nbrhood_correct","kind":"prf","start":232,"body":[233,235],"status":"ok","short":{"text":"The indiscrete neighbourhood relation is indiscrete","status":"ok"},"proof":[{"text":"Indiscreteness asks that the relation be the indiscrete neighbourhood relation, and here it is that relation by definition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.base.indiscrete_topology","base":"indiscrete_topology","kind":"inst","start":240,"body":[241,257],"status":"ok","short":{"text":"An indiscrete neighbourhood relation, only full subsets as neighbourhoods, is a topology","status":"ok"},"proof":[{"text":"There are five topology axioms to check. In an indiscrete structure the neighbourhood relation is the indiscrete one ([[AffineConstructive.topology.interfaces.topology.is_indiscrete_nbrhood]]): U is a neighbourhood of a point exactly when U is full, that is, when every point belongs to U.","status":"ok","from":0,"to":1},{"text":"A full subset contains x.","status":"ok","from":2,"to":3},{"text":"If U is full and U ⊆ V, then V is full.","status":"ok","from":4,"to":5},{"text":"The full subset is full.","status":"ok","from":6,"to":7},{"text":"If U and V are both full, then so is their meet.","status":"ok","from":8,"to":9},{"text":"For the last axiom, fix x and U. The set of points of which U is a neighbourhood must be full. That means U must be a neighbourhood of every point, so fix a point z.","status":"ok","from":10,"to":13},{"text":"At z, being a neighbourhood is again the fullness of U, which does not depend on the point. The hypothesis is therefore exactly what is needed.","status":"ok","from":14,"to":16}]},{"name":"AffineConstructive.topology.topology.base.indiscrete_cont","base":"indiscrete_cont","kind":"prf","start":258,"body":[259,268],"status":"ok","short":{"text":"Every map from a topological space into an indiscrete space is continuous","status":"ok"},"proof":[{"text":"The codomain is a topological space by [[AffineConstructive.topology.topology.base.indiscrete_topology]]. What is left of continuity is the neighbourhood condition: if N is a neighbourhood of f x, then f* N is a neighbourhood of x.","status":"ok","from":0,"to":1},{"text":"Fix x and N. In the indiscrete codomain, N being a neighbourhood of f x means that N is full.","status":"ok","from":2,"to":3},{"text":"By isotony it suffices that the full subset ⊤ is a neighbourhood of x and that ⊤ ⊆ f* N. The first holds at every point, so only the inclusion remains.","status":"ok","from":4,"to":5},{"text":"The inclusion asks, for each w, that w ∊ ⊤ imply w ∊ f* N. Fix w and specialise the fullness of N at f w. Then f w ∊ N is w ∊ f* N, and w ∊ ⊤ is truth.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.topology.topology.base.to_unit_cont","base":"to_unit_cont","kind":"prf","start":276,"body":[277,284],"status":"ok","short":{"text":"The map from a topological space to the discrete one-point space is continuous","status":"ok"},"proof":[{"text":"The one-point space is topological by [[AffineConstructive.topology.topology.base.discrete_topology]]. What is left of continuity is the neighbourhood condition.","status":"ok","from":0,"to":1},{"text":"In the discrete one-point space, being a neighbourhood is membership. Fix x and N; the hypothesis becomes that the image of x belongs to N.","status":"ok","from":2,"to":3},{"text":"The image of x is the single point tt. So the preimage of N is the subset of X defined by the fixed proposition tt ∊ N.","status":"ok","from":4,"to":5},{"text":"By [[AffineConstructive.topology.topology.base.const_nbrhood]], such a subset is a neighbourhood of x exactly when the proposition holds, and that proposition is the hypothesis.","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.topology.topology.base.const_cont","base":"const_cont","kind":"prf","start":287,"body":[288,294],"status":"ok","short":{"text":"A constant map between topological spaces is continuous","status":"ok"},"proof":[{"text":"Of continuity only the neighbourhood condition is left to prove.","status":"ok","from":0,"to":1},{"text":"Fix x and N. The constant map sends x to y, so the hypothesis is that N is a neighbourhood of y. The preimage of N is the subset of X defined by the fixed proposition y ∊ N.","status":"ok","from":2,"to":3},{"text":"By [[AffineConstructive.topology.topology.base.const_nbrhood]], that subset is a neighbourhood of x exactly when y ∊ N.","status":"ok","from":4,"to":4},{"text":"A neighbourhood of y contains y.","status":"ok","from":5,"to":6}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions, products, sums and the classes of equality","summary":"The file sets up the basic objects of the development. An affine set ([[set]]) is a type with an equality valued in affine propositions that is an equivalence. Functions X ⇾ Y ([[func_set]]) are maps that preserve equality, x₁ = x₂ implies f x₁ = f x₂, and two functions are equal when they agree at every point. The file defines the cartesian product X × Y, whose equality is the additive conjunction of the two component equalities, and the tensor product X ⊗ Y, whose equality is their tensor. It also defines the sum, the empty set 𝟎, the one-point set 𝟏, the identity, and composition. Composition is a function on the tensor (Y ⇾ Z) ⊗ (X ⇾ Y) ([[scompose_fun]]), because the equalities of g₁ with g₂ and of f₁ with f₂ are each used once. Alongside these are the classes of strong, decidable, affirmative and refutative equality, which classify sets by the kind of their equality, and the vocabulary of casts, coercions, inverses, injections, surjections and bijections. theory/set.v proves the properties of these definitions."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Interfaces for preorders, posets, order maps, lattice orders, up-sets, filters and ideals","summary":"This file sets up the interfaces for ordered sets. A [[PreOrder]] is a reflexive, transitive order. A [[WeakPoset]] adds that equality implies ≤ and that x ≤ y ⊠ y ≤ x implies x = y (pseudo-antisymmetry). A [[Poset]] asks for the same conclusion from the additive x ≤ y ∧ y ≤ x. In a weak poset the order respects equality, so ≤ and < are functions from P ⊗ P to Ω ([[le_is_fun]], [[lt_is_fun]]). A poset can be decorated as strong, decidable, affirmative, refutative, total or linear, and a correct three-way comparison ([[IsTrich]]) gives a linear order. The file then defines order-preserving, order-reflecting and order-embedding maps, with their order-reversing variants. It also defines directed sets, meet, join and bounded semilattice and lattice orders, up-sets and down-sets, directed subsets, filters and ideals, and the presentation of a filter or ideal by a family of generators. Each dual notion is the direct notion at the opposite order [[order_op]], with accessors that restate its fields at the direct order. The files under orders/ build on these interfaces."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets of an affine set: membership, inclusion, operations, relations, images, subsets as sets","summary":"The file sets up the subsets of an affine set. A subset U : 𝒫 X is an affine predicate on X, and membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω. Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V; [[equal_element]] says that membership respects equality, and [[subset_apply]] applies an inclusion to a member. The file builds the empty and full subsets, singletons, and the additive meet, join and complement. It also builds the multiplicative intersection and union, the tensor and cartesian pairings U ⊗ V and U × V, the relations on X ⊗ Y (identity, composite R ⋄ S, inverse), and preimage f*, image f⁎, range and universal image. Each subset U is a set in its own right (an element of U is a point of X with a proof that it lies in U, equal when the points are equal), and [[from_subset]] is the injective inclusion of U into X. On top of this come [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]], with [[corestrict]] and [[restrict]] for functions between subsets. The last part treats sets of subsets 𝒫² X, whose elements are themselves subsets of X.\",\"short\":\"Subsets of an affine set: membership, inclusion, operations, images, and subsets as sets\"}]"},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Neighbourhood topologies, their separation axioms, and continuous, reflecting and product structures","summary":"This file sets out the interface for topology through neighbourhoods. A neighbourhood relation x ⪽ U is an affine relation between points and subsets, and [[Topology]] imposes the axioms of reflexivity, isotony, the full subset as a neighbourhood, closure under binary meets, and transitivity. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the separation conditions T₀ and Hausdorff. It then introduces the classes of maps: continuous, neighbourhood-reflecting, initial (both at once), embeddings and dense maps, together with discrete and indiscrete neighbourhood relations. It also gives two product structures: the tensor product topology on X ⊗ Y, described by a basis, and the cartesian product topology on X × Y, described by the universal property of its projections. The theory of these notions is developed in the files under topology/topology/, and uniform and bornological spaces build on them."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Sets and functions: Ω and SProp as sets, the ! comonad, products, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. It makes the affine propositions Ω into a set with ⧟ as equality, and the base-logic propositions SProp into a set with ↔ as equality. It then shows that every connective and both affine quantifiers are functions on Ω. Equality itself, [[eq_fun]], is a function X ⊗ X ⇾ Ω. The file defines the comonad ! on sets, [[of_course_set]], which keeps only the affirmative part of an equality, with its counit, its action on maps and its comparisons with the tensor and the cartesian product. [[make_weak_fun]] and [[make_weak_spred]] build maps out of !X from base-logic congruences. The file also covers the structure of the two products: the projections, [[tensor_to_prod]], swaps, associators, unitors, the pairing [[to_prod]], the diagonals, [[curry]] and [[uncurry]], evaluation, and the functorial actions [[tensor_map_fun]] and [[prod_map]]. It ends with injective, surjective and bijective maps, which are closed under composition and cancellation, the initial set 𝟎 and terminal set 𝟏, and copairing out of a disjoint union with [[from_sum]]. The rest of the development rests on this file: the rewriting system finds the congruence hints declared here, and later files use its maps and its ! on sets."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets and relations: adjunctions, functoriality, composition laws","summary":"The file develops the three operations a function f : X ⇾ Y induces on subsets: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ U ⊆ V ⧟ U ⊆ f* V ([[image_preimage_adj]]) and f* V ⊆ U ⧟ V ⊆ ∀.[f] U ([[preimage_universal_image_adj]]), each with its unit and counit. The file shows which lattice operations each one preserves, that each is functorial in f, and that the projection laws hold only laxly. For relations, it shows how images and preimages under tensor maps interact with the converse and with relational composition ⋄. The main results there are the pin laws, which move a map across ⋄, and the exact two-sided law [[image_compose_middle]] together with its universal-image counterpart. It closes with what injectivity, surjectivity and bijectivity of f give for these operations, and with the cylinders: preimages under the projections of a tensor product. The file builds on the relation algebra of orders/subset_relations and is used by the uniform and bornological files."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

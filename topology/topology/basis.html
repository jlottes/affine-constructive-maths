d_basis_open i p) |].\n    rew (NB _ _), <-aex_adj; intros j. apply subset_apply.\n  Qed.\n  \n  Lemma neighborhood_basis_isotony (x:X) (U V : 𝒫 X) : x ⪽ U ⊠ U ⊆ V ⊸ x ⪽ V.\n  Proof. rew (NB _ U), aex_frob_r, <-aex_adj; intros i.\n    rew (NB x V), <-(aex_ub _ i).\n    now rew (aprod_assoc _ _ _), (transitivity le _ _ _).\n  Qed.\nEnd neighborhood_basis_basics.\n\n\n(** Continuity by neighborhood basis at the codomain.\n\n    To prove [f : X ⇾ Y] is continuous, it suffices to exhibit, for each\n    [x] and each basic neighborhood [β j] of [f x], that the preimage of\n    [β j] is a neighborhood of [x] — phrased as the affine implication so\n    it carries both polarities. *)\n\nLemma cont_by_basis_codom@{u}\n  `{@Topology@{u} X NX, @Topology@{u} Y NY}\n  {Λ:Type@{u}} {β:Λ → 𝒫 Y}\n  {NB:NeighborhoodBasis β}\n  (f:X ⇾ Y) :\n  (∀ x j, f x ∊ β j ⊸ x ⪽ f* (β j)) → Continuous f.\nProof. intros P. split; try exact _. intros x N.\n  rew (NB (f x) N), <-aex_adj; intros j.\n  rew <-(top_isotony x (f* (β j)) _).\n  now rew [<-(P _ _)|<-(order_preserving f* _ _)].\nQed.\n\n(** Continuity by neighborhood basis at the domain.\n\n    Dual to [cont_by_basis_codom]: with a basis [β] at the domain [X],\n    it suffices that every neighborhood [N] of [f x] be refined by the\n    preimage of some basic neighborhood [β i] of [x]. *)\n\nLemma cont_by_basis_dom@{u}\n  `{@Topology@{u} X NX, @Topology@{u} Y NY}\n  {Λ:Type@{u}} {β:Λ → 𝒫 X}\n  {NB:NeighborhoodBasis β}\n  (f:X ⇾ Y) :\n  (∀ x N, f x ⪽ N ⊸ ∐ i, x ∊ β i ⊠ β i ⊆ f* N) → Continuous f.\nProof. intros P. split; try exact _. intros x N.\n  trans (∐ i, x ∊ β i ⊠ β i ⊆ f* N).\n  + exact (P x N).\n  + rew <-aex_adj. exact (neighborhood_basis_use x (f* N)).\nQed.\n\nLemma cont_by_basis@{u}\n  `{@Topology@{u} X NX, @Topology@{u} Y NY}\n  {Λ₁:Type@{u}} {α:Λ₁ → 𝒫 X} {NBX:NeighborhoodBasis α}\n  {Λ₂:Type@{u}} {β:Λ₂ → 𝒫 Y} {NBY:NeighborhoodBasis β}\n  (f:X ⇾ Y) :\n  (∀ x j, f x ∊ β j ⊸ ∐ i, x ∊ α i ⊠ α i ⊆ f* (β j)) → Continuous f.\nProof. intros P. apply cont_by_basis_dom. intros x N.\n  rew (NBY (f x) N). rew <-aex_adj; intros j.\n  rew (P x j), aex_frob_r, <-aex_adj; intros i. rew <-(aex_ub _ i).\n  rew (aprod_assoc _ _ _); apply aprod_proper_aimpl; [ easy |].\n  rew (order_preserving f* (β j) N). now apply transitivity.\nQed.\n\n(** Continuous reflection by neighborhood basis at the codomain.\n\n    To prove [f : X ⇾ Y] continuously reflects neighborhoods, it suffices\n    to produce the reflecting neighborhood of [f x] as a basic one [β j]. *)\n\nLemma refl_by_basis_codom@{u}\n  `{@Topology@{u} X NX, @Topology@{u} Y NY}\n  {Λ:Type@{u}} {β:Λ → 𝒫 Y}\n  {NB:NeighborhoodBasis β}\n  (f:X ⇾ Y) :\n  (∀ x U, x ⪽ U ⊸ ∐ j, f x ∊ β j ⊠ f* (β j) ⊆ U) → ContinuouslyReflecting f.\nProof. intros P. split; try exact _. intros x U.\n  trans (∐ j, f x ∊ β j ⊠ f* (β j) ⊆ U).\n  + exact (P x U).\n  + rew <-aex_adj; intros j. rew <-(aex_ub _ (β j)).\n    now rew (neighborhood_basis_open_iff j (f x)).\nQed.\n\n(** Continuous reflection by neighborhood basis at the domain.\n\n    Dual to [refl_by_basis_codom]: with a basis [β] at the domain [X],\n    it suffices to reflect the basic neighborhoods [β i] of [x]. *)\n\nLemma refl_by_basis_dom@{u}\n  `{@Topology@{u} X NX, @Topology@{u} Y NY}\n  {Λ:Type@{u}} {β:Λ → 𝒫 X}\n  {NB:NeighborhoodBasis β}\n  (f:X ⇾ Y) :\n  (∀ x i, x ∊ β i ⊸ ∐ V, f x ⪽ V ⊠ f* V ⊆ β i) → ContinuouslyReflecting f.\nProof. intros P. split; try exact _. intros x U.\n  rew (NB x U). rew <-aex_adj; intros i.\n  rew (P x i), aex_frob_r, <-aex_adj; intros V. rew <-(aex_ub _ V).\n  rew (aprod_assoc _ _ _); apply aprod_proper_aimpl; [ easy |].\n  now apply transitivity.\nQed.\n\nLemma refl_by_basis@{u}\n  `{@Topology@{u} X NX, @Topology@{u} Y NY}\n  {Λ₁:Type@{u}} {α:Λ₁ → 𝒫 X} {NBX:NeighborhoodBasis α}\n  {Λ₂:Type@{u}} {β:Λ₂ → 𝒫 Y} {NBY:NeighborhoodBasis β}\n  (f:X ⇾ Y) :\n  (∀ x i, x ∊ α i ⊸ ∐ j, f x ∊ β j ⊠ f* (β j) ⊆ α i) → ContinuouslyReflecting f.\nProof. intros P. apply refl_by_basis_dom. intros x i.\n  rew (P x i). rew <-aex_adj; intros j. rew <-(aex_ub _ (β j)).\n  now rew (neighborhood_basis_open_iff j (f x)).\nQed.\n\n(** Both criteria together give initiality: the topology on [X] is exactly\n    the one induced by [f], as witnessed basis-to-basis. *)\n\nLemma initial_by_basis@{u}\n  `{@Topology@{u} X NX, @Topology@{u} Y NY}\n  {Λ₁:Type@{u}} {α:Λ₁ → 𝒫 X} {NBX:NeighborhoodBasis α}\n  {Λ₂:Type@{u}} {β:Λ₂ → 𝒫 Y} {NBY:NeighborhoodBasis β}\n  (f:X ⇾ Y) :\n  (∀ x j, f x ∊ β j ⊸ ∐ i, x ∊ α i ⊠ α i ⊆ f* (β j))\n→ (∀ x i, x ∊ α i ⊸ ∐ j, f x ∊ β j ⊠ f* (β j) ⊆ α i)\n→ ContinuouslyInitial f.\nProof. intros P Q. split.\n+ exact (cont_by_basis f P).\n+ exact (refl_by_basis f Q).\nQed.\n\n(** Density by neighborhood basis: a subset that meets every inhabited\n    basic neighborhood is dense. *)\n\nLemma dense_by_basis@{u}\n  `{@Topology@{u} X NX}\n  {Λ:Type@{u}} {β:Λ → 𝒫 X}\n  {NB:NeighborhoodBasis β}\n  (U : 𝒫 X) :\n  (∀ x i, x ∊ β i ⊸ ∐ a, a ∊ β i ⊠ a ∊ U) → dense U.\nProof. intros P.\n  change (apos (closure U = ⊤)).\n  rew <-(le_antisym_iff _ _); split; [exact (below_top _) |].\n  change (∏ x:X, 𝐓 ⊸ x ∊ closure U). intros x. simplify.\n  change (apos (anot (x ⪽ complement U))).\n  rew (NB x (complement U)).\n  rew (demorgan_dual _). intros i.\n  apply by_contrapositive.\n  rew (order_preserving_flip complement _ _).\n  change (U ⊆ complement (β i) ⊸ anot (x ∊ β i)).\n  rew <-(aimpl_false _).\n  rew <-(aprod_adj _ _ _).\n  rew (P x i).\n  rew aex_frob_l. rew <-aex_adj; intros a.\n  change ((∏ p:X, p ∊ U ⊸ p ∊̸ β i) ⊠ (a ∊ β i ⊠ a ∊ U) ⊸ 𝐅).\n  rew (all_lb _ a). tautological.\nQed.\n\nLemma Dense_by_basis@{u}\n  {X Y:set@{u}} `{@Topology@{u} Y NY}\n  {Λ:Type@{u}} {β:Λ → 𝒫 Y}\n  {NB:NeighborhoodBasis β}\n  (f : X ⇾ Y) :\n  (∀ y i, y ∊ β i ⊸ ∐ x, f x ∊ β i) → Dense f.\nProof. intros P. split; try exact _. apply dense_by_basis.\n  intros y i. rew (P y i), <-aex_adj. intros x.\n  rew <-(aex_ub _ (f x)). now simplify.\nQed.\n\n\n(** A basis [β] of subsets of [X] generates a canonical neighborhood relation\n    [x ⪽ N := ∐ i, x ∊ β i ⊠ β i ⊆ N], which trivially satisfies [NB] at\n    every point. *)\n\nDefinition basis_neighborhood@{u} {I:Type@{u}} {X:set@{u}} (β:I → 𝒫 X) : Neighborhood@{u} X\n  := set:(λ '(x, N) : X ⊗ 𝒫 X, ∐ i, x ∊ β i ⊠ β i ⊆ N).\n\nLemma basis_neighborhood_prop@{u} {I:Type@{u}} {X:set@{u}} (β:I → 𝒫 X)\n  : NeighborhoodBasis (XN:=basis_neighborhood β) β.\nProof. now intros N. Qed.\n#[global] Hint Extern 2 (NeighborhoodBasis (XN:=basis_neighborhood _) _)\n  => simple notypeclasses refine (basis_neighborhood_prop _) : typeclass_instances.\n\nLemma interior_neighborhood_basis@{u} `{@Topology@{u} X NX} : NeighborhoodBasis (XN:=NX) interior.\nProof. intros x N. split.\n+ rew <-(aex_ub _ N). now rew (aprod_true_r (interior_subset _)).\n+ rew <-aex_adj. intros M.\n  rew <-(idempotent_alt interior M) at 1.\n  exact (top_isotony x (interior M) N).\nQed.\n#[global] Hint Extern 100 (NeighborhoodBasis _) => notypeclasses refine interior_neighborhood_basis : typeclass_instances.\n\n(** Topology from a basis.\n\n    Given a neighborhood relation [⪽] presented by a basis [β : Λ → 𝒫 X]\n    satisfying [NB] (the affine equivalence [x ⪽ N ⧟ ∐ i, x ∊ β i ⊠ β i ⊆ N])\n    plus the three structural axioms [basis_inhabited], [basis_meet],\n    [basis_open], the topology axioms follow.  The reflexivity axiom of\n    the topology is automatic because the basis is a basis of subsets\n    *containing* the point — no separate [basis_refl] hypothesis. *)\n\nSection topology_by_basis.\n  Universes u.\n  Context `{XN:Neighborhood@{u} X} {Λ:Type@{u}} {β:Λ → 𝒫 X}\n          {NB:NeighborhoodBasis β}.\n\n  Context (Hnull : ∀ x, ∐ i, x ∊ β i)\n          (Hbin  : ∀ x i j, x ∊ β i ⊠ x ∊ β j ⊸ ∐ k, x ∊ β k ⊠ β k ⊆ β i ⊓ β j).\n\n  Lemma topology_by_basis: Topology X.\n  Proof. split.\n  + (* refl: x ⪽ U ⊸ x ∊ U *)\n    intros x U. rew (NB x U), <-aex_adj; intros i.\n    exact (subset_apply x (β i) U).\n  + (* isotony *)\n    exact neighborhood_basis_isotony.\n  + (* nullary *)\n    intros x. pose proof (Hnull x) as [i Hi].\n    rew <-(neighborhood_basis_use x (full_subset X) i).\n    simplify. exact (below_top _).\n  + (* binary *)\n    intros x U V. rew (NB x U), aex_frob_r, <-aex_adj; intros i.\n    rew (NB x V), aex_frob_l, <-aex_adj; intros j.\n    rew (NB x (U ⊓ V)).\n    trans ((x ∊ β i ⊠ x ∊ β j) ⊠ (β i ⊆ U ⊠ β j ⊆ V)); [ tautological |].\n    rew (Hbin x i j), aex_frob_r, <-aex_adj; intros k.\n    rew <-(aex_ub _ k).\n    rew (aprod_assoc _ _ _); apply aprod_proper_aimpl; [ easy |].\n    rew (order_preserving (⊓) (β i, β j) (U, V) : β i ⊆ U ⊠ β j ⊆ V ⊸ _).\n    now apply transitivity.\n  + (* trans: x ⪽ U ⊸ x ⪽ {y | y ⪽ U} *)\n    intros x U. rew (NB x U), <-aex_adj; intros i.\n    rew (NB _ _), <-(aex_ub _ i). apply aprod_proper_aimpl; [ easy |]; clear x.\n    change (β i ⊆ U ⊸ ∏ y, y ∊ β i ⊸ y ⪽ U).\n    rew <-all_adj; intros y.\n    rew (neighborhood_basis_open i y).\n    rew <-(neighborhood_basis_isotony y (β i) U); tautological.\n  Qed.\nEnd topology_by_basis.\n\n","sentences":[{"i":0,"s":0,"e":71,"kind":"vernac","status":"ok","ms":36,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":72,"e":126,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":127,"e":153,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":3,"s":154,"e":205,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":4,"s":206,"e":241,"kind":"vernac","status":"ok","ms":14,"messages":[],"goals":null},{"i":5,"s":242,"e":328,"kind":"vernac","status":"ok","ms":24,"messages":[],"goals":null},{"i":6,"s":329,"e":365,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":7,"s":366,"e":413,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":414,"e":451,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":9,"s":453,"e":485,"kind":"vernac","status":"ok","ms": e":10067,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":10103,"e":10106,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":10161,"e":10165,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":10228,"e":10231,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":10257,"e":10260,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":10296,"e":10299,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":10342,"e":10354,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"}],"gloss":{"summary":"The file works with neighbourhood bases: families β of subsets such that N is a neighbourhood of x exactly when some β i containing x lies in N. It derives the basic consequences: each basis element is a neighbourhood of each of its points, and neighbourhoods are closed under enlargement. It reduces continuity, continuous reflection, initiality and density to checks on basis elements, at the domain, at the codomain or at both. It also defines the neighbourhood relation generated by any family, shows that the interiors of a topology form a basis, and proves the topology axioms from a basis that covers every point and refines binary meets of its elements. Later files, such as the topology on a tensor product, build on these results.","short":"Neighbourhood bases: criteria for continuity, reflection, density, and topologies generated by a basis","items":[{"name":"AffineConstructive.topology.topology.basis.neighborhood_basis_find","base":"neighborhood_basis_find","kind":"prf","start":14,"body":[15,17],"status":"ok","short":{"text":"A neighbourhood N of x contains some basis element β i that contains x","status":"ok"},"proof":[{"text":"This is one direction of the defining equivalence of a [[AffineConstructive.topology.interfaces.topology.NeighborhoodBasis]]. Rewriting the neighbourhood x ⪽ N by that equivalence gives the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.basis.neighborhood_basis_use","base":"neighborhood_basis_use","kind":"prf","start":18,"body":[19,21],"status":"ok","short":{"text":"A basis element β i containing x and contained in N makes N a neighbourhood of x","status":"ok"},"proof":[{"text":"Rewrite x ⪽ N by the basis equivalence and take i as the witness of the resulting existential. What remains is the hypothesis itself.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.basis.neighborhood_basis_open","base":"neighborhood_basis_open","kind":"prf","start":22,"body":[23,27],"status":"ok","short":{"text":"Each basis element β i is a neighbourhood of each of its points","status":"ok"},"proof":[{"text":"Fix a point p.","status":"ok","from":0,"to":1},{"text":"Express p ⪽ β i through the basis and take i itself as the witness. The goal is now p ∊ β i together with the inclusion β i ⊆ β i.","status":"ok","from":2,"to":2},{"text":"The inclusion β i ⊆ β i holds by reflexivity, so that factor is truth and the goal reduces to the hypothesis p ∊ β i.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.topology.basis.neighborhood_basis_open_alt","base":"neighborhood_basis_open_alt","kind":"prf","start":28,"body":[29,31],"status":"ok","short":{"text":"Each basis element β i is contained in its interior, so it is open","status":"ok"},"proof":[{"text":"Unfolded, the inclusion of β i in its interior says that β i is a neighbourhood of each of its points. This is [[AffineConstructive.topology.topology.basis.neighborhood_basis_open]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.basis.neighborhood_basis_open_iff","base":"neighborhood_basis_open_iff","kind":"prf","start":32,"body":[33,38],"status":"ok","short":{"text":"A point lies in β i if and only if β i is a neighbourhood of it","status":"ok"},"proof":[{"text":"Fix a point p.","status":"ok","from":0,"to":1},{"text":"The forward direction is [[AffineConstructive.topology.topology.basis.neighborhood_basis_open]]. The converse remains: if β i is a neighbourhood of p, then p lies in β i.","status":"ok","from":2,"to":2},{"text":"Express p ⪽ β i through the basis and take the j it provides, with p ∊ β j and β j ⊆ β i.","status":"ok","from":3,"to":3},{"text":"Membership passes along the inclusion β j ⊆ β i ([[AffineConstructive.interfaces.subset.subset_apply]]), which gives p ∊ β i.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.topology.basis.neighborhood_basis_isotony","base":"neighborhood_basis_isotony","kind":"prf","start":39,"body":[40,44],"status":"ok","short":{"text":"With a neighbourhood basis, a subset containing a neighbourhood of x is a neighbourhood of x","status":"ok"},"proof":[{"text":"Express x ⪽ U through the basis and bring the existential out of the tensor with U ⊆ V. Then take the i it provides, with x ∊ β i and β i ⊆ U.","status":"ok","from":0,"to":1},{"text":"Express x ⪽ V through the basis as well and take the same i as the witness. The goal is now x ∊ β i and β i ⊆ V.","status":"ok","from":2,"to":2},{"text":"Reassociate the tensor so that β i ⊆ U meets U ⊆ V. The two inclusions compose by transitivity, while the membership x ∊ β i carries over unchanged.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.topology.basis.cont_by_basis_codom","base":"cont_by_basis_codom","kind":"prf","start":46,"body":[47,54],"status":"ok","short":{"text":"f is continuous if preimages of basic sets β j containing f x are neighbourhoods of x","status":"ok"},"proof":[{"text":"Assume the condition on basic sets. Resolution supplies the topologies required by the structure of a continuous map, which leaves the neighbourhood condition: for each x, every neighbourhood of f x pulls back to a neighbourhood of x.","status":"ok","from":0,"to":2},{"text":"Fix x and N. Express f x ⪽ N through the basis and take the j it provides, with f x ∊ β j and β j ⊆ N.","status":"ok","from":3,"to":4},{"text":"Neighbourhoods are upward closed, so it suffices to show that f*(β j) is a neighbourhood of x and that f*(β j) ⊆ f* N.","status":"ok","from":5,"to":5},{"text":"Each factor of the hypothesis serves one factor of the goal. The assumed condition turns f x ∊ β j into x ⪽ f*(β j), and since preimage preserves inclusion ([[AffineConstructive.orders.subset_images.preimage_order_preserving]]), β j ⊆ N gives f*(β j) ⊆ f* N.","status":"ok","from":6,"to":7}]},{"name":"AffineConstructive.topology.topology.basis.cont_by_basis_dom","base":"cont_by_basis_dom","kind":"prf","start":55,"body":[56,66],"status":"ok","short":{"text":"f is continuous if each neighbourhood of f x has preimage containing a basic set around x","status":"ok"},"proof":[{"text":"Assume the condition. Resolution supplies the topologies, which leaves the neighbourhood condition. Fix x and N.","status":"ok","from":0,"to":3},{"text":"Pass through the intermediate statement that some basic set β i contains x and lies inside f* N.","status":"ok","from":4,"to":4},{"text":"The first implication is the assumed condition at x and N.","status":"ok","from":5,"to":6},{"text":"For the second, take the i that the existential provides. By [[AffineConstructive.topology.topology.basis.neighborhood_basis_use]], β i is a basic set containing x and contained in f* N, so f* N is a neighbourhood of x.","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.topology.topology.basis.cont_by_basis","base":"cont_by_basis","kind":"prf","start":67,"body":[68,79],"status":"ok","short":{"text":"Continuity checked basis to basis: each basic set at f x pulls back over a basic set at x","status":"ok"},"proof":[{"text":"Assume the condition. By [[AffineConstructive.topology.topology.basis.cont_by_basis_dom]], it suffices to show that every neighbourhood N of f x contains, in its preimage, a basic set α i around x.","status":"ok","from":0,"to":2},{"text":"Fix x and N. Express f x ⪽ N through the basis of Y and take the j it provides, with f x ∊ β j and β j ⊆ N.","status":"ok","from":3,"to":5},{"text":"Specialise the assumed condition at x and j and apply it to f x ∊ β j. Bring out the existential and take the i it provides, with x ∊ α i and α i ⊆ f*(β j). The inclusion β j ⊆ N is still unused.","status":"ok","from":6,"to":6},{"text":"Take i as the witness. After reassociating, x ∊ α i passes through unchanged, and what remains is to obtain α i ⊆ f* N from α i ⊆ f*(β j) together with β j ⊆ N.","status":"ok","from":7,"to":8},{"text":"Because preimage preserves inclusion ([[AffineConstructive.orders.subset_images.preimage_order_preserving]]), β j ⊆ N becomes f*(β j) ⊆ f* N. The two inclusions then compose by transitivity.","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.topology.topology.basis.refl_by_basis_codom","base":"refl_by_basis_codom","kind":"prf","start":80,"body":[81,92],"status":"ok","short":{"text":"f reflects neighbourhoods if each neighbourhood of x contains the preimage of a basic set at f x","status":"ok"},"proof":[{"text":"Assume the condition. Resolution supplies the topologies, which leaves the reflection condition: every neighbourhood U of x contains the preimage of some neighbourhood of f x. Fix x and U.","status":"ok","from":0,"to":3},{"text":"Pass through the intermediate statement that some basic β j contains f x and has its preimage inside U. The first implication is the assumed condition at x and U.","status":"ok","from":4,"to":6},{"text":"For the second, take the j that the existential provides and take β j as the witnessing neighbourhood. The inclusion f*(β j) ⊆ U passes through unchanged.","status":"ok","from":7,"to":9},{"text":"It remains to show that β j is a neighbourhood of f x. By [[AffineConstructive.topology.topology.basis.neighborhood_basis_open_iff]], this is equivalent to f x ∊ β j.","status":"ok","from":10,"to":11}]},{"name":"AffineConstructive.topology.topology.basis.refl_by_basis_dom","base":"refl_by_basis_dom","kind":"prf","start":93,"body":[94,104],"status":"ok","short":{"text":"f reflects neighbourhoods if each basic set at x contains the preimage of a neighbourhood of f x","status":"ok"},"proof":[{"text":"Assume the hypothesis on basic sets. Every part of reflection except the condition on neighbourhoods is found automatically. What remains is that each neighbourhood of a point x contains the preimage of some neighbourhood of f x.","status":"ok","from":0,"to":2},{"text":"Fix x and a neighbourhood U of x. Because β is a [[AffineConstructive.topology.interfaces.topology.NeighborhoodBasis]], U contains some basic set β i that contains x; take that i.","status":"ok","from":3,"to":5},{"text":"The hypothesis at x and i turns x ∊ β i into a neighbourhood V of f x with f* V ⊆ β i. Take that V, which also serves as the witness for the goal.","status":"ok","from":6,"to":7},{"text":"The neighbourhood f x ⪽ V carries over unchanged. The inclusions f* V ⊆ β i and β i ⊆ U give f* V ⊆ U by transitivity.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.topology.topology.basis.refl_by_basis","base":"refl_by_basis","kind":"prf","start":105,"body":[106,114],"status":"ok","short":{"text":"Reflection checked basis to basis: each basic set at x contains the preimage of one at f x","status":"ok"},"proof":[{"text":"Assume the hypothesis. By [[AffineConstructive.topology.topology.basis.refl_by_basis_dom]] it suffices that each basic set α i containing x contains the preimage of some neighbourhood of f x.","status":"ok","from":0,"to":2},{"text":"Fix x and i. The hypothesis turns x ∊ α i into an index j with f x ∊ β j and f* (β j) ⊆ α i; take that j.","status":"ok","from":3,"to":5},{"text":"The basic set β j is itself the required neighbourhood: take it as the witness. Because f x ∊ β j, the set β j is a neighbourhood of f x by [[AffineConstructive.topology.topology.basis.neighborhood_basis_open_iff]], and the inclusion carries over.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.topology.basis.initial_by_basis","base":"initial_by_basis","kind":"prf","start":115,"body":[116,123],"status":"ok","short":{"text":"The two basis-to-basis criteria together make f continuously initial","status":"ok"},"proof":[{"text":"Assume both basis-to-basis conditions. Initiality splits into continuity and reflection.","status":"ok","from":0,"to":2},{"text":"Continuity follows from the first condition by [[AffineConstructive.topology.topology.basis.cont_by_basis]].","status":"ok","from":3,"to":4},{"text":"Reflection follows from the second condition by [[AffineConstructive.topology.topology.basis.refl_by_basis]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.topology.basis.dense_by_basis","base":"dense_by_basis","kind":"prf","start":124,"body":[125,147],"status":"ok","short":{"text":"A subset meeting every inhabited basic set is dense","status":"ok"},"proof":[{"text":"Assume the hypothesis. Density of U means that the closure of U is the whole set. By antisymmetry, and since every subset lies below the top, it remains to show that everything lies in the closure of U.","status":"ok","from":0,"to":3},{"text":"Fix a point x. It remains to show that x lies in the closure of U.","status":"ok","from":4,"to":6},{"text":"A point is in the closure of U when the complement of U is not a neighbourhood of it. Through the basis, the goal is the negation of the statement that some β i contains x and lies in Uᗮ. By De Morgan this becomes: for every i, either x ∉ β i par β i ⊄ Uᗮ. Fix i.","status":"ok","from":7,"to":10},{"text":"Argue by contrapositive: from β i ⊆ Uᗮ, derive x ∉ β i. Taking complements reverses inclusion, so the assumption becomes U ⊆ (β i)ᗮ.","status":"ok","from":11,"to":13},{"text":"Refuting x ∊ β i means deriving falsity from it together with U ⊆ (β i)ᗮ. The hypothesis turns x ∊ β i into a point a that lies both in β i and in U; let a be such a point.","status":"ok","from":14,"to":18},{"text":"The inclusion U ⊆ (β i)ᗮ says that every point of U lies outside β i. Specialise it at a; then a ∊ U gives a ∉ β i, which contradicts a ∊ β i. Each fact is used exactly once.","status":"ok","from":19,"to":22}]},{"name":"AffineConstructive.topology.topology.basis.Dense_by_basis","base":"Dense_by_basis","kind":"prf","start":148,"body":[149,158],"status":"ok","short":{"text":"A map whose range meets every inhabited basic set is dense","status":"ok"},"proof":[{"text":"Assume the hypothesis. Beyond what is found automatically, a dense map is one whose range is dense.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.topology.topology.basis.dense_by_basis]] it suffices that every basic set β i containing a point y meets the range of f. Fix y and i.","status":"ok","from":3,"to":4},{"text":"The hypothesis turns y ∊ β i into a point x of X with f x ∊ β i; take that x.","status":"ok","from":5,"to":6},{"text":"Take f x as the witness. It lies in the range of f, so what remains is f x ∊ β i, which is the assumption.","status":"ok","from":7,"to":9}]},{"name":"AffineConstructive.topology.topology.basis.basis_neighborhood","base":"basis_neighborhood","kind":"def","start":159,"body":null,"status":"ok","short":{"text":"The neighbourhood relation generated by a family β: N is a neighbourhood of x when some β i ∋ x lies in N","status":"ok"},"long":{"text":"Given any family β of subsets of X indexed by a type I, this is the neighbourhood relation in which N is a neighbourhood of x when there is an index i with x ∊ β i ⊠ β i ⊆ N. No condition is placed on β, and β is a neighbourhood basis for this relation by definition, as [[AffineConstructive.topology.topology.basis.basis_neighborhood_prop]] records.\n\nThe two conditions on β i are joined by the tensor, the same connective as in [[AffineConstructive.topology.interfaces.topology.NeighborhoodBasis]]. This makes the relation a subset of the tensor product X ⊗ 𝒫 X, and the existential over indices also carries the dual reading: N fails to be a neighbourhood of x when, for every basis element, either x is apart from it or it is not contained in N. The relation is used to define the neighbourhood relation on a tensor product of spaces, [[AffineConstructive.topology.topology.product.tensor_product_neighborhood]], from the basis of products of neighbourhoods.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.basis.basis_neighborhood_prop","base":"basis_neighborhood_prop","kind":"prf","start":160,"body":[161,163],"status":"ok","short":{"text":"A family β is a neighbourhood basis for the neighbourhood relation it generates","status":"ok"},"proof":[{"text":"In the neighbourhood relation [[AffineConstructive.topology.topology.basis.basis_neighborhood]] generated by β, N is a neighbourhood of x exactly when some β i contains x and lies in N. This is word for word the condition for β to be a basis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.basis.interior_neighborhood_basis","base":"interior_neighborhood_basis","kind":"prf","start":165,"body":[166,177],"status":"ok","short":{"text":"In a topological space, the interiors of all subsets form a neighbourhood basis","status":"ok"},"proof":[{"text":"Fix x and N. Prove the equivalence one direction at a time.","status":"ok","from":0,"to":2},{"text":"For the forward direction, take N itself as the index. That N is a neighbourhood of x says x lies in the interior of N, and the interior of N is contained in N by [[AffineConstructive.topology.topology.interior.interior_subset]].","status":"ok","from":3,"to":5},{"text":"For the converse, let M be a subset whose interior contains x and is contained in N.","status":"ok","from":6,"to":8},{"text":"By [[AffineConstructive.topology.topology.interior.interior_idempotent]], membership in the interior of M is membership in the interior of the interior of M, so the interior of M is a neighbourhood of x. Since a neighbourhood relation is upward closed, the inclusion of the interior of M in N makes N a neighbourhood of x.","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.topology.topology.basis.topology_by_basis","base":"topology_by_basis","kind":"prf","start":183,"body":[184,218],"status":"ok","short":{"text":"A neighbourhood relation with a basis that covers each point and refines pairwise meets is a topology","status":"ok"},"proof":[{"text":"There are five topology axioms to check: reflexivity, isotony, the whole set, binary meets and transitivity.","status":"ok","from":0,"to":1},{"text":"Reflexivity: fix x and a neighbourhood U of x. The basis gives a set β i containing x and contained in U, and membership passes along the inclusion by [[AffineConstructive.interfaces.subset.subset_apply]].","status":"ok","from":2,"to":5},{"text":"Isotony is [[AffineConstructive.topology.topology.basis.neighborhood_basis_isotony]].","status":"ok","from":6,"to":7},{"text":"The whole set: fix x. The covering hypothesis gives an i with x ∊ β i. By [[AffineConstructive.topology.topology.basis.neighborhood_basis_use]] it suffices that x ∊ β i, which holds, and that β i lies in the whole set, which it does because the whole set is the top.","status":"ok","from":8,"to":13},{"text":"Binary meets: fix x, U and V. The basis gives β i containing x and contained in U, and β j containing x and contained in V.","status":"ok","from":14,"to":17},{"text":"Through the basis, the goal asks for a basic set containing x and contained in U ⊓ V. Rearrange the hypotheses so that the two memberships x ∊ β i and x ∊ β j stand together, as do the two inclusions.","status":"ok","from":18,"to":19},{"text":"The refinement hypothesis consumes the two memberships and yields k with x ∊ β k and β k ⊆ β i ⊓ β j. Take k as the witness.","status":"ok","from":20,"to":21},{"text":"The membership x ∊ β k carries over. Since the meet is monotone, β i ⊆ U and β j ⊆ V give β i ⊓ β j ⊆ U ⊓ V. This composes with β k ⊆ β i ⊓ β j by transitivity.","status":"ok","from":22,"to":24},{"text":"Transitivity: fix x and a neighbourhood U of x. The basis gives β i containing x and contained in U.","status":"ok","from":25,"to":27},{"text":"The same β i serves to show that the set of points having U as a neighbourhood is a neighbourhood of x. The membership x ∊ β i carries over. It remains to show that β i ⊆ U puts β i inside that set.","status":"ok","from":28,"to":29},{"text":"Fix y ∊ β i. The set β i is a neighbourhood of y by [[AffineConstructive.topology.topology.basis.neighborhood_basis_open]], and isotony along β i ⊆ U, [[AffineConstructive.topology.topology.basis.neighborhood_basis_isotony]], makes U a neighbourhood of y.","status":"ok","from":30,"to":34}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Neighbourhood topologies: axioms, interior and closure, separation, continuous, reflecting and dense maps, products","summary":"The interface for topological spaces, given by a neighbourhood relation. A [[Neighborhood]] on a set X is a function x ⪽ U from X ⊗ 𝒫 X to affine propositions, and [[Topology]] states the neighbourhood axioms for it: a neighbourhood contains its point, the relation is upward closed, the full subset is a neighbourhood, binary meets of neighbourhoods are neighbourhoods, and a neighbourhood U is a neighbourhood of the set of points of which U is a neighbourhood. From the relation the file defines [[interior]], [[closure]], open, closed and dense subsets, neighbourhood bases, and the separation axioms [[Separation_T₀]] and [[Hausdorff]]. It sets out the classes of maps used throughout the topology files: [[Continuous]], the reflecting class [[ContinuouslyReflecting]], the two together as [[ContinuouslyInitial]], [[ContinuouslyEmbedding]] and [[Dense]]. It also gives the discrete and indiscrete structures and the two product topologies, the tensor product by a neighbourhood basis and the cartesian product by its universal property. The topological lemmas live in the files under topology/topology, and the uniform and bornological interfaces build on these classes."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.topology.topology.base":{"page":"base.html","short":"Basic topology: classes of maps under composition, separation, discrete and indiscrete spaces","summary":"The first results about topological spaces given by a neighbourhood relation. The classes of maps (continuous, reflecting, initial, embedding, dense) become predicates that respect equality of maps, and each is closed under identity and composition. On separation: a Hausdorff space is T₀, and in a Hausdorff space two points are equal exactly when all their neighbourhoods meet. An initial map out of a T₀ space is an embedding, and a continuous injection into a Hausdorff space makes its domain Hausdorff. The file also sets up the empty space as initial object, the discrete and indiscrete topologies (the finest and the coarsest), the one-point space as terminal object, and shows that constant maps are continuous. Later topology files build on these results."},"AffineConstructive.topology.topology.interior":{"page":"interior.html","short":"Interior and closure in a topological space: basic laws, open and closed subsets, density","summary":"This file develops the basic algebra of the interior and closure operators that a topology determines from its neighbourhood relation. The interior is contained in its argument, is monotone and idempotent, and preserves the full subset and the empty subset. It also sends the multiplicative intersection of two interiors into the interior of their meet. As a consequence, interiors are open, and an open subset is a neighbourhood of each of its points. The closure, defined as the complement of the interior of the complement, has the dual properties, which follow by complementation: it contains its argument, is idempotent, and sends a join into the multiplicative union of the closures. A subset is open exactly when its complement is closed, and conversely. The file ends with the neighbourhood characterisation of the closure, that x is in the closure of U if and only if every neighbourhood of x meets U, and its consequences for dense subsets. These results are used by the files on continuity, uniform spaces and completions."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

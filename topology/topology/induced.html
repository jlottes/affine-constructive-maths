ll_lb _ x). apply aandl.\n    * rew <-all_adj. intros x. rew (all_lb _ x). apply aandr.\n  + rew <-all_adj. intros x. now rew (all_lb _ x).\n  Qed.\n\n  Definition Pred := induced_poset pred_eq_correct.\n\n  Context (N:A → Pred → Ω).\n\n  Context (refl: ∀ x U, N x U ⊸ U x).\n  Context (isotony: ∀ x U V, N x U ⊠ (∏ y, U y ⊸ V y) ⊸ N x V).\n  Context (nul_add: ∀ x, N x (λ x, 𝐓)).\n  Context (bin_add: ∀ x U V, N x U ⊠ N x V ⊸ N x (λ y, U y ∧ V y)).\n  Context (trans: ∀ x U, N x U ⊸ N x (λ y, N y U)).\n\n  Local Instance induced_top_le : Le A := λ '(x, y), ∏ (U:Pred), N y U ⊸ N x U.\n  Local Instance induced_top_eq : Equiv A := λ '(x, y), ∏ (U:Pred), N x U ⧟ N y U.\n\n  Local Instance induced_top_preorder : PreOrder A.\n  Proof. split.\n  + now intros x U.\n  + intros x y z. unfold le, induced_top_le. rew <-all_adj. intros U.\n    rew (all_lb _ U).\n    rew (aprod_com _ _). now apply transitivity.\n  Qed.\n\n  Lemma induced_top_eq_correct (x y : A) : x = y ⧟ x ≤ y ∧ y ≤ x.\n  Proof. unfold equiv, le, induced_top_le, induced_top_eq. split.\n  + apply aand_intro.\n    * rew <-all_adj. intros U. rew (all_lb _ U). apply aandr.\n    * rew <-all_adj. intros U. rew (all_lb _ U). apply aandl.\n  + rew <-all_adj. intros U. rew (all_lb _ U).\n    now rew (aand_com _ _).\n  Qed.\n\n  Definition induced_topology_set := induced_poset induced_top_eq_correct.\n  Local Abbreviation X := induced_topology_set.\n\n  Lemma induced_nbrhood_isfun : @IsFun (X ⊗ 𝒫 X) Ω (λ '(x, U), N x U).\n  Proof. enough (∀ (x y : X) (U V : 𝒫 X), (∏ (W:Pred), N x W ⧟ N y W) ⊠ U = V ⊸ (N x U ⊸ N y V)) as P.\n  + intros [x U][y V]. change ((∏ (W:Pred), N x W ⧟ N y W) ⊠ U = V ⊸ (N x U ⧟ N y V)).\n    apply aand_intro.\n    * apply P.\n    * rew <-(P y x V U). apply aprod_proper_aimpl.\n      - rew <-all_adj. intros W. rew (all_lb _ W). now apply symmetry.\n      - now apply symmetry.\n  + intros x y U V. rew (all_lb _ (V: Pred)). rew (aandl _ _ : (N x V ⧟ N y V) ⊸ _). rew (aprod_com _ _).\n    enough (U = V ⊸ (N x U ⊸ N x V)) as E by (rew E; now apply transitivity).\n    rew <-(isotony x U V). rew <-(aprod_adj _ _ _). rew (aprod_com _ _) at 1.\n    enough (U = V ⊸ ∏ y, U y ⊸ V y) as E by now rew E.\n    exact (eq_le U V).\n  Qed.\n\n  Local Instance induced_nbrhood : Neighborhood X := @func_make _ _ _ induced_nbrhood_isfun.\n\n  Lemma induced_topology : Topology X.\n  Proof. split.\n  + intros x U. apply refl.\n  + intros x U V. apply isotony.\n  + intros x. apply nul_add.\n  + intros x U V. apply bin_add.\n  + intros x U. apply trans.\n  Qed.\n\n  Lemma pred_interior_is_fun (W:Pred) : @IsFun X Ω (λ z, N z W).\n  Proof. intros a b. exact (all_lb _ W). Qed.\n\n  Definition pred_interior (W:Pred) : 𝒫 X := @func_make _ _ _ (pred_interior_is_fun W).\n\n  Lemma N_iff_pred_interior (z:X) (W:Pred) : N z W ⧟ N z (pred_interior W).\n  Proof. split.\n  + exact (trans z W).\n  + rew <-(isotony z (pred_interior W) W).\n    enough (∏ y, N y W ⊸ W y) by now simplify.\n    intros y. exact (refl y W).\n  Qed.\n\n  Lemma induced_topology_T₀ : Separation_T₀ X.\n  Proof. intros x y.\n    change ((∏ U : 𝒫 X, N x U ⧟ N y U) ⊸ (∏ W : Pred, N x W ⧟ N y W)).\n    rew <-all_adj. intros W.\n    rew (N_iff_pred_interior _ W).\n    exact (all_lb _ (pred_interior W)).\n  Qed.\nEnd induced.\n\n\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":85,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":86,"e":112,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":3,"s":113,"e":164,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":4,"s":165,"e":200,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":5,"s":201,"e":255,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":6,"s":256,"e":292,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals": 706,"e":2709,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2724,"e":2727,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2752,"e":2755,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2792,"e":2795,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2818,"e":2821,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2857,"e":2860,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2924,"e":2927,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2931,"e":2934,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2960,"e":2963,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2983,"e":2986,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3008,"e":3011,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3078,"e":3081,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3082,"e":3085,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3750,"e":3753,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3822,"e":3825,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3826,"e":3834,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":4020,"e":4023,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4049,"e":4052,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file builds a topological space from a neighbourhood relation N given on predicates of a bare type A. N is assumed to satisfy the topology axioms for predicates: reflexivity, isotony, the empty and binary additive meets, and transitivity. The carrier [[AffineConstructive.topology.topology.induced.induced_topology_set]] takes as its equality agreement on all predicate neighbourhoods, so that N becomes a neighbourhood relation [[AffineConstructive.topology.topology.induced.induced_nbrhood]] on its subsets. [[AffineConstructive.topology.topology.induced.induced_topology]] shows that the topology axioms carry over. [[AffineConstructive.topology.topology.induced.induced_topology_T₀]] shows the result is T₀: a predicate neighbourhood can be exchanged for a subset neighbourhood, its interior [[AffineConstructive.topology.topology.induced.pred_interior]] ([[AffineConstructive.topology.topology.induced.N_iff_pred_interior]]).","short":"The T₀ topological space induced by a neighbourhood relation on predicates","items":[{"name":"AffineConstructive.topology.topology.induced.pred_le","base":"pred_le","kind":"inst","start":12,"body":null,"status":"ok","short":{"text":"Pointwise order on predicates of A: U ≤ V when U x implies V x for every x","status":"ok"},"long":{"text":"This orders the affine predicates on a type A pointwise: U ≤ V is ∏ x, U x ⊸ V x, which is inclusion between the predicates read as subsets. A has no equality of its own here, so the predicates are bare functions A → Ω and not subsets of a set. This order is the one [[AffineConstructive.topology.topology.induced.Pred]] is built from.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.pred_eq","base":"pred_eq","kind":"inst","start":13,"body":null,"status":"ok","short":{"text":"Pointwise equality of predicates on A: U x if and only if V x, for every x","status":"ok"},"long":{"text":"Two affine predicates on A are equal when they agree at every point, ∏ x, U x ⧟ V x. By [[AffineConstructive.topology.topology.induced.pred_eq_correct]] this is the equality the pointwise order [[AffineConstructive.topology.topology.induced.pred_le]] induces, so it is the equality of the set [[AffineConstructive.topology.topology.induced.Pred]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.pred_preorder","base":"pred_preorder","kind":"inst","start":14,"body":[15,26],"status":"ok","short":{"text":"The pointwise order on predicates of A is a preorder","status":"ok"},"proof":[{"text":"A preorder is a reflexive and transitive relation, so there are two things to check for the pointwise order [[AffineConstructive.topology.topology.induced.pred_le]].","status":"ok","from":0,"to":1},{"text":"Reflexivity: at each point x, U x implies itself.","status":"ok","from":2,"to":3},{"text":"Transitivity: given predicates U, V, W, the goal is that U ≤ V and V ≤ W together give U ≤ W. Unfolding the order, the conclusion is a universal over points, so fix x.","status":"ok","from":4,"to":8},{"text":"Specialise both hypotheses at x. The implications U x ⊸ V x and V x ⊸ W x, each used once, compose to U x ⊸ W x by transitivity of implication.","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.topology.topology.induced.pred_eq_correct","base":"pred_eq_correct","kind":"prf","start":27,"body":[28,47],"status":"ok","short":{"text":"Pointwise equality of predicates is pointwise inclusion both ways, as an additive conjunction","status":"ok"},"proof":[{"text":"Unfolding [[AffineConstructive.topology.topology.induced.pred_eq]] and [[AffineConstructive.topology.topology.induced.pred_le]], the claim is that a pointwise equivalence amounts to the additive conjunction of the two pointwise implications. Prove each direction.","status":"ok","from":0,"to":2},{"text":"From the pointwise equivalence to the conjunction: an additive conjunction in the conclusion is proved by deriving each conjunct from the whole hypothesis.","status":"ok","from":3,"to":4},{"text":"For U ≤ V, fix x and specialise the equivalence at x. Its forward half gives U x ⊸ V x.","status":"ok","from":5,"to":9},{"text":"For V ≤ U, fix x the same way. This time the backward half of U x ⧟ V x gives V x ⊸ U x.","status":"ok","from":10,"to":14},{"text":"Conversely, fix x and specialise each conjunct of the hypothesis at x. The two implications between U x and V x, taken as an additive conjunction, are by definition the equivalence U x ⧟ V x.","status":"ok","from":15,"to":19}]},{"name":"AffineConstructive.topology.topology.induced.Pred","base":"Pred","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"The set of affine predicates on A, with pointwise order and equality","status":"ok"},"long":{"text":"Pred A is the set whose elements are the functions A → Ω. Two of them are equal when they agree at every point. It is built with [[AffineConstructive.orders.orders.induced_poset]] from the pointwise preorder, using [[AffineConstructive.topology.topology.induced.pred_eq_correct]]. A neighbourhood relation on the bare type A can be stated against Pred A before A has a set structure, and the axioms of the file's section assume such a relation N, with isotony phrased by pointwise inclusion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.induced_top_le","base":"induced_top_le","kind":"inst","start":55,"body":null,"status":"ok","short":{"text":"The specialisation preorder of N: x ≤ y when every neighbourhood of y is a neighbourhood of x","status":"ok"},"long":{"text":"For a neighbourhood relation N between points of A and predicates, x ≤ y is ∏ U, N y U ⊸ N x U: each predicate neighbourhood of y is one of x. This is the specialisation order of the topology N describes, read in the direction that makes y a specialisation of x. Its symmetrisation is the equality of [[AffineConstructive.topology.topology.induced.induced_topology_set]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.induced_top_eq","base":"induced_top_eq","kind":"inst","start":56,"body":null,"status":"ok","short":{"text":"Topological indistinguishability: x and y have the same predicate neighbourhoods","status":"ok"},"long":{"text":"Two points of A are equal when, for every predicate U, N x U if and only if N y U. Because the implication is affine, the refuting side of this equality is apartness: x and y are apart when some predicate is a neighbourhood of one and not of the other. By [[AffineConstructive.topology.topology.induced.induced_top_eq_correct]] this equality is the symmetrisation of the specialisation order, and it is the equality of [[AffineConstructive.topology.topology.induced.induced_topology_set]]. A set built this way is T₀ by construction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.induced_top_preorder","base":"induced_top_preorder","kind":"inst","start":57,"body":[58,70],"status":"ok","short":{"text":"The specialisation order of N on A is a preorder","status":"ok"},"proof":[{"text":"The specialisation order [[AffineConstructive.topology.topology.induced.induced_top_le]] has to be shown reflexive and transitive.","status":"ok","from":0,"to":1},{"text":"Reflexivity: N x U implies itself for every predicate U.","status":"ok","from":2,"to":3},{"text":"Transitivity: given points x, y, z, the goal is that x ≤ y and y ≤ z together give x ≤ z. Unfold the order and fix a predicate U.","status":"ok","from":4,"to":8},{"text":"Specialise both hypotheses at U, which gives N y U ⊸ N x U and N z U ⊸ N y U. After swapping the two factors, these chain by transitivity to N z U ⊸ N x U.","status":"ok","from":9,"to":12}]},{"name":"AffineConstructive.topology.topology.induced.induced_top_eq_correct","base":"induced_top_eq_correct","kind":"prf","start":71,"body":[72,92],"status":"ok","short":{"text":"Indistinguishability is the specialisation order both ways, as an additive conjunction","status":"ok"},"proof":[{"text":"Unfolding [[AffineConstructive.topology.topology.induced.induced_top_eq]] and [[AffineConstructive.topology.topology.induced.induced_top_le]], the claim is that having the same predicate neighbourhoods is the additive conjunction of the two inclusions of neighbourhood systems. Prove each direction.","status":"ok","from":0,"to":2},{"text":"From indistinguishability to the conjunction: derive each conjunct from the whole hypothesis.","status":"ok","from":3,"to":4},{"text":"For x ≤ y, fix a predicate U and specialise the hypothesis at U. The backward half of N x U ⧟ N y U gives N y U ⊸ N x U.","status":"ok","from":5,"to":9},{"text":"For y ≤ x, fix U the same way. The forward half gives N x U ⊸ N y U.","status":"ok","from":10,"to":14},{"text":"Conversely, fix U and specialise both conjuncts at U. Up to the order of the conjuncts, the two implications form the equivalence N x U ⧟ N y U.","status":"ok","from":15,"to":20}]},{"name":"AffineConstructive.topology.topology.induced.induced_topology_set","base":"induced_topology_set","kind":"def","start":93,"body":null,"status":"ok","short":{"text":"The set of points of A, identified when they have the same neighbourhoods","status":"ok"},"long":{"text":"For a neighbourhood relation N between points of A and predicates on A, this is the set with carrier A, ordered by specialisation ([[AffineConstructive.topology.topology.induced.induced_top_le]]) and with indistinguishability ([[AffineConstructive.topology.topology.induced.induced_top_eq]]) as its equality. It is built with [[AffineConstructive.orders.orders.induced_poset]]. Traditionally it is the Kolmogorov quotient of the topology N describes, but here no quotient is taken: the elements are the points of A and only the equality changes. The rest of the file puts on this set the neighbourhood relation and topology that N determines, and shows the result is T₀.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.X","base":"X","kind":"abbrev","start":94,"body":null,"status":"ok","short":{"text":"Local name for the induced set of points, induced_topology_set A N","status":"ok"},"long":{"text":"Inside the section, X abbreviates [[AffineConstructive.topology.topology.induced.induced_topology_set]] at the section's type A and relation N. It is not a constant of its own after the section closes.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.induced_nbrhood_isfun","base":"induced_nbrhood_isfun","kind":"prf","start":95,"body":[96,125],"status":"ok","short":{"text":"N respects equality: x = y ⊠ U = V implies N x U if and only if N y V, for subsets U, V","status":"ok"},"proof":[{"text":"It is enough to prove one direction, P: if x and y have the same predicate neighbourhoods and the subsets U and V are equal, then N x U implies N y V. The equivalence then follows.","status":"ok","from":0,"to":1},{"text":"Take two pairs (x, U) and (y, V). Their equality in the tensor product is the tensor of the equality of the points, which is having the same predicate neighbourhoods, and the equality U = V. The goal is that this implies N x U ⧟ N y V.","status":"ok","from":2,"to":4},{"text":"Prove the two implications separately. The first is exactly P.","status":"ok","from":5,"to":7},{"text":"The second is P with the roles of (x, U) and (y, V) exchanged. So the hypotheses only have to be turned into their symmetric forms, one factor at a time.","status":"ok","from":8,"to":10},{"text":"For the points, fix a predicate W and specialise at W. Then N x W ⧟ N y W gives N y W ⧟ N x W by symmetry.","status":"ok","from":11,"to":15},{"text":"For the subsets, U = V gives V = U by symmetry.","status":"ok","from":16,"to":17},{"text":"Now prove P itself. Fix x, y, U, V, specialise the hypothesis on the points at V viewed as a predicate, and keep the forward half N x V ⊸ N y V.","status":"ok","from":18,"to":21},{"text":"After swapping the factors, it suffices that U = V gives N x U ⊸ N x V. By transitivity, that composes with N x V ⊸ N y V.","status":"ok","from":22,"to":23},{"text":"By the isotony axiom, N x V follows from N x U together with the pointwise inclusion of U in V. After rearranging, N x U passes straight through, and it remains to get that inclusion from U = V.","status":"ok","from":24,"to":26},{"text":"An equality of subsets gives the inclusion U ⊆ V, by [[AffineConstructive.orders.orders.eq_le]] in the poset of subsets.","status":"ok","from":27,"to":29}]},{"name":"AffineConstructive.topology.topology.induced.induced_nbrhood","base":"induced_nbrhood","kind":"inst","start":126,"body":null,"status":"ok","short":{"text":"The neighbourhood relation on the induced set: N, restricted to subsets","status":"ok"},"long":{"text":"A subset U of [[AffineConstructive.topology.topology.induced.induced_topology_set]] is in particular a predicate on A, so N x U makes sense. Equal points have the same predicate neighbourhoods, and isotony makes N respect equality of subsets, so N is a function on X ⊗ 𝒫 X ([[AffineConstructive.topology.topology.induced.induced_nbrhood_isfun]]). This is the [[AffineConstructive.topology.interfaces.topology.Neighborhood]] structure of the induced space. The pairing is the tensor because the proof that N respects equality uses the equality of points and the equality of subsets once each.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.induced_topology","base":"induced_topology","kind":"prf","start":127,"body":[128,145],"status":"ok","short":{"text":"Under the topology axioms assumed of N, the induced neighbourhood relation is a topology","status":"ok"},"proof":[{"text":"The topology axioms for [[AffineConstructive.topology.topology.induced.induced_nbrhood]] are five: a neighbourhood contains its point, neighbourhoods are upward closed, the whole set is a neighbourhood, neighbourhoods are closed under binary meets, and the transitivity axiom. On subsets the induced relation is N itself, inclusion is pointwise implication, meet is the pointwise additive conjunction and the whole set is the constantly true predicate. So each axiom is the corresponding assumption on N.","status":"ok","from":0,"to":1},{"text":"A neighbourhood U of x contains x: this is the assumption refl.","status":"ok","from":2,"to":4},{"text":"Upward closure along U ⊆ V: this is isotony.","status":"ok","from":5,"to":7},{"text":"The whole set is a neighbourhood of every point: this is nul_add.","status":"ok","from":8,"to":10},{"text":"Two neighbourhoods of x give their meet as a neighbourhood: this is bin_add.","status":"ok","from":11,"to":13},{"text":"If U is a neighbourhood of x, so is the set of points of which U is a neighbourhood: this is trans.","status":"ok","from":14,"to":17}]},{"name":"AffineConstructive.topology.topology.induced.pred_interior_is_fun","base":"pred_interior_is_fun","kind":"prf","start":146,"body":[147,150],"status":"ok","short":{"text":"The points having a predicate W as neighbourhood form an equality-respecting predicate on X","status":"ok"},"proof":[{"text":"Take points a and b. The goal is that a = b implies N a W ⧟ N b W.","status":"ok","from":0,"to":1},{"text":"Equality of points is by definition the equivalence N a W' ⧟ N b W' for every predicate W', so specialise it at W.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.topology.induced.pred_interior","base":"pred_interior","kind":"def","start":151,"body":null,"status":"ok","short":{"text":"The interior of a predicate W: the subset of points of which W is a neighbourhood","status":"ok"},"long":{"text":"A predicate W on A need not respect the equality of [[AffineConstructive.topology.topology.induced.induced_topology_set]], so it is not itself a subset of that set. The points z with N z W do form a subset: two points are equal when they agree on every predicate neighbourhood, and specialising that agreement at W is the whole proof of [[AffineConstructive.topology.topology.induced.pred_interior_is_fun]]. This subset is the interior of W.\n\nIt connects the neighbourhoods given as predicates on A with the neighbourhoods given as subsets of the induced set: [[AffineConstructive.topology.topology.induced.N_iff_pred_interior]] shows that W is a neighbourhood of z if and only if its interior is.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.induced.N_iff_pred_interior","base":"N_iff_pred_interior","kind":"prf","start":152,"body":[153,162],"status":"ok","short":{"text":"W is a neighbourhood of z if and only if the interior of W is","status":"ok"},"proof":[{"text":"Prove the two directions. The forward one, from N z W to its interior being a neighbourhood of z, is the transitivity axiom trans at z and W.","status":"ok","from":0,"to":3},{"text":"For the converse, apply isotony from the interior to W. The neighbourhood hypothesis supplies the first factor, so it remains to show that the interior of W is contained in W.","status":"ok","from":4,"to":5},{"text":"After simplification the goal is that N y W implies W y for every point y. Fix y; this is the axiom refl at y and W.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.topology.topology.induced.induced_topology_T₀","base":"induced_topology_T₀","kind":"prf","start":163,"body":[164,171],"status":"ok","short":{"text":"The induced space is T₀: points with the same subset neighbourhoods are equal","status":"ok"},"proof":[{"text":"Take points x and y. Equality in the induced set means having the same predicate neighbourhoods, so the goal is that the same subset neighbourhoods give the same predicate neighbourhoods.","status":"ok","from":0,"to":2},{"text":"Fix a predicate W.","status":"ok","from":3,"to":4},{"text":"By [[AffineConstructive.topology.topology.induced.N_iff_pred_interior]], W is a neighbourhood of a point exactly when its interior is, so on both sides W may be replaced by its interior. The interior respects equality, so it is a subset of the induced set, and specialising the hypothesis at it closes the goal.","status":"ok","from":5,"to":7}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Topological spaces by neighbourhood relations: axioms, continuity classes, separation, products","summary":"This file sets up the interface for topological spaces, in terms of a neighbourhood relation x ⪽ U between points and subsets. A [[Topology]] requires that every neighbourhood contains its point, that neighbourhoods are closed upward and under finite meets, and that a neighbourhood of x is also a neighbourhood of every point near x. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the T₀ and Hausdorff separation axioms. It defines the classes of maps (continuous, continuously reflecting, initial, embedding, dense), the discrete and indiscrete structures, and the tensor and cartesian product topologies. The theory of these notions is developed in the files under topology/topology."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

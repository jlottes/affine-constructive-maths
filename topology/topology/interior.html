eighborhood X} := @func_make !(𝒫 X) Ω open set:(λ U : !(𝒫 X), interior U = U) .\nCanonical Structure closed_fun X {XN:Neighborhood X} := @func_make !(𝒫 X) Ω closed set:(λ U : !(𝒫 X), closure U = U) .\n\nImport image_notation.\n\nSection interior.\n  Context `{XN:Neighborhood X}.\n  Local Abbreviation int := (@interior X XN).\n\n  Context `{!Topology X}.\n\n  Definition interior_subset U : int U ⊆ U\n    := λ x, top_refl x U.\n\n  Lemma interior_order_preserving : OrderPreserving int.\n  Proof. apply alt_Build_OrderPreserving. intros U V.\n    change (U ⊆ V ⊸ ∏ x : X, x ⪽ U ⊸ x ⪽ V).\n    rew <-all_adj; intros x. rew <-(aprod_adj _ _ _).\n    rew (aprod_com _ _). exact (top_isotony x U V).\n  Qed.\n\n  Lemma interior_space : int (full_subset X) = full_subset X.\n  Proof. intros x. change (x ⪽ full_subset X ⧟ 𝐓). simplify.\n    exact (top_nullary_additivity x).\n  Qed.\n  \n  Lemma interior_empty : int ∅ = ∅.\n  Proof. rew <-(below_bottom _). exact (interior_subset _). Qed.\n\n  Local Open Scope subset_scope.\n  Lemma interior_intersection U V : int U ⨶ int V ⊆ int (U ⊓ V).\n  Proof. intros x.\n    change ((∐ y, x = y ⊠ (y ⪽ U ⊠ y ⪽ V)) ⊸ x ⪽ U ⊓ V). rew <-aex_adj; intros y.\n    rew (top_binary_additivity y U V), (aprod_adj _ _ _).\n    rew <-(aandr _ _ : (_ ⧟ _) ⊸ (y ⪽ U ⊓ V ⊸ x ⪽ U ⊓ V)).\n    exact (is_fun (ap2 nbrhood (U ⊓ V)) _ _).\n  Qed.\n\n  Local Instance interior_idempotent : Idempotent int.\n  Proof. intros U; change (int (int U) = int U). apply le_antisym; split.\n  + exact (interior_subset _).\n  + intros x. exact (top_trans x U).\n  Qed.\n\n  Definition interior_separation_T₀ `{!Separation_T₀ X} : ∀ x y : X, (∏ U, x ∊ int U ⧟ y ∊ int U) ⊸ x = y\n    := separation_T₀.\n\n  Definition interior_open U : open (int U) := idempotent int U.\n  \n  Lemma open_nbrhood (x:X) (U:𝒫 X) : x ∊ U ⊠ open U ⊸ x ⪽ U.\n  Proof. change (x ∊ U ⊠ interior U = U ⊸ x ⪽ U).\n    rew (is_fun set:(λ V, x ∊ V) (interior U) U : _ ⊸ x ⪽ U ⧟ x ∊ U).\n    full_tautological.\n  Qed.\nEnd interior.\n#[global] Hint Extern 2 (OrderPreserving interior) => simple notypeclasses refine interior_order_preserving : typeclass_instances.\n#[global] Hint Extern 2 (Idempotent interior) => simple notypeclasses refine interior_idempotent : typeclass_instances.\n#[global] Hint Extern 2 (apos (open (func_op interior _))) => simple notypeclasses refine (interior_open _) : typeclass_instances.\n#[global] Hint Extern 4 (apos (func_op interior ?M ≤ ?N)) => match M with N => simple notypeclasses refine (interior_subset _) end : typeclass_instances.\n\nSection closure.\n  Context `{XN:Neighborhood X}.\n  Local Abbreviation int := (@interior X XN).\n  Local Abbreviation cl := (@closure X XN).\n  Local Open Scope subset_scope.\n\n  Context `{!Topology X}.\n\n  Definition subset_closure U : U ⊆ cl U.\n  Proof. rew <-(order_reflecting_flip complement _ _).\n    change (int (U ᗮ)  ⊆ U ᗮ).\n    exact (interior_subset _).\n  Qed.\n\n  Lemma closure_order_preserving : OrderPreserving cl.\n  Proof. now unfold cl. Qed.\n\n  Lemma closure_empty : cl ∅ = ∅.\n  Proof. change ((int (full_subset X) ) ᗮ = (full_subset X) ᗮ). now rew interior_space. Qed.\n\n  Lemma closure_space : cl ⌈X⌉ = ⌈X⌉.\n  Proof. apply (above_top _). exact (subset_closure _). Qed.\n\n  Lemma closure_union U V : cl (U ⊔ V) ⊆ mult_union (cl U, cl V).\n  Proof. rew <-(order_reflecting_flip complement _ _).\n    change ((mult_union ((int U ᗮ) ᗮ, (int V ᗮ) ᗮ)) ᗮ ⊆ int (U ⊔ V) ᗮ).\n    rew (preserves_join_flip complement U V).\n    rew <-(interior_intersection _ _).\n    set (A := int U ᗮ). set (B := int V ᗮ).\n    clearbody A B. clear U V. full_tautological.\n  Qed.\n\n  Lemma closure_idempotent : Idempotent cl.\n  Proof. change (complement ∘ (int ∘ int) ∘ complement = cl).\n    now rew (idempotent int).\n  Qed.\n\n  Definition closure_closed U : closed (cl U) := closure_idempotent U.\n\n  Lemma open_complement_closed (U:𝒫 X) : open (U ᗮ) ⧟ closed U.\n  Proof. exact (injective_iff complement _ _). Qed.\n\n  Lemma closed_complement_open (U:𝒫 X) : closed (U ᗮ) ⧟ open U.\n  Proof. exact (injective_iff complement _ _). Qed.\nEnd closure.\n#[global] Hint Extern 2 (OrderPreserving closure) => simple notypeclasses refine closure_order_preserving : typeclass_instances.\n#[global] Hint Extern 2 (Idempotent closure) => simple notypeclasses refine closure_idempotent : typeclass_instances.\n#[global] Hint Extern 2 (apos (closed (func_op closure _))) => simple notypeclasses refine (closure_closed _) : typeclass_instances.\n#[global] Hint Extern 4 (apos (?N ≤ func_op closure ?M)) => match M with N => simple notypeclasses refine (subset_closure _) end : typeclass_instances.\n\nLocal Open Scope subset_scope.\n\nLemma in_closure `{@Topology X XN} (U : 𝒫 X) (x : X)\n  : (∏ N, x ⪽ N ⊸ ∐ z, z ∊ N ⊠ z ∊ U) ⊸ x ∊ closure U.\nProof. apply by_contrapositive.\n  change (x ⪽ U ᗮ ⊸ ∐ N, x ⪽ N ⊠ ∏ z, z ∊ N ⊸ z ∊ U ᗮ).\n  rew <-(aex_ub _ (U ᗮ)). now simplify.\nQed.\n\nLemma closure_meets `{@Topology X XN} (U V : 𝒫 X) (x : X)\n  : x ∊ closure U ⊠ x ⪽ V ⊸ ∐ z, z ∊ V ⊠ z ∊ U.\nProof. apply by_contrapositive.\n  change (V ⊆ U ᗮ ⊸ x ⪽ U ᗮ ⊞ anot (x ⪽ V) ).\n  rew (apar_com _ _).\n  change (V ⊆ U ᗮ ⊸ x ⪽ V ⊸ x ⪽ U ᗮ ).\n  rew <-(top_isotony x V (U ᗮ)). tautological.\nQed.\n\nLemma in_closure_meets `{@Topology X XN} (U : 𝒫 X) (x : X)\n  : x ∊ closure U ⧟ (∏ N, x ⪽ N ⊸ ∐ z, z ∊ N ⊠ z ∊ U).\nProof. split.\n+ rew <-all_adj. intros V. rew <-(aprod_adj _ _ _). exact (closure_meets _ _ _).\n+ exact (in_closure _ _).\nQed.\n\nLemma dense_meets `{@Topology X XN} (U V : 𝒫 X) (x : X) :\n  dense U → x ⪽ V ⊸ ∐ z, z ∊ V ⊠ z ∊ U.\nProof. intros HU. rew <-(closure_meets U V x). now rew HU, (aprod_true_l (_ : x ∊ ⊤)). Qed.\n\nLemma dense_order_preserving `{@Topology X NX} : OrderPreserving (dense (X:=X)).\nProof. apply alt_Build_OrderPreserving. intros U V.\n  change (U ⊆ V ⊸ (closure U = ⊤ ⊸ closure V = ⊤)).\n  rew (order_preserving closure U V).\n  rew <-(above_top _). rew <-(aprod_adj _ _ _), (aprod_com _ _).\n  now apply transitivity.\nQed.\n#[global] Hint Extern 2 (OrderPreserving dense) => simple notypeclasses refine dense_order_preserving : typeclass_instances.\n\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":29,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":35,"messages":[],"goals":null},{"i":5,"s":242,"e":277,"kind":"vernac","status":"ok","ms":19,"messages":[],"goals":null},{"i":6,"s":278,"e":344,"kind":"vernac","status":"ok","ms":39,"messages":[],"goals":null},{"i":7,"s":345,"e":381,"kind":"vernac","status":"ok","ms":14,"messages":[],"goals":null},{"i":8,"s":382,"e":429,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":9,"s":430,"e":467,"kind":"vernac","status":"ok","ms":14,"messages":[],"goals":null},{"i":10,"s":469,"e":501,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":11,"s":503,"e":537,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":12,"s":538,"e":655,"kind":"vernac","status":"ok","ms":93,"messages":["bffcea86518b8b54"],"goals":null},{"i":13,"s":656,"e":776,"kind":"vernac","status":"ok","ms":59,"messages":["95da1417fa06330b"],"goals":null},{"i":14,"s":778,"e":800,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":15,"s":802,"e":819,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":16,"s":822,"e":851,"kind":"vernac","status":"ok","ms":11,"messages":["5b668d3316f37158","b48724192582d1cc"],"goals":null},{"i":17,"s":854,"e":897,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":18,"s":901,"e":924,"kind":"vernac","status":"ok","ms":13,"mes tive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6364,"e":6367,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6385,"e":6388,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6429,"e":6432,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"This file develops the basic algebra of the interior and closure operators that a topology determines from its neighbourhood relation. The interior is contained in its argument, is monotone and idempotent, and preserves the full subset and the empty subset. It also sends the multiplicative intersection of two interiors into the interior of their meet. As a consequence, interiors are open, and an open subset is a neighbourhood of each of its points. The closure, defined as the complement of the interior of the complement, has the dual properties, which follow by complementation: it contains its argument, is idempotent, and sends a join into the multiplicative union of the closures. A subset is open exactly when its complement is closed, and conversely. The file ends with the neighbourhood characterisation of the closure, that x is in the closure of U if and only if every neighbourhood of x meets U, and its consequences for dense subsets. These results are used by the files on continuity, uniform spaces and completions.","short":"Interior and closure in a topological space: basic laws, open and closed subsets, density","items":[{"name":"AffineConstructive.topology.topology.interior.open_fun","base":"open_fun","kind":"def","start":12,"body":null,"status":"ok","short":{"text":"Openness as a function from subsets of X, affirmed, to affine propositions","status":"ok"},"long":{"text":"Packages the predicate [[AffineConstructive.topology.interfaces.topology.open]] as a function of sets !(𝒫 X) ⇾ Ω. It sends U to the proposition that the interior of U equals U. It is declared canonical, so the development can rewrite by an equality of subsets under `open` the same way it rewrites under any function.\n\nThe domain is the of-course powerset !(𝒫 X), not 𝒫 X. The subset U occurs twice in the condition, inside the interior and on its own. To preserve equality, the map must therefore be able to use an equality U = U' twice, and only an affirmed equality allows that.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.interior.closed_fun","base":"closed_fun","kind":"def","start":13,"body":null,"status":"ok","short":{"text":"Closedness as a function from subsets of X, affirmed, to affine propositions","status":"ok"},"long":{"text":"Packages the predicate [[AffineConstructive.topology.interfaces.topology.closed]] as a function of sets !(𝒫 X) ⇾ Ω. It sends U to the proposition that the closure of U equals U. Like [[AffineConstructive.topology.topology.interior.open_fun]], it is declared canonical so that rewriting by an equality of subsets reaches under `closed`. The domain is the of-course powerset for the same reason: U occurs twice in the condition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.interior.interior_subset","base":"interior_subset","kind":"def","start":19,"body":null,"status":"ok","short":{"text":"The interior of U is contained in U","status":"ok"},"long":{"text":"Every point of the interior of U lies in U. This is the reflexivity axiom of a topology, [[AffineConstructive.topology.interfaces.topology.top_refl]], read pointwise: a neighbourhood of x contains x. A hint registers it so that typeclass resolution finds the inclusion of interior U in U whenever a proof needs it. The dual statement for the closure is [[AffineConstructive.topology.topology.interior.subset_closure]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.interior.interior_order_preserving","base":"interior_order_preserving","kind":"prf","start":20,"body":[21,29],"status":"ok","short":{"text":"The interior is monotone: U ⊆ V implies interior U ⊆ interior V","status":"ok"},"proof":[{"text":"For a map between posets it suffices to show that it preserves the order. So fix subsets U and V of X and show that U ⊆ V implies interior U ⊆ interior V.","status":"ok","from":0,"to":2},{"text":"Inclusion of interiors means that every neighbourhood of a point as U is also one as V. Fix the point x; it remains to show that U ⊆ V implies that x ⪽ U implies x ⪽ V.","status":"ok","from":3,"to":4},{"text":"After rearranging, the hypotheses are x ⪽ U ⊠ U ⊆ V. This is the isotony axiom of a topology: a subset containing a neighbourhood of x is itself a neighbourhood of x.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.topology.interior.interior_space","base":"interior_space","kind":"prf","start":30,"body":[31,36],"status":"ok","short":{"text":"The interior of the full subset is the full subset","status":"ok"},"proof":[{"text":"Two subsets are equal when they have the same members. Fix x. Every x is in the full subset, so it remains to show that the full subset is a neighbourhood of x.","status":"ok","from":0,"to":3},{"text":"The axiom of a topology for the empty meet says exactly this: the full subset is a neighbourhood of every point.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.topology.interior.interior_empty","base":"interior_empty","kind":"prf","start":37,"body":[38,41],"status":"ok","short":{"text":"The interior of the empty subset is empty","status":"ok"},"proof":[{"text":"∅ is the bottom of the lattice of subsets, so a subset equals ∅ exactly when it is contained in ∅. It remains to show that the interior of ∅ is contained in ∅.","status":"ok","from":0,"to":1},{"text":"The interior of any subset is contained in that subset, by [[AffineConstructive.topology.topology.interior.interior_subset]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.topology.interior.interior_intersection","base":"interior_intersection","kind":"prf","start":43,"body":[44,51],"status":"ok","short":{"text":"The multiplicative intersection of interior U and interior V is contained in the interior of U ⊓ V","status":"ok"},"proof":[{"text":"Fix x. Membership of x in the multiplicative intersection of the interiors says that there is a y with x = y ⊠ y ⪽ U ⊠ y ⪽ V. Let y be such a point.","status":"ok","from":0,"to":3},{"text":"The axiom of a topology for binary meets turns y ⪽ U ⊠ y ⪽ V into y ⪽ U ⊓ V, and currying leaves the task of showing that x = y implies that y ⪽ U ⊓ V implies x ⪽ U ⊓ V.","status":"ok","from":4,"to":4},{"text":"It is enough to show that x = y implies the equivalence of x ⪽ U ⊓ V and y ⪽ U ⊓ V, and then use one of its two directions. This equivalence holds because the neighbourhood relation, taken at the fixed subset U ⊓ V, is a function of the point and so preserves equality ([[AffineConstructive.interfaces.set.is_fun]]).","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.topology.interior.interior_idempotent","base":"interior_idempotent","kind":"inst","start":52,"body":[53,61],"status":"ok","short":{"text":"The interior is idempotent: the interior of the interior of U is the interior of U","status":"ok"},"proof":[{"text":"Fix U. By antisymmetry of inclusion, it suffices to prove the two inclusions between the interior of the interior of U and the interior of U.","status":"ok","from":0,"to":2},{"text":"The interior of the interior of U is contained in the interior of U, since every interior is contained in its argument ([[AffineConstructive.topology.topology.interior.interior_subset]]).","status":"ok","from":3,"to":4},{"text":"For the reverse inclusion, fix x. Suppose U is a neighbourhood of x; then the interior of U must also be a neighbourhood of x. This is the transitivity axiom of a topology.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.topology.interior.interior_separation_T₀","base":"interior_separation_T₀","kind":"def","start":62,"body":null,"status":"ok","short":{"text":"In a T₀ space, points lying in the same interiors are equal","status":"ok"},"long":{"text":"This restates the T₀ separation axiom [[AffineConstructive.topology.interfaces.topology.separation_T₀]] in terms of the interior operator. Being in the interior of U is, by definition, having U as a neighbourhood. So two points x and y that, for every subset U, are in the interior of U if and only if the other is, are equal. The equivalence is the affine ⧟ and the quantifier is the affine ∏, so the statement carries its dual as well: points that are apart are separated by some subset whose interior holds one and not the other.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.interior.interior_open","base":"interior_open","kind":"def","start":63,"body":null,"status":"ok","short":{"text":"The interior of every subset is open","status":"ok"},"long":{"text":"Openness of a subset means that its interior equals it. For the interior of U, this is idempotence of the interior ([[AffineConstructive.topology.topology.interior.interior_idempotent]]) at U. A hint registers it, so resolution discharges the openness of any interior on its own.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.interior.open_nbrhood","base":"open_nbrhood","kind":"prf","start":64,"body":[65,69],"status":"ok","short":{"text":"An open subset is a neighbourhood of each of its points","status":"ok"},"proof":[{"text":"A subset U is open when its interior equals U, so the hypotheses are x ∊ U together with that equality.","status":"ok","from":0,"to":1},{"text":"Membership of x is a function of the subset, so the equality between the interior of U and U gives the equivalence of x ⪽ U and x ∊ U ([[AffineConstructive.interfaces.set.is_fun]]). With x ∊ U in hand, the direction from x ∊ U to x ⪽ U finishes the proof, by propositional reasoning alone.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.topology.interior.int","base":"int","kind":"abbrev","start":77,"body":null,"status":"ok","short":{"text":"Local shorthand for the interior operator of the neighbourhood structure on X","status":"ok"},"long":{"text":"Inside the section on the interior, `int` stands for [[AffineConstructive.topology.interfaces.topology.interior]] taken at the neighbourhood structure on X. The section's statements, such as idempotence of the interior, mention the operator itself rather than its value at a subset, and the shorthand fixes the structure once for all of them. It is local and not visible outside the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.interior.cl","base":"cl","kind":"abbrev","start":78,"body":null,"status":"ok","short":{"text":"Local shorthand for the closure operator of the neighbourhood structure on X","status":"ok"},"long":{"text":"Inside the section on the closure, `cl` stands for [[AffineConstructive.topology.interfaces.topology.closure]] taken at the neighbourhood structure on X. It sits alongside `int` for the interior, so the statements and proofs can unfold the closure into the complement of the interior of the complement. It is local and not visible outside the file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.interior.subset_closure","base":"subset_closure","kind":"def","start":81,"body":[82,86],"status":"ok","short":{"text":"Every subset is contained in its closure","status":"ok"},"proof":[{"text":"The complement reverses inclusion and reflects it ([[AffineConstructive.orders.subset.complement_order_embedding_flip]]), so it suffices to show that the complement of the closure of U is contained in Uᗮ.","status":"ok","from":0,"to":1},{"text":"By definition the closure is the complement of the interior of the complement, so the complement of cl U is the interior of Uᗮ. That an interior lies inside its argument, [[AffineConstructive.topology.topology.interior.interior_subset]], finishes the proof.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.topology.interior.closure_order_preserving","base":"closure_order_preserving","kind":"prf","start":87,"body":[88,90],"status":"ok","short":{"text":"The closure is monotone: U ⊆ V implies closure U ⊆ closure V","status":"ok"},"proof":[{"text":"The closure is the composite of complement, interior and complement. The complement reverses inclusion and the interior preserves it ([[AffineConstructive.topology.topology.interior.interior_order_preserving]]). Two order reversals compose to a map that preserves the order.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.interior.closure_empty","base":"closure_empty","kind":"prf","start":91,"body":[92,95],"status":"ok","short":{"text":"The closure of the empty subset is empty","status":"ok"},"proof":[{"text":"The complement of ∅ is the full subset, so the closure of ∅ is the complement of the interior of the full subset, and ∅ is the complement of the full subset.","status":"ok","from":0,"to":1},{"text":"The interior of the full subset is the full subset ([[AffineConstructive.topology.topology.interior.interior_space]]), and with this the two sides agree.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.topology.interior.closure_space","base":"closure_space","kind":"prf","start":96,"body":[97,100],"status":"ok","short":{"text":"The closure of the full subset is the full subset","status":"ok"},"proof":[{"text":"The full subset is the top of the lattice of subsets, and a subset equals the top exactly when the top is contained in it. It remains to show that the full subset is contained in its closure.","status":"ok","from":0,"to":1},{"text":"Every subset is contained in its closure, by [[AffineConstructive.topology.topology.interior.subset_closure]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.topology.interior.closure_union","base":"closure_union","kind":"prf","start":101,"body":[102,112],"status":"ok","short":{"text":"The closure of U ⊔ V is contained in the multiplicative union of the closures of U and V","status":"ok"},"proof":[{"text":"Pass to complements, which reflect inclusion in reverse. The goal becomes that the complement of the multiplicative union of the two closures lies in the complement of cl (U ⊔ V). Unfolding the closure, that complement is the interior of (U ⊔ V)ᗮ, and each closure is the complement of an interior.","status":"ok","from":0,"to":2},{"text":"The complement takes the join to the meet, so (U ⊔ V)ᗮ = Uᗮ ⊓ Vᗮ, and the interior respects this equality because it is monotone.","status":"ok","from":3,"to":3},{"text":"By [[AffineConstructive.topology.topology.interior.interior_intersection]], the multiplicative intersection of int Uᗮ and int Vᗮ is contained in int (Uᗮ ⊓ Vᗮ). By transitivity it now suffices to reach that multiplicative intersection.","status":"ok","from":4,"to":4},{"text":"Write A and B for the two interiors and forget what they are. The remaining claim, that the complement of the multiplicative union of Aᗮ and Bᗮ lies in the multiplicative intersection of A and B, is a De Morgan law for arbitrary subsets. It holds by propositional reasoning on membership alone.","status":"ok","from":5,"to":10}]},{"name":"AffineConstructive.topology.topology.interior.closure_idempotent","base":"closure_idempotent","kind":"prf","start":113,"body":[114,117],"status":"ok","short":{"text":"The closure is idempotent: the closure of the closure of U is the closure of U","status":"ok"},"proof":[{"text":"The closure is the complement, then the interior, then the complement. Composing it with itself places two complements side by side, and they cancel. What remains to show is that the complement, then the interior applied twice, then the complement, equals the closure.","status":"ok","from":0,"to":1},{"text":"The interior is idempotent ([[AffineConstructive.topology.topology.interior.interior_idempotent]]), so int ∘ int collapses to int and both sides become the closure.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.topology.interior.closure_closed","base":"closure_closed","kind":"def","start":118,"body":null,"status":"ok","short":{"text":"The closure of every subset is closed","status":"ok"},"long":{"text":"Closedness of a subset means that its closure equals it. For the closure of U, this is idempotence of the closure ([[AffineConstructive.topology.topology.interior.closure_idempotent]]) at U. A hint registers it, so resolution discharges the closedness of any closure on its own.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.interior.open_complement_closed","base":"open_complement_closed","kind":"prf","start":119,"body":[120,122],"status":"ok","short":{"text":"The complement of U is open if and only if U is closed","status":"ok"},"proof":[{"text":"That Uᗮ is open says the interior of Uᗮ equals Uᗮ. That U is closed says the complement of that same interior equals U. The complement is an involution and therefore injective ([[AffineConstructive.orders.subset.complement_involutive]]), so the two equalities are equivalent by [[AffineConstructive.theory.set.injective_iff]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.interior.closed_complement_open","base":"closed_complement_open","kind":"prf","start":123,"body":[124,126],"status":"ok","short":{"text":"The complement of U is closed if and only if U is open","status":"ok"},"proof":[{"text":"That Uᗮ is closed says the complement of the interior of Uᗮᗮ equals Uᗮ. That U is open says the interior of U equals U. Since Uᗮᗮ is U and the complement is injective, being an involution ([[AffineConstructive.orders.subset.complement_involutive]]), the two equalities are equivalent by [[AffineConstructive.theory.set.injective_iff]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.interior.in_closure","base":"in_closure","kind":"prf","start":133,"body":[134,139],"status":"ok","short":{"text":"If every neighbourhood of x meets U, then x is in the closure of U","status":"ok"},"proof":[{"text":"Argue by contraposition. If x is not in the closure of U, the goal is a neighbourhood N of x such that every point is outside N or outside U.","status":"ok","from":0,"to":1},{"text":"Not lying in the closure of U means that Uᗮ is a neighbourhood of x. The condition on N can be read as the inclusion of N in Uᗮ: every z in N lies in Uᗮ.","status":"ok","from":2,"to":2},{"text":"Take Uᗮ itself as the witness. The hypothesis supplies the neighbourhood, and the inclusion of Uᗮ in itself holds trivially.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.topology.topology.interior.closure_meets","base":"closure_meets","kind":"prf","start":140,"body":[141,148],"status":"ok","short":{"text":"A point of the closure of U and a neighbourhood V of it give a point of V in U","status":"ok"},"proof":[{"text":"Argue by contraposition. Assume every point lies outside V or outside U. The goal is that x is not in the closure of U, or V is not a neighbourhood of x (a par).","status":"ok","from":0,"to":1},{"text":"The assumption is the inclusion V ⊆ Uᗮ, and not lying in the closure of U means that Uᗮ is a neighbourhood of x. After commuting the par, the goal reads: if V is a neighbourhood of x, so is Uᗮ.","status":"ok","from":2,"to":4},{"text":"This is the isotony of the neighbourhood relation: a neighbourhood V of x, together with V ⊆ Uᗮ, gives that Uᗮ is a neighbourhood of x. Each hypothesis is used exactly once.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.topology.interior.in_closure_meets","base":"in_closure_meets","kind":"prf","start":149,"body":[150,159],"status":"ok","short":{"text":"x is in the closure of U if and only if every neighbourhood of x meets U","status":"ok"},"proof":[{"text":"Prove the two directions separately.","status":"ok","from":0,"to":1},{"text":"For the forward direction, fix a subset V. After uncurrying, the goal is that a point of the closure of U, together with a neighbourhood V of it, gives a point of V in U. This is [[AffineConstructive.topology.topology.interior.closure_meets]].","status":"ok","from":2,"to":6},{"text":"The converse is [[AffineConstructive.topology.topology.interior.in_closure]].","status":"ok","from":7,"to":9}]},{"name":"AffineConstructive.topology.topology.interior.dense_meets","base":"dense_meets","kind":"prf","start":160,"body":[161,165],"status":"ok","short":{"text":"Every neighbourhood of a point meets a dense subset","status":"ok"},"proof":[{"text":"Assume U is dense. By [[AffineConstructive.topology.topology.interior.closure_meets]], it suffices to show that x lies in the closure of U, alongside the given neighbourhood V of x.","status":"ok","from":0,"to":2},{"text":"Density says the closure of U is the full subset, so x is in it, and the true factor drops out of the tensor ([[AffineConstructive.logic.aprop.aprod_true_l]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.topology.interior.dense_order_preserving","base":"dense_order_preserving","kind":"prf","start":166,"body":[167,175],"status":"ok","short":{"text":"Density is monotone: a subset containing a dense subset is dense","status":"ok"},"proof":[{"text":"Fix subsets U and V. It suffices to show that U ⊆ V implies that the density of U implies the density of V, that is, closure U = ⊤ implies closure V = ⊤.","status":"ok","from":0,"to":3},{"text":"Since the closure is monotone ([[AffineConstructive.topology.topology.interior.closure_order_preserving]]), the inclusion U ⊆ V gives closure U ⊆ closure V. An equality with the full subset is the same as containing it ([[AffineConstructive.orders.lattices.above_top]]).","status":"ok","from":4,"to":5},{"text":"After uncurrying and reordering the factors, ⊤ ⊆ closure U and closure U ⊆ closure V give ⊤ ⊆ closure V by transitivity.","status":"ok","from":6,"to":8}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Neighbourhood topologies: axioms, interior and closure, separation, continuous, reflecting and dense maps, products","summary":"The interface for topological spaces, given by a neighbourhood relation. A [[Neighborhood]] on a set X is a function x ⪽ U from X ⊗ 𝒫 X to affine propositions, and [[Topology]] states the neighbourhood axioms for it: a neighbourhood contains its point, the relation is upward closed, the full subset is a neighbourhood, binary meets of neighbourhoods are neighbourhoods, and a neighbourhood U is a neighbourhood of the set of points of which U is a neighbourhood. From the relation the file defines [[interior]], [[closure]], open, closed and dense subsets, neighbourhood bases, and the separation axioms [[Separation_T₀]] and [[Hausdorff]]. It sets out the classes of maps used throughout the topology files: [[Continuous]], the reflecting class [[ContinuouslyReflecting]], the two together as [[ContinuouslyInitial]], [[ContinuouslyEmbedding]] and [[Dense]]. It also gives the discrete and indiscrete structures and the two product topologies, the tensor product by a neighbourhood basis and the cartesian product by its universal property. The topological lemmas live in the files under topology/topology, and the uniform and bornological interfaces build on these classes."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

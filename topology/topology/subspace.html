uire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.topology interfaces.reflection_pair.\nRequire Import theory.set orders.orders orders.maps orders.subset theory.lattices orders.lattices.\nRequire Import orders.subset_images.\nRequire Import topology.base topology.interior topology.maps.\nRequire Import reflection_pair.base.\nRequire Import easy rewrite simplify tactics.misc.\n\nImport image_notation.\nLocal Open Scope op_scope.\nLocal Open Scope topology_scope.\n\n(** Initial (pullback) topology: the coarsest topology on [X] making [f]\n    continuous.  [U] is a neighborhood of [x] iff [∀.[f] U] is a\n    neighborhood of [f x], equivalently iff some neighborhood of [f x]\n    pulls back into [U] ([pullback_neighborhood_ex]).  With this form\n    continuous reflection of [f] is definitional.  The Joy-of-Cats initial\n    lift; the topological analogue of [uniform/subspace.v]'s\n    [pullback_uniformity]. *)\nDefinition pullback_neighborhood@{u} {X:set@{u}} `{NY:Neighborhood@{u} Y} (f:X ⇾ Y) : Neighborhood X\n  := set:(λ '(x, U) : X ⊗ (𝒫 X), f x ⪽ ∀.[f] U).\n\nSection pullback_topology.\n  Universes u.\n  Context {X Y:set@{u}} `{@Topology Y NY} {f:X ⇾ Y}.\n  Local Abbreviation NX := (@pullback_neighborhood X Y NY f).\n  #[local] Hint Extern 0 (Neighborhood X) => exact NX : typeclass_instances.\n\n  Local Ltac unfold_N := change (func_op (nbrhood (X:=X)) (?x, ?U)) with (f x ⪽ ∀.[f] U).\n\n  Local Instance pullback_topology : Topology X.\n  Proof. apply Build_Topology.\n  - intros x U. unfold_N. rew (top_refl (f x) _). exact (universal_image_counit f U x).\n  - intros x U V. unfold_N. rew (order_preserving ∀.[f] U V). exact (top_isotony _ _ _).\n  - intros x. unfold_N. rew (preserves_top ∀.[f]). exact (top_nullary_additivity _).\n  - intros x U V. unfold_N. rew (preserves_meet ∀.[f] U V). exact (top_binary_additivity _ _ _).\n  - intros x U. unfold_N.\n    change (f x ⪽ ∀.[f] U ⊸ f x ⪽ ∀.[f] (f* {y:Y | y ⪽ ∀.[f] U})).\n    rew <-(universal_image_unit f _). exact (top_trans _ _).\n  Qed.\n\n  Local Instance pullback_neighborhood_continuous : Continuous f.\n  Proof. split; try exact _. intros x N. unfold_N.\n    now rew <-(universal_image_unit f N).\n  Qed.\n\n  Local Instance pullback_neighborhood_initial : ContinuouslyInitial f.\n  Proof. split; try exact _. split; try exact _. now intros x U. Qed.\n\n  Lemma pullback_neighborhood_ex x U : x ⪽ U ⧟ ∐ N:𝒫 Y, f x ⪽ N ⊠ f* N ⊆ U.\n  Proof. split.\n  + unfold_N. now rew <-(aex_ub _ (∀.[f] U)), (aprod_true_r (universal_image_counit f U)).\n  + unfold_N. rew <-aex_adj; intros N. rew (preimage_universal_image_adj f U N). exact (top_isotony _ _ _).\n  Qed.\nEnd pullback_topology.\n#[global] Hint Extern 2 (@Topology _ (pullback_neighborhood _)) => simple notypeclasses refine pullback_topology : typeclass_instances.\n\n#[global] Hint Extern 0 (Cleavage 𝐀𝐓𝐨𝐩) => exact @pullback_neighborhood : typeclass_instances.\n\nLemma atop_cloven : ClovenPair 𝐀𝐓𝐨𝐩.\nProof. esplit. intros X Y f NY HY. exact pullback_neighborhood_initial. Qed.\n#[global] Hint Extern 0 (ClovenPair 𝐀𝐓𝐨𝐩) => exact atop_cloven : typeclass_instances.\n#[global] Hint Extern 0 (SaturatedPair 𝐀𝐓𝐨𝐩) => exact atop_cloven : typeclass_instances.\n\n\n\n(** [ContinuouslyInitial] is the Joy-of-Cats (AHS) initial morphism for the\n    forgetful functor to [Set], with the initial (pullback) topology as test\n    object. *)\nLemma continuously_initial_alt@{u} `{@Topology@{u} X NX, @Topology@{u} Y NY} (f:X ⇾ Y)\n  : ContinuouslyInitial f ↔\n    (∀ (Z:set@{u}) (NZ:Neighborhood Z), Topology Z → ∀ (g:Z ⇾ X),\n       Continuous (f ∘ g) ↔ Continuous g).\nProof. exact (ini_lift_alt (C:=𝐀𝐓𝐨𝐩) f). Qed.\n\nLemma continuously_initial_alt2@{u} `{Hf:@Continuous@{u} X Y NX NY f}\n  : ContinuouslyInitial f ↔\n    (∀ (Z:set@{u}) (NZ:Neighborhood Z), Topology Z → ∀ (g:Z ⇾ X),\n       Continuous (f ∘ g) → Continuous g).\nProof. exact (ini_lift_a write.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1959,"e":1967,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":1969,"e":1972,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2054,"e":2062,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":2135,"e":2138,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2307,"e":2315,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":2321,"e":2324,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2325,"e":2328,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2488,"e":2491,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2607,"e":2615,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":2617,"e":2620,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2621,"e":2624,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2698,"e":2706,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":2708,"e":2711,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2733,"e":2736,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file builds the initial topology along a function f : X ⇾ Y into a topological space. A subset U of X is a neighbourhood of x when the universal image ∀.[f] U is a neighbourhood of f x. The file shows that this relation is a topology, that f is continuous and continuously initial for it, and that it can be described equivalently by a neighbourhood of f x whose preimage lies in U. It registers this construction as the cleavage of the reflection pair 𝐀𝐓𝐨𝐩, which makes topological spaces a cloven, and so saturated, pair. From the general theory of reflection pairs it then derives two characterisations of continuously initial maps: f is initial if and only if, for every g into X, f ∘ g is continuous exactly when g is; and when f is already continuous, if and only if continuity of f ∘ g implies continuity of g.","short":"The initial (pulled-back) topology along a map, and initial maps of topological spaces","items":[{"name":"AffineConstructive.topology.topology.subspace.pullback_neighborhood","base":"pullback_neighborhood","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"The initial (pulled-back) neighbourhood relation on X along a map f : X ⇾ Y","status":"ok"},"long":{"text":"Given a neighbourhood relation on Y and a function f : X ⇾ Y, a subset U of X is declared a neighbourhood of x when the universal image ∀.[f] U is a neighbourhood of f x. The universal image is right adjoint to preimage: it is the largest subset of Y whose preimage lies in U. So the definition says that the largest set pulling back into U is a neighbourhood of f x. When Y is a topology, isotony makes this equivalent to the traditional description, that some neighbourhood of f x has its preimage inside U ([[AffineConstructive.topology.topology.subspace.pullback_neighborhood_ex]]). This is the initial topology induced by f: the coarsest one making f continuous. When f is an inclusion, it is the subspace topology.\n\nThe definition uses the universal image rather than the existential form because it then states the neighbourhood relation as a single affine proposition about f x with no quantifier over subsets of Y. As a result, the reflecting half of initiality holds by definition: the proof of [[AffineConstructive.topology.topology.subspace.pullback_neighborhood_initial]] has nothing to do. The section shows that the relation satisfies the topology axioms whenever Y's does ([[AffineConstructive.topology.topology.subspace.pullback_topology]]), and that f is continuous ([[AffineConstructive.topology.topology.subspace.pullback_neighborhood_continuous]]) and continuously initial for it. The file then registers it as the cleavage of the reflection pair [[AffineConstructive.topology.topology.maps.𝐀𝐓𝐨𝐩]], and [[AffineConstructive.topology.topology.subspace.atop_cloven]] uses it to show that this pair is cloven.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.subspace.NX","base":"NX","kind":"abbrev","start":18,"body":null,"status":"ok","short":{"text":"Local name for the pulled-back neighbourhood relation on X within the section","status":"ok"},"long":{"text":"Inside the section on the pullback topology, NX abbreviates [[AffineConstructive.topology.topology.subspace.pullback_neighborhood]] at the section's f, X and Y. A local hint makes it the neighbourhood relation that resolution finds on X, so the statements of the section can refer to neighbourhoods in X without naming the relation. It has no existence outside the section.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.subspace.unfold_N","base":"unfold_N","kind":"ltac","start":20,"body":null,"status":"ok","short":{"text":"Rewrites a pulled-back neighbourhood statement x ⪽ U as f x ⪽ ∀.[f] U","status":"ok"},"long":{"text":"A tactic local to the section on the pulled-back topology. It finds the neighbourhood relation of X applied to a pair (x, U) anywhere in the goal and replaces it with its definition, the statement that the universal image ∀.[f] U is a neighbourhood of f x. It takes no arguments, and the replacement holds by definition, so it changes only how the goal is displayed. The section's proofs open with it so that the laws of Y's topology and the preimage–universal image adjunction can rewrite the goal at once. A plain unfolding would also expose the subset-comprehension machinery behind the definition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.subspace.pullback_topology","base":"pullback_topology","kind":"inst","start":21,"body":[22,50],"status":"ok","short":{"text":"The pulled-back neighbourhood relation on X satisfies the topology axioms when Y's does","status":"ok"},"proof":[{"text":"There are five axioms to check for the pulled-back relation: a neighbourhood contains its point, a superset of a neighbourhood is one, the whole set is a neighbourhood, the meet of two neighbourhoods is one, and the points of which U is a neighbourhood form a neighbourhood. Each one comes from the matching axiom of Y, carried across by the universal image ∀.[f].","status":"ok","from":0,"to":1},{"text":"Fix x and U. By definition x ⪽ U says that ∀.[f] U is a neighbourhood of f x, so f x lies in ∀.[f] U. Then x lies in f* (∀.[f] U), which is contained in U by the counit [[AffineConstructive.orders.subset_images.universal_image_counit]].","status":"ok","from":2,"to":6},{"text":"Fix x, U and V. The universal image preserves inclusion ([[AffineConstructive.orders.subset_images.universal_image_mono]]), so U ⊆ V gives ∀.[f] U ⊆ ∀.[f] V. Isotony in Y then makes ∀.[f] V a neighbourhood of f x.","status":"ok","from":7,"to":11},{"text":"Fix x. The universal image of the whole of X is the whole of Y ([[AffineConstructive.interfaces.abstract_algebra.preserves_top]]), and the whole of Y is a neighbourhood of f x.","status":"ok","from":12,"to":16},{"text":"Fix x, U and V. The universal image preserves binary meets ([[AffineConstructive.theory.lattices.preserves_meet]]), so ∀.[f] (U ⊓ V) is ∀.[f] U ⊓ ∀.[f] V. In Y the meet of two neighbourhoods of f x is a neighbourhood of f x.","status":"ok","from":17,"to":21},{"text":"Fix x and U. The points of X of which U is a neighbourhood are, by definition, the preimage under f of the set of points y of Y of which ∀.[f] U is a neighbourhood. By the unit [[AffineConstructive.orders.subset_images.universal_image_unit]] that set of points of Y is contained in the universal image of its own preimage. So by isotony it is enough to show that this set is itself a neighbourhood of f x.","status":"ok","from":22,"to":26},{"text":"That is the last axiom of Y, applied to the neighbourhood ∀.[f] U of f x.","status":"ok","from":27,"to":28}]},{"name":"AffineConstructive.topology.topology.subspace.pullback_neighborhood_continuous","base":"pullback_neighborhood_continuous","kind":"inst","start":51,"body":[52,57],"status":"ok","short":{"text":"f is continuous for the pullback topology on its domain","status":"ok"},"proof":[{"text":"Resolution supplies the topologies on X and Y. What remains of continuity is that the preimage of a neighbourhood of f x is a neighbourhood of x.","status":"ok","from":0,"to":1},{"text":"Fix x and N. By definition the goal asks that ∀.[f] (f* N) be a neighbourhood of f x. The unit [[AffineConstructive.orders.subset_images.universal_image_unit]] gives N ⊆ ∀.[f] (f* N), so this follows from N being a neighbourhood of f x, by isotony.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.topology.topology.subspace.pullback_neighborhood_initial","base":"pullback_neighborhood_initial","kind":"inst","start":58,"body":[59,63],"status":"ok","short":{"text":"f is continuously initial for the pullback topology on its domain","status":"ok"},"proof":[{"text":"Continuity of f was proved in [[AffineConstructive.topology.topology.subspace.pullback_neighborhood_continuous]], and resolution supplies the topologies. So being continuously initial reduces to being continuously reflecting, and that in turn to the reflection condition on neighbourhoods.","status":"ok","from":0,"to":2},{"text":"Once x and U are fixed, the reflection condition is the definition of the pulled-back relation itself: its premise and its conclusion are the same statement.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.topology.subspace.pullback_neighborhood_ex","base":"pullback_neighborhood_ex","kind":"prf","start":64,"body":[65,75],"status":"ok","short":{"text":"Under the pulled-back topology, x ⪽ U if and only if some neighbourhood of f x has preimage inside U","status":"ok"},"proof":[{"text":"The equivalence is proved one direction at a time.","status":"ok","from":0,"to":1},{"text":"Suppose x ⪽ U, which by definition says that ∀.[f] U is a neighbourhood of f x. Take ∀.[f] U as the witness. Its preimage lies in U by the counit [[AffineConstructive.orders.subset_images.universal_image_counit]], a fact that needs no hypothesis, so the neighbourhood condition is the only factor left and the hypothesis supplies it.","status":"ok","from":2,"to":4},{"text":"Conversely, the goal is that ∀.[f] U is a neighbourhood of f x. Let N be the neighbourhood of f x that the hypothesis provides, together with the inclusion f* N ⊆ U.","status":"ok","from":5,"to":7},{"text":"By the adjunction [[AffineConstructive.orders.subset_images.preimage_universal_image_adj]], the inclusion f* N ⊆ U is equivalent to N ⊆ ∀.[f] U. Isotony in Y applied to N then makes ∀.[f] U a neighbourhood of f x. Each of the two factors is used once.","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.topology.topology.subspace.atop_cloven","base":"atop_cloven","kind":"prf","start":79,"body":[80,84],"status":"ok","short":{"text":"Topological spaces form a cloven reflection pair, with the pullback topology as cleavage","status":"ok"},"proof":[{"text":"Topological spaces already form a reflection pair. A cleavage asks, for every map into a topological space, for a topology on its domain that makes the map initial.","status":"ok","from":0,"to":1},{"text":"Given f : X ⇾ Y and a topology on Y, the pullback topology on X makes f continuously initial ([[AffineConstructive.topology.topology.subspace.pullback_neighborhood_initial]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.topology.subspace.continuously_initial_alt","base":"continuously_initial_alt","kind":"prf","start":87,"body":[88,90],"status":"ok","short":{"text":"f is continuously initial iff, for every g into X, f ∘ g is continuous iff g is","status":"ok"},"proof":[{"text":"This is the general characterisation [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt]] of initial maps in a cloven reflection pair, applied to topological spaces, which form one by [[AffineConstructive.topology.topology.subspace.atop_cloven]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.subspace.continuously_initial_alt2","base":"continuously_initial_alt2","kind":"prf","start":91,"body":[92,94],"status":"ok","short":{"text":"For continuous f: f is continuously initial iff g is continuous whenever f ∘ g is","status":"ok"},"proof":[{"text":"This is the general characterisation [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt2]] of initial maps among forward maps in a cloven reflection pair, applied to topological spaces, which form one by [[AffineConstructive.topology.topology.subspace.atop_cloven]].","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions, products, sums and the classes of equality","summary":"The file sets up the basic objects of the development. An affine set ([[set]]) is a type with an equality valued in affine propositions that is an equivalence. Functions X ⇾ Y ([[func_set]]) are maps that preserve equality, x₁ = x₂ implies f x₁ = f x₂, and two functions are equal when they agree at every point. The file defines the cartesian product X × Y, whose equality is the additive conjunction of the two component equalities, and the tensor product X ⊗ Y, whose equality is their tensor. It also defines the sum, the empty set 𝟎, the one-point set 𝟏, the identity, and composition. Composition is a function on the tensor (Y ⇾ Z) ⊗ (X ⇾ Y) ([[scompose_fun]]), because the equalities of g₁ with g₂ and of f₁ with f₂ are each used once. Alongside these are the classes of strong, decidable, affirmative and refutative equality, which classify sets by the kind of their equality, and the vocabulary of casts, coercions, inverses, injections, surjections and bijections. theory/set.v proves the properties of these definitions."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphisms","summary":"This file sets up the hierarchy of algebraic structures, each defined as a base-logic class on an affine set. The group-like classes run from [[SemiGroup]] through commutative semigroups, semilattices, monoids, star semigroups and groups to abelian groups ([[AbGroup]]). Each is stated once for a generic operation ∙. Lattices and the additive and multiplicative structures of rings reuse those classes by viewing a set through [[MeetSemigroupOps]], [[JoinSemigroupOps]], [[AdditiveGroupOps]] or [[MultiplicativeGroupOps]]. The ring-like classes are assembled from these parts, from near-rgs through rigs, rngs and rings to [[IntegralDomain]]. An integral domain is nontrivial and has no zero divisors in the par form, x · y = 0 ⊸ x = 0 ⊞ y = 0; [[StrongNoZeroDivisors]] uses the additive or instead. The file closes with the morphism classes: pointed maps, semigroup and monoid morphisms, lattice morphisms and their order-flipping versions through the opposite order, and rg and rig morphisms."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Interfaces for preorders, posets, order maps, lattice orders, up-sets, filters and ideals","summary":"This file sets up the interfaces for ordered sets. A [[PreOrder]] is a reflexive, transitive order. A [[WeakPoset]] adds that equality implies ≤ and that x ≤ y ⊠ y ≤ x implies x = y (pseudo-antisymmetry). A [[Poset]] asks for the same conclusion from the additive x ≤ y ∧ y ≤ x. In a weak poset the order respects equality, so ≤ and < are functions from P ⊗ P to Ω ([[le_is_fun]], [[lt_is_fun]]). A poset can be decorated as strong, decidable, affirmative, refutative, total or linear, and a correct three-way comparison ([[IsTrich]]) gives a linear order. The file then defines order-preserving, order-reflecting and order-embedding maps, with their order-reversing variants. It also defines directed sets, meet, join and bounded semilattice and lattice orders, up-sets and down-sets, directed subsets, filters and ideals, and the presentation of a filter or ideal by a family of generators. Each dual notion is the direct notion at the opposite order [[order_op]], with accessors that restate its fields at the direct order. The files under orders/ build on these interfaces."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets of an affine set: membership, inclusion, operations, relations, images, subsets as sets","summary":"The file sets up the subsets of an affine set. A subset U : 𝒫 X is an affine predicate on X, and membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω. Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V; [[equal_element]] says that membership respects equality, and [[subset_apply]] applies an inclusion to a member. The file builds the empty and full subsets, singletons, and the additive meet, join and complement. It also builds the multiplicative intersection and union, the tensor and cartesian pairings U ⊗ V and U × V, the relations on X ⊗ Y (identity, composite R ⋄ S, inverse), and preimage f*, image f⁎, range and universal image. Each subset U is a set in its own right (an element of U is a point of X with a proof that it lies in U, equal when the points are equal), and [[from_subset]] is the injective inclusion of U into X. On top of this come [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]], with [[corestrict]] and [[restrict]] for functions between subsets. The last part treats sets of subsets 𝒫² X, whose elements are themselves subsets of X.\",\"short\":\"Subsets of an affine set: membership, inclusion, operations, images, and subsets as sets\"}]"},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Neighbourhood topologies, their separation axioms, and continuous, reflecting and product structures","summary":"This file sets out the interface for topology through neighbourhoods. A neighbourhood relation x ⪽ U is an affine relation between points and subsets, and [[Topology]] imposes the axioms of reflexivity, isotony, the full subset as a neighbourhood, closure under binary meets, and transitivity. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the separation conditions T₀ and Hausdorff. It then introduces the classes of maps: continuous, neighbourhood-reflecting, initial (both at once), embeddings and dense maps, together with discrete and indiscrete neighbourhood relations. It also gives two product structures: the tensor product topology on X ⊗ Y, described by a basis, and the cartesian product topology on X × Y, described by the universal property of its projections. The theory of these notions is developed in the files under topology/topology/, and uniform and bornological spaces build on them."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Interface for constructs and reflection pairs: fibres, forward and reflecting classes, cancellation laws","summary":"The file sets up the abstract interface for reflection pairs. A construct is a concrete category over affine sets: each set carries a fibre of candidate structures, some of which are objects, and the forward maps are the functions that respect the structures. The fibre over a set is ordered by comparing structures through the identity, and with equality as two-sided comparison it becomes a poset. Alongside the forward class come a reflecting class, the initial maps (forward and reflecting) and the embeddings (initial and injective). A reflection pair asks for the two classes to form constructs and to satisfy the two cancellation laws. Saturated pairs and cloven pairs refine this, pair morphisms compare two pairs over the same sets, the opposite of a pair swaps the forward and reflecting classes, and binary products are defined in a pair. The theory built on this interface is developed in the files under topology/reflection_pair."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Sets and functions: Ω and SProp as sets, the ! comonad, products, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. It makes the affine propositions Ω into a set with ⧟ as equality, and the base-logic propositions SProp into a set with ↔ as equality. It then shows that every connective and both affine quantifiers are functions on Ω. Equality itself, [[eq_fun]], is a function X ⊗ X ⇾ Ω. The file defines the comonad ! on sets, [[of_course_set]], which keeps only the affirmative part of an equality, with its counit, its action on maps and its comparisons with the tensor and the cartesian product. [[make_weak_fun]] and [[make_weak_spred]] build maps out of !X from base-logic congruences. The file also covers the structure of the two products: the projections, [[tensor_to_prod]], swaps, associators, unitors, the pairing [[to_prod]], the diagonals, [[curry]] and [[uncurry]], evaluation, and the functorial actions [[tensor_map_fun]] and [[prod_map]]. It ends with injective, surjective and bijective maps, which are closed under composition and cancellation, the initial set 𝟎 and terminal set 𝟏, and copairing out of a disjoint union with [[from_sum]]. The rest of the development rests on this file: the rewriting system finds the congruence hints declared here, and later files use its maps and its ! on sets."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets and relations: adjunctions, functoriality, composition laws","summary":"The file develops the three operations a function f : X ⇾ Y induces on subsets: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ U ⊆ V ⧟ U ⊆ f* V ([[image_preimage_adj]]) and f* V ⊆ U ⧟ V ⊆ ∀.[f] U ([[preimage_universal_image_adj]]), each with its unit and counit. The file shows which lattice operations each one preserves, that each is functorial in f, and that the projection laws hold only laxly. For relations, it shows how images and preimages under tensor maps interact with the converse and with relational composition ⋄. The main results there are the pin laws, which move a map across ⋄, and the exact two-sided law [[image_compose_middle]] together with its universal-image counterpart. It closes with what injectivity, surjectivity and bijectivity of f give for these operations, and with the cylinders: preimages under the projections of a tensor product. The file builds on the relation algebra of orders/subset_relations and is used by the uniform and bornological files."},"AffineConstructive.topology.topology.base":{"page":"base.html","short":"Basic topology: isotony rewriting, composition of continuous maps, separation, discrete and indiscrete spaces","summary":"This file collects the first facts about topological spaces given by a neighbourhood relation. It lets the rewriting system rewrite by inclusions inside the neighbourhood relation, using isotony. It also shows that being continuous, reflecting, initial, an embedding or dense is preserved when a map is replaced by an equal one. The identity is a topological embedding, and each of these classes of maps is closed under composition. On separation: a Hausdorff space is T₀, and in a Hausdorff space two points are equal exactly when all their neighbourhoods meet. A reflecting map out of a T₀ space is injective, so an initial map out of a T₀ space is an embedding ([[cont_initial_embedding]]). A continuous injective map into a Hausdorff space reflects the Hausdorff property ([[reflects_hausdorff]]). Finally, the empty space is initial and the one-point space is terminal. The file builds the discrete topology, out of which every map is continuous, and the indiscrete topology, into which every map is continuous. Constant maps are continuous. The subspace and product files build on these facts."},"AffineConstructive.topology.topology.interior":{"page":"interior.html","short":"Interior and closure in a topological space: basic laws, open and closed subsets, density","summary":"This file develops the basic algebra of the interior and closure operators that a topology determines from its neighbourhood relation. The interior is contained in its argument, is monotone and idempotent, and preserves the full subset and the empty subset. It also sends the multiplicative intersection of two interiors into the interior of their meet. As a consequence, interiors are open, and an open subset is a neighbourhood of each of its points. The closure, defined as the complement of the interior of the complement, has the dual properties, which follow by complementation: it contains its argument, is idempotent, and sends a join into the multiplicative union of the closures. A subset is open exactly when its complement is closed, and conversely. The file ends with the neighbourhood characterisation of the closure, that x is in the closure of U if and only if every neighbourhood of x meets U, and its consequences for dense subsets. These results are used by the files on continuity, uniform spaces and completions."},"AffineConstructive.topology.topology.maps":{"page":"maps.html","short":"Characterisations of continuous, reflecting and initial maps; the topological reflection pair; dense maps","summary":"This file gives equivalent descriptions of the continuous, continuously reflecting and continuously initial maps between topological spaces. Each class gets matching statements and converse constructors in terms of open sets, closed sets, interiors and closures, read against preimage, image and universal image: for example [[continuity_alt]] and [[alt_Build_Continuity]] for open sets, [[reflection_alt]] and [[alt_Build_ContinuouslyReflecting]] for the induced open sets, and [[continuously_initial_interior]] and [[continuously_initial_closure]], which compute the interior and closure of an initial map's domain in the codomain. The cancellation laws [[cont_factor]] and [[cont_refl_factor]] make the topological classes into the reflection pair [[atop_rfl_pair]] on the label [[𝐀𝐓𝐨𝐩]], and from that pair come [[invert_continuous]] and its companions: inverting a bijection exchanges the two classes. The file closes with dense maps: how they behave under composition and factorisation ([[Dense_compose]], [[Dense_factor_left]], [[Dense_factor_right]]), that two continuous maps into a Hausdorff space are equal when they agree on a dense subset ([[cont_equal_on_dense]]), and that a dense map can be cancelled on the right ([[cont_dense_epi]])."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

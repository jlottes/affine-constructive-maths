pology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set abstract_algebra.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.topology interfaces.reflection_pair.\nRequire Import theory.set orders.orders orders.maps orders.subset theory.lattices orders.lattices.\nRequire Import orders.subset_images.\nRequire Import topology.base topology.interior topology.maps.\nRequire Import reflection_pair.base.\nRequire Import easy rewrite simplify tactics.misc.\n\nImport image_notation.\nLocal Open Scope op_scope.\nLocal Open Scope topology_scope.\n\n(** Initial (pullback) topology: the coarsest topology on [X] making [f]\n    continuous — [U] is a neighborhood of [x] iff some neighborhood of [f x]\n    pulls back into [U].  The Joy-of-Cats initial lift; the topological\n    analogue of [uniform/subspace.v]'s [pullback_uniformity]. *)\nDefinition pullback_neighborhood@{u} {X:set@{u}} `{NY:Neighborhood@{u} Y} (f:X ⇾ Y) : Neighborhood X\n  := set:(λ '(x, U) : X ⊗ (𝒫 X), ∐ N:𝒫 Y, f x ⪽ N ⊠ f* N ⊆ U).\n\nSection pullback_topology.\n  Universes u.\n  Context {X Y:set@{u}} `{@Topology Y NY} {f:X ⇾ Y}.\n  Local Abbreviation NX := (@pullback_neighborhood X Y NY f).\n  #[local] Hint Extern 0 (Neighborhood X) => exact NX : typeclass_instances.\n\n  Local Ltac unfold_N := change (func_op (nbrhood (X:=X)) (?x, ?U)) with (∐ N:𝒫 Y, f x ⪽ N ⊠ f* N ⊆ U).\n\n  Local Instance pullback_topology : Topology X.\n  Proof. apply Build_Topology.\n  - intros x U. unfold_N. rew <-aex_adj; intros N. rew (top_refl (f x) N). exact (subset_apply x (f* N) U).\n  - intros x U V. unfold_N. rew aex_frob_r, <-aex_adj; intros N. rew <-(aex_ub _ N).\n    now rew (aprod_assoc _ _ _), (transitivity _ _ _ _).\n  - intros x. unfold_N. rew <-(aex_ub _ (full_subset Y)). split; [ exact _ | exact (below_top _ ) ].\n  - intros x U V. unfold_N. rew <-aex_adj2; intros N₁ N₂. rew <-(aex_ub _ (N₁ ⊓ N₂)).\n    refine ((tautology : ∀ P₁ Q₁ P₂ Q₂ P Q:Ω, (P₁ ⊠ P₂ ⊸ P) → (Q₁ ⊠ Q₂ ⊸ Q) → (P₁ ⊠ Q₁) ⊠ (P₂ ⊠ Q₂) ⊸ P ⊠ Q) _ _ _ _ _ _ _ _).\n    + exact (top_binary_additivity (f x) _ _).\n    + rew (preserves_meet_lax f* N₁ N₂).\n      exact (order_preserving (⊓) (f* N₁, f* N₂) (U, V)).\n  - intros x U. unfold_N. rew <-aex_adj; intros N. rew <-(aex_ub _ {z:Y | z ⪽ N}). apply aprod_proper_aimpl.\n    + exact (top_trans (f x) N).\n    + change (f* {z:Y | z ⪽ N} ⊆ {y:X | y ⪽ U}) with (∏ y:X, y ∊ f* {z:Y | z ⪽ N} ⊸ y ∊ {y:X | y ⪽ U}).\n      rew <-all_adj; intros y. rew <-(aprod_adj _ _ _).\n      change (y ∊ f* {z:Y | z ⪽ N}) with (f y ⪽ N).\n      change (y ∊ {y0:X | y0 ⪽ U}) with (y ⪽ U). unfold_N.\n      rew <-(aex_ub _ N). tautological.\n  Qed.\n\n  Local Instance pullback_neighborhood_continuous : Continuous f.\n  Proof. split; try exact _. intros x N. unfold_N.\n    rew <-(aex_ub _ N). now simplify.\n  Qed.\n\n  Local Instance pullback_neighborhood_initial : ContinuouslyInitial f.\n  Proof. split; try exact _. split; try exact _. now intros x N. Qed.\nEnd pullback_topology.\n#[global] Hint Extern 2 (@Topology _ (pullback_neighborhood _)) => simple notypeclasses refine pullback_topology : typeclass_instances.\n\n#[global] Hint Extern 0 (Cleavage 𝐀𝐓𝐨𝐩) => exact @pullback_neighborhood : typeclass_instances.\n\nLemma atop_cloven : ClovenPair 𝐀𝐓𝐨𝐩.\nProof. esplit. intros X Y f NY HY. exact pullback_neighborhood_initial. Qed.\n#[global] Hint Extern 0 (ClovenPair 𝐀𝐓𝐨𝐩) => exact atop_cloven : typeclass_instances.\n#[global] Hint Extern 0 (SaturatedPair 𝐀𝐓𝐨𝐩) => exact atop_cloven : typeclass_instances.\n\n\n\n(** [ContinuouslyInitial] is the Joy-of-Cats (AHS) initial morphism for the\n    forgetful functor to [Set], with the initial (pullback) topology as test\n    object. *)\nLemma continuously_initial_alt@{u} `{@Topology@{u} X NX, @Topology@{u} Y NY} (f:X ⇾ Y)\n  : ContinuouslyInitial f ↔\n    (∀ (Z:set@{u}) (NZ:Neighborhood Z), Topology Z → ∀ (g:Z ⇾ X),\n       Continuous (f ∘ g) ↔ Continuous g).\nProof. exact (ini_lift_alt (C:=𝐀𝐓𝐨𝐩) f). Qed.\n\nLemma continuously_initial_alt2@{u} `{Hf:@Continuous@{u} X Y NX NY f}\n  : ContinuouslyInitial f ↔\n    (∀ (Z:set@{u}) (NZ:Neighborhood Z), Topology Z → ∀ (g:Z ⇾ X),\n       Continuous (f ∘ g) → Continuous g).\nProof. exact (ini_lift_alt2 (C:=𝐀𝐓𝐨𝐩) f). Qed.\n\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":35,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":5,"s":242,"e":304,"kind":"vernac","status":"ok","ms":20,"messages":[],"goals":null},{"i":6,"s":305,"e":403,"kind":"vernac","status":"ok","ms":24,"messages":[],"goals":null},{"i":7,"s":404,"e":440,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":8,"s":441, ,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1920,"e":1928,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":1930,"e":1933,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1960,"e":1963,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2168,"e":2171,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2277,"e":2285,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":2287,"e":2290,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2312,"e":2315,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2513,"e":2516,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2538,"e":2541,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2664,"e":2672,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":2680,"e":2683,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2700,"e":2712,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":2829,"e":2837,"lib":"AffineConstructive.topology.topology.subspace","name":"unfold_N","kind":"ltac","local":true},{"s":2843,"e":2846,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2863,"e":2866,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2867,"e":2875,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":3006,"e":3009,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file constructs the initial (pullback) topology. Given a topology on Y and a function f : X ⇾ Y, a subset U of X is a neighbourhood of x when the preimage of some neighbourhood of f x is contained in U ([[AffineConstructive.topology.topology.subspace.pullback_neighborhood]]). The relation satisfies the topology axioms, and with it f is continuous and initial. When f is the inclusion of a subset, this is the subspace topology. As a result, topological spaces form a cloven, and hence saturated, reflection pair with this pullback as cleavage ([[AffineConstructive.topology.topology.subspace.atop_cloven]]). The general results on cloven pairs from [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt]] and [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt2]] then give the universal characterisation: f is initial exactly when continuity of every g into X is equivalent to continuity of f ∘ g.","short":"The initial (pullback) topology along a function, and the universal property of initial maps","items":[{"name":"AffineConstructive.topology.topology.subspace.pullback_neighborhood","base":"pullback_neighborhood","kind":"def","start":14,"body":null,"status":"ok","short":{"text":"The neighbourhood relation on X pulled back along f : X ⇾ Y from a neighbourhood relation on Y","status":"ok"},"long":{"text":"Given a neighbourhood relation on Y and a function f : X ⇾ Y, a subset U of X is declared a neighbourhood of x when there is a subset N of Y with f x ⪽ N ⊠ f* N ⊆ U: some neighbourhood of f x has its preimage inside U. This is the initial, or induced, topology of f. When f is the inclusion of a subset, it is the subspace topology.\n\nThe two conditions are joined by the tensor, so the relation is defined in the same way as the other neighbourhood relations of the development, and both its proof and its refutation carry information. Refuting x ⪽ U means that every subset N of Y fails, either as a neighbourhood of f x or by having a preimage that is apart from being contained in U. The existential ranges over all subsets of Y and not only neighbourhoods, because membership in the neighbourhood relation is one of the two factors.\n\nThe file proves that this relation satisfies the topology axioms whenever the relation on Y does ([[AffineConstructive.topology.topology.subspace.pullback_topology]]), that f is then continuous and initial, and it supplies this construction as the cleavage of the reflection pair of topological spaces ([[AffineConstructive.topology.topology.subspace.atop_cloven]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.subspace.NX","base":"NX","kind":"abbrev","start":18,"body":null,"status":"ok","short":{"text":"Local name for the pulled-back neighbourhood relation on X within the section","status":"ok"},"long":{"text":"Inside the section on the pullback topology, NX abbreviates [[AffineConstructive.topology.topology.subspace.pullback_neighborhood]] at the section's f, X and Y. A local hint makes it the neighbourhood relation that resolution finds on X, so the statements of the section can refer to neighbourhoods in X without naming the relation. It has no existence outside the section.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.subspace.unfold_N","base":"unfold_N","kind":"ltac","start":20,"body":null,"status":"ok","short":{"text":"Unfolds x ⪽ U on X to there being N with f x ⪽ N ⊠ f* N ⊆ U","status":"ok"},"long":{"text":"A local tactic of the section on the pullback topology. Wherever the goal contains the neighbourhood relation of X applied to a point and a subset, it changes that occurrence into its definition, the existential over subsets N of Y of f x ⪽ N ⊠ f* N ⊆ U. The change is definitional, so the goal is only restated and nothing is rewritten.\n\nThe proofs of the section call it first so that the quantifier rule, or the choice of a witness, can then act on the exposed existential. A plain unfold would show the bundled set and function structure underneath the relation and not this formula.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.topology.subspace.pullback_topology","base":"pullback_topology","kind":"inst","start":21,"body":[22,69],"status":"ok","short":{"text":"The pulled-back neighbourhood relation on X satisfies the topology axioms when Y's does","status":"ok"},"proof":[{"text":"The pulled-back relation [[AffineConstructive.topology.topology.subspace.pullback_neighborhood]] must satisfy five axioms: a neighbourhood contains its point, neighbourhoods are upward closed, the full subset is a neighbourhood, the meet of two neighbourhoods is a neighbourhood, and the points of which U is a neighbourhood form a neighbourhood whenever U is one.","status":"ok","from":0,"to":1},{"text":"First axiom. Fix x and U. That U is a neighbourhood of x means there is a neighbourhood N of f x whose preimage is contained in U, so take such an N.","status":"ok","from":2,"to":5},{"text":"By the same axiom on Y, f x ∊ N, that is x ∊ f* N. The inclusion f* N ⊆ U then carries x into U ([[AffineConstructive.interfaces.subset.subset_apply]]).","status":"ok","from":6,"to":7},{"text":"Upward closure. Fix x, U and V. After moving the existential out of the tensor, let N be the neighbourhood of f x with f* N ⊆ U that the hypothesis provides.","status":"ok","from":8,"to":11},{"text":"Take N as the witness again. The neighbourhood f x ⪽ N passes through unchanged. After reassociating the tensor, f* N ⊆ U ⊠ U ⊆ V gives f* N ⊆ V by transitivity of inclusion.","status":"ok","from":12,"to":13},{"text":"The full subset. Fix x and take the full subset of Y as the witness. It is a neighbourhood of f x because Y is a topological space. Its preimage lies in the full subset of X, which is the top element of the lattice of subsets.","status":"ok","from":14,"to":18},{"text":"Binary meets. Fix x, U and V, and take the neighbourhoods N₁ and N₂ of f x that the two hypotheses provide, with f* N₁ ⊆ U and f* N₂ ⊆ V.","status":"ok","from":19,"to":22},{"text":"Take N₁ ⊓ N₂ as the witness. The tensor is rearranged so that the two neighbourhood factors meet each other and the two inclusion factors meet each other, which leaves two separate implications to prove.","status":"ok","from":23,"to":24},{"text":"Y's topology is closed under binary meets, so N₁ ⊓ N₂ is a neighbourhood of f x.","status":"ok","from":25,"to":26},{"text":"The preimage of a meet is contained in the meet of the preimages ([[AffineConstructive.orders.lattices.preserves_meet_lax]]). Because the meet is monotone in both arguments ([[AffineConstructive.orders.lattices.meet_order_preserving]]), the two inclusions f* N₁ ⊆ U and f* N₂ ⊆ V give f* N₁ ⊓ f* N₂ ⊆ U ⊓ V.","status":"ok","from":27,"to":29},{"text":"The last axiom. Fix x and U, and let N be the neighbourhood of f x with f* N ⊆ U that the hypothesis provides.","status":"ok","from":30,"to":33},{"text":"Take as the witness the set of points of which N is a neighbourhood. Each factor of the tensor is then proved from the corresponding factor of the hypothesis.","status":"ok","from":34,"to":35},{"text":"By the same axiom on Y, this set is a neighbourhood of f x.","status":"ok","from":36,"to":37},{"text":"It remains to show that f* N ⊆ U makes every point of the preimage of this set a point of which U is a neighbourhood. Unfold the inclusion and fix y. Membership of y in that preimage means f y ⪽ N, and the goal becomes y ⪽ U.","status":"ok","from":38,"to":43},{"text":"N itself witnesses y ⪽ U. The two required factors, f y ⪽ N and f* N ⊆ U, are exactly the two hypotheses in the other order.","status":"ok","from":44,"to":47}]},{"name":"AffineConstructive.topology.topology.subspace.pullback_neighborhood_continuous","base":"pullback_neighborhood_continuous","kind":"inst","start":70,"body":[71,77],"status":"ok","short":{"text":"f is continuous for the pullback topology on its domain","status":"ok"},"proof":[{"text":"The topologies on the two sides are already known. What remains of continuity is that a neighbourhood N of f x pulls back to a neighbourhood f* N of x.","status":"ok","from":0,"to":1},{"text":"Fix x and N, and take N itself as the witness. The required inclusion f* N ⊆ f* N is trivial, so the hypothesis f x ⪽ N is all that is needed.","status":"ok","from":2,"to":6}]},{"name":"AffineConstructive.topology.topology.subspace.pullback_neighborhood_initial","base":"pullback_neighborhood_initial","kind":"inst","start":78,"body":[79,83],"status":"ok","short":{"text":"f is continuously initial for the pullback topology on its domain","status":"ok"},"proof":[{"text":"Continuity is [[AffineConstructive.topology.topology.subspace.pullback_neighborhood_continuous]], so only the reflecting half remains. With the topologies on both sides known, this reduces to the reflection condition on neighbourhoods.","status":"ok","from":0,"to":2},{"text":"For each x and N, the reflection condition is the definition of the pulled-back neighbourhood relation, so it holds by reflexivity.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.topology.subspace.atop_cloven","base":"atop_cloven","kind":"prf","start":87,"body":[88,92],"status":"ok","short":{"text":"Topological spaces form a cloven reflection pair, with the pullback topology as cleavage","status":"ok"},"proof":[{"text":"Topological spaces already form a reflection pair. A cleavage asks, for every map into a topological space, for a topology on its domain that makes the map initial.","status":"ok","from":0,"to":1},{"text":"Given f : X ⇾ Y and a topology on Y, the pullback topology on X makes f continuously initial ([[AffineConstructive.topology.topology.subspace.pullback_neighborhood_initial]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.topology.subspace.continuously_initial_alt","base":"continuously_initial_alt","kind":"prf","start":95,"body":[96,98],"status":"ok","short":{"text":"f is continuously initial iff, for every g into X, f ∘ g is continuous iff g is","status":"ok"},"proof":[{"text":"This is the general characterisation [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt]] of initial maps in a cloven reflection pair, applied to topological spaces, which form one by [[AffineConstructive.topology.topology.subspace.atop_cloven]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.topology.subspace.continuously_initial_alt2","base":"continuously_initial_alt2","kind":"prf","start":99,"body":[100,102],"status":"ok","short":{"text":"For continuous f: f is continuously initial iff g is continuous whenever f ∘ g is","status":"ok"},"proof":[{"text":"This is the general characterisation [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt2]] of initial maps among forward maps in a cloven reflection pair, applied to topological spaces, which form one by [[AffineConstructive.topology.topology.subspace.atop_cloven]].","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.abstract_algebra":{"page":"../../interfaces/abstract_algebra.html","short":"The algebraic hierarchy: semigroups to integral domains, lattices, and their morphism classes","summary":"This file sets out the algebraic structures of the development as classes on an affine set: the semigroup hierarchy for a generic operation ∙ (semigroups, semilattices, monoids, star semigroups, groups, abelian groups, and the variants whose operation is strong), the lattices from meet and join semilattices to bounded distributive lattices, and the ring hierarchy from near-rgs through rigs, rngs and rings to integral domains, with additive cancellation, 1 ≠ 0 and the two forms of no zero divisors (with ⊞ and with the additive ∨). Lattices and the additive and multiplicative parts of a ring are not separate theories: they are the generic semigroup classes read through the renamings of algebra_notation, so one body of semigroup theory serves all of them. Alongside the structures come the morphism classes: maps preserving a distinguished point, semigroup, monoid and star morphisms, semilattice and lattice morphisms with their order-reversing flip variants, and rg and rig morphisms. The theory of these classes is developed in theory.groups, theory.lattices, theory.additive_groups and theory.rings."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Topological spaces by neighbourhood relations: axioms, continuity classes, separation, products","summary":"This file sets up the interface for topological spaces, in terms of a neighbourhood relation x ⪽ U between points and subsets. A [[Topology]] requires that every neighbourhood contains its point, that neighbourhoods are closed upward and under finite meets, and that a neighbourhood of x is also a neighbourhood of every point near x. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the T₀ and Hausdorff separation axioms. It defines the classes of maps (continuous, continuously reflecting, initial, embedding, dense), the discrete and indiscrete structures, and the tensor and cartesian product topologies. The theory of these notions is developed in the files under topology/topology."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Reflection pairs: forward and reflecting classes of maps over sets, and their variants","summary":"This file sets up the abstract framework of reflection pairs. It begins with constructs: concrete categories over sets, given by fibres of candidate structures, a class of objects and a class of morphisms closed under identities and composition. For each set X, the structures on X form a poset whose order is comparison through the identity. On this base it defines the reflecting, initial and embedding classes, with their specifications: an initial map is forward and reflecting, and an embedding is an injective initial map. It then defines reflection pairs with their two cancellation laws, together with saturated pairs, cloven pairs (with a pullback of structures along any map), morphisms of pairs, the opposite pair that exchanges the two classes, and products for the forward class. The theory built on these interfaces is in the reflection_pair files, and the topological, uniform and bornological structures of the development are instances."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.topology.topology.base":{"page":"base.html","short":"Basic topology: classes of maps under composition, separation, discrete and indiscrete spaces","summary":"The first results about topological spaces given by a neighbourhood relation. The classes of maps (continuous, reflecting, initial, embedding, dense) become predicates that respect equality of maps, and each is closed under identity and composition. On separation: a Hausdorff space is T₀, and in a Hausdorff space two points are equal exactly when all their neighbourhoods meet. An initial map out of a T₀ space is an embedding, and a continuous injection into a Hausdorff space makes its domain Hausdorff. The file also sets up the empty space as initial object, the discrete and indiscrete topologies (the finest and the coarsest), the one-point space as terminal object, and shows that constant maps are continuous. Later topology files build on these results."},"AffineConstructive.topology.topology.interior":{"page":"interior.html","short":"Interior and closure in a topological space: basic laws, open and closed subsets, density","summary":"This file develops the basic algebra of the interior and closure operators that a topology determines from its neighbourhood relation. The interior is contained in its argument, is monotone and idempotent, and preserves the full subset and the empty subset. It also sends the multiplicative intersection of two interiors into the interior of their meet. As a consequence, interiors are open, and an open subset is a neighbourhood of each of its points. The closure, defined as the complement of the interior of the complement, has the dual properties, which follow by complementation: it contains its argument, is idempotent, and sends a join into the multiplicative union of the closures. A subset is open exactly when its complement is closed, and conversely. The file ends with the neighbourhood characterisation of the closure, that x is in the closure of U if and only if every neighbourhood of x meets U, and its consequences for dense subsets. These results are used by the files on continuity, uniform spaces and completions."},"AffineConstructive.topology.topology.maps":{"page":"maps.html","short":"Continuous, reflecting, initial and dense maps of topological spaces; the topological reflection pair","summary":"The file characterises the classes of maps between topological spaces in several equivalent ways. A map is continuous when preimages of open sets are open, or of closed sets closed, or by an inclusion between interiors or closures under preimage or image. A map is continuously reflecting when every open (or closed) set is the preimage of an open (or closed) set, or when the interior of A is computed through the universal image. A map is initial when interiors and closures are pulled back from the codomain ([[continuously_initial_interior]], [[continuously_initial_closure]]). The two cancellation laws [[cont_factor]] and [[cont_refl_factor]] make topological spaces a reflection pair under the label [[𝐀𝐓𝐨𝐩]], which gives the inverse lemmas for bijections. Last come dense maps: closure of density under composition and its factor laws, and the result that continuous maps into a Hausdorff space are determined on a dense subset ([[cont_equal_on_dense]], [[cont_dense_epi]])."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

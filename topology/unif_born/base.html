onstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7886,"e":7889,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8030,"e":8033,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8151,"e":8154,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8232,"e":8235,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8504,"e":8507,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8726,"e":8729,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8985,"e":8988,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9070,"e":9073,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9709,"e":9712,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9796,"e":9799,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":10109,"e":10112,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":10189,"e":10192,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11965,"e":11968,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":12429,"e":12432,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":12710,"e":12713,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":12997,"e":13000,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14004,"e":14007,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14225,"e":14228,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14417,"e":14420,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14421,"e":14424,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file sets up the category of sets carrying both a uniformity and a bornology, with no axiom linking the two. It shows that the four classes of maps (uniformly continuous and bornological, reflecting, initial, embedding) respect equality of functions, contain identities, compose, and satisfy the cancellation laws. It packages them as the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], with pair morphisms to uniform spaces, bornological spaces and topological spaces, and from it derives that inverses swap the forward and reflecting classes. Its main result, [[AffineConstructive.topology.unif_born.base.wcunif_transport]], pulls the well-containment axiom back along a uniformly continuous, bornological and bornology-reflecting map. The subspace and localization files use it.","short":"Uniform spaces with bornologies: maps, their reflection pair, transport of well-containment","items":[{"name":"AffineConstructive.topology.unif_born.base.UnifBornInitial_UniformlyInitial","base":"UnifBornInitial_UniformlyInitial","kind":"def","start":13,"body":[14,16],"status":"ok","short":{"text":"A map initial for uniformity and bornology together is uniformly initial","status":"ok"},"proof":[{"text":"A map is uniformly initial when it is uniformly continuous and uniformly reflecting. Both halves come from the hypothesis: being uniformly continuous and bornological gives the first, and being uniformly reflecting and bornology-reflecting gives the second.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornInitial_BornologyInitial","base":"UnifBornInitial_BornologyInitial","kind":"def","start":17,"body":[18,20],"status":"ok","short":{"text":"A map initial for uniformity and bornology together is bornologically initial","status":"ok"},"proof":[{"text":"A map is bornologically initial when it is bornological and bornology-reflecting. The hypothesis supplies both halves: the bornological half comes from the forward class, and the reflecting half from the reflecting class.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornEmbedding_UniformlyEmbedding","base":"UnifBornEmbedding_UniformlyEmbedding","kind":"def","start":21,"body":[22,24],"status":"ok","short":{"text":"An embedding of uniform spaces with bornologies is a uniform embedding","status":"ok"},"proof":[{"text":"A uniform embedding is a uniformly initial map that is injective. The map is uniformly initial by [[AffineConstructive.topology.unif_born.base.UnifBornInitial_UniformlyInitial]], and injectivity is part of the hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornEmbedding_BornologyEmbedding","base":"UnifBornEmbedding_BornologyEmbedding","kind":"def","start":25,"body":[26,28],"status":"ok","short":{"text":"An embedding of uniform spaces with bornologies is a bornological embedding","status":"ok"},"proof":[{"text":"A bornological embedding is a bornologically initial map that is injective. The map is bornologically initial by [[AffineConstructive.topology.unif_born.base.UnifBornInitial_BornologyInitial]], and injectivity is part of the hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornMorphism_proper_impl","base":"UnifBornMorphism_proper_impl","kind":"prf","start":29,"body":[30,32],"status":"ok","short":{"text":"Being uniformly continuous and bornological is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g, and that f is both uniformly continuous and bornological. Prove each property for g separately: in each case, rewrite g as f using the equality, and the matching hypothesis on f finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornMorphism_fun","base":"UnifBornMorphism_fun","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"Being uniformly continuous and bornological, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]] packaged as a function from !(X ⇾ Y) to strict propositions, with its invariance under equality of functions supplied by [[AffineConstructive.topology.unif_born.base.UnifBornMorphism_proper_impl]] and built by [[AffineConstructive.theory.set.make_weak_spred]].\n\nIn this form the class can serve as the forward class of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], which expects its classes of maps as predicates on the set of functions rather than as bare typeclasses.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornReflecting_proper_impl","base":"UnifBornReflecting_proper_impl","kind":"prf","start":34,"body":[35,37],"status":"ok","short":{"text":"Being uniformly reflecting and bornology-reflecting is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g, and that f is both uniformly reflecting and bornology-reflecting. Prove each property for g separately: in each case, rewrite g as f using the equality, and the matching hypothesis on f finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornReflecting_fun","base":"UnifBornReflecting_fun","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"Being uniformly reflecting and bornology-reflecting, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting]] packaged as a function from !(X ⇾ Y) to strict propositions, its invariance under equality of functions given by [[AffineConstructive.topology.unif_born.base.UnifBornReflecting_proper_impl]].\n\nIt is the reflecting class of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: a map reflects when the uniformity of its domain is the one pulled back from the codomain's, and the preimage of a bounded subset is bounded.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornInitial_proper_impl","base":"UnifBornInitial_proper_impl","kind":"prf","start":39,"body":[40,42],"status":"ok","short":{"text":"Being initial for uniformity and bornology is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g, and that f is in both the forward class and the reflecting class. Prove each class membership for g separately: in each case, rewrite g as f using the equality, and the matching hypothesis on f finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornInitial_fun","base":"UnifBornInitial_fun","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"Being initial for uniformity and bornology, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.UnifBornInitial]], forward and reflecting at once, packaged as a function from !(X ⇾ Y) to strict propositions with its invariance under equality of functions from [[AffineConstructive.topology.unif_born.base.UnifBornInitial_proper_impl]].\n\nIt is the class of initial maps of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], resolved separately from the forward and reflecting classes; [[AffineConstructive.topology.unif_born.base.unif_born_ini_spec]] says that it is exactly their conjunction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornEmbedding_proper_impl","base":"UnifBornEmbedding_proper_impl","kind":"prf","start":44,"body":[45,47],"status":"ok","short":{"text":"Being an embedding of uniform spaces with bornologies is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g, and that f is initial for the uniformity and the bornology and is injective. Prove each property for g separately: in each case, rewrite g as f using the equality, and the matching hypothesis on f finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornEmbedding_fun","base":"UnifBornEmbedding_fun","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"Being an embedding of uniform spaces with bornologies, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.UnifBornEmbedding]], initial and injective, packaged as a function from !(X ⇾ Y) to strict propositions with its invariance under equality of functions from [[AffineConstructive.topology.unif_born.base.UnifBornEmbedding_proper_impl]].\n\nIt is the class of embeddings of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]; [[AffineConstructive.topology.unif_born.base.unif_born_emb_spec]] says that it consists exactly of the injective initial maps.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.id_unif_born_emb","base":"id_unif_born_emb","kind":"prf","start":49,"body":[50,52],"status":"ok","short":{"text":"The identity of a uniform space with a bornology is an embedding","status":"ok"},"proof":[{"text":"Unfold the embedding into its parts: the identity must be in the forward class, in the reflecting class, and injective. The identity is a uniform embedding by [[AffineConstructive.topology.uniform.base.id_ufm_emb]] and bornologically initial by [[AffineConstructive.topology.bornology.base.id_bornology_initial]], and it is injective because it is a bijection ([[AffineConstructive.theory.set.id_bijective]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_unif_born_mor","base":"compose_unif_born_mor","kind":"prf","start":57,"body":[58,60],"status":"ok","short":{"text":"A composite of uniformly continuous bornological maps is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"Prove the two halves separately. The composite g ∘ f is uniformly continuous because a composite of uniformly continuous maps is ([[AffineConstructive.topology.uniform.base.compose_ufm_cont]]), and it is bornological because a composite of bornological maps is ([[AffineConstructive.topology.bornology.base.compose_bornological]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_unif_born_reflecting","base":"compose_unif_born_reflecting","kind":"prf","start":62,"body":[63,65],"status":"ok","short":{"text":"A composite of uniformly reflecting, bornology-reflecting maps is again both","status":"ok"},"proof":[{"text":"Being reflecting for both structures means being uniformly reflecting and bornology-reflecting, so the claim splits into two parts. Each part is the corresponding composition law for one structure alone, [[AffineConstructive.topology.uniform.base.compose_ufm_reflecting]] and [[AffineConstructive.topology.bornology.base.compose_bornology_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_unif_born_initial","base":"compose_unif_born_initial","kind":"prf","start":67,"body":[68,70],"status":"ok","short":{"text":"A composite of maps initial for uniformity and bornology is initial","status":"ok"},"proof":[{"text":"An initial map is a morphism that is also reflecting, so the claim splits into these two parts. The composite is a morphism by [[AffineConstructive.topology.unif_born.base.compose_unif_born_mor]] and reflecting by [[AffineConstructive.topology.unif_born.base.compose_unif_born_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_initial_factor","base":"unif_born_initial_factor","kind":"prf","start":72,"body":[73,81],"status":"ok","short":{"text":"If f and g are morphisms and g ∘ f is initial, then f is initial","status":"ok"},"proof":[{"text":"Assume g ∘ f is initial. Since f is already a morphism by hypothesis, what remains is to show that f is reflecting.","status":"ok","from":0,"to":2},{"text":"The reflecting condition splits into its uniform and bornological parts. For the uniform part: g is uniformly continuous and g ∘ f is uniformly reflecting, so f is uniformly reflecting by [[AffineConstructive.topology.uniform.base.ufm_refl_factor]].","status":"ok","from":3,"to":5},{"text":"The bornological part goes the same way: g is bornological and g ∘ f is bornology-reflecting, so [[AffineConstructive.topology.bornology.base.born_refl_factor]] shows that f is bornology-reflecting.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_mor_factor","base":"unif_born_mor_factor","kind":"prf","start":82,"body":[83,90],"status":"ok","short":{"text":"If g is reflecting and g ∘ f is a morphism, then f is a morphism","status":"ok"},"proof":[{"text":"Assume g ∘ f is a morphism. To show that f is one, prove that it is uniformly continuous and that it is bornological.","status":"ok","from":0,"to":2},{"text":"Since g is uniformly reflecting and g ∘ f is uniformly continuous, f is uniformly continuous by [[AffineConstructive.topology.uniform.base.ufm_cont_factor]].","status":"ok","from":3,"to":4},{"text":"Since g is bornology-reflecting and g ∘ f is bornological, f is bornological by [[AffineConstructive.topology.bornology.base.bornological_factor]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_refl_factor","base":"unif_born_refl_factor","kind":"prf","start":91,"body":[92,99],"status":"ok","short":{"text":"If g is a morphism and g ∘ f is reflecting, then f is reflecting","status":"ok"},"proof":[{"text":"Assume g ∘ f is reflecting. To show that f is reflecting, prove that it is uniformly reflecting and that it is bornology-reflecting.","status":"ok","from":0,"to":2},{"text":"Since g is uniformly continuous and g ∘ f is uniformly reflecting, f is uniformly reflecting by [[AffineConstructive.topology.uniform.base.ufm_refl_factor]].","status":"ok","from":3,"to":4},{"text":"Since g is bornological and g ∘ f is bornology-reflecting, f is bornology-reflecting by [[AffineConstructive.topology.bornology.base.born_refl_factor]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.unif_born.base.compose_unif_born_emb","base":"compose_unif_born_emb","kind":"prf","start":100,"body":[101,103],"status":"ok","short":{"text":"A composite of embeddings of uniform spaces with bornologies is an embedding","status":"ok"},"proof":[{"text":"An embedding is an initial map that is injective, so the claim splits into these two parts. The composite is initial by [[AffineConstructive.topology.unif_born.base.compose_unif_born_initial]] and injective by [[AffineConstructive.theory.set.compose_injective]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧","kind":"ind","start":105,"body":null,"status":"ok","short":{"text":"The label of the reflection pair of uniform spaces with bornologies","status":"ok"},"long":{"text":"An empty type used only as a name: the reflection pair of sets carrying a uniformity and a bornology is attached to it. The fibre over a set X is the cartesian product of its uniformities and its bornologies, the objects are the pairs satisfying [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], and the forward, reflecting, initial and embedding classes are [[AffineConstructive.topology.unif_born.base.UnifBornMorphism_fun]], [[AffineConstructive.topology.unif_born.base.UnifBornReflecting_fun]], [[AffineConstructive.topology.unif_born.base.UnifBornInitial_fun]] and [[AffineConstructive.topology.unif_born.base.UnifBornEmbedding_fun]].\n\nWith the label in hand, the general theory of reflection pairs applies to these spaces: the inverse of a forward bijection reflects ([[AffineConstructive.topology.unif_born.base.invert_unif_born_mor]]), and the fibre maps forgetting the bornology, the uniformity, or passing to the uniform topology are pair morphisms to [[AffineConstructive.topology.uniform.base.𝐔𝐧𝐢𝐟]], [[AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧]] and [[AffineConstructive.topology.topology.maps.𝐀𝐓𝐨𝐩]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_rect","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_rect","kind":"scheme","short":{"text":"Elimination of the empty label into types","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_ind","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_ind","kind":"scheme","short":{"text":"Elimination of the empty label into propositions","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_rec","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_rec","kind":"scheme","short":{"text":"Elimination of the empty label into sets","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_sind","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_sind","kind":"scheme","short":{"text":"Elimination of the empty label into strict propositions","status":"ok"}}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_classes","base":"unif_born_classes","kind":"def","start":113,"body":[114,116],"status":"ok","short":{"text":"The fibres, objects and four classes of maps of the reflection pair 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧","status":"ok"},"proof":[{"text":"Every component of the structure is already determined by the declaration of [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: the fibre over a set (a uniformity together with a bornology), the objects, and the four classes of maps. Filling them in by unification gives the structure.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_construct","base":"unif_born_construct","kind":"prf","start":118,"body":[119,135],"status":"ok","short":{"text":"Uniformly continuous bornological maps contain identities, are closed under composition, join objects","status":"ok"},"proof":[{"text":"Four things must be shown. The identity of an object is a morphism, the domain and the codomain of a morphism are objects, and a composite of morphisms is a morphism.","status":"ok","from":0,"to":1},{"text":"Take a set X with a uniformity Φ and a bornology 𝒜. With this structure on both sides, the identity is a morphism, since it is an embedding by [[AffineConstructive.topology.unif_born.base.id_unif_born_emb]].","status":"ok","from":2,"to":4},{"text":"Take a morphism f from X to Y, each set with its uniformity and bornology. Being an object places no further conditions on X, so the domain is an object.","status":"ok","from":5,"to":8},{"text":"In the same way, the codomain Y is an object.","status":"ok","from":9,"to":12},{"text":"Given morphisms f from X to Y and g from Y to Z, with all three structures fixed, the composite g ∘ f is a morphism by [[AffineConstructive.topology.unif_born.base.compose_unif_born_mor]].","status":"ok","from":13,"to":16}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_rfl_construct","base":"unif_born_rfl_construct","kind":"prf","start":137,"body":[138,154],"status":"ok","short":{"text":"Reflecting maps of uniform spaces with bornologies contain identities, compose, and join objects","status":"ok"},"proof":[{"text":"The same four facts are now needed for the reflecting class. The identity of an object is reflecting, the domain and the codomain of a reflecting map are objects, and a composite of reflecting maps is reflecting.","status":"ok","from":0,"to":1},{"text":"Take a set X with a uniformity Φ and a bornology 𝒜. The identity is reflecting, since it is an embedding by [[AffineConstructive.topology.unif_born.base.id_unif_born_emb]].","status":"ok","from":2,"to":4},{"text":"Given a reflecting map f from X to Y, the domain X with its structure is an object, since this places no further conditions on it.","status":"ok","from":5,"to":8},{"text":"In the same way, the codomain Y is an object.","status":"ok","from":9,"to":12},{"text":"Given reflecting maps f and g, the composite g ∘ f is reflecting by [[AffineConstructive.topology.unif_born.base.compose_unif_born_reflecting]].","status":"ok","from":13,"to":16}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_ini_spec","base":"unif_born_ini_spec","kind":"prf","start":156,"body":[157,159],"status":"ok","short":{"text":"Initial maps of uniform spaces with bornologies are exactly the forward reflecting ones","status":"ok"},"proof":[{"text":"Fix the sets, their structures and a map f. In each direction, unpack the assumption into its two parts and reassemble them. An initial map is a morphism and reflecting, and a map that is both is initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_emb_spec","base":"unif_born_emb_spec","kind":"prf","start":161,"body":[162,164],"status":"ok","short":{"text":"Embeddings of uniform spaces with bornologies are exactly the injective initial maps","status":"ok"},"proof":[{"text":"An embedding is by definition an injective map that is uniformly continuous and bornological and reflecting for both structures, and [[AffineConstructive.topology.unif_born.base.unif_born_ini_spec]] identifies an initial map with one that is forward and reflecting. Both directions of the equivalence therefore come down to taking the pair of conditions apart and putting it back together.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_rfl_pair","base":"unif_born_rfl_pair","kind":"prf","start":166,"body":[167,175],"status":"ok","short":{"text":"Uniform spaces with bornologies form a reflection pair, with both cancellation laws","status":"ok"},"proof":[{"text":"A reflection pair needs the two classes with identities and composition, the descriptions of initial maps and embeddings, and the two cancellation laws. The first of these are [[AffineConstructive.topology.unif_born.base.unif_born_construct]], [[AffineConstructive.topology.unif_born.base.unif_born_rfl_construct]], [[AffineConstructive.topology.unif_born.base.unif_born_ini_spec]] and [[AffineConstructive.topology.unif_born.base.unif_born_emb_spec]]. The two cancellation laws remain.","status":"ok","from":0,"to":1},{"text":"First law: let f : X ⇾ Y and g : Y ⇾ Z, each set carrying a uniformity and a bornology. Suppose g is reflecting and g ∘ f is a morphism. Then f is a morphism by [[AffineConstructive.topology.unif_born.base.unif_born_mor_factor]].","status":"ok","from":2,"to":4},{"text":"Second law, the dual one: if g is a morphism and g ∘ f is reflecting, then f is reflecting by [[AffineConstructive.topology.unif_born.base.unif_born_refl_factor]].","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.unifborn_unif_pair_map","base":"unifborn_unif_pair_map","kind":"prf","start":180,"body":[181,189],"status":"ok","short":{"text":"Forgetting the bornology is a morphism of reflection pairs from 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 to 𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"A pair morphism must send objects to objects and preserve both classes of maps. The objects are handled by the reflection-pair structures of [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] and [[AffineConstructive.topology.uniform.base.𝐔𝐧𝐢𝐟]]. What remains is that forgetting the bornology preserves morphisms and preserves reflecting maps.","status":"ok","from":0,"to":1},{"text":"Let f : X ⇾ Y have a uniformity and a bornology on each side. A morphism of uniform spaces with bornologies is in particular uniformly continuous, by its definition.","status":"ok","from":2,"to":4},{"text":"In the same way, a map that is reflecting for both structures is in particular uniformly reflecting.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.unifborn_born_pair_map","base":"unifborn_born_pair_map","kind":"prf","start":191,"body":[192,200],"status":"ok","short":{"text":"Forgetting the uniformity is a morphism of reflection pairs from 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 to 𝐁𝐨𝐫𝐧","status":"ok"},"proof":[{"text":"The objects are handled by the reflection-pair structures of [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] and [[AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧]]. What remains is that forgetting the uniformity preserves morphisms and preserves reflecting maps.","status":"ok","from":0,"to":1},{"text":"Let f : X ⇾ Y. A morphism of uniform spaces with bornologies is in particular bornological, by its definition.","status":"ok","from":2,"to":4},{"text":"In the same way, a map that is reflecting for both structures is in particular bornology-reflecting.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.unifborn_atop_pair_map","base":"unifborn_atop_pair_map","kind":"prf","start":202,"body":[203,205],"status":"ok","short":{"text":"Passing to the uniform topology is a morphism of reflection pairs from 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 to 𝐀𝐓𝐨𝐩","status":"ok"},"proof":[{"text":"The pair morphism is the composite of two others: forgetting the bornology, [[AffineConstructive.topology.unif_born.base.unifborn_unif_pair_map]], followed by passing from a uniformity to its topology, [[AffineConstructive.topology.uniform.base.unif_atop_pair_map]]. By [[AffineConstructive.topology.reflection_pair.base.PairMorphism_compose]] the composite of two pair morphisms is a pair morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_unif_born_mor","base":"invert_unif_born_mor","kind":"prf","start":208,"body":[209,211],"status":"ok","short":{"text":"The inverse of a uniformly continuous bornological bijection is reflecting for both structures","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.base.invert_hom]], which holds in any reflection pair, applied to [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: the inverse of a bijective morphism is reflecting.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_unif_born_reflecting","base":"invert_unif_born_reflecting","kind":"prf","start":213,"body":[214,216],"status":"ok","short":{"text":"The inverse of a reflecting bijection is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.base.invert_rfl]], which holds in any reflection pair, applied to [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: the inverse of a reflecting bijection is a morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_unif_born_initial","base":"invert_unif_born_initial","kind":"prf","start":218,"body":[219,221],"status":"ok","short":{"text":"The inverse of an initial bijection of uniform spaces with bornologies is an embedding","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.base.invert_ini]], which holds in any reflection pair, applied to [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: the inverse of an initial bijection is an embedding.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_split_iff","base":"unif_born_split_iff","kind":"prf","start":225,"body":[226,228],"status":"ok","short":{"text":"A map is a morphism exactly when it is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"A morphism of uniform spaces with bornologies is by definition the conjunction of uniform continuity and bornologicality. Each direction of the equivalence repackages the two conditions.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.from_empty_unif_born_mor","base":"from_empty_unif_born_mor","kind":"prf","start":229,"body":[230,232],"status":"ok","short":{"text":"The map out of the empty set is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The two conditions are proved separately. The map out of the empty set is uniformly continuous by [[AffineConstructive.topology.uniform.basis.from_empty_ufm_cont]] and bornological by [[AffineConstructive.topology.bornology.basis.from_empty_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.to_unit_unif_born_mor","base":"to_unit_unif_born_mor","kind":"prf","start":234,"body":[235,237],"status":"ok","short":{"text":"The map into the one-point set is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The two halves are separate facts. The map is uniformly continuous because every uniformity on the one-point set is indiscrete ([[AffineConstructive.topology.uniform.basis.unit_uniform_indiscrete]]), and every map into an indiscrete space is uniformly continuous ([[AffineConstructive.topology.uniform.basis.indiscrete_ufm_cont]]). It is bornological by [[AffineConstructive.topology.bornology.basis.to_unit_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.const_unif_born_mor","base":"const_unif_born_mor","kind":"prf","start":239,"body":[240,242],"status":"ok","short":{"text":"A constant map between uniform spaces with bornologies is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The two halves are separate facts: a constant map is uniformly continuous ([[AffineConstructive.topology.uniform.basis.const_ufm_cont]]) and bornological ([[AffineConstructive.topology.bornology.basis.const_bornological]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.wcunif_transport","base":"wcunif_transport","kind":"prf","start":246,"body":[247,260],"status":"ok","short":{"text":"A space mapping into a well-containment space by a reflecting-bounded morphism is well-containment","status":"ok"},"proof":[{"text":"X already carries a uniformity and a bornology, which settles the first part of the well-containment structure. What remains is the axiom itself: every bounded subset of X can be thickened by some entourage to a bounded subset.","status":"ok","from":0,"to":1},{"text":"Fix a bounded subset A of X. Since f is bornological, its image f⁎ A is bounded in Y. The well-containment axiom of Y ([[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]]) then gives an entourage W of Y for which the thickening W.[f⁎ A] is bounded.","status":"ok","from":2,"to":3},{"text":"Since f is uniformly continuous, the preimage of W under f is an entourage of X. Take it as the witness. It then suffices to show that its thickening of A is contained in f* W.[f⁎ A], the preimage under f of the bounded set W.[f⁎ A].","status":"ok","from":4,"to":5},{"text":"Assuming that inclusion, the thickening of A is bounded. The bornology is an ideal and therefore a down-set ([[AffineConstructive.interfaces.orders.Ideal_DownSet]]), so it is enough that f* W.[f⁎ A] is bounded. This holds because f reflects bornology and W.[f⁎ A] is bounded.","status":"ok","from":6,"to":8},{"text":"For the inclusion, fix a point x' of X. Membership in the thickening means that there is some x ∊ A with f x W-close to f x'. Membership in the preimage means that there is some y in f⁎ A with y W-close to f x'.","status":"ok","from":9,"to":11},{"text":"The two sides are equivalent: by [[AffineConstructive.orders.subset_images.aex_image]], an existential over the points of f⁎ A is the same as an existential over the points x of A, taken at f x.","status":"ok","from":12,"to":13}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment spaces, local morphisms, local completions","summary":"The file sets up uniform spaces that also carry a bornology. It starts from the bare pairing [[UnifBornSpace]], with no axiom relating the two structures, adds the thickening axiom [[UniformlyOpenBornology]] to obtain the well-containment uniform spaces [[WCUnifSpace]] and their regular variant [[RegularWCUnifSpace]], and defines the well-containment relation K ⋐ S. It then gives product certificates and the morphism classes, forward, reflecting, initial and embedding, both in the global form (uniform and bornological at once) and in the local form, where uniform continuity or reflection is asked only near bounded sets ([[LocalUniformContinuity]], [[LocalUniformReflection]]). It ends with the interface of a local completion, [[LocalCompletion]], and of a locally complete space, which the localization and the trapped completion later realise."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Reflection pairs: forward and reflecting classes of maps over sets, and their variants","summary":"This file sets up the abstract framework of reflection pairs. It begins with constructs: concrete categories over sets, given by fibres of candidate structures, a class of objects and a class of morphisms closed under identities and composition. For each set X, the structures on X form a poset whose order is comparison through the identity. On this base it defines the reflecting, initial and embedding classes, with their specifications: an initial map is forward and reflecting, and an embedding is an injective initial map. It then defines reflection pairs with their two cancellation laws, together with saturated pairs, cloven pairs (with a pullback of structures along any map), morphisms of pairs, the opposite pair that exchanges the two classes, and products for the forward class. The theory built on these interfaces is in the reflection_pair files, and the topological, uniform and bornological structures of the development are instances."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"../uniform/base.html","short":"Uniform spaces: closeness, thickening, induced topology, separation and the uniform reflection pair","summary":"This file develops the basic theory of uniform spaces. The uniformity of a uniform space is a sublattice of relations that is closed under composition and inversion. The file proves the elementary laws of closeness: reflexivity, symmetric splitting into two through six factors, and composition of close pairs. It also proves the laws of thickening, including the swap of a thickening across a complement. Every uniform space carries an induced topology, in which a separated space is Hausdorff and a regular space is strong. Interior, closure and density are described through entourages. The forward, reflecting, initial and embedding classes of maps are closed under composition, pass to their topological counterparts, and make 𝐔𝐧𝐢𝐟 a reflection pair with a morphism to the topological reflection pair 𝐀𝐓𝐨𝐩. The file ends with lemmas on images and preimages of thickenings and on dense maps, which the subspace, completion and bornology files use."},"AffineConstructive.topology.uniform.basis":{"page":"../uniform/basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.bornology.basis":{"page":"../bornology/basis.html","short":"Bornologies presented by bases, basis criteria for maps, the trivial bornology","summary":"This file builds bornologies from bases and gives criteria stated in terms of bases. [[presented_bornology]] turns any family of subsets into the bornology it generates downward. [[presented_bornological_space]] shows that this bornology satisfies the axioms of a bornological space when the family is order-preserving on an up-directed index set and covers every point. Conversely, a basis of a bornological space covers the points, has an inhabited index set and is up-directed. [[born_by_basis]] and [[bornology_refl_by_basis]] check that a map is bornological, or bornology-reflecting, by checking basis sets only. The file then treats the trivial bornology, in which every subset is bounded, and shows that maps out of the empty set, maps into the one-point set and constant maps are bornological; every bornology on the one-point set is trivial."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

e.topology.uniform.basis":"topology/uniform/basis.html","AffineConstructive.topology.uniform.final":"topology/uniform/final.html","AffineConstructive.topology.uniform.product":"topology/uniform/product.html","AffineConstructive.topology.uniform.cylinder":"topology/uniform/cylinder.html","AffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.unif_born interfaces.reflection_pair.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import topology.topology topology.interior uniform.base uniform.basis bornology.base bornology.basis.\nRequire Import reflection_pair.base.\nRequire Import easy rewrite simplify tactics.misc.\n\nLocal Open Scope topology_scope.\n\nImport of_course_set_notation.\n\nCoercion UnifBornInitial_UniformlyInitial `{@UnifBornInitial X Y Φ Ψ 𝒜 ℬ f} : UniformlyInitial f.\nProof. now split. Qed.\n\nCoercion UnifBornInitial_BornologyInitial `{@UnifBornInitial X Y Φ Ψ 𝒜 ℬ f} : BornologyInitial f.\nProof. now split. Qed.\n\nCoercion UnifBornEmbedding_UniformlyEmbedding `{@UnifBornEmbedding X Y Φ Ψ 𝒜 ℬ f} : UniformlyEmbedding f.\nProof. now split. Qed.\n\nCoercion UnifBornEmbedding_BornologyEmbedding `{@UnifBornEmbedding X Y Φ Ψ 𝒜 ℬ f} : BornologyEmbedding f.\nProof. now split. Qed.\n\n(** Morphism classes respect function equality. *)\n\nLemma UnifBornMorphism_proper_impl@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f g : X ⇾ Y)\n  : f = g → impl (UnifBornMorphism f, UnifBornMorphism g).\nProof. intros E [HC HB]; split; now rew <-E. Qed.\nCanonical Structure UnifBornMorphism_fun {X Y} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@UnifBornMorphism X Y Φ Ψ 𝒜 ℬ) UnifBornMorphism_proper_impl.\n\nLemma UnifBornReflecting_proper_impl@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f g : X ⇾ Y)\n  : f = g → impl (UnifBornReflecting f, UnifBornReflecting g).\nProof. intros E [HU HB]; split; now rew <-E. Qed.\nCanonical Structure UnifBornReflecting_fun {X Y} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@UnifBornReflecting X Y Φ Ψ 𝒜 ℬ) UnifBornReflecting_proper_impl.\n\nLemma UnifBornInitial_proper_impl@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f g : X ⇾ Y)\n  : f = g → impl (UnifBornInitial f, UnifBornInitial g).\nProof. intros E [HM HR]; split; now rew <-E. Qed.\nCanonical Structure UnifBornInitial_fun {X Y} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@UnifBornInitial X Y Φ Ψ 𝒜 ℬ) UnifBornInitial_proper_impl.\n\nLemma UnifBornEmbedding_proper_impl@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} (f g : X ⇾ Y)\n  : f = g → impl (UnifBornEmbedding f, UnifBornEmbedding g).\nProof. intros E [HI HJ]; split; now rew <-E. Qed.\nCanonical Structure UnifBornEmbedding_fun {X Y} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y} : !(X ⇾ Y) ⇾ SProp\n  := make_weak_spred (@UnifBornEmbedding X Y Φ Ψ 𝒜 ℬ) UnifBornEmbedding_proper_impl.\n\n(** Category structure: identity and composition, for each morphism flavor. *)\n\nLemma id_unif_born_emb `{@UnifBornSpace X Φ 𝒜} : UnifBornEmbedding (id_fun X).\nProof. do 3 (split; try exact _). Qed.\n#[global] Hint Extern 2 (UnifBornEmbedding (id_fun _)) => simple notypeclasses refine id_unif_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornInitial (id_fun _)) => simple notypeclasses refine id_unif_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornMorphism (id_fun _)) => simple notypeclasses refine id_unif_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornReflecting (id_fun _)) => simple notypeclasses refine id_unif_born_emb : typeclass_instances.\n\nLemma compose_unif_born_mor@{u} `{@UnifBornMorphism@{u} X Y Φ Ψ 𝒜 ℬ f} `{@UnifBornMorphism@{u} Y Z Ψ Ξ ℬ 𝒞 g}\n  : UnifBornMorphism (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornMorphism (_ ∘ _)) => simple notypeclasses refine compose_unif_born_mor : typeclass_instances.\n\nLemma compose_unif_born_reflecting@{u} `{@UnifBornReflecting@{u} X Y Φ Ψ 𝒜 ℬ f} `{@UnifBornReflecting@{u} Y Z Ψ Ξ ℬ 𝒞 g}\n  : UnifBornReflecting (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornReflecting (_ ∘ _)) => simple notypeclasses refine compose_unif_born_reflecting : typeclass_instances.\n\nLemma compose_unif_born_initial@{u} `{@UnifBornInitial@{u} X Y Φ Ψ 𝒜 ℬ f} `{@UnifBornInitial@{u} Y Z Ψ Ξ ℬ 𝒞 g}\n  : UnifBornInitial (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornInitial (_ ∘ _)) => simple notypeclasses refine compose_unif_born_initial : typeclass_instances.\n\nLemma unif_born_initial_factor@{u} `{@UnifBornMorphism@{u} X Y Φ Ψ 𝒜 ℬ f, @UnifBornMorphism@{u} Y Z Ψ Ξ ℬ 𝒞 g}\n  : UnifBornInitial (g ∘ f) → UnifBornInitial f.\nProof. intros Hgf. split; try exact _. split.\n  + exact (ufm_refl_factor f g _).\n  + exact (born_refl_factor f g _).\nQed.\n\nLemma unif_born_mor_factor@{u} {X Y Z:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {Ξ:Uniformity Z}\n  {𝒜:Bornology X} {ℬ:Bornology Y} {𝒞:Bornology Z} (f: X ⇾ Y) (g: Y ⇾ Z) `{!UnifBornReflecting g}\n  : UnifBornMorphism (g ∘ f) → UnifBornMorphism f.\nProof. intros Hgf. split.\n  + exact (ufm_cont_factor f g _).\n  + exact (bornological_factor f g _).\nQed.\n\nLemma unif_born_refl_factor@{u} {X Y Z:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {Ξ:Uniformity Z}\n  {𝒜:Bornology X} {ℬ:Bornology Y} {𝒞:Bornology Z} (f: X ⇾ Y) (g: Y ⇾ Z) `{!UnifBornMorphism g}\n  : UnifBornReflecting (g ∘ f) → UnifBornReflecting f.\nProof. intros Hgf. split.\n  + exact (ufm_refl_factor f g _).\n  + exact (born_refl_factor f g _).\nQed.\n\nLemma compose_unif_born_emb@{u} `{@UnifBornEmbedding@{u} X Y Φ Ψ 𝒜 ℬ f} `{@UnifBornEmbedding@{u} Y Z Ψ Ξ ℬ 𝒞 g}\n  : UnifBornEmbedding (g ∘ f).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornEmbedding (_ ∘ _)) => simple notypeclasses refine compose_unif_born_emb : typeclass_instances.\n\n(** Abstract reflection pair instance *)\n\nInductive 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 :=.\n#[global] Hint Extern 0 (Fiber 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact (λ X, Uniformity X ∗ Bornology X) : typeclass_instances.\n#[global] Hint Extern 0 (ObjClass 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact (λ X '(Φ,𝒜), @UnifBornSpace X Φ 𝒜) : typeclass_instances.\n#[global] Hint Extern 0 (HomClass 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact (λ X Y '(Φ,𝒜) '(Ψ,ℬ), @UnifBornMorphism_fun X Y Φ Ψ 𝒜 ℬ) : typeclass_instances.\n#[global] Hint Extern 0 (RflClass 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact (λ X Y '(Φ,𝒜) '(Ψ,ℬ), @UnifBornReflecting_fun X Y Φ Ψ 𝒜 ℬ) : typeclass_instances.\n#[global] Hint Extern 0 (IniClass 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact (λ X Y '(Φ,𝒜) '(Ψ,ℬ), @UnifBornInitial_fun X Y Φ Ψ 𝒜 ℬ) : typeclass_instances.\n#[global] Hint Extern 0 (EmbClass 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact (λ X Y '(Φ,𝒜) '(Ψ,ℬ), @UnifBornEmbedding_fun X Y Φ Ψ 𝒜 ℬ) : typeclass_instances.\n#[global] Hint Extern 2 (Fib 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 ?X) => split : typeclass_instances.\n\nDefinition unif_born_classes@{u} : ReflectionPairClasses@{u} 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧.  Proof. now esplit. Defined.\n#[global] Hint Extern 2 (ReflectionPairClasses 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact unif_born_classes : typeclass_instances.\n\nLemma unif_born_construct : Construct 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧.\nProof. split.\n+ intros X [Φ 𝒜] HX. now change (@UnifBornMorphism X X Φ Φ 𝒜 𝒜 (id_fun X)).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f Hf. change (@UnifBornMorphism X Y Φ Ψ 𝒜 ℬ f) in Hf.\n  now change (@UnifBornSpace X Φ 𝒜).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f Hf. change (@UnifBornMorphism X Y Φ Ψ 𝒜 ℬ f) in Hf.\n  now change (@UnifBornSpace Y Ψ ℬ).\n+ intros X Y Z [Φ 𝒜] [Ψ ℬ] [Ξ 𝒞] f g Hf Hg. now change (@UnifBornMorphism X Z Φ Ξ 𝒜 𝒞 (g ∘ f)).\nQed.\n#[global] Hint Extern 0 (Construct 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact unif_born_construct : typeclass_instances.\n\nLemma unif_born_rfl_construct : RflConstruct 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧.\nProof. split.\n+ intros X [Φ 𝒜] HX. now change (@UnifBornReflecting X X Φ Φ 𝒜 𝒜 (id_fun X)).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f Hf. change (@UnifBornReflecting X Y Φ Ψ 𝒜 ℬ f) in Hf.\n  now change (@UnifBornSpace X Φ 𝒜).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f Hf. change (@UnifBornReflecting X Y Φ Ψ 𝒜 ℬ f) in Hf.\n  now change (@UnifBornSpace Y Ψ ℬ).\n+ intros X Y Z [Φ 𝒜] [Ψ ℬ] [Ξ 𝒞] f g Hf Hg. now change (@UnifBornReflecting X Z Φ Ξ 𝒜 𝒞 (g ∘ f)).\nQed.\n#[global] Hint Extern 0 (RflConstruct 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact unif_born_rfl_construct : typeclass_instances.\n\nLemma unif_born_ini_spec : IniClassSpec 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧.\nProof. hnf; intros; split; intros [??]; now split. Qed.\n#[global] Hint Extern 0 (IniClassSpec 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact unif_born_ini_spec : typeclass_instances.\n\nLemma unif_born_emb_spec : EmbClassSpec 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧.\nProof. hnf; intros; split; intros [??]; now split. Qed.\n#[global] Hint Extern 0 (EmbClassSpec 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact unif_born_emb_spec : typeclass_instances.\n\nLemma unif_born_rfl_pair : ReflectionPair 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧.\nProof. esplit; try exact _.\n+ intros X Y Z [Φ 𝒜] [Ψ ℬ] [Ξ 𝒞] f g Hg Hgf. now apply (unif_born_mor_factor f g).\n+ intros X Y Z [Φ 𝒜] [Ψ ℬ] [Ξ 𝒞] f g Hg Hgf. now apply (unif_born_refl_factor f g).\nQed.\n#[global] Hint Extern 0 (ReflectionPair 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact unif_born_rfl_pair : typeclass_instances.\n\n#[global] Hint Extern 0 (FiberMap 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 𝐔𝐧𝐢𝐟) => exact (λ X '(Φ, 𝒜), Φ) : typeclass_instances.\n#[global] Hint Extern 0 (FiberMap 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 𝐁𝐨𝐫𝐧) => exact (λ X '(Φ, 𝒜), 𝒜) : typeclass_instances.\n#[global] Hint Extern 0 (FiberMap 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 𝐀𝐓𝐨𝐩) => exact (λ X '(Φ, 𝒜), @UniformNeighborhood X Φ) : typeclass_instances.\n\nLemma unifborn_unif_pair_map : PairMorphism 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 𝐔𝐧𝐢𝐟.\nProof. split; try exact _.\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f. now change (UnifBornMorphism f → UniformlyContinuous f). \n+ intros X Y [Φ 𝒜] [Ψ ℬ] f. now change (UnifBornReflecting f → UniformlyReflecting f). \nQed.\n#[global] Hint Extern 0 bl.\nProof. split.\n+ intros X [Φ 𝒜] HX. now change (@GlobalWCUnifMorphism X X Φ Φ 𝒜 𝒜 (id_fun X)).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f Hf. change (GlobalWCUnifMorphism f) in Hf.\n  now change (WCUnifSpace X).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f Hf. change (GlobalWCUnifMorphism f) in Hf.\n  now change (WCUnifSpace Y).\n+ intros X Y Z [Φ 𝒜] [Ψ ℬ] [Ξ 𝒞] f g Hf Hg. now change (GlobalWCUnifMorphism (g ∘ f)).\nQed.\n#[global] Hint Extern 0 (Construct 𝐖𝐂𝐔𝐧𝐢𝐟_gbl) => exact gbl_wcunif_construct : typeclass_instances.\n\nLemma gbl_wcunif_rfl_construct : RflConstruct 𝐖𝐂𝐔𝐧𝐢𝐟_gbl.\nProof. split.\n+ intros X [Φ 𝒜] HX. now change (@GlobalWCUnifReflecting X X Φ Φ 𝒜 𝒜 (id_fun X)).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f Hf. change (GlobalWCUnifReflecting f) in Hf.\n  now change (WCUnifSpace X).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f Hf. change (GlobalWCUnifReflecting f) in Hf.\n  now change (WCUnifSpace Y).\n+ intros X Y Z [Φ 𝒜] [Ψ ℬ] [Ξ 𝒞] f g Hf Hg. now change (GlobalWCUnifReflecting (g ∘ f)).\nQed.\n#[global] Hint Extern 0 (RflConstruct 𝐖𝐂𝐔𝐧𝐢𝐟_gbl) => exact gbl_wcunif_rfl_construct : typeclass_instances.\n\nLemma gbl_wcunif_ini_spec : IniClassSpec 𝐖𝐂𝐔𝐧𝐢𝐟_gbl.\nProof. hnf; intros; split; intros [??]; now split. Qed.\n#[global] Hint Extern 0 (IniClassSpec 𝐖𝐂𝐔𝐧𝐢𝐟_gbl) => exact gbl_wcunif_ini_spec : typeclass_instances.\n\nLemma gbl_wcunif_emb_spec : EmbClassSpec 𝐖𝐂𝐔𝐧𝐢𝐟_gbl.\nProof. hnf; intros; split; intros [??]; now split. Qed.\n#[global] Hint Extern 0 (EmbClassSpec 𝐖𝐂𝐔𝐧𝐢𝐟_gbl) => exact gbl_wcunif_emb_spec : typeclass_instances.\n\nLemma gbl_wcunif_rfl_pair : ReflectionPair 𝐖𝐂𝐔𝐧𝐢𝐟_gbl.\nProof. esplit; try exact _.\n+ intros X Y Z [Φ 𝒜] [Ψ ℬ] [Ξ 𝒞] f g.\n  change (GlobalWCUnifReflecting g → GlobalWCUnifMorphism (g ∘ f) → GlobalWCUnifMorphism f).\n  intros ??. enough (UnifBornMorphism f) by now split.\n  now apply (unif_born_mor_factor f g).\n+ intros X Y Z [Φ 𝒜] [Ψ ℬ] [Ξ 𝒞] f g.\n  change (GlobalWCUnifMorphism g → GlobalWCUnifReflecting (g ∘ f) → GlobalWCUnifReflecting f).\n  intros ??. enough (UnifBornReflecting f) by now split.\n  now apply (unif_born_refl_factor f g).\nQed.\n#[global] Hint Extern 0 (ReflectionPair 𝐖𝐂𝐔𝐧𝐢𝐟_gbl) => exact gbl_wcunif_rfl_pair : typeclass_instances.\n\n#[global] Hint Extern 0 (FiberMap 𝐖𝐂𝐔𝐧𝐢𝐟_gbl 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact (λ X FX, FX) : typeclass_instances.\n\nLemma gbl_wcunif_unifborn_pair_map : PairMorphism 𝐖𝐂𝐔𝐧𝐢𝐟_gbl 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧.\nProof. split; try exact _.\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f. now change (GlobalWCUnifMorphism f → UnifBornMorphism f).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] f. now change (GlobalWCUnifReflecting f → UnifBornReflecting f).\nQed.\n#[global] Hint Extern 0 (PairMorphism 𝐖𝐂𝐔𝐧𝐢𝐟_gbl 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact gbl_wcunif_unifborn_pair_map : typeclass_instances.\n\n#[global] Hint Extern 0 (FiberMap 𝐖𝐂𝐔𝐧𝐢𝐟_gbl 𝐀𝐓𝐨𝐩) => exact (λ X '(Φ, 𝒜), @UniformNeighborhood X Φ) : typeclass_instances.\n\nLemma gbl_wcunif_atop_pair_map : PairMorphism 𝐖𝐂𝐔𝐧𝐢𝐟_gbl 𝐀𝐓𝐨𝐩.\nProof. exact (PairMorphism_compose 𝐖𝐂𝐔𝐧𝐢𝐟_gbl 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 𝐀𝐓𝐨𝐩). Qed.\n#[global] Hint Extern 0 (PairMorphism 𝐖𝐂𝐔𝐧𝐢𝐟_gbl 𝐀𝐓𝐨𝐩) => exact gbl_wcunif_atop_pair_map : typeclass_instances.\n\n\n(** Inverses flip classes *)\nLocal Open Scope fun_inv_scope.\n\nLemma invert_unif_born_mor@{u} `{@UnifBornMorphism@{u} X Y Φ Ψ 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : UnifBornReflecting f⁻¹.\nProof. exact (invert_hom (C:=𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) (f:=f)). Qed.\n#[global] Hint Extern 4 (UnifBornReflecting _⁻¹) => simple notypeclasses refine invert_unif_born_mor : typeclass_instances.\n\nLemma invert_unif_born_reflecting@{u} `{@UnifBornReflecting@{u} X Y Φ Ψ 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : UnifBornMorphism f⁻¹.\nProof. exact (invert_rfl (C:=𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) (f:=f)). Qed.\n#[global] Hint Extern 4 (UnifBornMorphism _⁻¹) => simple notypeclasses refine invert_unif_born_reflecting : typeclass_instances.\n\nLemma invert_unif_born_initial@{u} `{@UnifBornInitial@{u} X Y Φ Ψ 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : UnifBornEmbedding f⁻¹.\nProof. exact (invert_ini (C:=𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) (f:=f)). Qed.\n#[global] Hint Extern 4 (UnifBornEmbedding _⁻¹) => simple notypeclasses refine invert_unif_born_initial : typeclass_instances.\n#[global] Hint Extern 4 (UnifBornInitial _⁻¹) => simple notypeclasses refine invert_unif_born_initial : typeclass_instances.\n\nLemma invert_gbl_wcunif_mor@{u} `{@GlobalWCUnifMorphism@{u} X Y Φ Ψ 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : GlobalWCUnifReflecting f⁻¹.\nProof. exact (invert_hom (C:=𝐖𝐂𝐔𝐧𝐢𝐟_gbl) (f:=f)). Qed.\n#[global] Hint Extern 4 (GlobalWCUnifReflecting _⁻¹) => simple notypeclasses refine invert_gbl_wcunif_mor : typeclass_instances.\n\nLemma invert_gbl_wcunif_reflecting@{u} `{@GlobalWCUnifReflecting@{u} X Y Φ Ψ 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : GlobalWCUnifMorphism f⁻¹.\nProof. exact (invert_rfl (C:=𝐖𝐂𝐔𝐧𝐢𝐟_gbl) (f:=f)). Qed.\n#[global] Hint Extern 4 (GlobalWCUnifMorphism _⁻¹) => simple notypeclasses refine invert_gbl_wcunif_reflecting : typeclass_instances.\n\nLemma invert_gbl_wcunif_initial@{u} `{@GlobalWCUnifInitial@{u} X Y Φ Ψ 𝒜 ℬ f} `{!Inverse f, !Bijective f}\n  : GlobalWCUnifEmbedding f⁻¹.\nProof. exact (invert_ini (C:=𝐖𝐂𝐔𝐧𝐢𝐟_gbl) (f:=f)). Qed.\n#[global] Hint Extern 4 (GlobalWCUnifEmbedding _⁻¹) => simple notypeclasses refine invert_gbl_wcunif_initial : typeclass_instances.\n#[global] Hint Extern 4 (GlobalWCUnifInitial _⁻¹) => simple notypeclasses refine invert_gbl_wcunif_initial : typeclass_instances.\n\nLocal Close Scope fun_inv_scope.\n\nLemma unif_born_split_iff@{u} {X Y Φ Ψ 𝒜 ℬ f} : @UnifBornMorphism@{u} X Y Φ Ψ 𝒜 ℬ f ↔ (UniformlyContinuous f ∧ Bornological f)%sprop.\nProof. now split. Qed.\n\n(** Initial and terminal objects, and global points.\n    The default structures on 𝟎 and 𝟏 are the discrete uniformity and trivial\n    bornology (hints in uniform/basis.v and bornology/basis.v); the lemmas\n    below hold for arbitrary structures satisfying the stated hypotheses. *)\n\nLemma from_empty_unif_born_mor@{u} `{@UnifBornSpace 𝟎 NE 𝒜} `{@UniformSpace@{u} X Φ} `{@BornologicalSpace@{u} X ℬ}\n  : UnifBornMorphism (from_Empty X).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornMorphism (from_Empty _)) => simple notypeclasses refine from_empty_unif_born_mor : typeclass_instances.\n\nLemma to_unit_unif_born_mor@{u} `{@UnifBornSpace@{u} X Φ 𝒜} `{@UnifBornSpace 𝟏 Ψ ℬ}\n  : UnifBornMorphism (to_Unit X).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornMorphism (to_Unit _)) => simple notypeclasses refine to_unit_unif_born_mor : typeclass_instances.\n\nLemma const_unif_born_mor@{u} `{@UnifBornSpace@{u} X Φ 𝒜} `{@UnifBornSpace@{u} Y Ψ ℬ} {y:Y}\n  : UnifBornMorphism (const (X:=X) y).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornMorphism (func_op const _)) => simple notypeclasses refine const_unif_born_mor : typeclass_instances.\n\n(** * Transport of the WCUnif axiom\n\n    A space sitting over a WCUnif space via a globally uniformly continuous,\n    bornological, bornology-reflecting map is itself WCUnif: thicken the\n    image of a bounded set, pull the entourage back.  Each resource is spent\n    once — [f]'s global uniform continuity makes the pulled-back entourage an\n    entourage, and bornology reflection returns the thickening's preimage to\n    the domain bornology.  Subsumes the literal-pullback case\n    ([unif_born/subspace.v : pullback_wc_unif_space]) and transport along\n    the localization counit ([unif_born/localization.v : localized_wcunif]). *)\n\nImport image_notation.\nImport thicken_notation.\n\nLemma wcunif_transport@{u} {X Y:set@{u}} (f:X ⇾ Y)\n  `{@UnifBornMorphism@{u} X Y Φ Ψ 𝒜 ℬ f, !BornologyReflecting f}\n  `{!WCUnifSpace Y} : WCUnifSpace X.\nProof. split; [ now split |]. intros A.\n  pose proof (wcunif_thicken Y (born_image f A)) as [W HW]; change (apos (W.[f⁎ A] ∊ ℬ)) in HW.\n  exists (ufm_preimage f W).\n  enough ( (ufm_preimage f W).[powerset_pt A] ⊆ f* W.[f⁎ A] ) as E.\n  * rew E. exact (subset_pt_is_el (born_preimage f (@to_subset _ _ _ HW))).\n  * intros x'. change ( (∐ x:X, x ∊ A ⊠ (f x, f x') ∊ W)\n                      ⊸ (∐ y:Y, y ∊ f⁎ A ⊠ (y, f x') ∊ W) ).\n  now rew (aex_image f A set:(λ y, (y, f x') ∊ W)).\nQed.\n\n\n(** ** Closed bornology.  The thickening axiom makes the bornology closed:\n    the closure of a set lies in each of its thickenings. *)\nLemma unif_open_closed_born `{@UnifBornSpace X Φ 𝒜} `{!UniformlyOpenBornology X} : ClosedBornology X.\nProof. intros K. pose proof (wcunif_thicken X K) as [U HU].\n  now rew (closure_sub_thicken U K).\nQed.\n\n(** A bornology presented by closed sets is closed.  The converse, in basis\n    form, is [closed_born_basis]. *)\nLemma closed_presentation_closed_born `{@Topology X NX} {𝒜:Bornology X} {Λ:Type} (β : Λ → 𝒫 X)\n  {HB:BornologyPresentation X β} (Hβ : ∀ i, closed (β i)) : ClosedBornology X.\nProof. intros A. pose proof bornology_basis A as [i Hi]; change (apos (powerset_pt A ⊆ β i)) in Hi.\n  rew (ideal_presentation 𝒜 β _). exists i. now rew <-(Hβ i), Hi.\nQed.\n\nLocal Instance born_closure_mapsto `{@ClosedBornology X N 𝒜} : WeakMapsTo closure 𝒜 𝒜.\nProof. intros A ?. exact (born_closure_bounded X (to_subset A)). Qed.\n\nDefinition born_closure `{@ClosedBornology X N 𝒜} : 𝒜 ⇾ 𝒜 := restrict closure 𝒜 𝒜.\nArguments born_closure {_ _ _ _}.\n\n(** The converse of [closed_presentation_closed_born]: the closures of the\n    bounded sets form a basis of a closed bornology. *)\nLemma closed_born_basis `{@Topology X NX} {𝒜:Bornology X} `{!ClosedBornology X} : BornologyBasis (born_closure (X:=X)).\nProof. apply Build_IdealBasis. intros A. exists A. exact (subset_closure _). Qed.\n\nCoercion wcunif_closed_born `{@WCUnifSpace X Φ 𝒜} : ClosedBornology X := unif_open_closed_born.\n\n#[global] Hint Extern 10 (ClosedBornology ?Y) =>\n  match goal with\n  | H : WCUnifMorphism (Y:=Y) _ |- _ => exact (wcunif_mor_Y _ H)\n  | H : WCUnifReflecting (Y:=Y) _ |- _ => exact (wcunif_rfl_Y _ H)\n  | H : WCUnifInitial (Y:=Y) _ |- _ => exact (wcunif_mor_Y _ H)\n  | H : WCUnifEmbedding (Y:=Y) _ |- _ => exact (wcunif_mor_Y _ H)\n  | H : GlobalWCUnifMorphism (Y:=Y) _ |- _ => exact (gbl_wcunif_mor_Y _ H)\n  | H : Global :"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":21603,"e":21606,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":22067,"e":22070,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":22348,"e":22351,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":22635,"e":22638,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":23642,"e":23645,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":23863,"e":23866,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":24055,"e":24058,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":24059,"e":24062,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":24413,"e":24416,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":24417,"e":24420,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":24845,"e":24848,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":24888,"e":24891,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":24892,"e":24895,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The basic theory of sets carrying both a uniformity and a bornology. The combined initial and embedding classes coerce to their uniform and bornological parts. Each map class, whether combined or global well-containment, respects equality of functions, contains the identities and is closed under composition, and the forward and reflecting classes satisfy the cancellation laws. From this the file builds two reflection pairs: 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧, and its restriction 𝐖𝐂𝐔𝐧𝐢𝐟_gbl to well-containment uniform spaces with global maps. It also gives their pair morphisms to uniform, bornological and topological spaces, so the inverse of a bijection swaps the forward and reflecting classes. [[AffineConstructive.topology.unif_born.base.wcunif_transport]] shows that a space mapping into a well-containment space by a uniformly continuous, bornological and bornology-reflecting map is itself a well-containment space. The file ends by proving that the thickening axiom makes the bornology closed, and it packages the closure of bounded sets as [[AffineConstructive.topology.unif_born.base.born_closure]].","short":"Uniform spaces with bornologies: map classes, reflection pairs, transport, closed bornologies","items":[{"name":"AffineConstructive.topology.unif_born.base.UnifBornInitial_UniformlyInitial","base":"UnifBornInitial_UniformlyInitial","kind":"def","start":13,"body":[14,16],"status":"ok","short":{"text":"A map initial for uniformity and bornology together is uniformly initial","status":"ok"},"proof":[{"text":"A map is uniformly initial when it is uniformly continuous and uniformly reflecting. Both halves come from the hypothesis: being uniformly continuous and bornological gives the first, and being uniformly reflecting and bornology-reflecting gives the second.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornInitial_BornologyInitial","base":"UnifBornInitial_BornologyInitial","kind":"def","start":17,"body":[18,20],"status":"ok","short":{"text":"A map initial for uniformity and bornology together is bornologically initial","status":"ok"},"proof":[{"text":"A map is bornologically initial when it is bornological and bornology-reflecting. The hypothesis supplies both halves: the bornological half comes from the forward class, and the reflecting half from the reflecting class.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornEmbedding_UniformlyEmbedding","base":"UnifBornEmbedding_UniformlyEmbedding","kind":"def","start":21,"body":[22,24],"status":"ok","short":{"text":"An embedding of uniform spaces with bornologies is a uniform embedding","status":"ok"},"proof":[{"text":"A uniform embedding is a uniformly initial map that is injective. The map is uniformly initial by [[AffineConstructive.topology.unif_born.base.UnifBornInitial_UniformlyInitial]], and injectivity is part of the hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornEmbedding_BornologyEmbedding","base":"UnifBornEmbedding_BornologyEmbedding","kind":"def","start":25,"body":[26,28],"status":"ok","short":{"text":"An embedding of uniform spaces with bornologies is a bornological embedding","status":"ok"},"proof":[{"text":"A bornological embedding is a bornologically initial map that is injective. The map is bornologically initial by [[AffineConstructive.topology.unif_born.base.UnifBornInitial_BornologyInitial]], and injectivity is part of the hypothesis.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornMorphism_proper_impl","base":"UnifBornMorphism_proper_impl","kind":"prf","start":29,"body":[30,32],"status":"ok","short":{"text":"Being uniformly continuous and bornological is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g, and that f is both uniformly continuous and bornological. Prove each property for g separately: in each case, rewrite g as f using the equality, and the matching hypothesis on f finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornMorphism_fun","base":"UnifBornMorphism_fun","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"Being uniformly continuous and bornological, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]] packaged as a function from !(X ⇾ Y) to strict propositions, with its invariance under equality of functions supplied by [[AffineConstructive.topology.unif_born.base.UnifBornMorphism_proper_impl]] and built by [[AffineConstructive.theory.set.make_weak_spred]].\n\nIn this form the class can serve as the forward class of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], which expects its classes of maps as predicates on the set of functions rather than as bare typeclasses.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornReflecting_proper_impl","base":"UnifBornReflecting_proper_impl","kind":"prf","start":34,"body":[35,37],"status":"ok","short":{"text":"Being uniformly reflecting and bornology-reflecting is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g, and that f is both uniformly reflecting and bornology-reflecting. Prove each property for g separately: in each case, rewrite g as f using the equality, and the matching hypothesis on f finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornReflecting_fun","base":"UnifBornReflecting_fun","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"Being uniformly reflecting and bornology-reflecting, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting]] packaged as a function from !(X ⇾ Y) to strict propositions, its invariance under equality of functions given by [[AffineConstructive.topology.unif_born.base.UnifBornReflecting_proper_impl]].\n\nIt is the reflecting class of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: a map reflects when the uniformity of its domain is the one pulled back from the codomain's, and the preimage of a bounded subset is bounded.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornInitial_proper_impl","base":"UnifBornInitial_proper_impl","kind":"prf","start":39,"body":[40,42],"status":"ok","short":{"text":"Being initial for uniformity and bornology is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g, and that f is in both the forward class and the reflecting class. Prove each class membership for g separately: in each case, rewrite g as f using the equality, and the matching hypothesis on f finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornInitial_fun","base":"UnifBornInitial_fun","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"Being initial for uniformity and bornology, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.UnifBornInitial]], forward and reflecting at once, packaged as a function from !(X ⇾ Y) to strict propositions with its invariance under equality of functions from [[AffineConstructive.topology.unif_born.base.UnifBornInitial_proper_impl]].\n\nIt is the class of initial maps of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], resolved separately from the forward and reflecting classes; [[AffineConstructive.topology.unif_born.base.unif_born_ini_spec]] says that it is exactly their conjunction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornEmbedding_proper_impl","base":"UnifBornEmbedding_proper_impl","kind":"prf","start":44,"body":[45,47],"status":"ok","short":{"text":"Being an embedding of uniform spaces with bornologies is invariant under equality of functions","status":"ok"},"proof":[{"text":"Assume f = g, and that f is initial for the uniformity and the bornology and is injective. Prove each property for g separately: in each case, rewrite g as f using the equality, and the matching hypothesis on f finishes the proof.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.UnifBornEmbedding_fun","base":"UnifBornEmbedding_fun","kind":"def","start":48,"body":null,"status":"ok","short":{"text":"Being an embedding of uniform spaces with bornologies, as a predicate on functions X ⇾ Y","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.UnifBornEmbedding]], initial and injective, packaged as a function from !(X ⇾ Y) to strict propositions with its invariance under equality of functions from [[AffineConstructive.topology.unif_born.base.UnifBornEmbedding_proper_impl]].\n\nIt is the class of embeddings of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]; [[AffineConstructive.topology.unif_born.base.unif_born_emb_spec]] says that it consists exactly of the injective initial maps.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.id_unif_born_emb","base":"id_unif_born_emb","kind":"prf","start":49,"body":[50,52],"status":"ok","short":{"text":"The identity of a uniform space with a bornology is an embedding","status":"ok"},"proof":[{"text":"Unfold the embedding into its parts: the identity must be in the forward class, in the reflecting class, and injective. The identity is a uniform embedding by [[AffineConstructive.topology.uniform.base.id_ufm_emb]] and bornologically initial by [[AffineConstructive.topology.bornology.base.id_bornology_initial]], and it is injective because it is a bijection ([[AffineConstructive.theory.set.id_bijective]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_unif_born_mor","base":"compose_unif_born_mor","kind":"prf","start":57,"body":[58,60],"status":"ok","short":{"text":"A composite of uniformly continuous bornological maps is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"Prove the two halves separately. The composite g ∘ f is uniformly continuous because a composite of uniformly continuous maps is ([[AffineConstructive.topology.uniform.base.compose_ufm_cont]]), and it is bornological because a composite of bornological maps is ([[AffineConstructive.topology.bornology.base.compose_bornological]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_unif_born_reflecting","base":"compose_unif_born_reflecting","kind":"prf","start":62,"body":[63,65],"status":"ok","short":{"text":"A composite of uniformly reflecting, bornology-reflecting maps is again both","status":"ok"},"proof":[{"text":"Being reflecting for both structures means being uniformly reflecting and bornology-reflecting, so the claim splits into two parts. Each part is the corresponding composition law for one structure alone, [[AffineConstructive.topology.uniform.base.compose_ufm_reflecting]] and [[AffineConstructive.topology.bornology.base.compose_bornology_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_unif_born_initial","base":"compose_unif_born_initial","kind":"prf","start":67,"body":[68,70],"status":"ok","short":{"text":"A composite of maps initial for uniformity and bornology is initial","status":"ok"},"proof":[{"text":"An initial map is a morphism that is also reflecting, so the claim splits into these two parts. The composite is a morphism by [[AffineConstructive.topology.unif_born.base.compose_unif_born_mor]] and reflecting by [[AffineConstructive.topology.unif_born.base.compose_unif_born_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_initial_factor","base":"unif_born_initial_factor","kind":"prf","start":72,"body":[73,81],"status":"ok","short":{"text":"If f and g are morphisms and g ∘ f is initial, then f is initial","status":"ok"},"proof":[{"text":"Assume g ∘ f is initial. Since f is already a morphism by hypothesis, what remains is to show that f is reflecting.","status":"ok","from":0,"to":2},{"text":"The reflecting condition splits into its uniform and bornological parts. For the uniform part: g is uniformly continuous and g ∘ f is uniformly reflecting, so f is uniformly reflecting by [[AffineConstructive.topology.uniform.base.ufm_refl_factor]].","status":"ok","from":3,"to":5},{"text":"The bornological part goes the same way: g is bornological and g ∘ f is bornology-reflecting, so [[AffineConstructive.topology.bornology.base.born_refl_factor]] shows that f is bornology-reflecting.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_mor_factor","base":"unif_born_mor_factor","kind":"prf","start":82,"body":[83,90],"status":"ok","short":{"text":"If g is reflecting and g ∘ f is a morphism, then f is a morphism","status":"ok"},"proof":[{"text":"Assume g ∘ f is a morphism. To show that f is one, prove that it is uniformly continuous and that it is bornological.","status":"ok","from":0,"to":2},{"text":"Since g is uniformly reflecting and g ∘ f is uniformly continuous, f is uniformly continuous by [[AffineConstructive.topology.uniform.base.ufm_cont_factor]].","status":"ok","from":3,"to":4},{"text":"Since g is bornology-reflecting and g ∘ f is bornological, f is bornological by [[AffineConstructive.topology.bornology.base.bornological_factor]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_refl_factor","base":"unif_born_refl_factor","kind":"prf","start":91,"body":[92,99],"status":"ok","short":{"text":"If g is a morphism and g ∘ f is reflecting, then f is reflecting","status":"ok"},"proof":[{"text":"Assume g ∘ f is reflecting. To show that f is reflecting, prove that it is uniformly reflecting and that it is bornology-reflecting.","status":"ok","from":0,"to":2},{"text":"Since g is uniformly continuous and g ∘ f is uniformly reflecting, f is uniformly reflecting by [[AffineConstructive.topology.uniform.base.ufm_refl_factor]].","status":"ok","from":3,"to":4},{"text":"Since g is bornological and g ∘ f is bornology-reflecting, f is bornology-reflecting by [[AffineConstructive.topology.bornology.base.born_refl_factor]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.unif_born.base.compose_unif_born_emb","base":"compose_unif_born_emb","kind":"prf","start":100,"body":[101,103],"status":"ok","short":{"text":"A composite of embeddings of uniform spaces with bornologies is an embedding","status":"ok"},"proof":[{"text":"An embedding is an initial map that is injective, so the claim splits into these two parts. The composite is initial by [[AffineConstructive.topology.unif_born.base.compose_unif_born_initial]] and injective by [[AffineConstructive.theory.set.compose_injective]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧","kind":"ind","start":105,"body":null,"status":"ok","short":{"text":"The label of the reflection pair of uniform spaces with bornologies","status":"ok"},"long":{"text":"An empty type used only as a name: the reflection pair of sets carrying a uniformity and a bornology is attached to it. The fibre over a set X is the cartesian product of its uniformities and its bornologies, the objects are the pairs satisfying [[AffineConstructive.topology.interfaces.unif_born.UnifBornSpace]], and the forward, reflecting, initial and embedding classes are [[AffineConstructive.topology.unif_born.base.UnifBornMorphism_fun]], [[AffineConstructive.topology.unif_born.base.UnifBornReflecting_fun]], [[AffineConstructive.topology.unif_born.base.UnifBornInitial_fun]] and [[AffineConstructive.topology.unif_born.base.UnifBornEmbedding_fun]].\n\nWith the label in hand, the general theory of reflection pairs applies to these spaces: the inverse of a forward bijection reflects ([[AffineConstructive.topology.unif_born.base.invert_unif_born_mor]]), and the fibre maps forgetting the bornology, the uniformity, or passing to the uniform topology are pair morphisms to [[AffineConstructive.topology.uniform.base.𝐔𝐧𝐢𝐟]], [[AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧]] and [[AffineConstructive.topology.topology.maps.𝐀𝐓𝐨𝐩]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_rect","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_rect","kind":"scheme","short":{"text":"Elimination of the empty label into types","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_ind","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_ind","kind":"scheme","short":{"text":"Elimination of the empty label into propositions","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_rec","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_rec","kind":"scheme","short":{"text":"Elimination of the empty label into sets","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_sind","base":"𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_sind","kind":"scheme","short":{"text":"Elimination of the empty label into strict propositions","status":"ok"}}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_classes","base":"unif_born_classes","kind":"def","start":113,"body":[114,116],"status":"ok","short":{"text":"The fibres, objects and four classes of maps of the reflection pair 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧","status":"ok"},"proof":[{"text":"Every component of the structure is already determined by the declaration of [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: the fibre over a set (a uniformity together with a bornology), the objects, and the four classes of maps. Filling them in by unification gives the structure.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_construct","base":"unif_born_construct","kind":"prf","start":118,"body":[119,135],"status":"ok","short":{"text":"Uniformly continuous bornological maps contain identities, are closed under composition, join objects","status":"ok"},"proof":[{"text":"Four conditions are to be shown. The identity of each object is a morphism, the domain and the codomain of a morphism are objects, and morphisms compose.","status":"ok","from":0,"to":1},{"text":"Let X carry a uniformity Φ and a bornology 𝒜. The morphism condition on the identity of X asks that it be uniformly continuous and bornological. The identity is in fact an embedding, by [[AffineConstructive.topology.unif_born.base.id_unif_born_emb]], and this gives both.","status":"ok","from":2,"to":4},{"text":"Take a morphism f from X to Y, each set with its uniformity and bornology. Being an object means that X with Φ and 𝒜 is a uniform space with a bornology. A uniformly continuous bornological map carries this for its domain, by [[AffineConstructive.topology.interfaces.unif_born.unif_born_X]].","status":"ok","from":5,"to":8},{"text":"In the same way the codomain Y with Ψ and ℬ is a uniform space with a bornology, which the morphism f supplies by [[AffineConstructive.topology.interfaces.unif_born.unif_born_Y]].","status":"ok","from":9,"to":12},{"text":"For morphisms f from X to Y and g from Y to Z, the composite g ∘ f is uniformly continuous and bornological by [[AffineConstructive.topology.unif_born.base.compose_unif_born_mor]].","status":"ok","from":13,"to":16}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_rfl_construct","base":"unif_born_rfl_construct","kind":"prf","start":137,"body":[138,154],"status":"ok","short":{"text":"Reflecting maps of uniform spaces with bornologies contain identities, compose, and join objects","status":"ok"},"proof":[{"text":"Four conditions are to be shown for the reflecting maps. The identities belong to the class, the domain and the codomain of a reflecting map are objects, and the class is closed under composition.","status":"ok","from":0,"to":1},{"text":"Let X carry a uniformity Φ and a bornology 𝒜. The identity of X is an embedding by [[AffineConstructive.topology.unif_born.base.id_unif_born_emb]], so in particular it reflects both the uniformity and the bornology.","status":"ok","from":2,"to":4},{"text":"Take a reflecting map f from X to Y. Being an object means that X with Φ and 𝒜 is a uniform space with a bornology. The reflecting map f carries this for its domain, by [[AffineConstructive.topology.interfaces.unif_born.unif_born_refl_X]].","status":"ok","from":5,"to":8},{"text":"In the same way the codomain Y with Ψ and ℬ is a uniform space with a bornology, which f supplies by [[AffineConstructive.topology.interfaces.unif_born.unif_born_refl_Y]].","status":"ok","from":9,"to":12},{"text":"For reflecting maps f from X to Y and g from Y to Z, the composite g ∘ f reflects both the uniformity and the bornology, by [[AffineConstructive.topology.unif_born.base.compose_unif_born_reflecting]].","status":"ok","from":13,"to":16}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_ini_spec","base":"unif_born_ini_spec","kind":"prf","start":156,"body":[157,159],"status":"ok","short":{"text":"Initial maps of uniform spaces with bornologies are exactly the forward reflecting ones","status":"ok"},"proof":[{"text":"Fix the sets, their structures and a map f. In each direction, unpack the assumption into its two parts and reassemble them. An initial map is a morphism and reflecting, and a map that is both is initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_emb_spec","base":"unif_born_emb_spec","kind":"prf","start":161,"body":[162,164],"status":"ok","short":{"text":"Embeddings of uniform spaces with bornologies are exactly the injective initial maps","status":"ok"},"proof":[{"text":"An embedding is by definition an injective map that is uniformly continuous and bornological and reflecting for both structures, and [[AffineConstructive.topology.unif_born.base.unif_born_ini_spec]] identifies an initial map with one that is forward and reflecting. Both directions of the equivalence therefore come down to taking the pair of conditions apart and putting it back together.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_rfl_pair","base":"unif_born_rfl_pair","kind":"prf","start":166,"body":[167,175],"status":"ok","short":{"text":"Uniform spaces with bornologies form a reflection pair, with both cancellation laws","status":"ok"},"proof":[{"text":"A reflection pair needs the two classes with identities and composition, the descriptions of initial maps and embeddings, and the two cancellation laws. The first of these are [[AffineConstructive.topology.unif_born.base.unif_born_construct]], [[AffineConstructive.topology.unif_born.base.unif_born_rfl_construct]], [[AffineConstructive.topology.unif_born.base.unif_born_ini_spec]] and [[AffineConstructive.topology.unif_born.base.unif_born_emb_spec]]. The two cancellation laws remain.","status":"ok","from":0,"to":1},{"text":"First law: let f : X ⇾ Y and g : Y ⇾ Z, each set carrying a uniformity and a bornology. Suppose g is reflecting and g ∘ f is a morphism. Then f is a morphism by [[AffineConstructive.topology.unif_born.base.unif_born_mor_factor]].","status":"ok","from":2,"to":4},{"text":"Second law, the dual one: if g is a morphism and g ∘ f is reflecting, then f is reflecting by [[AffineConstructive.topology.unif_born.base.unif_born_refl_factor]].","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.unifborn_unif_pair_map","base":"unifborn_unif_pair_map","kind":"prf","start":180,"body":[181,189],"status":"ok","short":{"text":"Forgetting the bornology is a morphism of reflection pairs from 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 to 𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"A pair morphism must send objects to objects and preserve both classes of maps. The objects are handled by the reflection-pair structures of [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] and [[AffineConstructive.topology.uniform.base.𝐔𝐧𝐢𝐟]]. What remains is that forgetting the bornology preserves morphisms and preserves reflecting maps.","status":"ok","from":0,"to":1},{"text":"Let f : X ⇾ Y have a uniformity and a bornology on each side. A morphism of uniform spaces with bornologies is in particular uniformly continuous, by its definition.","status":"ok","from":2,"to":4},{"text":"In the same way, a map that is reflecting for both structures is in particular uniformly reflecting.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.unifborn_born_pair_map","base":"unifborn_born_pair_map","kind":"prf","start":191,"body":[192,200],"status":"ok","short":{"text":"Forgetting the uniformity is a morphism of reflection pairs from 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 to 𝐁𝐨𝐫𝐧","status":"ok"},"proof":[{"text":"The objects are handled by the reflection-pair structures of [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] and [[AffineConstructive.topology.bornology.base.𝐁𝐨𝐫𝐧]]. What remains is that forgetting the uniformity preserves morphisms and preserves reflecting maps.","status":"ok","from":0,"to":1},{"text":"Let f : X ⇾ Y. A morphism of uniform spaces with bornologies is in particular bornological, by its definition.","status":"ok","from":2,"to":4},{"text":"In the same way, a map that is reflecting for both structures is in particular bornology-reflecting.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.unifborn_atop_pair_map","base":"unifborn_atop_pair_map","kind":"prf","start":202,"body":[203,205],"status":"ok","short":{"text":"Passing to the uniform topology is a morphism of reflection pairs from 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 to 𝐀𝐓𝐨𝐩","status":"ok"},"proof":[{"text":"The pair morphism is the composite of two others: forgetting the bornology, [[AffineConstructive.topology.unif_born.base.unifborn_unif_pair_map]], followed by passing from a uniformity to its topology, [[AffineConstructive.topology.uniform.base.unif_atop_pair_map]]. By [[AffineConstructive.topology.reflection_pair.base.PairMorphism_compose]] the composite of two pair morphisms is a pair morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.GlobalWCUnifMorphism_proper_impl","base":"GlobalWCUnifMorphism_proper_impl","kind":"prf","start":207,"body":[208,211],"status":"ok","short":{"text":"A function equal to a global morphism of well-containment uniform spaces is one too","status":"ok"},"proof":[{"text":"Assume f = g and that f is a global morphism. A global morphism consists of the two well-containment structures and the fact that f is a uniform–bornological morphism. The structures on X and Y carry over to g unchanged, so what remains to show is that g is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornMorphism]].","status":"ok","from":0,"to":1},{"text":"Rewriting g as f by the equality turns the goal into the hypothesis on f.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.base.GlobalWCUnifMorphism_fun","base":"GlobalWCUnifMorphism_fun","kind":"def","start":212,"body":null,"status":"ok","short":{"text":"Global morphisms of well-containment uniform spaces, as a predicate on functions respecting equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifMorphism]], read as a function from !(X ⇾ Y) to strict propositions. A morphism here is a map between well-containment uniform spaces that is uniformly continuous and bornological everywhere. The predicate is a strict proposition, not an affine one, so it is transported along equality of functions in the base logic, by [[AffineConstructive.topology.unif_born.base.GlobalWCUnifMorphism_proper_impl]], and its domain is the functions with their equality affirmed.\n\nIt is declared canonical so that unification recognises the class applied to a function as this predicate applied to it. It is the forward class of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl]]. The lemmas proved there about forward maps, such as [[AffineConstructive.topology.unif_born.base.gbl_wcunif_construct]] and [[AffineConstructive.topology.unif_born.base.gbl_wcunif_rfl_pair]], see the class in this form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.GlobalWCUnifReflecting_proper_impl","base":"GlobalWCUnifReflecting_proper_impl","kind":"prf","start":213,"body":[214,217],"status":"ok","short":{"text":"A function equal to a globally reflecting map of well-containment uniform spaces is one too","status":"ok"},"proof":[{"text":"Assume f = g and that f is globally reflecting. The well-containment structures on X and Y carry over to g unchanged, so what remains to show is that g is a [[AffineConstructive.topology.interfaces.unif_born.UnifBornReflecting]] map.","status":"ok","from":0,"to":1},{"text":"Rewriting g as f by the equality turns the goal into the hypothesis on f.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.base.GlobalWCUnifReflecting_fun","base":"GlobalWCUnifReflecting_fun","kind":"def","start":218,"body":null,"status":"ok","short":{"text":"Globally reflecting maps of well-containment uniform spaces, as a predicate on functions respecting equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifReflecting]] of maps between well-containment uniform spaces that reflect the uniformity and the bornology everywhere, read as a function from !(X ⇾ Y) to strict propositions. [[AffineConstructive.topology.unif_born.base.GlobalWCUnifReflecting_proper_impl]] transports it along equality of functions.\n\nIt is declared canonical, and it is the reflecting class of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl]]. Statements about reflecting maps of that pair, among them [[AffineConstructive.topology.unif_born.base.gbl_wcunif_rfl_construct]] and the cancellation laws of [[AffineConstructive.topology.unif_born.base.gbl_wcunif_rfl_pair]], use it in this form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.GlobalWCUnifInitial_proper_impl","base":"GlobalWCUnifInitial_proper_impl","kind":"prf","start":219,"body":[220,222],"status":"ok","short":{"text":"A function equal to a globally initial map of well-containment uniform spaces is one too","status":"ok"},"proof":[{"text":"Assume f = g and that f is globally initial. A globally initial map is a global morphism that is also globally reflecting. Both conditions hold for g: rewriting g as f turns each one into the matching half of the hypothesis on f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.GlobalWCUnifInitial_fun","base":"GlobalWCUnifInitial_fun","kind":"def","start":223,"body":null,"status":"ok","short":{"text":"Globally initial maps of well-containment uniform spaces, as a predicate on functions respecting equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifInitial]] of maps that are both global morphisms and globally reflecting, read as a function from !(X ⇾ Y) to strict propositions. [[AffineConstructive.topology.unif_born.base.GlobalWCUnifInitial_proper_impl]] transports it along equality of functions.\n\nIt is declared canonical, and it is the class of initial maps of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl]]. Through it, [[AffineConstructive.topology.unif_born.base.gbl_wcunif_ini_spec]] identifies this class with the maps that are forward and reflecting at once.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.GlobalWCUnifEmbedding_proper_impl","base":"GlobalWCUnifEmbedding_proper_impl","kind":"prf","start":224,"body":[225,227],"status":"ok","short":{"text":"A function equal to a global embedding of well-containment uniform spaces is one too","status":"ok"},"proof":[{"text":"Assume f = g and that f is a global embedding, that is, globally initial and injective. Both conditions hold for g: rewriting g as f turns each one into the matching half of the hypothesis on f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.GlobalWCUnifEmbedding_fun","base":"GlobalWCUnifEmbedding_fun","kind":"def","start":228,"body":null,"status":"ok","short":{"text":"Global embeddings of well-containment uniform spaces, as a predicate on functions respecting equality","status":"ok"},"long":{"text":"The class [[AffineConstructive.topology.interfaces.unif_born.GlobalWCUnifEmbedding]] of globally initial injective maps, read as a function from !(X ⇾ Y) to strict propositions. [[AffineConstructive.topology.unif_born.base.GlobalWCUnifEmbedding_proper_impl]] transports it along equality of functions.\n\nIt is declared canonical, and it is the class of embeddings of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl]]. Through it, [[AffineConstructive.topology.unif_born.base.gbl_wcunif_emb_spec]] identifies this class with the injective initial maps.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.base.id_gbl_wcunif_emb","base":"id_gbl_wcunif_emb","kind":"prf","start":229,"body":[230,232],"status":"ok","short":{"text":"The identity of a well-containment uniform space is a global embedding","status":"ok"},"proof":[{"text":"Unfold the global embedding into its parts and supply each one. The well-containment structure on X is given. The identity is an embedding of uniform spaces with bornologies by [[AffineConstructive.topology.unif_born.base.id_unif_born_emb]], and it is injective because it is a bijection.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_morphism","base":"compose_gbl_wcunif_morphism","kind":"prf","start":237,"body":[238,240],"status":"ok","short":{"text":"The composite of two global morphisms of well-containment uniform spaces is one","status":"ok"},"proof":[{"text":"The well-containment structures on X and Z come from the hypotheses. The composite is uniformly continuous and bornological by [[AffineConstructive.topology.unif_born.base.compose_unif_born_mor]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_reflecting","base":"compose_gbl_wcunif_reflecting","kind":"prf","start":242,"body":[243,245],"status":"ok","short":{"text":"The composite of two globally reflecting maps of well-containment uniform spaces is globally reflecting","status":"ok"},"proof":[{"text":"The well-containment structures on X and Z come from the hypotheses. The composite is uniformly reflecting and bornology-reflecting by [[AffineConstructive.topology.unif_born.base.compose_unif_born_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_initial","base":"compose_gbl_wcunif_initial","kind":"prf","start":247,"body":[248,250],"status":"ok","short":{"text":"The composite of two globally initial maps of well-containment uniform spaces is globally initial","status":"ok"},"proof":[{"text":"A globally initial map is a global morphism that is also globally reflecting. The composite has the first property by [[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_morphism]] and the second by [[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_embedding","base":"compose_gbl_wcunif_embedding","kind":"prf","start":252,"body":[253,255],"status":"ok","short":{"text":"The composite of two global embeddings of well-containment uniform spaces is a global embedding","status":"ok"},"proof":[{"text":"The composite is globally initial by [[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_initial]]. It is injective because a composite of injective functions is injective.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl","base":"𝐖𝐂𝐔𝐧𝐢𝐟_gbl","kind":"ind","start":257,"body":null,"status":"ok","short":{"text":"The label for well-containment uniform spaces with global maps, as a reflection pair","status":"ok"},"long":{"text":"An empty type that serves as a name. Hints attached to it make it a reflection pair. The candidate structures on a set X are pairs of a uniformity and a bornology on X. The objects are the well-containment uniform spaces ([[AffineConstructive.topology.interfaces.unif_born.WCUnifSpace]]). The forward, reflecting, initial and embedding classes are the global ones: [[AffineConstructive.topology.unif_born.base.GlobalWCUnifMorphism_fun]], [[AffineConstructive.topology.unif_born.base.GlobalWCUnifReflecting_fun]], [[AffineConstructive.topology.unif_born.base.GlobalWCUnifInitial_fun]] and [[AffineConstructive.topology.unif_born.base.GlobalWCUnifEmbedding_fun]]. It is therefore [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] restricted to the objects that satisfy the thickening axiom, with maps that are controlled everywhere rather than only near bounded sets.\n\nThe reflection-pair axioms are [[AffineConstructive.topology.unif_born.base.gbl_wcunif_rfl_pair]], and the pair maps to [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] by [[AffineConstructive.topology.unif_born.base.gbl_wcunif_unifborn_pair_map]]. Beyond this file, the label is used in topology.unif_born.trapped_cauchy and topology.unif_born.local_maps.","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl_rect","base":"𝐖𝐂𝐔𝐧𝐢𝐟_gbl_rect","kind":"scheme","short":{"text":"The eliminator of the empty label into types","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl_ind","base":"𝐖𝐂𝐔𝐧𝐢𝐟_gbl_ind","kind":"scheme","short":{"text":"The eliminator of the empty label into propositions","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl_rec","base":"𝐖𝐂𝐔𝐧𝐢𝐟_gbl_rec","kind":"scheme","short":{"text":"The eliminator of the empty label into sets","status":"ok"}},{"name":"AffineConstructive.topology.unif_born.base.𝐖𝐂𝐔𝐧𝐢𝐟_gbl_sind","base":"𝐖𝐂𝐔𝐧𝐢𝐟_gbl_sind","kind":"scheme","short":{"text":"The eliminator of the empty label into strict propositions","status":"ok"}}]},{"name":"AffineConstructive.topology.unif_born.base.gbl_wcunif_classes","base":"gbl_wcunif_classes","kind":"def","start":265,"body":[266,268],"status":"ok","short":{"text":"The reflection-pair data of well-containment uniform spaces with global maps","status":"ok"},"proof":[{"text":"Each field of the reflection-pair data is one of the classes of global maps, and each law it requires is one of the facts proved above. Resolution finds all of them.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.gbl_wcunif_construct","base":"gbl_wcunif_construct","kind":"prf","start":270,"body":[271,287],"status":"ok","short":{"text":"Well-containment uniform spaces with global morphisms form a construct","status":"ok"},"proof":[{"text":"A construct asks for four things: identities are morphisms, the domain and the codomain of a morphism are objects, and morphisms compose. Each is taken in turn.","status":"ok","from":0,"to":1},{"text":"Fix a set X with a uniformity Φ and a bornology 𝒜 making it a well-containment uniform space. The identity of X is a global morphism, since it is even a global embedding by [[AffineConstructive.topology.unif_born.base.id_gbl_wcunif_emb]].","status":"ok","from":2,"to":4},{"text":"Given a global morphism f : X ⇾ Y, the goal asks that X be a well-containment uniform space. The hypothesis that f is a global morphism supplies this structure on its domain.","status":"ok","from":5,"to":8},{"text":"In the same way, that f is a global morphism supplies the well-containment structure on its codomain Y.","status":"ok","from":9,"to":12},{"text":"Given global morphisms f : X ⇾ Y and g : Y ⇾ Z, the composite g ∘ f is a global morphism by [[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_morphism]].","status":"ok","from":13,"to":16}]},{"name":"AffineConstructive.topology.unif_born.base.gbl_wcunif_rfl_construct","base":"gbl_wcunif_rfl_construct","kind":"prf","start":289,"body":[290,306],"status":"ok","short":{"text":"Well-containment uniform spaces with globally reflecting maps form a construct","status":"ok"},"proof":[{"text":"The construct axioms are now asked of the globally reflecting maps: identities are reflecting, a reflecting map has well-containment spaces at both ends, and reflecting maps compose.","status":"ok","from":0,"to":1},{"text":"Fix a well-containment uniform space X. Its identity is globally reflecting, since it is a global embedding by [[AffineConstructive.topology.unif_born.base.id_gbl_wcunif_emb]].","status":"ok","from":2,"to":4},{"text":"Given a globally reflecting map f : X ⇾ Y, the hypothesis on f supplies the well-containment structure on its domain X.","status":"ok","from":5,"to":8},{"text":"In the same way, it supplies the structure on its codomain Y.","status":"ok","from":9,"to":12},{"text":"Given globally reflecting maps f : X ⇾ Y and g : Y ⇾ Z, the composite g ∘ f is globally reflecting by [[AffineConstructive.topology.unif_born.base.compose_gbl_wcunif_reflecting]].","status":"ok","from":13,"to":16}]},{"name":"AffineConstructive.topology.unif_born.base.gbl_wcunif_ini_spec","base":"gbl_wcunif_ini_spec","kind":"prf","start":308,"body":[309,311],"status":"ok","short":{"text":"A map of well-containment uniform spaces is globally initial iff globally forward and reflecting","status":"ok"},"proof":[{"text":"Fix a map f. Each direction of the equivalence takes the two components of one side and reassembles them as the other side: a globally initial map is a global morphism that is also globally reflecting, and such a map is globally initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.gbl_wcunif_emb_spec","base":"gbl_wcunif_emb_spec","kind":"prf","start":313,"body":[314,316],"status":"ok","short":{"text":"A global embedding of well-containment uniform spaces is exactly an injective globally initial map","status":"ok"},"proof":[{"text":"Fix a map f. In each direction the two components of one side are taken apart and put together as the other side. A global embedding is an injective globally initial map, and an injective globally initial map is a global embedding. The initial part passes through [[AffineConstructive.topology.unif_born.base.gbl_wcunif_ini_spec]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.gbl_wcunif_rfl_pair","base":"gbl_wcunif_rfl_pair","kind":"prf","start":318,"body":[319,333],"status":"ok","short":{"text":"Well-containment uniform spaces with global maps form a reflection pair, cancellation inherited from uniform-bornological maps","status":"ok"},"proof":[{"text":"A reflection pair asks for its classes, the two construct structures, and the specifications of the initial and embedding classes. These are [[AffineConstructive.topology.unif_born.base.gbl_wcunif_construct]], [[AffineConstructive.topology.unif_born.base.gbl_wcunif_rfl_construct]], [[AffineConstructive.topology.unif_born.base.gbl_wcunif_ini_spec]] and [[AffineConstructive.topology.unif_born.base.gbl_wcunif_emb_spec]]. The two cancellation laws remain.","status":"ok","from":0,"to":1},{"text":"For the first law, fix well-containment uniform spaces X, Y, Z and maps f : X ⇾ Y and g : Y ⇾ Z. Assume that g is globally reflecting and that g ∘ f is a global morphism. It remains to show that f is a global morphism.","status":"ok","from":2,"to":5},{"text":"X and Y are already well-containment uniform spaces, so it suffices that f be a morphism of uniform-bornological spaces. That is the cancellation law [[AffineConstructive.topology.unif_born.base.unif_born_mor_factor]] applied to f and g.","status":"ok","from":6,"to":7},{"text":"For the second law, assume with the same data that g is a global morphism and that g ∘ f is globally reflecting. It remains to show that f is globally reflecting.","status":"ok","from":8,"to":11},{"text":"Again it suffices that f be reflecting as a map of uniform-bornological spaces, and this is [[AffineConstructive.topology.unif_born.base.unif_born_refl_factor]] applied to f and g.","status":"ok","from":12,"to":14}]},{"name":"AffineConstructive.topology.unif_born.base.gbl_wcunif_unifborn_pair_map","base":"gbl_wcunif_unifborn_pair_map","kind":"prf","start":336,"body":[337,345],"status":"ok","short":{"text":"Forgetting the thickening axiom is a morphism of reflection pairs from global well-containment to uniform-bornological","status":"ok"},"proof":[{"text":"A pair morphism asks for the two reflection pairs, [[AffineConstructive.topology.unif_born.base.gbl_wcunif_rfl_pair]] and [[AffineConstructive.topology.unif_born.base.unif_born_rfl_pair]], and for the facts that forward maps go to forward maps and reflecting maps to reflecting maps.","status":"ok","from":0,"to":1},{"text":"Fix f : X ⇾ Y between well-containment uniform spaces. A global morphism is in particular a morphism of uniform-bornological spaces, by forgetting the rest.","status":"ok","from":2,"to":4},{"text":"In the same way, a globally reflecting map is reflecting as a map of uniform-bornological spaces.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.base.gbl_wcunif_atop_pair_map","base":"gbl_wcunif_atop_pair_map","kind":"prf","start":348,"body":[349,351],"status":"ok","short":{"text":"The uniform topology is a morphism of reflection pairs from global well-containment spaces to topological spaces","status":"ok"},"proof":[{"text":"This pair morphism is the composite of the forgetful pair morphism to 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧, [[AffineConstructive.topology.unif_born.base.gbl_wcunif_unifborn_pair_map]], with the passage to the uniform topology, [[AffineConstructive.topology.unif_born.base.unifborn_atop_pair_map]]. It is a pair morphism by [[AffineConstructive.topology.reflection_pair.base.PairMorphism_compose]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_unif_born_mor","base":"invert_unif_born_mor","kind":"prf","start":354,"body":[355,357],"status":"ok","short":{"text":"The inverse of a uniformly continuous bornological bijection is reflecting for both structures","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.base.invert_hom]], which holds in any reflection pair, applied to [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: the inverse of a bijective morphism is reflecting.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_unif_born_reflecting","base":"invert_unif_born_reflecting","kind":"prf","start":359,"body":[360,362],"status":"ok","short":{"text":"The inverse of a reflecting bijection is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.base.invert_rfl]], which holds in any reflection pair, applied to [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: the inverse of a reflecting bijection is a morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_unif_born_initial","base":"invert_unif_born_initial","kind":"prf","start":364,"body":[365,367],"status":"ok","short":{"text":"The inverse of an initial bijection of uniform spaces with bornologies is an embedding","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.base.invert_ini]], which holds in any reflection pair, applied to [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]: the inverse of an initial bijection is an embedding.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_gbl_wcunif_mor","base":"invert_gbl_wcunif_mor","kind":"prf","start":370,"body":[371,373],"status":"ok","short":{"text":"The inverse of a bijective global morphism of well-containment uniform spaces is globally reflecting","status":"ok"},"proof":[{"text":"Well-containment uniform spaces with global maps form a reflection pair. In any reflection pair the inverse of a forward bijection is reflecting, by [[AffineConstructive.topology.reflection_pair.base.invert_hom]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_gbl_wcunif_reflecting","base":"invert_gbl_wcunif_reflecting","kind":"prf","start":375,"body":[376,378],"status":"ok","short":{"text":"The inverse of a bijective globally reflecting map of well-containment uniform spaces is a global morphism","status":"ok"},"proof":[{"text":"Dually, in the reflection pair of well-containment uniform spaces with global maps, the inverse of a reflecting bijection is forward, by [[AffineConstructive.topology.reflection_pair.base.invert_rfl]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.invert_gbl_wcunif_initial","base":"invert_gbl_wcunif_initial","kind":"prf","start":380,"body":[381,383],"status":"ok","short":{"text":"The inverse of a bijective globally initial map of well-containment uniform spaces is a global embedding","status":"ok"},"proof":[{"text":"In the same reflection pair, the inverse of an initial bijection is an embedding, by [[AffineConstructive.topology.reflection_pair.base.invert_ini]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.unif_born_split_iff","base":"unif_born_split_iff","kind":"prf","start":387,"body":[388,390],"status":"ok","short":{"text":"A map is a morphism exactly when it is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"A morphism of uniform spaces with bornologies is by definition the conjunction of uniform continuity and bornologicality. Each direction of the equivalence repackages the two conditions.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.from_empty_unif_born_mor","base":"from_empty_unif_born_mor","kind":"prf","start":391,"body":[392,394],"status":"ok","short":{"text":"The map out of the empty set is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The two conditions are proved separately. The map out of the empty set is uniformly continuous by [[AffineConstructive.topology.uniform.basis.from_empty_ufm_cont]] and bornological by [[AffineConstructive.topology.bornology.basis.from_empty_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.to_unit_unif_born_mor","base":"to_unit_unif_born_mor","kind":"prf","start":396,"body":[397,399],"status":"ok","short":{"text":"The map into the one-point set is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The two halves are separate facts. The map is uniformly continuous because every uniformity on the one-point set is indiscrete ([[AffineConstructive.topology.uniform.basis.unit_uniform_indiscrete]]), and every map into an indiscrete space is uniformly continuous ([[AffineConstructive.topology.uniform.basis.indiscrete_ufm_cont]]). It is bornological by [[AffineConstructive.topology.bornology.basis.to_unit_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.const_unif_born_mor","base":"const_unif_born_mor","kind":"prf","start":401,"body":[402,404],"status":"ok","short":{"text":"A constant map between uniform spaces with bornologies is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The two halves are separate facts: a constant map is uniformly continuous ([[AffineConstructive.topology.uniform.basis.const_ufm_cont]]) and bornological ([[AffineConstructive.topology.bornology.basis.const_bornological]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.base.wcunif_transport","base":"wcunif_transport","kind":"prf","start":408,"body":[409,422],"status":"ok","short":{"text":"A space mapping into a well-containment space by a reflecting-bounded morphism is well-containment","status":"ok"},"proof":[{"text":"X already carries a uniformity and a bornology, which settles the first part of the well-containment structure. What remains is the axiom itself: every bounded subset of X can be thickened by some entourage to a bounded subset.","status":"ok","from":0,"to":1},{"text":"Fix a bounded subset A of X. Since f is bornological, its image f⁎ A is bounded in Y. The well-containment axiom of Y ([[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]]) then gives an entourage W of Y for which the thickening W.[f⁎ A] is bounded.","status":"ok","from":2,"to":3},{"text":"Since f is uniformly continuous, the preimage of W under f is an entourage of X. Take it as the witness. It then suffices to show that its thickening of A is contained in f* W.[f⁎ A], the preimage under f of the bounded set W.[f⁎ A].","status":"ok","from":4,"to":5},{"text":"Assuming that inclusion, the thickening of A is bounded. The bornology is an ideal and therefore a down-set ([[AffineConstructive.interfaces.orders.Ideal_DownSet]]), so it is enough that f* W.[f⁎ A] is bounded. This holds because f reflects bornology and W.[f⁎ A] is bounded.","status":"ok","from":6,"to":8},{"text":"For the inclusion, fix a point x' of X. Membership in the thickening means that there is some x ∊ A with f x W-close to f x'. Membership in the preimage means that there is some y in f⁎ A with y W-close to f x'.","status":"ok","from":9,"to":11},{"text":"The two sides are equivalent: by [[AffineConstructive.orders.subset_images.aex_image]], an existential over the points of f⁎ A is the same as an existential over the points x of A, taken at f x.","status":"ok","from":12,"to":13}]},{"name":"AffineConstructive.topology.unif_born.base.unif_open_closed_born","base":"unif_open_closed_born","kind":"prf","start":423,"body":[424,428],"status":"ok","short":{"text":"If each bounded set has a bounded uniform thickening, the bornology is closed: bounded sets have bounded closures","status":"ok"},"commentary":{"text":"The closure here is taken in the uniform topology, the one the uniformity induces ([[AffineConstructive.topology.interfaces.uniform.UniformNeighborhood]]). Only that topology ties the closure to the thickenings: [[AffineConstructive.topology.uniform.base.closure_sub_thicken]] puts the closure of K inside every U[K], so a single bounded thickening is enough.\n\nThe result specialises to [[AffineConstructive.topology.unif_born.base.wcunif_closed_born]], which says that every well-containment uniform space has a closed bornology.","status":"ok"},"proof":[{"text":"Let K be a bounded set. It remains to show that the closure of K is bounded.","status":"ok","from":0,"to":1},{"text":"By the thickening axiom [[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]] there is an entourage U whose thickening U[K] is bounded.","status":"ok","from":2,"to":2},{"text":"The closure of K lies inside every thickening of K, in particular inside U[K] ([[AffineConstructive.topology.uniform.base.closure_sub_thicken]]). The bornology is downward closed, so the closure is bounded.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.unif_born.base.closed_presentation_closed_born","base":"closed_presentation_closed_born","kind":"prf","start":429,"body":[430,436],"status":"ok","short":{"text":"A bornology presented by a family of closed subsets is closed","status":"ok"},"commentary":{"text":"The proof uses closedness only for the one generator β i that contains the given set, and the presentation makes that generator bounded. This is the presentation form of a sufficient condition. The converse, that a closed bornology

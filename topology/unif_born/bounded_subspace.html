subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices orders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.topology uniform.base uniform.basis uniform.subspace.\nRequire Import bornology.base bornology.basis bornology.subspace.\nRequire Import unif_born.base unif_born.subspace unif_born.local_maps unif_born.localization.\nRequire Import easy rewrite simplify tactics.misc.\n\nLocal Open Scope topology_scope.\nLocal Open Scope sg_op_scope.\nLocal Open Scope grp_scope.\nLocal Open Scope subset_scope.\n\nImport thicken_notation.\nImport image_notation.\nImport tensor_map_notation.\n\nLocal Abbreviation ℒ := localization.\nLocal Abbreviation η := to_localization.\nLocal Abbreviation ε := from_localization.\n\nLocal Abbreviation π₁ := (tensor_proj1 _ _).\nLocal Notation \"f ♯\" := (⟨f,f⟩*) (at level 1, left associativity, format \"f ♯\").\n\nLocal Abbreviation ι := from_subset.\n\n(** The subspace inclusion is locally anything a UnifBorn embedding is:\n    the [Locally*] battery for [from_subset], routed through the\n    [unif_born_*_local] coercions ([from_subset_unif_born_emb]). *)\n#[global] Hint Extern 2 (LocallyUnifBorn            (from_subset ?A)) => simple notypeclasses refine (unif_born_mor_local     (H:=from_subset_unif_born_emb (A:=A))) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (from_subset ?A)) => simple notypeclasses refine (unif_born_mor_local     (H:=from_subset_unif_born_emb (A:=A))) : typeclass_instances.\n#[global] Hint Extern 2 (LocalUniformContinuity     (from_subset ?A)) => simple notypeclasses refine (unif_born_mor_local     (H:=from_subset_unif_born_emb (A:=A))) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (from_subset ?A)) => simple notypeclasses refine (unif_born_refl_local    (H:=from_subset_unif_born_emb (A:=A))) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (from_subset ?A)) => simple notypeclasses refine (unif_born_refl_local    (H:=from_subset_unif_born_emb (A:=A))) : typeclass_instances.\n#[global] Hint Extern 2 (LocalUniformReflection     (from_subset ?A)) => simple notypeclasses refine (unif_born_refl_local    (H:=from_subset_unif_born_emb (A:=A))) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (from_subset ?A)) => simple notypeclasses refine (unif_born_initial_local (H:=from_subset_unif_born_emb (A:=A))) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornEmbedding   (from_subset ?A)) => simple notypeclasses refine (unif_born_emb_local     (H:=from_subset_unif_born_emb (A:=A))) : typeclass_instances.\n\n(** The localization collapses over the trivial subspace bornology of a\n    bounded set: companions of [localization]'s literal-keyed hints, keyed\n    on the subspace bornology of a [powerset_pt]-provenanced subset\n    ([bounded_pullback_bornology_trivial] supplies the [TrivialBornology]\n    witness). *)\n#[global] Hint Extern 2 (UniformlyContinuous (@to_localization ?S ?Φ (pullback_bornology (from_subset (powerset_pt ?K))))) => simple notypeclasses refine (@to_localization_trivial_uc S Φ _ (pullback_bornology (from_subset (powerset_pt K))) _) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (@from_localization ?S ?Φ (pullback_bornology (from_subset (powerset_pt ?K))))) => simple notypeclasses refine (@from_localization_trivial_ur S Φ _ (pullback_bornology (from_subset (powerset_pt K))) _) : typeclass_instances.\n\nSection kit.\n  Universes u.\n  Context `{@UnifBornSpace@{u} X Φ 𝒜} (K:𝒜).\n\n  (** The localization does not change bounded subspaces: the inclusion of\n      the subspace at [K] into [ℒ X] is uniformly continuous\n      ([localize_functorial_alt] at the inclusion, with [ℒ K ≅ K] over the\n      trivial subspace bornology). *)\n  Local Instance bounded_subspace_localized_uc : UniformlyContinuous (η X ∘ ι K).\n  Proof.\n    pose proof localize_functorial_alt (ι K).\n    now change (UniformlyContinuous ((η X ∘ ι K ∘ ε K) ∘ η K)).\n  Qed.\n\n  Lemma bounded_subspace_localized_emb : UnifBornEmbedding (η X ∘ ι K).\n  Proof. repeat (split; try exact _). Qed.\nEnd kit.\n#[global] Hint Extern 2 (UniformlyContinuous (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_uc K) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyEmbedding  (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyInitial    (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornEmbedding   (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornInitial     (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornMorphism    (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornReflecting  (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (Bornological        (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial    (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (BornologyEmbedding  (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n#[global] Hint Extern 2 (Injective           (to_localization _ ∘ from_subset (powerset_pt ?K))) => simple notypeclasses refine (bounded_subspace_localized_emb K) : typeclass_instances.\n\nLemma locally_uc_bounded_restriction `{@LocallyUniformlyContinuous X Y Φ Ψ 𝒜 f} (K:𝒜) : UniformlyContinuous (f ∘ ι K).\nProof.\n  pose proof (localized_uc f _).\n  now change (UniformlyContinuous ((f ∘ ε X) ∘ (η X ∘ ι K))).\nQed.\nArguments locally_uc_bounded_restriction {_ _ _ _ _} f {_} K.\n\nLemma locally_ur_bounded_corestriction `{@LocallyUniformlyReflecting X Y Φ Ψ ℬ f} (K:ℬ) `{!MapsInto f K}\n  : UniformlyReflecting (corestrict f K).\nProof. exact (local_ur_trivial _ (local_ur_factor _ (ι K) _)). Qed.\nArguments locally_ur_bounded_corestriction {_ _ _ _ _} f {_} K {_}.\n\nLemma locally_ur_bounded_restriction `{@LocallyUniformlyReflecting X Y Φ Ψ ℬ f} (K:ℬ)\n  : UniformlyReflecting (restrict f (f* K) K).\nProof. assert (LocallyUniformlyReflecting (f ∘ ι (f* K))) by exact compose_ur_locally_ur.\n  exact (locally_ur_bounded_corestriction (f ∘ ι (f* K)) K).\nQed. \nArguments locally_ur_bounded_restriction {_ _ _ _ _} f {_} K.\n\n\n(** The converse of [locally_uc_bounded_restriction], under regularity:\n    uniform continuity on every bounded subspace upgrades to the cylinder\n    form.  The two cover-form decisions mint the located escapes the\n    cylinder's refutation demands; the thickening axiom supplies the\n    collar room; classically both mints are trivial and the proof\n    degenerates to the thickening argument. *)\nLemma bounded_restrictions_local_uc@{u} `{@RegularWCUnifSpace@{u} X Φ 𝒜} `{@UniformSpace@{u} Y Ψ} (f:X ⇾ Y)\n  (Hf : ∀ K:𝒜, UniformlyContinuous (f ∘ from_subset K))\n  : LocallyUniformlyContinuous f.\nProof. split; try exact _. intros K W.\n  pose proof bornology_regularity_alt K as [K' [EK DK]].\n  pose proof wcunif_thicken X K' as [U HT].\n  pose (K'' := to_subset U.[powerset_pt K']).\n  pose proof Hf K'' as HK''.\n  pose proof subset_pt_is_el (ufm_preimage (f ∘ ι (powerset_pt K'')) W) as [V HV].\n  pose proof uniform_regularity_alt (U ⊓ V) as [R [ER DR]].\n  exists R. intros [x y].\n  change (x ∊ K ∧ near R x y ⊸ near W (f x) (f y)).\n  destruct (DK x) as [HxK'|HxK].\n  + destruct (DR (x, y)) as [Hp|Hp].\n    * apply aimpl_true_r.\n      change (apos ((x,y) ∊ U ∧ (x,y) ∊ V)) in Hp. destruct Hp as [HpU HpV].\n      assert (x ∊ U.[powerset_pt K']) as Hx2 by now rew <-(thicken_expanding _ _).\n      assert (y ∊ U.[powerset_pt K']) as Hy2 by (exists x; now split).\n      change ((to_subset x, to_subset y) ∊ ufm_preimage (f ∘ ι (powerset_pt K'')) W).\n      now rew <-HV.\n    * apply by_contrapositive, aimpl_true_r. now right.\n  + apply by_contrapositive, aimpl_true_r. now left.\nQed.\n\n(** The reflection converse: uniform reflection on every bounded\n    restriction-corestriction upgrades to the cylinder form, by the same\n    two mints, run on the codomain side. *)\nLemma bounded_restrictions_local_ur@{u} `{@UniformSpace@{u} X Φ} `{@RegularWCUnifSpace@{u} Y Ψ ℬ} (f:X ⇾ Y)\n  (Hf : ∀ L:ℬ, UniformlyReflecting (restrict f (f* L) L))\n  : LocallyUniformlyReflecting f.\nProof. split; try exact _. intros L U.\n  pose proof bornology_regularity_alt L as [L' [EL DL]].\n  pose proof wcunif_thicken Y L' as [V HT].\n  pose (L'' := to_subset V.[powerset_pt L']).\n  pose (g := restrict f (f* L'') (powerset_pt L'')).\n  assert (UniformlyReflecting g) by exact (Hf L'').\n  pose proof (ufm_reflection_alt g (ufm_preimage (ι (f* L'')) U)) as [B HB].\n  pose proof subset_pt_is_el B as [W HW].\n  rew <-(HW : _ ⊆ powerset_pt B) in HB.\n  pose proof uniform_regularity_alt (V ⊓ W) as [R [ER DR]].\n  exists R. intros [y y'].\n  change (f y ∊ L ∧ near R (f y) (f y') ⊸ near U y y').\n  destruct (DL (f y)) as [HyL'|HyL].\n  + destruct (DR (f y, f y')) as [Hp|Hp].\n    * apply aimpl_true_r.\n      change (apos ((f y, f y') ∊ V ∧ (f y, f y') ∊ W)) in Hp; destruct Hp as [HpV HpW].\n      assert (f y ∊ V.[powerset_pt L']) as Hy1 by now rew <-(thicken_expanding _ _).\n      assert (f y' ∊ V.[powerset_pt L']) as Hy2 by (exists (f y); now split).\n      change ((to_subset y, to_subset y') ∊ powerset_pt (ufm_preimage (ι (f* L'')) U)).\n      now rew <-HB.\n    * apply by_contrapositive, aimpl_true_r. now right.\n  + apply by_contrapositive, aimpl_true_r. now left.\nQed.\n\n","sentences":[{"i":0,"s":0,"e":609,"kind":"vernac","status":"ok","ms":27,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":610,"e":664,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":665,"e":724,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":725,"e":751,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":752,"e":803,"kind":"vernac","status":"ok","ms":22,"messages":[],"goals":null},{"i":5,"s":804,"e":840,"kind":"vernac","status":"ok","ms":42,"messages":[],"goals":null},{"i":6,"s":841,"e":937,"kind":"vernac","status":"ok","ms":17,"messages":[],"goals":null},{"i":7,"s":938,"e":974,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":975,"e":1060,"kind":"vernac","status":"ok","ms":18,"messages":[],"goals":null},{"i":9,"s":1061,"e":1138,"kind":"vernac","status":"ok","ms":20,"messages":[],"goals":null},{"i":10,"s":1139,"e":1204,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":11,"s":1205,"e":1298,"kind":"vernac","status":"ok","ms":42,"messages":[],"goals":null},{"i":12,"s":1299,"e":1349,"k 1404,"e":11407,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11408,"e":11411,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":11463,"e":11466,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11517,"e":11520,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"This file treats a bounded set K of a space with a uniformity and a bornology as a subspace, with the subspace uniformity and bornology. That bornology is trivial, since every subset of a bounded set is bounded. So the localization does not change the subspace, and the inclusion of K into ℒ X is a uniformly continuous embedding ([[AffineConstructive.topology.unif_born.bounded_subspace.bounded_subspace_localized_uc]], [[AffineConstructive.topology.unif_born.bounded_subspace.bounded_subspace_localized_emb]]). As a consequence, a locally uniformly continuous map is uniformly continuous on each bounded subspace ([[AffineConstructive.topology.unif_born.bounded_subspace.locally_uc_bounded_restriction]]). Dually, a locally uniformly reflecting map is uniformly reflecting on each bounded restriction ([[AffineConstructive.topology.unif_born.bounded_subspace.locally_ur_bounded_corestriction]], [[AffineConstructive.topology.unif_born.bounded_subspace.locally_ur_bounded_restriction]]). For a regular well-containment space the converses hold ([[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_uc]], [[AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_ur]]). Their proofs find the needed entourages with the thickening axiom and both regularities.","short":"Bounded subspaces: unchanged by localization; local uniform continuity versus uniform continuity on bounded sets","items":[{"name":"AffineConstructive.topology.unif_born.bounded_subspace.ℒ","base":"ℒ","kind":"abbrev","start":20,"body":null,"status":"ok","short":{"text":"Local abbreviation: ℒ X is the localization of X","status":"ok"},"long":{"text":"Within this file ℒ X abbreviates [[AffineConstructive.topology.unif_born.localization.localization]] X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.η","base":"η","kind":"abbrev","start":21,"body":null,"status":"ok","short":{"text":"Local abbreviation η for the unit X ⇾ ℒ X of the localization","status":"ok"},"long":{"text":"Within this file η X stands for [[AffineConstructive.topology.unif_born.localization.to_localization]] X, the identity of the underlying set seen as a map from X to its localization ℒ X. The file's main instance concerns η X composed with the inclusion of a bounded subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.ε","base":"ε","kind":"abbrev","start":22,"body":null,"status":"ok","short":{"text":"Local abbreviation ε for the counit ℒ X ⇾ X of the localization","status":"ok"},"long":{"text":"Within this file ε X stands for [[AffineConstructive.topology.unif_born.localization.from_localization]] X, the identity of the underlying set seen as a map from the localization ℒ X back to X. The proofs factor a map through it, writing f as (f ∘ ε X) ∘ η X, so that a property of the map on ℒ X carries over to X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.π₁","base":"π₁","kind":"abbrev","start":23,"body":null,"status":"ok","short":{"text":"Local abbreviation π₁ for the first projection out of a tensor product","status":"ok"},"long":{"text":"Within this file π₁ stands for [[AffineConstructive.theory.set.tensor_proj1]], the first projection X ⊗ Y ⇾ X. It is declared alongside the other abbreviations, and none of the results in the file uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.ι","base":"ι","kind":"abbrev","start":25,"body":null,"status":"ok","short":{"text":"Local abbreviation ι for the inclusion of a subset into its ambient set","status":"ok"},"long":{"text":"Within this file ι K stands for [[AffineConstructive.interfaces.subset.from_subset]] K, the inclusion of the members of a subset K into X. When K is given the subspace uniformity and bornology, ι K is an embedding of uniform spaces with bornologies. The file's results are statements about f ∘ ι K, the restriction of a map to a bounded subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.bounded_subspace_localized_uc","base":"bounded_subspace_localized_uc","kind":"inst","start":39,"body":[40,43],"status":"ok","short":{"text":"The inclusion of a bounded subset K into the localization ℒ X is uniformly continuous","status":"ok"},"proof":[{"text":"Give K the subspace uniformity and bornology. Its inclusion ι K is then an embedding, and so a local morphism. By [[AffineConstructive.topology.unif_born.localization.localize_functorial_alt]], η X ∘ ι K ∘ ε K : ℒ K ⇾ ℒ X is a morphism of uniform spaces with bornologies.","status":"ok","from":0,"to":1},{"text":"The map η X ∘ ι K is that morphism followed after η K, because ε K ∘ η K is the identity of K. On the bounded set K the subspace bornology is trivial ([[AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial]]), so η K is uniformly continuous ([[AffineConstructive.topology.unif_born.localization.to_localization_trivial_uc]]). A composite of uniformly continuous maps is uniformly continuous.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.bounded_subspace_localized_emb","base":"bounded_subspace_localized_emb","kind":"prf","start":44,"body":[45,47],"status":"ok","short":{"text":"The inclusion of a bounded subset K into ℒ X is an embedding of uniform spaces with bornologies","status":"ok"},"proof":[{"text":"An embedding is a map that is uniformly continuous, bornological and reflecting in both senses, and each part is already known. Uniform continuity is [[AffineConstructive.topology.unif_born.bounded_subspace.bounded_subspace_localized_uc]]. The other parts hold for ι K, which is an embedding ([[AffineConstructive.topology.unif_born.subspace.from_subset_unif_born_emb]]), and for η X, which reflects both the uniformity and the bornology ([[AffineConstructive.topology.unif_born.localization.to_localization_refl]]); a composite inherits them.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.locally_uc_bounded_restriction","base":"locally_uc_bounded_restriction","kind":"prf","start":62,"body":[63,66],"status":"ok","short":{"text":"A locally uniformly continuous map is uniformly continuous on every bounded subset","status":"ok"},"proof":[{"text":"Since f is locally uniformly continuous, f ∘ ε X is uniformly continuous on the localization ℒ X ([[AffineConstructive.topology.unif_born.localization.localized_uc]]).","status":"ok","from":0,"to":1},{"text":"Since ε X ∘ η X is the identity, f ∘ ι K equals (f ∘ ε X) ∘ (η X ∘ ι K). The second factor is uniformly continuous by [[AffineConstructive.topology.unif_born.bounded_subspace.bounded_subspace_localized_uc]], so the composite is uniformly continuous.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.locally_ur_bounded_corestriction","base":"locally_ur_bounded_corestriction","kind":"prf","start":68,"body":[69,71],"status":"ok","short":{"text":"A locally uniformly reflecting map with values in a bounded K is uniformly reflecting into K","status":"ok"},"proof":[{"text":"The map f is the corestriction to K followed by the inclusion ι K. That inclusion is uniformly continuous and bornological, being an embedding, and f locally reflects. So the corestriction locally reflects by [[AffineConstructive.topology.unif_born.local_maps.local_ur_factor]]. On the bounded set K the subspace bornology is trivial ([[AffineConstructive.topology.bornology.subspace.bounded_pullback_bornology_trivial]]), and over a trivial bornology on the codomain local uniform reflection is uniform reflection ([[AffineConstructive.topology.unif_born.localization.local_ur_trivial]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.locally_ur_bounded_restriction","base":"locally_ur_bounded_restriction","kind":"prf","start":73,"body":[74,77],"status":"ok","short":{"text":"A locally uniformly reflecting f restricts to a uniformly reflecting map f* K ⇾ K for bounded K","status":"ok"},"proof":[{"text":"First restrict the domain. The inclusion of f* K is a uniform embedding and hence uniformly reflecting. Following it by the locally uniformly reflecting f gives a locally uniformly reflecting map f ∘ ι (f* K) ([[AffineConstructive.topology.unif_born.local_maps.compose_ur_locally_ur]]).","status":"ok","from":0,"to":1},{"text":"This map takes its values in K, because f maps the preimage f* K into K. Its corestriction to K is the restriction of f in question, which is uniformly reflecting by [[AffineConstructive.topology.unif_born.bounded_subspace.locally_ur_bounded_corestriction]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_uc","base":"bounded_restrictions_local_uc","kind":"prf","start":79,"body":[80,109],"status":"ok","short":{"text":"On a regular well-containment space, uniform continuity on every bounded subset gives local uniform continuity","status":"ok"},"proof":[{"text":"The structural parts of local uniform continuity hold already, so only the local condition remains. Fix a bounded K and an entourage W of Y. It remains to find an entourage of X such that any pair close under it, with first point in K, is sent to a W-close pair.","status":"ok","from":0,"to":2},{"text":"Regularity of the bornology ([[AffineConstructive.topology.bornology.base.bornology_regularity_alt]]) gives a bounded K' ⊇ K such that every point lies in K' or outside K.","status":"ok","from":3,"to":3},{"text":"The thickening axiom ([[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]]) gives an entourage U whose thickening U[K'] is bounded. Call this bounded set K''.","status":"ok","from":4,"to":5},{"text":"Specialise the hypothesis at K'': f is uniformly continuous on K''. So the preimage of W under f ∘ ι K'' is an entourage of the subspace K'', and it contains the restriction to K'' of some entourage V of X.","status":"ok","from":6,"to":7},{"text":"Regularity of the uniformity at U ⊓ V ([[AffineConstructive.topology.uniform.base.uniform_regularity_alt]]) gives an entourage R ⊆ U ⊓ V such that every pair is (U ⊓ V)-close or R-apart.","status":"ok","from":8,"to":8},{"text":"Take R as the witness and fix a pair (x, y). It remains to show that x ∊ K ∧ near R x y implies that f x and f y are W-close.","status":"ok","from":9,"to":11},{"text":"Decide x by the property of K': it lies in K' or outside K. In the first case, decide the pair by the property of R. If the pair is (U ⊓ V)-close, the conclusion is proved outright and the hypothesis of the implication is not used. It remains to show that f x and f y are W-close.","status":"ok","from":12,"to":16},{"text":"The pair is both U-close and V-close. The point x lies in U[K'], because K' lies in its thickening ([[AffineConstructive.topology.uniform.base.thicken_expanding]]). The point y lies there too, since it is U-close to x ∊ K'.","status":"ok","from":17,"to":20},{"text":"So x and y are points of K'' that are V-close. The restriction of V to K'' lies in the preimage of W under f ∘ ι K'', so f x and f y are W-close.","status":"ok","from":21,"to":22},{"text":"If instead the pair is R-apart, prove the contrapositive. The dual of the additive conjunction is the disjunction \"x is outside K or x, y are R-apart\", and the second disjunct is what this case gives.","status":"ok","from":23,"to":25},{"text":"In the remaining case x lies outside K, and the contrapositive holds by the first disjunct. Here the two decisions do all the work: thickening and uniform continuity on K'' are needed only for pairs that are close and start in K'.","status":"ok","from":26,"to":29}]},{"name":"AffineConstructive.topology.unif_born.bounded_subspace.bounded_restrictions_local_ur","base":"bounded_restrictions_local_ur","kind":"prf","start":110,"body":[111,142],"status":"ok","short":{"text":"Into a regular well-containment space, uniform reflection over every bounded subset gives local uniform reflection","status":"ok"},"proof":[{"text":"The structural parts of local uniform reflection hold already, so only the local condition remains. Fix a bounded L of Y and an entourage U of X. It remains to find an entourage of Y such that every pair whose images are close under it, with the first image in L, is U-close.","status":"ok","from":0,"to":2},{"text":"Regularity of the bornology of Y ([[AffineConstructive.topology.bornology.base.bornology_regularity_alt]]) gives a bounded L' ⊇ L such that every point lies in L' or outside L.","status":"ok","from":3,"to":3},{"text":"The thickening axiom ([[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]]) gives an entourage V of Y whose thickening V[L'] is bounded. Call this bounded set L''.","status":"ok","from":4,"to":5},{"text":"Let g : f* L'' ⇾ L'' be the restriction of f. Specialising the hypothesis at L'' shows that g is uniformly reflecting.","status":"ok","from":6,"to":7},{"text":"Since g reflects, the restriction of U to f* L'' contains the g-preimage of some entourage B of the subspace L'' ([[AffineConstructive.topology.uniform.base.ufm_reflection_alt]]). In turn B contains the restriction to L'' of an entourage W of Y. So pairs of points of f* L'' whose images are W-close are U-close.","status":"ok","from":8,"to":10},{"text":"Regularity of the uniformity of Y at V ⊓ W ([[AffineConstructive.topology.uniform.base.uniform_regularity_alt]]) gives R ⊆ V ⊓ W such that every pair is (V ⊓ W)-close or R-apart.","status":"ok","from":11,"to":11},{"text":"Take R as the witness and fix a pair (y, y') of points of X. It remains to show that f y ∊ L ∧ near R (f y) (f y') implies that y and y' are U-close.","status":"ok","from":12,"to":14},{"text":"Decide f y by the property of L': it lies in L' or outside L. In the first case, decide the pair of images by the property of R. If the images are (V ⊓ W)-close, the conclusion is proved outright. It remains to show that y and y' are U-close.","status":"ok","from":15,"to":19},{"text":"The images are both V-close and W-close. The point f y lies in V[L'], since L' lies in its thickening ([[AffineConstructive.topology.uniform.base.thicken_expanding]]). The point f y' lies there too, since it is V-close to f y ∊ L'. So y and y' are points of f* L''.","status":"ok","from":20,"to":22},{"text":"As points of f* L'', their images under g are W-close. The inclusion obtained from B then makes them U-close.","status":"ok","from":23,"to":24},{"text":"If instead the images are R-apart, prove the contrapositive. Its conclusion is the disjunction \"f y is outside L or the images are R-apart\", and the second disjunct is what this case gives.","status":"ok","from":25,"to":27},{"text":"In the remaining case f y lies outside L, and the contrapositive holds by the first disjunct.","status":"ok","from":28,"to":31}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment axioms, global and local morphisms, local completions","summary":"The interface for sets carrying both a uniformity and a bornology. It sets up the chassis [[UnifBornSpace]], with no axiom linking the two structures, and then the linking axioms: [[UniformlyOpenBornology]] (bounded sets have bounded uniform thickenings), which defines the well-containment uniform spaces [[WCUnifSpace]] and their regular form [[RegularWCUnifSpace]], [[ClosedBornology]], and the well-containment relation [[well_contained]]. It defines the morphism classes in two flavours. The global ones ([[UnifBornMorphism]], [[GlobalWCUnifInitial]], …) are uniformly continuous and bornological everywhere. The local ones are built on [[LocalUniformContinuity]] and [[LocalUniformReflection]], uniform control near bounded sets, and run up to [[WCUnifMorphism]] and [[WCUnifEmbedding]]. The file closes with the universal property of a local completion, [[LocalCompletion]] and [[LocallyComplete]], and with the resolution hints that recover the codomain's structure from a morphism. The underlying structures come from the uniform and bornology interfaces; the theory, the trapped completion and localization are developed in the topology/unif_born files."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"../uniform/base.html","short":"Uniform spaces: entourage algebra, thickenings, uniform topology, uniform maps, the reflection pair","summary":"The basic theory of uniform spaces. It equips a uniformity with its algebraic structure (a sublattice and sub-star-semigroup of relations), derives the splitting and symmetry consequences of the axioms and the composition laws for closeness, and develops thickenings U[A] of subsets: monotonicity, composition, singletons, and the swap law for a thickening apart from a set. The uniform topology is built from the entourages, with interior, closure and density described by entourages; separated uniform spaces are shown Hausdorff, and regular ones strong. For maps it characterises uniform continuity and reflection by preimages under f × f, introduces the pullback of entourages [[ufm_preimage]], proves closure under identity, composition and the cancellation laws, and assembles uniform spaces into the reflection pair [[𝐔𝐧𝐢𝐟]] with a morphism to topological spaces. It ends with thickening and closure estimates along dense and uniformly reflecting maps, used by the completion and trapped-completion files."},"AffineConstructive.topology.uniform.basis":{"page":"../uniform/basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.uniform.subspace":{"page":"../uniform/subspace.html","short":"Pulled-back uniformities, uniformly initial maps, and uniform subspaces","summary":"The file pulls a uniformity back along a function f : X ⇾ Y: the entourages of X are the relations containing the preimage under f × f of an entourage of Y. This is presented by the preimages of the entourages, a basis of Y pulls back to a basis, and when Y is a uniform space so is X ([[pullback_uniform_space]]), with f uniformly initial, and a uniform embedding when f is injective. The universal property ([[pullback_uniformity_initial]]) makes the construction a cleavage of the reflection pair of uniform spaces ([[unif_cloven_pair]]), which gives the characterisations of uniformly initial maps by lifting ([[uniformly_initial_alt]], [[uniformly_initial_alt2]]). Subspaces are the case of the inclusion of a subset: the inclusion is a uniform embedding, a subspace of a separated space is separated, and a dense map restricted over an open subset stays dense ([[dense_open_restrict]])."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.bornology.basis":{"page":"../bornology/basis.html","short":"Bornologies presented by bases, basis criteria for maps, the trivial bornology","summary":"This file builds bornologies from bases and gives criteria stated in terms of bases. [[presented_bornology]] turns any family of subsets into the bornology it generates downward. [[presented_bornological_space]] shows that this bornology satisfies the axioms of a bornological space when the family is order-preserving on an up-directed index set and covers every point. Conversely, a basis of a bornological space covers the points, has an inhabited index set and is up-directed. [[born_by_basis]] and [[bornology_refl_by_basis]] check that a map is bornological, or bornology-reflecting, by checking basis sets only. The file then treats the trivial bornology, in which every subset is bounded, and shows that maps out of the empty set, maps into the one-point set and constant maps are bornological; every bornology on the one-point set is trivial."},"AffineConstructive.topology.bornology.subspace":{"page":"../bornology/subspace.html","short":"Initial (pullback) bornologies along a map, subspace bornologies, and bornologies as a cloven reflection pair","summary":"The file builds the initial bornology along a map f : X ⇾ Y: the subsets of X whose image under f is bounded. It proves that this is a bornology, that f is bornological and bornologically initial for it, and installs it as the cleavage of the reflection pair of bornological spaces, which makes that pair cloven and saturated ([[born_cloven_pair]]). From the general theory of reflection pairs it obtains the characterisations of initial maps by cancellation against arbitrary maps g ([[bornology_initial_alt]], [[bornology_initial_alt2]]). Subspaces are the case of a subset's inclusion: that inclusion is a bornological embedding ([[from_subset_born_emb]]), and a bounded subset carries the trivial subspace bornology ([[bounded_pullback_bornology_trivial]]). This parallels the subspace construction for uniform spaces."},"AffineConstructive.topology.unif_born.base":{"page":"base.html","short":"Uniform spaces with bornologies: map classes, reflection pairs, transport, closed bornologies","summary":"The basic theory of sets carrying both a uniformity and a bornology. The combined initial and embedding classes coerce to their uniform and bornological parts. Each map class, whether combined or global well-containment, respects equality of functions, contains the identities and is closed under composition, and the forward and reflecting classes satisfy the cancellation laws. From this the file builds two reflection pairs: 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧, and its restriction 𝐖𝐂𝐔𝐧𝐢𝐟_gbl to well-containment uniform spaces with global maps. It also gives their pair morphisms to uniform, bornological and topological spaces, so the inverse of a bijection swaps the forward and reflecting classes. [[wcunif_transport]] shows that a space mapping into a well-containment space by a uniformly continuous, bornological and bornology-reflecting map is itself a well-containment space. The file ends by proving that the thickening axiom makes the bornology closed, and it packages the closure of bounded sets as [[born_closure]]."},"AffineConstructive.topology.unif_born.subspace":{"page":"subspace.html","short":"Pullbacks and subspaces of uniform spaces with bornologies, and well-containment spaces","summary":"This file gives the initial, or pullback, structure for uniform spaces with bornologies. A uniform space with a bornology has no axiom linking its two components, so the initial structure along f : X ⇾ Y is the pair made of the pullback uniformity and the pullback bornology, and f is initial for it. Pullback therefore serves as the cleavage of the reflection pair [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] ([[unifborn_cloven_pair]]), and initial maps are characterised by testing against all maps from other uniform spaces with bornologies ([[unif_born_initial_alt]]). The well-containment axiom survives pullback ([[pullback_wc_unif_space]]), so the same test can be restricted to well-containment spaces ([[wcunif_initial_alt]]). Taking f to be a subset inclusion gives the subspace structure, and the inclusion is an embedding ([[from_subset_unif_born_emb]]). The file builds on the uniform and bornological subspace files."},"AffineConstructive.topology.unif_born.local_maps":{"page":"local_maps.html","short":"Locally uniform maps: composition, factoring, inversion, topology, and their reflection pairs","summary":"The file develops the basic theory of the local classes of maps between uniform spaces with bornologies. These are the maps that are uniformly continuous, or uniformly reflecting, near bounded sets. It shows that each class respects equality of functions. Globally uniform maps are local ([[uc_local_uc]], [[ur_local_ur]]). The classes contain identities and are closed under composition. Here the forward composite needs the first map to be bornological, and the reflecting composite needs the second map to reflect the bornology. The factoring lemmas give the cancellation laws, inverses swap the forward and reflecting classes, and the local classes descend to continuity and continuous reflection. Further results show that locally initial maps out of separated spaces are embeddings, and that local reflection lifts along dense maps ([[ufm_dense_locally_initial]]). Finally, the file packages the local classes as the reflection pairs [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_loc]] and [[𝐖𝐂𝐔𝐧𝐢𝐟]], with pair morphisms from the global pairs and to [[𝐀𝐓𝐨𝐩]]."},"AffineConstructive.topology.unif_born.localization":{"page":"localization.html","short":"The localization ℒ X: the uniformity that makes local uniform conditions global","summary":"This file builds the localization ℒ X of a uniform space X with a bornology. ℒ X has the same points as X. Its uniformity is the largest one inside the filter of relations V such that, for every bounded K, some entourage U has the pairs of U starting in K inside V. The identity maps ε : ℒ X ⇾ X and η : X ⇾ ℒ X give the universal property. A map f is uniformly continuous near bounded sets exactly when f ∘ ε is uniformly continuous ([[localized_uc]], [[localized_uc_conv]]). For f dense into a well-containment space, f is locally uniformly reflecting exactly when η ∘ f is uniformly reflecting ([[localized_ur]], [[localized_ur_conv]]). The localization preserves separation and well-containment, collapses to X under a trivial bornology, and is idempotent. The file then lifts local maps to global maps between localizations, and from these derives the dense descent results of `unif_born/local_maps.v` for the local classes."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

unif_born.local_completion","name":"to_trapped_retract_complete_inverse","kind":"inst","local":true},{"s":28560,"e":28562,"lib":"AffineConstructive.topology.unif_born.local_completion","name":"Er","kind":"abbrev","local":true},{"s":28600,"e":28615,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"LocallyComplete","kind":"class","local":false,"page":"../interfaces/unif_born.html"},{"s":28616,"e":28617,"lib":"AffineConstructive.topology.unif_born.local_completion","name":"complete_locally_complete.X","kind":"var","local":true},{"s":28635,"e":28662,"lib":"AffineConstructive.topology.unif_born.local_completion","name":"to_trapped_retract_complete","kind":"thm","local":true},{"s":28665,"e":28667,"lib":"AffineConstructive.topology.unif_born.local_completion","name":"Er","kind":"abbrev","local":true},{"s":28731,"e":28746,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"LocallyComplete","kind":"class","local":false,"page":"../interfaces/unif_born.html"},{"s":28754,"e":28778,"lib":"AffineConstructive.topology.unif_born.local_completion","name":"complete_locally_inverse","kind":"inst","local":true},{"s":28812,"e":28837,"lib":"AffineConstructive.topology.unif_born.local_completion","name":"complete_locally_complete","kind":"thm","local":true},{"s":28887,"e":28907,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"LocalCompleteInverse","kind":"class","local":false,"page":"../interfaces/unif_born.html"},{"s":28942,"e":28966,"lib":"AffineConstructive.topology.unif_born.local_completion","name":"complete_locally_inverse","kind":"inst","local":true},{"s":5393,"e":5396,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5778,"e":5781,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5831,"e":5834,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5887,"e":5890,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5951,"e":5954,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":6098,"e":6101,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7261,"e":7264,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7427,"e":7430,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15887,"e":15890,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":16295,"e":16298,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":16299,"e":16302,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":24302,"e":24305,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":24427,"e":24430,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":24564,"e":24567,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":25807,"e":25810,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":28341,"e":28344,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file instantiates the abstract completion theory of reflection pairs at well-containment uniform spaces (𝐖𝐂𝐔𝐧𝐢𝐟), with the trapped completion 𝒯 as the canonical completion. It first relates the concrete notions to the pair-level ones in both directions: a local completion is a pair completion ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]]) and conversely ([[AffineConstructive.topology.unif_born.local_completion.wcunif_completion]]), and likewise for locally complete spaces. It then shows that 𝒯 X with its unit τ, the induced maps [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] and the reflections [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] form a canonical completion that preserves initial maps. From this the general theorems of `reflection_pair/completion.v` carry over: completions are locally complete, the universal property extends to dense reflecting maps, a separated space with a dense locally complete subspace is locally complete, a retraction of τ X gives local completeness, and a dense reflecting map has a locally uniformly continuous extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]]. Last, a complete uniform space with a well-containment bornology is locally complete.","short":"Local completions of well-containment uniform spaces, through the reflection-pair completion theory","items":[{"name":"AffineConstructive.topology.unif_born.local_completion.id","base":"id","kind":"abbrev","start":15,"body":null,"status":"ok","short":{"text":"Local shorthand for the identity function on a set","status":"ok"},"long":{"text":"A local abbreviation: id stands for [[AffineConstructive.interfaces.set.id_fun]] with the set inferred. It is used in the equations that say a map is a retraction, r ∘ f = id.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.ℒ","base":"ℒ","kind":"abbrev","start":16,"body":null,"status":"ok","short":{"text":"Local name for the localization ℒ X of a uniform space with a bornology","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.localization]]: ℒ X is the set X with the same points and the same bornology, carrying the localized uniformity. The file declares it alongside its other abbreviations, and no statement or proof here uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.ε","base":"ε","kind":"abbrev","start":17,"body":null,"status":"ok","short":{"text":"Local shorthand ε for the counit ℒ X ⇾ X of the localization","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.from_localization]], the identity of the underlying set, read as a map from the localization back to X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.η","base":"η","kind":"abbrev","start":18,"body":null,"status":"ok","short":{"text":"Local shorthand η for the unit X ⇾ ℒ X of the localization","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.to_localization]], the identity of the underlying set, read as a map from X to its localization.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.κ","base":"κ","kind":"abbrev","start":19,"body":null,"status":"ok","short":{"text":"Local shorthand κ for the unit X ⇾ 𝒞 X of the Cauchy completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy]], which sends a point to its principal filter. Here it compares the trapped completion with the Cauchy completion when X is complete as a uniform space.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.𝒞","base":"𝒞","kind":"abbrev","start":20,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒞 for the Cauchy completion, the set of Cauchy filters","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_filter_set]]: the Cauchy filters on a uniform space, with the Cauchy equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.𝒞₁","base":"𝒞₁","kind":"abbrev","start":21,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒞₁ for the action of the Cauchy completion on maps","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]]: the map 𝒞 X ⇾ 𝒞 Y induced by a uniformly continuous f, taking image filters.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.𝒯","base":"𝒯","kind":"abbrev","start":22,"body":null,"status":"ok","short":{"text":"Local name for the trapped completion 𝒯 X: Cauchy filters on X with a bounded member","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_cauchy_filter_set]]. 𝒯 X is the set of Cauchy filters on X that have a bounded member, with the equality of the Cauchy completion 𝒞 X. In this file 𝒯 is the canonical completion of the reflection pair of well-containment uniform spaces ([[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completor]]). Its unit is τ X, its action on maps is [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]], and its reflections are [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]]. The file also shows that 𝒯 X is locally complete ([[AffineConstructive.topology.unif_born.local_completion.trapped_complete_inverse]], [[AffineConstructive.topology.unif_born.local_completion.trapped_complete]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.τ","base":"τ","kind":"abbrev","start":23,"body":null,"status":"ok","short":{"text":"Local shorthand τ for the unit X ⇾ 𝒯 X sending a point to its principal trapped filter","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped]]. Here 𝒯 X is the trapped completion: the Cauchy filters on X that have a bounded member, with the equality of 𝒞 X. τ X sends a point of X to its principal filter, which is trapped because it contains a singleton. In this file τ is the unit of the canonical completion [[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completor]]. A locally complete space is one where τ has an inverse, and that inverse is the last factor of [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]]. On a complete uniform space, [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec]] gives a retraction of τ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.β","base":"β","kind":"abbrev","start":24,"body":null,"status":"ok","short":{"text":"Local shorthand β for the inclusion 𝒯 X ⇾ 𝒞 X, which forgets that a Cauchy filter is trapped","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.from_trapped]]. A point of 𝒯 X is a Cauchy filter on X with a bounded member, and β X reads it as a point of the Cauchy completion 𝒞 X. The two sets have the same equality, so β X is the inclusion. It factors the Cauchy unit, β X ∘ τ X = κ X. The file uses this in [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec]]: on a complete uniform space, composing β X with the inverse of κ X retracts τ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.𝒯₁","base":"𝒯₁","kind":"abbrev","start":25,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒯₁ for the action of the trapped completion on morphisms","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]]: the map 𝒯 X ⇾ 𝒯 Y induced by a morphism of well-containment uniform spaces.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.R","base":"R","kind":"abbrev","start":26,"body":null,"status":"ok","short":{"text":"Local shorthand R for the reflection Z ⇾ 𝒯 X of a dense reflecting map","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]]. Given a dense, locally reflecting f : X ⇾ Z, it is the map Z ⇾ 𝒯 X whose composite with f is the unit τ X. It supplies the reflects of the canonical completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion_reflect","base":"wcunif_pair_completion_reflect","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"Reads a local-completion operation on ι as the pair-level extension datum of ι at 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"long":{"text":"Given the local-completion operation on ι : X ⇾ Y, which assigns a map Z ⇾ Y to each dense initial f : X ⇾ Z, this definition repackages it as a [[AffineConstructive.topology.reflection_pair.completion.PairCompletionReflect]] for the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟. At the pair level, the structure on Z is a single element of the fibre, a pair of a uniformity and a bornology. The definition unpacks that pair and passes its components to [[AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial]].\n\nA global hint installs this translation, so the abstract theorems of the reflection-pair completion theory apply whenever a concrete local completion is in context.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_pair_complete_inverse","base":"wcunif_pair_complete_inverse","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"Reads a local complete-inverse datum on X as the pair-level complete-inverse datum at 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"long":{"text":"This is the special case of [[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion_reflect]] for the identity of X. It turns the retractions that [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] provides for dense initial extensions of X into the corresponding [[AffineConstructive.topology.reflection_pair.completion.PairCompleteInverse]]. Like the general case, it is registered as a hint.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion","base":"wcunif_pair_completion","kind":"prf","start":33,"body":[34,42],"status":"ok","short":{"text":"A local completion ι is a completion of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"A completion of the reflection pair asks that Y be Hausdorff, that ι be initial and dense, and for laws on the extension datum, which is the local completion's operation read at the pair level ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion_reflect]]). Hausdorffness follows from separatedness by [[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]. Initiality and density come from the local completion. Two laws about the extension remain.","status":"ok","from":0,"to":1},{"text":"Let Z carry a structure of the pair, that is, a uniformity Ξ and a bornology 𝒵, and let f : X ⇾ Z be initial and dense. The extension of ι along f is a morphism because the local completion requires it.","status":"ok","from":2,"to":4},{"text":"For the same Z and f, the extension composed with f is ι. This is the defining equation of the local completion's extension.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_complete_obj","base":"wcunif_complete_obj","kind":"prf","start":43,"body":[44,46],"status":"ok","short":{"text":"A locally complete space is a complete object of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"Local completeness of X says that the identity of X is a local completion. By [[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]] the identity is then a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟, and this is what it means for X to be a complete object.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_completion_reflect","base":"wcunif_completion_reflect","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"Reads a pair-level completion-reflect datum at 𝐖𝐂𝐔𝐧𝐢𝐟 as a local completion-reflect datum on ι","status":"ok"},"long":{"text":"This is the converse of [[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion_reflect]]. It takes each dense initial f : X ⇾ Z, with Z given its uniformity and bornology separately, to the map that the pair-level datum assigns to f through [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_initial]], with the two structures packed as a pair. Pairs are eta-equivalent, so the two translations are definitionally inverse to each other. Unlike the forward direction, this one is not registered for resolution. Within the development only [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]] builds on it, as its special case at the identity of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse","base":"wcunif_complete_inverse","kind":"def","start":50,"body":null,"status":"ok","short":{"text":"Reads a pair-level complete-inverse datum at 𝐖𝐂𝐔𝐧𝐢𝐟 as a local complete-inverse datum on X","status":"ok"},"long":{"text":"This is the special case of [[AffineConstructive.topology.unif_born.local_completion.wcunif_completion_reflect]] for the identity of X. The file uses it to bring the pair-level completeness data back to [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]]: on the codomain of a completion, on a space with a dense complete subspace, and on a space whose unit τ X is bijective or has a retraction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_completion","base":"wcunif_completion","kind":"prf","start":51,"body":[52,70],"status":"ok","short":{"text":"A completion of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟 is a local completion","status":"ok"},"proof":[{"text":"Suppose ι is a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟. A local completion has five requirements: Y is separated, ι is initial, ι is dense, and two laws hold for the extension along a dense initial map.","status":"ok","from":0,"to":2},{"text":"Since ι is a completion, Y carries a genuine structure of the pair, that is, Y is a well-containment uniform space ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_obj_Y]]). A uniform space with a T₀ topology is separated ([[AffineConstructive.topology.uniform.base.uniform_T₀_separated]]), and a Hausdorff space is T₀ ([[AffineConstructive.topology.topology.base.Hausdorff_T₀]]). It therefore suffices that Y is Hausdorff, which the pair completion provides.","status":"ok","from":3,"to":7},{"text":"That ι is initial and that ι is dense are read off directly from the pair completion.","status":"ok","from":8,"to":11},{"text":"Let Z have a uniformity and a bornology, and let f : X ⇾ Z be initial and dense. The extension of ι along f is a morphism by the corresponding law of the pair completion.","status":"ok","from":12,"to":14},{"text":"For the same f, the extension composed with f is ι, again by the corresponding law of the pair completion.","status":"ok","from":15,"to":18}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_complete","base":"wcunif_complete","kind":"prf","start":71,"body":[72,74],"status":"ok","short":{"text":"A complete object of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟 is locally complete","status":"ok"},"proof":[{"text":"Completeness of X as an object says that the identity of X is a completion of the pair. By [[AffineConstructive.topology.unif_born.local_completion.wcunif_completion]] the identity is then a local completion, which is local completeness of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completor","base":"wcunif_canonical_completor","kind":"def","start":75,"body":[76,93],"status":"ok","short":{"text":"The trapped completion 𝒯 X of Cauchy filters with a bounded member, with τ, 𝒯₁ and R, as chosen completion data","status":"ok"},"proof":[{"text":"The completion data in [[AffineConstructive.topology.unif_born.local_maps.wcunif_classes]] has five components, each left to supply: the completion of each well-containment uniform space, its structure, the unit, the action on morphisms, and the map into the completion that comes from a dense reflecting map.","status":"ok","from":0,"to":1},{"text":"A structure on X is a pair, a uniformity Φ and a bornology 𝒜. The completion of X is the trapped completion 𝒯 X, the Cauchy filters on X that have a bounded member.","status":"ok","from":2,"to":4},{"text":"The structure on 𝒯 X is its pair of a uniformity and a bornology. The uniformity [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_uniformity]] is pulled back from the Cauchy completion 𝒞 X along β, the inclusion of trapped filters among all Cauchy filters on X. The bornology is [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_bornology]].","status":"ok","from":5,"to":7},{"text":"The unit is τ X : X ⇾ 𝒯 X. It sends each point of X to a trapped filter, a Cauchy filter on X itself that has a bounded member.","status":"ok","from":8,"to":10},{"text":"For a morphism f : X ⇾ Y of well-containment uniform spaces, that is, a locally uniformly continuous bornological map, the action on completions is 𝒯₁ f : 𝒯 X ⇾ 𝒯 Y.","status":"ok","from":11,"to":13},{"text":"For a map f : X ⇾ Y that is dense and in the reflecting class, the map back into the completion is R f : Y ⇾ 𝒯 X. This completes the data.","status":"ok","from":14,"to":17}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completion","base":"wcunif_canonical_completion","kind":"prf","start":95,"body":[96,119],"status":"ok","short":{"text":"The trapped completion satisfies the laws of a canonical completion for 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"commentary":{"text":"This lemma is how the general completion theory of reflection pairs reaches 𝐖𝐂𝐔𝐧𝐢𝐟. The general theorems assume a canonical completion, and the results of this file that instantiate them get one from this lemma by resolution. Among them are the alternative constructor of local completeness [[AffineConstructive.topology.unif_born.local_completion.alt_Build_LocallyComplete]], the universal property for dense reflecting maps [[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_dense]] and [[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_equal]], and the facts about inverses of locally complete maps [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_bij]] and [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_initial]].\n\nThe mathematical work was done earlier, for the trapped completion, in `trapped_cauchy.v` and `trapped_wc.v`. This proof only collects those results.","status":"ok"},"proof":[{"text":"The completion data are the trapped completion 𝒯 X with its unit τ, the induced maps 𝒯₁ f and the reflections R f ([[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completor]]). The laws of a canonical completion split into seven obligations, and each is checked by unfolding the pair-level notions at well-containment uniform spaces.","status":"ok","from":0,"to":1},{"text":"First, the completion is Hausdorff. Once X is given its uniformity Φ and bornology 𝒜, the completion is 𝒯 X. That space is separated ([[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_separated]]), and the topology of a separated uniform space is Hausdorff ([[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]).","status":"ok","from":2,"to":4},{"text":"Next, the unit τ X is initial for well-containment uniform spaces. Over a well-containment space τ X is globally initial ([[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped_wc_initial]]), and a globally initial map is initial ([[AffineConstructive.topology.unif_born.local_maps.gbl_wcunif_initial_local]]).","status":"ok","from":5,"to":7},{"text":"The unit τ X has dense range ([[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped_dense]]).","status":"ok","from":8,"to":10},{"text":"Take a morphism f : X ⇾ Y of well-containment uniform spaces. The induced map 𝒯₁ f : 𝒯 X ⇾ 𝒯 Y is again such a morphism ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor]]).","status":"ok","from":11,"to":13},{"text":"For such an f, the unit is natural ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]]):\n\n```tikzcd\nX \\ar[r, \"\\tau_X\"] \\ar[d, \"f\"'] & \\Trp X \\ar[d, \"\\Trp_1 f\"] \\\\\nY \\ar[r, \"\\tau_Y\"'] & \\Trp Y\n```","status":"ok","from":14,"to":16},{"text":"Now take f : X ⇾ Y dense and reflecting. Its reflection R f : Y ⇾ 𝒯 X is a morphism of well-containment uniform spaces ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor]]).","status":"ok","from":17,"to":19},{"text":"Last, for the same f the reflection inverts f against the unit, R f ∘ f = τ X ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec]]):\n\n```tikzcd\nX \\ar[r, \"f\"] \\ar[dr, \"\\tau_X\"'] & Y \\ar[d, \"R f\"] \\\\\n& \\Trp X\n```","status":"ok","from":20,"to":23}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_map_initial","base":"wcunif_canonical_map_initial","kind":"prf","start":121,"body":[122,128],"status":"ok","short":{"text":"The trapped completion carries initial maps of well-containment uniform spaces to initial maps","status":"ok"},"commentary":{"text":"The general lemma reduces preservation of initial maps to one law of the pair: initiality descends along dense morphisms. For well-containment uniform spaces that law is [[AffineConstructive.topology.unif_born.localization.dense_locally_initial]] from the localization file. The local form matters there, because g ∘ f only needs to be reflecting near bounded sets. The development uses this result in [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_initial]], where the extension of an initial map is again initial.","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.reflection_pair.completion.dense_initial_descent_map_ini]] it is enough to show that initiality descends along dense morphisms. Let f be a dense morphism and g a morphism such that g ∘ f is reflecting. Then g must be initial.","status":"ok","from":0,"to":1},{"text":"Take well-containment uniform spaces S, T and V, each with its uniformity and bornology, together with the maps f and g and the four hypotheses. That g is a morphism of 𝐖𝐂𝐔𝐧𝐢𝐟 means that it is a [[AffineConstructive.topology.interfaces.unif_born.WCUnifMorphism]].","status":"ok","from":2,"to":3},{"text":"An initial map of 𝐖𝐂𝐔𝐧𝐢𝐟 is one that is locally initial and also has the structure-level properties that resolution supplies, so it suffices to show that g is [[AffineConstructive.topology.interfaces.unif_born.LocallyUnifBornInitial]]. That is [[AffineConstructive.topology.unif_born.localization.dense_locally_initial]]: f is dense and locally a morphism, g is locally a morphism, and g ∘ f is locally reflecting.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.unif_born.local_completion.g","base":"g","kind":"abbrev","start":133,"body":null,"status":"ok","short":{"text":"Section shorthand for the map into Y induced by the dense initial f","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial]] ι f: the map Z ⇾ Y that the local completion ι assigns to the dense initial extension f : X ⇾ Z. The two lemmas of its section state properties of this map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_initial_dense","base":"local_completion_reflect_initial_dense","kind":"prf","start":134,"body":[135,137],"status":"ok","short":{"text":"The map a local completion induces from a dense initial extension is dense","status":"ok"},"proof":[{"text":"The local completion ι is a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]]). In any completion, the extension along an initial dense map is dense ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_initial_dense]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_initial_initial","base":"local_completion_reflect_initial_initial","kind":"prf","start":138,"body":[139,141],"status":"ok","short":{"text":"The map a local completion induces from a dense initial extension is initial","status":"ok"},"proof":[{"text":"The local completion ι is a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]]). The pair also has the trapped completion as its canonical completion ([[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completion]]). In this setting the extension along an initial dense map is initial ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_initial_initial]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_inverse","base":"local_completion_inverse","kind":"def","start":153,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on the codomain of a local completion","status":"ok"},"long":{"text":"If ι : X ⇾ Y is a local completion, Y carries a [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]]: a retraction for each dense initial extension of Y. This datum is the one that [[AffineConstructive.topology.reflection_pair.completion.pair_completion_inverse]] builds at the pair level, brought back by [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]]. The definition is declared a coercion, and a hint finds it whenever a local completion with codomain Y is in context. It is the first half of the statement that completions are complete; [[AffineConstructive.topology.unif_born.local_completion.local_completion_complete]] is the second.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_complete","base":"local_completion_complete","kind":"def","start":155,"body":[156,159],"status":"ok","short":{"text":"The codomain of a local completion is locally complete","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.unif_born.local_completion.wcunif_completion]] it suffices that the identity of Y is a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟.","status":"ok","from":0,"to":1},{"text":"The local completion ι is a completion of the pair ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]]). The codomain of a completion is complete ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_complete]]), so the identity of Y is a completion.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.trapped_complete_inverse","base":"trapped_complete_inverse","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on the trapped completion 𝒯 X of a well-containment uniform space","status":"ok"},"long":{"text":"Let X be a well-containment uniform space. The trapped completion 𝒯 X consists of the Cauchy filters on X that have a bounded member, with the equality of 𝒞 X. This definition is the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] on 𝒯 X: to each dense initial map out of 𝒯 X it assigns a map back into 𝒯 X. It is [[AffineConstructive.topology.unif_born.local_completion.local_completion_inverse]] taken at the unit τ X : X ⇾ 𝒯 X, which is a local completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.trapped_complete","base":"trapped_complete","kind":"prf","start":162,"body":[163,165],"status":"ok","short":{"text":"The trapped completion 𝒯 X of a well-containment uniform space is locally complete","status":"ok"},"proof":[{"text":"The unit τ X : X ⇾ 𝒯 X is a local completion of X ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion]]), and the codomain of any local completion is locally complete by [[AffineConstructive.topology.unif_born.local_completion.local_completion_complete]]. Applied to τ X, this shows that 𝒯 X is locally complete.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect","base":"local_completion_reflect","kind":"def","start":170,"body":null,"status":"ok","short":{"text":"For a local completion ι and dense reflecting f : X ⇾ Z, the morphism g : Z ⇾ Y with g ∘ f = ι","status":"ok"},"long":{"text":"This is the universal property of a local completion ι : X ⇾ Y, extended from initial tests to every dense map f : X ⇾ Z that is locally reflecting. The map f need not be a morphism, only reflecting. The result is the morphism Z ⇾ Y that [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect]] provides at 𝐖𝐂𝐔𝐧𝐢𝐟. The lemmas that follow show it is a morphism, satisfies g ∘ f = ι, and is dense. When f is initial, g agrees with [[AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial]], is initial, and is an embedding if Z is separated.\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"g\"] \\\\\n& Y\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_mor","base":"local_completion_reflect_mor","kind":"inst","start":171,"body":[172,174],"status":"ok","short":{"text":"The map local_completion_reflect ι f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"A local completion ι is a completion for the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟, and its local-completion operation is the pair-level extension datum. So the general fact [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_mor]], taken at 𝐖𝐂𝐔𝐧𝐢𝐟, says that the reflection of f is a forward map of the pair, which here is a morphism of well-containment uniform spaces.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_spec","base":"local_completion_reflect_spec","kind":"prf","start":175,"body":[176,178],"status":"ok","short":{"text":"The map local_completion_reflect ι f composed with f equals ι","status":"ok"},"proof":[{"text":"This is the general factorisation [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_spec]] taken at the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟, with ι read as a completion of that pair. Composed with f, the reflection gives back ι.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_dense","base":"local_completion_reflect_dense","kind":"prf","start":179,"body":[180,182],"status":"ok","short":{"text":"The map local_completion_reflect ι f is dense","status":"ok"},"proof":[{"text":"Read ι as a completion of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟. Then density of the reflection of f is the general result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_dense]] taken at that pair.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_equal","base":"local_completion_reflect_equal","kind":"prf","start":192,"body":[193,195],"status":"ok","short":{"text":"For initial f, local_completion_reflect ι f equals the map ι induces from f","status":"ok"},"proof":[{"text":"When f is dense and initial, the general theory gives two retractions into the completion: the one built from the reflection of f and the one ι induces from the initial map f. By [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_equal]], taken at 𝐖𝐂𝐔𝐧𝐢𝐟, the two coincide.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_is_initial","base":"local_completion_reflect_is_initial","kind":"prf","start":196,"body":[197,199],"status":"ok","short":{"text":"For initial f, the map local_completion_reflect ι f is initial","status":"ok"},"proof":[{"text":"For a dense initial f, the general result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_is_initial]], taken at the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟 with ι read as a completion of it, says that the reflection of f is initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_emb","base":"local_completion_reflect_emb","kind":"prf","start":209,"body":[210,212],"status":"ok","short":{"text":"For initial f into a separated Z, local_completion_reflect ι f is an embedding","status":"ok"},"proof":[{"text":"The reflection of f is initial ([[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_is_initial]]). An initial map of well-containment uniform spaces out of a separated space is an embedding by [[AffineConstructive.topology.unif_born.local_maps.wcunif_initial_embedding]], so the reflection of f is an embedding.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse","base":"local_complete_inverse","kind":"def","start":220,"body":null,"status":"ok","short":{"text":"For locally complete X and dense reflecting f : X ⇾ Z, the retraction Z ⇾ X of f","status":"ok"},"long":{"text":"This is the universal property of a locally complete space X, taken at the identity of X. A dense, locally reflecting f : X ⇾ Z has a retraction: [[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect]] applied to the identity and f, so that the retraction composed with f is the identity of X. Locally the definition declares f as the designated inverse of the retraction, so the retraction counts as surjective. The lemmas that follow show it is a dense morphism. When f is initial, it is initial; when moreover Z is separated, it is a bijection inverse to f and an embedding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_mor","base":"local_complete_inverse_mor","kind":"prf","start":222,"body":[223,225],"status":"ok","short":{"text":"The retraction local_complete_inverse f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"By definition, the retraction is the reflection of f along the identity of X. The identity is a local completion because X is locally complete. So the retraction is a morphism by [[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_mor]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_spec","base":"local_complete_inverse_spec","kind":"prf","start":226,"body":[227,229],"status":"ok","short":{"text":"The retraction local_complete_inverse f composed with f is the identity of X","status":"ok"},"proof":[{"text":"The retraction is the reflection of f along the identity of X, which is a local completion because X is locally complete. By [[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_spec]] with ι the identity, the retraction composed with f is the identity of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_surjective","base":"local_complete_inverse_surjective","kind":"prf","start":230,"body":[231,233],"status":"ok","short":{"text":"The retraction of a dense reflecting f out of a locally complete space is surjective, with f as its section","status":"ok"},"proof":[{"text":"A map with a section is surjective. Here f is a section of the retraction: by [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_spec]], the retraction composed with f is the identity of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_dense","base":"local_complete_inverse_dense","kind":"prf","start":234,"body":[235,238],"status":"ok","short":{"text":"The retraction of a dense reflecting f out of a locally complete space is dense","status":"ok"},"proof":[{"text":"A map g is dense once g ∘ f is dense ([[AffineConstructive.topology.topology.maps.Dense_factor_right]]). It therefore suffices to show that the retraction composed with f is dense.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_spec]] that composite is the identity of X, and the identity is dense.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_initial","base":"local_complete_inverse_initial","kind":"inst","start":253,"body":[254,256],"status":"ok","short":{"text":"For f dense and initial, the retraction [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse]] f is an initial map","status":"ok"},"proof":[{"text":"This is the general fact [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_is_initial]] for the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟, taken at the identity of X as the completion. A locally complete X is its own local completion, and its retraction along a dense initial test is initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_bij","base":"local_complete_inverse_bij","kind":"inst","start":258,"body":[259,261],"status":"ok","short":{"text":"For f dense and initial into a separated space, the retraction [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse]] f is a bijection","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.completion.complete_obj_inverse_bij]] for the pair 𝐖𝐂𝐔𝐧𝐢𝐟. Z is separated, so its topology is Hausdorff, and the inverse of a dense initial map out of a complete object into it is a bijection.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_bij_back","base":"local_complete_inverse_bij_back","kind":"prf","start":262,"body":[263,265],"status":"ok","short":{"text":"A dense initial f from a locally complete space into a separated one is a bijection, with the retraction as inverse","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.completion.complete_obj_inverse_bij_back]] for the pair 𝐖𝐂𝐔𝐧𝐢𝐟. A dense initial map from a complete object into a Hausdorff object is a bijection whose inverse is the retraction.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_emb","base":"local_complete_inverse_emb","kind":"prf","start":280,"body":[281,283],"status":"ok","short":{"text":"For f dense and initial into a separated space, the retraction [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse]] f is an embedding","status":"ok"},"proof":[{"text":"The retraction is initial ([[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_initial]]). Its domain Z is separated, and an initial map out of a separated space is an embedding ([[AffineConstructive.topology.unif_born.local_maps.wcunif_initial_embedding]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.alt_Build_LocallyComplete","base":"alt_Build_LocallyComplete","kind":"prf","start":288,"body":[289,295],"status":"ok","short":{"text":"X is locally complete once every dense initial extension has a morphism retracting it; separation follows","status":"ok"},"proof":[{"text":"Assume that the retraction along every dense initial extension of X is a morphism and a left inverse of that extension.","status":"ok","from":0,"to":1},{"text":"Local completeness follows from completeness as an object of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_complete]]). By [[AffineConstructive.topology.reflection_pair.completion.alt_Build_CompleteObj]] that completeness holds once every dense initial test has a forward left inverse, and separation then comes for free. What remains is to provide those left inverses.","status":"ok","from":2,"to":3},{"text":"Fix Y with its uniformity and bornology, so that a structure of 𝐖𝐂𝐔𝐧𝐢𝐟 on Y is unpacked into its two components. The assumption, applied to Y, Ψ and ℬ, gives the left inverse for every dense initial f.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.unif_born.local_completion.dense_initial_local_complete_inverse","base":"dense_initial_local_complete_inverse","kind":"inst","start":299,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on Y, transported from that of X along a dense initial f : X ⇾ Y","status":"ok"},"long":{"text":"Given the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] on X and a map f : X ⇾ Y that is dense and initial for well-containment uniform spaces, this is the same operation on Y. It assigns to each dense initial extension of Y a map back into Y. The definition needs only the datum on X, not that X is locally complete. It is the general datum [[AffineConstructive.topology.reflection_pair.completion.dense_initial_complete_inverse]] at 𝐖𝐂𝐔𝐧𝐢𝐟, unpacked by [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.dense_initial_locally_complete","base":"dense_initial_locally_complete","kind":"prf","start":300,"body":[301,304],"status":"ok","short":{"text":"A separated space receiving a dense initial map from a locally complete space is locally complete","status":"ok"},"proof":[{"text":"It suffices to show that Y is a complete object of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_complete]]). The required datum is carried along f from X.","status":"ok","from":0,"to":1},{"text":"X is a complete object and Y is separated, hence Hausdorff. A Hausdorff object that receives a dense initial map from a complete object is complete ([[AffineConstructive.topology.reflection_pair.completion.dense_initial_complete]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.to_trapped_bijective_complete_inverse","base":"to_trapped_bijective_complete_inverse","kind":"inst","start":311,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on X when the trapped unit τ X is a bijection","status":"ok"},"long":{"text":"Suppose the unit τ X : X ⇾ 𝒯 X of the trapped completion has a designated inverse that makes it a bijection. Then X inherits from 𝒯 X the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]], which retracts the dense initial extensions of X. It is the general datum [[AffineConstructive.topology.reflection_pair.completion.unit_bijective_complete_inverse]] at 𝐖𝐂𝐔𝐧𝐢𝐟, unpacked by [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.to_trapped_bijective_complete","base":"to_trapped_bijective_complete","kind":"prf","start":312,"body":[313,316],"status":"ok","short":{"text":"A well-containment space whose trapped unit τ X is a bijection is locally complete","status":"ok"},"proof":[{"text":"It suffices to show that X is a complete object of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_complete]]).","status":"ok","from":0,"to":1},{"text":"The trapped completion is the canonical completion of the pair, and its unit τ X is a bijection. An object whose unit is a bijection is complete ([[AffineConstructive.topology.reflection_pair.completion.unit_bijective_complete]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete_inverse","base":"to_trapped_retract_complete_inverse","kind":"inst","start":321,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on X from a continuous retraction r of the trapped unit τ X","status":"ok"},"long":{"text":"Given a continuous r : 𝒯 X ⇾ X with r ∘ τ X = id, X receives the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]], which retracts its dense initial extensions. Each extension is sent into 𝒯 X and then brought back by r. It is the general datum [[AffineConstructive.topology.reflection_pair.completion.unit_retract_complete_inverse]] at 𝐖𝐂𝐔𝐧𝐢𝐟, unpacked by [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]]. The datum [[AffineConstructive.topology.unif_born.local_completion.complete_locally_inverse]] on a complete uniform space is built from it, with r = (κ X)⁻¹ ∘ β X. So is [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_locally_complete_inverse]], where r is the limit map on 𝒪 S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete","base":"to_trapped_retract_complete","kind":"prf","start":322,"body":[323,326],"status":"ok","short":{"text":"A well-containment space whose trapped unit τ X has a continuous retraction is locally complete","status":"ok"},"commentary":{"text":"Classically, a space is complete exactly when it is a retract of its completion. Here only continuity is asked of the retraction r: it need not be uniformly continuous or bornological, so it need not be a morphism of 𝐖𝐂𝐔𝐧𝐢𝐟. That weak hypothesis is what makes the criterion usable. [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete]] builds r from the Cauchy completion, and [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_locally_complete]] applies the same criterion to open immersions.","status":"ok"},"proof":[{"text":"It suffices to show that X is a complete object of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_complete]]).","status":"ok","from":0,"to":1},{"text":"The map r is a continuous retraction of the unit τ X of the canonical completion. An object whose unit has a continuous retraction is complete ([[AffineConstructive.topology.reflection_pair.completion.unit_retract_complete]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext","base":"wc_cont_ext","kind":"def","start":332,"body":null,"status":"ok","short":{"text":"The extension Y ⇾ Z of a morphism f : X ⇾ Z along a dense, locally reflecting ι : X ⇾ Y, for Z locally complete","status":"ok"},"long":{"text":"Let ι : X ⇾ Y be dense and locally reflecting, and let f : X ⇾ Z be a morphism of well-containment uniform spaces into a locally complete Z. The extension is a composite of three maps, passing through the trapped completions. Recall that 𝒯 X is the set of Cauchy filters on X with a bounded member. First, the reflection [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] ι : Y ⇾ 𝒯 X sends a point of Y to a trapped filter on X. Next, the induced map [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] f : 𝒯 X ⇾ 𝒯 Z carries that filter to Z. Last comes the inverse of the unit τ Z. Because Z is locally complete, this inverse is the retraction [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse]] of τ Z.\n\n```tikzcd\nX \\arrow[r, \"\\iota\"] \\arrow[d, \"f\"'] & Y \\arrow[r, \"R\\,\\iota\"] \\arrow[dl, dashed] & \\Trp X \\arrow[d, \"\\Trp f\"] \\\\\nZ & & \\Trp Z \\arrow[ll, \"(\\tau Z)^{-1}\"]\n```\n\nThis is the general extension of canonical completions, taken at 𝐖𝐂𝐔𝐧𝐢𝐟. It is a morphism ([[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_mor]]), and composed with ι it gives f ([[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_spec]]). It is dense when f is ([[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_dense]]). When ι and f are both initial, it is initial ([[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_initial]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_mor","base":"wc_cont_ext_mor","kind":"prf","start":333,"body":[334,336],"status":"ok","short":{"text":"The extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"Z is locally complete, so it is a complete object of 𝐖𝐂𝐔𝐧𝐢𝐟. By [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_mor]], the extension of f along the dense reflecting ι is a forward map of the pair, that is, a morphism of well-containment uniform spaces.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_spec","base":"wc_cont_ext_spec","kind":"prf","start":337,"body":[338,340],"status":"ok","short":{"text":"The extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f composed with ι is f","status":"ok"},"proof":[{"text":"This is the factorisation property of the extension in the general theory, [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_spec]], read at the pair 𝐖𝐂𝐔𝐧𝐢𝐟. The trapped completion supplies the canonical completion there, and the locally complete space Z is a complete object of the pair.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_dense","base":"wc_cont_ext_dense","kind":"prf","start":341,"body":[342,344],"status":"ok","short":{"text":"The extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f of a dense f is dense","status":"ok"},"proof":[{"text":"This is the general fact [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_dense]] at the pair 𝐖𝐂𝐔𝐧𝐢𝐟. The trapped completion serves as its canonical completion, and Z, being locally complete, is a complete object of the pair.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_initial","base":"wc_cont_ext_initial","kind":"prf","start":354,"body":[355,357],"status":"ok","short":{"text":"If ι and f are both initial, the extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f is initial","status":"ok"},"proof":[{"text":"This is the general fact [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_initial]] at the pair 𝐖𝐂𝐔𝐧𝐢𝐟. Its hypothesis that the completion functor preserves initial maps is [[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_map_initial]], which says this of the trapped completion.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_emb","base":"wc_cont_ext_emb","kind":"prf","start":367,"body":[368,370],"status":"ok","short":{"text":"If ι and f are initial and Y is separated, the extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f is an embedding","status":"ok"},"proof":[{"text":"The extension is initial by [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_initial]]. Since Y is separated, it is an embedding by [[AffineConstructive.topology.unif_born.local_maps.wcunif_initial_embedding]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec","base":"complete_locally_complete_spec","kind":"prf","start":378,"body":[379,383],"status":"ok","short":{"text":"On a complete uniform space, (κ X)⁻¹ ∘ β X is a retraction of the trapped unit τ X","status":"ok"},"proof":[{"text":"Regroup the composite so that β X ∘ τ X stands alone. By the factorisation of the Cauchy unit through the trapped completion, [[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped_factor]], that composite is κ X. What remains is (κ X)⁻¹ ∘ κ X = id.\n\n```tikzcd\nX \\arrow[r, \"\\tau\"] \\arrow[dr, \"\\kappa\"'] & \\Trp X \\arrow[d, \"\\beta\"] \\\\\n & \\Cpl X\n```","status":"ok","from":0,"to":2},{"text":"The unit κ X is dense and uniformly initial, X is complete and 𝒞 X is separated. By [[AffineConstructive.topology.uniform.completion.complete_inverse_bij_back]], κ X is therefore a bijection, so its inverse undoes it ([[AffineConstructive.theory.set.bijective]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.unif_born.local_completion.Er","base":"Er","kind":"abbrev","start":384,"body":null,"status":"ok","short":{"text":"Local name for the retraction law (κ X)⁻¹ ∘ β X ∘ τ X = id on a complete uniform space","status":"ok"},"long":{"text":"A section-local shorthand for [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec]]. That lemma says that the map (κ X)⁻¹ ∘ β X retracts the trapped unit τ X when X is a complete uniform space. Here β X reads a trapped filter as a Cauchy filter, and κ X is the Cauchy unit. The shorthand supplies the retraction law to [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete_inverse]] in the definition of [[AffineConstructive.topology.unif_born.local_completion.complete_locally_inverse]], and to the matching lemma in the proof of [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.complete_locally_inverse","base":"complete_locally_inverse","kind":"inst","start":385,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on a complete uniform space with a well-containment bornology","status":"ok"},"long":{"text":"When X is complete as a uniform space, its Cauchy unit κ X is a bijection. The map β X reads a trapped filter as a Cauchy filter, and applying the inverse of κ X afterwards gives (κ X)⁻¹ ∘ β X, which retracts the trapped unit τ X ([[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec]]). This instance is the datum [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete_inverse]] built from that retraction. It makes the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] available on every complete well-containment uniform space, and [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete]] shows that such a space is locally complete with this datum.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.complete_locally_complete","base":"complete_locally_complete","kind":"prf","start":386,"body":[387,389],"status":"ok","short":{"text":"A complete uniform space with a well-containment bornology is locally complete","status":"ok"},"commentary":{"text":"","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete]] it suffices to give a continuous retraction of τ X. On a complete space, (κ X)⁻¹ ∘ β X is such a retraction ([[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec]]). Here β X : 𝒯 X ⇾ 𝒞 X is a uniform embedding ([[AffineConstructive.topology.unif_born.trapped_cauchy.from_trapped_ue]]), so it is continuous. The Cauchy unit κ X is dense and uniformly initial from a complete space into a separated one, so it is a bijection ([[AffineConstructive.topology.uniform.completion.complete_inverse_bij_back]]). It also reflects continuously, so its inverse is continuous ([[AffineConstructive.topology.topology.maps.invert_reflecting]]).","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{"\nX \\ar[r, \"\\tau_X\"] \\ar[d, \"f\"'] & \\Trp X \\ar[d, \"\\Trp_1 f\"] \\\\\nY \\ar[r, \"\\tau_Y\"'] & \\Trp Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='76.196pt' height='52.996pt' viewBox='0 0 76.196 52.996'>\n<defs>\n<path id='g5-1' d='M1.98204-3.16728C1.98204-3.31668 1.9671-3.31668 1.80276-3.31668C1.44918-2.99796 .8964-2.99796 .7968-2.99796H.71214V-2.77884H.7968C.91134-2.77884 1.23504-2.79378 1.52388-2.91828V-.42828C1.52388-.2739 1.52388-.21912 .996-.21912H.747V0C1.0209-.01992 1.46412-.01992 1.75296-.01992S2.48502-.01992 2.75892 0V-.21912H2.50992C1.98204-.21912 1.98204-.2739 1.98204-.42828V-3.16728Z'/>\n<path id='g4-1' d='M3.81259-4.30049H5.23447C6.11966-4.30049 6.50998-4.8093 6.50998-4.94173C6.50998-4.99749 6.46119-4.99749 6.42634-4.99749C6.39846-4.99749 6.26603-4.99749 5.96632-4.79536L5.93147-4.76748C5.88268-4.76051 5.4366-4.76051 5.19265-4.76051H3.96593C3.38045-4.76051 2.80194-4.76748 2.21646-4.76051C2.0213-4.76051 1.47764-4.65596 .94792-4.2517C.41123-3.8335 .37638-3.44318 .37638-3.39439S.42517-3.33863 .45305-3.33863C.49487-3.33863 .63427-3.36651 .81549-3.4

or' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 57.823)'>\n<use x='67.174377' y='-48.894343' xlink:href='#g2-3'/>\n<use x='74.569545' y='-48.894343' xlink:href='#g2-1'/>\n<\/g>\n<path d='M44.03768 17.579942L19.70487 36.588272' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-dasharray='2.78941 1.59395'/>\n<path d='M23.19275 37.147859C21.861922 36.216884 20.575259 36.291494 19.54787 36.710924C20.203486 35.815593 20.587285 34.585241 20.006084 33.068658' stroke='currentColor' fill='none' stroke-width='.398468' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<path d='M97.12246 17.579942V34.711562' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M99.71072 32.307394C98.15774 32.783034 97.42442 33.842944 97.12246 34.910814C96.8205 33.842944 96.08718 32.783034 94.5342 32.307394' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 57.822999)'>\n<use x='99.410802' y='-29.717798' xlink:href='#g3-1'/>\n<use x='105.76033' y='-29.717798' xlink:href='#g2-5'/>\n<\/g>\n<path d='M84.89875 43.271702H19.78934' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M22.19353 45.85996C21.71789 44.30698 20.65798 43.57366 19.59011 43.2717C20.65798 42.96974 21.71789 42.23642 22.19353 40.68344' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 57.823)'>\n<use x='39.169645' y='-5.876796' xlink:href='#g4-1'/>\n<use x='42.280949' y='-5.876796' xlink:href='#g2-2'/>\n<use x='46.762661' y='-5.876796' xlink:href='#g2-4'/>\n<use x='52.672283' y='-5.876796' xlink:href='#g4-2'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 0 57.823)'>\n<use x='55.799434' y='-8.884681' xlink:href='#g5-1'/>\n<use x='61.195025' y='-8.884681' xlink:href='#g6-1'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Topological spaces by neighbourhood relations: axioms, continuity classes, separation, products","summary":"This file sets up the interface for topological spaces, in terms of a neighbourhood relation x ⪽ U between points and subsets. A [[Topology]] requires that every neighbourhood contains its point, that neighbourhoods are closed upward and under finite meets, and that a neighbourhood of x is also a neighbourhood of every point near x. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the T₀ and Hausdorff separation axioms. It defines the classes of maps (continuous, continuously reflecting, initial, embedding, dense), the discrete and indiscrete structures, and the tensor and cartesian product topologies. The theory of these notions is developed in the files under topology/topology."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, axioms, uniform maps, Cauchy filters, completions","summary":"The file sets up the interface of uniform spaces. A uniformity is a set of relations on X ⊗ X, the entourages; the file reads an entourage as closeness ([[near]]), forms thickenings of subsets and the relation \\\"K ◁ S\\\" (S is a uniform neighbourhood of K), and states the axioms in layers: the pre-uniform axioms, uniform spaces as filters of entourages, and the strong, separated and regular variants with their combinations. It derives the neighbourhood relation of the uniform topology ([[UniformNeighborhood]]), names presentations and bases of uniformities, the tensor and cartesian product, discrete and indiscrete uniformities, and defines the classes of maps: uniformly continuous, uniformly reflecting, uniformly initial and uniform embeddings. It closes with Cauchy filters and the universal property of a completion: a separated space receiving X by a dense, uniformly initial map, with a uniformly continuous comparison map from every other such extension of X, which also defines complete uniform spaces. The theory of these notions is developed in the files under topology/uniform and topology/unif_born."},"AffineConstructive.topology.interfaces.bornology":{"page":"../interfaces/bornology.html","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment spaces, local morphisms, local completions","summary":"The file sets up uniform spaces that also carry a bornology. It starts from the bare pairing [[UnifBornSpace]], with no axiom relating the two structures, adds the thickening axiom [[UniformlyOpenBornology]] to obtain the well-containment uniform spaces [[WCUnifSpace]] and their regular variant [[RegularWCUnifSpace]], and defines the well-containment relation K ⋐ S. It then gives product certificates and the morphism classes, forward, reflecting, initial and embedding, both in the global form (uniform and bornological at once) and in the local form, where uniform continuity or reflection is asked only near bounded sets ([[LocalUniformContinuity]], [[LocalUniformReflection]]). It ends with the interface of a local completion, [[LocalCompletion]], and of a locally complete space, which the localization and the trapped completion later realise."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"../uniform/base.html","short":"Uniform spaces: closeness, thickening, induced topology, separation and the uniform reflection pair","summary":"This file develops the basic theory of uniform spaces. The uniformity of a uniform space is a sublattice of relations that is closed under composition and inversion. The file proves the elementary laws of closeness: reflexivity, symmetric splitting into two through six factors, and composition of close pairs. It also proves the laws of thickening, including the swap of a thickening across a complement. Every uniform space carries an induced topology, in which a separated space is Hausdorff and a regular space is strong. Interior, closure and density are described through entourages. The forward, reflecting, initial and embedding classes of maps are closed under composition, pass to their topological counterparts, and make 𝐔𝐧𝐢𝐟 a reflection pair with a morphism to the topological reflection pair 𝐀𝐓𝐨𝐩. The file ends with lemmas on images and preimages of thickenings and on dense maps, which the subspace, completion and bornology files use."},"AffineConstructive.topology.uniform.basis":{"page":"../uniform/basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.uniform.product":{"page":"../uniform/product.html","short":"Cartesian and tensor product uniformities, their structure maps, and dense-extension criteria","summary":"The file builds the cartesian and tensor product uniformities from their presentations by basic entourages, and shows that each makes the product a uniform space. Basic entourages of X × Y combine U-closeness of first coordinates and V-closeness of second coordinates additively. Those of X ⊗ Y combine them by the tensor. For the cartesian product it proves that the projections are uniformly continuous and that a map into the product is uniformly continuous when both of its components are. It also shows that the induced topology is the cartesian product topology and that a product of separated spaces is separated. For the tensor product it shows that the induced topology is the tensor product topology, and that the unitors, the symmetry and the associators are uniform embeddings. On both products, maps of factors that are uniformly continuous, reflecting, initial or embeddings give product maps of the same kind. The last section, on relations in the tensor square, describes the interior and closure of an entourage by thickening and derives the dense-extension criteria [[ufm_dense_reflecting]] and [[ufm_dense_continuous]]."},"AffineConstructive.topology.uniform.cauchy_completion":{"page":"../uniform/cauchy_completion.html","short":"The Cauchy completion: Cauchy filters, their uniformity, the unit η and its universal property","summary":"The file constructs the Cauchy completion 𝒞 X of a uniform space X: its points are Cauchy filters, two of them equal when for every entourage U they have members A and B with A ⊗ B ⊆ U. The uniformity on 𝒞 X is presented by the basic relations [[cauchy_basis]], which conjugate an entourage by an arbitrary one; checking the axioms of an induced basis makes 𝒞 X a separated uniform space, with the basic entourages [[cauchy_entourage]] as a monotone basis. The unit η, sending a point to its principal filter, is shown uniformly initial ([[to_cauchy_initial]]) and dense ([[to_cauchy_dense]]), and an embedding when X is separated. Uniformly continuous maps extend to [[cauchy_map]], functorially, and every dense uniformly reflecting f : X ⇾ Y has a map [[cauchy_reflect]] back into 𝒞 X with η as its composite with f; together these give [[cauchy_completion]], that η is a completion, used by the general extension theory of completions and by the trapped completion."},"AffineConstructive.topology.topology.maps":{"page":"../topology/maps.html","short":"Continuous, reflecting, initial and dense maps of topological spaces; the topological reflection pair","summary":"The file characterises the classes of maps between topological spaces in several equivalent ways. A map is continuous when preimages of open sets are open, or of closed sets closed, or by an inclusion between interiors or closures under preimage or image. A map is continuously reflecting when every open (or closed) set is the preimage of an open (or closed) set, or when the interior of A is computed through the universal image. A map is initial when interiors and closures are pulled back from the codomain ([[continuously_initial_interior]], [[continuously_initial_closure]]). The two cancellation laws [[cont_factor]] and [[cont_refl_factor]] make topological spaces a reflection pair under the label [[𝐀𝐓𝐨𝐩]], which gives the inverse lemmas for bijections. Last come dense maps: closure of density under composition and its factor laws, and the result that continuous maps into a Hausdorff space are determined on a dense subset ([[cont_equal_on_dense]], [[cont_dense_epi]])."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.unif_born.base":{"page":"base.html","short":"Uniform spaces with bornologies: maps, their reflection pair, transport of well-containment","summary":"The file sets up the category of sets carrying both a uniformity and a bornology, with no axiom linking the two. It shows that the four classes of maps (uniformly continuous and bornological, reflecting, initial, embedding) respect equality of functions, contain identities, compose, and satisfy the cancellation laws. It packages them as the reflection pair [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], with pair morphisms to uniform spaces, bornological spaces and topological spaces, and from it derives that inverses swap the forward and reflecting classes. Its main result, [[wcunif_transport]], pulls the well-containment axiom back along a uniformly continuous, bornological and bornology-reflecting map. The subspace and localization files use it."},"AffineConstructive.topology.unif_born.local_maps":{"page":"local_maps.html","short":"Locally uniform maps: composition, factoring, inversion, topology, and their reflection pairs","summary":"This file develops the basic theory of the locally uniform classes of maps between uniform spaces with bornologies. These are the maps that are uniformly continuous, or reflecting, near bounded sets. It shows that function equality preserves each class and that the global classes imply the local ones. It proves that identities belong to every class and composites stay in their class. The forward composite needs the first map to be bornological ([[local_uc_compose]]), and the reflecting composite needs the second to be bornology-reflecting ([[local_ur_compose]]). Further results cover the factoring (cancellation) laws, inversion of bijections, which swaps the forward and reflecting classes, and the descent to continuity and continuous reflection. A locally reflecting map out of a separated space is injective ([[local_reflection_injective]]), and local reflection lifts along a dense uniformly continuous map ([[ufm_dense_locally_initial]]). Finally the file packages two reflection pairs, the local pair [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_loc]] and its restriction [[𝐖𝐂𝐔𝐧𝐢𝐟]] to well-containment uniform spaces, with pair morphisms from [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] and to [[𝐀𝐓𝐨𝐩]]."},"AffineConstructive.topology.unif_born.localization":{"page":"localization.html","short":"The localization of a uniform space at a bornology, its unit and counit","summary":"This file defines the localization ℒ X of a set with a uniformity and a bornology. It keeps the points and the bornology of X and replaces the uniformity by the largest one that, near each bounded set, contains an entourage of X. It also defines the counit ε : ℒ X ⇾ X and the unit η : X ⇾ ℒ X, both the identity on points. The main results are the two transfers. A map out of X is uniformly continuous near bounded sets exactly when its composite with ε is uniformly continuous ([[localized_uc]], [[localized_uc_conv]]). A dense, locally uniformly reflecting map into a well-containment space becomes uniformly reflecting once composed with η ([[localized_ur]]). Its proof builds an auxiliary pre-uniformity of closures of images of entourages. Around these the file proves: ε and η are local embeddings; the localization collapses when the bornology is trivial; it preserves separation and well-containment; it is functorial on the appropriate maps; localizing twice adds nothing. It also gives the dense-initial descent results for local maps as corollaries of the global ones in the file on local maps."},"AffineConstructive.topology.unif_born.trapped_cauchy":{"page":"trapped_cauchy.html","short":"The trapped completion 𝒯 X: Cauchy filters on ℒ X with a bounded member","summary":"This file builds the trapped completion 𝒯 X of a uniform space with a bornology. Its points are the Cauchy filters on the localization ℒ X that have a bounded member, and its equality and uniformity are pulled back from 𝒞 (ℒ X) along the embedding β. The map ℒ X ⇾ 𝒞 (ℒ X) factors through 𝒯 X as a unit τ, which is dense and uniformly initial, and is an embedding when X is separated. The file then gives 𝒯 X a bornology and shows that 𝒯 X is a well-containment space when X is one, with τ initial for both the uniformity and the bornology. It makes 𝒯 functorial along uniformly continuous bornological maps of localizations and builds a reflection Y ⇾ 𝒯 X for each dense reflecting ι : ℒ X ⇾ Y. It closes with three results: trappedness depends only on the ambient-scale class of a filter, ambient-scale equivalence at a trapped filter refines to equality, and a uniformly continuous retraction of τ makes τ bijective. The well-containment version of the construction is built on this file."},"AffineConstructive.topology.unif_born.trapped_wc":{"page":"trapped_wc.html","short":"The trapped completion as a local completion of well-containment uniform spaces","summary":"This file presents the trapped completion 𝒯 X of a well-containment uniform space in intrinsic terms, so that users need not mention the localization ℒ X. The unit [[to_trapped]] : X ⇾ 𝒯 X is shown to be locally initial, dense, and an embedding when X is separated. A point's image under the unit equal to a trapped filter G puts every ball at that point in G, and so puts the point in the closure of each member of G ([[to_trapped_eq_ball]], [[to_trapped_eq_closure]]). The comparison [[from_trapped]] : 𝒯 X ⇾ 𝒞 X is uniformly continuous, satisfies ρ ∘ τ = η into the Cauchy completion, and is a topological embedding. The functor action [[wc_trapped_map]] and the reflection [[wc_trapped_reflect]] translate [[trapped_map]] and [[trapped_reflect]] through the localization, with hypotheses and conclusions stated in the locally-uniform classes. Together they give the instance [[trapped_local_completion]]: the unit is a local completion."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Reflection pairs: forward and reflecting classes of maps over sets, and their variants","summary":"This file sets up the abstract framework of reflection pairs. It begins with constructs: concrete categories over sets, given by fibres of candidate structures, a class of objects and a class of morphisms closed under identities and composition. For each set X, the structures on X form a poset whose order is comparison through the identity. On this base it defines the reflecting, initial and embedding classes, with their specifications: an initial map is forward and reflecting, and an embedding is an injective initial map. It then defines reflection pairs with their two cancellation laws, together with saturated pairs, cloven pairs (with a pullback of structures along any map), morphisms of pairs, the opposite pair that exchanges the two classes, and products for the forward class. The theory built on these interfaces is in the reflection_pair files, and the topological, uniform and bornological structures of the development are instances."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.topology.reflection_pair.completion":{"page":"../reflection_pair/completion.html","short":"Abstract completions over a reflection pair: completeness, the canonical completion monad, extension, products","summary":"The file develops completions abstractly over a reflection pair C carrying a pair morphism to topological spaces, so density and the Hausdorff property are read through the topology that each C-structure determines. A completion of X ([[PairCompletion]]) is a Hausdorff, dense, initial map ι : X ⇾ Y through which every dense initial map out of X factors by a forward map, and an object is complete ([[CompleteObj]]) when its identity is a completion. Given a canonical completion functor ([[CanonicalCompletor]], [[CanonicalCompletion]]), the file proves that completions are complete and unique up to an initial isomorphism. It shows that the universal property extends from initial to reflecting dense maps, and it builds the extension operator into complete codomains ([[canonical_completion_ext]]). It also proves that the canonical completion is an idempotent monad that inverts dense initial maps. Two further results show that preservation of initial maps by the completion functor is equivalent to a descent law ([[map_ini_descent_iff]]), and that products of completions, and of complete objects, are again completions and complete."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

n.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** Instantiating the completion kit at (𝐖𝐂𝐔𝐧𝐢𝐟, 𝒯): the WCUnif counterpart\n    of uniform/completion2.v, delegating to reflection_pair/completion.v.\n\n    The bridge direction is [LocalCompletion] ⟹ [PairCompletion] (with hints,\n    so the abstract theorems apply whenever a concrete local completion is in\n    context); the converse is left to direct invocation.  Unlike at 𝐔𝐧𝐢𝐟, the\n    data-class bridge is not a definitional identity: the 𝐖𝐂𝐔𝐧𝐢𝐟 fiber packs\n    (Uniformity ∗ Bornology), so the two directions are pack/unpack wrappers —\n    definitionally mutually inverse by tprod eta. *)\nRequire Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.topology interfaces.uniform interfaces.bornology interfaces.unif_born.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import topology.topology topology.uniform.base uniform.basis uniform.product topology.uniform.cauchy_completion.\nRequire Import topology.maps.\nRequire Import bornology.base.\nRequire Import unif_born.base unif_born.local_maps unif_born.localization.\nRequire Import unif_born.trapped_cauchy unif_born.trapped_wc.\nRequire Import interfaces.reflection_pair reflection_pair.base topology.reflection_pair.completion.\nRequire Import easy rewrite.\n\nLocal Open Scope fun_inv_scope.\n\nLocal Abbreviation id := (id_fun _).\nLocal Abbreviation ℒ := localization.\nLocal Abbreviation ε := from_localization.\nLocal Abbreviation η := to_localization.\nLocal Abbreviation κ := to_cauchy.\nLocal Abbreviation 𝒞 := cauchy_filter_set.\nLocal Abbreviation 𝒞₁ := cauchy_map.\n\nLocal Abbreviation 𝒯 := trapped_cauchy_filter_set.\nLocal Abbreviation τ := to_trapped.\nLocal Abbreviation ρ := from_trapped.\nLocal Abbreviation 𝒯₁ := wc_trapped_map.\nLocal Abbreviation R := wc_trapped_reflect.\n\n#[local] Hint Extern 8 (Uniformity ?X) => match goal with\n| H : Fib 𝐔𝐧𝐢𝐟 X |- _ => exact H\n| H : Fib 𝐖𝐂𝐔𝐧𝐢𝐟 X |- _ => exact (proj1 H)\nend : typeclass_instances.\n\n#[local] Hint Extern 8 (Bornology ?X) => match goal with\n| H : Fib 𝐖𝐂𝐔𝐧𝐢𝐟 X |- _ => exact (proj2 H)\nend : typeclass_instances.\n\n(** * The bridge: concrete completions instantiate the pair-level API. *)\n\nDefinition wcunif_pair_completion_reflect `{H:@LocalCompletionReflect X Y Φ Ψ 𝒜 ℬ ι} : PairCompletionReflect 𝐖𝐂𝐔𝐧𝐢𝐟 ι\n  := λ Z '(Ξ, 𝒵), @local_completion_reflect_initial X Y Φ Ψ 𝒜 ℬ ι _ Z Ξ 𝒵.\n#[global] Hint Extern 0 (@PairCompletionReflect 𝐖𝐂𝐔𝐧𝐢𝐟 _ _ _ ?X ?Y (?Φ, ?𝒜) (?Ψ, ?ℬ) ?ι)\n  => simple notypeclasses refine (@wcunif_pair_completion_reflect X Y Φ Ψ 𝒜 ℬ ι _) : typeclass_instances.\n\nDefinition wcunif_pair_complete_inverse `{H:@LocalCompleteInverse X Φ 𝒜} : PairCompleteInverse 𝐖𝐂𝐔𝐧𝐢𝐟 X\n  := wcunif_pair_completion_reflect (H:=H).\n#[global] Hint Extern 0 (@PairCompleteInverse 𝐖𝐂𝐔𝐧𝐢𝐟 _ _ _ ?X (?Φ, ?𝒜))\n  => simple notypeclasses refine (@wcunif_pair_complete_inverse X Φ 𝒜 _) : typeclass_instances.\n\nLemma wcunif_pair_completion `{H:@LocalCompletion X Y Φ Ψ 𝒜 ℬ ι Ci} : PairCompletion 𝐖𝐂𝐔𝐧𝐢𝐟 ι.\nProof. split; try exact _.\n+ intros Z [Ξ 𝒵] f ??. apply H.\n+ intros Z [Ξ 𝒵] f ??. exact (local_completion_reflect_initial_spec ι f).\nQed.\n\nLemma wcunif_complete_obj `{H:@LocallyComplete X Φ 𝒜 Ci} : CompleteObj 𝐖𝐂𝐔𝐧𝐢𝐟 X.\nProof. exact wcunif_pair_completion. Qed.\n\n#[global] Hint Extern 2 (PairCompletion 𝐖𝐂𝐔𝐧𝐢𝐟 _) => simple notypeclasses refine wcunif_pair_completion : typeclass_instances.\n#[global] Hint Extern 2 (CompleteObj 𝐖𝐂𝐔𝐧𝐢𝐟 _) => simple notypeclasses refine wcunif_complete_obj : typeclass_instances.\n\n(** The converse bridge, for direct invocation. *)\nDefinition wcunif_completion_reflect@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}\n  {ι:X ⇾ Y} (H:PairCompletionReflect@{u} 𝐖𝐂𝐔𝐧𝐢𝐟 ι) : LocalCompletionReflect ι\n  := λ Z Ξ 𝒵, @pair_completion_reflect_initial 𝐖𝐂𝐔𝐧𝐢𝐟 _ _ _ X Y _ _ ι _ Z _.\n\nDefinition wcunif_complete_inverse@{u} {X:set@{u}} {Φ:Uniformity X} {𝒜:Bornology X}\n  (H:PairCompleteInverse@{u} 𝐖𝐂𝐔𝐧𝐢𝐟 X) : LocalCompleteInverse X\n  := wcunif_completion_reflect H.\n\nLemma wcunif_completion `{Ci:@LocalCompletionReflect X Y Φ Ψ 𝒜 ℬ ι} : PairCompletion 𝐖𝐂𝐔𝐧𝐢𝐟 ι → LocalCompletion ι.\nProof. intros H. split.\n+ pose proof (pair_completion_obj_Y 𝐖𝐂𝐔𝐧𝐢𝐟 (H:=H)) as HY. change (WCUnifSpace Y) in HY.\n  apply uniform_T₀_separated, Hausdorff_T₀. exact H.\n+ exact (pair_completion_initial 𝐖𝐂𝐔𝐧𝐢𝐟 (PairCompletion:=H)).\n+ exact (pair_completion_dense 𝐖𝐂𝐔𝐧𝐢𝐟 (PairCompletion:=H)).\n+ intros Z Ξ 𝒵 f ??. exact (pair_completion_reflect_initial_mor 𝐖𝐂𝐔𝐧𝐢𝐟 (PairCompletion:=H) f).\n+ intros Z Ξ 𝒵 f ??. exact (pair_completion_reflect_initial_spec 𝐖𝐂𝐔𝐧𝐢𝐟 ι (PairCompletion:=H) f).\nQed.\n\nLemma wcunif_complete `{Ci:@LocalCompleteInverse X Φ 𝒜} : CompleteObj 𝐖𝐂𝐔𝐧𝐢𝐟 X → LocallyComplete X.\nProof. exact wcunif_completion. Qed.\n\n(** * The canonical completion: (𝒯, τ, wc_trapped_map, wc_trapped_reflect). *)\n\nDefinition wcunif_canonical_completor@{u} : CanonicalCompletor@{u} 𝐖𝐂𝐔𝐧𝐢𝐟 (U:=λ (X:set@{u}) '(Φ, 𝒜), @UniformNeighborhood@{u} X Φ).\nProof. unshelve esplit.\n+ intros X [Φ 𝒜] HX. exact (𝒯 X).\n+ intros X [Φ 𝒜] HX. now split.\n+ intros X [Φ 𝒜] HX. exact (τ X).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] HX HY f Hf. exact (𝒯₁ f).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] HX f Hf1 Hf2. exact (R f).\nDefined.\n#[global] Hint Extern 2 (CanonicalCompletor 𝐖𝐂𝐔𝐧𝐢𝐟) => exact wcunif_canonical_completor : typeclass_instances.\n\nLemma wcunif_canonical_completion : CanonicalCompletion 𝐖𝐂𝐔𝐧𝐢𝐟.\nProof. split.\n+ intros X [Φ 𝒜] HX. now change (Hausdorff (𝒯 X)).\n+ intros X [Φ 𝒜] HX. now change (WCUnifInitial (τ X)).\n+ intros X [Φ 𝒜] HX. now change (Dense (τ X)).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] HX HY f Hf. now change (WCUnifMorphism (𝒯₁ f)).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] HX HY f Hf. exact (wc_trapped_map_unit f).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] HX HY f HR HD. now change (WCUnifMorphism (R f)).\n+ intros X Y [Φ 𝒜] [Ψ ℬ] HX HY f HD HR. exact (wc_trapped_reflect_spec f).\nQed.\n#[global] Hint Extern 2 (CanonicalCompletion 𝐖𝐂𝐔𝐧𝐢𝐟) => simple notypeclasses refine wcunif_canonical_completion : typeclass_instances.\n\n(** (K3), by the dense-initial descent law. *)\nLemma wcunif_canonical_map_initial : CanonicalCompletionMapInitial 𝐖𝐂𝐔𝐧𝐢𝐟.\nProof. apply (dense_initial_descent_map_ini 𝐖𝐂𝐔𝐧𝐢𝐟).\n  intros S T V [??] [??] [??] f g HD Hf Hg HR.\n  change (WCUnifMorphism g) in Hg.\n  enough (LocallyUnifBornInitial g) by (repeat (split; try exact _)).\n  exact (dense_locally_initial f g).\nQed.\n#[global] Hint Extern 2 (CanonicalCompletionMapInitial 𝐖𝐂𝐔𝐧𝐢𝐟) => simple notypeclasses refine wcunif_canonical_map_initial : typeclass_instances.\n\n\n(** * The theory of uniform/completion.v, by delegation. *)\n\nSection completion_reflect_initial.\n  Universes u.\n  Context `{@LocalCompletion@{u} X Y Φ Ψ 𝒜 ℬ ι HC, @WCUnifInitial@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}.\n\n  Local Abbreviation g := (local_completion_reflect_initial ι f).\n\n  Lemma local_completion_reflect_initial_dense : Dense g.\n  Proof. now pose proof (pair_completion_reflect_initial_dense 𝐖𝐂𝐔𝐧𝐢𝐟 (ι:=ι) (f:=f)). Qed.\n\n  Lemma local_completion_reflect_initial_initial : WCUnifInitial g.\n  Proof. now pose proof (pair_completion_reflect_initial_initial 𝐖𝐂𝐔𝐧𝐢𝐟 (ι:=ι) f). Qed.\nEnd completion_reflect_initial.\n#[global] Hint Extern 2 (Dense (func_op (local_completion_reflect_initial _ _)))  => simple notypeclasses refine local_completion_reflect_initial_dense : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifInitial              (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial           (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial        (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting           (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting        (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting     (local_completion_reflect_initial _ _))  => simple notypeclasses refine local_completion_reflect_initial_initial : typeclass_instances.\n\n\n(** Completions are complete. *)\nCoercion local_completion_inverse@{u} {X Y:set@{u}} `{H:@LocalCompletion@{u} X Y Φ Ψ 𝒜 ℬ ι U}\n  : LocalCompleteInverse@{u} Y\n  := wcunif_complete_inverse (pair_completion_inverse 𝐖𝐂𝐔𝐧𝐢𝐟 (ι:=ι)).\n#[global] Hint Extern 4 (LocalCompleteInverse ?Y) =>\n  match goal with H : LocalCompletion (Y:=Y) _ |- _ => exact H end : typeclass_instances.\n\nCoercion local_completion_complete@{u} {X Y:set@{u}} `{H:@LocalCompletion@{u} X Y Φ Ψ 𝒜 ℬ ι U}\n  : LocallyComplete@{u} Y.\nProof. apply wcunif_completion. exact (pair_completion_complete 𝐖𝐂𝐔𝐧𝐢𝐟 (ι:=ι)). Qed.\n\nDefinition trapped_complete_inverse@{u} `{@WCUnifSpace@{u} X Φ 𝒜} : LocalCompleteInverse@{u} (𝒯 X)\n  := local_completion_inverse (ι:=τ _).\n#[global] Hint Extern 2 (LocalCompleteInverse (𝒯 ?X)) => simple notypeclasses refine (trapped_complete_inverse (X:=X)) : typeclass_instances.\nLemma trapped_complete@{u} `{@WCUnifSpace@{u} X Φ 𝒜} : LocallyComplete@{u} (𝒯 X).\nProof. exact local_completion_complete. Qed.\n#[global] Hint Extern 2 (LocallyComplete (𝒯 ?X)) => simple notypeclasses refine (trapped_complete (X:=X)) : typeclass_instances.\n\n(** The UP extends to any WCUnifReflecting Dense map. *)\nSection completion_reflect.\n  Universes u.\n  Context `{@LocalCompletion@{u} X Y Φ Ψ 𝒜 ℬ ι HC, @WCUnifReflecting@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}.\n\n  Definition local_completion_reflect : Z ⇾ Y := pair_completion_reflect 𝐖𝐂𝐔𝐧𝐢𝐟 ι f.\n\n  Local Instance local_completion_reflect_mor : WCUnifMorphism local_completion_reflect.\n  Proof. exact (pair_completion_reflect_mor 𝐖𝐂𝐔𝐧𝐢𝐟 ι f). Qed.\n\n  Lemma local_completion_reflect_spec : local_completion_reflect ∘ f = ι.\n  Proof. exact (pair_completion_reflect_spec 𝐖𝐂𝐔𝐧𝐢𝐟 (ι:=ι) f). Qed.\n\n  Lemma local_completion_reflect_dense : Dense local_completion_reflect.\n  Proof. exact (pair_completion_reflect_dense 𝐖𝐂𝐔𝐧𝐢𝐟 ι f). Qed.\nEnd completion_reflect.\nArguments local_completion_reflect {_ _ _ _ _ _} ι {_ _ _ _ _} f {_ _}.\nArguments local_completion_reflect_spec {_ _ _ _ _ _} ι {_ _ _ _ _} f {_ _}.\n#[global] Hint Extern 2 (WCUnifMorphism             (local_completion_reflect _ _)) => simple notypeclasses refine local_completion_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (local_completion_reflect _ _)) => simple notypeclasses refine local_completion_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (Bornological               (local_completion_reflect _ _)) => simple notypeclasses refine local_completion_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (local_completion_reflect _ _)) => simple notypeclasses refine local_completion_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (Continuous                 (local_completion_reflect _ _)) => simple notypeclasses refine local_completion_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (Dense (func_op (local_completion_reflect _ _))) => simple notypeclasses refine local_completion_reflect_dense : typeclass_instances.\n\nLemma local_completion_reflect_equal@{u} `{@LocalCompletion@{u} X Y Φ Ψ 𝒜 ℬ ι HC, @WCUnifInitial@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}\n  : local_completion_reflect ι f = local_completion_reflect_initial ι f.\nProof. exact (pair_completion_reflect_equal 𝐖𝐂𝐔𝐧𝐢𝐟 (ι:=ι) f). Qed.\n\nLemma local_completion_reflect_is_initial@{u} `{@LocalCompletion@{u} X Y Φ Ψ 𝒜 ℬ ι HC, @WCUnifInitial@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}\n  : WCUnifInitial (local_completion_reflect ι f).\nProof. exact (pair_completion_reflect_is_initial 𝐖𝐂𝐔𝐧𝐢𝐟 (ι:=ι) f). Qed.\n#[global] Hint Extern 2 (WCUnifInitial              (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial           (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial        (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting           (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting        (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting     (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_is_initial : typeclass_instances.\n\nLemma local_completion_reflect_emb@{u} `{@LocalCompletion@{u} X Y Φ Ψ 𝒜 ℬ ι HC, @WCUnifInitial@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f, !SeparatedUniformSpace Z}\n  : WCUnifEmbedding (local_completion_reflect ι f).\nProof. exact wcunif_initial_embedding. Qed.\n#[global] Hint Extern 2 (WCUnifEmbedding (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornEmbedding (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_emb : typeclass_instances.\n#[global] Hint Extern 2 (Injective (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding (local_completion_reflect _ _))  => simple notypeclasses refine local_completion_reflect_emb : typeclass_instances.\n\n(** UP for a complete space *)\nSection complete_inverse.\n  Universes u.\n  Context `{@LocallyComplete@{u} X Φ 𝒜 Ci, @WCUnifReflecting@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}.\n\n  Definition local_complete_inverse := local_completion_reflect (id_fun X) f.\n  #[local] Hint Extern 2 (Inverse local_complete_inverse) => exact f : typeclass_instances.\n\n  Lemma local_complete_inverse_mor : WCUnifMorphism local_complete_inverse.\n  Proof. now unfold local_complete_inverse. Qed.\n\n  Lemma local_complete_inverse_spec : local_complete_inverse ∘ f = id.\n  Proof. exact (local_completion_reflect_spec id f). Qed.\n\n  Lemma local_complete_inverse_surjective : Surjective local_complete_inverse.\n  Proof. exact local_complete_inverse_spec. Qed.\n\n  Lemma local_complete_inverse_dense : Dense local_complete_inverse.\n  Proof. apply (Dense_factor_right f). now rew (local_complete_inverse_spec). Qed.\nEnd complete_inverse.\nArguments local_complete_inverse {_ _ _ _ _ _ _ _} f {_ _}.\nArguments local_complete_inverse_spec {_ _ _ _ _ _ _ _} f {_ _}.\n#[global] Hint Extern 2 (WCUnifMorphism             (local_complete_inverse _)) => simple notypeclasses refine local_complete_inverse_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (local_complete_inverse _)) => simple notypeclasses refine local_complete_inverse_mor : typeclass_instances.\n#[global] Hint Extern 2 (Bornological               (local_complete_inverse _)) => simple notypeclasses refine local_complete_inverse_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (local_complete_inverse _)) => simple notypeclasses refine local_complete_inverse_mor : typeclass_instances.\n#[global] Hint Extern 2 (Continuous                 (local_complete_inverse _)) => simple notypeclasses refine local_complete_inverse_mor : typeclass_instances.\n#[global] Hint Extern 2 (Dense (func_op (local_complete_inverse _))) => simple notypeclasses refine local_complete_inverse_dense : typeclass_instances.\n\n#[global] Hint Extern 2 (Inverse (local_complete_inverse ?f)) => exact f : typeclass_instances.\n#[global] Hint Extern 2 (Surjective (local_complete_inverse _)) => simple notypeclasses refine local_complete_inverse_surjective : typeclass_instances.\n\nSection complete_inverse.\n  Universes u.\n  Context `{@LocallyComplete@{u} X Φ 𝒜 Ci, @WCUnifInitial@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}.\n\n  Local Instance local_complete_inverse_initial : WCUnifInitial (local_complete_inverse f).\n  Proof. exact (pair_completion_reflect_is_initial 𝐖𝐂𝐔𝐧𝐢𝐟 (ι:=id_fun X) f). Qed.\n\n  Context `{!SeparatedUniformSpace Z}.\n\n  Local Instance local_complete_inverse_bij : Bijective (local_complete_inverse f).\n  Proof. exact (complete_obj_inverse_bij 𝐖𝐂𝐔𝐧𝐢𝐟 f). Qed.\n\n  Lemma local_complete_inverse_bij_back : Bijective f (inv:=local_complete_inverse f).\n  Proof. exact (complete_obj_inverse_bij_back 𝐖𝐂𝐔𝐧𝐢𝐟 f). Qed.\nEnd complete_inverse.\n#[global] Hint Extern 2 (WCUnifInitial              (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial           (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial        (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting           (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting        (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting     (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_initial : typeclass_instances.\n\n#[global] Hint Extern 2 (Bijective (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_bij : typeclass_instances.\n#[global] Hint Extern 2 (Injective (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_bij : typeclass_instances.\n#[global] Hint Extern 2 (Bijective _ (inv:=local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_bij_back : typeclass_instances.\n#[global] Hint Extern 2 (Surjective _ (inv:=local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_bij_back : typeclass_instances.\n\nLemma local_complete_inverse_emb@{u} `{@LocallyComplete@{u} X Φ 𝒜 Ci, @WCUnifInitial@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f, !SeparatedUniformSpace Z}\n  : WCUnifEmbedding (local_complete_inverse f).\nProof. exact wcunif_initial_embedding. Qed.\n#[global] Hint Extern 2 (WCUnifEmbedding          (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornEmbedding (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding    (local_complete_inverse _))  => simple notypeclasses refine local_complete_inverse_emb : typeclass_instances.\n\n\n#[global] Hint Extern 8 (Inverse (@to_trapped ?X ?Φ ?𝒜 ?H)) => simple notypeclasses refine (local_complete_inverse (Ξ:=@trapped_uniformity X Φ 𝒜 H) (𝒵:=@trapped_bornology X Φ 𝒜 H) (@to_trapped X Φ 𝒜 H)) : typeclass_instances.\n\n(** For CompleteUniformSpace, the Separated axiom is redundant. *)\nLemma alt_Build_LocallyComplete@{u} `{@WCUnifSpace@{u} X Φ 𝒜} {Ci:LocalCompleteInverse X}\n  : (∀ Y Ψ ℬ (f:X ⇾ Y) `{@WCUnifInitial@{u} X Y Φ Ψ 𝒜 ℬ f} `{!Dense f},\n       (WCUnifMorphism (local_completion_reflect_initial (id_fun X) f) ∧\n                 local_completion_reflect_initial (id_fun X) f ∘ f = id_fun X)%sprop\n       ) → LocallyComplete X.\nProof. intros P. apply wcunif_complete. refine (alt_Build_CompleteObj 𝐖𝐂𝐔𝐧𝐢𝐟 _).\n  intros Y [Ψ ℬ]. exact (P _ _ _).\nQed.\n\n(** Completeness extends along dense uniformly-initial maps out of a complete\n    space: a separated space with a dense complete subspace is complete.\n    Injectivity of [f] is automatic ([uniform_initial_embedding]); separation\n    of [Y] is a genuine hypothesis. *)\nSection dense_initial_complete.\n  Universes u.\n  Context `{@LocallyComplete@{u} X Φ 𝒜 Ci} `{@WCUnifInitial@{u} X Y Φ Ψ 𝒜 ℬ f, !Dense f, !SeparatedUniformSpace Y}.\n\n  Local Instance dense_initial_local_complete_inverse : LocalCompleteInverse@{u} Y\n    := wcunif_complete_inverse (dense_initial_complete_inverse 𝐖𝐂𝐔𝐧𝐢𝐟 f).\n\n  Lemma dense_initial_locally_complete : LocallyComplete Y.\n  Proof. apply wcunif_complete. exact (dense_initial_complete 𝐖𝐂𝐔𝐧𝐢𝐟 _). Qed.\nEnd dense_initial_complete.\nArguments dense_initial_local_complete_inverse {_ _ _ _ _ _ _} f {_ _}.\nArguments dense_initial_locally_complete {_ _ _ _ _ _ _ _} f {_ _}.\n\n(** A space whose completion unit is a bijection is complete. *)\nSection to_trapped_bijective.\n  Universes u.\n  Context `{@WCUnifSpace@{u} X Φ 𝒜} `{!Inverse (τ X), !Bijective (τ X)}.\n\n  Local Instance to_trapped_bijective_complete_inverse : LocalCompleteInverse X\n    := wcunif_complete_inverse (unit_bijective_complete_inverse 𝐖𝐂𝐔𝐧𝐢𝐟 (X:=X)).\n\n  Lemma to_trapped_bijective_complete : LocallyComplete X.\n  Proof. apply wcunif_complete. exact (unit_bijective_complete 𝐖𝐂𝐔𝐧𝐢𝐟). Qed.\nEnd to_trapped_bijective.\n\n(** A continuous retraction of (τ X) suffices. *)\nSection to_trapped_retract.\n  Universes u.\n  Context `{@WCUnifSpace@{u} X Φ 𝒜} (r:𝒯 X ⇾ X) `{!Continuous r} (Er:r ∘ τ X = id).\n\n  Local Instance to_trapped_retract_complete_inverse : LocalCompleteInverse X\n    := wcunif_complete_inverse (unit_retract_complete_inverse 𝐖𝐂𝐔𝐧𝐢𝐟 (X:=X) r Er).\n\n  Lemma to_trapped_retract_complete : LocallyComplete X.\n  Proof. apply wcunif_complete. exact (unit_retract_complete 𝐖𝐂𝐔𝐧𝐢𝐟 (X:=X) r Er). Qed.\nEnd to_trapped_retract.\n\n(** A locally uniformly continuous extension construction subsuming the UP. *)\nSection complete_ext.\n  Universes u.\n  Context `{@WCUnifReflecting@{u} X Y Φ Ψ 𝒜 ℬ ι, !Dense ι}.\n  Context `{@WCUnifMorphism@{u} X Z Φ Ξ 𝒜 𝒵 f, @LocallyComplete Z Ξ 𝒵 Ci}.\n\n  Definition wc_cont_ext : Y ⇾ Z := (τ Z)⁻¹ ∘ 𝒯₁ f ∘ R ι.\n\n  Lemma wc_cont_ext_mor : WCUnifMorphism wc_cont_ext.\n  Proof. now pose proof canonical_completion_ext_mor 𝐖𝐂𝐔𝐧𝐢𝐟 ι f. Qed.\n\n  Lemma wc_cont_ext_spec : wc_cont_ext ∘ ι = f.\n  Proof. now pose proof canonical_completion_ext_spec 𝐖𝐂𝐔𝐧𝐢𝐟 ι f. Qed.\n\n  Lemma wc_cont_ext_dense `{!Dense f} : Dense wc_cont_ext.\n  Proof. now pose proof canonical_completion_ext_dense 𝐖𝐂𝐔𝐧𝐢𝐟 ι f. Qed.\nEnd complete_ext.\nArguments wc_cont_ext {_ _ _ _ _ _} ι {_ _ _ _ _} f {_ _ _}.\nArguments wc_cont_ext_spec {_ _ _ _ _ _} ι {_ _ _ _ _} f {_ _ _}.\n#[global] Hint Extern 2 (WCUnifMorphism             (wc_cont_ext _ _)) => simple notypeclasses refine wc_cont_ext_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (wc_cont_ext _ _)) => simple notypeclasses refine wc_cont_ext_mor : typeclass_instances.\n#[global] Hint Extern 2 (Bornological               (wc_cont_ext _ _)) => simple notypeclasses refine wc_cont_ext_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (wc_cont_ext se,"page":"../../tactics/easy.html"},{"s":16275,"e":16278,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":24278,"e":24281,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":24403,"e":24406,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":24540,"e":24543,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":25783,"e":25786,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":28317,"e":28320,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file instantiates the abstract completion theory of reflection pairs at well-containment uniform spaces (𝐖𝐂𝐔𝐧𝐢𝐟), with the trapped completion 𝒯 as the canonical completion. A concrete local completion is turned into a pair-level completion, and back. In this setting the two directions pack and unpack the uniformity and the bornology as a pair. With 𝒯 X, its unit τ, the maps 𝒯₁ f and the reflections registered as a canonical completion, and with completion shown to preserve initial maps through [[AffineConstructive.topology.reflection_pair.completion.dense_initial_descent_map_ini]], the general results transfer. Completions are locally complete, 𝒯 X in particular. The universal property extends to dense reflecting maps. A separated space with a dense locally complete subspace is locally complete. Local completeness also follows from a bijective unit or a continuous retraction of τ X, which yields [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete]]: a complete uniform space is locally complete. The extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] of a morphism into a locally complete space along a dense reflecting map is constructed as well.","short":"Local completions of well-containment uniform spaces, via the reflection-pair completion theory","items":[{"name":"AffineConstructive.topology.unif_born.local_completion.id","base":"id","kind":"abbrev","start":15,"body":null,"status":"ok","short":{"text":"Local shorthand for the identity function on a set","status":"ok"},"long":{"text":"A local abbreviation: id stands for [[AffineConstructive.interfaces.set.id_fun]] with the set inferred. It is used in the equations that say a map is a retraction, r ∘ f = id.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.ℒ","base":"ℒ","kind":"abbrev","start":16,"body":null,"status":"ok","short":{"text":"Local shorthand ℒ for the localization of a space","status":"ok"},"long":{"text":"A local abbreviation: ℒ X is [[AffineConstructive.topology.unif_born.localization.localization]] X, the set X with its localized uniformity and the same bornology. The trapped completion is built from Cauchy filters on ℒ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.ε","base":"ε","kind":"abbrev","start":17,"body":null,"status":"ok","short":{"text":"Local shorthand ε for the counit ℒ X ⇾ X of the localization","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.from_localization]], the identity of the underlying set, read as a map from the localization back to X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.η","base":"η","kind":"abbrev","start":18,"body":null,"status":"ok","short":{"text":"Local shorthand η for the unit X ⇾ ℒ X of the localization","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.to_localization]], the identity of the underlying set, read as a map from X to its localization.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.κ","base":"κ","kind":"abbrev","start":19,"body":null,"status":"ok","short":{"text":"Local shorthand κ for the unit X ⇾ 𝒞 X of the Cauchy completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy]], which sends a point to its principal filter. Here it compares the trapped completion with the Cauchy completion when X is complete as a uniform space.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.𝒞","base":"𝒞","kind":"abbrev","start":20,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒞 for the Cauchy completion, the set of Cauchy filters","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_filter_set]]: the Cauchy filters on a uniform space, with the Cauchy equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.𝒞₁","base":"𝒞₁","kind":"abbrev","start":21,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒞₁ for the action of the Cauchy completion on maps","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]]: the map 𝒞 X ⇾ 𝒞 Y induced by a uniformly continuous f, taking image filters.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.𝒯","base":"𝒯","kind":"abbrev","start":22,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒯 for the trapped completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_cauchy_filter_set]]: the trapped Cauchy filters on ℒ X. In this file it is the canonical completion of the reflection pair of well-containment uniform spaces.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.τ","base":"τ","kind":"abbrev","start":23,"body":null,"status":"ok","short":{"text":"Local shorthand τ for the unit X ⇾ 𝒯 X of the trapped completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped]], which sends a point to its principal filter. It is the unit of the canonical completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.ρ","base":"ρ","kind":"abbrev","start":24,"body":null,"status":"ok","short":{"text":"Local shorthand ρ for the comparison 𝒯 X ⇾ 𝒞 X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.from_trapped]], which reads a trapped filter as a Cauchy filter on X. The file uses it to show that a complete space is locally complete.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.𝒯₁","base":"𝒯₁","kind":"abbrev","start":25,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒯₁ for the action of the trapped completion on morphisms","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]]: the map 𝒯 X ⇾ 𝒯 Y induced by a morphism of well-containment uniform spaces.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.R","base":"R","kind":"abbrev","start":26,"body":null,"status":"ok","short":{"text":"Local shorthand R for the reflection Z ⇾ 𝒯 X of a dense reflecting map","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]]. Given a dense, locally reflecting f : X ⇾ Z, it is the map Z ⇾ 𝒯 X whose composite with f is the unit τ X. It supplies the reflects of the canonical completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion_reflect","base":"wcunif_pair_completion_reflect","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"Reads a local-completion operation on ι as the pair-level extension datum of ι at 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"long":{"text":"Given the local-completion operation on ι : X ⇾ Y, which assigns a map Z ⇾ Y to each dense initial f : X ⇾ Z, this definition repackages it as a [[AffineConstructive.topology.reflection_pair.completion.PairCompletionReflect]] for the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟. At the pair level, the structure on Z is a single element of the fibre, a pair of a uniformity and a bornology. The definition unpacks that pair and passes its components to [[AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial]].\n\nA global hint installs this translation, so the abstract theorems of the reflection-pair completion theory apply whenever a concrete local completion is in context.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_pair_complete_inverse","base":"wcunif_pair_complete_inverse","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"Reads a local complete-inverse datum on X as the pair-level complete-inverse datum at 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"long":{"text":"This is the special case of [[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion_reflect]] for the identity of X. It turns the retractions that [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] provides for dense initial extensions of X into the corresponding [[AffineConstructive.topology.reflection_pair.completion.PairCompleteInverse]]. Like the general case, it is registered as a hint.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion","base":"wcunif_pair_completion","kind":"prf","start":33,"body":[34,42],"status":"ok","short":{"text":"A local completion ι is a completion of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"A completion of the reflection pair asks that Y be Hausdorff, that ι be initial and dense, and for laws on the extension datum, which is the local completion's operation read at the pair level ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion_reflect]]). Hausdorffness follows from separatedness by [[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]. Initiality and density come from the local completion. Two laws about the extension remain.","status":"ok","from":0,"to":1},{"text":"Let Z carry a structure of the pair, that is, a uniformity Ξ and a bornology 𝒵, and let f : X ⇾ Z be initial and dense. The extension of ι along f is a morphism because the local completion requires it.","status":"ok","from":2,"to":4},{"text":"For the same Z and f, the extension composed with f is ι. This is the defining equation of the local completion's extension.","status":"ok","from":5,"to":8}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_complete_obj","base":"wcunif_complete_obj","kind":"prf","start":43,"body":[44,46],"status":"ok","short":{"text":"A locally complete space is a complete object of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"Local completeness of X says that the identity of X is a local completion. By [[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]] the identity is then a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟, and this is what it means for X to be a complete object.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_completion_reflect","base":"wcunif_completion_reflect","kind":"def","start":49,"body":null,"status":"ok","short":{"text":"Reads a pair-level completion-reflect datum at 𝐖𝐂𝐔𝐧𝐢𝐟 as a local completion-reflect datum on ι","status":"ok"},"long":{"text":"This is the converse of [[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion_reflect]]. It takes each dense initial f : X ⇾ Z, with Z given its uniformity and bornology separately, to the map that the pair-level datum assigns to f through [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_initial]], with the two structures packed as a pair. Pairs are eta-equivalent, so the two translations are definitionally inverse to each other. Unlike the forward direction, this one is not registered for resolution. Within the development only [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]] builds on it, as its special case at the identity of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse","base":"wcunif_complete_inverse","kind":"def","start":50,"body":null,"status":"ok","short":{"text":"Reads a pair-level complete-inverse datum at 𝐖𝐂𝐔𝐧𝐢𝐟 as a local complete-inverse datum on X","status":"ok"},"long":{"text":"This is the special case of [[AffineConstructive.topology.unif_born.local_completion.wcunif_completion_reflect]] for the identity of X. The file uses it to bring the pair-level completeness data back to [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]]: on the codomain of a completion, on a space with a dense complete subspace, and on a space whose unit τ X is bijective or has a retraction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_completion","base":"wcunif_completion","kind":"prf","start":51,"body":[52,70],"status":"ok","short":{"text":"A completion of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟 is a local completion","status":"ok"},"proof":[{"text":"Suppose ι is a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟. A local completion has five requirements: Y is separated, ι is initial, ι is dense, and two laws hold for the extension along a dense initial map.","status":"ok","from":0,"to":2},{"text":"Since ι is a completion, Y carries a genuine structure of the pair, that is, Y is a well-containment uniform space ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_obj_Y]]). A uniform space with a T₀ topology is separated ([[AffineConstructive.topology.uniform.base.uniform_T₀_separated]]), and a Hausdorff space is T₀ ([[AffineConstructive.topology.topology.base.Hausdorff_T₀]]). It therefore suffices that Y is Hausdorff, which the pair completion provides.","status":"ok","from":3,"to":7},{"text":"That ι is initial and that ι is dense are read off directly from the pair completion.","status":"ok","from":8,"to":11},{"text":"Let Z have a uniformity and a bornology, and let f : X ⇾ Z be initial and dense. The extension of ι along f is a morphism by the corresponding law of the pair completion.","status":"ok","from":12,"to":14},{"text":"For the same f, the extension composed with f is ι, again by the corresponding law of the pair completion.","status":"ok","from":15,"to":18}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_complete","base":"wcunif_complete","kind":"prf","start":71,"body":[72,74],"status":"ok","short":{"text":"A complete object of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟 is locally complete","status":"ok"},"proof":[{"text":"Completeness of X as an object says that the identity of X is a completion of the pair. By [[AffineConstructive.topology.unif_born.local_completion.wcunif_completion]] the identity is then a local completion, which is local completeness of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completor","base":"wcunif_canonical_completor","kind":"def","start":75,"body":[76,93],"status":"ok","short":{"text":"The trapped completion 𝒯, with τ, 𝒯₁ and R, as chosen completion data for 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"Five pieces of data must be supplied: a completion object for each object of the pair, its structure, the unit, the map induced by a morphism, and the reflection along a dense reflecting map.","status":"ok","from":0,"to":1},{"text":"A structure on X is a uniformity Φ together with a bornology 𝒜. The completion object of X is the trapped completion 𝒯 X.","status":"ok","from":2,"to":4},{"text":"The structure on 𝒯 X is its own uniformity ([[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_uniformity]]) together with its own bornology ([[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_bornology]]).","status":"ok","from":5,"to":7},{"text":"The unit is τ X : X ⇾ 𝒯 X.","status":"ok","from":8,"to":10},{"text":"A morphism f : X ⇾ Y induces the map 𝒯₁ f : 𝒯 X ⇾ 𝒯 Y.","status":"ok","from":11,"to":13},{"text":"A dense reflecting map f : X ⇾ Y gives the reflection R f : Y ⇾ 𝒯 X.","status":"ok","from":14,"to":17}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completion","base":"wcunif_canonical_completion","kind":"prf","start":95,"body":[96,119],"status":"ok","short":{"text":"The trapped completion satisfies the laws of a canonical completion for 𝐖𝐂𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"There are seven laws to check for the trapped completion data of [[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completor]].","status":"ok","from":0,"to":1},{"text":"The trapped completion 𝒯 X is Hausdorff. It is a separated uniform space ([[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_separated]]), and a separated uniform space has a Hausdorff topology ([[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]).","status":"ok","from":2,"to":4},{"text":"The unit τ X is an initial map of well-containment uniform spaces ([[AffineConstructive.topology.unif_born.trapped_wc.to_trapped_locally_initial]]).","status":"ok","from":5,"to":7},{"text":"The unit τ X is dense ([[AffineConstructive.topology.unif_born.trapped_wc.to_trapped_dense]]).","status":"ok","from":8,"to":10},{"text":"For a morphism f, the induced map 𝒯₁ f is a morphism ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor]]).","status":"ok","from":11,"to":13},{"text":"The unit is natural: 𝒯₁ f ∘ τ X = τ Y ∘ f ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]]).","status":"ok","from":14,"to":16},{"text":"For a dense reflecting f, the reflection R f is a morphism ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor]]).","status":"ok","from":17,"to":19},{"text":"For the same f, R f ∘ f = τ X ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec]]).","status":"ok","from":20,"to":23}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_map_initial","base":"wcunif_canonical_map_initial","kind":"prf","start":121,"body":[122,128],"status":"ok","short":{"text":"The trapped completion functor 𝒯₁ preserves initial maps","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.reflection_pair.completion.dense_initial_descent_map_ini]] it suffices that initiality descends along dense morphisms. Concretely: if f : S ⇾ T is a dense morphism, g : T ⇾ V is a morphism and g ∘ f is reflecting, then g is initial.","status":"ok","from":0,"to":1},{"text":"Fix such S, T, V, f and g, each space with its uniformity and bornology, so that g is a morphism of well-containment uniform spaces. Initiality in 𝐖𝐂𝐔𝐧𝐢𝐟 is assembled from local initiality, so it is enough to show that g is locally initial.","status":"ok","from":2,"to":4},{"text":"This is [[AffineConstructive.topology.unif_born.localization.dense_locally_initial]]: f is dense and a morphism, g is a morphism and g ∘ f is reflecting, so g is locally initial.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.topology.unif_born.local_completion.g","base":"g","kind":"abbrev","start":133,"body":null,"status":"ok","short":{"text":"Section shorthand for the map into Y induced by the dense initial f","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial]] ι f: the map Z ⇾ Y that the local completion ι assigns to the dense initial extension f : X ⇾ Z. The two lemmas of its section state properties of this map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_initial_dense","base":"local_completion_reflect_initial_dense","kind":"prf","start":134,"body":[135,137],"status":"ok","short":{"text":"The map a local completion induces from a dense initial extension is dense","status":"ok"},"proof":[{"text":"The local completion ι is a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]]). In any completion, the extension along an initial dense map is dense ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_initial_dense]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_initial_initial","base":"local_completion_reflect_initial_initial","kind":"prf","start":138,"body":[139,141],"status":"ok","short":{"text":"The map a local completion induces from a dense initial extension is initial","status":"ok"},"proof":[{"text":"The local completion ι is a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]]). The pair also has the trapped completion as its canonical completion ([[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completion]]). In this setting the extension along an initial dense map is initial ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_initial_initial]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_inverse","base":"local_completion_inverse","kind":"def","start":153,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on the codomain of a local completion","status":"ok"},"long":{"text":"If ι : X ⇾ Y is a local completion, Y carries a [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]]: a retraction for each dense initial extension of Y. This datum is the one that [[AffineConstructive.topology.reflection_pair.completion.pair_completion_inverse]] builds at the pair level, brought back by [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]]. The definition is declared a coercion, and a hint finds it whenever a local completion with codomain Y is in context. It is the first half of the statement that completions are complete; [[AffineConstructive.topology.unif_born.local_completion.local_completion_complete]] is the second.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_complete","base":"local_completion_complete","kind":"def","start":155,"body":[156,159],"status":"ok","short":{"text":"The codomain of a local completion is locally complete","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.unif_born.local_completion.wcunif_completion]] it suffices that the identity of Y is a completion of the pair 𝐖𝐂𝐔𝐧𝐢𝐟.","status":"ok","from":0,"to":1},{"text":"The local completion ι is a completion of the pair ([[AffineConstructive.topology.unif_born.local_completion.wcunif_pair_completion]]). The codomain of a completion is complete ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_complete]]), so the identity of Y is a completion.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.trapped_complete_inverse","base":"trapped_complete_inverse","kind":"def","start":160,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on the trapped completion 𝒯 X","status":"ok"},"long":{"text":"For a well-containment uniform space X, this is the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] on 𝒯 X. It assigns a map back into 𝒯 X to each dense initial extension of 𝒯 X. It is [[AffineConstructive.topology.unif_born.local_completion.local_completion_inverse]] at the unit τ X : X ⇾ 𝒯 X, which is a local completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.trapped_complete","base":"trapped_complete","kind":"prf","start":162,"body":[163,165],"status":"ok","short":{"text":"The trapped completion 𝒯 X of a well-containment uniform space is locally complete","status":"ok"},"proof":[{"text":"The unit τ X : X ⇾ 𝒯 X is a local completion of X ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion]]), and the codomain of any local completion is locally complete by [[AffineConstructive.topology.unif_born.local_completion.local_completion_complete]]. Applied to τ X, this shows that 𝒯 X is locally complete.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect","base":"local_completion_reflect","kind":"def","start":170,"body":null,"status":"ok","short":{"text":"For a local completion ι and dense reflecting f : X ⇾ Z, the morphism g : Z ⇾ Y with g ∘ f = ι","status":"ok"},"long":{"text":"This is the universal property of a local completion ι : X ⇾ Y, extended from initial tests to every dense map f : X ⇾ Z that is locally reflecting. The map f need not be a morphism, only reflecting. The result is the morphism Z ⇾ Y that [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect]] provides at 𝐖𝐂𝐔𝐧𝐢𝐟. The lemmas that follow show it is a morphism, satisfies g ∘ f = ι, and is dense. When f is initial, g agrees with [[AffineConstructive.topology.interfaces.unif_born.local_completion_reflect_initial]], is initial, and is an embedding if Z is separated.\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"g\"] \\\\\n& Y\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_mor","base":"local_completion_reflect_mor","kind":"inst","start":171,"body":[172,174],"status":"ok","short":{"text":"The map local_completion_reflect ι f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"A local completion ι is a completion for the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟, and its local-completion operation is the pair-level extension datum. So the general fact [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_mor]], taken at 𝐖𝐂𝐔𝐧𝐢𝐟, says that the reflection of f is a forward map of the pair, which here is a morphism of well-containment uniform spaces.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_spec","base":"local_completion_reflect_spec","kind":"prf","start":175,"body":[176,178],"status":"ok","short":{"text":"The map local_completion_reflect ι f composed with f equals ι","status":"ok"},"proof":[{"text":"This is the general factorisation [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_spec]] taken at the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟, with ι read as a completion of that pair. Composed with f, the reflection gives back ι.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_dense","base":"local_completion_reflect_dense","kind":"prf","start":179,"body":[180,182],"status":"ok","short":{"text":"The map local_completion_reflect ι f is dense","status":"ok"},"proof":[{"text":"Read ι as a completion of the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟. Then density of the reflection of f is the general result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_dense]] taken at that pair.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_equal","base":"local_completion_reflect_equal","kind":"prf","start":192,"body":[193,195],"status":"ok","short":{"text":"For initial f, local_completion_reflect ι f equals the map ι induces from f","status":"ok"},"proof":[{"text":"When f is dense and initial, the general theory gives two retractions into the completion: the one built from the reflection of f and the one ι induces from the initial map f. By [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_equal]], taken at 𝐖𝐂𝐔𝐧𝐢𝐟, the two coincide.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_is_initial","base":"local_completion_reflect_is_initial","kind":"prf","start":196,"body":[197,199],"status":"ok","short":{"text":"For initial f, the map local_completion_reflect ι f is initial","status":"ok"},"proof":[{"text":"For a dense initial f, the general result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_is_initial]], taken at the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟 with ι read as a completion of it, says that the reflection of f is initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_emb","base":"local_completion_reflect_emb","kind":"prf","start":209,"body":[210,212],"status":"ok","short":{"text":"For initial f into a separated Z, local_completion_reflect ι f is an embedding","status":"ok"},"proof":[{"text":"The reflection of f is initial ([[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_is_initial]]). An initial map of well-containment uniform spaces out of a separated space is an embedding by [[AffineConstructive.topology.unif_born.local_maps.wcunif_initial_embedding]], so the reflection of f is an embedding.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse","base":"local_complete_inverse","kind":"def","start":220,"body":null,"status":"ok","short":{"text":"For locally complete X and dense reflecting f : X ⇾ Z, the retraction Z ⇾ X of f","status":"ok"},"long":{"text":"This is the universal property of a locally complete space X, taken at the identity of X. A dense, locally reflecting f : X ⇾ Z has a retraction: [[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect]] applied to the identity and f, so that the retraction composed with f is the identity of X. Locally the definition declares f as the designated inverse of the retraction, so the retraction counts as surjective. The lemmas that follow show it is a dense morphism. When f is initial, it is initial; when moreover Z is separated, it is a bijection inverse to f and an embedding.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_mor","base":"local_complete_inverse_mor","kind":"prf","start":222,"body":[223,225],"status":"ok","short":{"text":"The retraction local_complete_inverse f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"By definition, the retraction is the reflection of f along the identity of X. The identity is a local completion because X is locally complete. So the retraction is a morphism by [[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_mor]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_spec","base":"local_complete_inverse_spec","kind":"prf","start":226,"body":[227,229],"status":"ok","short":{"text":"The retraction local_complete_inverse f composed with f is the identity of X","status":"ok"},"proof":[{"text":"The retraction is the reflection of f along the identity of X, which is a local completion because X is locally complete. By [[AffineConstructive.topology.unif_born.local_completion.local_completion_reflect_spec]] with ι the identity, the retraction composed with f is the identity of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_surjective","base":"local_complete_inverse_surjective","kind":"prf","start":230,"body":[231,233],"status":"ok","short":{"text":"The retraction of a dense reflecting f out of a locally complete space is surjective, with f as its section","status":"ok"},"proof":[{"text":"A map with a section is surjective. Here f is a section of the retraction: by [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_spec]], the retraction composed with f is the identity of X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_dense","base":"local_complete_inverse_dense","kind":"prf","start":234,"body":[235,238],"status":"ok","short":{"text":"The retraction of a dense reflecting f out of a locally complete space is dense","status":"ok"},"proof":[{"text":"A map g is dense once g ∘ f is dense ([[AffineConstructive.topology.topology.maps.Dense_factor_right]]). It therefore suffices to show that the retraction composed with f is dense.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_spec]] that composite is the identity of X, and the identity is dense.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_initial","base":"local_complete_inverse_initial","kind":"inst","start":253,"body":[254,256],"status":"ok","short":{"text":"For f dense and initial, the retraction [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse]] f is an initial map","status":"ok"},"proof":[{"text":"This is the general fact [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_is_initial]] for the reflection pair 𝐖𝐂𝐔𝐧𝐢𝐟, taken at the identity of X as the completion. A locally complete X is its own local completion, and its retraction along a dense initial test is initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_bij","base":"local_complete_inverse_bij","kind":"inst","start":258,"body":[259,261],"status":"ok","short":{"text":"For f dense and initial into a separated space, the retraction [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse]] f is a bijection","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.completion.complete_obj_inverse_bij]] for the pair 𝐖𝐂𝐔𝐧𝐢𝐟. Z is separated, so its topology is Hausdorff, and the inverse of a dense initial map out of a complete object into it is a bijection.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_bij_back","base":"local_complete_inverse_bij_back","kind":"prf","start":262,"body":[263,265],"status":"ok","short":{"text":"A dense initial f from a locally complete space into a separated one is a bijection, with the retraction as inverse","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.reflection_pair.completion.complete_obj_inverse_bij_back]] for the pair 𝐖𝐂𝐔𝐧𝐢𝐟. A dense initial map from a complete object into a Hausdorff object is a bijection whose inverse is the retraction.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_emb","base":"local_complete_inverse_emb","kind":"prf","start":280,"body":[281,283],"status":"ok","short":{"text":"For f dense and initial into a separated space, the retraction [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse]] f is an embedding","status":"ok"},"proof":[{"text":"The retraction is initial ([[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse_initial]]). Its domain Z is separated, and an initial map out of a separated space is an embedding ([[AffineConstructive.topology.unif_born.local_maps.wcunif_initial_embedding]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.alt_Build_LocallyComplete","base":"alt_Build_LocallyComplete","kind":"prf","start":288,"body":[289,295],"status":"ok","short":{"text":"X is locally complete once every dense initial extension has a morphism retracting it; separation follows","status":"ok"},"proof":[{"text":"Assume that the retraction along every dense initial extension of X is a morphism and a left inverse of that extension.","status":"ok","from":0,"to":1},{"text":"Local completeness follows from completeness as an object of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_complete]]). By [[AffineConstructive.topology.reflection_pair.completion.alt_Build_CompleteObj]] that completeness holds once every dense initial test has a forward left inverse, and separation then comes for free. What remains is to provide those left inverses.","status":"ok","from":2,"to":3},{"text":"Fix Y with its uniformity and bornology, so that a structure of 𝐖𝐂𝐔𝐧𝐢𝐟 on Y is unpacked into its two components. The assumption, applied to Y, Ψ and ℬ, gives the left inverse for every dense initial f.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.unif_born.local_completion.dense_initial_local_complete_inverse","base":"dense_initial_local_complete_inverse","kind":"inst","start":299,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on Y, given a dense initial map into Y from a locally complete X","status":"ok"},"long":{"text":"Given a locally complete X and a dense initial map f : X ⇾ Y, this is the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] on Y. It assigns a map back into Y to each dense initial extension of Y. It is the general datum [[AffineConstructive.topology.reflection_pair.completion.dense_initial_complete_inverse]] at 𝐖𝐂𝐔𝐧𝐢𝐟, unpacked by [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.dense_initial_locally_complete","base":"dense_initial_locally_complete","kind":"prf","start":300,"body":[301,304],"status":"ok","short":{"text":"A separated space receiving a dense initial map from a locally complete space is locally complete","status":"ok"},"proof":[{"text":"It suffices to show that Y is a complete object of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_complete]]). The required datum is carried along f from X.","status":"ok","from":0,"to":1},{"text":"X is a complete object and Y is separated, hence Hausdorff. A Hausdorff object that receives a dense initial map from a complete object is complete ([[AffineConstructive.topology.reflection_pair.completion.dense_initial_complete]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.to_trapped_bijective_complete_inverse","base":"to_trapped_bijective_complete_inverse","kind":"inst","start":311,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on X when the trapped unit τ X is a bijection","status":"ok"},"long":{"text":"Suppose the unit τ X : X ⇾ 𝒯 X of the trapped completion has a designated inverse that makes it a bijection. Then X inherits from 𝒯 X the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]], which retracts the dense initial extensions of X. It is the general datum [[AffineConstructive.topology.reflection_pair.completion.unit_bijective_complete_inverse]] at 𝐖𝐂𝐔𝐧𝐢𝐟, unpacked by [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.to_trapped_bijective_complete","base":"to_trapped_bijective_complete","kind":"prf","start":312,"body":[313,316],"status":"ok","short":{"text":"A well-containment space whose trapped unit τ X is a bijection is locally complete","status":"ok"},"proof":[{"text":"It suffices to show that X is a complete object of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_complete]]).","status":"ok","from":0,"to":1},{"text":"The trapped completion is the canonical completion of the pair, and its unit τ X is a bijection. An object whose unit is a bijection is complete ([[AffineConstructive.topology.reflection_pair.completion.unit_bijective_complete]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete_inverse","base":"to_trapped_retract_complete_inverse","kind":"inst","start":321,"body":null,"status":"ok","short":{"text":"The local complete-inverse datum on X from a continuous retraction r of the trapped unit τ X","status":"ok"},"long":{"text":"Given a continuous r : 𝒯 X ⇾ X with r ∘ τ X = id, X receives the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]], which retracts its dense initial extensions. Each extension is sent into 𝒯 X and then brought back by r. It is the general datum [[AffineConstructive.topology.reflection_pair.completion.unit_retract_complete_inverse]] at 𝐖𝐂𝐔𝐧𝐢𝐟, unpacked by [[AffineConstructive.topology.unif_born.local_completion.wcunif_complete_inverse]]. The datum [[AffineConstructive.topology.unif_born.local_completion.complete_locally_inverse]] on a complete uniform space is built from it, with r = (κ X)⁻¹ ∘ ρ X. So is [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_locally_complete_inverse]], where r is the limit map on 𝒪 S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete","base":"to_trapped_retract_complete","kind":"prf","start":322,"body":[323,326],"status":"ok","short":{"text":"A well-containment space whose trapped unit τ X has a continuous retraction is locally complete","status":"ok"},"proof":[{"text":"It suffices to show that X is a complete object of the pair 𝐖𝐂𝐔𝐧𝐢𝐟 ([[AffineConstructive.topology.unif_born.local_completion.wcunif_complete]]).","status":"ok","from":0,"to":1},{"text":"The map r is a continuous retraction of the unit τ X of the canonical completion. An object whose unit has a continuous retraction is complete ([[AffineConstructive.topology.reflection_pair.completion.unit_retract_complete]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext","base":"wc_cont_ext","kind":"def","start":332,"body":null,"status":"ok","short":{"text":"The extension Y ⇾ Z of a morphism f : X ⇾ Z along a dense reflecting ι : X ⇾ Y, Z locally complete","status":"ok"},"long":{"text":"Let ι : X ⇾ Y be dense and locally reflecting, and let f : X ⇾ Z be a morphism of well-containment uniform spaces into a locally complete Z. The extension is the composite of three maps. First comes the reflection [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] ι : Y ⇾ 𝒯 X. Next comes the induced map [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] f : 𝒯 X ⇾ 𝒯 Z. Last comes the inverse of the unit τ Z, which exists because Z is locally complete; it is the retraction [[AffineConstructive.topology.unif_born.local_completion.local_complete_inverse]] of τ Z.\n\n```tikzcd\nX \\arrow[r, \"\\iota\"] \\arrow[d, \"f\"'] & Y \\arrow[r, \"R\\,\\iota\"] \\arrow[dl, dashed] & \\Trp X \\arrow[d, \"\\Trp f\"] \\\\\nZ & & \\Trp Z \\arrow[ll, \"(\\tau Z)^{-1}\"]\n```\n\nThis is the extension of the general theory of canonical completions at 𝐖𝐂𝐔𝐧𝐢𝐟. It is a morphism, it agrees with f along ι, it is dense when f is, and it is initial when ι and f are. It subsumes the universal property: when f is ι and the target is a completion, it is the retraction back into the completion.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_mor","base":"wc_cont_ext_mor","kind":"prf","start":333,"body":[334,336],"status":"ok","short":{"text":"The extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"Z is locally complete, so it is a complete object of 𝐖𝐂𝐔𝐧𝐢𝐟. By [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_mor]], the extension of f along the dense reflecting ι is a forward map of the pair, that is, a morphism of well-containment uniform spaces.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_spec","base":"wc_cont_ext_spec","kind":"prf","start":337,"body":[338,340],"status":"ok","short":{"text":"The extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f composed with ι is f","status":"ok"},"proof":[{"text":"This is the factorisation property of the extension in the general theory, [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_spec]], read at the pair 𝐖𝐂𝐔𝐧𝐢𝐟. The trapped completion supplies the canonical completion there, and the locally complete space Z is a complete object of the pair.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_dense","base":"wc_cont_ext_dense","kind":"prf","start":341,"body":[342,344],"status":"ok","short":{"text":"The extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f of a dense f is dense","status":"ok"},"proof":[{"text":"This is the general fact [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_dense]] at the pair 𝐖𝐂𝐔𝐧𝐢𝐟. The trapped completion serves as its canonical completion, and Z, being locally complete, is a complete object of the pair.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_initial","base":"wc_cont_ext_initial","kind":"prf","start":354,"body":[355,357],"status":"ok","short":{"text":"If ι and f are both initial, the extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f is initial","status":"ok"},"proof":[{"text":"This is the general fact [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_initial]] at the pair 𝐖𝐂𝐔𝐧𝐢𝐟. Its hypothesis that the completion functor preserves initial maps is [[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_map_initial]], which says this of the trapped completion.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_emb","base":"wc_cont_ext_emb","kind":"prf","start":367,"body":[368,370],"status":"ok","short":{"text":"If ι and f are initial and Y is separated, the extension [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext]] ι f is an embedding","status":"ok"},"proof":[{"text":"The extension is initial by [[AffineConstructive.topology.unif_born.local_completion.wc_cont_ext_initial]]. Since Y is separated, it is an embedding by [[AffineConstructive.topology.unif_born.local_maps.wcunif_initial_embedding]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec","base":"complete_locally_complete_spec","kind":"prf","start":378,"body":[379,383],"status":"ok","short":{"text":"In a complete uniform space, the inverse of κ X composed with ρ X retracts the trapped unit τ X","status":"ok"},"proof":[{"text":"Regroup the composite so that ρ X ∘ τ X stands together. By [[AffineConstructive.topology.unif_born.trapped_wc.from_trapped_spec]] this composite is the Cauchy unit κ X, and the goal becomes (κ X)⁻¹ ∘ κ X = id.","status":"ok","from":0,"to":2},{"text":"The unit κ X is a dense, uniformly initial map from the complete space X into the separated space 𝒞 X. By [[AffineConstructive.topology.uniform.completion.complete_inverse_bij_back]] it is therefore a bijection, and its inverse composed with it is the identity ([[AffineConstructive.theory.set.bijective]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.unif_born.local_completion.Er","base":"Er","kind":"abbrev","start":384,"body":null,"status":"ok","short":{"text":"Local name for the retraction law (κ X)⁻¹ ∘ ρ X ∘ τ X = id on a complete space","status":"ok"},"long":{"text":"A section-local shorthand for [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec]]. That lemma says the map (κ X)⁻¹ ∘ ρ X retracts the trapped unit τ X when X is a complete uniform space. The only use of the shorthand is to supply the retraction law in the definition of [[AffineConstructive.topology.unif_born.local_completion.complete_locally_inverse]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.complete_locally_inverse","base":"complete_locally_inverse","kind":"inst","start":385,"body":null,"status":"ok","short":{"text":"The local-completion datum on a complete uniform space with a well-containment bornology","status":"ok"},"long":{"text":"When X is complete as a uniform space, its Cauchy unit κ X is a bijection. Reading a trapped filter as a Cauchy filter with ρ X and then applying the inverse of κ X gives a retraction of the trapped unit τ X ([[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec]]). This instance is the datum [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete_inverse]] built from that retraction. It makes the operation [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] available on every complete well-containment uniform space.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.local_completion.complete_locally_complete","base":"complete_locally_complete","kind":"prf","start":386,"body":[387,389],"status":"ok","short":{"text":"A complete uniform space with a well-containment bornology is locally complete","status":"ok"},"proof":[{"text":"Apply [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete]] with the retraction (κ X)⁻¹ ∘ ρ X of τ X, which is a retraction by [[AffineConstructive.topology.unif_born.local_completion.complete_locally_complete_spec]]. It is continuous because ρ X is uniformly continuous ([[AffineConstructive.topology.unif_born.trapped_wc.from_trapped_uc]]). The inverse of κ X is also continuous: κ X is a bijection ([[AffineConstructive.topology.uniform.completion.complete_inverse_bij_back]]) and reflects continuously, so [[AffineConstructive.topology.topology.maps.invert_reflecting]] applies.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{"\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"g\"] \\\\\n& Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='62.414pt' height='52.834pt' viewBox='0 0 62.414 52.834'>\n<defs>\n<path id='g1-1' d='M.80852-1.44976C.73882-1.22672 .51578-.71791 .51578-.52275C.51578-.24395 .73185 .0697 1.19884 .0697C1.51249 .0697 1.86796-.05576 2.15373-.28577C2.54405-.60639 2.60678-.98277 2.60678-.99671C2.60678-1.08732 2.51617-1.08732 2.49526-1.08732C2.40465-1.08732 2.39071-1.05944 2.36283-.95489C2.18858-.44608 1.63795-.12546 1.21278-.12546C1.1152-.12546 1.02459-.14637 1.02459-.36941C1.02459-.4182 1.02459-.52275 1.10823-.73185C1.48461-1.73553 1.73553-2.82285 1.73553-2.85073C1.73553-2.97619 1.63795-3.07377 1.49855-3.07377C1.36612-3.07377 1.24763-2.97619 1.20581-2.89255C1.15702-2.76012 1.09429-2.42556 1.05247-2.29313C1.01065-2.18161 .93398-1.8819 .89913-1.77038L.80852-1.44976Z'/>\n<path id='g1-2' d='M2.83679-2.75315H3.51985C3.65925-2.75315 3.74986-2.75315 3.74986-2.90649C3.74986-3.00407 3.65925-3.00407 3.53379-3.00407H2.88558C3.04589-3.88926 3.10165-4.20988 3.15741-4.41201C3.19226-4.56535 3.3456-4.71172 3.51288-4.71172C3.51985-4.71172 3.70804-

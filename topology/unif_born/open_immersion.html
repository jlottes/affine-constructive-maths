opology.topology.product":"topology/topology/product.html","AffineConstructive.topology.reflection_pair.products":"topology/reflection_pair/products.html","AffineConstructive.topology.reflection_pair.completion":"topology/reflection_pair/completion.html","AffineConstructive.topology.topology":"topology/topology.html","AffineConstructive.topology.topology.induced":"topology/topology/induced.html","AffineConstructive.topology.topology.subspace":"topology/topology/subspace.html","AffineConstructive.topology.unif_born.local_completion":"topology/unif_born/local_completion.html","AffineConstructive.topology.uniform.base":"topology/uniform/base.html","AffineConstructive.topology.uniform.completion":"topology/uniform/completion.html","AffineConstructive.topology.uniform.uniformly_below":"topology/uniform/uniformly_below.html","AffineConstructive.topology.uniform.basis":"topology/uniform/basis.html","AffineConstructive.topology.uniform.final":"topology/uniform/final.html","AffineConstructive.topology.uniform.product":"topology/uniform/product.html","AffineConstructive.topology.uniform.cylinder":"topology/uniform/cylinder.html","AffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** The open immersion construction (doc/wcunif.md): a pair (X, S) of a\n    UnifBorn space and an open subset yields the subspace carrier with the\n    pullback uniformity and the well-containment bornology\n    [{K | ι⁎K ∊ 𝒜 ∧ ι⁎K ◁ S}] — bounded sets are the ambient-bounded sets\n    uniformly inside S, so the immersion \"remembers the boundary\".  The\n    inclusion is a uniform embedding and bornological, but deliberately NOT\n    bornology-reflecting. *)\n\nRequire Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.unif_born.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices theory.subgroups orders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.topology topology.uniform.base topology.uniform.uniformly_below.\nRequire Import uniform.basis uniform.subspace.\nRequire Import bornology.base bornology.subspace.\nRequire Import unif_born.base unif_born.local_maps unif_born.well_contained.\nRequire Import easy rewrite replc simplify strip_coercions tactics.misc.\n\nLocal Open Scope topology_scope.\nLocal Open Scope sg_op_scope.\nLocal Open Scope grp_scope.\nLocal Open Scope subset_scope.\n\nImport thicken_notation.\nImport image_notation.\nImport tensor_map_notation.\n\nLocal Abbreviation id := (id_fun _).\nLocal Abbreviation int := interior.\nLocal Abbreviation cl := closure.\n\n(** The bornology of well-contained sets, [𝒲 S]. *)\nDefinition open_immersion_bornology {X:set} {Φ:Uniformity X} {𝒜:Bornology X} (S:𝒫 X) : Bornology S\n  := { K : 𝒫 S | (from_subset S)⁎ K ∊ 𝒜 ∧ (from_subset S)⁎ K ◁ S }.\nLocal Abbreviation 𝒲 := open_immersion_bornology.\n\n(** The open immersion as a phantom carrier (cf. [localization]): [𝒪 S] — via\n    [Local Abbreviation 𝒪 := (open_immersion X)] — is the subset carrier [S]\n    with the pullback uniformity and the well-containment bornology [𝒲 S]\n    keyed on the name. *)\nDefinition open_immersion {X:set} {Φ:Uniformity X} {𝒜:Bornology X} (S:𝒫 X) : set := S.\nGlobal Typeclasses Opaque open_immersion.\nLocal Abbreviation 𝒪 := open_immersion.\n\n#[global] Hint Extern 0 (Uniformity (@open_immersion ?X ?Φ ?𝒜 ?S)) => exact (pullback_uniformity (from_subset S)) : typeclass_instances.\n#[global] Hint Extern 0 (Bornology (@open_immersion ?X ?Φ ?𝒜 ?S)) => exact (@open_immersion_bornology X Φ 𝒜 S) : typeclass_instances.\n\nDefinition from_open_immersion {X:set} {Φ:Uniformity X} {𝒜:Bornology X} (S:𝒫 X)\n  : 𝒪 S ⇾ X := from_subset S.\nLocal Abbreviation j := from_open_immersion.\n\nLocal Instance open_immersion_incl_unif_emb `{@UniformSpace X Φ} {𝒜:Bornology X} {S:𝒫 X} : UniformlyEmbedding (j S).\nProof. now unfold j. Qed.\n#[global] Hint Extern 2 (UniformlyEmbedding  (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyInitial    (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyContinuous (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n\n#[global] Hint Extern 2 (Injective (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding  (YN:=UniformNeighborhood) (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial    (YN:=UniformNeighborhood) (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n#[global] Hint Extern 2 (Continuous             (YN:=UniformNeighborhood) (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting (YN:=UniformNeighborhood) (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_unif_emb X Φ _ 𝒜 S) : typeclass_instances.\n\nSection open_immersion.\n  Universes u.\n  Context `{@UnifBornSpace@{u} X Φ 𝒜} (S : 𝒫 X).\n  Local Abbreviation ι := (from_subset S).\n\n  Local Ltac unfold_B := change (?K ∊ 𝒲 _) with (ι⁎ K ∊ 𝒜 ∧ ι⁎ K ◁ S).\n\n  Local Instance open_immersion_bornology_ideal : Ideal (𝒲 S).\n  Proof. apply Build_Ideal.\n  + apply Build_DownSet. intros K K'. unfold_B.\n    rew (order_preserving ι⁎ K K').\n    rew <-(aprod_adj _ _ _). apply aand_intro.\n    * rew (aandl _ _). rew (aprod_adj _ _ _). exact (down_closed 𝒜 _ _).\n    * rew (aandr _ _). exact (unif_below_le_l _ _ _).\n  + split; try exact _.\n    * exists ⊥. unfold_B. rew (preserves_bottom ι⁎). split.\n      - exact sub_bot_closed.\n      - exact (unif_below_empty S).\n    * intros K K'. rew <-(aex_ub _ (K ⊔ K')). unfold_B.\n      rew (preserves_join ι⁎ K K').\n      rew (aprod_true_r (join_ub_r K K')), (aprod_true_r (join_ub_l K K')).\n      apply aand_intro.\n      - rew [(aandl _ _)|(aandl _ _)]. exact (sub_join_closed _ _).\n      - rew [(aandr _ _)|(aandr _ _)]. exact (unif_below_join _ _ _).\n  Qed.\n\n  Local Instance open_immersion_incl_locally_ur : LocallyUniformlyReflecting (j S).\n  Proof. unfold j. exact ur_locally_ur. Qed.\n\n  Context {HS:open S}.\n\n  Local Instance open_immersion_born_space : BornologicalSpace (𝒪 S).\n  Proof. apply Build_BornologicalSpace; [ exact open_immersion_bornology_ideal |].\n    intros x. unfold_B.\n    assert (ι x ∊ interior S) as el by now rew (HS : interior S = S).\n    rew (image_singleton_alt ι x). split.\n    * exact (bornology_singleton _).\n    * exact (singleton_unif_below _ _).\n  Qed.\n\n  Local Instance open_immersion_unif_born : UnifBornSpace (𝒪 S).\n  Proof. now split. Qed.\n\n  Local Instance open_immersion_incl_bornological : Bornological (j S).\n  Proof. split; try exact _. intros A. exact (andl (subset_pt_is_el A)). Qed.\n\n  Local Instance open_immersion_incl_unif_born : UnifBornMorphism (j S).\n  Proof. now split. Qed.\n\n  Local Instance open_immersion_incl_locally_ub : LocallyUnifBorn (j S).\n  Proof. split; try exact _. unfold j. exact uc_locally_uc. Qed.\nEnd open_immersion.\n#[global] Hint Extern 2 (@BornologicalSpace _ (@open_immersion_bornology ?X ?Φ ?𝒜 ?S))\n  => simple notypeclasses refine (@open_immersion_born_space X Φ 𝒜 _ S _) : typeclass_instances.\n#[global] Hint Extern 2 (@UnifBornSpace _ (pullback_uniformity (Ψ:=?Φ) (from_subset ?S)) (@open_immersion_bornology ?X ?Φ ?𝒜 ?S))\n  => simple notypeclasses refine (@open_immersion_unif_born X Φ 𝒜 _ S _) : typeclass_instances.\n\n#[global] Hint Extern 2 (Bornological (@from_open_immersion ?X ?Φ ?𝒜 ?S))\n  => simple notypeclasses refine (@open_immersion_incl_bornological X Φ 𝒜 _ S _) : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornMorphism (@from_open_immersion ?X ?Φ ?𝒜 ?S))\n  => simple notypeclasses refine (@open_immersion_incl_unif_born X Φ 𝒜 _ S _) : typeclass_instances.\n\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_locally_ub X Φ 𝒜 _ S _) : typeclass_instances.\n#[global] Hint Extern 2 (LocalUniformContinuity (@from_open_immersion ?X ?Φ ?𝒜 ?S))     => simple notypeclasses refine (@open_immersion_incl_locally_ub X Φ 𝒜 _ S _) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_locally_ur X Φ 𝒜 _ S) : typeclass_instances.\n#[global] Hint Extern 2 (LocalUniformReflection (@from_open_immersion ?X ?Φ ?𝒜 ?S))     => simple notypeclasses refine (@open_immersion_incl_locally_ur X Φ 𝒜 _ S) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn (@from_open_immersion ?X ?Φ ?𝒜 ?S))            => simple notypeclasses refine (@open_immersion_incl_locally_ub X Φ 𝒜 _ S _) : typeclass_instances.\n\nSection open_immersion.\n  Universes u.\n  Context `{@WCUnifSpace@{u} X Φ 𝒜} (S : 𝒫 X) {HS:open S}.\n  Local Abbreviation ι := (from_subset S).\n\n  Local Instance open_immersion_wcunif : WCUnifSpace (𝒪 S).\n  Proof. split; try exact _. intros A.\n    pose proof (subset_pt_is_el A) as [HAb HA].\n    pose (A' := to_subset (U:=𝒜) (ι⁎ A)).\n    assert (A' ⋐ S) as HA' by assumption.\n    rew (wc_interpolate _ _) in HA'. destruct HA' as [L [[U HL1] HL2]].\n    unshelve eexists.\n    + unshelve esplit. exact (ufm_preimage ι U). now exists U.\n    + change ((ufm_preimage ι U).[powerset_pt A] ∊ 𝒲 S).\n      split; now rew (image_thicken_uc_le ι U _), HL1.\n  Qed.\n  \n  Lemma open_immersion_incl_wcunif_mor : WCUnifMorphism (j S).\n  Proof. now split. Qed.\nEnd open_immersion.\n\n#[global] Hint Extern 2 (WCUnifSpace (@open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_wcunif X Φ 𝒜 _ S _) : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifMorphism (@from_open_immersion ?X ?Φ ?𝒜 ?S)) => simple notypeclasses refine (@open_immersion_incl_wcunif_mor X Φ 𝒜 _ S _) : typeclass_instances.\n\nDefinition open_immersion_restrict@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}\n  (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) {H:S ⊆ f* T} : 𝒪 S ⇾ 𝒪 T := restrict f S T (H:=H:MapsTo f S T).\n\nLocal Abbreviation 𝒪₁ := open_immersion_restrict.\n\nLemma open_immersion_natural@{u} {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}\n  (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) {H:S ⊆ f* T}\n  : j T ∘ 𝒪₁ f S T = f ∘ j S.\nProof. refl. Qed.\n\nLemma open_immersion_compose@{u} {X Y Z:set@{u}}\n  {Φ:Uniformity X} {Ψ:Uniformity Y} {Ξ:Uniformity Z}\n  {𝒜:Bornology X} {ℬ:Bornology Y} {𝒞:Bornology Z}\n  (g:Y ⇾ Z) (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) (V:𝒫 Z)\n  {HST:S ⊆ f* T} {HTV:T ⊆ g* V} {HSV:S ⊆ (g ∘ f)* V}\n  :  𝒪₁ (g ∘ f) S V =  𝒪₁ g T V ∘  𝒪₁ f S T .\nProof. refl. Qed.\n\n#[global] Hint Extern 8 (apos (?A ≤ (func_op id*) ?B)) => change (A ⊆ B) : typeclass_instances.\n\nLemma open_immersion_id@{u} {X:set@{u}} {Φ:Uniformity X} {𝒜:Bornology X} (S:𝒫 X)\n  :  𝒪₁ id S S = id .\nProof. refl. Qed.\n\nSection restrict_classes.\n  Universes u.\n  Context {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}.\n  Context (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) {H:S ⊆ f* T}.\n\n  Local Instance open_immersion_restrict_ufm_cont `{!UniformlyContinuous f} : UniformlyContinuous (𝒪₁ f S T).\n  Proof. apply pullback_uniformity_initial. now change (UniformlyContinuous (f ∘ j S)). Qed.\n\n  Local Instance open_immersion_restrict_ufm_refl `{!UniformlyReflecting f} : UniformlyReflecting (𝒪₁ f S T).\n  Proof. apply (ufm_refl_factor _ (j T)). now change (UniformlyReflecting (f ∘ j S)). Qed.\n\n  Local Instance open_immersion_restrict_ufm_initial `{!UniformlyInitial f} : UniformlyInitial (𝒪₁ f S T).\n  Proof. now split. Qed.\n\n  Local Instance open_immersion_restrict_ufm_emb `{!UniformlyEmbedding f} : UniformlyEmbedding (𝒪₁ f S T).\n  Proof. split; try exact _.\n    apply (injective_factor _ (j T)). now change (Injective (f ∘ j S)).\n  Qed.\nEnd restrict_classes.\n\n#[global] Hint Extern 2 (UniformlyContinuous (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_ufm_cont X Y Φ Ψ 𝒜 ℬ f S T H _) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_ufm_refl X Y Φ Ψ 𝒜 ℬ f S T H _) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyInitial (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_ufm_initial X Y Φ Ψ 𝒜 ℬ f S T H _) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyEmbedding (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_ufm_emb X Y Φ Ψ 𝒜 ℬ f S T H _) : typeclass_instances.\n#[global] Hint Extern 2 (Injective (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_ufm_emb X Y Φ Ψ 𝒜 ℬ f S T H _) : typeclass_instances.\n\nSection restrict_locally.\n  Universes u.\n  Context {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}.\n  Context `{!UnifBornSpace X} `{!UnifBornSpace Y}.\n  Context (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) {H:S ⊆ f* T}.\n\n  Local Instance open_immersion_restrict_local_uc {HS:open S} `{!LocalUniformContinuity f} : LocalUniformContinuity (𝒪₁ f S T).\n  Proof. apply (local_uc_factor _ (j T)).\n    change (LocalUniformContinuity (f ∘ j S)).\n    apply local_uc_compose; exact _.\n  Qed.\n\n  Local Instance open_immersion_restrict_local_ur {HT:open T} `{!LocalUniformReflection f} : LocalUniformReflection (𝒪₁ f S T).\n  Proof. apply (local_ur_factor _ (j T)).\n    change (LocalUniformReflection (f ∘ j S)).\n    apply local_ur_compose_ur; exact _.\n  Qed.\n\n  Local Instance open_immersion_restrict_locally_uc {HS:open S} `{!LocallyUniformlyContinuous f} : LocallyUniformlyContinuous (𝒪₁ f S T).\n  Proof. now split. Qed.\n\n  Local Instance open_immersion_restrict_locally_ur {HT:open T} `{!LocallyUniformlyReflecting f} : LocallyUniformlyReflecting (𝒪₁ f S T).\n  Proof. now split. Qed.\nEnd restrict_locally.\n\n#[global] Hint Extern 2 (LocalUniformContinuity (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_local_uc X Y Φ Ψ 𝒜 ℬ _ _ f S T H _ _) : typeclass_instances.\n#[global] Hint Extern 2 (LocalUniformReflection (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_local_ur X Y Φ Ψ 𝒜 ℬ _ _ f S T H _ _) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_locally_uc X Y Φ Ψ 𝒜 ℬ _ _ f S T H _ _) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_locally_ur X Y Φ Ψ 𝒜 ℬ _ _ f S T H _ _) : typeclass_instances.\n\nSection restrict_dense.\n  Universes u.\n  Context {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}.\n  Context `{!UniformSpace Y}.\n  Context (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) {H:S ⊆ f* T} {E:f* T ⊆ S}.\n\n  Lemma open_immersion_restrict_dense {HT:open T} `{!Dense f} : Dense (𝒪₁ f S T).\n  Proof. exact (dense_open_restrict f S T). Qed.\nEnd restrict_dense.\n\n\nSection restrict_born_refl.\n  Universes u.\n  Context {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}.\n  Context `{!UnifBornSpace X} `{!UnifBornSpace Y}.\n  Context (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) {H:S ⊆ f* T} {E:f* T ⊆ S}.\n\n  Local Abbreviation ι := from_subset.\n\n  Let HS_from_E : Continuous f → open T → open S.\n  Proof. intros ??.\n    assert (S = f* T) as E' by now apply (le_antisym (X:=𝒫 X)).\n    rew E'. now apply (continuity_alt f).\n  Qed.\n  #[local] Hint Extern 4 (apos (open S)) => simple notypeclasses refine (HS_from_E _ _) : typeclass_instances.\n\n  Lemma open_immersion_restrict_born_refl {HT:open T}\n    `{!UniformlyContinuous f, !BornologyReflecting f} : BornologyReflecting (𝒪₁ f S T).\n  Proof. split; try exact _. intros L.\n    pose (L' := @to_subset _ _ ((ι T)⁎ L) (andl (subset_pt_is_el L))).\n    pose proof andr (subset_pt_is_el L) : L' ⋐ T as HL'.\n    rew <-(injective_preimage_image_alt _ _ : (ι T)* L' = powerset_pt L).\n    change ((ι S)* (f* L') ∊ 𝒲 S).\n    split; rew (image_preimage_counit _ _).\n    + exact (subset_pt_is_el (born_preimage f L')).\n    + destruct HL' as [U HU]. exists (ufm_preimage f U).\n      rew (preimage_thicken_uc_le f _ _). now rew <-E, HU.\n  Qed.\nEnd restrict_born_refl.\n\n#[global] Hint Extern 2 (Dense (func_op (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H))) => simple notypeclasses refine (@open_immersion_restrict_dense X Y Φ Ψ 𝒜 ℬ _ f S T H _ _ _) : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_born_refl X Y Φ Ψ 𝒜 ℬ _ _ f S T H _ _ _ _) : typeclass_instances.\n\n(** * Bornological: the boundary-condition theorem.  The apartness kit —\n    [thicken_apart_swap], [thicken_apart_split], [image_reflect_apart] — lives\n    in uniform/base.v.\n\n    The boundary condition [(cl f⁎(Sᗮ))ᗮ ⊆ T] is exactly what makes the\n    restriction bornological: margins of bounded sets inside [S] push forward\n    to margins inside [T]. *)\nSection restrict_bornological.\n  Universes u.\n  Context {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}.\n  Context `{!UnifBornSpace X} `{!UnifBornSpace Y}.\n  Context (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) {H:S ⊆ f* T}.\n\n  Local Abbreviation ι := from_subset.\n\n  Lemma open_immersion_restrict_bornological {HS:open S} {HT:open T}\n    `{!Bornological f, !UniformlyReflecting f}\n    {HB : interior (∀.[f] S) ⊆ T}\n    : Bornological (𝒪₁ f S T).\n  Proof. split; try exact _. intros K.\n    pose (K' := @to_subset _ 𝒜 ((ι S)⁎ K) (andl (subset_pt_is_el K))).\n    pose proof andr (subset_pt_is_el K) : (ι S)⁎ K ◁ S as HK.\n    change ((ι T)⁎ ((𝒪₁ f S T)⁎ K) ∊ ℬ ∧ (ι T)⁎ ((𝒪₁ f S T)⁎ K) ◁ T).\n    rew <-(image_compose_alt (𝒪₁ f S T) (ι T) _).\n    change (ι T ∘ 𝒪₁ f S T) with (f ∘ ι S).\n    rew (image_compose_alt (ι S) f _). change (f⁎ K' ∊ ℬ ∧ f⁎ K' ◁ T).\n    split.\n    + exact (subset_pt_is_el (born_image f K')).\n    + destruct HK as [U HU].\n      rew (image_reflect_apart f U _ (S ᗮ)) in HU.\n      change ((ι S)⁎ K) with (powerset_pt K') in HU. destruct HU as [W HW].\n      rew (thicken_apart_split _ _ _) in HW. destruct HW as [V HV].\n      exists V. rew HV.\n      now rew <-(closure_sub_thicken V (f⁎ (S ᗮ))).\n  Qed.\nEnd restrict_bornological.\n\n#[global] Hint Extern 2 (Bornological (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_bornological X Y Φ Ψ 𝒜 ℬ _ _ f S T H _ _ _ _ _) : typeclass_instances.\n\n(** * Bundles.  Each one-sided bundle needs the OPPOSITE global uniform class\n    (the bornology transfers run on the crossed polarity: Bornological rides\n    reflection, BornologyReflecting rides cont ded pair takes the WCUnif class of [f] plus\n    the crossed global uniform leg; the two-sided pair takes the global bundle\n    between WC endpoints — the Ini/Emb classes of the (unformalized) global\n    WCUnif pair.  A separate section: the ambient [UnifBornSpace] premises of\n    [restrict_bundles] are redundant here (the WCUnif hypotheses carry them). *)\nSection restrict_wcunif_bundles.\n  Universes u.\n  Context {X Y:set@{u}} {Φ:Uniformity X} {Ψ:Uniformity Y} {𝒜:Bornology X} {ℬ:Bornology Y}.\n  Context (f:X ⇾ Y) (S:𝒫 X) (T:𝒫 Y) {H:S ⊆ f* T} {HT:open T}.\n\n  Let HS_from_E : Continuous f → f* T ⊆ S → open S.\n  Proof. intros ??.\n    assert (S = f* T) as E' by now apply (le_antisym (X:=𝒫 X)).\n    rew E'. now apply (continuity_alt f).\n  Qed.\n  #[local] Hint Extern 4 (apos (open S)) => simple notypeclasses refine (HS_from_E _ _) : typeclass_instances.\n\n  Local Instance open_immersion_restrict_wcunif {HS:open S} {HB : interior (∀.[f] S) ⊆ T}\n    `{!WCUnifMorphism f, !UniformlyReflecting f} : WCUnifMorphism (𝒪₁ f S T).\n  Proof. now split. Qed.\n\n  Local Instance open_immersion_restrict_wcunif_refl {E:f* T ⊆ S}\n    `{!WCUnifReflecting f, !UniformlyContinuous f} : WCUnifReflecting (𝒪₁ f S T).\n  Proof. now split. Qed.\n\n  Local Instance open_immersion_restrict_wcunif_initial {E:f* T ⊆ S} {HB : interior (∀.[f] S) ⊆ T}\n    `{!UnifBornInitial f, !WCUnifSpace X, !WCUnifSpace Y} : WCUnifInitial (𝒪₁ f S T).\n  Proof. now split. Qed.\n\n  Local Instance open_immersion_restrict_wcunif_emb {E:f* T ⊆ S} {HB : interior (∀.[f] S) ⊆ T}\n    `{!UnifBornEmbedding f, !WCUnifSpace X, !WCUnifSpace Y} : WCUnifEmbedding (𝒪₁ f S T).\n  Proof. now split. Qed.\nEnd restrict_wcunif_bundles.\n\n#[global] Hint Extern 2 (WCUnifMorphism (@open_immersion_restrict ?X ?Y ?Φ ?Ψ ?𝒜 ?ℬ ?f ?S ?T ?H)) => simple notypeclasses refine (@open_immersion_restrict_wcunif X Y Φ Ψ 𝒜 ℬ f S T H _ _ _ _ _) : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting (@open_immersion_restrict ?X ?Y -(injective_preimage_image_alt (j S) _ : (j S)* L' = powerset_pt L).\n    change ((j S')* ((j T)* L') ∊ 𝒲 S').\n    change ((j S')⁎ ((j S')* ((j T)* L')) ∊ 𝒲 T ∧ (j S')⁎ ((j S')* ((j T)* L')) ◁ S').\n    split.\n    + change ((j T)⁎ ((j S')⁎ ((j S')* ((j T)* L'))) ∊ 𝒜 ∧ (j T)⁎ ((j S')⁎ ((j S')* ((j T)* L'))) ◁ T).\n      split; rew (image_preimage_counit (j S') _), (image_preimage_counit (j T) _).\n      * exact (subset_pt_is_el L').\n      * rew <-HST. exact HL'.\n    + rew (image_preimage_counit (j S') _).\n      destruct HL' as [U HU]. exists (ufm_preimage (j T) U).\n      rew (preimage_thicken_uc_le (j T) _ _). now rew HU.\n  Qed.\n\n  (** The converse — every set bounded in the nested immersion is bounded in\n      [𝒪 S], i.e. [Bornological φ] — is classical.  At a point [x] apart from\n      [S], the contrapositive component of [W.[K'] ⊆ S] asks for [x] apart\n      from [T] or apart from the thickening, and the two hypotheses speak only\n      about points of [T] (via [S']) or points apart from [T] (via\n      [K' ◁ T]); deciding [x ∊ T] is exactly what is missing.  So affinely\n      the direct bornology is contained in the nested one, and the two agree\n      classically. *)\nEnd open_immersion_transitive.\n#[global] Hint Extern 2 (Inverse (@open_immersion_nest ?X ?Φ ?𝒜 ?S ?T)) => simple notypeclasses refine (@open_immersion_nest_inverse X Φ 𝒜 S T _) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyEmbedding  (@open_immersion_nest ?X ?Φ ?𝒜 ?S ?T)) => simple notypeclasses refine (@open_immersion_nest_ufm_emb X Φ 𝒜 _ S T) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyInitial    (@open_immersion_nest ?X ?Φ ?𝒜 ?S ?T)) => simple notypeclasses refine (@open_immersion_nest_ufm_emb X Φ 𝒜 _ S T) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyContinuous (@open_immersion_nest ?X ?Φ ?𝒜 ?S ?T)) => simple notypeclasses refine (@open_immersion_nest_ufm_emb X Φ 𝒜 _ S T) : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (@o "tacn","local":false,"page":"../../tactics/easy.html"},{"s":26328,"e":26332,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":26402,"e":26405,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":26683,"e":26686,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":27016,"e":27019,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":27131,"e":27134,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":27159,"e":27162,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":27264,"e":27267,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":27304,"e":27307,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":27308,"e":27311,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file builds the open immersion 𝒪 S of an open subset S of a space with a uniformity and a bornology. Its carrier is S, its uniformity is pulled back from X, and its bounded sets are the subsets whose image is bounded in X and uniformly below S, so the bornology remembers the boundary of S. The inclusion into X is a uniform embedding and is bornological and locally uniformly reflecting. It is deliberately not bornology-reflecting. A map f with S ⊆ f* T restricts to 𝒪₁ f : 𝒪 S ⇾ 𝒪 T, and this restriction is functorial. The uniform classes of f pass to the restriction, and so does bornology reflection when S = f* T. Bornologicality passes under the boundary condition that the interior of ∀.[f] S lies in T ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_bornological]]). Well-containment uniform spaces and their morphisms are preserved. For open S ⊆ T, the comparison [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest]] between the nested immersion and 𝒪 S is a bijective uniform embedding that reflects bornology. The converse inclusion of bornologies holds only classically.","short":"Open immersions of open subsets, the restriction of maps, and nesting","items":[{"name":"AffineConstructive.topology.unif_born.open_immersion.id","base":"id","kind":"abbrev","start":21,"body":null,"status":"ok","short":{"text":"Local shorthand for the identity function on a set","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.set.id_fun]] with its set left to be inferred. It appears in the statement that restricting the identity gives the identity, [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_id]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.int","base":"int","kind":"abbrev","start":22,"body":null,"status":"ok","short":{"text":"Local shorthand for the interior of a subset","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.topology.interior]], the subset of points of which a given subset is a neighbourhood. In this file the neighbourhood relation is always the one the uniformity induces.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.cl","base":"cl","kind":"abbrev","start":23,"body":null,"status":"ok","short":{"text":"Local abbreviation for the closure of a subset","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.topology.closure]]: the closure of a subset, the complement of the interior of its complement.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology","base":"open_immersion_bornology","kind":"def","start":24,"body":null,"status":"ok","short":{"text":"The bornology 𝒲 S of subsets of S bounded in X and uniformly below S","status":"ok"},"long":{"text":"For a subset S of a set X that carries a uniformity and a bornology, 𝒲 S is a bornology on the members of S. A subset K of S is bounded when its image in X is bounded and is uniformly below S, that is, some entourage thickens it inside S. The two conditions are joined by the additive and. To prove membership both have to be proved, and to refute it, it is enough to refute one of them.\n\nThe bounded sets of 𝒲 S are therefore the ambient-bounded sets that keep a uniform margin from the boundary of S, so the open immersion built on it remembers where the boundary is. As a result the inclusion into X is bornological but not bornology-reflecting: a set that is bounded in X and lies in S need not stay a uniform distance away from the edge of S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.𝒲","base":"𝒲","kind":"abbrev","start":25,"body":null,"status":"ok","short":{"text":"Notation 𝒲 S for the well-containment bornology on a subset S","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology]]: 𝒲 S consists of the subsets of S whose image in X is bounded and uniformly below S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion","base":"open_immersion","kind":"def","start":26,"body":null,"status":"ok","short":{"text":"The open immersion 𝒪 S: the subset S with the pullback uniformity and the bornology 𝒲 S","status":"ok"},"long":{"text":"By definition 𝒪 S is the subset S, taken as a set. It gets its own name so that instance resolution, keyed on that name, gives it the uniformity pulled back along the inclusion into X ([[AffineConstructive.topology.uniform.subspace.pullback_uniformity]]) and the bornology [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology]]. These replace the structures the plain subset would otherwise carry, in particular the subspace bornology. The name is kept opaque to resolution, so the plain subset's structures are never found in its place.\n\nOn an open S this is a uniform space with bornology. When X is a well-containment uniform space, so is 𝒪 S. The construction acts on maps by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.𝒪","base":"𝒪","kind":"abbrev","start":28,"body":null,"status":"ok","short":{"text":"Notation 𝒪 S for the open immersion of S","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion.open_immersion]]: the subset S with the pullback uniformity and the well-containment bornology.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.from_open_immersion","base":"from_open_immersion","kind":"def","start":31,"body":null,"status":"ok","short":{"text":"The inclusion j S : 𝒪 S ⇾ X of the open immersion into the ambient space","status":"ok"},"long":{"text":"The inclusion [[AffineConstructive.interfaces.subset.from_subset]] of S into X, restated with domain 𝒪 S so that instance resolution finds the facts about it proved here. It is a uniform embedding. On an open S it is bornological and a local morphism. It is not bornology-reflecting: the preimage of a bounded set of X is bounded in 𝒪 S only when it is uniformly below S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.j","base":"j","kind":"abbrev","start":32,"body":null,"status":"ok","short":{"text":"Notation j S for the inclusion of 𝒪 S into X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion.from_open_immersion]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_unif_emb","base":"open_immersion_incl_unif_emb","kind":"inst","start":33,"body":[34,36],"status":"ok","short":{"text":"The inclusion j S is a uniform embedding","status":"ok"},"proof":[{"text":"Unfolded, j S is the inclusion of the subset S carrying the uniformity pulled back from X. The inclusion of a subset with its subspace uniformity is a uniform embedding by [[AffineConstructive.topology.uniform.subspace.from_subset_emb]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.unfold_B","base":"unfold_B","kind":"ltac","start":50,"body":null,"status":"ok","short":{"text":"Restates membership in 𝒲 S as bounded image and uniformly below S","status":"ok"},"long":{"text":"A local tactic. In the goal it replaces every membership K ∊ 𝒲 S by its definition: the image of K in X is bounded, and (additively) that image is uniformly below S. The replacement is by conversion, so it leaves no side goal. The proofs about [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology]] use it to expose the two conditions before splitting the conjunction or rewriting the image. Without it, the membership stays folded and the image lemmas cannot be applied to it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology_ideal","base":"open_immersion_bornology_ideal","kind":"inst","start":51,"body":[52,92],"status":"ok","short":{"text":"The well-contained subsets 𝒲 S form an ideal of subsets of S","status":"ok"},"proof":[{"text":"An ideal is a down-set that is up-directed, so the proof shows each of these in turn.","status":"ok","from":0,"to":1},{"text":"Downward closure first. Fix K ⊆ K' in 𝒫 S with K' in 𝒲 S. Membership in 𝒲 S means that the image of a set in X is bounded and uniformly below S. Taking images preserves inclusion, so ι⁎ K ⊆ ι⁎ K', and this inclusion is paired with the two conditions on ι⁎ K'.","status":"ok","from":2,"to":7},{"text":"The two conditions on ι⁎ K are proved separately. Either proof may choose the one condition on ι⁎ K' that it needs from the additive conjunction. For boundedness, keep the boundedness of ι⁎ K'. The bornology is downward closed, so ι⁎ K is bounded.","status":"ok","from":8,"to":12},{"text":"For the second condition, keep that ι⁎ K' is uniformly below S. Shrinking the left side preserves this relation ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_le_l]]), so ι⁎ K is uniformly below S too.","status":"ok","from":13,"to":15},{"text":"Up-directedness asks for some member of 𝒲 S, and for an upper bound in 𝒲 S of any two members. For the first, take the empty subset as the witness. Its image is empty, so it remains to show that ∅ is bounded in X and uniformly below S.","status":"ok","from":16,"to":21},{"text":"The bounded sets contain ∅, and ∅ is uniformly below every subset by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_empty]].","status":"ok","from":22,"to":26},{"text":"Now fix K and K' in 𝒲 S, and take K ⊔ K' as the upper bound. Both K and K' lie below K ⊔ K', so only the membership of K ⊔ K' in 𝒲 S remains. Images preserve joins, so the image of K ⊔ K' is ι⁎ K ⊔ ι⁎ K'.","status":"ok","from":27,"to":32},{"text":"The two conditions on the join are proved separately. Each uses one factor of the tensor for K and the other for K', and from each factor it takes the same conjunct. For boundedness, the bounded sets are closed under binary joins.","status":"ok","from":33,"to":36},{"text":"For the second condition, ι⁎ K ◁ S and ι⁎ K' ◁ S give ι⁎ K ⊔ ι⁎ K' ◁ S by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_join]].","status":"ok","from":37,"to":40}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_locally_ur","base":"open_immersion_incl_locally_ur","kind":"inst","start":93,"body":[94,97],"status":"ok","short":{"text":"The inclusion j S is locally uniformly reflecting","status":"ok"},"proof":[{"text":"Unfolded, j S is the subset inclusion ι. Being a uniform embedding, ι is uniformly reflecting, and a uniformly reflecting map into a bornological space is locally uniformly reflecting by [[AffineConstructive.topology.unif_born.local_maps.ur_locally_ur]].","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_born_space","base":"open_immersion_born_space","kind":"inst","start":99,"body":[100,111],"status":"ok","short":{"text":"For S open, 𝒪 S with the bornology 𝒲 S is a bornological space","status":"ok"},"proof":[{"text":"A bornological space needs an ideal of bounded sets that contains every singleton. The ideal property is [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology_ideal]], so it remains to show that each singleton lies in 𝒲 S.","status":"ok","from":0,"to":1},{"text":"Fix a point x of 𝒪 S. Since S is open it equals its interior, so ι x lies in the interior of S.","status":"ok","from":2,"to":4},{"text":"The image of {x} is the singleton {ι x} ([[AffineConstructive.orders.subset_images.image_singleton_alt]]), and both conjuncts are proved for it. The singleton {ι x} is bounded in X. Because ι x lies in the interior of S, the singleton {ι x} is uniformly below S, by [[AffineConstructive.topology.uniform.uniformly_below.singleton_unif_below]].","status":"ok","from":5,"to":11}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_unif_born","base":"open_immersion_unif_born","kind":"inst","start":112,"body":[113,115],"status":"ok","short":{"text":"For S open, 𝒪 S is a uniform space with bornology","status":"ok"},"proof":[{"text":"Both components are already available. The pulled-back uniformity makes 𝒪 S a uniform space ([[AffineConstructive.topology.uniform.subspace.pullback_uniform_space]]), and 𝒲 S makes it a bornological space ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_born_space]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_bornological","base":"open_immersion_incl_bornological","kind":"inst","start":116,"body":[117,121],"status":"ok","short":{"text":"For S open, the inclusion j S is bornological","status":"ok"},"proof":[{"text":"The structural parts of a bornological map are found from the instances already built. What remains is that j S sends each bounded set of 𝒪 S to a bounded set of X.","status":"ok","from":0,"to":1},{"text":"Fix A in 𝒲 S. Membership in 𝒲 S is the additive conjunction of two facts, and its first conjunct says that the image of A is bounded in X.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_unif_born","base":"open_immersion_incl_unif_born","kind":"inst","start":122,"body":[123,125],"status":"ok","short":{"text":"For S open, j S is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"Both parts are already proved. The inclusion is uniformly continuous because it is a uniform embedding ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_unif_emb]]), and it is bornological by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_locally_ub","base":"open_immersion_incl_locally_ub","kind":"inst","start":126,"body":[127,131],"status":"ok","short":{"text":"For S open, j S is locally uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The bornological part is [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_bornological]]. What remains is local uniform continuity.","status":"ok","from":0,"to":1},{"text":"The map j S is the inclusion ι, which is uniformly continuous, and its domain 𝒪 S is a bornological space. A uniformly continuous map out of a bornological space is locally uniformly continuous, by [[AffineConstructive.topology.unif_born.local_maps.uc_locally_uc]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_wcunif","base":"open_immersion_wcunif","kind":"inst","start":146,"body":[147,163],"status":"ok","short":{"text":"For S open in a well-containment uniform space X, 𝒪 S is one too","status":"ok"},"proof":[{"text":"The uniform and bornological structure of 𝒪 S is [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_unif_born]]. What remains is that the bornology is uniformly open: every bounded set has a thickening by some entourage that is still bounded.","status":"ok","from":0,"to":1},{"text":"Fix A in 𝒲 S. Its membership gives two facts: ι⁎ A is bounded in X, and ι⁎ A is uniformly below S. Regarded as a bounded set A' of X, this says that A' is well-contained in S.","status":"ok","from":2,"to":5},{"text":"By interpolation ([[AffineConstructive.topology.unif_born.well_contained.wc_interpolate]]), there is a bounded L with A' ⋐ L and L ⋐ S. The first of these provides an entourage U of X with U[A'] ⊆ L.","status":"ok","from":6,"to":7},{"text":"The witness is the preimage of U under ι × ι. It is an entourage of the pulled-back uniformity because it contains the preimage of U itself.","status":"ok","from":8,"to":12},{"text":"The image under ι of the thickening of A by this entourage lies in U[ι⁎ A] ([[AffineConstructive.topology.uniform.base.image_thicken_uc_le]]), and hence in L. Since L ⋐ S, L is bounded and uniformly below S. Both conjuncts of membership in 𝒲 S follow because each property passes to subsets.","status":"ok","from":13,"to":16}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_wcunif_mor","base":"open_immersion_incl_wcunif_mor","kind":"prf","start":164,"body":[165,167],"status":"ok","short":{"text":"For S open in a well-containment uniform space, j S is a morphism of such spaces","status":"ok"},"proof":[{"text":"A morphism of well-containment uniform spaces is a locally uniformly continuous, bornological map between such spaces. The domain 𝒪 S is a well-containment uniform space by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_wcunif]], and the map j S has the required properties by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_locally_ub]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict","base":"open_immersion_restrict","kind":"def","start":171,"body":null,"status":"ok","short":{"text":"The restriction 𝒪 S ⇾ 𝒪 T of f : X ⇾ Y, when S lies in f* T","status":"ok"},"long":{"text":"The action of the open immersion on maps. Given f : X ⇾ Y and subsets S of X and T of Y with S ⊆ f* T, this is the restriction of f ([[AffineConstructive.interfaces.subset.restrict]]), taken as a map between the open immersions. By construction j T ∘ 𝒪₁ f S T = f ∘ j S, and it respects identities and composites.\n\nWhich classes of f pass to the restriction depends on how S and T sit relative to each other. The uniform classes pass unconditionally. Bornology reflection needs f* T ⊆ S. Bornologicity needs the boundary condition: the interior of the universal image of S along f lies in T, which is to say the complement of the closure of f⁎(Sᗮ) lies in T.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.𝒪₁","base":"𝒪₁","kind":"abbrev","start":172,"body":null,"status":"ok","short":{"text":"Notation 𝒪₁ f S T for the restriction of f between open immersions","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict]], the action of the open immersion construction on maps.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_natural","base":"open_immersion_natural","kind":"prf","start":173,"body":[174,176],"status":"ok","short":{"text":"Naturality of the inclusions: j T ∘ 𝒪₁ f S T = f ∘ j S","status":"ok"},"proof":[{"text":"The restriction sends a point of S to its image under f, seen as a point of T. Both sides therefore send a point x of S to f x, and the square commutes by definition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_compose","base":"open_immersion_compose","kind":"prf","start":177,"body":[178,180],"status":"ok","short":{"text":"The restriction of a composite g ∘ f is the composite of the restrictions","status":"ok"},"proof":[{"text":"Both sides send a point x of S to g (f x), seen as a point of V. The two maps agree by definition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_id","base":"open_immersion_id","kind":"prf","start":182,"body":[183,185],"status":"ok","short":{"text":"The restriction of the identity from S to S is the identity","status":"ok"},"proof":[{"text":"The restriction of the identity sends each point of S to itself, so it is the identity by definition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_cont","base":"open_immersion_restrict_ufm_cont","kind":"inst","start":190,"body":[191,194],"status":"ok","short":{"text":"For f uniformly continuous, the restriction 𝒪₁ f S T is uniformly continuous","status":"ok"},"proof":[{"text":"The uniformity of 𝒪 T is pulled back from Y along the inclusion. By [[AffineConstructive.topology.uniform.subspace.pullback_uniformity_initial]], it therefore suffices to show that the composite of the restriction with the inclusion of T is uniformly continuous.","status":"ok","from":0,"to":1},{"text":"By naturality, that composite is f ∘ j S. It is uniformly continuous because f is, and because j S is a uniform embedding ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_unif_emb]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_refl","base":"open_immersion_restrict_ufm_refl","kind":"inst","start":195,"body":[196,199],"status":"ok","short":{"text":"For f uniformly reflecting, the restriction 𝒪₁ f S T is uniformly reflecting","status":"ok"},"proof":[{"text":"The inclusion j T is uniformly continuous. By [[AffineConstructive.topology.uniform.base.ufm_refl_factor]], it therefore suffices to show that j T composed with the restriction is uniformly reflecting.","status":"ok","from":0,"to":1},{"text":"By naturality, that composite is f ∘ j S. Both f and the uniform embedding j S are uniformly reflecting ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_unif_emb]]), so the composite is too ([[AffineConstructive.topology.uniform.base.compose_ufm_reflecting]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_initial","base":"open_immersion_restrict_ufm_initial","kind":"inst","start":200,"body":[201,203],"status":"ok","short":{"text":"For f uniformly initial, the restriction 𝒪₁ f S T is uniformly initial","status":"ok"},"proof":[{"text":"Being uniformly initial means being uniformly continuous and uniformly reflecting. The restriction is both, by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_cont]] and [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_refl]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_emb","base":"open_immersion_restrict_ufm_emb","kind":"inst","start":204,"body":[205,209],"status":"ok","short":{"text":"For f a uniform embedding, the restriction 𝒪₁ f S T is a uniform embedding","status":"ok"},"proof":[{"text":"A uniform embedding is a uniformly initial injective map. The restriction is uniformly initial by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_initial]], so injectivity remains to be shown.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.theory.set.injective_factor]], it suffices that j T composed with the restriction is injective. By naturality, that composite is f ∘ j S, a composite of two injective maps.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_local_uc","base":"open_immersion_restrict_local_uc","kind":"inst","start":221,"body":[222,226],"status":"ok","short":{"text":"For S open and f locally uniformly continuous, the restriction is locally uniformly continuous","status":"ok"},"proof":[{"text":"The inclusion j T is uniformly reflecting, being a uniform embedding. By [[AffineConstructive.topology.unif_born.local_maps.local_uc_factor]], it therefore suffices to show that j T composed with the restriction is locally uniformly continuous. By naturality, that composite is f ∘ j S.","status":"ok","from":0,"to":2},{"text":"Since S is open, j S is locally uniformly continuous and bornological ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_locally_ub]]). Its composite with the locally uniformly continuous f is then locally uniformly continuous by [[AffineConstructive.topology.unif_born.local_maps.local_uc_compose]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_local_ur","base":"open_immersion_restrict_local_ur","kind":"inst","start":227,"body":[228,232],"status":"ok","short":{"text":"For T open and f locally uniformly reflecting, the restriction is locally uniformly reflecting","status":"ok"},"proof":[{"text":"Since T is open, the inclusion j T is uniformly continuous and bornological ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_bornological]]). By [[AffineConstructive.topology.unif_born.local_maps.local_ur_factor]], it therefore suffices to show that j T composed with the restriction is locally uniformly reflecting. By naturality, that composite is f ∘ j S.","status":"ok","from":0,"to":2},{"text":"The uniform embedding j S is uniformly reflecting, and f is locally uniformly reflecting. Their composite is therefore locally uniformly reflecting by [[AffineConstructive.topology.unif_born.local_maps.local_ur_compose_ur]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_uc","base":"open_immersion_restrict_locally_uc","kind":"inst","start":233,"body":[234,236],"status":"ok","short":{"text":"For S open, a locally uniformly continuous f restricts to a locally uniformly continuous map","status":"ok"},"proof":[{"text":"Here 𝒪 S is a uniform space with bornology because S is open ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_unif_born]]). The restriction is locally uniformly continuous by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_local_uc]], which together give the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_ur","base":"open_immersion_restrict_locally_ur","kind":"inst","start":237,"body":[238,240],"status":"ok","short":{"text":"For T open, a locally uniformly reflecting f restricts to a locally uniformly reflecting map","status":"ok"},"proof":[{"text":"The class asks for three things. Its source and target must be spaces with a uniformity and a bornology, which both open immersions are by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_unif_born]]: the uniformity of each is pulled back from the ambient space and makes it a uniform space ([[AffineConstructive.topology.uniform.subspace.pullback_uniform_space]]), and the bornology is [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology]]. The restriction must also be locally uniformly reflecting. Since T is open and f is locally uniformly reflecting, [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_local_ur]] gives this.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_dense","base":"open_immersion_restrict_dense","kind":"prf","start":251,"body":[252,254],"status":"ok","short":{"text":"If f is dense, T open and S equal to f* T, the restriction 𝒪₁ f S T is dense","status":"ok"},"proof":[{"text":"This is the density of the restriction of a dense map to an open T and its full preimage S = f* T, proved for uniform subspaces in [[AffineConstructive.topology.uniform.subspace.dense_open_restrict]]. The bornologies play no part.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.restrict_born_refl.let:HS_from_E","base":"let:HS_from_E","kind":"let","start":262,"body":[263,268],"status":"ok","short":{"text":"When f is continuous and T open, S is open: the two inclusions make S equal to f* T, and preimages of open sets are open","status":"ok"},"proof":[{"text":"Assume that f is continuous and that T is open. The goal is that S is open.","status":"ok","from":0,"to":1},{"text":"The inclusions S ⊆ f* T and f* T ⊆ S make S equal to f* T by antisymmetry of inclusion. Rewriting by this equality reduces the goal to showing that f* T is open.","status":"ok","from":2,"to":3},{"text":"Since f is continuous and T is open, the preimage f* T is open by [[AffineConstructive.topology.topology.maps.continuity_alt]].","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_born_refl","base":"open_immersion_restrict_born_refl","kind":"prf","start":270,"body":[271,286],"status":"ok","short":{"text":"If f* T ⊆ S, T is open and f is uniformly continuous and bornology-reflecting, so is the restriction","status":"ok"},"proof":[{"text":"Split the class into its fields. The bornological-space structures on 𝒪 S and 𝒪 T are already known. What remains is that the preimage of every bounded subset of 𝒪 T is bounded in 𝒪 S.","status":"ok","from":0,"to":1},{"text":"Fix a bounded subset L of 𝒪 T. Let L' be its image in Y. By the definition of the bornology of 𝒪 T, L' is bounded in Y and uniformly inside T.","status":"ok","from":2,"to":4},{"text":"The inclusion of T is injective, so L is the preimage of L' under it ([[AffineConstructive.orders.subset_images.injective_preimage_image_alt]]). The restriction followed by the inclusion of T is f after the inclusion of S. So the preimage of L is the preimage of f* L' under the inclusion of S, and that set must be shown bounded in 𝒪 S.","status":"ok","from":5,"to":6},{"text":"Membership in the bornology of 𝒪 S asks that the image in X be bounded and uniformly below S. That image lies inside f* L' ([[AffineConstructive.orders.subset_images.image_preimage_counit]]). Both properties pass to subsets, so it suffices to show that f* L' is bounded in X and uniformly below S.","status":"ok","from":7,"to":7},{"text":"The set f* L' is bounded because f reflects boundedness and L' is bounded.","status":"ok","from":8,"to":9},{"text":"Since L' is uniformly inside T, some entourage U of Y has U[L'] ⊆ T. Take the pullback of U along f as the entourage for f* L'.","status":"ok","from":10,"to":12},{"text":"Since f is uniformly continuous, the pulled-back thickening of f* L' lies in f*(U[L']) ([[AffineConstructive.topology.uniform.base.preimage_thicken_uc_le]]). By U[L'] ⊆ T, that set is contained in f* T, and f* T ⊆ S by hypothesis.","status":"ok","from":13,"to":15}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.ι","base":"ι","kind":"abbrev","start":295,"body":null,"status":"ok","short":{"text":"Local shorthand for the inclusion of the members of S into X","status":"ok"},"long":{"text":"Inside the sections, ι stands for [[AffineConstructive.interfaces.subset.from_subset]] at the subset S fixed by the section. It is used where the proof works with the plain subset inclusion rather than [[AffineConstructive.topology.unif_born.open_immersion.from_open_immersion]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_bornological","base":"open_immersion_restrict_bornological","kind":"prf","start":296,"body":[297,320],"status":"ok","short":{"text":"Under the boundary condition, a bornological, uniformly reflecting f restricts to a bornological map","status":"ok"},"proof":[{"text":"Split the class into its fields. The bornological-space structures on 𝒪 S and 𝒪 T are already known. What remains is that the image of every bounded subset of 𝒪 S is bounded in 𝒪 T.","status":"ok","from":0,"to":1},{"text":"Fix a bounded subset K of 𝒪 S, and let K' be its image in X. By the definition of the bornology of 𝒪 S, K' is bounded in X and uniformly below S.","status":"ok","from":2,"to":4},{"text":"The goal asks that the image of K in Y be bounded and uniformly below T. The restriction followed by the inclusion of T is f after the inclusion of S. Images compose ([[AffineConstructive.orders.subset_images.image_compose_alt]]), so that image is f⁎ K'.","status":"ok","from":5,"to":9},{"text":"The set f⁎ K' is bounded in Y because f is bornological and K' is bounded.","status":"ok","from":10,"to":12},{"text":"For the margin, K' ◁ S gives an entourage U of X with U[K'] ⊆ S. That is, a U-margin keeps K' apart from the complement of S. Since f is uniformly reflecting, the margin transports to Y ([[AffineConstructive.topology.uniform.base.image_reflect_apart]]): some entourage W keeps f⁎ K' apart from f⁎(Sᗮ).","status":"ok","from":13,"to":17},{"text":"Split this margin between the two sides ([[AffineConstructive.topology.uniform.base.thicken_apart_split]]). This gives an entourage V whose thickenings of f⁎ K' and of f⁎(Sᗮ) are disjoint.","status":"ok","from":18,"to":19},{"text":"Take V as the entourage for f⁎ K'. Its V-thickening lies in the complement of the V-thickening of f⁎(Sᗮ). It remains to show that this complement is contained in T.","status":"ok","from":20,"to":21},{"text":"The closure of f⁎(Sᗮ) lies inside its V-thickening ([[AffineConstructive.topology.uniform.base.closure_sub_thicken]]). So the complement of the thickening lies inside the complement of that closure. That complement is the interior of the universal image of S under f, and the boundary condition puts it inside T.","status":"ok","from":22,"to":23}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.restrict_bundles.let:HS_from_E","base":"let:HS_from_E","kind":"let","start":328,"body":[329,334],"status":"ok","short":{"text":"When f is continuous and f* T ⊆ S, S is open: with S ⊆ f* T it equals f* T, the preimage of the open set T","status":"ok"},"proof":[{"text":"Assume that f is continuous and that f* T ⊆ S. The goal is that S is open.","status":"ok","from":0,"to":1},{"text":"Together with the section's inclusion S ⊆ f* T, the assumed inclusion makes S equal to f* T by antisymmetry of inclusion. Rewriting by this equality reduces the goal to showing that f* T is open.","status":"ok","from":2,"to":3},{"text":"T is open and f is continuous, so the preimage f* T is open by [[AffineConstructive.topology.topology.maps.continuity_alt]].","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_unif_born","base":"open_immersion_restrict_unif_born","kind":"inst","start":336,"body":[337,339],"status":"ok","short":{"text":"Under the boundary condition, a uniformly reflecting morphism f restricts to a morphism 𝒪 S ⇾ 𝒪 T","status":"ok"},"proof":[{"text":"A morphism of uniform spaces with bornologies is a map that is uniformly continuous and bornological. The restriction is uniformly continuous by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_cont]]. Under the boundary condition it is bornological by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_bornological]], which uses that f is uniformly reflecting.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_unif_born_refl","base":"open_immersion_restrict_unif_born_refl","kind":"inst","start":340,"body":[341,343],"status":"ok","short":{"text":"If f* T ⊆ S and f is uniformly continuous, a reflecting f restricts to a reflecting map","status":"ok"},"proof":[{"text":"The two fields are uniform reflection and bornology reflection. The restriction reflects the uniformity by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_refl]]. Since f* T ⊆ S and f is uniformly continuous, it reflects boundedness by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_born_refl]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_unif_born_initial","base":"open_immersion_restrict_unif_born_initial","kind":"inst","start":344,"body":[345,347],"status":"ok","short":{"text":"With S equal to f* T and the boundary condition, an initial f restricts to an initial map","status":"ok"},"proof":[{"text":"An initial map is at once a morphism and a reflecting map. An initial f is uniformly continuous and uniformly reflecting. So [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_unif_born]] gives the forward half under the boundary condition, and [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_unif_born_refl]] gives the reflecting half from f* T ⊆ S.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_unif_born_emb","base":"open_immersion_restrict_unif_born_emb","kind":"inst","start":348,"body":[349,351],"status":"ok","short":{"text":"The restriction of an embedding f is an embedding when S = f* T and the boundary condition holds","status":"ok"},"proof":[{"text":"An embedding is an initial map that is injective. The restriction is initial by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_unif_born_initial]]. Since f is in particular a uniform embedding, [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_emb]] shows that the restriction is a uniform embedding, which supplies injectivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_unif_born","base":"open_immersion_restrict_locally_unif_born","kind":"inst","start":352,"body":[353,355],"status":"ok","short":{"text":"The restriction of a locally uniformly continuous, bornological, uniformly reflecting map is locally uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The two fields are local uniform continuity and boundedness of images. The restriction is locally uniformly continuous by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_uc]]. Under the boundary condition it is bornological by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_bornological]], since f is uniformly reflecting.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_unif_born_refl","base":"open_immersion_restrict_locally_unif_born_refl","kind":"inst","start":356,"body":[357,359],"status":"ok","short":{"text":"The restriction of a locally reflecting, bornology-reflecting, uniformly continuous map with S = f* T is again such","status":"ok"},"proof":[{"text":"The two fields are local uniform reflection and bornology reflection. The restriction is locally uniformly reflecting by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_ur]]. Since f* T ⊆ S and f is uniformly continuous, it reflects boundedness by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_born_refl]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.restrict_wcunif_bundles.let:HS_from_E","base":"let:HS_from_E","kind":"let","start":373,"body":[374,379],"status":"ok","short":{"text":"When f is continuous and f* T ⊆ S, S is open: with S ⊆ f* T it equals f* T, the preimage of the open set T","status":"ok"},"proof":[{"text":"Assume that f is continuous and that f* T ⊆ S. The goal is that S is open.","status":"ok","from":0,"to":1},{"text":"Together with the section's inclusion S ⊆ f* T, the assumed inclusion makes S equal to f* T by antisymmetry of inclusion. Rewriting by this equality reduces the goal to showing that f* T is open.","status":"ok","from":2,"to":3},{"text":"T is open and f is continuous, so the preimage f* T is open by [[AffineConstructive.topology.topology.maps.continuity_alt]].","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_wcunif","base":"open_immersion_restrict_wcunif","kind":"inst","start":381,"body":[382,384],"status":"ok","short":{"text":"The restriction of a uniformly reflecting morphism of well-containment uniform spaces is such a morphism, under the boundary condition","status":"ok"},"proof":[{"text":"A morphism of well-containment uniform spaces is a locally uniformly continuous, bornological map between two such spaces. Under the boundary condition and with f uniformly reflecting, the restriction is locally uniformly continuous and bornological by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_unif_born]]. Both immersions 𝒪 S and 𝒪 T are well-containment uniform spaces by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_wcunif]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_wcunif_refl","base":"open_immersion_restrict_wcunif_refl","kind":"inst","start":385,"body":[386,388],"status":"ok","short":{"text":"The restriction of a uniformly continuous reflecting map of well-containment uniform spaces with S = f* T reflects","status":"ok"},"proof":[{"text":"With S = f* T, the restriction of a uniformly continuous, locally reflecting and bornology-reflecting map is again such a map by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_unif_born_refl]]. Source and target are well-containment uniform spaces by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_wcunif]], and these are the components of a reflecting morphism.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_wcunif_initial","base":"open_immersion_restrict_wcunif_initial","kind":"inst","start":389,"body":[390,392],"status":"ok","short":{"text":"Between well-containment uniform spaces, the restriction of an initial map is initial when S = f* T and the boundary condition holds","status":"ok"},"proof":[{"text":"An initial map of well-containment uniform spaces is at once a morphism and a reflecting map between such spaces, and both immersions are well-containment uniform spaces by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_wcunif]], since S and T are open. The forward half is [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_unif_born]]: f is initial, so it is uniformly continuous, bornological and uniformly reflecting, and the boundary condition holds. The reflecting half is [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_locally_unif_born_refl]], which applies since S = f* T. Its hypothesis that f is locally reflecting comes from [[AffineConstructive.topology.unif_born.local_maps.unif_born_refl_local]], because f reflects both the uniformity and the bornology.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_wcunif_emb","base":"open_immersion_restrict_wcunif_emb","kind":"inst","start":393,"body":[394,396],"status":"ok","short":{"text":"Between well-containment uniform spaces, the restriction of an embedding is an embedding when S = f* T and the boundary condition holds","status":"ok"},"proof":[{"text":"An embedding is an initial map that is also a uniform embedding. The restriction is initial by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_wcunif_initial]]. Since f is a uniform embedding, the restriction is one too by [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_emb]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.S'","base":"S'","kind":"abbrev","start":405,"body":null,"status":"ok","short":{"text":"S seen as a subset of 𝒪 T: its preimage under the inclusion of T","status":"ok"},"long":{"text":"A local abbreviation in the transitivity section. S and T are open subsets of X with S ⊆ T, and S' is the preimage of S under the inclusion [[AffineConstructive.topology.unif_born.open_immersion.from_open_immersion]] of 𝒪 T into X. It is S regarded as a subset of the immersion of T, and 𝒪 S' is the open immersion of S taken inside 𝒪 T rather than directly in X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest","base":"open_immersion_nest","kind":"def","start":406,"body":null,"status":"ok","short":{"text":"The comparison map from the immersion of S inside 𝒪 T to the immersion of S in X","status":"ok"},"long":{"text":"For subsets S ⊆ T of X, there are two ways to carve S out of X. The first is the open immersion 𝒪 S taken directly in X. The second takes the immersion 𝒪 T, then inside it the immersion of the preimage S' of S. The comparison map from the second to the first is the restriction ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict]]) of the inclusion of 𝒪 T into X. It sends a point to the same point of X.\n\nBoth sides have the points of S and carry the uniformity of X. The difference lies in the bornologies. Directly, a set is bounded when it is bounded in X and uniformly inside S. Through T, it must be bounded in X and uniformly inside T, and its trace in 𝒪 T must be uniformly inside S'. The file shows that the comparison is a bijective uniform embedding ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_bij]], [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_ufm_emb]]) and that it reflects boundedness ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_born_refl]]). Every set bounded directly is therefore bounded through T.\n\nThe converse holds only classically. Take a point apart from S. To show that a thickening of a nested-bounded set stays inside S, one must show that this point is apart either from T or from the thickening. The hypotheses speak only about points of T and about points apart from T, and deciding membership in T is exactly what is missing.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.φ","base":"φ","kind":"abbrev","start":407,"body":null,"status":"ok","short":{"text":"Local name for the comparison map [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest]]","status":"ok"},"long":{"text":"A local abbreviation in the transitivity section for [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest]]: the map from the immersion of S taken inside 𝒪 T to the immersion of S taken directly in X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_ufm_emb","base":"open_immersion_nest_ufm_emb","kind":"inst","start":408,"body":[409,412],"status":"ok","short":{"text":"The comparison map [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest]] is a uniform embedding","status":"ok"},"proof":[{"text":"By definition the comparison map is the restriction of the inclusion j T of 𝒪 T into X, taken from S' to S.","status":"ok","from":0,"to":1},{"text":"The inclusion j T is a uniform embedding ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_incl_unif_emb]]), and the restriction of a uniform embedding is a uniform embedding ([[AffineConstructive.topology.unif_born.open_immersion.open_immersion_restrict_ufm_emb]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_maps_into","base":"open_immersion_nest_maps_into","kind":"inst","start":413,"body":null,"status":"ok","short":{"text":"Given S ⊆ T, the inclusion of 𝒪 S into X takes its values in T","status":"ok"},"long":{"text":"Given the inclusion S ⊆ T, this instance records that the inclusion [[AffineConstructive.topology.unif_born.open_immersion.from_open_immersion]] of 𝒪 S into X takes all its values in T. It is a [[AffineConstructive.interfaces.subset.MapsInto]] instance: each point of S lies in T because S ⊆ T.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_inverse","base":"open_immersion_nest_inverse","kind":"inst","start":414,"body":null,"status":"ok","short":{"text":"The inverse of the comparison map: a point of S taken first into T and then into S'","status":"ok"},"long":{"text":"The designated inverse of [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest]]. It is built by corestricting the inclusion of 𝒪 S into X twice: first into T, using [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_maps_into]], and then into S', because a point of S, seen in T, lies in the preimage of S. Each point keeps its underlying point of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_bij","base":"open_immersion_nest_bij","kind":"inst","start":415,"body":[416,418],"status":"ok","short":{"text":"The comparison map [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest]] is a bijection","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.set.alt_Build_Bijective]] it suffices to show that the map [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_inverse]] is a two-sided inverse. On points both composites are the identity, since each map sends a point to the same underlying point of X, so both equations hold by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_open","base":"open_immersion_nest_open","kind":"inst","start":419,"body":[420,422],"status":"ok","short":{"text":"S' is open in 𝒪 T: it is the preimage of the open set S under the continuous inclusion","status":"ok"},"proof":[{"text":"S' is the preimage of S under the inclusion j T. That inclusion is a uniform embedding, hence uniformly continuous and so continuous. The preimage of the open set S under a continuous map is open by [[AffineConstructive.topology.topology.maps.continuity_alt]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_born_refl","base":"open_immersion_nest_born_refl","kind":"prf","start":423,"body":[424,447],"status":"ok","short":{"text":"For open S ⊆ T, every set bounded in 𝒪 S is bounded in the immersion of S taken inside 𝒪 T","status":"ok"},"proof":[{"text":"The structural requirements on source and target, namely that both immersions are spaces with bornologies, are found automatically. What remains is that the preimage under φ of every bounded set of 𝒪 S is bounded in the immersion of S' in 𝒪 T.","status":"ok","from":0,"to":1},{"text":"Let L be bounded in 𝒪 S. By the definition of [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology]], its image L' in X under j S is bounded in X, and that image is uniformly below S.","status":"ok","from":2,"to":4},{"text":"The inclusion j S is injective, so L is the preimage of its image L' ([[AffineConstructive.orders.subset_images.injective_preimage_image_alt]]). The goal becomes the boundedness of the preimage of (j S)* L' under φ.","status":"ok","from":5,"to":5},{"text":"Since φ followed by j S is j S' followed by j T, this preimage is the preimage of L' under j T and then under j S'. Being bounded in the immersion of S' means two things: the image of this set under j S' is bounded in 𝒪 T, and it is uniformly below S'. The two are shown in turn.","status":"ok","from":6,"to":8},{"text":"Boundedness in 𝒪 T in turn means that the image in X is bounded and uniformly below T. Each image of a preimage is contained in the original set ([[AffineConstructive.orders.subset_images.image_preimage_counit]]), and both properties pass to smaller sets, so both reduce to statements about L' itself.","status":"ok","from":9,"to":11},{"text":"L' is bounded in X by its construction.","status":"ok","from":12,"to":13},{"text":"L' is uniformly below S, and S ⊆ T, so L' is uniformly below T.","status":"ok","from":14,"to":16},{"text":"For the second requirement the counit [[AffineConstructive.orders.subset_images.image_preimage_counit]] again removes the image of a preimage. It remains to show that the preimage of L' under j T is uniformly below S'.","status":"ok","from":17,"to":18},{"text":"That L' is uniformly below S gives an entourage U of X whose thickening of L' lies in S. Take as witness the entourage of 𝒪 T pulled back from U along j T.","status":"ok","from":19,"to":20},{"text":"Since j T is uniformly continuous, th

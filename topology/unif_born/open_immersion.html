onstructive.topology.unif_born.open_immersion.open_immersion_nest_maps_into]], and then into S', because a point of S, seen in T, lies in the preimage of S. Each point keeps its underlying point of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_bij","base":"open_immersion_nest_bij","kind":"inst","start":415,"body":[416,418],"status":"ok","short":{"text":"The comparison map [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest]] is a bijection","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.set.alt_Build_Bijective]] it suffices to show that the map [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_inverse]] is a two-sided inverse. On points both composites are the identity, since each map sends a point to the same underlying point of X, so both equations hold by reflexivity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_open","base":"open_immersion_nest_open","kind":"inst","start":419,"body":[420,422],"status":"ok","short":{"text":"S' is open in 𝒪 T: it is the preimage of the open set S under the continuous inclusion","status":"ok"},"proof":[{"text":"S' is the preimage of S under the inclusion j T. That inclusion is a uniform embedding, hence uniformly continuous and so continuous. The preimage of the open set S under a continuous map is open by [[AffineConstructive.topology.topology.maps.continuity_alt]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.open_immersion.open_immersion_nest_born_refl","base":"open_immersion_nest_born_refl","kind":"prf","start":423,"body":[424,447],"status":"ok","short":{"text":"For open S ⊆ T, every set bounded in 𝒪 S is bounded in the immersion of S taken inside 𝒪 T","status":"ok"},"proof":[{"text":"The structural requirements on source and target, namely that both immersions are spaces with bornologies, are found automatically. What remains is that the preimage under φ of every bounded set of 𝒪 S is bounded in the immersion of S' in 𝒪 T.","status":"ok","from":0,"to":1},{"text":"Let L be bounded in 𝒪 S. By the definition of [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology]], its image L' in X under j S is bounded in X, and that image is uniformly below S.","status":"ok","from":2,"to":4},{"text":"The inclusion j S is injective, so L is the preimage of its image L' ([[AffineConstructive.orders.subset_images.injective_preimage_image_alt]]). The goal becomes the boundedness of the preimage of (j S)* L' under φ.","status":"ok","from":5,"to":5},{"text":"Since φ followed by j S is j S' followed by j T, this preimage is the preimage of L' under j T and then under j S'. Being bounded in the immersion of S' means two things: the image of this set under j S' is bounded in 𝒪 T, and it is uniformly below S'. The two are shown in turn.","status":"ok","from":6,"to":8},{"text":"Boundedness in 𝒪 T in turn means that the image in X is bounded and uniformly below T. Each image of a preimage is contained in the original set ([[AffineConstructive.orders.subset_images.image_preimage_counit]]), and both properties pass to smaller sets, so both reduce to statements about L' itself.","status":"ok","from":9,"to":11},{"text":"L' is bounded in X by its construction.","status":"ok","from":12,"to":13},{"text":"L' is uniformly below S, and S ⊆ T, so L' is uniformly below T.","status":"ok","from":14,"to":16},{"text":"For the second requirement the counit [[AffineConstructive.orders.subset_images.image_preimage_counit]] again removes the image of a preimage. It remains to show that the preimage of L' under j T is uniformly below S'.","status":"ok","from":17,"to":18},{"text":"That L' is uniformly below S gives an entourage U of X whose thickening of L' lies in S. Take as witness the entourage of 𝒪 T pulled back from U along j T.","status":"ok","from":19,"to":20},{"text":"Since j T is uniformly continuous, the pulled-back entourage thickens the preimage of L' inside the preimage of the U-thickening of L' ([[AffineConstructive.topology.uniform.base.preimage_thicken_uc_le]]). That thickening lies in S, and its preimage under j T lies in S', the preimage of S.","status":"ok","from":21,"to":23}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment spaces, local morphisms, local completions","summary":"The file sets up uniform spaces that also carry a bornology. It starts from the bare pairing [[UnifBornSpace]], with no axiom relating the two structures, adds the thickening axiom [[UniformlyOpenBornology]] to obtain the well-containment uniform spaces [[WCUnifSpace]] and their regular variant [[RegularWCUnifSpace]], and defines the well-containment relation K ⋐ S. It then gives product certificates and the morphism classes, forward, reflecting, initial and embedding, both in the global form (uniform and bornological at once) and in the local form, where uniform continuity or reflection is asked only near bounded sets ([[LocalUniformContinuity]], [[LocalUniformReflection]]). It ends with the interface of a local completion, [[LocalCompletion]], and of a locally complete space, which the localization and the trapped completion later realise."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.subgroups":{"page":"../../theory/subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"../uniform/base.html","short":"Uniform spaces: closeness, thickening, induced topology, separation and the uniform reflection pair","summary":"This file develops the basic theory of uniform spaces. The uniformity of a uniform space is a sublattice of relations that is closed under composition and inversion. The file proves the elementary laws of closeness: reflexivity, symmetric splitting into two through six factors, and composition of close pairs. It also proves the laws of thickening, including the swap of a thickening across a complement. Every uniform space carries an induced topology, in which a separated space is Hausdorff and a regular space is strong. Interior, closure and density are described through entourages. The forward, reflecting, initial and embedding classes of maps are closed under composition, pass to their topological counterparts, and make 𝐔𝐧𝐢𝐟 a reflection pair with a morphism to the topological reflection pair 𝐀𝐓𝐨𝐩. The file ends with lemmas on images and preimages of thickenings and on dense maps, which the subspace, completion and bornology files use."},"AffineConstructive.topology.uniform.uniformly_below":{"page":"../uniform/uniformly_below.html","short":"The uniformly-below relation K ◁ S on subsets of a uniform space","summary":"The file develops the basic theory of the uniformly-below relation of pointfree topology on the subsets of a uniform space: K ◁ S holds when some thickening U[K] lies in S, that is, when S is a uniform neighbourhood of K ([[uniformly_below]]). The relation is contained in inclusion and is transitive. It is monotone, shrinking on the left and growing on the right ([[unif_below_proper_aimpl]]). The empty subset is uniformly below every subset, and every subset is uniformly below the whole set. The relation is closed under joins on the left and meets on the right, with the two entourages that the two hypotheses provide combined by their meet ([[unif_below_join]], [[unif_below_meet]]). It interpolates through a thickening ([[unif_below_interpolate]]), and it may be strengthened to the closure on the left and to the interior on the right; in particular K ◁ S gives K ⊆ interior S, and every point of the interior has its singleton uniformly below S. Supporting monotonicity lemmas for thickening ([[thicken_le]], [[thicken_le_r]], [[thicken_join_le]]) and hints that register the inclusion, the transitivity and the monotonicity with the rewriting system complete the file."},"AffineConstructive.topology.uniform.basis":{"page":"../uniform/basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.uniform.subspace":{"page":"../uniform/subspace.html","short":"Pulled-back uniformities, uniformly initial maps, and uniform subspaces","summary":"The file pulls a uniformity back along a function f : X ⇾ Y: the entourages of X are the relations containing the preimage under f × f of an entourage of Y. This is presented by the preimages of the entourages, a basis of Y pulls back to a basis, and when Y is a uniform space so is X ([[pullback_uniform_space]]), with f uniformly initial, and a uniform embedding when f is injective. The universal property ([[pullback_uniformity_initial]]) makes the construction a cleavage of the reflection pair of uniform spaces ([[unif_cloven_pair]]), which gives the characterisations of uniformly initial maps by lifting ([[uniformly_initial_alt]], [[uniformly_initial_alt2]]). Subspaces are the case of the inclusion of a subset: the inclusion is a uniform embedding, a subspace of a separated space is separated, and a dense map restricted over an open subset stays dense ([[dense_open_restrict]])."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.bornology.subspace":{"page":"../bornology/subspace.html","short":"Initial (pullback) bornologies along a map, subspace bornologies, and bornologies as a cloven reflection pair","summary":"The file builds the initial bornology along a map f : X ⇾ Y: the subsets of X whose image under f is bounded. It proves that this is a bornology, that f is bornological and bornologically initial for it, and installs it as the cleavage of the reflection pair of bornological spaces, which makes that pair cloven and saturated ([[born_cloven_pair]]). From the general theory of reflection pairs it obtains the characterisations of initial maps by cancellation against arbitrary maps g ([[bornology_initial_alt]], [[bornology_initial_alt2]]). Subspaces are the case of a subset's inclusion: that inclusion is a bornological embedding ([[from_subset_born_emb]]), and a bounded subset carries the trivial subspace bornology ([[bounded_pullback_bornology_trivial]]). This parallels the subspace construction for uniform spaces."},"AffineConstructive.topology.unif_born.base":{"page":"base.html","short":"Uniform spaces with bornologies: maps, their reflection pair, transport of well-containment","summary":"The file sets up the category of sets carrying both a uniformity and a bornology, with no axiom linking the two. It shows that the four classes of maps (uniformly continuous and bornological, reflecting, initial, embedding) respect equality of functions, contain identities, compose, and satisfy the cancellation laws. It packages them as the reflection pair [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], with pair morphisms to uniform spaces, bornological spaces and topological spaces, and from it derives that inverses swap the forward and reflecting classes. Its main result, [[wcunif_transport]], pulls the well-containment axiom back along a uniformly continuous, bornological and bornology-reflecting map. The subspace and localization files use it."},"AffineConstructive.topology.unif_born.local_maps":{"page":"local_maps.html","short":"Locally uniform maps: composition, factoring, inversion, topology, and their reflection pairs","summary":"This file develops the basic theory of the locally uniform classes of maps between uniform spaces with bornologies. These are the maps that are uniformly continuous, or reflecting, near bounded sets. It shows that function equality preserves each class and that the global classes imply the local ones. It proves that identities belong to every class and composites stay in their class. The forward composite needs the first map to be bornological ([[local_uc_compose]]), and the reflecting composite needs the second to be bornology-reflecting ([[local_ur_compose]]). Further results cover the factoring (cancellation) laws, inversion of bijections, which swaps the forward and reflecting classes, and the descent to continuity and continuous reflection. A locally reflecting map out of a separated space is injective ([[local_reflection_injective]]), and local reflection lifts along a dense uniformly continuous map ([[ufm_dense_locally_initial]]). Finally the file packages two reflection pairs, the local pair [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_loc]] and its restriction [[𝐖𝐂𝐔𝐧𝐢𝐟]] to well-containment uniform spaces, with pair morphisms from [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] and to [[𝐀𝐓𝐨𝐩]]."},"AffineConstructive.topology.unif_born.well_contained":{"page":"well_contained.html","short":"Well-containment K ⋐ S: its order laws, transitivity, interpolation and closure","summary":"The file develops the well-containment relation K ⋐ S of a set with a uniformity and a bornology: K is bounded and uniformly below S, the two conditions joined by the additive and. Most results carry over directly from the uniformly-below relation (uniform/uniformly_below.v): monotonicity in both arguments, closure under join on the left and meet on the right, the empty and whole cases, the passage to interiors, and transitivity. In a well-containment uniform space, where every bounded subset has a bounded thickening, two results get stronger. Interpolation ([[wc_interpolate]]) gives a bounded intermediate subset, taken to be a thickening of K. The closure of a bounded subset is bounded ([[wcunif_closure_bounded]], [[born_closure]]), and it is well-contained in everything K is well-contained in ([[wc_closure]])."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.strip_coercions":{"page":"../../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

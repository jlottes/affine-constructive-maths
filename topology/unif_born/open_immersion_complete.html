rsion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** Bounded completeness of the open immersion (cont3's D′ route;\n    doc/extension_theorem.md §4, §7).  Over a complete ambient X, every\n    *trapped* ℒ-Cauchy filter on 𝒪 S converges in 𝒪 S: the witness K ∊ 𝒲 S\n    pins the ambient limit inside cl (j⁎ K) ⊆ S, by the ◁-leg of\n    well-containment and closure algebra alone.  No intrinsic completeness\n    of ℒ (𝒪 S) is claimed — that statement is scale-priced — and none is\n    needed: the extension pipeline only ever takes limits of witnessed\n    filters (bornological images of bounded filters, traces of\n    apartness-witnessed points). *)\n\nRequire Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.unif_born.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure or rapped_prop F) as [K HK].\n    pose (K' := (j S)⁎ K).\n    pose proof andr (subset_pt_is_el K) : K' ◁ S as HKub.\n    rew (unif_below_closure _ _) in HKub. rew <-HKub.\n    assert (K' ∊ trapped_filter (𝒯₁ (j S) F)) as HKel. {\n      change ( (j S)* ((j S)⁎ K) ∊ trapped_filter F ).\n      now rew <-(preimage_image_unit _ _).\n    }\n    now pose proof (to_trapped_eq_closure _ _ (surjective_applied (τ X) (𝒯₁ (j S) F)) (@to_subset _ _ _ HKel)).\n  Qed.\n\n  Definition open_immersion_limit : 𝒯 (𝒪 S) ⇾ 𝒪 S := corestrict k S.\n  Local Abbreviation r := open_immersion_limit.\n\n  Lemma open_immersion_limit_unit : r ∘ τ (𝒪 S) = id.\n  Proof. apply (injective_compose_cancel (j S)); try exact _.\n    change ( (τ X)⁻¹ ∘ (𝒯₁ (j S) ∘ τ (𝒪 S)) = j S ).\n    rew (wc_trapped_map_unit (j S)).\n    change ( ((τ X)⁻¹ ∘ τ X) ∘ j S = j S ).\n    now rew (bijective (τ X)).\n  Qed.\n\n  Local Instance open_immersion_limit_cont : Continuous r.\n  Proof. apply (cont_factor _ (j S) _). now change (Continuous ((τ X)⁻¹ ∘ 𝒯₁ (j S))). Qed.\n\n  Local Instance open_immersion_locally_complete_inverse : LocalCompleteInverse (𝒪 S)\n    := to_trapped_retract_complete_inverse r open_immersion_limit_unit.\n  \n  Lemma open_immersion_locally_complete : LocallyComplete (𝒪 S).\n  Proof. exact (to_trapped_retract_complete r open_immersion_limit_unit). Qed.\nEnd open_immersion_complete.\n\n\n","sentences":[{"i":0,"s":0,"e":648,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":649,"e":703,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":704,"e":763,"kind":"vernac","status":"ok","ms":17,"messages":[],"goals":null},{"i":3,"s":764,"e":790,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":791,"e":842,"kind":"vernac","status":"ok","ms":20,"messages":[],"goals":null},{"i":5,"s":843,"e":879,"kind":"vernac","status":"ok","ms":52,"messages":[], ⁎ K uniformly below S, so the closure of j⁎ K is still contained in S, and the limit lies in that closure ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_closure]], [[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped_eq_closure]]). Corestricted to S, the limit map is a continuous retraction of τ (𝒪 S), and [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete]] then gives [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_locally_complete]]. The file claims no intrinsic completeness of the localization of 𝒪 S, only that trapped filters converge in it.","short":"An open subset of a locally complete well-containment space is locally complete","items":[{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.id","base":"id","kind":"abbrev","start":25,"body":null,"status":"ok","short":{"text":"Local shorthand for the identity function on a set","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.set.id_fun]], the identity function, with its set left to be inferred. It appears in the statement that the limit map is a retraction of the trapped unit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.ℒ","base":"ℒ","kind":"abbrev","start":26,"body":null,"status":"ok","short":{"text":"Local abbreviation ℒ for the localization of a uniform space with a bornology","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.localization]]: ℒ X is X with the same points and bornology, carrying the localized uniformity. The file declares it alongside the other abbreviations of the localization and completion machinery, but none of its statements or proofs uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.ε","base":"ε","kind":"abbrev","start":27,"body":null,"status":"ok","short":{"text":"Local shorthand ε for the counit ℒ X ⇾ X of the localization","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.from_localization]], the identity of the underlying set seen as a map from the localization ℒ X back to X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.η","base":"η","kind":"abbrev","start":28,"body":null,"status":"ok","short":{"text":"Local shorthand η for the unit X ⇾ ℒ X of the localization","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.to_localization]], the identity of the underlying set seen as a map from X to its localization ℒ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.κ","base":"κ","kind":"abbrev","start":29,"body":null,"status":"ok","short":{"text":"Local shorthand κ for the unit X ⇾ 𝒞 X of the Cauchy completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy]], which sends a point of a uniform space to its principal filter, a Cauchy filter.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.𝒞","base":"𝒞","kind":"abbrev","start":30,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒞 for the set of Cauchy filters on a uniform space","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_filter_set]]: 𝒞 X is the set of Cauchy filters on X with the Cauchy equality, the Cauchy completion of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.𝒞₁","base":"𝒞₁","kind":"abbrev","start":31,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒞₁ for the action of the Cauchy completion on uniformly continuous maps","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]]: for uniformly continuous f : X ⇾ Y, 𝒞₁ f : 𝒞 X ⇾ 𝒞 Y takes a Cauchy filter to its image filter.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.cl","base":"cl","kind":"abbrev","start":32,"body":null,"status":"ok","short":{"text":"Local abbreviation for the closure of a subset","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.topology.closure]], the closure of a subset U: the complement of the interior of U's complement.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.int","base":"int","kind":"abbrev","start":33,"body":null,"status":"ok","short":{"text":"Local shorthand int for the interior of a subset","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.topology.interior]]: the points of which a subset is a neighbourhood.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.𝒪","base":"𝒪","kind":"abbrev","start":34,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒪 for the open immersion of a subset","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion.open_immersion]]: 𝒪 S is the subset S with the pullback uniformity and the bornology 𝒲 S. The file shows that 𝒪 S is locally complete when S is open in a locally complete X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.𝒲","base":"𝒲","kind":"abbrev","start":35,"body":null,"status":"ok","short":{"text":"Local abbreviation for the bornology 𝒲 S of the open immersion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion.open_immersion_bornology]]. 𝒲 S is the bornology on S whose bounded sets are the subsets of S that are bounded in X and uniformly below S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.j","base":"j","kind":"abbrev","start":36,"body":null,"status":"ok","short":{"text":"Local abbreviation for the inclusion j S : 𝒪 S ⇾ X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion.from_open_immersion]], the inclusion of the open immersion 𝒪 S into the ambient space X. The file builds [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_ambient_limit]] on it: a trapped filter on 𝒪 S is carried to a trapped filter on X along j S, and that filter's limit in X is taken.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.𝒯","base":"𝒯","kind":"abbrev","start":37,"body":null,"status":"ok","short":{"text":"Local abbreviation 𝒯 for the trapped completion, Cauchy filters with a bounded member","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_cauchy_filter_set]]: 𝒯 X is the set of Cauchy filters on X that have a bounded member, with the equality of the Cauchy completion 𝒞 X. Its unit τ X sends a point to its principal filter, and a morphism of well-containment uniform spaces induces a map between trapped completions.\n\nIn this file 𝒯 (𝒪 S) is the domain of the two limit maps: [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_ambient_limit]], which sends a trapped filter on the open immersion to its limit in X, and [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit]], the same map corestricted to S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.τ","base":"τ","kind":"abbrev","start":38,"body":null,"status":"ok","short":{"text":"Local shorthand τ for the unit X ⇾ 𝒯 X of the trapped completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped]], which sends a point to its principal filter as a trapped filter. When X is locally complete τ X is bijective, and its inverse takes a trapped filter to its limit.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.ρ","base":"ρ","kind":"abbrev","start":39,"body":null,"status":"ok","short":{"text":"Local shorthand ρ X for the inclusion 𝒯 X ⇾ 𝒞 X that forgets a filter is trapped","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.from_trapped]]: for a set X with a uniformity and a bornology, ρ X : 𝒯 X ⇾ 𝒞 X reads a trapped Cauchy filter as a Cauchy filter on X, forgetting that it is trapped. The abbreviation is declared alongside the others for the trapped completion, but no proof in this file uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.𝒯₁","base":"𝒯₁","kind":"abbrev","start":40,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒯₁ for the action of the trapped completion on morphisms","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]]: for a morphism f of well-containment spaces, 𝒯₁ f : 𝒯 X ⇾ 𝒯 Y takes a trapped filter to its image. It is natural in f with respect to the unit τ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_ambient_limit","base":"open_immersion_ambient_limit","kind":"def","start":43,"body":null,"status":"ok","short":{"text":"The limit in X of a trapped filter on 𝒪 S: (τ X)⁻¹ ∘ 𝒯₁ (j S)","status":"ok"},"long":{"text":"For X a locally complete well-containment space and S open in X, this is the map 𝒯 (𝒪 S) ⇾ X that pushes a trapped filter on the open immersion forward along the inclusion j S to a trapped filter on X, and then takes its limit there by inverting the unit τ X, which local completeness of X makes bijective.\n\nThe map lands in X, not yet in S. That it takes values in S is [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_complete_maps_into]], and its corestriction to 𝒪 S is [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit]].\n\n```tikzcd\n\\mathcal{T}(\\mathcal{O} S) \\arrow[r, \"\\mathcal{T}_1 j\"] \\arrow[rd, \"k\"'] & \\mathcal{T} X \\arrow[d, \"(\\tau X)^{-1}\"] \\\\\n & X\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.k","base":"k","kind":"abbrev","start":44,"body":null,"status":"ok","short":{"text":"Local shorthand k for the ambient limit map 𝒯 (𝒪 S) ⇾ X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_ambient_limit]] at the section's S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_complete_maps_into","base":"open_immersion_complete_maps_into","kind":"inst","start":45,"body":[46,60],"status":"ok","short":{"text":"The ambient limit of a trapped filter on 𝒪 S lies in S","status":"ok"},"proof":[{"text":"Unfold the limit map: it pushes a trapped filter forward along j S and takes the point of X that the bijection τ X sends to the pushed filter. Fix a trapped filter F on 𝒪 S. What remains is to show that this ambient limit lies in S.","status":"ok","from":0,"to":2},{"text":"Since F is trapped, it has a member K in the bornology 𝒲 S. Let K' be the image of K in X. Because K belongs to 𝒲 S, K' is uniformly below S.","status":"ok","from":3,"to":5},{"text":"By [[AffineConstructive.topology.uniform.uniformly_below.unif_below_closure]], the closure of K' is also uniformly below S, and so contained in S. It therefore suffices to show that the limit lies in the closure of K'.","status":"ok","from":6,"to":7},{"text":"First, K' belongs to the pushed-forward filter, which means its preimage under j S is a member of F. That preimage contains K by [[AffineConstructive.orders.subset_images.preimage_image_unit]], and K is in F, so the preimage is in F because F is upward closed.","status":"ok","from":8,"to":12},{"text":"Since τ X is surjective, it sends the limit to the pushed-forward filter itself. By [[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped_eq_closure]], a point that τ X sends to a filter lies in the closure of every member of that filter. In particular the limit lies in the closure of K'.","status":"ok","from":13,"to":14}]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit","base":"open_immersion_limit","kind":"def","start":61,"body":null,"status":"ok","short":{"text":"The limit map 𝒯 (𝒪 S) ⇾ 𝒪 S, the ambient limit corestricted to S","status":"ok"},"long":{"text":"The corestriction to the open immersion 𝒪 S of [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_ambient_limit]], which takes values in S by [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_complete_maps_into]]. It sends a trapped filter on 𝒪 S to its limit, a point of S.\n\nIt is a continuous retraction of the trapped unit τ (𝒪 S) ([[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit_unit]], [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit_cont]]), which is exactly what [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete]] asks for to conclude that 𝒪 S is locally complete. Only trapped filters, those with a member in 𝒲 S, are claimed to converge; nothing is said of arbitrary Cauchy filters on ℒ (𝒪 S).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.r","base":"r","kind":"abbrev","start":62,"body":null,"status":"ok","short":{"text":"Local shorthand r for the limit map 𝒯 (𝒪 S) ⇾ 𝒪 S","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit]] at the section's S.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit_unit","base":"open_immersion_limit_unit","kind":"prf","start":63,"body":[64,70],"status":"ok","short":{"text":"The limit map is a retraction of the trapped unit: r ∘ τ (𝒪 S) is the identity","status":"ok"},"proof":[{"text":"The inclusion j S is injective, so it cancels on the left ([[AffineConstructive.theory.set.injective_compose_cancel]]). It therefore suffices to show the equality after composing both sides with j S.","status":"ok","from":0,"to":1},{"text":"Unfolded, the left side is the inverse of τ X applied after 𝒯₁ (j S) ∘ τ (𝒪 S). By naturality of the trapped unit, [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]], this composite equals τ X ∘ j S.","status":"ok","from":2,"to":3},{"text":"Regrouping, τ X is followed by its own inverse, which is the identity because τ X is bijective. Both sides then reduce to j S.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit_cont","base":"open_immersion_limit_cont","kind":"inst","start":71,"body":[72,75],"status":"ok","short":{"text":"The limit map 𝒯 (𝒪 S) ⇾ 𝒪 S is continuous","status":"ok"},"proof":[{"text":"The inclusion j S is a uniform embedding, so it reflects continuity. By [[AffineConstructive.topology.topology.maps.cont_factor]], it suffices to show that j S ∘ r is continuous.","status":"ok","from":0,"to":1},{"text":"That composite is 𝒯₁ (j S) followed by the inverse of τ X. Here 𝒯₁ (j S) is a morphism of well-containment spaces and hence continuous. The inverse of τ X is continuous because τ X is a reflecting bijection ([[AffineConstructive.topology.topology.maps.invert_reflecting]]). A composite of continuous maps is continuous.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_locally_complete_inverse","base":"open_immersion_locally_complete_inverse","kind":"inst","start":76,"body":null,"status":"ok","short":{"text":"The local-completion datum on 𝒪 S, from the limit map as a retraction of τ (𝒪 S)","status":"ok"},"long":{"text":"Equips the open immersion 𝒪 S with its local-completion operation, the datum [[AffineConstructive.topology.interfaces.unif_born.LocalCompleteInverse]] that assigns retractions to dense initial extensions. It is obtained by [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete_inverse]] from the continuous retraction [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit]] of the trapped unit and the retraction law [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit_unit]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_locally_complete","base":"open_immersion_locally_complete","kind":"prf","start":77,"body":[78,80],"status":"ok","short":{"text":"The open immersion of an open subset of a locally complete space is locally complete","status":"ok"},"proof":[{"text":"The limit map r is a continuous retraction of the trapped unit of 𝒪 S: it is a retraction by [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit_unit]] and continuous by [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit_cont]]. By [[AffineConstructive.topology.unif_born.local_completion.to_trapped_retract_complete]], such a retraction makes the well-containment space 𝒪 S locally complete.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{"\n\\mathcal{T}(\\mathcal{O} S) \\arrow[r, \"\\mathcal{T}_1 j\"] \\arrow[rd, \"k\"'] & \\mathcal{T} X \\arrow[d, \"(\\tau X)^{-1}\"] \\\\\n & X":"<svg fill=\"currentColor\" version='1.1' xmlns='h -miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 55.247)'>\n<use x='47.041353' y='-46.319747' xlink:href='#g3-1'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 0 55.247)'>\n<use x='51.571542' y='-45.337169' xlink:href='#g4-1'/>\n<\/g>\n<g transform='matrix(.999455 0 0 .999455 0 55.247)'>\n<use x='55.442778' y='-46.319747' xlink:href='#g5-3'/>\n<\/g>\n<path d='M35.96418 21.427402L68.51302 41.388182' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M67.816646 37.925112C67.41027 39.497544 67.930416 40.676708 68.68284 41.492334C67.614717 41.191502 66.327885 41.26253 65.11062 42.337681' stroke='currentColor' fill='none' stroke-width='.398458' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 55.247)'>\n<use x='45.636119' y='-16.539983' xlink:href='#g5-4'/>\n<\/g>\n<path d='M77.85824 18.936702V38.559022' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M80.4465 36.15483C78.89352 36.63047 78.1602 37.69038 77.85824 38.75825C77.55628 37.69038 76.82296 36.63047 75.26998 36.15483' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 .000008 55.247)'>\n<use x='80.157299' y='-23.994918' xlink:href='#g6-1'/>\n<use x='83.268601' y='-23.994918' xlink:href='#g5-1'/>\n<use x='87.750309' y='-23.994918' xlink:href='#g5-2'/>\n<use x='94.818304' y='-23.994918' xlink:href='#g6-2'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 .000008 55.247)'>\n<use x='97.957426' y='-27.00795' xlink:href='#g7-1'/>\n<use x='103.35302' y='-27.00795' xlink:href='#g4-1'/>\n<\/g>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment axioms, global and local morphisms, local completions","summary":"The interface for sets carrying both a uniformity and a bornology. It sets up the chassis [[UnifBornSpace]], with no axiom linking the two structures, and then the linking axioms: [[UniformlyOpenBornology]] (bounded sets have bounded uniform thickenings), which defines the well-containment uniform spaces [[WCUnifSpace]] and their regular form [[RegularWCUnifSpace]], [[ClosedBornology]], and the well-containment relation [[well_contained]]. It defines the morphism classes in two flavours. The global ones ([[UnifBornMorphism]], [[GlobalWCUnifInitial]], …) are uniformly continuous and bornological everywhere. The local ones are built on [[LocalUniformContinuity]] and [[LocalUniformReflection]], uniform control near bounded sets, and run up to [[WCUnifMorphism]] and [[WCUnifEmbedding]]. The file closes with the universal property of a local completion, [[LocalCompletion]] and [[LocallyComplete]], and with the resolution hints that recover the codomain's structure from a morphism. The underlying structures come from the uniform and bornology interfaces; the theory, the trapped completion and localization are developed in the topology/unif_born files."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.topology.interior":{"page":"../topology/interior.html","short":"Interior and closure in a topological space: basic laws, open and closed subsets, density","summary":"This file develops the basic algebra of the interior and closure operators that a topology determines from its neighbourhood relation. The interior is contained in its argument, is monotone and idempotent, and preserves the full subset and the empty subset. It also sends the multiplicative intersection of two interiors into the interior of their meet. As a consequence, interiors are open, and an open subset is a neighbourhood of each of its points. The closure, defined as the complement of the interior of the complement, has the dual properties, which follow by complementation: it contains its argument, is idempotent, and sends a join into the multiplicative union of the closures. A subset is open exactly when its complement is closed, and conversely. The file ends with the neighbourhood characterisation of the closure, that x is in the closure of U if and only if every neighbourhood of x meets U, and its consequences for dense subsets. These results are used by the files on continuity, uniform spaces and completions."},"AffineConstructive.topology.topology.subspace":{"page":"../topology/subspace.html","short":"The initial (pullback) topology along a function, and the universal property of initial maps","summary":"The file constructs the initial (pullback) topology. Given a topology on Y and a function f : X ⇾ Y, a subset U of X is a neighbourhood of x when the preimage of some neighbourhood of f x is contained in U ([[pullback_neighborhood]]). The relation satisfies the topology axioms, and with it f is continuous and initial. When f is the inclusion of a subset, this is the subspace topology. As a result, topological spaces form a cloven, and hence saturated, reflection pair with this pullback as cleavage ([[atop_cloven]]). The general results on cloven pairs from [[ini_lift_alt]] and [[ini_lift_alt2]] then give the universal characterisation: f is initial exactly when continuity of every g into X is equivalent to continuity of f ∘ g."},"AffineConstructive.topology.uniform.base":{"page":"../uniform/base.html","short":"Uniform spaces: entourage algebra, thickenings, uniform topology, uniform maps, the reflection pair","summary":"The basic theory of uniform spaces. It equips a uniformity with its algebraic structure (a sublattice and sub-star-semigroup of relations), derives the splitting and symmetry consequences of the axioms and the composition laws for closeness, and develops thickenings U[A] of subsets: monotonicity, composition, singletons, and the swap law for a thickening apart from a set. The uniform topology is built from the entourages, with interior, closure and density described by entourages; separated uniform spaces are shown Hausdorff, and regular ones strong. For maps it characterises uniform continuity and reflection by preimages under f × f, introduces the pullback of entourages [[ufm_preimage]], proves closure under identity, composition and the cancellation laws, and assembles uniform spaces into the reflection pair [[𝐔𝐧𝐢𝐟]] with a morphism to topological spaces. It ends with thickening and closure estimates along dense and uniformly reflecting maps, used by the completion and trapped-completion files."},"AffineConstructive.topology.uniform.basis":{"page":"../uniform/basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.uniform.product":{"page":"../uniform/product.html","short":"Cartesian and tensor product uniformities, their structure maps, and dense-extension criteria","summary":"The file builds the cartesian and tensor product uniformities from their presentations by basic entourages, and shows that each makes the product a uniform space. Basic entourages of X × Y combine U-closeness of first coordinates and V-closeness of second coordinates additively. Those of X ⊗ Y combine them by the tensor. For the cartesian product it proves that the projections are uniformly continuous and that a map into the product is uniformly continuous when both of its components are. It also shows that the induced topology is the cartesian product topology and that a product of separated spaces is separated. For the tensor product it shows that the induced topology is the tensor product topology, and that the unitors, the symmetry and the associators are uniform embeddings. On both products, maps of factors that are uniformly continuous, reflecting, initial or embeddings give product maps of the same kind. The last section, on relations in the tensor square, describes the interior and closure of an entourage by thickening and derives the dense-extension criteria [[ufm_dense_reflecting]] and [[ufm_dense_continuous]]."},"AffineConstructive.topology.uniform.subspace":{"page":"../uniform/subspace.html","short":"Pulled-back uniformities, uniformly initial maps, and uniform subspaces","summary":"The file pulls a uniformity back along a function f : X ⇾ Y: the entourages of X are the relations containing the preimage under f × f of an entourage of Y. This is presented by the preimages of the entourages, a basis of Y pulls back to a basis, and when Y is a uniform space so is X ([[pullback_uniform_space]]), with f uniformly initial, and a uniform embedding when f is injective. The universal property ([[pullback_uniformity_initial]]) makes the construction a cleavage of the reflection pair of uniform spaces ([[unif_cloven_pair]]), which gives the characterisations of uniformly initial maps by lifting ([[uniformly_initial_alt]], [[uniformly_initial_alt2]]). Subspaces are the case of the inclusion of a subset: the inclusion is a uniform embedding, a subspace of a separated space is separated, and a dense map restricted over an open subset stays dense ([[dense_open_restrict]])."},"AffineConstructive.topology.uniform.uniformly_below":{"page":"../uniform/uniformly_below.html","short":"The uniformly-below relation K ◁ S on subsets of a uniform space","summary":"The file develops the basic theory of the uniformly-below relation of pointfree topology on the subsets of a uniform space: K ◁ S holds when some thickening U[K] lies in S, that is, when S is a uniform neighbourhood of K ([[uniformly_below]]). The relation is contained in inclusion and is transitive. It is monotone, shrinking on the left and growing on the right ([[unif_below_proper_aimpl]]). The empty subset is uniformly below every subset, and every subset is uniformly below the whole set. The relation is closed under joins on the left and meets on the right, with the two entourages that the two hypotheses provide combined by their meet ([[unif_below_join]], [[unif_below_meet]]). It interpolates through a thickening ([[unif_below_interpolate]]), and it may be strengthened to the closure on the left and to the interior on the right; in particular K ◁ S gives K ⊆ interior S, and every point of the interior has its singleton uniformly below S. Supporting monotonicity lemmas for thickening ([[thicken_le]], [[thicken_le_r]], [[thicken_join_le]]) and hints that register the inclusion, the transitivity and the monotonicity with the rewriting system complete the file."},"AffineConstructive.topology.uniform.cauchy_completion":{"page":"../uniform/cauchy_completion.html","short":"The Cauchy completion: Cauchy filters, their uniformity, the unit η, and its universal property","summary":"The file builds the Cauchy completion 𝒞 X of a uniform space X. Its points are the Cauchy filters on X, bundled as [[cauchy_filter]]. Two Cauchy filters are equal ([[cauchy_equiv]]) when they have U-close members for every entourage U. An entourage U of X lifts to the relation [[cauchy_basis]], which holds of F and G when for every V they have members A and B with A ⊗ B ⊆ V⁻¹ ∙ U ∙ V. These relations present a separated uniformity on 𝒞 X ([[cauchy_uniformity]], [[cauchy_filter_space]]), and the lifted entourages [[cauchy_entourage]] come with laws for inverses, composition and members. The unit [[to_cauchy]] sends a point to its principal filter; it is uniformly initial, dense, and an embedding when X is separated. A uniformly continuous f extends to [[cauchy_map]], which commutes with η and preserves composition and identities. From a dense, uniformly reflecting f : X ⇾ Y, [[cauchy_reflect]] builds a map Y ⇾ 𝒞 X with cauchy_reflect f ∘ f = η X. This gives the universal property [[cauchy_completion]]. The trapped completion in topology.unif_born.trapped_cauchy reuses several of these lemmas."},"AffineConstructive.topology.uniform.completion":{"page":"../uniform/completion.html","short":"Uniform completions as an instance of the reflection-pair completion theory","summary":"This file specialises the completion theory of reflection pairs to uniform spaces under the label 𝐔𝐧𝐢𝐟. It first shows that a uniform completion in the sense of [[Completion]] is a pair completion, through [[unif_pair_completion]] and its converse [[unif_completion]], so that the abstract theorems apply whenever a concrete completion is in context. The Cauchy filters with η, 𝒞 f and the reflect maps form the canonical completion ([[unif_canonical_completor]], [[unif_canonical_completion]]), and the file shows that this completion preserves initial maps. From these come the uniform versions of the main results: completions are complete, the space of Cauchy filters 𝒞 X is complete, and the universal property extends to dense uniformly reflecting maps ([[completion_reflect]]) and to uniformly continuous maps into a complete space ([[ufm_cont_ext]]). Several criteria for completeness follow, and the file closes by showing that cartesian products of completions are completions and products of complete spaces are complete."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.bornology.basis":{"page":"../bornology/basis.html","short":"Bornologies presented by bases, basis criteria for maps, the trivial bornology","summary":"This file builds bornologies from bases and gives criteria stated in terms of bases. [[presented_bornology]] turns any family of subsets into the bornology it generates downward. [[presented_bornological_space]] shows that this bornology satisfies the axioms of a bornological space when the family is order-preserving on an up-directed index set and covers every point. Conversely, a basis of a bornological space covers the points, has an inhabited index set and is up-directed. [[born_by_basis]] and [[bornology_refl_by_basis]] check that a map is bornological, or bornology-reflecting, by checking basis sets only. The file then treats the trivial bornology, in which every subset is bounded, and shows that maps out of the empty set, maps into the one-point set and constant maps are bornological; every bornology on the one-point set is trivial."},"AffineConstructive.topology.unif_born.base":{"page":"base.html","short":"Uniform spaces with bornologies: map classes, reflection pairs, transport, closed bornologies","summary":"The basic theory of sets carrying both a uniformity and a bornology. The combined initial and embedding classes coerce to their uniform and bornological parts. Each map class, whether combined or global well-containment, respects equality of functions, contains the identities and is closed under composition, and the forward and reflecting classes satisfy the cancellation laws. From this the file builds two reflection pairs: 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧, and its restriction 𝐖𝐂𝐔𝐧𝐢𝐟_gbl to well-containment uniform spaces with global maps. It also gives their pair morphisms to uniform, bornological and topological spaces, so the inverse of a bijection swaps the forward and reflecting classes. [[wcunif_transport]] shows that a space mapping into a well-containment space by a uniformly continuous, bornological and bornology-reflecting map is itself a well-containment space. The file ends by proving that the thickening axiom makes the bornology closed, and it packages the closure of bounded sets as [[born_closure]]."},"AffineConstructive.topology.unif_born.local_maps":{"page":"local_maps.html","short":"Locally uniform maps: composition, factoring, inversion, topology, and their reflection pairs","summary":"The file develops the basic theory of the local classes of maps between uniform spaces with bornologies. These are the maps that are uniformly continuous, or uniformly reflecting, near bounded sets. It shows that each class respects equality of functions. Globally uniform maps are local ([[uc_local_uc]], [[ur_local_ur]]). The classes contain identities and are closed under composition. Here the forward composite needs the first map to be bornological, and the reflecting composite needs the second map to reflect the bornology. The factoring lemmas give the cancellation laws, inverses swap the forward and reflecting classes, and the local classes descend to continuity and continuous reflection. Further results show that locally initial maps out of separated spaces are embeddings, and that local reflection lifts along dense maps ([[ufm_dense_locally_initial]]). Finally, the file packages the local classes as the reflection pairs [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧_loc]] and [[𝐖𝐂𝐔𝐧𝐢𝐟]], with pair morphisms from the global pairs and to [[𝐀𝐓𝐨𝐩]]."},"AffineConstructive.topology.unif_born.localization":{"page":"localization.html","short":"The localization ℒ X: the uniformity that makes local uniform conditions global","summary":"This file builds the localization ℒ X of a uniform space X with a bornology. ℒ X has the same points as X. Its uniformity is the largest one inside the filter of relations V such that, for every bounded K, some entourage U has the pairs of U starting in K inside V. The identity maps ε : ℒ X ⇾ X and η : X ⇾ ℒ X give the universal property. A map f is uniformly continuous near bounded sets exactly when f ∘ ε is uniformly continuous ([[localized_uc]], [[localized_uc_conv]]). For f dense into a well-containment space, f is locally uniformly reflecting exactly when η ∘ f is uniformly reflecting ([[localized_ur]], [[localized_ur_conv]]). The localization preserves separation and well-containment, collapses to X under a trivial bornology, and is idempotent. The file then lifts local maps to global maps between localizations, and from these derives the dense descent results of `unif_born/local_maps.v` for the local classes."},"AffineConstructive.topology.unif_born.well_contained":{"page":"well_contained.html","short":"Well-containment K ⋐ S: monotonicity, lattice laws, transitivity, bounded interpolation and closure","summary":"The file works out the elementary theory of well-containment K ⋐ S in a space with a uniformity and a bornology. Here K is bounded and S is a uniform neighbourhood of K. Most laws carry over directly from the uniformly-below relation of [[unif_below_le_l]] and its neighbours. They are monotonicity (shrinking K, enlarging S), joins on the left and meets on the right, the empty subset and the whole set, passing to the interior, and transitivity. In a well-containment uniform space ([[WCUnifSpace]]), the thickening axiom strengthens two results so that the bounded leg is kept: interpolation [[wc_interpolate]] gives a bounded K' with K ⋐ K' and K' ⋐ S, and [[wc_closure]] shows that the closure of K is still well-contained in S."},"AffineConstructive.topology.unif_born.open_immersion":{"page":"open_immersion.html","short":"Open immersions of open subsets, the restriction of maps, and nesting","summary":"The file builds the open immersion 𝒪 S of an open subset S of a space with a uniformity and a bornology. Its carrier is S, its uniformity is pulled back from X, and its bounded sets are the subsets whose image is bounded in X and uniformly below S, so the bornology remembers the boundary of S. The inclusion into X is a uniform embedding and is bornological and locally uniformly reflecting. It is deliberately not bornology-reflecting. A map f with S ⊆ f* T restricts to 𝒪₁ f : 𝒪 S ⇾ 𝒪 T, and this restriction is functorial. The uniform classes of f pass to the restriction, and so does bornology reflection when S = f* T. Bornologicality passes under the boundary condition that the interior of ∀.[f] S lies in T ([[open_immersion_restrict_bornological]]). Well-containment uniform spaces and their morphisms are preserved. For open S ⊆ T, the comparison [[open_immersion_nest]] between the nested immersion and 𝒪 S is a bijective uniform embedding that reflects bornology. The converse inclusion of bornologies holds only classically."},"AffineConstructive.topology.unif_born.trapped_cauchy":{"page":"trapped_cauchy.html","short":"The trapped completion: Cauchy filters with a bounded member, the canonical well-containment completion","summary":"The file builds the trapped completion 𝒯 X of a uniform space with a bornology: the Cauchy filters having a bounded member, as a subset of the Cauchy completion 𝒞 X with the uniformity pulled back along the inclusion β X, and the unit τ X : X ⇾ 𝒯 X, through which the unit of 𝒞 X factors. The unit is uniformly initial and dense, and 𝒯 X is separated. The entourages T X U lifted from X give a basis of its uniformity. The bornology of 𝒯 X is generated by the closures of the images of bounded sets under τ X. It is closed, it is well contained when X is, and τ X is bornologically initial when the bornology of X is closed or well contained. Bornological maps extend to maps 𝒯₁ f, so 𝒯 is a functor natural in the unit. Along a dense reflecting map into a well-containment space, the reflection of the Cauchy completion lands in 𝒯 X. Together these make (𝒯, τ, 𝒯₁, the reflection) the canonical completion of well-containment uniform spaces with global maps, and that completion preserves initial maps."},"AffineConstructive.topology.unif_born.trapped_wc":{"page":"trapped_wc.html","short":"The trapped completion in intrinsic local terms: functor action, reflection, local completion","summary":"This file states the trapped completion 𝒯 X of a well-containment uniform space in intrinsic terms, by passing the constructions of the file on trapped Cauchy filters through the localization ℒ once. A trapped Cauchy filter on X is also Cauchy for the localized uniformity. This gives [[trapped_localize]] : 𝒯 X ⇾ 𝒯 ℒ X, the inverse of 𝒯₁ (ε X), which is a bijection and an embedding of well-containment spaces. With it the file defines the functor action [[wc_trapped_map]] on locally uniformly continuous morphisms and the reflection [[wc_trapped_reflect]] of a dense, locally reflecting map. Both take hypotheses and give results in the local classes, so code that uses them need not mention ℒ. The file ends with [[trapped_local_completion]]: the unit τ X is a local completion. This also tests that the translation works as intended. Hints register the local classes of τ, 𝒯₁, the trapped reflection and the new maps for resolution."},"AffineConstructive.topology.unif_born.local_completion":{"page":"local_completion.html","short":"Local completions of well-containment uniform spaces, through the reflection-pair completion theory","summary":"This file instantiates the abstract completion theory of reflection pairs at well-containment uniform spaces (𝐖𝐂𝐔𝐧𝐢𝐟), with the trapped completion 𝒯 as the canonical completion. It first relates the concrete notions to the pair-level ones in both directions: a local completion is a pair completion ([[wcunif_pair_completion]]) and conversely ([[wcunif_completion]]), and likewise for locally complete spaces. It then shows that 𝒯 X with its unit τ, the induced maps [[wc_trapped_map]] and the reflections [[wc_trapped_reflect]] form a canonical completion that preserves initial maps. From this the general theorems of `reflection_pair/completion.v` carry over: completions are locally complete, the universal property extends to dense reflecting maps, a separated space with a dense locally complete subspace is locally complete, a retraction of τ X gives local completeness, and a dense reflecting map has a locally uniformly continuous extension [[wc_cont_ext]]. Last, a complete uniform space with a well-containment bornology is locally complete."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.strip_coercions":{"page":"../../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

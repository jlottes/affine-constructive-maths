ℬ}\n  : UnifBornMorphism (to_prod (f, g)).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornMorphism (func_op to_prod (_, _))) => simple notypeclasses refine to_prod_unif_born_mor : typeclass_instances.\n\nLemma prod_map_unif_born_mor@{u}\n  `{@UnifBornMorphism@{u} X₁ Y₁ Φ₁ Ψ₁ 𝒜₁ ℬ₁ f} `{@UnifBornMorphism@{u} X₂ Y₂ Φ₂ Ψ₂ 𝒜₂ ℬ₂ g}\n  `{@CartesianProductUnifBorn X₁ X₂ Φ₁ Φ₂ 𝒜₁ 𝒜₂ Φ 𝒜} `{@CartesianProductUnifBorn Y₁ Y₂ Ψ₁ Ψ₂ ℬ₁ ℬ₂ Ψ ℬ}\n  : UnifBornMorphism (prod_map (f, g)).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornMorphism (func_op prod_map (_, _))) => simple notypeclasses refine prod_map_unif_born_mor : typeclass_instances.\n\nLemma prod_map_unif_born_reflecting@{u}\n  `{@UnifBornReflecting@{u} X₁ Y₁ Φ₁ Ψ₁ 𝒜₁ ℬ₁ f} `{@UnifBornReflecting@{u} X₂ Y₂ Φ₂ Ψ₂ 𝒜₂ ℬ₂ g}\n  `{@CartesianProductUnifBorn X₁ X₂ Φ₁ Φ₂ 𝒜₁ 𝒜₂ Φ 𝒜} `{@CartesianProductUnifBorn Y₁ Y₂ Ψ₁ Ψ₂ ℬ₁ ℬ₂ Ψ ℬ}\n  : UnifBornReflecting (prod_map (f, g)).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornReflecting (func_op prod_map (_, _))) => simple notypeclasses refine prod_map_unif_born_reflecting : typeclass_instances.\n\nLemma prod_map_unif_born_initial@{u}\n  `{@UnifBornInitial@{u} X₁ Y₁ Φ₁ Ψ₁ 𝒜₁ ℬ₁ f} `{@UnifBornInitial@{u} X₂ Y₂ Φ₂ Ψ₂ 𝒜₂ ℬ₂ g}\n  `{@CartesianProductUnifBorn X₁ X₂ Φ₁ Φ₂ 𝒜₁ 𝒜₂ Φ 𝒜} `{@CartesianProductUnifBorn Y₁ Y₂ Ψ₁ Ψ₂ ℬ₁ ℬ₂ Ψ ℬ}\n  : UnifBornInitial (prod_map (f, g)).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornInitial (func_op prod_map (_, _))) => simple notypeclasses refine prod_map_unif_born_initial : typeclass_instances.\n\nLemma prod_map_unif_born_embedding@{u}\n  `{@UnifBornEmbedding@{u} X₁ Y₁ Φ₁ Ψ₁ 𝒜₁ ℬ₁ f} `{@UnifBornEmbedding@{u} X₂ Y₂ Φ₂ Ψ₂ 𝒜₂ ℬ₂ g}\n  `{@CartesianProductUnifBorn X₁ X₂ Φ₁ Φ₂ 𝒜₁ 𝒜₂ Φ 𝒜} `{@CartesianProductUnifBorn Y₁ Y₂ Ψ₁ Ψ₂ ℬ₁ ℬ₂ Ψ ℬ}\n  : UnifBornEmbedding (prod_map (f, g)).\nProof. now split. Qed.\n#[global] Hint Extern 2 (UnifBornEmbedding (func_op prod_map (_, _))) => simple notypeclasses refine prod_map_unif_ tructive.topology.interfaces.unif_born","name":"UnifBornMorphism","kind":"class","local":false,"page":"../interfaces/unif_born.html"},{"s":8997,"e":9011,"lib":"AffineConstructive.theory.set","name":"tensor_to_prod","kind":"def","local":false,"page":"../../theory/set.html"},{"s":9066,"e":9082,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"UnifBornMorphism","kind":"class","local":false,"page":"../interfaces/unif_born.html"},{"s":9084,"e":9098,"lib":"AffineConstructive.theory.set","name":"tensor_to_prod","kind":"def","local":false,"page":"../../theory/set.html"},{"s":9136,"e":9164,"lib":"AffineConstructive.topology.unif_born.product","name":"tensor_to_prod_unif_born_mor","kind":"thm","local":true},{"s":1017,"e":1020,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":1591,"e":1594,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2171,"e":2174,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2747,"e":2750,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3307,"e":3310,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3749,"e":3752,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4206,"e":4209,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4660,"e":4663,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5116,"e":5119,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5471,"e":5474,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5812,"e":5815,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":6193,"e":6196,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":6543,"e":6546,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":6947,"e":6950,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7620,"e":7623,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7727,"e":7730,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8278,"e":8281,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8624,"e":8627,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9025,"e":9028,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"This file shows that the structure maps of the tensor product X ⊗ Y and the cartesian product X × Y respect spaces that carry both a uniformity and a bornology. On the tensor side, f ⊗ g keeps each of the classes of its factors: morphism, reflecting, initial and embedding. The unitors, the symmetry and the associators are embeddings, and the two projections and the comparison X ⊗ Y ⇾ X × Y are morphisms. On the cartesian side, f × g keeps the same four classes, and the pairing and the projections are morphisms. Each statement combines the matching facts for uniform spaces (`uniform/product.v`) with those for bornologies (`bornology/product.v`), so every proof is one split into the two halves, which resolution then finds. The hints make these facts available automatically wherever a product map comes up.","short":"Product maps of uniform spaces with bornologies: tensor and cartesian structure maps","items":[{"name":"AffineConstructive.topology.unif_born.product.tensor_map_unif_born_mor","base":"tensor_map_unif_born_mor","kind":"prf","start":15,"body":[16,18],"status":"ok","short":{"text":"The tensor product f ⊗ g of two uniform-bornological morphisms is a uniform-bornological morphism","status":"ok"},"proof":[{"text":"A uniform-bornological morphism is a map that is both uniformly continuous and bornological, so the proof splits into these two halves. Both are the tensor-product facts for each structure taken separately: [[AffineConstructive.topology.uniform.product.tensor_map_ufm_cont]] for the uniformity and [[AffineConstructive.topology.bornology.product.tensor_map_bornological]] for the bornology.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_map_unif_born_reflecting","base":"tensor_map_unif_born_reflecting","kind":"prf","start":21,"body":[22,24],"status":"ok","short":{"text":"The tensor product f ⊗ g of two uniformly and bornologically reflecting maps is reflecting in both","status":"ok"},"proof":[{"text":"Reflecting for both structures means reflecting for the uniformity and reflecting for the bornology, and the proof splits into these two. Each half is the corresponding fact for one structure alone, [[AffineConstructive.topology.uniform.product.tensor_map_ufm_refl]] and [[AffineConstructive.topology.bornology.product.tensor_map_bornology_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_map_unif_born_initial","base":"tensor_map_unif_born_initial","kind":"prf","start":27,"body":[28,30],"status":"ok","short":{"text":"The tensor product f ⊗ g of two uniform-bornological initial maps is initial","status":"ok"},"proof":[{"text":"An initial map is a morphism that is also reflecting, so the proof splits into these two. Both halves were proved above for tensor products, [[AffineConstructive.topology.unif_born.product.tensor_map_unif_born_mor]] and [[AffineConstructive.topology.unif_born.product.tensor_map_unif_born_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_map_unif_born_embedding","base":"tensor_map_unif_born_embedding","kind":"prf","start":33,"body":[34,36],"status":"ok","short":{"text":"The tensor product f ⊗ g of two uniform-bornological embeddings is an embedding","status":"ok"},"proof":[{"text":"An embedding is an injective initial map, so the proof splits into two parts. f ⊗ g is initial by [[AffineConstructive.topology.unif_born.product.tensor_map_unif_born_initial]], and it is injective because both factors are, by [[AffineConstructive.theory.set.tensor_map_injective]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.to_prod_unif_born_mor","base":"to_prod_unif_born_mor","kind":"prf","start":39,"body":[40,42],"status":"ok","short":{"text":"The pairing X ⇾ Y₁ × Y₂ of two uniform-bornological morphisms is a uniform-bornological morphism","status":"ok"},"proof":[{"text":"The proof splits into uniform continuity and boundedness of the pairing into Y₁ × Y₂. These are the facts for the cartesian product of uniform spaces, [[AffineConstructive.topology.uniform.product.to_prod_ufm_cont]], and of bornologies, [[AffineConstructive.topology.bornology.product.to_prod_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.prod_map_unif_born_mor","base":"prod_map_unif_born_mor","kind":"prf","start":44,"body":[45,47],"status":"ok","short":{"text":"The cartesian product f × g of two uniform-bornological morphisms is a uniform-bornological morphism","status":"ok"},"proof":[{"text":"The proof splits into the two halves of a uniform-bornological morphism. f × g is uniformly continuous by [[AffineConstructive.topology.uniform.product.prod_map_ufm_cont]] and bornological by [[AffineConstructive.topology.bornology.product.prod_map_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.prod_map_unif_born_reflecting","base":"prod_map_unif_born_reflecting","kind":"prf","start":49,"body":[50,52],"status":"ok","short":{"text":"The cartesian product f × g of two uniformly and bornologically reflecting maps is reflecting in both","status":"ok"},"proof":[{"text":"The proof splits into reflecting the uniformity and reflecting the bornology. For the cartesian product these are [[AffineConstructive.topology.uniform.product.prod_map_ufm_refl]] and [[AffineConstructive.topology.bornology.product.prod_map_bornology_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.prod_map_unif_born_initial","base":"prod_map_unif_born_initial","kind":"prf","start":54,"body":[55,57],"status":"ok","short":{"text":"The cartesian product f × g of two uniform-bornological initial maps is initial","status":"ok"},"proof":[{"text":"An initial map is a morphism that is also reflecting. For f × g, both halves were proved above, [[AffineConstructive.topology.unif_born.product.prod_map_unif_born_mor]] and [[AffineConstructive.topology.unif_born.product.prod_map_unif_born_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.prod_map_unif_born_embedding","base":"prod_map_unif_born_embedding","kind":"prf","start":59,"body":[60,62],"status":"ok","short":{"text":"The cartesian product f × g of two uniform-bornological embeddings is an embedding","status":"ok"},"proof":[{"text":"An embedding is an injective initial map. f × g is initial by [[AffineConstructive.topology.unif_born.product.prod_map_unif_born_initial]], and it is injective because f and g are, by [[AffineConstructive.theory.set.prod_map_injective]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.prod_proj1_unif_born_mor","base":"prod_proj1_unif_born_mor","kind":"prf","start":64,"body":[65,67],"status":"ok","short":{"text":"The first projection X × Y ⇾ X is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"The proof splits into uniform continuity and boundedness of the first projection. These are the facts for each structure separately, [[AffineConstructive.topology.uniform.product.prod_proj1_ufm_cont]] and [[AffineConstructive.topology.bornology.product.prod_proj1_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.prod_proj2_unif_born_mor","base":"prod_proj2_unif_born_mor","kind":"prf","start":69,"body":[70,72],"status":"ok","short":{"text":"The second projection X × Y ⇾ Y is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"A morphism of uniform-bornological spaces is a map that is uniformly continuous and bornological, so the proof splits into these two conditions. The second projection out of X × Y is uniformly continuous by [[AffineConstructive.topology.uniform.product.prod_proj2_ufm_cont]] and bornological by [[AffineConstructive.topology.bornology.product.prod_proj2_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_unit_l_unif_born_emb","base":"tensor_unit_l_unif_born_emb","kind":"prf","start":74,"body":[75,77],"status":"ok","short":{"text":"The left unitor 𝟏 ⊗ X ⇾ X is a uniform-bornological embedding","status":"ok"},"proof":[{"text":"An embedding of uniform-bornological spaces is a map that is a uniform embedding, bornologically initial and injective, so the proof splits into these conditions. The left unitor 𝟏 ⊗ X ⇾ X is a uniform embedding by [[AffineConstructive.topology.uniform.product.tensor_unit_l_emb]], bornologically initial by [[AffineConstructive.topology.bornology.product.tensor_unit_l_bornology_initial]], and a bijection by [[AffineConstructive.theory.set.tensor_unit_l_bijective]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_unit_r_unif_born_emb","base":"tensor_unit_r_unif_born_emb","kind":"prf","start":79,"body":[80,82],"status":"ok","short":{"text":"The right unitor X ⊗ 𝟏 ⇾ X is a uniform-bornological embedding","status":"ok"},"proof":[{"text":"An embedding of uniform-bornological spaces is a map that is a uniform embedding, bornologically initial and injective, so the proof splits into these conditions. The right unitor X ⊗ 𝟏 ⇾ X is a uniform embedding by [[AffineConstructive.topology.uniform.product.tensor_unit_r_emb]], bornologically initial by [[AffineConstructive.topology.bornology.product.tensor_unit_r_bornology_initial]], and a bijection by [[AffineConstructive.theory.set.tensor_unit_r_bijective]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_swap_unif_born_emb","base":"tensor_swap_unif_born_emb","kind":"prf","start":84,"body":[85,87],"status":"ok","short":{"text":"The symmetry X ⊗ Y ⇾ Y ⊗ X is a uniform-bornological embedding","status":"ok"},"proof":[{"text":"The embedding condition splits into its uniform and its bornological halves. The symmetry X ⊗ Y ⇾ Y ⊗ X is a uniform embedding by [[AffineConstructive.topology.uniform.product.tensor_swap_ufm_emb]] and bornologically initial by [[AffineConstructive.topology.bornology.product.tensor_swap_bornology_initial]]; its uniform continuity and boundedness come along with these.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_assoc_l_unif_born_emb","base":"tensor_assoc_l_unif_born_emb","kind":"prf","start":96,"body":[97,99],"status":"ok","short":{"text":"The associator (X ⊗ Y) ⊗ Z ⇾ X ⊗ (Y ⊗ Z) is a uniform-bornological embedding","status":"ok"},"proof":[{"text":"The embedding condition splits into its uniform and its bornological halves. The associator (X ⊗ Y) ⊗ Z ⇾ X ⊗ (Y ⊗ Z) is a uniform embedding by [[AffineConstructive.topology.uniform.product.tensor_assoc_l_ufm_emb]] and bornologically initial by [[AffineConstructive.topology.bornology.product.tensor_assoc_l_bornology_initial]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_assoc_r_unif_born_emb","base":"tensor_assoc_r_unif_born_emb","kind":"prf","start":100,"body":[101,103],"status":"ok","short":{"text":"The associator X ⊗ (Y ⊗ Z) ⇾ (X ⊗ Y) ⊗ Z is a uniform-bornological embedding","status":"ok"},"proof":[{"text":"The embedding condition splits into its uniform and its bornological halves. The associator X ⊗ (Y ⊗ Z) ⇾ (X ⊗ Y) ⊗ Z is a uniform embedding by [[AffineConstructive.topology.uniform.product.tensor_assoc_r_ufm_emb]] and bornologically initial by [[AffineConstructive.topology.bornology.product.tensor_assoc_r_bornology_initial]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_proj1_unif_born_mor","base":"tensor_proj1_unif_born_mor","kind":"prf","start":107,"body":[108,110],"status":"ok","short":{"text":"The first projection X ⊗ Y ⇾ X is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"Being a morphism splits into uniform continuity and boundedness. The first projection X ⊗ Y ⇾ X is uniformly continuous by [[AffineConstructive.topology.uniform.product.tensor_proj1_ufm_cont]] and bornological by [[AffineConstructive.topology.bornology.product.tensor_proj1_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_proj2_unif_born_mor","base":"tensor_proj2_unif_born_mor","kind":"prf","start":112,"body":[113,115],"status":"ok","short":{"text":"The second projection X ⊗ Y ⇾ Y is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"Being a morphism splits into uniform continuity and boundedness. The second projection X ⊗ Y ⇾ Y is uniformly continuous by [[AffineConstructive.topology.uniform.product.tensor_proj2_ufm_cont]] and bornological by [[AffineConstructive.topology.bornology.product.tensor_proj2_bornological]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.product.tensor_to_prod_unif_born_mor","base":"tensor_to_prod_unif_born_mor","kind":"prf","start":117,"body":[118,120],"status":"ok","short":{"text":"The comparison X ⊗ Y ⇾ X × Y is uniformly continuous and bornological","status":"ok"},"proof":[{"text":"Being a morphism splits into uniform continuity and boundedness. The comparison X ⊗ Y ⇾ X × Y is uniformly continuous by [[AffineConstructive.topology.uniform.product.tensor_to_prod_ufm_cont]] and bornological by [[AffineConstructive.topology.bornology.product.tensor_to_prod_bornological]].","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment spaces, local morphisms, local completions","summary":"The file sets up uniform spaces that also carry a bornology. It starts from the bare pairing [[UnifBornSpace]], with no axiom relating the two structures, adds the thickening axiom [[UniformlyOpenBornology]] to obtain the well-containment uniform spaces [[WCUnifSpace]] and their regular variant [[RegularWCUnifSpace]], and defines the well-containment relation K ⋐ S. It then gives product certificates and the morphism classes, forward, reflecting, initial and embedding, both in the global form (uniform and bornological at once) and in the local form, where uniform continuity or reflection is asked only near bounded sets ([[LocalUniformContinuity]], [[LocalUniformReflection]]). It ends with the interface of a local completion, [[LocalCompletion]], and of a locally complete space, which the localization and the trapped completion later realise."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"../uniform/base.html","short":"Uniform spaces: closeness, thickening, induced topology, separation and the uniform reflection pair","summary":"This file develops the basic theory of uniform spaces. The uniformity of a uniform space is a sublattice of relations that is closed under composition and inversion. The file proves the elementary laws of closeness: reflexivity, symmetric splitting into two through six factors, and composition of close pairs. It also proves the laws of thickening, including the swap of a thickening across a complement. Every uniform space carries an induced topology, in which a separated space is Hausdorff and a regular space is strong. Interior, closure and density are described through entourages. The forward, reflecting, initial and embedding classes of maps are closed under composition, pass to their topological counterparts, and make 𝐔𝐧𝐢𝐟 a reflection pair with a morphism to the topological reflection pair 𝐀𝐓𝐨𝐩. The file ends with lemmas on images and preimages of thickenings and on dense maps, which the subspace, completion and bornology files use."},"AffineConstructive.topology.uniform.basis":{"page":"../uniform/basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.uniform.product":{"page":"../uniform/product.html","short":"Cartesian and tensor product uniformities, their structure maps, and dense-extension criteria","summary":"The file builds the cartesian and tensor product uniformities from their presentations by basic entourages, and shows that each makes the product a uniform space. Basic entourages of X × Y combine U-closeness of first coordinates and V-closeness of second coordinates additively. Those of X ⊗ Y combine them by the tensor. For the cartesian product it proves that the projections are uniformly continuous and that a map into the product is uniformly continuous when both of its components are. It also shows that the induced topology is the cartesian product topology and that a product of separated spaces is separated. For the tensor product it shows that the induced topology is the tensor product topology, and that the unitors, the symmetry and the associators are uniform embeddings. On both products, maps of factors that are uniformly continuous, reflecting, initial or embeddings give product maps of the same kind. The last section, on relations in the tensor square, describes the interior and closure of an entourage by thickening and derives the dense-extension criteria [[ufm_dense_reflecting]] and [[ufm_dense_continuous]]."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.bornology.basis":{"page":"../bornology/basis.html","short":"Bornologies presented by bases, basis criteria for maps, the trivial bornology","summary":"This file builds bornologies from bases and gives criteria stated in terms of bases. [[presented_bornology]] turns any family of subsets into the bornology it generates downward. [[presented_bornological_space]] shows that this bornology satisfies the axioms of a bornological space when the family is order-preserving on an up-directed index set and covers every point. Conversely, a basis of a bornological space covers the points, has an inhabited index set and is up-directed. [[born_by_basis]] and [[bornology_refl_by_basis]] check that a map is bornological, or bornology-reflecting, by checking basis sets only. The file then treats the trivial bornology, in which every subset is bounded, and shows that maps out of the empty set, maps into the one-point set and constant maps are bornological; every bornology on the one-point set is trivial."},"AffineConstructive.topology.bornology.product":{"page":"../bornology/product.html","short":"Tensor and cartesian product bornologies, their bases, and the bornological structure maps","summary":"The file equips the tensor product X ⊗ Y and the cartesian product X × Y of two bornological spaces with their canonical product bornologies, [[tensor_product_bornology]] and [[cartesian_product_bornology]], each the bornology presented by the rectangles of bounded sets, and shows that bases of the factors give bases of the products. For the cartesian product it proves that the projections are bornological and that a map into X × Y is bornological as soon as its two components are ([[cartesian_product_bornology_initial]]), so pairing and the product of maps preserve bornological, reflecting and initial maps. For the tensor product it proves the same for the tensor of maps, and that the unitors, the symmetry and the associators are bornologically initial; the tensor projections and the comparison X ⊗ Y ⇾ X × Y are then bornological, being composites of these. It builds on the presentations and basis criteria of the bornology base and basis files."},"AffineConstructive.topology.unif_born.base":{"page":"base.html","short":"Uniform spaces with bornologies: maps, their reflection pair, transport of well-containment","summary":"The file sets up the category of sets carrying both a uniformity and a bornology, with no axiom linking the two. It shows that the four classes of maps (uniformly continuous and bornological, reflecting, initial, embedding) respect equality of functions, contain identities, compose, and satisfy the cancellation laws. It packages them as the reflection pair [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], with pair morphisms to uniform spaces, bornological spaces and topological spaces, and from it derives that inverses swap the forward and reflecting classes. Its main result, [[wcunif_transport]], pulls the well-containment axiom back along a uniformly continuous, bornological and bornology-reflecting map. The subspace and localization files use it."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

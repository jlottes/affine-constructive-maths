"AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.uniform interfaces.bornology interfaces.unif_born interfaces.reflection_pair.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices orders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.topology uniform.base bornology.base unif_born.base.\nRequire Import uniform.subspace bornology.subspace bornology.basis.\nRequire Import reflection_pair.base.\nRequire Import easy rewrite replc simplify tactics.misc.\n\nImport image_notation.\nImport thicken_notation.\nImport tensor_map_notation.\nLocal Open Scope subset_scope.\nLocal Open Scope topology_scope.\n\nLocal Notation \"f ♯\" := (⟨f,f⟩*) (at level 1, left associativity, format \"f ♯\").\n\n(** Initial (pullback) unif-bornological structure: [UnifBorn] is the fiber\n    product [Unif ×_Set PreBorn] over the carrier — no connecting axioms — so the\n    initial lift is just the pair [(pullback_uniformity f, pullback_bornology f)]. *)\n\nSection pullback_unif_born.\n  Universes u.\n  Context {X:set@{u}} `{Ψ:Uniformity@{u} Y} `{ℬ:Bornology@{u} Y} {f:X ⇾ Y}\n          `{!UniformSpace Y, !BornologicalSpace Y}.\n  #[local] Hint Extern 0 (Uniformity X) => exact (pullback_uniformity f) : typeclass_instances.\n  #[local] Hint Extern 0 (Bornology X) => exact (pullback_bornology f) : typeclass_instances.\n\n  Local Instance pullback_unif_born_space : UnifBornSpace X.\n  Proof. now split. Qed.\n\n  Local Instance pullback_unif_born_initial : UnifBornInitial f.\n  Proof. enough (UniformlyInitial f ∧ BornologyInitial f)%sprop as [??] by now split. split.\n  + exact pullback_map_initial.\n  + exact pullback_born_initial.\n  Qed.\nEnd pullback_unif_born.\n#[global] Hint Extern 2 (@UnifBornSpace _ (pullback_uniformity _) (pullback_bornology _)) =>\n  simple notypeclasses refine pullback_unif_born_space : typeclass_instances.\n\n\n#[global] Hint Extern 0 (Cleavage 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact (λ X Y '(Ψ, ℬ) f, (pullback_uniformity f, pullback_bornology f)) : typeclass_instances.\n\nLemma unifborn_cloven_pair : ClovenPair 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧.\nProof. unshelve esplit. intros. exact pullback_unif_born_initial. Qed.\n#[global] Hint Extern 0 (ClovenPair 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact unifborn_cloven_pair : typeclass_instances.\n#[global] Hint Extern 0 (SaturatedPair 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) => exact unifborn_cloven_pair : typeclass_instances.\n\nLemma unif_born_initial_alt@{u} `{@UnifBornSpace@{u} X Φ 𝒜, @UnifBornSpace@{u} Y Ψ ℬ} (f:X ⇾ Y)\n  : UnifBornInitial f ↔\n    (∀ (Z:set@{u}) (Θ:Uniformity Z) (𝒞:Bornology Z), UnifBornSpace Z → ∀ (g:Z ⇾ X),\n       UnifBornMorphism (f ∘ g) ↔ UnifBornMorphism g).\nProof. change (UnifBornInitial f) with (Ini 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 f). rew (ini_lift_alt (C:=𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) f). split.\n+ intros P Z Θ 𝒞 ? g. exact (P Z (Θ, 𝒞) _ g).\n+ intros P Z [Θ 𝒞] ? g. exact (P Z Θ 𝒞 _ g).\nQed.\n\n\n(** The WCUnif thickening axiom survives pullback: the pullback of a\n    [WCUnifSpace] is a [WCUnifSpace]. *)\nSection pullback_wcunif.\n  Universes u.\n  Context {X:set@{u}} `{Ψ:Uniformity@{u} Y} `{ℬ:Bornology@{u} Y} {f:X ⇾ Y} `{!WCUnifSpace Y}.\n  #[local] Hint Extern 0 (Uniformity X) => exact (pullback_uniformity f) : typeclass_instances.\n  #[local] Hint Extern 0 (Bornology X) => exact (pullback_bornology f) : typeclass_instances.\n\n  Local Instance pullback_wc_unif_space : WCUnifSpace X.\n  Proof. pose proof (pullback_unif_born_initial (f:=f)). exact (wcunif_transport f). Qed.\nEnd pullback_wcunif.\n#[global] Hint Extern 2 (@WCUnifSpace _ (pullback_uniformity _) (pullback_bornology _)) =>\n  simple notypeclasses refine pullback_wc_unif_space : typeclass_instances.\n\n(** Subspaces A ∊ 𝒫 X are the instance f = from_subset A: carrier-keyed\n    companions of the slot-keyed hints above, filling the instance slots\n    (mirroring [uniform/subspace.v] and [bornology/subspace.v]). *)\n#[global] Hint Extern 4 (UnifBornSpace (subset_to_set ?A)) =>\n  notypeclasses refine (pullback_unif_born_space (f:=from_subset A)) : typeclass_instances.\n#[global] Hint Extern 4 (WCUnifSpace (subset_to_set ?A)) =>\n  notypeclasses refine (pullback_wc_unif_space (f:=from_subset A)) : typeclass_instances.\n\n(** The AHS initial-morphism characterization survives restriction to the WCUnif\n    subcategory: for [f] between [WCUnifSpace]s, [UnifBornInitial f] is detected\n    by WCUnif test objects alone — because the initial (pullback) structure is\n    itself a [WCUnifSpace] ([pullback_wc_unif_space]).  So WCUnif is closed under\n    the UnifBorn-initial lifts. *)\nLemma wcunif_initial_alt@{u} `{@WCUnifSpace@{u} X Φ 𝒜, @WCUnifSpace@{u} Y Ψ ℬ} (f:X ⇾ Y)\n  : UnifBornInitial f ↔\n    (∀ (Z:set@{u}) (Θ:Uniformity Z) (𝒞:Bornology Z), WCUnifSpace Z → ∀ (g:Z ⇾ X),\n       UnifBornMorphism (f ∘ g) ↔ UnifBornMorphism g).\nProof.\n  change (UnifBornInitial f) with (Ini 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧 f).\n  pose proof (ini_lift_alt_restrict (C:=𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧) (λ Z '(Θ,𝒞), @WCUnifSpace Z Θ 𝒞)\n        (λ S Z u '(Θ,𝒞) HZ HW, pullback_wc_unif_space) f H H0) as E.\n  rew E.\n  split.\n+ intros P Z Θ 𝒞 HW g. exact (P Z (Θ, 𝒞) _ HW g).\n+ intros P Z [Θ 𝒞] ? HW g. exact (P Z Θ 𝒞 HW g).\nQed.\n\nLemma from_subset_unif_born_emb `{@UnifBornSpace X Φ 𝒜} {A:𝒫 X} : UnifBornEmbedding (from_subset A).\nProof. repeat (split; try exact _). Qed.\n#[global] Hint Extern 2 (UnifBornMorphism   (from_subset _)) => simple notypeclasses refine from_subset_unif_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornReflecting (from_subset _)) => simple notypeclasses refine from_subset_unif_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornInitial    (from_subset _)) => simple notypeclasses refine from_subset_unif_born_emb : typeclass_instances.\n#[global] Hint Extern 2 (UnifBornEmbedding  (from_subset _)) => simple notypeclasses refine from_subset_unif_born_emb : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":26,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":5,"s":242,"e":345,"kind":"vernac","status":"ok","ms":40,"messages":[],"goals":null},{"i":6,"s":346,"e":442,"kind":"vernac","status":"ok","ms":17,"messages":[],"goals":null},{"i":7,"s":443,"e":479,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":480,"e":565,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":9,"s":566,"e":642,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":10,"s":643,"e":710,"kind":"vernac","sta "local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file gives the initial, or pullback, structure for uniform spaces with bornologies. A uniform space with a bornology has no axiom linking its two components, so the initial structure along f : X ⇾ Y is the pair made of the pullback uniformity and the pullback bornology, and f is initial for it. Pullback therefore serves as the cleavage of the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]] ([[AffineConstructive.topology.unif_born.subspace.unifborn_cloven_pair]]), and initial maps are characterised by testing against all maps from other uniform spaces with bornologies ([[AffineConstructive.topology.unif_born.subspace.unif_born_initial_alt]]). The well-containment axiom survives pullback ([[AffineConstructive.topology.unif_born.subspace.pullback_wc_unif_space]]), so the same test can be restricted to well-containment spaces ([[AffineConstructive.topology.unif_born.subspace.wcunif_initial_alt]]). Taking f to be a subset inclusion gives the subspace structure, and the inclusion is an embedding ([[AffineConstructive.topology.unif_born.subspace.from_subset_unif_born_emb]]). The file builds on the uniform and bornological subspace files.","short":"Pullbacks and subspaces of uniform spaces with bornologies, and well-containment spaces","items":[{"name":"AffineConstructive.topology.unif_born.subspace.pullback_unif_born_space","base":"pullback_unif_born_space","kind":"inst","start":24,"body":[25,27],"status":"ok","short":{"text":"The pullback uniformity and bornology along f : X ⇾ Y make X a uniform space with a bornology","status":"ok"},"proof":[{"text":"A uniform space with a bornology has no axiom linking its two components. It is therefore enough that the pullback uniformity satisfies the uniform space axioms ([[AffineConstructive.topology.uniform.subspace.pullback_uniform_space]]) and that the pullback bornology satisfies the bornology axioms ([[AffineConstructive.topology.bornology.subspace.pullback_bornological_space]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.subspace.pullback_unif_born_initial","base":"pullback_unif_born_initial","kind":"inst","start":28,"body":[29,36],"status":"ok","short":{"text":"A map f is initial for the pullback uniformity and bornology on its domain","status":"ok"},"proof":[{"text":"Initiality for the pair is initiality for each component. So it is enough to show that f is uniformly initial and that f is bornologically initial, and the two are proved separately.","status":"ok","from":0,"to":2},{"text":"For the pullback uniformity, f is uniformly initial by [[AffineConstructive.topology.uniform.subspace.pullback_map_initial]].","status":"ok","from":3,"to":4},{"text":"For the pullback bornology, f is bornologically initial by [[AffineConstructive.topology.bornology.subspace.pullback_born_initial]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.unif_born.subspace.unifborn_cloven_pair","base":"unifborn_cloven_pair","kind":"prf","start":40,"body":[41,45],"status":"ok","short":{"text":"Uniform spaces with bornologies form a cloven reflection pair, with pullback as the cleavage","status":"ok"},"proof":[{"text":"A cleavage chooses, for each map u : S ⇾ Z into an object, a structure on S that makes u initial. The choice is the pullback uniformity and bornology. What remains is to show that u is initial for that structure.","status":"ok","from":0,"to":1},{"text":"Take S, Z, the map u and the structure on Z. Then u is initial for the pullback structure by [[AffineConstructive.topology.unif_born.subspace.pullback_unif_born_initial]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.unif_born.subspace.unif_born_initial_alt","base":"unif_born_initial_alt","kind":"prf","start":48,"body":[49,59],"status":"ok","short":{"text":"f is initial iff, for every g into X from a uniform space with a bornology, f ∘ g is a morphism iff g is","status":"ok"},"proof":[{"text":"Read initiality as initiality in the reflection pair [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]. Since the pair is cloven ([[AffineConstructive.topology.unif_born.subspace.unifborn_cloven_pair]]), [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt]] characterises f as initial exactly when, for every map g from an object, f ∘ g is a morphism if and only if g is. The two sides of the remaining equivalence state the same test. They differ only in how the structure on the test space is presented: as a single pair, or as a uniformity and a bornology given separately.","status":"ok","from":0,"to":2},{"text":"In the forward direction, fix Z with uniformity Θ and bornology 𝒞, and a map g : Z ⇾ X. The hypothesis applies to Z with the pair (Θ, 𝒞) and to g.","status":"ok","from":3,"to":6},{"text":"In the converse direction, the structure on the test space S is a pair, which splits into a uniformity Θ and a bornology 𝒞. The hypothesis applies to Z, Θ, 𝒞 and g.","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.topology.unif_born.subspace.pullback_wc_unif_space","base":"pullback_wc_unif_space","kind":"inst","start":65,"body":[66,69],"status":"ok","short":{"text":"The pullback of a well-containment uniform space along any map is a well-containment uniform space","status":"ok"},"proof":[{"text":"With the pullback structure on X, f is initial by [[AffineConstructive.topology.unif_born.subspace.pullback_unif_born_initial]]. In particular f is a morphism that reflects boundedness.","status":"ok","from":0,"to":1},{"text":"A space that maps into a well-containment space by a morphism reflecting boundedness is itself a well-containment space ([[AffineConstructive.topology.unif_born.base.wcunif_transport]]). Since Y is a well-containment space, so is X.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.subspace.wcunif_initial_alt","base":"wcunif_initial_alt","kind":"prf","start":74,"body":[75,86],"status":"ok","short":{"text":"Between well-containment spaces, f is initial iff, for every g from a well-containment space, f ∘ g is a morphism iff g is","status":"ok"},"proof":[{"text":"Read initiality as initiality in [[AffineConstructive.topology.unif_born.base.𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]]. The well-containment structures form a class that is closed under pullback by [[AffineConstructive.topology.unif_born.subspace.pullback_wc_unif_space]], and X and Y belong to it. So [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt_restrict]] characterises f as initial exactly when the test holds against maps from well-containment objects alone.","status":"ok","from":0,"to":2},{"text":"Replace initiality by this restricted test. The two sides of the remaining equivalence state the same test, with the structure on the test space presented either as a pair or as two separate components.","status":"ok","from":3,"to":3},{"text":"In the forward direction, fix a well-containment space Z with uniformity Θ and bornology 𝒞, and a map g : Z ⇾ X. The hypothesis applies to Z with the pair (Θ, 𝒞) and to g.","status":"ok","from":4,"to":7},{"text":"In the converse direction, split the structure on the test space into its uniformity Θ and bornology 𝒞. The hypothesis applies to Z, Θ, 𝒞, the well-containment property and g.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.topology.unif_born.subspace.from_subset_unif_born_emb","base":"from_subset_unif_born_emb","kind":"prf","start":87,"body":[88,90],"status":"ok","short":{"text":"The inclusion of a subset, with the subspace uniformity and bornology, is an embedding","status":"ok"},"proof":[{"text":"An embedding is an injective map that is initial for both components. The inclusion is a uniform embedding ([[AffineConstructive.topology.uniform.subspace.from_subset_emb]]) and a bornological embedding ([[AffineConstructive.topology.bornology.subspace.from_subset_born_emb]]), and it is injective ([[AffineConstructive.interfaces.subset.from_subset_injective]]).","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, uniformly continuous and reflecting maps, Cauchy filters, completions","summary":"The file sets up the basic notions of uniform spaces. A uniformity on X is a set of entourages, which are subsets of X ⊗ X. Points x and y are U-close when (x, y) ∊ U. A uniform space is a uniformity that is a filter and satisfies three axioms: reflexivity, symmetry, and splitting (each entourage contains some V ⋄ V). Stronger variants are a splitting with the additive conjunction, separation, and regularity. The uniformity induces a neighbourhood relation. The file then defines the following maps: uniformly continuous and uniformly reflecting maps, uniformly initial maps (both at once), and uniform embeddings. It also defines presentations of the tensor and cartesian product uniformities and of the discrete and indiscrete uniformities, the thickening U.[A] with the relation K ◁ S, and Cauchy filters. Finally it states the universal property of a completion: a separated space Y with a uniformly initial dense map ι from X, such that any uniformly initial dense f : X → Z has a uniformly continuous extension Z → Y with composite ι. The Cauchy completion and the bornological files build on these interfaces."},"AffineConstructive.topology.interfaces.bornology":{"page":"../interfaces/bornology.html","short":"Bornologies, bornological spaces, presentations, products, and bornological and reflecting maps","summary":"The file sets up bornologies. A bornology on a set X is a set of subsets of X, the bounded sets, and a bornological space is one whose bounded sets form an ideal of subsets that contains every singleton. Presentations and bases of a bornology are the ideal presentations and bases of the order interfaces, read for subsets. The file also defines the trivial bornology, a regularity condition, and the tensor and cartesian product bornologies, each specified by its presentation through rectangles. It then gives the classes of maps: bornological maps (images of bounded sets are bounded), bornology-reflecting maps (preimages of bounded sets are bounded), initial maps and embeddings. Bases and products are developed in the bornology files, and these notions join the uniform structure in the well-containment spaces and in localization."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment axioms, global and local morphisms, local completions","summary":"The interface for sets carrying both a uniformity and a bornology. It sets up the chassis [[UnifBornSpace]], with no axiom linking the two structures, and then the linking axioms: [[UniformlyOpenBornology]] (bounded sets have bounded uniform thickenings), which defines the well-containment uniform spaces [[WCUnifSpace]] and their regular form [[RegularWCUnifSpace]], [[ClosedBornology]], and the well-containment relation [[well_contained]]. It defines the morphism classes in two flavours. The global ones ([[UnifBornMorphism]], [[GlobalWCUnifInitial]], …) are uniformly continuous and bornological everywhere. The local ones are built on [[LocalUniformContinuity]] and [[LocalUniformReflection]], uniform control near bounded sets, and run up to [[WCUnifMorphism]] and [[WCUnifEmbedding]]. The file closes with the universal property of a local completion, [[LocalCompletion]] and [[LocallyComplete]], and with the resolution hints that recover the codomain's structure from a morphism. The underlying structures come from the uniform and bornology interfaces; the theory, the trapped completion and localization are developed in the topology/unif_born files."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Interface for constructs and reflection pairs: fibres, forward and reflecting classes, cancellation laws","summary":"The file sets up the abstract interface for reflection pairs. A construct is a concrete category over affine sets: each set carries a fibre of candidate structures, some of which are objects, and the forward maps are the functions that respect the structures. The fibre over a set is ordered by comparing structures through the identity, and with equality as two-sided comparison it becomes a poset. Alongside the forward class come a reflecting class, the initial maps (forward and reflecting) and the embeddings (initial and injective). A reflection pair asks for the two classes to form constructs and to satisfy the two cancellation laws. Saturated pairs and cloven pairs refine this, pair morphisms compare two pairs over the same sets, the opposite of a pair swaps the forward and reflecting classes, and binary products are defined in a pair. The theory built on this interface is developed in the files under topology/reflection_pair."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"../uniform/base.html","short":"Uniform spaces: entourage algebra, thickenings, uniform topology, uniform maps, the reflection pair","summary":"The basic theory of uniform spaces. It equips a uniformity with its algebraic structure (a sublattice and sub-star-semigroup of relations), derives the splitting and symmetry consequences of the axioms and the composition laws for closeness, and develops thickenings U[A] of subsets: monotonicity, composition, singletons, and the swap law for a thickening apart from a set. The uniform topology is built from the entourages, with interior, closure and density described by entourages; separated uniform spaces are shown Hausdorff, and regular ones strong. For maps it characterises uniform continuity and reflection by preimages under f × f, introduces the pullback of entourages [[ufm_preimage]], proves closure under identity, composition and the cancellation laws, and assembles uniform spaces into the reflection pair [[𝐔𝐧𝐢𝐟]] with a morphism to topological spaces. It ends with thickening and closure estimates along dense and uniformly reflecting maps, used by the completion and trapped-completion files."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.unif_born.base":{"page":"base.html","short":"Uniform spaces with bornologies: map classes, reflection pairs, transport, closed bornologies","summary":"The basic theory of sets carrying both a uniformity and a bornology. The combined initial and embedding classes coerce to their uniform and bornological parts. Each map class, whether combined or global well-containment, respects equality of functions, contains the identities and is closed under composition, and the forward and reflecting classes satisfy the cancellation laws. From this the file builds two reflection pairs: 𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧, and its restriction 𝐖𝐂𝐔𝐧𝐢𝐟_gbl to well-containment uniform spaces with global maps. It also gives their pair morphisms to uniform, bornological and topological spaces, so the inverse of a bijection swaps the forward and reflecting classes. [[wcunif_transport]] shows that a space mapping into a well-containment space by a uniformly continuous, bornological and bornology-reflecting map is itself a well-containment space. The file ends by proving that the thickening axiom makes the bornology closed, and it packages the closure of bounded sets as [[born_closure]]."},"AffineConstructive.topology.uniform.subspace":{"page":"../uniform/subspace.html","short":"Pulled-back uniformities, uniformly initial maps, and uniform subspaces","summary":"The file pulls a uniformity back along a function f : X ⇾ Y: the entourages of X are the relations containing the preimage under f × f of an entourage of Y. This is presented by the preimages of the entourages, a basis of Y pulls back to a basis, and when Y is a uniform space so is X ([[pullback_uniform_space]]), with f uniformly initial, and a uniform embedding when f is injective. The universal property ([[pullback_uniformity_initial]]) makes the construction a cleavage of the reflection pair of uniform spaces ([[unif_cloven_pair]]), which gives the characterisations of uniformly initial maps by lifting ([[uniformly_initial_alt]], [[uniformly_initial_alt2]]). Subspaces are the case of the inclusion of a subset: the inclusion is a uniform embedding, a subspace of a separated space is separated, and a dense map restricted over an open subset stays dense ([[dense_open_restrict]])."},"AffineConstructive.topology.bornology.subspace":{"page":"../bornology/subspace.html","short":"Initial (pullback) bornologies along a map, subspace bornologies, and bornologies as a cloven reflection pair","summary":"The file builds the initial bornology along a map f : X ⇾ Y: the subsets of X whose image under f is bounded. It proves that this is a bornology, that f is bornological and bornologically initial for it, and installs it as the cleavage of the reflection pair of bornological spaces, which makes that pair cloven and saturated ([[born_cloven_pair]]). From the general theory of reflection pairs it obtains the characterisations of initial maps by cancellation against arbitrary maps g ([[bornology_initial_alt]], [[bornology_initial_alt2]]). Subspaces are the case of a subset's inclusion: that inclusion is a bornological embedding ([[from_subset_born_emb]]), and a bounded subset carries the trivial subspace bornology ([[bounded_pullback_bornology_trivial]]). This parallels the subspace construction for uniform spaces."},"AffineConstructive.topology.bornology.basis":{"page":"../bornology/basis.html","short":"Bornologies presented by bases, basis criteria for maps, the trivial bornology","summary":"This file builds bornologies from bases and gives criteria stated in terms of bases. [[presented_bornology]] turns any family of subsets into the bornology it generates downward. [[presented_bornological_space]] shows that this bornology satisfies the axioms of a bornological space when the family is order-preserving on an up-directed index set and covers every point. Conversely, a basis of a bornological space covers the points, has an inhabited index set and is up-directed. [[born_by_basis]] and [[bornology_refl_by_basis]] check that a map is bornological, or bornology-reflecting, by checking basis sets only. The file then treats the trivial bornology, in which every subset is bounded, and shows that maps out of the empty set, maps into the one-point set and constant maps are bornological; every bornology on the one-point set is trivial."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

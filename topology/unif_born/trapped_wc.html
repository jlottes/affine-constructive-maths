props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.unif_born.\nRequire Import theory.set orders.orders orders.maps orders.lattices orders.subset orders.closure orders.filters.\nRequire Import theory.subgroups.\nRequire Import topology.topology topology.uniform.base uniform.basis uniform.subspace.\nRequire Import uniform.cauchy_completion uniform.completion.\nRequire Import bornology.base.\nRequire Import unif_born.base unif_born.local_maps unif_born.localization unif_born.trapped_cauchy.\nRequire Import easy rewrite replc simplify strip_coercions.\n\nImport image_notation.\nImport tensor_map_notation.\n\nLocal Abbreviation id := (id_fun _).\nLocal Abbreviation ℒ := localization.\nLocal Abbreviation Λ := localized_uniformity.\nLocal Abbreviation ε := from_localization.\nLocal Abbreviation η := to_localization.\nLocal Abbreviation κ := to_cauchy.\nLocal Abbreviation 𝒞 := cauchy_filter_set.\nLocal Abbreviation 𝒞₁ := cauchy_map.\n\nLocal Abbreviation 𝒯 := trapped_cauchy_filter_set.\nLocal Abbreviation τ := to_trapped.\nLocal Abbreviation β := from_trapped.\nLocal Abbreviation 𝒯₁ := trapped_map.\n\n(** Local classes of [τ]: the global battery is in [trapped_cauchy], which does not see the\n    global-to-local coercions of [local_maps].  The local morphism classes hold outright;\n    the reflecting side needs a closed bornology, and the WCUnif classes the WC objects,\n    both supplied by well containment. *)\n#[global] Hint Extern 2 (LocallyUnifBorn            (τ _)) => simple notypeclasses refine to_trapped_unif_born : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (τ _)) => simple notypeclasses refine to_trapped_unif_born : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifMorphism             (τ _)) => simple notypeclasses refine to_trapped_wc_initial : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifInitial              (τ _)) => simple notypeclasses refine to_trapped_wc_initial : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting           (τ _)) => simple notypeclasses refine to_trapped_wc_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (τ _)) => simple notypeclasses refine to_trapped_wc_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (τ _)) => simple notypeclasses refine to_trapped_wc_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (τ _)) => simple notypeclasses refine to_trapped_wc_initial : typeclass_instances.\n\n(** Local classes of [𝒯₁] and [trapped_reflect], likewise: the WCUnif classes from the\n    [GlobalWCUnif] lemmas, the local classes from the weaker-hypothesis ones. *)\n#[global] Hint Extern 2 (WCUnifMorphism             (trapped_map ?f)) => simple notypeclasses refine (trapped_map_wcunif_mor (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (trapped_map ?f)) => simple notypeclasses refine (trapped_map_unif_born (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (trapped_map ?f)) => simple notypeclasses refine (trapped_map_unif_born (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifEmbedding            (trapped_map ?f)) => simple notypeclasses refine (trapped_map_wc_emb (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifInitial              (trapped_map ?f)) => simple notypeclasses refine (trapped_map_wc_emb (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting           (trapped_map ?f)) => simple notypeclasses refine (trapped_map_wc_emb (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornEmbedding   (trapped_map ?f)) => simple notypeclasses refine (trapped_map_emb (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (trapped_map ?f)) => simple notypeclasses refine (trapped_map_emb (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (trapped_map ?f)) => simple notypeclasses refine (trapped_map_emb (f:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (trapped_map ?f)) => simple notypeclasses refine (trapped_map_emb (f:=f)) : typeclass_instances.\n\n#[global] Hint Extern 2 (WCUnifMorphism             (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_wc_mor (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_bornological (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_bornological (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifEmbedding            (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_emb (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornEmbedding   (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_emb (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifInitial              (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_initial (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting           (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_initial (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_initial (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_initial (ι:=f)) : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (trapped_reflect ?f)) => simple notypeclasses refine (trapped_reflect_initial (ι:=f)) : typeclass_instances.\n\nLocal Open Scope topology_scope.\nLocal Open Scope sg_op_scope.\n\nLocal Notation \"f ♯\" := (⟨f,f⟩*) (at level 1, left associativity, format \"f ♯\").\nLocal Abbreviation π₁ := (tensor_proj1 _ _).\n\n#[local] Hint Extern 10 => match goal with\n|  |- context [ η ?X ∘ ε ?X ] => change (η X ∘ ε X) with (id_fun X)\n|  |- context [ ?f ∘ η ?X ∘ ε ?X ] => change (f ∘ η X ∘ ε X) with f\nend : typeclass_instances.\n\n\n(** ** The inverse of [𝒯₁ (ε X)]: a trapped Cauchy filter is Cauchy for the localized uniformity. *)\n\nSection localize_trapped.\n  Universes u.\n  Context `{@UnifBornSpace@{u} X Φ 𝒜}.\n  \n  Local Open Scope subset_scope.\n\n  Lemma trapped_localized_cauchy (F:𝒯 X) : CauchyFilter (X:=ℒ X) (trapped_filter F : 𝒫² X).\n  Proof. pose proof trapped_prop F as [K HK]. exact (cauchy_bounded_locally_cauchy (trapped_filter F) K). Qed.\n\n  Definition trapped_localize_pt (F:𝒯 X) : 𝒯 (ℒ X)\n    := {| trapped_filter := Build_cauchy_filter (ℒ X) _ (trapped_filter F : 𝒫² X) (trapped_localized_cauchy F)\n        ; trapped_prop := trapped_prop F |}.\n\n  Lemma trapped_localize_pt_is_fun : IsFun trapped_localize_pt.\n  Proof. intros F G.\n    change ((∏ U:Φ, ∐ (A:trapped_filter F) (B:trapped_filter G), A ⊗ B ⊆ U)\n        ⊸ (∏ V:Λ X, ∐ (A:trapped_filter F) (B:trapped_filter G), A ⊗ B ⊆ V)).\n    rew <-all_adj; intros V. pose proof trapped_prop F as [K HK].\n    pose proof local_entourage_tensor V K as [U HU]. rew (all_lb _ U).\n    rew <-aex_adj; intros A. rew <-aex_adj; intros B.\n    rew <-(aex_ub _ (to_subset (powerset_pt K) ⊓ A)), <-(aex_ub _ B).\n    exact (HU A B).\n  Qed.\n\n  Definition trapped_localize : 𝒯 X ⇾ 𝒯 (ℒ X) := @func_make _ _ _ trapped_localize_pt_is_fun.\nEnd localize_trapped.\nArguments trapped_localize X {_ _ _}.\n\nLocal Open Scope fun_inv_scope.\n\n#[global] Hint Extern 2 (Inverse (trapped_map (@from_localization ?X ?Φ ?𝒜))) => exact (@trapped_localize X Φ 𝒜 _) : typeclass_instances.\n#[global] Hint Extern 2 (Inverse (@trapped_localize ?X ?Φ ?𝒜 _)) => exact (𝒯₁ (@from_localization X Φ 𝒜)) : typeclass_instances.\n\nLemma trapped_localize_bijective `{@UnifBornSpace X Φ 𝒜} : Bijective (trapped_localize X).\nProof. now apply alt_Build_Bijective. Qed.\n#[global] Hint Extern 2 (Bijective  (trapped_localize _)) => simple notypeclasses refine trapped_localize_bijective : typeclass_instances.\n#[global] Hint Extern 2 (Injective  (trapped_localize _)) => simple notypeclasses refine trapped_localize_bijective : typeclass_instances.\n#[global] Hint Extern 2 (Surjective (trapped_localize _)) => simple notypeclasses refine trapped_localize_bijective : typeclass_instances.\n\nLemma trapped_localize_bijective_back `{@UnifBornSpace X Φ 𝒜} : Bijective (𝒯₁ (ε X)).\nProof. now change (Bijective (trapped_localize X)⁻¹). Qed.\n#[global] Hint Extern 2 (Bijective  (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_bijective_back : typeclass_instances.\n#[global] Hint Extern 2 (Injective  (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_bijective_back : typeclass_instances.\n#[global] Hint Extern 2 (Surjective (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_bijective_back : typeclass_instances.\n\nLemma trapped_localize_back_emb `{@WCUnifSpace X Φ 𝒜} : WCUnifEmbedding (𝒯₁ (ε X)).\nProof.\n  enough (LocallyUnifBornInitial (𝒯₁ (ε X))) by (repeat (split; try exact _)).\n  refine (dense_locally_initial (τ (ℒ X)) (𝒯₁ (ε X))); try exact _.\n  now rew trapped_map_unit.\nQed.\n#[global] Hint Extern 2 (WCUnifEmbedding  (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifInitial    (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifMorphism   (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornEmbedding   (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding      (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial        (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting     (trapped_map (from_localization _))) => simple notypeclasses refine trapped_localize_back_emb : typeclass_instances.\n\nLemma trapped_localize_emb `{@WCUnifSpace X Φ 𝒜} : WCUnifEmbedding (trapped_localize X).\nProof. now change (WCUnifEmbedding (𝒯₁ (ε X))⁻¹). Qed.\n#[global] Hint Extern 2 (WCUnifEmbedding            (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifInitial              (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifMorphism             (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting           (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornEmbedding   (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (Bornological               (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial           (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting        (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding      (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial        (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting     (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n#[global] Hint Extern 2 (Continuous                 (trapped_localize _)) => simple notypeclasses refine trapped_localize_emb : typeclass_instances.\n\n\n    \n(** ** The functor action. *)\n\nSection map.\n  Universes u.\n  Context `{@WCUnifMorphism@{u} X Y Φ Ψ 𝒜 ℬ f}.\n\n  Local Existing Instance wcunif_localize_domain.\n  #[local] Hint Extern 2 (UnifBornMorphism (_ ∘ ε _)) => simple notypeclasses refine (wcunif_localize_domain _) : typeclass_instances.\n\n  Definition wc_trapped_map : 𝒯 X ⇾ 𝒯 Y := 𝒯₁ (f ∘ ε X) ∘ (𝒯₁ (ε X))⁻¹ .\n  \n  Lemma wc_trapped_map_mor : WCUnifMorphism wc_trapped_map.\n  Proof. now unfold wc_trapped_map. Qed.\n\n  Lemma wc_trapped_map_unit : wc_trapped_map ∘ τ X = τ Y ∘ f.\n  Proof. change (𝒯₁ (f ∘ ε X) ∘ τ (ℒ X) ∘ η X = τ Y ∘ f). \n    now rew trapped_map_unit.\n  Qed.\n\n  Lemma wc_trapped_map_dense `{!Dense f} : Dense wc_trapped_map.\n  Proof. apply (Dense_factor_right (τ X)). now rew wc_trapped_map_unit. Qed. \nEnd map.\nArguments wc_trapped_map {_ _ _ _ _ _} f {_}.\nArguments wc_trapped_map_unit {_ _ _ _ _ _} f {_}.\nLocal Abbreviation 𝒯ₗ := wc_trapped_map.\n#[global] Hint Extern 2 (WCUnifMorphism             (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (Bornological               (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (Continuous                 (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (Dense (func_op (𝒯ₗ _))) => simple notypeclasses refine wc_trapped_map_dense : typeclass_instances.\n\nLemma wc_trapped_map_initial@{u} `{@WCUnifInitial@{u} X Y Φ Ψ 𝒜 ℬ f} : WCUnifInitial (𝒯ₗ f).\nProof. enough (LocallyUnifBornInitial (𝒯ₗ f)) by now split.\n    refine (dense_locally_initial (τ X) (𝒯ₗ f)); try exact _.\n    now rew (wc_trapped_map_unit f).\nQed.\n#[global] Hint Extern 2 (WCUnifInitial             (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial    (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial          (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting       (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial       (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting    (𝒯ₗ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n\nLemma wc_trapped_map_gbl@{u} `{@GlobalWCUnifMorphism@{u} X Y Φ Ψ 𝒜 ℬ f} : 𝒯ₗ f = 𝒯₁ f.\nProof. refl. Qed.\n\n(** ** The reflection. *)\n\nSection reflect.\n  Universes u.\n  Context `{@WCUnifReflecting@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}.\n  \n  Local Existing Instance  wcunif_localize_codomain_refl.\n  #[local] Hint Extern 2 (UnifBornReflecting (η _ ∘ _)) => simple notypeclasses refine (wcunif_localize_codomain_refl _) : typeclass_instances.\n\n  Definition wc_trapped_reflect : Z ⇾ 𝒯 X := trapped_reflect (Y:=ℒ Z) (η Z ∘ f) ∘ η Z.\n\n  Lemma wc_trapped_reflect_spec : wc_trapped_reflect ∘ f = τ X.\n  Proof. exact (trapped_reflect_spec (η Z ∘ f)). Qed.\n\n  Lemma wc_trapped_reflect_mor : WCUnifMorphism wc_trapped_reflect.\n  Proof. now unfold wc_trapped_reflect. Qed.\n\n  Lemma wc_trapped_reflect_dense : Dense wc_trapped_reflect.\n  Proof. now unfold wc_trapped_reflect. Qed.\nEnd reflect.\nArguments wc_trapped_reflect {_ _ _ _ _ _} f {_ _}.\nArguments wc_trapped_reflect_spec {_ _ _ _ _ _} f {_ _}.\n#[global] Hint Extern 2 (WCUnifMorphism             (wc_trapped_reflect _)) => simple notypeclasses refine wc_trapped_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (wc_trapped_reflect _)) => simple notypeclasses refine wc_trapped_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (wc_trapped_reflect _)) => simple notypeclasses refine wc_trapped_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (Bornological               (wc_trapped_reflect _)) => simple notypeclasses refine wc_trapped_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (Continuous                 (wc_trapped_reflect _)) => simple notypeclasses refine wc_trapped_reflect_mor : typeclass_instances.\n#[global] Hint Extern 2 (Dense (func_op (wc_trapped_reflect ?f))) => simple notypeclasses refine wc_trapped_reflect_dense : typeclass_instances.\n\nLemma wc_trapped_reflect_initial@{u} `{@WCUnifInitial@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}\n  : WCUnifInitial (wc_trapped_reflect f).\nProof. enough (LocallyUnifBornInitial (wc_trapped_reflect f)) by now split.\n  refine (dense_locally_initial f (wc_trapped_reflect f)); try exact _.\n  now rew (wc_trapped_reflect_spec f).\nQed.\n#[global] Hint Extern 2 (WCUnifInitial             (wc_trapped_reflect _)) => simple notypeclasses refine wc_trapped_reflect_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial    (wc_trapped_reflect _)) => simple notypeclasses refine wc_trapped_reflect_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting (wc_trapped_reflect _)) => simple notypeclasses refine wc_trapped_reflect_initial : typeclass_instances.\n#[globa pology.unif_born.trapped_wc","name":"τ","kind":"abbrev","local":true},{"s":22045,"e":22069,"lib":"AffineConstructive.topology.unif_born.trapped_wc","name":"trapped_local_completion","kind":"thm","local":true},{"s":7900,"e":7903,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8015,"e":8018,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8037,"e":8040,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8062,"e":8065,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8091,"e":8094,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8747,"e":8750,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9296,"e":9299,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":10070,"e":10073,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":10074,"e":10077,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12356,"e":12359,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15389,"e":15392,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15548,"e":15551,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15552,"e":15555,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":15690,"e":15693,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":15694,"e":15697,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":16814,"e":16817,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":16892,"e":16895,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":16896,"e":16899,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":17987,"e":17991,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":18611,"e":18614,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":18718,"e":18721,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":19979,"e":19982,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":20064,"e":20067,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":20068,"e":20071,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file states the trapped completion 𝒯 X of a well-containment uniform space in intrinsic terms, by passing the constructions of the file on trapped Cauchy filters through the localization ℒ once. A trapped Cauchy filter on X is also Cauchy for the localized uniformity. This gives [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]] : 𝒯 X ⇾ 𝒯 ℒ X, the inverse of 𝒯₁ (ε X), which is a bijection and an embedding of well-containment spaces. With it the file defines the functor action [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] on locally uniformly continuous morphisms and the reflection [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] of a dense, locally reflecting map. Both take hypotheses and give results in the local classes, so code that uses them need not mention ℒ. The file ends with [[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion]]: the unit τ X is a local completion. This also tests that the translation works as intended. Hints register the local classes of τ, 𝒯₁, the trapped reflection and the new maps for resolution.","short":"The trapped completion in intrinsic local terms: functor action, reflection, local completion","items":[{"name":"AffineConstructive.topology.unif_born.trapped_wc.id","base":"id","kind":"abbrev","start":15,"body":null,"status":"ok","short":{"text":"Local abbreviation for the identity function of a set, the set inferred","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.set.id_fun]], the identity function of a set, with the set left to be inferred from context. Nothing recorded uses it yet.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.ℒ","base":"ℒ","kind":"abbrev","start":16,"body":null,"status":"ok","short":{"text":"Local shorthand for the localization ℒ X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.localization]]: ℒ X has the points and the bornology of X and carries the localized uniformity. In this file it is the bridge between the local and the global classes of maps. A trapped Cauchy filter on X is also Cauchy for the localized uniformity ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_localized_cauchy]]), which gives the bijection [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]] from 𝒯 X to 𝒯 (ℒ X). A morphism f of well-containment spaces becomes the global morphism f ∘ ε X out of ℒ X, and a dense locally reflecting f becomes the globally reflecting η Z ∘ f into ℒ Z. Through these the global constructions of the trapped completion yield [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] and [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]], whose statements do not mention ℒ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.Λ","base":"Λ","kind":"abbrev","start":17,"body":null,"status":"ok","short":{"text":"Local abbreviation for the localized uniformity of X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.localized_uniformity]], the uniformity carried by the localization ℒ X. Its one recorded use is in [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_pt_is_fun]], where the equality of 𝒯 (ℒ X) is stated with entourages V of Λ X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.ε","base":"ε","kind":"abbrev","start":18,"body":null,"status":"ok","short":{"text":"Local shorthand for the counit ε X : ℒ X ⇾ X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.from_localization]]: the identity of the underlying set, regarded as a map from the localization ℒ X to X. The file uses it in two ways. Its induced map 𝒯₁ (ε X) : 𝒯 (ℒ X) ⇾ 𝒯 X is a bijection with inverse [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]] ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_bijective_back]]), and an embedding of well-containment uniform spaces ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_back_emb]]). Precomposing a morphism f : X ⇾ Y with it gives f ∘ ε X : ℒ X ⇾ Y, a global morphism. That composite defines [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.η","base":"η","kind":"abbrev","start":19,"body":null,"status":"ok","short":{"text":"Local shorthand for the unit η X : X ⇾ ℒ X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.to_localization]]: the identity of the underlying set, regarded as a map from X to its localization ℒ X. In [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] it appears twice. A dense, locally reflecting f : X ⇾ Z composes with it to the globally reflecting η Z ∘ f : X ⇾ ℒ Z, which [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect]] accepts. The resulting map out of ℒ Z is then precomposed with η Z. The proofs of [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]] and [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec]] read the unit through it as well: the unit τ X followed by [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]] unfolds to τ (ℒ X) ∘ η X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.κ","base":"κ","kind":"abbrev","start":20,"body":null,"status":"ok","short":{"text":"Local abbreviation for the unit X ⇾ 𝒞 X of the Cauchy completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy]], the map sending a point of X to its principal Cauchy filter.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒞","base":"𝒞","kind":"abbrev","start":21,"body":null,"status":"ok","short":{"text":"Local abbreviation for the set of Cauchy filters on X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_filter_set]], the set of Cauchy filters on X with the Cauchy equality.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒞₁","base":"𝒞₁","kind":"abbrev","start":22,"body":null,"status":"ok","short":{"text":"Local abbreviation for the extension of a uniformly continuous map to Cauchy completions","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]], which sends a Cauchy filter to its image filter along a uniformly continuous map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒯","base":"𝒯","kind":"abbrev","start":23,"body":null,"status":"ok","short":{"text":"Local shorthand for the trapped completion 𝒯 X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_cauchy_filter_set]]: the trapped completion 𝒯 X, whose points are the Cauchy filters on X with a bounded member, with the equality of 𝒞 X. This file gives it an intrinsic interface. The maps it constructs land in it: [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]] from 𝒯 X to 𝒯 (ℒ X), the functor action [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] from 𝒯 X to 𝒯 Y, and the reflection [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] from Z to 𝒯 X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.τ","base":"τ","kind":"abbrev","start":24,"body":null,"status":"ok","short":{"text":"Local shorthand τ X for the unit X ⇾ 𝒯 X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.to_trapped]], the unit of the trapped completion on X itself, used throughout the file's statements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.β","base":"β","kind":"abbrev","start":25,"body":null,"status":"ok","short":{"text":"Local shorthand β for the inclusion of the trapped completion 𝒯 X into the Cauchy completion 𝒞 X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.from_trapped]], the map 𝒯 X ⇾ 𝒞 X that forgets that a Cauchy filter is trapped. It is introduced with the other shorthands of the trapped completion. Nothing in the file uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒯₁","base":"𝒯₁","kind":"abbrev","start":26,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒯₁ for the map of trapped completions induced by a global morphism","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map]]. Here 𝒯₁ f : 𝒯 X ⇾ 𝒯 Y is the map induced by a map f that is uniformly continuous and bornological everywhere, not only near bounded sets. The file applies it to the counit ε X and to the composites f ∘ ε X, which are global morphisms even when f is only a local one. This is how [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] is built, and [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_gbl]] shows that the two constructions agree when f is a global morphism.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.π₁","base":"π₁","kind":"abbrev","start":58,"body":null,"status":"ok","short":{"text":"Local shorthand π₁ for the first projection out of a tensor product","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.theory.set.tensor_proj1]], the first projection X ⊗ Y ⇾ X. Nothing in the file uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_localized_cauchy","base":"trapped_localized_cauchy","kind":"prf","start":64,"body":[65,68],"status":"ok","short":{"text":"The filter of a trapped Cauchy filter on X is also Cauchy for the localized uniformity","status":"ok"},"proof":[{"text":"Since F is trapped, it has a bounded member K.","status":"ok","from":0,"to":1},{"text":"The underlying filter of F is Cauchy for the uniformity of X. A Cauchy filter with a bounded member is also Cauchy for the localized uniformity ([[AffineConstructive.topology.unif_born.localization.cauchy_bounded_locally_cauchy]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_pt","base":"trapped_localize_pt","kind":"def","start":69,"body":null,"status":"ok","short":{"text":"A trapped Cauchy filter on X, regarded as a trapped Cauchy filter on ℒ X","status":"ok"},"long":{"text":"This takes a trapped Cauchy filter F on X to the same family of subsets, regarded as a filter on the localization ℒ X. The family is Cauchy for the localized uniformity by [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localized_cauchy]]: a Cauchy filter with a bounded member is Cauchy for the localized uniformity. It stays trapped because the bornology of ℒ X is that of X, so the same proof of trappedness serves. [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_pt_is_fun]] shows that it preserves equality, and [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]] is the resulting function of sets.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_pt_is_fun","base":"trapped_localize_pt_is_fun","kind":"prf","start":70,"body":[71,82],"status":"ok","short":{"text":"Regarding a trapped Cauchy filter on X as one on ℒ X preserves equality","status":"ok"},"proof":[{"text":"Take trapped filters F and G. Their equality as points of the completion says that every entourage U contains A ⊗ B for some A ∊ F and B ∊ G. So the goal is that this property for the entourages of Φ implies the same property for the entourages of the localized uniformity.","status":"ok","from":0,"to":2},{"text":"Fix a localized entourage V. F is trapped, so it has a bounded member K. By [[AffineConstructive.topology.unif_born.localization.local_entourage_tensor]] there is an entourage U of Φ such that A ⊗ B ⊆ U implies (K ⊓ A) ⊗ B ⊆ V.","status":"ok","from":3,"to":5},{"text":"Specialise the hypothesis at this U, and take the members A ∊ F and B ∊ G with A ⊗ B ⊆ U that it provides.","status":"ok","from":6,"to":8},{"text":"F is a filter, so K ⊓ A is a member of F. Take K ⊓ A and B as the witnesses. What remains, that A ⊗ B ⊆ U gives (K ⊓ A) ⊗ B ⊆ V, is the property of U.","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_localize","base":"trapped_localize","kind":"def","start":83,"body":null,"status":"ok","short":{"text":"The map 𝒯 X ⇾ 𝒯 (ℒ X) that regards a trapped Cauchy filter on X as one on ℒ X","status":"ok"},"long":{"text":"This is the function of sets built from [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_pt]]. A trapped Cauchy filter F on X has a bounded member, so by [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localized_cauchy]] it is also Cauchy for the localized uniformity. The same family of subsets is then a trapped filter on ℒ X. The map preserves equality ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_pt_is_fun]]). Given an entourage V of the localization and a bounded member K of F, [[AffineConstructive.topology.unif_born.localization.local_entourage_tensor]] provides an entourage U of X such that a pair A ⊗ B ⊆ U, once A is cut down to K ⊓ A, lies in V.\n\nIt is registered as the designated inverse of 𝒯₁ (ε X), the map that the counit ε X : ℒ X ⇾ X induces on trapped completions. The map is a bijection ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_bijective]]), and over a well-containment space it is an embedding of well-containment uniform spaces ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_emb]]). So 𝒯 X and 𝒯 (ℒ X) are isomorphic. The proof of [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor]] uses it as the inverse of 𝒯₁ (ε X), together with its embedding property.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_bijective","base":"trapped_localize_bijective","kind":"prf","start":89,"body":[90,92],"status":"ok","short":{"text":"The map 𝒯 X ⇾ 𝒯 (ℒ X) is a bijection, with 𝒯₁ (ε X) as its inverse","status":"ok"},"commentary":{"text":"","status":"ok"},"proof":[{"text":"The map has 𝒯₁ (ε X) as its designated inverse. Both composites are the identity on trapped filters: the underlying filter is unchanged, and only the uniformity it is judged by differs. So [[AffineConstructive.theory.set.alt_Build_Bijective]] makes the map a bijection.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_bijective_back","base":"trapped_localize_bijective_back","kind":"prf","start":96,"body":[97,99],"status":"ok","short":{"text":"The map 𝒯₁ (ε X) : 𝒯 (ℒ X) ⇾ 𝒯 X is a bijection","status":"ok"},"proof":[{"text":"𝒯₁ (ε X) is the inverse of the bijection of [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_bijective]], and the inverse of a bijection is a bijection ([[AffineConstructive.theory.set.flip_bijection]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_back_emb","base":"trapped_localize_back_emb","kind":"prf","start":103,"body":[104,108],"status":"ok","short":{"text":"Over a well-containment space, 𝒯₁ (ε X) is an embedding of well-containment uniform spaces","status":"ok"},"commentary":{"text":"The proof never compares the uniformities and bornologies of 𝒯 (ℒ X) and 𝒯 X directly. Local initiality only needs to be checked on the dense image of the unit τ (ℒ X), and there naturality reduces the question to ε X, which is already known to be a local embedding. [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_initial]] and [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_initial]] follow the same route through [[AffineConstructive.topology.unif_born.localization.dense_locally_initial]].\n\nThe well-containment hypothesis is needed twice: for ε X to be a global morphism, so that 𝒯₁ (ε X) is defined, and for the unit to be initial. Bijectivity needs neither. This lemma is the input that makes the inverse map [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]] an embedding ([[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_emb]]) and a morphism, which [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor]] uses.","status":"ok"},"proof":[{"text":"An embedding of well-containment spaces is an injective global morphism that is initial. Injectivity comes from bijectivity. The morphism part comes from ε X being a global morphism, carried over by the trapped functor. What remains is that 𝒯₁ (ε X) is locally initial.","status":"ok","from":0,"to":1},{"text":"The unit τ (ℒ X) is dense and a morphism, and 𝒯₁ (ε X) is a local morphism. By [[AffineConstructive.topology.unif_born.localization.dense_locally_initial]] it then suffices that the composite 𝒯₁ (ε X) ∘ τ (ℒ X) is locally reflecting.","status":"ok","from":2,"to":2},{"text":"By naturality of the unit ([[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map_unit]]) this composite is τ X ∘ ε X. The unit τ X is uniformly and bornologically reflecting, and ε X is a local embedding ([[AffineConstructive.topology.unif_born.localization.from_localization_locally_emb]]). Their composite is therefore locally reflecting ([[AffineConstructive.topology.unif_born.local_maps.compose_locally_unif_born_reflecting]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_localize_emb","base":"trapped_localize_emb","kind":"prf","start":122,"body":[123,125],"status":"ok","short":{"text":"Over a well-containment space, 𝒯 X ⇾ 𝒯 (ℒ X) is an embedding of well-containment uniform spaces","status":"ok"},"commentary":{"text":"","status":"ok"},"proof":[{"text":"The map is the inverse of 𝒯₁ (ε X), which is bijective and an embedding. The inverse of a bijective initial map of well-containment spaces is an embedding ([[AffineConstructive.topology.unif_born.local_maps.invert_wcunif_initial]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.map.instance:wcunif_localize_domain","base":"instance:wcunif_localize_domain","kind":"existing_instance","start":146,"body":null,"status":"ok","short":{"text":"Within this section, resolution finds that f ∘ ε X is a global morphism when f is a morphism of well-containment spaces, via [[AffineConstructive.topology.unif_born.localization.wcunif_localize_domain]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map","base":"wc_trapped_map","kind":"def","start":148,"body":null,"status":"ok","short":{"text":"The action 𝒯ₗ f : 𝒯 X ⇾ 𝒯 Y of the trapped completion on a morphism of well-containment spaces","status":"ok"},"long":{"text":"This is the action of the trapped completion on a morphism f : X ⇾ Y of well-containment uniform spaces. Such a morphism is bornological and locally uniformly continuous, meaning uniformly continuous near bounded sets. [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map]] cannot take it directly, because it needs a map that is uniformly continuous everywhere. The definition therefore passes through the localization. The composite f ∘ ε X out of ℒ X is a global morphism ([[AffineConstructive.topology.unif_born.localization.wcunif_localize_domain]]). The map 𝒯₁ (ε X) : 𝒯 ℒ X ⇾ 𝒯 X is a bijection whose inverse is [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]]. 𝒯ₗ f is the inverse followed by 𝒯₁ (f ∘ ε X). The hypothesis on f and the classes proved of the result are all intrinsic local classes, so code that uses the map never refers to ℒ.\n\n```tikzcd[column sep=huge, row sep=huge]\nX \\arrow[d, glob, ini, \"\\tau_X\"'] \\arrow[rr, bend left=28, \"f\"] &\n\\Loc X \\arrow[l, glob, \"\\varepsilon_X\"'] \\arrow[r, glob, \"f \\circ \\varepsilon_X\"] \\arrow[d, glob, ini, \"\\tau_{\\Loc X}\"] &\nY \\arrow[d, glob, ini, \"\\tau_Y\"] \\\\\n\\Trp X \\arrow[r, hook, ini, \"(\\Trp\\varepsilon_X)^{-1}\"] \\arrow[rr, dashed, bend right=28, \"\\Trp_\\ell f\"'] &\n\\Trp\\Loc X \\arrow[r, glob, \"\\Trp(f \\circ \\varepsilon_X)\"] &\n\\Trp Y\n```\n\nThe map is a morphism ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor]]) and commutes with the units ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]]). When f is a global morphism it equals 𝒯₁ f ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_gbl]]). The files on local completions and on completions of open immersions use it as their 𝒯₁.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor","base":"wc_trapped_map_mor","kind":"prf","start":149,"body":[150,152],"status":"ok","short":{"text":"The map 𝒯ₗ f : 𝒯 X ⇾ 𝒯 Y is a morphism of well-containment uniform spaces","status":"ok"},"commentary":{"text":"The detour through ℒ is needed because 𝒯₁ only acts on global morphisms, and f is only locally uniformly continuous. Composing with ε X turns f into a global morphism on ℒ X. The cost is that the domain becomes 𝒯 (ℒ X), and [[AffineConstructive.topology.unif_born.trapped_wc.trapped_localize]] brings it back to 𝒯 X. This lemma is what lets the completion arguments in [[AffineConstructive.topology.unif_born.local_completion.wcunif_canonical_completion]] and [[AffineConstructive.topology.unif_born.open_immersion_complete.open_immersion_limit_cont]] apply 𝒯ₗ to a morphism that is only local.","status":"ok"},"proof":[{"text":"By definition the map is 𝒯₁ (f ∘ ε X) composed with the passage from 𝒯 X to 𝒯 (ℒ X). That passage is the inverse of the bijective, locally reflecting 𝒯₁ (ε X), so it is a morphism ([[AffineConstructive.topology.unif_born.local_maps.invert_wcunif_reflecting]]). Moreover f ∘ ε X is a global morphism ([[AffineConstructive.topology.unif_born.localization.wcunif_localize_domain]]), so 𝒯₁ (f ∘ ε X) is a morphism as well, and hence so is the composite.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit","base":"wc_trapped_map_unit","kind":"prf","start":153,"body":[154,157],"status":"ok","short":{"text":"Naturality of the unit: 𝒯ₗ f ∘ τ X = τ Y ∘ f","status":"ok"},"commentary":{"text":"","status":"ok"},"proof":[{"text":"Unfolded, the left-hand side is 𝒯₁ (f ∘ ε X) ∘ τ (ℒ X) ∘ η X: a point of X is first regarded as a point of ℒ X, then sent into its trapped completion, and from there carried over to 𝒯 Y.","status":"ok","from":0,"to":1},{"text":"Naturality of the unit ([[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map_unit]]) turns 𝒯₁ (f ∘ ε X) ∘ τ (ℒ X) into τ Y ∘ f ∘ ε X. Since ε X ∘ η X is the identity on X, this square commutes:\n\n```tikzcd\nX \\arrow[r, \"\\tau\"] \\arrow[d, \"f\"'] & \\Trp X \\arrow[d, \"\\Trp_{\\ell} f\"] \\\\\nY \\arrow[r, \"\\tau\"'] & \\Trp Y\n```","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_dense","base":"wc_trapped_map_dense","kind":"prf","start":158,"body":[159,162],"status":"ok","short":{"text":"If f is dense, so is the map 𝒯ₗ f : 𝒯 X ⇾ 𝒯 Y","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.topology.maps.Dense_factor_right]] it suffices that the composite of the induced map with the unit τ X is dense.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]] this composite is τ Y ∘ f. Both factors are dense and τ Y is uniformly continuous, so the composite is dense ([[AffineConstructive.topology.topology.maps.Dense_compose]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒯ₗ","base":"𝒯ₗ","kind":"abbrev","start":166,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒯ₗ for the trapped completion's action on morphisms of well-containment spaces","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]]. It keeps the induced map of a local morphism apart from [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map]], abbreviated 𝒯₁, which needs a global morphism. The lemmas after the section, [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_initial]] and [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_gbl]], are stated with it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_initial","base":"wc_trapped_map_initial","kind":"prf","start":173,"body":[174,178],"status":"ok","short":{"text":"If f is an initial map of well-containment spaces, so is 𝒯ₗ f","status":"ok"},"commentary":{"text":"","status":"ok"},"proof":[{"text":"The induced map is a morphism of well-containment spaces ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor]]), so what remains is that it is locally initial.","status":"ok","from":0,"to":1},{"text":"The unit τ X is dense and a morphism, and 𝒯ₗ f is a local morphism. By [[AffineConstructive.topology.unif_born.localization.dense_locally_initial]] it suffices that 𝒯ₗ f ∘ τ X is locally reflecting.","status":"ok","from":2,"to":2},{"text":"By [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]] this composite is τ Y ∘ f. The unit τ Y is initial and so is f, so each is locally reflecting, and their composite is locally reflecting ([[AffineConstructive.topology.unif_born.local_maps.compose_locally_unif_born_reflecting]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_gbl","base":"wc_trapped_map_gbl","kind":"prf","start":186,"body":[187,189],"status":"ok","short":{"text":"For a global morphism f, the induced map 𝒯ₗ f equals 𝒯₁ f","status":"ok"},"commentary":{"text":"","status":"ok"},"proof":[{"text":"The two maps agree by definition. For a global morphism, the locally uniformly continuous map that [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] receives is f itself, since every global morphism is a morphism ([[AffineConstructive.topology.unif_born.local_maps.gbl_wcunif_mor_local]]). Once the passage through the localization ℒ is unfolded, 𝒯ₗ f reduces to 𝒯₁ f, and reflexivity of equality closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.reflect.instance:wcunif_localize_codomain_refl","base":"instance:wcunif_localize_codomain_refl","kind":"existing_instance","start":193,"body":null,"status":"ok","short":{"text":"Within this section, resolution finds that η Y ∘ f reflects globally when f is a dense reflecting map, via [[AffineConstructive.topology.unif_born.localization.wcunif_localize_codomain_refl]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect","base":"wc_trapped_reflect","kind":"def","start":195,"body":null,"status":"ok","short":{"text":"The reflection Z ⇾ 𝒯 X of a dense, locally reflecting map f : X ⇾ Z of well-containment spaces","status":"ok"},"long":{"text":"Let f : X ⇾ Z be a dense map of well-containment uniform spaces that is locally reflecting. This definition maps Z back into the trapped completion of X. [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect]] needs a dense map that reflects globally, which f need not be. The composite η Z ∘ f into the localization ℒ Z is such a map ([[AffineConstructive.topology.unif_born.localization.wcunif_localize_codomain_refl]]). Its trapped reflection is a map ℒ Z ⇾ 𝒯 X, and precomposing it with η Z gives a map defined on Z. As with [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]], the hypotheses and conclusions are stated in the intrinsic local classes.\n\n```tikzcd[column sep=huge, row sep=huge]\nX \\arrow[r, refl, \"f\"] \\arrow[dr, glob, ini, \"\\tau_X\"'] \\arrow[rr, glob, refl, bend left=28, \"\\eta_Z \\circ f\"] &\nZ \\arrow[r, glob, refl, \"\\eta_Z\"] \\arrow[d, dashed, \"R f\" description] &\n\\Loc Z \\arrow[dl, glob, \"\\tilde R(\\eta_Z \\circ f)\"] \\\\\n& \\Trp X &\n```\n\nThe reflection inverts f against the unit ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec]]) and is a morphism ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor]]). It is the operation of the local completion [[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion_reflect]], and the file on local completions uses it as R.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec","base":"wc_trapped_reflect_spec","kind":"prf","start":196,"body":[197,199],"status":"ok","short":{"text":"The reflection inverts f against the unit: wc_trapped_reflect f ∘ f = τ X","status":"ok"},"commentary":{"text":"","status":"ok"},"proof":[{"text":"This is the general property of the trapped reflection, [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect_spec]], applied to the composite η Z ∘ f. Because f is dense and reflecting, η Z ∘ f is dense and reflects globally ([[AffineConstructive.topology.unif_born.localization.wcunif_localize_codomain_refl]]), so the general property applies.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor","base":"wc_trapped_reflect_mor","kind":"prf","start":200,"body":[201,203],"status":"ok","short":{"text":"The reflection of f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"Unfolded, the reflection of f is the trapped reflection of η Z ∘ f composed with the unit η of the localization of Z. The unit is an embedding, so it is a morphism, and the reflection is a morphism too. Their composite is therefore a morphism of well-containment uniform spaces ([[AffineConstructive.topology.unif_born.local_maps.compose_wcunif_morphism]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_dense","base":"wc_trapped_reflect_dense","kind":"prf","start":204,"body":[205,207],"status":"ok","short":{"text":"The reflection of f has dense range in 𝒯 X","status":"ok"},"proof":[{"text":"Unfolded, the reflection is built from the trapped reflection of η Z ∘ f, a map into the localization ℒ Z. That composite is dense, because f and the unit η Z are dense ([[AffineConstructive.topology.unif_born.localization.to_localization_dense]]). It also reflects uniformity and bornology globally, because f is a dense locally reflecting map ([[AffineConstructive.topology.unif_born.localization.wcunif_localize_codomain_refl]]). So its trapped reflection is dense by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect_dense]], and its uniform continuity ([[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect_ufm_cont]]) is the remaining fact needed to conclude that wc_trapped_reflect has dense range.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_initial","base":"wc_trapped_reflect_initial","kind":"prf","start":217,"body":[218,222],"status":"ok","short":{"text":"If f is also initial, its reflection Z ⇾ 𝒯 X is an initial map of well-containment spaces","status":"ok"},"commentary":{"text":"","status":"ok"},"proof":[{"text":"The reflection of f is already a morphism of well-containment uniform spaces ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor]]). So to show it is initial, it is enough to show that it is locally initial.","status":"ok","from":0,"to":1},{"text":"f is dense and locally a morphism, and the reflection is locally a morphism. By [[AffineConstructive.topology.unif_born.localization.dense_locally_initial]], the reflection is locally initial once its composite with f is locally reflecting. That is what remains to show.","status":"ok","from":2,"to":2},{"text":"The composite of the reflection with f is the unit τ X ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec]]). The unit is initial, so it reflects both the uniformity and the bornology, and is therefore locally reflecting ([[AffineConstructive.topology.unif_born.local_maps.unif_born_refl_local]]).","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion_reflect","base":"trapped_local_completion_reflect","kind":"def","start":230,"body":null,"status":"ok","short":{"text":"The local-completion operation for τ X: a dense reflecting f goes to its reflection","status":"ok"},"long":{"text":"Equips the unit τ X with the operation required of a local completion: to every dense, locally reflecting map f from X to a well-containment space Z it assigns [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] f : Z ⇾ 𝒯 X. The laws the operation must satisfy are proved in [[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion","base":"trapped_local_completion","kind":"prf","start":233,"body":[234,240],"status":"ok","short":{"text":"The unit τ X : X ⇾ 𝒯 X is a local completion of X","status":"ok"},"proof":[{"text":"A local completion is separated, dense and initial, and has a reflection for every dense initial map out of X. 𝒯 X is separated by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_separated]], τ X is dense and initial, and the reflection is [[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion_reflect]]. Let f : X ⇾ Z be dense and initial. It remains to show that the reflection of f is a morphism and that composing it with f gives τ X.","status":"ok","from":0,"to":1},{"text":"The reflection is a morphism by [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor]].","status":"ok","from":2,"to":3},{"text":"Composing the reflection with f gives τ X by [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec]].","status":"ok","from":4,"to":6}]}],"diagrams":{"svg":{"column sep=huge, row sep=huge\nX \\arrow[d, glob, ini, \"\\tau_X\"'] \\arrow[rr, bend left=28, \"f\"] &\n\\Loc X \\arrow[l, glob, \"\\varepsilon_X\"'] \\arrow[r, glob, \"f \\circ \\varepsilon_X\"] \\arrow[d, glob, ini, \"\\tau_{\\Loc X}\"] &\nY \\arrow[d, glob, ini, \"\\tau_Y\"] \\\\\n\\Trp X \\arrow[r, hook, ini, \"(\\Trp\\varepsilon_X)^{-1}\"] \\arrow[rr, dashed, bend right=28, \"\\Trp_\\ell f\"'] &\n\\Trp\\Loc X \\arrow[r, glob, \"\\Trp(f \\circ \\varepsilon_X)\"] &\n\\Trp Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='186.231pt' height='122.736pt' viewBox='0 0 186.231 122.736'>\n<defs>\n<path id='g7-1' d='M1.98204-3.16728C1.98204-3.31668 1.9671-3.31668 1.80276-3.31668C1.44918-2.99796 .8964-2.99796 .7968-2.99796H.71214V-2.77884H.7968C.91134-2.77884 1.23504-2.79378 1.52388-2.91828V-.42828C1.52388-.2739 1.52388-.21912 .996-.21912H.747V0C1.0209-.01992 1.46412-.01992 1.75296-.01992S2.48502-.01992 2.75892 0V-.21912H2.50992C1.98204-.21912 1.98204-.2739 1.98204-.42828V-3.16728Z'/>\n<path id='g5-1' d='M4.3824-1.10556C4.46208-1.10556 4.59654-1.10556 4.59654-1.245S4.46208-1.38444 4.3824-1.38444H1.01094C.93126-1.38444 .7968-1.38444 .7968-1.245S.93126-1.10556 1.01094-1.10556H4.3824Z'/>\n<path id='g5-2' d='M1.37946-.50298C1.56372-.76692 1.68822-1.00596 1.77786-1.3446C1.86252-1.65336 2.00694-2.20614 2.30574-2.67426C2.5896-3.10752 2.75892-3.14238 2.92824-3.14238C3.20214-3.14238 3.39636-2.98302 3.39636-2.72406C3.39636-2.6

ry.nno":"theory/nno.html","AffineConstructive.theory.naturals":"theory/naturals.html","AffineConstructive.theory.nat_action":"theory/nat_action.html","AffineConstructive.theory.integers":"theory/integers.html","AffineConstructive.theory.int_action":"theory/int_action.html","AffineConstructive.theory.bundled_groups":"theory/bundled_groups.html","AffineConstructive.theory.bundled_rings":"theory/bundled_rings.html","AffineConstructive.theory.group_completion":"theory/group_completion.html","AffineConstructive.orders.orders":"orders/orders.html","AffineConstructive.orders.maps":"orders/maps.html","AffineConstructive.orders.suborders":"orders/suborders.html","AffineConstructive.orders.projected":"orders/projected.html","AffineConstructive.orders.directed_sets":"orders/directed_sets.html","AffineConstructive.orders.lattices":"orders/lattices.html","AffineConstructive.orders.sublattices":"orders/sublattices.html","AffineConstructive.orders.closure":"orders/closure.html","AffineConstructive.orders.filters":"orders/filters.html","AffineConstructive.orders.subset":"orders/subset.html","AffineConstructive.orders.subset_relations":"orders/subset_relations.html","AffineConstructive.orders.subset_images":"orders/subset_images.html","AffineConstructive.orders.groups":"orders/groups.html","AffineConstructive.orders.rings":"orders/rings.html","AffineConstructive.orders.naturals":"orders/naturals.html","AffineConstructive.orders.integers":"orders/integers.html","AffineConstructive.implementations.bool":"implementations/bool.html","AffineConstructive.implementations.z2":"implementations/z2.html","AffineConstructive.implementations.nat.nno":"implementations/nat/nno.html","AffineConstructive.implementations.nat.rig":"implementations/nat/rig.html","AffineConstructive.implementations.nat.subtract":"implementations/nat/subtract.html","AffineConstructive.implementations.nat.notation":"implementations/nat/notation.html","AffineConstructive.implementations.nat":"implementations/nat.html","AffineConstructive.implementations.nno_rig":"implementations/nno_rig.html","AffineConstructive.implementations.nno_naturals":"implementations/nno_naturals.html","AffineConstructive.implementations.list.base":"implementations/list/base.html","AffineConstructive.implementations.list.tensor":"implementations/list/tensor.html","AffineConstructive.implementations.list.prod":"implementations/list/prod.html","AffineConstructive.implementations.list":"implementations/list.html","AffineConstructive.implementations.finite_sequences":"implementations/finite_sequences.html","AffineConstructive.implementations.free.com_monoids":"implementations/free/com_monoids.html","AffineConstructive.implementations.free.ab_groups":"implementations/free/ab_groups.html","AffineConstructive.implementations.grothendieck_group":"implementations/grothendieck_group.html","AffineConstructive.implementations.signed_naturals_integers":"implementations/signed_naturals_integers.html","AffineConstructive.implementations.bin_int":"implementations/bin_int.html","AffineConstructive.topology.topology.base":"topology/topology/base.html","AffineConstructive.topology.topology.basis":"topology/topology/basis.html","AffineConstructive.topology.topology.interior":"topology/topology/interior.html","AffineConstructive.topology.topology.maps":"topology/topology/maps.html","AffineConstructive.topology.topology.product":"topology/topology/product.html","AffineConstructive.topology.reflection_pair.products":"topology/reflection_pair/products.html","AffineConstructive.topology.reflection_pair.completion":"topology/reflection_pair/completion.html","AffineConstructive.topology.topology":"topology/topology.html","AffineConstructive.topology.topology.induced":"topology/topology/induced.html","AffineConstructive.topology.topology.subspace":"topology/topology/subspace.html","AffineConstructive.topology.unif_born.local_completion":"topology/unif_born/local_completion.html","AffineConstructive.topology.uniform.base":"topology/uniform/base.html","AffineConstructive.topology.uniform.completion":"topology/uniform/completion.html","AffineConstructive.topology.uniform.uniformly_below":"topology/uniform/uniformly_below.html","AffineConstructive.topology.uniform.basis":"topology/uniform/basis.html","AffineConstructive.topology.uniform.dense_collar":"topology/uniform/dense_collar.html","AffineConstructive.topology.uniform.final":"topology/uniform/final.html","AffineConstructive.topology.uniform.product":"topology/uniform/product.html","AffineConstructive.topology.uniform.cylinder":"topology/uniform/cylinder.html","AffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** The intrinsic (WCUnif-category) surface of the trapped completion: the\n    kit of [trapped_cauchy.v] translated through the localization dictionary\n    once and for all.  [to_trapped] is the unit [X ⇾ 𝒯 X];\n    [wc_trapped_map] and [wc_trapped_reflect] are the functor action and the\n    reflection, with hypotheses and conclusions in the intrinsic\n    Locally-classes — consumers need not mention ℒ.  The band-level\n    machinery stays in [trapped_cauchy.v].  The file ends with the canonical\n    [LocalCompletion (to_trapped X)] instance, doubling as the test that the\n    port machinery functions as intended. *)\n\nRequire Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.unif_born.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import theory.subgroups.\nRequire Import topology.topology topology.uniform.base uniform.basis uniform.subspace.\nRequire Import uniform.cauchy_completion uniform.completion.\nRequire Import bornology.base.\nRequire Import unif_born.base unif_born.local_maps unif_born.localization unif_born.trapped_cauchy.\nRequire Import easy rewrite replc simplify strip_coercions.\n\nImport image_notation.\nImport tensor_map_notation.\n\nLocal Abbreviation id := (id_fun _).\nLocal Abbreviation ℒ := localization.\nLocal Abbreviation Λ := localized_uniformity.\nLocal Abbreviation ε := from_localization.\nLocal Abbreviation η := to_localization.\nLocal Abbreviation κ := to_cauchy.\nLocal Abbreviation 𝒞 := cauchy_filter_set.\nLocal Abbreviation 𝒞₁ := cauchy_map.\n\nLocal Abbreviation 𝒯 := trapped_cauchy_filter_set.\nLocal Abbreviation τ₀ := trapped_unit.\nLocal Abbreviation β := trapped_embedding.\n\nLocal Open Scope topology_scope.\nLocal Open Scope sg_op_scope.\n\nLocal Notation \"f ♯\" := (⟨f,f⟩*) (at level 1, left associativity, format \"f ♯\").\n\n(** ** The unit. *)\n\nDefinition to_trapped X `{@UnifBornSpace X Φ 𝒜} : X ⇾ 𝒯 X := τ₀ X ∘ η X.\nArguments to_trapped X {_ _ _}.\nLocal Abbreviation τ := to_trapped.\n\n#[local] Hint Extern 10 => match goal with\n|  |- context [ η ?X ∘ ε ?X ] => change (η X ∘ ε X) with (id_fun X)\n|  |- context [ ?f ∘ η ?X ∘ ε ?X ] => change (f ∘ η X ∘ ε X) with f\nend : typeclass_instances.\n\nLemma to_trapped_ubr `{@WCUnifSpace X Φ 𝒜} : UnifBornReflecting (τ X).\nProof. now unfold τ. Qed.\n#[global] Hint Extern 2 (UnifBornReflecting         (τ _)) => simple notypeclasses refine to_trapped_ubr : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting        (τ _)) => simple notypeclasses refine to_trapped_ubr : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting        (τ _)) => simple notypeclasses refine to_trapped_ubr : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting  (τ _)) => simple notypeclasses refine to_trapped_ubr : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyReflecting (τ _)) => simple notypeclasses refine to_trapped_ubr : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting     (τ _)) => simple notypeclasses refine to_trapped_ubr : typeclass_instances.\n\nLemma to_trapped_locally_initial `{@WCUnifSpace X Φ 𝒜} : WCUnifInitial (τ X).\nProof. split; [| now split ]. split; try exact _. unfold τ. now apply localized_unif_born_conv. Qed.\n#[global] Hint Extern 2 (WCUnifInitial              (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifMorphism             (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (WCUnifReflecting           (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial     (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial           (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (Bornological               (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial        (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n#[global] Hint Extern 2 (Continuous                 (τ _)) => simple notypeclasses refine to_trapped_locally_initial : typeclass_instances.\n\nLemma to_trapped_dense  `{@WCUnifSpace X Φ 𝒜} : Dense (τ X).\nProof. now unfold τ. Qed.\n#[global] Hint Extern 2 (Dense (func_op (to_trapped _))) => simple notypeclasses refine to_trapped_dense : typeclass_instances.\n\nLemma to_trapped_emb `{@WCUnifSpace X Φ 𝒜, !SeparatedUniformSpace X} : WCUnifEmbedding (τ X).\nProof. split; try exact _. now unfold τ. Qed.\n#[global] Hint Extern 2 (WCUnifEmbedding          (τ _)) => simple notypeclasses refine to_trapped_emb : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornEmbedding (τ _)) => simple notypeclasses refine to_trapped_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding    (τ _)) => simple notypeclasses refine to_trapped_emb : typeclass_instances.\n#[global] Hint Extern 2 (Injective (τ _)) => simple notypeclasses refine to_trapped_emb : typeclass_instances.\n\n(** ** τ-equality as a ball law.\n\n    A trapped filter equal to [τ X x] contains every ambient ball at [x],\n    and hence has [x] in the closure of each of its members — the trapping\n    content of limits, in completeness-free form: completeness only ever\n    manufactures the equality [τ X x = G]. *)\nSection to_trapped_eq.\n  Context `{@UnifBornSpace X Φ 𝒜}.\n  Local Open Scope subset_scope.\n\n  Lemma to_trapped_eq_ball (x : X) (G : 𝒯 X) (E : τ X x = G) (U : Φ) : near U x ∊ trapped_filter G.\n  Proof.\n    pose proof E (ufm_preimage (ε X) U) as [B [A P]]; change (apos (B ⊗ A ⊆ U)) in P.\n    pose proof subset_pt_is_el B : x ∊ B as elxB.\n    enough (A ⊆ near U x) as SA by (rew <-SA; exact (subset_pt_is_el A)).\n    intros a. change (a ∊ A ⊸ (x, a) ∊ U). rew <-P.\n    change (a ∊ A ⊸ x ∊ B ⊠ a ∊ A). now simplify.\n  Qed.\n\n  Lemma to_trapped_eq_closure (x : X) (G : 𝒯 X) (E : τ X x = G) (A : trapped_filter G)\n    : x ∊ closure (powerset_pt A : 𝒫 X).\n  Proof. rew uniform_closure_applied2. intros U.\n    pose proof to_trapped_eq_ball x G E U as elU.\n    pose (M := to_subset (U:=trapped_filter G) (near U x) ⊓ A : trapped_filter G).\n    change (∐ y, y ∊ M). pose proof (inhabited M) as [y _]. now exists (subset_pt y).\n  Qed.\nEnd to_trapped_eq.\n\n(** ** A \"counit\" with a twist.  *)\n\nDefinition from_trapped X `{@UnifBornSpace X Φ 𝒜} : 𝒯 X ⇾ 𝒞 X := 𝒞₁ (ε X) ∘ β X.\nArguments from_trapped X {_ _ _}.\nLocal Abbreviation ρ := from_trapped.\n\nLemma from_trapped_uc `{@UnifBornSpace X Φ 𝒜} : UniformlyContinuous (ρ X).\nProof. now unfold ρ. Qed.\n#[global] Hint Extern 2 (UniformlyContinuous        (ρ _)) => simple notypeclasses refine from_trapped_uc : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (ρ _)) => simple notypeclasses refine from_trapped_uc : typeclass_instances.\n#[global] Hint Extern 2 (Continuous                 (ρ _)) => simple notypeclasses refine from_trapped_uc : typeclass_instances.\n\nDefinition from_trapped_spec X `{@UnifBornSpace X Φ 𝒜} : ρ X ∘ τ X = κ X.\nProof. change ((𝒞₁ (ε X) ∘ κ (ℒ X)) ∘ η X = κ X). now rew (cauchy_map_spec _). Qed.\n\nSection from_trapped.\n  Context `{@WCUnifSpace X Φ 𝒜}.\n  Local Open Scope subset_scope.\n  Local Open Scope grp_scope.\n\n  Local Abbreviation C := cauchy_entourage.\n\n  (** The witnessed reflection: [ρ] reflects neighborhoods, the anchor\n      supplied per-point by [trapped_prop]. *)\n  Lemma from_trapped_cont_emb : ContinuouslyEmbedding (ρ X).\n  Proof. refine cont_initial_embedding. do 2 (split; try exact _).\n    intros F N. pose proof (trapped_prop F) as [K HK].\n    change ( (∐ E : pullback_uniformity (β X), near E F ⊆ N)\n             ⊸ ∐ M : 𝒫 (𝒞 X), (∐ W : cauchy_uniformity X, near W (ρ X F) ⊆ M) ⊠ (ρ X)* M ⊆ N ).\n    rew <-aex_adj; intros E.\n    pose proof (subset_pt_is_el E) as [D HD].\n    pose proof cauchy_entourage_basis D as [V PV].\n    pose proof trapped_transport (trapped_filter F) K HK V as [U P].\n    pose proof uniform_split_sym3 U as [W [EW PW]].\n    rew <-(aex_ub _ (near (C X W) (ρ X F))), <-(aex_ub _ (C X W)).\n    rew (aprod_true_l (ltac:(refl):near (C X W) (ρ X F) ⊆ near (C X W) (ρ X F))).\n    enough ((ρ X)* (near (C X W) (ρ X F)) ⊆ near E F) as Q by now rew Q.\n    intros G. change ((ρ X F, ρ X G) ∊ C X W ⊸ (F, G) ∊ subset_pt E).\n    rew <-HD, <-PV.\n    change ( (∏ S : Φ, ∐ (A : ρ X F) (B : ρ X G), A ⊗ B ⊆ powerset_pt (S⁻¹ ∙ W ∙ S)) ⊸\n                ∏ S : Λ X, ∐ (A : trapped_filter F) (B : trapped_filter G), A ⊗ B ⊆ powerset_pt (S⁻¹ ∙ V ∙ S )).\n    rew <-all_adj; intros S. rew <-(ufm_compose_ub_l _ _), <-(ufm_compose_ub_r _ _); clear S.\n    rew [(all_lb _ W) | <-(P _)].\n    now rew EW, PW.\n  Qed.\nEnd from_trapped.\n#[global] Hint Extern 2 (ContinuouslyEmbedding  (from_trapped _)) => simple notypeclasses refine from_trapped_cont_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial    (from_trapped _)) => simple notypeclasses refine from_trapped_cont_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting (from_trapped _)) => simple notypeclasses refine from_trapped_cont_emb : typeclass_instances.\n#[global] Hint Extern 2 (Injective              (from_trapped _)) => simple notypeclasses refine from_trapped_cont_emb : typeclass_instances.\n\n    \n(** ** The functor action. *)\n\nSection map.\n  Universes u.\n  Context `{@WCUnifMorphism@{u} X Y Φ Ψ 𝒜 ℬ f}.\n  \n  Local Existing Instance localize_functorial_alt.\n\n  Definition wc_trapped_map : 𝒯 X ⇾ 𝒯 Y := trapped_map (η Y ∘ f ∘ ε X).\n\n  Lemma wc_trapped_map_unit : wc_trapped_map ∘ to_trapped X = to_trapped Y ∘ f.\n  Proof. exact (trapped_map_unit (η Y ∘ f ∘ ε X)). Qed.\n\n  Lemma wc_trapped_map_mor : WCUnifMorphism wc_trapped_map.\n  Proof. split; try exact _. apply localized_unif_born_conv. now unfold wc_trapped_map. Qed.\n\n  Lemma wc_trapped_map_dense `{!Dense f} : Dense wc_trapped_map.\n  Proof. now unfold wc_trapped_map. Qed.\nEnd map.\nArguments wc_trapped_map {_ _ _ _ _ _} f {_}.\nArguments wc_trapped_map_unit {_ _ _ _ _ _} f {_}.\nLocal Abbreviation 𝒯₁ := wc_trapped_map.\n#[global] Hint Extern 2 (WCUnifMorphism             (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBorn            (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUniformlyContinuous (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (Bornological               (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (Continuous                 (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_mor : typeclass_instances.\n#[global] Hint Extern 2 (Dense (func_op (𝒯₁ _))) => simple notypeclasses refine wc_trapped_map_dense : typeclass_instances.\n\nLemma wc_trapped_map_initial@{u} `{@WCUnifInitial@{u} X Y Φ Ψ 𝒜 ℬ f} : WCUnifInitial (𝒯₁ f).\nProof. enough (LocallyUnifBornInitial (𝒯₁ f)) by now split.\n    refine (dense_locally_initial (τ X) (𝒯₁ f)); try exact _.\n    now rew (wc_trapped_map_unit f).\nQed.\n#[global] Hint Extern 2 (WCUnifInitial             (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornInitial    (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (LocallyUnifBornReflecting (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyInitial          (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (BornologyReflecting       (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial       (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting    (𝒯₁ _)) => simple notypeclasses refine wc_trapped_map_initial : typeclass_instances.\n\n\n(** ** The reflection. *)\n\nSection reflect.\n  Universes u.\n  Context `{@WCUnifReflecting@{u} X Z Φ Ξ 𝒜 𝒵 f, !Dense f}.\n\n  Local Existing Instance localize_functorial_refl_alt.\n\n  Local Instance wc_reflect_lift_dense : Dense (η Z ∘ f ∘ ε X).\n  Proof. now change (Dense (η Z ∘ (f ∘ ε X))). Qed.\n\n  Definition wc_trapped_reflect := trapped_reflect (η Z ∘ f ∘ ε X) ∘ η Z.\n\n  Lemma wc_trapped_reflect_spec : wc_trapped_reflect ∘ f = τ X.\n  Proof. exact (trapped_reflect_spec (η Z ∘ f ∘ ε X)). Qed.\n\n  Lemma wc_trapped_reflect_mor : WCUnifMorphism wc_trapped_reflect.\n  Proof. spl ctics/easy.html"},{"s":11646,"e":11649,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11724,"e":11727,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":11728,"e":11731,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12975,"e":12978,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":13343,"e":13346,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":13455,"e":13458,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14831,"e":14834,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"This file presents the trapped completion 𝒯 X of a well-containment uniform space in intrinsic terms, so that users need not mention the localization ℒ X. The unit [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped]] : X ⇾ 𝒯 X is shown to be locally initial, dense, and an embedding when X is separated. A point's image under the unit equal to a trapped filter G puts every ball at that point in G, and so puts the point in the closure of each member of G ([[AffineConstructive.topology.unif_born.trapped_wc.to_trapped_eq_ball]], [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped_eq_closure]]). The comparison [[AffineConstructive.topology.unif_born.trapped_wc.from_trapped]] : 𝒯 X ⇾ 𝒞 X is uniformly continuous, satisfies ρ ∘ τ = η into the Cauchy completion, and is a topological embedding. The functor action [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]] and the reflection [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] translate [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map]] and [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect]] through the localization, with hypotheses and conclusions stated in the locally-uniform classes. Together they give the instance [[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion]]: the unit is a local completion.","short":"The trapped completion as a local completion of well-containment uniform spaces","items":[{"name":"AffineConstructive.topology.unif_born.trapped_wc.id","base":"id","kind":"abbrev","start":15,"body":null,"status":"ok","short":{"text":"Local abbreviation for the identity function of a set, the set inferred","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.set.id_fun]], the identity function of a set, with the set left to be inferred from context. Nothing recorded uses it yet.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.ℒ","base":"ℒ","kind":"abbrev","start":16,"body":null,"status":"ok","short":{"text":"Local shorthand ℒ X for the localization of X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.localization]]: ℒ X is the set X carrying the localized uniformity and the same bornology. The trapped completion is built from Cauchy filters on ℒ X; this file translates its interface so that users of the completion need not mention ℒ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.Λ","base":"Λ","kind":"abbrev","start":17,"body":null,"status":"ok","short":{"text":"Local shorthand Λ X for the localized uniformity of X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.localized_uniformity]], the uniformity of ℒ X. It appears in the proof that the counit ρ reflects neighbourhoods, where an entourage of the localization is compared with ambient entourages of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.ε","base":"ε","kind":"abbrev","start":18,"body":null,"status":"ok","short":{"text":"Local shorthand ε X for the map ℒ X ⇾ X out of the localization","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.from_localization]], the identity of the underlying set seen as a map from the localization ℒ X to X. Together with η it converts maps between X and Y into maps between ℒ X and ℒ Y, the form the trapped-completion machinery accepts.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.η","base":"η","kind":"abbrev","start":19,"body":null,"status":"ok","short":{"text":"Local shorthand η X for the map X ⇾ ℒ X into the localization","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.localization.to_localization]], the identity of the underlying set seen as a map from X to its localization ℒ X. The unit of the trapped completion is τ₀ X ∘ η X, and maps f are transported to the localizations as η Y ∘ f ∘ ε X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.κ","base":"κ","kind":"abbrev","start":20,"body":null,"status":"ok","short":{"text":"Local shorthand κ X for the unit X ⇾ 𝒞 X of the Cauchy completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy]], the map sending a point of X to its principal Cauchy filter. It is the target of [[AffineConstructive.topology.unif_born.trapped_wc.from_trapped_spec]]: the trapped unit followed by ρ is κ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒞","base":"𝒞","kind":"abbrev","start":21,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒞 X for the Cauchy completion of X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_filter_set]], the set of Cauchy filters on X with the Cauchy equality. It is the codomain of ρ, which compares the trapped completion with the Cauchy completion of the ambient uniformity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒞₁","base":"𝒞₁","kind":"abbrev","start":22,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒞₁ f for the map of Cauchy completions induced by f","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]], which sends a Cauchy filter to its image filter along a uniformly continuous f. Applied to ε X it carries Cauchy filters of ℒ X to Cauchy filters of X, the second half of ρ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒯","base":"𝒯","kind":"abbrev","start":23,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒯 X for the trapped completion of X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_cauchy_filter_set]]: the trapped Cauchy filters on ℒ X, those with a bounded member, with equality as in 𝒞 (ℒ X). It is the completion whose intrinsic interface this file provides.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.τ₀","base":"τ₀","kind":"abbrev","start":24,"body":null,"status":"ok","short":{"text":"Local shorthand τ₀ X for the trapped unit ℒ X ⇾ 𝒯 X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_unit]], the unit of the trapped completion as it is defined on the localization: a point of ℒ X goes to its principal Cauchy filter. Precomposed with η X it gives the intrinsic unit [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.β","base":"β","kind":"abbrev","start":25,"body":null,"status":"ok","short":{"text":"Local shorthand β X for the embedding 𝒯 X ⇾ 𝒞 (ℒ X)","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_embedding]], which forgets that a trapped filter is trapped and views it as a Cauchy filter on ℒ X. It is the first half of ρ, and the neighbourhoods of 𝒯 X come from the uniformity pulled back along it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.to_trapped","base":"to_trapped","kind":"def","start":29,"body":null,"status":"ok","short":{"text":"The unit τ X : X ⇾ 𝒯 X of the trapped completion, a point to its principal filter","status":"ok"},"long":{"text":"The unit of the trapped completion stated on X itself: the composite of the passage η X to the localization with the trapped unit τ₀ X : ℒ X ⇾ 𝒯 X. A point goes to the principal Cauchy filter it generates on ℒ X, which is trapped because points are bounded.\n\nThe composite is the point of the definition. The trapped completion is constructed on ℒ X, where its properties are uniform and bornological ones; through η they become the intrinsic, local properties of a map out of X, and the lemmas following this definition record them in that form: τ X is initial and dense as a map of well-containment uniform spaces, and an embedding when X is separated. The file ends by showing it is a local completion, [[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.τ","base":"τ","kind":"abbrev","start":31,"body":null,"status":"ok","short":{"text":"Local shorthand τ X for the unit X ⇾ 𝒯 X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped]], the unit of the trapped completion on X itself, used throughout the file's statements.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.to_trapped_ubr","base":"to_trapped_ubr","kind":"prf","start":33,"body":[34,36],"status":"ok","short":{"text":"The unit τ X is uniformly and bornologically reflecting","status":"ok"},"proof":[{"text":"The unit τ X is the composite of the localization unit η : X ⇾ ℒ X with the unit of the trapped construction on ℒ X. The first is uniformly and bornologically reflecting by [[AffineConstructive.topology.unif_born.localization.to_localization_refl]], and the second is initial by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_unit_born_initial]]. So the composite is reflecting by [[AffineConstructive.topology.unif_born.base.compose_unif_born_reflecting]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.to_trapped_locally_initial","base":"to_trapped_locally_initial","kind":"prf","start":43,"body":[44,49],"status":"ok","short":{"text":"The unit τ X is an initial map of well-containment uniform spaces","status":"ok"},"proof":[{"text":"An initial map is a morphism that is also locally reflecting. The reflecting half follows from [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped_ubr]] through [[AffineConstructive.topology.unif_born.local_maps.unif_born_refl_local]]. What remains is that τ X is a morphism of well-containment uniform spaces.","status":"ok","from":0,"to":1},{"text":"The structures on X and on 𝒯 X are already known, so being a morphism reduces to τ X being locally uniformly continuous and bornological.","status":"ok","from":2,"to":2},{"text":"Write τ X as the trapped unit on ℒ X composed with η. By [[AffineConstructive.topology.unif_born.localization.localized_unif_born_conv]] it suffices that composing with the counit ε gives a uniformly continuous, bornological map. That composite is the trapped unit on ℒ X, which is initial by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_unit_born_initial]].","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.to_trapped_dense","base":"to_trapped_dense","kind":"prf","start":60,"body":[61,63],"status":"ok","short":{"text":"The unit τ X has dense range in 𝒯 X","status":"ok"},"proof":[{"text":"τ X is the composite of η : X ⇾ ℒ X, which is dense by [[AffineConstructive.topology.unif_born.localization.to_localization_dense]], with the trapped unit on ℒ X, which is dense by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_unit_dense]] and uniformly continuous, hence continuous. A dense map followed by a continuous map with dense range has dense range.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.to_trapped_emb","base":"to_trapped_emb","kind":"prf","start":65,"body":[66,69],"status":"ok","short":{"text":"For separated X, the unit τ X is an embedding of well-containment uniform spaces","status":"ok"},"proof":[{"text":"An embedding is an initial map that is injective. Initiality is [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped_locally_initial]], so it remains to show that τ X is injective.","status":"ok","from":0,"to":1},{"text":"On underlying sets η is the identity, which is injective, and for separated X the trapped unit on ℒ X is a uniform embedding by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_unit_emb]]. The composite of injective maps is injective.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.to_trapped_eq_ball","base":"to_trapped_eq_ball","kind":"prf","start":77,"body":[78,87],"status":"ok","short":{"text":"If τ X x = G, every ambient ball near U x belongs to the filter of G","status":"ok"},"proof":[{"text":"Apply the equality τ X x = G at the localized entourage obtained by pulling U back along ε. This gives a member B of the filter τ X x and a member A of G with B ⊗ A ⊆ U.","status":"ok","from":0,"to":1},{"text":"B belongs to the principal filter at x, so x ∊ B.","status":"ok","from":2,"to":2},{"text":"G is upward closed, so it suffices to show A ⊆ near U x.","status":"ok","from":3,"to":3},{"text":"Fix a. The goal is that a ∊ A implies that (x, a) is U-close. By the inclusion B ⊗ A ⊆ U, it suffices that a ∊ A implies x ∊ B ⊠ a ∊ A. Since x ∊ B is already proved, this reduces to a ∊ A implying itself.","status":"ok","from":4,"to":9}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.to_trapped_eq_closure","base":"to_trapped_eq_closure","kind":"prf","start":88,"body":[89,97],"status":"ok","short":{"text":"If τ X x = G, then x lies in the closure of every member of G","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.base.uniform_closure_applied2]], x lies in the closure of A when every entourage U has some point of A that is U-close to x.","status":"ok","from":0,"to":1},{"text":"Fix U. By [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped_eq_ball]], the ball near U x is a member of G.","status":"ok","from":2,"to":3},{"text":"Let M be the meet of this ball and A, which is again a member of G. The goal is then that M has a point.","status":"ok","from":4,"to":5},{"text":"G is a Cauchy filter, and every member of a Cauchy filter is inhabited. The point of M that this gives is the witness: it lies in A and is U-close to x.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.from_trapped","base":"from_trapped","kind":"def","start":99,"body":null,"status":"ok","short":{"text":"The map ρ X : 𝒯 X ⇾ 𝒞 X reading a trapped filter as a Cauchy filter on X","status":"ok"},"long":{"text":"The comparison of the trapped completion with the Cauchy completion of the ambient uniformity: a trapped filter is first viewed as a Cauchy filter on ℒ X by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_embedding]], then carried to X along the identity ε X by [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]]. Since the uniformity of ℒ X is finer than that of X, a Cauchy filter on ℒ X is Cauchy on X, and the map is uniformly continuous.\n\nIt plays the part of a counit, with the twist that it lands in 𝒞 X rather than in X: it satisfies ρ X ∘ τ X = κ X ([[AffineConstructive.topology.unif_born.trapped_wc.from_trapped_spec]]), and for a well-containment space it is a topological embedding ([[AffineConstructive.topology.unif_born.trapped_wc.from_trapped_cont_emb]]), so 𝒯 X sits inside the Cauchy completion of X as a topological subspace although its uniformity is finer.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.ρ","base":"ρ","kind":"abbrev","start":101,"body":null,"status":"ok","short":{"text":"Local shorthand ρ X for the map 𝒯 X ⇾ 𝒞 X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.from_trapped]], the comparison of the trapped completion with the Cauchy completion of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.from_trapped_uc","base":"from_trapped_uc","kind":"prf","start":102,"body":[103,105],"status":"ok","short":{"text":"The map ρ X : 𝒯 X ⇾ 𝒞 X is uniformly continuous","status":"ok"},"proof":[{"text":"ρ X is the embedding β : 𝒯 X ⇾ 𝒞 (ℒ X) followed by 𝒞₁ ε. Here β is a uniform embedding by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_embedding_ue]], and 𝒞₁ ε is uniformly continuous because ε is, by [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map_ufm_cont]]. The composite is therefore uniformly continuous.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.from_trapped_spec","base":"from_trapped_spec","kind":"def","start":109,"body":[110,113],"status":"ok","short":{"text":"The trapped unit followed by ρ is the Cauchy unit: ρ X ∘ τ X = κ X","status":"ok"},"proof":[{"text":"Unfolded, ρ X ∘ τ X is 𝒞₁ ε ∘ κ (ℒ X) ∘ η X.","status":"ok","from":0,"to":1},{"text":"Naturality of the Cauchy unit, [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map_spec]], turns 𝒞₁ ε ∘ κ (ℒ X) into κ X ∘ ε. Since ε ∘ η is the identity, what is left is κ X.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.C","base":"C","kind":"abbrev","start":118,"body":null,"status":"ok","short":{"text":"Local abbreviation for the basic entourages C X W of the Cauchy completion","status":"ok"},"long":{"text":"A local abbreviation, inside the section on the comparison map ρ : 𝒯 X ⇾ 𝒞 X, for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_entourage]]: C X W is the basic entourage of 𝒞 X determined by an entourage W of X, and every entourage of 𝒞 X contains one of these. One proof in this file uses it.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.from_trapped_cont_emb","base":"from_trapped_cont_emb","kind":"prf","start":119,"body":[120,142],"status":"ok","short":{"text":"For a well-containment space X, ρ X : 𝒯 X ⇾ 𝒞 X is a topological embedding","status":"ok"},"proof":[{"text":"𝒯 X is separated by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_separated]], so its topology is T₀. By [[AffineConstructive.topology.topology.base.cont_initial_embedding]] it therefore suffices to show that ρ X is continuously initial.","status":"ok","from":0,"to":1},{"text":"Continuity follows from uniform continuity, [[AffineConstructive.topology.unif_born.trapped_wc.from_trapped_uc]]. What remains is that ρ X reflects neighbourhoods.","status":"ok","from":2,"to":2},{"text":"Fix F in 𝒯 X and N ⊆ 𝒯 X. If N is a neighbourhood of F, a neighbourhood of ρ X F must be found whose preimage lies in N. Because F is trapped, it has a bounded member K by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_prop]], and this anchors the argument. Both neighbourhood relations are then unfolded into balls of entourages.","status":"ok","from":3,"to":5},{"text":"Let E be an entourage of 𝒯 X whose ball around F lies in N. E contains the β-preimage of an entourage D of 𝒞 (ℒ X), and D contains the basic relation C (ℒ X) V for some localized entourage V, by [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_entourage_basis]].","status":"ok","from":6,"to":8},{"text":"At F, with its bounded member K, [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_transport]] gives an ambient entourage U such that U-closeness to F implies V-closeness. By [[AffineConstructive.topology.uniform.base.uniform_split_sym3]], choose a symmetric W with W ∙ W ∙ W ⊆ U.","status":"ok","from":9,"to":10},{"text":"Take as the witness the ball around ρ X F for the basic entourage C X W. It is a neighbourhood of ρ X F by its own definition. Since the E-ball around F lies in N, it suffices that the preimage of this ball lies in that E-ball.","status":"ok","from":11,"to":13},{"text":"Fix G such that ρ X F and ρ X G are C X W-close; the task is to show that (F, G) ∊ E. Through the inclusions coming from D and V, it suffices that β F and β G are C (ℒ X) V-close.","status":"ok","from":14,"to":16},{"text":"Unfolding the basic relations: for every ambient S there are members of ρ X F and ρ X G whose product lies in S⁻¹ ∙ W ∙ S. From this it must follow that, for every localized S, members of F and G have product in S⁻¹ ∙ V ∙ S. Fix S. Since V ⊆ S⁻¹ ∙ V ∙ S, it suffices to find members with product in V.","status":"ok","from":17,"to":19},{"text":"Specialise the hypothesis at S = W. By the transport property of U, it suffices to find members with product in U. Since W⁻¹ = W and W ∙ W ∙ W ⊆ U, the members given for W serve.","status":"ok","from":20,"to":22}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.map.instance:localize_functorial_alt","base":"instance:localize_functorial_alt","kind":"existing_instance","start":151,"body":null,"status":"ok","short":{"text":"Within the section, resolution finds η Y ∘ f ∘ ε X : ℒ X ⇾ ℒ Y as a morphism when f is locally uniformly continuous and bornological","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map","base":"wc_trapped_map","kind":"def","start":152,"body":null,"status":"ok","short":{"text":"The map 𝒯₁ f : 𝒯 X ⇾ 𝒯 Y induced by a morphism f of well-containment spaces","status":"ok"},"long":{"text":"The functor action of the trapped completion on morphisms of well-containment uniform spaces. A morphism f : X ⇾ Y is only locally uniformly continuous, so the map is built from its transport η Y ∘ f ∘ ε X between the localizations, which is uniformly continuous and bornological ([[AffineConstructive.topology.unif_born.localization.localize_functorial_alt]]), and [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map]] applied to that transport.\n\nThe lemmas that follow state its properties without reference to ℒ: it commutes with the units ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]]), it is itself a morphism, it is dense when f is, and it is initial when f is.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit","base":"wc_trapped_map_unit","kind":"prf","start":153,"body":[154,156],"status":"ok","short":{"text":"Naturality of the unit: 𝒯₁ f ∘ τ X = τ Y ∘ f","status":"ok"},"proof":[{"text":"This is naturality of the trapped unit on localizations, [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map_unit]], applied to η Y ∘ f ∘ ε X. That map is a morphism ℒ X ⇾ ℒ Y by [[AffineConstructive.topology.unif_born.localization.localize_functorial_alt]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor","base":"wc_trapped_map_mor","kind":"prf","start":157,"body":[158,162],"status":"ok","short":{"text":"The induced map 𝒯₁ f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"A morphism of well-containment uniform spaces goes between two well-containment spaces and is locally uniformly continuous and bornological. 𝒯 X and 𝒯 Y are well-containment spaces by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_wcunif_space]], so it remains to show that 𝒯₁ f is locally uniformly continuous and bornological.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.topology.unif_born.localization.localized_unif_born_conv]] it suffices to show that 𝒯₁ f ∘ ε is uniformly continuous and bornological. Unfolding 𝒯₁ f shows this composite to be built from the trapped functor action on the localizations, which is a morphism by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map_bornological]], together with the counit ε, also a morphism. Composites of morphisms are morphisms.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_dense","base":"wc_trapped_map_dense","kind":"prf","start":163,"body":[164,166],"status":"ok","short":{"text":"If f is dense, so is the induced map 𝒯₁ f","status":"ok"},"proof":[{"text":"Once 𝒯₁ f is unfolded, it is the trapped functor action applied to η Y ∘ f ∘ ε X. That transported map is dense, because f, η and ε are dense, so [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_map_dense]] makes its image under 𝒯 dense.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.𝒯₁","base":"𝒯₁","kind":"abbrev","start":170,"body":null,"status":"ok","short":{"text":"Local shorthand 𝒯₁ f for the induced map of trapped completions","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map]], the functor action of the trapped completion on a morphism of well-containment uniform spaces.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_initial","base":"wc_trapped_map_initial","kind":"prf","start":177,"body":[178,182],"status":"ok","short":{"text":"If f is initial, so is the induced map 𝒯₁ f","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_mor]], 𝒯₁ f is already a morphism of well-containment spaces, so being initial reduces to being locally initial.","status":"ok","from":0,"to":1},{"text":"τ X is dense, and both τ X and 𝒯₁ f are local morphisms. So [[AffineConstructive.topology.unif_born.localization.dense_locally_initial]] reduces the claim to showing that 𝒯₁ f ∘ τ X is locally reflecting. By the naturality square [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_map_unit]] this composite equals τ Y ∘ f, and that is locally reflecting because f is (it is initial) and τ Y is (by [[AffineConstructive.topology.unif_born.trapped_wc.to_trapped_ubr]]), and composites of locally reflecting maps are locally reflecting.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.reflect.instance:localize_functorial_refl_alt","base":"instance:localize_functorial_refl_alt","kind":"existing_instance","start":193,"body":null,"status":"ok","short":{"text":"Within the section, resolution finds η Y ∘ f ∘ ε X reflecting when f is dense and locally reflecting into a well-containment space","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_reflect_lift_dense","base":"wc_reflect_lift_dense","kind":"inst","start":194,"body":[195,197],"status":"ok","short":{"text":"If f is dense, so is its transport η Z ∘ f ∘ ε X between the localizations","status":"ok"},"proof":[{"text":"Regroup the composite as η Z ∘ (f ∘ ε X). The inner map f ∘ ε X is dense because both factors are. The unit η Z is dense, and it is continuous because it is locally uniformly continuous. By [[AffineConstructive.topology.topology.maps.Dense_compose]] the composite is dense.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect","base":"wc_trapped_reflect","kind":"def","start":198,"body":null,"status":"ok","short":{"text":"The reflection Z ⇾ 𝒯 X of a dense, locally reflecting f : X ⇾ Z","status":"ok"},"long":{"text":"Given a dense map f : X ⇾ Z between well-containment uniform spaces which is locally reflecting, the map back from Z into the trapped completion of X: a point z goes to the trapped filter traced on ℒ X by the balls about z. It is built on the localizations, as [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect]] of the transport η Z ∘ f ∘ ε X (reflecting by [[AffineConstructive.topology.unif_born.localization.localize_functorial_refl_alt]], dense by [[AffineConstructive.topology.unif_born.trapped_wc.wc_reflect_lift_dense]]), precomposed with η Z.\n\nIt is the operation of the universal property of 𝒯 X as a local completion: it inverts f against the unit, wc_trapped_reflect f ∘ f = τ X ([[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec]]), is a dense morphism, and is initial when f is.\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\tau\"'] & Z \\arrow[d, \"\\mathcal{R} f\"] \\\\\n & \\Trp X\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec","base":"wc_trapped_reflect_spec","kind":"prf","start":199,"body":[200,202],"status":"ok","short":{"text":"The reflection inverts f against the unit: wc_trapped_reflect f ∘ f = τ X","status":"ok"},"proof":[{"text":"The transported map η Z ∘ f ∘ ε X is dense and reflecting between localizations, which are well-containment spaces. The equation is therefore an instance of [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect_spec]] for that map.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor","base":"wc_trapped_reflect_mor","kind":"prf","start":203,"body":[204,208],"status":"ok","short":{"text":"The reflection of f is a morphism of well-containment uniform spaces","status":"ok"},"proof":[{"text":"Z and 𝒯 X are well-containment spaces, so it remains to show that the reflection is locally uniformly continuous and bornological.","status":"ok","from":0,"to":1},{"text":"Unfolded, the reflection is the trapped reflection of η Z ∘ f ∘ ε X precomposed with η Z. By [[AffineConstructive.topology.unif_born.localization.localized_unif_born_conv]] it suffices that the trapped reflection itself is uniformly continuous and bornological. This is [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect_bornological]], which applies because the transported map is dense ([[AffineConstructive.topology.unif_born.trapped_wc.wc_reflect_lift_dense]]) and reflecting ([[AffineConstructive.topology.unif_born.localization.localize_functorial_refl_alt]]).","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_dense","base":"wc_trapped_reflect_dense","kind":"prf","start":209,"body":[210,212],"status":"ok","short":{"text":"The reflection of f has dense range in 𝒯 X","status":"ok"},"proof":[{"text":"Unfolded, the reflection is the trapped reflection of the transported map η Z ∘ f ∘ ε X, precomposed with the dense unit η Z. The trapped reflection is dense by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect_dense]] and uniformly continuous, so the composite is dense.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.reflect.instance:localize_functorial_initial_alt","base":"instance:localize_functorial_initial_alt","kind":"existing_instance","start":225,"body":null,"status":"ok","short":{"text":"Within the section, resolution finds η Y ∘ f ∘ ε X initial when f is dense and locally initial into a well-containment space","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_initial","base":"wc_trapped_reflect_initial","kind":"prf","start":226,"body":[227,232],"status":"ok","short":{"text":"If f is initial and dense, its reflection is initial","status":"ok"},"proof":[{"text":"The forward half is [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor]]. Both spaces are well-containment spaces, so what remains of the reflecting half is that the reflection is locally reflecting.","status":"ok","from":0,"to":2},{"text":"Unfold the reflection as the trapped reflection of η Z ∘ f ∘ ε X followed by η Z. By [[AffineConstructive.topology.unif_born.localization.localized_unif_born_refl_conv]] it suffices that the trapped reflection is reflecting. The transported map is dense, and it is initial by [[AffineConstructive.topology.unif_born.localization.localize_functorial_initial_alt]] because f is locally initial. So [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_reflect_unif_born_initial]] makes its trapped reflection initial, and in particular reflecting.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion_reflect","base":"trapped_local_completion_reflect","kind":"def","start":241,"body":null,"status":"ok","short":{"text":"The local-completion operation for τ X: a dense reflecting f goes to its reflection","status":"ok"},"long":{"text":"Equips the unit τ X with the operation required of a local completion: to every dense, locally reflecting map f from X to a well-containment space Z it assigns [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect]] f : Z ⇾ 𝒯 X. The laws the operation must satisfy are proved in [[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion","base":"trapped_local_completion","kind":"prf","start":244,"body":[245,251],"status":"ok","short":{"text":"The unit τ X : X ⇾ 𝒯 X is a local completion of X","status":"ok"},"proof":[{"text":"A local completion is separated, dense and initial, and has a reflection for every dense initial map out of X. 𝒯 X is separated by [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_separated]], τ X is dense and initial, and the reflection is [[AffineConstructive.topology.unif_born.trapped_wc.trapped_local_completion_reflect]]. Let f : X ⇾ Z be dense and initial. It remains to show that the reflection of f is a morphism and that composing it with f gives τ X.","status":"ok","from":0,"to":1},{"text":"The reflection is a morphism by [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_mor]].","status":"ok","from":2,"to":3},{"text":"Composing the reflection with f gives τ X by [[AffineConstructive.topology.unif_born.trapped_wc.wc_trapped_reflect_spec]].","status":"ok","from":4,"to":6}]}],"diagrams":{"svg":{"\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\tau\"'] & Z \\arrow[d, \"\\mathcal{R} f\"] \\\\\n & \\Trp X":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='74.283pt' height='52.834pt' viewBox='0 0 74.283 52.834'>\n<defs>\n<path id='g3-1' d='M3.37348-4.33534C4.78839-4.33534 5.11598-4.0426 5.11598-3.58258C5.11598-3.02498 4.69778-2.36283 3.51985-2.32798C3.37348-2.32101 3.28984-2.32101 3.10165-2.20949C2.99013-2.13979 2.87164-2.03524 2.87164-1.96554C2.87164-1.92372 2.89255-1.90978 2.94831-1.90281C3.25499-1.85402 3.4153-1.66583 3.82653-.91307C4.20291-.21607 4.43292 .1394 4.87203 .1394C5.77813 .1394 6.65635-.72488 6.65635-.87125C6.65635-.87822 6.64938-.92701 6.57271-.92701C6.50998-.92701 6.24512-.86428 6.04299-.6273C5.95238-.52275 5.74328-.28577 5.3669-.28577S4.7396-.75973 4.43989-1.3243C4.17503-1.80523 4.05654-1.95857 3.96593-2.05615C5.20659-2.48829 5.76419-3.25499 5.76419-3.89623C5.76419-4.76051 4.67687-4.76051 3.33166-4.76051C2.45344-4.76051 2.02827-4.76051 1.40794-4.51656C.48093-4.14715 .27183-3.54076 .27183-3.42924C.27183-3.37348 .32062-3.36651 .35547-3.36651C.46002-3.36651 .8364-3.50591 .92004-3.74986C1.01065-4.02866 1.10126-4.27958 2.22343-4.33534C2.091-2.4395 1.56825-1.01762 1.17096-.0697C1.

) (S : 𝒫 X) : K' ≤ K ⊠ K ⋐ S ⊸ K' ⋐ S.\n  Proof. exact (unif_below_le_l _ _ _). Qed.\n\n  Lemma wc_le_r (K:𝒜) (S S' : 𝒫 X) : K ⋐ S ⊠ S ⊆ S' ⊸ K ⋐ S'.\n  Proof. exact (unif_below_le_r _ _ _). Qed.\n\n  Lemma wc_proper_aimpl {K K':𝒜} {S S' : 𝒫 X} : K' ≤ K → S ⊆ S' → K ⋐ S ⊸ K' ⋐ S'.\n  Proof. exact unif_below_proper_aimpl. Qed.\nEnd well_contained.\n#[global] Hint Extern 1 (apos (aimpl (_ ⋐ _, _))) => sapply_2 wc_proper_aimpl : proper.\n\nSection well_contained.\n  Context `{@UnifBornSpace X Φ 𝒜}.\n\n  Lemma wc_join (K₁ K₂:𝒜) (S : 𝒫 X) : K₁ ⋐ S ⊠ K₂ ⋐ S ⊸ K₁ ⊔ K₂ ⋐ S.\n  Proof. exact (unif_below_join _ _ _). Qed.\n\n  Lemma wc_meet (K:𝒜) (S₁ S₂ : 𝒫 X) : K ⋐ S₁ ⊠ K ⋐ S₂ ⊸ K ⋐ S₁ ⊓ S₂.\n  Proof. exact (unif_below_meet _ _ _). Qed.\n\n  Lemma wc_empty (S : 𝒫 X) : ⊥ ⋐ S.\n  Proof. exact (unif_below_empty S). Qed.\n\n  Lemma wc_top (K : 𝒜) : K ⋐ ⊤.\n  Proof. exact (unif_below_top K). Qed.\n\n  Lemma wc_int_r (K:𝒜) (S : 𝒫 X) : K ⋐ S ⊸ K ⋐ interior S.\n  Proof. exact (unif_below_int_r _ _). Qed.\n\n  Lemma wc_sub_interior (K:𝒜) (S : 𝒫 X) : K ⋐ S ⊸ K ⊆ interior S.\n  Proof. exact (unif_below_sub_interior _ _). Qed.\n\n  Lemma wc_trans (K S:𝒜) (T : 𝒫 X) : K ⋐ powerset_pt S ⊠ S ⋐ T ⊸ K ⋐ T.\n  Proof. exact (transitivity uniformly_below _ _ _). Qed.\nEnd well_contained.\n\n(** With the WCUnif thickening axiom, interpolation and closure keep the\n    bounded leg: the interpolant [U.[K]] is again well-contained. *)\nSection wcunif.\n  Context `{@WCUnifSpace X Φ 𝒜}.\n\n  Lemma wc_interpolate (K:𝒜) (S : 𝒫 X) : K ⋐ S ⊸ ∐ K', K ⋐ powerset_pt K' ⊠ K' ⋐ S.\n  Proof. change (?a ⋐ ?b) with (powerset_pt a ◁ b).\n    rew (unif_below_interpolate K S).\n    rew <-aex_adj; intros U.\n    pose proof wcunif_thicken X K as [V HV].\n    assert ((U ⊓ V).[powerset_pt K] ∊ 𝒜) by now rew (meet_lb_r _ _).\n    rew <-(meet_lb_l U V).\n    pose (K' := (to_subset (U ⊓ V).[powerset_pt K])).\n    rew <-(aex_ub _ K').\n    change ((U ⊓ V).[powerset_pt K] ◁ S ⊸ powerset_pt K ◁  (U ⊓ V).[powerset_pt K] ⊠ (U ⊓ V).[powerset_pt K] ◁ S).\n    now rew (aprod_true_l (unif_below_thicken _ K)).\n  Qed.\n\n  Local Instance wcunif_closure_bounded (K:𝒜) : closure K ∊ 𝒜.\n  Proof. pose proof (wcunif_thicken X K) as [U HU].\n    now rew (closure_sub_thicken U K).\n  Qed.\n  \n  Definition born_closure (K:𝒜) : 𝒜 := to_subset (closure K).\n\n  Lemma wc_closure (K:𝒜) (S : 𝒫 X) : K ⋐ S ⊸ born_closure K ⋐ S.\n  Proof. exact (unif_below_closure K S). Qed.\nEnd wcunif.\n\n","sentences":[{"i":0,"s":0,"e":344,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":345,"e":399,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":400,"e":459,"kind":"vernac","status":"ok","ms":38,"messages":[],"goals":null},{"i":3,"s":460,"e":486,"kind":"vernac","status":"ok","ms":13,"messages":[],"goals":null},{"i":4,"s":487,"e":538,"kind":"vernac","status":"ok","ms":19,"messages":[],"goals":null},{"i":5,"s":539,"e":575,"kind":"vernac","status":"ok","ms":43,"messages":[],"goals":null},{"i":6,"s":576,"e":672,"kind":"vernac","status":"ok","ms":19,"messages":[],"goals":null},{"i":7,"s":673,"e":709,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":710,"e":812,"kind":"vernac","status":"ok","ms":30,"messages":[],"goals":null},{"i":9,"s":813,"e":901,"kind":"vernac","status":"ok","ms":19,"messages":[],"goals":null},{"i":10,"s":902,"e":932,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":11,"s":933,"e":989,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":12,"s":991,"e":1023,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":13,"s":1024,"e":1053,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":14,"s":1054,"e":1081,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":15,"s":1082,"e":1112,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i" et","name":"powerset_pt","kind":"def","local":false,"page":"../../interfaces/subset.html"},{"s":3151,"e":3162,"lib":"AffineConstructive.interfaces.subset","name":"powerset_pt","kind":"def","local":false,"page":"../../interfaces/subset.html"},{"s":3177,"e":3188,"lib":"AffineConstructive.interfaces.subset","name":"powerset_pt","kind":"def","local":false,"page":"../../interfaces/subset.html"},{"s":3203,"e":3214,"lib":"AffineConstructive.interfaces.subset","name":"powerset_pt","kind":"def","local":false,"page":"../../interfaces/subset.html"},{"s":3237,"e":3249,"lib":"AffineConstructive.logic.aprop","name":"aprod_true_l","kind":"def","local":false,"page":"../../logic/aprop.html"},{"s":3251,"e":3269,"lib":"AffineConstructive.topology.uniform.uniformly_below","name":"unif_below_thicken","kind":"thm","local":false,"page":"../uniform/uniformly_below.html"},{"s":3328,"e":3330,"lib":"AffineConstructive.topology.unif_born.well_contained","name":"wcunif.𝒜","kind":"var","local":true},{"s":3334,"e":3341,"lib":"AffineConstructive.topology.interfaces.topology","name":"closure","kind":"def","local":false,"page":"../interfaces/topology.html"},{"s":3346,"e":3348,"lib":"AffineConstructive.topology.unif_born.well_contained","name":"wcunif.𝒜","kind":"var","local":true},{"s":3371,"e":3385,"lib":"AffineConstructive.topology.interfaces.unif_born","name":"wcunif_thicken","kind":"def","local":false,"page":"../interfaces/unif_born.html"},{"s":3386,"e":3387,"lib":"AffineConstructive.topology.unif_born.well_contained","name":"wcunif.X","kind":"var","local":true},{"s":3415,"e":3434,"lib":"AffineConstructive.topology.uniform.base","name":"closure_sub_thicken","kind":"thm","local":false,"page":"../uniform/base.html"},{"s":3480,"e":3482,"lib":"AffineConstructive.topology.unif_born.well_contained","name":"wcunif.𝒜","kind":"var","local":true},{"s":3486,"e":3488,"lib":"AffineConstructive.topology.unif_born.well_contained","name":"wcunif.𝒜","kind":"var","local":true},{"s":3492,"e":3501,"lib":"AffineConstructive.interfaces.subset","name":"to_subset","kind":"def","local":false,"page":"../../interfaces/subset.html"},{"s":3503,"e":3510,"lib":"AffineConstructive.topology.interfaces.topology","name":"closure","kind":"def","local":false,"page":"../interfaces/topology.html"},{"s":3538,"e":3540,"lib":"AffineConstructive.topology.unif_born.well_contained","name":"wcunif.𝒜","kind":"var","local":true},{"s":3547,"e":3549,"lib":"AffineConstructive.interfaces.subset.notation","name":"𝒫","kind":"abbrev","local":false,"page":"../../interfaces/subset/notation.html"},{"s":3550,"e":3551,"lib":"AffineConstructive.topology.unif_born.well_contained","name":"wcunif.X","kind":"var","local":true},{"s":3563,"e":3575,"lib":"AffineConstructive.topology.unif_born.well_contained","name":"born_closure","kind":"def","local":true},{"s":3599,"e":3617,"lib":"AffineConstructive.topology.uniform.uniformly_below","name":"unif_below_closure","kind":"thm","local":false,"page":"../uniform/uniformly_below.html"},{"s":2825,"e":2828,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2863,"e":2866,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2978,"e":2981,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2982,"e":2985,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3007,"e":3010,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3088,"e":3091,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3228,"e":3231,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3232,"e":3235,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3406,"e":3409,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3410,"e":3413,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file develops the well-containment relation K ⋐ S of a set with a uniformity and a bornology: K is bounded and uniformly below S, the two conditions joined by the additive and. Most results carry over directly from the uniformly-below relation (uniform/uniformly_below.v): monotonicity in both arguments, closure under join on the left and meet on the right, the empty and whole cases, the passage to interiors, and transitivity. In a well-containment uniform space, where every bounded subset has a bounded thickening, two results get stronger. Interpolation ([[AffineConstructive.topology.unif_born.well_contained.wc_interpolate]]) gives a bounded intermediate subset, taken to be a thickening of K. The closure of a bounded subset is bounded ([[AffineConstructive.topology.unif_born.well_contained.wcunif_closure_bounded]], [[AffineConstructive.topology.unif_born.well_contained.born_closure]]), and it is well-contained in everything K is well-contained in ([[AffineConstructive.topology.unif_born.well_contained.wc_closure]]).","short":"Well-containment K ⋐ S: its order laws, transitivity, interpolation and closure","items":[{"name":"AffineConstructive.topology.unif_born.well_contained.wc_le_l","base":"wc_le_l","kind":"prf","start":19,"body":[20,22],"status":"ok","short":{"text":"Shrinking the bounded side preserves well-containment: K' ≤ K and K ⋐ S imply K' ⋐ S","status":"ok"},"proof":[{"text":"Since K and K' are taken from the bornology, their boundedness is already given. What remains of well-containment is the uniformly-below relation, and the statement is the corresponding fact for that relation, [[AffineConstructive.topology.uniform.uniformly_below.unif_below_le_l]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_le_r","base":"wc_le_r","kind":"prf","start":23,"body":[24,26],"status":"ok","short":{"text":"Enlarging the right side preserves well-containment: K ⋐ S and S ⊆ S' imply K ⋐ S'","status":"ok"},"proof":[{"text":"K is bounded, so K ⋐ S amounts to K being uniformly below S. Enlarging the right side preserves that relation, by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_le_r]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_proper_aimpl","base":"wc_proper_aimpl","kind":"prf","start":27,"body":[28,30],"status":"ok","short":{"text":"Given K' ≤ K and S ⊆ S', K ⋐ S implies K' ⋐ S'; lets rewriting go under ⋐","status":"ok"},"proof":[{"text":"For bounded K and K', well-containment is the uniformly-below relation, and K' ≤ K in the bornology is the inclusion K' ⊆ K. The statement is therefore the monotonicity of that relation in both arguments, [[AffineConstructive.topology.uniform.uniformly_below.unif_below_proper_aimpl]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_join","base":"wc_join","kind":"prf","start":35,"body":[36,38],"status":"ok","short":{"text":"K₁ ⋐ S and K₂ ⋐ S imply K₁ ⊔ K₂ ⋐ S","status":"ok"},"proof":[{"text":"K₁ and K₂ are bounded, and so is their join, so only the uniformly-below part needs proof. Two subsets each uniformly below S have a join uniformly below S, by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_join]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_meet","base":"wc_meet","kind":"prf","start":39,"body":[40,42],"status":"ok","short":{"text":"K ⋐ S₁ and K ⋐ S₂ imply K ⋐ S₁ ⊓ S₂","status":"ok"},"proof":[{"text":"K is bounded, so the claim concerns only the uniformly-below relation. A subset uniformly below both S₁ and S₂ is uniformly below their meet, by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_meet]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_empty","base":"wc_empty","kind":"prf","start":43,"body":[44,46],"status":"ok","short":{"text":"The empty bounded subset is well-contained in every subset: ⊥ ⋐ S","status":"ok"},"proof":[{"text":"The bottom element of the bornology is the empty subset. The empty subset is uniformly below every subset, by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_empty]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_top","base":"wc_top","kind":"prf","start":47,"body":[48,50],"status":"ok","short":{"text":"Every bounded subset is well-contained in the whole set: K ⋐ ⊤","status":"ok"},"proof":[{"text":"K is bounded, and every subset is uniformly below the whole set, by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_top]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_int_r","base":"wc_int_r","kind":"prf","start":51,"body":[52,54],"status":"ok","short":{"text":"K ⋐ S implies K is well-contained in the interior of S","status":"ok"},"proof":[{"text":"K is bounded, so only the uniformly-below part needs proof. A subset uniformly below S is uniformly below the interior of S, by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_int_r]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_sub_interior","base":"wc_sub_interior","kind":"prf","start":55,"body":[56,58],"status":"ok","short":{"text":"K ⋐ S implies K ⊆ interior S","status":"ok"},"proof":[{"text":"Well-containment of K in S includes K being uniformly below S. That alone places K inside the interior of S, by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_sub_interior]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_trans","base":"wc_trans","kind":"prf","start":59,"body":[60,62],"status":"ok","short":{"text":"Well-containment is transitive: K ⋐ S and S ⋐ T imply K ⋐ T, for bounded K and S","status":"ok"},"proof":[{"text":"K and S are both bounded, so the two hypotheses say that K is uniformly below S and that S is uniformly below T. These compose by the transitivity of the uniformly-below relation, [[AffineConstructive.topology.uniform.uniformly_below.unif_below_trans]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_interpolate","base":"wc_interpolate","kind":"prf","start":66,"body":[67,78],"status":"ok","short":{"text":"Interpolation: K ⋐ S implies there is a bounded K' with K ⋐ K' and K' ⋐ S","status":"ok"},"proof":[{"text":"K is bounded already, so K ⋐ S comes down to K ◁ S, and the same holds for any bounded K'. The goal becomes: K ◁ S implies there is a bounded K' with K ◁ K' ⊠ K' ◁ S.","status":"ok","from":0,"to":1},{"text":"By interpolation for the uniformly-below relation, [[AffineConstructive.topology.uniform.uniformly_below.unif_below_interpolate]], K ◁ S gives an entourage U with U[K] ◁ S. Take that U.","status":"ok","from":2,"to":3},{"text":"Since the space is a well-containment uniform space, [[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]] gives an entourage V whose thickening V[K] is bounded. The thickening (U ⊓ V)[K] lies inside V[K], and a bornology is downward closed, so (U ⊓ V)[K] is bounded too.","status":"ok","from":4,"to":5},{"text":"Shrinking the left-hand side keeps the uniformly-below relation, and (U ⊓ V)[K] ⊆ U[K]. So it suffices to start from (U ⊓ V)[K] ◁ S instead.","status":"ok","from":6,"to":6},{"text":"Take the bounded subset K' = (U ⊓ V)[K] as the witness. What is left to show is that (U ⊓ V)[K] ◁ S implies K ◁ (U ⊓ V)[K] ⊠ (U ⊓ V)[K] ◁ S.","status":"ok","from":7,"to":9},{"text":"The first factor holds without any hypothesis, since every subset is uniformly below each of its thickenings ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_thicken]]). The tensor therefore comes down to its second factor, which is the hypothesis.","status":"ok","from":10,"to":11}]},{"name":"AffineConstructive.topology.unif_born.well_contained.wcunif_closure_bounded","base":"wcunif_closure_bounded","kind":"inst","start":79,"body":[80,83],"status":"ok","short":{"text":"In a well-containment uniform space the closure of a bounded subset is bounded","status":"ok"},"proof":[{"text":"Since the space is a well-containment uniform space, [[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]] gives an entourage U whose thickening U[K] is bounded.","status":"ok","from":0,"to":1},{"text":"The closure of K lies inside every thickening of K ([[AffineConstructive.topology.uniform.base.closure_sub_thicken]]), so in particular inside U[K]. A bornology is downward closed, so the closure is bounded.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.unif_born.well_contained.born_closure","base":"born_closure","kind":"def","start":84,"body":null,"status":"ok","short":{"text":"The closure of a bounded subset, as a bounded subset","status":"ok"},"long":{"text":"For a bounded subset K of a well-containment uniform space, the closure of K regarded as a member of the bornology. It is bounded by [[AffineConstructive.topology.unif_born.well_contained.wcunif_closure_bounded]], so it can stand on the left of the well-containment relation ⋐, which only takes bounded subsets there.\n\nIt is used in [[AffineConstructive.topology.unif_born.well_contained.wc_closure]]: well-containment K ⋐ S passes to the closure of K.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.unif_born.well_contained.wc_closure","base":"wc_closure","kind":"prf","start":85,"body":[86,88],"status":"ok","short":{"text":"K ⋐ S implies that the closure of K is well-contained in S","status":"ok"},"proof":[{"text":"The closure of K is bounded, so well-containment of the closure in S comes down to its being uniformly below S. That follows from K ◁ S by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_closure]].","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment spaces, local morphisms, local completions","summary":"The file sets up uniform spaces that also carry a bornology. It starts from the bare pairing [[UnifBornSpace]], with no axiom relating the two structures, adds the thickening axiom [[UniformlyOpenBornology]] to obtain the well-containment uniform spaces [[WCUnifSpace]] and their regular variant [[RegularWCUnifSpace]], and defines the well-containment relation K ⋐ S. It then gives product certificates and the morphism classes, forward, reflecting, initial and embedding, both in the global form (uniform and bornological at once) and in the local form, where uniform continuity or reflection is asked only near bounded sets ([[LocalUniformContinuity]], [[LocalUniformReflection]]). It ends with the interface of a local completion, [[LocalCompletion]], and of a locally complete space, which the localization and the trapped completion later realise."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.subgroups":{"page":"../../theory/subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"../uniform/base.html","short":"Uniform spaces: closeness, thickening, induced topology, separation and the uniform reflection pair","summary":"This file develops the basic theory of uniform spaces. The uniformity of a uniform space is a sublattice of relations that is closed under composition and inversion. The file proves the elementary laws of closeness: reflexivity, symmetric splitting into two through six factors, and composition of close pairs. It also proves the laws of thickening, including the swap of a thickening across a complement. Every uniform space carries an induced topology, in which a separated space is Hausdorff and a regular space is strong. Interior, closure and density are described through entourages. The forward, reflecting, initial and embedding classes of maps are closed under composition, pass to their topological counterparts, and make 𝐔𝐧𝐢𝐟 a reflection pair with a morphism to the topological reflection pair 𝐀𝐓𝐨𝐩. The file ends with lemmas on images and preimages of thickenings and on dense maps, which the subspace, completion and bornology files use."},"AffineConstructive.topology.uniform.uniformly_below":{"page":"../uniform/uniformly_below.html","short":"The uniformly-below relation K ◁ S on subsets of a uniform space","summary":"The file develops the basic theory of the uniformly-below relation of pointfree topology on the subsets of a uniform space: K ◁ S holds when some thickening U[K] lies in S, that is, when S is a uniform neighbourhood of K ([[uniformly_below]]). The relation is contained in inclusion and is transitive. It is monotone, shrinking on the left and growing on the right ([[unif_below_proper_aimpl]]). The empty subset is uniformly below every subset, and every subset is uniformly below the whole set. The relation is closed under joins on the left and meets on the right, with the two entourages that the two hypotheses provide combined by their meet ([[unif_below_join]], [[unif_below_meet]]). It interpolates through a thickening ([[unif_below_interpolate]]), and it may be strengthened to the closure on the left and to the interior on the right; in particular K ◁ S gives K ⊆ interior S, and every point of the interior has its singleton uniformly below S. Supporting monotonicity lemmas for thickening ([[thicken_le]], [[thicken_le_r]], [[thicken_join_le]]) and hints that register the inclusion, the transitivity and the monotonicity with the rewriting system complete the file."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

ffineConstructive.topology.uniform":"topology/uniform.html","AffineConstructive.topology.uniform.induced":"topology/uniform/induced.html","AffineConstructive.topology.uniform.cauchy_completion":"topology/uniform/cauchy_completion.html","AffineConstructive.topology.bornology.base":"topology/bornology/base.html","AffineConstructive.topology.bornology.basis":"topology/bornology/basis.html","AffineConstructive.topology.bornology.product":"topology/bornology/product.html","AffineConstructive.topology.bornology.subspace":"topology/bornology/subspace.html","AffineConstructive.topology.unif_born.base":"topology/unif_born/base.html","AffineConstructive.topology.unif_born.well_contained":"topology/unif_born/well_contained.html","AffineConstructive.topology.unif_born.local_maps":"topology/unif_born/local_maps.html","AffineConstructive.topology.unif_born.open_immersion":"topology/unif_born/open_immersion.html","AffineConstructive.topology.unif_born.product":"topology/unif_born/product.html","AffineConstructive.topology.unif_born.localization":"topology/unif_born/localization.html","AffineConstructive.topology.unif_born.bounded_subspace":"topology/unif_born/bounded_subspace.html","AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.uniform.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices theory.subgroups orders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.topology uniform.base.\nRequire Import easy rewrite replc simplify tactics.misc.\n\nLocal Open Scope topology_scope.\nLocal Open Scope sg_op_scope.\nLocal Open Scope grp_scope.\nImport image_notation.\nImport tensor_map_notation.\n\nLocal Notation \"f ♯\" := (⟨f,f⟩*) (at level 1, left associativity, format \"f ♯\").\n\nDefinition presented_uniformity@{u} {X:set@{u}} {Λ:Type@{u}} (β:Λ → 𝒫 (X ⊗ X)) : Uniformity@{u} X\n  := presented_filter β.\n\nLemma presented_uniformity_prop@{u} {X:set@{u}} {Λ:Type@{u}} (β:Λ → 𝒫 (X ⊗ X))\n  : UniformityPresentation X (Φ:=presented_uniformity β) β.\nProof. now unfold UniformityPresentation, presented_uniformity. Qed.\n#[global] Hint Extern 2 (UniformityPresentation _ (Φ:=presented_uniformity _) _)\n  => simple notypeclasses refine presented_uniformity_prop : typeclass_instances.\n\nDefinition uniformity_presentation_basis_correct `{@UniformityPresentation X Φ Λ β}\n  : @UniformityBasis X Φ _ (filter_presentation_basis Φ β)\n:= filter_presentation_basis_correct.\n#[global] Hint Extern 2 (UniformityBasis (filter_presentation_basis _ _)) => simple notypeclasses refine uniformity_presentation_basis_correct : typeclass_instances.\n\nDefinition uniformity_basis@{u} `{H:@UniformityBasis@{u} X Φ Λ β}\n  := @filter_basis _ _ _ _ H.\n\nSection presented_pre_uniform_space.\n  Universes u.\n  Context `{@UniformityPresentation@{u} X Φ Λ β}.\n\n  Context\n    (refl: ∀ i, id_rel _ ⊆ β i)\n    (sym:  ∀ i, ∐ j, (β j)⁻¹ ⊆ β i)\n    (split: ∀ i, ∐ j, β j ∙ β j ⊆ β i).\n\n  Local Coercion uniformity_presentation_basis_correct : UniformityPresentation >-> UniformityBasis.\n\n  Lemma presented_pre_uniform_space: PreUniformSpace X.\n  Proof. split; try exact _.\n  + intros U. rew (filter_presentation Φ β U). rew <-aex_adj; intros i.\n    now rew (refl i).\n  + intros U. rew (filter_presentation Φ β _). rew <-aex_adj; intros i.\n    pose proof (sym i) as [j Pj]. rew <-(aex_ub _ j).\n    rew (order_preserving inv _ U). now rew <-Pj.\n  + intros U. pose proof uniformity_basis U as [i Pi].\n    rew <-(Pi : β i ⊆ U); clear Pi.\n    pose proof split i as [j Hj].\n    now exists (filter_presentation_basis Φ β j).\n  Qed.\nEnd presented_pre_uniform_space.\n\nSection presented_uniform_space.\n  Universes u.\n  Context {Λ X:set@{u}} {Λle:Le Λ} {β:Λ ⇾ 𝒫 (X ⊗ X)} {Φ:Uniformity X}.\n  Context `{!UniformityPresentation X β, !OrderPreserving β, !DownDirected Λ}.\n\n  Local Instance presented_uniformity_filter: Filter Φ.\n  Proof. exact presented_filter_filter. Qed.\n\n  Context\n    (refl: ∀ i, id_rel _ ⊆ β i)\n    (sym:  ∀ i, ∐ j, (β j)⁻¹ ⊆ β i)\n    (split: ∀ i, ∐ j, β j ∙ β j ⊆ β i).\n\n  Lemma presented_uniform_space: UniformSpace X.\n  Proof. split; try exact _. now apply presented_pre_uniform_space. Qed.\nEnd presented_uniform_space.\n\nLemma uniform_basis_self `{Φ:Uniformity X} : @UniformityBasis X Φ Φ id.\nProof. exact filter_basis_self. Qed.\n#[global] Hint Extern 100 (UniformityBasis _) => notypeclasses refine uniform_basis_self : typeclass_instances.\n\nLemma uniform_separated_by_basis `{@UniformityBasis X Φ Λ β, !UniformSpace X}\n  (sep: ∀ x y, (∏ i, (x, y) ∊ β i) ⊸ x = y)\n  : SeparatedUniformSpace X.\nProof. split; try exact _. intros x y. rew <-(sep x y).\n  rew <-all_adj; intros i. now rew (all_lb _ (β i)).\nQed. \n\nSection uniform_basis_converse.\n  Universes u.\n  Context `{@UniformityBasis X Φ Λ β, !UniformSpace X}.\n\n  Lemma uniform_basis_inhabited : Inhabited Λ.\n  Proof. pose proof (_ : Inhabited Φ) as [U _].\n    pose proof filter_basis β U as [i _]. now exists i.\n  Qed.\n\n  Lemma uniform_basis_down_directed i₁ i₂ :  ∐ i₃, β i₃ ⊆ β i₁ ⊠ β i₃ ⊆ β i₂.\n  Proof. pose proof down_directed (β i₁) (β i₂) as [U [H1 H2]].\n    pose proof filter_basis β U as [i₃ P]. exists i₃. now rew P.\n  Qed.\n\n  Lemma uniform_basis_split i :  ∐ j, ∏ x y z, near (β j) x y ⊠ near (β j) y z ⊸ near (β i) x z.\n  Proof. pose proof near_split (β i) as [V P].\n    pose proof filter_basis β V as [j Pj]. exists j. now rew Pj.\n  Qed.\n\n  Lemma uniform_basis_sym i :  ∐ j, ∏ x y, near (β j) y x ⊸ near (β i) x y.\n  Proof. pose proof near_sym (β i) as [V P].\n    pose proof filter_basis β V as [j Pj]. exists j. now rew Pj.\n  Qed.\nEnd uniform_basis_converse.\n\nLemma uniform_basis_separated `{@UniformityBasis X Φ Λ β, !SeparatedUniformSpace X}\n  x y : x = y ⧟ ∏ i, near (β i) x y.\nProof. split.\n+ rew <-all_adj; intros i. apply near_refl_alt.\n+ rew (uniform_separated_iff _ _), <-all_adj; intros U.\n  pose proof filter_basis β U as [i Pi]. now rew (all_lb _ i), Pi.\nQed.\n\nLemma ufm_conty_by_basis@{u} `{@UniformityBasis@{u} X Φ Λ₁ α, @UniformityBasis@{u} Y Ψ Λ₂ β} {f:X → Y}\n  : (∀ j, ∐ i, ∏ x y, near (α i) x y ⊸ near (β j) (f x) (f y)) → UniformContinuity f.\nProof. intros P V.\n  pose proof filter_basis β V as [j Pj]. pose proof (P j) as [i Pi]. exists (α i).\n  intros x y. rew (Pi _ _). exact (Pj _).\nQed.\n\nLemma ufm_refln_by_basis@{u} `{@UniformityBasis@{u} X Φ Λ₁ α, @UniformityBasis@{u} Y Ψ Λ₂ β} {f:X → Y}\n  : (∀ i, ∐ j, ∏ x y, near (β j) (f x) (f y) ⊸ near (α i) x y) → UniformReflection f.\nProof. intros P U.\n  pose proof filter_basis α U as [i Pi]. pose proof (P i) as [j Pj]. exists (β j).\n  intros x y. rew (Pj _ _). exact (Pi _).\nQed.\n\n\nLemma ufm_cont_by_basis@{u} `{@UniformityBasis@{u} X Φ Λ₁ α, @UniformityBasis@{u} Y Ψ Λ₂ β} {f:X ⇾ Y}\n  `{!UniformSpace X, !UniformSpace Y}\n  : (∀ j, ∐ i, ∏ x y, near (α i) x y ⊸ near (β j) (f x) (f y)) → UniformlyContinuous f.\nProof. intros P. split; try exact _. now apply ufm_conty_by_basis. Qed.\n\nLemma ufm_refl_by_basis@{u} `{@UniformityBasis@{u} X Φ Λ₁ α, @UniformityBasis@{u} Y Ψ Λ₂ β} {f:X ⇾ Y}\n  `{!UniformSpace X, !UniformSpace Y}\n  : (∀ i, ∐ j, ∏ x y, near (β j) (f x) (f y) ⊸ near (α i) x y) → UniformlyReflecting f.\nProof. intros P. split; try exact _. now apply ufm_refln_by_basis. Qed.\n\nLemma ufm_cont_by_basis_alt@{u} `{@UniformityBasis@{u} X Φ Λ₁ α, @UniformityBasis@{u} Y Ψ Λ₂ β} {f:X ⇾ Y}\n  `{!UniformSpace X, !UniformSpace Y}\n  : (∀ j, ∐ i, α i ⊆ f♯ (β j)) → UniformlyContinuous f.\nProof. intros P. apply ufm_cont_by_basis. intros j. specialize (P j) as [i Pi].\n  exists i. intros x y. exact (Pi (x,y)).\nQed.\n\nLemma ufm_refl_by_basis_alt@{u} `{@UniformityBasis@{u} X Φ Λ₁ α, @UniformityBasis@{u} Y Ψ Λ₂ β} {f:X ⇾ Y}\n  `{!UniformSpace X, !UniformSpace Y}\n  : (∀ i, ∐ j, f♯ (β j) ⊆ α i) → UniformlyReflecting f.\nProof. intros P. apply ufm_refl_by_basis. intros i. specialize (P i) as [j Pj].\n  exists j. intros x y. exact (Pj (x,y)).\nQed.\n\n\n(** Topological notions *)\n\nSection via_basis.\n  Context `{@UniformityBasis X Φ Λ β}.\n\n  Lemma uniform_basis_interior\n    : interior = set:(λ A:𝒫 X, { x:X | ∐ i, near (β i) x ⊆ A}).\n  Proof. intros A x.\n    change ( (∐ (U:Φ), ∏ y, near U x y ⊸ y ∊ A) ⧟ (∐ i, ∏ y, (x, y) ∊ β i ⊸ y ∊ A) ); split.\n  + rew <-aex_adj; intros U. pose proof filter_basis β U as [i Pi].\n    rew <-(aex_ub _ i). now rew (Pi : powerset_pt (β i) ⊆ powerset_pt U).\n  + rew <-aex_adj; intros i. now rew <-(aex_ub _ (β i)).\n  Qed.\n\n  Definition uniform_basis_interior_applied {A}\n    : interior A = { x:X | ∐ i, near (β i) x ⊆ A}\n  := uniform_basis_interior A.\n\n  Definition uniform_basis_interior_applied2 {A} {x}\n    : x ∊ interior A ⧟ ∐ i, near (β i) x ⊆ A\n  := uniform_basis_interior A x.\n\n  Lemma uniform_basis_closure\n    : closure = set:(λ A:𝒫 X, { x:X | ∏ i, ∐ y, near (β i) x y ⊠ y ∊ A}).\n  Proof. intros A x.\n    change ( (∏ (U:Φ), ∐ y, near U x y ⊠ y ∊ A) ⧟ (∏ i, ∐ y, (x, y) ∊ β i ⊠ y ∊ A) ); split.\n  + rew <-all_adj; intros i. now rew (all_lb _ (β i)).\n  + rew <-all_adj; intros U. pose proof filter_basis β U as [i Pi].\n    rew (all_lb _ i). now rew (Pi : powerset_pt (β i) ⊆ powerset_pt U).\n  Qed.\n\n  Definition uniform_basis_closure_applied {A}\n    : closure A = { x:X | ∏ i, ∐ y, near (β i) x y ⊠ y ∊ A}\n  := uniform_basis_closure A.\n\n  Definition uniform_basis_closure_applied2 {A} {x}\n    : x ∊ closure A ⧟ ∏ i, ∐ y, near (β i) x y ⊠ y ∊ A\n  := uniform_basis_closure A x.\n\n  Lemma uniform_basis_dense\n    : dense = { A : 𝒫 X | ∏ (x:X) i, ∐ y, near (β i) x y ⊠ y ∊ A }.\n  Proof. intros A.\n    change (closure A = ⊤ ⧟ ∏ (x : X) (i : Λ), ∐ y : X,  near (β i) x y ⊠ y ∊ A).\n    rew uniform_basis_closure.\n    change ( (∏ x, (∏ i, ∐ y, (x, y) ∊ β i ⊠ y ∊ A) ⧟ 𝐓)\n            ⧟ ∏ (x : X) (i : Λ), ∐ y : X, (x, y) ∊ β i ⊠ y ∊ A).\n    now simplify.\n  Qed.\n\n  Definition uniform_basis_dense_applied A\n    : dense A ⧟ ∏ (x:X) i, ∐ y, near (β i) x y ⊠ y ∊ A\n  := uniform_basis_dense A.\nEnd via_basis.\n\nLemma uniform_basis_Dense_iff@{u} {X Y:set@{u}} `{@UniformityBasis@{u} Y Ψ Λ β, !UniformSpace Y} {f:X ⇾ Y}\n  : Dense f ↔ ∏ (y:Y) i, ∐ x, near (β i) y (f x).\nProof. rew (Dense_alt _), (uniform_basis_dense_applied _). split.\n  * intros P y i. pose proof (P y i) as [y' [Py' [x Ex]]]. exists x. now rew Ex.\n  * intros P y i. pose proof (P y i) as [x Px]. now exists (f x).\nQed.\n\nLemma uniform_basis_dense_range@{u} {X Y:set@{u}} `{@UniformityBasis@{u} Y Ψ Λ β, !UniformSpace Y} (f:X ⇾ Y)\n  : ∀ `{!Dense f} (y:Y) i, ∐ x, near (β i) y (f x).\nProof. apply uniform_basis_Dense_iff. Qed.\n\n\n(** Discrete and indiscrete uniformities *)\n\nDefinition discrete_uniformity@{u} (X:set@{u}) : Uniformity@{u} X\n  := presented_uniformity set:(λ _:unit, id_rel X).\nDefinition indiscrete_uniformity@{u} (X:set@{u}) : Uniformity@{u} X\n  := presented_uniformity set:(λ _:unit, full_subset (X ⊗ X)).\n\nLemma discrete_uniformity_correct@{u} {X:set@{u}} : DiscreteUniformity (discrete_uniformity X).\nProof. now unfold DiscreteUniformity, discrete_uniformity. Qed.\nLemma indiscrete_uniformity_correct@{u} {X:set@{u}} : IndiscreteUniformity (indiscrete_uniformity X).\nProof. now unfold IndiscreteUniformity, indiscrete_uniformity. Qed.\n\n#[global] Hint Extern 2 (DiscreteUniformity (discrete_uniformity _)) => simple notypeclasses refine discrete_uniformity_correct : typeclass_instances.\n#[global] Hint Extern 2 (UniformityPresentation _ (Φ:=discrete_uniformity _) _) => simple notypeclasses refine discrete_uniformity_correct : typeclass_instances.\n#[global] Hint Extern 2 (IndiscreteUniformity (indiscrete_uniformity _)) => simple notypeclasses refine indiscrete_uniformity_correct : typeclass_instances.\n#[global] Hint Extern 2 (UniformityPresentation _ (Φ:=indiscrete_uniformity _) _) => simple notypeclasses refine indiscrete_uniformity_correct : typeclass_instances.\n\n#[global] Hint Extern 20 (Uniformity 𝟏) => notypeclasses refine (discrete_uniformity _) : typeclass_instances.\n\nCoercion discrete_uniform_space `{@DiscreteUniformity X Φ} : UniformSpace X.\nProof. refine (presented_uniform_space _ _ _); try exact _.\n+ now intros [].\n+ intros []. exists tt. intros [x y]. exact (symmetry (=) _ _).\n+ intros []. exists tt. change (id_rel X ⋄ id_rel X ⊆ id_rel X).\n  now rew (left_identity (⋄) _).\nQed.\n#[global] Hint Extern 2 (@UniformSpace _ (discrete_uniformity _)) => simple notypeclasses refine discrete_uniform_space : typeclass_instances.\n#[global] Hint Extern 2 (@Topology _ (@UniformNeighborhood _ (discrete_uniformity _))) =>\n  simple notypeclasses refine discrete_uniform_space : typeclass_instances.\n\nSection discrete_uniformity.\n  Universes u.\n  Context `{H:@DiscreteUniformity@{u} X Φ}.\n\n  Definition discrete_ufm_basis := filter_presentation_basis_fun _ _ (H:=H).\n  Local Abbreviation β := discrete_ufm_basis.\n  Local Instance discrete_ufm_basis_correct : UniformityBasis discrete_ufm_basis.\n  Proof. now unfold β, UniformityBasis. Qed.\n\n  (** The induced topology of a discrete uniformity is discrete. *)\n  Lemma discrete_uniformity_nbrhood : Discrete (@UniformNeighborhood X Φ).\n  Proof. intros [x N]. split.\n  + exact (top_refl x N).\n  + change (x ∊ N ⊸ ∐ U:Φ, ∏ y, near U x y ⊸ y ∊ N).\n    rew <-(aex_ub _ (β tt)).\n    rew <-all_adj; intros y.\n    change (x ∊ N ⊸ x = y ⊸ y ∊ N).\n    rew <-(aprod_adj _ _ _), (aprod_com _ _).\n    exact (equal_element _ _ _).\n  Qed.\n\n  (** Every map out of a discretely-uniform space is uniformly continuous. *)\n  Lemma discrete_ufm_cont `{@UniformSpace@{u} Y Ψ} (f:X ⇾ Y) : UniformlyContinuous f.\n  Proof. apply ufm_cont_by_basis_alt.\n    intros V. exists tt.\n    rew <-(uniform_refl_alt V).\n    intros [x y]. exact (is_fun f x y).\n  Qed.\nEnd discrete_uniformity.\nCoercion discrete_ufm_basis_correct : DiscreteUniformity >-> UniformityBasis.\n#[global] Hint Extern 2 (Discrete (UniformNeighborhood _)) => simple notypeclasses refine discrete_uniformity_nbrhood : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyContinuous (Φ:=discrete_uniformity _) _) => simple notypeclasses refine (discrete_ufm_cont _) : typeclass_instances.\n\nCoercion indiscrete_uniform_space `{@IndiscreteUniformity X Φ} : UniformSpace X.\nProof. refine (presented_uniform_space _ _ _); try exact _; tautological. Qed.\n#[global] Hint Extern 2 (@UniformSpace _ (indiscrete_uniformity _)) => simple notypeclasses refine indiscrete_uniform_space : typeclass_instances.\n#[global] Hint Extern 2 (@Topology _ (@UniformNeighborhood _ (indiscrete_uniformity _))) =>\n  simple notypeclasses refine indiscrete_uniform_space : typeclass_instances.\n\nSection indiscrete_uniformity.\n  Universes u.\n  Context `{H:@IndiscreteUniformity@{u} X Φ}.\n\n  Definition indiscrete_ufm_basis := filter_presentation_basis_fun _ _ (H:=H).\n  Local Abbreviation β := indiscrete_ufm_basis.\n  Local Instance indiscrete_ufm_basis_correct : UniformityBasis indiscrete_ufm_basis.\n  Proof. now unfold β, UniformityBasis. Qed.\n\n  (** The induced topology of an indiscrete uniformity is indiscrete. *)\n  Lemma indiscrete_uniformity_nbrhood : Indiscrete (@UniformNeighborhood X Φ).\n  Proof. pose proof _ : UniformSpace X. intros [x N]. split.\n  + change ((∐ U:Φ, near U x ⊆ N) ⊸ ∏ y:X, y ∊ N).\n    rew <-aex_adj; intros U. pose proof uniformity_basis U as [[] PU]. rew <-PU.\n    change ((∏ y, 𝐓 ⊸ y ∊ N) ⊸ ∏ y : X, y ∊ N). now simplify.\n  + change ((∏ y:X, y ∊ N) ⊸ ∐ U:Φ, ∏ y, near U x y ⊸ y ∊ N).\n    rew <-(aex_ub _ (β tt)).\n    change ((∏ y, y ∊ N) ⊸ ∏ y : X, 𝐓 ⊸ y ∊ N). now simplify.\n  Qed.\n\n  Lemma indiscrete_entourage_alt (U:𝒫 (X ⊗ X)) : U ∊ Φ ⧟ U = ⊤.\n  Proof. rew [ (filter_presentation Φ _ U) | <-(above_top _)]. split.\n  + rew <-aex_adj; intros []. now simplify.\n  + rew <-(aex_ub _ tt). now simplify.\n  Qed.\n  \n  Lemma indiscrete_entourage (A:Φ) : A = ⊤.\n  Proof. change (A = ⊤ :> 𝒫 (X ⊗ X)). now rew <-(indiscrete_entourage_alt _). Qed.\n\n  (** Every map into an indiscretely-uniform space is uniformly continuous. *)\n  Lemma indiscrete_ufm_cont `{@UniformSpace@{u} Y Ψ} (f:Y ⇾ X) : UniformlyContinuous f.\n  Proof. apply uniformly_continuous_alt. intros U. rew (indiscrete_entourage U).\n    change (⟨f,f⟩* ⊤ ∊ Ψ). now rew (preserves_top _).\n  Qed.\nEnd indiscrete_uniformity.\n#[global] Hint Extern 2 (Indiscrete (UniformNeighborhood _)) => simple notypeclasses refine indiscrete_uniformity_nbrhood : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyContinuous (Φ:=indiscrete_uniformity _) _) => simple notypeclasses refine (indiscrete_ufm_cont _) : typeclass_instances.\n\n(** Initial object *)\n\n#[global] Hint Extern 20 (Uniformity 𝟎) => notypeclasses refine (discrete_uniformity _) : typeclass_instances.\n\nLemma from_empty_ufm_cont@{u} `{@UniformSpace@{u} 𝟎 Ψ} `{@UniformSpace@{u} X Φ}\n  : UniformlyContinuous (from_Empty X).\nProof. apply uniformly_continuous_alt. intros U. \n  apply (up_closed Ψ ⊤); [ full_tautological | exact _ ].\nQed.\n#[global] Hint Extern 2 (UniformlyContinuous (from_Empty _)) => simple notypeclasses refine from_empty_ufm_cont : typeclass_instances.\n\n(** Terminal object: every uniform space structure on 𝟏 is indiscrete. *)\n\nSection unit.\n  Universes u.\n  Context `{@UniformSpace@{u} 𝟏 Ψ}.\n\n  Local Instance unit_uniform_indiscrete : IndiscreteUniformity Ψ.\n  Proof. split; try exact _. intros W. split.\n  + rew <-(aex_ub _ tt). now rew (uniform_refl W).\n  + rew <-aex_adj; intros []. change (⊤ ≤ W ⊸ W ∊ Ψ).\n    rew <-(equal_element _ ⊤ W), (aprod_true_r filter_top).\n    rew (above_top _). now apply symmetry.\n  Qed.\nEnd unit.\n#[global] Hint Extern 2 (@IndiscreteUniformity 𝟏 _) => simple notypeclasses refine unit_uniform_indiscrete : typeclass_instances.\n#[global] Hint Extern 2 (@UniformityBasis 𝟏 _ _ _) => simple notypeclasses refine indiscrete_ufm_basis_correct : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyContinuous (Y:=𝟏) _) => simple notypeclasses refine (indiscrete_ufm_cont _) : typeclass_instances.\n\n(** Constant maps — in particular global points [𝟏 ⇾ X] — are uniformly continuous. *)\n\nLemma const_ufm_cont@{u} `{@UniformSpace@{u} X Φ, @UniformSpace@{u} Y Ψ} {y:Y}\n  : UniformlyContinuous (const (X:=X) y).\nProof. apply uniformly_continuous_alt. intros V.\n  apply (up_closed Φ ⊤); [| exact _].\n  rew <-(uniform_refl_alt V).\n  intros [x₁ x₂]. change ( 𝐓 ⊸ y = y). now simplify.\nQed.\n#[global] Hint Extern 2 (UniformlyContinuous (func_op const _)) => simple notypeclasses refine const_ufm_cont : typeclass_instances.\n\n\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":18,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":13,"messages":[],"goa ":"../../tactics/easy.html"},{"s":14059,"e":14062,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14126,"e":14129,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14185,"e":14188,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14189,"e":14197,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":14265,"e":14268,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14339,"e":14342,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14343,"e":14351,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":14435,"e":14438,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14500,"e":14503,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14526,"e":14529,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14530,"e":14538,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":14544,"e":14547,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14565,"e":14568,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14569,"e":14577,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":14672,"e":14675,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14676,"e":14679,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14936,"e":14939,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":14993,"e":14996,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":14997,"e":15000,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":15689,"e":15706,"lib":"AffineConstructive.interfaces.aprop","name":"full_tautological","kind":"ltac","local":false,"page":"../../interfaces/aprop.html"},{"s":16121,"e":16124,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":16142,"e":16145,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":16146,"e":16149,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":16172,"e":16175,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":16226,"e":16229,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":16286,"e":16289,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":16305,"e":16308,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":17042,"e":17045,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":17110,"e":17113,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":17114,"e":17122,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"}],"gloss":{"summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[AffineConstructive.topology.uniform.basis.presented_pre_uniform_space]], [[AffineConstructive.topology.uniform.basis.presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[AffineConstructive.topology.uniform.basis.ufm_cont_by_basis]], [[AffineConstructive.topology.uniform.basis.ufm_refl_by_basis]]), interior, closure and density ([[AffineConstructive.topology.uniform.basis.uniform_basis_interior]], [[AffineConstructive.topology.uniform.basis.uniform_basis_closure]], [[AffineConstructive.topology.uniform.basis.uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous.","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","items":[{"name":"AffineConstructive.topology.uniform.basis.presented_uniformity","base":"presented_uniformity","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"The uniformity presented by a family β of relations: the relations containing some β i","status":"ok"},"long":{"text":"Given a family β of relations on X, indexed by any type Λ, the presented uniformity is the presented filter [[AffineConstructive.orders.filters.presented_filter]] of β read as a uniformity: a relation U is an entourage when there is an index i with β i ⊆ U. The existential is the affine one, so membership is an affine proposition whose refutation says that U contains no β i.\n\nNothing is assumed of β here; the result is only a set of relations. Whether it is a uniform space depends on the family, and [[AffineConstructive.topology.uniform.basis.presented_pre_uniform_space]] and [[AffineConstructive.topology.uniform.basis.presented_uniform_space]] give the conditions on the generators. The discrete and indiscrete uniformities of this file are presented this way, by the diagonal and by the full relation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.presented_uniformity_prop","base":"presented_uniformity_prop","kind":"prf","start":18,"body":[19,21],"status":"ok","short":{"text":"The family β presents the uniformity presented_uniformity β","status":"ok"},"proof":[{"text":"Once the definitions are unfolded, the presentation property says that a relation U belongs to the uniformity exactly when some β i is contained in U. That is how [[AffineConstructive.topology.uniform.basis.presented_uniformity]] is defined, so the two sides agree.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.uniformity_presentation_basis_correct","base":"uniformity_presentation_basis_correct","kind":"def","start":23,"body":null,"status":"ok","short":{"text":"The generators of a presentation of a uniformity, as entourages, form a basis of it","status":"ok"},"long":{"text":"When β presents Φ ([[AffineConstructive.topology.interfaces.uniform.UniformityPresentation]]), each β i is itself an entourage, and the family of these entourages, [[AffineConstructive.orders.filters.filter_presentation_basis]], is a basis of Φ in the sense of [[AffineConstructive.topology.interfaces.uniform.UniformityBasis]]: every entourage contains one of them. This is the filter statement [[AffineConstructive.orders.filters.filter_presentation_basis_correct]] restated for uniformities.\n\nIt lets every result stated for a basis apply to a presentation; the file uses it as a local coercion in the proof of [[AffineConstructive.topology.uniform.basis.presented_pre_uniform_space]], and resolution finds it whenever a basis of this form is asked for.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.uniformity_basis","base":"uniformity_basis","kind":"def","start":25,"body":null,"status":"ok","short":{"text":"The basis property: every entourage contains some member β i of a basis","status":"ok"},"long":{"text":"For a basis β of a uniformity Φ, every entourage U has an index i with β i ⊆ U. This is [[AffineConstructive.interfaces.orders.filter_basis]] at a uniformity, under a name that reads naturally in proofs about uniform spaces, where it is how a statement about an arbitrary entourage is reduced to one about a basic entourage.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.presented_pre_uniform_space.coercion:uniformity_presentation_basis_correct","base":"coercion:uniformity_presentation_basis_correct","kind":"coercion","start":30,"body":null,"status":"ok","short":{"text":"Within the section, a presentation of a uniformity stands as a basis of it, through [[AffineConstructive.topology.uniform.basis.uniformity_presentation_basis_correct]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.presented_pre_uniform_space","base":"presented_pre_uniform_space","kind":"prf","start":31,"body":[32,53],"status":"ok","short":{"text":"A family presenting Φ with reflexive, symmetric and splitting generators makes X a pre-uniform space","status":"ok"},"proof":[{"text":"A pre-uniform space needs three axioms beyond the filter structure that Φ already has. Every entourage contains the diagonal, the inverse of an entourage is an entourage, and every entourage U has an entourage V whose composite with itself lies in U.","status":"ok","from":0,"to":1},{"text":"For the diagonal, fix U. By the presentation, U is an entourage exactly when some β i is contained in U, so take that i. The diagonal lies in β i by the reflexivity of the generators, and β i lies in U.","status":"ok","from":2,"to":6},{"text":"For the inverse, fix U and restate both memberships through the presentation. Let i be the index with β i ⊆ U. It remains to find some β j contained in U⁻¹.","status":"ok","from":7,"to":10},{"text":"The symmetry of the generators gives j with (β j)⁻¹ ⊆ β i, and j is the witness. Taking converses preserves and reflects inclusion. So β i ⊆ U gives (β i)⁻¹ ⊆ U⁻¹, the inclusion (β j)⁻¹ ⊆ β i gives β j ⊆ (β i)⁻¹, and the two inclusions compose.","status":"ok","from":11,"to":14},{"text":"For splitting, fix an entourage U. The generators form a basis of Φ, so by [[AffineConstructive.topology.uniform.basis.uniformity_basis]] some β i is contained in U. It then suffices to split β i instead of U.","status":"ok","from":15,"to":18},{"text":"The splitting condition gives j with β j ∙ β j ⊆ β i. The generator β j, regarded as an entourage, is the required V.","status":"ok","from":19,"to":21}]},{"name":"AffineConstructive.topology.uniform.basis.presented_uniformity_filter","base":"presented_uniformity_filter","kind":"inst","start":59,"body":[60,62],"status":"ok","short":{"text":"An order-preserving presentation over a down-directed index makes the uniformity a filter","status":"ok"},"proof":[{"text":"The uniformity is presented by an order-preserving family on a down-directed index, and such a subset is a filter by [[AffineConstructive.orders.filters.presented_filter_filter]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.presented_uniform_space","base":"presented_uniform_space","kind":"prf","start":64,"body":[65,68],"status":"ok","short":{"text":"A monotone, down-directed presentation by reflexive, symmetric, splitting generators gives a uniform space","status":"ok"},"proof":[{"text":"A uniform space is a pre-uniform space whose uniformity is a filter. The filter part is [[AffineConstructive.topology.uniform.basis.presented_uniformity_filter]], which leaves the pre-uniform axioms.","status":"ok","from":0,"to":1},{"text":"The pre-uniform axioms follow from the reflexivity, symmetry and splitting of the generators by [[AffineConstructive.topology.uniform.basis.presented_pre_uniform_space]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_self","base":"uniform_basis_self","kind":"prf","start":70,"body":[71,73],"status":"ok","short":{"text":"A uniformity is a basis of itself, indexed by its entourages","status":"ok"},"proof":[{"text":"The entourages, ordered by inclusion, form a weak poset, and the identity on a weak poset is a filter basis of it by [[AffineConstructive.orders.filters.filter_basis_self]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_separated_by_basis","base":"uniform_separated_by_basis","kind":"prf","start":75,"body":[76,82],"status":"ok","short":{"text":"A uniform space is separated when points close at every basic entourage are equal","status":"ok"},"proof":[{"text":"The uniform-space part of separation is already given. What remains is that two points close at every entourage are equal.","status":"ok","from":0,"to":1},{"text":"Fix x and y. By the hypothesis on the basis, it suffices to show that x and y are β i-close for every index i.","status":"ok","from":2,"to":3},{"text":"Fix i and specialise the hypothesis that x and y are close at every entourage to the entourage β i.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_inhabited","base":"uniform_basis_inhabited","kind":"prf","start":86,"body":[87,91],"status":"ok","short":{"text":"The index set of a basis of a uniform space is inhabited","status":"ok"},"proof":[{"text":"The uniformity of a uniform space is a filter, so it is down-directed and therefore inhabited. Let U be an entourage.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.interfaces.orders.filter_basis]], some β i is contained in U, and that index i shows that Λ is inhabited.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_down_directed","base":"uniform_basis_down_directed","kind":"prf","start":92,"body":[93,98],"status":"ok","short":{"text":"Any two basic entourages contain a common basic entourage","status":"ok"},"proof":[{"text":"The entourages are down-directed, so some entourage U lies in both β i₁ and β i₂.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.interfaces.orders.filter_basis]], some β i₃ is contained in U, and i₃ is the witness. Each of the two inclusions comes from composing β i₃ ⊆ U with the corresponding inclusion of U.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_split","base":"uniform_basis_split","kind":"prf","start":99,"body":[100,105],"status":"ok","short":{"text":"Each basic entourage β i has a basic β j whose composite with itself lies in β i","status":"ok"},"proof":[{"text":"Splitting the entourage β i by [[AffineConstructive.topology.uniform.base.near_split]] gives an entourage V. If x is V-close to y and y is V-close to z, then x is β i-close to z.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.interfaces.orders.filter_basis]], some β j is contained in V, and j is the witness. Closeness is monotone in the entourage, so the two β j-closenesses give V-closenesses, and the property of V concludes.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_sym","base":"uniform_basis_sym","kind":"prf","start":106,"body":[107,112],"status":"ok","short":{"text":"Each basic entourage β i contains the inverse of some basic entourage β j","status":"ok"},"proof":[{"text":"Applying [[AffineConstructive.topology.uniform.base.near_sym]] to the entourage β i gives an entourage V such that y V-close to x implies x β i-close to y.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.interfaces.orders.filter_basis]], some β j is contained in V, and j is the witness. Closeness is monotone in the entourage, so β j-closeness of y to x gives V-closeness, and the property of V concludes.","status":"ok","from":2,"to":5}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_separated","base":"uniform_basis_separated","kind":"prf","start":114,"body":[115,124],"status":"ok","short":{"text":"In a separated space, x = y if and only if x and y are close at every basic entourage","status":"ok"},"proof":[{"text":"The biconditional splits into its two implications.","status":"ok","from":0,"to":1},{"text":"For the forward direction, fix a basic index i. Equal points are close at every entourage, in particular at β i, by [[AffineConstructive.topology.uniform.base.near_refl_alt]].","status":"ok","from":2,"to":4},{"text":"For the converse, since X is separated, [[AffineConstructive.topology.uniform.base.uniform_separated_iff]] reduces x = y to x and y being U-close for every entourage U. Fix U.","status":"ok","from":5,"to":6},{"text":"Since β is a basis, there is an index i with β i ≤ U ([[AffineConstructive.interfaces.orders.filter_basis]]). Specialise the hypothesis at i. Closeness at β i gives closeness at the larger entourage U.","status":"ok","from":7,"to":9}]},{"name":"AffineConstructive.topology.uniform.basis.ufm_conty_by_basis","base":"ufm_conty_by_basis","kind":"prf","start":125,"body":[126,134],"status":"ok","short":{"text":"Uniform continuity checked on bases: each basic β j is pulled back to contain some basic α i","status":"ok"},"proof":[{"text":"Assume the basis condition and fix an entourage V of Y. It remains to find an entourage U of X such that U-close points have V-close images.","status":"ok","from":0,"to":1},{"text":"Since β is a basis, some basic β j lies below V ([[AffineConstructive.interfaces.orders.filter_basis]]). The hypothesis at j then gives an index i such that α i-closeness of x and y implies β j-closeness of f x and f y.","status":"ok","from":2,"to":3},{"text":"Take α i as the witness and fix x and y. α i-closeness gives β j-closeness of the images, and because β j ≤ V this gives V-closeness.","status":"ok","from":4,"to":8}]},{"name":"AffineConstructive.topology.uniform.basis.ufm_refln_by_basis","base":"ufm_refln_by_basis","kind":"prf","start":135,"body":[136,144],"status":"ok","short":{"text":"Uniform reflection checked on bases: each basic α i contains the pullback of some basic β j","status":"ok"},"proof":[{"text":"Assume the basis condition and fix an entourage U of X. It remains to find an entourage V of Y such that V-closeness of the images implies U-closeness of the points.","status":"ok","from":0,"to":1},{"text":"Since α is a basis, some basic α i lies below U ([[AffineConstructive.interfaces.orders.filter_basis]]). The hypothesis at i then gives an index j such that β j-closeness of f x and f y implies α i-closeness of x and y.","status":"ok","from":2,"to":3},{"text":"Take β j as the witness and fix x and y. β j-closeness of the images gives α i-closeness of x and y, and because α i ≤ U this gives U-closeness.","status":"ok","from":4,"to":8}]},{"name":"AffineConstructive.topology.uniform.basis.ufm_cont_by_basis","base":"ufm_cont_by_basis","kind":"prf","start":145,"body":[146,150],"status":"ok","short":{"text":"A function between uniform spaces is uniformly continuous when the basis condition holds","status":"ok"},"proof":[{"text":"Assume the basis condition. Being uniformly continuous consists of both sides being uniform spaces, which is already known, together with the condition on entourages. Only that condition remains.","status":"ok","from":0,"to":2},{"text":"That condition follows from the basis condition by [[AffineConstructive.topology.uniform.basis.ufm_conty_by_basis]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.uniform.basis.ufm_refl_by_basis","base":"ufm_refl_by_basis","kind":"prf","start":151,"body":[152,156],"status":"ok","short":{"text":"A function between uniform spaces is uniformly reflecting when the basis condition holds","status":"ok"},"proof":[{"text":"Assume the basis condition. Being uniformly reflecting consists of both sides being uniform spaces, which is already known, together with the reflection condition on entourages. Only that condition remains.","status":"ok","from":0,"to":2},{"text":"That condition follows from the basis condition by [[AffineConstructive.topology.uniform.basis.ufm_refln_by_basis]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.uniform.basis.ufm_cont_by_basis_alt","base":"ufm_cont_by_basis_alt","kind":"prf","start":157,"body":[158,166],"status":"ok","short":{"text":"f is uniformly continuous when each basic β j has a basic α i inside its preimage","status":"ok"},"proof":[{"text":"Assume that each β j contains the image of some α i, which is to say that its preimage contains some α i. By [[AffineConstructive.topology.uniform.basis.ufm_cont_by_basis]] it suffices to show the basis condition stated pointwise.","status":"ok","from":0,"to":2},{"text":"Fix j. The hypothesis gives an index i with α i inside the preimage of β j, and i is the witness.","status":"ok","from":3,"to":5},{"text":"Fix x and y. The inclusion, applied at the pair (x, y), says that α i-closeness of x and y implies β j-closeness of f x and f y.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.uniform.basis.ufm_refl_by_basis_alt","base":"ufm_refl_by_basis_alt","kind":"prf","start":167,"body":[168,176],"status":"ok","short":{"text":"f is uniformly reflecting when each basic α i contains the preimage of some basic β j","status":"ok"},"proof":[{"text":"Assume that each α i contains the preimage of some β j. By [[AffineConstructive.topology.uniform.basis.ufm_refl_by_basis]] it suffices to show the basis condition stated pointwise.","status":"ok","from":0,"to":2},{"text":"Fix i. The hypothesis gives an index j with the preimage of β j inside α i, and j is the witness.","status":"ok","from":3,"to":5},{"text":"Fix x and y. The inclusion, applied at the pair (x, y), says that β j-closeness of f x and f y implies α i-closeness of x and y.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_interior","base":"uniform_basis_interior","kind":"prf","start":179,"body":[180,191],"status":"ok","short":{"text":"The interior of A consists of the points x with some basic ball around x inside A","status":"ok"},"proof":[{"text":"Fix a subset A and a point x. In the uniform topology, x is interior to A when the ball of some entourage around x lies in A. The claim is that a basic entourage suffices. Prove the two implications.","status":"ok","from":0,"to":2},{"text":"Let U be an entourage whose ball around x lies in A. The basis gives i with β i ≤ U ([[AffineConstructive.interfaces.orders.filter_basis]]), and β i is the witness. Its ball lies inside the ball of U, and so inside A.","status":"ok","from":3,"to":7},{"text":"Conversely, let i be an index whose basic ball around x lies in A. The entourage β i itself is the witness.","status":"ok","from":8,"to":11}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_interior_applied","base":"uniform_basis_interior_applied","kind":"def","start":192,"body":null,"status":"ok","short":{"text":"interior A is the set of points x for which some basic ball near (β i) x lies in A","status":"ok"},"long":{"text":"The equation of [[AffineConstructive.topology.uniform.basis.uniform_basis_interior]] at a fixed subset A: interior A is the subset of the points x for which some basic ball, the set of points β i-close to x, lies in A. The existential ranges over the indices of the basis β, not over all entourages.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_interior_applied2","base":"uniform_basis_interior_applied2","kind":"def","start":193,"body":null,"status":"ok","short":{"text":"x lies in the interior of A if and only if some basic ball around x lies in A","status":"ok"},"long":{"text":"The membership form of [[AffineConstructive.topology.uniform.basis.uniform_basis_interior]]: x ∊ interior A is equivalent to there being an index i with the β i-ball around x contained in A. Compared with the neighbourhood relation of the uniform topology, the quantifier ranges over the basis instead of over all entourages; this is the form a proof uses to rewrite a membership in an interior.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_closure","base":"uniform_basis_closure","kind":"prf","start":194,"body":[195,206],"status":"ok","short":{"text":"The closure of A consists of the points with a point of A in every basic ball","status":"ok"},"proof":[{"text":"Fix a subset A and a point x. In the uniform topology, x lies in the closure of A when every entourage ball around x meets A. The claim is that it suffices to check the basic balls. Prove the two implications.","status":"ok","from":0,"to":2},{"text":"For the forward direction, fix i and specialise the hypothesis at the entourage β i.","status":"ok","from":3,"to":5},{"text":"Conversely, fix an entourage U. The basis gives i with β i ≤ U ([[AffineConstructive.interfaces.orders.filter_basis]]). Specialising the hypothesis at i gives a point of A that is β i-close to x, and it is then U-close to x as well.","status":"ok","from":6,"to":11}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_closure_applied","base":"uniform_basis_closure_applied","kind":"def","start":207,"body":null,"status":"ok","short":{"text":"The closure of A is the set of points every basic ball around which meets A","status":"ok"},"long":{"text":"The equation of [[AffineConstructive.topology.uniform.basis.uniform_basis_closure]] at a fixed subset A: closure A is the subset of the points x such that for every index i there is a y that is β i-close to x and lies in A. The two facts about y are joined by the tensor, as in the closure of the uniform topology. Stated separately for rewriting a closure applied to a subset.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_closure_applied2","base":"uniform_basis_closure_applied2","kind":"def","start":208,"body":null,"status":"ok","short":{"text":"x lies in the closure of A if and only if every basic entourage β i has a point of A β i-close to x","status":"ok"},"long":{"text":"The membership form of [[AffineConstructive.topology.uniform.basis.uniform_basis_closure]]: x ∊ closure A is equivalent to the statement that for every index i there is a point y of A that is β i-close to x. The point y is required to be close to x and in A at once, a tensor, and the universal quantifier ranges over the indices of the basis β rather than over all entourages.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_dense","base":"uniform_basis_dense","kind":"prf","start":209,"body":[210,216],"status":"ok","short":{"text":"A subset is dense when every basic ball around every point meets it","status":"ok"},"proof":[{"text":"Fix a subset A. By definition A is dense when its closure is the whole of X.","status":"ok","from":0,"to":2},{"text":"Describe the closure through the basis by [[AffineConstructive.topology.uniform.basis.uniform_basis_closure]]. The closure equals the top subset when every point is a member, that is, when for every x the closure condition at x is equivalent to truth. This simplifies to the condition itself, for every x.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_dense_applied","base":"uniform_basis_dense_applied","kind":"def","start":217,"body":null,"status":"ok","short":{"text":"A is dense if and only if every basic ball around every point meets A","status":"ok"},"long":{"text":"The form of [[AffineConstructive.topology.uniform.basis.uniform_basis_dense]] at a fixed subset A: A is dense exactly when for every point x and every index i there is y, β i-close to x, with y ∊ A. It is the closure criterion of [[AffineConstructive.topology.uniform.basis.uniform_basis_closure]] required at every point, and is how [[AffineConstructive.topology.uniform.basis.uniform_basis_Dense_iff]] describes a map with dense range.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_Dense_iff","base":"uniform_basis_Dense_iff","kind":"prf","start":219,"body":[220,232],"status":"ok","short":{"text":"f has dense range if and only if every basic ball meets the range of f","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.topology.base.Dense_alt]], f is dense when its range is a dense subset of Y. By [[AffineConstructive.topology.uniform.basis.uniform_basis_dense_applied]], this means that every basic ball around every point meets the range. What remains is to show that a basic ball meets the range of f exactly when it contains a value f x.","status":"ok","from":0,"to":1},{"text":"Forward: suppose every basic ball meets the range, and fix y and i. The ball β i around y contains a point y' of the range, say y' = f x. Take x as the witness: y is β i-close to y', and the equality f x = y' carries this over to f x.","status":"ok","from":2,"to":7},{"text":"Conversely, fix y and i. The hypothesis gives x with f x β i-close to y. Then f x is a point of the ball, and it lies in the range of f.","status":"ok","from":8,"to":12}]},{"name":"AffineConstructive.topology.uniform.basis.uniform_basis_dense_range","base":"uniform_basis_dense_range","kind":"prf","start":233,"body":[234,236],"status":"ok","short":{"text":"For a dense map f, every basic ball around every point contains some f x","status":"ok"},"proof":[{"text":"This is the forward direction of [[AffineConstructive.topology.uniform.basis.uniform_basis_Dense_iff]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.discrete_uniformity","base":"discrete_uniformity","kind":"def","start":237,"body":null,"status":"ok","short":{"text":"The discrete uniformity on X: the uniformity presented by the diagonal alone","status":"ok"},"long":{"text":"The uniformity on X presented by a single generator, the diagonal [[AffineConstructive.interfaces.subset.id_rel]], indexed by the unit type. An entourage is a relation containing the diagonal, so two points are close at every scale exactly when they are equal: it is the finest uniformity. [[AffineConstructive.topology.uniform.basis.discrete_uniformity_correct]] records that it satisfies [[AffineConstructive.topology.interfaces.uniform.DiscreteUniformity]], which holds by definition.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_uniformity","base":"indiscrete_uniformity","kind":"def","start":238,"body":null,"status":"ok","short":{"text":"The indiscrete uniformity on X: the full relation is the only entourage","status":"ok"},"long":{"text":"The uniformity on X presented by a single generator, the full relation [[AffineConstructive.interfaces.subset.full_subset]] on X ⊗ X, indexed by the unit type: an entourage is a relation containing the full relation, so any two points are close at every scale. It is the coarsest uniformity, and [[AffineConstructive.topology.interfaces.uniform.IndiscreteUniformity]] holds of it by definition.\n\nIts topology is indiscrete, every function into it is uniformly continuous, and every uniform space structure on the one-point set is of this form.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.discrete_uniformity_correct","base":"discrete_uniformity_correct","kind":"prf","start":239,"body":[240,242],"status":"ok","short":{"text":"The discrete uniformity is discrete: it is presented by the diagonal","status":"ok"},"proof":[{"text":"Unfold the definitions. [[AffineConstructive.topology.uniform.basis.discrete_uniformity]] is by definition the uniformity presented, in the sense of [[AffineConstructive.topology.uniform.basis.presented_uniformity]], by the single relation the diagonal. Being presented by the diagonal is exactly what a discrete uniformity requires.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_uniformity_correct","base":"indiscrete_uniformity_correct","kind":"prf","start":243,"body":[244,246],"status":"ok","short":{"text":"The indiscrete uniformity is indiscrete: it is presented by the full relation","status":"ok"},"proof":[{"text":"Unfold the definitions. [[AffineConstructive.topology.uniform.basis.indiscrete_uniformity]] is by definition the uniformity presented, in the sense of [[AffineConstructive.topology.uniform.basis.presented_uniformity]], by the single full relation. Being presented by the full relation is exactly what an indiscrete uniformity requires.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.discrete_uniform_space","base":"discrete_uniform_space","kind":"def","start":252,"body":[253,267],"status":"ok","short":{"text":"A discrete uniformity makes X a uniform space","status":"ok"},"proof":[{"text":"Apply [[AffineConstructive.topology.uniform.basis.presented_uniform_space]] to the presentation indexed by the one-point set whose only generator is the diagonal. Over a one-point index set, monotonicity and down-directedness hold automatically. What remains is that the generator is reflexive, symmetric, and splits.","status":"ok","from":0,"to":1},{"text":"Reflexivity: the diagonal contains the diagonal.","status":"ok","from":2,"to":3},{"text":"Symmetry: take the only index as the witness. A pair (x, y) in the inverse of the diagonal has y = x, and x = y follows by symmetry of equality.","status":"ok","from":4,"to":8},{"text":"Splitting: take the only index again. The composite of the diagonal with itself is the diagonal, because the identity relation is a left identity for composition ([[AffineConstructive.orders.subset_relations.compose_rel_left_id]]).","status":"ok","from":9,"to":14}]},{"name":"AffineConstructive.topology.uniform.basis.discrete_ufm_basis","base":"discrete_ufm_basis","kind":"def","start":273,"body":null,"status":"ok","short":{"text":"The one-entourage basis of a discrete uniformity: the diagonal, indexed by 𝟏","status":"ok"},"long":{"text":"For a discrete uniformity Φ, the function from the one-point set 𝟏 to Φ picking out the diagonal, now regarded as an entourage. It is the corestriction [[AffineConstructive.orders.filters.filter_presentation_basis_fun]] of the presenting family, and [[AffineConstructive.topology.uniform.basis.discrete_ufm_basis_correct]] shows it is a basis of Φ, so that every basis criterion of the file applies to a discrete space with a single basic entourage.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.discrete_ufm_basis_correct","base":"discrete_ufm_basis_correct","kind":"inst","start":275,"body":[276,278],"status":"ok","short":{"text":"The diagonal alone is a basis of a discrete uniformity","status":"ok"},"proof":[{"text":"Unfold the definitions: the basis consisting of the diagonal is the generator of the presentation of the discrete uniformity. The generators of a filter presentation form a basis of the filter ([[AffineConstructive.orders.filters.filter_presentation_basis_correct]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.discrete_uniformity_nbrhood","base":"discrete_uniformity_nbrhood","kind":"prf","start":279,"body":[280,292],"status":"ok","short":{"text":"The topology induced by a discrete uniformity is discrete","status":"ok"},"proof":[{"text":"The topology is discrete when, for every x and N, N is a neighbourhood of x if and only if x ∊ N. Fix x and N and prove the two implications.","status":"ok","from":0,"to":2},{"text":"A neighbourhood of x contains x, by the reflexivity axiom of the uniform topology ([[AffineConstructive.topology.uniform.base.uniform_topology]]).","status":"ok","from":3,"to":4},{"text":"Conversely, N is a neighbourhood of x when the ball around x of some entourage lies in N. Take the diagonal as that entourage.","status":"ok","from":5,"to":7},{"text":"Fix y. Being diagonal-close to x means x = y, so the goal is that x = y and x ∊ N together give y ∊ N. After rearranging the two factors, this says that membership respects equality ([[AffineConstructive.interfaces.subset.equal_element]]).","status":"ok","from":8,"to":12}]},{"name":"AffineConstructive.topology.uniform.basis.discrete_ufm_cont","base":"discrete_ufm_cont","kind":"prf","start":293,"body":[294,301],"status":"ok","short":{"text":"Every function out of a discretely uniform space is uniformly continuous","status":"ok"},"proof":[{"text":"Uniform continuity is checked against bases, by [[AffineConstructive.topology.uniform.basis.ufm_cont_by_basis_alt]]. On X the basis is the one of [[AffineConstructive.topology.uniform.basis.discrete_ufm_basis_correct]], the diagonal alone, indexed by 𝟏. On Y every entourage serves as its own basis. What remains is to show that for each entourage of Y there is a basic relation of X inside its preimage.","status":"ok","from":0,"to":1},{"text":"Fix an entourage V of Y and take the single index as the witness. The diagonal of Y lies inside V by [[AffineConstructive.topology.uniform.base.uniform_refl_alt]]. It therefore suffices to show that the diagonal of X lies inside the preimage of the diagonal of Y, since preimage preserves inclusion.","status":"ok","from":2,"to":4},{"text":"For a pair (x, y), the goal is that x = y implies f x = f y, which is the statement that f is a function, [[AffineConstructive.interfaces.set.is_fun]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.uniform.basis.coercion:discrete_ufm_basis_correct","base":"coercion:discrete_ufm_basis_correct","kind":"coercion","start":303,"body":null,"status":"ok","short":{"text":"A discrete uniformity stands as a uniformity with a basis, the diagonal alone, through [[AffineConstructive.topology.uniform.basis.discrete_ufm_basis_correct]]","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_uniform_space","base":"indiscrete_uniform_space","kind":"def","start":306,"body":[307,309],"status":"ok","short":{"text":"An indiscrete uniformity makes X a uniform space","status":"ok"},"proof":[{"text":"Apply [[AffineConstructive.topology.uniform.basis.presented_uniform_space]] to the presentation indexed by the one-point set whose only generator is the full relation. Monotonicity and down-directedness hold automatically over a one-point index set. The full relation is trivially reflexive and symmetric, and it splits, since its composite with itself is contained in it.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_ufm_basis","base":"indiscrete_ufm_basis","kind":"def","start":315,"body":null,"status":"ok","short":{"text":"The one-entourage basis 𝟏 ⇾ Φ of an indiscrete uniformity, picking the full relation","status":"ok"},"long":{"text":"An indiscrete uniformity Φ is presented by the single full relation on X ⊗ X, which is therefore itself an entourage. This is that presentation recast by [[AffineConstructive.orders.filters.filter_presentation_basis_fun]] as a function 𝟏 ⇾ Φ from the one-point set into the entourages. [[AffineConstructive.topology.uniform.basis.indiscrete_ufm_basis_correct]] shows that it is a basis of Φ, and within its section it is named [[AffineConstructive.topology.uniform.basis.β]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.β","base":"β","kind":"abbrev","start":316,"body":null,"status":"ok","short":{"text":"Local name for the one-entourage basis of a discrete or indiscrete uniformity","status":"ok"},"long":{"text":"An abbreviation local to the sections on discrete and indiscrete uniformities, standing for [[AffineConstructive.topology.uniform.basis.discrete_ufm_basis]] in the first and for the corresponding basis of an indiscrete uniformity in the second. In each, β tt is the single basic entourage: the diagonal, or the full relation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_ufm_basis_correct","base":"indiscrete_ufm_basis_correct","kind":"inst","start":317,"body":[318,320],"status":"ok","short":{"text":"The full relation alone is a basis of an indiscrete uniformity","status":"ok"},"proof":[{"text":"Unfold the definitions: the basis consisting of the full relation is the generator of the presentation of the indiscrete uniformity. The generators of a filter presentation form a basis of the filter ([[AffineConstructive.orders.filters.filter_presentation_basis_correct]]).","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_uniformity_nbrhood","base":"indiscrete_uniformity_nbrhood","kind":"prf","start":321,"body":[322,338],"status":"ok","short":{"text":"The topology induced by an indiscrete uniformity is indiscrete","status":"ok"},"proof":[{"text":"An indiscrete uniformity makes X a uniform space ([[AffineConstructive.topology.uniform.basis.indiscrete_uniform_space]]). Fix a point x and a subset N. It remains to show that N is a neighbourhood of x in the uniform topology exactly when N contains every point.","status":"ok","from":0,"to":2},{"text":"First, suppose N is a neighbourhood of x. Then some U-ball about x lies in N. Take the entourage U that the hypothesis provides.","status":"ok","from":3,"to":6},{"text":"The entourage U contains the single basic relation β tt, which is the full relation ([[AffineConstructive.topology.uniform.basis.uniformity_basis]], [[AffineConstructive.topology.uniform.basis.indiscrete_ufm_basis_correct]]). So the β tt-ball about x also lies in N. That ball is all of X, so its inclusion in N says that every y lies in N.","status":"ok","from":7,"to":10},{"text":"Conversely, suppose every point lies in N. Take β tt as the entourage. Its ball about x is the whole set, so every point of the ball lies in N.","status":"ok","from":11,"to":16}]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_entourage_alt","base":"indiscrete_entourage_alt","kind":"prf","start":339,"body":[340,349],"status":"ok","short":{"text":"In an indiscrete uniformity, a relation is an entourage if and only if it is the full relation","status":"ok"},"proof":[{"text":"An indiscrete uniformity is generated by a presentation with a single relation, the full one, so U is an entourage exactly when that relation lies in U. Also, ⊤ ⊆ U holds exactly when U = ⊤ ([[AffineConstructive.orders.lattices.above_top]]). It remains to show that the full relation lies in U if and only if ⊤ ⊆ U.","status":"ok","from":0,"to":1},{"text":"First, suppose some basic relation lies in U. The only index is the point of 𝟏, and the basic relation it gives is ⊤ itself, so this direction is immediate.","status":"ok","from":2,"to":5},{"text":"Conversely, take the point of 𝟏 as the witness. The required inclusion is then ⊤ ⊆ U, which is the hypothesis.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_entourage","base":"indiscrete_entourage","kind":"prf","start":350,"body":[351,354],"status":"ok","short":{"text":"Every entourage of an indiscrete uniformity is the full relation ⊤","status":"ok"},"proof":[{"text":"Regard A as a relation on X. A is an entourage, so it equals the full relation by [[AffineConstructive.topology.uniform.basis.indiscrete_entourage_alt]].","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.uniform.basis.indiscrete_ufm_cont","base":"indiscrete_ufm_cont","kind":"prf","start":355,"body":[356,362],"status":"ok","short":{"text":"Every map into an indiscrete uniform space is uniformly continuous","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.base.uniformly_continuous_alt]], it suffices to show that the preimage of each entourage under f × f is an entourage of Y. Fix an entourage U of X.","status":"ok","from":0,"to":2},{"text":"The uniformity on X is indiscrete, so U is the full relation ([[AffineConstructive.topology.uniform.basis.indiscrete_entourage]]).","status":"ok","from":3,"to":3},{"text":"Preimage preserves the top element ([[AffineConstructive.interfaces.abstract_algebra.preserves_top]]), so the preimage of the full relation is the full relation on Y. The full relation is an entourage of every uniformity.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.uniform.basis.from_empty_ufm_cont","base":"from_empty_ufm_cont","kind":"prf","start":367,"body":[368,372],"status":"ok","short":{"text":"The map out of the empty set into any uniform space is uniformly continuous","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.base.uniformly_continuous_alt]], it suffices to show that the preimage of each entourage of X is an entourage of 𝟎. Fix an entourage U of X.","status":"ok","from":0,"to":2},{"text":"The full relation on 𝟎 is an entourage, and the entourages are upward closed ([[AffineConstructive.interfaces.orders.up_closed]]). So it suffices that the full relation lies in the preimage of U. This holds tautologically, because 𝟎 has no points.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.uniform.basis.unit_uniform_indiscrete","base":"unit_uniform_indiscrete","kind":"inst","start":377,"body":[378,391],"status":"ok","short":{"text":"Every uniform space structure on the one-point set 𝟏 is indiscrete","status":"ok"},"proof":[{"text":"Ψ is already a uniformity, so the only condition left for indiscreteness is that it is presented by the full relation alone. That is, a relation W on 𝟏 must be an entourage exactly when the full relation lies in W. Fix W.","status":"ok","from":0,"to":2},{"text":"First, suppose W is an entourage. Take the point of 𝟏 as the witness; it remains to show that the full relation lies in W. W contains the diagonal, and on the one-point set the diagonal is the full relation.","status":"ok","from":3,"to":6},{"text":"Conversely, take the index the hypothesis provides, the point of 𝟏. The hypothesis then says ⊤ ⊆ W.","status":"ok","from":7,"to":9},{"text":"The full relation is an entourage ([[AffineConstructive.orders.filters.filter_top]]), and membership in Ψ respects equality ([[AffineConstructive.interfaces.subset.equal_element]]). So it suffices that ⊤ = W. By [[AffineConstructive.orders.lattices.above_top]], ⊤ ⊆ W amounts to W = ⊤, and symmetry gives the claim.","status":"ok","from":10,"to":13}]},{"name":"AffineConstructive.topology.uniform.basis.const_ufm_cont","base":"const_ufm_cont","kind":"prf","start":396,"body":[397,405],"status":"ok","short":{"text":"A constant map between uniform spaces is uniformly continuous","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.base.uniformly_continuous_alt]], it suffices to show that the preimage of each entourage of Y under the constant map is an entourage of X. Fix an entourage V of Y.","status":"ok","from":0,"to":2},{"text":"The full relation is an entourage and the entourages are upward closed ([[AffineConstructive.interfaces.orders.up_closed]]), so it suffices that the full relation lies in the preimage of V. V contains the diagonal ([[AffineConstructive.topology.uniform.base.uniform_refl_alt]]) and preimage preserves inclusion. So it suffices that the full relation lies in the preimage of the diagonal.","status":"ok","from":3,"to":4},{"text":"Take a pair (x₁, x₂). Both points are sent to y, so membership in the preimage of the diagonal is the equation y = y, which holds by reflexivity.","status":"ok","from":5,"to":8}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, axioms, uniform maps, Cauchy filters, completions","summary":"The file sets up the interface of uniform spaces. A uniformity is a set of relations on X ⊗ X, the entourages; the file reads an entourage as closeness ([[near]]), forms thickenings of subsets and the relation \\\"K ◁ S\\\" (S is a uniform neighbourhood of K), and states the axioms in layers: the pre-uniform axioms, uniform spaces as filters of entourages, and the strong, separated and regular variants with their combinations. It derives the neighbourhood relation of the uniform topology ([[UniformNeighborhood]]), names presentations and bases

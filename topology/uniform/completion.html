AffineConstructive.topology.unif_born.trapped_cauchy":"topology/unif_born/trapped_cauchy.html","AffineConstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"(** Instantiating the completion kit at (𝐔𝐧𝐢𝐟, 𝒞): a reworking of\n    uniform/completion.v that delegates to reflection_pair/completion.v.\n\n    The bridge direction is [Completion] ⟹ [PairCompletion] (with hints, so\n    the abstract theorems apply whenever a concrete completion is in\n    context); the converse is left to direct invocation. *)\nRequire Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.topology interfaces.uniform.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import topology.topology topology.uniform.base uniform.basis uniform.product topology.uniform.cauchy_completion.\nRequire Import topology.maps.\nRequire Import interfaces.reflection_pair reflection_pair.base topology.reflection_pair.completion topology.reflection_pair.products.\nRequire Import easy rewrite.\n\nLocal Open Scope fun_inv_scope.\n\nLocal Abbreviation id := (id_fun _).\nLocal Abbreviation η := to_cauchy.\nLocal Abbreviation 𝒞 := cauchy_filter_set.\nLocal Abbreviation 𝒞₁ := cauchy_map.\nLocal Abbreviation R := cauchy_reflect.\n\n#[local] Hint Extern 8 (Uniformity ?X) => match goal with H : Fib 𝐔𝐧𝐢𝐟 X |- _ => exact H end : typeclass_instances.\n\n(** * The bridge: concrete completions instantiate the pair-level API. *)\n\n#[global] Hint Extern 0 (@PairCompletionReflect 𝐔𝐧𝐢𝐟 _ _ _ ?X ?Y ?FX ?FY ?ι) => change (@CompletionReflect X Y FX FY ι) : typeclass_instances.\n#[global] Hint Extern 0 (@PairCompleteInverse 𝐔𝐧𝐢𝐟 _ _ _ ?X ?FX) => change (@CompleteInverse X FX) : typeclass_instances.\n\nLemma unif_pair_completion `{H:@Completion X Y Φ Ψ ι Ci} : PairCompletion 𝐔𝐧𝐢𝐟 ι.\nProof. split; try exact _; apply H. Qed.\n\nLemma unif_complete_obj `{H:@CompleteUniformSpace X Φ Ci} : CompleteObj 𝐔𝐧𝐢𝐟 X.\nProof. exact unif_pair_completion. Qed.\n\n#[global] Hint Extern 2 (PairCompletion 𝐔𝐧𝐢𝐟 _) => simple notypeclasses refine unif_pair_completion : typeclass_instances.\n#[global] Hint Extern 2 (CompleteObj 𝐔𝐧𝐢𝐟 _) => simple notypeclasses refine unif_complete_obj : typeclass_instances.\n\n(** The converse record bridge, for direct invocation. *)\nLemma unif_completion `{Ci:@CompletionReflect X Y Φ Ψ ι} : PairCompletion 𝐔𝐧𝐢𝐟 ι → Completion ι.\nProof. intros H. split.\n+ pose proof (pair_completion_obj_Y 𝐔𝐧𝐢𝐟 (H:=H)) as HY. change (UniformSpace Y) in HY.\n  apply uniform_T₀_separated, Hausdorff_T₀. exact H.\n+ exact (pair_completion_initial 𝐔𝐧𝐢𝐟 (PairCompletion:=H)). \n+ exact (pair_completion_dense 𝐔𝐧𝐢𝐟 (PairCompletion:=H)).\n+ intros Z Ξ f ??. exact (pair_completion_reflect_initial_mor 𝐔𝐧𝐢𝐟 (PairCompletion:=H) f).\n+ intros Z Ξ f ??. exact (pair_completion_reflect_initial_spec 𝐔𝐧𝐢𝐟 ι (PairCompletion:=H) f).\nQed.\n\nLemma unif_complete `{Ci:@CompleteInverse X Φ} : CompleteObj 𝐔𝐧𝐢𝐟 X → CompleteUniformSpace X.\nProof. exact unif_completion. Qed.\n\n(** * The canonical completion: (𝒞, η, cauchy_map, cauchy_reflect). *)\n\nDefinition unif_canonical_completor@{u} : CanonicalCompletor@{u} 𝐔𝐧𝐢𝐟 (U:=@UniformNeighborhood@{u}).\nProof. unshelve esplit.\n+ exact @cauchy_filter_set.\n+ exact @cauchy_uniformity.\n+ exact @to_cauchy.\n+ intros X Y Φ Ψ HX HY f Hf. exact (𝒞₁ f).\n+ intros X Y Φ Ψ HX f ??. exact (R f).\nDefined.\n#[global] Hint Extern 2 (CanonicalCompletor 𝐔𝐧𝐢𝐟) => exact unif_canonical_completor : typeclass_instances.\n\nLemma unif_canonical_completion : CanonicalCompletion 𝐔𝐧𝐢𝐟.\nProof. split.\n+ intros X Φ HX. now change (Hausdorff (𝒞 X)).\n+ intros X Φ HX. now change (UniformlyInitial (η X)).\n+ intros X Φ HX. now change (Dense (η X)).\n+ intros X Y Φ Ψ HX HY f Hf. now change (UniformlyContinuous (𝒞₁ f)).\n+ intros X Y Φ Ψ HX HY f Hf. exact (cauchy_map_spec f).\n+ intros X Y Φ Ψ HX HY f HR HD. now change (UniformlyContinuous (cauchy_reflect f)).\n+ intros X Y Φ Ψ HX HY f HD HR. exact (cauchy_reflect_spec f).\nQed.\n#[global] Hint Extern 2 (CanonicalCompletion 𝐔𝐧𝐢𝐟) => simple notypeclasses refine unif_canonical_completion : typeclass_instances.\n\n(** Preservation of initial maps, by the dense-initial descent law. *)\nLemma unif_canonical_map_initial : CanonicalCompletionMapInitial 𝐔𝐧𝐢𝐟.\nProof. apply (dense_initial_descent_map_ini 𝐔𝐧𝐢𝐟).\n  intros S T V FS FT FV f g HD Hf Hg HR. exact (ufm_dense_initial f g).\nQed.\n#[global] Hint Extern 2 (CanonicalCompletionMapInitial 𝐔𝐧𝐢𝐟) => simple notypeclasses refine unif_canonical_map_initial : typeclass_instances.\n\n\n(** * The theory of uniform/completion.v, by delegation. *)\n\nSection completion_reflect_initial.\n  Universes u.\n  Context `{@Completion@{u} X Y Φ Ψ ι HC, @UniformlyInitial@{u} X Z Φ Ξ f, !Dense f}.\n\n  Local Abbreviation g := (completion_reflect_initial ι f).\n\n  Lemma completion_reflect_initial_dense : Dense g.\n  Proof. exact (pair_completion_reflect_initial_dense 𝐔𝐧𝐢𝐟 (ι:=ι)). Qed.\n\n  Lemma completion_reflect_initial_initial : UniformlyInitial g.\n  Proof. exact (pair_completion_reflect_initial_initial 𝐔𝐧𝐢𝐟 (ι:=ι) f). Qed.\nEnd completion_reflect_initial.\n#[global] Hint Extern 2 (Dense (func_op (completion_reflect_initial _ _)))  => simple notypeclasses refine completion_reflect_initial_dense : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyInitial (completion_reflect_initial _ _))  => simple notypeclasses refine completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (completion_reflect_initial _ _))  => simple notypeclasses refine completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial (completion_reflect_initial _ _))  => simple notypeclasses refine completion_reflect_initial_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting (completion_reflect_initial _ _))  => simple notypeclasses refine completion_reflect_initial_initial : typeclass_instances.\n\n\n(** Completions are complete. *)\nCoercion completion_inverse@{u} {X Y:set@{u}} `{H:@Completion@{u} X Y Φ Ψ ι U}\n  : CompleteInverse@{u} Y\n  := pair_completion_inverse 𝐔𝐧𝐢𝐟 (ι:=ι) (H:=unif_pair_completion (H:=H)).\n#[global] Hint Extern 4 (CompleteInverse ?Y) =>\n  match goal with H : Completion (Y:=Y) _ |- _ => exact H end : typeclass_instances.\n\nCoercion completion_complete@{u} {X Y:set@{u}} `{H:@Completion@{u} X Y Φ Ψ ι U}\n  : CompleteUniformSpace@{u} Y.\nProof. apply unif_completion. exact (pair_completion_complete 𝐔𝐧𝐢𝐟 (ι:=ι) (H:=unif_pair_completion (H:=H))). Qed.\n\nDefinition cauchy_complete_inverse@{u} `{@UniformSpace@{u} X Φ} : CompleteInverse@{u} (𝒞 X)\n  := completion_inverse (ι:=η _).\n#[global] Hint Extern 2 (CompleteInverse (cauchy_filter_set ?X)) => simple notypeclasses refine (cauchy_complete_inverse (X:=X)) : typeclass_instances.\nLemma cauchy_complete@{u} `{@UniformSpace@{u} X Φ} : CompleteUniformSpace@{u} (𝒞 X).\nProof. exact completion_complete. Qed.\n#[global] Hint Extern 2 (CompleteUniformSpace (cauchy_filter_set ?X)) => simple notypeclasses refine (cauchy_complete (X:=X)) : typeclass_instances.\n\n(** The UP extends to any UniformlyReflecting Dense map. *)\nSection completion_reflect.\n  Universes u.\n  Context `{@Completion@{u} X Y Φ Ψ ι HC, @UniformlyReflecting@{u} X Z Φ Ξ f, !Dense f}.\n\n  Definition completion_reflect : Z ⇾ Y := pair_completion_reflect 𝐔𝐧𝐢𝐟 ι f.\n\n  Local Instance completion_reflect_ufm_cont : UniformlyContinuous completion_reflect.\n  Proof. exact (pair_completion_reflect_mor 𝐔𝐧𝐢𝐟 ι f). Qed.\n\n  Lemma completion_reflect_spec : completion_reflect ∘ f = ι.\n  Proof. exact (pair_completion_reflect_spec 𝐔𝐧𝐢𝐟 (ι:=ι) f). Qed.\n\n  Lemma completion_reflect_dense : Dense completion_reflect.\n  Proof. exact (pair_completion_reflect_dense 𝐔𝐧𝐢𝐟 ι f). Qed.\nEnd completion_reflect.\nArguments completion_reflect {_ _ _ _} ι {_ _ _ _} f {_ _}.\nArguments completion_reflect_spec {_ _ _ _} ι {_ _ _ _} f {_ _}.\n#[global] Hint Extern 2 (UniformlyContinuous (completion_reflect _ _)) => simple notypeclasses refine completion_reflect_ufm_cont : typeclass_instances.\n#[global] Hint Extern 2 (Continuous (completion_reflect _ _)) => simple notypeclasses refine completion_reflect_ufm_cont : typeclass_instances.\n#[global] Hint Extern 2 (Dense (func_op (completion_reflect _ _))) => simple notypeclasses refine completion_reflect_dense : typeclass_instances.\n\nLemma completion_reflect_equal@{u} `{@Completion@{u} X Y Φ Ψ ι HC, @UniformlyInitial@{u} X Z Φ Ξ f, !Dense f}\n  : completion_reflect ι f = completion_reflect_initial ι f.\nProof. exact (pair_completion_reflect_equal 𝐔𝐧𝐢𝐟 (ι:=ι) f). Qed.\n\nLemma completion_reflect_is_initial@{u} `{@Completion@{u} X Y Φ Ψ ι HC, @UniformlyInitial@{u} X Z Φ Ξ f, !Dense f}\n  : UniformlyInitial (completion_reflect ι f).\nProof. exact (pair_completion_reflect_is_initial 𝐔𝐧𝐢𝐟 (ι:=ι) f). Qed.\n#[global] Hint Extern 2 (UniformlyInitial (completion_reflect _ _))  => simple notypeclasses refine completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (completion_reflect _ _))  => simple notypeclasses refine completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial (completion_reflect _ _))  => simple notypeclasses refine completion_reflect_is_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting (completion_reflect _ _))  => simple notypeclasses refine completion_reflect_is_initial : typeclass_instances.\n\n#[global] Hint Extern 2 (UniformlyEmbedding (completion_reflect _ _))  => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n#[global] Hint Extern 2 (Injective (completion_reflect _ _))  => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding (completion_reflect _ _))  => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n\n(** UP for a complete space *)\nSection complete_inverse.\n  Universes u.\n  Context `{@CompleteUniformSpace@{u} X Φ Ci, @UniformlyReflecting@{u} X Z Φ Ξ f, !Dense f}.\n\n  Definition complete_inverse := completion_reflect (id_fun X) f.\n  #[local] Hint Extern 2 (Inverse complete_inverse) => exact f : typeclass_instances.\n\n  Lemma complete_inverse_ufm_cont : UniformlyContinuous complete_inverse.\n  Proof. now unfold complete_inverse. Qed.\n\n  Lemma complete_inverse_spec : complete_inverse ∘ f = id.\n  Proof. exact (completion_reflect_spec id f). Qed.\n\n  Lemma complete_inverse_surjective : Surjective complete_inverse.\n  Proof. exact complete_inverse_spec. Qed.\n\n  Lemma complete_inverse_dense : Dense complete_inverse.\n  Proof. apply (Dense_factor_right f). now rew (complete_inverse_spec). Qed.\nEnd complete_inverse.\nArguments complete_inverse {_ _ _ _ _ _} f {_ _}.\nArguments complete_inverse_spec {_ _ _ _ _ _} f {_ _}.\n#[global] Hint Extern 2 (UniformlyContinuous (complete_inverse _)) => simple notypeclasses refine complete_inverse_ufm_cont : typeclass_instances.\n#[global] Hint Extern 2 (Continuous (complete_inverse _)) => simple notypeclasses refine complete_inverse_ufm_cont : typeclass_instances.\n#[global] Hint Extern 2 (Dense (func_op (complete_inverse _))) => simple notypeclasses refine complete_inverse_dense : typeclass_instances.\n\n#[global] Hint Extern 2 (Inverse (complete_inverse ?f)) => exact f : typeclass_instances.\n#[global] Hint Extern 2 (Surjective (complete_inverse _)) => simple notypeclasses refine complete_inverse_surjective : typeclass_instances.\n\nSection complete_inverse.\n  Universes u.\n  Context `{@CompleteUniformSpace@{u} X Φ Ci, @UniformlyInitial@{u} X Z Φ Ξ f, !Dense f}.\n\n  Local Instance complete_inverse_ufm_init : UniformlyInitial (complete_inverse f).\n  Proof. exact (pair_completion_reflect_is_initial 𝐔𝐧𝐢𝐟 (ι:=id_fun X) f). Qed.\n\n  Context `{!SeparatedUniformSpace Z}.\n\n  Local Instance complete_inverse_bij : Bijective (complete_inverse f).\n  Proof. exact (complete_obj_inverse_bij 𝐔𝐧𝐢𝐟 f). Qed.\n\n  Lemma complete_inverse_bij_back : Bijective f (inv:=complete_inverse f).\n  Proof. exact (complete_obj_inverse_bij_back 𝐔𝐧𝐢𝐟 f). Qed.\nEnd complete_inverse.\n#[global] Hint Extern 2 (UniformlyInitial (complete_inverse _))  => simple notypeclasses refine complete_inverse_ufm_init : typeclass_instances.\n#[global] Hint Extern 2 (Bijective (complete_inverse _))  => simple notypeclasses refine complete_inverse_bij : typeclass_instances.\n#[global] Hint Extern 2 (Bijective _ (inv:=complete_inverse _))  => simple notypeclasses refine complete_inverse_bij_back : typeclass_instances.\n#[global] Hint Extern 2 (Surjective (complete_inverse _))  => simple notypeclasses refine complete_inverse_bij : typeclass_instances.\n#[global] Hint Extern 2 (Surjective _ (inv:=complete_inverse _))  => simple notypeclasses refine complete_inverse_bij_back : typeclass_instances.\n\n#[global] Hint Extern 2 (UniformlyEmbedding (complete_inverse _))  => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n#[global] Hint Extern 2 (Injective (complete_inverse _))  => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding (complete_inverse _))  => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n\n\n#[global] Hint Extern 8 (Inverse (@to_cauchy ?X ?Φ ?H)) => simple notypeclasses refine (complete_inverse (Ξ:=@cauchy_uniformity X Φ H) (@to_cauchy X Φ H)) : typeclass_instances.\n\n(** For CompleteUniformSpace, the Separated axiom is redundant. *)\nLemma alt_Build_CompleteUniformSpace@{u} `{@UniformSpace@{u} X Φ} {Ci:CompleteInverse X}\n  : (∀ Y Ψ (f:X ⇾ Y) `{@UniformlyInitial@{u} X Y Φ Ψ f} `{!Dense f},\n       (UniformlyContinuous (completion_reflect_initial (id_fun X) f) ∧\n                 completion_reflect_initial (id_fun X) f ∘ f = id_fun X)%sprop\n       ) → CompleteUniformSpace X.\nProof. intros P. apply unif_complete. refine (alt_Build_CompleteObj 𝐔𝐧𝐢𝐟 _). exact P. Qed.\n\n(** Completeness extends along dense uniformly-initial maps out of a complete\n    space: a separated space with a dense complete subspace is complete.\n    Injectivity of [f] is automatic ([uniform_initial_embedding]); separation\n    of [Y] is a genuine hypothesis. *)\nSection dense_initial_complete.\n  Universes u.\n  Context `{@CompleteUniformSpace@{u} X Φ Ci} `{@SeparatedUniformSpace@{u} Y Ψ}\n          (f:X ⇾ Y) `{!UniformlyInitial f, !Dense f}.\n\n  Local Instance unif_dense_initial_complete_inverse : CompleteInverse@{u} Y\n    := dense_initial_complete_inverse 𝐔𝐧𝐢𝐟 f.\n\n  Lemma unif_dense_initial_complete : CompleteUniformSpace@{u} Y.\n  Proof. apply unif_complete. exact (dense_initial_complete 𝐔𝐧𝐢𝐟 _). Qed.\nEnd dense_initial_complete.\n\n(** A space whose completion unit is a bijection is complete. *)\nSection to_cauchy_bijective.\n  Universes u.\n  Context `{@UniformSpace@{u} X Φ} `{!Inverse (η X), !Bijective (η X)}.\n\n  Local Instance to_cauchy_bijective_complete_inverse : CompleteInverse X\n    := unit_bijective_complete_inverse 𝐔𝐧𝐢𝐟 (X:=X).\n\n  Lemma to_cauchy_bijective_complete : CompleteUniformSpace X.\n  Proof. apply unif_complete. exact (unit_bijective_complete 𝐔𝐧𝐢𝐟). Qed.\nEnd to_cauchy_bijective.\n\n(** A continuous retraction of (η X) suffices. *)\nSection to_cauchy_retract.\n  Universes u.\n  Context `{@UniformSpace@{u} X Φ} (r:𝒞 X ⇾ X) `{!Continuous r} (Er:r ∘ η X = id).\n\n  Local Instance to_cauchy_retract_complete_inverse : CompleteInverse X\n    := unit_retract_complete_inverse 𝐔𝐧𝐢𝐟 (X:=X) r Er.\n\n  Lemma to_cauchy_retract_complete : CompleteUniformSpace X.\n  Proof. apply unif_complete. exact (unit_retract_complete 𝐔𝐧𝐢𝐟 (X:=X) r Er). Qed.\nEnd to_cauchy_retract.\n\n(** A uniformly continuous extension construction subsuming the UP. *)\nSection complete_ext.\n  Universes u.\n  Context `{@UniformlyReflecting@{u} X Y Φ Ψ ι, !Dense ι}.\n  Context `{@UniformlyContinuous@{u} X Z Φ Ξ f, @CompleteUniformSpace Z Ξ Ci}.\n\n  Local Open Scope fun_inv_scope.\n\n  Definition ufm_cont_ext : Y ⇾ Z := (η Z)⁻¹ ∘ cauchy_map f ∘ cauchy_reflect ι.\n\n  Lemma ufm_cont_ext_ufm_cont : UniformlyContinuous ufm_cont_ext.\n  Proof. exact (canonical_completion_ext_mor 𝐔𝐧𝐢𝐟 ι f). Qed.\n\n  Lemma ufm_cont_ext_spec : ufm_cont_ext ∘ ι = f.\n  Proof. exact (canonical_completion_ext_spec 𝐔𝐧𝐢𝐟 ι f). Qed.\n\n  Lemma ufm_cont_ext_dense `{!Dense f} : Dense ufm_cont_ext.\n  Proof. exact (canonical_completion_ext_dense 𝐔𝐧𝐢𝐟 ι f). Qed.\nEnd complete_ext.\nArguments ufm_cont_ext {_ _ _ _} ι {_ _ _ _} f {_ _ _}.\nArguments ufm_cont_ext_spec {_ _ _ _} ι {_ _ _ _} f {_ _ _}.\n#[global] Hint Extern 2 (UniformlyContinuous (ufm_cont_ext _ _)) => simple notypeclasses refine ufm_cont_ext_ufm_cont : typeclass_instances.\n#[global] Hint Extern 2 (Continuous (ufm_cont_ext _ _)) => simple notypeclasses refine ufm_cont_ext_ufm_cont : typeclass_instances.\n#[global] Hint Extern 2 (Dense (func_op (ufm_cont_ext _ _))) => simple notypeclasses refine ufm_cont_ext_dense : typeclass_instances.\n\nLemma ufm_cont_ext_initial@{u}\n  `{@UniformlyInitial@{u} X Y Φ Ψ ι, !Dense ι}\n  `{@UniformlyInitial@{u} X Z Φ Ξ f, @CompleteUniformSpace Z Ξ Ci}\n  : UniformlyInitial@{u} (ufm_cont_ext@{u} ι f).\nProof. exact (canonical_completion_ext_initial 𝐔𝐧𝐢𝐟 ι f). Qed.\n#[global] Hint Extern 2 (UniformlyInitial (ufm_cont_ext _ _))  => simple notypeclasses refine ufm_cont_ext_initial : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (ufm_cont_ext _ _))  => simple notypeclasses refine ufm_cont_ext_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial (ufm_cont_ext _ _))  => simple notypeclasses refine ufm_cont_ext_initial : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting (ufm_cont_ext _ _))  => simple notypeclasses refine ufm_cont_ext_initial : typeclass_instances.\n\n#[global] Hint Extern 2 (UniformlyEmbedding (ufm_cont_ext _ _))     => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n#[global] Hint Extern 2 (Injective (ufm_cont_ext _ _))              => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding (ufm_cont_ext _ _))  => simple notypeclasses refine uniform_initial_embedding : typeclass_instances.\n\n\n(** Products. *)\n\n(** The cartesian product uniformity is a product in the pair sense\n    ([reflection_pair/products.v]): with it, [prod_map_ufm_refl] and the two\n    product theorems below are instances of the abstract ones. *)\nLemma unif_pair_product `{@UniformSpace X Φ} `{@UniformSpace Y Ψ}\n  `{@CartesianProductUniformity X Y Φ Ψ Θ} : PairProduct 𝐔𝐧𝐢𝐟 X Y Θ.\nProof. split; try exact _.\n+ exact prod_proj1_ufm_cont.\n+ exact prod_proj2_ufm_cont.\n+ intros Z Ξ f g Hf Hg. change (UniformlyContinuous f) in Hf. change (UniformlyContinuous g) in Hg.\n  apply cartesian_product_uniformity_initial; [ exact Hf | exact Hg ].\nQed.\n#[global] Hint Extern 2 (PairProduct 𝐔𝐧𝐢𝐟 _ _ _) => simple notypeclasses refine unif_pair_product : typeclass_instances.\n\nDefinition cartesian_completion_reflect@{u}\n  `{@Completion@{u} X₁ Y₁ Φ₁ Ψ₁ ι₁ HC₁, @Completion@{u} X₂ Y₂ Φ₂ Ψ₂ ι₂ HC₂}\n  `{@CartesianProductUniformity X₁ X₂ Φ₁ Φ₂ Φ}\n  `{@CartesianProductUniformity Y₁ Y₂ Ψ₁ Ψ₂ Ψ}\n  : CompletionReflect@{u} (prod_map (ι₁, ι₂))\n:= λ Z Ξ f Hf1 Hf2,\n   to_prod (completion_reflect_initial ι₁ (η _) ∘ cauchy_map (prod_proj1 _ _),\n            completion_reflect_initial ι₂ (η _) ∘ cauchy_map (prod_proj2 _ _)) ∘ cauchy_reflect f.\n#[global] Hint Extern 2 (CompletionReflect (func_op prod_map _)) => notypeclasses refine cartesian_completion_reflect : typeclass_instances.\n\nLemma cartesian_product_completion@{u}\n  `{@Completion@{u} X₁ Y₁ Φ₁ Ψ₁ ι₁ HC₁, @Completion@{u} X₂ Y₂ Φ₂ Ψ₂ ι₂ HC₂}\n  `{@CartesianProductUniformity X₁ X₂ Φ₁ Φ₂ Φ}\n  `{@CartesianProductUniformity Y₁ Y₂ Ψ₁ Ψ₂ Ψ}\n  :  Completion@{u} (prod_map (ι₁, ι₂)) .\nProof. split; try exact _; intros Z Ξ f Hf1 Hf2.\n+ now unfold completion_reflect_initial, cartesian_completion_reflect.\n+ change (to_prod\n    (completion_reflect_initial ι₁ (η _) ∘ (cauchy_map (prod_proj1 X₁ X₂) ∘ (cauchy_reflect f ∘ f)),\n     completion_reflect_initial ι₂ (η _) ∘ (cauchy_map (prod_proj2 X₁ X₂) ∘ (cauchy_reflect f ∘ f)))\n    = prod_map (ι₁, ι₂) ).\n  rew (cauchy_reflect_spec f).\n  rew [(cauchy_map_spec (prod_proj1 _ _))|(cauchy_map_spec (prod_proj2 _ _))].\n  change (to_prod ((completion_reflect_initial ι₁ (η _) ∘ η _) ∘ prod_proj1 X₁ X₂,\n                   (completion_reflect_initial ι₂ (η _) ∘ η _) ∘ prod_proj2 X₁ X₂) =\n          prod_map (ι₁, ι₂)).\n  now rew (completion_reflect_initial_spec _ _).\nQed.\n#[global] Hint Extern 2 (Completion (func_op prod_map _)) => simple notypeclasses refine cartesian_product_completion : typeclass_instances.\n\n(** Products of complete spaces are complete. *)\n\nDefinition cartesian_complete_inverse@{u}\n  `{@CompleteUniformSpace@{u} X Φ CiX, @CompleteUniformSpace@{u} Y Ψ CiY}\n  `{@CartesianProductUniformity X Y Φ Ψ Θ}\n  : CompleteInverse@{u} (X × Y)\n  := completion_inverse (ι:=prod_map (id, id)).\n#[global] Hint Extern 2 (CompleteInverse (_ × _)) => simple notypeclasses refine cartesian_complete_inverse : typeclass_instances.\n\nLemma cartesian_product_complete@{u}\n  `{@CompleteUniformSpace@{u} X Φ CiX, @CompleteUniformSpace@{u} Y Ψ CiY}\n  `{@CartesianProductUniformity X Y Φ Ψ Θ}\n  : CompleteUniformSpace@{u} (X × Y).\nProof. exact completion_complete. Qed.\n#[global] Hint Extern 2 (CompleteUniformSpace (_ × _)) => simple notypeclasses refine cartesian_product_complete : typeclass_instances.\n","sentences":[{"i":0,"s":0,"e":397,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":398,"e":452,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":453,"e":512,"kind":"vernac","status":"ok","ms":17,"messages":[],"goals":null},{"i":3,"s":513,"e":539,"kind":"vernac","status":"ok","ms":14,"messages":[],"goals":null},{"i":4,"s":540,"e":591,"kind":"vernac","status":"ok","ms":21,"messages":[],"goals":null},{"i":5,"s":592,"e":646,"kind":"vernac","status":"ok","ms":45,"messages":[],"goals":null},{"i":6,"s":647,"e":743,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":7,"s":744,"e":864,"kind":"vernac","status":"ok","ms":19,"messages":[],"goals":null},{"i":8,"s":865,"e":894,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":9,"s":895,"e":1028,"kind":"vernac","status":"ok","ms":25,"messages":[],"goals":null},{"i":10,"s":1029,"e":1057,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":11,"s":1059,"e":1090,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":12,"s":1092,"e":1128,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":13,"s":1129,"e":1163,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":14,"s":1164,"e":1207,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":15,"s":1208,"e":1245,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":16 eUniformSpace","kind":"class","local":false,"page":"../interfaces/uniform.html"},{"s":21247,"e":21267,"lib":"AffineConstructive.topology.interfaces.uniform","name":"CompleteUniformSpace","kind":"class","local":false,"page":"../interfaces/uniform.html"},{"s":21286,"e":21312,"lib":"AffineConstructive.topology.interfaces.uniform","name":"CartesianProductUniformity","kind":"class","local":false,"page":"../interfaces/uniform.html"},{"s":21328,"e":21348,"lib":"AffineConstructive.topology.interfaces.uniform","name":"CompleteUniformSpace","kind":"class","local":false,"page":"../interfaces/uniform.html"},{"s":21375,"e":21394,"lib":"AffineConstructive.topology.uniform.completion","name":"completion_complete","kind":"coe","local":true},{"s":21426,"e":21446,"lib":"AffineConstructive.topology.interfaces.uniform","name":"CompleteUniformSpace","kind":"class","local":false,"page":"../interfaces/uniform.html"},{"s":21487,"e":21513,"lib":"AffineConstructive.topology.uniform.completion","name":"cartesian_product_complete","kind":"thm","local":true},{"s":3623,"e":3626,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3671,"e":3674,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3725,"e":3728,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3780,"e":3783,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3910,"e":3913,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":10370,"e":10373,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":10724,"e":10727,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":10728,"e":10731,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":19929,"e":19932,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":20247,"e":20250,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":20278,"e":20281,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":20555,"e":20558,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":20559,"e":20562,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"This file specialises the completion theory of reflection pairs to uniform spaces under the label 𝐔𝐧𝐢𝐟. It first shows that a uniform completion in the sense of [[AffineConstructive.topology.interfaces.uniform.Completion]] is a pair completion, through [[AffineConstructive.topology.uniform.completion.unif_pair_completion]] and its converse [[AffineConstructive.topology.uniform.completion.unif_completion]], so that the abstract theorems apply whenever a concrete completion is in context. The Cauchy filters with η, 𝒞 f and the reflect maps form the canonical completion ([[AffineConstructive.topology.uniform.completion.unif_canonical_completor]], [[AffineConstructive.topology.uniform.completion.unif_canonical_completion]]), and the file shows that this completion preserves initial maps. From these come the uniform versions of the main results: completions are complete, the space of Cauchy filters 𝒞 X is complete, and the universal property extends to dense uniformly reflecting maps ([[AffineConstructive.topology.uniform.completion.completion_reflect]]) and to uniformly continuous maps into a complete space ([[AffineConstructive.topology.uniform.completion.ufm_cont_ext]]). Several criteria for completeness follow, and the file closes by showing that cartesian products of completions are completions and products of complete spaces are complete.","short":"Uniform completions as an instance of the reflection-pair completion theory","items":[{"name":"AffineConstructive.topology.uniform.completion.id","base":"id","kind":"abbrev","start":12,"body":null,"status":"ok","short":{"text":"Local shorthand for the identity function on a set","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.interfaces.set.id_fun]] with its set left to be inferred, so that the identity of X can be written id in the statements of this file, as in complete_inverse f ∘ f = id.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.η","base":"η","kind":"abbrev","start":13,"body":null,"status":"ok","short":{"text":"Local name for the unit to_cauchy : X ⇾ 𝒞 X of the Cauchy completion","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy]], the map sending a point of a uniform space X to its principal Cauchy filter in 𝒞 X. It is the unit of the canonical completion that this file installs for uniform spaces.\n\nThe definitions of the file that are built on it are [[AffineConstructive.topology.uniform.completion.cauchy_complete_inverse]], which takes the completeness datum of 𝒞 X at the completion η X; [[AffineConstructive.topology.uniform.completion.ufm_cont_ext]], whose last step is the inverse of η Z on a complete space Z; and [[AffineConstructive.topology.uniform.completion.cartesian_completion_reflect]], which sends a Cauchy filter on Xᵢ into the completion Yᵢ through the comparison map at η Xᵢ.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.𝒞","base":"𝒞","kind":"abbrev","start":14,"body":null,"status":"ok","short":{"text":"Local shorthand for 𝒞 X, the set of Cauchy filters on X","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_filter_set]], the Cauchy completion of a uniform space X: its Cauchy filters with the Cauchy equality. It is the object part of the canonical completion of uniform spaces built in this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.𝒞₁","base":"𝒞₁","kind":"abbrev","start":15,"body":null,"status":"ok","short":{"text":"Local shorthand for the map 𝒞 f : 𝒞 X ⇾ 𝒞 Y induced by a uniformly continuous f","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]], which takes image filters along a uniformly continuous map. It is the action of the Cauchy completion on maps, the part of the canonical completion that makes 𝒞 a functor on uniformly continuous maps.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.R","base":"R","kind":"abbrev","start":16,"body":null,"status":"ok","short":{"text":"Local shorthand for the reflect Y ⇾ 𝒞 X of a dense uniformly reflecting f : X ⇾ Y","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_reflect]], which sends a point y of Y to the Cauchy filter traced on X by the entourage balls about y. It supplies the extension datum of the canonical completion: for a dense uniformly reflecting f, a map back into 𝒞 X with R f ∘ f = η X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.unif_pair_completion","base":"unif_pair_completion","kind":"prf","start":20,"body":[21,23],"status":"ok","short":{"text":"A completion of uniform spaces is a completion in the reflection-pair sense for 𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"Expand the definition of a completion in the reflection-pair sense into its fields. Resolution supplies most of them from the structure of a completion of uniform spaces. In particular Y is separated, so its topology is Hausdorff ([[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]). The remaining fields, the universal property of ι with respect to dense uniformly initial maps, are fields of the completion itself.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.unif_complete_obj","base":"unif_complete_obj","kind":"prf","start":24,"body":[25,27],"status":"ok","short":{"text":"A complete uniform space is a complete object of the reflection pair 𝐔𝐧𝐢𝐟","status":"ok"},"proof":[{"text":"A complete uniform space is a completion of itself by the identity, and a complete object of 𝐔𝐧𝐢𝐟 is a pair completion by the identity. So the statement is a case of [[AffineConstructive.topology.uniform.completion.unif_pair_completion]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.unif_completion","base":"unif_completion","kind":"prf","start":30,"body":[31,49],"status":"ok","short":{"text":"Conversely, a reflection-pair completion for 𝐔𝐧𝐢𝐟 is a completion of uniform spaces","status":"ok"},"proof":[{"text":"Assume that ι is a completion in the reflection-pair sense. A completion of uniform spaces asks for five things: Y is separated, ι is uniformly initial, ι is dense, and the comparison map at every dense uniformly initial test is uniformly continuous and satisfies the factorisation law.","status":"ok","from":0,"to":2},{"text":"The codomain of a pair completion is a genuine object of the pair ([[AffineConstructive.topology.reflection_pair.completion.pair_completion_obj_Y]]), here a uniform space. By [[AffineConstructive.topology.uniform.base.uniform_T₀_separated]] and [[AffineConstructive.topology.topology.base.Hausdorff_T₀]], separation follows once Y is Hausdorff, and the pair completion asserts exactly that.","status":"ok","from":3,"to":7},{"text":"A pair completion is initial in the pair, and here that means ι is uniformly initial.","status":"ok","from":8,"to":9},{"text":"A pair completion is dense.","status":"ok","from":10,"to":11},{"text":"Fix a uniform space Z and a map f : X ⇾ Z that is uniformly initial and dense. The pair completion makes the comparison map from Z to Y a forward map of the pair, and here that means it is uniformly continuous.","status":"ok","from":12,"to":14},{"text":"For the same kind of test f, the pair completion gives the factorisation: the comparison map composed with f is ι.","status":"ok","from":15,"to":18}]},{"name":"AffineConstructive.topology.uniform.completion.unif_complete","base":"unif_complete","kind":"prf","start":50,"body":[51,53],"status":"ok","short":{"text":"Conversely, a complete object of 𝐔𝐧𝐢𝐟 is a complete uniform space","status":"ok"},"proof":[{"text":"A complete object of 𝐔𝐧𝐢𝐟 is a pair completion by the identity. By [[AffineConstructive.topology.uniform.completion.unif_completion]] the identity is then a completion of uniform spaces, and that is what completeness of X means.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.unif_canonical_completor","base":"unif_canonical_completor","kind":"def","start":54,"body":[55,69],"status":"ok","short":{"text":"The chosen completion data for uniform spaces: 𝒞 X, its uniformity, η, 𝒞₁ f and R f","status":"ok"},"proof":[{"text":"The data of a canonical completion has five components, each to be chosen: a carrier, its uniformity, a unit, an induced map for each forward map, and a map back along each dense reflecting map.","status":"ok","from":0,"to":1},{"text":"The carrier over a uniform space X is the set 𝒞 X of Cauchy filters on X.","status":"ok","from":2,"to":3},{"text":"Its uniformity is [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_uniformity]].","status":"ok","from":4,"to":5},{"text":"The unit is η, which sends a point to its principal Cauchy filter.","status":"ok","from":6,"to":7},{"text":"Take a uniformly continuous map f : X ⇾ Y. The induced map 𝒞 X ⇾ 𝒞 Y is 𝒞₁ f.","status":"ok","from":8,"to":10},{"text":"Take a map f : X ⇾ Y that is uniformly reflecting and dense. The map back Y ⇾ 𝒞 X is the Cauchy reflect R f.","status":"ok","from":11,"to":14}]},{"name":"AffineConstructive.topology.uniform.completion.unif_canonical_completion","base":"unif_canonical_completion","kind":"prf","start":71,"body":[72,95],"status":"ok","short":{"text":"The Cauchy completion satisfies the laws of a canonical completion of uniform spaces","status":"ok"},"proof":[{"text":"A canonical completion must satisfy seven laws about the data just chosen. Each law is checked in turn.","status":"ok","from":0,"to":1},{"text":"Fix a uniform space X. Its Cauchy completion 𝒞 X is a separated uniform space ([[AffineConstructive.topology.uniform.cauchy_completion.cauchy_filter_space]]), so its topology is Hausdorff ([[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]).","status":"ok","from":2,"to":4},{"text":"The unit η X is uniformly initial ([[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy_initial]]).","status":"ok","from":5,"to":7},{"text":"The unit η X is dense ([[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy_dense]]).","status":"ok","from":8,"to":10},{"text":"For f uniformly continuous, 𝒞₁ f is uniformly continuous ([[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map_ufm_cont]]).","status":"ok","from":11,"to":13},{"text":"The unit is natural: 𝒞₁ f ∘ η X = η Y ∘ f ([[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map_spec]]).","status":"ok","from":14,"to":16},{"text":"For f dense and uniformly reflecting, the Cauchy reflect of f is uniformly continuous ([[AffineConstructive.topology.uniform.cauchy_completion.cauchy_reflect_ufm_cont]]).","status":"ok","from":17,"to":19},{"text":"For the same f, composing the Cauchy reflect with f gives η X ([[AffineConstructive.topology.uniform.cauchy_completion.cauchy_reflect_spec]]).","status":"ok","from":20,"to":23}]},{"name":"AffineConstructive.topology.uniform.completion.unif_canonical_map_initial","base":"unif_canonical_map_initial","kind":"prf","start":97,"body":[98,102],"status":"ok","short":{"text":"The Cauchy completion functor carries uniformly initial maps to uniformly initial maps","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.reflection_pair.completion.dense_initial_descent_map_ini]], the canonical completion preserves initial maps once initiality descends along dense forward maps. What remains is the descent law for uniform spaces: given f : S ⇾ T dense and uniformly continuous, and g : T ⇾ V uniformly continuous with g ∘ f uniformly reflecting, g is uniformly initial.","status":"ok","from":0,"to":1},{"text":"Fix the three uniform spaces, the maps f and g, and the hypotheses on them. The descent law is exactly [[AffineConstructive.topology.uniform.product.ufm_dense_initial]], proved with the product uniformity, and it gives that g is uniformly initial.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.uniform.completion.g","base":"g","kind":"abbrev","start":107,"body":null,"status":"ok","short":{"text":"Local shorthand for the comparison map Z ⇾ Y of a completion ι at a dense initial f","status":"ok"},"long":{"text":"Within its section, an abbreviation for [[AffineConstructive.topology.interfaces.uniform.completion_reflect_initial]] ι f: given a completion ι : X ⇾ Y and a dense uniformly initial f : X ⇾ Z, the map g : Z ⇾ Y that the completion provides, with g ∘ f = ι. The section proves that g is dense and uniformly initial.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.completion_reflect_initial_dense","base":"completion_reflect_initial_dense","kind":"prf","start":108,"body":[109,111],"status":"ok","short":{"text":"The comparison map of a completion at a dense uniformly initial test is dense","status":"ok"},"proof":[{"text":"Regard the completion ι as a pair completion ([[AffineConstructive.topology.uniform.completion.unif_pair_completion]]). The comparison map from Z back to Y is then dense by the abstract result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_initial_dense]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.completion_reflect_initial_initial","base":"completion_reflect_initial_initial","kind":"prf","start":112,"body":[113,115],"status":"ok","short":{"text":"The comparison map of a completion at a dense uniformly initial test is uniformly initial","status":"ok"},"proof":[{"text":"Regard the completion ι as a pair completion ([[AffineConstructive.topology.uniform.completion.unif_pair_completion]]). The abstract result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_initial_initial]] applies to the test f and makes the comparison map uniformly initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.completion_inverse","base":"completion_inverse","kind":"def","start":122,"body":null,"status":"ok","short":{"text":"The completeness datum on the codomain Y of a completion ι : X ⇾ Y","status":"ok"},"long":{"text":"For a completion ι : X ⇾ Y of uniform spaces, the datum [[AffineConstructive.topology.interfaces.uniform.CompleteInverse]] on Y: for each dense uniformly initial extension of Y, a map back to Y. It is obtained by passing ι to the reflection-pair level through [[AffineConstructive.topology.uniform.completion.unif_pair_completion]] and taking [[AffineConstructive.topology.reflection_pair.completion.pair_completion_inverse]] there.\n\nDeclared as a coercion and found by resolution whenever a completion onto Y is in context, it is the data half of the statement that a completion is complete; the other half is [[AffineConstructive.topology.uniform.completion.completion_complete]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.completion_complete","base":"completion_complete","kind":"def","start":124,"body":[125,128],"status":"ok","short":{"text":"The codomain of a completion of uniform spaces is complete","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.completion.unif_completion]], completeness of Y follows once the identity of Y is a pair completion, that is, once Y is a complete object of 𝐔𝐧𝐢𝐟.","status":"ok","from":0,"to":1},{"text":"The completion ι is a pair completion ([[AffineConstructive.topology.uniform.completion.unif_pair_completion]]). Its codomain is therefore complete by the abstract result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_complete]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.completion.cauchy_complete_inverse","base":"cauchy_complete_inverse","kind":"def","start":129,"body":null,"status":"ok","short":{"text":"The completeness datum on the Cauchy completion 𝒞 X","status":"ok"},"long":{"text":"The datum [[AffineConstructive.topology.interfaces.uniform.CompleteInverse]] on the set of Cauchy filters 𝒞 X of a uniform space X: a map back to 𝒞 X from every dense, uniformly initial extension of it. It is [[AffineConstructive.topology.uniform.completion.completion_inverse]] taken at the unit η : X ⇾ 𝒞 X, which is a completion, since the codomain of any completion carries such a datum. A hint registers it for resolution, so that 𝒞 X carries its completeness datum without further mention.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.cauchy_complete","base":"cauchy_complete","kind":"prf","start":131,"body":[132,134],"status":"ok","short":{"text":"The Cauchy completion 𝒞 X of a uniform space is complete","status":"ok"},"proof":[{"text":"The unit η : X ⇾ 𝒞 X is a completion of X. By [[AffineConstructive.topology.uniform.completion.completion_complete]] the codomain of any completion is complete, and applied to η this is the claim.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.completion_reflect","base":"completion_reflect","kind":"def","start":139,"body":null,"status":"ok","short":{"text":"For a completion ι : X ⇾ Y and dense uniformly reflecting f : X ⇾ Z, the map Z ⇾ Y extending ι","status":"ok"},"long":{"text":"The universal property of a completion, extended from dense uniformly initial maps to dense uniformly reflecting ones. Given a completion ι : X ⇾ Y and a map f : X ⇾ Z that is dense and uniformly reflecting, but not assumed uniformly continuous, it gives a map Z ⇾ Y; it is [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect]] at the reflection pair of uniform spaces.\n\nThe map is uniformly continuous and dense and satisfies completion_reflect ι f ∘ f = ι. When f is moreover uniformly initial it agrees with [[AffineConstructive.topology.interfaces.uniform.completion_reflect_initial]] and is itself uniformly initial, hence a uniform embedding. Taking ι to be the identity of a complete space gives [[AffineConstructive.topology.uniform.completion.complete_inverse]].\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"\\mathrm{completion\\_reflect}\\ \\iota\\ f\"] \\\\\n & Y\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.completion_reflect_ufm_cont","base":"completion_reflect_ufm_cont","kind":"inst","start":140,"body":[141,143],"status":"ok","short":{"text":"The extension completion_reflect ι f is uniformly continuous","status":"ok"},"proof":[{"text":"A completion of uniform spaces is a completion in the reflection-pair sense for the uniform pair, with the Cauchy completion as the canonical completion. By [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_mor]] the abstract extension is a forward map of that pair, and a forward map of the uniform pair is a uniformly continuous map.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.completion_reflect_spec","base":"completion_reflect_spec","kind":"prf","start":144,"body":[145,147],"status":"ok","short":{"text":"The extension satisfies completion_reflect ι f ∘ f = ι","status":"ok"},"proof":[{"text":"Read the completion ι as a completion in the reflection-pair sense for the uniform pair. The equation is then the abstract one, [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_spec]]: the extension along the dense, uniformly reflecting f, composed with f, gives back ι.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.completion_reflect_dense","base":"completion_reflect_dense","kind":"prf","start":148,"body":[149,151],"status":"ok","short":{"text":"The extension completion_reflect ι f is dense","status":"ok"},"proof":[{"text":"Read ι as a completion for the uniform reflection pair. The extension is then dense by the abstract result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_dense]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.completion_reflect_equal","base":"completion_reflect_equal","kind":"prf","start":158,"body":[159,161],"status":"ok","short":{"text":"For a uniformly initial f, completion_reflect ι f equals the comparison map completion_reflect_initial ι f","status":"ok"},"proof":[{"text":"Read ι as a completion for the uniform reflection pair. When f is uniformly initial as well as dense, the abstract result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_equal]] shows that the two retractions into the completion are equal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.completion_reflect_is_initial","base":"completion_reflect_is_initial","kind":"prf","start":162,"body":[163,165],"status":"ok","short":{"text":"For a dense uniformly initial f, the extension completion_reflect ι f is uniformly initial","status":"ok"},"proof":[{"text":"Read ι as a completion for the uniform reflection pair. When f is dense and uniformly initial, the abstract result [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_is_initial]] makes the extension initial for that pair, which here means uniformly initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.complete_inverse","base":"complete_inverse","kind":"def","start":176,"body":null,"status":"ok","short":{"text":"The uniformly continuous left inverse Z ⇾ X of a dense uniformly reflecting map out of a complete X","status":"ok"},"long":{"text":"The universal property of a complete uniform space X. Every map f : X ⇾ Z that is dense and uniformly reflecting has a left inverse Z ⇾ X. Here the left inverse is defined as [[AffineConstructive.topology.uniform.completion.completion_reflect]] taken at the identity of X. The identity is a completion of X exactly because X is complete. So no new construction is needed: the map is the retraction that any completion gives along a dense reflecting map, read at the completion id : X ⇾ X. Inside its section a local hint makes f the designated inverse of complete_inverse f, so surjectivity can be stated with f as the section.\n\n```tikzcd\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\mathrm{id}\"'] & Z \\arrow[d, \"\\mathrm{complete\\_inverse}\\, f\"] \\\\\n & X\n```\n\nThe lemmas concluding it give complete_inverse f four properties. It is uniformly continuous ([[AffineConstructive.topology.uniform.completion.complete_inverse_ufm_cont]]). It is a left inverse of f: complete_inverse f ∘ f = id ([[AffineConstructive.topology.uniform.completion.complete_inverse_spec]]). It is surjective, with f as its section ([[AffineConstructive.topology.uniform.completion.complete_inverse_surjective]]). It is dense ([[AffineConstructive.topology.uniform.completion.complete_inverse_dense]]). When f is uniformly initial, [[AffineConstructive.topology.uniform.completion.complete_inverse_ufm_init]] builds on it to show that the left inverse is uniformly initial too. If Z is also separated, [[AffineConstructive.topology.uniform.completion.complete_inverse_bij]] shows that it is a bijection, and [[AffineConstructive.topology.uniform.completion.complete_inverse_bij_back]] shows that f itself is a bijection with complete_inverse f as its inverse. A global hint at the end of the file uses it, at f = η X, as the designated inverse of the unit of a complete space.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.complete_inverse_ufm_cont","base":"complete_inverse_ufm_cont","kind":"prf","start":178,"body":[179,181],"status":"ok","short":{"text":"The left inverse complete_inverse f is uniformly continuous","status":"ok"},"proof":[{"text":"By definition the left inverse is the extension of the identity of the complete space X along f. That extension is uniformly continuous by [[AffineConstructive.topology.uniform.completion.completion_reflect_ufm_cont]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.complete_inverse_spec","base":"complete_inverse_spec","kind":"prf","start":182,"body":[183,185],"status":"ok","short":{"text":"The left inverse satisfies complete_inverse f ∘ f = id","status":"ok"},"proof":[{"text":"This is [[AffineConstructive.topology.uniform.completion.completion_reflect_spec]] for the completion id of the complete space X: the extension of the identity along f, composed with f, is the identity.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.complete_inverse_surjective","base":"complete_inverse_surjective","kind":"prf","start":186,"body":[187,189],"status":"ok","short":{"text":"complete_inverse f is surjective, with f as its designated section","status":"ok"},"proof":[{"text":"A map with a right inverse is surjective. Here f is that right inverse, by [[AffineConstructive.topology.uniform.completion.complete_inverse_spec]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.complete_inverse_dense","base":"complete_inverse_dense","kind":"prf","start":190,"body":[191,194],"status":"ok","short":{"text":"The left inverse complete_inverse f is dense","status":"ok"},"proof":[{"text":"If a composite g ∘ f is dense, then g is dense ([[AffineConstructive.topology.topology.maps.Dense_factor_right]]). So it suffices to show that the left inverse composed with f is dense.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.topology.uniform.completion.complete_inverse_spec]] that composite is the identity, and the identity is dense.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.completion.complete_inverse_ufm_init","base":"complete_inverse_ufm_init","kind":"inst","start":206,"body":[207,209],"status":"ok","short":{"text":"For a dense uniformly initial f, complete_inverse f is uniformly initial","status":"ok"},"proof":[{"text":"This is the abstract theorem [[AffineConstructive.topology.reflection_pair.completion.pair_completion_reflect_is_initial]] for the uniform reflection pair, taking the identity of X as the completion: at a dense uniformly initial test f, the reflect induced along f is initial. Here that reflect is complete_inverse f, so it is uniformly initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.complete_inverse_bij","base":"complete_inverse_bij","kind":"inst","start":211,"body":[212,214],"status":"ok","short":{"text":"For dense uniformly initial f into a separated space, complete_inverse f is a bijection","status":"ok"},"proof":[{"text":"This is the abstract theorem [[AffineConstructive.topology.reflection_pair.completion.complete_obj_inverse_bij]] for the uniform reflection pair. A separated uniform space has a Hausdorff topology ([[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]), so the inverse of the dense initial map f into the separated space Z is a bijection.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.complete_inverse_bij_back","base":"complete_inverse_bij_back","kind":"prf","start":215,"body":[216,218],"status":"ok","short":{"text":"A dense uniformly initial map from a complete space into a separated space is a bijection","status":"ok"},"proof":[{"text":"This is the abstract theorem [[AffineConstructive.topology.reflection_pair.completion.complete_obj_inverse_bij_back]] for the uniform reflection pair. Z is separated, so its topology is Hausdorff ([[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]), and a dense initial map from the complete X into Z is therefore a bijection, with complete_inverse f as its inverse.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.alt_Build_CompleteUniformSpace","base":"alt_Build_CompleteUniformSpace","kind":"prf","start":229,"body":[230,235],"status":"ok","short":{"text":"X is complete once each dense uniformly initial f has a uniformly continuous left inverse; separation follows","status":"ok"},"proof":[{"text":"Assume that every dense uniformly initial map f out of X has a uniformly continuous left inverse, namely the reflect induced along f.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.topology.uniform.completion.unif_complete]] it is enough to show that X is a complete object of the uniform reflection pair. The abstract criterion [[AffineConstructive.topology.reflection_pair.completion.alt_Build_CompleteObj]] reduces this to the following: every dense initial test out of X has a forward left inverse. The Hausdorff condition then follows and does not have to be checked.","status":"ok","from":2,"to":3},{"text":"Once the abstract notions are read in the uniform pair, this is exactly the assumption.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.uniform.completion.unif_dense_initial_complete_inverse","base":"unif_dense_initial_complete_inverse","kind":"inst","start":239,"body":null,"status":"ok","short":{"text":"The datum CompleteInverse on Y, carried along a dense uniformly initial f : X ⇾ Y from that datum on X","status":"ok"},"long":{"text":"Given the completeness datum [[AffineConstructive.topology.interfaces.uniform.CompleteInverse]] on X, which supplies a map back to X from every dense uniformly initial extension of X, and a dense uniformly initial map f : X ⇾ Y, this is the same kind of datum on Y: a map back to Y from every dense uniformly initial extension of Y. It is [[AffineConstructive.topology.reflection_pair.completion.dense_initial_complete_inverse]] taken at the reflection pair of uniform spaces. Its type assumes only the datum on X, not that X is complete; it is a datum, and the laws that make it a completeness structure are proved separately.\n\nThe instance is local to its section. There it supplies the datum on Y for [[AffineConstructive.topology.uniform.completion.unif_dense_initial_complete]], which adds the hypotheses that X is complete and Y separated and concludes that Y is complete.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.unif_dense_initial_complete","base":"unif_dense_initial_complete","kind":"prf","start":240,"body":[241,244],"status":"ok","short":{"text":"A separated space receiving a dense uniformly initial map from a complete space is complete","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.completion.unif_complete]] it is enough to show that Y is a complete object of the uniform reflection pair. Its completeness datum is carried over from X along f.","status":"ok","from":0,"to":1},{"text":"This is the abstract theorem [[AffineConstructive.topology.reflection_pair.completion.dense_initial_complete]]. X is a complete object ([[AffineConstructive.topology.uniform.completion.unif_complete_obj]]), Y is Hausdorff because it is separated ([[AffineConstructive.topology.uniform.base.separated_uniform_hausdorff]]), and f is dense and initial, so Y is complete.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.completion.to_cauchy_bijective_complete_inverse","base":"to_cauchy_bijective_complete_inverse","kind":"inst","start":249,"body":null,"status":"ok","short":{"text":"The completeness datum on X when the unit η X : X ⇾ 𝒞 X is a bijection","status":"ok"},"long":{"text":"For a uniform space X whose unit η : X ⇾ 𝒞 X has a designated inverse making it a bijection, the datum [[AffineConstructive.topology.interfaces.uniform.CompleteInverse]] on X, transported from the complete space 𝒞 X through that inverse. It is [[AffineConstructive.topology.reflection_pair.completion.unit_bijective_complete_inverse]] at the reflection pair of uniform spaces, and is local to its section.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.to_cauchy_bijective_complete","base":"to_cauchy_bijective_complete","kind":"prf","start":250,"body":[251,254],"status":"ok","short":{"text":"A uniform space whose unit η X : X ⇾ 𝒞 X is a bijection is complete","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.completion.unif_complete]] it is enough to show that X is a complete object of the uniform reflection pair, with the completeness datum that comes from the inverse of η X.","status":"ok","from":0,"to":1},{"text":"With the Cauchy completion as the canonical completion, this is the abstract theorem [[AffineConstructive.topology.reflection_pair.completion.unit_bijective_complete]]: an object whose unit is a bijection is complete.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.completion.to_cauchy_retract_complete_inverse","base":"to_cauchy_retract_complete_inverse","kind":"inst","start":259,"body":null,"status":"ok","short":{"text":"The completeness datum on X from a continuous retraction r of the unit η X","status":"ok"},"long":{"text":"For a uniform space X and a continuous map r : 𝒞 X ⇾ X with r ∘ η X = id, the datum [[AffineConstructive.topology.interfaces.uniform.CompleteInverse]] on X: a map back to X from every dense, uniformly initial extension of X. It is [[AffineConstructive.topology.reflection_pair.completion.unit_retract_complete_inverse]] at the reflection pair of uniform spaces. Only continuity of r is asked, not uniform continuity. It is local to its section.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.to_cauchy_retract_complete","base":"to_cauchy_retract_complete","kind":"prf","start":260,"body":[261,264],"status":"ok","short":{"text":"A uniform space whose unit η X has a continuous retraction is complete","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.completion.unif_complete]] it is enough to show that X is a complete object of the uniform reflection pair, with the completeness datum built from the retraction r.","status":"ok","from":0,"to":1},{"text":"With the Cauchy completion as the canonical completion, this is the abstract theorem [[AffineConstructive.topology.reflection_pair.completion.unit_retract_complete]], applied to the continuous map r and the equation r ∘ η X = id.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.completion.ufm_cont_ext","base":"ufm_cont_ext","kind":"def","start":271,"body":null,"status":"ok","short":{"text":"The extension Y ⇾ Z of a uniformly continuous f : X ⇾ Z into a complete space along a dense reflecting ι","status":"ok"},"long":{"text":"Given a uniformly reflecting dense map ι : X ⇾ Y and a uniformly continuous f : X ⇾ Z into a complete uniform space Z, this is the map Y ⇾ Z obtained by passing through Cauchy filters. First [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_reflect]] ι sends a point of Y to the Cauchy filter it traces on X. Then [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]] f pushes that filter forward to a Cauchy filter on Z. Finally the inverse of the unit [[AffineConstructive.topology.uniform.cauchy_completion.to_cauchy]] at Z brings the result back to a point of Z. That inverse exists because Z is complete: it is the [[AffineConstructive.topology.uniform.completion.complete_inverse]] of the dense initial unit η Z. In traditional terms, this is the extension by continuity of f along ι, with its value at y the limit of f along the trace of y on X.\n\nOnly the reflecting half of initiality is asked of ι. That is all [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_reflect]] needs, and it makes the construction more general than the universal property of a completion: when ι is itself a completion, the extension is the unique factorisation of f through ι. The lemmas that follow say that the extension is uniformly continuous ([[AffineConstructive.topology.uniform.completion.ufm_cont_ext_ufm_cont]]), extends f ([[AffineConstructive.topology.uniform.completion.ufm_cont_ext_spec]]), is dense when f is ([[AffineConstructive.topology.uniform.completion.ufm_cont_ext_dense]]) and is uniformly initial when ι and f are ([[AffineConstructive.topology.uniform.completion.ufm_cont_ext_initial]]). Each is an instance of the corresponding theorem of the abstract canonical-completion theory.\n\n```tikzcd\nX \\arrow[r, \"\\iota\"] \\arrow[dr, \"f\"'] & Y \\arrow[d, dashed] \\\\\n & Z\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.ufm_cont_ext_ufm_cont","base":"ufm_cont_ext_ufm_cont","kind":"prf","start":272,"body":[273,275],"status":"ok","short":{"text":"The extension of f along ι into a complete space is uniformly continuous","status":"ok"},"proof":[{"text":"The extension is the canonical completion extension of the uniform reflection pair. Since Z is a complete object ([[AffineConstructive.topology.uniform.completion.unif_complete_obj]]), [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_mor]] shows that the extension is a forward map, that is, uniformly continuous.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.ufm_cont_ext_spec","base":"ufm_cont_ext_spec","kind":"prf","start":276,"body":[277,279],"status":"ok","short":{"text":"The extension of f along ι, composed with ι, is f","status":"ok"},"proof":[{"text":"This is the abstract equation [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_spec]] for the uniform reflection pair: the extension of f along ι, composed with ι, is f.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.ufm_cont_ext_dense","base":"ufm_cont_ext_dense","kind":"prf","start":280,"body":[281,283],"status":"ok","short":{"text":"The extension of a dense f along ι is dense","status":"ok"},"proof":[{"text":"This is the abstract theorem [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_dense]] for the uniform reflection pair: the extension of a dense map is dense.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.ufm_cont_ext_initial","base":"ufm_cont_ext_initial","kind":"prf","start":290,"body":[291,293],"status":"ok","short":{"text":"For ι dense and uniformly initial and f uniformly initial, the extension of f along ι is uniformly initial","status":"ok"},"proof":[{"text":"The lemma is the abstract statement [[AffineConstructive.topology.reflection_pair.completion.canonical_completion_ext_initial]], instantiated at the uniform reflection pair. Its one requirement is that the canonical completion preserves initial maps, and for the Cauchy completion this is [[AffineConstructive.topology.uniform.completion.unif_canonical_map_initial]]. The complete space Z counts as a complete object of the pair.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.completion.unif_pair_product","base":"unif_pair_product","kind":"prf","start":301,"body":[302,313],"status":"ok","short":{"text":"The cartesian product uniformity makes X × Y a product of uniform spaces in the reflection-pair sense","status":"ok"},"proof":[{"text":"Unfolding the notion of a product in the reflection pair, the structural parts are found automatically. Three conditions remain: the two projections are uniformly continuous, and the pairing of two uniformly continuous maps is uniformly continuous.","status":"ok","from":0,"to":1},{"text":"The projections are uniformly continuous by [[AffineConstructive.topology.uniform.product.prod_proj1_ufm_cont]] and [[AffineConstructive.topology.uniform.product.prod_proj2_ufm_cont]].","status":"ok","from":2,"to":5},{"text":"For the pairing, let f : Z ⇾ X and g : Z ⇾ Y be morphisms of the pair, which here means that they are uniformly continuous.","status":"ok","from":6,"to":9},{"text":"A map into X × Y is uniformly continuous when both of its components are, by [[AffineConstructive.topology.uniform.product.cartesian_product_uniformity_initial]], so the pairing of f and g is uniformly continuous.","status":"ok","from":10,"to":11}]},{"name":"AffineConstructive.topology.uniform.completion.cartesian_completion_reflect","base":"cartesian_completion_reflect","kind":"def","start":315,"body":null,"status":"ok","short":{"text":"The completion data for ι₁ × ι₂, built from the Cauchy reflect and the two completions","status":"ok"},"long":{"text":"Let ι₁ : X₁ ⇾ Y₁ and ι₂ : X₂ ⇾ Y₂ be completions, with X₁ × X₂ and Y₁ × Y₂ carrying the cartesian product uniformities. This definition supplies the extension datum for the product map ι₁ × ι₂: for each dense, uniformly reflecting test f : X₁ × X₂ ⇾ Z it gives a map Z ⇾ Y₁ × Y₂.\n\nA point of Z is first sent by [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_reflect]] f to the Cauchy filter it traces on X₁ × X₂. Each projection then pushes that filter forward by [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map]] to a Cauchy filter on Xᵢ, and the comparison map of the completion ιᵢ at the dense initial unit η Xᵢ ([[AffineConstructive.topology.interfaces.uniform.completion_reflect_initial]]) carries it to a point of Yᵢ. Pairing the two components with [[AffineConstructive.theory.set.to_prod]] gives the map into Y₁ × Y₂. The construction thus reduces the product to the canonical completion 𝒞 of X₁ × X₂ and the two given completions.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.cartesian_product_completion","base":"cartesian_product_completion","kind":"prf","start":317,"body":[318,328],"status":"ok","short":{"text":"The product ι₁ × ι₂ of two completions is a completion of X₁ × X₂","status":"ok"},"proof":[{"text":"Most of the conditions for a completion are found automatically. The product of separated spaces is separated, the product map of uniformly initial maps is uniformly initial, and the product of dense maps is dense. The universal property remains: given a dense, uniformly initial f from X₁ × X₂ into Z, the reflect it supplies must be uniformly continuous and must carry f back to ι₁ × ι₂.","status":"ok","from":0,"to":1},{"text":"Unfolded, the reflect of [[AffineConstructive.topology.uniform.completion.cartesian_completion_reflect]] pairs two composites. Each one traces Z back into the Cauchy completion of X₁ × X₂, applies the induced map of a projection, and then the reflect of ιᵢ along η. Each of these maps is uniformly continuous, so the pairing is too.","status":"ok","from":2,"to":3},{"text":"For the equation, write the composite with f component by component. Tracing f back gives the unit, R f ∘ f = η, by [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_reflect_spec]].","status":"ok","from":4,"to":6},{"text":"Naturality of η, [[AffineConstructive.topology.uniform.cauchy_completion.cauchy_map_spec]], moves each projection past the unit. Regrouping, each component becomes the reflect of ιᵢ along η, composed with η, followed by the i-th projection.","status":"ok","from":7,"to":8},{"text":"Since η is dense and uniformly initial, the reflect of ιᵢ along η composed with η is ιᵢ. The pairing of ι₁ ∘ π₁ and ι₂ ∘ π₂ is the product map ι₁ × ι₂.","status":"ok","from":9,"to":10}]},{"name":"AffineConstructive.topology.uniform.completion.cartesian_complete_inverse","base":"cartesian_complete_inverse","kind":"def","start":330,"body":null,"status":"ok","short":{"text":"The completeness datum on X × Y for complete uniform spaces X and Y","status":"ok"},"long":{"text":"For complete uniform spaces X and Y, with the cartesian product uniformity on X × Y, the datum [[AffineConstructive.topology.interfaces.uniform.CompleteInverse]] on X × Y: a map back to X × Y from every dense, uniformly initial extension of it. Since each identity is a completion, so is their product map X × Y ⇾ X × Y ([[AffineConstructive.topology.uniform.completion.cartesian_product_completion]]), and the datum is [[AffineConstructive.topology.uniform.completion.completion_inverse]] taken at that product map.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.completion.cartesian_product_complete","base":"cartesian_product_complete","kind":"prf","start":332,"body":[333,335],"status":"ok","short":{"text":"The cartesian product of two complete uniform spaces is complete","status":"ok"},"proof":[{"text":"The codomain of any completion is complete, by [[AffineConstructive.topology.uniform.completion.completion_complete]]. Here X and Y are their own completions, and by [[AffineConstructive.topology.uniform.completion.cartesian_product_completion]] their product is a completion with codomain X × Y.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{"\nX \\arrow[r, \"f\"] \\arrow[dr, \"\\iota\"'] & Z \\arrow[d, \"\\mathrm{completion\\_reflect}\\ \\iota\\ f\"] \\\\\n & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://

6.56364Z'/>\n<\/defs>\n<g id='page1'>\n<g transform='matrix(.999739 0 0 .999739 0 50.11)'>\n<use x='6.279361' y='-37.654171' xlink:href='#g0-1'/>\n<\/g>\n<g transform='matrix(.999739 0 0 .999739 0 50.11)'>\n<use x='47.785526' y='-37.654171' xlink:href='#g0-2'/>\n<use x='48.027463' y='-5.636529' xlink:href='#g0-3'/>\n<\/g>\n<path d='M19.80378 9.95478H42.91154' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M40.50735 7.366521C40.98299 8.919501 42.0429 9.652821 43.11077 9.954781C42.0429 10.256741 40.98299 10.990061 40.50735 12.543041' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 50.11)'>\n<use x='30.066608' y='-42.474843' xlink:href='#g1-1'/>\n<\/g>\n<path d='M18.90537 16.28994L43.23816 35.29827' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10'/>\n<path d='M42.936936 31.778654C42.355735 33.295237 42.739534 34.525589 43.39515 35.42092C42.367761 35.00149 41.081098 34.92688 39.75027 35.857855' stroke='currentColor' fill='none' stroke-width='.398468' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<g transform='matrix(.999455 0 0 .999455 0 50.11)'>\n<use x='24.205803' y='-16.997733' xlink:href='#g1-2'/>\n<\/g>\n<path d='M51.79667 16.28994V33.42156' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-dasharray='2.78941 1.59395'/>\n<path d='M54.38493 31.01739C52.83195 31.49303 52.09863 32.55294 51.79667 33.62081C51.49471 32.55294 50.76139 31.49303 49.20841 31.01739' stroke='currentColor' fill='none' stroke-width='.39848' stroke-miterlimit='10' stroke-linejoin='round' stroke-linecap='round'/>\n<\/g>\n<\/svg>"},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Neighbourhood topologies: axioms, interior and closure, separation, continuous, reflecting and dense maps, products","summary":"The interface for topological spaces, given by a neighbourhood relation. A [[Neighborhood]] on a set X is a function x ⪽ U from X ⊗ 𝒫 X to affine propositions, and [[Topology]] states the neighbourhood axioms for it: a neighbourhood contains its point, the relation is upward closed, the full subset is a neighbourhood, binary meets of neighbourhoods are neighbourhoods, and a neighbourhood U is a neighbourhood of the set of points of which U is a neighbourhood. From the relation the file defines [[interior]], [[closure]], open, closed and dense subsets, neighbourhood bases, and the separation axioms [[Separation_T₀]] and [[Hausdorff]]. It sets out the classes of maps used throughout the topology files: [[Continuous]], the reflecting class [[ContinuouslyReflecting]], the two together as [[ContinuouslyInitial]], [[ContinuouslyEmbedding]] and [[Dense]]. It also gives the discrete and indiscrete structures and the two product topologies, the tensor product by a neighbourhood basis and the cartesian product by its universal property. The topological lemmas live in the files under topology/topology, and the uniform and bornological interfaces build on these classes."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, uniformly continuous and reflecting maps, Cauchy filters, completions","summary":"The file sets up the basic notions of uniform spaces. A uniformity on X is a set of entourages, which are subsets of X ⊗ X. Points x and y are U-close when (x, y) ∊ U. A uniform space is a uniformity that is a filter and satisfies three axioms: reflexivity, symmetry, and splitting (each entourage contains some V ⋄ V). Stronger variants are a splitting with the additive conjunction, separation, and regularity. The uniformity induces a neighbourhood relation. The file then defines the following maps: uniformly continuous and uniformly reflecting maps, uniformly initial maps (both at once), and uniform embeddings. It also defines presentations of the tensor and cartesian product uniformities and of the discrete and indiscrete uniformities, the thickening U.[A] with the relation K ◁ S, and Cauchy filters. Finally it states the universal property of a completion: a separated space Y with a uniformly initial dense map ι from X, such that any uniformly initial dense f : X → Z has a uniformly continuous extension Z → Y with composite ι. The Cauchy completion and the bornological files build on these interfaces."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"base.html","short":"Uniform spaces: entourage algebra, thickenings, uniform topology, uniform maps, the reflection pair","summary":"The basic theory of uniform spaces. It equips a uniformity with its algebraic structure (a sublattice and sub-star-semigroup of relations), derives the splitting and symmetry consequences of the axioms and the composition laws for closeness, and develops thickenings U[A] of subsets: monotonicity, composition, singletons, and the swap law for a thickening apart from a set. The uniform topology is built from the entourages, with interior, closure and density described by entourages; separated uniform spaces are shown Hausdorff, and regular ones strong. For maps it characterises uniform continuity and reflection by preimages under f × f, introduces the pullback of entourages [[ufm_preimage]], proves closure under identity, composition and the cancellation laws, and assembles uniform spaces into the reflection pair [[𝐔𝐧𝐢𝐟]] with a morphism to topological spaces. It ends with thickening and closure estimates along dense and uniformly reflecting maps, used by the completion and trapped-completion files."},"AffineConstructive.topology.uniform.basis":{"page":"basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.uniform.product":{"page":"product.html","short":"Cartesian and tensor product uniformities, their structure maps, and dense-extension criteria","summary":"The file builds the cartesian and tensor product uniformities from their presentations by basic entourages, and shows that each makes the product a uniform space. Basic entourages of X × Y combine U-closeness of first coordinates and V-closeness of second coordinates additively. Those of X ⊗ Y combine them by the tensor. For the cartesian product it proves that the projections are uniformly continuous and that a map into the product is uniformly continuous when both of its components are. It also shows that the induced topology is the cartesian product topology and that a product of separated spaces is separated. For the tensor product it shows that the induced topology is the tensor product topology, and that the unitors, the symmetry and the associators are uniform embeddings. On both products, maps of factors that are uniformly continuous, reflecting, initial or embeddings give product maps of the same kind. The last section, on relations in the tensor square, describes the interior and closure of an entourage by thickening and derives the dense-extension criteria [[ufm_dense_reflecting]] and [[ufm_dense_continuous]]."},"AffineConstructive.topology.uniform.cauchy_completion":{"page":"cauchy_completion.html","short":"The Cauchy completion: Cauchy filters, their uniformity, the unit η, and its universal property","summary":"The file builds the Cauchy completion 𝒞 X of a uniform space X. Its points are the Cauchy filters on X, bundled as [[cauchy_filter]]. Two Cauchy filters are equal ([[cauchy_equiv]]) when they have U-close members for every entourage U. An entourage U of X lifts to the relation [[cauchy_basis]], which holds of F and G when for every V they have members A and B with A ⊗ B ⊆ V⁻¹ ∙ U ∙ V. These relations present a separated uniformity on 𝒞 X ([[cauchy_uniformity]], [[cauchy_filter_space]]), and the lifted entourages [[cauchy_entourage]] come with laws for inverses, composition and members. The unit [[to_cauchy]] sends a point to its principal filter; it is uniformly initial, dense, and an embedding when X is separated. A uniformly continuous f extends to [[cauchy_map]], which commutes with η and preserves composition and identities. From a dense, uniformly reflecting f : X ⇾ Y, [[cauchy_reflect]] builds a map Y ⇾ 𝒞 X with cauchy_reflect f ∘ f = η X. This gives the universal property [[cauchy_completion]]. The trapped completion in topology.unif_born.trapped_cauchy reuses several of these lemmas."},"AffineConstructive.topology.topology.maps":{"page":"../topology/maps.html","short":"Continuous, reflecting, initial and dense maps of topological spaces; the topological reflection pair","summary":"The file characterises the classes of maps between topological spaces in several equivalent ways. A map is continuous when preimages of open sets are open, or of closed sets closed, or by an inclusion between interiors or closures under preimage or image. A map is continuously reflecting when every open (or closed) set is the preimage of an open (or closed) set, or when the interior of A is computed through the universal image. A map is initial when interiors and closures are pulled back from the codomain ([[continuously_initial_interior]], [[continuously_initial_closure]]). The two cancellation laws [[cont_factor]] and [[cont_refl_factor]] make topological spaces a reflection pair under the label [[𝐀𝐓𝐨𝐩]], which gives the inverse lemmas for bijections. Last come dense maps: closure of density under composition and its factor laws, and the result that continuous maps into a Hausdorff space are determined on a dense subset ([[cont_equal_on_dense]], [[cont_dense_epi]])."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Interface for constructs and reflection pairs: fibres, forward and reflecting classes, cancellation laws","summary":"The file sets up the abstract interface for reflection pairs. A construct is a concrete category over affine sets: each set carries a fibre of candidate structures, some of which are objects, and the forward maps are the functions that respect the structures. The fibre over a set is ordered by comparing structures through the identity, and with equality as two-sided comparison it becomes a poset. Alongside the forward class come a reflecting class, the initial maps (forward and reflecting) and the embeddings (initial and injective). A reflection pair asks for the two classes to form constructs and to satisfy the two cancellation laws. Saturated pairs and cloven pairs refine this, pair morphisms compare two pairs over the same sets, the opposite of a pair swaps the forward and reflecting classes, and binary products are defined in a pair. The theory built on this interface is developed in the files under topology/reflection_pair."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.topology.reflection_pair.completion":{"page":"../reflection_pair/completion.html","short":"Completions and complete objects for a reflection pair over topological spaces","summary":"The theory of completion for a reflection pair C that a pair morphism carries to topological spaces (𝐀𝐓𝐨𝐩), so that density and the Hausdorff property of C-objects are read in the underlying topology. A completion of X ([[PairCompletion]]) is a dense initial map ι into a Hausdorff object through which every dense initial test out of X factors by a forward map. A complete object ([[CompleteObj]]) is one whose identity is a completion. The file shows that completions are complete, that every completion is isomorphic to a canonical one ([[CanonicalCompletion]]), and that the universal property extends from initial tests to dense reflecting tests ([[pair_completion_reflect]], [[complete_obj_inverse]]). It builds the extension operator [[canonical_completion_ext]], proves that the canonical completion is an idempotent monad whose functor inverts dense initial tests, shows that preserving initial maps is equivalent to a descent law for initiality along dense maps ([[map_ini_descent_iff]]), and proves that products of completions are completions and products of complete objects are complete."},"AffineConstructive.topology.reflection_pair.products":{"page":"../reflection_pair/products.html","short":"Products in a reflection pair, and products of forward, reflecting, initial maps and embeddings","summary":"The file works with binary products in the forward construct of a reflection pair, given by a [[PairProduct]] structure on the cartesian product X × Y. Such a structure is a genuine object ([[pair_product_obj]]). The product f × g of two maps is formed with [[prod_map]]. If f and g are forward, so is f × g, by the universal property of the product ([[pair_prod_map_hom]]). Nothing about products is asked of the reflecting class. Even so, in a saturated pair f × g reflects whenever f and g do ([[pair_prod_map_rfl]]): a map h into the domain of f × g is forward as soon as its composite with f × g is, because each component of h then cancels against f or g. Initial maps and embeddings are each split into their parts, so their products follow ([[pair_prod_map_ini]], [[pair_prod_map_emb]]). Hints register all four results for instance resolution."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."}},"constants":null}</script>

re Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.uniform.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices theory.subgroups orders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.topology uniform.base uniform.product.\nRequire Import easy rewrite simplify tactics.misc.\n\nImport image_notation.\nImport tensor_map_notation.\nImport thicken_notation.\n\nLocal Open Scope subset_scope.\nLocal Open Scope topology_scope.\nLocal Open Scope grp_scope.\nLocal Open Scope sg_op_scope.\n\nLocal Notation \"f ♯\" := (⟨f,f⟩*) (at level 1, left associativity, format \"f ♯\").\nLocal Abbreviation π₁ := (tensor_proj1 _ _).\nLocal Abbreviation π₂ := (tensor_proj2 _ _).\nLocal Abbreviation int := interior.\nLocal Abbreviation cl := closure.\n\nLemma ufm_proj2_image_entourage `{@UniformSpace X Φ} (U:Φ) : π₂⁎ U = ⊤.\nProof. intros x. change ( (∐ p, π₂ p = x ⊠ p ∊ U) ⧟ 𝐓 ). simplify.\n  exists (x, x). simplify. apply near_refl.\nQed.\n\nLemma proj1_preimage_thicken@{u} `{@UniformSpace@{u} X Φ} {Y:set@{u}} (K:𝒫 X) (U:Φ) :\n   π₁* U.[K] = powerset_pt U⁻¹ ⋄ π₁* K :> 𝒫 (X ⊗ Y).\nProof. intros [x y].\n  change ((∐ z, z ∊ K ⊠ (z, x) ∊ U)  ⧟ ∐ z, (z, x) ∊ U ⊠ z ∊ K).\n  apply aex_proper_aiff. intros z. now rew (aprod_com _ _).\nQed.\n\nLemma ufm_compose_proj1_preimage@{u} {X:set@{u}} `{@UniformSpace@{u} Y Ψ} (A:𝒫 X) (V:Ψ) :\n   (π₁* A) ⋄ V = π₁* A.\nProof. rew (compose_proj1_preimage _ _), (ufm_proj2_image_entourage _).\n  now rew (proj1_preimage_tensor_top _).\nQed.\n\n#[local] Hint Extern 0 (Neighborhood _) => exact UniformNeighborhood : typeclass_instances.\n\nLemma cylinder_thicken `{@UniformSpace X Φ} (K : 𝒫 X) (U V W : Φ)\n  (EW : W⁻¹ = W) (HW : W ∙ W ∙ W ≤ U ⊓ V)\n  : powerset_pt W ∙ (π₁* K ⊓ powerset_pt W) ∙ powerset_pt W ⊆ π₁* U.[K] ⊓ powerset_pt V.\nProof. apply meet_glb; split.\n+ rew (meet_lb_l (π₁* K) W).\n  rew <-(proj1_preimage_thicken (Y:=X) K W⁻¹).\n  rew (ufm_compose_proj1_preimage (W⁻¹).[K] W).\n  rew [ EW | <-(meet_lb_l U V) ].\n  rew <-HW. now do 2 rew <-(ufm_compose_ub_l _ _).\n+ now rew [(meet_lb_r (π₁* K) W)| <-(meet_lb_r U V)].\nQed.\n\nLemma cylinder_sub_interior@{u} `{@UniformSpace@{u} X Φ} `{!TensorProductUniformity Φ Φ Φ₂}\n  (K:𝒫 X) (U V:Φ) : ∐ (W:Φ), π₁* K ⊓ powerset_pt W ⊆ int (π₁* U.[K] ⊓ powerset_pt V).\nProof.\n  pose proof uniform_split_sym3 (U ⊓ V) as [W[EW HW]]. exists W.\n  rew <-(sub_interior_thicken _ _ W W).\n  exact (cylinder_thicken K U V W EW HW).\nQed. \n\n","sentences":[{"i":0,"s":0,"e":636,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":637,"e":691,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":692,"e":751,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":752,"e":778,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":779,"e":830,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":5,"s":831,"e":865,"kind":"vernac","status":"ok","ms":21,"messages":[],"goals":null},{"i":6,"s":866,"e":962,"kind":"vernac","status":"ok","ms":20,"messages":[],"goals":null},{"i":7,"s":963,"e":999,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":1000,"e":1102,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":9,"s":1103,"e":1165,"kind":"vernac","status":"ok","ms":17,"messages":[],"goals":null},{"i":10,"s":1166,"e":1216,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":11,"s":1218,"e":1240,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":12,"s":1241,"e":1268,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals": ,"local":false,"page":"../../tactics/simplify/base.html"},{"s":1817,"e":1825,"lib":"AffineConstructive.tactics.simplify.base","name":"ltac:simplify","kind":"ltac","local":false,"page":"../../tactics/simplify/base.html"},{"s":2112,"e":2115,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2116,"e":2119,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2265,"e":2268,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2332,"e":2335,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2336,"e":2339,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2700,"e":2703,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2729,"e":2732,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2776,"e":2779,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2824,"e":2827,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2858,"e":2861,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2868,"e":2871,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2877,"e":2880,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2909,"e":2912,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2913,"e":2916,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3220,"e":3223,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file studies cylinders in X ⊗ X: subsets π₁* K ⊓ W, the pairs whose first point lies in K and which are W-close. It shows that the image of an entourage under the second projection is the whole space ([[AffineConstructive.topology.uniform.cylinder.ufm_proj2_image_entourage]]), that the cylinder over a thickening U.[K] is the inverse entourage composed with the cylinder over K ([[AffineConstructive.topology.uniform.cylinder.proj1_preimage_thicken]]), and that composing a cylinder with an entourage leaves it unchanged ([[AffineConstructive.topology.uniform.cylinder.ufm_compose_proj1_preimage]]). From these, a symmetric W with W ∙ W ∙ W ≤ U ⊓ V carries π₁* K ⊓ W, thickened by W on both sides, into π₁* U.[K] ⊓ V ([[AffineConstructive.topology.uniform.cylinder.cylinder_thicken]]). So every such cylinder target contains a smaller cylinder in its interior for the product uniformity ([[AffineConstructive.topology.uniform.cylinder.cylinder_sub_interior]]). This is the core that the dense-descent theorems for well-containment uniform spaces and the reflecting universal property of the localization reduce to; the subset-level projection algebra it builds on is in orders/subset_images.v.","short":"Cylinders π₁* K ⊓ W in X ⊗ X, their thickenings, and interiors","items":[{"name":"AffineConstructive.topology.uniform.cylinder.π₁","base":"π₁","kind":"abbrev","start":19,"body":null,"status":"ok","short":{"text":"Local name for the first projection X ⊗ Y ⇾ X out of the tensor product","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.theory.set.tensor_proj1]], the first projection out of the tensor product X ⊗ Y, with both factors left to be inferred. Its preimages π₁* K are the cylinders the file studies: the pairs whose first coordinate lies in K.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.cylinder.π₂","base":"π₂","kind":"abbrev","start":20,"body":null,"status":"ok","short":{"text":"Local abbreviation for the second projection X ⊗ Y ⇾ Y out of the tensor product","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.theory.set.tensor_proj2]], the second projection out of the tensor product X ⊗ Y. The file uses it in [[AffineConstructive.topology.uniform.cylinder.ufm_proj2_image_entourage]], which says that the image π₂⁎ U of an entourage U under the second projection is the whole space.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.cylinder.int","base":"int","kind":"abbrev","start":21,"body":null,"status":"ok","short":{"text":"Local name for the interior operator of a neighbourhood relation","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.topology.interior]]: int U is the subset of points of which U is a neighbourhood. In this file the neighbourhood relation is the uniform topology [[AffineConstructive.topology.interfaces.uniform.UniformNeighborhood]], here on the tensor square X ⊗ X with its product uniformity.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.cylinder.cl","base":"cl","kind":"abbrev","start":22,"body":null,"status":"ok","short":{"text":"Local abbreviation for the closure of a subset","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.interfaces.topology.closure]], the closure of a subset with respect to a neighbourhood relation.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.cylinder.ufm_proj2_image_entourage","base":"ufm_proj2_image_entourage","kind":"prf","start":23,"body":[24,31],"status":"ok","short":{"text":"The image of an entourage under the second projection is the whole space","status":"ok"},"proof":[{"text":"Two subsets are equal when they have the same members, so fix a point x. Membership of x in the image asks for a pair p in U whose second point equals x, and being equivalent to truth, that is the same as such a pair existing.","status":"ok","from":0,"to":3},{"text":"Take the diagonal pair (x, x) as the witness. Its second point is x, and what is left to show is that x is U-close to itself, which is [[AffineConstructive.topology.uniform.base.near_refl]].","status":"ok","from":4,"to":7}]},{"name":"AffineConstructive.topology.uniform.cylinder.proj1_preimage_thicken","base":"proj1_preimage_thicken","kind":"prf","start":32,"body":[33,39],"status":"ok","short":{"text":"The cylinder over the U-thickening of K is U⁻¹ composed with the cylinder over K","status":"ok"},"proof":[{"text":"Compare the two subsets at a pair (x, y). The pair lies in the cylinder over U.[K] when some z ∊ K is U-close to x; it lies in the composite when some z is U-close to x and lies in K. The point y plays no part on either side.","status":"ok","from":0,"to":2},{"text":"The two existentials have equivalent bodies, so it is enough to fix z and compare z ∊ K ⊠ (z, x) ∊ U with (z, x) ∊ U ⊠ z ∊ K. These differ only in the order of the factors, and the tensor is commutative.","status":"ok","from":3,"to":6}]},{"name":"AffineConstructive.topology.uniform.cylinder.ufm_compose_proj1_preimage","base":"ufm_compose_proj1_preimage","kind":"prf","start":40,"body":[41,44],"status":"ok","short":{"text":"Composing a cylinder π₁* A with an entourage gives back the cylinder","status":"ok"},"proof":[{"text":"By [[AffineConstructive.orders.subset_images.compose_proj1_preimage]], composing the cylinder π₁* A with V gives A ⊗ π₂⁎ V. The image π₂⁎ V is the whole space by [[AffineConstructive.topology.uniform.cylinder.ufm_proj2_image_entourage]], so the composite is A ⊗ ⊤.","status":"ok","from":0,"to":1},{"text":"A ⊗ ⊤ is the cylinder π₁* A by [[AffineConstructive.orders.subset_images.proj1_preimage_tensor_top]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.cylinder.cylinder_thicken","base":"cylinder_thicken","kind":"prf","start":46,"body":[47,58],"status":"ok","short":{"text":"For symmetric W with W ∙ W ∙ W ≤ U ⊓ V, thickening π₁* K ⊓ W by W lands in π₁* U.[K] ⊓ V","status":"ok"},"proof":[{"text":"The target is a meet, so show that the thickened cylinder lies in each of π₁* U.[K] and V.","status":"ok","from":0,"to":1},{"text":"For the first inclusion, drop the factor W from the middle meet. Composition is monotone, so it is enough to bound W ∙ π₁* K ∙ W.","status":"ok","from":2,"to":3},{"text":"By [[AffineConstructive.topology.uniform.cylinder.proj1_preimage_thicken]], W composed with π₁* K is the cylinder over the thickening (W⁻¹).[K]. Composing that cylinder with the entourage W on the right leaves it unchanged by [[AffineConstructive.topology.uniform.cylinder.ufm_compose_proj1_preimage]]. It remains to compare the cylinders over (W⁻¹).[K] and U.[K].","status":"ok","from":4,"to":5},{"text":"Since W is symmetric, W⁻¹ is W, and U contains U ⊓ V, which contains W ∙ W ∙ W. Thickening and preimage are monotone, so it suffices that W ≤ W ∙ W ∙ W. This follows by applying [[AffineConstructive.topology.uniform.base.ufm_compose_ub_l]] twice.","status":"ok","from":6,"to":8},{"text":"For the second inclusion, drop the cylinder from the middle meet and keep W. Then W ∙ W ∙ W lies in U ⊓ V, and U ⊓ V lies in V.","status":"ok","from":9,"to":11}]},{"name":"AffineConstructive.topology.uniform.cylinder.cylinder_sub_interior","base":"cylinder_sub_interior","kind":"prf","start":59,"body":[60,65],"status":"ok","short":{"text":"For entourages U, V there is W with π₁* K ⊓ W inside the interior of π₁* U.[K] ⊓ V","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.base.uniform_split_sym3]], there is a symmetric entourage W with W ∙ W ∙ W ≤ U ⊓ V. Take W as the witness.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.topology.uniform.product.sub_interior_thicken]], a subset S lies in the interior of A once W ∙ S ∙ W ⊆ A. So it is enough that the W-thickening of π₁* K ⊓ W lies in π₁* U.[K] ⊓ V, and this is [[AffineConstructive.topology.uniform.cylinder.cylinder_thicken]].","status":"ok","from":3,"to":5}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"The standard algebraic laws (associativity, identities, inverses, distributivity) as affine and SProp classes","summary":"This file defines the standard algebraic laws for operations on sets: associativity, commutativity, idempotence of a binary operation, involution and idempotence of a map, absorption, left and right distributivity, identities, absorbing elements, inverses, and distribution and anti-distribution of a map over an operation. Each law is first defined as an affine proposition depending on its operations, in a form that respects equality. Where an operation must occur more than once, it is taken under !. Each affine law is then restated in SProp, in an unfolded form that can serve as a typeclass, and accessors such as [[associativity]], [[commutativity]] and [[left_identity]] give the equations from an instance. Finally, the `_fun` canonical structures, built with [[weaken_apred1]], [[weaken_apred2]] and [[weaken_apred3]], make each SProp class respect equality of its operations, so rewriting can replace an operation by an equal one. The algebraic hierarchies built later in the development state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, uniformly continuous and reflecting maps, Cauchy filters, completions","summary":"The file sets up the basic notions of uniform spaces. A uniformity on X is a set of entourages, which are subsets of X ⊗ X. Points x and y are U-close when (x, y) ∊ U. A uniform space is a uniformity that is a filter and satisfies three axioms: reflexivity, symmetry, and splitting (each entourage contains some V ⋄ V). Stronger variants are a splitting with the additive conjunction, separation, and regularity. The uniformity induces a neighbourhood relation. The file then defines the following maps: uniformly continuous and uniformly reflecting maps, uniformly initial maps (both at once), and uniform embeddings. It also defines presentations of the tensor and cartesian product uniformities and of the discrete and indiscrete uniformities, the thickening U.[A] with the relation K ◁ S, and Cauchy filters. Finally it states the universal property of a completion: a separated space Y with a uniformly initial dense map ι from X, such that any uniformly initial dense f : X → Z has a uniformly continuous extension Z → Y with composite ι. The Cauchy completion and the bornological files build on these interfaces."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.subgroups":{"page":"../../theory/subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"base.html","short":"Uniform spaces: entourage algebra, thickenings, uniform topology, uniform maps, the reflection pair","summary":"The basic theory of uniform spaces. It equips a uniformity with its algebraic structure (a sublattice and sub-star-semigroup of relations), derives the splitting and symmetry consequences of the axioms and the composition laws for closeness, and develops thickenings U[A] of subsets: monotonicity, composition, singletons, and the swap law for a thickening apart from a set. The uniform topology is built from the entourages, with interior, closure and density described by entourages; separated uniform spaces are shown Hausdorff, and regular ones strong. For maps it characterises uniform continuity and reflection by preimages under f × f, introduces the pullback of entourages [[ufm_preimage]], proves closure under identity, composition and the cancellation laws, and assembles uniform spaces into the reflection pair [[𝐔𝐧𝐢𝐟]] with a morphism to topological spaces. It ends with thickening and closure estimates along dense and uniformly reflecting maps, used by the completion and trapped-completion files."},"AffineConstructive.topology.uniform.product":{"page":"product.html","short":"Cartesian and tensor product uniformities, their structure maps, and dense-extension criteria","summary":"The file builds the cartesian and tensor product uniformities from their presentations by basic entourages, and shows that each makes the product a uniform space. Basic entourages of X × Y combine U-closeness of first coordinates and V-closeness of second coordinates additively. Those of X ⊗ Y combine them by the tensor. For the cartesian product it proves that the projections are uniformly continuous and that a map into the product is uniformly continuous when both of its components are. It also shows that the induced topology is the cartesian product topology and that a product of separated spaces is separated. For the tensor product it shows that the induced topology is the tensor product topology, and that the unitors, the symmetry and the associators are uniform embeddings. On both products, maps of factors that are uniformly continuous, reflecting, initial or embeddings give product maps of the same kind. The last section, on relations in the tensor square, describes the interior and closure of an entourage by thickening and derives the dense-extension criteria [[ufm_dense_reflecting]] and [[ufm_dense_continuous]]."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

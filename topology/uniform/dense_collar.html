nstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.topology interfaces.uniform.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices orders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.topology topology.uniform.base uniform.basis uniform.subspace.\nRequire Import interfaces.unif_born unif_born.base bornology.base bornology.basis.\nRequire Import easy rewrite replc simplify strip_coercions tactics.misc.\n\nLocal Open Scope subset_scope.\nLocal Open Scope topology_scope.\nLocal Open Scope sg_op_scope.\nLocal Open Scope grp_scope.\nImport projection_notation.\nImport image_notation.\nImport tensor_map_notation.\nImport thicken_notation.\n\nLocal Abbreviation ι := from_subset.\nLocal Notation \"f ♯\" := (⟨f,f⟩*) (at level 1, left associativity, format \"f ♯\").\nLocal Notation \"f ♭\" := ((func_op ⟨f,f⟩)⁎) (at level 1, left associativity, format \"f ♭\").\n\nImport set_internalize.notation.\n\nSection dense_collar.\n  Universes u.\n  Context `{Φ:Uniformity@{u} X} {𝒜:Bornology X} `{!WCUnifSpace X}.\n  Context `{Ψ:Uniformity@{u} Y} {ℬ:Bornology Y} `{!WCUnifSpace Y}.\n  Context {f:X ⇾ Y} `{!Dense f} `{!BornologyReflecting f}.\n  Context (P : ∀ K:ℬ, UniformlyReflecting (f ∘ ι (f* K))).\n\n  (** The bornology-indexed density-collar entourage on [Y].  Over each bounded\n      [K], a genuine *symmetric* collar [S₀ ⊆ S] thickened so that [S₀[K]] stays\n      bounded (wcunif_thicken), wrapping the image [f♭ R] of an X-entourage [R].\n      The box [K ⊗ K] confines the endpoints — and hence, in a composition, the\n      shared middle — to a bounded set, where local reflectivity bites. *)\n\n  Definition collar_entourage (R:𝒫 (X ⊗ X)) (S:𝒫 (Y ⊗ Y)) : 𝒫 (Y ⊗ Y)\n    := { '(y, y') : (Y ⊗ Y)%set |\n           ∐ (K:ℬ) (S₀:Ψ), of_course (\n               (powerset_pt S₀)⁻¹ = (powerset_pt S₀)\n             ⊠ (powerset_pt S₀ ⊆ S)\n             ⊠ (S₀.[powerset_pt K] ∊ ℬ) )\n             ⊠ ((y, y') ∊ (powerset_pt K ⊗ powerset_pt K)\n                          ⊓ (powerset_pt S₀ ∙ f♭ R ∙ powerset_pt S₀)) }.\n\n  Lemma collar_reflexive (R:𝒫 (X ⊗ X)) (S:Ψ) : id_rel X ⊆ R → id_rel Y ⊆ collar_entourage R S.\n  Proof. intros HR.\n    change (id_rel Y ⊆ collar_entourage R S) with (∏ p, π₁ p = π₂ p ⊸ p ∊ collar_entourage R S).\n    intros [y y'].\n    change (y = y' ⊸ ∐ (K:ℬ) (S₀:Ψ), of_course ((S₀⁻¹ = S₀) ⊠ (powerset_pt S₀ ⊆ S) ⊠ (S₀.[powerset_pt K] ∊ ℬ)) ⊠ ((y, y') ∊ (powerset_pt K ⊗ powerset_pt K) ⊓ (powerset_pt S₀ ∙ f♭ R ∙ powerset_pt S₀))).\n    pose (K := born_pt y ⊔ born_pt y').\n    pose proof (wcunif_thicken Y K) as [W HW].\n    pose proof (uniform_sym_alt (S ⊓ W)) as [S₀ [ES₀ PS₀]].\n    pose proof (uniform_dense_range f y S₀) as [x Hx].\n    rew <-(aex_ub _ K), <-(aex_ub _ S₀).\n    assert (S₀ ≤ S) as HA. { rew <-(meet_lb_l S W). exact PS₀. }\n    assert (S₀ ≤ W) as HSW. { rew <-(meet_lb_r S W). exact PS₀. }\n    assert (S₀.[powerset_pt K] ⊆ W.[powerset_pt K]) as Hle. { rew <-HSW. easy. }\n    assert (S₀.[powerset_pt K] ∊ ℬ) as HB. { now apply (down_closed ℬ _ W.[powerset_pt K]). }\n    assert ( of_course (S₀⁻¹ = S₀ ⊠ S₀ ⊆ S ⊠ S₀.[powerset_pt K] ∊ ℬ) ) as Q by (now split);\n      rew (aprod_true_l Q); clear Q.\n    change (y = y' ⊸ (y, y') ∊ powerset_pt K ⊗ powerset_pt K ∧ (y, y') ∊ powerset_pt S₀ ∙ f♭ R ∙ powerset_pt S₀); apply aand_intro.\n    + match goal with |- apos (_ ⊸ ?P) => enough P by now simplify end.\n      split; [ now left | now right ].\n    + do 2 (change ( (?a, ?c) ∊ ?A ∙ ?B ) with (∐ b, (a, b) ∊ A ⊠ (b, c) ∊ B); rew <-(aex_ub _ (f x))).\n      rew <-( equal_element S₀ (f x, y) (f x, y') ); unfold_pair_eq.\n      enough ( (y, f x) ∊ S₀ ⊠ (f x, y) ∊ S₀ ⊠ (f x, f x) ∊ f♭ R ⊠ f x = f x ) as G by (revert G; tautological).\n      split; [ exact _ | split; [| split; [| easy]] ].\n      * now rew <-(ES₀ : powerset_pt _ = powerset_pt _).\n      * change ( ⟨f,f⟩ (x,x) ∊ f♭ R ). rew <-(image_el _ _ _). apply HR. now change (x = x).\n  Qed.\n\n  Lemma sandwich_flip (T:𝒫 (Y ⊗ Y)) (R:𝒫 (X ⊗ X)) : T⁻¹ = T → (T ∙ f♭ R ∙ T)⁻¹ = T ∙ f♭ (R⁻¹) ∙ T.\n  Proof. intros HT. rew (inv_distr _ _), (inv_distr _ _).\n    rew HT, (flip_image_tensor_map_alt f f R : (f♭ R)⁻¹ = f♭ (R⁻¹)).\n    now apply associativity.\n  Qed.\n  Lemma collar_sym (R:𝒫 (X ⊗ X)) (S:Ψ) : collar_entourage (R⁻¹) S ⊆ (collar_entourage R S)⁻¹.\n  Proof.\n    change (collar_entourage (R⁻¹) S ⊆ (collar_entourage R S)⁻¹) with (∏ p, p ∊ collar_entourage (R⁻¹) S ⊸ p ∊ (collar_entourage R S)⁻¹).\n    intros [y y'].\n    change ((y, y') ∊ (collar_entourage R S)⁻¹) with ((y', y) ∊ collar_entourage R S).\n    change ((y, y') ∊ collar_entourage (R⁻¹) S) with (∐ (K:ℬ) (S₀:Ψ), of_course ((S₀⁻¹ = S₀) ⊠ (powerset_pt S₀ ⊆ S) ⊠ (S₀.[powerset_pt K] ∊ ℬ)) ⊠ ((y, y') ∊ (powerset_pt K ⊗ powerset_pt K) ⊓ (powerset_pt S₀ ∙ f♭ (R⁻¹) ∙ powerset_pt S₀))).\n    change ((y', y) ∊ collar_entourage R S) with (∐ (K:ℬ) (S₀:Ψ), of_course ((S₀⁻¹ = S₀) ⊠ (powerset_pt S₀ ⊆ S) ⊠ (S₀.[powerset_pt K] ∊ ℬ)) ⊠ ((y', y) ∊ (powerset_pt K ⊗ powerset_pt K) ⊓ (powerset_pt S₀ ∙ f♭ R ∙ powerset_pt S₀))).\n    rew <-aex_adj; intros K. rew <-aex_adj; intros S₀.\n    rew <-(aex_ub _ K), <-(aex_ub _ S₀).\n    apply of_course_aprod_aimpl_l.\n    intros H.\n    pose proof (andl H) as Hsym.\n    assert (of_course (S₀⁻¹ = S₀ ⊠ powerset_pt S₀ ⊆ S ⊠ S₀.[powerset_pt K] ∊ ℬ)) as Qoc by exact H;\n      rew (aprod_true_l Qoc); clear Qoc.\n    change ((y, y') ∊ powerset_pt K ⊗ powerset_pt K ⊓ powerset_pt S₀ ∙ f♭ (R⁻¹) ∙ powerset_pt S₀) with ((y, y') ∊ powerset_pt K ⊗ powerset_pt K ∧ (y, y') ∊ powerset_pt S₀ ∙ f♭ (R⁻¹) ∙ powerset_pt S₀).\n    change ((y', y) ∊ powerset_pt K ⊗ powerset_pt K ⊓ powerset_pt S₀ ∙ f♭ R ∙ powerset_pt S₀) with ((y', y) ∊ powerset_pt K ⊗ powerset_pt K ∧ (y', y) ∊ powerset_pt S₀ ∙ f♭ R ∙ powerset_pt S₀).\n    apply aand_proper_aimpl.\n    + change ((y', y) ∊ powerset_pt K ⊗ powerset_pt K) with ((y, y') ∊ (powerset_pt K ⊗ powerset_pt K)⁻¹).\n      rew (tensor_subset_flip (powerset_pt K) (powerset_pt K) : (powerset_pt K ⊗ powerset_pt K)⁻¹ = powerset_pt K ⊗ powerset_pt K). easy.\n    + change ((y', y) ∊ powerset_pt S₀ ∙ f♭ R ∙ powerset_pt S₀) with ((y, y') ∊ (powerset_pt S₀ ∙ f♭ R ∙ powerset_pt S₀)⁻¹).\n      rew (sandwich_flip (powerset_pt S₀) R (Hsym : (powerset_pt S₀)⁻¹ = powerset_pt S₀)). easy.\n  Qed.\n\n\nEnd dense_collar.\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":27,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":5,"s":242,"e":296,"kind":"vernac","status":"ok","ms":38,"messages":[],"goals":null},{"i":6,"s":297,"e":393,"kind":"vernac","status":"ok","ms":29,"messages":[],"goals":null},{"i":7,"s":394,"e":430,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":431,"e":516,"kind":"vernac","status":"ok","ms":17,"messages":[],"goals":null},{"i":9,"s":517,"e":603,"kind":"vernac","status":"ok","ms":19,"messages":[],"goals":null},{"i":10,"s":604,"e":686,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":11,"s":687,"e":759,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":12,"s":761,"e":791,"kind":"vernac", /simplify/base.html"},{"s":3661,"e":3664,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3672,"e":3675,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3764,"e":3767,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3795,"e":3798,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3842,"e":3856,"lib":"AffineConstructive.theory.set","name":"unfold_pair_eq","kind":"ltac","local":false,"page":"../../theory/set.html"},{"s":3956,"e":3968,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":4016,"e":4020,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":4034,"e":4037,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4038,"e":4041,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4122,"e":4125,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4156,"e":4159,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":4305,"e":4308,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4347,"e":4350,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4416,"e":4419,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5270,"e":5273,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5295,"e":5298,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5325,"e":5328,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5550,"e":5553,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6121,"e":6124,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6247,"e":6251,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":6384,"e":6387,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6469,"e":6473,"lib":"AffineConstructive.tactics.easy","name":"easy","kind":"ltac","local":false,"page":"../../tactics/easy.html"}],"gloss":{"summary":"The file defines, for a map f : X ⇾ Y into a well-containment uniform space, the collar entourage of a relation R on X by a relation S on Y: the pairs of Y lying in a common bounded box K ⊗ K and in a composite S₀ ∙ f♭ R ∙ S₀, for a symmetric entourage S₀ ⊆ S whose thickening of K is bounded. It proves that the collar contains the diagonal when R does and f is dense ([[AffineConstructive.topology.uniform.dense_collar.collar_reflexive]]), and that the collar of the converse of R is contained in the converse of the collar ([[AffineConstructive.topology.uniform.dense_collar.collar_sym]]), by way of [[AffineConstructive.topology.uniform.dense_collar.sandwich_flip]], which computes the converse of a symmetric sandwich T ∙ f♭ R ∙ T. These are the first entourage laws for an entourage on Y built from entourages on X across a dense map.","short":"Collar entourages on Y built from relations on X across a dense map","items":[{"name":"AffineConstructive.topology.uniform.dense_collar.ι","base":"ι","kind":"abbrev","start":20,"body":null,"status":"ok","short":{"text":"Local abbreviation ι for the inclusion of a subset into its ambient set","status":"ok"},"long":{"text":"Inside this file, ι abbreviates [[AffineConstructive.interfaces.subset.from_subset]], the inclusion U ⇾ X of the members of a subset U into X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.dense_collar.collar_entourage","base":"collar_entourage","kind":"def","start":30,"body":null,"status":"ok","short":{"text":"The collar of R by S: pairs in a bounded box, each end S₀-close to the image of an R-pair","status":"ok"},"long":{"text":"Given a map f : X ⇾ Y into a well-containment uniform space, a relation R on X and a relation S on Y, the collar entourage is the relation on Y that holds of (y, y') when there are a bounded K of Y and an entourage S₀ of Y such that, affirmed, S₀ is symmetric, S₀ ⊆ S, and the thickening S₀[K] is bounded; and moreover (y, y') lies both in the box K ⊗ K and in the composite S₀ ∙ f♭ R ∙ S₀, where f♭ R is the image of R under f × f. In words: y and y' lie in a common bounded set, and each is S₀-close to one end of the image of an R-related pair of points of X.\n\nThe side conditions on S₀ and K are under of course, so a proof that holds a member of the collar may use them as often as it likes; only the membership of (y, y') is a resource. That membership is the additive meet of the box and the composite: the box is a condition the pair satisfies alongside the closeness, not a further factor consumed with it. A thickening with bounded S₀[K] is available for every bounded K by [[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]].\n\nThe file proves two entourage laws for the collar: it contains the diagonal of Y when R contains the diagonal of X and f is dense ([[AffineConstructive.topology.uniform.dense_collar.collar_reflexive]]), and the collar of the converse of R is contained in the converse of the collar of R ([[AffineConstructive.topology.uniform.dense_collar.collar_sym]]).","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.dense_collar.collar_reflexive","base":"collar_reflexive","kind":"prf","start":31,"body":[32,78],"status":"ok","short":{"text":"If R contains the diagonal of X, the collar of R by any entourage S contains the diagonal of Y","status":"ok"},"proof":[{"text":"Assume R contains the diagonal of X and take a pair (y, y') of Y. Unfolding the collar, the task is to show that y = y' implies there are a bounded K and an entourage S₀ such that, first, S₀ is symmetric, lies in S and thickens K to a bounded set, and second, (y, y') lies in both K ⊗ K and S₀ ∙ f♭ R ∙ S₀.","status":"ok","from":0,"to":4},{"text":"Let K be the join of the bounded sets generated by y and by y'. By [[AffineConstructive.topology.interfaces.unif_born.wcunif_thicken]], some entourage W thickens K to a bounded set. By [[AffineConstructive.topology.uniform.base.uniform_sym_alt]], some symmetric entourage S₀ lies in S ⊓ W. Since f is dense, [[AffineConstructive.topology.uniform.base.uniform_dense_range]] gives a point x of X with y and f x S₀-close.","status":"ok","from":5,"to":8},{"text":"Take K and S₀ as the witnesses.","status":"ok","from":9,"to":9},{"text":"Because S₀ lies below the meet S ⊓ W, it lies in S and in W. Thickening is monotone in the entourage, so S₀[K] ⊆ W[K]. W[K] is bounded, and the bounded sets are closed downward ([[AffineConstructive.interfaces.orders.down_closed]]), so S₀[K] is bounded as well.","status":"ok","from":10,"to":28},{"text":"So all three side conditions hold outright, and the of-course factor that collects them is true. A true factor drops out of the tensor ([[AffineConstructive.logic.aprop.aprod_true_l]]), so what remains is to show that y = y' implies the membership of (y, y').","status":"ok","from":29,"to":29},{"text":"Membership in a meet is an additive conjunction, so each conjunct is proved from the equality y = y' separately. For the box, the equality is not needed: y and y' both lie in K, because K is the join of their bounded sets.","status":"ok","from":30,"to":33},{"text":"For the sandwich, take f x as the middle point in both composites. It remains to show three things: y is S₀-close to f x, (f x, f x) lies in f♭ R, and (f x, y') lies in S₀. The last is reached from (f x, y) ∊ S₀ by transport along the pair equality (f x, y) = (f x, y') ([[AffineConstructive.interfaces.subset.equal_element]]). That pair equality splits into f x = f x and y = y', and this is where the hypothesis y = y' is used.","status":"ok","from":34,"to":36},{"text":"After rearranging, it suffices to prove the remaining factors outright. The closeness of y to f x is the choice of x, and f x = f x holds by reflexivity. Two factors are left: (f x, y) ∊ S₀ and (f x, f x) ∊ f♭ R.","status":"ok","from":37,"to":38},{"text":"(f x, y) lies in S₀ because S₀ is symmetric, S₀⁻¹ = S₀, and (y, f x) lies in S₀.","status":"ok","from":39,"to":40},{"text":"The pair (f x, f x) is the image of (x, x) under f in each coordinate, so it lies in f♭ R once (x, x) lies in R ([[AffineConstructive.orders.subset_images.image_el]]). That holds because R contains the diagonal and x = x.","status":"ok","from":41,"to":46}]},{"name":"AffineConstructive.topology.uniform.dense_collar.sandwich_flip","base":"sandwich_flip","kind":"prf","start":79,"body":[80,85],"status":"ok","short":{"text":"For symmetric T, the converse of T ∙ f♭ R ∙ T is T ∙ f♭ R⁻¹ ∙ T","status":"ok"},"proof":[{"text":"Assume T is symmetric. The converse of a composite is the composite of the converses in reverse order ([[AffineConstructive.theory.groups.inv_distr]]). Applying this twice turns the converse of the sandwich into T⁻¹ ∙ ((f♭ R)⁻¹ ∙ T⁻¹).","status":"ok","from":0,"to":2},{"text":"Replace T⁻¹ by T. The converse of the image of R under f in each coordinate is the image of R⁻¹ ([[AffineConstructive.orders.subset_images.flip_image_tensor_map_alt]]).","status":"ok","from":3,"to":3},{"text":"The two sides now differ only in bracketing, and they agree by associativity of composition.","status":"ok","from":4,"to":5}]},{"name":"AffineConstructive.topology.uniform.dense_collar.collar_sym","base":"collar_sym","kind":"prf","start":86,"body":[87,111],"status":"ok","short":{"text":"The collar of the converse of R is contained in the converse of the collar of R","status":"ok"},"proof":[{"text":"Take a pair (y, y') of Y. A pair lies in the converse of the collar of R exactly when the reversed pair (y', y) lies in the collar of R, so the goal is to send (y, y') in the collar of R⁻¹ to (y', y) in the collar of R.","status":"ok","from":0,"to":3},{"text":"Unfold both collars. Take the bounded K and the entourage S₀ that the hypothesis provides, and use the same K and S₀ as the witnesses on the right.","status":"ok","from":4,"to":8},{"text":"The side conditions on S₀ and K come under of course, so they may be assumed outright and used more than once. They are used twice here: their first factor, the symmetry S₀⁻¹ = S₀, is kept for later, and the whole of them discharges the matching factor on the right ([[AffineConstructive.logic.aprop.aprod_true_l]]). Only the memberships remain to compare.","status":"ok","from":9,"to":12},{"text":"Both memberships are in meets, which are additive conjunctions, so they are compared conjunct by conjunct: the box K ⊗ K, and the sandwich.","status":"ok","from":13,"to":15},{"text":"The box K ⊗ K is its own converse ([[AffineConstructive.orders.subset_relations.tensor_subset_flip]]), so reversing the pair keeps it in the box.","status":"ok","from":16,"to":19},{"text":"Membership of the reversed pair in S₀ ∙ f♭ R ∙ S₀ is membership of (y, y') in its converse. S₀ is symmetric, so by [[AffineConstructive.topology.uniform.dense_collar.sandwich_flip]] that converse is S₀ ∙ f♭ R⁻¹ ∙ S₀, and this is exactly the sandwich the hypothesis gives.","status":"ok","from":20,"to":24}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Topological spaces by neighbourhood relations: axioms, continuity classes, separation, products","summary":"This file sets up the interface for topological spaces, in terms of a neighbourhood relation x ⪽ U between points and subsets. A [[Topology]] requires that every neighbourhood contains its point, that neighbourhoods are closed upward and under finite meets, and that a neighbourhood of x is also a neighbourhood of every point near x. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the T₀ and Hausdorff separation axioms. It defines the classes of maps (continuous, continuously reflecting, initial, embedding, dense), the discrete and indiscrete structures, and the tensor and cartesian product topologies. The theory of these notions is developed in the files under topology/topology."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, axioms, uniform maps, Cauchy filters, completions","summary":"The file sets up the interface of uniform spaces. A uniformity is a set of relations on X ⊗ X, the entourages; the file reads an entourage as closeness ([[near]]), forms thickenings of subsets and the relation \\\"K ◁ S\\\" (S is a uniform neighbourhood of K), and states the axioms in layers: the pre-uniform axioms, uniform spaces as filters of entourages, and the strong, separated and regular variants with their combinations. It derives the neighbourhood relation of the uniform topology ([[UniformNeighborhood]]), names presentations and bases of uniformities, the tensor and cartesian product, discrete and indiscrete uniformities, and defines the classes of maps: uniformly continuous, uniformly reflecting, uniformly initial and uniform embeddings. It closes with Cauchy filters and the universal property of a completion: a separated space receiving X by a dense, uniformly initial map, with a uniformly continuous comparison map from every other such extension of X, which also defines complete uniform spaces. The theory of these notions is developed in the files under topology/uniform and topology/unif_born."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"base.html","short":"Uniform spaces: closeness, thickening, induced topology, separation and the uniform reflection pair","summary":"This file develops the basic theory of uniform spaces. The uniformity of a uniform space is a sublattice of relations that is closed under composition and inversion. The file proves the elementary laws of closeness: reflexivity, symmetric splitting into two through six factors, and composition of close pairs. It also proves the laws of thickening, including the swap of a thickening across a complement. Every uniform space carries an induced topology, in which a separated space is Hausdorff and a regular space is strong. Interior, closure and density are described through entourages. The forward, reflecting, initial and embedding classes of maps are closed under composition, pass to their topological counterparts, and make 𝐔𝐧𝐢𝐟 a reflection pair with a morphism to the topological reflection pair 𝐀𝐓𝐨𝐩. The file ends with lemmas on images and preimages of thickenings and on dense maps, which the subspace, completion and bornology files use."},"AffineConstructive.topology.uniform.basis":{"page":"basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.uniform.subspace":{"page":"subspace.html","short":"Pulled-back uniformities, uniformly initial maps, and uniform subspaces","summary":"The file pulls a uniformity back along a function f : X ⇾ Y: the entourages of X are the relations containing the preimage under f × f of an entourage of Y. This is presented by the preimages of the entourages, a basis of Y pulls back to a basis, and when Y is a uniform space so is X ([[pullback_uniform_space]]), with f uniformly initial, and a uniform embedding when f is injective. The universal property ([[pullback_uniformity_initial]]) makes the construction a cleavage of the reflection pair of uniform spaces ([[unif_cloven_pair]]), which gives the characterisations of uniformly initial maps by lifting ([[uniformly_initial_alt]], [[uniformly_initial_alt2]]). Subspaces are the case of the inclusion of a subset: the inclusion is a uniform embedding, a subspace of a separated space is separated, and a dense map restricted over an open subset stays dense ([[dense_open_restrict]])."},"AffineConstructive.topology.interfaces.unif_born":{"page":"../interfaces/unif_born.html","short":"Uniform spaces with a bornology: well-containment spaces, local morphisms, local completions","summary":"The file sets up uniform spaces that also carry a bornology. It starts from the bare pairing [[UnifBornSpace]], with no axiom relating the two structures, adds the thickening axiom [[UniformlyOpenBornology]] to obtain the well-containment uniform spaces [[WCUnifSpace]] and their regular variant [[RegularWCUnifSpace]], and defines the well-containment relation K ⋐ S. It then gives product certificates and the morphism classes, forward, reflecting, initial and embedding, both in the global form (uniform and bornological at once) and in the local form, where uniform continuity or reflection is asked only near bounded sets ([[LocalUniformContinuity]], [[LocalUniformReflection]]). It ends with the interface of a local completion, [[LocalCompletion]], and of a locally complete space, which the localization and the trapped completion later realise."},"AffineConstructive.topology.unif_born.base":{"page":"../unif_born/base.html","short":"Uniform spaces with bornologies: maps, their reflection pair, transport of well-containment","summary":"The file sets up the category of sets carrying both a uniformity and a bornology, with no axiom linking the two. It shows that the four classes of maps (uniformly continuous and bornological, reflecting, initial, embedding) respect equality of functions, contain identities, compose, and satisfy the cancellation laws. It packages them as the reflection pair [[𝐔𝐧𝐢𝐟𝐁𝐨𝐫𝐧]], with pair morphisms to uniform spaces, bornological spaces and topological spaces, and from it derives that inverses swap the forward and reflecting classes. Its main result, [[wcunif_transport]], pulls the well-containment axiom back along a uniformly continuous, bornological and bornology-reflecting map. The subspace and localization files use it."},"AffineConstructive.topology.bornology.base":{"page":"../bornology/base.html","short":"Bornological maps, their composition and cancellation, and the bornological reflection pair","summary":"This file covers the basic theory of maps between bornological spaces. A bornology is a sublattice and a bounded join-subsemilattice of the subsets. The bornological, bornology-reflecting, initial and embedding classes of maps respect equality of functions. Each class contains the identity and is closed under composition, and two cancellation laws hold: [[bornological_factor]] and [[born_refl_factor]]. Together these make the label 𝐁𝐨𝐫𝐧 a reflection pair ([[born_rfl_pair]]). The general theory of reflection pairs then shows that inverting a bijection exchanges the forward and reflecting classes. The file ends with the map [[born_pt]], which sends a point to its bounded singleton, and a pointwise form of bornological regularity, [[bornology_regularity_alt]]."},"AffineConstructive.topology.bornology.basis":{"page":"../bornology/basis.html","short":"Bornologies presented by bases, basis criteria for maps, the trivial bornology","summary":"This file builds bornologies from bases and gives criteria stated in terms of bases. [[presented_bornology]] turns any family of subsets into the bornology it generates downward. [[presented_bornological_space]] shows that this bornology satisfies the axioms of a bornological space when the family is order-preserving on an up-directed index set and covers every point. Conversely, a basis of a bornological space covers the points, has an inhabited index set and is up-directed. [[born_by_basis]] and [[bornology_refl_by_basis]] check that a map is bornological, or bornology-reflecting, by checking basis sets only. The file then treats the trivial bornology, in which every subset is bounded, and shows that maps out of the empty set, maps into the one-point set and constant maps are bornological; every bornology on the one-point set is trivial."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.strip_coercions":{"page":"../../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

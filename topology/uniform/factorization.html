onstructive.topology.unif_born.trapped_wc":"topology/unif_born/trapped_wc.html","AffineConstructive.topology.unif_born.open_immersion_complete":"topology/unif_born/open_immersion_complete.html","AffineConstructive.counterexamples.cartesian_product":"counterexamples/cartesian_product.html","AffineConstructive.topology.uniform.quotient":"topology/uniform/quotient.html","AffineConstructive.topology.uniform.subspace":"topology/uniform/subspace.html","AffineConstructive.topology.uniform.factorization":"topology/uniform/factorization.html","AffineConstructive.topology.unif_born.subspace":"topology/unif_born/subspace.html"},"source":"Require Import interfaces.set algebra_notation.\nRequire Import interfaces.sprop logic.aprop relations.\nRequire Import interfaces.common_props theory.common_props.\nRequire Import set_lambda.\nRequire Import interfaces.orders interfaces.subset.\nRequire Import interfaces.topology interfaces.uniform.\nRequire Import theory.set orders.orders orders.maps orders.subset orders.closure orders.filters.\nRequire Import orders.subset_images.\nRequire Import theory.lattices orders.lattices theory.sublattices orders.sublattices.\nRequire Import topology.topology topology.uniform.base uniform.subspace uniform.product.\nRequire Import easy rewrite replc simplify tactics.misc.\n\nImport image_notation.\nLocal Open Scope subset_scope.\nLocal Open Scope topology_scope.\n\n(** * (E, M) image factorization of a uniformly continuous map\n\n    Every uniformly continuous [f : X ⇾ Y] factors as [f = m ∘ e] through the\n    closure of its image:\n\n      X --[image_corestrict]--> closure (range f) --[from_subset]--> Y\n\n    with [e = image_corestrict f] a dense UC map (the E-part) and\n    [m = from_subset (closure (range f))] a closed uniform embedding (the M-part).\n    This is the factorization structure of doc/factorization.md §\"design question\". *)\n\nSection image_factorization.\n  Universes u.\n  Context `{@UniformSpace@{u} X Φ} `{@UniformSpace@{u} Y Ψ} (f:X ⇾ Y) `{!UniformlyContinuous f}.\n\n  Definition image_closure : 𝒫 Y := closure (range f).\n\n  Lemma image_closure_closed : closed image_closure.\n  Proof. exact (closure_closed (range f)). Qed.\n  Lemma image_corestrict_el (x:X) : f x ∊ image_closure.\n  Proof. unfold image_closure. rew <-(subset_closure (range f)). exact range_el. Qed.\n\n  Local Instance image_corestrict_is_fun\n    : @IsFun X image_closure (λ x, @to_subset _ image_closure (f x) (image_corestrict_el x)).\n  Proof. intros x₁ x₂. exact (is_fun f x₁ x₂). Qed.\n\n  Definition image_corestrict : X ⇾ image_closure\n    := func_make (λ x, @to_subset _ image_closure (f x) (image_corestrict_el x)).\n\n  Lemma image_factor : from_subset image_closure ∘ image_corestrict = f.\n  Proof. refl. Qed.\n\n  Local Instance image_corestrict_ufm : UniformlyContinuous image_corestrict.\n  Proof.\n    assert (UniformlyContinuous (from_subset image_closure ∘ image_corestrict)) by (rew image_factor; exact _). exact (pullback_uniformity_initial (f:=from_subset image_closure) image_corestrict). Qed.\n\n  Local Instance image_corestrict_dense : Dense image_corestrict.\n  Proof. split; try exact _.\n    change (apos (closure (range image_corestrict) = ⊤)).\n    apply (above_top _).\n    rew <-(reflection_preimage_closure (from_subset image_closure) (range image_corestrict)).\n    rew (range_image image_corestrict), <-(image_compose_alt image_corestrict (from_subset image_closure) ⊤).\n    rew image_factor, <-(range_image f).\n    change (⊤ ⊆ (from_subset image_closure)* image_closure).\n    change (∏ a:image_closure, a ∊ ⊤ ⊸ a ∊ (from_subset image_closure)* image_closure). intros a.\n    rew (aimpl_true_l (_ : a ∊ ⊤)). change (from_subset image_closure a ∊ image_closure). exact (subset_pt_is_el a).\n  Qed.\nEnd image_factorization.\n\n(** Continuous image of a closure lands in the closure of the image — the image\n    counterpart of [continuous_preimage_closure], via the image/preimage\n    adjunction.  (General enough to belong beside [continuous_preimage_closure]\n    in [interior.v]; kept here for now.) *)\nLemma continuous_image_closure@{u} {X Y:set@{u}} `{@Continuous@{u} X Y NX NY g} (U:𝒫 X)\n  : g⁎ (closure U) ⊆ closure (g⁎ U).\nProof.\n  rew (image_preimage_adj g (closure U) (closure (g⁎ U))).\n  rew <-(continuous_preimage_closure g (g⁎ U)).\n  exact (aimpl_impl_pos (order_preserving closure U (g* (g⁎ U))) (preimage_image_unit g U)).\nQed.\n\n(** The image of any subset under a subspace inclusion lands in the subset: the\n    range of [from_subset K] is contained in [K]. *)\nLemma from_subset_image_sub@{v} {D:set@{v}} (K:𝒫 D) (S:𝒫 (subset_to_set K)) : (from_subset K)⁎ S ⊆ K.\nProof.\n  change (∏ y:D, y ∊ (from_subset K)⁎ S ⊸ y ∊ K). intros y.\n  change (y ∊ (from_subset K)⁎ S) with (∐ a:subset_to_set K, from_subset K a = y ⊠ a ∊ S).\n  rew <-aex_adj; intros a.\n  rew <-(equal_element K (from_subset K a) y).\n  apply aprod_proper_aimpl; [ easy |].\n  now apply aimpl_true_r.\nQed.\n\n(** * Diagonalization\n\n    The (E, M)-diagonalization property, in its honest constructive form: the\n    M-part is represented as an actual subspace inclusion [from_subset K] (K\n    closed), so the diagonal is a corestriction-with-certificate and needs no\n    unique choice; uniqueness is separation-free, resting on injectivity of the\n    inclusion alone.  See doc/factorization.md §\"design question\". *)\n\nSection diagonalization.\n  Universes u.\n  Context `{@UniformSpace@{u} A ΦA} `{@UniformSpace@{u} B ΦB} `{@UniformSpace@{u} D ΦD}.\n  Context (e:A ⇾ B) `{!UniformlyContinuous e, !Dense e}.\n  Context (K:𝒫 D) (HK : closed K).\n  Context (g:B ⇾ D) `{!UniformlyContinuous g}.\n  Context (f':A ⇾ subset_to_set K) `{!UniformlyContinuous f'}.\n  Context (Hcomm : g ∘ e = from_subset K ∘ f').\n\n  Lemma diagonal_range_sub : range g ⊆ K.\n  Proof.\n    rew <-HK.\n    rew (range_image g), <-(dense_range : closure (range e) = ⊤).\n    assert (g⁎ (range e) ⊆ K) as Hsub.\n    { rew (range_image e), <-(image_compose_alt e g ⊤), Hcomm, (image_compose_alt f' (from_subset K) ⊤).\n      exact (from_subset_image_sub K (f'⁎ ⊤)). }\n    rew <-(aimpl_impl_pos (order_preserving closure (g⁎ (range e)) K) Hsub). exact (continuous_image_closure (g:=g) (range e)).\n  Qed.\n\n  Lemma diagonal_el (b:B) : g b ∊ K.\n  Proof. rew <-diagonal_range_sub. exact range_el. Qed.\n\n  Local Instance diagonal_is_fun\n    : @IsFun B (subset_to_set K) (λ b, @to_subset _ K (g b) (diagonal_el b)).\n  Proof. intros b₁ b₂. exact (is_fun g b₁ b₂). Qed.\n\n  Definition diagonal : B ⇾ K := func_make (λ b, @to_subset _ K (g b) (diagonal_el b)).\n\n  Lemma diagonal_factor_m : from_subset K ∘ diagonal = g.\n  Proof. refl. Qed.\n\n  Lemma diagonal_factor_e : diagonal ∘ e = f'.\n  Proof. change (∏ a:A, diagonal (e a) = f' a). intros a.\n    change (g (e a) = subset_pt (f' a)). exact (Hcomm a).\n  Qed.\n\n  Local Instance diagonal_ufm : UniformlyContinuous diagonal.\n  Proof.\n    assert (UniformlyContinuous (from_subset K ∘ diagonal)) by (rew diagonal_factor_m; exact _).\n    exact (pullback_uniformity_initial (f:=from_subset K) diagonal).\n  Qed.\n\n  (** Uniqueness is separation-free: it rests on injectivity of the inclusion\n      [from_subset K] alone (the M-side mono), not on any separation of the\n      codomain. *)\n  Lemma diagonal_unique (d':B ⇾ subset_to_set K) : from_subset K ∘ d' = g → diagonal = d'.\n  Proof. intros Hd'.\n    rew <-(injective_compose_cancel (from_subset K) diagonal d').\n    rew diagonal_factor_m, Hd'. refl.\n  Qed.\nEnd diagonalization.\n\n(** * Essential uniqueness of the factorization\n\n    Any two dense-corestriction factorizations of the same map through closed\n    subspaces are related by a unique uniform isomorphism of the M-objects.  As\n    with [diagonal_unique], the round-trip identities are forced by injectivity\n    of the inclusions alone — no separation of the ambient space. *)\nSection essential_uniqueness.\n  Universes u.\n  Context `{@UniformSpace@{u} X ΦX} `{@UniformSpace@{u} Y ΦY}.\n  Context (K₁ K₂:𝒫 Y) (HK₁ : closed K₁) (HK₂ : closed K₂).\n  Context (e₁:X ⇾ subset_to_set K₁) `{!UniformlyContinuous e₁, !Dense e₁}.\n  Context (e₂:X ⇾ subset_to_set K₂) `{!UniformlyContinuous e₂, !Dense e₂}.\n  Context (Hcomm : from_subset K₁ ∘ e₁ = from_subset K₂ ∘ e₂).\n\n  Lemma ess_comm_sym : from_subset K₂ ∘ e₂ = from_subset K₁ ∘ e₁.\n  Proof. now rew Hcomm. Qed.\n\n  Definition ess_iso : K₁ ⇾ K₂ := diagonal e₁ K₂ HK₂ (from_subset K₁) e₂ Hcomm.\n  #[local] Instance ess_iso_inverse : Inverse ess_iso\n    := diagonal e₂ K₁ HK₁ (from_subset K₂) e₁ ess_comm_sym.\n\n  Lemma ess_iso_factor_m : from_subset K₂ ∘ ess_iso = from_subset K₁.\n  Proof. exact (diagonal_factor_m e₁ K₂ HK₂ (from_subset K₁) e₂ Hcomm). Qed.\n  Local Open Scope fun_inv_scope.\n  Lemma ess_iso_inv_factor_m : from_subset K₁ ∘ ess_iso⁻¹ = from_subset K₂.\n  Proof. exact (diagonal_factor_m e₂ K₁ HK₁ (from_subset K₂) e₁ ess_comm_sym). Qed.\n\n  Local Instance ess_iso_ufm : UniformlyContinuous ess_iso.\n  Proof. exact (diagonal_ufm e₁ K₂ HK₂ (from_subset K₁) e₂ Hcomm). Qed.\n  Local Instance ess_iso_inv_ufm : UniformlyContinuous ess_iso⁻¹.\n  Proof. exact (diagonal_ufm e₂ K₁ HK₁ (from_subset K₂) e₁ ess_comm_sym). Qed.\n\n  Lemma ess_iso_bijective : Bijective ess_iso.\n  Proof. apply alt_Build_Bijective.\n    + rew <-(injective_compose_cancel (from_subset K₁) (ess_iso⁻¹ ∘ ess_iso) (id_fun K₁)).\n      change (from_subset K₁ ∘ ess_iso⁻¹ ∘ ess_iso = from_subset K₁ ∘ id_fun K₁).\n      rew ess_iso_inv_factor_m, ess_iso_factor_m. refl.\n    + rew <-(injective_compose_cancel (from_subset K₂) (ess_iso ∘ ess_iso⁻¹) (id_fun K₂)).\n      change (from_subset K₂ ∘ ess_iso ∘ ess_iso⁻¹ = from_subset K₂ ∘ id_fun K₂).\n      rew ess_iso_factor_m, ess_iso_inv_factor_m. refl.\n  Qed.\nEnd essential_uniqueness.\n\n(** * Firmness of the completion (Brümmer–Giuli)\n\n    Completions are firm: any two completions of the same space are related by a\n    unique uniform isomorphism compatible with the embeddings.  This is the\n    completion-side instance of essential uniqueness — the reflect maps go both\n    ways, and the round-trip identities are forced by [cont_dense_epi] (two maps\n    agreeing on a dense subspace of a separated target are equal). *)\nSection firmness.\n  Universes u.\n  Context `{@UniformSpace@{u} X Φ}\n          `{@UniformSpace@{u} Y₁ Ψ₁} (ι₁:X ⇾ Y₁) `{!@CompletionReflect@{u} X Y₁ Φ Ψ₁ ι₁, !Completion ι₁}\n          `{@UniformSpace@{u} Y₂ Ψ₂} (ι₂:X ⇾ Y₂) `{!@CompletionReflect@{u} X Y₂ Φ Ψ₂ ι₂, !Completion ι₂}.\n  Local Open Scope fun_inv_scope.\n\n  Definition firm_iso : Y₁ ⇾ Y₂ := completion_reflect_initial ι₂ ι₁.\n  #[local] Instance firm_iso_inverse : Inverse firm_iso := completion_reflect_initial ι₁ ι₂.\n\n  Lemma firm_iso_spec : firm_iso ∘ ι₁ = ι₂.\n  Proof. exact (completion_reflect_initial_spec ι₂ ι₁). Qed.\n  Lemma firm_iso_inv_spec : firm_iso⁻¹ ∘ ι₂ = ι₁.\n  Proof. exact (completion_reflect_initial_spec ι₁ ι₂). Qed.\n\n  Local Instance firm_iso_ufm : UniformlyContinuous firm_iso.\n  Proof. change (UniformlyContinuous (completion_reflect_initial ι₂ ι₁)). exact _. Qed.\n  Local Instance firm_iso_inv_ufm : UniformlyContinuous firm_iso⁻¹.\n  Proof. change (UniformlyContinuous (completion_reflect_initial ι₁ ι₂)). exact _. Qed.\n\n  Local Instance firm_iso_cont : Continuous firm_iso := firm_iso_ufm.\n  Local Instance firm_iso_inv_cont : Continuous firm_iso⁻¹ := firm_iso_inv_ufm.\n\n  Lemma firm_iso_bijective : Bijective firm_iso.\n  Proof. apply alt_Build_Bijective.\n    + destruct (aiff_iff_pos (cont_dense_epi (NX:=@UniformNeighborhood Y₁ Ψ₁) (NY:=@UniformNeighborhood Y₁ Ψ₁) (firm_iso⁻¹ ∘ firm_iso) (id_fun Y₁) ι₁)) as [Hfwd _].\n      apply Hfwd. change (firm_iso⁻¹ ∘ (firm_iso ∘ ι₁) = id_fun Y₁ ∘ ι₁).\n      rew firm_iso_spec, firm_iso_inv_spec. refl.\n    + destruct (aiff_iff_pos (cont_dense_epi (NX:=@UniformNeighborhood Y₂ Ψ₂) (NY:=@UniformNeighborhood Y₂ Ψ₂) (firm_iso ∘ firm_iso⁻¹) (id_fun Y₂) ι₂)) as [Hfwd _].\n      apply Hfwd. change (firm_iso ∘ (firm_iso⁻¹ ∘ ι₂) = id_fun Y₂ ∘ ι₂).\n      rew firm_iso_inv_spec, firm_iso_spec. refl.\n  Qed.\n\n  (** The compatible iso is unique — the completion is a firm reflection. *)\n  Lemma firm_iso_unique (φ:Y₁ ⇾ Y₂) `{!UniformlyContinuous φ} : φ ∘ ι₁ = ι₂ → φ = firm_iso.\n  Proof. intros Hφ.\n    pose proof (uniformly_continuous_continuous (f:=φ)) as Hφc.\n    destruct (aiff_iff_pos (cont_dense_epi (NX:=@UniformNeighborhood Y₁ Ψ₁) (NY:=@UniformNeighborhood Y₂ Ψ₂) φ firm_iso ι₁)) as [Hfwd _].\n    apply Hfwd. rew Hφ, firm_iso_spec. refl.\n  Qed.\nEnd firmness.\n\n(** * E-cancellation of M: closed embeddings cancel on the left along E\n\n    If [g ∘ f] is a closed uniform embedding and [f] is dense UC, then [g] is a\n    closed uniform embedding.  The closed-image half reuses [continuous_image_closure]\n    ([range g = range (g∘f)]); [UniformlyInitial g] is the kernel [ufm_dense_initial];\n    and injectivity follows from initiality into/over a separated space\n    ([uniform_initial_embedding]).  This is the M-cancellation shell of\n    doc/factorization.md. *)\nSection closed_embedding_cancel.\n  Universes u.\n  Context `{@UniformSpace@{u} A ΦA} `{@SeparatedUniformSpace@{u} B ΦB} `{@UniformSpace@{u} C ΦC}.\n  Context (f:A ⇾ B) (g:B ⇾ C) `{!UniformlyContinuous f, !Dense f, !UniformlyContinuous g}.\n  Context `{!UniformlyEmbedding (g ∘ f)} (Hclosed : closed (range (g ∘ f))).\n\n  Lemma cancel_image_eq : g⁎ (range f) = range (g ∘ f).\n  Proof. rew (range_image f), <-(image_compose_alt f g ⊤), <-(range_image (g ∘ f)). refl. Qed.\n\n  Lemma cancel_range_eq : range g = range (g ∘ f).\n  Proof.\n    rew <-(le_antisym_iff _ _). split.\n    + rew <-Hclosed, <-cancel_image_eq.\n      rew (range_image g), <-(dense_range : closure (range f) = ⊤).\n      exact (continuous_image_closure (g:=g) (range f)).\n    + rew <-cancel_image_eq, (range_image g).\n      exact (aimpl_impl_pos (order_preserving (g⁎) (range f) ⊤) (below_top _)).\n  Qed.\n\n  Lemma cancel_closed_range : closed (range g).\n  Proof. rew cancel_range_eq. exact Hclosed. Qed.\n\n  Local Instance cancel_initial : UniformlyInitial g.\n  Proof. exact (ufm_dense_initial f g). Qed.\n\n  Lemma cancel_embedding : UniformlyEmbedding g.\n  Proof. exact uniform_initial_embedding. Qed.\nEnd closed_embedding_cancel.\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":26,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":5,"s":242,"e":296,"kind":"vernac","status":"ok","ms":23,"messages":[],"goals":null},{"i":6,"s":297,"e":393,"kind":"vernac","status":"ok","ms":20,"messages":[],"goals":null},{"i":7,"s":394,"e":430,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":431,"e":516,"kind":"vernac","status":"ok","ms":17,"messages":[],"goals":null},{"i":9,"s":517,"e":605,"kind":"vernac","status":"ok","ms":18,"messages":[],"goals":null},{"i":10,"s":606,"e":662,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":11,"s":664,"e":686,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":12,"s":687,"e":717,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":13,"s":718,"e":750,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":14,"s":752,"e":1258,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":15,"s":1261,"e":1273,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":16,"s":1276,"e":1370,"kind":"vernac","status":"ok","ms":11,"messages":["5b668d3316f37158","a916052bd3211056","9b3a991cb2bdab3e","408a03e109d :4240,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":5110,"e":5113,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5124,"e":5127,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5231,"e":5234,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5383,"e":5386,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5561,"e":5564,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5929,"e":5933,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":6247,"e":6250,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6646,"e":6649,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6712,"e":6715,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":6740,"e":6744,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":7588,"e":7591,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":7592,"e":7595,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8513,"e":8516,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8686,"e":8689,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8730,"e":8734,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":8742,"e":8745,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8915,"e":8918,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8959,"e":8963,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":10919,"e":10922,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":10957,"e":10961,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":11208,"e":11211,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":11246,"e":11250,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":11667,"e":11670,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":11690,"e":11694,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":12598,"e":12601,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12673,"e":12677,"lib":"AffineConstructive.tactics.easy","name":"refl","kind":"ltac","local":false,"page":"../../tactics/easy.html"},{"s":12749,"e":12752,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12790,"e":12793,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12830,"e":12833,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":12955,"e":12958,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":13140,"e":13143,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file sets up the (dense, closed embedding) factorization of uniformly continuous maps. Every uniformly continuous f factors as a dense uniformly continuous corestriction onto the closure of its range ([[AffineConstructive.topology.uniform.factorization.image_closure]], [[AffineConstructive.topology.uniform.factorization.image_corestrict]]) followed by the inclusion of that closed subspace ([[AffineConstructive.topology.uniform.factorization.image_factor]]). The diagonal property holds for a dense map against the inclusion of a closed subspace ([[AffineConstructive.topology.uniform.factorization.diagonal]], [[AffineConstructive.topology.uniform.factorization.diagonal_unique]]), and any two such factorizations are related by a uniform isomorphism ([[AffineConstructive.topology.uniform.factorization.ess_iso_bijective]]); in both, uniqueness rests on the inclusion being injective, with no separation of the ambient space assumed. The same argument, run with the comparison maps of the completion and [[AffineConstructive.topology.topology.maps.cont_dense_epi]], shows that any two completions of a space are uniformly isomorphic, compatibly with their embeddings and uniquely ([[AffineConstructive.topology.uniform.factorization.firm_iso_bijective]], [[AffineConstructive.topology.uniform.factorization.firm_iso_unique]]). The file ends with a cancellation law: if g ∘ f is a uniform embedding with closed range and f is dense, then g has closed range and, when its domain is separated, is a uniform embedding ([[AffineConstructive.topology.uniform.factorization.cancel_closed_range]], [[AffineConstructive.topology.uniform.factorization.cancel_embedding]]).","short":"Dense/closed-embedding factorization of uniform maps, diagonal property, and the essential uniqueness of completions","items":[{"name":"AffineConstructive.topology.uniform.factorization.image_closure","base":"image_closure","kind":"def","start":17,"body":null,"status":"ok","short":{"text":"The closure of the range of a map f into a uniform space","status":"ok"},"long":{"text":"For a map f : X ⇾ Y into a uniform space, `image_closure f` is the closure of the range of f, taken in the topology of the uniformity of Y. It is the middle object of the image factorization of f: f factors through it as a dense uniformly continuous map followed by the inclusion of a closed subspace.\n\nThe lemmas about it in this file are what make it that middle object. It is closed ([[AffineConstructive.topology.uniform.factorization.image_closure_closed]]), being a closure. Every value f x lies in it ([[AffineConstructive.topology.uniform.factorization.image_corestrict_el]]), because the range lies in its closure; this certificate is what builds the corestriction [[AffineConstructive.topology.uniform.factorization.image_corestrict]], the map X ⇾ `image_closure f` sending x to f x as a member of the subset, with no choice involved. Composed with the inclusion of the subset into Y, the corestriction gives back f ([[AffineConstructive.topology.uniform.factorization.image_factor]]), and it is uniformly continuous and dense ([[AffineConstructive.topology.uniform.factorization.image_corestrict_ufm]], [[AffineConstructive.topology.uniform.factorization.image_corestrict_dense]]). So the inclusion of `image_closure f` is the closed embedding of the factorization and the corestriction its dense part.\n\n```tikzcd\nX \\arrow[r, \"e\"] \\arrow[rd, \"f\"'] & \\overline{f(X)} \\arrow[d, hook] \\\\\n & Y\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.image_closure_closed","base":"image_closure_closed","kind":"prf","start":18,"body":[19,21],"status":"ok","short":{"text":"The closure of the range of f is closed","status":"ok"},"proof":[{"text":"The closure of any subset is closed ([[AffineConstructive.topology.topology.interior.closure_closed]]), and the closure of the range of f is one such closure.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.image_corestrict_el","base":"image_corestrict_el","kind":"prf","start":22,"body":[23,27],"status":"ok","short":{"text":"Every value f x lies in the closure of the range of f","status":"ok"},"proof":[{"text":"By definition, the subset in question is the closure of the range of f.","status":"ok","from":0,"to":1},{"text":"Every subset is contained in its closure ([[AffineConstructive.topology.topology.interior.subset_closure]]), so it suffices that f x lies in the range of f, which [[AffineConstructive.orders.subset_images.range_el]] gives.","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.uniform.factorization.image_corestrict_is_fun","base":"image_corestrict_is_fun","kind":"inst","start":28,"body":[29,32],"status":"ok","short":{"text":"Sending x to f x as a member of the closure of the range preserves equality","status":"ok"},"proof":[{"text":"Fix x₁ and x₂. Equality of members of a subset is equality in Y, so the goal asks that x₁ = x₂ implies f x₁ = f x₂.","status":"ok","from":0,"to":1},{"text":"This is the statement that f preserves equality ([[AffineConstructive.interfaces.set.is_fun]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.image_corestrict","base":"image_corestrict","kind":"def","start":33,"body":null,"status":"ok","short":{"text":"f with its codomain restricted to the closure of its range","status":"ok"},"long":{"text":"The corestriction of f : X ⇾ Y to the closed subspace [[AffineConstructive.topology.uniform.factorization.image_closure]] f. Each x goes to the point f x, which [[AffineConstructive.topology.uniform.factorization.image_corestrict_el]] certifies to lie in the closure of the range. Followed by the inclusion of the subspace into Y, it gives back f, and the two agree by definition ([[AffineConstructive.topology.uniform.factorization.image_factor]]).\n\nThis is the first factor of the image factorization, X ⇾ closure (range f) ⇾ Y. The file shows that it is uniformly continuous ([[AffineConstructive.topology.uniform.factorization.image_corestrict_ufm]]) and dense ([[AffineConstructive.topology.uniform.factorization.image_corestrict_dense]]).\n\n```tikzcd\nX \\arrow[r, \"\\mathrm{image\\_corestrict}\\,f\"] \\arrow[dr, \"f\"'] & \\overline{f(X)} \\arrow[d, hook] \\\\\n & Y\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.image_factor","base":"image_factor","kind":"prf","start":34,"body":[35,37],"status":"ok","short":{"text":"The inclusion of the closure of the range, composed with the corestriction, is f","status":"ok"},"proof":[{"text":"The corestriction sends x to f x as a member of the subset, and the inclusion forgets membership, so the composite agrees with f at every point by definition.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.image_corestrict_ufm","base":"image_corestrict_ufm","kind":"inst","start":38,"body":[39,42],"status":"ok","short":{"text":"The corestriction of a uniformly continuous f to the closure of its range is uniformly continuous","status":"ok"},"proof":[{"text":"The corestriction followed by the inclusion is f ([[AffineConstructive.topology.uniform.factorization.image_factor]]), so this composite is uniformly continuous.","status":"ok","from":0,"to":1},{"text":"The closure of the range carries the uniformity pulled back along its inclusion. A map into a space with that uniformity is uniformly continuous when its composite with the inclusion is ([[AffineConstructive.topology.uniform.subspace.pullback_uniformity_initial]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.image_corestrict_dense","base":"image_corestrict_dense","kind":"inst","start":43,"body":[44,57],"status":"ok","short":{"text":"The corestriction of f to the closure of its range is dense","status":"ok"},"proof":[{"text":"A dense map is a uniformly continuous map with dense range. Uniform continuity is already known, so the density of the range of the corestriction remains.","status":"ok","from":0,"to":1},{"text":"Density means that the closure of the range is the top subset. It suffices to show that the top subset is contained in this closure ([[AffineConstructive.orders.lattices.above_top]]).","status":"ok","from":2,"to":3},{"text":"The inclusion of the subset is a uniform embedding, so it is reflecting. The preimage of the closure of an image under it therefore lies in the closure ([[AffineConstructive.topology.topology.maps.reflection_preimage_closure]]). It suffices to show that every point lies in the preimage, under the inclusion, of the closure of the image of the range.","status":"ok","from":4,"to":4},{"text":"The image of the range under the inclusion is the range of the composite ([[AffineConstructive.orders.subset_images.image_compose_alt]]), and that composite is f ([[AffineConstructive.topology.uniform.factorization.image_factor]]). So the subset in question is the closure of the range of f.","status":"ok","from":5,"to":6},{"text":"That closure is the subset itself. So the goal asks that every member a, once it is included into Y, lies in the subset. Fix a. Membership in the top subset holds outright, and a lies in the subset because it is a member of it.","status":"ok","from":7,"to":13}]},{"name":"AffineConstructive.topology.uniform.factorization.continuous_image_closure","base":"continuous_image_closure","kind":"prf","start":59,"body":[60,64],"status":"ok","short":{"text":"For continuous g, the image of the closure of U lies in the closure of the image of U","status":"ok"},"proof":[{"text":"Image is left adjoint to preimage, so the goal is that the closure of U lies in the preimage under g of the closure of g⁎ U.","status":"ok","from":0,"to":1},{"text":"For continuous g, the closure of a preimage lies in the preimage of the closure ([[AffineConstructive.topology.topology.maps.continuous_preimage_closure]]). It therefore suffices that the closure of U lies in the closure of g* (g⁎ U).","status":"ok","from":2,"to":2},{"text":"U lies in g* (g⁎ U) ([[AffineConstructive.orders.subset_images.preimage_image_unit]]), and closure is monotone.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.uniform.factorization.from_subset_image_sub","base":"from_subset_image_sub","kind":"prf","start":65,"body":[66,74],"status":"ok","short":{"text":"The image of any subset under the inclusion of K lies in K","status":"ok"},"proof":[{"text":"Unfold the inclusion of subsets and fix y in D. The goal is that y in the image of S implies y ∊ K.","status":"ok","from":0,"to":2},{"text":"Membership in the image says that some a in K has image y and lies in S. Let a be such a point.","status":"ok","from":3,"to":4},{"text":"Membership is transported along equality ([[AffineConstructive.interfaces.subset.equal_element]]). Keeping the equality with y, it suffices to show that the included point a lies in K.","status":"ok","from":5,"to":5},{"text":"The equality passes through unchanged. The included point a lies in K whatever else holds, since a is a member of K ([[AffineConstructive.logic.aprop.aimpl_true_r]]), so the factor a ∊ S is left unused, which affine logic allows.","status":"ok","from":6,"to":8}]},{"name":"AffineConstructive.topology.uniform.factorization.diagonal_range_sub","base":"diagonal_range_sub","kind":"prf","start":83,"body":[84,94],"status":"ok","short":{"text":"If g ∘ e factors through a closed K and e is dense, the range of g lies in K","status":"ok"},"proof":[{"text":"K is closed, so it equals its closure, and it suffices to show that the range of g lies in the closure of K.","status":"ok","from":0,"to":1},{"text":"The range of g is the image of the top subset, and since e is dense the top subset is the closure of the range of e. The goal becomes that g⁎ of the closure of the range of e lies in the closure of K.","status":"ok","from":2,"to":2},{"text":"First, the image under g of the range of e lies in K. That image is the image of the top subset under g ∘ e ([[AffineConstructive.orders.subset_images.image_compose_alt]]). By the commuting square, it is the image under the inclusion of K of the image under f'. That set lies in K by [[AffineConstructive.topology.uniform.factorization.from_subset_image_sub]].","status":"ok","from":3,"to":7},{"text":"Closure is monotone, so the closure of g⁎ (range e) lies in the closure of K. It remains to show that g⁎ of the closure of the range of e lies in the closure of g⁎ (range e).","status":"ok","from":8,"to":8},{"text":"g is uniformly continuous, hence continuous, and a continuous image of a closure lies in the closure of the image ([[AffineConstructive.topology.uniform.factorization.continuous_image_closure]]).","status":"ok","from":9,"to":10}]},{"name":"AffineConstructive.topology.uniform.factorization.diagonal_el","base":"diagonal_el","kind":"prf","start":95,"body":[96,99],"status":"ok","short":{"text":"In the commuting square, every value g b lies in the closed subset K","status":"ok"},"proof":[{"text":"The range of g lies in K ([[AffineConstructive.topology.uniform.factorization.diagonal_range_sub]]), so it suffices that g b lies in the range of g.","status":"ok","from":0,"to":1},{"text":"Every value of g lies in its range ([[AffineConstructive.orders.subset_images.range_el]]).","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.diagonal_is_fun","base":"diagonal_is_fun","kind":"inst","start":100,"body":[101,104],"status":"ok","short":{"text":"Sending b to g b as a member of K preserves equality","status":"ok"},"proof":[{"text":"Take b₁, b₂ in B; it is to show that b₁ = b₂ implies equality of g b₁ and g b₂ as members of K. Equality in K is the equality of D, so this is a statement about g alone.","status":"ok","from":0,"to":1},{"text":"It is the fact that g preserves equality, [[AffineConstructive.interfaces.set.is_fun]] at b₁ and b₂.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.diagonal","base":"diagonal","kind":"def","start":105,"body":null,"status":"ok","short":{"text":"The diagonal B ⇾ K of a square with dense top e and closed inclusion at the bottom","status":"ok"},"long":{"text":"Given a commuting square g ∘ e = m ∘ f', where e : A ⇾ B is dense, g : B ⇾ D is uniformly continuous, and m is the inclusion of a closed subset K of D, the diagonal is g corestricted to K. It is well defined because the range of g lies in K ([[AffineConstructive.topology.uniform.factorization.diagonal_range_sub]]): g agrees with the inclusion on the dense range of e, and K is closed.\n\nThis is the diagonal fill-in property of the factorization system whose E-maps are dense uniformly continuous maps and whose M-maps are closed subspace inclusions. Because the M-map is an actual subset inclusion, the diagonal is a corestriction together with a membership certificate, so no choice of preimages is involved. It makes both triangles commute ([[AffineConstructive.topology.uniform.factorization.diagonal_factor_m]], [[AffineConstructive.topology.uniform.factorization.diagonal_factor_e]]) and is uniformly continuous ([[AffineConstructive.topology.uniform.factorization.diagonal_ufm]]). It is unique by injectivity of the inclusion alone ([[AffineConstructive.topology.uniform.factorization.diagonal_unique]]), with no separation hypothesis on D.\n\n```tikzcd\nA \\arrow[r, \"e\"] \\arrow[d, \"f'\"'] & B \\arrow[d, \"g\"] \\arrow[dl, dashed, \"\\mathrm{diagonal}\"'] \\\\\nK \\arrow[r, hook] & D\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.diagonal_factor_m","base":"diagonal_factor_m","kind":"prf","start":106,"body":[107,109],"status":"ok","short":{"text":"The inclusion of K composed with the diagonal is g","status":"ok"},"proof":[{"text":"The diagonal sends b to g b regarded as a member of K, and the inclusion forgets K. So the composite is g by definition, and reflexivity closes the goal.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.diagonal_factor_e","base":"diagonal_factor_e","kind":"prf","start":110,"body":[111,116],"status":"ok","short":{"text":"The diagonal composed with the dense map e is f'","status":"ok"},"proof":[{"text":"Two maps are equal when they agree at every point, so fix a in A. It remains to show that the diagonal at e a equals f' a.","status":"ok","from":0,"to":2},{"text":"In K this asks that g (e a) equal the point of D underlying f' a. That is the commuting square evaluated at a.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.topology.uniform.factorization.diagonal_ufm","base":"diagonal_ufm","kind":"inst","start":117,"body":[118,121],"status":"ok","short":{"text":"The diagonal of the square is uniformly continuous","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.factorization.diagonal_factor_m]], the composite of the inclusion of K with the diagonal is g, which is uniformly continuous. So that composite is uniformly continuous.","status":"ok","from":0,"to":1},{"text":"K carries the uniformity pulled back along its inclusion. A map into K is therefore uniformly continuous as soon as its composite with the inclusion is, by [[AffineConstructive.topology.uniform.subspace.pullback_uniformity_initial]].","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.diagonal_unique","base":"diagonal_unique","kind":"prf","start":122,"body":[123,128],"status":"ok","short":{"text":"Any d' : B ⇾ K whose composite with the inclusion of K is g equals the diagonal","status":"ok"},"proof":[{"text":"Assume that the inclusion of K composed with d' is g. It is to show that the diagonal equals d'.","status":"ok","from":0,"to":1},{"text":"The inclusion of K is injective, so it cancels on the left ([[AffineConstructive.theory.set.injective_compose_cancel]], [[AffineConstructive.interfaces.subset.from_subset_injective]]). It suffices to show that the two composites with the inclusion are equal. No separation of D is used.","status":"ok","from":2,"to":2},{"text":"By [[AffineConstructive.topology.uniform.factorization.diagonal_factor_m]] and the assumption on d', both composites are g.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.topology.uniform.factorization.ess_comm_sym","base":"ess_comm_sym","kind":"prf","start":137,"body":[138,140],"status":"ok","short":{"text":"The equation between two factorizations, read the other way round","status":"ok"},"proof":[{"text":"The equation between the two factorisations is used the other way round, which is symmetry of equality.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.ess_iso","base":"ess_iso","kind":"def","start":141,"body":null,"status":"ok","short":{"text":"The comparison map K₁ ⇾ K₂ between two dense-then-closed factorizations of one map","status":"ok"},"long":{"text":"Suppose one map out of X factors in two ways: through dense maps e₁ : X ⇾ K₁ and e₂ : X ⇾ K₂, followed by the inclusions of closed subsets K₁ and K₂ of Y. The comparison map K₁ ⇾ K₂ is the [[AffineConstructive.topology.uniform.factorization.diagonal]] of the square whose top is e₁, whose left side is e₂, whose right side is the inclusion of K₁, and whose bottom is the inclusion of K₂. Concretely, it sends a point of K₁ to the same point of Y, now certified to lie in K₂.\n\nThis is the essential uniqueness of the factorization. The diagonal of the reverse square is a designated inverse ([[AffineConstructive.topology.uniform.factorization.ess_iso_inverse]]). Both maps are uniformly continuous and commute with the inclusions, and the two are mutually inverse ([[AffineConstructive.topology.uniform.factorization.ess_iso_bijective]]). As with [[AffineConstructive.topology.uniform.factorization.diagonal_unique]], the round trips are forced by injectivity of the inclusions alone, with no separation of Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.ess_iso_inverse","base":"ess_iso_inverse","kind":"inst","start":142,"body":null,"status":"ok","short":{"text":"Equips the comparison K₁ ⇾ K₂ with its inverse, the comparison K₂ ⇾ K₁","status":"ok"},"long":{"text":"This instance designates the inverse of [[AffineConstructive.topology.uniform.factorization.ess_iso]]. The inverse is the [[AffineConstructive.topology.uniform.factorization.diagonal]] of the reverse square: its top is e₂, its left side is e₁, its right side is the inclusion of K₂, and its bottom is the inclusion of K₁. Building it needs K₁ closed and e₂ dense, the hypotheses symmetric to those of [[AffineConstructive.topology.uniform.factorization.ess_iso]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.ess_iso_factor_m","base":"ess_iso_factor_m","kind":"prf","start":143,"body":[144,146],"status":"ok","short":{"text":"The comparison K₁ ⇾ K₂ commutes with the inclusions of K₁ and K₂ into Y","status":"ok"},"proof":[{"text":"The comparison is the diagonal of the square with the dense map e₁ on the left, the inclusion of K₂ on the right, and the inclusion of K₁ along the bottom. Its composite with the inclusion of K₂ is therefore the bottom map, by [[AffineConstructive.topology.uniform.factorization.diagonal_factor_m]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.ess_iso_inv_factor_m","base":"ess_iso_inv_factor_m","kind":"prf","start":148,"body":[149,151],"status":"ok","short":{"text":"The inverse comparison K₂ ⇾ K₁ commutes with the inclusions into Y","status":"ok"},"proof":[{"text":"The inverse comparison is the diagonal of the reversed square: e₂ on the left, the inclusion of K₁ on the right, and the inclusion of K₂ along the bottom. The square commutes by [[AffineConstructive.topology.uniform.factorization.ess_comm_sym]], and [[AffineConstructive.topology.uniform.factorization.diagonal_factor_m]] gives the equation.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.ess_iso_ufm","base":"ess_iso_ufm","kind":"inst","start":152,"body":[153,155],"status":"ok","short":{"text":"The comparison K₁ ⇾ K₂ is uniformly continuous","status":"ok"},"proof":[{"text":"The comparison is the diagonal of the square with e₁ dense on the left and the inclusion of the closed subset K₂ on the right. Every such diagonal is uniformly continuous, by [[AffineConstructive.topology.uniform.factorization.diagonal_ufm]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.ess_iso_inv_ufm","base":"ess_iso_inv_ufm","kind":"inst","start":156,"body":[157,159],"status":"ok","short":{"text":"The inverse comparison K₂ ⇾ K₁ is uniformly continuous","status":"ok"},"proof":[{"text":"The inverse comparison is the diagonal of the reversed square, with e₂ dense on the left and the inclusion of K₁ on the right, which commutes by [[AffineConstructive.topology.uniform.factorization.ess_comm_sym]]. It is uniformly continuous by [[AffineConstructive.topology.uniform.factorization.diagonal_ufm]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.ess_iso_bijective","base":"ess_iso_bijective","kind":"prf","start":160,"body":[161,173],"status":"ok","short":{"text":"The comparison K₁ ⇾ K₂ and its inverse are mutually inverse, so it is a bijection","status":"ok"},"proof":[{"text":"The comparison comes with a designated inverse, the comparison K₂ ⇾ K₁. By [[AffineConstructive.theory.set.alt_Build_Bijective]] it is enough to show that the inverse is a two-sided inverse, one composite at a time.","status":"ok","from":0,"to":1},{"text":"For the composite on K₁, the inclusion of K₁ into Y is injective, so by [[AffineConstructive.theory.set.injective_compose_cancel]] it suffices to show the two maps agree after that inclusion. Followed by the inclusion of K₁, the inverse comparison becomes the inclusion of K₂ ([[AffineConstructive.topology.uniform.factorization.ess_iso_inv_factor_m]]). The comparison followed by the inclusion of K₂ is then the inclusion of K₁ ([[AffineConstructive.topology.uniform.factorization.ess_iso_factor_m]]). Both sides are therefore the inclusion of K₁.","status":"ok","from":2,"to":6},{"text":"The composite on K₂ is symmetric. The inclusion of K₂ cancels on the left, and [[AffineConstructive.topology.uniform.factorization.ess_iso_factor_m]] followed by [[AffineConstructive.topology.uniform.factorization.ess_iso_inv_factor_m]] reduces the composite followed by the inclusion to the inclusion of K₂ itself. No separation assumption on Y is used: injectivity of the inclusions does all the work.","status":"ok","from":7,"to":12}]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso","base":"firm_iso","kind":"def","start":179,"body":null,"status":"ok","short":{"text":"The comparison Y₁ ⇾ Y₂ between two completions ι₁ and ι₂ of the same space X","status":"ok"},"long":{"text":"Given two completions ι₁ : X ⇾ Y₁ and ι₂ : X ⇾ Y₂, the comparison map is the one that the universal property of ι₂ attaches to the dense, uniformly initial map ι₁ ([[AffineConstructive.topology.interfaces.uniform.completion_reflect_initial]]). It is characterised by firm_iso ∘ ι₁ = ι₂ ([[AffineConstructive.topology.uniform.factorization.firm_iso_spec]]).\n\nThis map shows that completions are firm, in the sense of Brümmer and Giuli: any two completions of a space are related by a unique uniform isomorphism that commutes with the embeddings. The map in the other direction is its designated inverse ([[AffineConstructive.topology.uniform.factorization.firm_iso_inverse]]). The round trips are identities by [[AffineConstructive.topology.topology.maps.cont_dense_epi]]: two continuous maps into a separated space that agree on a dense subspace are equal ([[AffineConstructive.topology.uniform.factorization.firm_iso_bijective]]). Uniqueness is [[AffineConstructive.topology.uniform.factorization.firm_iso_unique]].\n\n```tikzcd\n & X \\arrow[dl, \"\\iota_1\"'] \\arrow[dr, \"\\iota_2\"] & \\\\\nY_1 \\arrow[rr, \"\\mathrm{firm\\_iso}\"', shift right] & & Y_2 \\arrow[ll, shift right]\n```","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_inverse","base":"firm_iso_inverse","kind":"inst","start":180,"body":null,"status":"ok","short":{"text":"Equips the comparison Y₁ ⇾ Y₂ with its inverse, the comparison Y₂ ⇾ Y₁","status":"ok"},"long":{"text":"This instance designates the inverse of [[AffineConstructive.topology.uniform.factorization.firm_iso]]. The inverse is the map that the universal property of ι₁ attaches to ι₂ ([[AffineConstructive.topology.interfaces.uniform.completion_reflect_initial]]), the same construction with the two completions exchanged.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_spec","base":"firm_iso_spec","kind":"prf","start":181,"body":[182,184],"status":"ok","short":{"text":"The comparison Y₁ ⇾ Y₂ takes the embedding ι₁ to ι₂","status":"ok"},"proof":[{"text":"The comparison is the map Y₁ ⇾ Y₂ that the universal property of the completion ι₁ gives for ι₂. That it takes ι₁ to ι₂ is the defining equation of that map.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_inv_spec","base":"firm_iso_inv_spec","kind":"prf","start":185,"body":[186,188],"status":"ok","short":{"text":"The inverse comparison Y₂ ⇾ Y₁ takes the embedding ι₂ to ι₁","status":"ok"},"proof":[{"text":"The inverse comparison is the map Y₂ ⇾ Y₁ that the universal property of the completion ι₂ gives for ι₁. That it takes ι₂ to ι₁ is the defining equation of that map.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_ufm","base":"firm_iso_ufm","kind":"inst","start":189,"body":[190,193],"status":"ok","short":{"text":"The comparison Y₁ ⇾ Y₂ between completions is uniformly continuous","status":"ok"},"proof":[{"text":"Unfolded, the comparison is the map that the universal property of the completion ι₁ gives for ι₂. That property produces uniformly continuous maps, so the instance is already available.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_inv_ufm","base":"firm_iso_inv_ufm","kind":"inst","start":194,"body":[195,198],"status":"ok","short":{"text":"The inverse comparison Y₂ ⇾ Y₁ between completions is uniformly continuous","status":"ok"},"proof":[{"text":"Unfolded, the inverse comparison is the map that the universal property of the completion ι₂ gives for ι₁. That property produces uniformly continuous maps, so the instance is already available.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_cont","base":"firm_iso_cont","kind":"inst","start":199,"body":null,"status":"ok","short":{"text":"The comparison between two completions, firm_iso, is continuous for the uniform topologies","status":"ok"},"long":{"text":"This instance states that [[AffineConstructive.topology.uniform.factorization.firm_iso]] is continuous for the topologies the uniformities of the two completions induce. It follows from [[AffineConstructive.topology.uniform.factorization.firm_iso_ufm]], since a uniformly continuous map is continuous.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_inv_cont","base":"firm_iso_inv_cont","kind":"inst","start":200,"body":null,"status":"ok","short":{"text":"The inverse of the comparison between two completions is continuous for the uniform topologies","status":"ok"},"long":{"text":"This instance states that the inverse of [[AffineConstructive.topology.uniform.factorization.firm_iso]] is continuous for the topologies the uniformities induce. It follows from [[AffineConstructive.topology.uniform.factorization.firm_iso_inv_ufm]], since a uniformly continuous map is continuous.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_bijective","base":"firm_iso_bijective","kind":"prf","start":201,"body":[202,216],"status":"ok","short":{"text":"The comparison between two completions and its inverse are mutually inverse","status":"ok"},"proof":[{"text":"By [[AffineConstructive.theory.set.alt_Build_Bijective]] it is enough to show that the inverse comparison is a two-sided inverse of the comparison.","status":"ok","from":0,"to":1},{"text":"Both the composite on Y₁ and the identity of Y₁ are continuous for the uniform topology, and ι₁ is dense. By [[AffineConstructive.topology.topology.maps.cont_dense_epi]] it therefore suffices that the two agree after ι₁. The comparison takes ι₁ to ι₂ ([[AffineConstructive.topology.uniform.factorization.firm_iso_spec]]), and the inverse comparison takes ι₂ back to ι₁ ([[AffineConstructive.topology.uniform.factorization.firm_iso_inv_spec]]). Both sides are therefore ι₁.","status":"ok","from":2,"to":7},{"text":"The composite on Y₂ is symmetric. It is enough to compare after the dense map ι₂, and there [[AffineConstructive.topology.uniform.factorization.firm_iso_inv_spec]] followed by [[AffineConstructive.topology.uniform.factorization.firm_iso_spec]] gives ι₂ on both sides.","status":"ok","from":8,"to":14}]},{"name":"AffineConstructive.topology.uniform.factorization.firm_iso_unique","base":"firm_iso_unique","kind":"prf","start":217,"body":[218,225],"status":"ok","short":{"text":"Any uniformly continuous φ : Y₁ ⇾ Y₂ with φ ∘ ι₁ = ι₂ is the comparison map","status":"ok"},"proof":[{"text":"Let φ be uniformly continuous with φ ∘ ι₁ = ι₂.","status":"ok","from":0,"to":1},{"text":"As a uniformly continuous map, φ is continuous for the uniform topologies ([[AffineConstructive.topology.uniform.base.uniformly_continuous_continuous]]), and so is the comparison. The topology of the completion Y₂ is Hausdorff because Y₂ is separated, and ι₁ is dense. By [[AffineConstructive.topology.topology.maps.cont_dense_epi]] it then suffices that φ and the comparison agree after ι₁.","status":"ok","from":2,"to":4},{"text":"After ι₁, φ gives ι₂ by assumption, and the comparison gives ι₂ by [[AffineConstructive.topology.uniform.factorization.firm_iso_spec]].","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.uniform.factorization.cancel_image_eq","base":"cancel_image_eq","kind":"prf","start":232,"body":[233,236],"status":"ok","short":{"text":"The image under g of the range of f is the range of g ∘ f","status":"ok"},"proof":[{"text":"Write the range of f as the image of the top subset ([[AffineConstructive.orders.subset_images.range_image]]). The image of the top subset under f and then under g is its image under g ∘ f ([[AffineConstructive.orders.subset_images.image_compose_alt]]), and that image is the range of g ∘ f.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.cancel_range_eq","base":"cancel_range_eq","kind":"prf","start":237,"body":[238,248],"status":"ok","short":{"text":"If f is dense, g uniformly continuous and g ∘ f has closed range, then g has the same range","status":"ok"},"proof":[{"text":"By antisymmetry of inclusion ([[AffineConstructive.orders.orders.le_antisym_iff]]) the equality splits into two inclusions, proved separately.","status":"ok","from":0,"to":2},{"text":"For range g ⊆ range (g ∘ f), the range of g ∘ f is closed, so it equals its closure, and by [[AffineConstructive.topology.uniform.factorization.cancel_image_eq]] it is the closure of the image under g of the range of f. On the left, write range g as the image of the top subset ([[AffineConstructive.orders.subset_images.range_image]]). Because f is dense, the top subset is the closure of the range of f. What remains is that g maps the closure of the range of f into the closure of its image, which [[AffineConstructive.topology.uniform.factorization.continuous_image_closure]] gives for the continuous map g.","status":"ok","from":3,"to":6},{"text":"For the reverse inclusion, rewrite the range of g ∘ f as the image under g of the range of f ([[AffineConstructive.topology.uniform.factorization.cancel_image_eq]]), and range g as the image of the top subset. Image under g preserves inclusion, and the range of f lies below the top subset.","status":"ok","from":7,"to":10}]},{"name":"AffineConstructive.topology.uniform.factorization.cancel_closed_range","base":"cancel_closed_range","kind":"prf","start":249,"body":[250,253],"status":"ok","short":{"text":"If f is dense and g ∘ f has closed range, then g has closed range","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.factorization.cancel_range_eq]] the range of g is the range of g ∘ f, which is closed by assumption.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.uniform.factorization.cancel_initial","base":"cancel_initial","kind":"inst","start":254,"body":[255,257],"status":"ok","short":{"text":"If f is dense and g ∘ f a uniform embedding, then g is uniformly initial","status":"ok"},"proof":[{"text":"This is the dense cancellation law for uniformly initial maps, [[AffineConstructive.topology.uniform.product.ufm_dense_initial]]. The map f is uniformly continuous and dense, g is uniformly continuous, and g ∘ f is uniformly reflecting because it is a uniform embedding. So g is uniformly initial.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.factorization.cancel_embedding","base":"cancel_embedding","kind":"prf","start":258,"body":[259,261],"status":"ok","short":{"text":"If g ∘ f is a uniform embedding with f dense and B separated, g is a uniform embedding","status":"ok"},"proof":[{"text":"The map g is uniformly initial by [[AffineConstructive.topology.uniform.factorization.cancel_initial]], and its domain B is separated. A uniformly initial map out of a separated uniform space is a uniform embedding by [[AffineConstructive.topology.uniform.base.uniform_initial_embedding]], so g is a uniform embedding.","status":"ok","from":0,"to":2}]}],"diagrams":{"svg":{"\nX \\arrow[r, \"e\"] \\arrow[rd, \"f\"'] & \\overline{f(X)} \\arrow[d, hook] \\\\\n & Y":"<svg fill=\"currentColor\" version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='76.813pt' height='55.257pt' viewBox='0 0 76.813 55.257'>\n<defs>\n<path id='g2-1' d='M1.56128-1.58916C1.75644-1.58916 2.30707-1.6031 2.68345-1.73553C3.19923-1.91675 3.29681-2.25131 3.29681-2.46041C3.29681-2.84376 2.91346-3.07377 2.43253-3.07377C1.59613-3.07377 .46699-2.43253 .46699-1.24066C.46699-.53669 .9061 .0697 1.72159 .0697C2.89952 .0697 3.45015-.62033 3.45015-.71791C3.45015-.75973 3.38742-.8364 3.33166-.8364C3.28984-.8364 3.2759-.82246 3.22014-.7667C2.67648-.12546 1.86099-.12546 1.73553-.12546C1.31733-.12546 1.03853-.40426 1.03853-.96883C1.03853-1.06641 1.03853-1.20581 1.12217-1.58916H1.56128ZM1.17793-1.78432C1.4637-2.79497 2.23737-2.87861 2.43253-2.87861C2.73921-2.87861 2.9971-2.72527 2.9971-2.46041C2.9971-1.78432 1.81917-1.78432 1.51946-1.78432H1.17793Z'/>\n<path id='g2-2' d='M2.83679-2.75315H3.51985C3.65925-2.75315 3.74986-2.75315 3

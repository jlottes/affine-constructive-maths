.aprop","name":"all_lb","kind":"def","local":false,"page":"../../logic/aprop.html"},{"s":3062,"e":3077,"lib":"AffineConstructive.topology.uniform.induced","name":"induced_ufm_sym","kind":"meth","local":true},{"s":3146,"e":3163,"lib":"AffineConstructive.topology.uniform.induced","name":"induced_ufm_split","kind":"meth","local":true},{"s":3220,"e":3225,"lib":"AffineConstructive.topology.uniform.induced","name":"induced.basis","kind":"var","local":true},{"s":3237,"e":3242,"lib":"AffineConstructive.topology.uniform.induced","name":"induced.basis","kind":"var","local":true},{"s":3255,"e":3260,"lib":"AffineConstructive.topology.uniform.induced","name":"induced.basis","kind":"var","local":true},{"s":3284,"e":3291,"lib":"AffineConstructive.logic.aprop","name":"aex_adj","kind":"def","local":false,"page":"../../logic/aprop.html"},{"s":3370,"e":3391,"lib":"AffineConstructive.topology.interfaces.uniform","name":"SeparatedUniformSpace","kind":"class","local":false,"page":"../interfaces/uniform.html"},{"s":3392,"e":3393,"lib":"AffineConstructive.topology.uniform.induced","name":"X","kind":"abbrev","local":true},{"s":3416,"e":3453,"lib":"AffineConstructive.topology.uniform.basis","name":"uniformity_presentation_basis_correct","kind":"def","local":false,"page":"basis.html"},{"s":3458,"e":3459,"lib":"AffineConstructive.topology.uniform.induced","name":"X","kind":"abbrev","local":true},{"s":3472,"e":3498,"lib":"AffineConstructive.topology.uniform.basis","name":"uniform_separated_by_basis","kind":"thm","local":false,"page":"basis.html"},{"s":3521,"e":3524,"lib":"AffineConstructive.topology.uniform.induced","name":"sep","kind":"abbrev","local":true},{"s":1275,"e":1278,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1340,"e":1343,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1359,"e":1362,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1428,"e":1431,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1480,"e":1483,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1499,"e":1502,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1574,"e":1577,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1956,"e":1959,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":1975,"e":1989,"lib":"AffineConstructive.theory.set","name":"unfold_pair_eq","kind":"ltac","local":false,"page":"../../theory/set.html"},{"s":2017,"e":2020,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2059,"e":2062,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2088,"e":2091,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2117,"e":2120,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2859,"e":2862,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":2863,"e":2866,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":2998,"e":3001,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3278,"e":3281,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":3512,"e":3515,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":3516,"e":3519,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"Builds a separated uniform space from a type with an affine equality and a family of relations indexed by an inhabited Λ. The relations must be reflexive, symmetric up to a change of index, split under composition, form a downward-directed family, be compatible with equality, and determine the equality: x = y if and only if x and y are related by every basic relation. The equality is then an equivalence, so the type is a set; each basic relation is a subset of X ⊗ X; and the uniformity they present makes X a separated uniform space. The proofs apply the general lemmas on presented filters and uniformities from uniform/basis.v and orders/filters.v.","short":"A separated uniform space induced on a type by a basis of relations","items":[{"name":"AffineConstructive.topology.uniform.induced.InducedUniformBasis","base":"InducedUniformBasis","kind":"rec","start":14,"body":null,"status":"ok","short":{"text":"Conditions under which a family of relations on a type induces its equality and a uniformity","status":"ok"},"long":{"text":"A family of relations, written basis i for each i in an index type Λ, on a type A that carries an affine equality but is not yet known to be a set. The conditions are those of a basis of a separated uniformity, stated so that they mention only the family. Each basis i is reflexive. For each i there is a j such that basis j, read backwards, implies basis i (symmetry). For each i there is a j such that basis j (x, y) ⊠ basis j (y, z) implies basis i (x, z) (splitting). Any two basis relations contain a common third. Two points are equal if and only if they are close under every basis i. Each basis i respects equality: x = x' ⊠ basis i (x', y') ⊠ y' = y implies basis i (x, y).\n\nThe choice of connective follows the structure on the tensor square X ⊗ X. Splitting uses the tensor because composing entourages consumes two closeness statements, each once. The downward condition uses the additive conjunction: one basis i₃ (p) gives whichever of basis i₁ p and basis i₂ p is needed. Separation is stated with the affine universal, so the equality on A is the meet of the basis relations. Because of this, the equality is determined by the family, and the file can derive the set axioms from the uniformity axioms and does not assume them.\n\nThe class is the input to the rest of the file. From it, the file builds the set [[AffineConstructive.topology.uniform.induced.induced_uniform_set]], its uniformity [[AffineConstructive.topology.uniform.induced.induced_uniformity]] presented by the family, and the separated uniform space [[AffineConstructive.topology.uniform.induced.induced_uniform_space]], [[AffineConstructive.topology.uniform.induced.induced_separated_uniform_space]].","status":"ok"},"proof":[],"members":[{"name":"AffineConstructive.topology.uniform.induced.induced_ufm_refl","base":"induced_ufm_refl","kind":"proj","short":{"text":"Every basic relation relates each point to itself","status":"ok"}},{"name":"AffineConstructive.topology.uniform.induced.induced_ufm_sym","base":"induced_ufm_sym","kind":"proj","short":{"text":"For each i there is a j such that basis j (y, x) implies basis i (x, y)","status":"ok"}},{"name":"AffineConstructive.topology.uniform.induced.induced_ufm_split","base":"induced_ufm_split","kind":"proj","short":{"text":"For each i there is a j such that two basis j steps, x to y and y to z, give basis i (x, z)","status":"ok"}},{"name":"AffineConstructive.topology.uniform.induced.induced_ufm_down","base":"induced_ufm_down","kind":"proj","short":{"text":"Any two basic relations contain a common third basic relation","status":"ok"}},{"name":"AffineConstructive.topology.uniform.induced.induced_ufm_sep","base":"induced_ufm_sep","kind":"proj","short":{"text":"Two points are equal if and only if every basic relation relates them","status":"ok"}},{"name":"AffineConstructive.topology.uniform.induced.induced_ufm_compat","base":"induced_ufm_compat","kind":"proj","short":{"text":"Each basic relation respects equality in both arguments","status":"ok"}},{"name":"AffineConstructive.topology.uniform.induced.Build_InducedUniformBasis","base":"Build_InducedUniformBasis","kind":"constr","short":{"text":"Builds an induced uniform basis from the six conditions on the family","status":"ok"}}]},{"name":"AffineConstructive.topology.uniform.induced.sep","base":"sep","kind":"abbrev","start":16,"body":null,"status":"ok","short":{"text":"Local shorthand for the separation condition induced_ufm_sep","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.induced.induced_ufm_sep]]: two points are equal if and only if every basic relation relates them. The file's proofs use it to rewrite an equality as the universal statement over the basis, and back.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.induced.induced_uniform_is_set","base":"induced_uniform_is_set","kind":"inst","start":17,"body":[18,41],"status":"ok","short":{"text":"The given equality on A is an equivalence, so A is a set","status":"ok"},"proof":[{"text":"A set is a type whose equality is an equivalence, so there are three things to show: reflexivity, symmetry and transitivity of the given equality.","status":"ok","from":0,"to":1},{"text":"For reflexivity, the separation condition of [[AffineConstructive.topology.uniform.induced.InducedUniformBasis]] turns x = x into closeness of x to itself under every relation of the family. Fix i; each basic relation is reflexive.","status":"ok","from":2,"to":6},{"text":"For symmetry, both equalities become closeness under every relation, and the goal is that x and y being close under every relation implies y and x close under each. Fix i; the inversion condition gives j such that closeness under j of the reversed pair implies closeness under i. Specialising the hypothesis at j leaves exactly that condition, at y and x.","status":"ok","from":7,"to":14},{"text":"For transitivity, the two equalities x = y and y = z and the conclusion x = z become closeness under every relation. Fix i; the composition condition gives j such that two j-steps compose to an i-step. Each of the two universal hypotheses is specialised at j, one per factor of the tensor, and the composition condition at x, y, z closes the proof.","status":"ok","from":15,"to":23}]},{"name":"AffineConstructive.topology.uniform.induced.induced_uniform_set","base":"induced_uniform_set","kind":"def","start":42,"body":null,"status":"ok","short":{"text":"The set with carrier A and the equality induced by the basis","status":"ok"},"long":{"text":"The set obtained by bundling A with its given equality, which [[AffineConstructive.topology.uniform.induced.induced_uniform_is_set]] shows is an equivalence. The rest of the file defines the uniform structure on this set. Locally it goes by the abbreviation X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.induced.X","base":"X","kind":"abbrev","start":43,"body":null,"status":"ok","short":{"text":"Local shorthand for the induced set induced_uniform_set","status":"ok"},"long":{"text":"A local abbreviation for [[AffineConstructive.topology.uniform.induced.induced_uniform_set]], the type A as a set under the equality induced by the basis. The file writes its subsets of the tensor square and its uniformity in terms of X.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.induced.induced_basis_isfun","base":"induced_basis_isfun","kind":"inst","start":44,"body":[45,58],"status":"ok","short":{"text":"Each basic relation preserves equality on the tensor square X ⊗ X","status":"ok"},"proof":[{"text":"It suffices to show the one-directional transport: equalities x = x' and y = y' carry closeness under the i-th relation from (x, y) to (x', y').","status":"ok","from":0,"to":1},{"text":"Granting this, take two points of the tensor square. Their equality must imply that the i-th relation holds at one exactly when it holds at the other; the forward direction is the transport claim.","status":"ok","from":2,"to":4},{"text":"For the backward direction, the transport claim with the roles of the points exchanged reduces the goal to deriving x' = x ⊠ y' = y from the equality of the pairs. In the tensor square that equality is the tensor of the two component equalities, and each is reversed by symmetry, which holds because A is a set by [[AffineConstructive.topology.uniform.induced.induced_uniform_is_set]].","status":"ok","from":5,"to":6},{"text":"It remains to prove the transport claim. Fix the four points and reverse the equality x = x' by symmetry. After uncurrying, rearranging the factors puts closeness under the i-th relation between the two equalities, which is the form of the compatibility condition of [[AffineConstructive.topology.uniform.induced.InducedUniformBasis]].","status":"ok","from":7,"to":13}]},{"name":"AffineConstructive.topology.uniform.induced.induced_basis","base":"induced_basis","kind":"def","start":59,"body":null,"status":"ok","short":{"text":"The basic relation basis i as a subset of the tensor square X ⊗ X","status":"ok"},"long":{"text":"The relation basis i, packaged as a subset of X ⊗ X using [[AffineConstructive.topology.uniform.induced.induced_basis_isfun]]. It is a subset of the tensor square, not of the cartesian product, because the uniform structures of the development take their entourages in X ⊗ X. The family of these subsets presents the uniformity [[AffineConstructive.topology.uniform.induced.induced_uniformity]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.induced.induced_uniformity","base":"induced_uniformity","kind":"inst","start":60,"body":null,"status":"ok","short":{"text":"The uniformity on X presented by the basic relations","status":"ok"},"long":{"text":"The uniformity on X whose entourages are the relations that contain some basis i, defined as [[AffineConstructive.topology.uniform.basis.presented_uniformity]] of the family [[AffineConstructive.topology.uniform.induced.induced_basis]]. Its uniform-space axioms are proved in [[AffineConstructive.topology.uniform.induced.induced_uniform_space]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.induced.induced_uniformity_presentation","base":"induced_uniformity_presentation","kind":"inst","start":61,"body":null,"status":"ok","short":{"text":"The basic relations of the induced basis present the induced uniformity","status":"ok"},"long":{"text":"The family [[AffineConstructive.topology.uniform.induced.induced_basis]] presents [[AffineConstructive.topology.uniform.induced.induced_uniformity]]: the induced uniformity is the filter of relations generated by the basic relations, so an entourage is exactly a relation containing some basic relation. Since the induced uniformity is defined as the uniformity presented by this family, the fact is an instance of [[AffineConstructive.topology.uniform.basis.presented_uniformity_prop]].\n\nIt is declared as an instance so that resolution finds the presentation of X when a lemma about presented filters or presented uniformities asks for one. In the recorded development it is used in one proof of this file.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.induced.induced_uniform_space","base":"induced_uniform_space","kind":"inst","start":62,"body":[63,90],"status":"ok","short":{"text":"With an inhabited index type, the induced uniformity makes X a uniform space","status":"ok"},"proof":[{"text":"A uniform space structure asks for two things: that [[AffineConstructive.topology.uniform.induced.induced_uniformity]] is a filter, and that it is a pre-uniformity.","status":"ok","from":0,"to":1},{"text":"By [[AffineConstructive.orders.filters.presented_filter_filter_alt]], since the index type is inhabited, the presented uniformity is a filter once any two basic relations contain a common third. Fix indices i and j.","status":"ok","from":2,"to":4},{"text":"The directedness condition gives k whose relation implies both the i-th and the j-th; take k as the witness. Each of the two inclusions follows pointwise by projecting the additive conjunction onto the conjunct it needs.","status":"ok","from":5,"to":7},{"text":"By [[AffineConstructive.topology.uniform.basis.presented_pre_uniform_space]], the pre-uniformity reduces to three conditions on the generators. Fix i: the identity relation lies in the i-th relation, some basic relation's inverse lies in it, and some basic relation's composite with itself lies in it.","status":"ok","from":8,"to":9},{"text":"For the identity relation, take a pair (x, y) with x = y. By the separation condition this equality is closeness under every relation of the family, and specialising at i gives closeness under the i-th.","status":"ok","from":10,"to":14},{"text":"For the inverse, the inversion condition gives j whose reversed relation implies the i-th; take j as the witness. The inclusion holds pointwise by that condition at x and y.","status":"ok","from":15,"to":19},{"text":"For the composite, the composition condition gives j such that two j-steps compose to an i-step; take j as the witness. A pair (x, z) lies in the composite when there is a y with x j-close to y and y j-close to z; for such a y, the composition condition at x, y, z gives closeness under the i-th relation.","status":"ok","from":20,"to":27}]},{"name":"AffineConstructive.topology.uniform.induced.induced_separated_uniform_space","base":"induced_separated_uniform_space","kind":"prf","start":91,"body":[92,97],"status":"ok","short":{"text":"With an inhabited index type, the induced uniform space on X is separated","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.basis.uniformity_presentation_basis_correct]], the basic relations form a basis of the induced uniformity. So by [[AffineConstructive.topology.uniform.basis.uniform_separated_by_basis]] it suffices to show that points close under every basic entourage are equal.","status":"ok","from":0,"to":2},{"text":"Fix x and y. The separation condition of [[AffineConstructive.topology.uniform.induced.InducedUniformBasis]] says that x = y is exactly closeness under every relation of the family, which is the hypothesis.","status":"ok","from":3,"to":5}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Preorders, posets and their decorations, order maps, lattice orders, filters and ideals","summary":"The file sets up the hierarchy of affine orders. A [[PreOrder]] is a reflexive, transitive relation. A [[WeakPoset]] adds two things: equal elements are comparable, and x ≤ y ⊠ y ≤ x gives x = y, which is pseudo-antisymmetry with the tensor. A [[Poset]] asks for antisymmetry with the additive and. The posets are then decorated as strong, decidable, affirmative, refutative, total or linear, and a three-way comparison ([[IsTrich]]) is a linear order with a correct decision procedure. In a weak poset the order and the strict order respect equality ([[le_fun]], [[lt_fun]]). Order-preserving, order-reflecting and embedding maps get order-reversing variants through the opposite order. The file also defines meet and join semilattice orders and lattice orders, each characterised by greatest lower and least upper bounds, along with their bounded versions. On subsets it gives up-sets and down-sets, directed subsets, filters and ideals, and the presentations and bases that generate them. Each dual notion is the direct one taken in the opposite order, so it reuses the direct one's theory."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Subsets: membership, inclusion, subset operations, relations, images, restrictions, subsets as sets","summary":"This file sets up subsets for the affine set theory. Membership x ∊ U is the function [[element]] from X ⊗ 𝒫 X to Ω, and it respects equality ([[equal_element]]). Inclusion U ⊆ V is ∏ x, x ∊ U ⊸ x ∊ V. The file then defines the basic operations on subsets: the empty and full subsets, singletons, the additive intersection and union, the complement, the multiplicative intersection and union, and the tensor and cartesian pairings of subsets. Relations are subsets of X ⊗ Y, with the diagonal, composition and converse. The file also defines preimage, image, range and the universal image. Next comes the coercion that turns a subset into a set, whose elements are a point together with a proof of its membership, and the injective inclusion [[from_subset]] back into X. The classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]] support the corestriction and restriction of functions to subsets. The file ends with the iterated powerset 𝒫². The order-theoretic laws of these operations are proved in the files under orders/."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Neighbourhood topologies: axioms, interior and closure, separation, continuous, reflecting and dense maps, products","summary":"The interface for topological spaces, given by a neighbourhood relation. A [[Neighborhood]] on a set X is a function x ⪽ U from X ⊗ 𝒫 X to affine propositions, and [[Topology]] states the neighbourhood axioms for it: a neighbourhood contains its point, the relation is upward closed, the full subset is a neighbourhood, binary meets of neighbourhoods are neighbourhoods, and a neighbourhood U is a neighbourhood of the set of points of which U is a neighbourhood. From the relation the file defines [[interior]], [[closure]], open, closed and dense subsets, neighbourhood bases, and the separation axioms [[Separation_T₀]] and [[Hausdorff]]. It sets out the classes of maps used throughout the topology files: [[Continuous]], the reflecting class [[ContinuouslyReflecting]], the two together as [[ContinuouslyInitial]], [[ContinuouslyEmbedding]] and [[Dense]]. It also gives the discrete and indiscrete structures and the two product topologies, the tensor product by a neighbourhood basis and the cartesian product by its universal property. The topological lemmas live in the files under topology/topology, and the uniform and bornological interfaces build on these classes."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, uniformly continuous and reflecting maps, Cauchy filters, completions","summary":"The file sets up the basic notions of uniform spaces. A uniformity on X is a set of entourages, which are subsets of X ⊗ X. Points x and y are U-close when (x, y) ∊ U. A uniform space is a uniformity that is a filter and satisfies three axioms: reflexivity, symmetry, and splitting (each entourage contains some V ⋄ V). Stronger variants are a splitting with the additive conjunction, separation, and regularity. The uniformity induces a neighbourhood relation. The file then defines the following maps: uniformly continuous and uniformly reflecting maps, uniformly initial maps (both at once), and uniform embeddings. It also defines presentations of the tensor and cartesian product uniformities and of the discrete and indiscrete uniformities, the thickening U.[A] with the relation K ◁ S, and Cauchy filters. Finally it states the universal property of a completion: a separated space Y with a uniformly initial dense map ι from X, such that any uniformly initial dense f : X → Z has a uniformly continuous extension Z → Y with composite ι. The Cauchy completion and the bornological files build on these interfaces."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, quantifiers over subsets","summary":"This file sets up the order structure of the powerset 𝒫 X. Under inclusion it is a poset, a bounded lattice with meet and join as ⊓ and ⊔, ⊤ the full subset and ⊥ = ∅, and a distributive lattice. The complement is an involution and a bounded lattice flip morphism, so it is an order-reversing embedding, and the inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruence laws that let `rew` rewrite membership along equalities, inclusions, and the order in up-sets and down-sets; facts about the multiplicative intersection, disjointness and singletons; and the subset of points of U that can be affirmed ([[of_course_subset]]). It ends with lemmas that move quantifiers over the members of a subset to quantifiers over X, together with the congruence lemmas `rew` uses under such quantifiers."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in ordered sets","summary":"The file develops up-sets, down-sets and directed subsets of an ordered set, and the closure operators that produce them. It gives builders for these classes, shows that a least up-set is an up-set and a directed subset is directed as an ordered set, and transports each class along equality of subsets. It proves that the whole set, singletons, tensor pairings, images under order-preserving maps and ranges are directed, and that an up-set of a join semilattice is closed under joins. The upward closure, the points above some member of B, is an idempotent, order-preserving map on 𝒫 P whose fixed points are the up-sets; it turns a down-directed subset into a filter. The point upward closure takes the points above a member of U, read through U's own elements: it is the least up-set over U, the upward closure of of course U, and a filter when U is down-directed. Every result about down-sets, ideals and downward closures comes by duality from the upward version on the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals: principal and presented ones, bases, sublattice properties, preimages","summary":"The file develops filters and ideals on ordered sets, treating each ideal as a filter for the opposite order, so most ideal results are their filter counterparts instantiated at X ᵒᵖ. It shows that a filter on a meet semilattice is closed under meets, and contains ⊤ when there is a top. Conversely, an inhabited meet sub-semilattice is down-directed. It defines principal filters and ideals as the up- and down-closures of a point. The principal filter map is an order-reversing embedding and the principal ideal map an order embedding. It also introduces subsets presented by a family (presented_filter, presented_ideal), shows when such a subset is a filter or ideal, and shows that filter and ideal bases compose and form tensor products. Finally, it shows that preimages under order-preserving maps preserve up- and down-sets, and that preimages under semilattice morphisms preserve filters and ideals."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.topology.uniform.base":{"page":"base.html","short":"Uniform spaces: entourage algebra, thickenings, uniform topology, uniform maps, the reflection pair","summary":"The basic theory of uniform spaces. It equips a uniformity with its algebraic structure (a sublattice and sub-star-semigroup of relations), derives the splitting and symmetry consequences of the axioms and the composition laws for closeness, and develops thickenings U[A] of subsets: monotonicity, composition, singletons, and the swap law for a thickening apart from a set. The uniform topology is built from the entourages, with interior, closure and density described by entourages; separated uniform spaces are shown Hausdorff, and regular ones strong. For maps it characterises uniform continuity and reflection by preimages under f × f, introduces the pullback of entourages [[ufm_preimage]], proves closure under identity, composition and the cancellation laws, and assembles uniform spaces into the reflection pair [[𝐔𝐧𝐢𝐟]] with a morphism to topological spaces. It ends with thickening and closure estimates along dense and uniformly reflecting maps, used by the completion and trapped-completion files."},"AffineConstructive.topology.uniform.basis":{"page":"basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."}},"constants":null}</script>

nition pullback_uniformity@{u} {X:set@{u}} `{Ψ:Uniformity@{u} Y} (f:X ⇾ Y) : Uniformity X\n  := { U : 𝒫 (X ⊗ X) | ∐ W:Ψ, f♯ W ⊆ U }.\n\n\nDefinition entourage_pullback@{u} {X:set@{u}} `{Ψ:Uniformity@{u} Y} (f:X ⇾ Y) := set:(λ V:Ψ, f♯ V).\nLemma entourage_pullback_order_preserving@{u} {X:set@{u}} `{Ψ:Uniformity@{u} Y} {f:X ⇾ Y}\n  : OrderPreserving (entourage_pullback f).\nProof. apply alt_Build_OrderPreserving. intros U V. exact (order_preserving f♯ U V). Qed.\n#[global] Hint Extern 2 (OrderPreserving (entourage_pullback _)) => simple notypeclasses refine entourage_pullback_order_preserving : typeclass_instances.\n\n(*Definition pullback_uniformity@{u} {X:set@{u}} `{Ψ:Uniformity@{u} Y} (f:X ⇾ Y) := presented_uniformity (entourage_pullback f).*)\n\nLemma pullback_uniformity_presented@{u} {X:set@{u}} `{Ψ:Uniformity@{u} Y} {f:X ⇾ Y}\n  : @UniformityPresentation X (pullback_uniformity f) _ (entourage_pullback f).\nProof. now change (pullback_uniformity f) with (presented_uniformity (entourage_pullback f)). Qed.\n#[global] Hint Extern 1 (UniformityPresentation _ (Φ:=pullback_uniformity ?f) _) => simple notypeclasses refine (pullback_uniformity_presented (f:=f)) : typeclass_instances.\n#[global] Hint Extern 1 (FilterPresentation (pullback_uniformity ?f) _) => simple notypeclasses refine (pullback_uniformity_presented (f:=f)) : typeclass_instances.\n#[global] Hint Extern 1 (LeastUpSet (pullback_uniformity ?f)) => simple notypeclasses refine (pullback_uniformity_presented (f:=f)) : typeclass_instances.\n#[global] Hint Extern 1 (UpSet (pullback_uniformity ?f)) => simple notypeclasses refine (pullback_uniformity_presented (f:=f)) : typeclass_instances.\n\nDefinition pullback_uniformity_basis@{u} {X:set@{u}} `{Ψ:Uniformity@{u} Y} (f:X ⇾ Y)\n  {Λ:set@{u}} (β:Λ ⇾ Ψ)\n:= set:(λ i:Λ, filter_presentation_basis_fun (pullback_uniformity f) (entourage_pullback f) (β i)).\n\nLemma pullback_uniformity_basis_correct@{u} {X:set@{u}} `{Ψ:Uniformity@{u} Y} {f:X ⇾ Y}\n  {Λ:set@{u}} {β:Λ ⇾ Ψ} {H:UniformityBasis β}\n  : UniformityBasis (pullback_uniformity_basis f β).\nProof. now change (FilterBasis ( filter_presentation_basis_fun (pullback_uniformity f) (entourage_pullback f) ∘ β )). Qed.\n#[global] Hint Extern 0 (@UniformityBasis ?X (@pullback_uniformity ?X ?Y ?Ψ ?f) ?Λ _) =>\n  let H := constr:(_ : @UniformityBasis Y Ψ Λ _) in\n  simple notypeclasses refine (pullback_uniformity_basis_correct (f:=f) (H:=H)) : typeclass_instances.\n\nSection pullback.\n  Universes u.\n  Context  {X:set@{u}} `{Ψ:Uniformity@{u} Y} {f:X ⇾ Y}.\n\n  Local Abbreviation Φ := (@pullback_uniformity X Y Ψ f).\n  #[local] Hint Extern 0 (Uniformity X) => exact Φ : typeclass_instances.\n\n  Context `{!UniformSpace Y}.\n\n  Local Instance pullback_uniform_space : UniformSpace X.\n  Proof. apply presented_uniform_space; intros V; change (func_op (entourage_pullback f) ?i) with (f♯ i).\n  + rew <-(uniform_refl_alt V : id_rel _ ⊆ subset_pt V).\n    intros [x y]. exact (is_fun f _ _).\n  + now exists V⁻¹.\n  + pose proof uniform_split_alt V as [U PU]. exists U.\n    rew (preimage_compose_rel_lax_alt _ _ _).\n    now rew <-(order_preserving f♯ _ _).\n  Qed.\n\n  Local Instance pullback_map_initial : UniformlyInitial f.\n  Proof. split.\n  + apply (uniformly_continuous_alt _). intros V. now exists V.\n  + apply ufm_refl_by_basis. intros V. now exists V.\n  Qed.\n\n  Local Instance pullback_map_emb `{!Injective f} : UniformlyEmbedding f.\n  Proof. now split. Qed.\n\n  (** Universal Property *)\n  \n  Context `{@UniformSpace@{u} Z Ξ} (g:Z ⇾ X).\n\n  Lemma pullback_uniformity_initial `{!UniformlyContinuous (f ∘ g)} : UniformlyContinuous g.\n  Proof. apply uniformly_continuous_alt. intros U.\n    pose proof uniformity_basis U as [V PV].\n    change (apos (⟨f, f⟩* V ⊆ U)) in PV.\n    apply (up_closed Ξ ((f ∘ g)♯ V)).\n    * now rew <-PV.\n    * now apply uniformly_continuous_alt.\n  Qed.\nEnd pullback.\n#[global] Hint Extern 2 (@UniformSpace _ (pullback_uniformity _)) =>\n  simple notypeclasses refine pullback_uniform_space : typeclass_instances.\n#[global] Hint Extern 2 (@PreUniformSpace _ (pullback_uniformity _)) =>\n  simple notypeclasses refine pullback_uniform_space : typeclass_instances.\n#[global] Hint Extern 2 (@Topology _ (@UniformNeighborhood _ (pullback_uniformity _))) =>\n  simple notypeclasses refine pullback_uniform_space : typeclass_instances.\n\n#[global] Hint Extern 0 (Cleavage 𝐔𝐧𝐢𝐟) => exact @pullback_uniformity : typeclass_instances.\n\nLemma unif_cloven_pair : ClovenPair 𝐔𝐧𝐢𝐟.\nProof. unshelve esplit. intros. exact pullback_map_initial. Qed.\n#[global] Hint Extern 0 (ClovenPair 𝐔𝐧𝐢𝐟) => exact unif_cloven_pair : typeclass_instances.\n#[global] Hint Extern 0 (SaturatedPair 𝐔𝐧𝐢𝐟) => exact unif_cloven_pair : typeclass_instances.\n\nLemma uniformly_initial_alt@{u} `{@UniformSpace@{u} X Φ, @UniformSpace@{u} Y Ψ} (f:X ⇾ Y)\n  : UniformlyInitial f ↔\n    (∀ (Z:set@{u}) (Ξ:Uniformity Z), UniformSpace Z → ∀ (g:Z ⇾ X),\n       UniformlyContinuous (f ∘ g) ↔ UniformlyContinuous g).\nProof. exact (ini_lift_alt (C:=𝐔𝐧𝐢𝐟) f). Qed.\n\nLemma uniformly_initial_alt2@{u} `{@UniformlyContinuous@{u} X Y Φ Ψ f}\n  : UniformlyInitial f ↔\n    (∀ (Z:set@{u}) (Ξ:Uniformity Z), UniformSpace Z → ∀ (g:Z ⇾ X),\n       UniformlyContinuous (f ∘ g) → UniformlyContinuous g).\nProof. exact (ini_lift_alt2 (C:=𝐔𝐧𝐢𝐟) f). Qed.\n\n\n(** Subspaces A ∊ 𝒫 X are the instance f = from_subset A *)\n\n#[global] Hint Extern 2 (Uniformity (subset_to_set ?A)) =>\n  notypeclasses refine (pullback_uniformity (from_subset A)) : typeclass_instances.\n#[global] Hint Extern 4 (UniformSpace (subset_to_set ?A)) =>\n  notypeclasses refine pullback_uniform_space : typeclass_instances.\n\nLemma from_subset_emb `{@UniformSpace X Φ} {A:𝒫 X} : UniformlyEmbedding (from_subset A).\nProof. exact pullback_map_emb. Qed.\n#[global] Hint Extern 2 (UniformlyEmbedding  (from_subset _)) => simple notypeclasses refine from_subset_emb : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyInitial    (from_subset _)) => simple notypeclasses refine from_subset_emb : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyContinuous (from_subset _)) => simple notypeclasses refine from_subset_emb : typeclass_instances.\n#[global] Hint Extern 2 (UniformlyReflecting (from_subset _)) => simple notypeclasses refine from_subset_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyEmbedding  (YN:=UniformNeighborhood) (from_subset _)) => simple notypeclasses refine from_subset_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyInitial    (YN:=UniformNeighborhood) (from_subset _)) => simple notypeclasses refine from_subset_emb : typeclass_instances.\n#[global] Hint Extern 2 (Continuous             (YN:=UniformNeighborhood) (from_subset _)) => simple notypeclasses refine from_subset_emb : typeclass_instances.\n#[global] Hint Extern 2 (ContinuouslyReflecting (YN:=UniformNeighborhood) (from_subset _)) => simple notypeclasses refine from_subset_emb : typeclass_instances.\n\nLemma separated_uniform_subspace `{@SeparatedUniformSpace X Φ} {A:𝒫 X} : SeparatedUniformSpace A.\nProof. exact (uniform_reflects_hausdorff (from_subset A)). Qed.\n#[global] Hint Extern 2 (SeparatedUniformSpace (subset_to_set _)) => simple notypeclasses refine separated_uniform_subspace : typeclass_instances.\n\n\n#[global] Hint Extern 8 (WeakMapsTo ?f ?S ?T) => match goal with H:apos(S ⊆ func_op f* T) |- _ => exact (H:MapsTo f S T) end : typeclass_instances.\n\nLemma dense_open_restrict@{u} {X Y:set@{u}} `{@UniformSpace Y Ψ} (f:X ⇾ Y) `{!Dense f}\n  (S:𝒫 X) (T:𝒫 Y) {HT:open T} {HS₁:S ⊆ f* T} {HS₂:f* T ⊆ S} : Dense (restrict f S T).\nProof. apply uniform_Dense_iff. intros t [U' [U HU]].\n  change (∐ x:S, (t, restrict f S T x) ∊ U'); rew <-HU.\n  destruct t as [y ely]. change (∐ x:S, near U y (f x)). clear U' HU.\n  enough (∐ x:X, x ∊ S ⊠ near U y (f x)) as [x[??]] by now exists (to_subset x).\n  assert (y ∊ interior T) as ely' by now rew (HT:interior T = T).\n  rew uniform_interior_applied2 in ely'; destruct ely' as [V P].\n  pose proof (uniform_dense_range f y (U ⊓ V)) as [x Hx]. exists x. split.\n  + rew <-HS₂. change (f x ∊ T). apply P. now rew <-(meet_lb_r U V).\n  + now rew <-(meet_lb_l U V).\nQed.\n\n\n","sentences":[{"i":0,"s":0,"e":47,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":48,"e":102,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":103,"e":162,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":163,"e":189,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":4,"s":190,"e":241,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":5,"s":242,"e":323,"kind":"vernac","status":"ok","ms":28,"messages":[],"goals":null},{"i":6,"s":324,"e":420,"kind":"vernac","status":"ok","ms":21,"messages":[],"goals":null},{"i":7,"s":421,"e":457,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":458,"e":490,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":9,"s":491,"e":576,"kind":"vernac","status":"ok","ms":19,"messages":[],"goals":null},{"i":10,"s":577,"e":646,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":11,"s":647,"e":683,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":12,"s":684,"e":756,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":13,"s":758,"e":788,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":14,"s":789,"e":821,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":15,"s":822,"e":851,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":16,"s":852,"e":879,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":17,"s":880,"e":907,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":18,"s":908,"e":930,"kind":"vernac","status":"ok","ms":10 b":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4825,"e":4828,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8687,"e":8690,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8822,"e":8825,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8885,"e":8888,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":8889,"e":8892,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":8916,"e":8919,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9058,"e":9061,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9096,"e":9099,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9100,"e":9103,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":9127,"e":9130,"lib":"AffineConstructive.tactics.easy","name":"now","kind":"tacn","local":false,"page":"../../tactics/easy.html"},{"s":9131,"e":9134,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file pulls a uniformity back along a function f : X ⇾ Y: the entourages of X are the relations containing the preimage under f × f of an entourage of Y. This is presented by the preimages of the entourages, a basis of Y pulls back to a basis, and when Y is a uniform space so is X ([[AffineConstructive.topology.uniform.subspace.pullback_uniform_space]]), with f uniformly initial, and a uniform embedding when f is injective. The universal property ([[AffineConstructive.topology.uniform.subspace.pullback_uniformity_initial]]) makes the construction a cleavage of the reflection pair of uniform spaces ([[AffineConstructive.topology.uniform.subspace.unif_cloven_pair]]), which gives the characterisations of uniformly initial maps by lifting ([[AffineConstructive.topology.uniform.subspace.uniformly_initial_alt]], [[AffineConstructive.topology.uniform.subspace.uniformly_initial_alt2]]). Subspaces are the case of the inclusion of a subset: the inclusion is a uniform embedding, a subspace of a separated space is separated, and a dense map restricted over an open subset stays dense ([[AffineConstructive.topology.uniform.subspace.dense_open_restrict]]).","short":"Pulled-back uniformities, uniformly initial maps, and uniform subspaces","items":[{"name":"AffineConstructive.topology.uniform.subspace.pullback_uniformity","base":"pullback_uniformity","kind":"def","start":21,"body":null,"status":"ok","short":{"text":"The uniformity on X pulled back along f : X ⇾ Y: relations containing the preimage of an entourage of Y","status":"ok"},"long":{"text":"Given a uniformity Ψ on Y and a function f : X ⇾ Y, this is the set of relations U on X ⊗ X for which there is an entourage W of Ψ whose preimage under f × f, the relation \"f x is W-close to f x'\", lies in U. It is the traditional initial uniformity induced by f, the coarsest uniformity on X that makes f uniformly continuous. The quantifier is the affine existential, so the definition also says when a relation fails to be an entourage: when it misses the preimage of every entourage of Y.\n\nThe definition is the uniformity presented by the family [[AffineConstructive.topology.uniform.subspace.entourage_pullback]], as [[AffineConstructive.topology.uniform.subspace.pullback_uniformity_presented]] records, and a basis of Ψ pulls back to a basis of it, [[AffineConstructive.topology.uniform.subspace.pullback_uniformity_basis]]. Taking f to be the inclusion [[AffineConstructive.interfaces.subset.from_subset]] of a subset gives the uniformity of a subspace. Later files build on it: the uniformity of the trapped completion, [[AffineConstructive.topology.unif_born.trapped_cauchy.trapped_uniformity]], is pulled back from the Cauchy completion of the localization.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.subspace.entourage_pullback","base":"entourage_pullback","kind":"def","start":22,"body":null,"status":"ok","short":{"text":"The map sending an entourage V of Y to its preimage under f × f, a relation on X","status":"ok"},"long":{"text":"The function of sets from the entourages of Ψ to the relations on X ⊗ X that sends V to its preimage under f × f. That preimage relates x and x' exactly when f x and f x' are V-close. The map is order preserving, a larger entourage pulling back to a larger relation ([[AffineConstructive.topology.uniform.subspace.entourage_pullback_order_preserving]]).\n\nThis family presents [[AffineConstructive.topology.uniform.subspace.pullback_uniformity]]: an entourage of X is a relation containing one of its values ([[AffineConstructive.topology.uniform.subspace.pullback_uniformity_presented]]). Composed with a basis of Ψ and corestricted to the pulled-back uniformity, it gives the basis [[AffineConstructive.topology.uniform.subspace.pullback_uniformity_basis]].","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.subspace.entourage_pullback_order_preserving","base":"entourage_pullback_order_preserving","kind":"prf","start":23,"body":[24,28],"status":"ok","short":{"text":"Pulling entourages back along f preserves inclusion","status":"ok"},"proof":[{"text":"Since both orders are weak posets, it suffices to show that for entourages U and V of Y, U ≤ V implies that the preimage of U under f × f is contained in the preimage of V.","status":"ok","from":0,"to":2},{"text":"That is the case because taking the preimage under f × f preserves inclusion of relations.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.uniform.subspace.pullback_uniformity_presented","base":"pullback_uniformity_presented","kind":"prf","start":30,"body":[31,33],"status":"ok","short":{"text":"The pulled-back uniformity is presented by the preimages of the entourages of Y","status":"ok"},"proof":[{"text":"By definition, the pulled-back uniformity is the uniformity presented by the preimages of the entourages of Y. Once the definition is unfolded, the presentation holds by construction.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.subspace.pullback_uniformity_basis","base":"pullback_uniformity_basis","kind":"def","start":38,"body":null,"status":"ok","short":{"text":"A family of entourages of the pulled-back uniformity: the preimages of a family β of entourages of Y","status":"ok"},"long":{"text":"Given a family β : Λ ⇾ Ψ of entourages of Y, this is the family indexed by the same Λ whose i-th member is the preimage of β i under f × f, regarded as an entourage of [[AffineConstructive.topology.uniform.subspace.pullback_uniformity]]. By [[AffineConstructive.topology.uniform.subspace.pullback_uniformity_basis_correct]], when β is a basis of Ψ this family is a basis of the pulled-back uniformity. So a basis of Y induces a basis of X, and in particular a basis of every subspace of Y.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.subspace.pullback_uniformity_basis_correct","base":"pullback_uniformity_basis_correct","kind":"prf","start":39,"body":[40,42],"status":"ok","short":{"text":"The preimages of a basis of Y form a basis of the pulled-back uniformity","status":"ok"},"proof":[{"text":"The family in question is β followed by pulling back along f, and pulling back is an order-preserving presenting map for the pulled-back uniformity. A filter basis followed by an order-preserving filter basis is again a filter basis ([[AffineConstructive.orders.filters.filter_basis_compose]]), so the preimages of the basis of Y form a basis on X.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.subspace.Φ","base":"Φ","kind":"abbrev","start":47,"body":null,"status":"ok","short":{"text":"Local name for the uniformity on X pulled back along f","status":"ok"},"long":{"text":"Inside the section on pullbacks, Φ abbreviates [[AffineConstructive.topology.uniform.subspace.pullback_uniformity]] f. It is installed as the uniformity of X, so the statements there can speak of X as a uniform space without naming the construction.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.subspace.pullback_uniform_space","base":"pullback_uniform_space","kind":"inst","start":50,"body":[51,64],"status":"ok","short":{"text":"When Y is a uniform space, the pulled-back uniformity makes X a uniform space","status":"ok"},"proof":[{"text":"The uniformity is presented by the preimages of the entourages of Y, and that presentation is monotone and down-directed. By [[AffineConstructive.topology.uniform.basis.presented_uniform_space]], it is then enough to check three things for the preimage of each entourage V: it contains the diagonal, it contains the inverse of some generator, and it contains the composite of some generator with itself.","status":"ok","from":0,"to":1},{"text":"For reflexivity: V contains the diagonal of Y ([[AffineConstructive.topology.uniform.base.uniform_refl_alt]]), so it is enough to show that the diagonal of X lies in the preimage of the diagonal of Y. In other words, x = y should imply f x = f y, which holds because f is a function.","status":"ok","from":2,"to":5},{"text":"For symmetry, take V⁻¹ as the witness. The inverse of the preimage of V⁻¹ is the preimage of V.","status":"ok","from":6,"to":7},{"text":"For splitting, [[AffineConstructive.topology.uniform.base.uniform_split_alt]] gives an entourage U with U ∙ U ≤ V. Take U as the witness.","status":"ok","from":8,"to":10},{"text":"The composite of the two preimages of U lies in the preimage of U ∙ U ([[AffineConstructive.orders.subset_images.preimage_compose_rel_lax_alt]]). Because U ∙ U ≤ V and preimage preserves inclusion, that preimage lies in the preimage of V.","status":"ok","from":11,"to":13}]},{"name":"AffineConstructive.topology.uniform.subspace.pullback_map_initial","base":"pullback_map_initial","kind":"inst","start":65,"body":[66,76],"status":"ok","short":{"text":"f is uniformly initial from the pulled-back uniformity on X","status":"ok"},"proof":[{"text":"Being uniformly initial means being both uniformly continuous and uniformly reflecting. Each property is proved in turn.","status":"ok","from":0,"to":2},{"text":"For continuity, [[AffineConstructive.topology.uniform.base.uniformly_continuous_alt]] reduces the goal to showing that the preimage of every entourage V of Y is an entourage of X. Fix V. Its preimage is an entourage because it contains the preimage of V itself.","status":"ok","from":3,"to":5},{"text":"For reflecting, use the entourages of Y as a basis of themselves and their preimages as the basis on X. By [[AffineConstructive.topology.uniform.basis.ufm_refl_by_basis]], it suffices to find, for each V, an entourage of Y such that closeness of f x and f y under it implies that x and y are close under the preimage of V. Fix V.","status":"ok","from":6,"to":8},{"text":"Take V itself as the witness. Being close under the preimage of V means exactly that f x and f y are V-close, so the implication holds by definition.","status":"ok","from":9,"to":10}]},{"name":"AffineConstructive.topology.uniform.subspace.pullback_map_emb","base":"pullback_map_emb","kind":"inst","start":77,"body":[78,80],"status":"ok","short":{"text":"An injective f is a uniform embedding from the pulled-back uniformity","status":"ok"},"proof":[{"text":"A uniform embedding is an injective, uniformly initial map. f is injective by hypothesis and uniformly initial by [[AffineConstructive.topology.uniform.subspace.pullback_map_initial]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.subspace.pullback_uniformity_initial","base":"pullback_uniformity_initial","kind":"prf","start":82,"body":[83,93],"status":"ok","short":{"text":"If f ∘ g is uniformly continuous, so is g into X with the pulled-back uniformity","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.base.uniformly_continuous_alt]], it suffices to show that the preimage under g × g of every entourage U of X is an entourage of Z. Fix U.","status":"ok","from":0,"to":2},{"text":"The preimages of the entourages of Y form a basis of the pulled-back uniformity, so the basis property ([[AffineConstructive.topology.uniform.basis.uniformity_basis]]) gives an entourage V of Y whose preimage under f × f is contained in U.","status":"ok","from":3,"to":4},{"text":"The entourages of Z are upward closed. It therefore suffices to show that the preimage of V under (f ∘ g) × (f ∘ g) is contained in the preimage of U under g × g, and that it is an entourage of Z.","status":"ok","from":5,"to":5},{"text":"The inclusion follows from the inclusion of the preimage of V in U, pulled back along g × g. Preimage preserves inclusion.","status":"ok","from":6,"to":7},{"text":"Because f ∘ g is uniformly continuous, the preimage of V under it is an entourage of Z ([[AffineConstructive.topology.uniform.base.uniformly_continuous_alt]]).","status":"ok","from":8,"to":10}]},{"name":"AffineConstructive.topology.uniform.subspace.unif_cloven_pair","base":"unif_cloven_pair","kind":"prf","start":99,"body":[100,104],"status":"ok","short":{"text":"Uniform spaces form a cloven reflection pair, with pullback of uniformities as the cleavage","status":"ok"},"proof":[{"text":"A cleavage of the uniform reflection pair assigns to each map u : S ⇾ Z into a uniform space a uniformity on S that makes u initial. The pulled-back uniformity is that choice. What remains is to show that u is uniformly initial for it.","status":"ok","from":0,"to":2},{"text":"This is [[AffineConstructive.topology.uniform.subspace.pullback_map_initial]].","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.uniform.subspace.uniformly_initial_alt","base":"uniformly_initial_alt","kind":"prf","start":107,"body":[108,110],"status":"ok","short":{"text":"f is uniformly initial if and only if, for every g, f ∘ g is uniformly continuous exactly when g is","status":"ok"},"proof":[{"text":"Uniform spaces form a cloven reflection pair ([[AffineConstructive.topology.uniform.subspace.unif_cloven_pair]]). The statement is therefore the general characterisation of initial maps in a cloven pair, [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt]], specialised to [[AffineConstructive.topology.uniform.base.𝐔𝐧𝐢𝐟]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.subspace.uniformly_initial_alt2","base":"uniformly_initial_alt2","kind":"prf","start":111,"body":[112,114],"status":"ok","short":{"text":"A uniformly continuous f is uniformly initial if and only if f ∘ g uniformly continuous implies g is","status":"ok"},"proof":[{"text":"Uniform spaces form a cloven reflection pair ([[AffineConstructive.topology.uniform.subspace.unif_cloven_pair]]), and f is uniformly continuous. The statement is therefore [[AffineConstructive.topology.reflection_pair.base.ini_lift_alt2]] specialised to [[AffineConstructive.topology.uniform.base.𝐔𝐧𝐢𝐟]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.subspace.from_subset_emb","base":"from_subset_emb","kind":"prf","start":117,"body":[118,120],"status":"ok","short":{"text":"The inclusion of a subset, with the subspace uniformity, is a uniform embedding","status":"ok"},"proof":[{"text":"The subspace uniformity on A is the uniformity pulled back along the inclusion, and the inclusion is injective, so [[AffineConstructive.topology.uniform.subspace.pullback_map_emb]] makes it a uniform embedding.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.subspace.separated_uniform_subspace","base":"separated_uniform_subspace","kind":"prf","start":129,"body":[130,132],"status":"ok","short":{"text":"A subspace of a separated uniform space is separated","status":"ok"},"proof":[{"text":"The inclusion of A is a uniform embedding by [[AffineConstructive.topology.uniform.subspace.from_subset_emb]], so it is continuous and injective, and its codomain is Hausdorff because X is a separated uniform space. A uniform space with such a map into a Hausdorff space is separated by [[AffineConstructive.topology.uniform.base.uniform_reflects_hausdorff]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.subspace.dense_open_restrict","base":"dense_open_restrict","kind":"prf","start":135,"body":[136,156],"status":"ok","short":{"text":"For dense f and open T with S = f* T, the restriction S ⇾ T is dense","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.base.uniform_Dense_iff]], a map into the subspace T is dense when every point of T is close, under every entourage of the subspace uniformity, to the image of some point of S.","status":"ok","from":0,"to":1},{"text":"Fix a point t of T and an entourage of the subspace. It contains the preimage of some entourage U of Y, so it suffices to find a point x of S with t and the image of x related by that preimage.","status":"ok","from":2,"to":3},{"text":"Write t as a point y of Y that lies in T. Being related by the preimage of U then means that y and f x are U-close. The entourage of the subspace is no longer needed.","status":"ok","from":4,"to":6},{"text":"It suffices to find x in X with x ∊ S and y U-close to f x, since such an x is a point of S.","status":"ok","from":7,"to":7},{"text":"T is open, so it equals its interior and y lies in the interior of T. By [[AffineConstructive.topology.uniform.base.uniform_interior_applied2]], there is an entourage V such that every point V-close to y lies in T.","status":"ok","from":8,"to":9},{"text":"Because f is dense, [[AffineConstructive.topology.uniform.base.uniform_dense_range]] applied to y and the entourage U ⊓ V gives some x with y and f x (U ⊓ V)-close. Take this x as the witness. Two things remain: membership in S and U-closeness.","status":"ok","from":10,"to":12},{"text":"Since f* T ⊆ S, it is enough that f x ∊ T. By the choice of V, this follows from y and f x being V-close, which holds because U ⊓ V lies below V.","status":"ok","from":13,"to":17},{"text":"U-closeness follows the same way, because U ⊓ V lies below U.","status":"ok","from":18,"to":20}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.topology":{"page":"../interfaces/topology.html","short":"Topological spaces by neighbourhood relations: axioms, continuity classes, separation, products","summary":"This file sets up the interface for topological spaces, in terms of a neighbourhood relation x ⪽ U between points and subsets. A [[Topology]] requires that every neighbourhood contains its point, that neighbourhoods are closed upward and under finite meets, and that a neighbourhood of x is also a neighbourhood of every point near x. From the relation the file defines interior, closure, open, closed and dense subsets, neighbourhood bases, and the T₀ and Hausdorff separation axioms. It defines the classes of maps (continuous, continuously reflecting, initial, embedding, dense), the discrete and indiscrete structures, and the tensor and cartesian product topologies. The theory of these notions is developed in the files under topology/topology."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, axioms, uniform maps, Cauchy filters, completions","summary":"The file sets up the interface of uniform spaces. A uniformity is a set of relations on X ⊗ X, the entourages; the file reads an entourage as closeness ([[near]]), forms thickenings of subsets and the relation \\\"K ◁ S\\\" (S is a uniform neighbourhood of K), and states the axioms in layers: the pre-uniform axioms, uniform spaces as filters of entourages, and the strong, separated and regular variants with their combinations. It derives the neighbourhood relation of the uniform topology ([[UniformNeighborhood]]), names presentations and bases of uniformities, the tensor and cartesian product, discrete and indiscrete uniformities, and defines the classes of maps: uniformly continuous, uniformly reflecting, uniformly initial and uniform embeddings. It closes with Cauchy filters and the universal property of a completion: a separated space receiving X by a dense, uniformly initial map, with a uniformly continuous comparison map from every other such extension of X, which also defines complete uniform spaces. The theory of these notions is developed in the files under topology/uniform and topology/unif_born."},"AffineConstructive.topology.interfaces.reflection_pair":{"page":"../interfaces/reflection_pair.html","short":"Reflection pairs: forward and reflecting classes of maps over sets, and their variants","summary":"This file sets up the abstract framework of reflection pairs. It begins with constructs: concrete categories over sets, given by fibres of candidate structures, a class of objects and a class of morphisms closed under identities and composition. For each set X, the structures on X form a poset whose order is comparison through the identity. On this base it defines the reflecting, initial and embedding classes, with their specifications: an initial map is forward and reflecting, and an embedding is an injective initial map. It then defines reflection pairs with their two cancellation laws, together with saturated pairs, cloven pairs (with a pullback of structures along any map), morphisms of pairs, the opposite pair that exchanges the two classes, and products for the forward class. The theory built on these interfaces is in the reflection_pair files, and the topological, uniform and bornological structures of the development are instances."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.subgroups":{"page":"../../theory/subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"base.html","short":"Uniform spaces: closeness, thickening, induced topology, separation and the uniform reflection pair","summary":"This file develops the basic theory of uniform spaces. The uniformity of a uniform space is a sublattice of relations that is closed under composition and inversion. The file proves the elementary laws of closeness: reflexivity, symmetric splitting into two through six factors, and composition of close pairs. It also proves the laws of thickening, including the swap of a thickening across a complement. Every uniform space carries an induced topology, in which a separated space is Hausdorff and a regular space is strong. Interior, closure and density are described through entourages. The forward, reflecting, initial and embedding classes of maps are closed under composition, pass to their topological counterparts, and make 𝐔𝐧𝐢𝐟 a reflection pair with a morphism to the topological reflection pair 𝐀𝐓𝐨𝐩. The file ends with lemmas on images and preimages of thickenings and on dense maps, which the subspace, completion and bornology files use."},"AffineConstructive.topology.uniform.basis":{"page":"basis.html","short":"Presented uniformities and bases; discrete and indiscrete uniformities; trivial uniformly continuous maps","summary":"This file works with uniformities given by a presentation or a basis. It builds the uniformity presented by a family of relations. It gives conditions on the generators (each contains the diagonal, has an inverse below it and a square below it) under which the result is a pre-uniform space or a uniform space ([[presented_pre_uniform_space]], [[presented_uniform_space]]). Conversely, it shows that a basis of a uniform space is inhabited, down-directed, symmetric and splits. It restates separation, uniform continuity and uniform reflection ([[ufm_cont_by_basis]], [[ufm_refl_by_basis]]), interior, closure and density ([[uniform_basis_interior]], [[uniform_basis_closure]], [[uniform_basis_Dense_iff]]) with quantifiers over a basis instead of over all entourages. The discrete and indiscrete uniformities are defined as presented uniformities: every map out of a discrete space is uniformly continuous, and so is every map into an indiscrete one. Every uniform structure on 𝟏 is indiscrete, and maps out of 𝟎 and constant maps are uniformly continuous."},"AffineConstructive.topology.reflection_pair.base":{"page":"../reflection_pair/base.html","short":"Reflection pairs: duality, fibres and pullback, lifting characterisation of initial maps, pair morphisms","summary":"The file develops the basic theory of reflection pairs: the forward and reflecting classes of maps on a kind of structure over sets, with their cancellation laws. Each kind of pair (reflection, cloven, saturated) is closed under the opposite, which exchanges the two classes, so every theorem about forward maps yields its dual about reflecting maps. For a cloven pair it orders the fibre over each set and shows that a map is forward, reflecting or initial exactly when the structure on its domain lies below, above or equal to the structure pulled back along it; pullback is monotone, functorial, and turns every cloven pair into a saturated one. Initial maps are characterised by the lifting property: precomposing with them detects forward maps, also when the tests are restricted to a full subcategory closed under pullback. Finally, morphisms of reflection pairs are shown to preserve objects, initial maps and embeddings, to induce order preserving maps of fibres commuting with pullback, and to compose, with identities."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.strip_coercions":{"page":"../../tactics/strip_coercions.html","short":"Stripping coercions from a term by proof search over an extensible hint database","summary":"The file is a small extensible tool for removing coercions from a term. The proposition [[StripCoercions]] tm is always provable, and its only role is to carry the term tm into a proof search. That search runs over the hint database `strip_coercions`. Each hint in the database recognises one shape of coercion, changes the goal to the same proposition on the term underneath with [[strip_coercions_chain]], and lets the search continue. A fallback hint ends the search by recording the final term as a local definition. [[strip_coercions_or_self]] and [[strip_coercions]] read that term back from the proof found, and [[exact_strip_coercions]] closes a goal with it. Later files make the tool work for their own coercions by adding hints to the database."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>

 Proof. unfold_ub. rew <-aex_adj; intros U.\n    rew <-(aprod_true_l (thicken_expanding U K) : (K ⊆ U.[K]) ⊠ (U.[K] ⊆ S) ⧟ (U.[K] ⊆ S)).\n    exact (transitivity _ _ _ _).\n  Qed.\n\n  Local Instance unif_below_subrel : Subrelation (@uniformly_below X Φ) le.\n  Proof. intros [K S]. exact (unif_below_le K S). Qed.\n\n  Lemma unif_below_top (K : 𝒫 X) : K ◁ ⊤.\n  Proof. exists top. apply below_top. Qed.\n\n  Lemma unif_below_empty (S : 𝒫 X) : ∅ ◁ S.\n  Proof. unfold_ub. exists top. intros y.\n    change ((∐ x:X, 𝐅 ⊠ (x, y) ∊ (top : Φ)) ⊸ y ∊ S).\n    rew <-aex_adj; intros x. now simplify.\n  Qed.\n\n  Lemma thicken_le (U V : Φ) (A B : 𝒫 X) : powerset_pt U ⊆ powerset_pt V ⊠ A ⊆ B ⊸ U.[A] ⊆ V.[B].\n  Proof. exact (order_preserving thicken _ _). Qed.\n\n  Lemma thicken_le_r (U : Φ) (A B : 𝒫 X) : A ⊆ B ⊸ U.[A] ⊆ U.[B].\n  Proof. rew <-(thicken_le _ _ _ _); now simplify. Qed.\n\n  Lemma unif_below_le_l (K' K S : 𝒫 X) : K' ⊆ K ⊠ K ◁ S ⊸ K' ◁ S.\n  Proof. unfold_ub. rew aex_frob_l, <-aex_adj; intros U. rew <-(aex_ub _ U).\n    rew (thicken_le_r U K' K).\n    exact (transitivity _ _ _ _).\n  Qed.\n\n  Lemma unif_below_le_r (K S S' : 𝒫 X) : K ◁ S ⊠ S ⊆ S' ⊸ K ◁ S'.\n  Proof. unfold_ub. rew aex_frob_r, <-aex_adj; intros U. rew <-(aex_ub _ U).\n    exact (transitivity _ _ _ _).\n  Qed.\n\n  Lemma unif_below_trans : Transitive (@uniformly_below X Φ).\n  Proof. intros K S T. rew (unif_below_le S T). exact (unif_below_le_r _ _ _). Qed.\n  \n  Lemma unif_below_proper_aimpl {K K' S S' : 𝒫 X} : K' ⊆ K → S ⊆ S' → K ◁ S ⊸ K' ◁ S' .\n  Proof. intros EK ES.\n    rew <-(unif_below_le_l K' K S'), (aprod_true_l EK).\n    now rew <-(unif_below_le_r K S S'), (aprod_true_r ES).\n  Qed.\nEnd uniformly_below.\n#[global] Hint Extern 2 (Subrelation (func_op uniformly_below) _) => simple notypeclasses refine unif_below_subrel : typeclass_instances.\n#[global] Hint Extern 2 (Transitive (func_op uniformly_below)) => simple notypeclasses refine unif_below_trans : typeclass_instances.\n#[global] Hint Extern 2 (apos (aimpl (_ ◁ _, _))) => sapply_2 unif_below_proper_aimpl : proper.\n\nSection uniformly_below.\n  Context `{@UniformSpace X Φ}.\n\n  Lemma thicken_join_le (U₁ U₂ : Φ) (K₁ K₂ : 𝒫 X) : (U₁ ⊓ U₂).[K₁ ⊔ K₂] ⊆ U₁.[K₁] ⊔ U₂.[K₂].\n  Proof. intros y.\n    change ((∐ x, (x ∊ K₁ ∨ x ∊ K₂) ⊠ ((x, y) ∊ U₁ ∧ (x, y) ∊ U₂))\n            ⊸ (∐ x, x ∊ K₁ ⊠ (x, y) ∊ U₁) ∨ (∐ x, x ∊ K₂ ⊠ (x, y) ∊ U₂)).\n    rew <-aex_adj; intros x. rew <-(aex_ub _ x).\n    tautological.\n  Qed.\n\n  Lemma unif_below_join (K₁ K₂ S : 𝒫 X) : K₁ ◁ S ⊠ K₂ ◁ S ⊸ K₁ ⊔ K₂ ◁ S.\n  Proof. unfold_ub. rew <-aex_adj2; intros U₁ U₂. rew <-(aex_ub _ (U₁ ⊓ U₂)).\n    rew (thicken_join_le U₁ U₂ K₁ K₂).\n    now rew <-(join_lub _ _ _).\n  Qed.\n\n  Lemma unif_below_meet (K S₁ S₂ : 𝒫 X) : K ◁ S₁ ⊠ K ◁ S₂ ⊸ K ◁ S₁ ⊓ S₂.\n  Proof. unfold_ub. rew <-aex_adj2; intros U₁ U₂. rew <-(aex_ub _ (U₁ ⊓ U₂)).\n    rew <-(meet_glb _ _ _). rew (meet_lb_l _ _) at 1. now rew (meet_lb_r _ _).\n  Qed.\n\n  Lemma unif_below_thicken (U : Φ) (K : 𝒫 X) : K ◁ U.[K].\n  Proof. now exists U. Qed.\n\n  Lemma unif_below_interpolate (K S : 𝒫 X) : K ◁ S ⊸ ∐ U:Φ, U.[K] ◁ S.\n  Proof. change ((∐ V:Φ, V.[K] ⊆ S) ⊸ ∐ U:Φ, ∐ V:Φ, V.[U.[K]] ⊆ S).\n    rew <-aex_adj; intros U.\n    pose proof uniform_split_alt U as [V PV].\n    rew <-(aex_ub _ V), <-(aex_ub _ V).\n    now rew (thicken_compose _ _ _), PV.\n  Qed.\n\n  Lemma unif_below_closure (K S : 𝒫 X) : K ◁ S ⊸ closure K ◁ S.\n  Proof.\n    rew (unif_below_interpolate K S), <-aex_adj; intros U.\n    now rew (closure_sub_thicken U K).\n  Qed.\n\n  Lemma unif_below_int_r (K S : 𝒫 X) : K ◁ S ⊸ K ◁ interior S.\n  Proof. unfold_ub. rew <-aex_adj; intros U.\n    pose proof uniform_split_alt U as [V PV].\n    rew [<-PV | <-(aex_ub _ V)]. rew <-(thicken_compose _ _ _).\n    apply thicken_sub_interior.\n  Qed.\n\n  Lemma singleton_unif_below (x:X) (S : 𝒫 X) {el : x ∊ interior S} : singleton x ◁ S.\n  Proof.\n    rew uniform_interior_applied2 in el; destruct el as [U P].\n    exists U. intros y.\n    change ((∐ x', x = x' ⊠ near U x' y) ⊸ y ∊ S).\n    rew <-aex_adj; intros x'.\n    rew <-(P y : near U x y ⊸ y ∊ S).\n    rew (is_fun set:(λ z, near U z y) x x' : x = x' ⊸ near U x y ⧟ near U x' y).\n    tautological.\n  Qed.\n\n  Lemma unif_below_sub_interior (K S : 𝒫 X) : K ◁ S ⊸ K ⊆ interior S.\n  Proof. rew (unif_below_int_r K S). exact (unif_below_le _ _). Qed.\nEnd uniformly_below.\n\n","sentences":[{"i":0,"s":0,"e":323,"kind":"vernac","status":"ok","ms":25,"messages":["2976e9b8e29b8170","6d9d43051f185782","af331431bd614838","239b2ba114fa4dd8","7ee0ddd10f8b2374"],"goals":null},{"i":1,"s":324,"e":378,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":2,"s":379,"e":438,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":3,"s":439,"e":465,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":4,"s":466,"e":517,"kind":"vernac","status":"ok","ms":15,"messages":[],"goals":null},{"i":5,"s":518,"e":552,"kind":"vernac","status":"ok","ms":21,"messages":[],"goals":null},{"i":6,"s":553,"e":649,"kind":"vernac","status":"ok","ms":21,"messages":[],"goals":null},{"i":7,"s":650,"e":686,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":8,"s":687,"e":789,"kind":"vernac","status":"ok","ms":26,"messages":[],"goals":null},{"i":9,"s":790,"e":845,"kind":"vernac","status":"ok","ms":16,"messages":[],"goals":null},{"i":10,"s":846,"e":902,"kind":"vernac","status":"ok","ms":12,"messages":[],"goals":null},{"i":11,"s":904,"e":936,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":12,"s":937,"e":966,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":13,"s":967,"e":994,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":14,"s":995,"e":1025,"kind":"vernac","status":"ok","ms":11,"messages":[],"goals":null},{"i":15,"s":1027,"e":1051,"kind":"vernac","status":"ok","ms":10,"messages":[],"goals":null},{"i":16,"s":1052,"e":1150,"kind":"vernac","status":"ok","ms":12,"mes 698,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4807,"e":4816,"lib":"AffineConstructive.topology.uniform.uniformly_below","name":"unfold_ub","kind":"ltac","local":true},{"s":4818,"e":4821,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4893,"e":4896,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":4922,"e":4925,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5093,"e":5096,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5231,"e":5234,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5261,"e":5264,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5299,"e":5302,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"},{"s":5380,"e":5392,"lib":"AffineConstructive.logic.aprop","name":"tautological","kind":"ltac","local":false,"page":"../../logic/aprop.html"},{"s":5482,"e":5485,"lib":"AffineConstructive.tactics.rewrite.rewrite","name":"rew","kind":"tacn","local":false,"page":"../../tactics/rewrite/rewrite.html"}],"gloss":{"summary":"The file develops the basic theory of the uniformly-below relation of pointfree topology on the subsets of a uniform space: K ◁ S holds when some thickening U[K] lies in S, that is, when S is a uniform neighbourhood of K ([[AffineConstructive.topology.interfaces.uniform.uniformly_below]]). The relation is contained in inclusion and is transitive. It is monotone, shrinking on the left and growing on the right ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_proper_aimpl]]). The empty subset is uniformly below every subset, and every subset is uniformly below the whole set. The relation is closed under joins on the left and meets on the right, with the two entourages that the two hypotheses provide combined by their meet ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_join]], [[AffineConstructive.topology.uniform.uniformly_below.unif_below_meet]]). It interpolates through a thickening ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_interpolate]]), and it may be strengthened to the closure on the left and to the interior on the right; in particular K ◁ S gives K ⊆ interior S, and every point of the interior has its singleton uniformly below S. Supporting monotonicity lemmas for thickening ([[AffineConstructive.topology.uniform.uniformly_below.thicken_le]], [[AffineConstructive.topology.uniform.uniformly_below.thicken_le_r]], [[AffineConstructive.topology.uniform.uniformly_below.thicken_join_le]]) and hints that register the inclusion, the transitivity and the monotonicity with the rewriting system complete the file.","short":"The uniformly-below relation K ◁ S on subsets of a uniform space","items":[{"name":"AffineConstructive.topology.uniform.uniformly_below.unfold_ub","base":"unfold_ub","kind":"ltac","start":16,"body":null,"status":"ok","short":{"text":"Unfolds K ◁ S in the goal to its definition: there is an entourage U with U[K] ⊆ S","status":"ok"},"long":{"text":"The tactic rewrites, by conversion, every occurrence in the goal of the relation [[AffineConstructive.topology.interfaces.uniform.uniformly_below]] applied to a pair (K, S) into the existential it abbreviates, ∐ U : Φ, U[K] ⊆ S. Nothing is proved and nothing else in the goal changes; the effect is to expose the existential quantifier over entourages so that the quantifier rule, the Frobenius law or a choice of witness can act on it.\n\nThe relation is stored as a function on pairs of subsets, so a plain unfolding would leave the goal in terms of the function's underlying map applied to a pair; this tactic states the intended reading directly. It is local to the file and opens most of the proofs below whose argument goes through a particular entourage.","status":"ok"},"proof":[]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_le","base":"unif_below_le","kind":"prf","start":19,"body":[20,25],"status":"ok","short":{"text":"K ◁ S implies K ⊆ S","status":"ok"},"proof":[{"text":"Unfold the relation: K ◁ S says that some entourage U has U[K] ⊆ S. Let U be the entourage the hypothesis provides; it remains to derive K ⊆ S from U[K] ⊆ S.","status":"ok","from":0,"to":2},{"text":"Every subset lies in its thickening, K ⊆ U[K] ([[AffineConstructive.topology.uniform.base.thicken_expanding]]), so this inclusion may be added to the hypothesis at no cost. The inclusions K ⊆ U[K] and U[K] ⊆ S then give K ⊆ S by transitivity.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_subrel","base":"unif_below_subrel","kind":"inst","start":26,"body":[27,30],"status":"ok","short":{"text":"The relation ◁ on subsets is contained in the inclusion order ⊆","status":"ok"},"proof":[{"text":"For a pair of subsets K, S the containment asks for K ◁ S ⊸ K ⊆ S, which is [[AffineConstructive.topology.uniform.uniformly_below.unif_below_le]].","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_top","base":"unif_below_top","kind":"prf","start":31,"body":[32,35],"status":"ok","short":{"text":"Every subset is uniformly below the whole set: K ◁ ⊤","status":"ok"},"proof":[{"text":"Take the top entourage as the witness; it remains to show that ⊤[K] lies in the whole set, which holds because every subset is below ⊤.","status":"ok","from":0,"to":3}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_empty","base":"unif_below_empty","kind":"prf","start":36,"body":[37,44],"status":"ok","short":{"text":"The empty subset is uniformly below every subset: ∅ ◁ S","status":"ok"},"proof":[{"text":"Unfold the relation and take the top entourage as the witness; it remains to show ⊤[∅] ⊆ S.","status":"ok","from":0,"to":2},{"text":"Fix a point y. Membership of y in the thickening of ∅ says that there is a point x of ∅, which is falsity, that is ⊤-close to y.","status":"ok","from":3,"to":4},{"text":"Let x be such a point. The hypothesis then contains the factor 𝐅, so the tensor is false and it implies y ∊ S.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.thicken_le","base":"thicken_le","kind":"prf","start":45,"body":[46,48],"status":"ok","short":{"text":"Thickening is monotone in both arguments: U ⊆ V and A ⊆ B imply U[A] ⊆ V[B]","status":"ok"},"proof":[{"text":"This is the statement that thickening is order preserving jointly in the entourage and the subset, [[AffineConstructive.topology.uniform.base.thicken_order_preserving]].","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.thicken_le_r","base":"thicken_le_r","kind":"prf","start":49,"body":[50,52],"status":"ok","short":{"text":"Thickening by a fixed entourage is monotone: A ⊆ B implies U[A] ⊆ U[B]","status":"ok"},"proof":[{"text":"Apply [[AffineConstructive.topology.uniform.uniformly_below.thicken_le]] with the same entourage on both sides. Its first factor, U ⊆ U, holds, so what remains is the inclusion A ⊆ B.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_le_l","base":"unif_below_le_l","kind":"prf","start":53,"body":[54,60],"status":"ok","short":{"text":"Shrinking the left side preserves ◁: K' ⊆ K and K ◁ S imply K' ◁ S","status":"ok"},"proof":[{"text":"Unfold the relation and move the existential out of the tensor. Let U be the entourage with U[K] ⊆ S that the hypothesis provides.","status":"ok","from":0,"to":2},{"text":"Take the same U as the witness for K'; it remains to show U[K'] ⊆ S.","status":"ok","from":3,"to":3},{"text":"Thickening by U is monotone ([[AffineConstructive.topology.uniform.uniformly_below.thicken_le_r]]), so K' ⊆ K gives U[K'] ⊆ U[K]. Together with U[K] ⊆ S this gives U[K'] ⊆ S by transitivity, each inclusion used once.","status":"ok","from":4,"to":6}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_le_r","base":"unif_below_le_r","kind":"prf","start":61,"body":[62,67],"status":"ok","short":{"text":"Enlarging the right side preserves ◁: K ◁ S and S ⊆ S' imply K ◁ S'","status":"ok"},"proof":[{"text":"Unfold the relation and move the existential out of the tensor. Let U be the entourage with U[K] ⊆ S that the hypothesis provides.","status":"ok","from":0,"to":2},{"text":"Take the same U as the witness. Then U[K] ⊆ S and S ⊆ S' give U[K] ⊆ S' by transitivity.","status":"ok","from":3,"to":5}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_trans","base":"unif_below_trans","kind":"prf","start":68,"body":[69,73],"status":"ok","short":{"text":"The relation ◁ is transitive","status":"ok"},"proof":[{"text":"Fix subsets K, S, T. It remains to derive K ◁ T from K ◁ S ⊠ S ◁ T.","status":"ok","from":0,"to":1},{"text":"Weaken the second hypothesis S ◁ T to the inclusion S ⊆ T by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_le]]. Then K ◁ S and S ⊆ T give K ◁ T by enlarging the right side, [[AffineConstructive.topology.uniform.uniformly_below.unif_below_le_r]].","status":"ok","from":2,"to":4}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_proper_aimpl","base":"unif_below_proper_aimpl","kind":"prf","start":74,"body":[75,79],"status":"ok","short":{"text":"Given inclusions K' ⊆ K and S ⊆ S', K ◁ S implies K' ◁ S'","status":"ok"},"proof":[{"text":"The two inclusions K' ⊆ K and S ⊆ S' are proved outright, so they may be used freely. It remains to show that K ◁ S implies K' ◁ S'.","status":"ok","from":0,"to":1},{"text":"Shrink the left side by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_le_l]]. Since K' ⊆ K holds, its factor drops out, and it remains to show that K ◁ S implies K ◁ S'.","status":"ok","from":2,"to":2},{"text":"Enlarge the right side by [[AffineConstructive.topology.uniform.uniformly_below.unif_below_le_r]]. The proved inclusion S ⊆ S' drops out in the same way, which closes the goal.","status":"ok","from":3,"to":4}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.thicken_join_le","base":"thicken_join_le","kind":"prf","start":86,"body":[87,93],"status":"ok","short":{"text":"Thickening a join by a meet of entourages: (U₁ ⊓ U₂)[K₁ ⊔ K₂] ⊆ U₁[K₁] ⊔ U₂[K₂]","status":"ok"},"proof":[{"text":"Fix a point y. Membership in the thickening (U₁ ⊓ U₂)[K₁ ⊔ K₂] unfolds: there is an x that lies in K₁ or in K₂ and is close to y under U₁ and under U₂. The goal is that y lies in U₁[K₁] or in U₂[K₂].","status":"ok","from":0,"to":2},{"text":"Take the x the hypothesis provides, and use the same x as the witness in both disjuncts of the goal. What is left is propositional: from x ∊ K₁ ∨ x ∊ K₂, together with the two closeness conditions, conclude x ∊ K₁ ⊠ (x, y) ∊ U₁ or x ∊ K₂ ⊠ (x, y) ∊ U₂.","status":"ok","from":3,"to":4},{"text":"This holds by propositional reasoning. In the case x ∊ K₁ the proof chooses the U₁ conjunct of the additive conjunction, and in the case x ∊ K₂ it chooses the U₂ conjunct. Each case uses only one of the two closeness conditions, which is all the additive conjunction offers.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_join","base":"unif_below_join","kind":"prf","start":94,"body":[95,101],"status":"ok","short":{"text":"K₁ ◁ S and K₂ ◁ S imply K₁ ⊔ K₂ ◁ S","status":"ok"},"proof":[{"text":"Unfold the uniformly-below relation into its defining existentials. Take the entourages the two hypotheses provide: U₁ with U₁[K₁] ⊆ S and U₂ with U₂[K₂] ⊆ S.","status":"ok","from":0,"to":2},{"text":"Take U₁ ⊓ U₂ as the witness. By [[AffineConstructive.topology.uniform.uniformly_below.thicken_join_le]], (U₁ ⊓ U₂)[K₁ ⊔ K₂] lies in U₁[K₁] ⊔ U₂[K₂], so it suffices to show that this join lies in S.","status":"ok","from":3,"to":4},{"text":"A join lies in S when both of its parts do ([[AffineConstructive.interfaces.orders.join_lub]]), and the two inclusions are exactly the two hypotheses, each used once.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_meet","base":"unif_below_meet","kind":"prf","start":102,"body":[103,110],"status":"ok","short":{"text":"K ◁ S₁ and K ◁ S₂ imply K ◁ S₁ ⊓ S₂","status":"ok"},"proof":[{"text":"Unfold the uniformly-below relation. Take the entourages the two hypotheses provide: U₁ with U₁[K] ⊆ S₁ and U₂ with U₂[K] ⊆ S₂.","status":"ok","from":0,"to":2},{"text":"Take U₁ ⊓ U₂ as the witness. A subset lies in the meet S₁ ⊓ S₂ when it lies in both S₁ and S₂, so the goal becomes the tensor of (U₁ ⊓ U₂)[K] ⊆ S₁ and (U₁ ⊓ U₂)[K] ⊆ S₂. Each factor is to be met by its own hypothesis.","status":"ok","from":3,"to":4},{"text":"Thickening is monotone in the entourage ([[AffineConstructive.topology.uniform.base.thicken_order_preserving]]). Enlarging U₁ ⊓ U₂ to U₁ in the first factor and to U₂ in the second turns the goal into the two hypotheses.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_thicken","base":"unif_below_thicken","kind":"prf","start":111,"body":[112,114],"status":"ok","short":{"text":"Every subset is uniformly below each of its thickenings: K ◁ U[K]","status":"ok"},"proof":[{"text":"U itself is the witness, since U[K] ⊆ U[K] holds by reflexivity of inclusion.","status":"ok","from":0,"to":2}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_interpolate","base":"unif_below_interpolate","kind":"prf","start":115,"body":[116,122],"status":"ok","short":{"text":"Interpolation: K ◁ S implies there is an entourage U with U[K] ◁ S","status":"ok"},"proof":[{"text":"Unfolded, the goal asks for entourages U and V with V[U[K]] ⊆ S. Take the entourage U the hypothesis provides, which satisfies U[K] ⊆ S.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.topology.uniform.base.uniform_split_alt]] there is an entourage V with V ∙ V ≤ U. Take V as the witness for both existentials, so it remains to show V[V[K]] ⊆ S from U[K] ⊆ S.","status":"ok","from":3,"to":4},{"text":"By [[AffineConstructive.topology.uniform.base.thicken_compose]], V[V[K]] is (V ∙ V)[K]. That lies in U[K] because V ∙ V ≤ U and thickening is monotone, and U[K] lies in S by the hypothesis.","status":"ok","from":5,"to":6}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_closure","base":"unif_below_closure","kind":"prf","start":123,"body":[124,127],"status":"ok","short":{"text":"K ◁ S implies that the closure of K is uniformly below S","status":"ok"},"proof":[{"text":"By interpolation ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_interpolate]]) there is an entourage U with U[K] ◁ S. Take it.","status":"ok","from":0,"to":1},{"text":"The closure of K lies in U[K] ([[AffineConstructive.topology.uniform.base.closure_sub_thicken]]). The relation shrinks on the left ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_proper_aimpl]]), so U[K] ◁ S gives closure K ◁ S.","status":"ok","from":2,"to":3}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_int_r","base":"unif_below_int_r","kind":"prf","start":128,"body":[129,136],"status":"ok","short":{"text":"K ◁ S implies K is uniformly below the interior of S","status":"ok"},"proof":[{"text":"Unfold the relation and take the entourage U the hypothesis provides, with U[K] ⊆ S.","status":"ok","from":0,"to":2},{"text":"By [[AffineConstructive.topology.uniform.base.uniform_split_alt]] there is an entourage V with V ∙ V ≤ U. Thickening is monotone in the entourage, so the hypothesis weakens to (V ∙ V)[K] ⊆ S. Take V as the witness, so it remains to show V[K] ⊆ interior S.","status":"ok","from":3,"to":4},{"text":"By [[AffineConstructive.topology.uniform.base.thicken_compose]], (V ∙ V)[K] is V[V[K]]. Applying [[AffineConstructive.topology.uniform.base.thicken_sub_interior]] to the subset V[K] then puts V[K] inside the interior of S.","status":"ok","from":5,"to":7}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.singleton_unif_below","base":"singleton_unif_below","kind":"prf","start":137,"body":[138,147],"status":"ok","short":{"text":"A point in the interior of S has its singleton uniformly below S","status":"ok"},"proof":[{"text":"The point x lies in the interior of S, so by [[AffineConstructive.topology.uniform.base.uniform_interior_applied2]] there is an entourage U such that every point U-close to x lies in S.","status":"ok","from":0,"to":1},{"text":"Take U as the witness and fix y in U[{x}]. Being in this thickening means there is a point x' with x = x' and x' U-close to y. Let x' be such a point.","status":"ok","from":2,"to":5},{"text":"Specialising the property of U at y, it suffices to show that x is U-close to y. The predicate z ↦ near U z y respects equality, so x = x' makes near U x y equivalent to near U x' y, and the closeness of x' to y gives the closeness of x to y.","status":"ok","from":6,"to":9}]},{"name":"AffineConstructive.topology.uniform.uniformly_below.unif_below_sub_interior","base":"unif_below_sub_interior","kind":"prf","start":148,"body":[149,152],"status":"ok","short":{"text":"K ◁ S implies K ⊆ interior S","status":"ok"},"proof":[{"text":"By [[AffineConstructive.topology.uniform.uniformly_below.unif_below_int_r]], K ◁ S strengthens to K ◁ interior S.","status":"ok","from":0,"to":1},{"text":"The uniformly-below relation is contained in inclusion ([[AffineConstructive.topology.uniform.uniformly_below.unif_below_le]]), so K ⊆ interior S.","status":"ok","from":2,"to":3}]}],"diagrams":{"svg":{},"err":{}}},"mods":{"AffineConstructive.interfaces.set":{"page":"../../interfaces/set.html","short":"Affine sets, functions between them, products, sums, composition and kinds of maps","summary":"This file defines affine sets. An affine set (`set`) is a type whose equality is an affine equivalence relation: each instance of it is an affine proposition, so equality and apartness come as one relation. A function X ⇾ Y is a map that preserves equality, x₁ = x₂ ⊸ f x₁ = f x₂, and it therefore also reflects apartness. The functions X ⇾ Y form a set, with equality ∏ x, f x = g x, taken pointwise. Two products are defined on the same carrier: the cartesian product X × Y, whose equality is the additive conjunction ∧, and the tensor product X ⊗ Y, whose equality is the tensor ⊠. Composition is a function on the tensor product (Y ⇾ Z) ⊗ (X ⇾ Y). The file also defines the empty and unit sets, the disjoint sum, and the identity function. It defines the classes for strong sets and for decidable, affirmative and refutative equality, and the injective, weakly surjective, surjective and bijective maps. Everything else in the library is built on these definitions, and `theory/set.v` develops their theory."},"AffineConstructive.interfaces.algebra_notation":{"page":"../../interfaces/algebra_notation.html","short":"Classes and notation for algebraic operations; opposite and reinterpreted structures","summary":"The file declares the algebraic operations as classes on affine sets, each with its notation: constants zero, one, top and bottom and a monoid unit; unary inverse and negation; binary semigroup operation, addition, multiplication, meet and join. Every binary operation is a function out of the tensor product X ⊗ X, so that it need only preserve the multiplicative equality; hints let a binary operation that factors through the cartesian product be recognised as strong. It then gives renamings of a set under which one structure is read as another: additive or multiplicative operations, or meets and joins, as a generic semigroup with unit, and the opposite semigroup ([[semigroup_op]]), the opposite ring ([[ring_op]]) and the opposite order ([[Order_op]]), which exchanges meet with join and top with bottom. The algebraic hierarchies of the groups, rings and lattice files build on these classes and use the renamings to obtain each mirrored result from the direct one."},"AffineConstructive.interfaces.sprop":{"page":"../../interfaces/sprop.html","short":"The base-logic connectives on SProp, strict equality, and the classes of strict relations","summary":"This file defines the base-logic connectives on SProp from scratch, since the library uses no standard library: truth and falsity, negation, and, or, implication, if and only if, and the existential quantifier, together with their notations. It adds the class Inhabited, strict equality (seq, a predicate on pairs), and the operations on predicates scomplement and sflip. On binary relations, taken as predicates on pairs (srelation), it defines the classes of subrelation, reflexivity, irreflexivity, symmetry, transitivity and antisymmetry, and their bundles as equivalence and partial equivalence relations, an equivalence being a partial equivalence by coercion. Everything affine in the development is built on these connectives, and logic/srelations.v proves the elementary facts about the relation classes."},"AffineConstructive.logic.aprop":{"page":"../../logic/aprop.html","short":"Laws of the affine connectives: duals, tautologies, congruences, and decidable, affirmative, refutative propositions","summary":"The algebra of affine propositions on which the rest of the development rewrites. The file registers De Morgan duals for every connective and quantifier, so that the negation of a statement is found in normal form, and it states contraposition in that form. It proves the laws of the connectives as equivalences: associativity, commutativity, units, absorption and distribution for ∧, ∨, ⊠ and ⊞; currying (P ⊠ Q ⊸ R) ⧟ (P ⊸ Q ⊸ R); the quantifier rules, instantiation and the Frobenius laws; and the relations between !P, ?P, P ⊠ P and P ⊞ P. It makes ⊸ a preorder and ⧟ an equivalence, and registers the congruence lemmas that let the rewriting tactics work under every connective. Finally it shows that the classes Decidable, Affirmative and Refutative are closed under the connectives, and that tensor and additive and, and par and additive or, coincide when one side is decidable."},"AffineConstructive.logic.relations":{"page":"../../logic/relations.html","short":"General laws of affine relations: strong and pseudo variants, converse, complement, congruence","summary":"This file collects the general facts about Ω-valued relations that the rest of the development relies on. It relates the strong and weak variants of the order-theoretic properties: [[StronglyTransitive_Transitive]], [[Antisymmetric_PseudoAntisymmetric]] and [[Total_PseudoTotal]] weaken the additive forms to the multiplicative ones, and [[dec_trans_strong]], [[dec_pseudo_antisym]] and [[dec_pseudo_total]] recover the additive forms for decidable relations. It shows that these properties pass to the converse (`flip`) and, where they apply, to the complement, and it proves the congruence lemmas [[Transitive_rel_proper_aimpl]] and [[PER_rel_proper_aiff]] that let rewriting move along a transitive relation or a partial equivalence. Finally it compares affine relations with relations in the base logic: a strict relation affirmed pointwise by of course inherits reflexivity, symmetry, transitivity and equivalence, and the converse also holds. The file also gives the trivial equivalence [[trivial_Equivalence]] and the affirmed strict equality [[leq_equiv]]."},"AffineConstructive.interfaces.common_props":{"page":"../../interfaces/common_props.html","short":"Standard algebraic laws as affine propositions, classes, accessors and morphisms","summary":"This file states the standard algebraic laws (associativity, commutativity, idempotence, involutivity, absorption, distributivity, identities, absorbing elements, inverses, and distribution of a unary map over a binary one, straight or order-reversing) for functions of sets. Each law is first an affine proposition, written as a morphism of the operations involved, with of course on every operation or element that occurs more than once; its affirmation is then a base-logic class, such as [[Associative]] or [[LeftIdentity]], for resolution to find. Accessors such as [[associativity]] and [[left_identity]] give the equations for rewriting, and canonical structures such as [[Associative_fun]] make each class a morphism of its operations, so the operations can be rewritten inside a hypothesis of the law. The algebraic hierarchies and the theory of groups, rings and lattices state their axioms with these classes."},"AffineConstructive.theory.common_props":{"page":"../../theory/common_props.html","short":"Derived laws of binary operations: commuting sides, absorption and apartness, cancellation, opposite operations","summary":"This file proves generic lemmas about binary operations on affine sets. With commutativity it gets the right-hand laws (identity, absorbing element, inverse, distributivity) from the left-hand ones, and right cancellation from left cancellation. It shows that an involution is bijective, with itself as its inverse. For an element z that absorbs on both sides it proves that f(x, y) ≠ z implies x ≠ z ∧ y ≠ z. When the equality of the set is refutative this strengthens to x ≠ z ⊠ y ≠ z. It also states left and right cancellation as affine equivalences, for any operation whose partial applications are injective. Finally it moves associativity, commutativity, identities, absorbing elements, inverses and distributive laws over to the opposite operation f ∘ [[tensor_swap]], so that resolution finds them there."},"AffineConstructive.interfaces.set_lambda":{"page":"../../interfaces/set_lambda.html","short":"Wires λₛ and set:( … ) notation to the set-internalization tactic","summary":"This file connects the λₛ notation for functions of sets to the set-internalization tactic. It introduces the notation set:( e ), which elaborates an expression by running the internalization procedure on it, so that a term is turned into a set or a function of sets together with its proof of equality preservation. A global hint registers the internalization solver as the default way to discharge the derivation goals that λₛ x, … leaves. Writing λₛ x, … therefore builds the function and proves it preserves equality without further input. The file defines no constants; the notation's syntax lives in interfaces/set_lambda/notation.v and the procedure in tactics/set_internalize.v."},"AffineConstructive.interfaces.orders":{"page":"../../interfaces/orders.html","short":"Order structures: posets and their variants, order maps, semilattices, directed sets, filters and ideals","summary":"The file sets out the order structures of the development. It goes from preorders through weak posets, where pseudo-antisymmetry links ≤ to equality, to posets with full antisymmetry. Their variants are strong, decidable, affirmative, refutative, total and linear orders, plus a three-way comparison. The order-theoretic maps are order-preserving maps, order-reflecting maps and order embeddings, each with an order-reversing version defined at the opposite order. Then come directed sets, meet and join semilattice orders, lattice orders and their bounded forms, up-sets and down-sets, directed subsets, and filters and ideals with their presentations by a family. Each downward or join notion is the upward or meet notion at the opposite order. The theorems about these notions are proved in the files under orders/."},"AffineConstructive.interfaces.subset":{"page":"../../interfaces/subset.html","short":"Membership, inclusion, subset operations, images, restrictions, and subsets as sets","summary":"This file sets up subsets for affine sets. It defines membership x ∊ U, inclusion U ⊆ V, and the basic subsets and operations on them: the empty and full subsets, singletons, the additive and multiplicative intersections and unions, complements, the tensor and cartesian products of subsets, relations with their identity, composite and inverse, and the image, preimage, range and universal image of a function. A coercion turns a subset into a set whose elements are points of X together with a proof of membership. The inclusion [[from_subset]] is injective, and functions can be corestricted and restricted to subsets through the classes [[MapsInto]], [[MapsTo]] and [[WeakMapsTo]]. The file closes with sets of subsets 𝒫² X, which are made into sets in the same way."},"AffineConstructive.topology.interfaces.uniform":{"page":"../interfaces/uniform.html","short":"Uniform spaces: entourages, axioms, uniform maps, Cauchy filters, completions","summary":"The file sets up the interface of uniform spaces. A uniformity is a set of relations on X ⊗ X, the entourages; the file reads an entourage as closeness ([[near]]), forms thickenings of subsets and the relation \\\"K ◁ S\\\" (S is a uniform neighbourhood of K), and states the axioms in layers: the pre-uniform axioms, uniform spaces as filters of entourages, and the strong, separated and regular variants with their combinations. It derives the neighbourhood relation of the uniform topology ([[UniformNeighborhood]]), names presentations and bases of uniformities, the tensor and cartesian product, discrete and indiscrete uniformities, and defines the classes of maps: uniformly continuous, uniformly reflecting, uniformly initial and uniform embeddings. It closes with Cauchy filters and the universal property of a completion: a separated space receiving X by a dense, uniformly initial map, with a uniformly continuous comparison map from every other such extension of X, which also defines complete uniform spaces. The theory of these notions is developed in the files under topology/uniform and topology/unif_born."},"AffineConstructive.theory.set":{"page":"../../theory/set.html","short":"Affine sets: Ω and SProp as sets, the ! comonad, product structure maps, currying, bijections","summary":"This file develops the basic theory of affine sets and their functions. Ω becomes a set with ⧟ as its equality, and SProp a set with ↔ as its equality. Every connective and quantifier, and the equality of a set, is shown to be a function, so the rewriting system can work under them. The comonad ! is introduced: !X keeps only the affirmative part of equality. With it come its counit, its action on functions, its isomorphism with the tensor product, and constructors that turn maps preserving equality only in the base logic into functions between affirmed sets. The structural maps of the products follow: the projections, the comparison ⊗ ⇾ ×, swaps, associators, unitors, the medial map, diagonals, the universal property of × ([[to_prod]]), currying and uncurrying, evaluation, partial application, and the functorial actions [[prod_map]] and [[prod_map2]]. The file also proves the closure laws of injections, surjections and bijections under composition, factorisation and inversion, which the algebraic and topological files then use."},"AffineConstructive.orders.orders":{"page":"../../orders/orders.html","short":"Strict and non-strict orders, opposites, products, trichotomy, and posets induced from preorders","summary":"This file develops the general theory of ordered affine sets on top of the interfaces in `interfaces/orders.v`. The strict order x < y is the negation of y ≤ x, so each property of ≤ comes with a dual property of <. The main results are [[le_antisym_iff]], [[ne_iff_lt]], [[le_lt_par_eq]] (x ≤ y implies x < y ⊞ x = y), [[le_prod_ne_lt]], and the mixed transitivity laws [[le_lt_trans]] and [[lt_le_trans]]. Every order structure passes to the opposite order, which is how the dual lemmas are proved. For linear orders the file gives [[lt_le]], [[lt_trans]] and, when the order is refutative, [[le_iff_lt_par_eq]]. It also shows how order properties imply properties of equality: a strong poset is a strong set, a decidable order has decidable equality, and a correct trichotomy makes an order decidable and total. Finally it builds several orders and posets: [[induced_poset]], the poset reflection of a preorder, used to make Ω a poset; the componentwise orders on the tensor X ⊗ Y and the cartesian product X × Y; orders on !X and on the terminal set 𝟏."},"AffineConstructive.orders.maps":{"page":"../../orders/maps.html","short":"Order-preserving, order-reflecting and order-embedding maps: strict variants, composition, opposites, and their automation","summary":"This file develops the maps between ordered sets declared in the order interfaces: order-preserving, order-reflecting and order-embedding maps, with their order-reversing (flip) counterparts. It gives constructors that take the defining implication pointwise ([[alt_Build_OrderPreserving]] and its siblings). It also derives the strict-order laws by contraposition: since an affine implication carries its contrapositive, a map that reflects ≤ preserves <, and a map that preserves ≤ reflects < ([[strictly_order_preserving]], [[strictly_order_reflecting]]). The main results are that an order-reflecting map between posets is injective ([[order_reflecting_injective]]), that into a linear refutative order every order-reflecting map is an embedding ([[linear_order_reflecting_embedding]]), and that an order-preserving involution is an embedding ([[involutive_order_embedding]]). The file also covers closure under composition for every combination of direct and reversed maps, the tensor map ⟨f₁, f₂⟩, partial application and the opposite order. It ends with the search tactics that build these instances for composite maps, so that the rewriting system can move an inequality through a monotone function."},"AffineConstructive.orders.subset":{"page":"../../orders/subset.html","short":"The powerset as a bounded distributive lattice; complement, singletons, rewriting inside membership","summary":"This file sets up the order and lattice structure on the powerset 𝒫 X. Under inclusion, 𝒫 X is a poset and a bounded distributive lattice: meet and join are intersection and union, the top is the full subset and the bottom is ∅. Complementation is an involution, and an order-reversing embedding that exchanges meets with joins and ⊤ with ⊥. The inclusion of a set of subsets into 𝒫 X is an order embedding. The file also gives the congruences that let rewriting act inside a membership: by an equality of points, and by an inequality of points when the subset is an up-set or a down-set. The remaining results cover several topics. The multiplicative intersection is commutative, and saying that no point is in both U ⊠ V is the same as U ⊆ Vᗮ. A singleton {x} is contained in U exactly when x ∊ U, and the singleton of a pair is the tensor of the singletons. The of-course subset of U is the range of U's inclusion into X, and the map U ↦ of-course subset of U preserves the order. Finally, there are congruence lemmas for affine and base-logic quantifiers over a subset regarded as a set, which the rewriting system uses when the bound subset changes."},"AffineConstructive.orders.closure":{"page":"../../orders/closure.html","short":"Up-sets, down-sets, directed subsets, and upward and downward closures in weak posets","summary":"The file gives constructors for up-sets, down-sets, least up- and down-sets and directed subsets, and connects them: a least up-set is an up-set, and a directed subset is a directed ordered set. Each notion is transported to the opposite order, made invariant under equality of subsets, and shown to hold for the top subset, singletons, tensor pairings, images and ranges under order-preserving maps. It defines the upward and downward closures as monotone, idempotent operators on 𝒫 P whose fixed points are the up-sets and down-sets, and the closure of a directed subset is a filter or an ideal. It also defines the point upward and downward closures, the points above or below some member of U. This is the least up-set or down-set containing U, and it is a filter or an ideal when U is directed. Most dual results come from the direct ones by instantiating them at the opposite order."},"AffineConstructive.orders.filters":{"page":"../../orders/filters.html","short":"Filters and ideals on ordered sets: principal, presented, bases, preimages","summary":"The file develops filters and ideals on ordered sets, each ideal statement being the filter statement at the opposite order. In a meet semilattice a filter is closed under meets, and in a lattice it is a sublattice; in a bounded meet semilattice it contains ⊤. Conversely, an inhabited meet sub-semilattice is down-directed. It defines the principal filter and principal ideal of a point, shows that they are the least up-set and least down-set containing that point, and shows that the principal ideal map is an order embedding and the principal filter map an order-reversing one. It also covers filters and ideals presented by a family of generators, filter and ideal bases and how they behave under composition and tensor pairing, and preimages: an order-preserving map pulls back up-sets and down-sets, and a meet or join semilattice morphism pulls back filters or ideals whose preimage is inhabited."},"AffineConstructive.orders.subset_images":{"page":"../../orders/subset_images.html","short":"Image, preimage and universal image of subsets: adjunctions, lattice laws, relations","summary":"The file develops the calculus of the three subset operations a map f : X ⇾ Y induces: the image f⁎, the preimage f*, and the universal image ∀.[f]. These form the adjunctions f⁎ ⊣ f* ⊣ ∀.[f] ([[image_preimage_adj]], [[preimage_universal_image_adj]]). The universal image is the complement-conjugate of the image, so its laws follow from the image's by duality. From the adjunctions come the lattice-morphism properties: the preimage preserves all bounded-lattice structure, the image preserves joins and ∅, and the universal image preserves meets and ⊤. The Frobenius laws hold only as inclusions, because the additive connectives give no uniform choice of disjunct across a fibre. Further results cover functoriality, injective, surjective and bijective maps, and the interaction of images of pairs of maps ⟨f, g⟩ with the tensor, converse and composition of relations. The exact two-sided conjugation law [[image_compose_middle]] is among them. Files on relations and uniform structures build on these results."},"AffineConstructive.theory.lattices":{"page":"../../theory/lattices.html","short":"Lattices: Ω as a lattice, alternative constructors, duality, lattice morphisms and flip morphisms","summary":"The file specialises the generic semigroup and monoid theory to the lattice operations ⊓ and ⊔. It shows that Ω, with 𝐓, 𝐅, ∧ and ∨, is a bounded distributive lattice and that negation exchanges meets and joins. It gives alternative constructors for semilattices, bounded lattices and distributive lattices; [[alt_Build_DistributiveLattice]] shows that, given absorption, one distributive law implies the other. It proves the identity [[distribute_alt]] and transfers each lattice structure on L to the opposite L ᵒᵖ, with meet and join exchanged. It then develops lattice morphisms and their flip variants, which exchange meet and join: identities, composites (including mixed composites of straight and flip maps), inverses and constructors. It ends with the projected structures carried by injective maps and with the hints that let the quote framework handle ⊓ and ⊔."},"AffineConstructive.theory.subgroups":{"page":"../../theory/subgroups.html","short":"Subsemigroups, submonoids and subgroups: induced structure, inclusions, images and preimages","summary":"The file develops substructures of semigroups, monoids, star semigroups, star monoids and groups, with closure under the operation stated multiplicatively: x ∊ Y ⊠ y ∊ Y implies x ∙ y ∊ Y. It gives builders that take only the closure conditions ([[alt_Build_SubGroup]] and its siblings), shows that the full subset is a (normal) subgroup and that each substructure predicate respects equality of subsets, and equips a subset carrying such a structure with the induced operation, unit and inverse ([[sub_semigroup_op]], [[sub_monoid_unit]], [[sub_star_semigroup_inv]]). Under these operations the subset is again a structure of the same kind ([[sub_monoid_monoid]], [[sub_group_group]], [[sub_group_abgroup]]), and the inclusion [[from_subset]] is a morphism. Every subgroup of an abelian group is normal ([[sub_abgroup_normal]]). The last part proves that images and preimages of substructures under morphisms are substructures ([[image_sub_grp]], [[preimage_sub_grp]]), and that images keep commutativity, as do preimages under an injective morphism. A construction of quotient groups by normal subgroups is sketched at the end of the file but commented out, so nothing from it is compiled."},"AffineConstructive.orders.lattices":{"page":"../../orders/lattices.html","short":"Lattices as orders: bounds, the algebraic laws, order recovery and morphisms","summary":"This file connects the order-theoretic and algebraic views of semilattices and lattices on affine sets. A join or meet semilattice order is defined by the bound properties of ⊔ or ⊓. Any binary operation with those properties is automatically a function, since it respects equality ([[join_from_op]], [[meet_from_op]]). The order-theoretic structures yield the algebraic ones ([[join_sl_order_join_sl]], [[lattice_order_lattice]]). The file also proves the basic laws: [[join_l_iff]] and [[meet_l_iff]] say that y ≤ x holds exactly when x ⊔ y = x, and x ≤ y exactly when x ⊓ y = x; ⊔ and ⊓ are order preserving; and [[below_bottom]] and [[above_top]] cover the bounded case. In the other direction, a strong algebraic semilattice or lattice with a compatible order gives a strong poset and the corresponding order structure ([[from_meet_sl_meet_order]], [[from_lattice_meet_order]]). Last come the results on lattices and maps: a linear, refutative lattice order is distributive ([[lattice_order_distr]]); semilattice morphisms preserve the order, and are order embeddings when injective; and an order-preserving map out of a linear order with refutative equality, into a refutative order, preserves joins and meets."},"AffineConstructive.theory.sublattices":{"page":"../../theory/sublattices.html","short":"Sub-semilattices and sublattices: constructors, induced structure, inclusions, images and preimages","summary":"The file develops sublattices: subsets of a semilattice or lattice closed under its operations. Meet and join sub-semilattices, and their bounded versions, are subsemigroups and submonoids, so their constructors, the full subset, the induced operations, the semilattice structure on the subset viewed as a set, the morphism property of the inclusion, and closure under images and preimages are all taken from the corresponding results for subsemigroups and submonoids. For sublattices proper the file proves the same results directly: a sublattice is a lattice and the sublattice of a distributive lattice is distributive, the inclusion is a lattice morphism, and images and preimages under lattice morphisms are sublattices. Its last result is that the image of a distributive sublattice under a lattice morphism is again distributive."},"AffineConstructive.orders.sublattices":{"page":"../../orders/sublattices.html","short":"Order, lattice and distributivity structure inherited by subsemigroups and sublattices","summary":"The file shows that order-theoretic structure passes to subsets closed under the relevant operations. A subset closed under meets, joins, or both is a meet semilattice order, a join semilattice order, or a lattice order with the restricted structure ([[sub_meet_sl_order]], [[sub_join_sl_order]], [[sub_lattice_order]]). For a subsemigroup closed under joins, the following hold in the subset whenever they hold in the ambient set: the operation is monotone, left and right multiplication preserve joins, and the operation distributes over joins. The same holds for the involution on a star subsemigroup: if it preserves or reflects the order, or preserves meets, joins, ⊤ or ⊥, then so does its restriction. Every proof applies the ambient law to the underlying points, and each result is registered as a hint, so instance resolution finds this structure on subsets automatically. The file is the order counterpart of the algebraic substructure results in `theory/subgroups.v` and `theory/sublattices.v`."},"AffineConstructive.topology.topology":{"page":"../topology.html","short":"Gathers the basic theory of topological spaces into a single import","summary":"This file collects the topology layer under one import: it defines nothing itself and re-exports the files on neighbourhood relations and the topology axioms, bases of neighbourhoods, interior and closure, continuous and reflecting maps, and products of topological spaces. A file that works with topological spaces imports it so the whole basic theory is in scope at once. The uniform and bornological spaces, completions and localization are built on top of it in the other files of `topology/`."},"AffineConstructive.topology.uniform.base":{"page":"base.html","short":"Uniform spaces: closeness, thickening, induced topology, separation and the uniform reflection pair","summary":"This file develops the basic theory of uniform spaces. The uniformity of a uniform space is a sublattice of relations that is closed under composition and inversion. The file proves the elementary laws of closeness: reflexivity, symmetric splitting into two through six factors, and composition of close pairs. It also proves the laws of thickening, including the swap of a thickening across a complement. Every uniform space carries an induced topology, in which a separated space is Hausdorff and a regular space is strong. Interior, closure and density are described through entourages. The forward, reflecting, initial and embedding classes of maps are closed under composition, pass to their topological counterparts, and make 𝐔𝐧𝐢𝐟 a reflection pair with a morphism to the topological reflection pair 𝐀𝐓𝐨𝐩. The file ends with lemmas on images and preimages of thickenings and on dense maps, which the subspace, completion and bornology files use."},"AffineConstructive.tactics.easy":{"page":"../../tactics/easy.html","short":"Reflexivity, symmetry, transitivity tactics for strict and affine relations; the finishing tactics easy and now","summary":"This file provides the small tactics for equivalence and order relations used throughout the development. Each one works both on strict relations in `SProp` and on affine relations, whose goals appear as the proof component of an affine proposition. [[refl]], [[sym]] and `trans` apply reflexivity, symmetry and transitivity at whichever of the two levels the goal is stated. The strict form comes from the `SProp` laws such as [[sreflexivity]] and [[stransitivity]], and the affine form from the implications of `interfaces/aprop.v`. `antisym` reduces an equality to two comparisons, or a strict equivalence to its two implications. The helpers `fold_complement`, `fold_impl` and `unfold_sflip` restate a negation, an implication or a converse relation as an instance of a relation, so the relation laws can apply. On top of these, `easy` closes trivial goals and `now` runs a tactic and finishes with `easy`."},"AffineConstructive.tactics.rewrite.rewrite":{"page":"../../tactics/rewrite/rewrite.html","short":"The rewriting tactic rew: rewriting by affine and strict relations in goals and hypotheses","summary":"This file defines `rew`, the rewriting tactic the whole development uses in place of natural deduction. A rewrite lemma may be an affine implication or equivalence, an equality of a set, or a relation of the base logic. The tactic marks each occurrence of the lemma's side in the goal or a hypothesis with a tag from [[arewrite]] or [[srewrite]]. It then builds the statement as it will be after rewriting, and proves that the old and new statements are related, using the congruence laws collected in [[proper]]. One call can rewrite with up to four lemmas at once, each claiming only the occurrences the earlier ones left, or with several lemmas in sequence. It can also select occurrences by number, rewrite inside a hypothesis, and repeat a rewrite. In the goal the rewritten statement must imply the original; in a hypothesis the original must imply the rewritten one."},"AffineConstructive.tactics.rewrite.replc":{"page":"../../tactics/rewrite/replc.html","short":"replc: replacing a subterm by an equal one, through the rewriting system","summary":"The file defines `replc`, the development's version of Rocq's replace. It swaps a subterm of the goal for another after proving the two equal, or related by some given relation, and does the rewriting with `rew`. Its variants take a tactic that proves the equation on the spot, replace two subterms at once, or use a relation other than the set's equality. Proofs throughout the library use it to restate a goal before the next step of rewriting."},"AffineConstructive.tactics.simplify.simplify":{"page":"../../tactics/simplify/simplify.html","short":"One import for the simplification tactic: its base machinery and its affine-logic rules","summary":"This file defines nothing of its own. It re-exports `simplify.base` and `simplify.aprop`, so one import brings in the whole simplification tactic. `simplify.base` contains the general machinery, and `simplify.aprop` adds the simplification rules for the affine connectives. Files that restate goals with `simplify` load the tactic through this module."},"AffineConstructive.tactics.misc":{"page":"../../tactics/misc.html","short":"General Ltac utilities: goal unification, typeclass-aware application, progress checks, computing under binders","summary":"This file gathers general-purpose Ltac utilities used by the rest of the tactic layer. `echange` is `change` with unification against the goal. `get_instance` returns a typeclass instance found by resolution as a term. The `sapply_1`, `sapply_2` and `sapply_3` tactics apply a lemma after resolving its typeclass arguments, leaving one, two or three goals. `normalize_proof` builds a proof and reduces it before using it, `learn` adds a fact to the context unless it is already there, and [[real_progress]] is a version of `progress` that changes in universe variables cannot fool. The family [[eval_under_binder]], [[eval_under_let]], [[eval_under_binder2]] and [[eval_under_binder_pair]] lets a term-computing tactic work under a λ or a `let` and puts the original binder name back on the result. The rewriting system and the decision procedures in `tactics/` rely on these utilities."}},"constants":null}</script>
